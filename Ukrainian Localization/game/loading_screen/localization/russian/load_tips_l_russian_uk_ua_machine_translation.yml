l_russian:
  LOADING_TIP_0: " #T «Якщо слова одного ченця суперечать усьому тисячолітньому християнському вченню, значить цей чернець помиляється.»#! \n #tooltip_subheading — Карл V, імператор Священної Римської імперії, Вормський райхстаґ, 1521#!"
  LOADING_TIP_1: " #T «Війни починаються з вашої волі, але не припиняються за вашим бажанням.»#! \n #tooltip_subheading — Нікколо Макіавеллі, #italic Історія Флоренції#!, 1521#!"
  LOADING_TIP_2: " #T «Королі — не лише Божі намісники на землі, що сидять на Божому троні, а й самим Богом називаються богами.»#! \n #tooltip_subheading — Джеймс VI, король Шотландії, Англії, Франції та Ірландії, 1609#!"
  LOADING_TIP_3: " #T «Як згинемо, й цієї стане втрати для Англії. А вижити судилось — що менше нас, то більша буде слава.»#! \n #tooltip_subheading — Вільям Шекспір, #italic «Генрі V»#!, 1599#!"
  LOADING_TIP_4: " #T «Продати країну? Чому б тоді не продати й повітря, безкрає море та саму Землю? Хіба Великий Дух не створив їх для всіх своїх дітей?»#! \n #tooltip_subheading — Текумсе, вождь шауні, 1810#!"
  LOADING_TIP_5: " #T «Священна Римська імперія жодним чином ані священна, ані римська, ані імперія.»#! \n #tooltip_subheading — Вольтер, #italic «Досвід про звичаї та дух народів», том 3, глава 70#!, 1773#!"
  LOADING_TIP_6: " #T «Я взяв за правило ніколи не розпочинати несправедливу війну, але й ніколи не завершувати справедливу, окрім як перемогою над моїми ворогами.»#! \n #tooltip_subheading — Карл XII, король Швеції, 1699#!"
  LOADING_TIP_7: " #T «Жодному мистецтву не вчиться один уряд в іншого так швидко, як висмоктуванню грошей з народних кишень.»#! \n #tooltip_subheading — Адам Сміт, шотландський економіст, #italic «Дослідження про природу та причини багатства народів»#!, 1776#!"
  LOADING_TIP_8: " #T «Припустіть бодай на мить, що Ви можете помилятися.»#! \n #tooltip_subheading — Олівер Кромвель, Лорд-протектор Співдружності Англії, Шотландії та Ірландії, 1652#!"
  LOADING_TIP_9: " #T «З жалем вимушений оголосити фатальну правду: Луї має померти, щоб країна могла жити.»#! \n #tooltip_subheading — Максиміліан Робесп'єр, депутат Національного конвенту, 1792#!"
  LOADING_TIP_10: " #T «Господь і Учитель наш Ісус Христос, кажучи: \"Покайтеся…\", заповідав, щоб усе життя віруючих було покаянням.»#! \n #tooltip_subheading — Мартін Лютер, #italic «95 тез»#!, 1517#!"
  LOADING_TIP_11: " #T «Від Вас мені ані допомоги, ані користі. Ніколи не подумав би, що Ви виявитеся таким, моє уявлення про Вас було геть іншим, але зараз бачу — даремно...»#! \n #tooltip_subheading — Реншильд Левенгаупту під час Полтавської битви, 1709#!"
  LOADING_TIP_12: " #T «Йдіть та запаліть світ!»#! \n #tooltip_subheading — Ігнатій Лойола, баскський богослов, бл. 1540#!"
  LOADING_TIP_13: " #T «Коли я вже занурив руки в каламутну воду, і випала мені доля пірата, краще вже бути командиром аніж рядовим матросом.»#! \n #tooltip_subheading — Чорний Барт, валлійський капітан піратів, 1719#!"
  LOADING_TIP_14: " #T «Краще прожити день левом ніж сто років шакалом.»#! \n #tooltip_subheading — Тіпу Султан, «Майсурський тигр», бл. 1780#!"
  LOADING_TIP_15: " #T «Просимо визнати Церкву та її первосвященика Папу володарями всесвіту.»#! \n #tooltip_subheading — Фернандо II, король Арагону та Кастилії, #italic «Послання до таїно та араваків»#!, 1500#!"
  LOADING_TIP_16: " #T «Чи може честь вправити зламану ногу? Ні. А залікувати дошкульну рану? Теж ні. Що ж тоді честь? Повітря.»#! \n #tooltip_subheading — Вільям Шекспір, #italic Генрі IV, частина 1#!, 1597#!"
  LOADING_TIP_17: " #T «Продовжуйте мій праведний шлях — він ще не скінчився.»#! \n #tooltip_subheading — Камегамега I, король Гаваїв, передсмертні слова, 1819#!"
  LOADING_TIP_18: " #T «Коли в раю є іспанці, я радше вирушу до пекла.»#! \n #tooltip_subheading — Атуей, вождь таїно, перед тим як іспанці спалили його на вогнищі, 1512#!"
  LOADING_TIP_19: " #T «Збури нас, Господи, наважитися сміливіше рушити в моря безкраї, де штормить Твоїм велінням, й де загубивши з ока землю ми знайдемо зірки.»#! \n #tooltip_subheading — Сер Френсіс Дрейк, англійський мореплавець, 1577#!"
  LOADING_TIP_20: " #T «Що ж до Папи, то я відкидаю його з усім його лжевченням, як ворога Христа та Антихриста.»#! \n #tooltip_subheading — Томас Кранмер, архієпископ кентерберійський, 1556#!"
  LOADING_TIP_21: " #T «Тут у Флориді, Вірджинії, Новій Англії та Канаді більше землі, ніж здатен обробити весь Християнський світ.»#! \n #tooltip_subheading — Капітан Джон Сміт, англійський колоніст, 1631#!"
  LOADING_TIP_22: " #T «Ми маємо здобути незалежність попри всі перешкоди. Якщо заможні верстви не підтримають нас, ми їх позбудемось; нам вистачить підтримки численнішого та гіднішого класу суспільства: людей без статків.»#! \n #tooltip_subheading — Волф Тон, ірландський революціонер, 1796#!"
  LOADING_TIP_23: " #T «В Америці немає ані короля, ані лордів, ані церкви, затвердженої законом; і тим не менш вона є найквітучішим та найкраще керованим місцем на Землі.»#! \n #tooltip_subheading — Вольф Тон, ірландський революціонер, 1796#!"
  LOADING_TIP_24: " #T «Ми вважаємо за самоочевидні істини, що всіх людей створено рівними; що Творець обдарував їх певними невідбірними правами, до яких належать життя, свобода і прагнення щастя.»#! \n #tooltip_subheading — Декларація незалежності Сполучених Штатів Америки, 1776#!"
  LOADING_TIP_25: " #T «Якщо говорити неупереджено, обидва вислови є вельми правдивими; людина людині є як Бог; і людина людині є справжнім вовком.»#! \n #tooltip_subheading — Томас Гоббс, «Про громадянина», 1651#!"
  LOADING_TIP_26: " #T «Не існує лагіднішої істоти, ніж людина в її первісному стані, природньо далека від глупоти тварин і фатальної просвітленості цивілізації.»#! \n #tooltip_subheading — Жан-Жак Руссо, #italic «Міркування про походження і основи нерівності між людьми»#!, 1754#!"
  LOADING_TIP_27: " #T «Якщо зозуля не кує, скрути їй шию.»#! \n #tooltip_subheading — Ода Нобунаґа, японський даймьо, 1580-ті#!"
  LOADING_TIP_28: " #T «Якщо зозуля не кує, примусь її.»#! \n #tooltip_subheading — Тойотомі Хідейосі, кампаку Японії, 1590-ті#!"
  LOADING_TIP_29: " #T «Якщо зозуля не кує, дочекайся, доки не почне.»#! \n #tooltip_subheading — Токуґава Ієясу, сьоґун Японії, 1600-ті#!"
  LOADING_TIP_30: " #T «Не корони я скидаю й не саджаю на престол, а лиш служу своєму Сіру.»#! \n #tooltip_subheading — Бертран дю Ґеклен, бретонський воєвода, 1369#!"
  LOADING_TIP_31: " #T «Що мені до тієї Швеції? Я бриджуся нею гірше за пекельну безодню...»#! \n #tooltip_subheading — Фрідріх Шиллер, німецький драматург, #italic Смерть Валленштайна#!, 1799#!"
  LOADING_TIP_32: " #T «Місто пало, мені нема заради чого жити.»#! \n #tooltip_subheading — Останні слова візантійського імператора Костянтина XI, 1453#!"
  LOADING_TIP_33: " #T «Кожного француза слід ненавидіти, як самого диявола.»#! \n #tooltip_subheading — Гораціо Нельсон, британський адмірал, 1793#!"
  LOADING_TIP_34: " #T «Я більш не здатний підкорятись: я відчув смак командування та зректись його не в змозі.»#! \n #tooltip_subheading — Наполеон Бонапарт, корсиканський лейтенант артилерії, 1790#!"
  LOADING_TIP_35: " #T «Жоден капітан не може сильно схибити, достатньо просто розташувати свій корабель бортом до ворожого.»#! \n #tooltip_subheading — Гораціо Нельсон, британський адмірал, 1805#!"
  LOADING_TIP_36: " #T «#italic Honi soit qui mal y pense#!. Ганьба тому, хто подумає про це лихе.»#! \n #tooltip_subheading — Едвард III, король Англії та Франції, девіз Ордену Підв'язки, 1348#!"
  LOADING_TIP_37: " #T «Я б віддав сотню життів, коли б вони в мене були, та усі мої володіння, аби не допустити й найменшої шкоди Церкві та служінню Богу. Бо я не маю наміру правити єретиками.»#! \n #tooltip_subheading — Феліпе II, король Іспанії, #italic лист до Папи Пія V#!, 1566#!"
  LOADING_TIP_38: " #T «Ставлення до ворогів, про яке заявляє Ваша Високоповажність, дуже типове для #italicВашої#! великодушності, але рідко трапляється в англійській нації загалом.»#! \n #tooltip_subheading — Блас де Лесо, іспанський адмірал, #italic лист до віцеадмірала Едварда Вернона#!, 1739#!"
  LOADING_TIP_39: " #T «Кожен іспанець має мочитися в бік Англії.»#! \n #tooltip_subheading — Блас де Лесо, іспанський адмірал, під час осади Картахени-де-Індіас, 1741#!"
  LOADING_TIP_40: " #T «Бо молитва є ніщо інше, як вияв дружби з Богом.»#! \n #tooltip_subheading — свята Тереза Авільська, докторка богослов'я, #italic Книга мого життя (саможиттєпис)#!, бл. 1565#!"
  LOADING_TIP_41: " #T «До Бога я звертаюсь іспанською, з жінками говорю італійською, з чоловіками — французькою, а німецькою — з конем.»#! \n #tooltip_subheading — Карл V, імператор Священної Римської імперії, король Іспанії, ерцгерцог Австрійський та ін.#!"
  LOADING_TIP_42: " #T «Сам ван їхав верхи та пускав стріли в оленя. Одначе кінь перечепився, і правитель впав, але залишився неушкодженим. Озираючись довкола, Тхеджон мовив: 'Жоден хроніст не має про це довідатись!'»#! \n #tooltip_subheading — #italic «Істинні записи династії Чосон», том 7, розділ 4#!, бл. 1410#!"
  LOADING_TIP_43: " #T «Той, хто чіпляється за життя — помирає, а той, хто зневажає смерть — живе.\"\n #tooltip_subheading — Уесуґі Кенсін, японський даймьо, 1570-ті#!"
  LOADING_TIP_44: " #T «Вчення для людини — що гілки та листя для дерева. І можна сказати, що одне без іншого безглузде.\"\n #tooltip_subheading — Такеда Шінґен, японський даймьо, 1550-ті#!"
  LOADING_TIP_45: " #T «Ворог в Хоннодзі.»#! \n #tooltip_subheading — Акечі Міцухіде, генерал Оди Нобунаґи, перед заколотницьким нападом на монастир Хонно, який призведе до самогубства Нобунаґи, 1582#!"
  LOADING_TIP_46: " #T «Англійці надмірно кохають себе та все, що їм належить; для них не існує інших людей та світу іншого крім Англії.»#! \n #tooltip_subheading — Андреа Тревізан, венеційський дипломат, 1498#!"
  LOADING_TIP_47: " #T «Допоки в Каталонії лишається хоч один каталонець, ми матимемо ворогів та війну.»#! \n #tooltip_subheading — Франсіско де Кеведо, кастильський письменник, 1645"
  LOADING_TIP_48: " #T «Землі Іспанії багато де лежать облогом. Причина ж тому — окаянні лінощі тамтешнього люду, що нагадує вельми мешканців Вельсу...»#! \n #tooltip_subheading — Френсіс Віллоубі, англійський натураліст та дослідник, 1673#!"
  LOADING_TIP_49: " #T «В Англії шістдесят різних вір і лише один соус!»#! \n #tooltip_subheading — Франческо Караччоло, адмірал Неаполітанського королівства, 1799#!"
  LOADING_TIP_50: "#T «Настав день, кажу я, коли — як і всякого іншого — виявиться могутність моєї руки і я здійсню подвиги, що будуть вписані в книгу слави на науку прийдешнім вікам».#! \n #tooltip_subheading — Кастильський письменник Мігель де Сервантес, #italic «Хитромудрий ідальго Дон Кіхот Ламанчський»#!, 1605#!"
  LOADING_TIP_51: "#T «Мої вояки розбили ворога під Росбахом, не зробивши майже жодного пострілу».#! \n #tooltip_subheading — Король Пруссії Фрідріх II Великий, близько 1757 року#!"
  LOADING_TIP_52: "#T «Залізо іржавіє, не знаходячи собі застосування; стояча вода гниє або на холоді замерзає, а розум людини, не знайшовши собі застосування, марніє».#! \n #tooltip_subheading — Леонардо да Вінчі, флорентійський мислитель, бл. 1500 р.#!"
  LOADING_TIP_53: "#T «Краса — результат форми та відповідности цілого щодо окремих частин, частин одна до одної і знову — до цілого».#! \n #tooltip_subheading — Андреа Палладіо, венеційський архітектор, #italic «Чотири книги про архітектуру»#!, 1570 р.#!"
  LOADING_TIP_54: "#T «Природа відлила його й розбила ливну форму!»#! \n #tooltip_subheading — Лудовіко Аріосто, феррарський поет, #italic «Шалений Роланд»#!, 1532 р.#!"
  LOADING_TIP_55: "#T «Я — секретар світу».#! \n #tooltip_subheading — П’єтро Аретіно, аретинський сатирик, бл. 1530 р.#!"
  LOADING_TIP_56: "#T «Його Всесвіт не можна осягнути, не навчившись спочатку розуміти його мову й не вивчивши літери, якими він написаний. А написаний він математичною мовою».#! \n #tooltip_subheading — Галілео Галілей, пізанський фізик, #italic «Пробірник»#!, 1623 р.#!"
  LOADING_TIP_d008_0: "#T «Ці греки були надзвичайно побожні у своїх богослужіннях, в яких брали участь не тільки жерці, а й воїни; всі вони читали псалми своєю мовою, до якого б стану не належали».#! \n #tooltip_subheading — Валлійський історик Адам з Аска, близько 1399 року#!"
  LOADING_TIP_d008_1: "#T «Краще турецька чалма, ніж папська тіара».#! \n #tooltip_subheading — Візантійський флотоводець Лука Нотара, близько 1453 року#!"
  LOADING_TIP_d008_2: "#T «Бог не попустить мені жити імператором без імперії. Якщо місто впаде, я впаду з ним».#! \n #tooltip_subheading — Візантійський імператор Костянтин XII, 1453#!"
  LOADING_TIP_d008_3: "#T «Ми відвернулися від них латинян, як єретиків, і тому відмежувалися від них».#! \n #tooltip_subheading — Візантійський богослов Марк Ефеський, близько 1439 року#!"
  LOADING_TIP_57: "#T «Виконати завдання ми мали намір уночі, оскільки, взявшись за нього вдень, ми б лише занапастили себе. Бачить Бог, ми вчинили правильно, і я вважаю, що тільки завдяки цьому ми здобули перемогу».#! \n #tooltip_subheading — Фернандо д’Авалос, маркіз ді Пескара, командувач імперських військ у битві при Павії, 1525 р.#!"
  LOADING_TIP_58: "#T «Усе втрачено, крім чести».#! \n #tooltip_subheading — Франциск I, король Франції — про битву при Павії, 1525 р.#!"
  LOADING_TIP_59: "#T «Немає нічого радісного в тому, щоб полонити короля-християнина».#! \n #tooltip_subheading — Карл V, імператор Священної Римської імперії — про битву при Павії, 1525 р.#!"