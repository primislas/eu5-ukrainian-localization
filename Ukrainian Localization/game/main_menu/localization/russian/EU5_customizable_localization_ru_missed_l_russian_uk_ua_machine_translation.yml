  Yingying_Herrdahl: "Yingying Herrdahl (pipa)"
  Yingying_Herrdahl_facts: "Ін Ін Херрдал — віртуозна виконавиця на піпі, нині проживає у Швеції."
  Pipa_facts: "Китайська піпа — струнний щипковий інструмент грушоподібної форми, на якому грають нігтями або, історично, також медіатором. Її походження налічує майже дві тисячі років, і це один із найпопулярніших китайських інструментів."
  Martin_Ostergren: "Martin Östergren (орган)"
  Feras_Charestan: "Feras Charestan (qanun)"
  Feras_Charestan_facts: "Ферас Чарестан родом з міста Ель-Хасака на північному сході Сирії, навчався грі на кануні у Вищій музичній школі в Дамаску."
  Qanun_facts: "Канун (канун) — струнний інструмент родини цитр, можливо, походить зі стародавньої Месопотамії, хоча його походження достеменно не встановлено."
  Ilona_Danho: "Ilona Danho (vocals)"
  Feras_Charestan_and_Ilona_Danho: "$Feras_Charestan$, $Ilona_Danho$"
  Dan_Cecil_Hill: "Dan Cecil Hill (flutes)"
  Dan_Cecil_Hill_facts: "Ден Сесіл Гілл (народ каюга, клан Чаплі) — митець і музикант народу гауденосауні (ірокезів), що спеціалізується на традиційному виготовленні срібних виробів та флейт. Бувши митцем, виконавцем і культурним діячем протягом більшої частини свого життя, він працював над збереженням і поширенням усіх аспектів історії свого народу, що сягає доколоніальних часів у США та раніших періодів."
  Pierre_Harmon: "Pierre Harmon"
  Pierre_Harmon_facts: "П’єр Армон — широко відомий флейтист і визнаний експерт з доколумбової музики. Він здобув всесвітню славу завдяки своїм цінним дослідженням у галузі музикознавства, особливо в галузі ацтекської музики, а також володіє однією з найбільших колекцій стародавніх інструментів, освоєнню яких він присвятив свою кар’єру."
  Laurent_Sauron: "Laurent Sauron"
  Pierre_Harmon_and_Laurent_Sauron: "$Pierre_Harmon$ (flutes), $Laurent_Sauron$ (percussion)"
