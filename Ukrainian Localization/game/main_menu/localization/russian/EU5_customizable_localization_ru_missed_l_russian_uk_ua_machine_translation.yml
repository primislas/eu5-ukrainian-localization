  MusicPlayer_sol_deccan_raga_keeravani: "Deccan - Raga Keeravani"
  MusicPlayer_sol_deccan_raga_keeravani_flavour: "Виконується в класичному тричастинному стилі карнатичної музики. Назва пісні перекладається як «Рага відданості»."
  MusicPlayer_sol_deccan_raga_nattaikurunji: "Deccan - Raga Nattaikurunji"
  MusicPlayer_sol_deccan_raga_nattaikurunji_flavour: "Виконується в класичному тричастинному стилі карнатичної музики. Назва пісні перекладається як «Рага романтизму»."
  MusicPlayer_sol_deccan_raga_saraswathi: "Deccan - Raga Saraswathi"
  MusicPlayer_sol_deccan_raga_saraswathi_flavour: "Виконується в класичному тричастинному стилі карнатичної музики. Назва пісні перекладається як «Рага містицизму»."
  MusicPlayer_sol_iroquois_Akwesasne: "Iroquois - Akwesasne"
  MusicPlayer_sol_iroquois_Akwesasne_flavour: "$Dan_Cecil_Hill_facts$ Назва пісні перекладається як «Земля, де тетерук барабанить»."
