l_russian:
  MusicPlayer_01_Overture_I_Genesis: "01 - Overture I Genesis"
  MusicPlayer_01_Overture_I_Genesis_flavour: "'Світ пробуджується, сонячне світло поступово відкриває його лик, шматочок за шматочком.'"
  MusicPlayer_02_Overture_II_The_Odyssey: "02 - Overture II Odyssey"
  MusicPlayer_02_Overture_II_The_Odyssey_flavour: "'Увертюра нашої історії, в якій ми знайомимося з її персонажами та темами.'"
  MusicPlayer_03_Royal_Court_Invitation: "03 - Royal Court Invitation"
  MusicPlayer_03_Royal_Court_Invitation_flavour: "Клавесин, що звучить у цій п’єсі, — клавішний інструмент, поширений у музиці доби Відродження та бароко. Він видає звук завдяки механічному защипуванню набору струн, закріплених на деці: при натисканні клавіші приводиться в рух плектр-язичок, який защипує одну струну."
  MusicPlayer_25_The_Noble_Art_of_Diplomacy: "25 - The Noble Art of Diplomacy"
  MusicPlayer_25_The_Noble_Art_of_Diplomacy_flavour: "Інструменти родини лютні мають довгу історію в багатьох регіонах світу та історичних періодах, а європейська лютня — провідний інструмент світської музики доби Відродження в Європі."
  MusicPlayer_21_Conquer_or_Fall: "21 - Conquer or Fall"
  MusicPlayer_21_Conquer_or_Fall_flavour: "Епічна композиція за участю валторн, струнних інструментів та хору. Представляє натхненну варіацію на одну з головних мелодійних тем музики в Europa Universalis V."
  MusicPlayer_07_For_the_Lost_Ones: "07 - For the Lost Ones"
  MusicPlayer_07_For_the_Lost_Ones_flavour: "Скорботна та бентежна композиція, що перегукується темами та мотивами з іншими творами з Europa Universalis V."
  MusicPlayer_12_Jester_Speaks_the_Truth: "12 - Jester Speaks the Truth"
  MusicPlayer_12_Jester_Speaks_the_Truth_flavour: "Композиція, натхненна музикою раннього Відродження, будується на варіаціях головного мелодійного мотиву музики Europa Universalis V."
  MusicPlayer_05_The_Rise_of_an_Empire: "05 - The Rise of an Empire"
  MusicPlayer_05_The_Rise_of_an_Empire_flavour: "Відкриваючись головним мотивом Europa Universalis V, ця композиція яскраво передає основну емоційну суть ігрового досвіду."
  MusicPlayer_20_Thirty_Years: "20 - Thirty Years"
  MusicPlayer_20_Thirty_Years_flavour: "Тридцятилітня війна (1618–1648) — один із найруйнівніших конфліктів у європейській історії, що забрав життя від 4,5 до 8 мільйонів людей. Вона спалахнула на тлі Реформації XVI століття та розгорілася ще сильніше через зовнішні зіткнення інтересів і старі чвари."
  MusicPlayer_24_The_Black_Death: "24 - The Black Death"
  MusicPlayer_24_The_Black_Death_flavour: "Винищуючи половину населення Європи XIV століття, Чорна смерть стала однією з найсмертоносніших пандемій в історії людства."
  MusicPlayer_10_Gloria_Patri: "10 - Gloria Patri"
  MusicPlayer_10_Gloria_Patri_flavour: "Вокальна варіація на тему Сюїти для віолончелі № 1 соль мажор Й. С. Баха, BWV 1007: I. Прелюдія."
  MusicPlayer_14_Lux_aeterna: "14 - Lux Aeterna"
  MusicPlayer_14_Lux_aeterna_flavour: "Lux aeterna — текст, що часто використовується в музиці як частина заупокійної меси в католицькій церкві. У ньому йдеться про благодать Божу та Його вічне світло, що сяє над покійними."
  MusicPlayer_18_Falalalan: "18 - Falalalan"
  MusicPlayer_18_Falalalan_flavour: "Історія завжди присутня в музиці, часом одразу кількома способами."
  MusicPlayer_22_A_Message_to_The_King: "22 - A Message to the King"
  MusicPlayer_22_A_Message_to_The_King_flavour: "Композиція, сповнена терміновості та запалу, що передає відчуття, що поспішність має першочергове значення."
  MusicPlayer_08_No_Fear_No_Mercy: "08 - No Fear, No Mercy"
  MusicPlayer_08_No_Fear_No_Mercy_flavour: "Урочиста композиція, що нагадує про затишшя перед битвою та про серця вояків, що б’ються в грудях в передчутті бою."
  MusicPlayer_06_Pain_is_Salvation: "06 - Pain is Salvation"
  MusicPlayer_06_Pain_is_Salvation_flavour: "Текст поєднує англійську, давньогерманську та латинську мови та оповідає про страждання на шляху до спасіння."
  MusicPlayer_04_In_Your_Honor: "04 - In Your Honor"
  MusicPlayer_04_In_Your_Honor_flavour: "Масштабний твір, що нагадує про зелені пасовища та благоговіння перед Богом і Природою."
  MusicPlayer_15_A_Bargain_with_Beelzebub: "15 - A Bargain with Beelzebub"
  MusicPlayer_15_A_Bargain_with_Beelzebub_flavour: "Віра та війна, війни через віру. Благочестя та кровожерливість, що переплітаються одне з одним. Зображені тут століття — це століття різких контрастів, розбавлені відтінками сірого."
  MusicPlayer_16_The_Path_to_Potsdam: "16 - The Path to Potsdam"
  MusicPlayer_16_The_Path_to_Potsdam_flavour: "Під час Тридцятилітньої війни місто Потсдам втратило майже половину свого населення."
  MusicPlayer_11_Maiden_Voyage: "11 - Maiden Voyage"
  MusicPlayer_11_Maiden_Voyage_flavour: "Композиція в танцювальному ритмі, що нагадує про хитавицю хвиль, коли корабель виходить у незвідані моря."
  MusicPlayer_17_The_Coronation_of_a_Naked_Emperor: "17 - The Coronation of a Naked Emperor"
  MusicPlayer_17_The_Coronation_of_a_Naked_Emperor_flavour: "Твір у світському стилі бароко, за участю струнних інструментів та клавесина."
  MusicPlayer_13_Battle_of_Lutzen: "13 - Битва під Лютценом"
  MusicPlayer_13_Battle_of_Lutzen_flavour: "Битва під Лютценом відбулася 16 листопада 1632 року: шведське військо за підтримки військ із Саксонії та Гессена-Касселя билося проти Імперського війська Священної Римської імперії. Це одна з найважливіших битв Тридцятилітньої війни. Після загибелі шведського короля Густава Адольфа під час битви було створено Гайльброннський союз."
  MusicPlayer_26_Peace_of_Westphalia: "26 - Peace of Westphalia"
  MusicPlayer_26_Peace_of_Westphalia_flavour: "Вестфальський мир — збірна назва двох окремих мирних договорів, підписаних в Оснабрюку та Мюнстері в 1648 році, які поклали край Тридцятилітній війні та принесли мир у Священну Римську імперію."
  MusicPlayer_23_The_Flagellant: "23 - The Flagellant"
  MusicPlayer_23_The_Flagellant_flavour: "Флагелантство — практика самобичування як покаяння за гріхи та розділення Страстей Христових, присутня в багатьох християнських традиціях. Цей рух XIV століття в західному християнстві виник як реакція на війни, голод та епідемії."
  MusicPlayer_19_O_quam_gloriosum: "19 - O quam gloriosum"
  MusicPlayer_19_O_quam_gloriosum_flavour: "Ця композиція ґрунтується на тексті, написаному Томасом Луїсом де Вікторією (1548–1611) для його «Missa O quam gloriosum»."
  MusicPlayer_09_Libera_me_Domine: "09 - Libera me Domine"
  MusicPlayer_09_Libera_me_Domine_flavour: "У цій композиції об’єднано тексти «Pie Jesu» та «Libera me», які часто використовуються в музиці як частина заупокійної меси (Реквієму) в Католицькій церкві. У них міститься благання про те, щоб покійному була дарована милість Ісуса, що дарує спокій, та визволення в день Страшного суду."
  MusicPlayer_sol_ashanti_Aho: "Ashanti - Aho"
  MusicPlayer_sol_ashanti_Aho_flavour: "Нана Осей Твум Баріма — майстер гри на всіх інструментах, що використовуються в музиці та церемоніях народу ашанті, включно із сеперевою, традиційними духовими та ударними інструментами. Він також є наступником імператора та творцем Королівства Ашанті. Назва пісні перекладається як «Воєнний клич»."
  MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko: "Ashanti - Asanteman Yenim Ko"
  MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko_flavour: "Початок тексту пісні приблизно перекладається як «Ашанті вміють битися, але не вміють тікати», а далі проголошується перевага вояків ашанті."
  MusicPlayer_sol_ashanti_Seperewa_Akasa: "Ashanti - Seperewa Akasa"
  MusicPlayer_sol_ashanti_Seperewa_Akasa_flavour: "Назва пісні перекладається як «Сеперева заговорила». Сеперева — інструмент родини арфо-лютней з коробчастим резонатором та 10–14 струнами, прикріпленими до грифа шляхом намотування безпосередньо на нього. Походить із Західної Африки. Кажуть, що король Осей Туту, засновник імперії Асанте (Ашанті), так любив цей інструмент, що для його королівських регалій було виготовлено золоту копію."
  MusicPlayer_sol_aztec_Mictlan: "Aztec - Mictlan"
  MusicPlayer_sol_aztec_Mictlan_flavour: "$Pierre_Harmon_facts$. Назва пісні перекладається як «Підземний світ»."
  MusicPlayer_sol_aztec_Iyac: "Aztec - Iyac"
  MusicPlayer_sol_aztec_Iyac_flavour: "$Pierre_Harmon_facts$. Назва пісні перекладається як «Традиційний воїн»."
  MusicPlayer_sol_aztec_Teotl: "Aztec - Teotl"
  MusicPlayer_sol_aztec_Teotl_flavour: "$Pierre_Harmon_facts$. Назва пісні перекладається як «Бог природи»."
