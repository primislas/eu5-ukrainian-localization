  Jacob_Regnart: "Jacob Regnart (1540-і–1599)"
  Jacob_Regnart_facts: "Регнарт — фламандський композитор доби Відродження, народився в Дуе і писав як духовну, так і світську музику. Протягом життя він працював в Австрії та Богемії, зокрема на посаді капельмейстера при ерцгерцозі Фердинанді в Інсбруку в 1580-х роках."
  Martin_Rinckart: "Martin Rinckart (1586–1649)"
  Martin_Rinckart_facts: "Мартін Ринкарт — лютеранський священнослужитель і автор гімнів, служив архідияконом в Айленбурзі в Північній Саксонії, де він народився і помер."
  Joachim_Neander: "Joachim Neander (1650–1680)"
  Joachim_Neander_facts: "Йоахім Неандер народився в Бремені, був автором гімнів реформатської (кальвіністської) церкви, богословом і вчителем. Вважається провідним автором гімнів реформатської церкви, написав близько 60 гімнів."
  Dietrich_Buxtehude: "Dietrich Buxtehude (1637–1707)"
  Dietrich_Buxtehude_facts: "Дідріх Буксенгуде (при народженні Дідріх Гансен Буксенгуде) народився в Гельсінгборзі, провінція Сконе, в 1637 році. Буксенгуде вважається одним із найважливіших композиторів XVII століття і мав великий вплив на пізніших композиторів, таких як Бах і Гендель."
