  MusicPlayer_sol_chinese_Ambush_Act_7_and_8_Jiuli_Mountain_and_The_Defeat_of_Xiang_Yu_flavour: "$MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour$"
  MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos: "Chinese - Ambush from Ten Sides - The Complete Epos"
  MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour: "Шедевр китайської класичної музики, зазвичай виконуваний віртуозами. Написаний у войовничому стилі та зображує битву при Гайся 202 року до н. е., в якій полководець Сян Юй зазнав поразки від Лю Бана."
