l_russian:
 lutheranism_movement: "Лютеранство"
 lutheranism_movement_desc: "Протестантская Реформация охватывает христианский мир. Учение Мартина Лютера вызвало религиозное потрясение, ставящее под сомнение авторитет Католической церкви и быстро распространяющееся среди недовольных слоёв населения."
 lutheranism_movement_location_modifier: "Модификатор лютеранства"
 calvinism_movement: "Кальвинизм"
 calvinism_movement_desc: "Вдохновлённое реформатским учением Жана Кальвина, это движение распространяет более строгую и систематизированную форму протестантской доктрины, особенно привлекательную для купеческих слоёв и городских жителей Европы."
 calvinism_movement_location_modifier: "Модификатор кальвинизма"
 roman_culture_movement: "Латинское возрождение"
 hellenism_religion_movement: "Платоническое возрождение"
 hellenism_religion_movement_allow_tt: "#ONCLICK:COUNTRY,[GetCountry('BYZ').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BYZ').Custom('CL_tt')],X [GetCountry('BYZ').Custom('CL_DAT')|L]#!#! нужно сделать это с помощью действия «[ShowGenericActionName('reestablish_hellenism')]» или [Concept('events', 'событий')|e], связанных с Гемистом Плифоном."
 roman_culture_movement_allow_tt: "#ONCLICK:COUNTRY,[GetCountry('BYZ').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BYZ').Custom('CL_tt')],X [GetCountry('BYZ').Custom('CL_DAT')|L]#!#! нужно склониться в сторону #TOOLTIP:SOCIETAL_VALUE,latinization_vs_hellenization,X #L латинства#!#! [ShowSocietyDirectionName('latinization')], а также приобрести [Concept('urban_location', 'городской район')|e] с [Concept('dominant_language', 'доминирующим')|e] #TOOLTIP:LANGUAGE_FAMILY,romance_language_family,X #L романским#!#! языком и [Concept('average_satisfaction', 'средним довольством')|e] более 50%"
 hellenism_religion_movement_desc: "В среде греческих и римских христиан зреет движение — мечта о возвращении к древним обычаям и мудрости эллинских предшественников."
 hellenism_religion_movement_location_modifier: "Модификатор платонического возрождения"
 roman_culture_movement_desc: "Возрождение латинских традиций в новой Римской империи."
 roman_culture_movement_location_modifier: "Модификатор «$roman_culture_movement$»"
 MOVEMENT_SPREAD: "Распространение движения"
 MOVEMENT_SPREAD_CULTURE: "$MOVEMENT$ распространяет #L $CULTURE|l$ую#! культуру на территории нашей державы. Эту культуру переняло уже несколько групп ($AMOUNT$), что составляет $PERCENTAGE|%2$ нашего населения."
 MOVEMENT_SPREAD_RELIGION: "$MOVEMENT$ распространяет религию «$RELIGION$» на территории нашей державы. В эту веру перешло уже несколько групп ($AMOUNT$), что составляет $PERCENTAGE|%2$ нашего населения."
 MOVEMENT_SUBJECT_RELIGION: "[Concept('religion', 'Религия')|e]: $NAME$"
