  hellenism_religion_movement_allow_tt: "#ONCLICK:COUNTRY,[GetCountry('BYZ').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BYZ').Custom('CL_tt')],X [GetCountry('BYZ').Custom('CL_DAT')|L]#!#! потрібно зробити це за допомогою дії «[ShowGenericActionName('reestablish_hellenism')]» або [Concept('events', 'подій')|e], пов’язаних із Ґемістом Пліфоном."
  roman_culture_movement_allow_tt: "#ONCLICK:COUNTRY,[GetCountry('BYZ').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BYZ').Custom('CL_tt')],X [GetCountry('BYZ').Custom('CL_DAT')|L]#!#! потрібно схилитися в бік #TOOLTIP:SOCIETAL_VALUE,latinization_vs_hellenization,X #L латинства#!#! [ShowSocietyDirectionName('latinization')], а також придбати [Concept('urban_location', 'міську місцевість')|e] з [Concept('dominant_language', 'основною')|e] #TOOLTIP:LANGUAGE_FAMILY,romance_language_family,X #L романською#!#! мовою та [Concept('average_satisfaction', 'середнім задоволенням')|e] понад 50%"
  hellenism_religion_movement_desc: "Серед грецьких та римських християн зріє рух — мрія про повернення до давніх звичаїв та мудрості еллінських попередників."
