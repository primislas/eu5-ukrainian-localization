l_russian:
  lutheranism_movement: "Лютеранство"
  lutheranism_movement_desc: "Протестантська Реформація охоплює християнський світ. Вчення Мартина Лютера спричинило релігійне потрясіння, що ставить під сумнів авторитет Католицької церкви й швидко поширюється серед невдоволених верств населення."
  lutheranism_movement_location_modifier: "Модифікатор лютеранства"
  calvinism_movement: "Кальвінізм"
  calvinism_movement_desc: "Натхненний реформатським вченням Жана Кальвіна, цей рух поширює суворішу та систематизованішу форму протестантської доктрини, особливо привабливу для купецьких верств та містян Європи."
  calvinism_movement_location_modifier: "Модифікатор кальвінізму"
  roman_culture_movement: "Латинське відродження"
