l_russian:
 stockholm_desc: "Стокгольм был основан в 1252 году Биргером Магнуссоном в том месте, где озеро Меларен впадает в Балтийское море. Благодаря своему стратегическому расположению город не только контролировал доступ к озеру, но и служил важным торговым узлом, связывающим Швецию с купеческими сетями Ганзы в Балтике."
 paris_desc: "Париж, стоящий на реке Сене, постепенно превратился из скромного поселения в настоящую жемчужину Франции. Благодаря своему знаменитому собору, крупным рынкам и учебным заведениям он стал одним из важнейших политических и культурных центров Европы."
 london_desc: "Лондон, построенный в устье реки Темзы, прошёл длинный путь от небольшого римского поселения до крупнейшего города Англии. Теперь здесь сосредоточена вся политическая и экономическая мощь королевства."
 rome_desc: "Когда-то Рим был центром могучей империи, чья территория простиралась на несколько континентов. Впрочем, даже после её падения Вечный город смог сохранить своё политическое и религиозное значение, став столицей Папского государства."
 jerusalem_desc: "Иерусалим является местом пересечения авраамических религий, а потому имеет особое значение для иудеев, христиан и мусульман. История и облик этого священного города сформировались под влиянием множества завоеваний и паломников, прибывающих сюда со всех краёв света."
 alexandria_desc: "Александрия, некогда известная своим грандиозным маяком и библиотекой, находится на стыке разных цивилизаций и культур. За счёт этого она и сегодня остаётся важным торговым и образовательным центром Средиземноморья."
 constantinople_desc: "Окружённый могучими стенами, Константинополь был сердцем Восточной Римской империи и местом расположения собора Святой Софии — одного из крупнейших в мире храмов. В течение тысячи лет величие и богатство этого города были предметом зависти для всего мира."
 sitges_desc: "В Средние века на холме, где сегодня располагается здание муниципалитета, был построен замок. Первоначально он принадлежал архиепархии Барселоны, однако в XII веке перешёл к семье, в чью честь и получил своё название."
 valladolid_desc: "Вальядолид был основан в конце XI века графом Педро Ансуресом и его женой Эйло Альфонсо в самом центре Северной Месеты, вблизи реки Писуэрга. Благодаря торговле Вальядолид быстро стал одним из важнейших городов в регионе наряду с Бургосом. К XIV веку он обрёл столь значительное влияние, что служил административным центром державы при регенте Марии де Молине и её внуке Альфонсо XI."
 penafiel_desc: "Город Пеньяфьель, чьё название происходит от латинского #italic Pinna Fidelis#! («Верная скала»), был основан в X веке. Изначально он представлял собой небольшой аванпост на вершине холма, предназначенный для отражения набегов со стороны Кордовского халифата. Граф Санчо Гарсия значительно укрепил его и в 1013 году предоставил ему фуэрос — особые городские права и привилегии. Впоследствии Пеньяфьель перешёл во владение влиятельного дона Хуана Мануэля и стал весьма богатым городом с процветающей винодельческой промышленностью."
 toro_desc: "Торо был основан в X веке в долине реки Дуэро для защиты владений Королевства Леон от войск Кордовского халифата. Благодаря своему выгодному расположению город служил важным оборонительным узлом, а тёплый климат и плодородные земли позволили ему также стать крупным центром виноделия."
 thessaloniki_desc: "Долгое время Фессалоники считались вторым по значимости городом Византии после Константинополя. Своим богатством они обязаны выгодному расположению вблизи Эгейского моря, что способствует развитию торговли. При этом местные порты служат своего рода мостом между Западом и Востоком, позволяя перевозить товары между имперскими владениями и Италией."
 malmo_desc: "Мальмё контролирует проход судов через пролив Эресунн, соединяющий Балтийское и Северное море. В связи с этим город является важнейшим стратегическим пунктом, защиту которого обеспечивают его крепкие стены и бдительный гарнизон."
 bilbao_desc: "Бильбао был основан в 1300 году Диего Лопесом де Аро, сеньором Бискайи. Этот город, расположенный в устье реки Нервьон, вскоре стал важным торговым узлом и центром кораблестроительной промышленности в Северной Испании. Кроме того, благодаря своей развитой портовой инфраструктуре Бильбао служил местом, откуда купцы перевозили местную железную руду и кастильскую мериносовую шерсть в английские и фламандские порты."
 radom_desc: "После своего расширения и обновления королём Казимиром III город Радом стал важным политическим центром Польши и оставался им вплоть до конца эпохи Возрождения. Именно здесь в 1401 году была заключена Виленско-Радомская уния, и тут же на сейме 1505 года был принят закон #italic Nihil novi#!."
 krakow_desc: "О поселениях на Вавельском холме было известно ещё в древности, однако впервые Краков упоминается в документе от 965 года, где описывается как крупный торговый город. В 1038 году Краков стал резиденцией польских монархов из династии Пястов, и с тех пор служил одним из главных административных, экономических и культурных центров Польского Королевства."
 megara_desc: "В древности Мегарой правил легендарный герой Нис, а некоторые её уроженцы основали в Средиземноморье такие великие города, как Византион, Херсонес и Селинунт. В дальнейшем Мегара стала важным торговым центром и обрела огромное влияние на территории Греции — во многом благодаря своему мощному флоту. Однако с тех пор она утратила большую часть своего могущества, и ныне от её былого величия осталась лишь тень."
 grojec_desc: "До XII века в Груеце располагалась Познаньская архиепархия и резиденция местного каштеляна, однако в связи с ростом влияния соседнего города Черска он постепенно утратил своё значение."
 gdansk_desc: "Первое письменное упоминание о Гданьске относится к 997 году, однако поселение там существовало задолго до этого. В эпоху позднего Средневековья Гданьск превратился в крупный торговый порт и центр судостроения, благодаря чему он стал одним из наиболее богатых и влиятельных городов Восточной Европы."
 athens_desc: "Афины считались культурным центром Древней Греции и были одним из самых могущественных городов-государств своего времени. Соперничая со Спартой, Фивами и другими античными державами, Афины постепенно добились господства в Эгейском море. Позднее город был завоёван сначала Македонской, а затем Римской и Византийской империями, из-за чего пришёл в упадок. Тем не менее после 1204 года Афины вновь воспрянули, став столицей новообразованного государства крестоносцев."
 wieliczka_desc: "Величка была основана в 1290 году Пшемыслом II в районе соляных рудников. Добыча этого ценного продукта приносила Польше огромную прибыль, в связи с чем город получил множество привилегий и стал крупным промышленным центром. Так, шахты в Величке и соседней Бохне стали частью соледобывающей компании #italic «Краковские жупы»#!, которая обеспечивала их работу до конца XX века. В официальных документах за городом долгое время сохранялось его старое название #italic Wielka Sól#!, что означает #italic «великая соль»#!."
 leksand_desc: "Этот городок на южном берегу озера Сильян существует уже более тысячи лет. В XII веке здесь была построена церковь, первым протестантским главой которой был дальний предок Юхана Андерссона — ведущего гейм-дизайнера Europa Universalis V."
 leipzig_desc: "Лейпциг, основанный в 1165 году на пересечении #italic Имперской#! и #italic Царской#! дорог, довольно быстро разбогател и расширился благодаря торговле пушниной. Получив ряд значительных привилегий, он стал важным торговым узлом Европы и одним из центров книгопечатания в регионе."
 augsburg_desc: "Вольный имперский город Аугсбург, известный под названием #italic Августа Винделиков#! в годы правления императора Траяна, считается одним из старейших городов Священной Римской Империи. В 955 году местному гарнизону удалось отразить нападение венгерских войск, в результате чего значение города заметно возросло. В 1276 году король Рудольф I даровал Аугсбургу статус имперского города, что ознаменовало новый этап в его развитии и поспособствовало его дальнейшему процветанию."
 warsaw_desc: "На заре своей истории Варшава представляла собой небольшое мозавецкое рыбацкое поселение. В 1596 году Сигизмунд III перенёс столицу из Кракова в Варшаву, после чего она начала стремительно расти и уже к XVIII веку стала крупнейшим городом Польши. В это же время здесь перестроили и возвели множество зданий, что значительно поспособствовало развитию польской архитектуры и различных ремёсел."
 tunis_desc: "Основанный легендарной царицей Дидоной в 814 году до нашей эры, изначально этот город носил название Карфаген и являлся столицей одноимённого пунического государства. В результате трёх крупных войн он был разрушен, а затем заново отстроен римлянами. Современный город Тунис был заложен арабами в 698 году неподалёку от древних карфагенских руин. После завоевания Альмохадов в XII веке город фактически стал региональной столицей, и во время правления династии Хафсидов этот статус лишь упрочился."
 heidelberg_desc: "В конце XII века Гейдельберг стал резиденцией пфальцграфа Рейнского, в связи с чем здесь был возведён внушительный замок. Позднее в этом городе был основан первый университет Германии, благодаря чему он стал важным научным и образовательным центром. В ходе Реформации Гейдельберг присоединился к протестантскому движению, что повлияло на создание Евангелической унии во главе с Пфальцем. В эпоху романтизма образ Гейдельбергского замка привлёк в город великое множество поэтов, за счёт чего он даже получил прозвище #italic «город романтики»#!."
 aviles_desc: "Авилес был основан в X веке на территории устья одноимённой реки, благодаря чему он обрёл важное стратегическое значение как порт. В расположенном поблизости замке Гаусон король Астурии Альфонсо III приказал изготовить Крест победы — украшенную золотом и драгоценными камнями реликвию, которая впоследствии стала символом королевства. В XI веке Авилес получил статус королевского города и стал одним из центров морской торговли, в котором также хранились значительные запасы соли, добытой в других регионах державы."
 pingjin_desc: "Тайюань, где расположен священный храм Цзинь, ещё с V века до нашей эры является одним из важнейших городов Шаньси и всего Северного Китая. В 979 году, в ходе завоевания Северной Хань, император Тай-цзун приказал затопить и уничтожить город. В знак триумфа и унижения своих врагов, он переименовал захваченный регион в Пинцзинь, что означает «усмирение Шаньси». В результате затопления от города остались лишь руины, и на его восстановление ушло много десятков лет."
 dunstable_desc: "Данстейбл возник на месте древнего римского поселения. Уже в Средние века англичане основали здесь монастырь. За свою длинную историю город пережил ряд исторических событий. В частности, здесь развёлся со своей женой Генрих VIII, а великий полководец Оливер Кромвель набирал в окрестных землях добровольцев для участия в гражданской войне. Кроме того, здесь располагается старая резиденция Генриха I и один из двенадцати памятных крестов Элеоноры."
 paderborn_desc: "С момента своего основания около 800 года Падерборн служил центром местного епископства. Именно здесь впервые встретились Карл Великий и папа римский Лев III. За время Тридцатилетней войны город понёс большой ущерб: он пережил 16 осад, последнюю из которых устроила шведская армия в 1646 году."
 porto_desc: "Именно от #italic «непобеждённого города»#! Порту произошло название Португалии и знаменитого на весь мир портвейна, изготавливаемого в долине реки Дору."
 jiaxing_desc: "Цзясин расположен на границе между регионами У и Юэ. Слово «цзя» в его названии означает «красота», а «син» — «процветание»."
 torgau_desc: "В 1452 году курфюрст Фридрих II приказал создать возле замка в Торгау ров с медведем. Ров постепенно расширялся вплоть до 1624 года, и в какой-то момент мог вмещать несколько медведей одновременно."
 changsha_desc: "Со времён постройки город Чанша в течение двух тысяч лет оставался главным экономическим и административным центром региона."
 ningxiang_desc: "В Нинсяне был найден крупнейший бронзовый #italic цзунь#! (ритуальный сосуд для вина), изготовленный более 3000 лет назад во времена правления династии Шан."
 wurzburg_desc: "Вюрцбург был образован на месте франконской крепости в 741 году, когда находившееся там поселение получило статус епископства. В раннем Средневековье город процветал главным образом за счёт своего выгодного расположения на реке Майн, по которой проходили многие торговые маршруты."
 hanover_desc: "Из скромного поселения Ганновер постепенно превратился в один из ключевых городов Священной Римской Империи. Под управлением династии Вельфов город стал развитым торговым и культурным центром, который к тому же имел большое политическое влияние."
 osnabruck_desc: "В Средние века Оснабрюк служил центром местного епископства и важным торговым узлом Священной Римской Империи. Среди прочего город известен тем, что в нём было подписано одно из двух соглашений, приведших к заключению Вестфальского мира."
 glasgow_desc: "Глазго возник вокруг средневекового собора, который служил резиденцией местного архиепископства. В XV веке здесь был основан университет, который поспособствовал становлению Глазго как образовательного центра Шотландии."
 neva_desc: "Санкт-Петербург был заложен в дельте реки Невы, которая когда-то была частью варяго-греческого торгового пути. Основанный в 1703 году, этот город служил столицей России более 200 лет."
 dubno_desc: "Город Дубно, впервые упомянутый в 1100 году, был крупным торговым центром Волыни, известным своими большими ярмарками. В 1492 году здесь был возведён замок, вокруг которого разворачиваются события повести Николая Гоголя #italic «Тарас Бульба»#!."
 baden_desc: "Изначальное поселение на этом месте было основано римлянами и носило название #italic Civitas Aurelia Aquensis#!. В эпоху раннего Средневековья город стал известен как Баден, и позднее это название также перешло к Баденскому дому династии Церингенов, который начал править этими землями."
 erbach_desc: "В конце XVIII века граф Франциск I, питавший большой интерес к реликвиям древности, выделил средства на создание в Эрбахе гильдии резчиков, которая занималась созданием изделий из поделочной кости. Благодаря этому город привлёк множество творцов и стал одним из главных центров этого ремесла."
 manhattan_desc: "Некогда населённый народом ленапе, остров Манна-хата был приобретён голландскими поселенцами в обмен на товары общей стоимостью всего 60 гульденов. Здесь они построили крепость, которая стала центром власти Нового Амстердама."
 doncaster_desc: "Через Донкастер, известный прежде под римским названием Данум, проходила Великая северная дорога, по которой путники и торговцы перевозили товары между Лондоном и северными землями. Благодаря такому выгодному расположению Донкастер к 1337 году стал одним из богатейших городов Йоркшира."
 kitchissippi_desc: "Этот город был назван в честь реки Кичисипи, ныне известной как Оттава. В этих землях народ анишинабе занимался охотой и торговлей, пока британские поселенцы не расширили вырубку лесов и не основали здесь город, ставший резиденцией их колониальной администрации."
 saint_marceilin_desc: "Основанный в XI веке, Сен-Марселлен служил резиденцией совета дофина в период с 1337 по 1340 год. Этот город также славится своим мягким сыром с морщинистой корочкой, который подавали при королевском дворе как минимум с 1461 года."
 caerphilly_desc: "В валлийских долинах добывался самый качественный уголь в Европе, благодаря чему во второй половине XVIII этот регион стал важным центром производства железа."
 grenoble_desc: "Гренобль — небольшой, но стратегически важный город в Альпах, который является столицей провинции Дофине. Он окружён реками и горами, поэтому прекрасно подходит для обороны местных земель, в связи с чем здесь была возведена крепость Бастилия. Вокруг местного собора простираются узкие извилистые улицы, где живут и трудятся купцы, ремесленники и крестьяне, привозящие сюда товары из соседних долин."
 kinsale_desc: "Кинсейл — небольшой, но весьма оживлённый портовый городок, расположенный в природной гавани на южном побережье Ирландии. Основными занятиями горожан являются рыбная ловля и торговля. Так, местные купцы обменивают рыбу, шкуры и шерсть на вино, соль и предметы роскоши из Иберии и Франции. На узких улицах вокруг причалов порой встречаются иностранные торговцы, с которыми ирландские моряки обмениваются историями и заключают сделки. Несмотря на скромные размеры гавани, именно она позволила Кинсейлу стать стратегически важным портовым городом, который соединил Ирландию с континентальной Европой."
 stockton_desc: "Стоктон — англосаксонское поселение на северном берегу реки Тис. Оно оставалось весьма малонаселённым до тех пор, пока епископ не освободил местных крепостных, что привлекло сюда множество купцов и ремесленников. За счёт этого Стоктон стал важным торговым городом, который занимался продажей местной шерсти и ввозом иностранных вин. Однако по-настоящему крупным городом Стоктон стал лишь после промышленной революции."
 kunow_desc: "Кунув с раннего Средневековья находился в ведении Краковской архиепархии, однако приход здесь появился лишь в 1281 году. Своим названием город, скорее всего, обязан куницам, которые в изобилии водились в окрестных лесах."
 lublin_desc: "Люблин был основан на рубеже XII–XIII веков, а статус города получил от Владислава Локетека в 1317 году. В последующие столетия Люблин превратился в крупный торговый центр, чей расцвет пришёлся на XVI век. Именно в это время была заключена Люблинская уния, которая и позволила городу обогатиться за счёт развития торговли с Востоком."
 kendal_desc: "Кендал был основан на месте римского военного городка, который возник на берегу реки Кент ещё в I веке нашей эры. Поселение активно развивалось при норманнах: получив в 1189 году от короля Ричарда I право на торговлю в обмен на финансовую поддержку его крестового похода, Кендал начал процветать и со временем стал важным центром средневековой торговли шерстью. Главный замок города принадлежал семье Парр, самой известной представительницей которой была Екатерина — супруга короля Генриха VIII."
 cairo_desc: "Город Эль-Кахира («Победоносный») был заложен в 969 году фатимидским полководцем Джаухаром ас-Сакали неподалёку от древней римской крепости Вавилон. Вскоре он отобрал у Александрии звание центрального города Египта. При Айюбидах и мамлюках он превратился в самый многолюдный город исламского мира, чьи рынки и мечети привлекали купцов, учёных и паломников с трёх континентов. В 1258 году монголы разрушили Багдад, и Каир остался неоспоримой столицей исламской цивилизации — городом необычайного величия, чьи минареты возносились над долиной реки, которая кормила людей с незапамятных времён."
 dadu_desc: "В 1267 году на равнинах к югу от хребта Тайханшань Хубилай-хан воздвиг Даду — «Великую столицу», престольный град своей династии Юань на руинах чжурчжэньского Чжунду. Марко Поло был поражён величием этого города, описывая его широкие улицы, необъятные дворцы и склады, ломящиеся от богатств со всего Китая. Даже когда могущество монголов пошло на спад, город прочно закрепился в роли северных врат между степью и срединными землями Китая, оставаясь важным центром империи."
 venice_desc: "Венеция, выросшая на илистых отмелях Адриатической лагуны, родилась из необходимости и развивалась благодаря большим амбициям. Беглецы, спасавшиеся от вторжения лангобардов, нашли укрытие на этих островах, а к IX веку город превратился в морскую республику под управлением избираемого дожа. Построив Арсенал и бесчисленные торговые конторы, венецианские купцы получили власть над маршрутами, тянувшимися от Чёрного моря до самого Леванта. Они сделали Венецию богатейшим городом христианского мира и бесспорной владычицей средиземноморской торговли."
 moscow_desc: "Москва была основана в 1147 году Юрием Долгоруким как маленькая деревянная крепость на берегах Москвы-реки и долго пребывала в тени более древних городов Руси. Однако под гнётом монгольского ига московские князья проявили удивительную способность к выживанию и расширению владений: они исправно собирали дань для Золотой Орды, постепенно присоединяя соседние княжества. Удачное расположение на перекрёстке северных речных путей позволило городу расти за счёт торговли, и к началу XIV века его великий князь обладал большей властью, чем любой другой правитель на Руси."
 tenochtitlan_desc: "Согласно преданиям народа мешика, их бог Уицилопочтли пообещал привести их туда, где орёл восседает на кактусе, и примерно в 1325 году на болотистом островке посреди озера Тескоко они основали Теночтитлан. Молодое поселение росло с поразительной скоростью — сама природа даровала ему защиту, а окрестные озёрные берега щедро делились богатствами. Однажды дамбы, плавучие сады и сильные воинские традиции превратят его в величайший город обеих Америк — и сердце грозной империи."
 delhi_desc: "На западном берегу Ямуны с древнейших времён сменяли друг друга престолы и династии — и город Дели служил средоточием власти для всех, кто правил этой землёй. В 1206 году династия мамлюков основала здесь Делийский султанат, а при таких правителях, как Илтутмиш и Ала ад-Дин аль-Хильджи, город стал главной исламской столицей Южной Азии. Сюда, к великим мечетям, рынкам и крепостям стекались учёные и купцы со всего исламского мира, и благодаря этому Дели укрепился в роли центра, который управлял огромной частью субконтинента."
 prague_desc: "Прага, заложенная над излучиной реки Влтавы, превратилась из славянского поселения на мелководье в один из величайших городов средневековой Европы. Династия Пржемысловичей возвела свой замок и собор на скалистом мысе Градчан, и под их сенью расцвёл многолюдный купеческий город. Прага служила резиденцией богемских королей и находилась на перепутье между востоком и западом Европы, привлекая немецких и еврейских купцов, ремесленников и учёных. К началу XIV века она стала одним из самых многолюдных и богатых городов к северу от Альп."
 vienna_desc: "Римляне называли Вену #italic Виндобоной#! — это была крепость легионеров на Дунае, стоявшая на страже северных рубежей империи. Когда Великое переселение народов смело римские порядки, город воспрял уже как резиденция маркграфов Бабенбергов, которые на том же самом стратегическом рубеже выстроили город под стать своим амбициям. А когда в 1278 году Габсбурги сменили Бабенбергов, Вена стала оплотом династической империи. Благодаря своему расположению в сердце дунайской долины город стал одной из важнейших стратегических опор Священной Римской империи."
 baghdad_desc: "В 762 году аббасидский халиф Аль-Мансур основал на западном берегу реки Тигр город, который с самого начала задумывался как центр всего мира. В его центральной крепости — легендарном Круглом городе — разместились дворец халифа и великая мечеть, а рынки и жилые кварталы расходились от него лучами. На пике аббасидского могущества в Багдаде проживало больше миллиона человек, а в его Дом мудрости стекались учёные со всего известного мира — переводить книги, участвовать в спорах и совершать открытия. Нашествие монголов в 1258 году положило конец этому золотому веку, но город выстоял, оставшись величайшей метрополией между Тигром и Евфратом."
 florence_desc: "Флоренция раскинулась по обоим берегам Арно в самом сердце Тосканы и прошла путь от римской колонии до города купцов и банкиров, перекроивших европейскую торговлю. Великие банковские дома — Барди, Перуцци, Строцци — выдавали кредиты многим королевствам, а золотой флорин их чеканки стал общепризнанной валютой для международных сделок. Флоренция, которую раздирала вражда #italic гвельфов#! и #italic гибеллинов#! и которой управляли могущественные гильдии, была городом кипучей гражданской гордости и неслыханных богатств. Всё это закладывало почву для расцвета искусств и мысли, который вскоре заставит весь мир ей завидовать."
 samarkand_desc: "Самарканд, один из древнейших городов Центральной Азии, раскинулся в самом сердце Шёлкового пути — там, где караваны с шёлком, пряностями и идеями шли от Китая до Средиземноморья. При Саманидах и Караханидах он стал крупным исламским центром учёности и ремесла, а его мастера славились во всём известном мире своей тонкой работой по металлу и выделкой бумаги. Армии Чингисхана опустошили город в 1220 году, но выгодное расположение на великих торговых путях не дало ему зачахнуть — и базары с мастерскими вновь притягивают к себе половину всей мировой торговли."
 novgorod_desc: "Господин Великий Новгород, как с гордостью величали его сами горожане, превратился из варяжского торгового стана на Волхове в самую могущественную купеческую республику северной Европы. Его выборное собрание, #italic вече#!, руководило городом на демократических принципах, что было редкостью в феодальном мире, а ганзейские торговые партнёры везли новгородские меха, воск и янтарь на рынки от Лондона до Любека. Когда прочие русские города пали под монгольскими набегами 30-х годов XIII века, северное расположение уберегло Новгород, позволив ему сохранить статус богатейшего и самого независимого города Руси."
 lisbon_desc: "Лиссабон расположился в естественной гавани, где Тахо встречается с Атлантикой, и служил приютом для мореходов и купцов ещё со времён финикийцев. Римляне укрепили его и нарекли именем #italic Олисипо#!, а в VIII веке мавританские правители превратили город в цветущий калейдоскоп мечетей и дворцов. Когда в 1147 году Афонсу I при поддержке рыцарей-крестоносцев отвоевал его, Лиссабон стал столицей зарождающегося Португальского королевства и жизненно важным атлантическим портом. Его глубокая гавань и обращённость на запад уже тогда побуждали исследовать неведомый океан, который уходил далеко за горизонт."
 sevilla_desc: "Севилья раскинулась по берегам Гвадалквивира на плодородных равнинах Андалусии, став одной из жемчужин мавританской Испании. При Омейядах, а позже при Альмохадах она развивалась как центр культуры, науки и торговли, а её великая мечеть возносилась над рекой как настоящее свидетельство размаха исламской цивилизации на иберийской земле. В 1248 году Фердинанд III Кастильский отвоевал Севилью, но она сохранила свой многонациональный колорит и стала богатейшим городом христианской Испании, чей речной порт отправлял щедрые дары Андалусии в большой мир."
 hangzhou_desc: "Известный в пору своего расцвета как #italic Кинсай#! — «временная столица», — город Ханчжоу стал обителью южной династии Сун когда в 1127 году север пал под натиском чжурчжэньского государства Цзинь. Марко Поло, посетивший город в конце XIII века, назвал его величайшим городом в мире, особенно отметив каналы, рынки шёлка и просторные площади, где люди то и дело обменивались самыми разными товарами. Даже после монгольского завоевания в 1279 году, благодаря расположению у истоков Великого канала и владычеству над торговлей шёлком и фарфором, город выстоял и остался одним из важнейших во всём Китае."
 bruges_desc: "Во времена расцвета средневековой торговли Брюгге был величайшим рынком Северной Европы — к его причалам стекались венецианские галеры, ганзейские когги и иберийские каравеллы, чтобы освободить свои трюмы от груза. Брюгге был основан у приливной бухты, связывающей город с Северным морем, и обзавёлся суконными рядами и собственной биржей — как полагают, первой в мире, — что сделало его финансовой столицей севера. От английской шерсти до левантийских пряностей — богатства всего известного мира текли сквозь его каналы и купеческие конторы."
 cologne_desc: "Кёльн был основан римлянами в 50 году нашей эры как #italic Колония Агриппина#!, а впоследствии вырос в крупнейший город средневековой Германии и одно из самых могущественных архиепископств Священной Римской империи. Его великолепный готический собор, заложенный в 1248 году для хранения мощей Трёх королей, стал символом веры и амбиций. Кёльн был вольным имперским городом и одним из основателей Ганзейского союза. Он властвовал над важным рейнским торговым путём и служил вратами между Северным морем и сердцем империи."
 bursa_desc: "Бурса, укрытая под склонами Вифинского Олимпа, была процветающим византийским городом, пока в 1326 году османский вождь Орхан не покорил её после десятилетней осады. Орхан сделал Бурсу первой настоящей столицей османского государства: возвёл там мечети, караван-сараи и крытый базар, на века определившие облик города. Бурса служила западным пределом для караванов Шёлкового пути с Востока, но и сама производила тончайшие в мире шёлка, что сделало её городом несметных богатств — и тем самым семенем, которое вскоре даст жизнь Османской империи."
 kyoto_desc: "Когда в 794 году император Камму перенёс сюда двор и нарёк новую столицу #italic Хэйан-кё#! — Столицей мира и покоя, — город Киото на сотни лет стал сердцем японской цивилизации. Сеть широких улиц, усыпанная аристократическими усадьбами и буддийскими храмами, стала домом для самой утончённой придворной культуры тех времён, подарив миру поэзию, живопись и литературу эпохи Хэйан. Междоусобные войны, пожары и возвышение самураев не раз сотрясали стены города, однако он выстоял, став императорской столицей и культурным средоточием Японии."
 timbuktu_desc: "Тимбукту расположился у самой кромки Сахары, в излучине Нигера, и вырос из сезонного туарегского лагеря в один из величайших средневековых городов Африки. Во времена империи Мали он стал центром транссахарской торговли: здесь северные караваны с солью пересекались с золотом и слоновой костью, шедшими с юга. Мечети и #italic медресе#! города привлекали исламских учёных со всего континента, превратив Тимбукту в обитель знаний, чьи библиотеки хранили десятки тысяч рукописей по богословию, математике и астрономии."
 barcelona_desc: "Барселона была основана в I веке до нашей эры как римская колония #italic Барцинон#! и со временем стала столицей графства Каталония, а к XII веку — морским центром Арагонской короны. Барселонское влияние купеческих флотилий и консульств простиралось от Балеарских островов до Сицилии и от Сардинии до портов крестоносцев в Греции, что сделало этот город главенствующей морской силой Западного Средиземноморья. На холмах под великим собором и древними римскими стенами кипела городская торговля — и люди всё чаще обращали взор к морю в поисках богатства и предназначения."
 cordoba_desc: "В свой золотой век Кордова была величайшим городом Западной Европы с мощёными улицами и общественными банями, став домом для полумиллиона человек. Её сеть библиотек превосходила любые аналогичные достижения христианского мира. При Абд ар-Рахмане III, провозгласившем себя халифом в 929 году, она стала столицей халифата, бросившего вызов и Аббасидам в Багдаде, и Каролингам на севере. Здесь жили такие мыслители, как Ибн Рушд и Маймонид, а Великая мечеть — #italic Мескита#! — стала памятником той необычайной цивилизации, которая пустила корни на иберийской земле. Взятие города Фердинандом III Кастильским в 1236 году положило конец этой эпохе, но её наследие уцелело — в тех знаниях, которые Кордова сберегла и передала остальному миру."
 damascus_desc: "Дамаск — один из древнейших городов, в котором на протяжении всей его истории всегда жило много людей. Он господствует над плодородным оазисом у подножия хребта Антиливан, а его рынки питаются водами реки Барада. В VII и VIII веках Дамаск был столицей Омейядского халифата — сердцем крупнейшей на тот момент империи, и его Великая мечеть олицетворяла одно из величайших достижений исламской архитектуры. Даже после того, как Аббасиды сделали столицей Багдад, Дамаск оставался одним из главных торговых и культурных центров Леванта, на базарах которого торговали шёлком, тонкими клинками и благоуханными розами, которыми он особенно славился."
 angkor_desc: "В глубине лесов материковой Юго-Восточной Азии кхмерские цари Ангкора воздвигли столицу, равной которой мир ещё не знал. Грандиозный храмовый комплекс Ангкор-Ват был заложен при Сурьявармане II в начале XII века, был посвящён Вишну и задумывался как земной прообраз мироздания: его рвы изображали космический океан, а башни — вершины священной горы Меру. В пору расцвета в Ангкоре и окрестностях была создана сложная сеть водохранилищ и оросительных каналов, благодаря чему он стал одним из самых обширных городских образований доиндустриального мира."
 vijayanagar_desc: "В 1336 году на южном берегу реки Тунгабхадра братья Харихара и Букка Рая основали Виджаянагар — «Город победы», призванный стать оплотом индуистской цивилизации против растущей мощи Делийского султаната. Под защитой Тунгабхадры и неприступного ландшафта из гранитных валунов и скалистых ущелий город уже на заре своего становления властвовал над плодородными равнинами Центрального Декана. Впоследствии из этой каменной твердыни вырастет империя, которая простоит больше двух столетий, а купцы на её рынках будут торговать товарами со всего Индийского океана."
 naples_desc: "Неаполь был основан около 600 года до нашей эры как греческая колония на берегу живописной бухты. Он успел побывать в руках римлян, византийцев, норманнов и Гогенштауфенов, прежде чем Анжуйская династия в 1266 году сделала его столицей Неаполитанского королевства. При Анжуйцах Неаполь превратился в один из величайших королевских дворов средневековой Европы и самый многолюдный город Италии, а через его порт богатство Меццоджорно отправлялось в большой мир. Неаполитанский двор привлекал учёных, художников и богословов, в частности — Фому Аквинского, который здесь преподавал и здесь же окончил свои дни. Всё это сделало город средоточием не только династической власти, но и культуры."
 milano_desc: "Милан зародился в сердце Паданской равнины как поселение кельтов, но память об этом стёрлась, когда римляне превратили его в #italic Медиолан#!, который одно время фактически служил столицей западной империи. Нашествия варваров ударили по его величию, но позже город расцвёл уже в качестве вольной коммуны, отразив нападение Фридриха Барбароссы и его имперских армий в битве при Леньяно в 1176 году. Под властью рода Висконти, который захватил синьорию в конце XIII века, Милан начал подчинять себе окрестные города Ломбардии, пока не превратился в господствующую державу Северной Италии."
 genoa_desc: "Под надёжной защитой дуги Лигурийских Апеннин Генуя выстроила своё величие, связав его со стихией моря. Местные купцы и адмиралы выстроили морскую державу — сеть факторий и колоний от Чёрного моря до Атлантики — а её флотилии её вновь и вновь сталкивались с венецианскими, оспаривая господство над средиземноморской торговлей. Неукротимое честолюбие великих семейств Дориа, Гримальди и Спинола принесло республике гордое прозвание #italic La Superba#! — «Великолепная» — и доказало, что даже город, у которого почти нет своей земли, может стать одним из самых богатых и влиятельных в христианском мире."
 bologna_desc: "Болонья располагается у подножия Апеннин, там, где Эмилиева дорога встречается с путями, ведущими на север, к Паданской равнине. Она выросла из этрусской #italic Фельсины#!, а позже — римской колонии #italic Бононии#!. Но прежде всего этот город знаменит своим университетом, основанным в 1088 году, — старейшим в мире. В его лекционные залы под двумя средневековыми башнями-близнецами со всех концов Европы стекались студенты, чтобы изучать право, медицину и философию. Богатство купцов, власть епископов и независимость городской коммуны делали Болонью одним из самых желанных городов в политической борьбе средневековой Италии."
 palermo_desc: "На северном побережье Сицилии, между двумя мысами, финикийские торговцы основали Палермо. При карфагенянах и затем при византийцах он вырос в большой город, а после завоевания арабами в IX веке превратился в цветущую исламскую метрополию с мечетями, садами и базарами. Нормандские короли, отвоевавшие город у арабов в 1072 году, возвели на этом многонациональном фундаменте нечто поразительное: сплавив воедино арабские, византийские и латинские традиции, они явили миру сверкающие королевские капеллы и дворцы — этой цивилизации не было равных в христианском мире. Став столицей нормандского королевства Сицилия, а затем и империи Гогенштауфенов, Палермо превратился в один из самых утончённых и могущественных королевских дворов средневековья."
 verona_desc: "Верона, раскинувшаяся по обоим берегам реки Адидже у южных отрогов Альп, с Античности была тем городом, куда ведут все дороги. Её громадный римский амфитеатр — один из крупнейших и лучше всего сохранившихся — по-прежнему возвышается над улицами, которые некогда делили легионеры и купцы. Под властью семейства делла Скала, или Скалигеров, захвативших город в конце XIII века, Верона стала одной из сильнейших синьорий Северной Италии: её правители властвовали над Венето и простёрли свою длань до самой Адриатики. Среди тех, кто нашёл приют при дворе Скалигеров, был и Данте Алигьери — свою #italic «Комедию»#! он завершил под покровительством Кана Гранде делла Скала за долгие годы флорентийского изгнания."
 siena_desc: "Сиена выросла на трёх холмах в самом сердце Тосканы и стала одной из великих держав средневековой Италии. Её богатство строилось на банковском деле и торговле шерстью: купеческие семьи города служили кредиторами и королям, и папам. Яростное соперничество с Флоренцией — до неё было едва ли пятьдесят километров к северу — годами влияло на историю обоих городов. А главная площадь Сиены, Кампо, служила подмостками для гражданской жизни и политических драм одной из самых гордых итальянских коммун. Творения Дуччо ди Буонинсеньи и братьев Лоренцетти превратили Сиену в один из ведущих центров готического искусства в Европе."
 pisa_desc: "В устье реки Арно пизанцы построили одну из величайших морских держав средневекового Средиземноморья. Флотилии Пизы грабили Палермо в 1063 году, громили сарацинских корсаров по всему Тирренскому морю и создавали торговые колонии от Сардинии до Антиохии. На богатства, хлынувшие от этой торговли, пизанцы возвели на #italic Пьяцца-деи-Мираколи#! — Площади чудес — поразительный ансамбль: собор, баптистерий и колокольню — памятники городу, чьё богатство и могущество в XII веке, на вершине своей славы, казались поистине безграничными. Катастрофическое поражение от Генуи при Мелории в 1284 году положило конец морским амбициям Пизы, но город и его несравненные памятники сохранились до наших дней."
 padova_desc: "По преданию, Падую основал троянский герой Антенор, и ещё в римскую эпоху она считалась одним из богатейших городов Италии. К Средним векам она стала процветающей коммуной в самом сердце области Венето. В 1222 году группа учёных покинула Болонью и основала здесь собственный университет, который быстро занял первые места среди европейских школ права и медицины, привлекая сюда студентов со всего континента. В начале XIV века прославленный художник Джотто преобразил интерьер Капеллы дель Арена и создал памятник, который стал вехой западного искусства, а сама Падуя под властью рода Каррара расцвела как двор, где учёность шла рука об руку с честолюбивыми замыслами."
 ferrara_desc: "Феррара, выросшая у берегов болотистой дельты По, прошла путь от скромной речной переправы до города, чей облик определили амбиции дома Эсте — они утвердились здесь как синьоры в XIII веке. Под их долгим покровительством город стал средоточием рыцарской культуры и утончённой придворной жизни: синьоры принимали здесь поэтов, устраивали турниры и учёные диспуты, проводя осторожную политику в условиях соперничества Милана, Венеции и папских владений. Широкие прямые улицы и внушительный замок Эсте, ставшие отличительной чертой Феррары, подчёркивали облик города, где порядок и изящество значили не меньше, чем стены и войска."
 parma_desc: "Римляне основали Парму на Эмилиевой дороге в 183 году до нашей эры, и со временем она стала одним из величайших городов Ломбардской равнины. Расположение на большой дороге между Миланом и Болоньей, а также тучные окрестные поля сделали её неизменно процветающим и желанным городом. В качестве вольной коммуны она вошла в число самых деятельных членов Ломбардской лиги, выступившей против Фридриха Барбароссы. Долгие годы город раздирала ожесточённая вражда гвельфов и гибеллинов, и он не раз переходил из рук в руки сменявших друг друга синьоров. Кафедральный собор и баптистерий, возведённые в романском стиле XII века, олицетворяли гражданское благочестие и богатство, которым суждено было пережить все политические потрясения коммунальной эпохи."
 mantova_desc: "С трёх сторон Мантую окружают озёра, рождённые неторопливым течением Минчо, — на севере Италии найдётся немного мест, столь же надёжно защищённых самой природой; люди селились здесь ещё с бронзового века. Римляне чтили её как родину Вергилия, величайшего из их поэтов, и судьба города с давних пор была неразрывно связана с художественными и литературными устремлениями его правителей. К началу XIV века здесь возвысился род Гонзага, и под их долгим покровительством Мантуе предстояло вырасти в один из самых утончённых и просвещённых дворов Италии."
 lucca_desc: "Лукка, опутанная древнеримской сетью улиц и окружённая богатыми шёлковыми угодьями в области Гарфаньяна, была одним из богатейших городов средневековой Италии. Её купцы рассеялись по всей Европе: их банкирские дома и торговля шёлком сделали слово #italic «лукканский»#! синонимом самого изысканного сукна на рынках Парижа, Лондона и Брюгге. А в самом городе между тем копились богатства, которых хватило на возведение самых величественных романских церквей во всей Тоскане. Хотя Пиза и Флоренция не раз угрожали Лукке, она отстаивала свою независимость с поразительным упорством — крепкие стены и яростная гражданская гордость обеспечивали ей свободу ещё долго после того, как города-соперники угодили под власть синьоров."
 messina_desc: "Греческие колонисты, основавшие город на берегу узкого пролива между Сицилией и итальянским материком, назвали его #italic Занкла#! — в честь изогнутой серпом гавани. Уже тогда расположение сделало Мессину одним из важнейших стратегических портов Средиземноморья. Именно через Мессину в 1061 году нормандцы начали завоевание Сицилии, и впоследствии через её гавань шли армии всех последующих эпох — анжуйские и гогенштауфенские; даже армии крестоносцев на пути в Святую землю пересекали здесь границу между востоком и западом. Землетрясения и политические склоки не раз опустошали город, но благодаря исключительной природной гавани он неизменно возвращался к жизни, в равной мере притягивая к этим берегам и торговцев, и захватчиков."
 brescia_desc: "Брешиа расположилась там, где альпийские предгорья спускаются к Ломбардской равнине. В средневековой Италии этот город входил в число главных производственных городов: его кузницы на всю Европу славились оружием и доспехами превосходного качества. Как вольная коммуна Брешиа была одной из самых деятельных участниц Ломбардской лиги, а мужество, с которым её жители давали отпор имперским армиям, легло в основу традиций Северной Италии. Брешиа была зажата между амбициозными Миланом и Венецией, но оставалась желанным городом для обеих сторон благодаря расположению возле альпийских перевалов и мастерству своих ремесленников."
 cremona_desc: "Римляне основали Кремону как приграничную колонию в 218 году до нашей эры на южном берегу реки По, и со временем она превратилась в один из величайших городов Ломбардской равнины. Расположение на реке сделало город естественным перекрёстком сухопутных и водных торговых путей, связывавших восток с западом. Во время ожесточённых войн между императорами и папами Кремона стала олицетворением непоколебимой верности гибеллинам; город дорого платил за свою преданность, но взамен получал необычайную императорскую милость и немалые богатства. Над его улицами возвышается величественный #italic Торраццо#! — самая высокая средневековая колокольня во всей Италии — и многочисленные башни соперничавших друг с другом семейств. Этот ансамбль воплощает собой бурную гражданскую гордость: власть здесь демонстрировали с тем же неукротимым пылом, с каким и проявляли."
 pavia_desc: "В течение двух веков после падения Рима Павия оставалась столицей Лангобардского королевства в Италии — обителью воинственных королей и хранительницей их железной короны. Для каролингских императоров этот город служил итальянской резиденцией, но город сохранил статус королевского и коронационного центра даже после того, как лангобардские земли поглотила Франкская империя. Университет Павии, один из старейших в Италии, процветал уже к IX веку. А положение на реке Тичино, которая запирает подступ с запада к Паданской равнине, превращало город в желанный трофей для всякой державы, стремившейся к господству на севере."
 perugia_desc: "Перуджа высится на холме над долиной верхнего Тибра. В древности она была одним из двенадцати городов Этрурии, позже стала процветающим римским муниципием, а в Средние века превратилась в одну из самых грозных и беспокойных независимых коммун Центральной Италии. Величественный дворец Палаццо-дей-Приори и фонтан Маджоре, увенчанные в 1278 году скульптурами Никколо и Джованни Пизано, воплотили гражданскую гордость и художественные амбиции, которым не было равных во всей Тоскане. А основанный здесь в 1308 году университет подтвердил желание Перуджи увенчать свою военную и политическую мощь не менее громкой учёной славой."
 ancona_desc: "Изгнанники из Сиракуз, высадившись на Адриатическом побережье, основали Анкону как греческую колонию. Своим именем город обязан греческому слову «локоть» — оно напоминает о круто изогнутом мысе, который с севера прикрывает гавань от ветров. В Средние века Анкона стала важнейшим портом Центральной Адриатики, а её купцы вели оживлённую торговлю с византийским Константинополем и портами Леванта. Сколько ни пытались папы и императоры подчинить город своей воле, Анкона яростно отстаивала независимость, а её гавань и флот служили гарантами свободы, которую здесь рьяно оберегали на протяжении веков."
 aquila_desc: "Л’Акуила — один из самых молодых великих городов средневековой Италии. Его основали примерно в 1254 году, объединив почти сотню деревень Абруццкого нагорья. Говорят, что каждое селение пожертвовало новому городу церковь, фонтан, район и колокол. Город расположился высоко в Апеннинах, в самом сердце горного королевства, и удивительно быстро стал столицей Абруццо. Выгодное расположение и мощные стены надёжно оберегали его от притязаний враждующих синьоров и козней далёкого неаполитанского двора. Обстоятельства появления наделили Л’Акуилу необычайно сложным укладом. Почти сотня общин-основательниц сохранила за собой частицу городского самосознания — отсюда та причудливая многоликость и неукротимая местная гордость, какой не мог похвастаться ни один город на юге Италии."
 ravenna_desc: "Всего один краткий, но поразительный век Равенна побвала последней столицей Западной Римской империи. Когда в 476 году Рим пал, именно здесь, при дворах Одоакра, а затем короля остготов Теодориха, старательно поддерживались формы и традиции римской власти. Когда Византия в VI веке отвоевала город, он стал западным форпостом Константинополя и резиденцией Равеннского экзархата. Именно в эту эпоху греческого владычества местные мастера создали изумительные мозаичные узоры, которыми наполнены церкви и мавзолеи города. Позднее Равенну затмили Болонья и набиравшие силу города Паданской равнины, но в своих необыкновенных произведениях искусства она сберегла память об имперском величии, равного которому не сыскать больше нигде на латинском Западе."
 salerno_desc: "Город Салерно расположился между морем и горами Амальфитанского побережья, в укромной бухте. Когда в 1076 году нормандский завоеватель Роберт Гвискар захватил город, Салерно стал первой крепостью нормандской власти на юге Италии и служил столицей, пока королевский двор не перебрался в Палермо. Основную славу городу принесла #italic Салернская врачебная школа#! — старейшая в Европе. Начиная с IX века она достигла расцвета и вобрала в себя греческую, арабскую и латинскую врачебную традицию, которые сходились на этом многонациональном южном побережье. Врачи, обученные в Салерно, разъезжались по всему континенту, а труды школы по анатомии, хирургии и лечению травами определили облик медицинской практики на всём средневековом Западе."
 syracuse_desc: "Коринфские поселенцы в 734 году до нашей эры основали город на маленьком островке у входа в обширную гавань. Так возникли Сиракузы — со временем им суждено было стать самой могущественной греческой державой на западе Средиземноморья. О военной мощи города красноречиво свидетельствовал сокрушительный разгром афинской экспедиции в 415–413 годах до нашей эры. Именно здесь Архимед изобрёл свои легендарные боевые машины, с помощью которых город долго сопротивлялся римским армиям. Сменявшие друг друга завоеватели — карфагеняне, римляне, византийцы, арабы и норманны — неизменно приходили к одному и тому же выводу: такая гавань слишком ценна, чтобы не попытаться её занять. Палермо давно оттеснил Сиракузы на второй план, и всё же город до сих пор является величайшим центром Юго-Восточной Сицилии. Его древняя гавань и высеченные в камне улицы по сей день хранят память о цивилизации, чей ослепительный блеск когда-то задавал тон всему античному Средиземноморью."
 trebizond_desc: "Трапезунд ютится на узкой береговой полосе, зажатой между Понтийскими горами и Чёрным морем, — в средневековом мире трудно было сыскать город с более впечатляющим расположением. Когда в 1204 году Константинополь пал под натиском Четвёртого крестового похода, отпрыски династии Комнинов бежали сюда и основали Трапезундскую империю. Она ещё долго сохраняла независимость как греческое христианское государство после того, как рухнула сама Латинская империя. Во власти города находилась восточная оконечность черноморского торгового пути и горные перевалы, ведущие в Армению и Персию. Сюда хлынули генуэзские купцы, и Трапезунд стал процветающим западным пределом Шёлкового пути, а на его рынках можно было найти товары из Центральной Азии и даже ещё более далёких краёв."
 smyrna_desc: "Смирна — один из древних городов Эгейского побережья. Она боролась за честь называться родиной Гомера, а позднее вошла в число семи церквей Малой Азии, к которым обращено Откровение Иоанна Богослова. Под властью Византии город служил крупным портом: он связывал богатые анатолийские земли с торговыми путями Эгеиды. В его гавани часто бывали венецианские и генуэзские купцы, основавшие вдоль берегов собственные торговые колонии. В конце XIII — начале XIV века Смирна часто переходила из рук в руки — византийцев, генуэзцев, айдынских тюрков. Исключительно выгодное положение делало город желанным трофеем, мимо которого не могла пройти ни одна держава Эгейского моря."
 konya_desc: "Конья раскинулась на высоком плато Центральной Анатолии. В XII–XIII веках она служила столицей Румского султаната — тюркского государства, господствовавшего в Анатолии. При сельджукских султанах город расцвёл как центр исламского искусства, архитектуры и учёности. Его украшенные изразцами мавзолеи и медресе превратили древний город на плато в один из величайших культурных очагов средневекового исламского мира. Именно здесь поселился и умер поэт-суфий Джалаладдин Руми. Здесь же его последователи основали суфийский орден Мевлеви — дом кружащихся дервишей, чьи музыка и обряды прославили город далеко за пределами Анатолийского плато."
 sivas_desc: "Сивас расположился на высоком плато, где сходятся главные пути между Анатолией и Персией. В средневековом мире Ближнего Востока это был один из величайших городов-перекрёстков. При Румском султанате он вырос в крупный провинциальный центр, чьи правители не скупились на архитектурные замыслы. Великие медресе XIII века — в первую очередь знаменитые Гёк медресе и Медресе с двумя минаретами — по сей день считаются вершиной сельджукского каменного зодчества в Анатолии. После монгольского завоевания город превратился в ключевой административный центр анатолийских провинций Ильханата. Через его рынки и караван-сараи шёл нескончаемый поток товаров, связывавший Центральную Азию со Средиземноморьем."
 kayseri_desc: "Кайсери, в древности известный римлянам как #italic Цезарея Мазака#!, был главным городом древней Каппадокии. Веками он служил вратами, откуда пути с Анатолийского плато расходились на восток, к Армении и Месопотамии. Город стал одним из древнейших очагов христианства в Малой Азии. Здесь родился святитель Василий Великий, чьи богословские труды и монашеский устав определили облик Восточной церкви и по сей день во многом определяют христианскую жизнь. При Сельджуках и их преемниках город заполнили мечети, медресе и караван-сараи. Положение на перекрёстке анатолийских торговых путей повлекло за собой не одну смену властителей: Кайсери успел побыть во власти византийцев, Данышмендидов, Сельджуков и монголов, и каждый новый хозяин осознавал, каким сокровищем он завладел."
 izmit_desc: "Этот город заложил в III веке до нашей эры вифинский царь Никомед I, и римлянам он был известен под именем #italic Никомедия#!. При Диоклетиане она служила восточной столицей империи: император избрал Никомедию своей резиденцией и превратил в административный центр восточных провинций. Именно отсюда в 303 году он начал Великое гонение на христиан — главную церковь города, которую было видно из императорского дворца, снесли, и на веру обрушился последний, самый жестокий удар римской власти. Позже, когда по другую сторону пролива возник Константинополь, этот новый сосед постепенно затмил Никомедию. Однако этот город на протяжении столетий византийского правления оставался важным крупным портом и епископальным центром."
 ankara_desc: "Анкара высится на скалистом холме в центре Анатолийского плоскогорья. Задолго до римлян это был древний галатский город, и лишь позже римляне сделали его главным центром провинции Галатия. Стратегическое положение Анкары на пересечении путей из Константинополя, с берегов Чёрного моря, а также из Леванта и Персии, поддерживало военное и торговое значение этого города. В Анкаре воздвигли величественный храм в честь императора Августа, и сохранившиеся там письмена входят в число важнейших дошедших до нас памятников римской истории. Под властью Данышмендидов, румских сельджуков, а затем и монголов Анкара оставалась важнейшим поселением Анатолийского плоскогорья. Владение этим городом означало контроль над всеми пролегавшими через него путями."
 amasya_desc: "В Понтийских горах река Ешильырмак пробила глубокое ущелье, и в нём укрылась Амасья — царская столица древнего Понтийского царства и родина географа Страбона. В своём знаменитом труде «География» он с любовью и старанием описал родной город. Эффектное расположение Амасьи подчёркивали вырубленные прямо в скальных обрывах над рекой царские гробницы. Они стали воплощением величия эллинистического царства, которое в период своего расцвета властвовало над большей частью Малой Азии. Под властью византийцев, Данышмендидов, сельджуков и монголов город не переставал быть главным центром Понтийских предгорий. Глубокое ущелье и окружающие горы превратили его в одну из самых неприступных крепостей Северной Анатолии."
 rodos_desc: "На протяжении большей части Античности Родос оставался богатейшим и самым многонациональным портом Восточного Средиземноморья. У входа в гавань некогда высился легендарный Колосс — одно из семи чудес древнего мира. Торговля во всех известных тогда морях подчинялась #italic Lex Rhodia#! — Родосскому морскому закону. После столетий римского, византийского и арабского владычества остров в 1309 году перешёл к рыцарям-госпитальерам, и те превратили его в одну из самых мощных христианских крепостей Восточного Средиземноморья. При госпитальерах Родос с его массивными стенами стал оплотом могущества крестоносцев, а их галерные флотилии охраняли морские пути между христианским миром и исламским Востоком."
 corinth_desc: "Коринф контролирует как узкий сухопутный проход между материковой Грецией и Пелопоннесом, так и древний маршрут через перешеек. Благодаря этому он стал одним из самых богатых и стратегически важных городов древнегреческого мира. В эпоху своего расцвета Коринф безраздельно господствовал над торговлей между Эгейским и Адриатическим морем, взимая пошлины с товаров, которые по земле перевозились из одной гавани в другую. Бронзовые изделия и расписная керамика из коринфских мастерских расходились по всему Средиземноморью. В 146 году до нашей эры римский полководец Луций Муммий стёр город с лица земли, однако позже Юлий Цезарь возродил Коринф уже в качестве римской колонии. Он оставался крупным центром, перейдя из рук византийцев к латинянам, а затем к франкам, и всякий новый властитель быстро осознавал, в какой выгодной точке находится этот город."
 candia_desc: "В 1204 году Четвёртый крестовый поход сокрушил Византийскую империю, и Венеция завладела Критом, сделав Кандию его столицей. За следующее столетие город превратился в один из самых стратегически важных венецианских форпостов Восточного Средиземноморья. Плодородные равнины острова кормили и венецианский флот, и различные колонии, а гавань Кандии служила важнейшим пунктом для пополнения припасов на морских путях между Венецией и Левантом. Хотя критское население не раз поднимало восстания против венецианских господ, сам город неуклонно укреплялся и богател. Его стены и склады рисовали облик колониальной державы, которая намеревается удерживать Крит вечно."
 edirne_desc: "Римский император Адриан основал город на берегу реки Марицы и нарёк его в свою честь #italic Адрианополем#!. Этот город охранял главный путь, который связывал Константинополь с дунайской границей, и служил ключевым военным и административным центром обороны Фракии. Именно здесь в 378 году вестготская конница сокрушила легионы императора Валента в одном из самых судьбоносных сражений древности. Из-за этого поражения германские народы начали расселяться в пределах империи, что приблизило окончательный крах Западного Рима. При византийцах Адрианополь оставался главенствующим городом Фракии и по традиции служил передовым рубежом обороны Константинополя от угроз с запада."
 ioannina_desc: "Янина раскинулась на скалистом полуострове, вдающемся в одноимённое горное озеро. Это был главный город Эпирского деспотата — греческого государства-преемника, возникшего на северо-западе Греции после того, как Четвёртый крестовый поход в 1204 году сокрушил византийскую державу. При эпирских деспотах Янина из скромного провинциального городка превратилась в важный очаг греческой культуры и сопротивления. Её природную защиту дополняли мощные стены, а озеро давало и пропитание, и надёжное укрытие. Горный ландшафт Эпира в равной мере дарил городу безопасность и обособленность. Янина служила жизненно важным бастионом и опорой для греческой христианской цивилизации на беспокойных северо-западных землях бывшей империи."
 tarnovo_desc: "Тырново расположился на трёх холмах в излучине реки Янтры. В 1185 году братья Асень и Пётр подняли великое восстание против византийской власти, и город стал столицей Второго Болгарского царства. При династии Асеней он стал одной из самых грозных крепостей на Балканах. На холме Царевец высились царский дворец и Патриарший собор — символы державы, которая в пору своего расцвета в XIII веке простиралась от Дуная до Эгейского моря. Позже, когда царство ослабело под натиском монголов, Тырново остался столицей маленькой, но гордой Болгарии. Его стены и память о царском прошлом даже сотню лет спустя определяли облик и дух города."
 dubrovnik_desc: "Дубровник приютился под известняковыми утёсами далматского берега. Византийцы основали его как убежище, а со временем этот город превратился в одно из самых процветающих и преуспевших в дипломатии малых государств средневекового Средиземноморья. Став республикой Рагуза, он ловко лавировал между давлением Венеции, Венгрии, Сербии и других набиравших силу держав. Где требовалось, Рагуза платила дань, но при этом выстроила сеть купеческих консульств, протянувшуюся от Фландрии до Леванта. Рагузские купцы развозили товары и деньги по всем рынкам известного мира, а за массивными стенами рос изящный каменный город. Сам его облик возвещал о то, что местные жители делают ставку на торговлю и осмотрительную дипломатию, а не на дорогостоящую войну."
 sredets_desc: "Римляне называли этот город #italic Сердикой#! — он был главным в провинции Средиземная Дакия. На момент, когда болгары превратили будущую Софию в один из областных центров своей державы, у неё уже была богатая история. Именно в Сердике император Константин созвал собор 343 года — один из важнейших синодов раннего христианства. Поговаривали, что здесь он впервые задумался о том, чтобы основать новую столицу империи, прежде чем остановил выбор на берегах Босфора. Под властью Византии, а затем и Болгарского царства город оставался ключевым перекрёстком главных дорог на Балканах. Он примостился у самого подножия горы Витоша — такое расположение сделало его заветным трофеем в череде завоеваний, но и позволило пережить каждую смену хозяев."
 ohrid_desc: "Охрид раскинулся на берегу древнего озера, подарившего городу имя. Его возвышение началось в конце IX века, когда святой Климент — ученик просветителей Кирилла и Мефодия — основал здесь знаменитую школу славянской письменности. Её закончили тысячи священников и книжников, овладевших новой славянской грамотой. После крещения Болгарии Охрид стал резиденцией Болгарского патриархата, а позднее — автокефальной Охридской архиепископии, одного из важнейших религиозных центров православного мира. Его холмистые склоны усеяны церквями и монастырями, и город заслуженно прозвали балканским Иерусалимом. Его духовная власть веками направляла христианство южнославянских народов."
 nis_desc: "Римляне знали Ниш как #italic Наиссус#!. Город стоял на главной дороге между дунайской границей и Константинополем — в том самом месте, где сходятся долины рек Моравы и Нишавы. Это делало его одним из самых стратегически важных городов древних Балкан. Именно здесь примерно в 272 году нашей эры родился император Константин Великий — сын западных Балкан, которому предстояло преобразить Римскую империю и будущее западной цивилизации. Город не раз опустошали гунны Аттилы и другие завоеватели, но расположение на перекрёстке путей позволяло ему возрождаться снова и снова. Под властью Византии, Болгарии и Сербии Ниш оставался ключевым узлом центральных Балкан."
 durres_desc: "Дуррес — один из древнейших городов Европы. Его основали примерно в 627 году до нашей эры как греческую колонию Эпидамн выходцы из Коринфа и Корфу, а превосходная естественная гавань на восточном берегу Адриатики сразу придала ему важное торговое значение. Римляне называли город #italic Диррахием#! и превратили его в западное окончание Эгнатиевой дороги — великой военной магистрали, которая пересекала Балканы до самого Византия. С тех пор веками каждое войско, выступавшее из Рима на восток, проходило через его ворота. В роли связующего звена между Италией и Балканами, Дуррес стал одним из самых лакомых кусочков во всём регионе. На протяжении Средних веков его гавань и стены без конца переходили из рук в руки — византийцев, норманнов, венецианцев и анжуйских правителей."
 prizren_desc: "Призрен укрылся в плодородной долине у подножия Шар-Планины. Город был основан в незапамятные времена, но настоящий его расцвет начался в XIII веке, когда средневековое сербское государство сделало его одним из своих главных оплотов. При династии Неманичей он превратился в крупный административный и торговый центр. Православные церкви и монастыри города стали выражением благочестия и честолюбия сербских правителей — те видели себя прямыми наследниками византийской цивилизации. К началу XIV века Призрен уже входил в число важнейших городов Сербского королевства. На его рынки съезжались купцы из Дубровника, Венеции и со всего Леванта, чтобы торговать драгоценными металлами, добытыми в окрестных горах."
 belgrad_desc: "Белград стоит у слияния Савы и Дуная, там, где великий путь из Центральной Европы доходит до Балкан. С древнейших времён этот город служил укреплёнными вратами: римляне называли его #italic Сингидунумом#! и держали здесь легион для охраны дунайской границы. В Средневековье город переходил из рук в руки — от болгар к византийцам, затем к венграм. Крепость, венчавшая холм над слиянием рек, превратила Белград в одну из самых желанных твердынь на Балканах. К началу XIV века он стал главным трофеем в борьбе между Венгерским королевством и набиравшим силу сербским государством, а с его стен открывается вид на реки, которые разделяют миры латинского и православного христианства."