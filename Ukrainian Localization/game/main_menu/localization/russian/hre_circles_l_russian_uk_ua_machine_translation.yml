  appeal_to_circle_diet_effect_text_past: "[SCOPE.sCountry('actor').GetName] надісла[SCOPE.sCountry('actor').Custom('end_vlaloly')] запит до райхстагу округу."
  appeal_to_circle_diet_reject_effect_text: "[SCOPE.sCountry('recipient').GetName] відхиля[SCOPE.sCountry('recipient').Custom('end_yeyut')] запит #ONCLICK:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')],X [SCOPE.sCountry('actor').Custom('CL_GEN')|L]#!#!."
  appeal_to_circle_diet_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName] відхили[SCOPE.sCountry('recipient').Custom('end_vlaloly')] запит #ONCLICK:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')],X [SCOPE.sCountry('actor').Custom('CL_GEN')|L]#!#!."
  INCOMING_OFFER_appeal_to_circle_diet: "[SCOPE.sCountry('actor').GetName] запиту[SCOPE.sCountry('actor').Custom('end_yeyut')] фінансову допомогу. У разі згоди ми передамо п’яту частину нашого річного доходу та збільшимо легітимність цієї країни. Відмова знизить вдоволення нашого округу.\n\n$INFO$"
  INCOMING_OFFER_TITLE_appeal_to_circle_diet: "$appeal_to_circle_diet$"
  appeal_to_circle_diet_timeout_tt: "Протягом останніх 2 років жодна країна не використовувала [Concept('diplomatic_action', 'дипломатичну дію')|e] «$appeal_to_circle_diet$»"
  request_circle_infrastructure_expansion: "Прохання про розширення військової інфраструктури"
  request_circle_infrastructure_expansion_desc: "Попросити капітана округу про дозвіл використовувати наші резерви як робочу силу для розширення інфраструктури."
  request_circle_infrastructure_expansion_act: "$request_circle_infrastructure_expansion_desc$"
  request_circle_infrastructure_expansion_effect_text: "[SCOPE.sCountry('actor').GetName] запиту[SCOPE.sCountry('actor').Custom('end_yeyut')] розширення військової інфраструктури."
  request_circle_infrastructure_expansion_effect_text_past: "[SCOPE.sCountry('actor').GetName] запроси[SCOPE.sCountry('actor').Custom('end_vlaloly')] розширення військової інфраструктури."
  request_circle_infrastructure_expansion_reject_effect_text: "[SCOPE.sCountry('recipient').GetName] відмовля[SCOPE.sCountry('recipient').Custom('end_yeyut')] у розширенні військової інфраструктури #ONCLICK:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')],X [SCOPE.sCountry('actor').Custom('CL_GEN')|L]#!#!."
  request_circle_infrastructure_expansion_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName] відмови[SCOPE.sCountry('recipient').Custom('end_vlaloly')] у розширенні військової інфраструктури #ONCLICK:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')],X [SCOPE.sCountry('actor').Custom('CL_GEN')|L]#!#!."
  INCOMING_OFFER_request_circle_infrastructure_expansion: "[SCOPE.sCountry('actor').GetName] запиту[SCOPE.sCountry('actor').Custom('end_yeyut')] розширення своєї армії. У разі нашої згоди країна зможе зосередитися на розбудові доріг та зведенні споруд, що обмежить її військові спроможності протягом найближчих 10 років.\n\n$INFO$"
  INCOMING_OFFER_TITLE_request_circle_infrastructure_expansion: "$request_circle_infrastructure_expansion$"
  request_circle_infrastructure_expansion_timeout_tt: "Протягом останніх 2 років жодна країна не використовувала [Concept('diplomatic_action', 'дипломатичну дію')|e] «$request_circle_infrastructure_expansion$»"
  request_new_circle_titles: "Піднесення країни в окрузі"
  request_new_circle_titles_desc: "Вимагати піднесення становища нашої країни в імперському окрузі."
  request_new_circle_titles_act: "$request_new_circle_titles_desc$"
  request_new_circle_titles_effect_text: "[SCOPE.sCountry('actor').GetName] вимага[SCOPE.sCountry('actor').Custom('end_yeyut')] піднесення."
  request_new_circle_titles_effect_text_past: "[SCOPE.sCountry('actor').GetName] вимага[SCOPE.sCountry('actor').Custom('end_vlaloly')] піднесення."
  request_new_circle_titles_reject_effect_text: "[SCOPE.sCountry('recipient').GetName] відхиля[SCOPE.sCountry('recipient').Custom('end_yeyut')] запит про піднесення #ONCLICK:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')],X [SCOPE.sCountry('actor').Custom('CL_GEN')|L]#!#!."
  request_new_circle_titles_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName] відхили[SCOPE.sCountry('recipient').Custom('end_vlaloly')] запит про піднесення #ONCLICK:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')],X [SCOPE.sCountry('actor').Custom('CL_GEN')|L]#!#!."
  INCOMING_OFFER_request_new_circle_titles: "[SCOPE.sCountry('actor').GetName] вимага[SCOPE.sCountry('actor').Custom('end_yeyut')] свого піднесення в нашому окрузі. Наша згода втішить знать країни та надасть їй престижніше становище.\n\n$INFO$"
  INCOMING_OFFER_TITLE_request_new_circle_titles: "$request_new_circle_titles$"
  request_new_circle_titles_timeout_tt: "Протягом останніх 2 років жодна країна не використовувала [Concept('diplomatic_action', 'дипломатичну дію')|e] «$request_new_circle_titles$»"
  hre_circle_levy_request: "Попросити ополчення в округів"
  hre_circle_levy_request_desc: "Попросити в імперських округів зібрати ополчення для імперії. Очільники округів, які погодяться, отримають винагороду."
  hre_enforce_circle_landfriede: "Встановити в округах земський мир"
  hre_enforce_circle_landfriede_desc: "Уповноважити очільників округів встановлювати на своїх землях земський мир."
  HRE_CIRCLE_LEVY_CIRCLES_ACTIVE: "Діють імперські округи"
  IMPERIAL_CIRCLES_EVENTS_FLAVOR: "Імперські округи"
  imperial_circles.1.title: "Утворено імперські округи"
  imperial_circles.1.desc: "Період створення імперських округів завершено. Окреслено їхні кордони, і очільники округів тепер керуватимуть державними справами. В історії Священної Римської імперії розпочинається нова сторінка."
  imperial_circles.1.a: "На славу Імперії!"
  imperial_circles.2.title: "Брак коштів"
  imperial_circles.2.desc: "Під час нещодавнього райхстагу наш округ підтримав запропоновану реформу імперської конституції. Ця підтримка стала можливою завдяки тому, що учасники нашого округу очікували, що ми як очільник округу розподілимо кошти між ними. Незалежно від того, наскільки виправданими були ці очікування, наша неспроможність виконати їх призвела до кількох скарг на зловживання владою та утримання нами коштів, призначених для учасників округу. Якщо ми проігноруємо ці скарги, у майбутньому це може підірвати наші позиції."
  imperial_circles.2.a: "Вони мають рацію, ми розподілимо кошти."
  imperial_circles.2.b: "Вони помиляються, ми нікого не підкуповували."
  imperial_circles.2.c: "Звернутися до наших друзів у [GetUniqueInternationalOrganization('hre').GetLeaderCountry.Custom('CL_PREP')]."
  imperial_circles.11.title: "Невдоволення в округах"
  imperial_circles.11.desc: "Серед учасників нашого округу зріє невдоволення. Якщо ми нічого не вдіємо, незабаром хтось відкрито кине виклик нашій владі."
  imperial_circles.11.a: "Терміново розподілити кошти серед невдоволених, щоб ті заспокоїлися."
  imperial_circles.11.b: "Нехай скаржаться — у нас є важливіші турботи."
  imperial_circles.12.title: "Князі вимагають змін"
  imperial_circles.12.desc: "Невдоволення в окрузі досягло межі. Учасники відкрито ставлять під сумнів нашу владу. Вибори, схоже, неминучі."
  imperial_circles.12.a: "Треба діяти, поки ще не пізно."
  imperial_circles.20.title: "Наш голос було куплено"
  imperial_circles.20.desc: "[SCOPE.sCountry('actor').GetName] заплати[SCOPE.sCountry('actor').Custom('end_vlaloly')] очільнику нашого імперського округу, #ONCLICK:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')],X [SCOPE.sCountry('target').Custom('CL_DAT')|L]#!#!, за підтримку пропозиції, що розглядається райхстагом. Наша частка склала [SCOPE.GetValue('received_bribe')|0V]@gold!, і наш [Concept('vote', 'голос')|e] підтримуватиме імператора до завершення розгляду поточної резолюції."
  imperial_circles.20.a: "Ми не відмовимося від грошей."
  imperial_circles.50.title: "Виклик очільнику округу"
  imperial_circles.50.desc: "Ми вирішили оскаржити лідерство #ONCLICK:COUNTRY,[recipient.Custom('CL_tt')] #TOOLTIP:COUNTRY,[recipient.Custom('CL_tt')],X [recipient.Custom('CL_GEN')|L]#!#! у нашому імперському окрузі.\n\nМи більше не готові миритися з їхньою слабкістю та байдужістю, і напевно, багато хто буде готовий підтримати нас. Якщо ми зуміємо показати себе кращим і сильнішим очільником, наші вимоги будуть виконані, але в разі невдачі постраждає наша репутація в очах інших країн та нашого народу."
  imperial_circles.50.a: "Наполягти на своєму."
  imperial_circles.50.b: "Відмовитися від виклику."
  imperial_circles.53.title: "Виклик не вдався"
  imperial_circles.53.desc: "Ми програли в боротьбі проти #ONCLICK:COUNTRY,[recipient.Custom('CL_tt')] #TOOLTIP:COUNTRY,[recipient.Custom('CL_tt')],X [recipient.Custom('CL_GEN')|L]#!#! за лідерство в окрузі. Наш престиж виявився недостатньо високим, внаслідок чого постраждала наша репутація. Перш ніж знову кинути виклик, доведеться зачекати."
  imperial_circles.53.a: "Дочекаємося слушної нагоди."
  imperial_circles.51.title: "Усунені з посади очільника"
  imperial_circles.51.desc: "Суперник успішно кинув нам виклик за лідерство. Нас позбавили титулу очільника округу, і тепер нам доведеться відновлювати репутацію в очах інших учасників."
  imperial_circles.51.a: "Такі приниження не забуваються."
  imperial_circles.52.title: "Посаду очільника втримано"
  imperial_circles.52.desc: "Нас спробували усунути з посади очільника округу, однак престиж суперника виявився недостатнім. Ми зберегли лідерство."
  imperial_circles.52.a: "Нашу владу не так просто зламати."
  imperial_circles.70.title: "Обрані очільником округу"
  imperial_circles.70.desc: "Оскільки попередній очільник покинув наші лави, округ волів, щоб його місце посіли ми. Тепер ми вважаємося очільником округу."
  imperial_circles.70.a: "Вони не дарма довірилися нам."
  imperial_circles.71.title: "Округ не має очільника"
  imperial_circles.71.desc: "В одному з імперських округів немає відповідного кандидата, здатного стати очільником. Подібні округи підривають владу імператора."
  imperial_circles.71.a: "Тож ми призначимо когось самі."
  imperial_circles.80.title: "Корона імператора змінює все"
  imperial_circles.80.desc: "На наше чоло покладено імператорську корону. Імператор не може водночас бути й очільником округу: обидві ці посади вимагають цілковитої відданости. Ми відмовилися від звання очільника округу, і тепер наше місце може посісти хтось інший."
  imperial_circles.80.a: "Імперія понад усе."