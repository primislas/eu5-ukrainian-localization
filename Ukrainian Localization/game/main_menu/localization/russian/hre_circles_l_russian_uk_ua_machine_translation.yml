  request_circle_privilege_effect_text: "[SCOPE.sCountry('actor').GetName] клопоч[SCOPE.sCountry('actor').Custom('end_etsautsa')] перед імператором про привілеї для округу."
  request_circle_privilege_effect_text_past: "[SCOPE.sCountry('actor').GetName] клопота[SCOPE.sCountry('actor').Custom('end_vlaloly')]ся перед імператором про привілеї для округу."
  INCOMING_OFFER_request_circle_privilege: "[SCOPE.sCountry('actor').GetName] клопоч[SCOPE.sCountry('actor').Custom('end_etsautsa')] про особливі привілеї для свого імперського округу.\n\n$INFO$"
  INCOMING_OFFER_TITLE_request_circle_privilege: "Запит привілеїв для округу"
  request_circle_privilege_reject_effect_text: "[SCOPE.sCountry('recipient').GetName] відхиля[SCOPE.sCountry('recipient').Custom('end_yeyut')] запит привілеїв для округу #ONCLICK:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')],X [SCOPE.sCountry('actor').Custom('CL_GEN')|L]#!#!."
  request_circle_privilege_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName] відхили[SCOPE.sCountry('recipient').Custom('end_vlaloly')] запит привілеїв для округу #ONCLICK:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')],X [SCOPE.sCountry('actor').Custom('CL_GEN')|L]#!#!."
  request_circle_privilege_members_tt: "Кожен учасник [Concept('imperial_circle', 'імперського округу')|e] отримає модифікатор «[ShowModifier('granted_circle_privilege')]» на 5 років."
  distribute_imperial_grant: "Розподілити імперський грант"
  distribute_imperial_grant_desc: "Розподілити гроші зі скарбниці між учасниками округу. Це покращить відносини та збільшить рівень вдоволення."
  distribute_imperial_grant_act: "Розподілити гроші між учасниками округу."
  distribute_imperial_grant_tt: "Ми витратимо [SCOPE.GetValue('total_grant')|2V]@gold! (20% від нашої [Concept('economical_base', 'господарської бази')|e]). Гроші будуть рівномірно розподілені між учасниками [Concept('imperial_circle', 'імперського округу')|e], які не є очільниками. Кожен із них отримає модифікатор «[ShowModifier('received_imperial_circle_grant')]» на 2 роки та [ShowBiasValue('opinion_received_imperial_grant')|+=2] до [Concept('opinion', 'думки')|e] про нас."
  distribute_imperial_grant_effect_text: "[SCOPE.sCountry('actor').GetName] розподіли[SCOPE.sCountry('actor').Custom('end_vlaloly')] імперський грант між учасниками свого округу."
  distribute_imperial_grant_effect_text_past: "[SCOPE.sCountry('actor').GetName] розподіли[SCOPE.sCountry('actor').Custom('end_vlaloly')] імперський грант між учасниками свого округу."
  demand_circle_loyalty: "Вимагати вірности від округу"
  demand_circle_loyalty_desc: "Ми утвердимо владу над учасниками округу. На 3 роки ми отримаємо престиж та дипломатичний авторитет, однак учасникам не сподобається нав’язування влади, і їхнє вдоволення впаде."
  demand_circle_loyalty_act: "Утвердити владу над учасниками округу."
  demand_circle_loyalty_tt: "На 3 роки ми отримаємо модифікатор «[ShowModifier('imposed_circle_authority')]». Кожен учасник нашого [Concept('imperial_circle', 'імперського округу')|e], який не є очільником, на 3 роки отримає модифікатор «[ShowModifier('pressured_circle_loyalty')]» та [ShowBiasValue('opinion_demanded_loyalty')|+=2] до [Concept('opinion', 'думки')|e] про нас. Вдоволення округу впаде на 5 од."
  demand_circle_loyalty_effect_text: "[SCOPE.sCountry('actor').GetName] вимага[SCOPE.sCountry('actor').Custom('end_yeyut')] вірности від учасників округу."
  demand_circle_loyalty_effect_text_past: "[SCOPE.sCountry('actor').GetName] вимага[SCOPE.sCountry('actor').Custom('end_vlaloly')] вірности від учасників округу."
  reform_coinage_in_circle: "Грошова реформа в окрузі"
  reform_coinage_in_circle_desc: "Імперія дарувала нам право регіонального карбування монет. Реформа монет та їхнього обігу посприяє господарському розвитку всіх учасників нашого округу, а також зміцнить наше становище в окрузі. На жаль, це призведе до зниження наших можливостей карбувати монету."
  reform_coinage_in_circle_act: "Грошова реформа в нашому окрузі"
  reform_coinage_in_circle_tt: "Ми отримаємо модифікатор «[ShowModifier('reformed_circle_coinage_leader')]», а кожен учасник нашого округу отримає модифікатор «[ShowModifier('reformed_circle_coinage_member')]» на 5 років. [Concept('opinion', 'Думка')|e] кожного учасника округу про нас збільшиться на [ShowBiasValue('opinion_reformed_circle_coinage')|+=2], а вдоволення округу збільшиться на 5 од."
  reform_coinage_in_circle_effect_text: "[SCOPE.sCountry('actor').GetName] провод[SCOPE.sCountry('actor').Custom('end_ytyat')] у своєму окрузі грошову реформу."
  reform_coinage_in_circle_text_past: "[SCOPE.sCountry('actor').GetName] здійсни[SCOPE.sCountry('actor').Custom('end_vlaloly')] у своєму окрузі грошову реформу."
  reduction_of_circle_titles: "Скорочення титулів округу"
  reduction_of_circle_titles_desc: "Наш округ став неефективним і загруз у титулах та адміністративних посадах, здатних блокувати рішення одне одного. Скорочення титулів не лише дозволить підвищити дієвість нашого округу, а й зміцнить наше становище. Інші учасники округу будуть не в захваті від подібної централізації, що знизить їхнє вдоволення."
  reduction_of_circle_titles_act: "Скорочення титулів округу"
  reduction_of_circle_titles_tt: "Ми отримаємо модифікатор «[ShowModifier('reduction_of_circle_titles')]», і [Concept('opinion', 'думка')|e] кожного учасника округу про нас зменшиться на [ShowBiasValue('opinion_reduction_of_circle_titles')|+=2]. Вдоволення округу зменшиться на 5 од."
  reduction_of_circle_titles_effect_text: "[SCOPE.sCountry('actor').GetName] скорочу[SCOPE.sCountry('actor').Custom('end_yeyut')] титули округу"
  reduction_of_circle_titles_text_past: "[SCOPE.sCountry('actor').GetName] скороти[SCOPE.sCountry('actor').Custom('end_vlaloly')] титули округу"
  challenge_circle_leadership: "Виклик очільнику округу"
  challenge_circle_leadership_desc: "Нинішні очільники нашого округу виявилися негідними свого становища та обов’язків. Ми маємо змогу оскаржити їхні повноваження та підірвати авторитет, що може як послабити їхній контроль, так і дати нам можливість кинути їм виклик."
  challenge_circle_leadership_act: "Кинути очільнику округу виклик на боротьбу за владу."
  challenge_circle_leadership_effect_text: "[SCOPE.sCountry('actor').GetName] кида[SCOPE.sCountry('actor').Custom('end_yeyut')] виклик очільнику округу."
  challenge_circle_leadership_effect_text_past: "[SCOPE.sCountry('actor').GetName] кину[SCOPE.sCountry('actor').Custom('end_vlaloly')] виклик очільнику округу."
  challenge_circle_leadership_tt: "Ми переможемо, якщо буде виконано будь-яку з умов:\n  • Вдоволення нашого округу нижче за 15 од. — відкрите повстання\n  • Вдоволення нашого округу нижче за 30 од., а наш престиж щонайменше не нижчий за престиж очільника\n  • Наш престиж перевищує престиж очільника щонайменше на 25 од.\n\nПоразка або усунення від виклику призведе до втрати престижу. Новому очільнику не можна буде кинути виклик протягом 2 років."
  appeal_to_emperor: "Звернення до імператора"
  appeal_to_emperor_desc: "Звернутися до імператора з проханням втрутитися в суперечку за лідерство в нашому окрузі."
  appeal_to_emperor_act: "Звернутися до імператора з проханням втрутитися в суперечку за лідерство в нашому окрузі."
  appeal_to_emperor_effect_text: "[SCOPE.sCountry('actor').GetName] зверта[SCOPE.sCountry('actor').Custom('end_yeyu')]ться до імператора."
  appeal_to_emperor_effect_text_past: "[SCOPE.sCountry('actor').GetName] зверну[SCOPE.sCountry('actor').Custom('end_vlaloly')]ся до імператора."
  appeal_to_emperor_reject_effect_text: "[SCOPE.sCountry('recipient').GetName] відмовля[SCOPE.sCountry('recipient').Custom('end_yeyu')]ться розглядати прохання #ONCLICK:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')],X [SCOPE.sCountry('actor').Custom('CL_GEN')|L]#!#!."
  appeal_to_emperor_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName] відмови[SCOPE.sCountry('recipient').Custom('end_vlaloly')]ся розглядати прохання #ONCLICK:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')],X [SCOPE.sCountry('actor').Custom('CL_GEN')|L]#!#!."
  INCOMING_OFFER_appeal_to_emperor: "[SCOPE.sCountry('actor').GetName] зверта[SCOPE.sCountry('actor').Custom('end_yeyu')]ться до нас із проханням втрутитися в суперечку за владу над імперським округом. Якщо ми погодимося, вдоволення округу впаде на 8 од., престиж очільника округу постраждає, а ми отримаємо престиж та імперську владу.\n\n$INFO$"
  INCOMING_OFFER_TITLE_appeal_to_emperor: "$appeal_to_emperor$"
