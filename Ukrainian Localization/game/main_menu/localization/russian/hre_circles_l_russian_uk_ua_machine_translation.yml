  HRE_CIRCLE_SATISFACTION_TT_IMPACT: "Що вище вдоволення, то більший [Concept('prestige', 'престиж')|e] та [Concept('diplomatic_reputation', 'міжнародна репутація')|e] у очільника округу.\n#Y < 30#! — учасники округу невдоволені. Очільник може іноді стикатися з труднощами.\n#R < 15#! — учасники округу можуть відкрито кинути виклик очільнику."
