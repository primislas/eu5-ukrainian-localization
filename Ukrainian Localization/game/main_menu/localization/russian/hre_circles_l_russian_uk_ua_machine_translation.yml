  appoint_imperial_circle_leader: "Призначити очільника округу"
  appoint_imperial_circle_leader_desc: "Скористатися імперською владою і призначити очільника округу, яким ще ніхто не керує."
  appoint_imperial_circle_leader_act: "Призначити #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_ACC')|L]#!#! очільником округу."
