  appoint_imperial_circle_leader_effect_text_past: "[SCOPE.sCountry('actor').GetName] призначи[SCOPE.sCountry('actor').Custom('end_vlaloly')] #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_ACC')|L]#!#! очільником округу."
  petition_imperial_diet: "Подати клопотання до райхстагу"
  petition_imperial_diet_desc: "Як очільник округу ми попросимо райхстаг розглянути нашу скаргу чи клопотання."
  petition_imperial_diet_act: "Подати клопотання до райхстагу."
