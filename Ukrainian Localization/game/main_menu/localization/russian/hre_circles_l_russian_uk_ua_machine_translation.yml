  join_an_imperial_circle_desc: "Вступити до імперського округу під час періоду створення."
  join_an_imperial_circle_act: "Вступити до округу [SCOPE.sImperialCircle('target').GetName]."
  join_an_imperial_circle_effect_text: "[SCOPE.sCountry('actor').GetName] вступа[SCOPE.sCountry('actor').Custom('end_yeyut')] до округу [SCOPE.sImperialCircle('target').GetName]."
  join_an_imperial_circle_effect_text_past: "[SCOPE.sCountry('actor').GetName] вступи[SCOPE.sCountry('actor').Custom('end_vlaloly')] до округу [SCOPE.sImperialCircle('target').GetName]."
  bribe_imperial_circle: "Підкупити імперський округ"
  bribe_imperial_circle_desc: "Дати очільнику імперського округу та кожному його учаснику хабар, щоб ті проголосували за нашу пропозицію в Райхстазі. Очільник округу отримає хабар у повному базовому розмірі, а всі наступні учасники — по 25% від цього значення. Голос кожного учасника буде зафіксовано так, як визначить імператор."
  bribe_imperial_circle_act: "Підкупити #ONCLICK:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')],X [SCOPE.sCountry('target').Custom('CL_ACC')|L]#!#!, щоб нашу пропозицію в Райхстазі підтримали."
  bribe_imperial_circle_effect_text: "[SCOPE.sCountry('actor').GetName] підкупову[SCOPE.sCountry('actor').Custom('end_yeyut')] округ #ONCLICK:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')],X [SCOPE.sCountry('target').Custom('CL_GEN')|L]#!#! задля підтримки своєї пропозиції."
  bribe_imperial_circle_effect_text_past: "[SCOPE.sCountry('actor').GetName] підкупи[SCOPE.sCountry('actor').Custom('end_vlaloly')] округ #ONCLICK:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')],X [SCOPE.sCountry('target').Custom('CL_GEN')|L]#!#! задля підтримки своєї пропозиції."
  bribe_imperial_circle_members_tt: "Кожен наступний учасник округу #ONCLICK:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('target').Custom('CL_tt')],X [SCOPE.sCountry('target').Custom('CL_GEN')|L]#!#! отримує [SCOPE.GetValue('bribe_member_share')|0V]@gold!, а їхні [Concept('vote', 'голоси')|e] за пропозицію в Райхстазі будуть зафіксовані так, як визначить імператор."
  BRIBE_IMPERIAL_CIRCLE_CTRL_HINT: "Підкуп усього [Concept('imperial_circle', 'імперського округу')|e]"
  approve_imperial_circle_proposal: "Схвалити пропозицію"
  approve_imperial_circle_proposal_desc: "Як очільник імперського округу ми примусимо кожного учасника віддати голос (і проголосуємо самі) за поточну пропозицію до того, як проголосує Райхстаг. Це безкоштовно, однак голоси будуть зафіксовані до завершення резолюції."
  approve_imperial_circle_proposal_act: "Примусити округ [SCOPE.sImperialCircle('target').GetName] проголосувати за пропозицію."
  approve_imperial_circle_proposal_effect_text: "[SCOPE.sCountry('actor').GetName] примушу[SCOPE.sCountry('actor').Custom('end_yeyut')] округ [SCOPE.sImperialCircle('target').GetName] проголосувати за імперську пропозицію."
  approve_imperial_circle_proposal_effect_text_past: "[SCOPE.sCountry('actor').GetName] примуси[SCOPE.sCountry('actor').Custom('end_vlaloly')] округ [SCOPE.sImperialCircle('target').GetName] проголосувати за імперську пропозицію."
  approve_imperial_circle_proposal_members_tt: "[Concept('vote', 'Голос')|e] кожного учасника округу [SCOPE.sImperialCircle('target').GetName] в голосуванні щодо поточної пропозиції в Райхстазі відданий за запропоновану політику й зафіксований."
  oppose_imperial_circle_proposal: "Виступити проти пропозиції"
  oppose_imperial_circle_proposal_desc: "Як очільник імперського округу ми примусимо кожного учасника віддати голос (і проголосуємо самі) проти поточної пропозиції до того, як проголосує Райхстаг. Голоси будуть віддані за поточну політику й зафіксовані, але тільки якщо така існує; в іншому разі округ утримається."
  oppose_imperial_circle_proposal_act: "Примусити округ [SCOPE.sImperialCircle('target').GetName] проголосувати проти пропозиції."
  oppose_imperial_circle_proposal_effect_text: "[SCOPE.sCountry('actor').GetName] примушу[SCOPE.sCountry('actor').Custom('end_yeyut')] округ [SCOPE.sImperialCircle('target').GetName] проголосувати проти імперської пропозиції."
  oppose_imperial_circle_proposal_effect_text_past: "[SCOPE.sCountry('actor').GetName] примуси[SCOPE.sCountry('actor').Custom('end_vlaloly')] округ [SCOPE.sImperialCircle('target').GetName] проголосувати проти імперської пропозиції."
  oppose_imperial_circle_proposal_members_tt: "[Concept('vote', 'Голос')|e] кожного учасника округу [SCOPE.sImperialCircle('target').GetName] в голосуванні щодо поточної пропозиції в Райхстазі відданий за поточну політику й зафіксований. Якщо поточної політики не існує, округ утримається від голосування."
  call_imperial_circle_to_war: "Заклик округу на війну"
  call_imperial_circle_to_war_desc: "Закликати очільника округу підтримати поточну війну силами учасників округу."
  call_imperial_circle_to_war_act: "Закликати округ #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_GEN')|L]#!#! до зброї."
  call_imperial_circle_to_war_effect_text: "[SCOPE.sCountry('actor').GetName] заклика[SCOPE.sCountry('actor').Custom('end_yeyut')] округ #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_GEN')|L]#!#! до зброї."
  call_imperial_circle_to_war_effect_text_past: "[SCOPE.sCountry('actor').GetName] заклика[SCOPE.sCountry('actor').Custom('end_vlaloly')] округ #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_GEN')|L]#!#! до зброї."
  INCOMING_OFFER_call_imperial_circle_to_war: "Влада #ONCLICK:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('actor').Custom('CL_tt')],X [SCOPE.sCountry('actor').Custom('CL_GEN')|L]#!#! закликає нас відправити війська нашого округу на їхню війну.\n\n$INFO$"
  INCOMING_OFFER_TITLE_call_imperial_circle_to_war: "Заклик до зброї"
  call_imperial_circle_to_war_reject_effect_text: "[SCOPE.sCountry('actor').GetName] відмовля[SCOPE.sCountry('actor').Custom('end_yeyu')]ться відповідати на заклик #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_GEN')|L]#!#! до зброї."
  call_imperial_circle_to_war_reject_effect_text_past: "[SCOPE.sCountry('actor').GetName] відмови[SCOPE.sCountry('actor').Custom('end_vlaloly')] відповідати на заклик #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').Custom('CL_tt')],X [SCOPE.sCountry('recipient').Custom('CL_GEN')|L]#!#! до зброї."
