  MusicPlayer_sol_syrian_Num_habib: "Сирійська — Num Habib"
  MusicPlayer_sol_syrian_Num_habib_flavour: "Габрієль Асаад був ассирійським композитором і музикою, що писав та виконував свої твори різними діалектами сучасних новоарамейських мов."
