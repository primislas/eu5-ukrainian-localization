  MusicPlayer_01_Overture_I_Genesis: "01 — Увертюра I: Буття"
  MusicPlayer_01_Overture_I_Genesis_flavour: "«Світ прокидається, і сонячне світло поволі відкриває його лик»."
  MusicPlayer_02_Overture_II_The_Odyssey: "02 — Увертюра II: Одіссея"
  MusicPlayer_02_Overture_II_The_Odyssey_flavour: "«Увертюра нашої оповіді, яка знайомить нас із її дійовими особами та темами»."
  MusicPlayer_03_Royal_Court_Invitation: "03 — Запрошення до королівського двору"
  MusicPlayer_03_Royal_Court_Invitation_flavour: "Клавесин, який можна почути в цьому творі, — це клавішний інструмент, вельми поширений у музиці доби Відродження та бароко. Звук видобувається механічним щипком струн, натягнутих над декою: натискання клавіші приводить у рух плектр із пташиного пера, який защипує струну."
  MusicPlayer_25_The_Noble_Art_of_Diplomacy: "25 — Шляхетне мистецтво дипломатії"
  MusicPlayer_25_The_Noble_Art_of_Diplomacy_flavour: "Родина лютневих інструментів має довгу історію в багатьох куточках світу й у різні періоди історії, а європейська лютня була панівним інструментом у світській музиці Європи доби Відродження."
  MusicPlayer_21_Conquer_or_Fall: "21 — Підкорити або впасти"
  MusicPlayer_21_Conquer_or_Fall_flavour: "Велична композиція за участю духових, струнних і хору. Пропонує наснажливу варіацію однієї з головних мелодійних тем музики Europa Universalis V."
  MusicPlayer_07_For_the_Lost_Ones: "07 — Тим, кого втратили"
  MusicPlayer_07_For_the_Lost_Ones_flavour: "Журлива й хвилеподібна композиція, що відлунює темами та мотивами з інших творів Europa Universalis V."
  MusicPlayer_12_Jester_Speaks_the_Truth: "12 — Блазень каже правду"
  MusicPlayer_12_Jester_Speaks_the_Truth_flavour: "Композиція, натхненна ранньою музикою Відродження, побудована довкола варіацій головного мелодійного мотиву музики Europa Universalis V."
  MusicPlayer_05_The_Rise_of_an_Empire: "05 — Піднесення імперії"
  MusicPlayer_05_The_Rise_of_an_Empire_flavour: "Розпочинаючись головним мотивом Europa Universalis V, ця композиція є рушійним відображенням основоположного настрою гри."
  MusicPlayer_20_Thirty_Years: "20 — Тридцять років"
  MusicPlayer_20_Thirty_Years_flavour: "Тридцятилітня війна (1618–1648) — один із найбільш спустошливих конфліктів у європейській історії, що забрав життя від 4,5 до 8 мільйонів людей. Її розпалила Реформація XVI століття, а згодом підживили зовнішні суперечності інтересів і давнє суперництво."
  MusicPlayer_24_The_Black_Death: "24 — Чорна смерть"
  MusicPlayer_24_The_Black_Death_flavour: "Скосивши половину населення Європи XIV століття, Чорна смерть стала однією з найсмертоносніших пошестей в історії людства."
  MusicPlayer_10_Gloria_Patri: "10 — Gloria Patri"
  MusicPlayer_10_Gloria_Patri_flavour: "Вокальна варіація на тему Сюїти для віолончелі № 1 соль мажор Баха, BWV 1007: I. Прелюдія."
  MusicPlayer_14_Lux_aeterna: "14 — Lux Aeterna"
  MusicPlayer_14_Lux_aeterna_flavour: "Lux aeterna — це текст, який часто кладуть на музику як частину заупокійної меси в католицькій церкві. Він оповідає про Божу благодать і Його вічне світло, що осяває спочилих."
  MusicPlayer_18_Falalalan: "18 — Falalalan"
  MusicPlayer_18_Falalalan_flavour: "Історія завжди присутня в музиці, часом навіть не в одному сенсі."
  MusicPlayer_22_A_Message_to_The_King: "22 — Звістка для короля"
  MusicPlayer_22_A_Message_to_The_King_flavour: "Композиція, сповнена невідкладності й завзяття, яка передає відчуття, що поспіх має вирішальне значення."
  MusicPlayer_08_No_Fear_No_Mercy: "08 — Ні страху, ні пощади"
  MusicPlayer_08_No_Fear_No_Mercy_flavour: "Звитяжна композиція, що нагадує тишу перед битвою та стукіт сердець вояків у грудях у передчутті бою."
  MusicPlayer_06_Pain_is_Salvation: "06 — Біль — це порятунок"
  MusicPlayer_06_Pain_is_Salvation_flavour: "Слова композиції поєднують англійську, давньонімецьку мови та латину, оповідаючи про страждання на шляху до спасіння."
  MusicPlayer_04_In_Your_Honor: "04 — На вашу честь"
  MusicPlayer_04_In_Your_Honor_flavour: "Широка й піднесена композиція, що нагадує про зелені пасовиська та благоговіння перед Богом і Природою."
  MusicPlayer_15_A_Bargain_with_Beelzebub: "15 — Угода з Вельзевулом"
  MusicPlayer_15_A_Bargain_with_Beelzebub_flavour: "Віра та війна, і війни за віру. Переплетення набожности та кровожерности. Зображені тут століття — це доба різких контрастів, помережана відтінками сірого."
  MusicPlayer_16_The_Path_to_Potsdam: "16 — Шлях до Потсдама"
  MusicPlayer_16_The_Path_to_Potsdam_flavour: "За часів Тридцятилітньої війни місто Потсдам утратило майже половину свого населення."
  MusicPlayer_11_Maiden_Voyage: "11 — Перше плавання"
  MusicPlayer_11_Maiden_Voyage_flavour: "Твір у танцювальному ритмі, немов гойдання хвиль на шляху до незвіданих морів."
  MusicPlayer_17_The_Coronation_of_a_Naked_Emperor: "17 — Коронація голого імператора"
  MusicPlayer_17_The_Coronation_of_a_Naked_Emperor_flavour: "Твір у світському бароковому стилі за участю струнних та клавесина."
  MusicPlayer_13_Battle_of_Lutzen: "13 — Битва під Лютценом"
  MusicPlayer_13_Battle_of_Lutzen_flavour: "Битва під Лютценом відбулася 16 листопада 1632 року між шведським військом, яке підтримували війська Саксонії та Гессен-Касселя, та імперським військом Священної Римської імперії. Це одна з найважливіших битв Тридцятилітньої війни. Після загибелі в цій битві короля Швеції Густава Адольфа було створено Гайльброннську лігу."
  MusicPlayer_26_Peace_of_Westphalia: "26 — Вестфальський мир"
  MusicPlayer_26_Peace_of_Westphalia_flavour: "Вестфальський мир — загальна назва двох окремих мирних договорів, підписаних в Оснабрюці та Мюнстері в 1648 році, які поклали край Тридцятилітній війні та принесли мир Священній Римській імперії."
  MusicPlayer_23_The_Flagellant: "23 — Флагелант"
  MusicPlayer_23_The_Flagellant_flavour: "Самобичування — це шмагання себе на знак каяття у гріхах і співпереживання Страстям Ісуса, притаманне багатьом християнським звичаям. Рух флагелантів у західному християнстві XIV століття виник як відповідь на війну, голод та пошесті."
  MusicPlayer_19_O_quam_gloriosum: "19 — O quam gloriosum"
  MusicPlayer_19_O_quam_gloriosum_flavour: "Цей твір ґрунтується на тексті, написаному Томасом Луїсом де Вікторія (1548–1611) для його «Missa O quam gloriosum»."
  MusicPlayer_09_Libera_me_Domine: "09 — Libera me Domine"
  MusicPlayer_09_Libera_me_Domine_flavour: "Цей твір поєднує в собі тексти «Pie Jesu» та «Libera me», які зазвичай кладуться на музику як частина заупокійної меси в Католицькій церкві. У них звучить благання про те, щоб милість Ісуса дарувала покійним спочинок, а також порятунок у день Страшного суду."
  MusicPlayer_sol_ashanti_Aho: "Ашанті — Aho"
  MusicPlayer_sol_ashanti_Aho_flavour: "Нана Осей Твум Баріма — знавець усіх інструментів, що використовуються в музиці та обрядах ашанті, зокрема сепереви, традиційних рогів та ударних. Він також є наступником імператора й творця королівства Ашанті. Назва пісні перекладається як «Бойовий наспів»."
  MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko: "Ашанті — Asanteman Yenim Ko"
  MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko_flavour: "Початок слів пісні приблизно перекладається як «Ашанті вміють битися, але не вміють утікати», після чого в ній оспівується звитяга вояків ашанті."
  MusicPlayer_sol_ashanti_Seperewa_Akasa: "Ашанті — Seperewa Akasa"
  MusicPlayer_sol_ashanti_Seperewa_Akasa_flavour: "Назва пісні перекладається як «Сеперева заговорила». Сеперева — це інструмент родини арфо-лютневих із коробчастим резонатором і 10–14 струнами, закріпленими безпосередньо на шийці інструмента шляхом намотування. Він походить із Західної Африки, і подейкують, що правитель Осей Туту, засновник імперії Ашанті (Асанте), настільки любив його, що наказав виготовити золоту копію для своїх королівських клейнодів."
  MusicPlayer_sol_aztec_Mictlan: "Ацтеки — Mictlan"
  MusicPlayer_sol_aztec_Mictlan_flavour: "$Pierre_Harmon_facts$. Назва пісні перекладається як «Підземний світ»."
  MusicPlayer_sol_aztec_Iyac: "Ацтеки — Iyac"
  MusicPlayer_sol_aztec_Iyac_flavour: "$Pierre_Harmon_facts$. Назва пісні перекладається як «Споконвічний воїн»."
  MusicPlayer_sol_aztec_Teotl: "Ацтеки — Teotl"
  MusicPlayer_sol_aztec_Teotl_flavour: "$Pierre_Harmon_facts$. Назва пісні перекладається як «Бог природи»."
  MusicPlayer_sol_chinese_Ambush_Act_1_and_2_Setting_Up_Camp_and_Drumming: "Китайська — Засідка з десяти боків — Дії 1 і 2 — «Розбиття табору» / «Бій барабанів»"
