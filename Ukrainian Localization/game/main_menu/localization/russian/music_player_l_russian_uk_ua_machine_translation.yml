  MusicPlayer_01_Overture_I_Genesis: "01 — Увертюра I: Буття"
  MusicPlayer_01_Overture_I_Genesis_flavour: "«Світ прокидається, і сонячне світло поволі осяває його обриси»."
  MusicPlayer_02_Overture_II_The_Odyssey: "02 — Увертюра II: Одіссея"
  MusicPlayer_02_Overture_II_The_Odyssey_flavour: "«Увертюра нашої історії, в якій розкрилися її характер і теми»."
  MusicPlayer_03_Royal_Court_Invitation: "03 — Запрошення до королівського двору"
  MusicPlayer_03_Royal_Court_Invitation_flavour: "У цій композиції звучить клавесин — клавішний інструмент, що панував у музиці Відродження та бароко. Він видобуває звук завдяки механічному щипанню ряду струн на деці — натискання клавіші приводить у рух пір’яний плектр, який смикає одну струну."
  MusicPlayer_25_The_Noble_Art_of_Diplomacy: "25 — Шляхетне мистецтво дипломатії"
  MusicPlayer_25_The_Noble_Art_of_Diplomacy_flavour: "Лютня та подібні інструменти трапляються в багатьох куточках світу впродовж багатьох діб, і європейська лютня стала головним інструментом світської музики Європи доби Відродження."
  MusicPlayer_21_Conquer_or_Fall: "21 — Підкорити або впасти"
  MusicPlayer_21_Conquer_or_Fall_flavour: "Епічна композиція, у якій звучать духові, струнні та хор. Це наснажливе переосмислення однієї з головних музичних тем Europa Universalis V."
  MusicPlayer_07_For_the_Lost_Ones: "07 — Тим, кого втратили"
  MusicPlayer_07_For_the_Lost_Ones_flavour: "Жалібна й тривожна композиція, що перегукується з темами та мотивами інших творів Europa Universalis V."
  MusicPlayer_12_Jester_Speaks_the_Truth: "12 — Блазень каже правду"
  MusicPlayer_12_Jester_Speaks_the_Truth_flavour: "Композиція, натхненна музикою раннього Відродження, заснована на варіаціях головного музичного мотиву Europa Universalis V."
  MusicPlayer_05_The_Rise_of_an_Empire: "05 — Піднесення імперії"
  MusicPlayer_05_The_Rise_of_an_Empire_flavour: "Ця композиція починається з головного мотиву Europa Universalis V і передає основні враження від гри."
  MusicPlayer_20_Thirty_Years: "20 — Тридцять років"
  MusicPlayer_20_Thirty_Years_flavour: "Тридцятилітня війна (1618–1648 рр.) стала однією з найбільш руйнівних воєн у європейській історії та забрала життя від 4,5 до 8 мільйонів людей. Іскрою послужила Реформація XVI століття, але оливи до вогню додали також зовнішні суперечності інтересів і давнє суперництво."
  MusicPlayer_24_The_Black_Death: "24 — Чорна смерть"
  MusicPlayer_24_The_Black_Death_flavour: "Чорна смерть забрала життя половини жителів Європи XIV століття, ставши однією з найбільш нищівних пошестей в історії людства."
  MusicPlayer_10_Gloria_Patri: "10 — Gloria Patri"
  MusicPlayer_10_Gloria_Patri_flavour: "Вокальне перекладення сюїти № 1 соль мажор Баха, BWV 1007: 1. Прелюдія."
  MusicPlayer_14_Lux_aeterna: "14 — Lux Aeterna"
  MusicPlayer_14_Lux_aeterna_flavour: "Lux aeterna зазвичай відносять до музики в межах заупокійної меси в католицькій церкві. У тексті йдеться про Божу ласку та Його вічне сяйво, що осяює спочилих."
  MusicPlayer_18_Falalalan: "18 — Falalalan"
  MusicPlayer_18_Falalalan_flavour: "У музиці завжди присутня історія, часом у кількох подобах."
  MusicPlayer_22_A_Message_to_The_King: "22 — Звістка для короля"
  MusicPlayer_22_A_Message_to_The_King_flavour: "Композиція, сповнена відчуття невідкладності й завзяття, яка показує, що поспіх життєво необхідний."
  MusicPlayer_08_No_Fear_No_Mercy: "08 — Ні страху, ні пощади"
  MusicPlayer_08_No_Fear_No_Mercy_flavour: "Тріумфальна композиція, що нагадує затишшя перед боєм, коли серця вояків тремтять від передчуття."
  MusicPlayer_06_Pain_is_Salvation: "06 — Біль — це спасіння"
  MusicPlayer_06_Pain_is_Salvation_flavour: "У словах пісні змішуються англійська, давньогерманська та латина, розповідаючи про страждання на шляху до спасіння."
  MusicPlayer_04_In_Your_Honor: "04 — На вашу честь"
  MusicPlayer_04_In_Your_Honor_flavour: "Величава композиція, що нагадує про зелені пасовища та про благоговіння перед Богом і природою."
  MusicPlayer_15_A_Bargain_with_Beelzebub: "15 — Угода з Вельзевулом"
  MusicPlayer_15_A_Bargain_with_Beelzebub_flavour: "Віра й війна, війни через віру. Змішали побожність і кровожерність. Століття, що лунають тут, — це доба різких контрастів, перемежована відтінками сірого."
  MusicPlayer_16_The_Path_to_Potsdam: "16 — Шлях до Потсдама"
  MusicPlayer_16_The_Path_to_Potsdam_flavour: "Місто Потсдам утратило майже половину населення під час Тридцятилітньої війни."
  MusicPlayer_11_Maiden_Voyage: "11 — Перше плавання"
  MusicPlayer_11_Maiden_Voyage_flavour: "Композиція в танцювальному ритмі, що нагадує перекочування хвиль на шляху до незвіданих морів."
  MusicPlayer_17_The_Coronation_of_a_Naked_Emperor: "17 — Коронація голого імператора"
  MusicPlayer_17_The_Coronation_of_a_Naked_Emperor_flavour: "Зразок світського бароко з використанням струнних інструментів та клавесина."
  MusicPlayer_13_Battle_of_Lutzen: "13 — Битва під Лютценом"
  MusicPlayer_13_Battle_of_Lutzen_flavour: "Битва під Лютценом відбулася 16 листопада 1632 року між шведським військом, підтриманим військами Саксонії та Гессен-Касселя, та імператорським військом Священної Римської імперії, і є однією з найважливіших битв Тридцятилітньої війни. Після загибелі в бою шведського короля Густава Адольфа Гайльброннська ліга."
  MusicPlayer_26_Peace_of_Westphalia: "26 — Вестфальський мир"
  MusicPlayer_26_Peace_of_Westphalia_flavour: "Вестфальський мир — узагальнена назва двох окремих мирних угод, підписаних в Оснабрюку та Мюнстері в 1648 році, які поклали край Тридцятилітній війні та повернули мир до Священної Римської імперії."
  MusicPlayer_23_The_Flagellant: "23 — Флагелант"
  MusicPlayer_23_The_Flagellant_flavour: "Самобичування заради очищення від гріха та прилучення до Страстей Христових наявне в багатьох християнських звичаях. Флагелантство як рух виникло в західному християнстві в XIV столітті у відповідь на війни, голод і чуму."
  MusicPlayer_19_O_quam_gloriosum: "19 — O quam gloriosum"
  MusicPlayer_19_O_quam_gloriosum_flavour: "Ця композиція ґрунтується на тексті Томаса Луїса де Вікторії (1548–1611), написаному для «Missa O quam gloriosum»."
  MusicPlayer_09_Libera_me_Domine: "09 — Libera me Domine"
  MusicPlayer_09_Libera_me_Domine_flavour: "Ця композиція поєднує тексти «Pie Jesu» та «Libera me», які часто виконуються під час заупокійної меси в католицькій церкві. У них молять про дарування покійному милості Ісуса та спокуту в судний день."
  MusicPlayer_sol_ashanti_Aho: "Ашанті — Aho"
  MusicPlayer_sol_ashanti_Aho_flavour: "Нана Осей Твум Баріма — майстер усіх інструментів, що використовуються в музиці та обрядах ашанті, зокрема сепереви, звичаєвих рогів та ударних інструментів. Він також є наступником правителя й засновника Королівства Ашанті. Назва пісні перекладається як «Бойовий клич»."
  MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko: "Ашанті — Asanteman Yenim Ko"
  MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko_flavour: "Початкові слова пісні приблизно перекладаються як «Ашанті вміють битися, але не вміють тікати», і далі в тексті розповідається про звитягу вояків ашанті."
  MusicPlayer_sol_ashanti_Seperewa_Akasa: "Ашанті — Seperewa Akasa"
  MusicPlayer_sol_ashanti_Seperewa_Akasa_flavour: "Назва перекладається як «Сеперева мовила». Сеперева — це інструмент, споріднений з арфою або лютнею, з чотирикутним резонатором і 10–14 струнами, прив’язаними просто до грифа. Інструмент походить із Західної Африки, і за переказами король Осей Туту, засновник Королівства Ашанті, настільки любив його, що для нього виготовили копію інструмента із золота."
  MusicPlayer_sol_aztec_Mictlan: "Ацтеки — Mictlan"
  MusicPlayer_sol_aztec_Mictlan_flavour: "$Pierre_Harmon_facts$. Назва композиції перекладається як «Підземний світ»."
  MusicPlayer_sol_aztec_Iyac: "Ацтеки — Iyac"
  MusicPlayer_sol_aztec_Iyac_flavour: "$Pierre_Harmon_facts$. Назва композиції перекладається як «Споконвічний воїн»."
  MusicPlayer_sol_aztec_Teotl: "Ацтеки — Teotl"
  MusicPlayer_sol_aztec_Teotl_flavour: "$Pierre_Harmon_facts$. Назва композиції перекладається як «Бог природи»."
  MusicPlayer_sol_chinese_Ambush_Act_1_and_2_Setting_Up_Camp_and_Drumming: "Китайська — Засідка з десяти боків — Дії 1 і 2 — «Розбиття табору» / «Бій барабанів»"
