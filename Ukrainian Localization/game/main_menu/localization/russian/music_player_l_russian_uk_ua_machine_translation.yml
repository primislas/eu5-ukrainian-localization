  Jacob_Regnart: "Якоб Регнарт (1540-ві—1599)"
  Jacob_Regnart_facts: "Регнарт — фламандський композитор доби Відродження, який народився в Дуе та творив як духовну, так і світську музику. Протягом життя працював в Австрії та Богемії, зокрема служив капельмейстером ерцгерцога Фердинанда в Інсбруку в 1580-х роках."
  Martin_Rinckart: "Мартін Рінкарт (1586—1649)"
  Martin_Rinckart_facts: "Мартін Рінкарт був лютеранським священнослужителем і творцем гімнів, служив архідияконом в Айленбурзі у Північній Саксонії, де народився й помер."
  Joachim_Neander: "Йоахім Неандер (1650—1680)"
  Joachim_Neander_facts: "Йоахім Неандер народився в Бремені й був богословом, учителем і творцем гімнів для Реформатської (кальвіністської) церкви. Його вважають найвизначнішим гімнописцем Реформатської церкви — він склав близько 60 гімнів."
  Dietrich_Buxtehude: "Дітріх Букстегуде (1637—1707)"
  Dietrich_Buxtehude_facts: "Уроджений Дітріх Гансен Букстегуде народився 1637 року в Гельсінборгу в провінції Сконе. Букстегуде вважають одним із найвидатніших композиторів XVII століття, який справив значний вплив на пізніших композиторів, зокрема Баха та Генделя."
