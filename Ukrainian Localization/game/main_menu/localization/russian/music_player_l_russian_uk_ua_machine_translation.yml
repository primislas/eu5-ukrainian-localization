  MusicPlayer_sol_syrian_Num_habib: "Сирійська — Num Habib"
  MusicPlayer_sol_syrian_Num_habib_flavour: "Габріель Асад — ассирійський композитор і музика, який писав і виконував твори різними діалектами сучасних новоарамейських мов."
