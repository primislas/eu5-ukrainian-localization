  MusicPlayer_sol_chinese_Ambush_Act_6_and_7_The_Minor_Battle_at_Jiming_Mountain_and_Jiuli_Mountain: "Китайська — Засідка з десяти боків — Дії 6 і 7 — «Мала битва біля гори Цзімін» / «Гора Цзюлі»"
  MusicPlayer_sol_chinese_Ambush_Act_6_and_7_The_Minor_Battle_at_Jiming_Mountain_and_Jiuli_Mountain_flavour: "$MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour$"
  MusicPlayer_sol_chinese_Ambush_Act_7_and_8_Jiuli_Mountain_and_The_Defeat_of_Xiang_Yu: "Китайська — Засідка з десяти боків — Дії 7 і 8 — «Гора Цзюлі» / «Поразка Сян Юя»"
  MusicPlayer_sol_chinese_Ambush_Act_7_and_8_Jiuli_Mountain_and_The_Defeat_of_Xiang_Yu_flavour: "$MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour$"
  MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos: "Китайська — Засідка з десяти боків — Повний епос"
  MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour: "Шедевр класичної китайської музики, який зазвичай виконують віртуози. Створений у військовому стилі та змальовує битву під Гайся в 202 році до н. е., у якій полководець Сян Юй зазнав поразки від Лю Бана."
  MusicPlayer_sol_chinese_Chen_Sui: "Китай — Chen-Sui"
  MusicPlayer_sol_chinese_Chen_Sui_flavour: "$Yingying_Herrdahl_facts$"
  MusicPlayer_sol_chinese_Yingzhou_Gudiao_the_Birds: "Китайська — Інчжоу Ґудяо — Птахи"
  MusicPlayer_sol_chinese_Yingzhou_Gudiao_the_Birds_flavour: "$Pipa_facts$"
  MusicPlayer_sol_chinese_Yingzhou_Gudiao_the_Fish: "Китайська — Інчжоу Ґудяо — Риби"
  MusicPlayer_sol_chinese_Yingzhou_Gudiao_the_Fish_flavour: "$Pipa_facts$"
  MusicPlayer_sol_chinese_Yingzhou_Gudiao_the_Moon: "Китайська — Інчжоу Ґудяо — Місяць"
  MusicPlayer_sol_chinese_Yingzhou_Gudiao_the_Moon_flavour: "$Pipa_facts$"
  MusicPlayer_sol_deccan_raga_keeravani: "Декан — Raga Keeravani"
  MusicPlayer_sol_deccan_raga_keeravani_flavour: "Виконується у класичному триголосому карнатичному стилі. Назва пісні перекладається як «Рага благочестя»"
  MusicPlayer_sol_deccan_raga_nattaikurunji: "Декан — Raga Nattaikurunji"
  MusicPlayer_sol_deccan_raga_nattaikurunji_flavour: "Виконується у класичному триголосому карнатичному стилі. Назва пісні перекладається як «Рага романтики»"
  MusicPlayer_sol_deccan_raga_saraswathi: "Декан — Raga Saraswathi"
  MusicPlayer_sol_deccan_raga_saraswathi_flavour: "Виконується у класичному триголосому карнатичному стилі. Назва пісні перекладається як «Рага містицизму»"
  MusicPlayer_sol_iroquois_Akwesasne: "Ірокези — Akwesasne"
  MusicPlayer_sol_iroquois_Akwesasne_flavour: "$Dan_Cecil_Hill_facts$ Назва композиції перекладається як «Земля, де тріпочуть куріпки»"
  MusicPlayer_sol_iroquois_Haundenosaunee: "Ірокези — Haundenosaunee"
  MusicPlayer_sol_iroquois_Haundenosaunee_flavour: "$Dan_Cecil_Hill_facts$ Назва композиції перекладається як «Ірокези» — англійське позначення народу гауденосауні."
  MusicPlayer_sol_iroquois_Oswegatchie: "Ірокези — Oswegatchie"
  MusicPlayer_sol_iroquois_Oswegatchie_flavour: "$Dan_Cecil_Hill_facts$ Назва композиції перекладається як «Місто/Річка»"
  MusicPlayer_sol_north_german_Auf_meinen_lieben_Gott_Bordun: "Північна Німеччина — Auf meinen lieben Gott (версія з педальною нотою)"
