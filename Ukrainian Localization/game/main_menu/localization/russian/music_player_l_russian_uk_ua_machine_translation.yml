  Jacob_Regnart: "Якоб Регнарт (1540-ві–1599)"
  Jacob_Regnart_facts: "Регнарт — композитор фламандського Відродження родом із Дуе, автор церковної та світської музики. Впродовж життя він працював в Австрії та Богемії, зокрема обіймаючи посаду капельмейстера ерцгерцога Фердинанда в Інсбруку в 1580-ті роки."
  Martin_Rinckart: "Мартін Рінкарт (1586—1649)"
  Martin_Rinckart_facts: "Мартін Рінкарт був лютеранським священником і творцем псалмів, архідияконом в Айленбурзі (Північна Саксонія), де він народився й помер."
  Joachim_Neander: "Йоахім Неандер (1650—1680)"
  Joachim_Neander_facts: "Йоахім Неандер народився в Бремені й був реформатським (кальвіністським) творцем псалмів, богословом і вчителем. Він вважається найвидатнішим творцем псалмів у реформатській церкві — йому приписують авторство 60 псалмів."
  Dietrich_Buxtehude: "Дітріх Букстегуде (1637—1707)"
  Dietrich_Buxtehude_facts: "Дітріх Гансен Букстегуде народився в Гельсінґборзі у провінції Сканія в 1637 році. Букстегуде вважається одним із найважливіших композиторів XVII століття, що справив значний вплив на пізніших композиторів, включно з Бахом і Генделем."
