  Yingying_Herrdahl: "Їн’їн Геррдал (Yingying Herrdahl) — піпа"
  Yingying_Herrdahl_facts: "Їн’їн Геррдал — віртуозка гри на піпі, нині проживає у Швеції."
  Pipa_facts: "Китайська піпа — струнний інструмент грушоподібної форми. Струни защипують нігтями, але в минулому також використовували плектри. Історія інструмента налічує майже дві тисячі років, і він досі має величезну популярність."
  Martin_Ostergren: "Мартін Естерґрен (Martin Östergren) — орган"
  Feras_Charestan: "Ферас Шарестан (Feras Charestan) — канун"
  Feras_Charestan_facts: "Ферас Шарестан родом із міста Ель-Хасака на північному сході Сирії, вивчав гру на кануні в Арабському музичному інституті."
  Qanun_facts: "Канун — музичний інструмент, споріднений із цитрою, імовірно, родом зі стародавньої Месопотамії, хоча точне походження невідоме."
  Ilona_Danho: "Ілона Данхо (Ilona Danho) — вокал"
  Feras_Charestan_and_Ilona_Danho: "$Feras_Charestan$; $Ilona_Danho$"
  Dan_Cecil_Hill: "Ден Сесіл Гілл (Dan Cecil Hill) — флейта"
  Dan_Cecil_Hill_facts: "Ден Сесіл Гілл (народ каюґа, клан чаплі) — виконавець і музика гауденосауні (ірокез), що знається на давньому сріблярстві та виготовленні флейт. Митець, виконавець і діяч культури, який присвятив цьому більшу частину свого життя, він намагається зберегти й поширити знання про історію свого народу з доколоніальних часів."
  Pierre_Harmon: "П’єр Гармон (Pierre Harmon)"
  Pierre_Harmon_facts: "П’єр Гармон — знаний флейтист і знавець доколумбової музики. Він здобув світове визнання завдяки своїм музикознавчим дослідженням, зокрема ацтекської музики. Він також відомий як володар однієї з найбільших збірок стародавніх інструментів, виготовленню яких присвятив своє життя."
  Laurent_Sauron: "Лоран Сорон (Laurent Sauron)"
  Pierre_Harmon_and_Laurent_Sauron: "$Pierre_Harmon$ — флейти; $Laurent_Sauron$ — ударні"
