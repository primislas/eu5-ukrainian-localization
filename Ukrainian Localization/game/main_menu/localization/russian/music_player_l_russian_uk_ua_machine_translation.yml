  Yingying_Herrdahl: "Їн’їн Геррдал (піпа)"
  Yingying_Herrdahl_facts: "Їн’їн Геррдал — віртуозна виконавиця на піпі, яка нині мешкає у Швеції."
  Pipa_facts: "Китайська піпа — струнний щипковий інструмент грушоподібної форми, на якому грають нігтями або, як повелося з давніх-давен, плектром. Її витоки сягають майже двох тисячоліть у минуле, і вона є одним із найпопулярніших китайських інструментів."
  Martin_Ostergren: "Мартін Естерґрен (орган)"
  Feras_Charestan: "Ферас Шарестан (канун)"
  Feras_Charestan_facts: "Ферас Шарестан походить із міста Аль-Хасака на північному сході Сирії; він вивчав гру на кануні у Вищому інституті музики в Дамаску."
  Qanun_facts: "Канун — струнний інструмент із родини цитр, що, ймовірно, походить зі стародавнього Межиріччя, хоча його точні витоки достеменно не відомі."
  Ilona_Danho: "Ілона Данхо (вокал)"
  Feras_Charestan_and_Ilona_Danho: "$Feras_Charestan$, $Ilona_Danho$"
  Dan_Cecil_Hill: "Ден Сесіл Гілл (флейти)"
  Dan_Cecil_Hill_facts: "Ден Сесіл Гілл (народ каюга, клан чаплі) — митець і музикант гауденосауні (ірокезів), який знається на звичаєвому індіанському сріблярстві та виготовленні флейт. Бувши більшу частину життя митцем, виконавцем і діячем культури, він присвятив себе збереженню та передачі всіх сторін історії свого народу, починаючи з доколоніальних часів США і давніше."
  Pierre_Harmon: "П’єр Армон"
  Pierre_Harmon_facts: "П’єр Армон — відомий флейтист і визнаний знавець доколумбової музики. Заживши всесвітньої слави завдяки цінним музикознавчим дослідженням, зокрема музики ацтеків, він також володіє однією з найбільших збірок старовинних інструментів, опануванню яких присвятив своє життя."
