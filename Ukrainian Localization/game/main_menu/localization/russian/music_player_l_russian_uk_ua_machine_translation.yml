  MusicPlayer_sol_chinese_Ambush_Act_3_Inspecting_the_Troops_flavour: "$MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour$"
  MusicPlayer_sol_chinese_Ambush_Act_4_and_5_Forming_Battle_Formations_and_Ambush: "Китайська — Засідка з десяти боків — Дії 4 і 5 — «Шикування до бою» / «Засідка»"
  MusicPlayer_sol_chinese_Ambush_Act_4_and_5_Forming_Battle_Formations_and_Ambush_flavour: "$MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour$"
  MusicPlayer_sol_chinese_Ambush_Act_6_and_7_The_Minor_Battle_at_Jiming_Mountain_and_Jiuli_Mountain: "Китайська — Засідка з десяти боків — Дії 6 і 7 — «Мала битва біля гори Цзімін» / «Гора Цзюлі»"
  MusicPlayer_sol_chinese_Ambush_Act_6_and_7_The_Minor_Battle_at_Jiming_Mountain_and_Jiuli_Mountain_flavour: "$MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour$"
  MusicPlayer_sol_chinese_Ambush_Act_7_and_8_Jiuli_Mountain_and_The_Defeat_of_Xiang_Yu: "Китайська — Засідка з десяти боків — Дії 7 і 8 — «Гора Цзюлі» / «Поразка Сян Юя»"
  MusicPlayer_sol_chinese_Ambush_Act_7_and_8_Jiuli_Mountain_and_The_Defeat_of_Xiang_Yu_flavour: "$MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour$"
  MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos: "Китайська — Засідка з десяти боків — Повний епос"
  MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour: "Шедевр китайської класичної музики, який зазвичай виконують віртуози. Створений у войовничому стилі та зображує битву під Ґайся 202 року до н. е., де полководець Сян Юй зазнав поразки від Лю Бана."
  MusicPlayer_sol_chinese_Chen_Sui: "Китайська — Чень-Суй"
  MusicPlayer_sol_chinese_Chen_Sui_flavour: "$Yingying_Herrdahl_facts$"
  MusicPlayer_sol_chinese_Yingzhou_Gudiao_the_Birds: "Китайська — Інчжоу Ґудяо — Птахи"
  MusicPlayer_sol_chinese_Yingzhou_Gudiao_the_Birds_flavour: "$Pipa_facts$"
  MusicPlayer_sol_chinese_Yingzhou_Gudiao_the_Fish: "Китайська — Інчжоу Ґудяо — Риби"
  MusicPlayer_sol_chinese_Yingzhou_Gudiao_the_Fish_flavour: "$Pipa_facts$"
  MusicPlayer_sol_chinese_Yingzhou_Gudiao_the_Moon: "Китайська — Інчжоу Ґудяо — Місяць"
  MusicPlayer_sol_chinese_Yingzhou_Gudiao_the_Moon_flavour: "$Pipa_facts$"
  MusicPlayer_sol_deccan_raga_keeravani: "Декан — Раґа Кіравані"
  MusicPlayer_sol_deccan_raga_keeravani_flavour: "Виконано в класичному тричастинному карнатичному стилі. Назва твору перекладається як «Раґа відданости»"
  MusicPlayer_sol_deccan_raga_nattaikurunji: "Декан — Раґа Наттайкурінджі"
  MusicPlayer_sol_deccan_raga_nattaikurunji_flavour: "Виконано в класичному тричастинному карнатичному стилі. Назва твору перекладається як «Раґа романтизму»"
  MusicPlayer_sol_deccan_raga_saraswathi: "Декан — Раґа Сарасваті"
  MusicPlayer_sol_deccan_raga_saraswathi_flavour: "Виконано в класичному тричастинному карнатичному стилі. Назва твору перекладається як «Раґа містицизму»"
  MusicPlayer_sol_iroquois_Akwesasne: "Ірокези — Аквесасне"
  MusicPlayer_sol_iroquois_Akwesasne_flavour: "$Dan_Cecil_Hill_facts$ Назва твору перекладається як «Земля, де куріпка б’є в барабан»"
  MusicPlayer_sol_iroquois_Haundenosaunee: "Ірокези — Гауденосауні"
  MusicPlayer_sol_iroquois_Haundenosaunee_flavour: "$Dan_Cecil_Hill_facts$ Назва твору перекладається як «Ірокези» — так англійською називають народ гауденосауні."
  MusicPlayer_sol_iroquois_Oswegatchie: "Ірокези — Освеґатчі"
  MusicPlayer_sol_iroquois_Oswegatchie_flavour: "$Dan_Cecil_Hill_facts$ Назва твору перекладається як «Місто/Річка»"
