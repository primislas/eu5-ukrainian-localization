l_russian:
  bubonic_plague: "Бубонна чума"
  bubonic_plague_desc: "Велика чума, що шириться жвавими торговими шляхами, не щадить ані знаті, ані простолюду. Її жертв чекають болісні чорні бубони в паху та під пахвами, нестерпна лихоманка та смерть. Дехто вважає, що цю хворобу розносять гризуни, які бігають полями та міськими вулицями."
  malaria: "Малярія"
  malaria_desc: "Малярія загрожує людству з часів глибокої давнини. Це інфекційне захворювання передається через укуси комах і викликає озноб, головний біль, рясне потовиділення та напади найсильнішої лихоманки, які повторюються раз на три або чотири дні."
  typhus: "Тиф"
  typhus_desc: "Ця смертельна хвороба викликає сильну лихоманку, червоний висип по всьому тілу та потьмарення розуму, що часом посилюється до повного божевілля. Потім хворий починає гнити заживо від гангрени та неминуче помирає."
  local_typhus_impact_modifier: "Місцевий модифікатор тифу"
  influenza: "Інфлюенца"
  influenza_desc: "Ця поширена хвороба, відома в простонародді як «грип», у здорових людей зазвичай викликає лише нежить і легкий жар, а от для дітей, людей похилого віку, поранених і хворих на інші недуги може бути смертельно небезпечною."
  influenza_location_modifier: "Місцевий модифікатор інфлюенци"
  measles: "Кір"
  measles_desc: "Ця вкрай заразна хвороба, також відома під назвами «рубеола» та «краснуха», викликає жар, кашель, чхання та сильний висип, який незабаром покриває все тіло. Вона небезпечна і для дорослих, але для дітей становить смертельну загрозу."
  measles_location_modifier: "Місцевий модифікатор кору"
  smallpox: "Віспа"
  smallpox_desc: "Жертви цієї жахливої хвороби страждають від жару та блювоти, потім їхні тіла покриваються пухирями, заповненими рідиною. Моровиці віспи призводять до масової загибелі людей, а ті, хто вижив, нерідко залишаються сліпими на все життя."
  smallpox_location_modifier: "Місцевий модифікатор віспи"
  great_pestilence_location_modifier: "Місцевий модифікатор чорної смерті"
  egyptian_plague: "Єгипетська чума"
  egyptian_plague_desc: "Ендемічна хвороба, яка періодично охоплює міста й села на берегах Нілу. Навіть ті, кому пощастило пережити великий мор 1348 року, не знають спокою від цієї пошести, оскільки вона роками блукає густозаселеними вулицями Каїра та його селянськими угіддями, уражаючи їхніх вразливих родичів і дітей. Як наслідок, цілі краї пустіють, канали руйнуються, а мамлюцькі землі поволі занепадають."
  egyptian_plague_location_modifier: "Єгипетська чума у [Concept('location', 'місцевості')|e]"
  DISEASE_CHARACTER_TRAIT: "Впливає на персонажів із рисою «[Trait.GetName]»"