l_russian:
  proclaim_pase_foral: "Проголошення pase foral"
  proclaim_pase_foral_desc: "Ми скористаємося баскським правом #italic pase foral#! — прадавнім привілеєм, що дозволяє баскським феодам розглядати й призупиняти дію королівських указів, які суперечать їхнім місцевим законам (фуерос). Ця прокламація задовольняє #Y сподівання знаті#! і зміцнює #Y стабільність#!, але тимчасово #Y обмежує можливості правителів#!."
  summon_santa_hermandad: "Скликання святої ермандади"
  summon_santa_hermandad_desc: "Ми скличемо святу ермандаду — підтримуване владою братство сільських констеблів та ополченців. За допомогою таких братств Кастилія боролася з розбійниками й зміцнювала королівські порядки в країні. Мобілізація збільшує #Y запас новобранців#!, підриває #Y ініціативу бунтівників#! і #Y здешевлює#! зміцнення стабільности."
  proclaim_pase_foral_action: "$proclaim_pase_foral$"
  proclaim_pase_foral_active: "Проголошення pase foral"
  proclaim_pase_foral_action_progress: "Діє проголошення pase foral"
  proclaim_pase_foral_action_progress_wordier: "$proclaim_pase_foral_action_progress$"
  proclaim_pase_foral_action_progress_tooltip: "$proclaim_pase_foral_action_progress$"
  summon_santa_hermandad_action: "$summon_santa_hermandad$"
  summon_santa_hermandad_active: "Скликання святої ермандади"
  summon_santa_hermandad_action_progress: "Діє скликання святої ермандади"
  summon_santa_hermandad_action_progress_wordier: "$summon_santa_hermandad_action_progress$"
  summon_santa_hermandad_action_progress_tooltip: "$summon_santa_hermandad_action_progress$"