l_russian:
  catholic_monarchs_law: "Католицькі монархи"
  catholic_monarchs_law_desc: "Шлюб, що скріпив наші корони, — основа всього, що настане після нього. Від того, як королівське подружжя вирішить правити — як рівні чи з перевагою одного дому, — залежатиме вигляд унії на багато поколінь уперед."
  iu_establish_iberian_wedding_succession_tt: "Установлює [ShowRelationTypeName('iberian_wedding_pact')] між двома коронами та визначає їхній [heir_selection|e] як [ShowHeirSelectionName('iberian_union_succession')], пов’язуючи їхнє престолонаслідування, щоби спільний спадкоємець міг об’єднати королівства"
  composite_monarchy_law: "Композитна монархія"
  composite_monarchy_law_desc: "Наші володіння об'єднані під рукою одного суверена, проте кожне з них зберігає власні закони та свободи. Ми маємо вирішити, чи поважати #italic фуерос#! кожного королівства, чи зосередити управління ними в одних руках."
  asientos_law: "Асьєнто"
  asientos_law_desc: "Корона надає #italic асьєнто#! — виключні угоди на постачання та забезпечення наших заморських володінь, і той, хто їх утримує, збирає всі багатства імперії. Унія має вирішити, чи корона залишатиме ці угоди собі, чи розділить їх між купцями всіх своїх земель."
  religious_authority_law: "Духовний авторитет"
  religious_authority_law_desc: "Нашим об’єднаним коронам належить вирішити, як застосувати владу віри. Корона може скеровувати Церкву в наших землях через #italic Patronato Real#! або спрямувати це завзяття назовні, ставши мечем і щитом християнського світу."
  legislative_authority_law: "Законодавча влада"
  legislative_authority_law_desc: "Чиєю волею мають правитися королівства? Закон може походити з королівської руки через обов’язкові #italic pragmáticas#! або спиратися на згоду власних #italic Cortes#! кожного королівства."
  crown_settlement_law: "Устрій корон"
  crown_settlement_law_desc: "Остаточний вигляд унії ще належить визначити. Єдиний закон і єдина монета можуть викувати з безлічі королівств єдину, об’єднану монархію, або ж корони продовжать існувати як міцна співдружність рівних."
  union_of_arms_law: "Union de Armas"
  union_of_arms_law_desc: "Оборона унії — обов’язок кожного королівства в її складі. Чи то через обов’язкову частку, чи добровільний внесок, королівства нестимуть тягар зброї спільно."
  iu_tanto_monta_policy: "Tanto Monta"
  iu_tanto_monta_policy_desc: "#italic Tanto monta, monta tanto#! — обидва володарі правлять як рівні, жоден не стоїть вище за іншого. Унія однакової гідности зв’язує королівства у взаємній повазі та спільній династичній єдності."
  iu_dynastic_primacy_policy: "Династична першість"
  iu_dynastic_primacy_policy_desc: "Одна корона визнається старшою в унії, а її династія — провідною серед інших володінь. Чільний дім пожинає найбільшу славу, тоді як усі члени унії поділяють становище впевненої в собі монархії."
  iu_dynastic_primacy_senior_only_tt: "Якщо ми є [senior_partner|e]:"
  iu_respect_fueros_policy: "Повага до фуерос"
  iu_respect_fueros_policy_desc: "Старовинні вольності кожного королівства підтверджуються й охороняються. Менші володіння самі правлять собою у мирі, а старша корона заслуговує на пошану, належну володарю, який зберігає вірність звичаям своїх земель."
  iu_centralized_administration_policy: "Централізоване врядування"
  iu_centralized_administration_policy_desc: "Врядування володіннями зосереджується в руках єдиного уряду. Старша корона розширює свій вплив, а менші володіння черпають правочинність із порядку єдиної держави."
  iu_crown_asientos_policy: "Королівські асьєнтос"
  iu_crown_asientos_policy_desc: "Корона сама розподіляє угоди на постачання, зосереджуючи торгівлю й коштовні метали в старшому володінні. Менші королівства мають зиск від постачання володінь, а їхні промисли пожвавлюються попитом."
  iu_shared_asientos_policy: "Спільні асьєнтос"
  iu_shared_asientos_policy_desc: "Угоди розподіляються між купцями всіх володінь. Менші королівства здобувають прямий доступ до прибуткової торгівлі постачанням, а старша корона користується дешевшим крамом, що надходить через спільну мережу."
  iu_patronato_real_policy: "Patronato Real"
  iu_patronato_real_policy_desc: "Згідно з #italic Patronato Real#!, корона відає Церквою в усіх наших володіннях, призначаючи її прелатів і розпоряджаючись її прибутками. Віра, якою відає престол, є вірою, пов’язаною з престолом."
  iu_catholic_champion_policy: "Поборник віри"
  iu_catholic_champion_policy_desc: "Our united crowns take up the banner of Christendom, championing the faith against unbeliever and heretic alike. Let our realms be known as the sword and shield of the Church."
  iu_pragmaticas_policy: "Прагматичні санкції"
  iu_pragmaticas_policy_desc: "Закон повинен походити від королівської волі. Своїм обов’язковим указом, #italic прагматиками#!, володар ухвалює закони відразу для всіх володінь, не чекаючи на схвалення будь-яких зборів."
  iu_regional_cortes_policy: "Регіональні кортеси"
  iu_regional_cortes_policy_desc: "Кожне володіння врядується за згодою власних #italic кортесів#!. Правління через давні збори надає законности кожній короні та скріплює союз добровільною вірністю."
  iu_una_ley_una_moneda_policy: "Una Ley, Una Moneda"
  iu_una_ley_una_moneda_policy_desc: "One law and one coin for all our realms. Unifying the crowns this way dilutes the old borders, strengthening the ties of the many kingdoms into a single, unified monarchy."
  iu_perpetual_crown_policy: "Вічна союзна корона"
  iu_perpetual_crown_policy_desc: "Союз скріплюється як довічна угода корон. Стійке та довговічне співробітництво надає кожному володінню законности та стабільности, а зв’язок між членами союзу стає найміцнішим."
  iu_proportional_levy_policy: "Пропорційний набір"
  iu_proportional_levy_policy_desc: "Кожне володіння виставляє свою частку в загальному війську. Союз збирає більше й краще військо, а старша корона командує ополченнями, зосередженими під її проводом."
  iu_negotiated_contribution_policy: "Договірний внесок"
  iu_negotiated_contribution_policy_desc: "Володіння роблять внесок у загальну оборону за взаємною згодою, а не з примусу. Тягар здається легшим, коли несеться добровільно, а несення його виховує дисципліну у війську та злагоду між членами союзу."
  proclaim_spanish_monarchy: "Проголосити Іспанську монархію"
  proclaim_spanish_monarchy_desc: "Проголосити численні корони нашого союзу єдиною та неподільною монархією і прийняти ім’я та гідність Іспанії."
  proclaim_spanish_monarchy_integration_tt: "Наш союз повинен досягти рівня інтеграції принаймні 5"
