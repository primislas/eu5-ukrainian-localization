  iberian_union_succession: "Іберійське династичне спадкування"
  iberian_union_succession_desc: "Різновид [heir_selection|e], що використовується християнськими монархіями краю [ShowRegionName('iberia_region')], пов’язаними [ShowRelationTypeName('iberian_wedding_pact')]. Якщо один із правителів помре, не лишивши законного спадкоємця, інший правитель успадкує його престол, об’єднавши корони в [union|e]."
  iberian_union_succession_tt: "Утворити [union|e] на випадок, якщо наш наступник не виявиться спадкоємцем попереднього правителя"
  iu_dynastic_primacy_seniority_tt: "Коли утвориться ця [union|e], член унії з найвищою [economical_base|e] призначається як [ShowSpecialStatusName('senior_partner')], запроваджуючи [ShowPolicyName('union_establish_seniority_policy')] та [ShowPolicyName('union_senior_succession_law')] для всієї унії"
  iu_tanto_monta_no_seniority_tt: "Статус [ShowSpecialStatusName('senior_partner')] у такий спосіб не призначається, а [ShowPolicyName('union_establish_seniority_policy')] та [ShowPolicyName('union_senior_succession_law')] не запроваджуються для [union|e]"
  diplomatic_status_iberian_wedding_pact_tooltip: "#T $diplomatic_status_iberian_wedding_pact_name$#!\nЦі корони пов'язані Іберійською шлюбною угодою. Якщо будь-який із правителів помре без власного спадкоємця, інший успадкує його престол, утворюючи [Concept('union', 'унію')|e] між двома країнами."
