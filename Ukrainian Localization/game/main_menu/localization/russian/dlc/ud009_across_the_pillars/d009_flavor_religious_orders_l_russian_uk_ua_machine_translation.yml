l_russian:
  d009_flavor_religious_orders.1.title: "Зміна глави"
  d009_flavor_religious_orders.1.entry: "$d009_flavor_religious_orders.1.title$"
  d009_flavor_religious_orders.1.desc: "[old_head_of_order.GetName], хто віддано [Select_CString(old_head_of_order.IsFemale, 'служила', 'служив')] при нашому дворі як очільник ордену [target_order.GetName], раптово [Select_CString(old_head_of_order.IsFemale, 'занедужала й полишила', 'занедужав і полишив')] свою посаду. Хоча багато славетних лицарів та шляхтичів прагнуть обійняти цю посаду, очевидно, що [target_ruler.GetName] уже має когось на прикметі. [target_character.GetName], [Select_CString(target_character.IsFemale, 'улюблениця', 'улюбленець')] правителя [target_ruler.GetNameWithNoTooltip], стане нов[Select_CString(target_character.IsFemale, 'ою великою магістринею', 'им великим магістром')] ордену [target_order.GetNameWithNoTooltip]!"
  d009_flavor_religious_orders.1.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
  d009_flavor_religious_orders.1.a.entry: "$common_string_ok$"
  d009_flavor_religious_orders.2.title: "[target_character.GetNameWithNoTooltip] рветься до влади"
  d009_flavor_religious_orders.2.entry: "Зростання впливу великого магістра"
  d009_flavor_religious_orders.2.desc: "За останні роки багатство та влада [target_character.GetName] значно зросли. Хоча подібне зростання особистого статку не рідкість для великого магістра [target_order.GetName], [target_character.GetSheHe], схоже, також захопився політикою столиці. Колись улюбленець [target_ruler.GetNameWithNoTooltip], тепер [target_character.GetNameWithNoTooltip] нерідко критикує наш уряд і керівництво, через що багато хто зі [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] вимагає усунути [target_character.GetHerHis] з посади великого магістра."
  d009_flavor_religious_orders.2.a: "[target_character.GetSheHe|U] чинить так, як краще для [ROOT.GetCountry.GetNameWithNoTooltip]."
  d009_flavor_religious_orders.2.a.entry: "Він чинить так, як краще для нашої країни."
  d009_flavor_religious_orders.2.b: "[target_character.GetSheHe|U] перевищує [target_character.GetHisHer] повноваження."
  d009_flavor_religious_orders.2.b.entry: "Він перевищує свої повноваження."
  d009_flavor_religious_orders.3.title: "Опальний улюбленець"
  d009_flavor_religious_orders.3.entry: "$d009_flavor_religious_orders.3.title$"
  d009_flavor_religious_orders.3.desc: "Політичне позерство, яке чинить [target_character.GetName], і далі розпалює ворожнечу між [Select_CString(target_character.IsFemale, 'нею', 'ним')] та двором. Особливо [target_character.GetHerHis] вельми привселюдний осуд правителя [target_ruler.GetName] та [target_ruler.GetHerHis] зв’язку віддалив [Select_CString(target_character.IsFemale, 'колишню улюбленицю', 'колишнього улюбленця')] правителя [target_ruler.GetName] від [target_character.GetHerHis] прибічників. Наживши ворогів серед нашої #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#! через своє стрімке піднесення, [ROOT.GetCountry.GetName] більше не мож[ROOT.GetCountry.Custom('end_eut')] покладатися на таку особу на посаді великого магістра ордену [target_order.GetName]."
  d009_flavor_religious_orders.3.a: "[target_character.GetSheHe|U] має бути страчений за зраду!"
  d009_flavor_religious_orders.3.a.entry: "Його буде страчено за зраду!"
  d009_flavor_religious_orders.3.b: "Вигнати [target_character.GetHerHim] і призначити нового главу для [target_order.GetNameWithNoTooltip]."
  d009_flavor_religious_orders.3.b.entry: "Вигнати його і призначити нового главу для Ордену."
  d009_flavor_religious_orders.1.b: "Брати [target_order.GetNameWithNoTooltip] самі оберуть собі великого магістра."
  d009_flavor_religious_orders.1.b.entry: "Брати самі оберуть собі великого магістра."