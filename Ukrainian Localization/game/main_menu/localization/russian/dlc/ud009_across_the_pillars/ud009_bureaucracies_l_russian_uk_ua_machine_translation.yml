l_russian:
  dar_al_tiraz_bureaucracy: "Дар аль-Тіраз"
  dar_al_tiraz_bureaucracy_desc: "Пишні гаптовані шати, що походять із Персії, споконвіку слугували в ісламському світі почесним одягом, яким володар обдаровує тих, кого бажає піднести. Добре забезпечена придворна майстерня #italic $dar_al_tiraz_bureaucracy$#!, де тчуть шовк, парчу й гаптують узори, зодягне двір у розкіш і розішле коштовні тканини по всіх ринках."
  diwan_al_mustakhlas_bureaucracy: "Диван аль-Мустахляс"
  diwan_al_mustakhlas_bureaucracy_desc: "#italic $diwan_al_mustakhlas_bureaucracy$#! відає особистим доменом султана — маєтками, млинами та прибутками, відділеними від державної скарбниці, аби утримувати двір і $alhambra$. Дбайливе врядування береже скарбницю корони багатою та незалежною від її володінь, проте за слабкого нагляду самі чиновники, що відають ним, обертають його багатства собі на користь."
  diwan_al_qawafil_bureaucracy: "Диван аль-Кавафіль"
  diwan_al_qawafil_bureaucracy_desc: "#italic $diwan_al_qawafil_bureaucracy$#! наглядає за величними караванами транссахарської торгівлі, шляхами крізь Сіджільмасу, що несуть золото й невільників на північ, а сіль і тканини — на південь. Добре облаштована служба оберігає купців та їхніх в’ючних тварин і примножує багатство, що мандрує пустелею, аби каравани не ставали здобиччю розбійників, а племена пісків не ворогували з країною, яка більше не охороняє шлях."
  ghuzat_mujahidin_bureaucracy: "Аль-Ґузат аль-Муджахідін"
  ghuzat_mujahidin_bureaucracy_desc: "#italic $ghuzat_mujahidin_bureaucracy$#! — це охочі оборонці віри, північноафриканська кіннота, що перетинає протоку, аби вести священну війну на кордоні під проводом власного $rank_county_arabic_ruler_male$. Ці палкі вояки б’ються із завзяттям, породженим набожністю, і їхнє благочестя надихає наш люд наслідувати їхній приклад."
  makhzan_bureaucracy: "Аль-Махзан"
  makhzan_bureaucracy_desc: "#italic $makhzan_bureaucracy$#! — це центральний устрій влади султана, чиї збирачі податків і намісники поширюють волю престолу. Сильний #italic махзан#! міцніше тримає в шорах віддалені племена й міста, але коли його врядування слабшає, країна й справді стає #italic білад ас-сіба#!, землею непокори, а окраїнні провінції скочуються до заколоту та свавілля."
  marinid_madaris_bureaucracy: "Ріаят аль-Мадаріс"
  marinid_madaris_bureaucracy_desc: "#italic $marinid_madaris_bureaucracy$#! — це опіка корони над медресе, колегіями, що готують правознавців, писарів та урядовців, на яких спирається держава. Щедро наділені дарами, вони наповнюють чиновництво вченими й відданими слугами та вкорінюють формальне право шкіл."
  qadi_al_jamaa_bureaucracy: "Каді аль-Джамаа"
  qadi_al_jamaa_bureaucracy_desc: "#italic $qadi_al_jamaa_bureaucracy$#! — верховний суддя громади, що головує в судах $maliki_school$ і призначає численних місцевих каді по всій країні. Шанований судовий устрій розв’язує суперечки за законом, визнаним усіма, і надає престолу правочинности правосуддя, поглиблюючи прихильність люду до встановленого правознавства."
  wulat_al_thughur_bureaucracy: "Вулят ас-Суґур"
  wulat_al_thughur_bureaucracy_desc: "#italic $wulat_al_thughur_bureaucracy$#! — вартові порубіжних марок. Вони тримають залоги в порубіжних замках, пильнують перевали й відають перемир’ями та даниною, що втримують великі християнські королівства на відстані. Упорядкована марка наїжачується захисниками й виграє країні час майстерною дипломатією, адже занедбання кордону лише підбадьорює сусідів, які можуть відчути слабкість і завзятіше заявити свої домагання."
  diwan_al_gharb_bureaucracy: "Диван аль-Ґарб"
  diwan_al_gharb_bureaucracy_desc: "#italic $diwan_al_gharb_bureaucracy$#! — Диван Заходу — урядова установа, яку ми запроваджуємо в наших андалуських провінціях для врядування людом, що розмовляє арабізованою романською мовою так само вільно, як і арабською, і чиї парафіяльні церкви й досі перевершують числом наші мечеті. Його писарі збирають прибутки султана, призначають каді до мішаних судів і проводять асиміляцію, що перетворює завоювання на провінцію. Добре облаштований диван прив’язує ці західні землі до нашого закону; занедбаний же віддає порубіжжя на поталу будь-якому клану, здатному нав’язати свої порядки."
  mozabite_azzaba_bureaucracy: "Рада 'аззаба"
  mozabite_azzaba_bureaucracy_desc: "#italic ʿАззāба#! — таємна рада ібадитських богословів, яка становить справжню основу врядування мозабітськими громадами долини Мзаб: вона ухвалює рішення з питань віросповідного права, розв’язує суперечки та пильнує дотримання суворого морального статуту, що зберіг ібадитську самобутність крізь століття зовнішнього тиску. Ми підтримуємо цю раду як вищого суддю нашого громадського життя, утримуючи її вчених коштом скарбниці й шануючи її постанови як вияв божественного закону. Добре забезпечена 'Аззаба втішається відданістю вірян і поширює ібадитське право на кожну оселю; позбавлена ж засобів, вона втрачає вплив, і на спорожніле місце приходять чужі вчення."
  nav_diputacion_navarra_bureaucracy: "Дипутасьйон Наварри"
  nav_diputacion_navarra_bureaucracy_desc: "$nav_diputacion_navarra_bureaucracy$ відає конституційним життям Наварри між засіданнями кортесів, стежить за збиранням #italic donativo#! та за неухильним дотриманням #italic fueros#!, які визначають наваррську самоврядність. Його склад набирається з трьох станів королівства, забезпечуючи знаті, духовенству й містам постійну участь у врядуванні своїм краєм. Добре фінансований Дипутасьйон слугує запорукою дотримання фуерос; без належних коштів він безсилий протистояти централізаційному тиску, що його великі держави неминуче чинять на свої менші володіння."
  por_desembargo_do_paco_bureaucracy: "Дезембарґу-ду-Пасу"
  por_desembargo_do_paco_bureaucracy_desc: "$por_desembargo_do_paco_bureaucracy$ — верховна королівська рада Португалії, якій доручено розгляд законів, надання помилувань і нагляд за судовими призначеннями, завдяки чому влада корони сягає кожного куточка королівства. На відміну від навчених в університетах правознавців, які служать у звичайних судах, Дезембарго складається з людей, що мають як правничі знання, так і довіру короля, поєднуючи професійне правознавство з безпосереднім служінням монархові. Добре облаштоване Дезембарго прискорює хід врядування та забезпечує точне виконання королівських рішень згідно із законом."
  por_mesa_da_consciencia_e_ordens_bureaucracy: "Меза да Консьєнсія й Орденш"
  por_mesa_da_consciencia_e_ordens_bureaucracy_desc: "$por_mesa_da_consciencia_e_ordens_bureaucracy$ була заснована для відання лицарськими орденами Португалії — Орденом Христа, Орденом Сантьяго та Орденом Авіша, — чиїми землями, прибутками й духовною владою корона розпоряджається в ролі великого магістра. Трибунал розглядає прохання про церковні дозволи, розподіляє командорства серед королівських ставлеників і розв’язує суперечності між канонічним правом і королівською опікою. Її заснування перетворило лицарські ордени із самостійних церковних корпорацій на знаряддя політики корони, тісно пов’язані з королівським задумом щодо віри."
  spa_council_of_aragon_bureaucracy: "Рада Арагона"
  spa_council_of_aragon_bureaucracy_desc: "Східними землями [ShowRegionName('iberia_region')] у складі [ShowScriptedGeographyName('aragon_geography')] відатиме #italic $spa_council_of_aragon_bureaucracy$#!. Ця установа опікується насамперед підтримкою наших зв’язків із середземноморською торгівлею та потребами місцевих фуерос."
  spa_council_of_castile_bureaucracy: "Consejo de Castilla («Рада Кастилії»)"
  spa_council_of_castile_bureaucracy_desc: "#italic $spa_council_of_castile_bureaucracy$#! відповідає за землі [ShowScriptedGeographyName('castile_geography')], керуючи цими розлогими володіннями та їхнім людом від нашого імені."
  spa_council_of_flanders_bureaucracy: "Рада Фландрії"
  spa_council_of_flanders_bureaucracy_desc: "Керуючи землями, настільки віддаленими від наших споконвічних володінь, #italic $spa_council_of_flanders_bureaucracy$ #! муситиме міцно тримати в руках [ShowScriptedGeographyName('spanish_netherlands_geography')], щоби підтримувати лад і процвітання в цьому регіоні."
  spa_council_of_italy_bureaucracy: "Consejo de Italia («Рада Італії»)"
  spa_council_of_italy_bureaucracy_desc: "З нашою дедалі більшою присутністю в [ShowRegionName('italy_region')] слід заснувати раду, чиїм прямим обов’язком стане врядування в наших нових завоюваннях. Врядування на цих землях стане для нас зовсім іншим випробуванням, ніж у наших володіннях в [ShowRegionName('iberia_region')]."
  spa_council_of_portugal_bureaucracy: "Conselho de Portugal («Рада Португалії»)"
  spa_council_of_portugal_bureaucracy_desc: "З набуттям нових володінь нам слід заснувати окрему раду для наших земель у [ShowScriptedGeographyName('portugal_geography')]. Ця установа переважно опікуватиметься нашою атлантичною торгівлею та морськими справами."
  spa_viceroy_bureaucracy: "Канцелярія віцекороля"
  spa_viceroy_bureaucracy_desc: "$spa_council_of_indies_bureaucracy_desc$"
  spa_council_of_crusade_bureaucracy: "Consejo de Cruzada («Рада Хрестового походу»)"
  spa_council_of_crusade_bureaucracy_desc: "Заснована за згодою з [GetUniqueInternationalOrganization('catholic_church').GetName] та [pope], #italic $spa_council_of_crusade_bureaucracy$#! скеровуватиме наше розширення та зусилля з несення світла [ShowReligionAdjective('catholic')]ої віри в усі куточки світу."
  spa_council_of_finance_bureaucracy: "Consejo de Hacienda («Рада скарбниці»)"
  spa_council_of_finance_bureaucracy_desc: "Заступаючи дві колишні служби — Рахівну палату та Головну рахівну палату, — #italic $spa_council_of_finance_bureaucracy$ #! усуне тертя між цими двома відомствами та створить єдину установу для відання державними фінансами."
  spa_council_of_indies_bureaucracy: "Consejo de las Indias («Рада Індій»)"
  spa_council_of_indies_bureaucracy_desc: "Усе, що лежить за морем, підпаде під юрисдикцію #italic $spa_council_of_indies_bureaucracy$ #!. Вона відатиме всією торгівлею, що прямує з колоній до метрополії та до наших підданих на чужих берегах, забезпечуючи безперервний потік багатств до нашої скарбниці. Лад і звичаї наших новонабутих підданих, а також розподіл земель для колоніального освоєння також перебуватимуть у віданні цієї ради."
  spa_council_of_inquisition_bureaucracy: "Consejo de la Suprema Inquisición («Рада Верховної інквізиції»)"
  spa_council_of_inquisition_bureaucracy_desc: "#italic $spa_council_of_inquisition_bureaucracy$#!, що складається з кількох апостольських інквізиторів та очолюється генеральним інквізитором, наглядає за чистотою віри та судовими розглядами в нашій країні. Вона слугуватиме найвищою апеляційною інстанцією як у церковних, так і в мирських справах."
  spa_council_of_military_orders_bureaucracy: "Consejo de las Órdenes («Рада орденів»)"
  spa_council_of_military_orders_bureaucracy_desc: "Відповідаючи за відання їхніми колишніми землями, #italic«$spa_council_of_military_orders_bureaucracy$»#! відіграватиме важливу роль у виділенні земель для наших воєнних потреб, збільшуючи запас для набору наших військ і забезпечуючи вишкіл та залучення здібних старшин до наших лав."
  spa_council_of_state_bureaucracy: "Consejo de Estado («Державна рада»)"
  spa_council_of_state_bureaucracy_desc: "#italic«$spa_council_of_state_bureaucracy$»#! очолюється безпосередньо нашим правителем і допомагає йому в питаннях зовнішньої політики без сторонніх впливів. Рада складається зі здібних представників нашої знаті та духовенства, навчених дипломатії та міжнародним зносинам, і як керуватиме нашими посольствами за кордоном, так і радитиме у веденні складних міжнародних справ."
  dawa_bureaucracy: "Диван аль-Даʿва"
  dawa_bureaucracy_desc: "#italic $dawa_bureaucracy$#! — установа, через яку володар керує справами віри за морем, спрямовуючи кадіїв та проповідників у далекі провінції, де панування випередило мечеть. Її #italic duʿāt#! несуть заклик ісламу народам тих берегів, а її писарі долучають нові колонії до закону умми. За належного піклування вона перетворює далеке завоювання на обжиту провінцію та примножує кількість вірних під владою корони. Якщо ж нею нехтувати, далека паства вислизає з-під руки володаря, і заклик замовкає там, де нікому його піднести."