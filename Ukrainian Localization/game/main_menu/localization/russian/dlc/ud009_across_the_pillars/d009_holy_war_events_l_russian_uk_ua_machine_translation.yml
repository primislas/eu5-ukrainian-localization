l_russian:
  holy_war.11.title: "Харцизи на порубіжжі"
  holy_war.11.desc: "Загін #italic кабальгади#! із країни [cabalgada_raider.GetName] пронісся нашими порубіжними землями, спалюючи села та забираючи все, що міг, перш ніж вислизнути назад за межу. Наші незахищені землі розграбовано. Чи скликати нам ополчення для охорони маркграфств, чи залишити це зухвальство без відповіді?"
  holy_war.11.a: "Зібрати ополчення на кордоні!"
  holy_war.11.b: "Нам залишається лише терпіти це."
  holy_war.12.title: "Вимога данини"
  holy_war.12.desc: "Посланці з країни [parias_demander.GetName] прибувають до нашого двору із суворим посланням: проти нас збирається [Concept('crusade', 'хрестовий похід')|e], і якщо ми не заплатимо данину, його війська рушать на наші землі. Наші радники застерігають, що наше золото лише виграє час, притлумивши їхню жадобу крові, але ніколи не вгамує її повністю. Чи заплатимо ми, щоб відтермінувати розплату, чи кинемо їм виклик і приготуємося до бурі?"
  holy_war.12.a: "Заплатити данину й виграти для нас час."
  holy_war.12.a.tt: "Відкладає [Concept('crusade', 'хрестовий похід')|e], відкидаючи його підготовку назад на #G 30#! та знижуючи релігійний запал на #G 10#!"
  holy_war.12.b: "Нас не залякати. Нехай приходять."
  holy_war.12.b.tt: "Підвищує релігійний запал [Concept('crusade', 'хрестового походу')|e] на #R 10#!"
  holy_war.15.title: "Харцизи з півдня"
  holy_war.15.desc: "Загін #italic ґазва#! із країни [ghazw_raider.GetName] пронісся нашими порубіжними землями, спалюючи села та забираючи все, що міг, перш ніж вислизнути назад за межу. Наші незахищені землі розграбовано. Чи скликати нам ополчення для охорони рубежів, чи залишити це зухвальство без відповіді?"
  holy_war.15.a: "Зібрати ополчення на кордоні!"
  holy_war.15.b: "Нам залишається лише терпіти це."
  holy_war.16.title: "Морські розбійники"
  holy_war.16.desc: "Корсари з країни [shore_raider.GetName] напали на наше узбережжя, розграбувавши гавані та забравши наших людей у кайданах, перш ніж їхні вітрила зникли за горизонтом. Наші незахищені береги сплюндровано. Чи скликати нам ополчення для охорони узбережжя, чи залишити це зухвальство без відповіді?"
  holy_war.16.a: "Зібрати ополчення на узбережжі!"
  holy_war.16.b: "Нам залишається лише терпіти це."