l_russian:
  seven_cities.10.title: "Сяйливе місто вдалині"
  seven_cities.10.desc: "Місцеві провідники охоче починають розмову, варто лише налити вина та викласти товари для огляду. Так, вони чули про країну, якою розпитує [target_leader.GetName]. Так, там є місто, за наступною сьєррою, можливо, ще за два тижні ходу. Один чоловік присягається, що бачив здалеку, як сонце сходить над його золотавими стінами. Інший каже, що його дядько торгував там цілий сезон і повернувся багатієм. Третій запевняє, що все це казочки, а перші двоє скажуть що завгодно за мірку бренді. Хроніст записує геть усе."
  seven_cities.10.a: "Бренді для тих, чиї байки найкращі."
  seven_cities.10.b: "Попрощатися з ними й вирушити в путь."
  seven_cities.10.b.tt: "#italic Ми прощаємося з оповідачами й вирушаємо в путь, довіряючи дорозі більше, ніж черговій байці#!"
  seven_cities.10.historical_info: "Перші іспанські, французькі та англійські ентради (виправи) в Америці майже повністю покладалися на відомості від корінних жителів для географічної розвідки. Ці відомості часто формувалися під впливом того, що, на думку тубільців, хотіли почути їхні допитувачі, або того, до яких дій вони хотіли їх підштовхнути (найчастіше — змусити піти), а також уявних картин, із якими європейці вже прибували. Результатом ставало замкнене коло зворотного зв'язку, в якому європейські легенди про золоті міста підтверджувалися свідченнями корінних народів, які самі підлаштовувалися під європейські очікування."
  natives_provide_crudely_drawn_map_tt: "#Y Місцеві жителі надають грубо накреслену мапу навколишніх земель#!"
  expedition_learns_of_potential_dangers: "#Y [expedition|e] дізнається про можливі місцеві небезпеки#!"
  bonding_over_alcohol_locals_migrate_tt: "#Y Спільна любов до хмільного й щирої розмови породжує братерські узи#!"
  improve_root_culture_view_of_location_dominant_culture_tt: "Наше [cultural_opinion|e] до культури [target_location.GetDominantCulture.GetName] поліпшиться"
  expedition_observes_local_innovations: "#Y Місцеві нововведення досліджено та внесено до каталогу#!"
  expedition_receives_artifacts_as_gifts: "#Y Після повернення до [ROOT.GetCountry.GetCapital.Custom('CL_INST')] в дар будуть піднесені культурні артефакти #!"
  should_calamity_occur_chance_to_avoid_tt: "Місцеві ворожі ватаги й дика природа стануть менш небезпечними"
  may_bring_us_closer_to_uncovering_goal_tt: "Це може наблизити нас до розкриття того, що ми шукаємо"
  expedition_brought_back_riches_tt: "[expedition|e] привезла назад багатства:"
  expedition_brought_back_exotic_goods_tt: "Носії та вантаж [expedition|e] привезли назад екзотичні товари:"
  expedition_brought_back_artifacts_tt: "[expedition|e] привезла дарунки та артефакти:"
  expedition_healer_joins_court_tt: "До нашого двору приєднується місцевий цілитель, коли [expedition|e] повертається"
  porters_guides_prevent_stalling: "Носії та провідники, що супроводжують [expedition|e], не дають їй затриматися"
  warned_expedition_avoids_calamity_tt: "Попереджена про місцеві небезпеки, [expedition|e] уникає лиха"
  seven_cities.11.title: "Бенкет гостинности"
  seven_cities.11.desc: "Усе містечко виходить нам назустріч, ще поки ми не встигли розбити табір: гримлять барабани, площа виметена, а на рогожах викладено більше їжі, ніж люди бачили за місяць маршу. Їхній старійшина вітає [target_leader.GetName] із поважною чемністю, притаманною рівному, і бенкет уже в повному розпалі, перш ніж хтось замислюється поставити бодай одне питання. Наші перекладачі шепочуть, що настільки теплий прийом ніколи не буває безкорисливим, і те, що гостю нав'язують на одному подиху, зазвичай зараховують проти нього на наступному. З усім тим, привітний господар і щедрий стіл розв'язали більше язиків, ніж будь-яка погроза, до якої ми могли б вдатися."
  seven_cities.11.a: "Відповісти на їхню привітність відкритими руками й відкритим гаманцем."
  seven_cities.11.b: "Ми перетнули океан не для того, щоб сидіти та їсти."
  seven_cities.11.b.tt: "#italic Ми приймаємо частування, але бережемо гаманець і вирушаємо в путь перш ніж гостинність обернеться зобов’язанням#!"
  seven_cities.11.historical_info: "Обрядова гостинність посідала чільне місце в дипломатії на більшій частині Америки, і європейців, що прибували, нерідко зустрічали бенкетами, дарами та врочистим прийомом ще до початку будь-яких перемовин. Загін Коронадо приймали й годували міста пуебло вздовж Ріо-Ґранде, а загін де Сото — вожді міссісіпських племен на південному сході; в обох випадках це було способом убезпечити себе від небезпечних чужинців, а зовсім не підкоритися їм. Європейці ж навмисне везли з собою скляні намистини, соколині бубонці, тканини та ножі, щоб розпочати такі обміни. Дари купували прихильність і відомості, але саму угоду кожна сторона майже завжди розуміла геть по-своєму."
  expedition_receives_guides_and_porters: "#Y До виправи долучаються провідники та носії#!"
  expedition_less_likely_to_stall_tt: "[expedition|e] з меншою ймовірністю затримуватиметься"
  expedition_receives_exotic_goods: "#Y [expedition|e] вимінює дивовижні місцеві товари, щоб привезти додому#!"
  seven_cities.12.title: "Завзятий провідник"
  seven_cities.12.desc: "Він знаходить нас, а не ми його: худорлявий, усміхнений чоловік, який, схоже, трохи знає мову кожного зустрічного народу на шляху, і клянеться, притиснувши руку до серця, що на власні очі бачив браму золотого міста. Він просить лише платню провідника та скромну частку слави за те, щоб привести нас туди. [target_leader.GetName] слухає його з настороженістю бувалого чоловіка, якому вже доводилося чути цю саму обіцянку — в інших долинах, з інших вуст. Люд же вже все для себе вирішив, і очі їхні палають не менш яскраво, ніж у нього самого."
  seven_cities.12.a: "Багатство і слава!"
  seven_cities.12.b: "Геть звідси, жебраку!"
  seven_cities.12.b.tt: "#italic Ми проганяємо усміхненого провідника й тримаємося шляху, який здатні розібрати самі#!"
  seven_cities.12.historical_info: "Найвідомішим провідником північноамериканських ентрад був полонений індіанець із Великих рівнин, якого іспанці прозвали Ель Турко (Турок). Він розповів виправі Коронадо про Ківіру — королівство на північному сході, начебто багате на золото. Він тижнями вводив колону вглиб Великих рівнин і пізніше під час допиту зізнався, що навмисно спрямовував її в безкраї прерії в надії, що люди та їхні коні там загинуть. Коли Ківіри врешті-решт дісталися, вона виявилася лише скупченням солом'яних хатин племені вічита без краплі золота, а Ель Турко був страчений. Цей епізод був типовим: провідники мали власні причини для того, куди саме вести озброєних чужинців, і ці причини рідко збігалися з планами виправи."
  expedition_uncovers_riches_in_new_waypoint: "#Y Шлях провідника виявився правильним — він привів до справжніх багатств#!"
  expedition_led_to_deathly_trap: "#Y Провідник заводить нас у засідку, і [expedition|e] втрачена#!"
  guide_lied_waste_of_time: "#Y Провідник водив нас колами, а його золоте місто виявилося брехнею#!"
  target_character_flogged_tt: "Брехливого провідника карають батогами за обман"
  seven_cities.13.title: "Знайома говірка"
  seven_cities.13.desc: "Десь дорогою [target_leader.GetName] перемінився. Раніше [target_leader.GetSheHe] говорив лише про місто попереду, а тепер [target_leader.GetSheHe] говорить про тутешній люд: про їхню говірку, яку [target_leader.GetSheHe] вже наполовину вивчив, про прихисток, що йому запропонували, про спокійне життя, яке чекає, якщо [target_leader.GetSheHe] нарешті перестане блукати. Сьогодні вранці [target_leader.GetSheHe|U] прямо сказав нам, що виправа може йти далі, але сам [target_leader.GetSheHe] не піде. Дехто гине в глушині, а інших, схоже, глушина забирає собі."
  seven_cities.13.a: "Нехай же [target_leader.GetHerHim] залишиться, і нехай мрія скінчиться тут."
  seven_cities.13.historical_info: "Європейці, які зазнали кораблетрощі або потрапили в полон і роками жили серед тубільних народів, високо цінувалися наступними виправами як тлумачі. Ернандо де Сото знайшов Хуана Ортіса, вцілілого з ранішої виправи Нарваеса, який прожив серед племені юсіта у Флориді близько одинадцяти років; Ортіс служив йому перекладачем до самої своєї смерті в дорозі. Ґонсало Ґерреро, який зазнав кораблетрощі біля берегів Юкатану в 1511 році, пішов зовсім іншим шляхом: узяв шлюб у громаді мая, відмовився від порятунку і, за переказами, загинув у бою проти іспанців. Такі люди були живими мостами між світами, і їхня вірність могла схилитися на будь-який бік."
  seven_cities.14.title: "Джерело юності?"
  seven_cities.14.desc: "Розповідь доходить до нас із третіх уст і розростається з кожним переказом: десь у пагорбах попереду є джерело, чиї води зцілюють старі рани, випростують зігнуті спини й повертають людині роки, вкрадені походом. Тубільці говорять про нього з тією настороженою шанобливістю, яку бережуть для святих місць, — а це або доказ чогось, або взагалі нічого не доводить. Наш лікар лише закочує очі й бурмоче про болотяну пропасницю. Половина табору вже наповнює бурдюки."
  seven_cities.14.a: "Оглянути джерело."
  seven_cities.14.b: "Немає часу хлюпатися у воді!"
  seven_cities.14.b.tt: "#italic Ми проходимо повз легендарне джерело, залишаючи його води довірливим#!"
  seven_cities.14.historical_info: "Джерело юності було невіддільною частиною географічних легенд, які європейці принесли до Америки, і його пов’язали з виправою Хуана Понсе де Леона до Флориди в 1513 році. Твердження, ніби він вирушив у плавання саме на пошуки живої води, — значною мірою пізніше перебільшення, вперше поширене його політичними ворогами, проте воно спиралося на давніші старосвітські легенди про цілющі джерела, що подовжують життя, в які багато хто щиро вірив. Місцеві жителі на Карибах та на південному сході справді скеровували європейців до священних і цілющих вод — справжніх складових їхнього власного ритуального ландшафту. Відстань між тим, про що розповідали, і тим, що шукали, виявилася, як і раніше, надто великою."
  spend_some_time_recovering: "#Y Люди відпочивають і деякий час п'ють цілющі води#!"
  retrieve_some_rejuvenating_water: "#Y Фляги легендарної живої води забрано із собою#!"
  just_water_hole: "#Y Виявляється, це звичайний водопій…#!"
  seven_cities.15.title: "Блиск у річищі"
  seven_cities.15.desc: "Один із наших людей надвечір присів біля струмка, промиваючи гравій у лотку так, як учили його старі рудокопи, і враз скрикує — чи то лаючись, чи то сміючись: у намулі виблискує одна-єдина яскрава крупинка [target_material.GetName]. Отже, вище за течією її більше. Скарб це, за яким увесь похід женеться через цілий материк, чи лише марна мішура, здатна тільки на те, щоб звабити жадібних людей, — сьогодні ніхто сказати не може, та й питати не надто хочеться."
  seven_cities.15.a: "Усім до річки з лотками."
  seven_cities.15.b: "Ба! Ну звісно, король піриту!"
  seven_cities.15.historical_info: "Сьєрра-де-ла-Плата, або Срібна гора, була чуткою, яка з 1520-х років манила іспанські та португальські виправи вглиб басейну річки Ріо-де-ла-Плата, давши назву спочатку річці, а згодом і всій країні (Аргентині). Ця чутка не була безпідставною: вона, нехай і туманно, вказувала на реальні срібні багатства Анд, насамперед на гору Потосі, відкриття якої у 1545 році змінить усю світову економіку. Проте люди, які йшли за першими звістками вгору річкою, знаходили здебільшого злидні та ворожі землі замість срібла, а омріяна сьєрра вислизала від них упродовж цілого покоління. Крупиці металу, намиті на дні якогось струмка, часто залишалися єдиним матеріальним доказом того, що ця історія не була чистою вигадкою."
  expedition_brings_back_valuable_materials: "#Y Коштовну руду видобуто й доправлено на ринок міста [ROOT.GetCountry.GetCapital.GetName]#!"
  study_their_technique: "#Y Ми опановуємо нові прийоми гірництва, що зменшує витрати на розширення рудників і збагачує наші найкращі родовища#!"
  men_are_met_by_hunger_and_false_legends: "#Y Русло річки не приносить нічого, крім голоду та марних сподівань#!"
  expedition_outcome_severely_hindered_tt: "Ми втрачаємо один із наших важкою працею здобутих слідів"
  hunt_for_precious_metals_target_mining_location_goes_cold_tt: "Ми облишимо пошуки металів та рушимо далі"
  seven_cities.16.title: "Гостинність вождя"
  seven_cities.16.desc: "Село велике й охайне, а вождь приймає нас із настороженою чемністю, яка, очевидно, дається йому нелегко. Його комірчини повні, а молоді воїни знають кожну стежку вглиб материка. Крім того, він має всі причини бажати, щоб до ранку нас тут не було. Наші офіцери дивляться на ці склади провізії та на ці незадіяні міцні спини й бачать у них готових носіїв та провідників. [target_leader.GetName] мусить вирішити, чи це місце для укладання угоди, чи для того, щоб силою забрати необхідне, залишивши розплату тим, хто прийде після нас."
  seven_cities.16.a: "Схопити вождя й погнати його людей під вістрями списів."
  seven_cities.16.b: "Домовитися про добровільних носіїв і розійтися з миром."
  seven_cities.16.c: "Нікого не турбувати. Згорнути табір і рушити далі."
  the_captive_chief_yields_guides: "#Y Полонений вождь надає провідників, які знають стежки вглиб материка#!"
  the_chiefs_hall_is_plundered: "#Y Оселя вождя позбавляється свого оздоблення, перш ніж ми вирушимо в похід#!"
  the_village_empties_before_us: "#Y The village melts into the forest overnight, guides and all#!"
  coerced_locals_resent_us_tt: "Наше [cultural_opinion|e] щодо [target_location.GetDominantCulture.GetName] погіршиться"
  seven_cities.16.historical_info: "Звичним методом Ернандо де Сото під час перетину південного сходу було захоплення місцевого касика (верховного вождя) одразу по прибутті та утримання його як заручника для гарантування провізії, носіїв і провідників на наступний етап маршу. Полоненого володаря відпускали або обмінювали на кордоні його володінь на сусіднього вождя, і процес повторювався. У короткостроковій перспективі ця тактика працювала, залишаючи за колоною шлейф зруйнованих вождівств, розірваних союзів і тривалої ненависти. Водночас вона трималася на міссісіпській структурі сильної одноосібної влади вождів і зазнавала повного краху там, де влада була більш розпорошеною."
  seven_cities.17.title: "Звістка з берега"
  seven_cities.17.desc: "Прибережні жителі випливають нам назустріч ще до того, як якір торкнувся дна, а надвечір уже торгують із нами рибою та свіжими плодами — і розмовами того швидше. Видно, що справа для них звична. За ніж чи відріз тканини вони охоче повідають, що лежить за смугою дерев, і розповідають залюбки, раз у раз показуючи вглиб землі та далі. Чи вказують вони нам шлях до правди, чи лише до своїх сусідів — з берега годі розібрати."
  seven_cities.17.a: "Виміняти відомості про те, що лежить углиб материка."
  seven_cities.17.b: "Позначити якірну стоянку й продовжити похід."
  seven_cities.17.b.tt: "#italic Ми позначаємо якірну стоянку на мапах і продовжуємо похід, не гаючи часу на торги за чутки#!"
  the_shore_folk_point_the_way: "#Y Прибережні жителі вказують нам ясний шлях до того, що ми шукаємо#!"
  the_shore_market_yields_goods: "#Y Жвава торгівля на піску наповнює наші трюми місцевим крамом#!"
  the_shore_folk_send_us_at_their_rivals: "#Y Їхні вказівки водять нас колами в бік якогось поселення суперників#!"
  seven_cities.17.historical_info: "Прибережні народи зазвичай першими з американців зустрічалися з будь-якою виправою, і саме вони ставали першим джерелом відомостей про все, що лежало вглиб материка. Контакти Верраццано й Картьє вздовж узбережжя Північної Атлантики, карибські висадки перших іспанських плавань і зустрічі португальців на бразильському березі — усе це відбувалося за тим самим зразком: насторожена торгівля, взаємне вивчення та потік географічних чуток, що линув із узбережжя вглиб краю. Прибережні громади нерідко підбурювали чужинців іти далі, туди, що лежало ще далі вглиб материка, — і щоб позбутися їх, і щоб спрямувати їхні зазіхання на суперників. Тому все, що узбережжя повідомляло про внутрішні землі, було вже пропущено крізь власні інтереси прибережних жителів задовго до того, як сягало європейського вуха."
  seven_cities.18.title: "Гавань порятунку"
  seven_cities.18.desc: "Ця гавань — усе, про що може благати змучена виправа. Вона глибока й добре захищена, прісна вода стікає до берега, досить широкого, щоб витягти кораблі на карену й очистити їхні днища від гнилі. Екіпажам перепочинок потрібен не менше, ніж корпусам — лагодження. Але флот, витягнутий на берег, нікуди не пливе, а люди, що байдикують у чужій країні, мають дивовижний хист знаходити прикрощі. [target_leader.GetName] зважує, скільки днів потребуватиме належне лагодження, зіставляючи це зі станом кораблів та настроєм екіпажів."
  seven_cities.18.a: "Витягти кораблі на карену й як слід поповнити запаси."
  seven_cities.18.b: "Перепочити одну ніч і відплисти далі."
  seven_cities.18.b.tt: "#italic Ми даємо екіпажам одну ніч на березі й знову виходимо в море, перш ніж кораблі пустять тут коріння#!"
  the_refit_goes_smoothly: "#Y Лагодження проходить гладко, і кораблі після нього слухаються керма ліпше, ніж раніше#!"
  a_wreck_yields_salvage: "#Y Екіпажі розбирають кістяк затонулого корабля, що гниє на мілині, забираючи все, що може згодитися#!"
  the_crew_falls_to_brawling: "#Y Знічев’я на березі екіпажі зчиняють бійки, і кілька днів іде на повернення ладу#!"
  seven_cities.18.historical_info: "Затишна гавань була необхідна будь-якій виправі, частина шляху якої проходила морем: там можна було нахилити й полагодити корпуси кораблів, поповнити запаси прісної води та дров, дати перепочинок виснаженим переходом людям. Флот Магеллана простояв на зимівлі п’ять місяців у бухті Сан-Хуліан на узбережжі Патагонії, де вимушена зупинка обернулася ще й заколотом, який він придушив із великою жорстокістю. Часто дослідники проводили на таких стоянках за лагодженням більше часу, ніж під вітрилами, і добра гавань із привітним або байдужим місцевим людом могла вирішити, чи продовжить виправа шлях, чи розпадеться. Вибір місця для стоянки нерідко важив не менше, ніж вибір напрямку походу."
  seven_cities.20.title: "Край нас не прогодує"
  seven_cities.20.desc: "Земля, якою ми йдемо, сухіша й безплідніша, ніж ішлося в донесеннях. В’ючні тварини починають вибиватися з сил. Люди вже десять днів на половинному пайку. Місцеві поселення посховали або спалили свої запаси. Прісна вода є лише у двох долинах із шести. [target_leader.GetName] збирає старшин у затінку колючого дерева й питає, скільки ще вони зможуть протриматися без підвезення харчів."
  seven_cities.20.a: "Купити припаси за всяку ціну."
  seven_cities.20.b: "Зупинитися й дати людям перепочити."
  seven_cities.20.historical_info: "Забезпечення засобами було постійним обмеженням для досліджень у глибині американського континенту. Армію Кортеса годував переважно політичний колапс влади ацтеків, який дозволив тлаcкальцям та іншим союзникам забезпечувати його провіантом. Колона Коронадо, що рухалася на південний захід, не мала подібної підтримки й поступово виснажувалася від голоду в міру просування на північ. Така модель повторювалася від Флориди до Патагонії: ентрада, яка не могла купити або відібрати їжу в землях, які перетинала, просто танула в дорозі, незалежно від того, яке золото чекало попереду."
  seven_cities.21.title: "Засідка в каньйоні"
  seven_cities.21.desc: "Загін увійшов у вузьку ущелину між двома вапняковими стінами, і тубільці перекрили дорогу позаду. Стріли згори; воїни з кам’яними палицями на дні каньйону; в’ючний обоз розсипається. Люди роблять те, що люди в такому становищі робили завжди — збиваються в коло, притиснувшись спинами до скелі. [target_leader.GetName] радиться із сержантами. Вибір такий: прориватися крізь каньйон ціною втрат або відступити назад і шукати іншу дорогу в обхід."
  seven_cities.21.a: "Прорватися крізь каньйон сталлю й пострілами."
  seven_cities.21.b: "Відступити й знайти іншу дорогу."
  seven_cities.21.historical_info: "Партизанська війна корінного населення із засідками на зручній для оборони місцевости — у вузьких каньйонах, гірських перевалах, лісових стежках — була найефективнішою формою опору раннім колоніальним ентрадам. Іспанські обладунки, вогнепальна зброя та коні давали вирішальну перевагу на відкритій місцевості, але повністю нівелювалися в умовах обмеженого простору. Приблизно половина маршів Коронадо на південному заході були вимушеними обхідними шляхами навколо територій, які його колона не могла безпечно перетнути. Та ж сама модель зумовила довгу низку невдалих французьких та англійських вилазок углиб Північної Америки до настання XVIII століття."
  seven_cities.22.title: "Стародавні руїни"
  seven_cities.22.desc: "Стежка підіймається на гребінь і відкриває вид на те, що колись було містом. Мури кам’яні, дахи здебільшого обвалилися, вулиці поросли деревами, яким уже сто літ. Людей немає. Тут давно вже нікого не було. Дозорці обходять край руїн на шанобливій відстані, літописець робить нарис, а священник сперечається сам із собою, чи ступати всередину, адже відомо, що мертві міста насилають хворобу на тих, хто їх осквернить. [target_leader.GetName] дає малювальнику годину часу."
  seven_cities.22.a: "Описати руїни перед тим, як рушати далі."
  seven_cities.22.historical_info: "Доколумбова Америка була переповнена покинутими поселеннями: міссісіпські курганні осередки на південному сході, великі будинки пуебло на південному заході, сам Чако, басейн Тіуанако в Андах, міста майя в південному Юкатані. Європейські дослідники XVI століття, подорожуючи цими ландшафтами, регулярно натрапляли на кам'яні споруди, сільськогосподарські тераси та церемоніальні осередки, залишені за століття чи більше до їхнього приходу. Стійка європейська теорія про те, що ці руїни мають бути справою рук зниклого європейського чи середземноморського населення (валлійців, фінікійців чи втрачених колін Ізраїлевих), уже перебувала в обігу до 1540-х років і в деяких колах доживе аж до ХХ століття."
  seven_cities.30.title: "Слід уривається"
  seven_cities.30.desc: "Колона дісталася місця зустрічі, яке провідники описували як браму до краю, куди нас вирядили. Ніякої брами немає. Провідники або брехали, або самі обманулися; огляд навколишніх пагорбів не виявив ані міста, ані диму, ані дороги, жодної ознаки того, що тут хтось бував на пам’яті живих. [target_leader.GetName] пише короні, просячи вказівок, а потім жмакає листа — допоки він дістанеться порту, колона вже зробить власний вибір. Є два шляхи: рушити далі в глибину краю, раптом місто лежить лише на одну долину далі; або повернути колону назад і рушати додому з тим, що вже здобуто."
  seven_cities.30.a: "Продовжити шлях до міста, попри все."
  seven_cities.30.b: "Повернути назад і щиро доповісти про те, що сталося."
  seven_cities.30.historical_info: "Стандартним фіналом для невдалих ентрад був не драматичний розгром чи різанина, а повільне згасання: у колони закінчувалися запаси, розвідники гинули від хвороб або втікали, а кожен обіцяний орієнтир виявлявся або непорозумінням, або брехнею, аж поки вцілілі офіцери не розвертали людей і не йшли додому через землі, які тепер, як вони знали, були порожніми. Виправа Коронадо, виправа Кабрільйо, виправа Де Сото, виправа Агірре вниз Амазонкою — усі вони тією чи іншою мірою пройшли цей шлях. Успішні ж ентради аналогічного масштабу були настільки рідкісними, що карбувалися в пам'яті на століття."
  may_bring_us_closer_and_fill_our_holds_tt: "Це може наблизити нас до розгадки того, що ми шукаємо, і наповнити наші трюми місцевим крамом"
  seven_cities.16.c.tt: "#italic Ми лишаємо вождя в спокої та продовжуємо похід, не беручи ні заручників, ні носіїв#!"