l_russian:
  d009_flavor_iberian_union.1.title: "Проголосити Іспанську монархію"
  d009_flavor_iberian_union.1.a: "Хай буде проголошена Іспанська монархія!"
  d009_flavor_iberian_union.1.desc: "Корони нашої унії зв’язалися настільки тісно, що тепер це єдина держава в усьому, крім назви. Наш уряд керує всіма землями, наші закони та монета діють від одного кінця півострова до іншого, а менші королівства перетворилися на провінції єдиного великого цілого.\n\nНастав час відкинути старі титули й проголосити перед усім світом єдину суверенну монархію: Іспанію."
