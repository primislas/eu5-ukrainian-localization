l_russian:
  flavor_cas.152.title: "Єдиний податок для всього королівства"
  flavor_cas.152.entry: "$flavor_cas.152.title$"
  flavor_cas.152.desc: "Наша війна проти маврів тяжким тягарем лягла на скарбницю, і [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] змушен[ROOT.GetCountry.Custom('crown_yiaei')] шукати нові джерела прибутку для фінансування цієї війни. Міста королівства погодилися надати нам збір із продажу, але чимало наших радників вважають, що це має бути не тимчасовий захід, а узаконене постійне джерело прибутку."
  flavor_cas.152.a: "Ми не можемо покладатися на тимчасові підношення."
  flavor_cas.152.b: "Ми не зловживатимемо їхньою щедрістю."
  flavor_cas.152.historical_info: "За правління Альфонсо XI Кастилія зазнавала скарбової скрути через війни проти Гранади. Щоб оплатити облогу та здобуття Альхесіраса, кастильські міста дарували королю #italic алькабалу #! — податок із продажу, що стягувався з торгових угод. Спершу задуманий як надзвичайний воєнний збір, схвалений містами через кортеси, цей податок невдовзі став одним із найважливіших джерел королівських прибутків Кастилії. Пізніші монархи розширили й закріпили цей податок, перетворивши його на постійний збір, який протягом століть забезпечував значну частку прибутків корони."