l_russian:
  a_legionaries_1: "Ранні легіонери"
  a_legionaries_1_desc: "$a_legionaries_1$ зберігають найдавніші звичаї дисципліни та військового вишколу. Довгі списи, широкі щити та згуртований стрій дозволяють їм стояти, немов скеля, в хаосі будь-якої битви."
  a_legionaries_2: "Легіонери"
  a_legionaries_2_desc: "Ці легіонери, навчені мистецтву ближнього бою, озброєні метальними списами та короткими мечами. Їхня сила полягає у твердому строю та постійних тренуваннях."
  a_legionaries_3: "Реформовані легіонери"
  a_legionaries_3_desc: "$a_legionaries_3$ — це досвідчені піхотинці з першосортною зброєю та обладунками. Вони становлять основу наших військ."
  a_legionaries_4: "Важкоозброєні легіонери"
  a_legionaries_4_desc: "$a_legionaries_4$ — це добірні піхотинці, екіпіровані найкращою зброєю та обладунками. Подібно до важкоозброєних легіонерів Стародавнього Риму, вони служать молотом, що трощить наших ворогів."
  a_legionaries_5: "Гвардійські легіонери"
  a_legionaries_5_desc: "$a_legionaries_5$ підготовлені за найвищими стандартами наших легіонів. Вони відібрані з-поміж найкращих вояків, тому виконують найвідповідальніші завдання та охороняють найважливіші державні установи."
  a_legionaries_6: "Імперські легіонери"
  a_legionaries_6_desc: "$a_legionaries_6$ уособлюють собою вершину багатовікової еволюції військової справи. Майстерно володіючи зброєю, тактикою та стратегією, вони служать особистою охороною правителів. Однієї їхньої присутності достатньо, щоб похитнути ворожу рішучість."
  a_byzantine_cataphracts_2: "Пізньосередньовічні катафрактарії"
  a_byzantine_cataphracts_2_desc: "$a_byzantine_cataphracts_2$ мчать в атаку з довгими списами та масивними щитами. І вони самі, і їхні коні з ніг до голови закуті в лати. Нищівний натиск і залізна дисципліна цих вояків вселяють жах у серця наших ворогів."
  a_byzantine_cataphracts_3: "Реформовані катафрактарії"
  a_byzantine_cataphracts_3_desc: "$a_byzantine_cataphracts_3$ поєднують старі імперські традиції з більш сучасними тактичними прийомами, у них є як списи та луки, так і вогнепальна зброя. Ця різнобічна кіннота спочатку виснажує ворога здалеку, а потім трощить його в ближньому бою."
  a_byzantine_cataphracts_4: "Важкоозброєні катафрактарії"
  a_byzantine_cataphracts_4_desc: "$a_byzantine_cataphracts_4$ закуті в багатошарові лати, непроникні для стріл і клинків. Вишикувавшись клином, ці добірні вершники можуть з легкістю проломити будь-який ворожий стрій."
  a_byzantine_cataphracts_5: "Гвардійські катафрактарії"
  a_byzantine_cataphracts_5_desc: "$a_byzantine_cataphracts_5$, відібрані з-поміж найкращих списників, становлять кінну варту нашого трону та столиці. Однієї їхньої присутності на полі бою достатньо, щоб надихнути наших вояків і налякати ворогів."
  a_byzantine_cataphracts_6: "Імперські катафрактарії"
  a_byzantine_cataphracts_6_desc: "$a_byzantine_cataphracts_6$ являють собою вершину багатовікового розвитку кінноти. Ці бездоганно навчені ветерани захищені надійним обладунком і б’ються верхи на найкращих конях. Вони служать особистою охороною імператора і здатні переломити хід воєнної кампанії одним рішучим ударом."
  n_greek_fire_galley_renaissance: "Сифонофори"
  n_greek_fire_galley_renaissance_desc: "Ці кораблі, обладнані спеціальними трубами для метання грецького вогню, здатні за лічені хвилини спопелити цілий флот. На ближній відстані вони смертоносні."
  n_greek_fire_galley_discovery: "Покращені сифонофори"
  n_greek_fire_galley_discovery_desc: "Пристосувавши системи метання грецького вогню до нових кораблів, ми зберегли можливість спопеляти ворожі судна. Ця зброя, як і раніше, залишається символом нашого флоту."
  a_greek_fire_renaissance_infantry: "Хейросифони"
  a_greek_fire_renaissance_infantry_desc: "Грецький вогонь можна застосовувати не тільки на морі. Озброївшись невеликими ручними пристроями, піхотинці можуть обрушувати потоки горючої суміші на ворожі лави, розчищаючи шлях для наступу наших військ."
  a_greek_fire_discovery_infantry: "Покращені хейросифони"
  a_greek_fire_discovery_infantry_desc: "Вояки та війська змінюються, але спопеляюче полум’я, як і раніше, залишається грізною та ефективною зброєю. Тому наші вояки продовжують поливати ворогів грецьким вогнем, вселяючи жах у їхні серця."