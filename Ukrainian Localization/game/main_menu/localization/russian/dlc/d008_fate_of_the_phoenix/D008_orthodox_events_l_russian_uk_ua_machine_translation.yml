l_russian:
  d008_orthodox_events.1.title: "Пропозиція [actor.Custom('CL_GEN')]"
  d008_orthodox_events.1.desc: "До нашого двору прибула делегація з [actor.Custom('longname_ua_GEN')]. [target.GetName] — одна з найвеличніших цінностей у культурній скарбниці цієї країни. Вони готові на певний час позичити нам цей шедевр — звісно, за деяку винагороду. Якщо ми приймемо їхню пропозицію, це сприятиме зближенню наших країн."
  d008_orthodox_events.1.a: "Звісно, ми погодимося."
  d008_orthodox_events.1.b: "Скажіть їм, що в нас уже достатньо."
  d008_orthodox_events.2.title: "Пропозицію прийнято"
  d008_orthodox_events.2.desc: "[target_country.GetLongName] погоди[target_country.Custom('endlong_vlaloly')]ся на нашу щедру пропозицію та вже надісла[target_country.Custom('endlong_vlaloly')] грошову компенсацію за те, що ми на певний час позичимо їм ікону. Без сумніву, цей крок зміцнить відносини між нашими країнами. [target.GetName] — сподіватимемося, що до обумовленої дати вона повернеться додому..."
  d008_orthodox_events.2.a: "Подбайте про цей витвір як слід."
  d008_orthodox_events.3.title: "Пропозицію відхилено"
  d008_orthodox_events.3.desc: "Безбожні безумці з #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! відхилили нашу пропозицію! Ми щиро бажали на певний час позичити їм святу #TOOLTIP:WORK_OF_ART_TYPE,icon,X #L ікону#!#!, і їхня відмова свідчить лише про те, що в них не залишилося ні благочестя, ні богобоязливості. [target.GetName] — той, хто відкидає її, є ворогом #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ої#! віри!"
  d008_orthodox_events.3.a: "Горіти їм у пеклі!"
  d008_orthodox_events.4.title: "[target_art.GetNameWithNoTooltip]: час повертати"
  d008_orthodox_events.4.desc: "[target_art.GetName] — настав час повернути позичене законним власникам. Безсумнівно, [origin_country.GetName] чека[origin_country.Custom('end_yeyut')], що ми дотримаємо слова. Звісно, ми могли б ухилитися від виконання зобов’язань, оголосивши, що #TOOLTIP:WORK_OF_ART_TYPE,icon,X #L ікона#!#! «загубилася»..."
  d008_orthodox_events.4.desc_no_country: "[target_art.GetName] у нас уже досить давно. Ми отримали її лише на певний час, проте з тих пір законний власник позбувся суверенітету, і будь-які попередні угоди з ним можна вважати недійсними..."
  d008_orthodox_events.4.a: "Ми повернемо ікону, як і належить."
  d008_orthodox_events.4.b: "Тепер ікона наша!"
  d008_orthodox_events.5.title: "$d008_orthodox_events.4.title$"
  d008_orthodox_events.5.desc: "[target_art.GetName] — термін, на який ми передали її [target_country.Custom('longname_ua_DAT')], минув. Вони повернули дорогоцінний шедевр і провели на честь цього пишну церемонію, повністю виконавши умови нашої угоди."
  d008_orthodox_events.5.a: "Так і повинна чинити істинно [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip|l]а країна."
  d008_orthodox_events.6.title: "$d008_orthodox_events.4.title$"
  d008_orthodox_events.6.desc: "[target_art.GetName] — термін, на який ми її передали [target_country.Custom('longname_ua_DAT')], минув, проте #L [target_country.GetAdjective|l]і#! мерзотники вигадали неправдоподібний привід, щоб не повертати її назад."
  d008_orthodox_events.6.a: "Вони заплатять за цю образу!"
  d008_orthodox_events.7.title: "[target_pentarchy.GetNameWithNoTooltip] у наших руках"
  d008_orthodox_events.7.desc: "Провінція [target_pentarchy.GetName], один з єпископських престолів пентархії та найважливіший центр #TOOLTIP:RELIGIONGROUP,christian,X #L християнства#!#!, віднині належить нам. Її кафедру займе [target_patriarch.GetName] — на славу #TOOLTIP:RELIGION,$orthodox_tt$,X #L православної#!#! віри!"
  d008_orthodox_events.7.a: "Пентархія буде нашою!"
  d008_orthodox_events.8.title: "[target_pentarchy.GetNameWithNoTooltip] переходить до ворога"
  d008_orthodox_events.8.desc: "Втрата найважливішого єпископського престолу в провінції [target_pentarchy.GetName] — величезний удар для нашої влади та престижу. Втрата одного зі стовпів пентархії стане важким випробуванням для всіх #TOOLTIP:RELIGION,$orthodox_tt$,X #L православних#!#! [ROOT.GetCountry.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. Невже Господь відвернувся від нас?"
  d008_orthodox_events.8.desc_all_pentarchy: "З втратою провінції [target_pentarchy.GetName] ми втратили владу над пентархією. Щоб зміцнити міць нашої віри, необхідно повернути під контроль усі п’ять найважливіших єпископських престолів."
  d008_orthodox_events.8.a: "Ми зобов’язані повернути цю землю!"
  downgrade_pentarchy_modifier_tt: "Ми перестанемо отримувати посилені ефекти від підконтрольних нам престолів пентархії"
  d008_orthodox_events.9.title: "Відновлення пентархії"
  d008_orthodox_events.9.desc: "[target_pentarchy.GetName] у наших руках — а це означає, що відтепер ми контролюємо всі п’ять престолів пентархії. Найважливіші єпископські кафедри, роз’єднані протягом багатьох століть, об’єдналися під нашою владою. Навіть ті провінції, які довгий час залишалися в руках язичників та єретиків, нині повернулися в лоно істинної віри. Церква знову віднайде єдність, і вести її будуть наші патріархи."
  d008_orthodox_events.9.a: "Свята Церква возз’єднається!"
  upgrade_pentarchy_modifier_tt: "Ефекти від підконтрольних нам престолів пентархії будуть посилені"
  pentarchy_unlocked_abilities_tt: "Відкриває доступ до [Concept('actions', 'дій')|e] #TOOLTIP:GENERIC_ACTION,D008_mend_schism,X #L «Подолання розколу»#!#! та #TOOLTIP:GENERIC_ACTION,D008_restore_rome_primacy,X #L «Повернення столиці до Риму»#!#!"
  d008_orthodox_events.10.title: "Подолання розколу"
  d008_orthodox_events.10.desc: "Згубний церковний розкол підточував #TOOLTIP:RELIGIONGROUP,christian,X #L християнство#!#! протягом століть — відтоді, як між патріархами #TOOLTIP:LOCATION,rome,X #L Риму#!#! та #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#! стався формальний розрив. Відпадіння Церкви Заходу призвело до спотворення вчення Христа — на велику радість диявола.\n\nТепер, коли всі п’ять престолів пентархії опинилися в наших руках, патріархи Сходу та Заходу знову сходяться в поглядах і належать до лона однієї Церкви. Залишається ще чимало єретиків, які заперечують Істинну Церкву, але рано чи пізно всі ці заблудлі вівці повернуться до пастиря — це лише питання часу."
  d008_orthodox_events.10.a: "Є лише одна християнська Церква."
  d008_orthodox_events.11.title: "Повернення столиці до Риму"
  d008_orthodox_events.11.desc: "Рим — колиска імперії, символ культури та оплот античної цивілізації — довго животів у мороці варварства та єресі. Але тепер Вічне місто знову в наших руках, і ми клянемося, що воно віднайде колишню велич і знову перетвориться на світовий центр.\n\nПотуга, що сяє із нової [ROOT.GetCountry.GetGovernment.GetAdjective|l]ої столиці, пошириться світом, і всі згадають [ROOT.GetCountry.Custom('endrank_predlog_obo')] [ROOT.GetCountry.Custom('rank_ua_PREP')|l], про те, хто ми є. Слався, [ShowLocationName('rome')]! Слався, [ROOT.GetCountry.GetLongName]!"
  d008_orthodox_events.11.a: "#italic Urbs aeterna restituta!#!"
  patriarchate_will_relocate_to_rome_tt: "Патріарх #TOOLTIP:LOCATION,rome,X #L Риму#!#! стане головою нашого #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,autocephalous_patriarchate,X #L автокефального патріархату#!#!"
  d008_orthodox_events.12.title: "Розкол нібито подолано"
  d008_orthodox_events.12.desc: "[scope:actor.GetName] заявля[scope:actor.Custom('end_yeyut')], що подола[scope:actor.Custom('end_vlaloly')] Великий розкол та об’єднав[scope:actor.Custom('end_vlaloly')] християнський світ навколо Константинополя."
  d008_orthodox_events.12.a: "Прийняти православну віру."
  d008_orthodox_events.12.b: "Рим — наш пастир."
  d008_orthodox_events.13.title: "Розкол нібито подолано"
  d008_orthodox_events.13.desc: "[scope:actor.GetName] дозволя[scope:actor.Custom('end_yeyut')] собі заявляти, що нібито розкол подолано на їхніх умовах."
  d008_orthodox_events.13.a: "Це обурливо."
  d008_orthodox_events.14.title: "Патріарх переїжджає до Риму"
  d008_orthodox_events.14.desc: "[scope:actor.GetName] змуси[scope:actor.Custom('end_vlaloly')] Вселенського патріарха переїхати до Риму, тим самим напряму зазіхнувши на наше місто."
  d008_orthodox_events.14.a: "Ми ніколи не здамо Рим."