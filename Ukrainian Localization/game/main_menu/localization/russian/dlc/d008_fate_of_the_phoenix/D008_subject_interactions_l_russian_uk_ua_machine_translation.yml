l_russian:
 pronoia: "Пронії"
 pronoia_desc: "Пронія — один із найважливіших інститутів #ONCLICK:COUNTRY,[GetCountry('BYZ').GetID] #TOOLTIP:COUNTRY,[GetCountry('BYZ').GetID],X [GetCountry('BYZ').Custom('CL_GEN')|L]#!#!. Проніар — це отримувач пронії, якому тимчасово доручали збирати податки. Пізніше ця посада стала спадковою, і сьогодні ці люди не тільки допомагають нам збирати податі з народу, але й несуть військову службу, доносячи волю імператора в найдальші куточки країни."