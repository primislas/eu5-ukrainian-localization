l_russian:
  pronoia: "Пронії"
  pronoia_desc: "Пронія — один із найважливіших інститутів #ONCLICK:COUNTRY,[GetCountry('BYZ').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BYZ').Custom('CL_tt')],X [GetCountry('BYZ').Custom('CL_GEN')|L]#!#!. Проніар — це отримувач пронії, йому тимчасово доручали збирати податки. Пізніше ця посада стала спадковою, і сьогодні ці люди не лише допомагають нам збирати податі з народу, але й несуть військову службу, доносячи волю імператора в найвіддаленіші куточки країни."