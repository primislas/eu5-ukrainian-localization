l_russian:
  assign_despot: "Призначення деспотом"
  assign_despot_concept: "[Concept('character', 'Персонаж')|e]"
  assign_despot_act: "$assign_despot$"
  assign_despot_desc: "Ми призначимо [Concept('character', 'персонажа')|e] на посаду деспота з ефектами:\n[ShowModifierEffect('despot_modifier')]"
  assign_despot_desc_specific: "Ми призначимо [Concept('character', 'персонажа')|e] на посаду деспота. Він отримає [Concept('modifier', 'модифікатор')|e] «[ShowModifier('despot_modifier')]»."
  assign_despot_past: "[SCOPE.sCharacter('recipient').GetName] [Select_CString(SCOPE.sCharacter('recipient').IsFemale, 'призначена', 'призначений')] на посаду #TOOLTIP:STATIC_MODIFIER,despot_modifier,X #V #L деспота#!#!#!."
  assign_despot_act_past: "[SCOPE.sCharacter('recipient').GetName] [Select_CString(SCOPE.sCharacter('recipient').IsFemale, 'призначена', 'призначений')] на посаду #TOOLTIP:STATIC_MODIFIER,despot_modifier,X #V #L деспота#!#!#!."
  compose_strategikon: "Написання «Стратегікону»"
  compose_strategikon_concept: "[Concept('character', 'Персонаж')|e]"
  compose_strategikon_act: "$compose_strategikon$"
  compose_strategikon_desc: "Наш [Concept('ruler', 'правитель')|e] звернеться до глибин своєї військової мудрості та напише трактат, присвячений обраному питанню. Це напевно допоможе нам переконати інших, що ми здобули свою військову славу абсолютно заслужено."
  compose_strategikon_desc_specific: "Наш [Concept('ruler', 'правитель')|e] отримає відповідний [Concept('character_modifier', 'модифікатор персонажа')|e] залежно від теми твору."
  compose_strategikon_past: "Написано «Стратегікон»"
  compose_strategikon_act_past: "[SCOPE.sCharacter('recipient').GetName] [Select_CString(SCOPE.sCharacter('recipient').IsFemale, 'написала', 'написав')] «Стратегікон» і [Select_CString(SCOPE.sCharacter('recipient').IsFemale, 'отримала', 'отримав')] потужний [Concept('modifier', 'модифікатор')|e], що діє до кінця правління."
  has_not_composed_strategikon_tt: "Наш [Concept('ruler', 'правитель')|e] за своє життя не написав «Стратегікон»"
  actor_ruler_total_abilities: "[actor.GetGovernment.GetRulerOrRegent.GetName] — [Concept('total_ability', 'сума навичок')|e]"
  castrate_character: "Оскоплення"
  castrate_character_concept: "[Concept('character', 'Персонаж')|e]"
  castrate_character_act: "$castrate_character$"
  castrate_character_desc: "Наказати оскопити [Concept('character', 'персонажа')|e] при нашому дворі. Це покарання незворотне і назавжди позбавляє персонажа можливості завести дітей."
  castrate_character_desc_specific: "Наказати оскопити [Concept('character', 'персонажа')|e], що дасть йому властивість #TOOLTIP:TRAIT,castrated,X #L «Оскопленість»#!#!."
  castrate_character_past: "[SCOPE.sCharacter('recipient').GetName] був оскоплений згідно з імператорським указом"
  castrate_character_act_past: "[SCOPE.sCharacter('recipient').GetName] був оскоплений згідно з імператорським указом"
  blind_character: "Осліплення"
  blind_character_concept: "[Concept('character', 'Персонаж')|e]"
  blind_character_act: "$blind_character$"
  blind_character_desc: "Наказати осліпити [Concept('character', 'персонажа')|e] при нашому дворі. Ця давня форма покарання позбавляє особу можливости очолювати війська та політичного впливу."
  blind_character_desc_specific: "Наказати осліпити [Concept('character', 'персонажа')|e], що дасть йому властивість #TOOLTIP:TRAIT,blind,X #L «Сліпота»#!#!."
  blind_character_past: "[SCOPE.sCharacter('recipient').GetName] [Select_CString(SCOPE.sCharacter('recipient').IsFemale,'була осліплена', 'був осліплений')] згідно з імператорським указом"
  blind_character_act_past: "[SCOPE.sCharacter('recipient').GetName] [Select_CString(SCOPE.sCharacter('recipient').IsFemale,'була осліплена', 'був осліплений')] згідно з імператорським указом"