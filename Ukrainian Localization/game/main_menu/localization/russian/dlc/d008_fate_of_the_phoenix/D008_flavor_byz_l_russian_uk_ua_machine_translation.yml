l_russian:
  d008_flavor_byz.1.title: "Обіцянки алхіміка"
  d008_flavor_byz.1.entry: "$d008_flavor_byz.1.title$"
  d008_flavor_byz.1.desc: "Колись грецький вогонь був відомий не тільки по всьому Середземномор’ю, а й за його межами. Ця легендарна суміш, що вселяла жах ворожим флотоводцям, навіть на воді горіла палкіше за будь-яке полум’я. Загасити грецький вогонь було майже неможливо, підпалені ним судна згорали дотла в одну мить. Секрет виготовлення суміші завжди зберігався в найсуворішій таємниці, але з часом ці знання були втрачені, і ми більше не можемо виробляти цю зброю.\n\n[target_artist.GetName], [Select_CString(target_artist.IsFemale, 'одна', 'один')] з наших найвидатніших алхіміків, стверджує, що може відновити та відтворити втрачену формулу. Якщо це правда, то ми зможемо знову поставити згубний вогонь на службу нашому флоту. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|U] та [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] нашої країни вже тріумфують, однак [target_artist.GetNameWithNoTooltip] [Select_CString(target_artist.IsFemale, 'мусить', 'мусить')] провести ще чимало дорогих дослідів, перш ніж формула буде отримана."
  d008_flavor_byz.1.a: "[target_artist.GetSheHe|U] отримає все, чого потребуватиме!"
  d008_flavor_byz.1.b: "Нам ні до чого байки з минулого, флот і без того достатньо сильний."
  d008_flavor_byz.1.a.tt: "[target_artist.GetName] почне досліди, щоб знайти формулу грецького вогню"
  d008_flavor_byz.2.title: "У пошуках вогню"
  d008_flavor_byz.2.desc: "Минуло вже чимало часу відтоді, як [target_artist.GetName] [Select_CString(target_artist.IsFemale, 'усамітнилася', 'усамітнився')] в лабораторії, щоб знайти формулу грецького вогню, але досі [target_artist.GetHerHis] досягнення обмежувалися лише обгорілими бровами та періодичними вибухами ночами. Багато хто вже сумнівається в тому, що [Select_CString(target_artist.IsFemale, 'вона здатна', 'він здатний')] досягти успіху у своєму починанні. Втім, [target_artist.GetSheHe] запевняє, що вже [Select_CString(target_artist.IsFemale, 'близька', 'близький')] до прориву — потрібно лише ще трохи часу та коштів."
  d008_flavor_byz.2.a: "Добре, ми виділимо [Select_CString(target_artist.IsFemale, 'їй', 'йому')] додаткові кошти."
  d008_flavor_byz.2.b: "Досить з нас цих фантазій."
  d008_flavor_byz.2.a.tt: "[target_artist.GetName] продовжить шукати формулу грецького вогню"
  d008_flavor_byz.3.title: "Грецький вогонь"
  d008_flavor_byz.3.desc: "Багато ночей поспіль жителі [ROOT.GetCountry.GetCapital.Custom('LR_GEN')|l] [ROOT.GetCountry.GetCapital.GetName] схоплювалися посеред ночі від гучних вибухів, спричинених дослідами, які [Select_CString(target_artist.IsFemale, 'проводила', 'проводив')] [target_artist.GetName]. За час роботи [target_artist.GetHerHis] руки вкрилися безліччю опіків, [target_artist.GetSheHe] не раз [Select_CString(target_artist.IsFemale, 'опинялася', 'опинявся')] на краю загибелі, але в підсумку [target_artist.GetHerHis] муки принесли потрібний результат. Шляхом спроб і помилок [Select_CString(target_artist.IsFemale, 'їй', 'йому')] вдалося відтворити грецький вогонь у точній відповідності до історичних джерел. Тепер ми можемо налагодити виробництво цієї суміші та поставити її на озброєння свого флоту. Зрозуміло, ми й надалі триматимемо формулу та технологію виготовлення грецького вогню в секреті — але цього разу вживемо всіх необхідних заходів, щоб ніколи більше не втратити ці знання."
  d008_flavor_byz.3.a: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]ий флот знову змусить море палати!"
  unlocked_greek_fire_tt: "Ми отримаємо доступ до [Concept('unit_types', 'типів військ')|e] «[ShowUnitDefinitionName('n_greek_fire_galley_renaissance')]», «[ShowUnitDefinitionName('n_greek_fire_galley_discovery')]», «[ShowUnitDefinitionName('a_greek_fire_renaissance_infantry')]» та «[ShowUnitDefinitionName('a_greek_fire_discovery_infantry')]»"
  d008_flavor_byz.4.title: "[target.GetNameWithNoTooltip] не досягає успіху"
  d008_flavor_byz.4.desc: "На жаль, [target.GetName] передчасно [Select_CString(target_artist.IsFemale, 'померла', 'помер')], так і не завершивши свої пошуки грецького вогню. [target.GetHerHis|U] учні та інші видатні алхіміки вивчили [target_artist.GetHerHis] записи, щоб зрозуміти, чи можна продовжити [target_artist.GetHerHis] дослідження, але скоро стало зрозуміло, що весь цей час [Select_CString(target_artist.IsFemale, 'вона топталася', 'він топтався')] на місці й ні на крок не [Select_CString(target_artist.IsFemale, 'наблизилася', 'наблизився')] до шуканої мети. Судячи з усього, нам ніколи не вдасться розгадати таємницю грецького вогню..."
  d008_flavor_byz.4.a: "Нічого не вдієш..."