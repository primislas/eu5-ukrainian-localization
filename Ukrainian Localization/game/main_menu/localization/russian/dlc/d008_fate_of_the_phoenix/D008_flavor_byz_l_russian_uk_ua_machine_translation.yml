l_russian:
  d008_flavor_byz.1.title: "Обіцянки алхіміка"
  d008_flavor_byz.1.entry: "$d008_flavor_byz.1.title$"
  d008_flavor_byz.1.desc: "Колись грецький вогонь був відомий не тільки по всьому Середземномор’ю, а й за його межами. Ця легендарна суміш, що вселяла жах ворожим флотоводцям, навіть на воді горіла палкіше за будь-яке полум’я. Загасити грецький вогонь було майже неможливо, підпалені ним кораблі згорали дотла в одну мить. Таємниця виготовлення суміші завжди зберігалася під сімома печатями, але з часом ці знання були втрачені, і ми більше не можемо виробляти цю зброю.\n\n[target_artist.GetName], [Select_CString(target_artist.IsFemale, 'одна', 'один')] з наших найвидатніших алхіміків, стверджує, що може відновити та відтворити втрачену формулу. Якщо це правда, то ми зможемо знову поставити згубний вогонь на службу нашому флоту. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|U] та [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] нашої країни вже тріумфують, однак [target_artist.GetNameWithNoTooltip] [Select_CString(target_artist.IsFemale, 'мусить', 'мусить')] провести ще чимало дорогих дослідів, перш ніж формула буде отримана."
  d008_flavor_byz.1.a: "[target_artist.GetSheHe|U] отримає все, чого потребуватиме!"
  d008_flavor_byz.1.b: "Нам ні до чого прадавні байки, флот і без того достатньо сильний."
  d008_flavor_byz.1.a.tt: "[target_artist.GetName] почне досліди, щоб знайти формулу грецького вогню"
  d008_flavor_byz.2.title: "У пошуках вогню"
  d008_flavor_byz.2.desc: "Минуло вже чимало часу відтоді, як [target_artist.GetName] [Select_CString(target_artist.IsFemale, 'усамітнилася', 'усамітнився')] в лабораторії, щоб знайти формулу грецького вогню, але досі [target_artist.GetHerHis] досягнення обмежувалися лише обгорілими бровами та періодичними вибухами ночами. Багато хто вже сумнівається в тому, що [Select_CString(target_artist.IsFemale, 'вона здатна', 'він здатний')] досягти успіху у своєму починанні. Втім, [target_artist.GetSheHe] запевняє, що вже [Select_CString(target_artist.IsFemale, 'близька', 'близький')] до прориву — потрібно лише ще трохи часу та коштів."
  d008_flavor_byz.2.a: "Добре, ми виділимо [Select_CString(target_artist.IsFemale, 'їй', 'йому')] додаткові кошти."
  d008_flavor_byz.2.b: "Досить з нас цих фантазій."
  d008_flavor_byz.2.a.tt: "[target_artist.GetName] продовжить шукати формулу грецького вогню"
  d008_flavor_byz.3.title: "Грецький вогонь"
  d008_flavor_byz.3.desc: "Багато ночей поспіль жителі [ROOT.GetCountry.GetCapital.Custom('LR_GEN')|l] [ROOT.GetCountry.GetCapital.GetName] прокидалися від гучних вибухів, спричинених дослідами, які [Select_CString(target_artist.IsFemale, 'проводила', 'проводив')] [target_artist.GetName]. За час роботи [target_artist.GetHerHis] руки вкрилися численними опіками, [target_artist.GetSheHe] не раз [Select_CString(target_artist.IsFemale, 'опинялася', 'опинявся')] на краю загибелі, але врешті [target_artist.GetHerHis] муки принесли потрібний результат. Шляхом спроб і помилок [Select_CString(target_artist.IsFemale, 'їй', 'йому')] вдалося відтворити грецький вогонь у точній відповідності до історичних джерел. Тепер ми можемо налагодити виробництво цієї суміші та поставити її на озброєння свого флоту. Звісно, ми й надалі триматимемо формулу й технологію виготовлення грецького вогню в таємниці — але цього разу вживемо всіх необхідних заходів, щоб ніколи більше не втратити ці знання."
  d008_flavor_byz.3.a: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]ий флот знову змусить море палати!"
  unlocked_greek_fire_tt: "Ми отримаємо доступ до [Concept('unit_types', 'типів військ')|e] «[ShowUnitDefinitionName('n_greek_fire_galley_renaissance')]», «[ShowUnitDefinitionName('n_greek_fire_galley_discovery')]», «[ShowUnitDefinitionName('a_greek_fire_renaissance_infantry')]» та «[ShowUnitDefinitionName('a_greek_fire_discovery_infantry')]»"
  d008_flavor_byz.5.title: "Реформа тагм"
  d008_flavor_byz.5.entry: "$d008_flavor_byz.5.title$"
  d008_flavor_byz.5.desc: "Випробування, яке поставило #L [ROOT.GetCountry.GetAdjective|l]у#! країну під загрозу розпаду, нарешті позаду, і багато в чому завдяки зусиллям тагм — це історичні військові формування, якими керує безпосередньо [ROOT.GetCountry.GetGovernment.GetRulerTitle|l]. Хоча часи їхньої слави залишилися далеко позаду, ці загони, що існують окремо від феодального ополчення, забезпечили нам виживання.\n\nТепер стабільність відновлено, і [target_character.GetName] звертає свій погляд у майбутнє. Щоб [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]і тагми відрізнялися від звичайного ополчення не тільки назвою, а й по своїй суті, потрібні серйозні зміни: необхідно відновити державне фінансування, посилити дисципліну та підібрати натхненну мету. Паростки, що проклюнулися в період негараздів, мирний час перетворить на пишні квіти, якими [ROOT.GetCountry.GetLongNameWithNoTooltip] буд[ROOT.GetCountry.Custom('endlong_eut')] пишатися."
  d008_flavor_byz.5.a: "Ми перетворимо тагми на передові сили [ROOT.GetCountry.Custom('CL_GEN')]."
  d008_flavor_byz.5.a.entry: "Ми перетворимо тагми на передові сили Риму."
  d008_flavor_byz.5.b: "Ці полки вже показали, на що здатні у війні."
  variable_won_fate_of_the_phoenix_disaster_variable_tt: "Ми подолали лихо #TOOLTIP:DISASTER_TYPE,fate_of_the_phoenix,X #L «Доля фенікса»#!#!"
  d008_flavor_byz.4.title: "[target.GetNameWithNoTooltip] не досягає успіху"
  d008_flavor_byz.4.desc: "На жаль, [target.GetName] передчасно [Select_CString(target_artist.IsFemale, 'померла', 'помер')], так і не завершивши пошуки грецького вогню. [target.GetHerHis|U] учні та інші видатні алхіміки вивчили [target_artist.GetHerHis] записи, щоб зрозуміти, чи можна продовжити [target_artist.GetHerHis] дослідження, але невдовзі стало зрозуміло, що весь цей час [Select_CString(target_artist.IsFemale, 'вона тупцювала', 'він тупцював')] на місці й ні на крок не [Select_CString(target_artist.IsFemale, 'наблизилася', 'наблизився')] до шуканої мети. Судячи з усього, нам ніколи не вдасться розгадати таємницю грецького вогню..."
  d008_flavor_byz.4.a: "Нічого не вдієш..."
  d008_flavor_byz.6.title: "Відродження Фенікса"
  d008_flavor_byz.6.entry: "$d008_flavor_byz.6.title$"
  d008_flavor_byz.6.desc: "[ROOT.GetCountry.GetName], колись слабка країна-наступниця біля берегів Чорного моря, досягла небувалих висот. #TOOLTIP:LOCATION,constantinople,X #L Константинополь#!#! тепер належить нам, #TOOLTIP:CULTUREGROUP,turkic_group,X #L тюркські#!#! загарбники вигнані з #TOOLTIP:REGION,anatolia_region,X #L Анатолії#!#!, і [ROOT.GetCountry.GetLongNameWithNoTooltip] віднови[ROOT.GetCountry.Custom('endlong_vlaloly')] свою колишню велич. Придворні вчені шепочуться про те, що [ROOT.GetCountry.GetFlavorRank] повста[ROOT.GetCountry.Custom('endrank_youtyut')] з праху, немов фенікс.\n\n[target_character.GetName] — віднині [Select_CString(target_character.IsFemale, 'істинна спадкоємиця', 'істинний спадкоємець')] Римської імперії. Ми, як і наші пращури, з честю витримали випробування долі, і тому їхні інститути, привілеї та цілі тепер по праву належать нам."
  d008_flavor_byz.6.a: "Імперія відроджується з попелу."
  tre_restored_empire_unlocks_tt: "Тепер нам доступні нові [Concept('bureaucracies', 'установи')|e] — [ShowBureaucracyTypeName('allelengyon_bureaucracy')] та [ShowBureaucracyTypeName('kephalai_bureaucracy')]), — [Concept('building', 'споруда')|e] «[ShowBuildingTypeName('hippodrome')]», а також постійні бонуси до [Concept('government_reforms', 'реформ')|e] «[ShowGovernmentReformName('katepanata')]» та #TOOLTIP:GOVERNMENT_REFORM,kritai_katholikoi_reformed,X #L «Оновлений Крітаї католікої»#!#!."
  tre_unlock_phoenix_cabinet_actions_tt: "Ми отримуємо постійний доступ до [Concept('cabinet_actions', 'доручень')|e] «[ShowCabinetActionName('spread_philhellenism')]» та «[ShowCabinetActionName('encourage_latin_militarism')]»"