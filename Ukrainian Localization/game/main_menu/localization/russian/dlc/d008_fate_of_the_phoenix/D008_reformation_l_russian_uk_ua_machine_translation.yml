l_russian:
  contact_patriarch_of_constantinople: "Звернутися до Константинопольського патріарха"
  contact_patriarch_of_constantinople_desc: "Відправити Меланхтона до Константинополя з нашим Символом віри та розпочати діалог з #TOOLTIP:RELIGION,$orthodox_tt$,X #L Православним#!#! патріархатом."
  reformation.17.title: "[GetCharacter('reformer_philip_melanchton').GetLastNameWithNoTooltip] і лист до Константинополя"
  reformation.17.desc: "Видатний богослов нашої країни [melanchthon.GetName] виступив зі сміливою пропозицією: відправити посланця до Константинопольського патріарха з нашим Символом віри. Хоча з багатьох питань #TOOLTIP:RELIGION,$orthodox_tt$,X #L православно-християнська#!#! та #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранська#!#! конфесії розходяться, вони обидві відкинули верховенство католицького Папи. Можливо, Патріарх оцінить такий жест від побратимів по протистоянню Риму."
  reformation.17.a: "Відправити Меланхтона з нашим «Визнанням віри»."
  reformation.17.b: "Зараз не час для таких загравань."
  reformation.17.historical_info: "Філіпп Меланхтон (1497–1560 рр.), найближчий соратник Лютера та автор «Аугсбурзького визнання» (1530 р.), виявляв великий інтерес до Східної православної церкви як потенційного союзника в боротьбі з Римом. Його листування з грецькими богословами заклало основу майбутніх лютеранських зносин з Константинополем. У 1573 році богослови з Тюбінгена відправили грецький переклад «Аугсбурзького визнання» патріарху Єремії II, чим започаткували один з найтриваліших богословських діалогів між лютеранством та православ’ям в добу Реформації."
  reformation.18.title: "Лист від лютеранських реформаторів"
  reformation.18.desc: "До Константинополя прибула делегація з [lutheran_country.Custom('longname_ua_GEN')] з богословським трактатом — Визнанням їхньої віри. Судячи з усього, #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранські#!#! реформатори шукають діалогу з нашим патріархатом, посилаючись на нашу спільну ворожнечу з Єпископом Римським. Наскільки їхні наміри щирі, нам поки незрозуміло."
  reformation.18.a: "Вступити з цими реформаторами в обережну богословську дискусію."
  reformation.18.b: "Це єретики. Відіслати їх геть."
  reformation.18.historical_info: "Вселенський патріархат Константинополя зберіг духовну владу над православними християнами навіть після завоювання Константинополя османами в 1453 році. Патріарх Єремія II (пр. 1572–1595 рр.) був відомий вченістю і всерйоз листувався з тюбінгенськими богословами, написавши в період 1576–1581 рр. три докладні відповіді на їхні листи. Він відкидав лютеранські погляди на принцип виправдання, роль свободи волі та філіокве, але при цьому визнавав щирість їхньої критики, а не поставився до неї з презирством."
  reformation.19.title: "Патріарх відповідає з цікавістю"
  reformation.19.desc: "Патріарх відреагував на візит нашого посланця стриманою цікавістю. Хоча згоди щодо наших поглядів досягти не вдалося, обмін думками відкрив дорогу між Константинополем та нашою державною церквою. Маленький, але значний крок до взаєморозуміння між #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранським#!#! та #TOOLTIP:RELIGION,$orthodox_tt$,X #L православним#!#! християнством."
  reformation.19.a: "Навіть хиткий місток краще, ніж нічого."
  reformation.19.historical_info: "Листування тюбінгенських лютеран з Єремією II вважається знаковою подією в ранній історії екуменічного діалогу. У своїх трьох відповідях (1576, 1579, 1581 рр.) патріарх Єремія II вступив у серйозну дискусію лютеранської теології, відкинувши при цьому її основні постулати. Він навів докладні повчальні коментарі до таких питань як доктрина виправдання вірою, роль вільної волі та принцип філіокве. Такий рівень залученості демонстрував інтелектуальну активність Патріархату за влади османів. Обидві сторони ретельно зберегли все листування."
  reformation.20.title: "Патріарх відсилає делегацію"
  reformation.20.desc: "Наша делегація отримала в Константинополі холодний прийом. Патріарх визнав наше Визнання черговою єрессю, і нашого посланця відіслали без церемоній. Це нагадування про те, що #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранство#!#! стоїть осторонь і від Риму, і від Константинополя."
  reformation.20.a: "Нашій вірі не потрібне схвалення жодних патріархатів."
  reformation.20.historical_info: "Листування тюбінгенських лютеран з Єремією II не призвело до зближення конфесій. Патріарх Єремія II у своїх трьох відповідях (1576, 1597, 1581 рр.) відкинув лютеранські погляди на доктрину виправдання вірою, принцип «сола скриптура» та філіокве, стверджуючи, що для православної церкви такі відхилення неприйнятні. Зрештою лютерани вирішили, що подальше листування буде безглуздим, і закінчили його в 1581 році."
  reformation.21.title: "Прибуття православного богослова"
  reformation.21.desc: "Звістки про наше листування з Константинополем призвели до несподіваних результатів. До нашого двору [Select_CString(orthodox_scholar.IsFemale, 'прибула православна вчена жінка', 'прибув православний богослов')] [orthodox_scholar.GetName] з наміром продовжити теологічний діалог, розпочатий нашим посланцем. Цей візит ставить нас у складне становище: надто привітний прийом може обурити наше власне духовенство, але якщо ми проженемо [Select_CString(orthodox_scholar.IsFemale, 'гостю', 'гостя')], то ризикуємо розгубити завойовану прихильність Константинополя."
  reformation.21.a: "Організувати обширний богословський діалог."
  reformation.21.b: "Подякувати [Select_CString(orthodox_scholar.IsFemale, 'гості', 'гостю')], але від діалогу відмовитися."
  reformation.21.historical_info: "Попри те, що листування тюбінгенських богословів з Константинополем не призвело до зближення доктрин, воно породило значний інтерес по обидва боки. Грецькі православні вчені ближче познайомилися з лютеранською теологією, а їхні лютеранські колеги поглибили розуміння Отців церкви та східної християнської традиції. Таке міжконфесійне спілкування призвело до розширення європейського гуманізму, який тепер побачив грецьке християнство як джерело, незалежне від Риму."