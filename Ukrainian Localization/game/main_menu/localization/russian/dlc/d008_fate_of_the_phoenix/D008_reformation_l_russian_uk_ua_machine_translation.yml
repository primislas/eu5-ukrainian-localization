l_russian:
  contact_patriarch_of_constantinople: "Звернення до патріарха Константинополя"
  contact_patriarch_of_constantinople_desc: "Ми відправимо Меланхтона до Константинополя з нашим Символом віри та розпочнемо діалог із #TOOLTIP:RELIGION,$orthodox_tt$,X #L православним#!#! патріархатом."
  reformation.17.title: "[GetCharacter('reformer_philip_melanchton').GetLastNameWithNoTooltip] пише до Константинополя"
  reformation.17.desc: "Видатний богослов нашої країни [melanchthon.GetName] виступає зі сміливою пропозицією: відправити посланця до патріарха Константинополя з нашим Символом віри. Попри те, що з багатьох питань #TOOLTIP:RELIGION,$orthodox_tt$,X #L православна#!#! та #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранська#!#! конфесії розходяться, вони обидві відкинули верховенство католицького папи. Можливо, патріарх оцінить такий жест від побратимів по протистоянню Риму."
  reformation.17.a: "Нехай [GetCharacter('reformer_philip_melanchton').GetLastNameWithNoTooltip] вирушить з нашим «Визнанням віри»."
  reformation.17.b: "Зараз не час для таких загравань."
  reformation.17.historical_info: "Філіпп Меланхтон (1497–1560), найближчий соратник Лютера та автор «Аугсбурзького сповідання» (1530), виявляв великий інтерес до Східної православної церкви як потенційного союзника в боротьбі з Римом. Його листування з грецькими богословами заклало основу для майбутніх лютеранських зносин із Константинополем. У 1573 році богослови з Тюбінгена відправили грецький переклад «Аугсбурзького сповідання» патріарху Єремії II, розпочавши один із найтриваліших богословських діалогів між лютеранством та православ’ям в добу Реформації."
  reformation.18.title: "Лист від лютеранських реформаторів"
  reformation.18.desc: "До Константинополя прибула делегація з [lutheran_country.Custom('longname_ua_GEN')] з богословським трактатом — «Сповіданням віри». Судячи з усього, #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранські#!#! реформатори шукають діалогу з нашим патріархатом, посилаючись на нашу спільну ворожість із єпископом Риму. Поки неясно, наскільки їхні наміри чисті."
  reformation.18.a: "Вступимо з цими реформаторами в обережну богословську дискусію."
  reformation.18.b: "Це єретики. Відішлемо їх геть."
  reformation.18.historical_info: "Вселенський патріархат Константинополя зберіг духовну владу над православними християнами навіть після того, як Константинополь завоювали османи в 1453 році. Патріарх Єремія II, який обіймав цю посаду приблизно з 1572 по 1595 рік, був відомий своєю вченістю та вступив у серйозне листування з тюбінгенськими богословами, відправивши з 1576 по 1581 рік три докладні відповіді на їхні листи. Він відкидав лютеранські погляди на принцип виправдання, роль свободи волі та філіокве, але при цьому визнавав щирість їхньої критики, а не сприймав її з презирством."
  reformation.19.title: "Патріарх відповідає з цікавістю"
  reformation.19.desc: "Патріарх відреагував на візит нашого посланця стриманою цікавістю. Нам не вдалося дійти згоди щодо поглядів на віру, але обмін думками відкрив дорогу між Константинополем та нашою державною церквою — це невеликий, але значний крок до взаєморозуміння між #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранським#!#! та #TOOLTIP:RELIGION,$orthodox_tt$,X #L православним#!#! християнством."
  reformation.19.a: "Навіть такий хисткий місток краще, ніж нічого."
  reformation.19.historical_info: "Листування тюбінгенських лютеран з Єремією II вважається знаковою подією в ранній історії екуменічного діалогу. У своїх трьох відповідях (1576, 1579, 1581) патріарх Єремія II вступив у серйозну дискусію з лютеранським богослов'ям, відкинувши при цьому його основні постулати. Він навів докладні повчальні коментарі до таких питань, як доктрина виправдання вірою, роль вільної волі та принцип філіокве. Такий рівень залученості продемонстрував інтелектуальну активність патріархату за влади османів. Обидві сторони ретельно зберегли все листування."
  reformation.20.title: "Патріарх відсилає делегацію"
  reformation.20.desc: "Нашу делегацію холодно прийняли в Константинополі. Патріарх визнав «Сповідання віри» черговою єрессю, і нашого посланця відправили додому без будь-яких церемоній. Це стало нагадуванням про те, що #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранство#!#! стоїть осторонь і від Риму, і від Константинополя."
  reformation.20.a: "Нашій вірі не потрібне схвалення жодних патріархатів."
  reformation.20.historical_info: "Листування тюбінгенських лютеран з Єремією II не призвело до зближення конфесій. Патріарх Єремія II у своїх трьох відповідях (1576, 1597, 1581) відкинув лютеранські погляди на доктрину виправдання вірою, принцип «сола скриптура» та філіокве, стверджуючи, що для православної церкви такі відхилення неприйнятні. Зрештою лютерани вирішили, що подальше листування не матиме сенсу, і завершили його в 1581 році."
  reformation.21.title: "Прибуття православного богослова"
  reformation.21.desc: "Звістки про наше листування з Константинополем призвели до несподіваних результатів. До нашого двору [Select_CString(orthodox_scholar.IsFemale, 'прибула', 'прибув')] #TOOLTIP:RELIGION,$orthodox_tt$,X #L православн#!#![Select_CString(orthodox_scholar.IsFemale, 'а вчена жінка', 'ий богослов')] [orthodox_scholar.GetName] з наміром продовжити богословський діалог, розпочатий нашим посланцем. Цей візит ставить нас у складне становище: надто привітний прийом може обурити наше власне духовенство, але якщо ми проженемо [Select_CString(orthodox_scholar.IsFemale, 'гостю', 'гостя')], то ризикуємо розгубити завойовану прихильність Константинополя."
  reformation.21.a: "Організуємо обширний богословський діалог."
  reformation.21.b: "Подякуємо [Select_CString(orthodox_scholar.IsFemale, 'гості', 'гостю')], але відмовимося від діалогу."
  reformation.21.historical_info: "Попри те, що листування тюбінгенських богословів з Константинополем не призвело до зближення доктрин, воно викликало значний інтерес у представників обох сторін. Грецькі православні вчені ближче познайомилися з лютеранським богослов'ям, а їхні лютеранські колеги поглибили розуміння Отців Церкви та східної християнської традиції. Таке міжконфесійне спілкування призвело до розширення європейського гуманізму, який став сприймати грецьке християнство як джерело, незалежне від Риму."