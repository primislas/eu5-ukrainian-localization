l_russian:
  fate_of_the_phoenix: "Доля фенікса"
  fate_of_the_phoenix_desc: "Уже кілька століть [GetCountry('BYZ').GetFlavorRank|l] перебува[GetCountry('BYZ').Custom('endrank_yeyut')] в занепаді, хоча колись це була вельми могутня країна. Нескінченні міжусобиці, внутрішня нестабільність і #TOOLTIP:SITUATION,rise_of_the_ottomans,X #L піднесення османів#!#! — ось зловісні передвісники загибелі нашої цивілізації. Не обійшлося і без зовнішніх загроз: загарбники з #ONCLICK:COUNTRY,[GetCountry('SER').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('SER').Custom('CL_tt')],X [GetCountry('SER').Custom('CL_GEN')|L]#!#! та #ONCLICK:COUNTRY,[GetCountry('BUL').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BUL').Custom('CL_tt')],X [GetCountry('BUL').Custom('CL_GEN')|L]#!#! зазіхають на наш північний кордон. Ми повинні зібрати волю в кулак, покінчити з лихоїмством і відновити вплив корони, поки ще не пізно..."
  remember_no_turk_tt: "З усіх [Concept('country', 'країн')|e] зі [Concept('capital', 'столицею')|e] в #TOOLTIP:REGION,anatolia_region,X #L Анатолії#!#! тільки наша країна володіє більш ніж #Y 100#! [Concept('locations', 'місцевостями')|e] з урахуванням власних [Concept('subjects', 'васалів')|e], заселена #TOOLTIP:CULTURE,$turkish_culture_tt$,X #L турками#!#! або #TOOLTIP:CULTURE,$turkoman_culture_tt$,X #L туркоманами#!#! або дотримується [Concept('government_reform', 'державного принципу')|e] #TOOLTIP:GOVERNMENT_REFORM,anatolian_beylik,X #L «Анатолійський бейлик»#!#!."
  fate_of_the_phoenix.1.title: "Доля фенікса"
  fate_of_the_phoenix.1.desc_a: "Колись #TOOLTIP:LOCATION,constantinople,X #L Константинополь#!#! був центром світу, правонаступником Риму, кузнею законів, віри та порядку. Тепер ця роль вже обтяжує нас.\n\nРоки інтриг, порожніх перемог та владного розкладу призвели до того, що наш народ занепав духом, а саме слово «[ROOT.GetCountry.GetFlavorRank|l]» звучить для нього як насмішка. Наші установи чахнуть без належної уваги, а сусіди, немов жадібні стерв'ятники, весь цей час накопичують сили для удару. Ми спадкоємці великої культури, тому гідні кращої долі!"
  fate_of_the_phoenix.1.desc_b: "Ми отримали вісті з #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#!. Схоже, у стародавній столиці зараз неспокійно: її могутність слабшає внаслідок розбрату та занепаду. Протягом століть приклад #L #TOOLTIP:COUNTRY_RANK,[target_location.GetRank.Custom('CF_tt')],X [target_location.GetRank.Custom('rank_ua_GEN')|l]#!#! тримав у вузді #TOOLTIP:RELIGIONGROUP,christian,X #L християнські#!#! землі #TOOLTIP:REGION,balkan_region,X #L Балкан#!#!, об'єднуючи нас на ґрунті віри та запобігаючи більшості конфліктів.\n\nТепер, коли хватка Константинополя вже не така сильна, рівновага на наших кордонах стає все більш нестійкою. Деякі впливові родини попереджають, що падіння цього стовпа похитне всю конструкцію. Інші висловлюються більш прямо: колишні домовленості перестають діяти і те, що раніше регулювалося звичаєм, скоро вирішуватиметься силою. Те, який шлях ми оберемо в ці важкі часи, вплине на світ далеко за межами [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  fate_of_the_phoenix.1.desc_c: "Жодна імперія не трубитиме про власну неміч. Однак слабкі рішення, нездатність захистити кордони та втрата престижу красномовно свідчать про те, що [GetCountry('BYZ').GetLongName] стрімко пряму[GetCountry('BYZ').Custom('endlong_yeyut')] до свого жорстокого кінця. Тепер ситуація на заході не вимагає ні пошани, ні обережності — тільки холодного розрахунку. Саме нам судилося зайняти місце великої імперії та бенкетувати на її уламках."
  fate_of_the_phoenix.1.a: "Ще не все втрачено."
  fate_of_the_phoenix.1.b: "Зміни — це завжди потрясіння..."
  fop_parameters_a_tt: "Наслідок лиха визначить нашу долю. У ці неспокійні часи ми отримаємо доступ до унікальних [Concept('actions', 'дій')|e] на панелі [Concept('disaster', 'лиха')|e]"
  fop_parameters_b_tt: "Якщо нам вдасться впоратися з [Concept('disaster', 'лихом')|e] та зупинити занепад, ми вступимо в нову золоту добу та відновимо своє місце в історії"
  fop_paramenters_bul_tur_ser_tt: "Доки [GetCountry('BYZ').GetLongName] пережива[GetCountry('BYZ').Custom('endlong_yeyut')] [Concept('disaster', 'лихо')|e] «[ShowDisasterName('fate_of_the_phoenix')]», ми зможемо наживатися на слабкості цієї країни"
  fate_of_the_phoenix.2.title: "[target_location.GetName] у наших руках!"
  fate_of_the_phoenix.2.desc: "Прапори [ROOT.GetCountry.Custom('rank_ua_GEN')|l] знову майорять над [target_location.Custom('LR_INST')|l] [target_location.GetName]. Довгий час за цей важливий егейський порт билися #TOOLTIP:CULTURE,$turkish_culture_tt$,X #L турецькі#!#! полководці, пірати та країни-суперниці, тепер же він повернувся [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! — свій рідний дім. Його гавані та ринки зруйновані, але це можна виправити. Як ми вчинимо? Відбудуємо порт наново чи відновимо ринки та склади? Від цього рішення залежить наша майбутня роль у східних морях."
  fate_of_the_phoenix.2.a: "Відбудуємо порт наново."
  fate_of_the_phoenix.2.b: "Відновимо ринки та склади."
  building_set_to_max_level_tt: "Рівень [Concept('building', 'споруди')|e] буде підвищено до максимального"
  fate_of_the_phoenix.3.title: "$fate_of_the_phoenix.2.title$"
  fate_of_the_phoenix.3.desc: "[target_location.GetRank.GetNameWithNoTooltip] [target_location.GetName] — прихисток імператорів та гарант спадкоємності влади після катастрофи 1204 року — повертається в рідну гавань. Ці стіни захищали вигнаних правителів [ROOT.GetCountry.Custom('rank_ua_GEN')|l], служили оплотом закону та давали надію на майбутнє. Їх відновлення має глибоко символічне значення. [ROOT.GetCountry.GetFlavorRank] відроджу[ROOT.GetCountry.Custom('endrank_yeyut')]ся з праху та попелу."
  fate_of_the_phoenix.3.a: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetNameWithNoTooltip] особисто куруватиме цей проєкт!"
  fate_of_the_phoenix.3.b: "Це метафора відродження імперії!"
  fate_of_the_phoenix.3.c: "Час відновити нашу владу над Анатолією!"
  fate_of_the_phoenix.4.title: "$fate_of_the_phoenix.2.title$"
  fate_of_the_phoenix.4.desc: "[target_location.GetRank.GetNameWithNoTooltip] [target_location.GetName], колиска #L [GetCountry('TUR').GetAdjective|l]ої#! влади, поступається натиску імперії. Ця територія не тільки приносила хорошу данину, а й служила беям джерелом сили та авторитету. Захоплення #L #TOOLTIP:COUNTRY_RANK,[target_location.GetRank.Custom('CF_tt')],X [target_location.GetRank.Custom('rank_ua_GEN')|l]#!#! — чіткий сигнал всій #TOOLTIP:REGION,anatolia_region,X #L Анатолії#!#!: часи змінилися, і [ROOT.GetCountry.GetFlavorRank|l] виход[ROOT.GetCountry.Custom('endrank_ytyat')] з глухої оборони."
  fate_of_the_phoenix.4.a: "Ми заволоділи Анатолією!"
  unlocks_demand_beylik_tribute_disaster_action_tt: "Дає доступ до [Concept('action', 'дії')|e] «[ShowGenericActionName('demand_beylik_tribute')]» доти, доки це [Concept('disaster', 'лихо')|e] не закінчиться"
  fate_of_the_phoenix.5.title: "[loser.GetNameWithNoTooltip] зазна[loser.Custom('end_yeyut')] поразки"
  fate_of_the_phoenix.5.desc: "[loser.GetLongName] розправля[loser.Custom('endlong_yeyut')] плечі на тлі зростання нестабільності, спричиненого війною між бейликами. Майстерно чергуючи силові та дипломатичні методи, ця країна починає загрожувати незалежності [ROOT.GetCountry.Custom('rank_ua_GEN')|l]. Однак своїми недавніми перемогами ми довели, що все ще є глашатаями Риму і боремося як леви навіть у такі неспокійні часи. Нехай ці перемоги стануть поворотною точкою, початком нової доби, яка покладе край занепаду!"
  fate_of_the_phoenix.5.a: "Ситуація змінюється!"
  high_legitimacy_grants_extra_benefits_tt: "Протягом #Y 30#! років [Concept('assimilation', 'асиміляція')|e] та [Concept('integration', 'інтеграція')|e] в наших [Concept('locations', 'місцевостях')|e] відбуватимуться значно швидше за [Concept('legitimacy', 'легітимності')|e] вище #Y 50#!"
  fate_of_the_phoenix.6.title: "Провінція [target_province.GetNameWithNoTooltip] противиться нашій владі"
  fate_of_the_phoenix.6.desc: "Провінція [target_province.GetName] відмовляється співпрацювати з нами в цей важкий період. Якщо ми не визнаємо її незалежності, може початися справжній заколот. Наші радники пропонують не ризикувати, однак, зробивши таку поступку, [ROOT.GetCountry.GetFlavorRank|l] ще більше втрача[ROOT.GetCountry.Custom('endrank_yeyut')] авторитет."
  fate_of_the_phoenix.6.a: "Феніксу байдуже до дріб’язкових скарг."
  fate_of_the_phoenix.6.b: "Раптом [target_character.GetShortNameWithNoTooltip] зможе допомогти?"
  fate_of_the_phoenix.6.c: "Звернімося до думки народу!"
  target_character_goes_to_target_province_to_restore_order_tt: "[target_character.GetName] стежитиме, як провінція [target_province.GetName] відновлює порядок. [Select_CString(target_character.IsFemale, 'Вона', 'Він')] буде відсутн[Select_CString(target_character.IsFemale, 'я', 'ій')] #Y 2#! роки"
  fate_of_the_phoenix.7.title: "Слабкість [target_country.Custom('CL_GEN')]"
  fate_of_the_phoenix.7.desc: "[target_country.GetName] втрача[target_country.Custom('end_yeyut')] силу та вагу, тому для нас відкривається вікно можливостей. Якщо ми хочемо домогтися свого, то повинні діяти швидко, доки [target_character.GetName] не [Select_CString(target_character.IsFemale, 'відновила', 'відновив')] порядок."
  fate_of_the_phoenix.7.a: "Наш час настав."
  fate_of_the_phoenix.7.b: "Не можна порушувати баланс сил!"
  we_may_have_another_chance_soon_tt: "#italic Можливо, нам ще випаде нагода заявити про свої домагання...#!"
  fate_of_the_phoenix.8.title: "Війни [actor.Custom('CL_GEN')]"
  fate_of_the_phoenix.8.desc: "Зараз [actor.GetName] вед[actor.Custom('end_youtut')] війну проти ворогів істинної віри. Оскільки ми належимо до одного автокефального патріархату, від нас очікують, що ми також візьмемо до рук зброю і кинемося битися з міфічним спільним противником. У разі відмови нам загрожує виключення з патріархату, через що відносини між нашими країнами дадуть тріщину."
  fate_of_the_phoenix.8.a: "До бою!"
  fate_of_the_phoenix.8.b: "Не варто витрачати на це час."
  fate_of_the_phoenix.9.title: "[target_army.GetNameWithNoTooltip] та дезертирство"
  fate_of_the_phoenix.9.desc: "[target_army.GetName] — звідси надходять тривожні звістки. [target_character.GetName] не справляється з командуванням: бойовий дух упав, кількість дезертирів стрімко зростає. Подібні невдачі кидають тінь на [ROOT.GetCountry.Custom('rank_ua_ACC')|l] та надихають наших ворогів."
  fate_of_the_phoenix.9.a: "Жалюгідні боягузи — ось вони хто!"
  target_army_suffers_losses_tt: "[target_army.GetName] втрачає #R [ROOT.GetVariable('visual_strength_loss_variable').GetValue|V2]%#! [Concept('strength', 'чисельності')|e] через дезертирство"
  fate_of_the_phoenix.10.title: "Допомога вірного воєначальника"
  fate_of_the_phoenix.10.desc: "[target_character.GetName], командир загону «[target_unit.GetName]», багато років служить нам вірою і правдою. Безмежна відданість і багаторазові перемоги перетворили [Select_CString(target_character.IsFemale, 'її', 'його')] на зразок для наслідування, символ зібраності та рішучості в скрутні часи."
  fate_of_the_phoenix.10.a: "[target_character.GetShortNameWithNoTooltip] приведе нас до перемоги!"
  major_victories_enhance_stats_tt: "Якщо [target_character.GetName] перемагатиме у великих [Concept('battles', 'битвах')|e], [Select_CString(target_character.IsFemale, 'її', 'його')] [Concept('abilities', 'навички')|e] можуть покращитися"
  fate_of_the_phoenix.11.title: "[target_character.GetNameWithNoTooltip] здобуває гучну перемогу"
  fate_of_the_phoenix.11.desc: "Загін «[target_unit.GetName]» здобуває блискучу перемогу над військом #ONCLICK:COUNTRY,[target_losing_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_losing_country.Custom('CL_tt')],X [target_losing_country.Custom('CL_GEN')|L]#!#! в [target_location.Custom('LR_PREP')|l] [target_location.GetName]. Звістка про цей тріумф поширюється стрімко, зміцнюючи віру в те, що фенікс відродиться з попелу. [target_character.GetShortName] вже стає легендою."
  fate_of_the_phoenix.11.a: "Нехай командує нашим військом вічно!"
  fate_of_the_phoenix.12.title: "[target_character.GetNameWithNoTooltip] зазнає поразки"
  fate_of_the_phoenix.12.desc: "Ми назавжди запам’ятаємо цей фатальний день! Сьогодні в [target_location.Custom('LR_PREP')|l] [target_location.GetName] [target_character.GetName] [Select_CString(target_character.IsFemale, 'зазнала', 'зазнав')] поразки від війська, яким [Select_CString(target_character_2.IsFemale, 'командувала', 'командував')] [target_character_2.GetName]. Нам завдано серйозного удару, а суперники вже почали ділити шкуру невбитого ведмедя. Невже удача покинула нас? Будемо сподіватися на краще і вірити в перемогу."
  fate_of_the_phoenix.12.a: "Яка ганьба!"
  fate_of_the_phoenix.13.title: "[target_character.GetNameWithNoTooltip] і реформи влади"
  fate_of_the_phoenix.13.desc: "Для [ROOT.GetCountry.Custom('rank_ua_GEN')|l] настав вирішальний момент. Серйозний занепад, внутрішні чвари, вторгнення іноземних військ і повільна деградація влади принесли нашому народу багато страждань. Нові ініціативи ради допоможуть відновити лад, покращать роботу наших установ і зміцнять державний устрій.\n\nЦі реформи вимагатимуть великої волі та жертв, адже сила звички дуже велика. Багато хто чинитиме опір змінам. Але якщо проявити наполегливість, ці заходи можуть зупинити повільне згасання [ROOT.GetCountry.Custom('rank_ua_GEN')|l] і закласти основи для подальшого розвитку та зростання. У нас два шляхи: оновлення або подальший розкол, за яким настане забуття."
  fate_of_the_phoenix.13.a: "Якщо відродження вимагає жертв, хай так і буде."
  enable_unlock_spread_philhellenism_and_encourage_latin_militarism_tt: "Ми отримаємо доступ до [Concept('cabinet_actions', 'доручень ради')|e] «[ShowCabinetActionName('spread_philhellenism')]» та «[ShowCabinetActionName('encourage_latin_militarism')]», доки [Concept('disaster', 'лихо')|e] «[ShowDisasterName('fate_of_the_phoenix')]» не закінчиться.\n\nЯкщо ми впораємося з лихом, ці доручення #Y назавжди#! залишаться в нашому розпорядженні"
  fate_of_the_phoenix.14.title: "Відродження фенікса"
  fate_of_the_phoenix.14.desc: "Ми повернули втрачені землі, період занепаду добігає кінця. [ROOT.GetCountry.GetName] відновлю[ROOT.GetCountry.Custom('end_yeyut')] сили, [ROOT.GetCountry.GetFlavorRank|l] знову мож[ROOT.GetCountry.Custom('endrank_eut')] дати відсіч ворогам. Дорога до #TOOLTIP:LOCATION,rome,X #L Риму#!#! тепер відкрита для нас."
  fate_of_the_phoenix.14.a: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] з мармуру — це просто немислимо!"
  maintain_cabinet_actions_tt: "Ми успішно впоралися з [Concept('disaster', 'лихом')|e], тому зберегли доступ до [Concept('cabinet_actions', 'доручень')|e] «[ShowCabinetActionName('spread_philhellenism')]» та «[ShowCabinetActionName('encourage_latin_militarism')]»"
  because_we_made_military_reforms_tt: "Одна або кілька військових реформ за допомогою [Concept('action', 'дії')|e] «[ShowGenericActionName('reform_imperial_armies')]» призвели до такого:"
  num_of_reforms_desc: "Кількість реформ"
  unlock_allelengyon_bureaucracy_kephalai_bureaucracy_tt: "Відкриває [Concept('bureaucracies', 'установи')|e] «$allelengyon_bureaucracy$» та «$kephalai_bureaucracy$»"
  unlock_kritai_katholikoi_reformed_extra_effect: "Модифікатор #TOOLTIP:MODIFIER_TYPE,country_cabinet_efficiency,X #P #V «Ефективність у нашій раді»#!#!#! [Concept('government_reform', 'державного принципу')|e] #TOOLTIP:GOVERNMENT_REFORM,kritai_katholikoi_reformed,X #L «Оновлені криті кафоліки»#!#! стане постійним"
  fate_of_the_phoenix.15.title: "Доба занепаду"
  fate_of_the_phoenix.15.desc: "Попри всі старання, ми не зуміли повернути втрачені землі. Посилення сусідніх бейликів та ворогів біля наших #TOOLTIP:REGION,balkan_region,X #L балканських#!#! кордонів не дозволяє повернути процес назад. Занепад триває, і майбутнє [ROOT.GetCountry.Custom('rank_ua_GEN')|l] оповите туманом."
  fate_of_the_phoenix.15.a: "Наше майбутнє неясне й туманне."
  no_longer_access_to_the_cabinet_actions_tt: "Ми втратимо доступ до [Concept('cabinet_actions', 'доручень')|e] «[ShowCabinetActionName('spread_philhellenism')]» та «[ShowCabinetActionName('encourage_latin_militarism')]»"
  fate_of_the_phoenix.16.title: "[actor.GetNameWithNoTooltip] прос[actor.Custom('end_ytyat')] про пожертву"
  fate_of_the_phoenix.16.desc: "Нам стало відомо, що [actor.GetName] потерпа[actor.Custom('end_yeyut')] від безладдя. У відчаї місцева влада відправила до нас гінців із проханням про фінансову допомогу. Взамін нам дозволять поширювати [actor.Custom('preposition_uv')] [actor.Custom('rank_ua_PREP')|l] свої традиції та звичаї. Цей несподіваний жест свідчить про те, що [actor.GetCapital.GetRank.GetNameWithNoTooltip|l] [actor.GetCapital.GetName] перебуває в найбільш жалюгідному становищі."
  fate_of_the_phoenix.16.a: "Тут не завадив би символічний жест підтримки."
  fate_of_the_phoenix.16.b: "Ми повинні допомогти стримати натиск орд в Анатолії."
  fate_of_the_phoenix.16.c: "Жодних грошей єретикам!"
  no_money_for_byz_tt: "[actor.GetName] не отрима[actor.Custom('end_yeyut')] від нас допомоги"
  fate_of_the_phoenix.17.title: "[actor.GetNameWithNoTooltip] пропону[actor.Custom('end_yeyut')] торгові привілеї"
  fate_of_the_phoenix.17.desc: "Ми вже ведемо справи в #TOOLTIP:LOCATION,constantinople,X #L Константинополі#!#!, але тепер [actor.GetName] пропону[actor.Custom('end_yeyut')] нам поставити будівельні матеріали для кораблів в обмін на пільгові умови та ринкові привілеї для їхньої столиці."
  fate_of_the_phoenix.17.a: "[target_country.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] не промине вигоди. По руках!"
  fate_of_the_phoenix.17.b: "Нас це не цікавить."
  selected_republic_may_donate_ships_to_our_cause_tt: "Обрана купецька республіка може надати свої [Concept('ships', 'кораблі')|e] (галери) та [Concept('sailors', 'моряків')|e] в обмін на [Concept('merchant_power', 'торговельну перевагу')|e] в #TOOLTIP:LOCATION,constantinople,X #L Константинополі#!#!"
  byzantines_left_fend_themselves_tt: "[actor.GetLongName] залиша[actor.Custom('endlong_youtyut')]ся наодинці з проблемами"
  latin_merchant_privileges_key: "Привілеї італійських купців"
  fate_of_the_phoenix.18.title: "[target_character.GetNameWithNoTooltip] прибуває до [ROOT.GetCountry.GetCapital.Custom('LR_ACC')|l] [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
  fate_of_the_phoenix.18.desc: "[target_character.GetName], [Select_CString(target_character.IsFemale, 'яку', 'якого')] порекомендували нам наші вірні союзники з #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!, нарешті [Select_CString(target_character.IsFemale, 'прибула', 'прибув')] до нас з #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#! [target_location.GetName] і [Select_CString(target_character.IsFemale, 'готова', 'готовий')] поділитися з нами знаннями та навичками, якими славляться #L [target_culture.GetName|l]і#! землі. Ця людина з багатим досвідом служіння при іноземних дворах і завидною дисципліною, вихованою життям на півострові, пропонує нам свої послуги як дружній жест.\n\n[Select_CString(target_character.IsFemale, 'Її', 'Його')] приїзд — це чудова нагода не тільки отримати практичну вигоду, але й зміцнити зв’язки з нашими #TOOLTIP:CULTUREGROUP,italian_group,X #L італійськими#!#! братами, чия ерудиція та кмітливість продовжують впливати на справи принців та імператорів."
  fate_of_the_phoenix.18.a: "Ми будемо з великою цікавістю спостерігати за [Select_CString(target_character.IsFemale, 'її', 'його')] кар’єрою!"
  fate_of_the_phoenix.19.title: "[actor.GetNameWithNoTooltip] вимага[actor.Custom('end_yeyut')] данини"
  fate_of_the_phoenix.19.desc: "Коли [actor.GetName] підкорю[actor.Custom('end_yeyut')] #TOOLTIP:LOCATION,bursa,X #L Бурсу#!#!, [target_character_1.GetName] значно зміцнює свій вплив. З [target_location_1.Custom('LR_GEN')|l] [target_location_1.GetName] прибули посланці, які зовсім не мають наміру з нами люб’язничати. Вони відразу вимагають з нас данину за наші, як вони висловлюються, «язичницькі традиції» і всім своїм виглядом демонструють, що в разі відмови їхня країна готова застосувати силу. Тепер ми зобов’язані відповісти золотом, кров’ю або непокорою, і наслідки нашого вибору зачеплять далеко не тільки нас."
  fate_of_the_phoenix.19.a: "Вибору немає, доведеться розщедритися."
  fate_of_the_phoenix.19.b: "Краще відправимо міцних чоловіків."
  fate_of_the_phoenix.19.c: "Нічого вони не отримають!"
  fate_of_the_phoenix.20.title: "Реформа [actor.GetAdjectiveWithNoTooltip|l]ого війська"
  fate_of_the_phoenix.20.desc_a: "Багаторічна байдужість влади та фінансові труднощі призвели до того, що військо [ROOT.GetCountry.Custom('rank_ua_GEN')|l] занепало. Воно абсолютно не готове до майбутніх випробувань, але [target_character.GetName], схоже, знає, як усе виправити. [Select_CString(target_character.IsFemale, 'Вона', 'Він')] збирається запровадити нові правила, які відновлять дисципліну, реорганізують систему командування та відродять звичаї, і тоді військо [ROOT.GetCountry.GetCapital.Custom('LR_GEN')|l] [ROOT.GetCountry.GetCapital.GetName] знову наводитиме страх на противників. Ці реформи дорого коштуватимуть, але без них наша бойова міць продовжить поступово слабшати."
  fate_of_the_phoenix.20.desc_b: "Довгий час моря були щитом і головною артерією [ROOT.GetCountry.Custom('rank_ua_GEN')|l]. На жаль, зараз наш флот переживає не найкращі часи: його досвід, устрій, вишкіл моряків ганебний, але, схоже, [target_character.GetName] знає, як врятувати ситуацію. [Select_CString(target_character.IsFemale, 'Вона', 'Він')] збирається сформувати нове керівництво, покращити підготовку кадрів та осучаснити військово-морські установи. У разі успіху #L [ROOT.GetCountry.GetAdjective|l]ий#! флот знову стане грізною силою, а наші береги та торгові шляхи опиняться під надійною охороною."
  fate_of_the_phoenix.20.a: "Ми повинні зупинити занепад."
  fate_of_the_phoenix.20.b: "Ми займемося цим трохи пізніше."
  reformation_of_the_school_of_admirals_better_stats_tt: "Поки активний цей [Concept('modifier', 'модифікатор')|e], завдяки [Concept('action', 'дорученню')|e] #TOOLTIP:GENERIC_ACTION,train_admiral,X #L «Навчання адмірала»#!#! [Concept('characters', 'персонажі')|e] отримуватимуть покращені [Concept('abilities', 'навички')|e]"
  better_stats_because_reformation_of_the_school_of_admirals_modifier_tt: "Цей [Concept('admiral', 'флотоводець')|e] отримав #G +10#! до [Concept('abilities', 'навичок')|e] через чинний [Concept('modifier', 'модифікатор')|e] #TOOLTIP:STATIC_MODIFIER,reformation_of_the_school_of_admirals_modifier,X #V #L «Реформа школи флотоводців»#!#!#!"
  because_we_reformed_our_navy_in_DHE_desc: "Реформа [Concept('navy', 'флоту')|e] під час [Concept('event', 'події')|e] «$flavor_byz.15.title$» призвела до такого:"
  target_character_total_abilities: "[target_character.GetName] та [Select_CString(target_character.IsFemale, 'її', 'його')] [Concept('abilities', 'навички')|e]"
  selected_country_will_send_us_engineer_character_tt: "Вибрана [Concept('country', 'країна')|e] відправить до нас одного зі своїх найкращих [Concept('characters', 'персонажів')|e]"
  target_country_forced_to_give_tribute_tt: "Вибрану [Concept('country', 'країну')|e] можна переконати дати нам [Concept('gold', 'золоті')|e] або [Concept('manpower', 'рекрутів')|e]"
  at_war_with_heathens_or_heretics_tt: "Зараз ми ведемо [Concept('war', 'війну')|e] проти [Concept('country', 'країни')|e], яка НЕ сповідує #L [actor.GetReligion.GetAdjective|l]ої#! віри"
  selected_country_may_join_every_ongoing_war_against_heathen_and_heretics_tt: "Вибрана [Concept('country', 'країна')|e] може приєднатися до наших поточних [Concept('wars', 'війн')|e], чиї [Concept('war_leaders', 'лідери')|e] — [Concept('heathens', 'іновірці')|e] або [Concept('heretics', 'єретики')|e]"
  pops_in_capital_province_convert_catholic_tt: "Деякі [Concept('pops', 'групи населення')|e] нашої провінції [actor.GetCapital.GetProvince.GetName], які сповідують #L [actor.GetReligion.GetAdjective|l]у#! віру, приймуть #TOOLTIP:RELIGION,$catholic_tt$,X #L католицтво#!#!"
  fate_of_phoenix_actions_price: "Вартість дій у ситуації «$fate_of_the_phoenix$»"
  request_papal_donation: "Звернення до Риму з проханням про допомогу"
  request_papal_donation_desc: "[actor.GetFlavorRank] перебува[actor.Custom('endrank_yeyut')] у складній ситуації: місцева скарбниця практично виснажена. Ми можемо відправити посланців до $PAP$ з проханням надати підтримку братам-#TOOLTIP:RELIGIONGROUP,christian,X #L християнам#!#!. Звісно, подібні кроки не обходяться без наслідків, однак виручене золото допоможе нам виграти час у годину потреби."
  grant_latin_merchants_privileges: "Розширення привілеїв італійських купців"
  grant_latin_merchants_privileges_desc: "Розширення особливих прав для #TOOLTIP:CULTUREGROUP,italian_group,X #L італійських#!#! купецьких республік дасть нам шанс розвинути торгові відносини та отримати підтримку з моря. Подібні поступки можуть перетворити #L #TOOLTIP:LOCATIONRANK,[actor.GetCapital.Custom('LR_tt')],X [actor.GetCapital.Custom('LR_ACC')|l]#!#! [actor.GetCapital.GetName] на процвітаючий центр торгівлі, але при цьому він напевно зазнає серйозного іноземного впливу."
  grant_latin_merchants_privileges_tooltip: "Any [country|e] in [ShowRegionName('italy_region')] with the [ShowGovernmentReformName('merchant_republic')] is neither subject nor our rival"
  accept_catholic_delegation: "Прийом католицької делегації"
  accept_catholic_delegation_desc: "[actor.GetCapital.GetRank.GetNameWithNoTooltip] [actor.GetCapital.GetName] може відкрити ворота делегатам #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L Католицької церкви#!#!, які прагнуть єдності та готові йти на поступки. Багато наших радників вважають, що якщо ми приймемо цих посланців, то зможемо покращити відносини з #TOOLTIP:RELIGION,$catholic_tt$,X #L католицьким#!#! світом, однак подібні жести нерідко викликають напруженість у суспільстві."
  attract_italian_engineer: "Залучення італійських інженерів"
  attract_italian_engineer_desc: "Ми запрошуємо іменитих #TOOLTIP:CULTUREGROUP,italian_group,X #L італійських#!#! інженерів удосконалити наші укріплення та військові споруди. Ці фахівці вирішать наші старі проблеми сучасними методами, однак вплив західної науки та культури на нашу країну може зрости."
  demand_beylik_tribute: "Вимога данини від бейликів"
  demand_beylik_tribute_desc: "Після відновлення контролю над #TOOLTIP:REGION,anatolia_region,X #L Анатолією#!#! ми можемо змусити найближчі бейлики схилитися перед #L [actor.GetAdjective|l]ою#! міццю. Обклавши суперників даниною, ми послабимо їх і відновимо авторитет [actor.Custom('rank_ua_GEN')|l]."
  summon_patriarchate_member: "Заклик учасника патріархату"
  summon_patriarchate_member_desc: "Ми лідери автокефального патріархату, тому можемо закликати на боротьбу з нечестивцями інші #TOOLTIP:RELIGION,$orthodox_tt$,X #L православні#!#! народи. Вони пов’язані з нами вірою, а не зобов’язаннями, і їхня підтримка ще сильніше згуртує нас перед обличчям спільного ворога."
  reform_imperial_armies: "Реформа [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]ого війська"
  reform_imperial_armies_desc: "Війська [actor.Custom('rank_ua_GEN')|l] довгі роки страждали від нестачі уваги влади та безглуздих нововведень. Комплексна реформа відновить армійську дисципліну та порядок, але для її проведення потрібні срібло, стабільність та готовність суспільства до змін."
  patronize_orthodox_monastery: "Покровительство православному монастирю"
  patronize_orthodox_monastery_desc: "Взявши під своє покровительство місцевий #TOOLTIP:BUILDING_TYPE,orthodox_monastery,X #L православний монастир#!#!, ми продемонструємо свою благочестивість та зміцнимо віру наших жителів. Цей щедрий вчинок покращить якість життя людей та нагадає їм, що [actor.GetLongName] як і раніше сто[actor.Custom('endlong_yityat')] на сторожі істинної релігії."
  reform_armed_forces_tt: "Ми зможемо реформувати [Concept('army', 'військо')|e] або [Concept('navy', 'флот')|e] та звернути назад наслідки багатовікової деградації"
  has_not_completed_all_six_reforms_tt: "Ми не провели всі #Y 6#! доступних реформ"
  patronize_orth_monastery_tt: "Обрана [Concept('location', 'місцевість')|e] отримає [Concept('modifier', 'модифікатор')|e] «[ShowModifier('patronize_orthodox_monastery_modifier')]», а багато наших #TOOLTIP:RELIGION,$orthodox_tt$,X #L православних#!#! [Concept('pops', 'груп населення')|e] отримають [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"