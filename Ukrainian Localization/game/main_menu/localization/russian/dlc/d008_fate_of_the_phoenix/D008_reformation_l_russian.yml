l_russian:
 contact_patriarch_of_constantinople: "Обращение к патриарху Константинополя"
 contact_patriarch_of_constantinople_desc: "Мы отправим Меланхтона в Константинополь с нашим Символом веры и начнём диалог с #TOOLTIP:RELIGION,$orthodox_tt$,X #L православным#!#! патриархатом."
 reformation.17.title: "[GetCharacter('reformer_philip_melanchton').GetLastNameWithNoTooltip]'s Letter to Constantinople"
 reformation.17.desc: "Выдающийся богослов нашей страны [melanchthon.GetName] выступает со смелым предложением: отправить посланника к патриарху Константинополя с нашим Символом веры. Несмотря на то, что по многим вопросам #TOOLTIP:RELIGION,$orthodox_tt$,X #L православная#!#! и #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранская#!#! конфессии расходятся, они обе отвергли верховенство католического папы. Быть может, патриарх оценит такой жест от собратьев по противостоянию Риму."
 reformation.17.a: "Отправить Меланхтона с нашим «Исповеданием веры»."
 reformation.17.b: "Сейчас не время для таких заигрываний."
 reformation.17.historical_info: "Филипп Меланхтон (1497–1560), ближайший соратник Лютера и автор «Аугсбургского исповедания» (1530), проявлял большой интерес к Восточной православной церкви как потенциальному союзнику в борьбе с Римом. Его переписка с греческими богословами заложила основу для будущих лютеранских сношений с Константинополем. В 1573 году богословы из Тюбингена отправили греческий перевод «Аугсбургского исповедания» патриарху Иеремии II, начав один из самых продолжительных богословских диалогов между лютеранством и православием в эпоху Реформации."
 reformation.18.title: "Письмо от лютеранских реформаторов"
 reformation.18.desc: "В Константинополь прибыла делегация из [lutheran_country.Custom('longname_ua_GEN')] с богословским трактатом — «Исповеданием веры». Судя по всему, #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранские#!#! реформаторы ищут диалога с нашим патриархатом, ссылаясь на нашу общую вражду с епископом Рима. Пока неясно, насколько их намерения чисты."
 reformation.18.a: "Вступим с этими реформаторами в осторожную богословскую дискуссию."
 reformation.18.b: "Это еретики. Отошлём их прочь."
 reformation.18.historical_info: "Вселенский патриархат Константинополя сохранил духовную власть над православными христианами даже после того, как Константинополь завоевали османы в 1453 году. Патриарх Иеремия II, который занимал этот пост примерно с 1572 по 1595 год, был известен своей учёностью и вступил в серьёзную переписку с тюбингенскими богословами, отправив с 1576 по 1581 год три подробных ответа на их письма. Он отвергал лютеранские взгляды на принцип оправдания, роль свободы воли и филиокве, но при этом признавал искренность их критики, а не воспринимал её с пренебрежением."
 reformation.19.title: "Патриарх отвечает с интересом"
 reformation.19.desc: "Патриарх отреагировал на визит нашего посланника сдержанным любопытством. Нам не удалось прийти к согласию по взглядам на веру, но обмен мнениями открыл дорогу между Константинополем и нашей государственной церковью — это небольшой, но значительный шаг к взаимопониманию между #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранским#!#! и #TOOLTIP:RELIGION,$orthodox_tt$,X #L православным#!#! христианством."
 reformation.19.a: "Даже такой шаткий мостик лучше, чем ничего."
 reformation.19.historical_info: "Переписка тюбингенских лютеран с Иеремией II считается знаковым событием в ранней истории экуменического диалога. В своих трёх ответах (1576, 1579, 1581) патриарх Иеремия II вступил в серьёзную дискуссию с лютеранской теологией, отвергнув при этом её основные постулаты. Он привёл подробные нравоучительные комментарии к таким вопросам, как доктрина оправдания верой, роль свободной воли и принцип филиокве. Такой уровень вовлечённости продемонстрировал интеллектуальную активность патриархата при власти осман. Обе стороны тщательно сохранили всю переписку."
 reformation.20.title: "Патриарх отсылает делегацию"
 reformation.20.desc: "Нашу делегацию холодно приняли в Константинополе. Патриарх счёл «Исповедание веры» очередной ересью, и нашего посланника отправили восвояси без каких-либо церемоний. Это послужило напоминанием о том, что #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранство#!#! стоит в стороне и от Рима, и от Константинополя."
 reformation.20.a: "Нашей вере не нужно одобрение никаких патриархатов."
 reformation.20.historical_info: "Переписка тюбингенских лютеран с Иеремией II не привела к сближению конфессий. Патриарх Иеремия II в своих трёх ответах (1576, 1597, 1581) отверг лютеранские взгляды на доктрину оправдания верой, принцип «сола скриптура» и филиокве, утверждая, что для православной церкви такие отклонения неприемлемы. В конце концов лютеране решили, что дальнейшая переписка не будет иметь смысла, и завершили её в 1581 году."
 reformation.21.title: "Прибытие православного богослова"
 reformation.21.desc: "Вести о нашей переписке с Константинополем привели к неожиданным результатам. К нашему двору [Select_CString(orthodox_scholar.IsFemale, 'прибыла', 'прибыл')] #TOOLTIP:RELIGION,$orthodox_tt$,X #L православн#!#![Select_CString(orthodox_scholar.IsFemale, 'ая учёная женщина', 'ый богослов')] [orthodox_scholar.GetName] с намерением продолжить теологический диалог, начатый нашим посланником. Этот визит ставит нас в сложное положение: слишком радушный приём может возмутить наше собственное духовенство, но если мы прогоним [Select_CString(orthodox_scholar.IsFemale, 'гостью', 'гостя')], то рискуем растерять завоёванное расположение Константинополя."
 reformation.21.a: "Организуем обширный богословский диалог."
 reformation.21.b: "Поблагодарим [Select_CString(orthodox_scholar.IsFemale, 'гостью', 'гостя')], но откажемся от диалога."
 reformation.21.historical_info: "Несмотря на то, что переписка тюбингенских богословов с Константинополем не привела к сближению доктрин, она вызвала значительный интерес у представителей обеих сторон. Греческие православные учёные ближе познакомились с лютеранской теологией, а их лютеранские коллеги углубили понимание Отцов Церкви и восточной христианской традиции. Такое межконфессиональное общение привело к расширению европейского гуманизма, который стал воспринимать греческое христианство как источник, независимый от Рима."