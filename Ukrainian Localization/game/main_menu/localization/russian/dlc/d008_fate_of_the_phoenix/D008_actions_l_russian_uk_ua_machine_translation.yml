l_russian:
  loan_icon: "Позичання ікони"
  loan_icon_desc: "Позичте одну #TOOLTIP:WORK_OF_ART_TYPE,icon,X #L ікону#!#! іншій [Concept('country', 'країні')|e] на #Y 10#! років за плату, яка залежить від її [Concept('income', 'доходу')|e] та [Concept('art_quality', 'майстерності')|e] [Concept('work_of_art', 'витвору')|e]. [Concept('opinion', 'Думка')|e] та [Concept('trust', 'довіра')|e] двох країн одна до одної також підвищаться."
  loan_icon_tt_no_target: "Ми направимо пропозицію про передачу в оренду одного з наших [Concept('works_of_art', 'витворів')|e] цільовій [Concept('country', 'країні')|e] в обмін на [Concept('gold', 'золоті')|e]"
  loan_icon_tt: "Вони отримають нашу пропозицію надати їм позику — [SCOPE.sWorkOfArt('target').GetName] — в обмін на [SCOPE.GetValue('icon_price_value')|2][gold_i]"
  loan_icon_bad_economy_tt: "Схоже, вони перебувають у скрутному господарчому становищі, тому #R можуть не погодитися на нашу пропозицію#!, якщо їхня [Concept('opinion', 'думка')|e] про нас буде недостатньо високою"
  loan_icon_choose_icon: "Оберіть #TOOLTIP:WORK_OF_ART_TYPE,icon,X #L ікону#!#! для передачі в оренду"
  not_already_receiving_icon_tt: "У них не повинно бути раніше позиченої #TOOLTIP:WORK_OF_ART_TYPE,icon,X #L ікони#!#!"
  mend_schism: "Подолання розколу"
  mend_schism_desc: "Ось уже багато століть #TOOLTIP:RELIGIONGROUP,christian,X #L християнство#!#! перебуває в розколі. Тепер же, коли всі катедри пентархії перебувають під нашим контролем, ми повинні скористатися своїм впливом, щоб загоїти ці рани та примирити церкви."
  restore_rome_primacy: "Повернення столиці до Риму"
  restore_rome_primacy_desc: "[ShowLocationName('rome')] був першою столицею імперії, і навіть після її поділу на східну та західну частини він зберіг своє значення аж до падіння Західної Римської імперії. Тепер, коли Вічне місто знову в наших руках, ми можемо повернути йому статус початкової столиці."
  patriarch_not_in_rome_tt: "Наш #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,autocephalous_patriarchate,X #L автокефальний патріархат#!#! не повинен при цьому вже розташовуватися в #TOOLTIP:LOCATION,rome,X #L Римі#!#!"
  reestablish_hellenism: "Відродження еллінізму"
  reestablish_hellenism_desc: "Давня віра нашого народу приваблює правителів своїми звичаями та містикою. Ми можемо повернути їй колишню велич і знову зробити її головною релігією."
  add_omen: "Додавання знамення"
  add_omen_god: "Оберіть божество, що покровительствує у виборі знамення"
  select_omen: "Прикликання знамення"
  select_omen_desc: "Наш правитель прикличе знамення."
  select_omen_tt: "Ми отримаємо тимчасову перевагу для нашої [Concept('country', 'країни')|e]. Її величина залежить від відповідного [Concept('ability', 'хисту')|e] нашого [Concept('ruler', 'правителя')|e]."
  select_omen_god_is_active_tt: "[target.Custom('end_predlog_vvo')|U] #ONCLICK:COUNTRY,[target.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target.Custom('CL_tt')],X [target.Custom('CL_PREP')|L]#!#! вже є інше [Concept('omen', 'знамення')|e]."
  select_omen_god: "Вибір знамення"
  select_omen_god_desc: "Наш правитель обере божество, що покровительствує нам у виборі [Concept('omen', 'знамення')|e]."
  select_omen_god_tt: "Оберіть божество, що покровительствує нам у виборі [Concept('omen', 'знамення')|e]."
  host_olympiad: "Проведення Олімпійських ігор"
  host_olympiad_desc: "Наш правитель організує змагання на честь богів на місці #TOOLTIP:RELIGION,$hellenism_religion_tt$,X #L елліністської#!#! [Concept('holy_site', 'святині')|e]."
  host_olympiad_location_tt: "До закінчення Олімпійських ігор обрана [Concept('location', 'місцевість')|e] отримує модифікатор #TOOLTIP:STATIC_MODIFIER,host_olympiad_location_modifier,X #V #L «Проведення Олімпійських ігор»#!#!#!."
  host_olympiad_effect_tt_location: "Ефекти посилюються залежно від [Concept('holy_site_importance_short', 'значимості')|e] #ONCLICK:COUNTRY,[target.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target.Custom('CL_tt')],X [target.Custom('CL_GEN')|L]#!#! ([target.GetImportance])."
  host_olympiad_effect_tt_no_location: "Ефекти посилюються залежно від [Concept('holy_site_importance_short', 'значимості')|e] обраної [Concept('holy_site', 'святині')|e]."
  sponsor_troop_feast: "Організація бенкету для вояків"
  sponsor_troop_feast_desc: "Влаштувавши бенкет для наших військ, ми зміцнимо фізичну форму та бойовий дух вояків, щоб вони з більшою охотою служили своїй країні."
  roman_festivals: "Організація римського святкування"
  roman_festivals_desc: "Щомісяця відбувається безліч свят на честь різних богів, однак цього разу ми скористаємося ресурсами держави, щоб організувати воістину чудове торжество."
  explanation_roman_festivals_tt: "#TOOLTIP:RELIGION,$hellenism_religion_tt$,X #L Елліністичні#!#! народи відзначають безліч свят, присвячених відповідним богам. У кожному місяці свої святкування, а ми отримуємо різні ефекти залежно від того, яким чином вони проводяться."
  compitalia_tt: "Компіталії — свято на честь #italic компітальних ларів#!, або божеств перехресть."
  lupercalia_tt: "Луперкалії — свято здоров’я, родючості та очищення міста."
  quinquatria_tt: "Квінкватрії — свято на честь богині #TOOLTIP:GOD,athena_god,X #L Мінерви#!#!."
  fordicidia_tt: "Фордицидії — свято родючості, землеробства та скотарства. Під час цих святкувань у присутності весталок у жертву богині землі #italic Теллурі#! приносили тільну корову."
  mercuralia_tt: "Меркуралії — свято на честь посланця богів #TOOLTIP:GOD,hermes_god,X #L Меркурія#!#!."
  vestalia_tt: "Весталії — свято на честь богині сімейного вогнища #italic Вести#!."
  neptunalia_tt: "Нептуналії — свято на честь бога #TOOLTIP:GOD,poseidon_god,X #L Нептуна#!#!."
  vinalia_rustica_tt: "Віналії — свято збору винограду, овочівництва та родючості, що проводиться на честь бога #TOOLTIP:GOD,zeus_god,X #L Юпітера#!#! та богині #TOOLTIP:GOD,aphrodite_god,X #L Венери#!#!."
  ludi_romani_tt: "Римські ігри являють собою низку ігор та розважальних заходів на честь бога #TOOLTIP:GOD,zeus_god,X #L Юпітера#!#!."
  equus_october_tt: "Еквус Октобер — свято кінних змагань та жертвопринесення на честь бога #TOOLTIP:GOD,ares_god,X #L Марса#!#!, що збігається із закінченням сезону сільськогосподарських робіт та воєнних походів."
  ludi_plebeii_tt: "Плебейські ігри включають численні театральні вистави та спортивні змагання, присвячені простому люду."
  saturnalia_tt: "Сатурналії — свято на честь бога часу #italic Сатурна#!."
  greek_festivals: "Організація давньогрецького святкування"
  greek_festivals_desc: "У кожному куточку наших володінь відзначають своє свято, присвячене одному або кільком богам. Ми скористаємося ресурсами держави, щоб надати підтримку всім регіонам та влаштувати найграндіозніше торжество в історії."
  greek_festivals_tt: "Ми володіємо місцевістю як мінімум в одній з наступних провінцій: [ShowProvinceDefinitionName('laconia_province')], [ShowProvinceDefinitionName('achaea_province')], [ShowProvinceDefinitionName('arcadia_province')], [ShowProvinceDefinitionName('attica_province')], [ShowProvinceDefinitionName('smyrna_province')], [ShowProvinceDefinitionName('central_macedonia_province')], [ShowProvinceDefinitionName('lower_macedonia_province')], [ShowProvinceDefinitionName('aetolia_province')], [ShowProvinceDefinitionName('rodos_province')], [ShowProvinceDefinitionName('messenia_province')], [ShowProvinceDefinitionName('aydin_province')]."
  gymnopaedia_tt: "Гімнопедії — свято, яке відзначають у #italic Спарті#! та присвячують богу #italic Аполлону#!."
  gymnopaedia_tt_mod: "Ми отримаємо модифікатор #TOOLTIP:STATIC_MODIFIER,gymnopaedia_modifier,X #V #L «Гімнопедії»#!#!#!."
  laphria_tt: "Лафрії — свято, що відзначається в #TOOLTIP:PROVINCE_DEFINITION,achaea_province,X #L Ахеї#!#!, яке присвячене богині #italic Артеміді#!."
  laphria_tt_mod: "Ми отримаємо модифікатор #TOOLTIP:STATIC_MODIFIER,laphria_modifier,X #V #L «Лафрії»#!#!#!."
  lykaia_tt: "Лікеї — свято, що відзначається в #TOOLTIP:PROVINCE_DEFINITION,arcadia_province,X #L Аркадії#!#!, яке, з одного боку, є обрядом посвячення для ефебів, а з іншого — способом захисту від перевертнів."
  lykaia_tt_mod: "Ми отримаємо модифікатор #TOOLTIP:STATIC_MODIFIER,lykaia_modifier,X #V #L «Лікеї»#!#!#!."
  panathenaic_games_tt: "Панафінейські ігри проводяться в #TOOLTIP:PROVINCE_DEFINITION,attica_province,X #L Аттиці та Беотії#!#!, вони присвячені богині #TOOLTIP:GOD,athena_god,X #L Афіні#!#!."
  panathenaic_games_tt_mod: "Ми отримаємо модифікатор #TOOLTIP:STATIC_MODIFIER,panathenaic_games_modifier,X #V #L «Панафінеї»#!#!#!."
  apaturia_tt: "Апатурії — свято, що відзначається в #TOOLTIP:PROVINCE_DEFINITION,smyrna_province,X #L Смирні#!#!, яке присвячене богові #TOOLTIP:GOD,zeus_god,X #L Зевсу#!#! та богині #TOOLTIP:GOD,athena_god,X #L Афіні#!#!."
  apaturia_tt_mod: "Ми отримаємо модифікатор #TOOLTIP:STATIC_MODIFIER,apaturia_modifier,X #V #L «Апатурії»#!#!#!."
  hetairideia_tt: "Гетеридії — свято, що відзначається в #TOOLTIP:PROVINCE_DEFINITION,central_macedonia_province,X #L Центральній Македонії#!#!, яке присвячене богові #TOOLTIP:GOD,zeus_god,X #L Зевсу#!#!."
  hetairideia_tt_mod: "Ми отримаємо модифікатор #TOOLTIP:STATIC_MODIFIER,hetairideia_modifier,X #V #L «Гетеридії»#!#!#!."
  apellai_tt: "Апелли — свято, що відзначається в #TOOLTIP:PROVINCE_DEFINITION,aetolia_province,X #L Етолії та Акарнанії#!#!, яке присвячене богові #italic Аполлону#!."
  apellai_tt_mod: "Ми отримаємо модифікатор #TOOLTIP:STATIC_MODIFIER,apellai_modifier,X #V #L «Апелли»#!#!#!."
  halieia_tt: "Гелії — свято, яке відзначають на #TOOLTIP:PROVINCE_DEFINITION,rodos_province,X #L Родосі#!#! та присвячують богові #italic Геліосу#!."
  halieia_tt_mod: "Ми отримаємо модифікатор #TOOLTIP:STATIC_MODIFIER,halieia_modifier,X #V #L «Гелії»#!#!#!."
  heraclean_games_tt: "Гераклейські ігри проводяться в #TOOLTIP:PROVINCE_DEFINITION,lower_macedonia_province,X #L Нижній Македонії#!#!, вони присвячені герою та богу #italic Гераклу#!."
  heraclean_games_tt_mod: "Ми отримаємо модифікатор #TOOLTIP:STATIC_MODIFIER,heraclean_games_modifier,X #V #L «Гераклеї»#!#!#!."
  carneia_tt: "Карнеї — свято, що відзначається в #TOOLTIP:PROVINCE_DEFINITION,messenia_province,X #L Мессенії#!#!, яке присвячене богові #italic Аполлону#!."
  carneia_tt_mod: "Ми отримаємо модифікатор #TOOLTIP:STATIC_MODIFIER,carneia_modifier,X #V #L «Карнеї»#!#!#!."
  panionia_tt: "Паніонії — свято, яке відзначають в #TOOLTIP:PROVINCE_DEFINITION,aydin_province,X #L Айдині#!#! та присвячують богові #TOOLTIP:GOD,poseidon_god,X #L Посейдону#!#!."
  panionia_tt_mod: "Ми отримаємо модифікатор #TOOLTIP:STATIC_MODIFIER,panionia_modifier,X #V #L «Паніонії»#!#!#!."
  hire_advisor_eunuch_chance_tt: "З 50%-ю ймовірністю можна найняти #TOOLTIP:TRAIT,castrated,X #L оскоплену#!#! [Concept('character', 'особу')|e] із [Concept('abilities', 'хистом')|e] в середньому вищим, ніж в інших."
  grant_a_triumph: "Організація тріумфальної ходи"
  grant_a_triumph_desc: "Успіхи слід відзначати. Здібний полководець має бути представлений народу як переможець під час захопливої тріумфальної ходи."
  grant_a_triumph_tt: "За останні 5 років ми здобули перемогу у війні."