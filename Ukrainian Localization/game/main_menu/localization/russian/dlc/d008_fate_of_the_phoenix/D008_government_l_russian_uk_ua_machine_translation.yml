l_russian:
  spread_philhellenism: "Поширення філеллінізму"
  spread_philhellenism_desc: "#TOOLTIP:CULTUREGROUP,greek_group,X #L Еллінські#!#! наука, мистецтво та філософія повинні сформувати наш імідж як всередині країни, так і за кордоном. Вчені, митці та шанувальники #TOOLTIP:CULTURE,$greek_culture_tt$,X #L грецької#!#! культури звідусіль приїжджають до нас. Захоплення, а не сила — ось наш спосіб зміцнити вплив."
  spread_philhellenism_action: "$spread_philhellenism$"
  spread_philhellenism_active: "Політика поширення філеллінізму"
  spread_philhellenism_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')]"
  spread_philhellenism_action_progress_wordier: "[SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')]"
  spread_philhellenism_action_progress_tooltip: "[Concept('research_progress', 'Поступ дослідження')|e]: [SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')] \n\n[Concept('cultural_influence', 'Культурний вплив')|e]: [SCOPE.sCountry('actor').GetModifierValue('cultural_influence_modifier')]"
  spread_philhellenism_action_progress_long_wordier: "@research_progress! [SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')] \n\n@cultural_influence! [SCOPE.sCountry('actor').GetModifierValue('cultural_influence_modifier')]"
  encourage_latin_militarism: "Впровадження латинського військової справи"
  encourage_latin_militarism_desc: "У своїй країні ми будемо дотримуватися #TOOLTIP:LANGUAGE,latin_language,X #L латинської#!#! військової традиції, яка базується на залізній дисципліні, постійних тренуваннях та суворому етикеті. Такий підхід скоротить витрати на військо та сприятиме утворенню класу професійних військових."
  encourage_latin_militarism_action: "Впровадити латинське військова справа"
  encourage_latin_militarism_active: "Впровадження латинського військової справи"
  encourage_latin_militarism_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')]"
  encourage_latin_militarism_action_progress_wordier: "[Concept('army_maintenance', 'Утримання війська')|e]: [SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')]"
  encourage_latin_militarism_action_progress_long_wordier: "@army_maintenance! [SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')] \n\n@army_tradition! [SCOPE.sCountry('actor').GetModifierValue('monthly_army_tradition')]"
  encourage_latin_militarism_action_progress_tooltip: "[Concept('army_maintenance', 'Утримання війська')|e]: [SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')] \n\n[Concept('army_tradition', 'Військові традиції')|e]: [SCOPE.sCountry('actor').GetModifierValue('monthly_army_tradition')]"
  AUTO_MODIFIER_NAME_bureaucracy_nomos_empsychos_high_legitimacy: "$nomos_empsychos_bureaucracy$"
  AUTO_MODIFIER_NAME_bureaucracy_nomos_empsychos_low_legitimacy: "$nomos_empsychos_bureaucracy$"
  cb_restore_roman_borders: "Відновлення римських кордонів"
  cb_restore_roman_borders_desc: "Велика стародавня імперія закликає нас. Скоро фенікс розправить крила та знищить кожного, хто насмілиться завадити нам повернути споконвічні [ShowScriptedGeographyName('roman_borders_geography')|l]."
  roman_borders_geography: "Римські кордони"
  epic_hellenic_history: "Історичні епоси еллінів"
  epic_hellenic_history_desc: "Цей переказ славної давньогрецької історії — шедевр каліграфії на золочених сторінках, символ нашого процвітання та гордості за героїзм наших предків. Крім іншого, хроніка описує спалення Трої, під час якого загинув великий воїн Ахіллес, пригоди легендарного Одіссея, а також подорожі Ясона та його аргонавтів."
  nomos_empsychos_bureaucracy: "Nómos Émpsychos"
  nomos_empsychos_bureaucracy_desc: "Наш імператор — це #italic Nómos Émpsychos#!, або «живий закон». Він уособлює саму суверенну владу, йому підпорядковується весь бюрократичний апарат. Цей принцип, вперше сформульований за Юстиніана, робить імператора центральною фігурою римської держави: єдиним джерелом прав та вищим суддею."
  honorary_titles_bureaucracy: "Почесні титули"
  honorary_titles_bureaucracy_desc: "Весь наш двір, включно з #italic патриціями#!, #italic антипатами#!, #italic магістрами#! та #italic куропалатами#!, цінує не силу, а лояльність та вплив.\n\nРоздаючи почесні звання та обдаровуючи підданих шовками й привілеями, імператор прив’язує до себе полководців, сенаторів та провінційні еліти, винагороджує їх за відданість, примиряє суперників і тим самим перетворює престиж на знаряддя влади."
  court_eunuchs_bureaucracy: "Придворні євнухи"
  court_eunuchs_bureaucracy_desc: "Освічені та вірні придворні євнухи — єдині люди, яким імператор може довіряти, адже вони не мають спадкоємців, а отже не прагнуть возвеличити своє потомство. З них виходять чудові розпорядники палацу та скарбниці, а також хранителі імператорського листування."
  ritualistic_court_bureaucracy: "Придворні ритуали"
  ritualistic_court_bureaucracy_desc: "Церемонії — це демонстрація влади. Завдяки упорядкованому проведенню видовищних ритуалів імператорський двір перетворюється на священний театр. З одного боку, це допомагає підтримувати ієрархію всередині країни, а з іншого — до глибини душі вражає іноземних посланців, які прибули до нашої великої столиці, що вважається центром цивілізованого світу."
  sixty_books_of_the_basilika_bureaucracy: "Василіки"
  HAS_SIXTY_BOOKS_OF_THE_BASILIKA_TRIGGER: "Є «Василіки»"
  THIRD_HAS_SIXTY_BOOKS_OF_THE_BASILIKA_TRIGGER: "Є «Василіки»"
  FATE_OF_THE_PHOENIX_DISASTER_ACTIVE_TRIGGER: "Відбувається [Concept('disaster', 'лихо')|e] «$fate_of_the_phoenix$»"
  THIRD_FATE_OF_THE_PHOENIX_DISASTER_ACTIVE_TRIGGER: "Відбувається [Concept('disaster', 'лихо')|e] «$fate_of_the_phoenix$»"
  sixty_books_basilika_satisfaction_scale_tt: "Штраф до [Concept('estate_satisfaction', 'вдоволення')|e] простолюду залежить від змісту зводу «Василіки». (#R −5%#! за повного змісту і #R −20%#! за відсутності змісту)"
  sixty_books_of_the_basilika_bureaucracy_desc: "Василіки, в основі яких лежить знаменитий труд #italic Corpus Juris Civilis#!, створений за Юстиніана, являють собою вичерпне переосмислення положень римського права #TOOLTIP:LANGUAGE,greek_language,X #L грецькою#!#! мовою. Цей звід уточнених, стандартизованих та осучаснених правових норм закріплює беззаперечність, авторитетність та універсальність імператорського закону."
  romanitas_bureaucracy: "Romanitas"
  romanitas_bureaucracy_desc: "Romanitas — зібрання концепцій та практик, що закріплюють безперервність римської державності. Імператор — це не тільки завойовник та очільник панівного етносу, але також законний спадкоємець влади, права та традицій з більш ніж тисячолітньою історією. Така ідентичність об’єднує країну та віру, представляючи римське правління як символ божественної обраності та моральної переваги."
  imperial_senate_bureaucracy: "Імперський сенат"
  imperial_senate_bureaucracy_desc: "Цей орган складається з високопоставлених сановників, призначених самим імператором, до яких той звертається за порадою та схваленням. Сенат виступає знаряддям легалізації правління, престолонаслідування та ключових актів, підтримує спадкоємність римської влади та зберігає верховенство імператора."
  kephalai_bureaucracy: "Кефали"
  kephalai_bureaucracy_desc: "#italic Кефали#! — звід правил, що регулюють управлінські та судові практики, а також опора для імператорської влади. Вони скасовують старі адміністративно-територіальні одиниці (зокрема #italic катепанати#!), систематизують закони, а також запроваджують уніфіковану систему оподаткування та обов’язкову військову повинність у всіх провінціях."
  won_fate_of_the_phoenix_disaster_tt: "Ми успішно подолали [Concept('disaster', 'лихо')|e] «[ShowDisasterName('fate_of_the_phoenix')]»"
  fop_renaissance_latin_merchants_tt: "We have granted privileges to [ShowCultureGroupName('latin_group')] merchants"
  magister_militum_bureaucracy: "Стратегархія"
  magister_militum_bureaucracy_desc: "#italic Стратегархія#! втілює собою інституційний принцип управління імперським військом. Бюрократичний апарат призначає, замінює та стримує полководців, стежачи за тим, щоб військова машина служила країні, а не особистим амбіціям. Таким чином, війна перетворюється на адміністративне завдання, де ієрархія цінується більше за вірність, а вищі чини дістаються тільки найкращим."
  has_unlocked_bureaucracy_via_flavor_byz_31_tt: "Ми розблокували цю [Concept('bureaucracy', 'установу')|e] під час [Concept('event', 'події')|e] «$flavor_byz.31.title$», яка може статися після #Y 1400#! року"
  themata_bureaucracy: "Феми"
  themata_bureaucracy_desc: "#italic Феми#! — це військово-адміністративні округи, створені в імперії під тиском зовнішніх загроз. Кожним округом керує так званий #italic стратег#! — воєначальник, який формально підпорядковується імперській ієрархії. Він здатен швидко організувати оборону, але при цьому виконує й адміністративні завдання."
  allelengyon_bureaucracy: "Аліленгій"
  allelengyon_bureaucracy_desc: "#italic Аліленгій#! (від #TOOLTIP:LANGUAGE,greek_language,X #L грецького#!#! слова #italic allilengýi#!, «взаємна порука») — податок, який був розроблений ще за імператора Василія II #italic Болгаробійця#! і має на увазі перерозподіл фіскального тягаря. Якщо дрібні поміщики не в змозі сплатити внески, цей обов’язок юридично переходить до заможніших землевласників того ж округу. Така система забезпечує стабільний приплив коштів до скарбниці, запобігає розоренню та поглинанню селянських земель, а також слугує ефективним важелем контролю."
  katepanata: "Катепанати"
  katepanata_desc: "У відповідь на агресію сусідів ми поділили нові землі на військово-адміністративні округи. Катепанати (від грец. #italic katepano#!, «той, хто нагорі», «верховний») — це великі об’єднання кількох фем, створені в X–XI століттях, на чолі яких стоять командири, що мають усю повноту цивільної та військової влади. За імператора Василія II і пізніше такі катепанати, як #TOOLTIP:REGION,italy_region,X #L Італія#!#! зі столицею в #TOOLTIP:LOCATION,bari,X #L Барі#!#! та Вірменія, дозволяли тримати під контролем спірні та віддалені землі. Ці могутні бастіони — символ нашої сили та попередження для тих, хто хоче відібрати в нас владу!"
  has_completed_fate_of_the_phoenix_disaster: "Ми пережили [Concept('disaster', 'лихо')|e] «[ShowDisasterName('fate_of_the_phoenix')]» і вийшли переможцями з усіх випробувань"