l_russian:
  civic_religion_aspect: "Віра та народ"
  civic_religion_aspect_desc: "Пошана до богів — найперший громадянський обов’язок, адже від нашої ревності залежить добробут країни. Щоб наш поліс процвітав, ми повинні дотримуватися релігійних обрядів та церемоній."
  hero_cult_aspect: "Культи героїв"
  hero_cult_aspect_desc: "Великі герої відіграли важливу роль в історії нашого народу. Ми виховані на їхніх подвигах. Вони народжувалися смертними дітьми богів, людьми з неймовірними здібностями, яким нерідко була уготована трагічна доля. Вони захищали наших пращурів і вели їх за собою. Тільки завдяки їм ми досягли такої величі. Наш обов’язок — поклонятися їм і переймати їхню мудрість."
  dionysian_mysteries_aspect: "Діонісійські містерії"
  dionysian_mysteries_aspect_desc: "Ритуали, музика й танці розкріпачують тих, хто присвячений у містерії Діоніса, і стирають соціальні межі між ними. Виноградна лоза виростає з посадженої в землю кісточки, а потім її плоди перетворюються на вино, яке випивають під час святкування — усе це символізує смерть і відродження Діоніса."
  eleusinian_mysteries_aspect: "Елевсінські містерії"
  eleusinian_mysteries_aspect_desc: "Елевсинські містерії — обряд ініціації за мотивами міфу про Деметру та її дочку Персефону, яку викрав бог підземного світу Аїд. Пізніше за наказом Зевса Аїд повернув Персефону у верхній світ, але третину року вона мала проводити з ним. Для посвячених це історія про вічність життя, циклічність буття та безсмертя душі."
  samothracian_mysteries_aspect: "Самофракійські містерії"
  samothracian_mysteries_aspect_desc: "У період розквіту еллінізму на острові Самофракія існував таємничий культ, куди приймали всіх охочих, незалежно від соціального становища. Кажуть, його послідовниками були багато легендарних героїв, зокрема Геракл, Ясон та Орфей. Ми можемо відновити ці містерії з фрагментів, що залишилися, і повернути культу колишню велич."
  olympiad_aspect: "Олімпійські ігри"
  olympiad_aspect_desc: "Олімпійські ігри — це свято на славу богів, а також демонстрація сили та єдності нашої країни. Учасники ігор виконують громадянський обов’язок та отримують можливість заслужити визнання."
  mithraic_mysteries_aspect: "Містерії Мітри"
  mithraic_mysteries_aspect_desc: "Цей культ, послідовники якого називають себе синдексіями, був надзвичайно популярний у Римі та Західній Римській імперії за часів розквіту римської державності. Обряди, зібрання та бенкети цього культу відбувалися в таємних підземних храмах, але ми можемо наново відкрити та відродити ці традиції заради блага нашого народу."
  imperial_cult_aspect: "Культ імператора"
  imperial_cult_aspect_desc: "Народ і сенат Риму шанував давніх володарів як богів, то чому не перенести це ставлення на нашого правителя та його родину? Велич, могутність і вплив цих людей ясно вказують на те, що вони не тільки виконують вищу волю, а й самі є божествами."
  dii_familiares_aspect: "Dii Familiares"
  dii_familiares_aspect_desc: "Домашні та сімейні божества відіграють важливу роль у житті наших співвітчизників. Ці божества оберігають володіння людини, куди зазвичай входить дім і господарство, але також можуть охороняти дороги, сусідні терени й навіть цілі міста, впливаючи на все, що там відбувається."
  mos_maiorum_aspect: "Mos Maiorum"
  mos_maiorum_aspect_desc: "«Звичай пращурів» — це збірка неписаних норм, звичаїв та установок, які регулюють життя римлян починаючи з Античності й закінчуючи періодом розквіту імперії. У Mos Maiorum описується, як римлянин має поводитися вдома та в суспільстві."
  monism_aspect: "Монізм"
  monism_aspect_desc: "Філософи нашого відродження стверджують, що все у всесвіті сходить до Єдиного — трансцендентного Начала, з якого походять усі боги та все суще. Звичаєвий пантеон стає алегорією: всі боги є аспектами Єдиного Начала. Знамення втрачають свою особливу силу, але віра в Єдине стає керівним принципом для будь-якого управлінського рішення."
  the_thunderer_omen: "Громовержець"
  the_thunderer_omen_desc: "Небеса гніваються. Удари грому стрясають повітря та землю. Блискавки виблискують не перестаючи. Ми розтрощимо кожного, хто виступить проти нас."
  supreme_of_gods_omen: "Верховний бог"
  supreme_of_gods_omen_desc: "Яскраве сонце в вишині — вірна ознака того, що нам благоволить наймогутніший з богів. Ніщо не загрожує нашій величі!"
  monarch_of_the_sky_omen: "Володар небес"
  monarch_of_the_sky_omen_desc: "Птахи, вісники #TOOLTIP:GOD,zeus_god,X #L Зевса#!#!, злітають вгору з волі свого господаря."
  omnipotence_of_heaven_omen: "Велич небес"
  omnipotence_of_heaven_omen_desc: "#TOOLTIP:GOD,zeus_god,X #L Зевс#!#! дивиться на нас з висоти, і ми відчуваємо його могутність. Для нього немає нічого неможливого."
  the_liberator_omen: "Визволитель"
  the_liberator_omen_desc: "#TOOLTIP:GOD,zeus_god,X #L Зевс#!#! допоміг нашим пращурам протистояти експансії персів. Він визволить нас від кайданів."
  the_bountiful_one_omen: "Щедрий дарувальник"
  the_bountiful_one_omen_desc: "Кожен, хто зверне свій погляд на #TOOLTIP:GOD,zeus_god,X #L Зевса#!#!, розділить його могутність і отримає в дар достаток."
  the_holy_omen: "Найвеличніший з усіх"
  the_holy_omen_desc: "Що може бути прекрасніше, ніж насолоджуватися присутністю найвеличнішого божества і користуватися його прихильністю?"
  king_of_all_omen: "Володар світу"
  king_of_all_omen_desc: "#TOOLTIP:GOD,zeus_god,X #L Зевс#!#! повеліває богами, як правитель повеліває народом."
  immortal_omen: "Безсмертя"
  immortal_omen_desc: "Боги безсмертні, а наші війська непереможні під покровительством #TOOLTIP:GOD,zeus_god,X #L Зевса#!#!."
  splendor_omen: "Лазурове небо"
  splendor_omen_desc: "Ясне небо — символ незаперечної влади #TOOLTIP:GOD,zeus_god,X #L Зевса#!#!. Його покровительство обіцяє нам світову славу."
  mother_of_love_omen: "Мати любови"
  mother_of_love_omen_desc: "#TOOLTIP:GOD,aphrodite_god,X #L Афродіта#!#! зігріває наш народ життєдайними променями любови."
  the_foam_born_omen: "Народжена з піни"
  the_foam_born_omen_desc: "Морська піна, з якої народилася #TOOLTIP:GOD,aphrodite_god,X #L Афродіта#!#!, омиває рідні береги. Богиня любови проведе наші кораблі крізь будь-які бурі."
  the_seductress_omen: "Спокусниця"
  the_seductress_omen_desc: "Любов і зваблення — вотчина #TOOLTIP:GOD,aphrodite_god,X #L Афродіти#!#!. Її благословення допоможе нам набрати прихильників."
  giver_of_joy_omen: "Вісниця радости"
  giver_of_joy_omen_desc: "Що може бути чудесніше, ніж насолоджуватися присутністю богині краси і користуватися її прихильністю?"
  nurturer_of_children_omen: "Мати всіх дітей"
  nurturer_of_children_omen_desc: "Що може бути священніше любови до дітей? В її материнському серці знайшлося місце для кожного з нас."
  the_beautiful_omen: "Зразок краси"
  the_beautiful_omen_desc: "У #TOOLTIP:GOD,aphrodite_god,X #L Афродіти#!#! багато шанувальників. Вони з’являться і в нас, якщо ми заслужимо прихильність найпрекраснішої з богинь."
  the_secretive_omen: "Хранителька таємниць"
  the_secretive_omen_desc: "Не всяку любов варто показувати. Коли це необхідно, богиня діє обережно та непомітно."
  the_harmonizer_omen: "Охоронниця гармонії"
  the_harmonizer_omen_desc: "#TOOLTIP:GOD,aphrodite_god,X #L Афродіта#!#! любить усіх однаково, і нам варто так само ставитися до свого народу."
  the_lover_of_laughter_omen: "Покровителька веселощів"
  the_lover_of_laughter_omen_desc: "Нам варто частіше усміхатися, адже на вустах #TOOLTIP:GOD,aphrodite_god,X #L Афродіти#!#! завжди грає усмішка."
  the_desired_omen: "Жадана"
  the_desired_omen_desc: "Краса #TOOLTIP:GOD,aphrodite_god,X #L Афродіти#!#! нікого не залишає байдужим. Завоювавши її прихильність, ми отримаємо в дар її чарівність."
  tempest_omen: "Буря"
  tempest_omen_desc: "Море темніє від гніву, реве та бушує. Лютий вітер підіймає величезні хвилі. У таку погоду серця навіть найхоробріших моряків тремтять від страху."
  lord_of_the_sea_omen: "Володар морів"
  lord_of_the_sea_omen_desc: "Той, хто володіє морем, володіє світом."
  protector_of_horses_omen: "Захисник коней"
  protector_of_horses_omen_desc: "Якщо ми заслужимо прихильність покровителя всіх коней, наші скакуни будуть сильними та здоровими."
  wielder_of_the_trident_omen: "Караючий тризуб"
  wielder_of_the_trident_omen_desc: "Що може бути смертоноснішим за легендарну зброю морського бога, що має одразу три вістря?"
  earth_shaker_omen: "Володар землетрусів"
  earth_shaker_omen_desc: "Нехай наша земля ходить ходуном під ногами ворогів, наче по ній вдарив бог, бажаючи створити джерело."
  leader_of_the_nymphs_omen: "Провідник німф"
  leader_of_the_nymphs_omen_desc: "Якщо #TOOLTIP:GOD,poseidon_god,X #L Посейдон#!#! буде до нас прихильний, його німфи благословлять усі наші джерела води."
  the_watcher_omen: "Всевидячий"
  the_watcher_omen_desc: "Погляд #TOOLTIP:GOD,poseidon_god,X #L Посейдона#!#! простягається над усіма морями, річками та озерами. Ніщо не вислизне з-під його уваги."
  the_graceful_omen: "Величний"
  the_graceful_omen_desc: "У хвилюючому морі прихована велика краса, і його споглядання наповнює серце відрадою."
  master_of_the_waves_omen: "Володар хвиль"
  master_of_the_waves_omen_desc: "Не можна вирушати в море без дозволу #TOOLTIP:GOD,poseidon_god,X #L Посейдона#!#!."
  dark_blue_haired_omen: "Синьоволосий бог"
  dark_blue_haired_omen_desc: "Сині хвилі — це волосся морського бога. Якщо він прихильний до нас, наші кораблі легко й стрімко ковзатимуть по воді."
  messenger_omen: "Вісник богів"
  messenger_omen_desc: "Бог у крилатих сандаліях швидко доносить вісті й ніколи не губиться в дорозі."
  golden_wand_omen: "Володар золотого жезла"
  golden_wand_omen_desc: "Кадуцей розділив двох змій, але те, що розділяє, водночас слугує і для об’єднання."
  god_of_travelers_omen: "Покровитель подорожніх"
  god_of_travelers_omen_desc: "Усі подорожні та мандрівні купці звертаються до #TOOLTIP:GOD,hermes_god,X #L Гермеса#!#! за захистом і підтримкою."
  protector_of_merchants_omen: "Захисник купців"
  protector_of_merchants_omen_desc: "Під пильним наглядом #TOOLTIP:GOD,hermes_god,X #L Гермеса#!#! купці благополучно проходять нашими землями й отримують гарну виручку."
  wing_footed_omen: "Швидконогий"
  wing_footed_omen_desc: "Війська, що заслужили прихильність #TOOLTIP:GOD,hermes_god,X #L Гермеса#!#!, пересуваються так само стрімко, як і він сам."
  trickster_omen: "Шахрай"
  trickster_omen_desc: "Мінливі вітри нагадують нам, що навіть #TOOLTIP:GOD,hermes_god,X #L Гермес#!#! має примхливу вдачу, а непостійність і обман супроводжують усе наше життя."
  patron_of_thieves_omen: "Повелитель злодіїв"
  patron_of_thieves_omen_desc: "Швидкість можна використовувати і на благо, і на шкоду. Так чи інакше, вона дає завидну перевагу."
  president_of_games_omen: "Покровитель спорту"
  president_of_games_omen_desc: "Прихильність #TOOLTIP:GOD,hermes_god,X #L Гермеса#!#! поширюється на спортивні ігри, які дарують нам здоров’я та веселощі."
  guardian_of_the_gates_omen: "Страж воріт"
  guardian_of_the_gates_omen_desc: "Усі дороги рано чи пізно приводять подорожніх до воріт, які або відчинені для них, або замкнені."
  giver_of_wealth_omen: "Дарувальник багатства"
  giver_of_wealth_omen_desc: "За сприяння #TOOLTIP:GOD,hermes_god,X #L Гермеса#!#! торгівля передбачає не лише рух товарів, а й рух багатств."
  throng_of_battle_omen: "Побоїще"
  throng_of_battle_omen_desc: "Війна — осьчина жорстокого #TOOLTIP:GOD,ares_god,X #L Ареса#!#!. Лише він вирішує, яким буде її результат."
  insatiable_at_war_omen: "Ненаситна жага"
  insatiable_at_war_omen_desc: "#TOOLTIP:GOD,ares_god,X #L Арес#!#! насолоджується битвою. Особливо до вподоби йому криваві та довгі бої."
  slayer_of_men_omen: "Убивця вояків"
  slayer_of_men_omen_desc: "Лють #TOOLTIP:GOD,ares_god,X #L Ареса#!#! передасться нашим воякам, а з нею — і його могутність."
  plague_of_mankind_omen: "Винищувач роду людського"
  plague_of_mankind_omen_desc: "Зустріч із богом війни завжди закінчується смертю."
  warrior_omen: "Воїн"
  warrior_omen_desc: "Бог війни прагне славної битви, а не лише кривавої бійні."
  audacious_omen: "Покровитель сміливих"
  audacious_omen_desc: "Стрімка атака та знищення ворогів — вірний спосіб здобути прихильність #TOOLTIP:GOD,ares_god,X #L Ареса#!#!."
  blood_soaked_omen: "Ріки крові"
  blood_soaked_omen_desc: "Бог страждає від спраги, і ми напоїмо його кров’ю своїх ворогів."
  malignant_omen: "Злокозний"
  malignant_omen_desc: "Убивство ворогів — наша головна мета, а для її досягнення всі засоби добрі."
  indestructible_omen: "Несокрушимий"
  indestructible_omen_desc: "У #TOOLTIP:GOD,ares_god,X #L Ареса#!#! є не тільки спис, яким він вражає ворогів, а й щит, що прикриває його від ударів."
  fickle_lord_of_war_omen: "Мінлива вдача"
  fickle_lord_of_war_omen_desc: "Хід битви може змінитися будь-якої миті, тому покровительство #TOOLTIP:GOD,ares_god,X #L Ареса#!#! — запорука нашої перемоги."
  unseen_hand_omen: "Невидима десниця"
  unseen_hand_omen_desc: "У кожної невдачі є причина. Небеса підштовхують командирів до невірних рішень. Вони заманюють дозорних у засідки, перерізають лінії постачання та водять за носа капітанів."
  unwavering_omen: "Непохитна"
  unwavering_omen_desc: "#TOOLTIP:GOD,athena_god,X #L Афіна#!#! стоїть прямо й непохитно, і ми повинні наслідувати її приклад."
  she_who_fights_in_front_omen: "Завжди попереду"
  she_who_fights_in_front_omen_desc: "Стрімка атака — найкращий спосіб розгромити вороже військо."
  the_industrious_omen: "Завзяття"
  the_industrious_omen_desc: "Старанність і відданість своїй справі — запорука успіху в будь-яких починаннях."
  the_judge_omen: "Суддя"
  the_judge_omen_desc: "Жоден злочинець не вислизне від караючої длані #TOOLTIP:GOD,athena_god,X #L Афіни#!#!, і жоден невинний не постраждає даремно."
  the_chieftain_of_war_omen: "Вождь"
  the_chieftain_of_war_omen_desc: "Вояки без командира подібні до мурах, що втратили мурашник. Вони приречені на загибель."
  teacher_of_the_waves_omen: "Приборкувачка хвиль"
  teacher_of_the_waves_omen_desc: "#TOOLTIP:GOD,poseidon_god,X #L Посейдон#!#! повеліває хвилями, а #TOOLTIP:GOD,athena_god,X #L Афіна#!#! покровительствує кораблебудуванню та мореплавству."
  protector_of_the_anchorage_omen: "Захисниця кораблів"
  protector_of_the_anchorage_omen_desc: "#TOOLTIP:GOD,athena_god,X #L Афіна#!#! — вправний корабел. Кораблям під її захистом ніщо не загрожує."
  the_bright_eyed_omen: "Прониклива"
  the_bright_eyed_omen_desc: "Наш символ — мудра сова. Він пов’язує нас з #TOOLTIP:GOD,athena_god,X #L Афіною#!#! і дарує її прихильність."
  the_armed_one_omen: "Народжена для битви"
  the_armed_one_omen_desc: "#TOOLTIP:GOD,athena_god,X #L Афіна#!#! народилася в повному бойовому обладунку. Ця історія вчить нас того, що ми завжди повинні бути готові до битви."
  hellenism_religion.1.title: "[target_god.GetNameWithNoTooltip] усміхається нам"
  hellenism_religion.1.desc: "У ці спокійні дні боги продовжують наглядати за нами. Доказом цьому слугують дивні збіги, раптові повороти долі та зміна порядку, яким живе [ROOT.GetCountry.GetGovernment.GetCourtTitle|l].\n\nЖерці заявляють, що наші улюблені [ROOT.GetCountry.GetFlavorRank|l] та [target_character.GetNameWithNoTooltip] благословенні, [target_god.GetName] усміхається їм. І справді, нам, схоже, супроводжує удача, і принесені жертви нарешті дали свої плоди!"
  hellenism_religion.1.a: "Ми приймаємо це благословення."
  fertile_ruler_and_family_tt: "[target_character.GetName] та [Concept('consort', 'консорт')|e] стануть [Concept('fertility', 'фертильнішими')|e]"
  hellenism_religion.2.title: "[target_character.GetNameWithNoTooltip], яструб війни"
  hellenism_religion.2.desc: "[target_character.GetName] володіє блискучою тактичною майстерністю та продовжує славні воєнні традиції, закладені засновниками [ROOT.GetCountry.Custom('rank_ua_GEN')|l]. Мало хто може зрівнятися з Одіссеєм, Ясоном чи Аяксом у сміливості, завзятті та винахідливості.\n\n[target_character.GetShortNameWithNoTooltip] — гордий символ нашої прихильності #TOOLTIP:RELIGION,$hellenism_religion_tt$,X #L елліністським#!#! кореням, справжній яструб, що кружляє над полем бою!"
  hellenism_religion.2.a: "[Select_CString(target_character.IsFemale, 'Вона', 'Він')] так і залишиться в тіні?"
  hellenism_religion.2.b: "Нехай [Select_CString(target_character.IsFemale, 'вона', 'він')] викладає в академії!"
  hellenism_religion.3.title: "[target_location.GetNameWithNoTooltip] та меценат-філософ"
  hellenism_religion.3.desc: "Звідки взялася людська душа? Що нас чекає після смерті? Чи жилося б нам краще, якби ми назвалися безпір’яними двоногими? Цими животрепетними питаннями зайняті великі уми інтелектуалів та філософів з #TOOLTIP:BUILDING_TYPE,university,X #L університету#!#! [target_location.Custom('LR_GEN')|l] [target_location.GetName].\n\nНещодавно у факультету з’явився багатий місцевий покровитель, який виступає за збільшення фінансування, вважаючи, що це сприятиме поширенню сміливих та сучасних ідей."
  hellenism_religion.3.a: "Головне, щоб вони не виростили чергового Діогена..."
  hellenism_religion.3.b: "А чи не можна забезпечити фінансування умоглядно?"
  hellenism_religion.4.title: "[target_character_2.GetNameWithNoTooltip] та [Select_CString(target_character_2.IsFemale, 'її', 'його')] талісман"
  hellenism_religion.4.desc: "Дні й ночі безперервно наші недруги плетуть інтриги та мріють про нашу загибель. Однак поки [target_character_2.GetName] [Select_CString(target_character_2.IsFemale, 'жива', 'живий')], нашій владі ніщо не загрожує. Майбутнє [ROOT.GetCountry.Custom('rank_ua_GEN')|l] тепер у ніжних дитячих руках.\n\n[target_character_2.GetShortNameWithNoTooltip] — [Select_CString(target_character_2.IsFemale, 'улюблениця', 'улюбленець')] богів Олімпу. Ми впевнені, що [Select_CString(target_character_2.IsFemale, 'на неї', 'на нього')] чекають великі справи та звершення. [Select_CString(target_character_3.IsFemale, 'Одна', 'Один')] з наших придворних, містик [target_character_3.GetName], [Select_CString(target_character_3.IsFemale, 'запропонувала', 'запропонував')] віддати свій талісман. Кажуть, у цьому предметі міститься крупиця божественної сутності, що відганяє зло. З ним [target_character_2.GetShortNameWithNoTooltip] буде в безпеці до свого повноліття."
  hellenism_religion.4.a: "[target_character_3.GetShortNameWithNoTooltip] — [Select_CString(target_character_3.IsFemale, 'наша рятівниця', 'наш рятівник')]. [target_character_2.GetShortNameWithNoTooltip] передає [Select_CString(target_character_3.IsFemale, 'їй', 'йому')] подяку."
  hellenism_religion.4.b: "Що за дурні забобони?"
  talisman_tt: "[target_character_2.GetName] отримує талісман, який #italic може#! захистити [Select_CString(target_character_2.IsFemale, 'її', 'його')] під час [Concept('events', 'подій')|e], пов’язаних із хворобами, та запобігти нещасним випадкам на полюванні"
  target_character_3_is_declined_tt: "Ми ввічливо відхилили пропозицію, яку [Select_CString(target_character_3.IsFemale, 'зробила', 'зробив')] [target_character_3.GetName]"
  hellenism_religion.5.title: "[target_god.GetNameWithNoTooltip] благословляє провінцію [target_province.GetNameWithNoTooltip]"
  hellenism_religion.5.desc: "Провінція [target_province.GetName] тішить чудовими новинами. [target_god.GetName] благословляє місцевих жителів, ті в пориві благочестя виходять на вулицю та влаштовують масштабні святкування, щоб відзначити таку неймовірну удачу.\n\nСьогодні навіть тягар правління здається не таким важким. Натовп шумить, вихваляючи богів, і насичується відданістю, як боги Олімпу — амброзією."
  hellenism_religion.5.a: "Нехай народ святкує!"
  every_pop_in_target_province_gains_10_satisfaction_tt: "Наші [Concept('pops', 'групи населення')|e] у провінції [target_province.GetName] отримають [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  hellenism_religion.6.title: "Доба благоденства"
  hellenism_religion.6.desc: "Воістину [target_character.GetName] [Select_CString(target_character.IsFemale, 'була послана', 'був посланий')] нам богами. Вони направляють [Select_CString(target_character.IsFemale, 'її', 'його')] сили в вірне русло. Розумна політика, зростання достатку, стабільність і мир — ось лише деякі з великих дарів олімпійців. Наша країна переживає золотий вік, а [target_character.GetShortNameWithNoTooltip] вже [Select_CString(target_character.IsFemale, 'стала героїнею', 'став героєм')] нарівні з Гераклом і Періклом, [Select_CString(target_character.IsFemale, 'яку', 'якого')] оспівають у легендах та гімнах."
  hellenism_religion.6.a: "Займемося адміністративними питаннями!"
  hellenism_religion.6.b: "Дипломатія — наше першочергове завдання."
  hellenism_religion.6.c: "Здолаємо ворогів!"
  hellenism_religion.7.title: "Втілення Ареса"
  hellenism_religion.7.desc: "[target_character.GetName] з дитинства [Select_CString(target_character.IsFemale, 'виявляла', 'виявляв')] здібності до військової справи. Згодом вогонь, сірка, кров і передсмертні крики стали [Select_CString(target_character.IsFemale, 'її', 'його')] невід’ємними супутниками. [Select_CString(target_character.IsFemale, 'Її', 'Його')] нещадність до ворогів викликає благоговійний жах.\n\nВояки бачать у [Select_CString(target_character.IsFemale, 'ній', 'ньому')] втілення жорстокого бога #TOOLTIP:GOD,ares_god,X #L Ареса#!#!. [Select_CString(target_character.IsFemale, 'Її', 'Його')] доля і обов’язок — сіяти хаос в ім’я [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  hellenism_religion.7.a: "[Select_CString(target_character.IsFemale, 'Вона', 'Він')] знає, що перемога любить відчайдушних."
  hellenism_religion.7.b: "Ця сила згубна. Ми не можемо так ризикувати..."
  hellenism_religion.8.title: "Грецькі історичні епоси"
  hellenism_religion.8.desc: "Епоси Гомера — збережені шедеври грецької літературної традиції, які колись заклали фундамент для розвитку нашої культури та писемності.\n\n[target_character.GetName] пропонує виділити фінансування на публікацію праць та досліджень, присвячених «Іліаді» та «Одіссеї». [Select_CString(target_character.IsFemale, 'Вона', 'Він')] вважає, що це чудова нагода віддати належне нашому славному минулому, а заодно уважніше вивчити легендарні твори."
  hellenism_religion.8.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
  hellenism_religion.8.b: "$jurchen_confederation_events.3.b$"
  hellenism_religion.9.title: "Провінція [target_province.GetNameWithNoTooltip] процвітає"
  hellenism_religion.9.desc: "Цілком очевидно, що провінція [target_province.GetName] користується прихильністю богів, інакше як ще пояснити повсюдне зростання добробуту? Нещодавно гірники та місцеві забудовники виступили з пропозицією вивезти багатства з сіл і зосередити їх у міських центрах провінції. Цей крок може прискорити процес урбанізації, але позбавить місцевих жителів додаткових благ."
  hellenism_religion.9.a: "Усі блага народу!"
  hellenism_religion.9.b: "Зосередимо багатства в осередках."
  pops_in_aforementioned_provinces_weak_satisfaction_tt: "[Concept('pops', 'Населення')|e] вищезгаданих [Concept('provinces', 'провінцій')|e] отримає [ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%] до [Concept('pop_satisfaction', 'вдоволення')|e]"
  hellenism_religion.10.title: "[ROOT.GetCountry.Custom('GetDemeterMomName')] прихильна до нас"
  hellenism_religion.10.desc: "Комори на ринку #L #TOOLTIP:LOCATIONRANK,[target_market.GetCenterLocation.Custom('LR_tt')],X [target_market.GetCenterLocation.Custom('LR_GEN')|l]#!#! [target_market.GetShortName] вже давно повні збіжжям. Це вірна ознака того, що богиня врожаю [ROOT.GetCountry.Custom('GetDemeterMomName')] прихильна до нас, і наше новонабуте благополуччя — останнє тому підтвердження. Місцеві жителі просять розподілити надлишок харчів, а жерці — покласти його на вівтар богів на знак нашої найглибшої вдячності."
  hellenism_religion.10.a: "Віддамо надлишки народу."
  hellenism_religion.10.b: "Пожертвуємо надлишки богам."
  Demeter_latin_name: "Церера"
  Demeter_base_name: "Деметра"
  hellenism_religion.11.title: "[target_god.GetNameWithNoTooltip] у гніві"
  hellenism_religion.11.desc: "Здається, [target_god.GetName] гнівається на нас! Нічні знамення та густі навислі тіні — явні передвісники біди. Відчуття приреченості охопило наш народ. Ми не знаємо, в чому завинили, чим прогнівили таке могутнє божество. Нам залишається лише схилити голови в пошані та смиренно чекати, коли буря вщухне."
  hellenism_religion.11.a: "Таке життя."
  hellenism_religion.11.b: "Негайно віддамо всі належні почесті."
  hellenism_religion.12.title: "Народження чудовиська"
  hellenism_religion.12.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] перебуває в смутку. Після довгих безсонних ночей і гарячих молитов у дитячих покоях [ROOT.GetCountry.GetGovernment.GetAdjective|l]ої резиденції [Select_CString(target_character_2.IsFemale, 'з’явилася', 'з’явився')] на світ [target_character_2.GetShortName] — [Select_CString(target_character_2.IsFemale, 'вісниця', 'вісник')] нещасть. [target_character_1.GetName] поза собою від горя.\n\n[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] вважа[ROOT.GetCountry.Custom('clergy_vlaloly')] [Select_CString(target_character_2.IsFemale, 'її', 'його')] народження поганим знаменням, слуги — прокляттям, а вороги — ознакою слабкості. [target_character_2.GetShortName] поки ще дихає. Хто знає, може, [Select_CString(target_character_2.IsFemale, 'їй', 'йому')] судилося змінити світ?"
  hellenism_religion.12.a: "Дурні! [target_character_2.GetShortNameWithNoTooltip] — всього лише дитина!"
  hellenism_religion.12.b: "Не вистачало ще розгнівати богів."
  hellenism_religion.13.title: "Хабарництво серед жерців"
  hellenism_religion.13.desc: "Боги — вічні створіння, але їхні слуги — всього лише люди. До нас дійшли чутки, що [target_character.GetName] зловживає своїм становищем і забирає собі храмові підношення.\n\nЯкщо ми втрутимося в ситуацію, [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] вважатим[ROOT.GetCountry.Custom('clergy_eut')] це образою і здійм[ROOT.GetCountry.Custom('clergy_eut')] галас. Якщо ж ми залишимо її без уваги, то дамо відмашку до дії всім інтриганам [ROOT.GetCountry.Custom('rank_ua_GEN')|l]. Благочестя перетвориться на ширму, що прикриває крадіжки та підлість, а образа богів стане звичною справою."
  hellenism_religion.13.a: "[Select_CString(target_character.IsFemale, 'Її', 'Його')] жадібність нас погубить!"
  hellenism_religion.13.b: "Зробимо вигляд, що нічого не помітили."
  hellenism_religion.14.title: "[target_province.GetNameWithNoTooltip] і [target_god.GetNameWithNoTooltip] не в ладах"
  hellenism_religion.14.desc: "З провінції [target_province.GetName] приходять тривожні вісті. [target_god.GetNameWithNoTooltip] там більше не в пошані, підношення здійснюються через раз, і віряни скаржаться, що ворота храмів все частіше виявляються замкнені.\n\nНе так важливо, що служить тому причиною: лінощі, бідність чи тихий протест. Коли божество ігнорується, будь-яке нещастя сприймають як вираз вищого гніву. Жерці вимагають втрутитися, і провінція [target_province.GetNameWithNoTooltip] очікує нашого вердикту."
  hellenism_religion.14.a: "Змусимо людей поклонятися силою."
  hellenism_religion.14.b: "Ми не станемо нікого примушувати."
  pops_in_target_province_mild_pop_satisfaction_malus_tt: "Наші [Concept('pops', 'групи населення')|e] у провінції [target_province.GetName] отримають [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] до [Concept('pop_satisfaction', 'вдоволення')|e]"
  riots_destroy_temple_desc: "Гнів натовпу обрушується на храм. До світанку від нього залишається лише купа обвугленого каміння."
  riots_cause_minimal_damage_desc: "На вулицях гамірно та неспокійно, але найгіршого вдалося уникнути."
  hellenism_religion.15.title: "Суперечливі пророцтва"
  hellenism_religion.15.desc: "О #TOOLTIP:GOD,zeus_god,X #L Зевсова#!#! борода! Здається, ці провісники готові глотки один одному перегризти! Ми почули два тлумачення одних і тих же знаків і дві абсолютно різні поради, виголошені з однаковою впевненістю.\n\nТепер [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] стоїть перед вибором. Що подумають люди, спостерігаючи за тим, як запекло спереча[ROOT.GetCountry.Custom('clergy_yetsayutsa')] наш[ROOT.GetCountry.Custom('clergy_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l]? Невже ми збилися зі шляху? Що насправді означають ці знаки, вже не так важливо. Наслідки нас все одно наздоженуть..."
  hellenism_religion.15.a: "Як же набридло це старече буркотіння!"
  hellenism_religion.16.title: "Гнів богів"
  hellenism_religion.16.desc: "У наших залах панує розлад. Жерці наполягають: це вищі сили спостерігають за нами. Вони кажуть, що наші землі роз’єднані, що наша влада над далекими територіями ослабла, і пошепки додають: «Це кара від богів за гординю».\n\nЯкщо божества захочуть нагадати нам про нашу крихкість, вони пошлють нам не ввічливого листа, а урагани, пожежі та катастрофи, та ще й оберуть найуразливіші місця."
  hellenism_religion.16.a: "Сподіваємося, буря швидко вщухне."
  hellenism_religion.17.title: "Скринька Пандори"
  hellenism_religion.17.desc: "Провінція [target_province.GetName] пожвавлюється: місцеві передають один одному якусь диковинку, обмінюючись багатозначними посмішками та укладаючи безглузді парі. Хтось вважає цю дрібничку нешкідливою, а хтось наполягає, що вона таїть зловісну силу, яка спокушає роззяв і карає гордіїв.\n\nНе так важливо, чи справді дрібниця проклята, чи ж це просто чутка, пущена з метою посіяти паніку: якщо люди вірять, що станеться нещастя, воно обов’язково станеться. Деякі жерці навіть запевняють, ніби бачили на кришці зображення дивного обличчя, спотвореного муками та залитого криваво-червоною фарбою."
  hellenism_religion.17.a: "Нам байдуже до забобонів."
  hellenism_religion.17.b: "Ми заплатимо, щоб скриньку забили наглухо."
  locations_and_pops_in_target_province_suffer_minimal_damage_tt: "[target_province.GetName] та місцеві жителі уникнуть покарання згори"
  hellenism_religion.18.title: "Найтемніша ніч"
  hellenism_religion.18.desc: "Темрява все ніяк не розсіється. У кожному куточку [ROOT.GetCountry.Custom('rank_ua_GEN')|l] люди говорять про розруху, голод, поразку, про те, що боги Олімпу відвернулися від нас. Може, воно й так, а може, ми десь помилилися. Ясно одне: настали смутні часи.\n\n[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] не може ігнорувати ці настрої. Коли основи хитаються, навіть найстійкіша влада починає хитатися."
  hellenism_religion.18.a: "Ми впали в безпросвітний розпач."
  hellenism_religion.18.b: "Принесемо жертву. Може, боги нас почують."
  hellenism_religion.19.title: "Страх і голод"
  hellenism_religion.19.desc: "Страх поширюється швидше за будь-яку хворобу. Варто статися неврожаю чи іншій біді — і кожен починає вдавати з себе пророка, що віщує нещастя. Наші спроби заспокоїти місцевих жителів не увінчалися успіхом: їм всюди ввижаються недобрі знаки. Паніка накрила цілі громади.\n\nЖерці кажуть, що зі страхом потрібно боротися, інакше він переросте в непокору. Жителі провінції [target_province.GetName] потребують підбадьорення. Вони дивляться на нас з надією."
  hellenism_religion.19.a: "Якось впораються самі."
  hellenism_religion.19.b: "Зробимо підношення, щоб пом’якшити удар."
  sacrifice_to_the_gods: "Задобрювання богів"
  hellenism_religion.20.title: "Боги не схвалюють війну"
  hellenism_religion.20.desc: "Не всі боги радіють кровопролиттю. [target_war.GetName] все ще в розпалі, і жерці попереджають, що ми втратили підтримку небес. #TOOLTIP:GOD,ares_god,X #L Арес#!#! торжествує, однак інші не поділяють його ентузіазму. Боги можуть не підтримати навіть найправеднішу кампанію.\n\nВояки рвуться в бій, але народ втомився і сприймає всі труднощі як прояви невдоволення богів. У такі часи навіть перемога не приносить ні радості, ні вдоволення..."
  hellenism_religion.20.a: "Ми впораємося і без підтримки богів."
  hellenism_religion.21.title: "[target_location.GetNameWithNoTooltip] і нестача завзяття"
  hellenism_religion.21.desc: "У період спокою та процвітання смертні часто забувають про свої обов’язки перед богами. У [target_location.Custom('LR_PREP')|l] [target_location.GetName] обряди перетворилися на рутину. Процесії зменшилися, підношення збідніли, а старі гімни більше не зворушують серця людей.\n\nЖерці вимагають, щоб ми влаштували покарання, яке послужить усім прикладом. Якщо містяни не хочуть по-доброму, тоді ми візьмемо в руки батіг. У будь-якому разі наша віра не повинна вичерпатися."
  hellenism_religion.21.a: "Настав час провчити простолюд."
  hellenism_religion.21.b: "Схоже, знать надто розслабилася."
  hellenism_religion.21.c: "Пустимо ситуацію на самоплив."
  pops_go_unpunished_gods_angry_tt: "Боги вимагають покарання і розгніваються, якщо його не буде"
  hellenism_religion.22.title: "Орнітомантія в столиці"
  hellenism_religion.22.desc: "[target_character.GetName] — найобговорюваніша людина в столиці. Кажуть, [Select_CString(target_character.IsFemale, 'ця жінка', 'цей чоловік')] в екстравагантному вбранні має винятковий дар передбачення. [Select_CString(target_character.IsFemale, 'Сама вона', 'Сам він')] з непохитною впевненістю заявляє, що може — на добро чи на лихо — читати волю богів по птахах та їхніх кістках.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] розділяється: деякі посміюються, а деякі потайки несуть [Select_CString(target_character.IsFemale, 'віщунці', 'віщуну')] гроші, щоб подивитися на дивне видовище, і намагаються отримати користь навіть із найбезглуздіших трактувань."
  hellenism_religion.22.a: "Лети звідси, [target_character.GetShortNameWithNoTooltip]!"
  hellenism_religion.22.b: "Яка ганьба!"
  birds_divinations_come_true_desc: "Усі знаки сходяться, і пророцтво збувається. [ROOT.GetCountry.GetGovernment.GetCourtTitle] переконується в дієвості методу."
  the_divinations_lie_desc: "Усе це нісенітниця, а птахи — просто птахи. [ROOT.GetCountry.GetGovernment.GetCourtTitle] відчуває роздратування."
  hellenism_religion.23.title: "Розширення релігійних земель"
  hellenism_religion.23.desc: "Жерці виступають із амбітним проєктом, який назавжди змінить священні землі. Згідно з ним, храм у [target_location.Custom('LR_PREP')|l] [target_location.GetName] та інші знакові святилища добудовуються та розширюються, а двір оздоблюється величними прикрасами, щоб віряни виразно відчували велич богів.\n\nНа жаль, каміння не рухається саме собою, а ремісники не насичуються самими лише молитвами. Чи вирішимо ми самі вкласти кошти в цей план чи змусимо народ розщедритися, ціна буде високою, і боги, безсумнівно, помітять, хто і як її сплатив."
  hellenism_religion.23.a: "Ми самі профінансуємо розширення."
  hellenism_religion.23.b: "Перекладемо цей обов’язок на народ."
  hellenism_religion.24.title: "Дезидемонія"
  hellenism_religion.24.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] виказує наростаюче занепокоєння, і найгучніше з інших — [target_character.GetName]. Незначні знаки раптово стають важливими, сни перетворюються на грізні натяки, і навіть найбезневинніші збіги трактуються як послання згори.\n\nПодібні страхи корисні, коли спонукають поводитися обережніше, але вони можуть повністю паралізувати волю людини. Якщо [target_character.GetShortNameWithNoTooltip] не позбудеться нав’язливих думок, скоро нами керуватиме не розум, а забобони."
  hellenism_religion.24.a: "Обережність краща за безрозсудність."
  hellenism_religion.24.b: "Ми повинні відкинути забобони."
  hellenism_religion.25.title: "Жертви війни"
  hellenism_religion.25.desc: "Війна відбирає в нас усе. Часом навіть найзагартованіші вояки звертають погляди до небес, просячи в богів захисту. [target_war.GetName] — виснажливе випробування. Жерці вважають, що однієї сили зброї для перемоги недостатньо. Щоб витримати всі негаразди, ми повинні умилостивити богів.\n\nВони пропонують принести дорогу жертву, яка порадує богів і зміцнить дух нашого народу. Якщо ми відмовимося, то збережемо кошти, але образимо вищі сили та позбавимо своїх підданих надії на благополучний результат."
  hellenism_religion.25.a: "На таке жодних грошей не шкода!"
  hellenism_religion.25.b: "Ми переможемо і без цих вистав."
  we_will_win_the_ongoing_conflict_without_gods_tt: "Забобони не допоможуть нам здобути перемогу, обійдемося без них."
  hellenism_religion.26.title: "[target_god.GetNameWithNoTooltip], почуй нашу мольбу"
  hellenism_religion.26.desc: "Ми запалюємо пахощі, співаємо гімни на славу богів і приносимо їм щедрі підношення. Жерці стверджують, що жителі Олімпу почули нас і готові дати відповідь.\n\nОднак боги ніколи не допомагають просто так, і [target_god.GetName] не виняток. Ми повинні будемо заплатити за благословення, а втручання вищих сил може найнесподіванішим чином змінити [ROOT.GetCountry.Custom('rank_ua_ACC')|l] і все наше майбутнє життя."
  hellenism_religion.26.a: "Нехай [target_god.GetNameWithNoTooltip] відповість."
  hellenism_religion.26.b: "Ми обійдемося без настанов."
  gods_reward_our_piety_tt: "[target_god.GetName] нагороджує нас [Concept('gold', 'грошима')|e] за вірність"
  gods_imbue_stability_tt: "[target_god.GetName] виявляє прихильність, що зміцнює нашу [Concept('stability', 'стабільність')|e]"
  gods_sent_capable_character_tt: "[target_character_2.GetName] — це посудина, через яку [target_god.GetName] виливає свою волю"
  hellenism_religion.27.title: "Філософський парадокс"
  hellenism_religion.27.desc: "[Select_CString(target_character.IsFemale, 'Гостра на язик мислителька', 'Гострий на язик мислитель')] на ім’я [target_character.GetName] [Select_CString(target_character.IsFemale, 'стала частою гостею', 'став частим гостем')] при #L [ROOT.GetCountry.GetAdjective|l]ому#! дворі, і кожне [Select_CString(target_character.IsFemale, 'її', 'його')] слово перетворює впевненість на сумнів. Придворні збираються послухати [Select_CString(target_character.IsFemale, 'її', 'його')], почасти з цікавістю, а почасти з тривогою, оскільки навіть найпростіші істини [Select_CString(target_character.IsFemale, 'вона', 'він')] розплітає на окремі нитки, немов сукню.\n\nМудрість може бути благом, а може обернутися незручністю, коли мудрець відмовляється підкорятися. Якщо ми вирішимо [Select_CString(target_character.IsFemale, 'їй', 'йому')] потурати, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] може здобути мудрість або втратить спокій, адже ідеї мають звичай поширюватися далеко за межі стін, де вперше зародилися."
  hellenism_religion.27.a: "Нехай продовжує ділитися мудрістю."
  hellenism_religion.27.b: "Досить загадок. Відішліть [Select_CString(target_character.IsFemale, 'її', 'його')] геть."
  hellenism_religion.28.title: "[ShowGodNameWithNoTooltip('athena_god')] та її мудрість"
  hellenism_religion.28.desc: "У мирний час амбіції слабшають, а гору бере розсудливість. Не дивно, що жерці все частіше говорять про #TOOLTIP:GOD,athena_god,X #L Афіну#!#!. Вони наполягають, що мудрість — не просто чеснота, а зброя, яку найкраще кувати, коли [ROOT.GetCountry.GetFlavorRank|l] не бер[ROOT.GetCountry.Custom('endrank_eut')] участі у війні.\n\nНам пропонують витратне, але все ж цілком слушне рішення. Воно обіцяє нам порядок там, де зараз панує марнотратство, і ясність там, де панує сумнів. Відкинувши його, ми збережемо свої кошти, однак [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] назавжди запам’ята[ROOT.GetCountry.Custom('clergy_yeyut')], що ми вирішили проігнорувати настанови богині."
  hellenism_religion.28.a: "Ми готові платити за мудрість."
  hellenism_religion.28.b: "Нам не потрібна богиня, ми вміємо думати своєю головою."
  because_athena_omen_active_desc: "Оскільки зараз діє [Concept('omen', 'знамення')|e] #TOOLTIP:GOD,athena_god,X #L Афіни#!#!, його ефект залежить від рівня нашої [Concept('religious_unity', 'релігійної єдності')|e]"
  if_athena_omen_was_active_tt: "Якби зараз діяло [Concept('omen', 'знамення')|e] #TOOLTIP:GOD,athena_god,X #L Афіни#!#!, ми б отримали більше переваг від цього [Concept('event_option', 'вибору')|e]"
  our_denial_angers_the_clergy_tt: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] безсумнівно розгніва[ROOT.GetCountry.Custom('clergy_yetsayutsa')] через нашу відмову"
  hellenism_religion.29.title: "[target_god.GetNameWithNoTooltip] вимагає жертвоприношення"
  hellenism_religion.29.desc: "Жерці з’явилися до нас у похмурому настрої. Вони наполягають, що [ROOT.GetCountry.Custom('rank_ua_DAT')|l] загрожує гнів богів. За їхніми словами, знаки недвозначні: [target_god.GetName] може виявити до нас прихильність, перш ніж невдачі перетворяться на лихо, якщо ми принесемо відповідні жертви.\n\nЗолото — найпростіше підношення, що не вимагає особливих роздумів, однак Олімп рідко задовольняється парою монет. Дорожче жертвоприношення може принести більше прихильності, але від нього постраждає наша земля, а люди ніколи не забудуть, з чиєї волі його організували."
  hellenism_religion.29.a: "Покладемо золото на вівтар."
  hellenism_religion.29.b: "Перекладемо тягар на землю."
  hellenism_religion.29.c: "Ми відкидаємо цю вимогу."
  hellenism_religion.30.title: "Культ найманця"
  hellenism_religion.30.desc: "Надходять тривожні вісті з провінції [target_province.GetName]. Мандрівники розповідають про таємний культ найманців, які звеличують силу та приваблюють прихильників завдяки таємним обрядам та обіцянкам захисту. З вуст у вуста налякані місцеві жителі передають чутки про одного з головних учасників культу на ім’я [target_character.GetName]. [Select_CString(target_character.IsFemale, 'Вона опинилася', 'Він опинився')] в центрі уваги після того, як [Select_CString(target_character.IsFemale, 'вийшла', 'вийшов')] на політичну сцену [ROOT.GetCountry.Custom('rank_ua_GEN')|l] і [Select_CString(target_character.IsFemale, 'почала', 'почав')] говорити від їхнього імені як [Select_CString(target_character.IsFemale, 'одна', 'один')] з колишніх містіїв, запевняючи, що їхнє завзяття можна обернути нам на благо.\n\nОднак чутки в темних провулках розкрили таємні наміри культу — ненаситне прагнення до абсолютної влади. Якщо ми дозволимо їм залишитися, то зможемо зміцнити свій вплив там, де віра слабка, але водночас ризикуємо заразити наш #L [ROOT.GetCountry.GetAdjective|l]ий#! двір розкладницькими ідеями цього культу."
  hellenism_religion.30.a: "Нехай залишаються, але ми за ними пильно спостерігатимемо."
  hellenism_religion.30.b: "Заженемо їх назад у тінь."
  cult_operates_shadows_tt: "Культ продовжить діяти в тіні..."
  hellenism_religion.empty: ""
  hellenism_religion.32.title: "Джерело всього сущого"
  hellenism_religion.32.desc: "[Select_CString(target_character.IsFemale, 'Наша придворна мислителька написала', 'Наш придворний мислитель написав')] винятково амбітну працю. У витриманих, але непохитних тонах [Select_CString(target_character.IsFemale, 'вона', 'він')] стверджує, що першооснова — джерело, з якого походять усі боги та все суще, як промені невичерпного сонця — це не бог серед богів, а сама основа божественного начала. Традиційний пантеон реальний, — стверджує [Select_CString(target_character.IsFemale, 'вона', 'він')], — але кожен з богів це один з аспектів, еманація єдиного святого джерела: порядок породжує Розум, Розум — Душу, Душа — матерію.\n\nТрактат вже поширюється серед членів двору. Його ідеї захоплюють уми, і вони поширюватимуться, хочемо ми того чи ні."
  hellenism_religion.32.a: "Зробимо копії трактату та поширимо їх."
  hellenism_religion.32.b: "Нехай ідея сама доведе свою спроможність."
  hellenism_religion.33.title: "Християнське питання"
  hellenism_religion.33.desc: "До нашого двору прибуває [Select_CString(target_character.IsFemale, 'учена пані', 'учений муж')] у сані єпископа — не з мечем і не з претензіями, але з питаннями. [target_character.GetName] [Select_CString(target_character.IsFemale, 'присвятила', 'присвятив')] своє життя вивченню платонівської філософії, і [Select_CString(target_character.IsFemale, 'вона', 'він')] з тихою переконаністю стверджує, що християнський Бог і філософське поняття першооснови є одне й те саме. Свята Трійця, вважає [Select_CString(target_character.IsFemale, 'вона', 'він')], це просто союз Єдиного, Буття та Душі, вбрані в інші назви.\n\nЦя точка зору має під собою силу, і [target_character.GetName] доводить її зі спокійною впевненістю людини, яка вже чула всі можливі заперечення раніше. Погодимося ми з таким трактуванням чи відкинемо його, на цю суперечку звернуть увагу і [ROOT.GetCountry.GetCapitalName], і інші міста нашої країни."
  hellenism_religion.33.a: "Ми відкриті для діалогу. Ідеї це не зараза."
  hellenism_religion.33.b: "Ми відкидаємо такі порівняння. Першооснова це не Бог."
  hellenism_religion.34.title: "Світова душа"
  hellenism_religion.34.desc: "Придворні філософи обговорюють концепцію Світової душі — еманації першооснови, яка тече через все суще, даючи життя полям і річкам, тілу і духу. На їхню думку, два великих божества слід розуміти не як володарів моря і неба, а як два аспекти цієї Душі: сили, яка тече через все живе і завжди повертається до свого початку.\n\nУ провінції [target_province.GetName], регіоні з м’яким кліматом, місцеві жителі відчувають цю теорію на собі. Родючість цього краю філософи називають видимим доказом Божого промислу: гармонії Світової душі з Єдиним."
  hellenism_religion.34.a: "Візьмемося за благоустрій. Турбота про землю є турботою про Душу."
  hellenism_religion.34.b: "Опублікуємо виклад теорії. Цю доктрину потрібно зберегти на папері."
  hellenism_religion_34_work_of_art: "«Про Світову душу»"
  hellenism_religion_34_work_of_art_desc: "Богословський трактат про платонізм, де стверджується, що Світова душа є основою всього сущого, яка тече в природі та повертається до свого джерела — Єдиного."
  hellenism_religion.35.title: "Вознесіння душі"
  hellenism_religion.35.desc: "У дворі поширюється новина про те, що [target_character.GetName], [Select_CString(target_character.IsFemale, 'вчена пані', 'вчений муж')], чиї праці визначили філософську думку цілого покоління, помирає. В останні тижні свого життя [Select_CString(target_character.IsFemale, 'він', 'вона')] без упину спілкується з учнями. Це не лекції з книг, а пряме споглядання: ретельно добираючи формулювання, [target_character.GetName] описує три стадії вознесіння. Спершу душа відділяється від матерії, потім вона сходить до Розуму, і нарешті — тут [Select_CString(target_character.IsFemale, 'його', 'її')] голос стає майже беззвучним — настає возз’єднання з Єдиним, за межами думок і буття.\n\nНашого правителя запросили бути присутнім в останні моменти. [target_character.GetName] просить лише про одне: щоб [Select_CString(target_character.IsFemale, 'її', 'його')] вчення не було втрачено."
  hellenism_religion.35.a: "Запишемо та поширимо [Select_CString(target_character.IsFemale, 'її', 'його')] останні слова."
  hellenism_religion.35.b: "Заснуємо школу [Select_CString(target_character.IsFemale, 'її', 'його')] імені."
  target_character_ascends_to_the_one_tt: "[target_character.GetName] спокійно відходить у світ інший, сказавши все, що можна було сказати."
  hellenism_religion.36.title: "Олімпійські реставраціоністи"
  hellenism_religion.36.desc: "Не кожен у [ROOT.GetCountry.Custom('rank_ua_PREP')|l] змирився з новим богослов’ям. Деяк[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] на чолі з публічною особою на ім’я [target_character.GetName], все голосніше заявля[ROOT.GetCountry.Custom('clergy_yeyut')] про свої заперечення. Вони прості у своїх доводах і апелюють радше до емоцій, ніж до розуму: народу потрібен Зевс, Афіна, Арей і Посейдон. Не як символи, не як еманації. Не як аспекти якогось безликого абсолютного принципу, якому неможливо поклонятися і до якого не можна воззвати. Народу потрібні боги Олімпу з обличчями, храмами та жагою жертвоприношень.\n\nАбстрактне «Єдине», — заявляє [target_character.GetName], — не чує нас. А старі боги чули. [target_character.GetSheHe|U] відкрито вимагає відмови від моністської доктрини та повернення до старих обрядів."
  hellenism_religion.36.a: "Захистимо доктрину. Змусимо цю фракцію замовкнути."
  hellenism_religion.36.b: "Дозволимо офіційні диспути. Нехай висловляться обидві сторони."
  hellenism_religion.36.c: "Відмовимося від моністської доктрини та повернемося до Олімпійського пантеону."