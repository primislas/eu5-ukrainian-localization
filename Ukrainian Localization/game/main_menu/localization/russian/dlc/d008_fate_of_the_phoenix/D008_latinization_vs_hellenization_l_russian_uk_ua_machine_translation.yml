l_russian:
  latinization_vs_hellenization.1.title: "Відголоски еллінської мудрості"
  latinization_vs_hellenization.1.desc: "Благочестиві та вчені мужі [target_location.Custom('LR_GEN')|l] [target_location.GetName] з величезною цікавістю вивчають богословські твори та праці Отців Церкви, які широко розповсюдилися в монастирях та аудиторіях навчальних закладів. Проповідники та коментатори священних текстів вивчають православну мудрість, а копії цих творів все частіше потрапляють до рук негрецької знаті, і це все більше турбує тих, хто бачить майбутнє у зближенні з латинським Заходом."
  latinization_vs_hellenization.1.a: "Їхні знання збагатять нашу країну."
  latinization_vs_hellenization.1.b: "Це модне захоплення старовинними сувоями зайшло надто далеко!"
  target_character_disappears_tt: "[target_character.GetName] зникне"
  latinization_vs_hellenization.2.title: "Зростання захоплення латиною"
  latinization_vs_hellenization.2.desc: "Серед завсідників аристократичних гуртків #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! зростає цікавість до #TOOLTIP:LANGUAGE,latin_language,X #L латинських#!#! звичаїв, законів та обрядів. Молоді дворяни використовують у мові безліч іноземних зворотів, ведуть листування з латинськими дворами та вимагають реформувати [ROOT.GetCountry.Custom('rank_ua_ACC')|l], щоб принести в країну новітні західні віяння. Старше покоління з тривогою спостерігає, як руйнуються звичні устої."
  latinization_vs_hellenization.2.a: "У цьому немає нічого поганого."
  latinization_vs_hellenization.2.b: "Треба негайно відмовитися від цієї моди!"
  stability_scales_with_current_latinization_hellenization: "Зміна [Concept('stability', 'стабільності')|e] залежатиме від поточного рівня #TOOLTIP:SOCIETAL_VALUE,latinization_vs_hellenization,X #L латинства#!#! або #TOOLTIP:SOCIETAL_VALUE,latinization_vs_hellenization,X #L еллінізму#!#!"
  while_this_modifier_active_reduced_latinization_gain_from_events_tt: "Поки діє цей [Concept('country_modifier', 'модифікатор країни')|e], подальші [Concept('events', 'події')|e], що зміцнюють #TOOLTIP:SOCIETAL_VALUE,latinization_vs_hellenization,X #L латинство#!#!, будуть значно ослаблені, а їхні переваги зменшаться"
  bonus_weakened_because_of_suppressing_latinization_modifier: "Вигоди від цього варіанту зменшуються через модифікатор «[ShowModifier('suppressing_latinization_modifier')]»"
  latinization_vs_hellenization.3.title: "Латинство процвітає"
  latinization_vs_hellenization.3.desc: "Купці, правознавці та вчені відзначають, що нещодавній перехід країни на #TOOLTIP:LANGUAGE,latin_language,X #L латину#!#! вже починає приносити результати. Договори складаються чіткіше, іноземні партнери швидше орієнтуються в наших порядках, а енергія реформ ніби надає #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! життєвих сил. Втім, дехто вважає, що ці досягнення ґрунтуються на хистких підвалинах..."
  latinization_vs_hellenization.3.a: "Настав час пожинати плоди нашої успішної політики."
  latinization_vs_hellenization.3.b: "Мудрець волів би виправити помилки минулого."
  latinization_vs_hellenization.4.title: "Слава воякам загону «[target_unit.GetNameWithNoTooltip]»"
  latinization_vs_hellenization.4.desc: "Наш [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] дізнався про те, що загін «[target_unit.GetName]» чудово проявив себе в нещодавніх кампаніях. Його вояки б’ються відважно та чітко, зберігають стрій як у походах, так і на навчаннях. І [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], і прості вояки захоплюються їхньою бездоганною службою та бачать у них приклад для легіонів #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!."
  latinization_vs_hellenization.4.a: "Ми високо цінуємо їхню вірну службу."
  target_character_will_receive_a_nickname_tt: "[target_character.GetName] отримає відповідне прізвисько на знак [Select_CString(target_character.IsFemale, 'її', 'його')] бездоганної служби"
  latinization_vs_hellenization.5.title: "Суперечки про освіту в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
  latinization_vs_hellenization.5.desc: "Між ученими мужами #TOOLTIP:BUILDING_TYPE,university,X #L університету#!#! [target_location.Custom('LR_GEN')|l] [target_location.GetName] розгоряються суперечки про те, якою мовою потрібно здобувати вищу освіту. Одні стверджують, що лише #TOOLTIP:LANGUAGE,latin_language,X #L латина#!#! дозволить [ROOT.GetCountry.Custom('rank_ua_DAT')|l] посісти належне місце серед великих держав, інші ж наполягають, що освіта має вестися в каноні Константинополя та Церкви."
  latinization_vs_hellenization.5.a: "В університеті повинні викладати латиною."
  latinization_vs_hellenization.5.b: "Ми не залишимо традицій Церкви та Імперії."
  pops_in_target_province_mild_bonus_satisfaction: "Наші [Concept('pops', 'групи населення')|e] в провінції [target_province.GetName] отримають [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  pops_in_target_province_mild_penalty_satisfaction: "Наші [Concept('pops', 'групи населення')|e] в провінції [target_province.GetName] отримають [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] до [Concept('pop_satisfaction', 'вдоволення')|e]"
  latinization_vs_hellenization.6.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] попереджає про загрозу"
  latinization_vs_hellenization.6.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] не на жарт стривоженp[ROOT.GetCountry.Custom('clergy_yiaei')] поширенням новомодних #TOOLTIP:LANGUAGE,latin_language,X #L латинських#!#! віянь. [target_character.GetName], [Select_CString(target_character.IsFemale, 'видатна представниця', 'видатний представник')] духовенства, [Select_CString(target_character.IsFemale, 'з’явилася', 'з’явився')] до двору, щоб висловити свою занепокоєність. [target_character.GetSheHe|U] побоюється, що латинський вплив на догмати та звичаї підточує основи нашої віри та становить загрозу як для церкви, так і для трону."
  latinization_vs_hellenization.6.a: "Нам слід прислухатися до [target_character.GetHerHis] слів."
  latinization_vs_hellenization.6.b: "Ми не дозволимо, щоб нашу політику диктували боязкі духом!"
  latinization_vs_hellenization.7.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] звика[ROOT.GetCountry.Custom('nobles_yeyut')] до чужоземних звичаїв"
  latinization_vs_hellenization.7.desc: "Повсюди — від палаців [target_location.Custom('LR_GEN')|l] [target_location.GetName] до найвіддаленіших маєтків — наш[ROOT.GetCountry.Custom('nobles_aei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] охоче перейма[ROOT.GetCountry.Custom('nobles_yeyut')] #L [target_culture.GetName|l]і#! манери, моду та мову. Дехто сприймає це як прояв витонченості, проте багато хто нарікає, що знать зовсім забула своє #L [ROOT.GetCountry.GetAdjective|l]е#! коріння."
  latinization_vs_hellenization.7.a: "Нехай запозичують з [target_culture.GetNameWithNoTooltip|l]ої культури все, що може виявитися корисним."
  latinization_vs_hellenization.7.b: "Захоплення чужоземними порядками зайшло надто далеко."
  destabilize_our_realm: "Наше неприйняття нових віянь дестабілізує [ROOT.GetCountry.Custom('rank_ua_ACC')|l]"
  perceived_as_weakness: "Боротьба з проникненням чужоземних звичаїв сприймається як слабкість"
  latinization_vs_hellenization.8.title: "Реорганізація провінцій"
  latinization_vs_hellenization.8.desc: "Чиновники з [ROOT.GetCountry.GetCapital.Custom('LR_GEN')|l] [ROOT.GetCountry.GetCapital.GetName] пропонують провести всеосяжну реорганізацію таких провінцій, як [target_province.GetName]. Їхнє законодавство та адміністративний устрій потрібно привести у відповідність до порядків, що діють у культурному та політичному центрі країни. Ці реформи допоможуть зміцнити контроль над провінціями, проте ми ризикуємо порушити політичну рівновагу, що склалася на місцях."
  latinization_vs_hellenization.8.a: "Запровадимо нові порядки, чого б це не коштувало."
  latinization_vs_hellenization.8.b: "Місцевим динатам нема про що турбуватися — ми поважатимемо звичаї провінцій."
  pops_in_selected_provinces_will_gain_mild_bonus_satisfaction_tt: "Наші [Concept('pops', 'групи населення')|e] в охоплених [Concept('provinces', 'провінціях')|e] отримають [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] до вдоволення"
  latinization_vs_hellenization.9.title: "[target_character.GetShortNameWithNoTooltip] і питання освіти"
  latinization_vs_hellenization.9.desc: "[target_character.GetName] швидко дорослішає, і серед придворних наставників не вщухають суперечки про те, яким шляхом піде [target_character.GetHerHis] навчання. Вибір мови, книг, учителів — усе це стає ареною духовної боротьби за майбутнє #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!."
  latinization_vs_hellenization.9.a: "[target_character.GetHerHis|U] навчання буде чітко розплановано."
  latinization_vs_hellenization.9.b: "[target_character.GetShortNameWithNoTooltip] не зростатиме маріонеткою в руках суперницьких угруповань."
  refusal_to_politicize_tt: "В очах деяких придворних наше небажання відкрито втручатися в освіту персонажа [target_character.GetName] буде сприйнято як слабкість"
  court_does_not_react: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] ніяк не реагує"
  latinization_vs_hellenization.10.title: "Відродження римської величі"
  latinization_vs_hellenization.10.desc: "Зодчі, знайомі з архітектурою італійських міст, пропонують перебудувати всю провінцію [target_province.GetName] у дусі Відродження: широкі вулиці, регулярне планування та громадські споруди нагадуватимуть про ту пишноту Риму, якою його задумували видатні майстри латинського Заходу. Прихильники цих грандіозних планів бачать у них відродження нашої величі. Ймовірно, таке оновлення стане можливим, тільки якщо ми відкриємося впливу Заходу."
  latinization_vs_hellenization.10.a: "[target_province.GetNameWithNoTooltip] відродиться знову!"
  latinization_vs_hellenization.10.b: "Нехай поселення розвиваються природним шляхом."
  target_character_artist_skill: "[target_character.GetName]: [Concept('artistic_skill', 'хист')|e]"
  latinization_vs_hellenization.11.title: "Візантійська архітектура в провінції [target_province.GetNameWithNoTooltip]"
  latinization_vs_hellenization.11.desc: "Покровителі мистецтв та місцеві гільдії виступають за реконструкцію всієї провінції [target_province.GetName] у традиційному стилі стародавніх міст нашої імперії: там з’являться кам’яна кладка, прикрашені аркадами вулиці та відкриті форуми, які стали відмінною рисою Константинополя та інших стародавніх міст римського Сходу. Багато радників упевнені, що відродження цих форм стане потужним символом нашої римської спадщини."
  latinization_vs_hellenization.11.a: "Античні дива чудово підійдуть [ROOT.GetCountry.Custom('rank_ua_DAT')|l]."
  latinization_vs_hellenization.11.b: "$latinization_vs_hellenization.10.b$"
  latinization_vs_hellenization.12.title: "Суперечки щодо нової системи оподаткування"
  latinization_vs_hellenization.12.desc: "Чиновники скарбниці пропонують провести масштабну реформу податкової системи на основі чужоземних методів суворого обліку та збору податків. Ця смілива ініціатива посилить порядок та збільшить надходження до скарбниці, але в разі її реалізації постраждають інтереси багатьох могутніх груп [ROOT.GetCountry.Custom('rank_ua_GEN')|l]..."
  latinization_vs_hellenization.12.a: "Ми перейдемо на нову систему."
  latinization_vs_hellenization.12.b: "Не будемо з цим поспішати."
  proposed_taxation_upsets_estates_tt: "За нової системи оподаткування постраждають усталені привілеї окремих [Concept('estates', 'станів')|e]"
  new_tax_code_will_destabilize_the_realm: "Перегляд системи оподаткування дестабілізує [ROOT.GetCountry.Custom('rank_ua_ACC')|l]"
  latinization_vs_hellenization.13.title: "[target_location.Custom('LR_DAT')] [target_location.GetNameWithNoTooltip] потрібна своя рада"
  latinization_vs_hellenization.13.desc: "Знать [target_location.GetName.Custom('LR_GEN')|l] [target_location.GetName.GetName] звернулася до двору з проханням дати їм право збирати власну міську раду. Вони вказують на досвід самоорганізованих комун в італійських містах як на доказ того, що самоврядування — запорука процвітання. Якщо піти на поступки, це послабить контроль з боку центральної влади та підштовхне [ROOT.GetCountry.Custom('rank_ua_ACC')|l] до латинських моделей управління, проте відмова може налаштувати проти нас впливові верстви суспільства."
  latinization_vs_hellenization.13.a: "Нехай збирають свою раду."
  latinization_vs_hellenization.13.b: "Вони залишаться під прямим управлінням стольного двору."
  upper_class_pops_in_these_cities_angry: "Наші [Concept('pops', 'групи населення')|e] з [Concept('upper_class', 'вищого суспільства')|e] в уражених [Concept('locations', 'місцевостях')|e] будуть незадоволені відмовою. Вони отримають [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  latinization_vs_hellenization.14.title: "Святкування у провінції [target_province.GetNameWithNoTooltip]"
  latinization_vs_hellenization.14.desc: "Динати з провінції [target_province.GetName] пропонують влаштувати пишне торжество — свято на честь місцевих звичаїв та родючості. Ці гуляння здатні знизити напруженість та зміцнити почуття спільності, проте вимагатимуть чималих вкладень як від самої провінції, так і з державної скарбниці — що навряд чи потішить радників."
  latinization_vs_hellenization.14.a: "Влаштуємо свято лише в провінції [target_province.GetNameWithNoTooltip]."
  latinization_vs_hellenization.14.b: "Нехай сусідні провінції теж гуляють!"
  latinization_vs_hellenization.14.c: "Якщо в них є час святкувати, значить, є час і працювати."
  pops_are_happier_tt: "Наші [Concept('pops', 'групи населення')|e] у цій [Concept('province', 'провінції')|e], що НЕ належать до [Concept('upper_class', 'вищого суспільства')|e], отримають [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e] через святкування"
  latinization_vs_hellenization.15.title: "Порадник з латинської військової справи"
  latinization_vs_hellenization.15.desc: "Серед офіцерів поширюється докладний порадник зі стройової підготовки та тактики, заснований на досвіді найманців та військових орденів латинського Заходу. Якщо прийняти його як основну доктрину, то описані там плани та команди допоможуть забезпечити лад та одноманітність у наших військах."
  latinization_vs_hellenization.15.a: "Його мають прочитати всі!"
  latinization_vs_hellenization.15.b: "Ми не потребуємо античних порад."
  latinization_vs_hellenization.16.title: "[target_character.GetShortNameWithNoTooltip] та [target_estate.GetNameWithNoTooltip|l] сваряться"
  latinization_vs_hellenization.16.desc: "[target_character.GetName] та найвидатніші [target_estate.GetName|l] розсварилися в пух і прах, причому обидві сторони звинувачують одна одну в перевищенні повноважень. Їхня сварка може вбити клин між військовими колами та інтересами [ROOT.GetCountry.Custom('rank_ua_GEN')|l] загалом."
  latinization_vs_hellenization.16.a: "[Select_CString(target_character.IsFemale, 'Її', 'Його')] приструнили по ділу."
  latinization_vs_hellenization.16.b: "[target_estate.GetNameWithNoTooltip|U] не мають права голосу у військових справах!"
  court_faction_increases_influence: "Вплив опозиційної придворної фракції стає сильнішим"
  our_authority_will_suffer_penalty: "Наш авторитет падає"
  latinization_vs_hellenization.17.title: "[target_character.GetShortNameWithNoTooltip] бажає служити нам"
  latinization_vs_hellenization.17.desc: "Завдяки дружбі [target_country.Custom('preposition_zzi')] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#! та зростаючим зв’язкам між нашими дворами [Select_CString(target_character.IsFemale, 'одна бувала', 'один бувалий')] #L [target_culture.GetName|l][Select_CString(target_character.IsFemale, 'а', 'ий')]#! [Select_CString(target_character.IsFemale, 'войовниця виявила', 'воїн виявив')] бажання стати під наші прапори. [target_character.GetSheHe|U] зможе поділитися з нами знаннями військової справи латинського Заходу."
  latinization_vs_hellenization.17.a: "Ми раді кожному [target_culture.GetNameWithNoTooltip|l]ому лідеру!"
  latinization_vs_hellenization.18.title: "Розбіжності між лідерами"
  latinization_vs_hellenization.18.desc: "Два наші воєначальники, [target_character_1.GetName] та [target_character_2.GetName], розійшлися в думках щодо тактики та підготовки військ. Є ризик, що їхнє суперництво спричинить розкол в офіцерському корпусі та посіє замішання серед вояків чинної армії. Можливо, це черговий прояв глибокого розладу в наших збройних силах? Хай там як, в інтересах безпеки країни ми зобов’язані негайно припинити ці розбіжності."
  latinization_vs_hellenization.18.a: "[target_character_1.GetShortNameWithNoTooltip] говорить слушно."
  latinization_vs_hellenization.18.b: "Безумовно, [target_character_2.GetNameWithNoTooltip] [Select_CString(target_character_2.IsFemale, 'має рацію', 'має рацію')]!"
  latinization_vs_hellenization.19.title: "До провінції [target_province_destination.GetNameWithNoTooltip] стікаються мігранти"
  latinization_vs_hellenization.19.desc: "Добробут та добра слава провінції [target_province_destination.GetName] спонукали групу жителів з провінції [target_province_origin.GetName] перебратися до нас. Якщо вони з латинського Заходу, то це поглибить наш зв’язок із цим регіоном. Якщо ж це наші православні сусіди, то їхнє поселення зміцнить давні звичаї нашої провінції."
  latinization_vs_hellenization.19.a: "Вони принесуть користь нашому суспільству!"
  latinization_vs_hellenization.19.b: "Ми їм не раді."
  latinization_vs_hellenization.20.title: "[target_character.GetNameWithNoTooltip] та [Select_CString(target_character.IsFemale, 'її', 'його')] відданість"
  latinization_vs_hellenization.20.desc: "Ходять чутки, що [target_character.GetName] спілкується з посланцями та шпигунами інших держав. Це може бути й неправдою, але такі розмови підточують довіру до наших воєначальників. Розвідка вже повідомляє нам про зростання напруги, тому слід усе ретельно зважити."
  latinization_vs_hellenization.20.a: "[Select_CString(target_character.IsFemale, 'Їй', 'Йому')] час вирушити на заслужений відпочинок..."
  latinization_vs_hellenization.20.b: "Ми не будемо слухати дозвільні плітки!"
  target_character_spills_the_beans: "[target_character.GetShortName] видає наші таємниці [Concept('rivals', 'суперникам')|e] та [Concept('rival_enemies', 'ворогам')|e]"
  target_character_lips_shut: "[target_character.GetSheHe|U] вміє зберігати секрети"
  latinization_vs_hellenization.21.title: "Зростання інфляції"
  latinization_vs_hellenization.21.desc: "Притік знецінених та підроблених монет спричинив зростання цін по всій #L [ROOT.GetCountry.GetAdjective|l]ій#! землі. Деякі радники при дворі закликають негайно вжити заходів, інші ж вважають, що наше втручання лише погіршить ситуацію."
  latinization_vs_hellenization.21.a: "Посилимо контроль над монетами."
  latinization_vs_hellenization.21.b: "Ринок сам прийде в рівновагу."
  inflation_creeping_in_tt: "Неконтрольована [Concept('inflation', 'інфляція')|e] може спричинити серйозні проблеми в майбутньому"
  burghers_pleased: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] схвалюють нашу стриманість"
  burghers_upset: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] обуренсхвалю[ROOT.GetCountry.Custom('burghers_yiaei')] нашою бездіяльністю"
  inflation_causes_instability: "Стрімка [Concept('inflation', 'інфляція')|e] негативно позначається на [Concept('stability', 'стабільності')|e] країни"
  latinization_vs_hellenization.22.title: "[target_character_1.GetShortNameWithNoTooltip] і наставництво"
  latinization_vs_hellenization.22.desc: "Останнім часом [target_character_1.GetName] та [Select_CString(target_character_1.IsFemale, 'її', 'його')] [Select_CString(target_character_2.IsFemale, 'наставниця', 'наставник')] [target_character_2.GetName] стали дуже близькими, їхнє спілкування давно вийшло за межі навчання грамоти та лічби. Дехто вірить, що ця дружба допомагає розширювати кругозір [Select_CString(target_character_1.IsFemale, 'наступниці', 'наступника')], але інші задаються питанням, як чужий вплив позначиться на майбутньому [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  latinization_vs_hellenization.22.a: "[Select_CString(target_character_1.IsFemale, 'Малятко', 'Маля')] [target_character_1.GetShortNameWithNoTooltip] [Select_CString(target_character_1.IsFemale, 'гідна', 'гідний')] найкращого!"
  latinization_vs_hellenization.22.b: "[target_character_1.GetSheHe|U] [Select_CString(target_character_1.IsFemale, 'народжена', 'народжений')] повелівати, а не читати книжки!"
  heir_will_receive_more_tutoring_tt: "[Select_CString(target_character_1.IsFemale, 'Наша улюблена', 'Наш улюблений')] [target_character_1.GetShortName] отримає додаткове навчання, здатне покращити [target_character_1.GetHerHis] [Concept('abilities', 'навички')|e]. Згодом, якщо [target_character_1.GetSheHe] зійде на трон, це може вплинути на рішення, які [Select_CString(target_character_1.IsFemale, 'вона', 'він')] прийматиме."
  latinization_vs_hellenization.23.title: "Чужоземний літератор"
  latinization_vs_hellenization.23.desc: "До нашого двору [Select_CString(target_character.IsFemale, 'прибула мандрівна', 'прибув мандрівний')] [target_culture.GetNameWithNoTooltip|l][Select_CString(target_character.IsFemale, 'а вчена пані й привезла', 'учений муж і привіз')] написані латиною манускрипти, філософські нотатки та ідеї мудреців Заходу. Така людина могла б стати для нас цінним джерелом знань про інтелектуальні віяння латинського світу. Але також нам варто бути обережними: хто знає, яким чужоземним країнам [target_character.GetSheHe|l] зберігає вірність?"
  latinization_vs_hellenization.23.a: "Просимо, затримайся в нас, [Select_CString(target_character.IsFemale, 'мандрівнице', 'мандрівнику')]."
  latinization_vs_hellenization.23.b: "Нам не цікаві записки сумнівних волоцюг."
  latinization_vs_hellenization.24.title: "[Select_CString(target_character.IsFemale, 'Жінка, що бачила', 'Чоловік, що бачив')] світ"
  latinization_vs_hellenization.24.desc: "[Select_CString(target_character.IsFemale, 'Одна пані, яка добре знає', 'Один пан, який добре знає')] праці Отців Церкви та великих православних богословів, просить дозволу приєднатися до нашого двору. [target_character.GetSheHe|U] обіцяє поділитися рукописами з монастирів Сходу та передати нам свій багатий досвід у галузі візантійського права та православного вчення. Нам треба зрозуміти, чи зміцнять [target_character.GetHerHis|l] знання нашу прихильність до звичаїв, чи просто стануть черговим голосом у нашому багатолюдному дворі?"
  latinization_vs_hellenization.24.a: "Добре, [target_character.GetShortNameWithNoTooltip] може залишитися."
  latinization_vs_hellenization.24.b: "Подумаєш! [target_character.GetSheHe|U] лише ще одна цеглина в стіні."
  latinization_vs_hellenization.25.title: "Культурний спад"
  latinization_vs_hellenization.25.desc: "Літописці скаржаться на спад культурного життя [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. Меценатство виходить з моди, традиції забуваються, а твори, що колись надихали людей, припадають пилом у бібліотеках та архівах. Невже ми втратили зв'язок із великою культурою своїх предків?"
  latinization_vs_hellenization.25.a: "Ми повинні змиритися з тим, що наша спадщина згасає."
  latinization_vs_hellenization.25.b: "Ні! Всі інші неправі!"
  latinization_vs_hellenization.26.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] та східна мода"
  latinization_vs_hellenization.26.desc: "Наш[ROOT.GetCountry.Custom('nobles_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] зачарован[ROOT.GetCountry.Custom('nobles_yiaei')] шовками, пахощами та дивовижними звичаями, що привозять зі східних дворів купці та посланці. Одні не бачать у цьому нічого дивного для імперії між Сходом і Заходом, а інші вважають, що наше майбутнє пов’язане з латинськими державами, й інтерес двору до сходу лише відштовхне від нас західних союзників."
  latinization_vs_hellenization.26.a: "Схід завжди був частиною нашого світу."
  latinization_vs_hellenization.26.b: "Ми повинні дивитися не на схід, а на захід."
  latinization_vs_hellenization.27.title: "Політика прищеплення еллінізму дає результати"
  latinization_vs_hellenization.27.desc: "Прийнята нами культурна політика нарешті приносить плоди. Вчені відзначають знову знайдену ясність розуму, флотоводці говорять про відроджену віру у військово-морську міць країни, а народ починає розуміти, що наш шлях, при всій своїй складності, має мету і сенс."
  latinization_vs_hellenization.27.a: "Радійте! Предки нами пишатимуться!"
  strength_of_hellenization_desc: "Сила [Concept('country_modifier', 'модифікатора країни')|e] #TOOLTIP:MODIFIER_TYPE,monthly_towards_hellenization,X #P #V «Зміщення до еллінізму за місяць»#!#!#!"
  latinization_vs_hellenization.28.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] чин[ROOT.GetCountry.Custom('nobles_ytyat')] опір нововведенням"
  latinization_vs_hellenization.28.desc: "Найзнатніші родини нашої країни незадоволені стрімкими змінами в культурному житті #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] вважа[ROOT.GetCountry.Custom('nobles_yeyut')], що [ROOT.GetCountry.GetFlavorRank|l] ось-ось втратить свою унікальну ідентичність, і тільки їхня тверда рука здатна втримати країну від сповзання в хаос."
  latinization_vs_hellenization.28.a: "Погодимося на їхні вимоги."
  latinization_vs_hellenization.28.b: "Ми не змінимо свого курсу."
  latinization_vs_hellenization.29.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] чинить опір нововведенням"
  latinization_vs_hellenization.29.desc: "Останнім часом [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] все частіше висловлюють тривогу з приводу нашої культурної політики. Найрадикальніші їхні представники переконані в порочності та небезпеці будь-яких нововведень, але навіть найпоміркованіші вважають, що ми зобов’язані захистити віру від згубних віянь."
  latinization_vs_hellenization.29.a: "Ми прислухаємося до їхніх слів."
  latinization_vs_hellenization.29.b: "Догмати не повинні визначати політику країни."
  refusal_leads_instability: "Наша відмова підкоритися призведе до нестабільності"
  situation_dissipates: "Далі бурхливих дебатів справа не заходить"
  latinization_vs_hellenization.30.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] чинить опір нововведенням"
  latinization_vs_hellenization.30.desc: "Жителі #L [ROOT.GetCountry.GetAdjective|l]их#! сіл незадоволені. Простим працівникам немає діла до абстрактних суперечок про велич та звичаї, зате вони гостро відчувають, що якісь чиновники обтяжують їх новими тягарями. Якщо не вжити заходів, цей протест перестане бути мовчазним."
  latinization_vs_hellenization.30.a: "Нехай [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')|l] знає, що ми чуємо їхні благання."
  latinization_vs_hellenization.30.b: "Ми змусимо їх прийняти нові віяння."