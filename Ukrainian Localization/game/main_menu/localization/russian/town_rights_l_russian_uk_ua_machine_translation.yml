l_russian:
  revoke_town_rights: "Відкликання міських прав"
  revoke_town_rights_desc: ""
  REVOKE_TOWN_RIGHTS_FROM: "Відкликання [Concept('town_rights', 'міських прав')|e] у місцевості [TownRightsItem.GetFirstLocationName]"
  REVOKE_LOCATION_TOWN_RIGHT: "Скасування [Concept('town_rights', 'міських прав')|e] у місцевості [Location.GetName]"
  staple_port: "Штапельний порт"
  staple_port_desc: "Цій [Concept('location', 'місцевості')|e] даровані привілеї, які розширюють права #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L містян#!#! у сфері місцевої [Concept('trade', 'торгівлі')|e]."
  granary_town: "Житниця"
  granary_town_desc: "Цій [Concept('location', 'місцевості')|e] даровані привілеї та правила, які дозволяють збільшити там виробництво та зберігання [Concept('food', 'збіжжя')|e]."
  market_charter: "Право на ярмарки"
  market_charter_desc: "Ця [Concept('location', 'місцевість')|e] отримала право проводити ярмарки, що приваблює туди купців і розширює потенціал місцевого #TOOLTIP:BUILDING_TYPE,marketplace,X #L ринку#!#!."
  free_town_charter: "Статус вільного міста"
  free_town_charter_desc: "Ця [Concept('location', 'місцевість')|e] отримала право на самоврядування, обмеживши пряму владу #TOOLTIP:ESTATE_TYPE,crown_estate,X #L правителів#!#! заради більшої свободи в торгівлі та залучення нових мешканців."
  fortress_town: "Місто-фортеця"
  fortress_town_desc: "Цю [Concept('location', 'місцевість')|e] оголошено військовою залогою. Вона отримує кошти на зведення укріплень та підготовку [Concept('manpower', 'рекрутів')|e], однак постійна присутність військових заважає цивільній торговельній діяльності."
  mining_charter: "Право на гірничі роботи"
  mining_charter_desc: "Ця [Concept('location', 'місцевість')|e] отримала формальні права на ведення та розширення гірничих робіт з метою збільшення обсягів видобутку сировини. Це призвело до накладення суворіших обов’язків на #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L простолюд#!#!."
  mining_charter_rgo_tt: "Видобуває [Concept('raw_material', 'сировину')|e] або копає #TOOLTIP:GOODS,salt,X сіль#! далеко від моря"
  studium_privileges: "Освітні привілеї"
  studium_privileges_desc: "Ця [Concept('location', 'місцевість')|e], визнана осередком освіти, отримала право утримувати школи та залучати вчених. Це сприяє поширенню [Concept('literacy', 'грамотності')|e] та [Concept('institution', 'інститутів')|e], але рідко наповнює скарбницю безпосередньо."
  studium_privileges_rank_tt: "Місцевість є #TOOLTIP:LOCATIONRANK,city,X #L містом#!#! або #TOOLTIP:LOCATIONRANK,megalopolis,X #L мегалополісом#!#!"
  royal_tooling_rights: "Права на виробництво знаряддя"
  royal_tooling_rights_desc: "Цій [Concept('location', 'місцевості')|e] даровані права на виробництво та продаж #TOOLTIP:GOODS,tools,X #L знаряддя#!#!, завдяки чому вона отримує суттєву конкурентну перевагу."
  royal_jewelry_rights: "Права на ювелірне виробництво"
  royal_jewelry_rights_desc: "Цій [Concept('location', 'місцевості')|e] даровані права на виробництво та продаж #TOOLTIP:GOODS,jewelry,X #L ювелірних виробів#!#!, завдяки чому вона отримує суттєву конкурентну перевагу."
  royal_weaponry_rights: "Права на виробництво зброї"
  royal_weaponry_rights_desc: "Цій [Concept('location', 'місцевості')|e] даровані права на виробництво та продаж #TOOLTIP:GOODS,weaponry,X #L холодної#!#! та #TOOLTIP:GOODS,firearms,X #L вогнепальної зброї#!#!, а також #TOOLTIP:GOODS,cannons,X #L гармат#!#!, завдяки чому вона отримує суттєву конкурентну перевагу."
  royal_book_rights: "Права на книгодрукування"
  royal_book_rights_desc: "Цій [Concept('location', 'місцевості')|e] даровані права на виробництво та продаж #TOOLTIP:GOODS,paper,X #L паперу#!#!, #TOOLTIP:GOODS,books,X #L книжок#!#! та #TOOLTIP:GOODS,dyes,X #L барвників#!#!, завдяки чому вона отримує суттєву конкурентну перевагу."
  royal_artisan_rights: "Ремісничі права"
  royal_artisan_rights_desc: "Цій [Concept('location', 'місцевості')|e] даровані права на виробництво та продаж #TOOLTIP:GOODS,leather,X #L шкіри#!#!, #TOOLTIP:GOODS,pottery,X #L кераміки#!#! та #TOOLTIP:GOODS,furniture,X #L меблів#!#!, завдяки чому вона отримує суттєву конкурентну перевагу."
  royal_brewing_rights: "Права на виробництво хмільних напоїв"
  royal_brewing_rights_desc: "Цій [Concept('location', 'місцевості')|e] даровані права на виробництво та продаж #TOOLTIP:GOODS,liquor,X #L міцних напоїв#!#!, #TOOLTIP:GOODS,beer,X #L пива#!#! та #TOOLTIP:GOODS,wine,X #L вина#!#!, завдяки чому вона отримує суттєву конкурентну перевагу."
  royal_textile_rights: "Права на ткацтво"
  royal_textile_rights_desc: "Цій [Concept('location', 'місцевості')|e] даровані права на виробництво та продаж #TOOLTIP:GOODS,cloth,X #L тканин#!#! та #TOOLTIP:GOODS,fine_cloth,X #L тонкого сукна#!#!, завдяки чому вона отримує суттєву конкурентну перевагу."
  royal_naval_rights: "Права на виробництво суднобудівних матеріалів"
  royal_naval_rights_desc: "Цій [Concept('location', 'місцевості')|e] даровані права на виробництво та продаж #TOOLTIP:GOODS,naval_supplies,X #L суднобудівних матеріалів#!#! та #TOOLTIP:GOODS,tar,X #L дьогтю#!#!, завдяки чому вона отримує суттєву конкурентну перевагу."
  not_forcefully_revoked_last_10_years_tt: "За останні 10 років міські права жодного разу не були насильно скасовані."
  royal_masonry_rights: "Права на кам’яні та скляні роботи"
  royal_masonry_rights_desc: "Цій [Concept('location', 'місцевості')|e] даровані права на зведення #TOOLTIP:GOODS,masonry,X #L кам’яної кладки#!#!, а також на виробництво та продаж #TOOLTIP:GOODS,glass,X #L скла#!#!, завдяки чому вона отримує суттєву конкурентну перевагу."
  magdeburg_rights_town_rights: "$magdeburg_rights$"
  magdeburg_rights_town_rights_desc: "$magdeburg_rights_desc$"
  unlock_mageburg_town_rights_tt: "Відкриває [Concept('town_rights', 'міські права')|e]: [ShowTownRightsName('magdeburg_rights_town_rights')|l] та [ShowTownRightsName('nuremberg_rights_town_rights')|l]"
  lubeck_town_rights: "Любецьке право"
  lubeck_town_rights_desc: "Впровадивши для наших міських поселень ті ж закони та привілеї, що й у #TOOLTIP:LOCATION,lubeck,X #L Любеку#!#!, ми дамо своїм купцям більше свободи. Це благотворно позначиться на їхній торгівлі, але члени гільдії в самому місті точно не зрадіють таким преференціям і перешкоджатимуть нам усіма силами."
  town_rights_marketplace: "Міські права ринку"
  nuremberg_rights_town_rights: "Нюрнберзьке право"
  nuremberg_rights_town_rights_desc: "$magdeburg_rights_town_rights_desc$"
  upper_bergregal: "Вища гірнича регалія"
  upper_bergregal_desc: "Якщо передати міській владі право вести гірничодобувну діяльність, то це збільшить обсяг коштів на розвідку нових корисних копалин та підвищить привабливість міста для нових поселенців. На жаль, це також призведе до посилення обмежень для місцевих жителів та скоротить їхні можливості самим отримувати вигоду з рудників."
  upper_bergregal_raw_material_tt: "Виробляє #TOOLTIP:GOODS,silver,X #L срібло#!#!, #TOOLTIP:GOODS,goods_gold,X #L золото#!#!, #TOOLTIP:GOODS,gems,X #L дорогоцінне каміння#!#! або #TOOLTIP:GOODS,salt,X #L сіль#!#!"
  unlock_bergregal_rights_tt: "Відкриває [Concept('town_rights', 'міські права')|e]: [ShowTownRightsName ('upper_bergregal')|l] та [ShowTownRightsName('lower_bergregal')|l]"
  lower_bergregal: "Нижча гірнича регалія"
  lower_bergregal_desc: "$upper_bergregal_desc$"
  lower_bergregal_raw_material_tt: "Виробляє #TOOLTIP:GOODS,iron,X #L залізо#!#!, #TOOLTIP:GOODS,copper,X #L мідь#!#!, #TOOLTIP:GOODS,lead,X #L свинець#!#!, #TOOLTIP:GOODS,tin,X #L олово#!#!, #TOOLTIP:GOODS,alum,X #L галуни#!#!, #TOOLTIP:GOODS,marble,X мармур#!#!, #TOOLTIP:GOODS,mercury,X #L ртуть#!#!, #TOOLTIP:GOODS,coal,X вугілля#!#!, #TOOLTIP:GOODS,stone,X камінь#!#! або #TOOLTIP:GOODS,saltpeter,X селітру#!#!"
  stapelrecht_town_rights: "Складове право вільного імперського міста"
  stapelrecht_town_rights_desc: "Завдяки статусу #TOOLTIP:SPECIAL_STATUS,free_city,X #L вільного імперського міста#!#!, отриманому від #TOOLTIP:SPECIAL_STATUS,emperor,X #L імператора#!#!, ми тепер можемо безперешкодно запроваджувати певні привілеї в наших містах, що йде на користь місцевим купцям і змушує більше іноземних купців вести торгівлю через наші землі."
  kulm_town_rights: "Кульмське право"
  kulm_town_rights_desc: "$kulm_law_desc$"
  unlock_kulm_town_rights_tt: "Відкриває [Concept('town_rights', 'міські права')|e]: [ShowTownRightsName('kulm_town_rights')|l]"
  novi_fori_town_rights: "Сродське право"
  novi_fori_town_rights_desc: "$novi_fori_desc$"
  unlock_novi_fori_rights_tt: "Відкриває [Concept('town_rights', 'міські права')|e]: [ShowTownRightsName('novi_fori_town_rights')|l]"
  royal_free_cities_town_rights: "Право на статус королівського вільного міста"
  royal_free_cities_town_rights_desc: "Оголосивши наші міські центри королівськими та вільними містами, ми зможемо запобігти зміцненню влади нашої #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#! на їхніх землях."
  bohemian_royal_cities_town_rights: "Право на статус королівського міста"
  bohemian_royal_cities_town_rights_desc: "Надавши містам привілей оголошувати себе прямою власністю нашого правителя, ми послабимо #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знать#!#! і допоможемо державі отримувати від міст більше прибутку."
  swedish_city_rights: "Право на міські привілеї"
  swedish_city_rights_desc: "Купці в цьому регіоні отримають широкі привілеї для ведення торгівлі без іноземної конкуренції."
  norwegian_city_rights: "Право міста-ринку"
  norwegian_city_rights_desc: "Надавши привілеї та пільги місцевим торговцям, ми зміцнимо свої торгові шляхи, але при цьому створимо несприятливі умови для іноземних купців."
  borough_customals: "Місцеве право"
  borough_customals_desc: "Області, наділені такими правами, зможуть самостійно керувати своїм розвитком і слугуватимуть притулками від гніту знаті."
  manorial_customals: "Маноріальне право"
  manorial_customals_desc: "Якщо надати поміщикам більше виконавчої влади над місцевістю, це збільшить експлуатацію землі та стримає непокірних селян."
  foros_extensos_town_rights: "Форос Екстенсос"
  foros_extensos_town_rights_desc: "З моменту свого заснування $POR$ була прикордонною територією, батьківщиною таких прославлених людей, як Жералду Безстрашний. Її правителі заохочують хоробрість і непохитність, надаючи містам широкі привілеї, відомі як «Форос Екстенсос»."
  fuero_juzgo_town_rights: "Фуеро Хузго"
  fuero_juzgo_town_rights_desc: "Міські права «Фуеро Хузго» засновані на давньому вестготському кодексі #italic Liber Iudiciorum#!. Вони регулюють багато аспектів повсякденного життя і добре підходять для нещодавно колонізованих земель."
  fuero_real_town_rights: "Фуеро Реаль"
  fuero_real_town_rights_desc: "Звід законів «Фуеро Реаль» був розроблений королем Альфонсо X, щоб поширити королівську владу на всі муніципалітети Кастилії."
  fuero_general_town_rights: "Фуеро Хенераль"
  fuero_general_town_rights_desc: "Міські права Наварри «Фуеро Хенераль» — звід звичаїв і законів, які регулюють діяльність різних володінь на цій території за згодою її правителя."
  fuero_de_aragon_town_rights: "Фуерос де Арагон"
  fuero_de_aragon_town_rights_desc: "«Фуерос де Арагон» — це збірка різних муніципальних прав, що поширилися по всьому Арагону з розширенням його території. Ці права неухильно дотримуються як аристократи, так і простолюд."
  usatges_de_barcelona_town_rights: "Барселонські звичаї"
  usatges_de_barcelona_town_rights_desc: "«Барселонські звичаї» — це традиції, які дотримуються на каталонській території. Спочатку вони були встановлені графами Барселони."
  furs_de_valencia_town_rights: "Валенсійські фуерси"
  furs_de_valencia_town_rights_desc: "Валенсійські фуерси дарував однойменному королівству король Хайме I Арагонський. Їхня головна відмінність від колишніх звичаїв Арагону та Каталонії полягає в наголосі на сусідстві місцевих жителів з мусульманами, які в деяких районах становлять більшість."
  flemish_cloth_industries_right: "Фламандське суконне виробництво"
  flemish_cloth_industries_right_desc: "У пізньому Середньовіччі в Нідерландах сформувалася розвинена суконна галузь. Тканини найвищої якості з англійської та кастильської вовни роз'їжджалися звідти по всій Європі."
  ville_franche_town_rights: "Вільфраншське право"
  ville_franche_town_rights_desc: "$villes_franches_desc$"
  unlock_ville_franche_town_rights_tt: "Відкриває [Concept('town_rights', 'міські права')|e]: [ShowTownRightsName('ville_franche_town_rights')|l]"
  borgo_franco_town_rights: "Боргофранкське право"
  borgo_franco_town_rights_desc: "Поширення комун по всій Італії — нова реальність, яка визначає розвиток цього регіону. Їх часто називають #italic «Борго Франко»#! (вільними містами), і порівняно з селами вони мають низку особливих привілеїв."
  scandinavian_fishing_privileges: "Риболовні привілеї"
  scandinavian_fishing_privileges_desc: "Цьому [Concept('location', 'місцевості')|e] даровані виняткові права на близькі рибні угіддя, а також торгівлю сушеною та соленою рибою. Приморські міста Норвегії скористалися цими привілеями, щоб організувати торгівлю #TOOLTIP:GOODS,fish,X #L рибою#!#! по всій Північній Європі."
  scandinavian_bergslag_privileges: "Гірничі привілеї"
  scandinavian_bergslag_privileges_desc: "Влада визнала цю [Concept('location', 'місцевість')|e] гірничим поселенням, або бергслагом, надавши їй колективні права на видобуток місцевої руди, власний суд та звільнення від військової повинності. [ShowEstateTypeName('peasants_estate')], що працю[ROOT.GetCountry.Custom('peasants_yeyut')] у копальнях, ма[ROOT.GetCountry.Custom('peasants_yeyut')] вищий правовий статус у порівнянні з жителями звичайних міст."
  scandinavian_tar_privileges: "Привілеї на виробництво дьогтю"
  scandinavian_tar_privileges_desc: "Цій [Concept('location', 'місцевості')|e] даровано права на виробництво та вивіз #TOOLTIP:GOODS,tar,X #L дьогтю#!#! та #TOOLTIP:GOODS,naval_supplies,X #L суднобудівних матеріалів#!#! з лісів, що належать короні. Ці лісові промисли становлять основу для всього суднобудування на узбережжі Балтійського моря."
  scandinavian_thing_rights: "Тінгсрет"
  scandinavian_thing_rights_desc: "Цій [Concept('location', 'місцевості')|e] даровано офіційні права на проведення зібрань, або «тінгсрет». Її жителі отримали визнаний державою орган самоврядування та правосуддя. Влада корони при цьому позбавляється певних повноважень, а натомість набуває більш дисциплінованого та вірного населення."
  imperial_breadbasket_rights: "Імперська житниця"
  imperial_breadbasket_rights_granary_tt: "Є [ShowBuildingTypeName('granary')|l] рівня 5 або вище"
  imperial_breadbasket_rights_rank_tt: "Місцевість є #TOOLTIP:LOCATIONRANK,city,X #L містом#!#! або #TOOLTIP:LOCATIONRANK,megalopolis,X #L мегалополісом#!#!"
  imperial_breadbasket_rights_desc: "Цій [Concept('location', 'місцевості')|e] влада доручила постачати харч всьому королівству, і щоб задовольнити ці амбітні плани, ми розширили її комори. Збіжжя надходить сюди у величезних кількостях, а потім під імперським наглядом доставляється місцевим жителям та воякам."
  constantinopolitan_silk_monopoly_rights: "Шовкова монополія Константинополя"
  constantinopolitan_silk_monopoly_rights_tt: "Місцевість є #TOOLTIP:LOCATION,constantinople,X #L Константинополем#!#!, де повністю розвинений видобуток [Concept('raw_material', 'сировини')|e]"
  constantinopolitan_silk_monopoly_rights_desc: "Виробництво #TOOLTIP:GOODS,silk,X #L шовку#!#! в #TOOLTIP:LOCATION,constantinople,X #L Константинополі#!#! відповідає високим стандартам, це давня традиція, що передається з покоління в покоління. Під імперським наглядом майстерні процвітають, щоправда, все виробництво підпорядковується монополії."
  scholai_literacy_rights: "Навчальні привілеї"
  scholai_literacy_rights_tt: "Панівна культура належить до #TOOLTIP:CULTUREGROUP,greek_group,X #L еллінської#!#! групи, а місцева [Concept('literacy', 'грамотність')|e] не перевищує 125% від середньої в країні"
  scholai_literacy_rights_desc: "Цю [Concept('location', 'місцевість')|e] визнано центром освіти, де грамотність розвивається під заступництвом влади. Знання тут поширюються швидко, і хоча подібні заняття навряд чи збагатять скарбницю, не варто забувати, що неробство — мати всіх вад."
  municipia_privilegia: "Муніципальні привілеї"
  municipia_privilegia_latin_tt: "Власник схильний до #TOOLTIP:SOCIETAL_VALUE,latinization_vs_hellenization,X #L латинства#!#! або оголосив #TOOLTIP:LANGUAGE,latin_language,X #L латину#!#! придворною чи панівною мовою"
  municipia_privilegia_desc: "Ця [Concept('location', 'місцевість')|e] отримала статус муніципалітету, і права, даровані її громадянам, відповідають нашому законодавству. Завдяки зростаючому впливу місцевої еліти тут поширюються традиції #TOOLTIP:SOCIETAL_VALUE,latinization_vs_hellenization,X #L латинства#!#!."
  agrarian_community_town_right: "Право на свободу віросповідання"
  agrarian_community_town_right_desc: "Ця [Concept('location', 'місцевість')|e] отримала особливі права, що захищають релігійну свободу кожної окремої людини, в обмін на виділення значної частини своїх земель для виробництва харчів та сировини."
  agrarian_community_raw_material_tt: "Виробляє #TOOLTIP:GOODS,wheat,X #L пшеницю#!#!, #TOOLTIP:GOODS,maize,X кукурудзу#!, #TOOLTIP:GOODS,rice,X #L рис#!#!, #TOOLTIP:GOODS,millet,X #L невибагливі злаки#!#!, #TOOLTIP:GOODS,legumes,X #L бобові культури#!#!, #TOOLTIP:GOODS,potato,X картоплю#!, #TOOLTIP:GOODS,livestock,X #L худобу#!#!, #TOOLTIP:GOODS,olives,X #L оливки#!#!, #TOOLTIP:GOODS,fruit,X #L фрукти#!#! або #TOOLTIP:GOODS,beeswax,X #L бджолиний віск#!#!"
  enlightened_leadership_reform_town_right: "Право простолюду на участь у раді"
  enlightened_leadership_reform_town_right_desc: "Ця [Concept('location', 'місцевість')|e] отримала право відкрити місцеву раду для простолюду. У результаті простий люд отримав право голосу у вирішенні місцевих питань та зміг вимагати для себе більше прав."