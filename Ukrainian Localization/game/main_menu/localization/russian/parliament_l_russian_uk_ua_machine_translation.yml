  establish_standing_regiments: "Заснувати постійні полки"
  establish_standing_regiments_desc: "Часи, коли в скрутну годину правителі збирали загони з васалів, давно минули. Наші знатні роди тепер мають постачати навчених офіцерів для командування полками, що перебувають на постійній королівській службі та зберігають вірність короні, а не своєму місцевому пану."
  mandate_wartime_conscription: "Запровадити призов воєнного часу"
  mandate_wartime_conscription_desc: "Наші вороги виставляють війська з рекрутів, і ми маємо наслідувати їхній приклад. Залучення резервів та новобранців на основі парафіяльних списків дасть змогу збільшити наші сили в цю скрутну годину."
  promote_industrial_workshops: "Підтримка промислових мануфактур"
  promote_industrial_workshops_desc: "Ремісничі братства, які колись слугували опорою наших міст, уже не в змозі забезпечити продуктивність, якої вимагає наш час. Нам слід інвестувати в нові мануфактури та оснащені різними машинами цехи, здатні виробляти істотно більше й швидше, якщо ми хочемо, щоб наш крам відповідав вимогам часу."
  wartime_officer_corps: "Посилення офіцерського корпусу"
  wartime_officer_corps_desc: "Натиск кінноти більше не вирішує результату бою. Тепер перемогу приносить мистецтво командування, і збори мають надати війську право призначати командирами найкращих із наших навчених людей до початку воєнної кампанії."
  pa_accept_estate_culture: "Прийняття культури стану"
  pa_accept_estate_culture_simple: "Підкуп стану"
  pa_accept_estate_culture_desc: "[Concept('estate', 'Стан')|e] вимагає, щоб панівна [Concept('culture', 'культура')|e] його народу отримала офіційне визнання."
  pa_convert_to_estate_religion: "Прийняття віри стану"
  pa_convert_to_estate_religion_simple: "Підкуп стану"
  pa_convert_to_estate_religion_desc: "[Concept('estate', 'Стан')|e] вимагає, щоб країна прийняла [Concept('religion', 'віру')|e] його народу."
  pa_change_court_language_to_estate_language: "Зміна придворної мови"
  pa_change_court_language_to_estate_language_simple: "Підкуп стану"
  pa_change_court_language_to_estate_language_desc: "[Concept('estate', 'Стан')|e] вимагає встановити [Concept('court_language', 'придворну мову')|e], яка більшою мірою відображає його самобутність."
  iw_militarize_country: "Мілітаризація країни"
  iw_militarize_country_desc: "Закликати [Concept('parliament', 'збори')|e] підтримати термінове нарощування військ, що дасть змогу підвищити [Concept('army_tradition', 'військові традиції')|e] та зміцнити найдосвідченіші частини нашого [Concept('army', 'війська')|e]."