  new_mamluk_appears_tt: "#Y Новий мамлюк отримає підвищення#!"
  promote_mamluks_tt: "У результаті [Concept('event', 'події')|e] з'являться нові кандидати-мамлюки"
  pa_hre_lessen_tax_burden: "Зниження податкового тягаря"
  pa_hre_lessen_tax_burden_simple: "$pa_hre_lessen_tax_burden$"
  pa_hre_lessen_tax_burden_desc: "Ми обіцяємо скоротити повинність щодо #TOOLTIP:PAYMENT,imperial_contribution,X #L внеску імперії#!#! в обмін на їхню підтримку."
  pa_hre_elevate_prussia_to_kingdom: "Піднесення Пруссії до рангу королівства"
  pa_hre_elevate_prussia_to_kingdom_simple: "Піднесення Пруссії до рангу королівства"
  pa_hre_elevate_prussia_to_kingdom_desc: "Правителі #ONCLICK:COUNTRY,[GetCountry('PRU').GetKey] #TOOLTIP:COUNTRY,[GetCountry('PRU').GetKey],X [GetCountry('PRU').Custom('CL_GEN')|L]#!#! завжди були вкрай амбітними. Багато з них навіть просили надати їм формальні титули королів, хоча в них і не було власного королівства. Можливо, піднісши цю країну до рангу #TOOLTIP:COUNTRY_RANK,rank_kingdom,X #L королівства#!#!, ми зможемо заручитися її повною підтримкою…"
  pa_hre_elevate_prussia_to_kingdom_tt: "У зв'язку з нашим рішенням у #ONCLICK:COUNTRY,[GetCountry('PRU').GetKey] #TOOLTIP:COUNTRY,[GetCountry('PRU').GetKey],X [GetCountry('PRU').Custom('CL_PREP')|L]#!#! відбудеться відповідна [Concept('event', 'подія')|e]."
  pa_hre_grant_imperial_titles: "Присвоєння імперських титулів"
  pa_hre_grant_imperial_titles_simple: "$pa_hre_grant_imperial_titles$"
  pa_hre_grant_imperial_titles_desc: "Виборці напевно будуть вдячні за надання додаткових титулів."
  pa_hre_affirmation_of_free_city_rights: "Визнання прав вільних міст"
  pa_hre_affirmation_of_free_city_rights_desc: "Варто продовжити дію привілеїв вільних міст, щоб забезпечити їхній стабільний розвиток і процвітання у складі імперії."
  opinion_hre_pa_supports_free_cities: "Підтримка вільних міст"
  pa_hre_affirmation_of_free_city_rights_tt: "Кожне [ShowSpecialStatusName('free_city')|l] отримає [ShowNamedValue('stability_mild_bonus')|+=2] од. [Concept('stability', 'стабільності')|e]. При цьому всі країни, що воюють з ним, знизять свою думку про голову #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священної Римської імперії#!#! на [ShowBiasValue('opinion_hre_pa_supports_free_cities')|+] од."
  royal_monopoly_on_trade: "Державна монополія на торгівлю"
  royal_monopoly_on_trade_desc: "Купці в нашій державі вже занадто довго жирують на прибутках від торгівлі. Ми встановимо королівську монополію на основні товари та спрямуємо ці прибутки в руки корони, щоб вони могли служити на користь усієї країни."
  charter_subject_governors: "Призначення намісників на залежних володіннях"
  charter_subject_governors_desc: "Наші далекі васали потребують уваги, але корона зайнята іншими справами. Намісники, наділені королівською владою, зміцнять контроль над цими землями та забезпечать притік грошей від них до нашої скарбниці."
  establish_colonial_administration: "Заснування колоніальної адміністрації"
  establish_colonial_administration_desc: "Нашими заморськими колоніями потрібно керувати як повноцінним продовженням нашої країни, а не кидати напризволяще авантюристів. Для цього нам потрібно створити повноцінні адміністративні структури."
  reform_the_royal_treasury: "Реформа королівської скарбниці"
  reform_the_royal_treasury_desc: "Безконтрольне карбування монет призвело до зростання цін та знецінило наші гроші. Ретельна ревізія королівської скарбниці та реформа роботи монетарні знову зміцнять нашу валюту."
  issue_royal_censure: "Королівський осуд"
  issue_royal_censure_desc: "Наші суперники вчинили дії, які не можна залишати без нашого офіційного засудження. Королівський осуд, підтриманий зборами, дасть усім зрозуміти, що ми не залишимо такої поведінки без відповіді."
  mandate_emergency_levies: "Терміновий збір ополчення"
  mandate_emergency_levies_desc: "Наші воєнні потреби вимагають більшої участі від жителів нашої країни. Усі стани та піддані повинні дати короні якомога більше в ім’я спільної перемоги."
  fund_royal_art_patronage: "Державний патронаж мистецтв"
  fund_royal_art_patronage_desc: "Велич країни вимірюється не лише військами та грошима у скарбниці, а й створюваними витворами мистецтва та культури. Нам потрібно вкладати гроші в підтримку митців та ремісників, які увічнять славу нашої династії."
  institute_feudal_levies: "Організація феодального ополчення"
  institute_feudal_levies_desc: "Основою будь-якого великого війська є вершники з-поміж аристократів. Законодавчо закріпивши воєнні зобов’язання шляхетних домів — зокрема, зобов’язання споряджати важку кінноту, — ми збільшимо силу своїх військ на полі бою."
  establish_military_exercises: "Організація воєнних навчань"
  establish_military_exercises_desc: "Наші шляхетні вояки втрачають вправність та досвід у мирні часи. Наказавши проводити регулярні воєнні навчання та турніри, ми зробимо так, щоб наші бійці залишалися в найкращій формі, а війська були завжди готові до битви."
  establish_heralds_college: "Заснування геральдичної палати"
  establish_heralds_college_desc: "Старшинство титулів, права гербів та порядок шляхетських звань — це питання величезної ваги. Геральдична палата наведе в них лад та підтримає славу нашої країни за кордоном."
  promote_chivalric_orders: "Підтримка лицарських орденів"
  promote_chivalric_orders_desc: "Наші лицарські ордени — це втілення шляхетної воєнної чесноти. Надавши їм королівське визнання та фінансування, ми зміцнимо зв’язок між короною та її найкращими вояками."
  license_noble_privateers: "Каперські патенти для аристократії"
  license_noble_privateers_desc: "Моря обіцяють багатство сміливим, і шляхетні доми можуть використовувати військові кораблі для отримання доходу. Видача каперських патентів дозволить нам легалізувати їхні авантюри, а корона, своєю чергою, отримає вигоди від порушення ворожої торгівлі."
  monopolize_land_trade_routes: "Монополія на суходільні торгові шляхи"
  monopolize_land_trade_routes_desc: "Наша знать контролює дороги, перевали та мости, якими йде вся суходільна торгівля. Видача їм прав на стягнення мит з суходільних купців дозволить нам перенаправити ці доходи в кишені найвідданіших прихильників."
  fund_noble_colonization: "Опікуватися шляхетною колонізацією"
  fund_noble_colonization_desc: "Впливові шляхетні доми нашої країни мають засоби та мотивацію для фінансування колоніальних експедицій. Нам потрібно заохочувати та фінансувати ці підприємства, щоб розширювати свій вплив далеко за морями."
  grant_exclusive_hunting_rights: "Видача виняткових прав на полювання"
  grant_exclusive_hunting_rights_desc: "Ліси нашої країни та дичина, що там мешкає, споконвіку належать знаті. Ми видамо їм виняткові права на полювання та управління цими землями: це зміцнить їхній стан та вірність короні."
  establish_noble_garrison_law: "Закон про організацію залог коштом знаті"
  establish_noble_garrison_law_desc: "Нашій країні загрожують заворушення, і ми не зможемо їх придушувати без сильних місцевих залог. Нам потрібно зобов’язати шляхетні доми утримувати укріплення у своїх володіннях та бути готовими захистити країну та корону."
  establish_clergy_charity: "Заснування церковних богаділень"
  establish_clergy_charity_desc: "Наш народ голодує, а засіки панів ломляться від хліба. Обов’язок духовенства — організувати допомогу нужденним і голодним. І цей обов’язок ми повинні зробити законом і тримати на власному кошті."
  launch_religious_missions: "Духовні місії"
  launch_religious_missions_desc: "Багато місцевостей нашої країни досі позбавлені світла істинної віри. Церква повинна відправити туди місіонерів, щоб направити заблудлі душі на шлях істинний, і ми забезпечимо їм необхідну підтримку."
  institute_canonical_law: "Канонічне право"
  institute_canonical_law_desc: "Розкол у вірі знаменує й розкол і у дусі. Якщо ми складемо звід канонічного права та доб’ємося його єдиного виконання в усіх провінціях, то зміцнимо віру, що об’єднує наш народ."
  establish_inquisition_courts: "Заснування судів інквізиції"
  establish_inquisition_courts_desc: "Насіння єресі проросло на нашій землі, і тільки злагоджена робота церковних судів зможе викорінити його сходи. Ми повинні діяти рішуче, доки зараза не поширилася далі."
  promote_religious_tolerance: "Заохотити віротерпимість"
  promote_religious_tolerance_desc: "У нашій країні живе багато людей, які не поділяють нашу віру, і їхнє невдоволення може призвести до заворушень. Церква проявить мудрість, якщо визнає, що терпимість збереже мир краще, ніж вічні конфлікти."
  fund_monastery_network: "Опікуватися мережею монастирів"
  fund_monastery_network_desc: "Наші монастирі — це осередки освіти, благодійності та порядку. Нам потрібно розширювати їхню мережу та не шкодувати кошти на їхнє утримання, щоб своїми благими справами вони осявали навіть найдальші куточки країни."
  establish_pilgrimage_routes: "Організація паломницьких шляхів"
  establish_pilgrimage_routes_desc: "Святі місця нашої віри приваблюють паломників звідусіль. Якщо ми облагородимо паломницькі шляхи та організуємо там охорону, то продемонструємо свою набожність, а також підвищимо відомість та славу нашої країни."
  regulate_tithe_collection: "Регулювання збору десятини"
  regulate_tithe_collection_desc: "Збір десятини стає дедалі непостійнішим і все частіше призводить до скандалів. Якщо ми встановимо єдину церковну частку від прибутку в усій країні, то забезпечимо духовенству постійний дохід і усунемо тривоги серед підданих."
  sponsor_theological_seminaries: "Спонсорування духовних семінарій"
  sponsor_theological_seminaries_desc: "Освічене духовенство — це основа духовно здорової країни. Ми повинні профінансувати будівництво та розширення семінарій, які виховають нове покоління священників."
  promote_export_trade: "Заохочення вивізної торгівлі"
  promote_export_trade_desc: "Наші купці готові вирушити з нашими товарами в найдальші куточки світу, але для розширення торгової мережі їм потрібна підтримка зборів. Вклавшись в вивізну торгівлю, ми збагатимо країну та зміцнимо вплив за кордоном."
  establish_import_controls: "Регулювання привозу"
  establish_import_controls_desc: "Нам не можна допустити, щоб наші виробники втрачали прибуток через чужоземні товари. Ми почнемо офіційно обмежувати потік товарів, що надходять на наш ринок, щоб захистити вітчизняну промисловість і забезпечити конкурентоспроможність наших купців."
  fund_trade_expeditions: "Опікуватися торговими експедиціями"
  fund_trade_expeditions_desc: "Купецькі гільдії готові вкладатися в заморські комерційні експедиції, але такі підприємства вимагають законного оформлення та підтримки з боку зборів."
  establish_commodity_exchange: "Заснування товарної біржі"
  establish_commodity_exchange_desc: "У наших ринкових осередках кипить життя, але немає біржі, де можна було б організовано торгувати оптовими товарами. Повноцінна товарна біржа збільшить прибутковість наших ринків на заздрість усім сусідам."
  promote_maritime_trade: "Заохочення морської торгівлі"
  promote_maritime_trade_desc: "Морські шляхи — це широкі дороги, що ведуть сміливих мандрівників до багатств. Нам потрібно вкладатися в розвиток інфраструктури та інститутів, які забезпечують морську торгівлю, а також сприяти тому, щоб наші купці панували над морями."
  license_trading_companies: "Ліцензування торгових компаній"
  license_trading_companies_desc: "Ризики та винагороди, пов’язані із заморською торгівлею, такі великі, що окремі купці з ними не впораються. Нам потрібно ліцензувати створення офіційних торгових компаній, які накопичуватимуть сировину та ділитимуть ризики між учасниками. Їхня діяльність піде на користь усій країні."
  establish_customs_houses: "Заснування митниць"
  establish_customs_houses_desc: "Наші кордони проникні, і чужоземні купці отримують великий прибуток з товарів, які без обліку проникають на наші ринки. Будівництво митниць дозволить врегулювати привіз, і країна разом із вітчизняними купцями отримає свою справедливу частку цього багатства."
  fund_artisan_guilds: "Опікуватися ремісничими спілками"
  fund_artisan_guilds_desc: "Вправні ремісники в нашій країні виробляють товари виняткової майстерності, але без належної організації та підтримки вони не можуть реалізувати весь свій потенціал. Ми повинні взяти під опіку та надати заступництво спілкам, що представляють їхні інтереси."
  establish_trade_insurance: "Страхування для купців"
  establish_trade_insurance_desc: "Торговці беруть на себе безліч ризиків: то й діло трапляються корабельні аварії, розбійницькі напади, війни. Нерідко це відлякує купців затівати вигідні для країни підприємства. Ми впровадимо можливість страхувати купців, щоб вони охочіше йшли на ризик."
  expand_postal_relay_network: "Розширити мережу поштових становищ"
  expand_postal_relay_network_desc: "Надійний зв’язок — це основа комерції. Наші купецькі доми готові фінансувати систему поштових становищ (станцій, ямів), завдяки яким передача повідомлень і перевезення товарів стануть швидшими, ніж будь-коли раніше. Таке вкладення багаторазово окупить себе."
  establish_common_food_stores: "Общинні комори"
  establish_common_food_stores_desc: "Наші піддані живуть у страху перед неврожаями та голодом. Ми побудуємо спільні комори, щоб навіть у найстрашніший неврожай у люду залишалися запаси."
  promote_farming_innovation: "Заохочення новацій у землеробстві"
  promote_farming_innovation_desc: "Нові методи сівозміни та культивації показали чудові результати в інших землях. Нашим землеробам потрібно переймати чужоземний досвід, щоб і наші поля давали багаті врожаї, а співвітчизники менше страждали від нужди."
  sponsor_irrigation_projects: "Субсидування іригаційних проєктів"
  sponsor_irrigation_projects_desc: "У багатьох регіонах нашої країни поля могли б давати більше врожаю, якби до них можна було підвести воду. Нам потрібно субсидувати будівництво зрошувальних каналів та іригаційних споруд, щоб перетворити сухі землі на тучні ріллі."
  reduce_serfdom: "Скоротити кріпосну залежність"
  reduce_serfdom_desc: "Кріпацтво важким ярмом висить на шиї простого люду. Воно прив’язує селян до землі та обмежує їхню працю, якою вони годують нас усіх. Ми полегшимо цей тягар і дамо людям більше свободи пересування, а за це вони віддячать нам вірністю та зростанням виробітку."
  establish_village_councils: "Організація сільських рад"
  establish_village_councils_desc: "Нашими селами та містечками керують пани, які самі живуть далеко, не розуміють місцевих турбот і не особливо ними цікавляться. Ми створимо сільські ради та наділимо їх владою вирішувати місцеві питання: у селян з’явиться право голосу та можливість самостійно підтримувати порядок."
  charter_artisan_guilds: "Ремісничі гільдії"
  charter_artisan_guilds_desc: "Майстри та робітники працюють у своїх майстернях, які не визнані офіційно. Об’єднання ремісників у гільдії дозволить регламентувати їхню працю та допоможе завоювати довіру тих людей, завдяки яким багатіє країна."
  subsidize_grain_imports: "Субсидування привозу хліба"
  subsidize_grain_imports_desc: "Наші ринки здатні прогодувати народ, але тільки якщо ціни на хліб залишатимуться доступними для простолюду. Субсидії на привіз збіжжя дозволять уникнути голоду та не дадуть народу впадати у відчай."
  rural_crafts_charter: "Організація сільських ремісників"
  rural_crafts_charter_desc: "Монополії гільдій душать кустарні виробництва, якими сільські родини годують себе в часи неврожаю. Нам слід захистити сільських ремісників від цього гніту та організувати їх, щоб дати простому люду економічну свободу, на яку він заслуговує."
  prevent_noble_enclosure: "Запобігання поміщицькому обгороджуванню"
  prevent_noble_enclosure_desc: "Наші знатні землевласники вже занадто давно відбирають общинну землю, на якій селяни добувають собі прожиток. Нам потрібно захистити те небагато, що залишилося в народу, поки не почалися заворушення."
  declare_war_taxes: "Введення воєнного податку"
  declare_war_taxes_desc: "Воєнні потреби вимагають витрат, які не можна покрити звичайними доходами. Збори повинні схвалити надзвичайні податки для всіх станів — це спільний обов’язок в ім’я виживання та слави країни."
  wartime_cavalry_reserve: "Воєнний резерв кінноти"
  wartime_cavalry_reserve_desc: "Вирішальна битва може відбутися будь-якої миті, і ми повинні бути впевнені, що наша важка кіннота до неї готова. Нехай шляхетні родини підтримують боєготовність своїх найкращих вершників до закінчення війни."
  fortify_frontier_passes: "Укріплення прикордонних перевалів"
  fortify_frontier_passes_desc: "Слабке місце наших кордонів — це перевали, якими ворог може прийти на нашу землю. Нам потрібно вкластися в укріплення кожного вразливого переходу, щоб природні кордони нашої землі стали неприступною фортецею для всіх, хто насмілився б до нас вторгнутися."
  military_chaplaincy: "Військові священники"
  military_chaplaincy_desc: "Наші війська б’ються не лише за монарха та вітчизну, а й за віру. Полкові священники у складі військ зміцнять бойовий дух вояків і допоможуть їм стійко переносити тяготи та злигодні походів."
  establish_field_hospitals: "Польові шпиталі"
  establish_field_hospitals_desc: "Занадто багато наших вояків гине не від ворожих мечів, а від ран, які можна було б вилікувати, та від хвороб, яким можна було б запобігти. Нехай церква організує у наших військах польові шпиталі, які рятуватимуть життя нашим бійцям."
  naval_supply_contracts: "Підрядне постачання флоту"
  naval_supply_contracts_desc: "Наш флот не може виходити в море без постачання, а купецькі гільдії можуть його надавати. Якщо ми укладемо з ними підряди на тилове забезпечення флоту, залоги наших кораблів зможуть воювати, не боячись залишитися без припасів."
  fund_siege_engineers: "Спонсорування облогових інженерів"
  fund_siege_engineers_desc: "Ворожі мури не впадуть самі собою, для цього потрібні ті, хто вміє їх руйнувати. Наші міські гільдії можуть оплачувати навчання інженерів та будівництво облогових знарядь, що допоможе нам брати найнеприступніші фортеці."
  wartime_harvest_pooling: "Запаси харчів для військ"
  wartime_harvest_pooling_desc: "Війна війною, а обід за розкладом: голодні бійці гірше воюють. Необхідно організувати запаси харчів в регіональних коморах, щоб наш народ міг годувати війська, які його захищають."
  supply_line_labor_draft: "Трудова повинність на шляхах постачання"
  supply_line_labor_draft_desc: "Дороги, якими припаси постачаються у війська, потрібно обслуговувати без шкоди руху ресурсів. Мирні люди можуть допомагати фронту, працюючи на лініях постачання. Така праця важлива не менше, ніж ратна справа."
  royal_road_commission: "Королівська комісія шляхів сполучення"
  royal_road_commission_desc: "Шляхи нашої країни — це судини, які забезпечують лад і рух товарів. Організація та обслуговування повноцінної мережі державних шляхів дозволить нам контролювати кожен куточок наших володінь."
  mountain_pass_charters: "Хартії над гірськими перевалами"
  mountain_pass_charters_desc: "Наші шляхетні роди володіють гірськими перевалами, що розділяють країну. Якщо ми зобов’яжемо їх обслуговувати та охороняти ці переходи, то окремі провінції більше не будуть ізольовані від центральної влади."
  establish_parish_waypoints: "Заснування парафіяльних станцій"
  establish_parish_waypoints_desc: "Шляхи нашої країни протяжні, подорожувати ними виснажливо як для посланців, так і для простих подорожніх. Церква може побудувати станції на основних трактах і допомагати всім, хто подорожує нашими землями."
  coastal_trading_post_network: "Мережа берегових факторій"
  coastal_trading_post_network_desc: "Наша берегова лінія багата на природні гавані та зупинки, які не використовуються через відсутність інфраструктури. Якщо купці вкладуться в побудову мережі берегових факторій, то витрати та ризики для морської торгівлі знизяться, а далекі провінції стануть досяжнішими для столиці."
  rural_road_upkeep_corvee: "Повинність з обслуговування сільських шляхів"
  rural_road_upkeep_corvee_desc: "Наші сільські шляхи заростають без організованого обслуговування. Якщо ми покладемо на селян посильне завдання з розчищення місцевих шляхів, то жоден із теренів нашої країни не буде відрізаний від центру."
