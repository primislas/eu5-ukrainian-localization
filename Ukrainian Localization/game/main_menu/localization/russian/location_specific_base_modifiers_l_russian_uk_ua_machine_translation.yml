l_russian:
  STATIC_MODIFIER_NAME_freiberg_base: "Срібні рудники Фрайберга"
  STATIC_MODIFIER_DESC_freiberg_base: "Видобувати тут руду почали ще в XII столітті. Згодом ці рудні стали одним із головних джерел срібла в Центральній Європі."
  STATIC_MODIFIER_NAME_falun_base: "Стура-Коппарберг"
  STATIC_MODIFIER_DESC_falun_base: "Більша частина європейської міді видобувається в цій рудні."
  STATIC_MODIFIER_NAME_golconda_base: "Алмазні рудники Голконди"
  STATIC_MODIFIER_DESC_golconda_base: "Тут видобувають бездоганні та найдорогоцінніші алмази в усьому світі."
  STATIC_MODIFIER_NAME_skane_herring_market: "Ринок оселедця в Сконе"
  STATIC_MODIFIER_DESC_skane_herring_market: "З початку XIII століття тут знаходиться найбільший ринок оселедця в усій Скандинавії."
  STATIC_MODIFIER_NAME_almaden_base: "Ртутні рудники Альмадена"
  STATIC_MODIFIER_DESC_almaden_base: "У цих рудниках видобувається третина всього споживаного у світі обсягу ртуті."
  STATIC_MODIFIER_NAME_huancavelica_base: "Ртутні рудники Уанкавеліки"
  STATIC_MODIFIER_DESC_huancavelica_base: "Це один із найважливіших рудників Південної Америки: тут знаходяться величезні поклади ртуті."
  STATIC_MODIFIER_NAME_idrija_base: "Ртутні рудники Ідрії"
  STATIC_MODIFIER_DESC_idrija_base: "У цих копальнях розташовані великі поклади ртуті — як у рідкому вигляді, так і у вигляді твердої кіноварі."
  STATIC_MODIFIER_NAME_lanmuchang_base: "Ртутні рудники Ланьмучана"
  STATIC_MODIFIER_DESC_lanmuchang_base: "Це найважливіший ртутний рудник у Китаї з часів античності."
  STATIC_MODIFIER_NAME_potosi_base: "Серро-Ріко-дель-Потосі"
  STATIC_MODIFIER_DESC_potosi_base: "У цьому руднику біля підніжжя гори Потосі розташовуються найбагатші у світі срібні жили."
  STATIC_MODIFIER_NAME_zacatecas_base: "Срібні рудники Сакатекаса"
  STATIC_MODIFIER_DESC_zacatecas_base: "Це найбагатші срібні рудники Мезоамерики."
  STATIC_MODIFIER_NAME_guanajuato_base: "Срібні рудники Гуанахуато"
  STATIC_MODIFIER_DESC_guanajuato_base: "Найбагатші срібні рудники Центральної Мексики."
  STATIC_MODIFIER_NAME_spice_islands_base: "Гвоздика з Островів прянощів"
  STATIC_MODIFIER_DESC_spice_islands_base: "На цьому острові у великих кількостях вирощується дорогоцінна пряність — гвоздика."
  STATIC_MODIFIER_NAME_nile_delta_rice_base: "Родюча дельта Нілу"
  STATIC_MODIFIER_DESC_nile_delta_rice_base: "Заплавні землі Нілу ідеально підходять для вирощування будь-яких культур."
  STATIC_MODIFIER_NAME_nile_delta_wheat_base: "$STATIC_MODIFIER_NAME_nile_delta_rice_base$"
  STATIC_MODIFIER_DESC_nile_delta_wheat_base: "$STATIC_MODIFIER_DESC_nile_delta_rice_base$"
  STATIC_MODIFIER_NAME_nile_delta_sugar_base: "$STATIC_MODIFIER_NAME_nile_delta_rice_base$"
  STATIC_MODIFIER_DESC_nile_delta_sugar_base: "$STATIC_MODIFIER_DESC_nile_delta_rice_base$"
  STATIC_MODIFIER_NAME_nile_delta_cotton_base: "$STATIC_MODIFIER_NAME_nile_delta_rice_base$"
  STATIC_MODIFIER_DESC_nile_delta_cotton_base: "$STATIC_MODIFIER_DESC_nile_delta_rice_base$"
  STATIC_MODIFIER_NAME_nile_delta_legumes_base: "$STATIC_MODIFIER_NAME_nile_delta_rice_base$"
  STATIC_MODIFIER_DESC_nile_delta_legumes_base: "$STATIC_MODIFIER_DESC_nile_delta_rice_base$"
  STATIC_MODIFIER_NAME_nile_delta_fiber_crops_base: "$STATIC_MODIFIER_NAME_nile_delta_rice_base$"
  STATIC_MODIFIER_DESC_nile_delta_fiber_crops_base: "$STATIC_MODIFIER_DESC_nile_delta_rice_base$"
  STATIC_MODIFIER_NAME_nile_delta_fruit_base: "$STATIC_MODIFIER_NAME_nile_delta_rice_base$"
  STATIC_MODIFIER_DESC_nile_delta_fruit_base: "$STATIC_MODIFIER_DESC_nile_delta_rice_base$"
  STATIC_MODIFIER_NAME_coffee_yemen_base: "Аравійська кава"
  STATIC_MODIFIER_DESC_coffee_yemen_base: "У благодатній землі Ємену рясно зростають кавові боби."
  STATIC_MODIFIER_NAME_sahara_salt_mines_base: "Соляні копальні Сахари"
  STATIC_MODIFIER_DESC_sahara_salt_mines_base: "Тут видобувається більша частина солі, яку купці перевозять через Сахару."
  STATIC_MODIFIER_NAME_sikar_copper_mines_base: "Мідний рудник Кхетрі"
  STATIC_MODIFIER_DESC_sikar_copper_mines_base: "Завдяки багатим мідним покладам Кхетрі рудокопи ніколи не залишаться без роботи."
  STATIC_MODIFIER_NAME_nishapur_gems_mines_base: "Бірюзовий рудник Нішапура"
  STATIC_MODIFIER_DESC_nishapur_gems_mines_base: "Копальні Нішапура багаті запасами дорогоцінної бірюзи."
  STATIC_MODIFIER_NAME_panjshir_valley_silver_mines_base: "Срібло з Панджшерської ущелини"
  STATIC_MODIFIER_DESC_panjshir_valley_silver_mines_base: "Багатство срібних рудників у Панджшерській ущелині належатиме будь-кому, хто ними володіє."
  STATIC_MODIFIER_NAME_turda_salt_mines_base: "Соляна копальня Турди"
  STATIC_MODIFIER_DESC_turda_salt_mines_base: "У копальні біля Турди розташовані найбагатші запаси солі в Прикарпатті."
  STATIC_MODIFIER_NAME_kutna_hora_silver_mines_base: "Срібний рудник Кутна-Гори"
  STATIC_MODIFIER_DESC_kutna_hora_silver_mines_base: "Срібний рудник Кутна-Гори — найбагатший у всій Богемії."
  STATIC_MODIFIER_NAME_rammelsberg_silver_mines_base: "Срібний рудник Раммельсберга"
  STATIC_MODIFIER_DESC_rammelsberg_silver_mines_base: "Рудник під Раммельсбергом вельми багатий покладами срібла."
  STATIC_MODIFIER_NAME_mali_gold_mines_base: "Золоті рудники Малі"
  STATIC_MODIFIER_DESC_mali_gold_mines_base: "Золоті рудні Буре — головне джерело легендарного багатства манси Муси."
  STATIC_MODIFIER_NAME_kremnica_gold_mines: "Золотий рудник Кремниці"
  STATIC_MODIFIER_DESC_kremnica_gold_mines: "У руднику Кремниці розташовуються найбагатші запаси золота в Прикарпатті."
  STATIC_MODIFIER_NAME_srebrenica_silver_mines_base: "Срібний рудник Сребрениці"
  STATIC_MODIFIER_DESC_srebrenica_silver_mines_base: "У руднику Сребрениці розташовуються найбагатші запаси срібла на Балканах."
  STATIC_MODIFIER_NAME_newfoundland_fishing_grounds_base: "Рибні промисли Ньюфаундленду"
  STATIC_MODIFIER_DESC_newfoundland_fishing_grounds_base: "Навколо острова Ньюфаундленд вирують води, найбагатші рибою в усьому світі."
  STATIC_MODIFIER_NAME_amber_coast_base: "Бурштиновий берег"
  STATIC_MODIFIER_DESC_amber_coast_base: "На місцевому узбережжі багато покладів бурштину."
  STATIC_MODIFIER_NAME_sicily_sulfur_mines: "Сірчаний рудник Сицилії"
  STATIC_MODIFIER_DESC_sicily_sulfur_mines: "Сірчані копальні Сицилії повні речовини, необхідної для виробництва пороху."
  STATIC_MODIFIER_NAME_damascus_base: "Звичаї дамаських зброярів"
  STATIC_MODIFIER_DESC_damascus_base: "Дамаск з давніх-давен славиться своїми чудовими мечами. Місцеві ковалі шанують звичаї та виготовляють зброю неперевершеної майстерності."
  STATIC_MODIFIER_NAME_flanders_fine_cloth_base: "Спадщина фламандських сукнарів"
  STATIC_MODIFIER_DESC_flanders_fine_cloth_base: "Чудове сукно, що його виготовляють фламандські ткачі — майстри своєї справи та опікуни багатовікових звичаїв, — вирізняється неймовірною якістю, а тому має великий попит у Європі, попри високу ціну."
  STATIC_MODIFIER_NAME_tuscany_fine_cloth_base: "Спадщина тосканських ткачів"
  STATIC_MODIFIER_DESC_tuscany_fine_cloth_base: "Флоренція та Лукка здавна славляться як найкращі міста — виробники тканин в усій Італії. Майстерність місцевих цехів — предмет заздрощів для всього континенту."
  STATIC_MODIFIER_NAME_venice_glass_base: "Спадщина муранських склодувів"
  STATIC_MODIFIER_DESC_venice_glass_base: "Склодуви з Мурано — справжні майстри, які бережуть спадщину, що передається з покоління в покоління. Їхнє скло вирізняється неперевершеною якістю."
  STATIC_MODIFIER_NAME_toledo_weaponry_base: "Спадщина толедських зброярів"
  STATIC_MODIFIER_DESC_toledo_weaponry_base: "Ще з прадавніх часів Толедо славиться як місто, де виготовляють клинки неймовірної якості. З місцевої руди, багатої на залізо, толедські ковалі здатні викувати найгостріший меч."
  STATIC_MODIFIER_NAME_bilbao_iron_base: "Баскські поклади заліза"
  STATIC_MODIFIER_DESC_bilbao_iron_base: "У Біскаї розташовані одні з найбагатших покладів найякіснішої залізної руди в Іберії. Руда з Більбао має величезний попит серед ковалів з усього півострова."
  STATIC_MODIFIER_NAME_milan_weaponry_base: "Спадщина міланських зброярів"
  STATIC_MODIFIER_DESC_milan_weaponry_base: "Мілан та Брешія — зброярські столиці Європи: тут виготовляють обладунки та зброю незрівнянної якості."
  STATIC_MODIFIER_NAME_yorkshire_cloth_base: "Йоркширські суконні промисли"
  STATIC_MODIFIER_DESC_yorkshire_cloth_base: "Йоркшир та Іст-Мідлендс — землі з розвиненими суконними промислами. Місцеві ткачі постачають на ринки високоякісне сукно."
  STATIC_MODIFIER_NAME_england_wool_base: "Край англійської вовни"
  STATIC_MODIFIER_DESC_england_wool_base: "У цьому краю виробляють чи не найкращу у світі вовну, яка має великий попит серед торговців тканинами з усієї Європи."
  STATIC_MODIFIER_NAME_bengal_cotton_base: "Вирощування бавовни у Бенгалії"
  STATIC_MODIFIER_DESC_bengal_cotton_base: "Спекотний та вологий клімат Бенгалії чудово підходить для вирощування високоякісної бавовни. Завдяки природним умовам Бенгалія — один із головних виробників бавовни у світі."
  STATIC_MODIFIER_NAME_gujarat_cotton_base: "Вирощування бавовни у Гуджараті"
  STATIC_MODIFIER_DESC_gujarat_cotton_base: "У родючих долинах Гуджарату рясно росте бавовна — основа основ, без якої була б неможливою торгівля тканинами."