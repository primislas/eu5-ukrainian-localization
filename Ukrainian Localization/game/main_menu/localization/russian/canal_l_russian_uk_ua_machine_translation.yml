l_russian:
  DECISION_CATEGORY_INFRASTRUCTURE: "Інфраструктура"
  CANAL_CONSTRUCTING: "Будівництво каналу в [LOCATION.Custom('LR_PREP')|l] [LOCATION.GetNameWithNoTooltip]"
  CANAL_CONST_DETAILS_TIP: "Новий судноплавний канал, що сполучає два моря, буде збудовано в [LOCATION.Custom('LR_PREP')|l] [LOCATION.GetNameWithNoTooltip]."
  suez_canal_advance: "Проєкт Суецького каналу"
  suez_canal_advance_desc: "Провести дослідження й розпочати будівництво каналу через Суецький перешийок, щоб відкрити прямий шлях між Середземним і Червоним морями."
  panama_canal_advance: "Проєкт Панамського каналу"
  panama_canal_advance_desc: "Провести дослідження й розпочати будівництво каналу через Панамський перешийок, щоб сполучити Атлантичний і Тихий океани."
  close_canal_to_enemies: "Закрити канал для всіх, крім союзників"
  close_canal_to_enemies_desc: "Дозволити на час війни прохід нашими каналами виключно союзникам і підданим. Прохід ворогів блокується автоматично; нейтральні країни й суперники також блокуються."
  open_canal_to_all: "Відкрити канал для всіх"
  open_canal_to_all_desc: "Зняти обмеження й знову відкрити прохід каналом для всіх країн, з якими ми зараз не воюємо."
  CANAL_LOCATION_DESC: "Судноплавний канал перетинає цю місцевість, відкриваючи прохід між морями, які він сполучає."
  CANAL_LOCATION_RESTRICTED: "Прохід зараз обмежений лише для союзників і підданих власника каналу."