  iberian_military_order_type: "Іберійський військовий орден"
  iberian_military_order_type_desc: "Такі братства, народжені Реконкістою, поєднують лицарські мечі з чернечими обітницями. Їхні [Concept('holdings', 'володіння')|E], розташовані біля кордонів із маврами, скликають місцеве ополчення і слугують постійними залогами там, куди не сягає рука корони."
  RELIGIOUS_ORDER_TYPE_ACTIVE_ORDERS_TITLE: "Чинні ордени"
