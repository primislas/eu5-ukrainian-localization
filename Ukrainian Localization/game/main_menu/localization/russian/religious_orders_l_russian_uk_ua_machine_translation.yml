  monastic_order_type: "Чернечий орден"
  monastic_order_type_desc: "Католицьке духовне братство, у [Concept('holdings', 'володіннях')|E] якого ченці віддаються молитві, пошуку знань та обробітку землі."
  mendicant_order_type: "Жебручий орден"
  mendicant_order_type_desc: "Католицькі ченці, які склали обітницю бідности й живуть подаянням. Вони проповідують, навчаються та піклуються про знедолених у наших селах і містах."
  ORDER_HOLDING: "Володіння"
  ORDER_OF_LOCATION_NAME_PATTERN: "Орден місцевости $LOCATION$"
  ORDER_HOLDING_TITLE: "[Concept('holding', 'Володіння')|E] духовного ордена"
  ORDER_HOLDING_ORDER: "[Concept('religious_order', 'Духовний орден')|e]: [ReligiousOrder.GetName]"
  ORDER_HOLDING_MODIFIER_TITLE: "Ефект місцевости"
  ORDER_HOLDING_DEMAND_TITLE: "Місячне утримання"
  ORDER_HOLDING_DEMAND_ENTRY: "[GOODS.GetIcon][GOODS.GetName]: $VAL|2$"
  crusaders_calling: "Хрестоносці"
  crusaders_calling_desc: "Войовничий орден, що присвятив себе боротьбі з іновірцями у хрестовому поході."
  wardens_calling: "Вартові"
  wardens_calling_desc: "Прикордонний орден, що присвятив себе службі в порубіжних залогах."
  confidants_calling: "Писарі"
  confidants_calling_desc: "Придворне братство, що присвятило себе службі правлячому дому та державному врядуванню."
  mariners_calling: "Мореплавці"
  mariners_calling_desc: "Орден хрестоносців, що присвятив себе морським битвам і дослідженню земель за межами християнського світу."
  contemplatives_calling: "Містики"
  contemplatives_calling_desc: "Закритий орден, що присвятив себе молитві, літургії та аскезі."
  scholars_calling: "Богослови"
  scholars_calling_desc: "Орден, зайнятий переписуванням книг, навчанням священників, а також загальним розвитком наук і мистецтв."
  cultivators_calling: "Землероби"
  cultivators_calling_desc: "Реформований орден, ченці якого розчищають пустища та обробляють на них поля."
  preachers_calling: "Місіонери"
  preachers_calling_desc: "Чернечий орден, що присвятив себе проповідям, наверненню невірних і захисту догматів віри."
  almoners_calling: "Опікуни"
  almoners_calling_desc: "Ці ченці склали обітницю бідности й живуть милостинею, але готові віддати останній окраєць хліба, піклуючись про стражденних і знедолених."
  confessors_calling: "Сповідники"
  confessors_calling_desc: "Ці ченці, які живуть у миру, приймають сповіді й лагідно спрямовують людські душі до світла."
  CALLING_PREFERRED_SOCIETAL_VALUES_TITLE: "Бажані [Concept('societal_values', 'суспільні цінності')|E]"
  CALLING_LOCATION_MODIFIER_TITLE: "За [Concept('holding', 'володіння')|E]"
  CALLING_COUNTRY_MODIFIER_TITLE: "За країну присутності (з урахуванням впливу, ревності та вірності)"
  order_of_calatrava_religious_order: "Орден Калатрави"
  order_of_calatrava_religious_order_desc: "Заснований у 1158 р. цистерціанським абатом Раймондом із Фітеро для оборони фортеці Калатрава після того, як її покинули тамплієри. Перший власний військовий орден Кастилії."
  order_of_santiago_religious_order: "Орден Сантьяго"
  order_of_santiago_religious_order_desc: "Заснований близько 1170 р. для охорони прочан, які йдуть до Сантьяго-де-Компостели, та священної війни з маврами."
  order_of_alcantara_religious_order: "Орден Алькантари"
  order_of_alcantara_religious_order_desc: "Заснований близько 1166 р. як орден Сан-Хуліан де Перейро, у 1218 р. він отримав у володіння місто Алькантара і прийняв його назву."
  order_of_christ_religious_order: "Орден Христа"
  order_of_christ_religious_order_desc: "Заснований у 1319 р. королем Дінішем як спадкоємець переслідуваних тамплієрів, цей орден успадкував усі їхні португальські володіння, включно із замком-конвентом у Томарі."
  order_of_avis_religious_order: "Авіський орден"
  order_of_avis_religious_order_desc: "Цей португальський орден, пов’язаний із бенедиктинцями, отримав свою назву на честь Авіського замку, який у 1211 р. став його резиденцією."
  order_of_montesa_religious_order: "Орден Монтеси"
  order_of_montesa_religious_order_desc: "Заснований у 1317 р. королем Яковом II Арагонським для нагляду за колишніми володіннями тамплієрів та госпітальєрів в Арагоні. Його резиденцією став замок Монтеса у Валенсії."
  benedictine_order_religious_order: "Бенедиктинці"
  benedictine_order_religious_order_desc: "Устав цього ордену, укладений Бенедиктом Нурсійським у VI столітті, став підвалиною всього європейського чернецтва. Його абати належать до вищих ієрархів церкви."
  cistercian_order_religious_order: "Цистерціанці"
  cistercian_order_religious_order_desc: "Цей орден виник у 1098 р. унаслідок реформи монастиря Сіто, яка повернула суворе тлумачення бенедиктинського уставу. Він відомий тим, що його ченці та послушники зобов’язані працювати, зокрема розчищати й обробляти землю."
  augustine_order_religious_order: "Августинці"
  augustine_order_religious_order_desc: "Ці священники, що живуть у миру за уставом блаженного Августина, не є ані повноцінними ченцями, ані білим духовенством. Їхні громади служать у соборах, утримують школи й лікарні, а також опікуються парафіями."
  dominican_order_religious_order: "Домініканці"
  dominican_order_religious_order_desc: "Орден проповідників, заснований Домініком де Гусманом для боротьби з єрессю за допомогою вчености й усного слова. Його ченці обіймають університетські кафедри та ведуть богословські диспути на найбільших соборах християнського світу."
  franciscan_order_religious_order: "Францисканці"
  franciscan_order_religious_order_desc: "Менші брати Франциска Ассізького, які в наслідуванні Христа склали обітниці цілковитої бідности. Вони ходять серед міських злидарів, збираючи милостиню та проповідуючи віру власним прикладом."
  MODIFIER_TYPE_NAME_invite_religious_order_price_cost_modifier: "Ціна надання володіння"
