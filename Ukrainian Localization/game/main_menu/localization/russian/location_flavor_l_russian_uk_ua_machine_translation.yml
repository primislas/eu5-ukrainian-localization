l_russian:
  stockholm_desc: "Стокгольм був заснований у 1252 році Біргером Магнуссоном у тому місці, де озеро Меларен впадає в Балтійське море. Завдяки своєму стратегічному розташуванню місто не тільки контролювало доступ до озера, а й слугувало великим торгом, що пов’язував Швецію з купецькими мережами Ганзи в Балтиці."
  paris_desc: "Париж, що стоїть на річці Сені, поступово перетворився зі скромного поселення на справжню перлину Франції. Завдяки своєму знаменитому собору, великим ринкам та навчальним закладам він став одним із найважливіших політичних і культурних осередків Європи."
  london_desc: "Лондон, збудований в гирлі річки Темзи, пройшов довгий шлях від невеликого римського поселення до найбільшого міста Англії. Тепер тут зосереджена вся політична та господарська міць королівства."
  rome_desc: "Колись Рим був осердям могутньої імперії, чиї володіння простягалися на кілька частин світу. Втім, навіть після її падіння Вічне місто змогло зберегти своє політичне та духовне значення, перетворившись на столицю Папської держави."
  jerusalem_desc: "Єрусалим є місцем перетину авраамічних віровчень, а тому має особливе значення для юдеїв, християн та мусульман. Історія та вигляд цього священного міста сформувалися під впливом безлічі завоювань та паломників, що прибувають сюди з усіх країв світу."
  alexandria_desc: "Александрія, колись відома своїм грандіозним маяком та бібліотекою, розташована на стику різних цивілізацій та культур. Завдяки цьому вона і сьогодні залишається важливим торговим та освітнім осередком Середземномор’я."
  constantinople_desc: "Оточений могутніми стінами, Константинополь був серцем Східної Римської імперії та місцем розташування собору Святої Софії — одного з найбільших у світі храмів. Протягом тисячі років велич і багатство цього міста були предметом заздрості для всього світу."
  sitges_desc: "У Середні віки на пагорбі, де сьогодні розташовується будівля муніципалітету, було збудовано замок. Спочатку він належав архієпархії Барселони, проте у XII столітті перейшов до родини, на честь якої і отримав свою назву."
  valladolid_desc: "Вальядолід був заснований наприкінці XI століття графом Педро Ансуресом та його дружиною Ейло Альфонсо у самому серці Північної Месети, поблизу річки Пісуерга. Завдяки торгівлі Вальядолід швидко став одним із найважливіших міст у регіоні поряд з Бургосом. До XIV століття він набув такого значного впливу, що слугував урядовим осередком країни за регентства Марії де Моліни та її онука Альфонсо XI."
  penafiel_desc: "Місто Пеньяф’єль, чия назва походить від латинського #italic Pinna Fidelis#! («Вірна скеля»), було засноване в X столітті. Спочатку воно являло собою невеликий аванпост на вершині пагорба, призначений для відбиття набігів з боку Кордовського халіфату. Граф Санчо Гарсія значно зміцнив його і в 1013 році надав йому фуерос — особливі міські права та привілеї. Згодом Пеньяф’єль перейшов у володіння впливового дона Хуана Мануеля і став вельми багатим містом із розвиненим виноробством."
  toro_desc: "Торо був заснований у X столітті в долині річки Дуеро для захисту володінь Королівства Леон від військ Кордовського халіфату. Завдяки своєму вигідному розташуванню місто слугувало важливим оборонним вузлом, а теплий клімат та родючі землі дозволили йому також стати великим осередком виноробства."
  thessaloniki_desc: "Довгий час Фессалоніки вважалися другим за значенням містом Візантії після Константинополя. Своїм багатством вони завдячують вигідному розташуванню поблизу Егейського моря, що сприяє розвитку торгівлі. При цьому місцеві порти слугують свого роду мостом між Заходом і Сходом, дозволяючи перевозити крам між імперськими володіннями та Італією."
  malmo_desc: "Мальме контролює прохід кораблів через протоку Ересунн, що з’єднує Балтійське та Північне море. У зв’язку з цим місто є найважливішим стратегічним пунктом, захист якого забезпечують його міцні стіни та пильна залога."
  bilbao_desc: "Більбао був заснований у 1300 році Дієго Лопесом де Аро, сеньйором Біскайї. Це місто, розташоване в гирлі річки Нервьон, незабаром стало великим торгом та осередком кораблебудування в Північній Іспанії. Крім того, завдяки своїй розвиненій портовій інфраструктурі Більбао слугував місцем, звідки купці перевозили місцеву залізну руду та кастильську мериносову вовну в англійські та фламандські порти."
  radom_desc: "Після свого розширення та оновлення королем Казимиром III місто Радом стало важливим політичним осередком Польщі та залишалося ним аж до кінця доби Відродження. Саме тут у 1401 році було укладено Віленсько-Радомську унію, і тут же на сеймі 1505 року було ухвалено закон #italic Nihil novi#!."
  krakow_desc: "Про поселення на Вавельському пагорбі було відомо ще в давнину, проте вперше Краків згадується в документі від 965 року, де описується як велике торгове місто. У 1038 році Краків став осідком польських монархів з династії П’ястів, і з того часу слугував одним із головних урядових, господарських та культурних осередків Польського королівства."
  megara_desc: "У давнину Мегарою правив легендарний герой Ніс, а деякі її уродженці заснували у Середземномор’ї такі великі міста, як Візантій, Херсонес та Селінунт. Надалі Мегара стала великим торгом і набула величезного впливу на теренах Греції — багато в чому завдяки своєму потужному флоту. Однак з того часу вона втратила більшу частину своєї могутності, і нині від її колишньої величі залишилася лише тінь."
  grojec_desc: "До XII століття в Груйці розташовувалася Познанська архієпархія та резиденція місцевого каштеляна, проте у зв’язку зі зростанням впливу сусіднього міста Черська він поступово втратив своє значення."
  gdansk_desc: "Перша письмова згадка про Гданськ належить до 997 року, проте поселення там існувало задовго до цього. В добу пізнього Середньовіччя Гданськ перетворився на великий торговий порт та осередок кораблебудування, завдяки чому він став одним із найбагатших та найвпливовіших міст Східної Європи."
  athens_desc: "Афіни вважалися культурним осередком Стародавньої Греції та були одним із наймогутніших міст-держав свого часу. Змагаючись зі Спартою, Фівами та іншими античними країнами, Афіни поступово домоглися панування в Егейському морі. Пізніше місто було завойоване спочатку Македонською, а потім Римською та Візантійською імперіями, через що занепало. Проте після 1204 року Афіни знову повстали, ставши столицею новоствореної країни хрестоносців."
  wieliczka_desc: "Величка була заснована в 1290 році Пшемислом II поблизу соляних копалень. Видобуток цього цінного продукту приносив Польщі величезний прибуток, у зв’язку з чим місто отримало безліч привілеїв і стало великим виробничим осередком. Так, копальні у Величці та сусідній Бохні стали частиною соледобувної компанії #italic «Краківські жупи»#!, яка забезпечувала їхню роботу до кінця XX століття. В офіційних документах за містом довгий час зберігалася його стара назва #italic Wielka Sól#!, що означає #italic «велика сіль»#!."
  leksand_desc: "Це містечко на південному березі озера Сільян існує вже понад тисячу років. У XII столітті тут була побудована церква, першим протестантським головою якої був далекий предок Юхана Андерссона — провідного гейм-дизайнера Europa Universalis V."
  leipzig_desc: "Лейпциг, заснований у 1165 році на перетині #italic Імперської#! та #italic Королівської#! доріг, досить швидко розбагатів та розширився завдяки торгівлі хутром. Отримавши низку значних привілеїв, він став великим торгом Європи та одним з осередків книгодрукування в регіоні."
  augsburg_desc: "Вільне імперське місто Аугсбург, відоме під назвою #italic Августа Вінделіков#! в роки правління імператора Траяна, вважається одним із найстаріших міст Священної Римської Імперії. У 955 році місцевій залозі вдалося відбити напад угорських військ, внаслідок чого значення міста помітно зросло. У 1276 році король Рудольф I дарував Аугсбургу статус імперського міста, що ознаменувало новий етап у його розвитку та посприяло його подальшому процвітанню."
  warsaw_desc: "На зорі своєї історії Варшава являла собою невелике мозавецьке рибальське поселення. У 1596 році Сигізмунд III переніс столицю з Кракова до Варшави, після чого вона почала стрімко зростати і вже до XVIII століття стала найбільшим містом Польщі. У цей же час тут перебудували та звели безліч будівель, що значно посприяло розвитку польської архітектури та різних ремесел."
  tunis_desc: "Засноване легендарною царицею Дідоною у 814 році до нашої ери, спочатку це місто носило назву Карфаген і було столицею однойменної пунічної країни. Унаслідок трьох великих війн воно було зруйноване, а потім наново відбудоване римлянами. Сучасне місто Туніс було закладене арабами у 698 році неподалік від стародавніх карфагенських руїн. Після завоювання Альмохадів у XII столітті місто фактично стало регіональною столицею, і під час правління династії Хафсідів цей статус лише зміцнився."
  heidelberg_desc: "Наприкінці XII століття Гейдельберг став резиденцією пфальцграфа Рейнського, у зв’язку з чим тут було зведено значний замок. Пізніше в цьому місті було засновано перший університет Німеччини, завдяки чому він став важливим науковим та освітнім осередком. У ході Реформації Гейдельберг приєднався до протестантського руху, що вплинуло на створення Євангелічної унії на чолі з Пфальцом. В добу романтизму образ Гейдельберзького замку привабив до міста безліч поетів, тож воно навіть отримало прізвисько #italic «місто романтики»#!."
  aviles_desc: "Авілес був заснований у X столітті на теренах гирла однойменної річки, завдяки чому він набув важливого стратегічного значення як порт. У розташованому поблизу замку Гаусон король Астурії Альфонсо III наказав виготовити Хрест перемоги — прикрашену золотом і дорогоцінним камінням реліквію, яка згодом стала символом королівства. У XI столітті Авілес отримав статус королівського міста і став одним із осередків морської торгівлі, в якому також зберігалися значні запаси солі, видобутої в інших регіонах країни."
  pingjin_desc: "Тайюань, де розташований священний храм Цзінь, ще з V століття до нашої ери є одним із найважливіших міст Шаньсі та всього Північного Китаю. У 979 році, в ході завоювання Північної Хань, імператор Тай-цзун наказав затопити та знищити місто. На знак тріумфу та приниження своїх ворогів, він перейменував захоплений регіон на Пінцзінь, що означає «умиротворення Шаньсі». Унаслідок затоплення від міста залишилися лише руїни, і на його відновлення пішло багато десятків років."
  dunstable_desc: "Данстейбл виник на місці стародавнього римського поселення. Вже в Середні віки англійці заснували тут монастир. За свою довгу історію місто пережило низку історичних подій. Зокрема, тут розлучився зі своєю дружиною Генріх VIII, а великий полководець Олівер Кромвель набирав в навколишніх землях добровольців для участі у громадянській війні. Крім того, тут розташовується стара резиденція Генріха I та один з дванадцяти пам’ятних хрестів Елеонори."
  paderborn_desc: "З моменту свого заснування близько 800 року Падерборн слугував осередком місцевого єпископства. Саме тут вперше зустрілися Карл Великий і папа римський Лев III. За час Тридцятилітньої війни місто зазнало великих збитків: воно пережило 16 облог, останню з яких влаштувало шведське військо у 1646 році."
  porto_desc: "Саме від #italic «непереможеного міста»#! Порту походить назва Португалії та знаменитого на весь світ портвейну, що виготовляється в долині річки Дору."
  jiaxing_desc: "Цзясін розташований на кордоні між регіонами У та Юе. Слово «цзя» в його назві означає «краса», а «сін» — «процвітання»."
  torgau_desc: "У 1452 році курфюрст Фрідріх II наказав створити біля замку в Торгау рів з ведмедем. Рів поступово розширювався аж до 1624 року, і в якийсь момент міг вміщати кілька ведмедів одночасно."
  changsha_desc: "З часів побудови місто Чанша протягом двох тисяч років залишалося головним господарським та урядовим осердям краю."
  ningxiang_desc: "У Нінсяні було знайдено найбільший бронзовий #italic цзунь#! (ритуальний посуд для вина), виготовлений понад 3000 років тому за часів правління династії Шан."
  wurzburg_desc: "Вюрцбург був утворений на місці франконської фортеці у 741 році, коли поселення, що знаходилося там, отримало статус єпископства. У ранньому Середньовіччі місто процвітало головним чином за рахунок свого вигідного розташування на річці Майн, якою проходило багато торгових шляхів."
  hanover_desc: "Зі скромного поселення Ганновер поступово перетворився на одне з ключових міст Священної Римської Імперії. Під правлінням династії Вельфів місто стало розвиненим торговим та культурним осередком, який до того ж мав великий політичний вплив."
  osnabruck_desc: "У Середні віки Оснабрюк слугував осередком місцевого єпископства та великим торгом Священної Римської імперії. Серед іншого місто відоме тим, що в ньому було підписано одну з двох угод, що призвели до укладення Вестфальського миру."
  glasgow_desc: "Глазго виник навколо середньовічного собору, який слугував резиденцією місцевого архієпископства. У XV столітті тут був заснований університет, який сприяв становленню Глазго як освітнього осередку Шотландії."
  neva_desc: "Санкт-Петербург був закладений у дельті річки Неви, яка колись була частиною варяго-грецького торгового шляху. Засноване у 1703 році, це місто слугувало столицею Росії понад 200 років."
  dubno_desc: "Місто Дубно, вперше згадане у 1100 році, було великим торговим осередком Волині, відомим своїми великими ярмарками. У 1492 році тут було зведено замок, довкола якого розгортаються події повісті Миколи Гоголя #italic «Тарас Бульба»#!."
  baden_desc: "Початкове поселення на цьому місці було засноване римлянами і носило назву #italic Civitas Aurelia Aquensis#!. В добу раннього Середньовіччя місто стало відоме як Баден, і пізніше ця назва також перейшла до Баденського дому династії Церінгенів, який почав правити цими землями."
  erbach_desc: "Наприкінці XVIII століття граф Франц I, який виявляв велику цікавість до стародавніх реліквій, виділив кошти на створення в Ербаху цеху різьбярів, що займався виготовленням виробів з виробної кістки. Завдяки цьому місто привабило безліч митців і стало одним з головних осередків цього ремесла."
  manhattan_desc: "Колись населений народом ленапе, острів Манна-хата був придбаний голландськими поселенцями в обмін на крам загальною вартістю всього 60 гульденів. Тут вони побудували фортецю, яка стала осередком влади Нового Амстердама."
  doncaster_desc: "Через Донкастер, відомий раніше під римською назвою Данум, проходила Велика північна дорога, якою мандрівники та торговці перевозили крам між Лондоном та північними землями. Завдяки такому вигідному розташуванню Донкастер до 1337 року став одним із найбагатших міст Йоркшира."
  kitchissippi_desc: "Це місто було названо на честь річки Кічісіпі, нині відомої як Оттава. У цих землях народ анішинабе займався полюванням та торгівлею, поки британські поселенці не розширили вирубку лісів і не заснували тут місто, що стало осідком їхнього колоніального уряду."
  saint_marceilin_desc: "Заснований в XI столітті, Сен-Марселлен слугував резиденцією ради дофіна в період з 1337 по 1340 рік. Це місто також славиться своїм м’яким сиром зі зморшкуватою скоринкою, який подавали при королівському дворі щонайменше з 1461 року."
  caerphilly_desc: "У валлійських долинах видобувалося найякісніше вугілля в Європі, завдяки чому у другій половині XVIII століття цей край став важливим осередком виробництва заліза."
  grenoble_desc: "Гренобль — невелике, але стратегічно важливе місто в Альпах, яке є столицею провінції Дофіне. Воно оточене річками та горами, тому чудово підходить для оборони місцевих земель, у зв’язку з чим тут була зведена фортеця Бастилія. Навколо місцевого собору простягаються вузькі звивисті вулиці, де живуть і працюють купці, ремісники та селяни, що привозять сюди крам з сусідніх долин."
  kinsale_desc: "Кінсейл — невелике, але вельми жваве портове містечко, розташоване в природній гавані на південному узбережжі Ірландії. Основними заняттями містян є риболовля та торгівля. Так, місцеві купці обмінюють рибу, шкури та вовну на вино, сіль та предмети розкоші з Іберії та Франції. На вузьких вулицях навколо причалів часом зустрічаються іноземні торговці, з якими ірландські моряки обмінюються історіями та укладають угоди. Незважаючи на скромні розміри гавані, саме вона дозволила Кінсейлу стати стратегічно важливим портовим містом, яке з’єднало Ірландію з континентальною Європою."
  stockton_desc: "Стоктон — англосаксонське поселення на північному березі річки Тіс. Воно залишалося вельми малонаселеним доти, доки єпископ не звільнив місцевих кріпаків, що привабило сюди безліч купців та ремісників. Завдяки цьому Стоктон став важливим торговим містом, яке займалося продажем місцевої вовни та привозом заморських вин. Однак по-справжньому великим містом Стоктон став лише після промислової революції."
  kunow_desc: "Кунів з раннього Середньовіччя перебував у віданні Краківської архієпархії, проте парафія тут з'явилася лише у 1281 році. Своєю назвою місто, швидше за все, завдячує куницям, які у великій кількості водилися в навколишніх лісах."
  lublin_desc: "Люблін був заснований на рубежі XII–XIII століть, а статус міста отримав від Владислава Локетека у 1317 році. У наступні століття Люблін перетворився на великий торговий осередок, чий розквіт припав на XVI століття. Саме в цей час була укладена Люблінська унія, яка й дозволила місту збагатитися за рахунок розвитку торгівлі зі Сходом."
  kendal_desc: "Кендал був заснований на місці римського військового містечка, яке виникло на березі річки Кент ще в I столітті нашої ери. Поселення активно розвивалося за норманів: отримавши в 1189 році від короля Річарда I право на торгівлю в обмін на грошову підтримку його хрестового походу, Кендал почав процвітати і з часом став важливим осередком середньовічної торгівлі вовною. Головний замок міста належав родині Парр, найвідомішою представницею якої була Катерина — дружина короля Генріха VIII."
  cairo_desc: "Місто Аль-Кагіра («Переможне») було закладене в 969 році фатимідським полководцем Джаугаром ас-Сакалі неподалік від давньої римської фортеці Вавилон. Невдовзі воно відібрало в Александрії звання головного міста Єгипту. За Аюбідів та мамлюків воно перетворилося на найлюдніше місто ісламського світу, чиї ринки та мечеті приваблювали купців, учених і паломників із трьох континентів. У 1258 році монголи зруйнували Багдад, і Каїр залишився безперечною столицею ісламської цивілізації — містом надзвичайної величі, чиї мінарети височіли над долиною річки, яка годувала людей із незапам’ятних часів."
  dadu_desc: "У 1267 році на рівнинах на південь від хребта Тайханшань Хубілай-хан звів Даду — «Велику столицю», престольне місто своєї династії Юань на руїнах чжурчженського Чжунду. Марко Поло був вражений величчю цього міста, описуючи його широкі вулиці, неосяжні палаци та комори, що вгиналися від багатств з усього Китаю. Навіть коли могутність монголів пішла на спад, місто міцно закріпилося в ролі північної брами між степом і серединними землями Китаю, залишаючись важливим осередком імперії."
  venice_desc: "Венеція, що виросла на мулистих мілинах Адріатичної лагуни, народилася з потреби й розвивалася завдяки великим амбіціям. Утікачі, які рятувалися від вторгнення лангобардів, знайшли прихисток на цих островах, а до IX століття місто перетворилося на морську республіку під орудою виборного дожа. Спорудивши Арсенал і незліченні торгові контори, венеційські купці здобули владу над шляхами, що тягнулися від Чорного моря до самого Леванту. Вони зробили Венецію найбагатшим містом християнського світу й безперечною володаркою середземноморської торгівлі."
  moscow_desc: "Москва була заснована в 1147 році Юрієм Долгоруким як маленька дерев’яна фортеця на берегах Москви-ріки й довго перебувала в тіні давніших міст Руси. Однак під гнітом монгольського ярма московські князі виявили дивовижну здатність до виживання та розширення володінь: вони справно збирали данину для Золотої Орди, поступово приєднуючи сусідні князівства. Вдале розташування на перехресті північних річкових шляхів дало змогу місту зростати завдяки торгівлі, і до початку XIV століття його великий князь мав більшу владу, ніж будь-який інший правитель на Русі."
  tenochtitlan_desc: "Згідно з переказами народу мешика, їхній бог Віцилопочтлі пообіцяв привести їх туди, де орел сидить на кактусі, і приблизно в 1325 році на болотистому острівці посеред озера Тескоко вони заснували Теночтітлан. Молоде поселення зростало з приголомшливою швидкістю — сама природа дарувала йому захист, а навколишні озерні береги щедро ділилися багатствами. Згодом дамби, плавучі сади та сильні воїнські звичаї перетворять його на найвеличніше місто обох Америк — і серце грізної імперії."
  delhi_desc: "На західному березі Ямуни з прадавніх часів змінювали один одного престоли й династії — і місто Делі слугувало осередком влади для всіх, хто правив цією землею. У 1206 році династія мамлюків заснувала тут Делійський султанат, а за таких правителів, як Ілтутмиш та Ала ад-Дін аль-Хіліджі, місто стало головною ісламською столицею Південної Азії. Сюди, до величних мечетей, ринків і фортець, стікалися вчені та купці з усього ісламського світу, і завдяки цьому Делі зміцнив свою роль осередку, який керував величезною частиною субконтиненту."
  prague_desc: "Прага, закладена над закрутом річки Влтави, перетворилася зі слов’янського поселення на мілководді на одне з найвеличніших міст середньовічної Європи. Династія Пржемисловичів звела свій замок і собор на скелястому мисі Градчани, і під їхнім захистом розквітло велелюдне купецьке місто. Прага слугувала резиденцією чеських королів і лежала на роздоріжжі між сходом і заходом Європи, приваблюючи німецьких та юдейських купців, ремісників і вчених. До початку XIV століття вона стала одним із найлюдніших і найбагатших міст на північ від Альп."
  vienna_desc: "Римляни називали Відень #italic Віндобоною#! — це була фортеця легіонерів на Дунаї, що стояла на сторожі північних рубежів імперії. Коли Велике переселення народів змело римські порядки, місто відродилося вже як резиденція маркграфів Бабенбергів, які на тому самому стратегічному рубежі звели місто до пари своїм амбіціям. А коли в 1278 році Габсбурги змінили Бабенбергів, Відень перетворився на оплот династичної імперії. Завдяки своєму розташуванню в серці дунайської долини місто стало однією з найважливіших стратегічних опор Священної Римської імперії."
  baghdad_desc: "У 762 році аббасидський халіф Аль-Мансур заснував на західному березі річки Тигр місто, яке від самого початку замислювалося як осердя усього світу. У його головній фортеці — легендарному Круглому місті — розмістилися палац халіфа та велика мечеть, а ринки й житлові квартали розходилися від нього променями. На піку аббасидської могутності в Багдаді проживало понад мільйон людей, а до його Будинку мудрости стікалися вчені з усього відомого світу — перекладати книги, брати участь у суперечках і робити відкриття. Навала монголів у 1258 році поклала край цій золотій добі, але місто вистояло, залишившись найвеличнішою метрополією між Тигром і Євфратом."
  florence_desc: "Флоренція розкинулася по обох берегах Арно в самому серці Тоскани й пройшла шлях від римської колонії до міста купців і банкірів, які перекроїли європейську торгівлю. Великі банківські доми — Барді, Перуцці, Строцці — надавали позики багатьом королівствам, а золотий флорин їхнього карбування став загальновизнаною валютою для міжнародних угод. Флоренція, яку роздирала ворожнеча #italic гвельфів#! та #italic гібелінів#! і якою керували могутні цехи, була містом кипучої громадянської гордості та нечуваних багатств. Усе це закладало підґрунтя для розквіту мистецтв і думки, який невдовзі змусить увесь світ їй заздрити."
  samarkand_desc: "Самарканд, одне з найдавніших міст Центральної Азії, розкинувся в самому серці Шовкового шляху — там, де каравани з шовком, прянощами та ідеями йшли від Китаю до Середземномор’я. За Саманідів та Караханідів він став великим ісламським осередком ученості й ремесла, а його майстри славилися в усьому відомому світі своєю тонкою роботою по металу та виготовленням паперу. Війська Чингісхана спустошили місто в 1220 році, але вигідне розташування на великих торгових шляхах не дало йому змарніти — і базари з майстернями знову притягують до себе половину всієї світової торгівлі."
  novgorod_desc: "Пан Великий Новгород, як із гордістю величали його самі містяни, перетворився з варязького торгового стану на Волхові на наймогутнішу купецьку республіку Північної Європи. Його виборні збори, #italic віче#!, керували містом на демократичних засадах, що було рідкістю у феодальному світі, а ганзейські торгові партнери везли новгородське хутро, віск і бурштин на ринки від Лондона до Любека. Коли інші руські міста пали під монгольськими набігами 30-х років XIII століття, північне розташування вберегло Новгород, давши йому змогу зберегти статус найбагатшого та найнезалежнішого міста Руси."
  lisbon_desc: "Лісабон розташувався в природній гавані, де Тежу зустрічається з Атлантикою, і слугував притулком для мореплавців та купців ще з часів фінікійців. Римляни укріпили його й нарекли ім’ям #italic Олісіпо#!, а в VIII столітті мавританські правителі перетворили місто на квітучий калейдоскоп мечетей і палаців. Коли в 1147 році Афонсу I за підтримки лицарів-хрестоносців відвоював його, Лісабон став столицею новонародженого Португальського королівства та життєво важливим атлантичним портом. Його глибока гавань і зверненість на захід уже тоді спонукали досліджувати невідомий океан, що простягався далеко за небокрай."
  sevilla_desc: "Севілья розкинулася по берегах Гвадалківіру на родючих рівнинах Андалусії, ставши однією з перлин мавританської Іспанії. За Омеядів, а пізніше за Альмохадів вона розвивалася як осередок культури, науки й торгівлі, а її велика мечеть височіла над річкою як справжнє свідчення розмаху ісламської цивілізації на іберійській землі. У 1248 році Фердинанд III Кастильський відвоював Севілью, але вона зберегла свій багатонаціональний колорит і стала найбагатшим містом християнської Іспанії, чий річковий порт відправляв щедрі дари Андалусії у великий світ."
  hangzhou_desc: "Відоме в пору свого розквіту як #italic Кінсай#! — «тимчасова столиця», — місто Ханчжоу стало прихистком південної династії Сун, коли в 1127 році північ упала під натиском чжурчженської держави Цзінь. Марко Поло, який відвідав місто наприкінці XIII століття, назвав його найвеличнішим містом у світі, особливо відзначивши канали, шовкові ринки та просторі площі, де люди раз у раз обмінювалися найрізноманітнішим крамом. Навіть після монгольського завоювання в 1279 році, завдяки розташуванню біля витоків Великого каналу та пануванню над торгівлею шовком і порцеляною, місто вистояло й залишилося одним із найважливіших в усьому Китаї."
  bruges_desc: "За часів розквіту середньовічної торгівлі Брюгге був найбільшим ринком Північної Європи — до його причалів стікалися венеційські галери, ганзейські коги та іберійські каравели, щоб звільнити свої трюми від вантажу. Брюгге був заснований біля припливної бухти, що сполучала місто з Північним морем, і розбудував суконні ряди та власну біржу — як вважають, першою у світі, — що зробило його фінансовою столицею півночі. Від англійської вовни до левантійських прянощів — багатства всього відомого світу текли крізь його канали та купецькі контори."
  cologne_desc: "Кельн був заснований римлянами в 50 році нашої ери як #italic Колонія Агріппіна#!, а згодом виріс у найбільше місто середньовічної Німеччини й одне з наймогутніших архієпископств Священної Римської імперії. Його величний готичний собор, закладений у 1248 році для зберігання мощей Трьох королів, став символом віри та амбіцій. Кельн був вільним імперським містом і одним із засновників Ганзейської унії. Він панував над важливим рейнським торговим шляхом і слугував брамою між Північним морем та серцем імперії."
  bursa_desc: "Бурса, укрита під схилами Віфінського Олімпу, була квітучим візантійським містом, поки в 1326 році османський вождь Орхан не підкорив її після десятирічної облоги. Орхан зробив Бурсу першою справжньою столицею османської держави: звів там мечеті, караван-сараї та критий базар, які на століття визначили вигляд міста. Бурса слугувала західною межею для караванів Шовкового шляху зі Сходу, але й сама виробляла найтонший у світі шовк, що зробило її містом незліченних багатств — і тим самим зерном, яке невдовзі дасть життя Османській імперії."
  kyoto_desc: "Коли в 794 році імператор Камму переніс сюди двір і нарік нову столицю #italic Хейан-кьо#! — Столицею миру і спокою, — місто Кіото на сотні років стало серцем японської цивілізації. Мережа широких вулиць, усіяна аристократичними маєтками та буддійськими храмами, стала домом для найвитонченішої придворної культури тих часів, подарувавши світові поезію, живопис і літературу доби Хейан. Міжусобні війни, пожежі та піднесення самураїв не раз струшували стіни міста, проте воно вистояло, ставши імператорською столицею та культурним осередком Японії."
  timbuktu_desc: "Тімбукту розташувався біля самого краю Сахари, в закруті Нігеру, і виріс із сезонного туарезького табору в одне з найвеличніших середньовічних міст Африки. За часів імперії Малі він став осередком транссахарської торгівлі: тут північні каравани із сіллю перетиналися із золотом та слоновою кісткою, що йшли з півдня. Мечеті та #italic медресе#! міста приваблювали ісламських учених з усього континенту, перетворивши Тімбукту на обитель знань, чиї бібліотеки зберігали десятки тисяч рукописів із богослов’я, математики та астрономії."
  barcelona_desc: "Барселона була заснована в I столітті до нашої ери як римська колонія #italic Барцінон#! і з часом стала столицею графства Каталонія, а до XII століття — морським осередком Арагонської корони. Барселонський вплив купецьких флотилій та консульств простягався від Балеарських островів до Сицилії та від Сардинії до портів хрестоносців у Греції, що зробило це місто провідною морською силою Західного Середземномор’я. На пагорбах під величним собором і давніми римськими мурами вирувала міська торгівля — і люди дедалі частіше звертали погляд до моря в пошуках багатства та призначення."
  cordoba_desc: "У свою золоту добу Кордова була найвеличнішим містом Західної Європи з брукованими вулицями та громадськими лазнями, ставши домом для пів мільйона людей. Її мережа бібліотек перевершувала будь-які подібні досягнення християнського світу. За Абд ар-Рахмана III, який проголосив себе халіфом у 929 році, вона стала столицею халіфату, що кинув виклик і Аббасидам у Багдаді, і Каролінгам на півночі. Тут жили такі мислителі, як Ібн Рушд та Маймонід, а Велика мечеть — #italic Мескіта#! — стала пам’яткою тієї надзвичайної цивілізації, яка пустила коріння на іберійській землі. Взяття міста Фердинандом III Кастильським у 1236 році поклало край цій добі, але її спадщина вціліла — у тих знаннях, які Кордова зберегла й передала решті світу."
  damascus_desc: "Дамаск — одне з найдавніших міст, у якому протягом усієї його історії завжди жило багато людей. Він панує над родючим оазисом біля підніжжя хребта Антиліван, а його ринки живляться водами річки Барада. У VII та VIII століттях Дамаск був столицею Омеядського халіфату — серцем найбільшої на той час імперії, і його Велика мечеть уособлювала одне з найвеличніших досягнень ісламської архітектури. Навіть після того, як Аббасиди зробили столицею Багдад, Дамаск залишався одним із головних торгових та культурних осередків Леванту, на базарах якого торгували шовком, тонкими клинками та запашними трояндами, якими він особливо славився."
  angkor_desc: "У глибині лісів материкової Південно-Східної Азії кхмерські царі Ангкору звели столицю, рівної якій світ ще не знав. Грандіозний храмовий комплекс Ангкор-Ват був закладений за Сурьявармана II на початку XII століття, був присвячений Вішну й замислювався як земний прообраз світобудови: його рови зображували космічний океан, а вежі — вершини священної гори Меру. У пору розквіту в Ангкорі та околицях було створено складну мережу водосховищ і зрошувальних каналів, завдяки чому він став одним із найбільших міських утворень доіндустріального світу."
  vijayanagar_desc: "У 1336 році на південному березі річки Тунгабгадра брати Гарігара та Букка Рая заснували Віджаянагар — «Місто перемоги», покликане стати твердинею індуїстської цивілізації проти зростаючої сили Делійського султанату. Під захистом Тунгабгадри та неприступного ландшафту з гранітних валунів і скелястих ущелин місто вже на світанку свого становлення панувало над родючими рівнинами Центрального Декану. Згодом із цієї кам’яної твердині виросте імперія, яка простоїть понад два століття, а купці на її ринках торгуватимуть крамом з усього Індійського океану."
  naples_desc: "Неаполь був заснований близько 600 року до нашої ери як грецька колонія на березі мальовничої бухти. Він устиг побувати в руках римлян, візантійців, норманів та Гогенштауфенів, перш ніж Анжуйська династія у 1266 році зробила його столицею Неаполітанського королівства. За Анжуйців Неаполь перетворився на один із найвеличніших королівських дворів середньовічної Європи та найлюдніше місто Італії, а через його порт багатство Меццоджорно вирушало у великий світ. Неаполітанський двір приваблював учених, митців та богословів, зокрема — Тому Аквінського, який тут викладав і тут-таки закінчив свої дні. Усе це зробило місто осередком не лише династичної влади, а й культури."
  milano_desc: "Мілан зародився в серці Паданської рівнини як поселення кельтів, але пам’ять про це стерлася, коли римляни перетворили його на #italic Медіолан#!, який свого часу фактично слугував столицею Західної імперії. Навали варварів ударили по його величі, але згодом місто розквітло вже як вільна комуна, відбивши напад Фрідріха Барбаросси та його імперських військ у битві під Леньяно в 1176 році. Під владою роду Вісконті, який захопив синьйорію наприкінці XIII століття, Мілан почав підпорядковувати собі навколишні міста Ломбардії, аж поки не перетворився на панівне місто-державу Північної Італії."
  genoa_desc: "Під надійним захистом дуги Лігурійських Апеннін Генуя вибудувала свою велич, пов’язавши її зі стихією моря. Місцеві купці та флотоводці вибудували морську країну — мережу факторій і колоній від Чорного моря до Атлантики — а її флотилії знову й знову стикалися з венеційськими, виборюючи панування над середземноморською торгівлею. Неприборкане честолюбство великих родин Доріа, Грімальді та Спінола принесло республіці горде прізвисько #italic La Superba#! — «Пречудова» — і довело, що навіть місто, яке майже не має власної землі, може стати одним із найбагатших і найвпливовіших у християнському світі."
  bologna_desc: "Болонья лежить біля підніжжя Апеннін, там, де Емілієва дорога сходиться зі шляхами, що ведуть на північ, до Паданської рівнини. Вона виросла з етруської #italic Фельсіни#!, а згодом — римської колонії #italic Бононії#!. Але насамперед це місто славиться своїм університетом, заснованим у 1088 році, — найстарішим у світі. До його лекційних залів під двома середньовічними вежами-близнюками з усіх куточків Європи стікалися студенти, щоб вивчати право, медицину та філософію. Багатство купців, влада єпископів та незалежність міської комуни робили Болонью одним із найжаданіших міст у політичній боротьбі середньовічної Італії."
  palermo_desc: "На північному узбережжі Сицилії, між двома мисами, фінікійські купці заснували Палермо. За карфагенян, а згодом за візантійців він виріс у велике місто, а після завоювання арабами в IX столітті перетворився на квітучу ісламську метрополію з мечетями, садами та базарами. Норманські королі, які відвоювали місто в арабів у 1072 році, звели на цьому багатонаціональному підґрунті дещо дивовижне: сплавивши воєдино арабські, візантійські та латинські звичаї, вони явили світові сяйливі королівські капели та палаци — цій цивілізації не було рівних у християнському світі. Ставши столицею норманського королівства Сицилія, а згодом і імперії Гогенштауфенів, Палермо перетворився на один із найвитонченіших і наймогутніших королівських дворів Середньовіччя."
  verona_desc: "Верона, що розкинулася по обох берегах річки Адідже біля південних відрогів Альп, з античних часів була тим містом, куди ведуть усі дороги. Її величезний римський амфітеатр — один із найбільших і найкраще збережених — як і раніше, підноситься над вулицями, які колись ділили легіонери та купці. Під владою сімейства делла Скала, або Скалігерів, які захопили місто наприкінці XIII століття, Верона стала однією з найсильніших синьйорій Північної Італії: її правителі панували над Венето і простягли свою правицю до самої Адріатики. Серед тих, хто знайшов притулок при дворі Скалігерів, був і Данте Аліг’єрі — свою #italic «Комедію»#! він завершив під опікою Кана Гранде делла Скала за довгі роки флорентійського вигнання."
  siena_desc: "Сієна виросла на трьох пагорбах у самому серці Тоскани й стала однією з великих країн середньовічної Італії. Її багатство будувалося на банківській справі та торгівлі вовною: купецькі родини міста були позикодавцями і для королів, і для пап. Запекле суперництво з Флоренцією — до неї було заледве п’ятдесят кілометрів на північ — роками впливало на історію обох міст. А головна площа Сієни, Кампо, слугувала підмостками для суспільного життя та політичних драм однієї з найгордіших італійських комун. Витвори Дуччо ді Буонінсеньї та братів Лоренцетті перетворили Сієну на один із провідних осередків готичного мистецтва в Європі."
  pisa_desc: "В гирлі річки Арно пізанці вибудували одну з найвеличніших морських країн середньовічного Середземномор’я. Флотилії Пізи грабили Палермо в 1063 році, громили сарацинських корсарів по всьому Тірренському морю та засновували торгові колонії від Сардинії до Антіохії. На багатства, що ринули від цієї торгівлі, пізанці звели на #italic П’яцца-деи-Міраколі#! — Площі чудес — дивовижний ансамбль: собор, баптистерій та дзвіницю — пам’ятки місту, чиє багатство та могутність у XII столітті, на вершині своєї слави, здавалися воістину безмежними. Катастрофічна поразка від Генуї в битві біля Мелорії 1284 року поклала край морським амбіціям Пізи, але місто та його незрівнянні пам’ятки збереглися до наших днів."
  padova_desc: "За переказами, Падую заснував троянський герой Антенор, і ще в римську добу вона вважалася одним із найбагатших міст Італії. До Середніх віків вона стала квітучою комуною в самому серці області Венето. У 1222 році група вчених залишила Болонью і заснувала тут власний університет, який швидко посів перші місця серед європейських шкіл права та медицини, приваблюючи сюди студентів з усього континенту. На початку XIV століття уславлений митець Джотто перетворив інтер’єр Капели дель Арена і створив витвір, який став віхою західного мистецтва, а сама Падуя під владою роду Каррара розквітла як двір, де вченість ішла пліч-о-пліч із честолюбними замислами."
  ferrara_desc: "Феррара, що виросла біля берегів болотистої дельти По, пройшла шлях від скромної річкової переправи до міста, чий вигляд визначили амбіції дому Есте — вони утвердилися тут як синьйори в XIII столітті. Під їхньою тривалою опікою місто стало осередком лицарської культури та витонченого придворного життя: синьйори приймали тут поетів, влаштовували турніри та вчені диспути, провадячи обережну політику в умовах суперництва Мілана, Венеції та папських володінь. Широкі прямі вулиці та величний замок Есте, що стали характерною рисою Феррари, підкреслювали вигляд міста, де лад та витонченість важили не менше, ніж стіни та військо."
  parma_desc: "Римляни заснували Парму на Емілієвій дорозі у 183 році до нашої ери, і з часом вона стала одним із найвеличніших міст Ломбардської рівнини. Розташування на великому шляху між Міланом та Болоньєю, а також родючі навколишні поля зробили її незмінно квітучим і жаданим містом. Як вільна комуна вона увійшла до числа найдіяльніших членів Ломбардської ліги, що виступила проти Фрідріха Барбаросси. Довгі роки місто роздирала запекла ворожнеча гвельфів та гібелінів, і воно не раз переходило з рук у руки синьйорів, що змінювали один одного. Кафедральний собор і баптистерій, зведені в романському стилі XII століття, уособлювали суспільне благочестя та багатство, яким судилося пережити всі політичні потрясіння комунальної доби."
  mantova_desc: "З трьох боків Мантую оточують озера, народжені неквапливою течією Мінчо, — на півночі Італії знайдеться небагато місць, настільки ж надійно захищених самою природою; люди селилися тут ще з бронзової доби. Римляни шанували її як батьківщину Вергілія, найвидатнішого зі своїх поетів, і доля міста з давніх-давен була нерозривно пов’язана з мистецькими та літературними прагненнями його правителів. На початок XIV століття тут піднісся рід Гонзага, і під їхньою тривалою опікою Мантуя мала вирости в один із найвитонченіших і найосвіченіших дворів Італії."
  lucca_desc: "Лукка, обплутана давньоримською мережею вулиць і оточена багатими шовковими угіддями в області Гарфаньяна, була одним із найбагатших міст середньовічної Італії. Її купці розселилися по всій Європі: їхні банкірські доми та торгівля шовком зробили слово #italic «лукканський»#! синонімом найвишуканішого сукна на ринках Парижа, Лондона та Брюгге. А в самому місті тим часом накопичувалися багатства, яких вистачило на зведення найвеличніших романських церков у всій Тоскані. Хоча Піза та Флоренція не раз загрожували Лукці, вона відстоювала свою незалежність із дивовижною запеклістю — міцні стіни та палка суспільна гордість забезпечували їй свободу ще довго після того, як міста-суперники потрапили під владу синьйорів."
  messina_desc: "Грецькі колоністи, які заснували місто на березі вузької протоки між Сицилією та італійським материком, назвали його #italic Занкла#! — на честь вигнутої серпом гавані. Уже тоді розташування зробило Мессіну одним із найважливіших стратегічних портів Середземномор’я. Саме через Мессіну в 1061 році норманці почали завоювання Сицилії, і згодом через її гавань ішли війська всіх наступних діб — анжуйські та гогенштауфенські; навіть війська хрестоносців на шляху до Святої Землі перетинали тут кордон між сходом і заходом. Землетруси та політичні чвари не раз спустошували місто, але завдяки винятковій природній гавані воно незмінно поверталося до життя, однаково приваблюючи до цих берегів і купців, і загарбників."
  brescia_desc: "Брешія розташувалася там, де альпійські передгір’я спускаються до Ломбардської рівнини. У середньовічній Італії це місто належало до головних виробничих осередків: його кузні на всю Європу славилися зброєю та обладунками чудової якості. Як вільна комуна Брешія була однією з найдіяльніших учасниць Ломбардської ліги, а мужність, із якою її жителі чинили опір імперським військам, лягла в основу звичаїв Північної Італії. Брешія була затиснута між амбітними Міланом та Венецією, але залишалася жаданим містом для обох сторін завдяки розташуванню біля альпійських перевалів та майстерності своїх ремісників."
  cremona_desc: "Римляни заснували Кремону як прикордонну колонію у 218 році до нашої ери на південному березі річки По, і з часом вона перетворилася на одне з найвеличніших міст Ломбардської рівнини. Розташування на річці зробило місто природним перехрестям сухопутних і водних торгових шляхів, що пов’язували схід із заходом. Під час запеклих воєн між імператорами та папами Кремона стала уособленням непохитної вірності гібелінам; місто дорого платило за свою відданість, але натомість отримувало надзвичайну імператорську ласку та чималі багатства. Над його вулицями підноситься величний #italic Торраццо#! — найвища середньовічна дзвіниця в усій Італії — та численні вежі родин, що суперничали між собою. Цей ансамбль утілює бурхливу суспільну гордість: владу тут демонстрували з тим самим неприборканим палом, із яким і виявляли."
  pavia_desc: "Протягом двох століть після падіння Рима Павія залишалася столицею Лангобардського королівства в Італії — обителлю войовничих королів і хранителькою їхньої залізної корони. Для каролінзьких імператорів це місто слугувало італійським осідком, але воно зберегло статус королівського та коронаційного осередку навіть після того, як лангобардські землі поглинула Франкська імперія. Університет Павії, один із найстаріших в Італії, процвітав уже у IX столітті. А розташування на річці Тічино, яка закриває підступ із заходу до Паданської рівнини, перетворювало місто на жаданий трофей для будь-якої країни, що прагнула панування на півночі."
  perugia_desc: "Перуджа височіє на пагорбі над долиною верхнього Тибру. У давнину вона була одним із дванадцяти міст Етрурії, згодом стала квітучим римським муніципієм, а в Середні віки перетворилася на одну з найгрізніших і найнеспокійніших незалежних комун Центральної Італії. Величний палац Палаццо-дей-Пріорі та фонтан Маджоре, прикрашені у 1278 році скульптурами Нікколо та Джованні Пізано, втілили суспільну гордість та мистецькі амбіції, яким не було рівних у всій Тоскані. А заснований тут у 1308 році університет підтвердив прагнення Перуджі увінчати свою військову та політичну міць не менш гучною вченою славою."
  ancona_desc: "Вигнанці із Сиракуз, висадившись на Адріатичному узбережжі, заснували Анкону як грецьку колонію. Своєю назвою місто завдячує грецькому слову «лікоть» — воно нагадує про круто вигнутий мис, який із півночі захищає гавань від вітрів. У Середні віки Анкона стала найважливішим портом Центральної Адріатики, а її купці вели жваву торгівлю з візантійським Константинополем та портами Леванту. Хоч як намагалися папи та імператори підпорядкувати місто своїй волі, Анкона запекло відстоювала незалежність, а її гавань і флот слугували гарантами свободи, яку тут ревно оберігали протягом століть."
  aquila_desc: "Л’Акуїла — одне з наймолодших великих міст середньовічної Італії. Його заснували приблизно у 1254 році, об’єднавши майже сотню сіл Абруцького нагір’я. Кажуть, що кожне поселення пожертвувало новому місту церкву, фонтан, квартал і дзвона. Місто розташувалося високо в Апеннінах, у самому серці гірського королівства, і дивовижно швидко стало столицею Абруццо. Вигідне розташування та міцні стіни надійно оберігали його від зазіхань ворожих синьйорів та підступів далекого неаполітанського двору. Обставини появи наділили Л’Акуїлу надзвичайно складним укладом. Майже сотня громад-засновниць зберегла за собою частку міської самосвідомості — звідси та химерна багатоликість і неприборкана місцева гордість, якою не могло похвалитися жодне місто на півдні Італії."
  ravenna_desc: "Лише одне коротке, але дивовижне століття Равенна побула останньою столицею Західної Римської імперії. Коли у 476 році Рим упав, саме тут, при дворах Одоакра, а згодом короля остготів Теодоріха, старанно підтримувалися форми та звичаї римської влади. Коли Візантія в VI столітті відвоювала місто, воно стало західним форпостом Константинополя та резиденцією Равеннського екзархату. Саме в цю добу грецького панування місцеві майстри створили дивовижні мозаїчні візерунки, якими наповнені церкви та мавзолеи міста. Пізніше Равенну затьмарили Болонья та міста Паданської рівнини, що набирали сили, але у своїх незвичайних витворах мистецтва вона зберегла пам’ять про імперську велич, рівної якій не знайти більше ніде на латинському Заході."
  salerno_desc: "Місто Салерно розташувалося між морем і горами Амальфітанського узбережжя, у затишній бухті. Коли в 1076 році норманський завойовник Роберт Гвіскар захопив місто, Салерно став першою фортецею норманської влади на півдні Італії й слугував столицею, доки королівський двір не перебрався до Палермо. Основну славу місту принесла #italic Салернська лікарська школа#! — найстаріша в Європі. Починаючи з IX століття вона досягла розквіту й увібрала в себе грецькі, арабські та латинські медичні звичаї, які сходилися на цьому багатонаціональному південному узбережжі. Лікарі, навчені в Салерно, роз’їжджалися по всьому континенту, а праці школи з анатомії, хірургії та лікування травами визначили вигляд медичної практики на всьому середньовічному Заході."
  syracuse_desc: "Коринфські поселенці у 734 році до нашої ери заснували місто на маленькому острівці біля входу в розлогу гавань. Так виникли Сиракузи — з часом їм судилося стати наймогутнішою грецькою країною на заході Середземномор’я. Про військову міць міста красномовно свідчив нищівний розгром афінської експедиції у 415–413 роках до нашої ери. Саме тут Архімед винайшов свої легендарні бойові машини, за допомогою яких місто довго чинило опір римським військам. Завойовники, що змінювали один одного — карфагеняни, римляни, візантійці, араби та нормани — незмінно доходили одного й того самого висновку: така гавань занадто цінна, щоб не спробувати її зайняти. Палермо давно відтіснив Сиракузи на другий план, і все ж місто досі є найвеличнішим осередком Південно-Східної Сицилії. Його стародавня гавань і висічені в камені вулиці донині зберігають пам’ять про цивілізацію, чий сліпучий блиск колись задавав тон усьому античному Середземномор’ю."
  trebizond_desc: "Трапезунд тулиться на вузькій береговій смузі, затиснутій між Понтійськими горами та Чорним морем, — у середньовічному світі важко було знайти місто з більш вражаючим розташуванням. Коли у 1204 році Константинополь упав під натиском Четвертого хрестового походу, нащадки династії Комнінів утекли сюди й заснували Трапезундську імперію. Вона ще довго зберігала незалежність як грецька християнська держава після того, як упала сама Латинська імперія. Під владою міста перебував східний край чорноморського торгового шляху та гірські перевали, що вели до Вірменії та Персії. Сюди ринули генуезькі купці, і Трапезунд зацвів як західна межа Шовкового шляху, а на його ринках можна було знайти крам із Центральної Азії та навіть ще віддаленіших країв."
  smyrna_desc: "Смирна — одне з давніх міст Егейського узбережжя. Вона виборювала честь називатися батьківщиною Гомера, а пізніше увійшла до числа семи церков Малої Азії, до яких звернене Об’явлення Івана Богослова. Під владою Візантії місто слугувало великим портом: воно пов’язувало багаті анатолійські землі з торговими шляхами Егеїди. У його гавані часто бували венеційські та генуезькі купці, які заснували вздовж берегів власні торгові колонії. Наприкінці XIII — на початку XIV століття Смирна часто переходила з рук у руки — візантійців, генуезців, айдинських турків. Винятково вигідне розташування робило місто жаданим трофеєм, повз який не могла пройти жодна країна Егейського моря."
  konya_desc: "Конья розкинулася на високому плато Центральної Анатолії. У XII–XIII століттях вона слугувала столицею Румського султанату — тюркської країни, що панувала в Анатолії. За сельджуцьких султанів місто розквітло як осередок ісламського мистецтва, архітектури та вченості. Його прикрашені кахлями мавзолеї та медресе перетворили стародавнє місто на плато на один із найвеличніших культурних осередків середньовічного ісламського світу. Саме тут оселився й помер поет-суфій Джалаладдін Румі. Тут-таки його послідовники заснували суфійський орден Мевлеві — обитель дервішів, що кружляють, чиї музика та обряди уславили місто далеко за межами Анатолійського плато."
  sivas_desc: "Сівас розташувався на високому плато, де сходяться головні шляхи між Анатолією та Персією. У середньовічному світі Близького Сходу це було одне з найвеличніших міст-перехресть. За Румського султанату він виріс у великий провінційний осередок, чиї правителі не скупилися на архітектурні задуми. Великі медресе XIII століття — насамперед знамениті Гьок медресе та Медресе з двома мінаретами — донині вважаються вершиною сельджуцького кам’яного зодчества в Анатолії. Після монгольського завоювання місто перетворилося на ключовий урядовий осередок анатолійських провінцій Ільханату. Через його ринки та караван-сараї йшов нескінченний потік краму, що пов’язував Центральну Азію зі Середземномор’ям."
  kayseri_desc: "Кайсері, за давнини відомий римлянам як #italic Цезарея Мазака#!, був головним містом стародавньої Каппадокії. Століттями він слугував брамою, звідки шляхи з Анатолійського плато розходилися на схід, до Вірменії та Месопотамії. Місто стало одним із найдавніших осередків християнства в Малій Азії. Тут народився святитель Василій Великий, чиї богословські праці та чернечий устав визначили вигляд Східної церкви й донині багато в чому визначають християнське життя. За Сельджуків та їхніх наступників місто заповнили мечеті, медресе та караван-сараї. Розташування на перехресті анатолійських торгових шляхів призвело до не однієї зміни володарів: Кайсері встиг побувати під владою візантійців, Данишмендидів, Сельджуків та монголів, і кожен новий господар усвідомлював, яким скарбом він заволодів."
  izmit_desc: "Це місто заснував у III столітті до нашої ери віфінський цар Нікомед I, і римлянам воно було відоме під назвою #italic Нікомедія#!. За Діоклетіана вона слугувала східною столицею імперії: імператор обрав Нікомедію своїм осідком та перетворив на урядовий осередок східних провінцій. Саме звідси у 303 році він розпочав Велике гоніння на християн — головну церкву міста, яку було видно з імператорського палацу, знесли, і на віру обрушився останній, найжорстокіший удар римської влади. Згодом, коли по інший бік протоки виник Константинополь, цей новий сусід поступово затьмарив Нікомедію. Проте це місто протягом століть візантійського правління залишалося важливим великим портом та єпископальним осідком."
  ankara_desc: "Анкара височіє на скелястому пагорбі посеред Анатолійського плоскогір’я. Задовго до римлян це було стародавнє галатське місто, і лише згодом римляни зробили його головним осередком провінції Галатія. Стратегічне розташування Анкари на перетині шляхів із Константинополя, з берегів Чорного моря, а також із Леванту та Персії, підтримувало військове й торгове значення цього міста. В Анкарі звели величний храм на честь імператора Августа, і збережені там написи належать до найважливіших пам’яток римської історії, що дійшли до нас. Під владою Данишмендідів, румських сельджуків, а згодом і монголів Анкара залишалася найважливішим поселенням Анатолійського плоскогір’я. Володіння цим містом означало контроль над усіма шляхами, що пролягали через нього."
  amasya_desc: "У Понтійських горах річка Єшильирмак пробила глибоку ущелину, і в ній сховалася Амасья — царська столиця стародавнього Понтійського царства та батьківщина географа Страбона. У своїй знаменитій праці «Географія» він із любов’ю та старанністю описав рідне місто. Ефектне розташування Амасьї підкреслювали вирубані просто в скелястих урвищах над річкою царські гробниці. Вони стали втіленням величі елліністичного царства, яке в часи свого розквіту панувало над більшою частиною Малої Азії. Під владою візантійців, Данишмендидів, сельджуків та монголів місто не переставало бути головним осередком Понтійського передгір’я. Глибока ущелина та навколишні гори перетворили його на одну з найнеприступніших фортець Північної Анатолії."
  rodos_desc: "Протягом більшої частини Античності Родос залишався найбагатшим і найстрокатішим портом Східного Середземномор’я. Біля входу в гавань колись височів легендарний Колос — одне з семи див стародавнього світу. Торгівля в усіх відомих тоді морях підпорядковувалася #italic Lex Rhodia#! — Родоському морському закону. Після століть римського, візантійського та арабського панування острів у 1309 році перейшов до лицарів-госпітальєрів, і ті перетворили його на одну з наймогутніших християнських фортець Східного Середземномор’я. За госпітальєрів Родос із його масивними стінами став твердинею могутності хрестоносців, а їхні галерні флотилії охороняли морські шляхи між християнським світом та ісламським Сходом."
  corinth_desc: "Коринф контролює як вузький суходільний прохід між материковою Грецією та Пелопоннесом, так і прадавній шлях через перешийок. Завдяки цьому він став одним із найбагатших і стратегічно найважливіших міст давньогрецького світу. У добу свого розквіту Коринф безроздільно панував над торгівлею між Егейським та Адріатичним морями, стягуючи мито з краму, який суходолом перевозили з однієї гавані до іншої. Бронзові вироби та розписна кераміка з коринфських майстерень розходилися по всьому Середземномор’ю. У 146 році до нашої ери римський полководець Луцій Муммій стер місто з лиця землі, проте згодом Юлій Цезар відродив Коринф уже як римську колонію. Він залишався великим осередком, перейшовши з рук візантійців до латинян, а потім до франків, і кожен новий володар швидко усвідомлював, у якій вигідній точці розташоване це місто."
  candia_desc: "У 1204 році Четвертий хрестовий похід здолав Візантійську імперію, і Венеція заволоділа Критом, зробивши Кандію його столицею. За наступне століття місто перетворилося на один із стратегічно найважливіших венеційських форпостів Східного Середземномор’я. Родючі рівнини острова годували і венеційський флот, і різні колонії, а гавань Кандії слугувала найважливішим пунктом для поповнення запасів на морських шляхах між Венецією та Левантом. Хоча критське населення не раз піднімало повстання проти венеційських панів, саме місто неухильно зміцнювалося й багатіло. Його стіни та склади змальовували вигляд колоніальної держави, яка має намір утримувати Крит вічно."
  edirne_desc: "Римський імператор Адріан заснував місто на березі річки Мариці й назвав його на свою честь #italic Адріанополем#!. Це місто охороняло головний шлях, який пов’язував Константинополь із дунайським кордоном, і слугувало ключовим військовим та урядовим осередком оборони Фракії. Саме тут у 378 році вестготська кіннота розгромила легіони імператора Валента в одній із найдоленосніших битв давнини. Через цю поразку германські народи почали розселятися в межах імперії, що наблизило остаточний крах Західного Риму. За візантійців Адріанополь залишався головним містом Фракії і за звичаєм слугував передовим рубежем оборони Константинополя від загроз із заходу."
  ioannina_desc: "Яніна розкинулася на скелястому півострові, що вдається в однойменне гірське озеро. Це було головне місто Епірського деспотату — грецької країни-наступниці, що виникла на північному заході Греції після того, як Четвертий хрестовий похід у 1204 році здолав візантійську державу. За епірських деспотів Яніна зі скромного провінційного містечка перетворилася на важливий осередок грецької культури та опору. Її природний захист доповнювали могутні стіни, а озеро давало і харч, і надійний притулок. Гірський ландшафт Епіру однаковою мірою дарував місту безпеку та відокремленість. Яніна слугувала життєво важливим бастіоном та опорою для грецької християнської цивілізації на неспокійних північно-західних землях колишньої імперії."
  tarnovo_desc: "Тирново розташувалося на трьох пагорбах у закруті річки Янтри. У 1185 році брати Асень і Петро підняли велике повстання проти візантійської влади, і місто стало столицею Другого Болгарського царства. За династії Асенів воно стало однією з найгрізніших фортець на Балканах. На пагорбі Царевець височіли царський палац і Патріарший собор — символи країни, яка в часи свого розквіту в XIII столітті простягалася від Дунаю до Егейського моря. Згодом, коли царство ослабло під натиском монголів, Тирново залишилося столицею маленької, але гордої Болгарії. Його стіни та пам’ять про царське минуле навіть сто років по тому визначали вигляд і дух міста."
  dubrovnik_desc: "Дубровник прихистився під вапняковими скелями далматинського берега. Візантійці заснували його як притулок, а з часом це місто перетворилося на одну з найуспішніших малих країн середньовічного Середземномор’я, що досягли найбільших успіхів у дипломатії. Ставши республікою Рагуза, він спритно маневрував між тиском Венеції, Угорщини, Сербії та інших країн, що набирали сили. Де потрібно, Рагуза платила данину, але водночас вибудувала мережу купецьких посольств, що простяглася від Фландрії до Леванту. Рагузькі купці розвозили крам і гроші по всіх ринках відомого світу, а за масивними стінами росло витончене кам’яне місто. Сама його подоба сповіщала про те, що місцеві жителі роблять ставку на торгівлю та обачну дипломатію, а не на дорогу війну."
  sredets_desc: "Римляни називали це місто #italic Сердикою#! — воно було головним у провінції Середземна Дакія. На момент, коли болгари перетворили майбутню Софію на один з обласних осередків своєї країни, вона вже мала багату історію. Саме в Сердиці імператор Костянтин скликав собор 343 року — один із найважливіших синодів раннього християнства. Подейкували, що тут він уперше замислився над тим, щоб заснувати нову столицю імперії, перш ніж зупинив вибір на берегах Босфору. Під владою Візантії, а згодом і Болгарського царства місто залишалося ключовим перехрестям головних доріг на Балканах. Воно примостилося біля самого підніжжя гори Вітоша — таке розташування зробило його омріяним трофеєм у низці завоювань, але й дозволило пережити кожну зміну господарів."
  ohrid_desc: "Охрид розкинувся на березі прадавнього озера, що подарувало місту ім’я. Його піднесення почалося наприкінці IX століття, коли святий Климент — учень просвітителів Кирила та Мефодія — заснував тут знамениту школу слов’янської писемності. Її закінчили тисячі священників та книжників, які опанували нову слов’янську грамоту. Після хрещення Болгарії Охрид став резиденцією Болгарського патріархату, а згодом — автокефальної Охридської архієпископії, одного з найважливіших духовних осередків православного світу. Його горбисті схили усіяні церквами та монастирями, і місто заслужено прозвали балканським Єрусалимом. Його духовна влада століттями спрямовувала християнство південнослов’янських народів."
  nis_desc: "Римляни знали Ніш як #italic Наїссус#!. Місто стояло на головній дорозі між дунайським кордоном і Константинополем — у тому самому місці, де сходяться долини річок Морави та Нишави. Це робило його одним із стратегічно найважливіших міст стародавніх Балкан. Саме тут приблизно у 272 році нашої ери народився імператор Костянтин Великий — син західних Балкан, якому судилося змінити Римську імперію та майбутнє західної цивілізації. Місто не раз спустошували гуни Аттіли та інші завойовники, але розташування на перехресті шляхів дозволило йому відроджуватися знову й знову. Під владою Візантії, Болгарії та Сербії Ніш залишався ключовим вузлом центральних Балкан."
  durres_desc: "Дуррес — одне з найдавніших міст Європи. Його заснували приблизно у 627 році до нашої ери як грецьку колонію Епідамн вихідці з Коринфа та Корфу, а чудова природна гавань на східному березі Адріатики одразу надала йому важливого торгового значення. Римляни називали місто #italic Диррахієм#! і перетворили його на західний край Егнатієвої дороги — великої військової магістралі, що перетинала Балкани до самого Візантія. Відтоді століттями кожне військо, що вирушало з Рима на схід, проходило через його браму. Як сполучна ланка між Італією та Балканами, Дуррес став одним із найласіших шматочків у всьому регіоні. Протягом Середньовіччя його гавань і стіни без кінця переходили з рук у руки — візантійців, норманів, венеційців та анжуйських правителів."
  prizren_desc: "Призрен сховався в родючій долині біля підніжжя Шар-Планини. Місто було засноване в незапам’ятні часи, але справжній його розквіт почався у XIII столітті, коли середньовічна сербська країна зробила його одним зі своїх головних оплотів. За дому Неманичів воно перетворилося на великий урядовий та торговий осередок. Православні церкви та монастирі міста стали виявом благочестя й честолюбства сербських правителів — ті бачили себе прямими спадкоємцями візантійської цивілізації. На початок XIV століття Призрен уже належав до найважливіших міст Сербського королівства. На його ринки з’їжджалися купці з Дубровника, Венеції та з усього Леванту, щоб торгувати дорогоцінними металами, видобутими в навколишніх горах."
  belgrad_desc: "Белград стоїть біля злиття Сави та Дунаю, там, де великий шлях із Центральної Європи доходить до Балкан. З найдавніших часів це місто слугувало укріпленою брамою: римляни називали його #italic Сингідунумом#! і тримали тут легіон для охорони дунайського кордону. У Середньовіччя місто переходило з рук у руки — від болгар до візантійців, потім до угорців. Фортеця, що вінчала пагорб над злиттям річок, перетворила Белград на одну з найбажаніших твердинь на Балканах. На початок XIV століття він став головним трофеєм у боротьбі між Угорським королівством та сербською країною, що набирала сили, а з його стін відкривається краєвид на річки, які розділяють світи латинського та православного християнства."
  mecca_desc: "Задовго до пророка в серці Аравії височіла Кааба — кам’яне святилище, до якого племена півострова щороку вирушали на прощу. Коли Мухаммад народився в околицях Мекки в 570 році й отримав там свої одкровення, місто стало духовним осередком віри, яка поширила свій вплив на три континенти. Після піднесення й падіння халіфату Мекка залишалася під владою шерифів, нащадків пророка, які своєю чергою підкорялися наймогутнішому ісламському правителю доби. З 1269 року єгипетські мамлюки стали захисниками Мекки, і щороку їхні каравани везуть пустелею нову #italic кисву#!, щоб укрити Каабу чорним шовком."
  aleppo_desc: "Алеппо, одне з найдавніших міст світу, називали перехрестям Північного Леванту ще за часів хетів та аккадців. У X столітті під владою хамданідського еміра Сайфа ад-Даули місто стало культурною перлиною арабського світу, двором поетів і воїнів, які кидали виклик візантійському порубіжжю своєю блискучою поезією та сталлю. Зангід Нур ад-Дін та айюбідський емір аз-Захір Газі, син Саладина, перебудували величну цитадель, перетворивши її на одну з найвеличніших твердинь ісламського світу. Після плюндрування монголами Хулагу-хана в 1260 році місто відбили мамлюки, які зробили його другим містом у своїх сирійських володіннях і перевалочним пунктом у торгівлі шовком та прянощами між Іраком і Середземномор’ям."
  adan_desc: "Аден, схований у кратері згаслого вулкана, з античності слугував перевалочним пунктом між Червоним морем та Індійським океаном. За багатство місцевих ринків грецькі моряки називали місто #italic Eudaemon Arabia#!, «Аравія Родюча». Сулайхідська правителька Арва в XI столітті правила Аденом із Джибли, а після посилення Айюбідів місто відійшло расулідським султанам Ємену і з 1229 року стало головним портом їхньої держави. До його гавані стікаються єгипетські купці на шляху до Індії та індійські флоти, що везуть перець, бавовну й порцеляну на захід. Расулідська митниця та її причали вважаються найбагатшими в ісламському світі."
  hormuz_desc: "Століттями країна Ормуз розташовувалася на узбережжі Перської затоки, доки загроза монгольських набігів не змусила її правителя покинути старе місто й переселитися на невеликий острів Джерун у 1300 році. Там купці нового Ормуза звели місто з кам’яними будинками та великими коморами, яке забезпечувало себе водою з водоймищ і розквітало завдяки торгівлі перлами, кіньми й індійськими прянощами. Під владою місцевих правителів, формально підпорядкованих Керману, острів став великим ринком Перської затоки, куди щосезону стікаються арабські дау, перські караки й індійські джонки, щоб обмінюватися крамом із двох океанів."
  tabriz_desc: "Тебриз, розташований у родючій долині на північ від масиву Сехенд, був багатим містом ще з часів Сасанідів, але слава прийшла до нього після того, як перські ільхани обрали його своєю столицею. За Газан-хана, який навернувся в іслам, та його наступника Олджейту місто стало серцем імперії, що простягалася від Окса до Євфрату, а його базари вгиналися від китайського шовку, який доправляли сюди імперськими #italic ямськими#! шляхами. Радник Рашид ад-Дін, ерудит та історик, звів квартал #italic Руб-і Рашиді#!, зробивши його великим осередком медресе, бібліотек і писарень, куди стікалися вчені з усієї Євразії. На час смерті ільхана Абу Саїда Тебриз став одним із найбільш густонаселених і строкатих міст світу."
  isfahan_desc: "Ісфахан, омиваний водами річки Заєндеруд і розташований у центрі Іранського нагір’я, був одним із найвеличніших міст Персії ще з часів Сасанідів, коли на його місці стояли поселення Гай та юдейська колонія Ягудія. За правління сельджуцького султана Мелік-шаха та його візира Нізама аль-Мулька в XI столітті це місто стало столицею імперії, що розкинулася від Анатолії до Центральної Азії, а його П’ятнична мечеть стала однією з визначних пам’яток ісламської архітектури. Монголи безжально сплюндрували місто в 1241 році, але його сади, мости й ремесла поступово відродилися під владою Ільханідів, а місцеві ткачі та ковалі й досі забезпечують своїми виробами ринки іранського світу."
  mosul_desc: "На протилежному від руїн стародавньої Ніневії березі Тигру стоїть місто Мосул, яке стереже переправу через річку на шляху між Сирією та Багдадом ще з доби раннього ісламу. За Хамданідів і пізніше за атабеків Зангідів Мосул став потужною прикордонною столицею, з якої Імадеддін Зангі вів боротьбу з хрестоносцями, захопивши Едесу в 1144 році й поклавши початок тривалому ісламському визволенню Леванту. Місто відоме своїми ткачами, на честь яких названо тонку бавовняну тканину, знану в Європі як #italic муслін#!, а також ковалями й сріблярами, що забезпечують ринки Верхньої Джазіри. Уникнувши найгірших наслідків монгольської навали завдяки своєчасному підкоренню, місто залишається важливим опорним пунктом Ільханідів у верхній течії Тигру."
  samarra_desc: "У 836 році на березі Тигру на північ від Багдада аббасидський халіф аль-Мутасим заснував Самарру, задумавши це місто як нову простору столицю, де його свавільні тюркські вояки не турбували б люд старого міста. Майже шістдесят років найбільша імперія світу керувалася з цього міста з просторими вулицями, величними палацами й унікальним спіральним мінаретом Великої мечеті — найбільшої з усіх, коли-небудь збудованих в ісламському світі. Після повернення халіфів до Багдада у 892 році придворні та вояки покинули велике місто, але розташовані тут святині десятого й одинадцятого імамів зробили Самарру осередком прощі шиїтів, а величні руїни міста й досі височіють над річковою рівниною."
  bukhara_desc: "Понад тисячу років Бухара була одним із найвеличніших міст Центральної Азії, согдійським торговим осередком, який саманідські еміри IX і X століть перетворили на блискучу столицю ісламського Ірану. Мавзолей Ісмаїла Самані з випаленої цегли й досі є живим дивом ранньої ісламської архітектури, а мінарет Калян, зведений Караханідами в 1127 році, все ще визначає вигляд міста. Кажуть, коли Чингісхан узяв місто приступом у 1220 році, він верхи на коні в’їхав до п’ятничної мечеті й зажадав кинути Коран йому під ноги, а потім майже дощенту зруйнував місто. Проте за Чагатаїв місто поступово відродилося, і до його мечетей знову стали прибувати богослови, повернувши йому колишню славетну назву #italic «Бухоройі Шариф»#!, що означає «Найвеличніша Бухара»."
  herat_desc: "Місто Герат, стародавня Арея Ахеменідів, височіє на родючій рівнині Геріруд, де перетинаються шляхи з Персії, Хорасана й Індії. За Газневидів це було визначне прикордонне місто поетів і купців, а Гуриди, які піднеслися в XII столітті, прикрасили його мечетями та медресе, перш ніж їхня імперія рушила на південь до Індостану. Монгольські вершники Толуя з жахливим завзяттям розграбували місто в 1221 році, але після приходу до влади маліків із династії Куртів у 1245 році місто поступово відбудували як столицю васалів ільханів, а розташування на великому шляху, що сполучає схід із заходом, стало запорукою його розквіту."
  kashgar_desc: "Кашгар, розташований на західному краю Таримської западини на стику Мавераннахру, Фергани й Тибету, був оазою на Великому шовковому шляху ще з античних часів. Під владою караханідських ханів X та XI століть це місто стало значним осередком тюркської ісламської цивілізації та домівкою видатного дослідника Махмуда аль-Кашгарі, який у своїй праці #italic «Диван лугат ат-турк»#! зібрав мови тюркських народів для Аббасидів. Після монгольського завоювання місто відійшло до чагатайських ханів, чиї кочові двори пересувалися степом між Тянь-Шанем і Паміром. Через базари Кашгара й далі пливуть нефрит, коні та шовк, забезпечуючи багатство таримських оаз."
  lahore_desc: "Лахор, давня столиця індуїстської династії Шахі, у 1021 році був захоплений Махмудом Газневі, ставши східною столицею його величезної імперії, а також брамою, крізь яку ісламська цивілізація проникла на рівнину Інду. За Газневидів Лахор став блискучим прикордонним містом із мечетями та медресе. Там жили перський поет Масуд Саад Салман і богослов Алі аль-Худжувірі, чия суфійська святиня #italic Дата Дарбар#! донині приваблює прочан. Після піднесення мамлюцького Делійського султанату місто стало головною твердинею мусульман на шляху монгольських вершників, які раз у раз перетинали річку Інд. За султанів, зокрема Балбана, міські укріплення було перебудовано для захисту від степовиків."
  varanasi_desc: "Варанасі, одне з найдавніших безперервно заселених міст світу, відоме вірянам як #italic Каші#!, або «Сяйливе», стоїть на західному березі Гангу в найсвятішому для індуїстів місці. Прочани сходилися сюди задовго до появи писемності, щоб омитися в річці та звільнитися від кола перероджень. На ґхатах, що спускаються до Гангу, можна було побачити безліч храмів, а також аскетів і поховальні багаття, куди приносили тих, хто прагне померти в цьому святому місці. Гуридські війська під проводом Кутб ад-Діна Айбака сплюндрували місто в 1194 році, знищивши безліч місцевих храмів, але Варанасі не раз відроджувався. Його шовкоткачі та санскритські вчені бережуть цивілізацію, яку не вдалося знищити жодному завойовникові."
  madurai_desc: "Понад тисячу років Мадурай був столицею царів Пандьїв із тамільського півдня. Тутешній великий храм богині Мінакші став вершиною поступу цивілізації поетів, учених і військової знаті. Кажуть, в античні часи тут процвітали тамільські академії #italic санґам#!, приваблюючи до південних дворів бардів, а також підтримуючи дебати та розвиток мови. Малік Кафур, уславлений воєначальник делійського султана Ала ад-Діна Хілджі, узяв місто приступом у 1311 році та вивіз накопичені ним багатства. У 1335 році туглакідський намісник Джалал ад-Дін Ахсан-шах проголосив незалежність Мадурайського султанату — нетривкої ісламської держави в прадавньому серці тамільської землі."
  patna_desc: "На південному березі Гангу колись стояла стародавня #italic Паталіпутра#!, столиця Ашоки — правителя імперії Маур’їв. Звідси влада першої індійської імперії простягалася від Афганістану до Бенгальської затоки. Грецький посол Мегасфен захоплювався місцевими дерев’яними палісадами та розкішшю міських палаців, а китайський паломник Фасянь застав місто квітучим у V столітті під владою Гуптів. Але за часів Делійського султанату велична столиця змаліла до скромного містечка під назвою Патна, яке стало провінційним оплотом туглакідського регіону Біхар, де спадщина одного з найвеличніших міст античності збереглася лише в пам’яті вчених та в руїнах на берегах річки."
  chittagong_desc: "Читтаґонґ, розташований у широкому гирлі, де річки Східної Бенгалії впадають у Бенгальську затоку, з прадавніх часів відігравав роль порту між Індією та Південно-Східною Азією. Для арабських географів це був #italic Самандар#!, місто купців, чиї кораблі доходили до Китаю, а тибетський прочанин Дгаммапала в X столітті описав тутешні монастирі. Володіння цим містом оспорювали правителі Бенгалії та Аракана, а також вожді пагорбів Тріпури. Воно неодноразово переходило з рук у руки, а після завоювання Бенгалії Делійським султанатом опинилося під владою мусульман. Його гавань залишається головним східним портом для вивозу рису та бавовни дельти Гангу."
  jinjiang_desc: "Цюаньчжоу, відомий арабам як #italic Зайтун#! й описаний Марко Поло як один із двох найвеличніших портів світу, досяг небувалого розквіту за династій Сун і Юань, ставши головним китайським портом, що приймав кораблі з Індійського океану. Його гавань переповнена джонками, які прямують до Островів прянощів, до Індії та Перської затоки, а в самому місті цілими подвір’ями оселяються арабські, перські, тамільські та вірменські купці, чиї мечеті, індуїстські храми й християнські церкви сусідують із буддійськими монастирями та маніхейським святилищем. Марко Поло, який побував у місті в 1290 році, писав, що на кожен навантажений прянощами корабель, який досяг Александрії, припадає сотня тих, що прибули до Зайтуна, а мита з тутешньої колосальної торгівлі перетворили це місто на одну з опор імператорської скарбниці Юань."
  shangyuan_desc: "На південному березі Янцзи, де річка повертає на північ у бік моря, лежить місто, яке нині відоме як Цзіцін, а в минулому впродовж понад тисячі років слугувало столицею та фортецею. Стародавні царства У, Східна Цзінь і південні династії в добу після імперії Хань правили з-за мурів міста, що мало назви #italic Цзяньє#! та #italic Цзянькан#!, що на століття зробило його культурним серцем південного Китаю. Коли чжурчжені завоювали північ у XII столітті, сунський двір ненадовго осів у цьому місті й зробив його своєю новою столицею, а після монгольського підкорення місто було перебудоване, ставши центром округу Цзіцін. Його стратегічне становище в нижній течії річки Янцзи забезпечило йому вагому роль серед міст півдня."
  wuxian_desc: "У центрі дельти Янцзи лежить місто Сучжоу, за давнини відоме як #italic Ґусу#!, а в добу Сун як #italic Пінцзян#!. Місто було засноване в VI столітті до нашої ери як столиця царства У. Воно постало серед складного сплетіння каналів і поріднилося з містом Ханчжоу в приказці тутешніх жителів: «Небеса вгорі, Сучжоу й Ханчжоу внизу». Це місто здавна славилося шовкоткачами, садибами вчених, оперою та вишуканою кухнею. За правління Південної Сун воно стало одним із найбагатших міст півдня. Монгольське завоювання 1276 року не минуло безслідно, проте на початок XIV століття сади, пагоди й ринки на берегах каналів Сучжоу знову ваблять купців і вчених з усього Китаю."
  guangzhou_desc: "У гирлі річки Чжуцзян розташоване місто Гуанчжоу, куди ще від часів династії Хань прибували чужоземні кораблі, а купці торгували із землями південних морів. На час правління династії Тан арабські та перські дау щосезону приставали до місцевих причалів у такій кількості, що в місті виник чужоземний двір, яким керували старійшини, обрані мусульманськими купцями. У 879 році бунтівник Хуан Чао, за переказами, перебив понад сто тисяч іноземних жителів міста під час свого кривавого походу. Монгольське завоювання поклало початок новій добі розквіту Гуанчжоу, і це місто посприяло розквіту морської торгівлі в добу Юань: крізь його гавані йшов за кордон крам із Ліннаня, а індійські та арабські купці знову стали частими гостями гостиних дворів і комор міста."
  lhasa_desc: "Місто Лхаса було засноване в VII столітті тибетським імператором Сонгценом Гампо, який збудував храм Джоканг і зберігав там священний образ Будди, привезений його непальською та китайською дружинами. Упродовж двох століть Лхаса була осередком Тибетської імперії, яка змагалася з Танським Китаєм і володіла землями від Паміру до Бенгальської затоки. Після падіння імперії в IX столітті місто занепало, але храми Джоканг і Рамоче залишилися духовними осередками тибетського буддизму. Після походу платом у 1240 році монголи призначили настоятелів монастиря Сак’я своїми намісниками. Хоч Сак’я й залишається осередком врядування, Лхаса зберігає статус священного міста, ваблячи прочан, які обходять Баркхор колом, щоб уклонитися статуї Джово Шак’ямуні."
  kamakura_desc: "У 1185 році полководець Мінамото-но Йорітомо відібрав владу в імператорського двору в Кіото й зробив прибережне місто Камакура столицею нового військового уряду, #italic бакуфу#!, що відтоді правив Японією від імені імператора. За регентів Ходзьо місто перетворилося на укріплену столицю суворої самурайської культури, оточену горами й морем, а велика бронзова статуя Будди, відлита в 1252 році, відтоді медитує над кварталами міста як символ нового дзен-буддизму військової знаті. Саме з Камакури ухвалювали рішення про відбиття монгольських навал 1274 і 1281 років, яким дали відсіч воїни кланів Кюсю та вчасно надіслані бурі, що дістали ім’я #italic «камікадзе»#!, або «божественний вітер»."
  hakata_desc: "Хаката — найважливіше вікно, що впродовж багатьох століть сполучало Японію з материком. Порт Хакати за свою історію прийняв у себе чимало поважних гостей: послів Кореї та династій Тан і Сун, численних купців із південних країв… За доби Сун у Хакаті виник китайський двір із кам’яними коморами й буддійськими храмами, зведеними руками китайських ченців. З часом місто завдяки торгівлі розбагатіло настільки, що стало найбагатшим портовим поселенням Кюсю. Саме на піщані береги Хакати в 1274 і 1281 роках зійшли монгольські загарбники, які вдерлися до Японії, і саме тут бакуфу Камакура звело великий кам’яний мур — #italic «ґенко боруй»#!, залишки якого й сьогодні нагадують нащадкам про найвідчайдушнішу оборонну війну в історії краю."
  namgyeong_desc: "Set in a basin protected by mountains where the Han River bends toward the Yellow Sea, the area of Hanyang has been settled since prehistoric times and was contested in antiquity between the kingdoms of Baekje and Goguryeo. Under the Goryeo dynasty the site rose in importance as the #italic Namgyeong#!, or Southern Capital, one of three secondary capitals supplementing the royal seat at Gaegyeong, and successive kings have considered moving the court here on the advice of geomancers who praise its auspicious siting. By the early 14th century Hanyang had grown into a substantial Goryeo town under the loose suzerainty of the Mongol Yuan, its strategic position on the Han River making it the natural gateway between the Korean peninsula and the wider world."
  pagan_desc: "На сухих рівнинах Верхньої Бірми, там, де Іраваді огинає безжиттєві пагорби, в XI столітті постало Паганське царство. Його перший владика, цар Аноратха, об’єднав бірманські народи й прийняв тхераваду — гілку буддизму, перейняту ним у ченця Шина Арахана. За наступні два століття наступники Аноратхи звели на навколишній рівнині тисячі ступ, пагод і храмів, збудувавши більше святинь, ніж будь-яка інша буддійська держава. Рисові ниви ж були настільки щедрими, що годували вчених і ремісників від Індії до Шрі-Ланки. У 1287 році царство сплюндрувало монгольське військо під проводом хана Хубілая. На початок XIV століття влада опинилася в руках бірманських шанів із М’їнсайна та Піньї. Від давньої столиці лишилися тільки руїни, що й нині ваблять до себе прочан, які шукають просвітлення серед десяти тисяч зруйнованих храмів."
  sukhothai_desc: "На початку XIII століття тайські вожді — вихідці з верхів’їв Чаопхраї — скинули владу ангкорських кхмерів і заснували царство Сукхотай — #italic «світанок щастя»#!. Під владою царя Рамакхамхаенга, який правив із 1279 по 1298 рік, у королівстві розпочалася золота доба. Вона стала можливою багато в чому завдяки старанням ченців і ремісників зі Шрі-Ланки, які перебиралися до нової буддійської держави: у Сукхотаї сповідували тхераваду. Висічений у 1292 році напис, що увічнював королівські реформи, — найдавніший з усіх збережених написів тайським письмом; вважається, що до його створення доклав руку сам Рамакхамхаенг. На початок XIV століття за вплив у регіоні із Сукхотаєм змагаються відразу кілька тайських князівств, які утворилися в пониззі Чаопхраї, але вся тайська цивілізація, як і раніше, бере приклад із сукхотайських культурних надбань — позолочених ступ і статуй Будди."
  thang_long_desc: "1010 року в’єтнамський імператор Лі Тхай-то (Конг Уан) переніс столицю з тісної фортеці Хоали до нового міста на річці Хонгха — #italic Тханглонг#!, «дракон, що злітає». До такого кроку його спонукало видіння, що зійшло на нього. За династій Лі та Чан місто стало серцем Дайв’єту — містом пагод, шкіл і королівських палаців, містом, де постала в’єтнамська цивілізація, несхожа на сусідів — китайців, тямів і кхмерів. Тричі монгольські війська під проводом хана Хубілая проривали північний кордон, намагаючись підкорити Дайв’єт, і тричі великий полководець Чан Хинг Дао зі своїми вірними чанськими вояками давав ворогові гідну відсіч. Пам’ять народу й досі береже спогади про ці битви, а надто про найславетнішу з них — битву на річці Батьданг 1288 року."
  trowulan_desc: "У 1293 році, щойно монгольські війська, які вторглися на Яву, зіткнулися з узурпатором престолу Сінгасарі, яванський царевич Раден Віджая проголосив нову країну — Маджапагіт зі столицею в Тровулані, у низині річки Брантас. Родючі рисові поля Східної Яви забезпечують жителів їжею, зведені довкола осель кам’яні мури — захистом, а місткі водоймища — водою. Чудову міську браму прикрашають теракотові панелі із зображенням звитяг нової династії. У 20-х роках XIV століття до влади прийшов мапатіг Гаджа Мада. Під його проводом Маджапагіт розпочинає завойовницькі походи, що мають на меті підкорення всього архіпелагу. Тровулан ось-ось увійде в золоту добу і стане серцем найвеличнішої імперії Південної Азії."
  palembang_desc: "З VII століття до кінця XIII століття Палембанг був столицею морської імперії Шрівіджая. Її флоти тримали Малаккську протоку в залізному кулаку, а стараннями монахів столиця стала одним із найважливіших буддійських міст Південної Азії. У міських монастирях тисячі монахів, серед яких і ті, що прибули сюди в 70-ті роки VII століття за порадою китайського прочанина І Цзіня, перекладали та укладали коментарі до різноманітних праць. 1025 року неподільна влада Шрівіджаї над протокою скінчилася — її обірвав напад війська держави Чола, і протягом наступних століть Палембанг повільно перетворювався на данника інших яванських царств, хоча й понині він залишається важливим володінням у руках володарів південних околиць Суматри: цьому сприяє вигідне розташування на річці Мусі."
  pegu_desc: "На розташованій у низині дельті, там, де річки Ситуан і Баго впадають у море, стоїть місто Пегу. Його піднесення почалося 1287 року, коли монголи знищили Паган; після цього монський володар Вареру заснував у Нижній Бірмі нову країну, що живе за законами тхеравади. Стараннями його спадкоємців місто, відоме серед монів як #italic Хантаваді#!, перетворилося на найважливіший порт верхньої частини Бенгальської затоки. Купці з Бенгалії, Шрі-Ланки та з Коромандельського берега торгують тут тиком, рубінами й славетними лакованими виробами від монських ремісників. Тут також височіє пагода Швемадо, у якій, за переказами, спочивають мощі Будди, — головна духовна окраса монської цивілізації, що постала на руїнах Пагана."
  chiang_mai_desc: "1296 року тайський цар Менграй, уродженець долини річки Маепінг, заснував нову столицю #italic Чіангмай#! — «нове місто». На цьому в гірських долинах Північного Сіаму й завершилося об’єднання Ланнатаю — «землі мільйона рисових полів». Обрати саме це місце порадили володарі Сукхотаю та Пхаяу. Міські мури та рів довкола поселення звели біля центральної площі, дотримуючись священного задуму щодо поєднання воєдино монських, тайських і кхмерських звичаїв. За Менграя та його спадкоємців у Чіангмаї розквітли буддистські школи тхеравада та різноманітні ремесла, і не в останню чергу — бронзове ливарство. Місцеві майстри-бронзовики за підтримки монастирів відливають чудові статуї, що мають попит у всьому буддійському світі."
  vijaya_desc: "Ось уже чотири століття володарі Тямпи правлять прибережною смугою Центрального В’єтнаму з фортеці у Віджаї, розташованої за піщаними дюнами біля Південнокитайського моря. Цегляні вежі, які вартують цей клапоть землі, захищають індуїстську цивілізацію та її купців, що торгують шовком і духмяною деревиною з південними країнами, від ворогів, проте вони виявилися недостатньо міцними, щоб гідно витримувати удари двох могутніх сусідів — кхмерського Ангкора та в’єтнамського Дайв’єту. 1145 року столицю Тямпи захопили кхмери, а в 1283 і 1326 роках — в’єтнамці. Щоразу їй удавалося відновити незалежність, але щоразу цією незалежністю доводилося поступатися дедалі більше. Під мовчазним поглядом старих цегляних веж цивілізація починає поступово відступати вздовж узбережжя."
  lubeck_desc: "1143 року граф Гольштейну Адольф II заснував місто Любек, знищене пожежею 1159 року й згодом відбудоване Генріхом Левом. Любек став єднальною ланкою між Північним морем і Балтикою; у гавані на річці Траве почали кидати якорі саксонські, слов’янські та скандинавські купці. 1226 року Фрідріх II надав Любеку статус вільного імперського міста, що призвело до появи в ньому перших самоврядних купецьких гільдій. Павутиння торгових зв’язків, яке огорнуло місто веж із червоної цегли, простяглося до інших купецьких міст Балтики, єднаючи їх воєдино. До XIV століття любецьке право лягло в основу права понад сотні поселень на Балтійському та Північному морях, ставши тим самим законодавчою опорою для впорядкування життя купецьких громад півночі."
  visby_desc: "За міцними кам’яними мурами на західному узбережжі Готланда виросло місто Вісбю, що перетворилося в XII — XIII століттях на одне з найбагатших міст Балтики. У його порту новгородські купці торгують вовною, фламандські — тканинами, а ганзейські — залізом та оселедцем. Островом уже кілька століть править «республіка землеробів», яка співіснує з привілейованими німецькими купцями, що займають у місті окремий двір. Завдяки такому спільному віданню та складному устрою скарбниця Вісбю завжди повна. Свідченням тому є вапнякові церкви, яких на початок XIV століття в місті налічувалося вже близько двох десятків. На ціле покоління Вісбю перетворився на найважливіше торжище Балтики."
  tallinn_desc: "На стрімкій вапняковій скелі Тоомпеа, що височіє над Ревельською бухтою, стоїть фортеця, зведена тут у 1219 році данським королем Вальдемаром II. За переказом, саме на цьому місці перед королівським військом, яке здригнулося, з неба спустився Даннеброг — стяг Данії, що віщував перемогу. Місто, що розрослося довкола замку, невдовзі заселили німецькі купці та ремісники, які згодом запровадили тут любецьке право. Так у поселенні постав ганзейський порт, який з’єднав балтійські торгові шляхи з річковими шляхами, що вели до Новгорода. Під м’яким врядуванням данської корони жителі нижнього міста багатіють на торгівлі оселедцем та бурштином, а єпископ і васали Тевтонського ордену змагаються за вплив у залах і покоях фортеці. Подвійний характер міста як німецької купецької республіки й водночас — володіння данської корони надає його жителям сили, небаченої в інших поселеннях Східної Балтики."
  riga_desc: "1201 року єпископ Альберт фон Буксгевден заснував фортецю Ригу — резиденцію, звідки було зручно вести хрестовий похід проти язичницьких племен лівів і латгалів, що жили в лісах за Даугавою. З папського благословення Альберт заснував духовно-лицарський орден мечоносців, який підкорив язичників за пів століття кровопролитних походів. Нове поселення стрімко розрослося й перетворилося з осідку єпископа на один із найважливіших портів Ганзи у східній частині Балтики. Німецькі коги, що відчалюють від її пристаней, везуть хутра з руських земель, віск та бурштин до Любека й інших міст. Ризькі ж купці — члени німецьких гільдій заснували торгові поселення вище за течією річки, ближче до руських князівств. Ще не скоро Ригу полишить її самобутній дух, що гартується в боротьбі між містянами, архієпископом та Лівонським орденом."
  bergen_desc: "Між фіордами та горами на західному узбережжі Норвегії лежить Берген — місто, засноване 1070 року королем Олавом Тихим, найважливіше місто середньовічної Норвегії та резиденція її королів. З Брюггена виходять численні кораблі, завантажені в’яленою рибою з північних промислів, а під кінець XIII століття біля пристаней Бергена почали масово селитися ганзейські купці. Тут вони заснували #italic контору#!, завдяки якій здобувають дедалі більший вплив на норвезькі постачання до інших країн. Берген — серце політичного та культурного життя Норвегії, яка на початок століття простяглася від Фарерів до Гренландії: тут коронуються її володарі, пишуться саги й сходяться між собою в палких суперечках корона, церква та заморські купці."
  hamburg_desc: "У IX столітті Карл Великий та його наступники спорудили на Ельбі фортецю, щоб полегшити боротьбу з язичниками-саксами та навернення їх до християнської віри. З часом Гамбург став осідком архієпископа, який прагнув поширити християнство на північ, до Скандинавії. Місто неодноразово плюндрували вікінги та слов’яни, зокрема й військо польського короля Болеслава I, проте щоразу його відбудовували. 1189 року Фрідріх Барбаросса надав йому імперські торгові привілеї, зокрема звільнив купців від торгового мита. Так розпочалася нова — торгова — сторінка в історії Гамбурга. До XIII століття союз Гамбурга та Любека, які об’єдналися для боротьби з балтійськими піратами, зміцнів настільки, що став підґрунтям для заснування Ганзи, а завдяки праці місцевих броварів, канатників і купців місто стало найважливішим торговим осередком Північної Німеччини."
  kyiv_desc: "Під владою покликаних на Русь варягів Київ до IX століття став столицею слов’янсько-скандинавського союзу, що склався в Середньому Подніпров’ї. За князів Володимира Святославича та Ярослава Мудрого в XI столітті Київ став одним із найбагатших і найвеличніших міст Східної Європи, що незмінно вражало мандрівників величчю собору Святої Софії та Золотих воріт; містом, чиї купці однаково охоче торгували як із Царгородом, так і з Балтикою. Роздробленість Русі призвела до поступового занепаду Києва, а 1240 року орда хана Батия сплюндрувала місто, ледь не стерши його з лиця землі; вулиці його поросли травою, а земля рясніла черепами. Після спустошення, за ординської доби, почалося повільне відродження Києва, а до 20-х років XIV століття він увійшов до кола впливу Великого князівства Литовського. Старі звичаї Рюриковичів виявилися безсилими перед новим політичним устроєм."
  pskov_desc: "Псков, розташований на скелястому березі біля злиття річок Великої та Пскови, з прадавніх часів пов’язаний із Новгородом як місто-побратим. Як і Новгород, він зберіг звичай #italic віча#! — зборів, на яких вільний люд обговорює та вирішує державні справи. 1136 року Псков почав поступово виборювати незалежність від Новгорода, а з XIII століття його ополчення під проводом таких князів, як литовський вигнанець Довмонт, стійко боронить західні рубежі руських земель від невпинного натиску Тевтонського ордену. Завдяки своєму віддаленому розташуванню Псков зумів уникнути плюндрування та спалення монголами і згодом перетворився на квітучу республіку купців і воїв. Його величний кам’яний кремль і численні храми, зведені коштом купців, свідчать про надзвичайно сильний для свого часу дух громадянської самостійності, що не мав рівних серед інших руських міст."
  avignon_desc: "На велетенській скелі над Роною, біля природної переправи між Провансом і Лангедоком, лежить Авіньйон — колись римська колонія, а згодом графська резиденція. 1309 року доля міста змінилася назавжди: папа Климент V, не маючи змоги безпечно повернутися до Рима і прагнучи заручитися підтримкою французької корони, переніс до Авіньйона свій двір. Його наступники заклали в місті величезний папський палац (будівництво якого триває й досі), перетворивши Авіньйон на латинську столицю християнського світу. Довкола постали кардинальські палаци, посольства європейських країн, писарні та міняльні крамниці. Населення Авіньйона стрімко зростає: за минулі роки воно подвоїлося, а потім подвоїлося знову, як і личить місту — столиці вселенської церкви."
  toledo_desc: "Толедо, розташований на підковоподібному виступі над річкою Тахо, слугував столицею вестготським королям, доки 711 року його не завоювали мусульмани. За маврів він зберіг статус одного з головних міст Аль-Андалусу. На вузьких вуличках Толедо туляться поруч синагоги, церкви та мечеті — усі віри тут мирно співіснують. 1085 року місто відвоював король Леону й Кастилії Альфонсо VI. Толедо, ставши столицею Кастильського королівства, зберіг багату інтелектуальну спадщину: тут зливалися воєдино латинська, арабська та юдейська мудрість. У XIII столітті Альфонсо X на прізвисько Мудрий заснував у місті школу перекладачів, яка діяла під опікою архієпископа Раймунда. Завдяки їй Толедо став брамою, крізь яку на латинський Захід проникала грецька й арабська філософська, наукова та медична думка, що справила значний вплив на європейську думку."
  granada_desc: "1230 року, коли християни вогнем і мечем відвойовували землі Аль-Андалусу, а могутність Альмохадів доживала останні дні, Мухаммад ібн аль-Ахмар заснував у Сьєрра-Неваді новий емірат — останній оплот мусульман в Іберії. За започаткованої ним династії Насрідів Гранадський емірат став данником Кастилії, зумівши водночас зберегти велику спадщину Аль-Андалусу. Гранада — нелегка здобич: її захищають гори та родюча #italic вега#! — зелений оазис. На пагорбі Сабіка, що височіє над містом, насрідські султани почали зводити фортецю-палац Альгамбру, чиї двори та покої вже сьогодні можна вважати видатним архітектурним досягненням андалузької цивілізації."
  dublin_desc: "Там, де річка Ліффі впадає в море, у IX столітті вікінги заснували поселення #italic Дублін#!; ірландці ж називали його Дув-Ліннь — «чорна заводь». Тут загарбники звели укріплений табір-порт — лонгфорт. З часом Дублін перетворився на головне гельсько-скандинавське місто Ірландії. Його купці торгували невільниками, шкурами та сріблом по обидва боки Ірландського моря, а королі неодноразово ставали до боротьби з верховними королями Ірландії, доки 1014 року не зазнали остаточної поразки від військ Бріана Бору під Клонтарфом. 1170 року англонормандський граф Стронгбоу вдерся до Ірландії, маючи намір установити тут англійське панування, а Генріх II згодом закріпив англійську владу над містом. Дублін став столицею манору Ірландія. Мури міста було розширено, всередині — зведено нові собори, а устрій врядування на основі англійського права поступово почав поширюватися на весь Пейл — англійську частину володінь."
  antwerp_desc: "Маркграфство Антверпен, розташоване біля велетенського припливного естуарію річки Шельди, з X століття слугує Священній Римській імперії укріпленою заставою: замок Стен надійно стереже річкову переправу від нападів вікінгів. У XII — XIII століттях під владою герцогів Брабантських місто стрімко зросло й перетворилося на гідного суперника фламандських міст Брюгге та Гента. 1296 року тут було відкрито ганзейську #italic контору#! — свідчення перетворення Антверпена на важливий порт на північноєвропейських торгових шляхах. На початок XIV століття Антверпен усе ще перебуває в тіні Брюгге, проте капітани італійських галер та іберійських карак уже гідно оцінили його глибшу гавань і зручний вихід у море. Нині порт на Шельді входить у добу розквіту."
  lyon_desc: "Розташоване біля злиття Рони та Сони місто Ліон, у минулому — римська колонія #italic Лугдунум#!, колись було столицею трьох Галлій. Тут також містився імператорський монетний двір, що карбував срібну монету для всієї імперії. Після падіння Рима в Ліоні було засновано кафедру архієпископа, який претендував на першість серед усіх галльських єпархій, а в Середні віки місто, що розкинулося на двох річках, стало одним із найважливіших роздоріжжів Західної Європи. До 1312 року Ліон належав до складу Священної Римської імперії, а згодом перейшов під пряму владу французької корони. На той час він уже зажив слави міста ярмарків, де купці з Італії, Нідерландів та Середземномор’я торгували шовком, прянощами й сріблом."
  york_desc: "Йорк, у минулому — фортеця легіонерів #italic Еборакум#!, зведена в 71 році н. е., згодом став столицею римської провінції Британія. У 306 році імператора Костянтина I проголосили тут августом. Після падіння Рима місто кілька століть слугувало столицею англосаксонської Нортумбрії; тут же жив і творив видатний християнський учений Алкуїн. У 866 році Йорк захопило Велике язичницьке військо, перейменувавши його на #italic Йорвік#! — столицю королівства вікінгів, чиї купці торгували навіть із Самаркандом. Після норманського завоювання тут було зведено величний собор і два замки. У Середні віки Йорк залишається резиденцією архієпископа, який змагається за першість із Кентербері, та другим за розміром, багатством і давністю містом Англії."
  canterbury_desc: "597 року римський чернець Августин прибув до Кенту, щоб навернути англосаксів у християнство. Він заснував у Кентербері свою резиденцію; тут також з’явилася перша архієпископська кафедра Церкви Англії, що зберігає свій статус і понині. Заснований Августином собор неодноразово перебудовувався. Найтрагічніша сторінка в його історії — убивство архієпископа Томаса Бекета 1170 року, скоєне королівськими людьми на сходах собору. Цей святотатський злочин перетворив Кентербері на один із найважливіших центрів паломництва середньовічного християнського світу. Дорогою з Лондона до Кентербері вдень і вночі прямують прочани, прагнучи припасти до мощів Бекета, тому добробут міста значною мірою тримається на гостинних дворах, де мандрівники можуть знайти прихисток та поживу, а також — на торгівцях дрібничками, які прочани везуть із собою на згадку."
  edinburgh_desc: "На вулканічній скелі, що височіє над околицями й зветься Замковою скелею, з прадавніх часів стоїть фортеця Единбург; стародавні бритти називали її #italic Дін-Ейдін#!. На початку XII століття за короля Давида I виросле навколо фортеці місто Единбург стало головним королівським містом Шотландії. Біля підніжжя скелі король заснував Голірудське абатство, а місту надав привілеї, які привабили на його ринки фламандських та англійських купців. У роки Воєн за незалежність на зламі XIII — XIV століть замок неодноразово переходив з рук у руки: тут стояли то шотландські, то англійські залоги. 1314 року Томас Рендольф здійснив зухвалий наскок, відбивши фортецю та повернувши її до рук Роберта Брюса. Цим подвигом він назавжди вписав своє ім’я в літопис шотландської історії."
  kilwa_kisiwani_desc: "На кораловому острові біля узбережжя Східної Африки в XI столітті постало суахілійське поселення Кілва-Кісівані, засноване вихідцями з Шираза. У XIII — на початку XIV століття воно перетворилося на найбагатше місто-державу Суахілійського узбережжя. За династії Махдалі, що утвердилася 1277 року, султани Кілви взяли під контроль торгові шляхи, якими золото з Великого Зімбабве надходило до південного порту Софала. На ці багатства вони спорудили величний кораловий палац #italic Хусуні Кубва#! з восьмикутним басейном і терасовим подвір’ям — найбільшу зі споруд Чорної Африки, зведених до новітньої доби. Мандрівник Ібн Баттута, який відвідав місто 1331 року, назвав Кілва-Кісівані одним із найгарніших і найупорядкованіших міст, які йому доводилося бачити за роки мандрів."
  mogadishu_desc: "У X столітті на північному краю Суахілійського узбережжя арабські та перські поселенці, які поріднилися із сомалійськими народами берега Банадір, заснували Могадішо — місто, що до XII століття перетворилося на квітуче ісламське поселення з кам’яними будинками, мечетями та прибережними коморами. Його ткачі виготовляють знамениту тканину #italic макдішаві#!, яку потім вивозять через Індійський океан до Єгипту та Індії, а місцеві купці вже ведуть торгівлю всім західним Індійським океаном. Ібн Баттута, який побував тут 1331 року, побачив місто в добу розквіту: за султана Абу Бакра ібн Саїда Умара, правителя берберського походження, у мечеті на п’ятничну молитву збираються численні купці, правознавці та суфійські містики з усіх куточків ісламського світу."
  mombasa_desc: "Момбаса, розташована на кораловому острові біля узбережжя Східної Африки, ще з XII століття — один із найважливіших суахільських портів. Географ аль-Ідрісі описував поселення як велике мусульманське місто, де нерідко кидають якір торгові кораблі із західної частини Індійського океану. Під владою султанів ширазі місто стало одним із найважливіших торгових осередків Суахільського узбережжя, поступаючись лише Кілві — наймогутнішому з усіх міст-держав, що витягнулися на півдні довгим ланцюжком. У гавань Момбаси заходять арабські дау, які прибувають із півночі, та індійські флотилії, що прямують далі, до Островів прянощів. Облямована мангровими заростями гавань і коралові мечеті — яскравий символ суахільської цивілізації, в якій злилися африканські, арабські та перські звичаї, створивши самобутню культуру краю мусонів."
  sofala_desc: "На південному краї Суахільського узбережжя, там, де Замбезі виходить до Індійського океану, стоїть Софала — велика брама, крізь яку з X століття вивозиться золото з глибин Африки. З Великого Зімбабве золото довгими караванними шляхами везуть до Софали — там дорогоцінний метал обмінюють на китайський шовк, перську кераміку та індійську бавовну; їх щороку привозять дау з Кілви та інших міст, що пливуть під мусонами. У X столітті Софалу відвідав арабський географ аль-Масуді, а під владою султанів із династії Махдалі — володарів Кілви, місто перетворилося на заставу могутньої північносуахільської держави. Процвітання його цілком залежить від торгівлі золотом і настання пори мусонів."
  gao_desc: "На північно-східному закруті великої річки Нігер стоїть Гао — столиця королівства Сонгай щонайменше з VIII століття. Його правителі, які прийняли іслам, почали торгувати з Північною Африкою ще задовго до піднесення Малі. На початку XIV століття звитяжні війська манси Муси підкорили Гао й включили його до складу Малійської імперії, перетворивши місто на одного з найважливіших данників великого володаря. Проте Гао не втратив свого значення: Нігером і далі ковзають дау, доправляючи на ринки Тімбукту сіль із Сахари та золото з південних лісів. Під владою Малі сонгайський царський дім зберігає своє становище, а мечеті й торгові квартали міста віщують прийдешнє відродження сонгайської держави."
  djenne_desc: "На просторах внутрішньої дельти Нігеру розташоване велике поселення Дженне, засноване ще до Різдва Христового, що сусідить із Дженне-Дженно — однією з найдавніших міських цивілізацій Чорної Африки. Наприкінці XIII століття за короля Конборо місто навернулося в іслам, і сьогодні посеред квітучого поселення в дельті, побратима Тімбукту в торгівлі через Сахару, височіє велична соборна мечеть із саману. Купці Дженне обмінюють золото з родовищ Бамбука і Буре та зібрану в дельті бавовну на привезену з пустелі сіль. Архітектура міста зі спорудами з #italic банко#!, виступними дерев’яними балками й земляними вежами стала головним символом сахельського Судану."
  great_zimbabwe_desc: "На південь від Замбезі, на високому гранітному плато над річкою Сабі, народи шона в XI — XII століттях звели дивовижне місто, складене з каменю без жодної краплі розчину. Його вигнуті мури та конусоподібна вежа дали назву всьому царству: #italic дзімба дзембабве#! — «кам’яні доми». До XIV століття Великий Зімбабве зазнає свого розквіту: місто розкинулося на сотнях гектарів і налічує до 18 тисяч жителів, а його правителі контролюють торгівлю золотом, яке річковими й суходільними шляхами надходить до Софали на Суахільському узбережжі, а звідти — до Кілви й далі до країн Індійського океану. На місцевих ринках продаються різьблені фігурки птахів із мильного каменю, китайська порцеляна та намисто з Персії й Індії — свідчення розлогих торгових зв’язків цивілізації, про існування якої в Європі навіть не підозрюють."
  kano_desc: "За переказами хауса, місто Кано, що розкинулося в савані на південь від великих дюн Сахари, заснували нащадки легендарного героя Баяджидди — переможця змія, який охороняв криницю, і прародителя царів семи міст-держав хауса, наймогутнішим із яких до XIV століття стало саме Кано. Місто розляглося біля скелястого пагорба Дала, що вважається колискою держави, а його фарбувальні ями за глинобитними мурами приваблюють каравани, які прибувають із Сахари із сіллю та міддю. Натомість вони везуть тканини, пофарбовані індиго, і шкіряні вироби, якими славляться тутешні майстри. Царі Кано, як і раніше, правлять згідно з обрядами давньої віри хауса, однак торговими шляхами через Сахару до держави вже проникають перші ісламські проповідники й купці."
  axum_desc: "Аксум — одне з найдавніших міст Африки, з I століття — квітуча столиця Аксумського царства. Через порт Адуліс на Червоному морі його купці торгували з Римом та Індією, а в IV столітті за царя Езани християнство стало державною вірою — Аксум виявився першою державою Чорної Африки, яка прийняла нову віру. Величезні гранітні стели, зведені зодчими Аксума над царськими гробницями, і сьогодні височіють над руїнами міста. Найвища з них важить майже п’ятсот тонн; на її гранях висічено подобу багатоповерхового палацу. До XIV століття осередок політичної влади перемістився на південь: 1270 року Йєкуно Амлак відродив Соломонову династію, поклавши початок новій добі в історії Ефіопії. Проте Аксум зберіг значення духовної столиці ефіопського християнства. Тут, як і колись, коронують ефіопських імператорів, а в церкві Марії Сіонської, за переказами, зберігається найвеличніша святиня — Ковчег Заповіту."
  mayapan_desc: "Маяпан, зведений наприкінці XIII століття за потужним оборонним муром на сухих рівнинах північного Юкатану, став наступником стародавньої столиці мая — Чичен-Іци. Згідно з хроніками мая, місто заснував рід Коком, що вважав себе нащадками правителів колишньої столиці. Тут Кокоми очолили союз місцевих владик з усього Юкатану. Щоб зберегти вірність союзників, очільникам підвладних родів належить жити в столиці під невсипущим наглядом правителя. Численні, хоч і скромніші копії храмів Чичен-Іци свідчать про те, що жителі Маяпана щиро вважають себе спадкоємцями давнішої та величнішої цивілізації. Втім, головне досягнення Маяпана — політичне: його правителям вдалося згуртувати розрізнених володарів Юкатану в єдину конфедерацію."
  chan_chan_desc: "На пустельному узбережжі північного Перу, біля стрімкого урвища Анд, що спадають до Тихого океану, в місці, де роками не випадає ані краплі дощу, в XII — XIV століттях царі чиму звели велетенське місто Чан-Чан — найбільше місто доколумбової Південної Америки. За його мурами зодчі одну за одною зводили величні царські #italic сьюдаделі#! — відокремлені палацові комплекси, кожен із яких будували для одного володаря й після його смерті назавжди зачиняли. Викладені з саману стіни палаців прикрашають повторювані рельєфи із зображеннями хвиль та морських птахів, що нагадують про морське походження народу чиму. З цієї столиці правителі Чімору керують найбільшою прибережною державою, що будь-коли існувала в Андах: уздовж узбережжя на тисячу кілометрів тягнуться громади землеробів, рибалок і металургів — данників величного пустельного міста."
  cholollan_desc: "Біля підніжжя вулкана Попокатепетль, на великому Мексиканському нагір’ї, стоїть місто Чолольян. Тут височіє дивовижна піраміда #italic Тлачіуальтепетль#! — «рукотворна гора», найбільша архітектурна споруда доколумбової Америки. Її будівництво почалося ще за кілька століть до нашої ери, а згодом тольтеки та інші народи неодноразово розширювали й перебудовували її. На її велетенській основі й досі стоїть храм пернатого змія Кецалькоатля — великого божества, якому присвячено Чолольян. Місто неодноразово змінювало володарів: від тольтеків воно перейшло до ольмеків-шикаланка, а потім до тольтеків-чичимеків, проте й за нових правителів зберегло значення головної святині центрального нагір’я. Сюди, як і раніше, приходять правителі навколишніх земель, прагнучи, щоб жерці Кецалькоатля утвердили їхнє право на владу."
  qusqu_desc: "У високогірній долині Анд, у самому серці краю, який тутешні народи звуть чотирма сторонами світу, стоїть невелике місто Куско, в давнину — #italic Куску#!, «пуп землі». За переказами, його заснував Манко Капак, який вийшов разом із сестрою, котра водночас була його дружиною, з вод озера Тітікака і встромив золотий жезл на місці майбутнього міста. У XIII — на початку XIV століття Куско — скромна столиця невеликого володіння, що змагається із сусідами — чанками, кечуа та айярмаками — за панування в південних Андах. Його володарі, яким ще тільки належить прийняти титул #italic Сапа Інки#!, гуртують навколо себе союзників і вояків, аби наступне покоління їхньої династії спромоглося втілити значно грандіозніші задуми й підкорити своїй владі весь південь Анд."
  roskilde_desc: "У глибині фіорду на північному узбережжі Зеландії розташоване Роскілле — місто, яке в X столітті стало резиденцією королів династії Кнютлінгів, що об’єднали Данію. Першу кам’яну церкву тут, за переказами, звів сам Гаральд Синьозубий, тут-таки його й поховали. У XII — XIII століттях Роскілле, де розташувалися королівська усипальниця та кафедра впливового єпископа, перетворилося на найважливіше місто Данського королівства. Над містом виріс величний собор із червоної цегли — один із ранніх пам’ятників цегляної готики в Північній Європі. На початку XIV століття торгівля поступово почала переміщатися до порту Копенгагена на Зунді, проте Роскілле, як і раніше, залишається духовним серцем Данії — місцем, де вже понад три століття коронують і ховають її королів."
  kobenhavn_desc: "На східному узбережжі Зеландії, навпроти Сконе, біля вузької протоки Зунд колись стояло невелике рибальське село #italic Гавн#!. Король Вальдемар I подарував його своєму зведеному братові єпископу Абсалону, який близько 1167 року звів на острові Слотсгольмен укріплений замок для захисту від венедських піратів, що промишляли на Балтиці. За наступників Абсалона фортеця поступово розрослася в купецьке місто #italic Кьобманнсгавн#! — «купецьку гавань», що тримало під наглядом багаті оселедцеві промисли Зунду; щоліта сюди прямують величезні косяки риби. За володіння містом запекло змагаються данські королі та архієпископи Роскілле, проте найбільший зиск воно приносить купцям: завдяки вигідному розташуванню на Зунді сюди дедалі частіше приходять торгові кораблі з Балтики."
  lund_desc: "Наприкінці X століття Свен Вилобородий заснував у самому серці своїх володінь у Сконе місто Лунд. 1103 року вага міста стрімко зросла: папа Пасхалій II проголосив його кафедрою архієпископа всієї Скандинавії, тим самим відокремивши північні церкви від престолу Гамбурга-Бремена. За архієпископа Ассера розпочалося спорудження величного романського собору, освяченого 1145 року, що й досі височіє над містом. У його крипті розміщено знаменитий астрономічний годинник і скульптуру велетня Фінтролля. 1152 року статус архієпархії отримав Нідарос, а 1164 року — Уппсала, однак попри це Лунд зберіг першість над Данською церквою та Сконе, а його архієпископ і сьогодні належить до найвпливовіших сановників держави."
  oslo_desc: "За переказами, Осло близько 1049 року заснував король Гаральд Суворий. Місцем закладення міста став великий фіорд, який дав поселенню його назву. 1070 року тут було засновано єпископську кафедру, і в наступні століття Осло перетворилося на одне з головних міст Норвезького королівства. 1299 року король Гокон V Магнуссон зробив його своєю столицею. Королівський двір перебрався з Бергена ближче до політичного осередку Скандинавії. Близько 1300 року розпочалося зведення могутньої фортеці Акерсгус — символу королівської влади, що грізно височіє над гаванню. Між скелею, де стоїть Акерсгус, та єпископським кварталом туляться дерев’яні вулиці міста. Місцеві купці торгують деревиною та шкурами з внутрішніх країв Норвегії, обмінюючи їх на збіжжя й тканини з Балтики."
  nidaros_desc: "На березі Нідельви, там, де річка впадає у величезний фіорд Тренделаг (він же Тронхеймс-фіорд), близько 997 року король Олаф Трюґґвасон заснував Нідарос. Місто стало місцем спочинку його наступника — короля Олафа Гаральдссона, християнина, який загинув у битві біля Стікластадіра 1030 року й невдовзі після смерті був прилучений до лику мучеників. Над його гробницею звели величний собор, що став головною святинею північного світу. Сюди стікаються прочани з Ісландії, Гренландії та з Британських островів, а 1152 року Нідарос здобув статус архієпископської кафедри церковної провінції, що простягалася від серця Норвегії до її колоній у західних морях. Навіть після того, як королівська столиця перемістилася спершу на південь, до Бергена, а згодом до Осло, Нідарос залишається духовним серцем держави. Тут коронують її королів, а святий Олаф і далі вважається покровителем королівства."
  abo_desc: "У 40-х роках XIII століття, після того, як шведські хрестоносці підкорили язичників-фінів, у гирлі річки Аура було закладено Або (фінською #italic Турку#!). З часом місто стало головним опорним пунктом Швеції на південно-західному узбережжі Фінляндії. 1300 року тут було створено єпископську кафедру, а нещодавно освячений собор став духовним серцем Фінської церкви. Завдяки балтійським купцям, які вподобали міські причали, внутрішні землі Фінляндії поєдналися торговими шляхами зі Стокгольмом і ганзейськими містами. Хоча Або все ще поступається за значенням великим ганзейським портам південної Балтики, воно вже відіграє вагому роль урядової та церковної столиці шведських володінь у Фінляндії, а його єпископ належить до найвпливовіших прелатів Шведської церкви."
  kalmar_desc: "На південно-східному узбережжі Швеції, там, де звужується протока між материком і довгим островом Еланд, у XII столітті постав Кальмар — могутній кам’яний замок, одна з найдавніших і найнеприступніших королівських твердинь Швеції, що дала назву місту, яке виросло під його мурами. Його гавань стала головним південним торговим портом королівства: звідси залізо, мідь та масло вирушають до ганзейських міст, таких як Любек, і навіть далі. 1276 року король Магнус Ладулос надав Кальмару привілеї, підтвердивши його становище серед найважливіших міст королівства. На початок XIV століття стратегічне розташування Кальмара на шведсько-данському кордоні та потужні міські укріплення зробили його водночас найважливішим торговим портом і головним бастіоном на південному рубежі шведського королівства, покликаним стримувати зазіхання Данії."
  falun_desc: "На схилах великої червоної гори Тіскашебергет у Даларні розташовані мідні копальні #italic Стура-Коппарберґ#! — найбільше й найбільш розроблюване родовище міді в середньовічній Європі, відоме шведам щонайменше з IX століття. 1288 року король Магнус III офіційно надав привілеї гірничому товариству #italic Stora Kopparbergs Bergslag#!, у віданні якого перебувають копальні, — одному з найдавніших спільних комерційних підприємств у світі. Біля озера під копальнями, навколо величезного кар’єру розрослося селище гірників Фалун. Дим від плавилень і червоний пил від оксидів забарвили ґрунт і будинки на багато кілометрів навколо, а виплавлена тут мідь надходить не лише до скарбниці Шведського королівства, а й на ринки Північної Європи."
  uppsala_desc: "За кілька кілометрів від скромного міста, віддалік соборного майдану, стоїть Стара Уппсала — колись осередок шведського язичництва. Тут, за описом Адама Бременського, височів великий прикрашений золотом храм, де щодев’ять років людей і тварин приносили в жертву Тору, Одіну та Фрейру. Над рівниною й донині височіють королівські кургани, де спочивають конунги з роду Інґлінґів. Після навернення Швеції до християнства язичницьке святилище занепало. 1164 року папа Александр III заснував в Уппсалі кафедру архієпископа всієї Швеції, після чого Шведська церква стала незалежною від Лунда, який верховодив над Данією. 1287 року кафедру перенесли на кілька кілометрів на південь, до нового міста Естра-Арос, де почалося спорудження величезного собору в стилі цегляної готики. Передбачається, що він стане найбільшим собором Скандинавії, а біля його вівтаря головні прелати держави коронуватимуть правителів Швеції."
  skara_desc: "На рівнинах Вестерйотланду, між великими озерами Венерн і Веттерн, 1014 року король Олаф Шетконунг заснував першу в Швеції єпископську кафедру. Першим прелатом, який посів цю посаду, став німецький місіонер Тургот. З цього скромного міста християнська віра поширилася на решту Швеції, яка тоді здебільшого ще трималася язичництва, а освячений 1150 року за єпископа Бенгта Доброго величний романський собор на довгі віки закріпив за Скарою славу духовного серця Вестерйотланду. Хоч із часом своїм впливом Скара поступилася Уппсалі та Лінчепінгу, її єпископ і донині вважається одним із найвпливовіших прелатів шведської держави. Його кафедральний капітул і #italic «Хроніки Скари»#! (Skarakroniken) досі бережуть пам’ять про перші століття після хрещення країни."
  linkoping_desc: "На рівнині Естерйотланду, там, де шлях зі Стокгольма до південних королівств перетинає річка Стонг, стоїть Лінчепінг. На початку XII століття тут було створено кафедру єпископа, і відтоді місто залишається одним із найважливіших церковних володінь шведської держави. У XII столітті в Лінчепінгу розпочалося зведення величного собору зі світло-сірого вапняку, що триває й донині. З часом він розрісся й перетворився на одну з найграндіозніших готичних споруд у Швеції. Єпископ Лінчепінга своїм впливом серед усіх прелатів королівства поступається лише архієпископу Уппсали. У розташованому неподалік Шеннінгу 1248 року відбувся великий собор, скликаний папським легатом Вільгельмом Моденським (Сабінським). На ньому шведському духовенству було наказано дотримуватися безшлюбності; це рішення остаточно долучило церкву Швеції до кола латинських християнських звичаїв."
  soderkoping_desc: "На місці, де річка Сторо впадає в Балтійське море, біля закритого річкового рукава розташоване місто Седерчепінг. У XII — XIII століттях воно стало одним із найважливіших портів Шведського королівства. До його причалів пристають численні коги з Любека й Вісбю, що везуть залізо та мідь із внутрішніх країв Швеції на південні ринки. Королівське торгове місто Седерчепінг з часом надбало значну німецьку громаду, яка запровадила тут звичаї, що спиралися на любецьке право. У місті відбуваються коронації, укладаються договори й проходять велелюдні ярмарки, куди щоліта з’їжджаються купці з усієї Балтики. Хоч стан його гавані викликає занепокоєння — водні шляхи поступово заносить мулом — на початок XIV століття Седерчепінг усе ще залишається одним із найважливіших торгових міст на східному узбережжі Швеції."
  lodose_desc: "Там, де виточена з озера Венерн річка Гета-Ельв звивається до моря, розташоване Ледесе — єдиний вихід Швеції до Атлантики та торгових шляхів Північного моря. Дерев’яний річковий порт тісниться на вузькій смузі землі між водою та крутими західними схилами. Від його причалів шведські кораблі вирушають до Норвегії, Англії та міст Нідерландів — там купці обмінюють залізо й шкури на західні тканини та вина. Тут-таки щонайменше з XII століття працює королівський монетний двір, що карбує монету для шведських володарів. Питання про приналежність Ледесе вже багато століть залишається причиною дипломатичних суперечок: за владу над ним змагаються Данія, Норвегія та шведські землі в нижній течії річки. Стратегічна вага міста величезна: ніде більше у Швеції немає такого зручного виходу до Атлантики."
  jonkoping_desc: "На південному краї величезного озера Веттерн, там, де пролягає природний шлях між нагір’ями Смоланда та рівнинами Естерйотланду, розташований Єнчепінг. 1284 року король Магнус Ладулос дарував йому міські привілеї та грамоту, яка лише закріпила за містом його давнє становище важливого перехрестя шляхів між північними та південними королівствами — осередку для зустрічей і торгівлі. Вигідне розташування на головному тракті між центральними провінціями Швеції та кордоном із підвладною Данії Сконе зробило Єнчепінг водночас жвавим торговим містом і прикордонною твердинею. Королівські зодчі невтомно зміцнюють королівський замок, що височіє над гаванню, — головний оплот проти невпинних зазіхань Данії посунути кордон на північ. На початок XIV століття Єнчепінг — найважливіший опорний пункт, політичний та географічний ключ до шляху зі Смоланда до серця шведської держави."
  ribe_desc: "Рібе, заснований вікінгами близько 700 року як торгове поселення на болотистому західному березі Ютландії, де припливи давали змогу витягати кораблі на берег, — найдавніше місто Скандинавії. Його купці торгували з узбережжям Фризії та Англії ще більш ніж за століття до того, як вікінги дісталися Британських островів. Адам Бременський називав Рібе головним ринком Данії, а на початку IX століття місіонер Ансгар заснував тут церкву. Місто стало одним із перших осередків християнства на півночі Скандинавії. У XII столітті тут розпочалося будівництво величного романського собору. Матеріалом для нього став туф, що його привозили з Рейнських земель. Він і сьогодні височіє над містом, чиї купці й надалі торгують із фризькими та фламандськими портами через Північне море: сіль і збіжжя із західного узбережжя Данії вони вимінюють на південні тканини й вина."
  viborg_desc: "На центральному плато Ютландії, серед розлогих вересових пустищ та озер, розташований Віборг — місто, де з язичницьких часів збирається #italic ландстинг#!, тобто збори, на яких вожді півострова обговорюють закони й проголошують королів. Цей звичай не перервався навіть у Середньовіччі: нові королі Данії спочатку здобувають визнання у Віборзі, а потім вирушають на південь, до Лунда, де архієпископ проводить обряд коронації. У місті зосереджена неабияка політична та церковна влада, і свідченням цьому — два величні собори: єпископський собор і стара королівська церква. Хоча значення Віборга для країни зменшилося з піднесенням Копенгагена та зміщенням осередку данської влади на схід, символічна першість його #italic ландстингу#!, як і раніше, відіграє важливу роль у зведенні на престол нових королів."
  odense_desc: "У самому серці острова Фюн розташоване Оденсе — місто, чия назва походить від імені скандинавського бога Одіна, якому тутешні язичники поклонялися задовго до хрещення країни. У 1086 році збунтовані шляхтичі вбили короля Кнуда Святого біля вівтаря церкви Святого Альбана, відмовившись сплачувати десятину та збори на хрестовий похід. Відтоді місто змінилося: навколо короля швидко виник культ, а в 1101 році папа римський канонізував небіжчика. Оденсе перетворилося на одну з головних святинь для скандинавських прочан. Монастир бенедиктинців, заснований англійськими ченцями з Івшема для збереження мощей святого, зробив місто осередком освіченості, і на початок XIV століття Оденсе стало найважливішим данським поселенням на островах на захід від Зеландії."
  aarhus_desc: "Орхус — поселення доби вікінгів, засноване на східному узбережжі Ютландії, там, де річка Орхус впадає в Каттегат. Перша згадка про нього належить до 948 року: Орхус згадано серед чотирьох данських єпископств, заснованих під впливом німецьких місіонерів невдовзі після хрещення Гаральда Синьозубого. Завдяки розташуванню в затишній бухті Орхус — місто купців і рибалок, над яким височіє величний цегляний собор XIII століття, — у Середньовіччі став найважливішим портом східної Ютландії: звідси худоба й збіжжя з ютландських рівнин вирушають на ринки Любека та Гамбурга. За політичною вагою він давно поступається Віборгу, а за торговою — Рібе, проте на початок XIV століття Орхус так само лишається головним портом Ютландії на узбережжі Каттегату."
  aalborg_desc: "На південному березі Лім-фіорду, там, де ця велична протока перетинає Північну Ютландію, сполучаючи Північне море з Каттегатом, стоїть Ольборг. Тут щонайменше з XI століття головну переправу через фіорд і торгові шляхи між двома морями стереже королівська фортеця Ольборггус — спершу просте дерев’яне укріплення. Багаті оселедцеві промисли Лім-фіорду принесли місту достаток, а його купцям — змогу вести жваву торгівлю з ганзейським містом Любеком і венедськими портами. На початок XIV століття Ольборг — одне з головних міст Північної Данії: тут діють королівські привілеї, міцніє верства містян, а над вулицями здіймаються суворі цегляні церкви. Але головне багатство міста — його вигідне розташування: хто володіє Ольборгом, той володіє найважливішою протокою Ютландії."
  tonsberg_desc: "Згідно із сагами Сноррі Стурлусона, Тенсберг було засновано ще до великої битви біля Гафрсфйорда, після якої у 872 році Гаральд Прекрасноволосий об’єднав Норвегію. Місто, яке претендує на звання найдавнішого в країні, виросло навколо затишної бухти на березі Осло-фіорду, куди в IX — X століттях заходили як дракари вікінгів, так і королівські кораблі. На височині над гаванню стоїть фортеця Тунсбергхус — один із найважливіших королівських замків середньовічної Норвегії, а завдяки заснованому тут наприкінці XII століття абатству премонстрантів Олавсклостер місто стало справжнім осередком знань. Мало яке місто настільки важливе для норвезького люду, як Тенсберг: тут укладали угоди норвезькі королі та претенденти на престол, карбувалася королівська монета, а за часів міжусобних воєн і хрестових походів збиралися війська. За значенням місто поступається лише Бергену, Нідаросу та Осло."
  stavanger_desc: "У затишній бухті на південно-західному узбережжі Норвегії, там, де великі фіорди Рюфюльке виходять до Північного моря, розташоване місто Ставангер. У 1125 році король Сігурд Хрестоносець заснував тут єпископську кафедру. Для цього він запросив англійського єпископа Рейнальда Вінчестерського, який приніс із собою звичаї англо-нормандського церковного зодчества. Закладений ним романський собор — одна з найяскравіших пам’яток англійського впливу на церковну архітектуру Скандинавії — і досі височіє над гаванню. Відколи тут було засновано кафедру, Ставангер став одним із найважливіших церковних володінь Норвезького королівства. Під владою його єпископства перебувають розлогі землі, від Ругаланна до Агдера, хоча сама гавань так і залишилася скромним рибальським портом на західній околиці норвезької землі."
  hamar_desc: "На західному березі озера Мйоса, у самому серці Норвегії, розташоване місто Гамар. У 1152 році кардинал Ніколас Брейкспір — реформатор Норвезької церкви й майбутній папа Адріан IV — заснував тут єпископську кафедру, водночас підготувавши ґрунт для створення архієпископства Нідароса. Невдовзі на березі озера розпочалося будівництво собору, який у XII — XIII століттях перетворився на один із найвеличніших романських храмів Норвегії. Єпископ Гамара, якому підпорядкована велика єпархія, що простяглася від гірських долин до поселень на берегах Мйоси, належить до найвпливовіших прелатів королівства. На початок XIV століття це скромне містечко стало духовним серцем усіх норвезьких земель, осередком церковного життя жителів приозерних країв та східних гір."
  vyborg_desc: "У 1293 році під час Третього шведського хрестового походу до Карелії маршал Торгільс Кнутссон наказав збудувати на острові біля Карельського перешийка потужний кам’яний замок — найсхіднішу з усіх шведських твердинь, головний рубіж оборони проти новгородців. Протягом тридцяти років шведські намісники влаштовували звідси походи проти карелів і руських людей, поки нарешті в 1323 році за умовами Оріховецького миру не було встановлено офіційний кордон між Швецією та Новгородом. Відтепер Виборг неподільно належав шведській короні. Згодом довкола замку розрослося торгове поселення — тут торгують карельським хутром, руським воском та фінськими товарами. Біля Виборга нерідко кидають якорі кораблі, що ходять Балтикою: з роками місто перетворилося на важливий порт."
  burgos_desc: "У 884 році граф Дієго Родрігес Порселос заснував біля злиття річок Арлансон і Вена місто Бургос. Протягом IX–X століть воно слугувало головним оплотом, що захищав Кастильське графство від набігів, а в 1037 році, за короля Фердинанда Великого, стало головним містом об’єднаного королівства Кастилія і Леон. Тут народився іспанський народний герой Родріго Діас де Вівар на прізвисько Ель Сід — його останки спочивають у монастирі Сан-Педро-де-Карденья. Через Бургос також пролягає #italic Camino Francés#! — Дорога французьких королів, частина шляху Святого Якова — прочанської дороги до міста Сантьяго-де-Компостела. У 1187 році Альфонсо VIII збудував у Бургосі усипальницю кастильських королів — Лас-Уельгас, а в 1221 році за короля Фердинанда III почалося спорудження величного готичного собору — однієї з найвизначніших архітектурних пам’яток середньовічної Іспанії."
  leon_desc: "Місто Леон виникло на місці римського табору, заснованого легіонерами з #italic Legio VII Gemina#!, звідки й походить його назва. У X столітті Леон став столицею об’єднаного королівства Леон і Астурія. Звідси хвиля Реконкісти рушила на південь, через Кантабрію на плоскогір’я Месета. Згодом місто набуло статусу духовного й політичного осередку країни, що змагався з Кастилією за повагу й землі та часом навіть перевершував свого суперника. Велич Леона підкреслював не лише королівський палац, а й Королівський пантеон — збудована в XI столітті в базиліці Сан-Ісидоро усипальниця для монарших осіб. Після того як у 1230 році король Фердинанд III уклав унію з Кастилією, місто втратило статус провідної потуги (відтоді такими вважалися Толедо й Вальядолід), але зберегло давню королівську гідність. Цю гордість і сьогодні втілює в собі величний католицький собор, зведений у 1205 році за зразком соборів на півночі Франції."
  salamanca_desc: "Давнє місто Саламанка, розташоване у західній Месеті, на скелястому крутосхилі над річкою Тормес, — спершу кельтиберське, а згодом римське поселення. Християни з’явилися тут лише в 1085 році за короля Альфонсо VI, під час повторного освоєння земель між Дуеро та Тахо. У 1218 році король Леону Альфонсо IX заснував у місті #italic Studium Generale#! — «дім загального навчання», один із найважливіших навчальних закладів християнського світу поряд з університетами в Болоньї, Парижі та Оксфорді. У 1255 році папа Александр IV надав університету ступінь #italic licentia ubique docendi#!. На початок XIV століття Саламанка стала справжнім осередком інтелектуального життя Кастилії, чому неабияк посприяли зусилля її уродженців — видатних богословів і тлумачів канонічного права."
  segovia_desc: "Сеговія, що розкинулася біля підніжжя хребта Сьєрра-де-Гвадаррама, незмінно вражає мандрівників виглядом гранітних арок давньоримського акведука, який понад 1200 років постачає жителям міста воду з річки Фріо. Цей акведук — одна з найбільш вражаючих пам’яток античного зодчества: у його муруванні немає ані краплі зв’язувального розчину. У Середні віки Сеговія, яка знову завирувала життям після завоювання королем Альфонсо VI Толедо в 1085 році, стала улюбленою резиденцією володарів. Тут таки розташувався королівський монетний двір, а в місцевій фортеці над річкою — Алькасарі — кастильські королі чинили правосуддя й видавали укази. На ринках Фландрії нарозхват розходиться вовна із Сеговії — її дають мериносові вівці, яких переганяють з естремадурських зимових пасовищ на кастильські нагір’я влітку та назад — із настанням зими."
  avila_desc: "На гранітному виступі біля західного краю Центральної Кордильєри, відкрита всім вітрам, розкинулася Авіла. Граф Раймунд Бургундський, з чиєї волі в 1090 році тут знову оселилися люди, негайно наказав обнести місто найміцнішими та найнеприступнішими мурами в усій Іберії. Муляри з Леона та Бургоса впоралися із цим задумом менш ніж за 10 років. Аж 88 напівкруглих веж і дев’ять брам, споруджених на скельній основі, надійно захищають місто від нападів ворогів із кордонів Кастилії, а місцеві церкви (зокрема й собор Христа Спасителя, чия апсида вбудована у східну частину муру) повною мірою вдовольняють духовні прагнення жителів. На початок XIV століття мури Авіли анітрохи не втратили міцності — це все такий же символ заселення колишніх кастильських земель, надійний і непохитний захисник Месети."
  madrid_desc: "Наприкінці IX століття арабські завойовники заснували на північному кордоні своїх володінь заставу під назвою #italic Майріт#! — «джерело»; така назва відображала багатство джерел води, що зрошували вересові пустища. У 1083 році застава без опору перейшла до рук короля Леона і Кастилії Альфонсо VI, завойовника Толедо. У 1202 році Альфонсо VIII надав Мадриду #italic фуеро#!; крім того, сюди нерідко навідувався королівський двір, уподобавши полювання в цих краях. У 1309 році король Фердинанд IV уперше скликав у Мадриді кастильські кортеси — це рішення засвідчило зрослу роль міста у врядуванні, хай навіть воно й сьогодні залишається в тіні величного імперського Толедо."
  santiago_compostela_desc: "На початку IX століття самітник Пелайо, ідучи за провідною зіркою над дубовим гаєм у пагорбах Галісії, виявив давньоримську гробницю, в якій, за словами єпископа Теодеміра з Ірії-Флавії, спочивав апостол Яків — брат Івана, що прийняв мученицьку смерть в Єрусалимі й був перенесений сюди вірними послідовниками. Король Астурії Альфонсо II спорудив над гробницею церкву, і в XI–XII століттях Сантьяго-де-Компостела стало одним із найважливіших для християнських прочан міст, поступаючись лише Риму та Єрусалиму. Покутники, що стікаються сюди з усіх куточків Європи, незмінно носять на головних уборах знак святого — #italic великий гребінець#!. У цьому місті закінчується #italic Camino Francés#!, Дорога французьких королів, — найбільш сходжений тракт середньовічної Європи. Стомлених подорожніх зустрічає величний романський собор, будівництво якого заклав у 1075 році єпископ Дієго Пелаес, а завершив видатний єпископ Дієго Жельмірес. Сьогодні архієпархія Компостели — одна з найвпливовіших єпархій латинського світу, за яку точиться невпинна боротьба."
  zaragoza_desc: "У давнину Сарагоса мала назву #italic Цезараугуста#! на честь імператора Августа — засновника колонії у верхів’ях річки Ебро. Це римське місто колись було звичайним прикордонним поселенням, згодом перейшло до рук вестготів, а в 714 році його зайняли араби. В XI столітті за династії Худидів майбутня Сарагоса стала столицею однієї з найбільш розвинених держав — наступниць Аль-Андалусу. Зведений у ті роки палац Альхаферія і сьогодні вважається однією з найкращих пам’яток ісламського придворного зодчества пізнього зразка. У 1118 році місто підкорилося арагонському королю Альфонсо Воїтелю, який здобув тоді одну з найвидатніших перемог Реконкісти. Сарагоса здобула статус нової столиці Арагону. Завдяки тому, що тут розташувалися величні церкви у стилі «мудехар», королівський монетний двір і місце зібрання арагонських кортесів, Сарагоса стала пишною перлиною арагонської корони, її церемоніальним і політичним осередком."
  valencia_desc: "Місто Валенсія, колишня римська колонія #italic Валентія Едетанорум#!, споруджена на прибережній рівнині Турії, після римлян належало спершу вестготам, потім — маврам, а згодом ненадовго перейшло в особисте володіння Родріго Діаса де Вівара, знаного як Ель Сід. Де Вівар володів містом із 1094 року й до самої своєї смерті в 1099 році. Після того як християнське військо Ель Сіда полишило місто, воно знову відійшло мусульманам. Під владою Альморавідів та Альмохадів Валенсія стала одним із найвеличніших міст Аль-Андалусу. Її #italic уерти#! — зрошувані поля й цитрусові гаї — зажили слави на все Середземномор’я. 9 жовтня 1238 року до Валенсії з тріумфом увійшов арагонський король Хайме Завойовник, який здобув довгоочікувану перемогу в найдовшій облозі на східному напрямку Реконкісти. З його волі у складі арагонської корони постало нове королівство Валенсія. Місто майже не втратило достатку; збереглися навіть його знамениті #italic уерти#!."
  palma_desc: "Місто Пальма на Балеарських островах колись було римською колонією #italic Пальмарією#!, після падіння імперії перейшло спершу до вандалів, відтак — до Візантії, а в 902 році його підкорив Кордовський халіфат і воно дістало арабську назву #italic Мадіна Маюрка#!. У 1229 році арагонський король Хайме Завойовник, який очолив хрестовий похід, захопив острів, і в 1276 році його син Хайме II отримав від батька нове володіння — королівство Мальорка, невелике, але багате: до нього належали Балеарські острови, Русільйон і Монпельє. На початку XIV століття Королівство Мальорка під владою Хайме III — це й надалі самостійний васал арагонської корони. Столиця королівства — один із найбільших торгових портів Західного Середземномор’я. Тут очам мореплавців відкривається величний собор Ла Сеу, зведений із золотистого пісковика."
  girona_desc: "Жирона, колись римська колонія #italic Герунда#! на Августовій дорозі у східних Піренеях, — укріплене місто, зведене на місці злиття чотирьох річок. З IX століття тут правлять Каролінги, які очолюють іспанську боротьбу проти мусульманського Аль-Андалусу. До XIII століття місто стало одним із головних володінь князівства Каталонія. Його єпископство має значний вплив у складі арагонської корони, а тутешнє юдейське подвір’я #italic Ель-Каль#! заселене видатними богословами й лікарями. У 1285 році, під час Арагонського хрестового походу — продовження Війни Сицилійської вечірні, французький король Філіпп III узяв в облогу Жирону, проте відважні захисники міста зуміли відбитися від наступального війська, а арагонці — розгромити французький флот біля островів Формігес, назавжди вписавши себе в сторінки історії."
  pamplona_desc: "Памплона, в античні часи — римська колонія #italic Помпаело#!, заснована в 75 році до н. е. римським полководцем Помпеєм під час Серторіанської війни, з 824 року слугує столицею басксько-романського королівства Наварра. Цей статус вона здобула за першого короля Наварри — Іньїго Арісти. Місто розділене на три ворожі між собою квартали, обнесені мурами: Наваррерія, де мешкають корінні жителі — баски, Сан-Сернен, заселений франкськими купцями, і Сан-Ніколас, де осіли французькі переселенці. Їхні чвари, що час від часу доходили до бійок під мурами, позначаються також і на порядках міста. З 1328 року наваррська корона належить дому д’Евре — молодшій гілці Капетингів. Сьогодні Памплона — столиця єдиного піренейського королівства, яке зуміло зберегти свою незалежність від Кастилії та Арагону, що набирають сили. Обличчя міста, водночас і баскського, і романського, і франкського, визначають не чужі сили, а його єпископ та купецтво."
  malaga_desc: "Місто Малага в давнину було фінікійською колонією, заснованою переселенцями з Тіра у VIII столітті до н. е., які дали їй назву #italic Малака#! за способом заготівлі риби. Протягом майже трьох тисяч років Малага залишається одним із найважливіших портів на півдні Піренейського півострова. Під владою Кордовського халіфату та гранадських Насрідів місто стало головною морською брамою Аль-Андалусу: до його гавані заходять десятки кораблів, що везуть шовк, невільників і прянощі з Магрибу, — а солодке вино й мигдаль із родючої #italic Ахаркії#! уславилися на все Середземномор’я. Від розбійників місто надійно боронить споруджена Хаммадідами в XI столітті алькасаба. За її мурами розташувалися генуезька купецька осада, подвір’я гарбарників та численні городи — підвалини господарської могутності Насрідів."
  almeria_desc: "Місто Альмерія, засноване на початку X століття Абд ар-Рахманом III як головний порт флоту Кордовського халіфату, в XI столітті стало одним із найбагатших поселень Аль-Андалусу: під владою місцевої тайфи альмерійські шовкоткачі та бронзарі почали постачати свої вироби до Леванту й Магрибу, а корабельники — спускати зі стапелів галери, здатні на рівних змагатися з пізанськими та генуезькими кораблями за панування над Західним Середземномор’ям. Занепад золотої доби Альмерії настав за Другого хрестового походу: у 1147 році об’єднаний флот Кастилії, Арагону, Генуї та Пізи захопив і сплюндрував місто. Через десять років Альмохади знову завоювали Альмерію, однак повернути їй колишню велич уже не вдалося. На початок XIV століття Альмерія — друге за важливістю місто насрідського королівства Гранада. У її майстернях і сьогодні, мовби на згадку про колишні часи, прядуть шовк."
  coimbra_desc: "Коїмбра, в античні часи — римський #italic Емініум#!, розташована на крутому пагорбі біля вигину річки Мондегу в бік Атлантичного океану. Свою назву місто дістало від розташованих поблизу руїн поселення #italic Конімбріга#!. У 1064 році король Леону Фердинанд Великий відвоював Коїмбру в маврів і заснував на цьому місці графство. З 1139 по 1255 рік, за правління короля Афонсу Великого та його наступників, Коїмбра слугувала столицею незалежного королівства Португалія. Тут були укладені перші літописи країни й написані перші лицарські романи. Навіть після того, як король Афонсу III переніс двір до Лісабона, Коїмбра зберегла культурний і духовний вплив. Нині в місті діє один із найважливіших в Іберії навчальних закладів — #italic Studium Generale#!, заснований королем Дінішем у 1290 році."
  braga_desc: "Брага отримала свою назву від заснованої імператором Августом римської колонії #italic Бракара Августа#! — столиці провінції Галлеція. Це одне з найдавніших християнських міст Іберії: уже в III столітті тут з’явилося єпископство. Брага — місто непорушних священних звичаїв, її домагання головного престолу всього півострова мають значну вагу. Духовний вплив Браги незмінно зростав, у чиїх би руках вона не перебувала, — чи то вестготів, свевів або маврів. Відновлена в 1070 році після Реконкісти архієпархія Браги впродовж кількох століть змагалася з Толедо за першість над Іберійською церквою. Архієпископ міста засідає у величному романському соборі, будівництво якого почалося в 1070 році, а різні прибудови з’являються й донині. У віданні архієпископа — духовне життя в Північній Португалії, а також утвердження церковної влади над церквами Галісії та Астурії."
  evora_desc: "На невисокому пагорбі у величній долині півдня Алентежу розкинулося місто Евора — колись поселення стародавніх кельтів-лузітанів, а згодом римське місто #italic Ебора Лібералітас Юлія#!; про велич імперії і сьогодні нагадує храм Діани, що височіє в середмісті. У 1166 році уславлений лицар Жералду Безстрашний відбив місто в маврів, узявши його приступом під покровом ночі. У XII—XIII століттях Евора стала найважливішим християнським містом Алентежу: тут засідає єпископ і розташовані головні осідки двох лицарських орденів Португалії — Авіського та ордена Калатрави. На початок XIV століття Евора здобула славу одного з найважливіших міст Португалії, а її величний романський собор, будівництво якого розпочалося наприкінці XII століття, — улюблена резиденція королів Авіської династії."
  merida_desc: "У 25 році до н. е. імператор Август заснував Меріду — колонію для ветеранів Кантабрійських воєн, а водночас — і столицю римської провінції #italic Лузітанія#!. З роками поселення перетворилося на одну з найвеличніших перлин Західної Римської імперії, а його театр, амфітеатр, цирк, акведуки та навіть дивовижний міст через Гвадіану збереглися й донині, переживши одинадцять неспокійних століть. За доби панування вестготів кафедра Меріди не лише зберегла, а й примножила свій вплив, а після завоювання арабами місто стало одним із найважливіших осередків на західному кордоні халіфату. У 1230 році король Леону Альфонсо IX відбив Меріду й передав її лицарям ордена Сантьяго, які заснували тут свій осідок. Скромне прикордонне містечко, що розкинулося серед давньоримських руїн, насправді є важливим опорним пунктом для наступу християнського війська на Естремадуру, а водночас — головним володінням могутнього кастильського лицарського ордена."
  tarragona_desc: "Давньоримське місто #italic Тарракон#!, засноване на узбережжі сучасної Каталонії після Другої пунічної війни, колись вважалося одним із найважливіших міст Західної Римської імперії: тут, у столиці провінції Ближня Іспанія, засідали проконсули, що правили нею. Тут же постала одна з перших християнських громад Іберії. У 714 році Таррагону сплюндрували арабські завойовники, і місто пустувало впродовж майже чотирьох століть. Його заселення розпочалося лише в 1118 році. Водночас у Таррагоні відновили архієпископство — митрополію каталонської церкви та головну прелатуру арагонської корони, що змагалася за церковну владу з Арагоном, Каталонією та Валенсією. На початок XIV століття місто частково відновило свою колишню велич; одним зі свідчень цього є величний романсько-готичний собор, що височіє над давньоримськими мурами."
  murcia_desc: "У 825 році емір Омейядського халіфату Абд ар-Рахман II заснував у закруті Сегури, поблизу #italic уерти#!, що виходить на прибережну рівнину, поселення #italic Мурсійя#!. Під владою емірів тайфи Мурсія в XI столітті стала найважливішим містом південно-східного Аль-Андалусу: тут процвітає виробництво шовку й кераміки, а місцеві математики та звіздарі гідно продовжують справу Ібн аль-Банни. У 1243 році королівство Мурсія уклало Алькараський договір, за яким стало протекторатом Кастилії. У 1266 році місцеві жителі підняли повстання, придушене арагонським королем Хайме I, а згодом Альфонсо X Мудрий включив місто до складу кастильської корони. На початок XIV століття Мурсія, заселена каталонськими та арагонськими переселенцями, вважається найважливішим прикордонним містом Кастилії — оплотом проти Насрідського королівства Гранада, що лежить на південному кордоні."
  cadiz_desc: "Близько 1100 року до н. е. фінікійські переселенці із Сура висадилися на півдні Піренейського півострова й заснували на піщаній косі, що врізається в Атлантичний океан, місто #italic Гадір#! — «твердиня». Згодом воно стало відомим як Кадіс — одне з найдавніших безперервно заселених міст Західної Європи. У його гавані впродовж трьох тисячоліть кидали якорі фінікійські, карфагенські, римські, вестготські та мавританські кораблі. У складі Західної Римської імперії #italic Гадес#! — одне з найбагатших міст — став батьківщиною видатних поетів, сенаторів і танцівниць, однак занепад римської держави призвів до того, що на мить захоплення міста маврами воно перетворилося на скромне рибальське селище. У 1262 році король Альфонсо X Мудрий відвоював Кадіс і перетворив його на прикордонний порт кастильської корони. На початок XIV століття це місто — одне з найпівденніших поселень Кастилії. Його гавань, звернена до Атлантики, терпляче чекає на відважних дослідників, готових вийти у відкритий океан."
  jaca_desc: "Місто Хака розташоване в Піренеях, у верхів’ях річки Арагон, де перевал Сомпор перетинає паломницька стежка, що веде з Франції. Цьому поселенню, заснованому на початку XI століття, король Раміро I спочатку призначив роль першої столиці новоствореного королівства Арагон. У 1063 році міська рада затвердила місцеве єпископство, а в 1077 році прийняла від короля Санчо Раміреса #italic фуеро#! — одне з перших і найвпливовіших зведень міських законів у всій Іберії. Згодом уздовж дороги до Сантьяго почали оселятися франкські купці та ремісники, а Хака стала настільки взірцевим містом, що її почали наслідувати міста Арагону та Наварри. Розташований тут величний романський собор Сан-Педро — один із найстаріших в Іспанії. До початку XIV століття арагонський двір уже залишив Хаку, перебравшись спершу до Уески, а потім до Сарагоси, однак місто й донині слугує північною брамою, що веде з Арагону до Франції, а водночас — важливим прихистком для паломників."
  san_sebastian_desc: "Під лісистою горою Ургуль, на березі Біскайської затоки, лежить Сан-Себастьян — місто, що виросло навколо монастиря святого мученика Себастьяна. Близько 1180 року місто отримало від наваррського короля Санчо VI Мудрого хартію, завдяки якій Наварра здобула омріяний вихід до моря. У 1200 році король Кастилії Альфонсо VIII приєднав Гіпускоа, і місто перейшло під владу кастильської корони. Сан-Себастьян зберіг привілеї, а гаскономовні містяни — рибалки й торговці — почали користуватися прихильністю влади. Тут панує відносний добробут: китобої Сан-Себастьяна безстрашно вирушають на промисел далеко від рідних берегів, а кораблі, що перевозять залізо й вовну до Бордо та інших міст, повертаються в порт із трюмами, повними вина. На початок XIV століття приморське місто-фортеця Сан-Себастьян — один із найважливіших портів Баскських земель."
  perpignan_desc: "Перша згадка про Перпіньян — поселення в долині річки Тет між Піренеями та Середземномор’ям — датується X століттям. У 1172 році Перпіньян — найважливіше місто графства Русільйон — увійшов разом із графством до складу арагонської корони. У 1276 році, після того як король Хайме I поділив свої володіння між спадкоємцями, Перпіньян став континентальною столицею нового королівства Майорка. Його володар Хайме II збудував на пагорбі над містом величний королівський палац. Місто уславлених русільйонських ткачів та чинбарів, розташоване на торговому шляху з Каталонії до Франції, майже не знає, що таке бідність. На початок XIV століття Перпіньян — головна резиденція королів Майорки на материку, а також заможне торгове місто, чиї верстати забезпечують одягом чи не все Західне Середземномор’я."
  alicante_desc: "Під крутим схилом гори Бенакантіль лежить місто, яке греки називали #italic Акра-Левке#! — «Білий мис», а римляни — #italic Луцентум#!. Під владою арабів Аліканте — скромний порт на Середземноморському узбережжі, що його захищала фортеця на пагорбі, — став відомий як #italic Мадінат Лакант#!. У 1248 році його захопив майбутній король Кастилії Альфонсо X. У 1296 році під час Війни за кастильську спадщину Аліканте перейшов до рук арагонського короля Хайме II, а в 1308 році за підсумками Агредського договору ввійшов до складу королівства Валенсія. На початок XIV століття Аліканте служить арагонській короні південним портом, звідки в море вирушають кораблі, завантажені дарами спекотних родючих земель краю: вином, мигдалем та еспарто."
  cartagena_desc: "Місто #italic Карт-Хадашт#! (у римлян — #italic Картаго-Нова#!), засноване близько 227 року до н. е. карфагенським полководцем Гасдрубалом у природній (і напрочуд вигідній) гавані Середземномор’я, збагатилося завдяки рясним срібним рудникам. Тут же базувався могутній карфагенський флот, який, утім, виявився нездатним завадити Сципіону Африканському взяти місто приступом у 209 році до н. е. Місцеве єпископство — одне з найстаріших у Римській Іспанії, проте століття тривалого занепаду та арабські завоювання наклали на місто свій відбиток: колись величний порт сьогодні — лише бліда тінь самого себе. У 1245 році кастильський інфант Альфонсо завоював місто й відновив місцевий престол. На початок XIV століття Картахена — скромна, проте стратегічно важлива гавань на кастильському прикордонні. З її порту й донині виходять флотилії, що плавають уздовж південного узбережжя."
  algeciras_desc: "У 711 році берберський воєначальник Тарік ібн Зіяд заснував на місці першої висадки арабських завойовників в Іберії поселення #italic Аль-Джазіра-аль-Хадра#! — «зелений острів»: обране ним місце дійсно розташоване в затоці біля острівця в західній частині протоки. Упродовж шести століть місто — зв’язкова ланка між Аль-Андалусом та Північною Африкою — слугувало головним портом для воїнів і купців, які прибували з Магрибу. Воно по черзі переходило до Омейядів, тайфи Альхесірас, Альморавідів та Альмохадів. На початок XIV століття Альхесірас — важливий опорний пункт Маринідів в Іберії: подвійна гавань, захищена міцними мурами, — найважливіший шлях, яким з Африки сюди, до цих неспокійних країв, надходить не лише золото, але й війська."
  gibraltar_desc: "Величезна вапнякова скеля #italic Джабаль Тарік#! («гора Таріка») знана насамперед як місце, де в 711 році висадилося військо Таріка ібн Зіяда — арабського завойовника Іберії. У 1160 році скелю, що раніше була лише непримітним місцем для спостереження за протокою, укріпив альмохадський халіф Абд аль-Мумін: він звів тут місто-фортецю й цитадель, яку назвав #italic Мадінат аль-Фатх#! — «місто перемоги». За задумом аль-Муміна, ця цитадель мала забезпечити йому панування над протокою. У 1309 році її ненадовго захопили кастильські війська, проте мусульмани незабаром відбили твердиню. На початок XIV століття Гібралтар — оплот Маринідів, на який зазіхають їхні вороги, адже хто володіє Гібралтаром, той володіє проходом між двома морями й двома материками."
  marbella_desc: "Марбелья, що розкинулася в родючій прибережній долині біля підніжжя гір Сьєрра-Бланка, спочатку належала римлянам, а потім, за доби арабського панування, стала відома як #italic Марбалла#!. Її алькасаба надійно стереже узбережжя, де рясно ростуть виноград, фініки та інші плоди тутешньої землі. Головна запорука добробуту міста — його порт, скромний, але важливий: звідси в море виходять кораблі, завантажені фруктами та шовком. Місцевим жителям не загрожує голод: теплі води Середземного моря щедрі на рибу. На початок XIV століття Марбелья — одне з міст у складі Насрідського королівства Гранада. Її мури захищають морські підступи до останньої ісламської держави Іберії."
  fez_desc: "Місто Фес, засноване близько 800 року династією Ідрісидів і розташоване на обох берегах однойменної річки, стрімко розрослося після того, як прийняло в себе андалузьких біженців із Кордови й арабські родини з Кайруана. Два засновані переселенцями квартали й надали місту його теперішнього вигляду. Фес — один із найосвіченіших осередків ісламського світу: тут розташовані велика мечеть та університет #italic Аль-Карауїн#!, заснований Фатімою аль-Фіхрі в 859 році. Сюди з’їжджаються правознавці, богослови й учені з усього Середземномор’я. Мариніди, які скинули Альмохадів, зробили Фес своєю столицею й у 1276 році звели поруч зі старим містом королівський квартал #italic Фас аль-Джадід#! — із палацами, садами та соборною мечеттю. На початок XIV століття Фес, політична та інтелектуальна опора Маринідського султанату, перебуває в зеніті слави."
  marrakesh_desc: "Марракеш, заснований у 1070 році альморавідським полководцем Абу Бакром ібн Умаром на краю великої долини Хауз, що лежить під засніженими горами Високого Атласу, — місто-диво: зі скромної застави в пустелі воно за лічені десятиліття перетворилося на столицю імперії, що простягалася від Сенегалу до Ебро. Під владою спершу Альморавідів, а згодом Альмохадів, які захопили місто в 1147 році, Марракеш переродився: його правителі звели в місті палаци, сади, мечеть Аль-Кутубія з величним мінаретом і навіть дивовижні підземні канали — #italic кхетари#!, якими мешканцям надходить вода з гір. Саме слово «Марракеш» в устах європейських мандрівників стало означати все королівство Марокко. До початку XIV століття резиденція Маринідів перемістилася на північ, до Феса, однак Марракеш і донині зберігає свій статус великої південної столиці — воріт, що з’єднують між собою Атлас, Сус і пустелю, де пролягають караванні шляхи."
  sijilmasa_desc: "Сіджільмаса, заснована в 757 році в пальмовій оазі Тафілальт, що на північній околиці Сахари, — одне з місць перепочинку караванів, які прямують через велику пустелю. Тут золото з Гани та Малі, перевезене на берберських верблюдах, обмінюють на сіль, тканини й вироби середземноморських країн. Упродовж довгих століть тут карбували золоті динари, без яких годі було уявити торгівлю в західній частині ісламського світу, а місцеві купці — посередники між двома континентами — багатіли день у день. На початок XIV століття колись незалежна й самоврядна Сіджільмаса перебуває під владою Альморавідів і все так само зберігає за собою роль головної брами, що веде до володінь Маринідів, хоча рано чи пізно її процвітанню настане кінець: каравани нині дедалі частіше обирають інші шляхи."
  rabat_desc: "У середині XII століття альмохадський халіф Абд аль-Мумін звів у гирлі річки Бу-Регрег укріплений #italic рібат#! — заставу, якій, утім, недовго судилося лишатися такою: онук халіфа Якуб аль-Мансур, здобувши в 1195 році перемогу під Аларкосом, перейменував заставу на #italic Рібат-аль-Фатх#! — «табір перемоги». З непохитним наміром заснувати тут столицю нової імперії він узявся за будівництво велетенської соборної мечеті. Її величний мінарет — вежа Хасана — так, утім, і залишився недобудованим: халіф помер, і ніхто не продовжив його грандіозного задуму. Його мрії втілилися лише в образі незавершеної вежі, яка мовчки споглядає все згори. Занепад династії Альмохадів призвів до поступового знелюднення колись прекрасного міста, і на початок XIV століття Рабат становить собою непоказне видовище: містечко, прикрите хоч і міцними, проте недобудованими мурами. Дні й ночі тут минають у спостереженні за Атлантикою та містом-сусідом по той бік річки — Сале."
  sale_desc: "На північному березі річки Бу-Регрег, біля місця, де вона впадає в Атлантику, розташований один із найважливіших портів середньовічного Марокко — Сале. Тут збіжжя, вовна, шкіра й віск із внутрішніх країв держави вирушають до християнських міст Іберії та Італії, а також на ринки Середземномор’я. У 1260 році кастильський флот сплюндрував місто, проте султани з династії Маринідів не лише відбудували зруйноване поселення, а й укріпили його та звели в міських мурах прекрасну соборну мечеть і медресе. На початок XIV століття Сале, місце, де сходяться два моря, — багате й освічене торгове місто, а вчені та правознавці, які тут мешкають і трудяться, глибиною пізнань не поступаються суперникам із великих материкових міст."
  ceuta_desc: "Розташована на африканському березі Сеута (арабською — #italic Сабта#!), місто, де зливаються два моря й майже сходяться два континенти, — одна з найважливіших і найспокійніших перевалок у Середземному морі, яка природним шляхом сполучає між собою Магриб та Аль-Андалус. Місцеві майстерні славляться латунними виробами, а переписувачі — дивовижної якості рукописами; крізь місто течуть торгові потоки, що єднають Африку та Європу, а значить — золото і крам, тож життя тут не вщухає ні на мить. Зусиллями місцевої купецької знаті — Азафідів — Сеута на заздрість багатьом і досі зберігає незалежність. На початок XIV століття за місто змагаються Мариніди та гранадські Насріди: ніхто з них не здатен добровільно зректися ключа до протоки."
  tangier_desc: "Танжер, розташований у західній частині протоки, де Середземне море сходиться з Атлантикою, — одне з найстаріших міст Марокко. Колись тут було фінікійське торгове поселення, згодом — римська колонія #italic Тингіс#!, столиця провінції Мавретанія Тингітанська. Ця гавань, що має без перебільшення стратегічне значення, за минулі століття переходила спершу до вандалів, потім до Візантії, Омейядів, Альморавідів і, зрештою, Альмохадів: місто на перетині Африки та Європи — жадана здобич. На початок XIV століття Танжер — скромний порт під владою династії Маринідів, однак значення його велике: розташування на краю материка саме собою привертає увагу будь-якої держави, що прагне встановити контроль над протокою."
  taza_desc: "Місто-фортеця Таза має стратегічне значення: воно розташоване обабіч вузького проходу між хребтом Ер-Риф та Середнім Атласом — єдиним доступним перевалом між Східним і Західним Марокко. Саме тут у 30-ті роки XII століття закріпився альмохадський халіф Абд аль-Мумін, і звідси ж він рушив у похід на Марракеш. Приблизно в ті самі роки в Тазі збудували знамениту мечеть. Згодом місто завоювали Мариніди, які добре розуміли цінність твердині, що боронила шлях до Феса. На початок XIV століття місто-фортеця Таза — найважливіша брама на східному кордоні володінь Маринідів, ключ до панування над усім Марокко."
  meknes_desc: "На родючих рівнинах на північ від Середнього Атласу, серед фруктових садів, оливкових гаїв і нив виросло квітуче торгове місто Мекнес, засноване в X столітті берберами-мекнасами і згодом перетворене на фортецю Альморавідами. І хоч сусідній Фес затьмарює його своєю пишністю, Мариніди все ж не залишили місто — хлібородну, повноводну житницю — без уваги: тут звели мечеті та прекрасне медресе. На початок XIV століття Мекнес — заможне провінційне місто, багате на сади та ринки. Стратегічно вигідне розташування та щедрі угіддя — запорука славного майбутнього."
  taroudant_desc: "Розташоване в родючій долині річки Сус між Високим Атласом та Антиатласом місто Тарудант здавна вважається найважливішим поселенням на південних землях: щедрий приплив річкових вод забезпечує чудові врожаї збіжжя, оливок, цукрової тростини, фруктів та овочів. У 1056 році місто захопили Альморавіди; ця перемога стала однією з перших у низці завоювань, що зрештою забезпечили їм тривалу славу та владу. Місто-фортеця довго слугувало столицею й головним торгом усього краю; сюди звозили як дари долини, так і товари з далеких пустельних оаз. На початок XIV століття Тарудант — місто між горами, долинами та пустелею, що ховає за міцними мурами сади й ринки, — як і раніше, процвітає."
  aghmat_desc: "Розташоване біля підніжжя Високого Атласу місто Агмат ще до заснування Марракеша зажило слави головного міста Хауза завдяки успішному торгу, де торгували дарами гір і долин, а також крамом, який привозили сюди каравани, що перетинали Сахару. Недовгий час, ще до заснування неподалік нової столиці, тут жили Альморавіди, і в цьому ж місті доживав свого віку вигнаний емір Севільї, поет аль-Мутамід, який помер тут у 1095 році. Його гробниця й донині приваблює паломників — поціновувачів його тужливої лірики. На початок XIV століття Агмат, опинившись у тіні Марракеша, перетворився на скромне містечко, чия слава збереглася радше не в пам’яті люду, а в поетичних рядках полоненого тут померлого еміра."
  tinmel_desc: "У затишній долині Високого Атласу розташувалася гірська твердиня Тінмель — колишня колиска руху Альмохадів. Саме тут магді ібн Тумарт, проповідник єдності Бога, на початку XII століття здобув підтримку численних послідовників-берберів, повалив Альморавідів і підкорив Магриб та Аль-Андалус. Гробниця ібн Тумарта, а також зведена поруч із нею укріплена мечеть вабили паломників до гірського Тінмеля — духовної столиці та святині Альмохадів. На початок XIV століття династія Альмохадів давно занепала, і сьогодні Тінмель — досі шановане, проте вже рідко відвідуване через свою віддаленість святилище. Його мечеть — мовчазний пам’ятник імперії, що зійшла з гірських вершин."
  volubilis_desc: "На родючому плато біля пагорбів неподалік міста Мекнес розкинулося місто Волюбіліс — колись римська колонія, арабською звана #italic Валілі#!, західна столиця провінції Мавретанія Тингітанська. Це багате провінційне місто на самому краю римської ойкумени вражало тріумфальними арками та базиліками, олійницями й чудовими мозаїками. Ближче до падіння Риму легіони залишили місто, проте воно продовжило жити вже за берберів. У 788 році втікач Ідріс ібн Абдалла заснував тут за підтримки місцевих племен першу мусульманську династію Марокко. На початок XIV століття від колись величного римського міста залишилися переважно величні руїни та скромне поселення. Повалені від старості колони — сумне нагадування: імперії народжуються й гинуть, і ніщо не вічне."
  anfa_desc: "Берберське портове місто Анфа, розташоване на невеликому пагорбі біля Атлантичного узбережжя, є самодостатнім: їжу його мешканцям дарують океан і родюча долина Шауя, а засоби до життя — морська торгівля. Місто вільне від впливу великих материкових держав, а тому здавна привертає заздрісні погляди й має славу прихистку безстрашних мореплавців і піратів, що грабують кораблі, які пропливають біля берегів. На початок XIV століття Анфа має невелику, проте жваву гавань на окраїні володінь Маринідів. Кораблі, що виходять звідси, полюють не лише на рибу, а й на інших, беззахисних моряків."
  azemmour_desc: "Давнє портове місто Аземмур, розташоване на скелі над гирлом великої річки Умм-ер-Рбія, що впадає в Атлантичний океан, живе дарами річки та моря. Понад усе тут цінують оселедець — щовесни багаті косяки цієї риби йдуть угору за течією. З гавані вирушають кораблі, завантажені збіжжям і вовною з родючої долини Дуккала, — цей крам незмінно має попит серед купців Іберії та Середземномор’я. На початок XIV століття Аземмур — квітуче портове місто-фортеця на Атлантичному узбережжі Марокко, заселене рибалками й торговцями. Проте його багатство мінливе: воно приходить і відходить, мов річкові припливи й відпливи."
  asfi_desc: "Старе місто Асфі, розташоване під невисокими скелями в бухті на узбережжі Атлантики, живе не лише рибальством, а й торгівлею: з порту Асфі на захід прямують кораблі зі збіжжям, вовною, свіжими фруктами та овочами з долини Абда. До його гавані заходять генуезькі, каталонські та португальські купці, охочі до товарів із південного Марокко, а місцеві рибалки привозять щедрі улови з прибережних вод Атлантичного океану. На початок XIV століття Асфі — одне з найважливіших міст на півдні володінь Маринідів, що сполучає державу з християнськими купецькими осередками. У його скромній гавані ні на мить не вщухає життя."
  asilah_desc: "Асіла — один із найдавніших портів Марокко. Цінність розташування на березі Атлантичного океану на південь від затоки усвідомлювали ще фінікійські та карфагенські купці, які в давнину заснували тут поселення #italic Зіліс#!. За часів римського панування місто з його численними пристанями входило до складу провінції Мавретанія Тингітанська, а згодом не раз переходило з рук у руки через свою неабияку перевагу — близькість до входу в затоку. На початок XIV століття Асіла — скромний, але непогано укріплений порт, що належить Маринідам. Його гавань приймає купецькі кораблі, що ходять уздовж узбережжя Атлантики, а мури надійно боронять жителів від морських розбійників і флотів інших держав."
  larache_desc: "На узбережжі Атлантики, де річка Лукос впадає в океан, колись розташовувалася фінікійська колонія #italic Ліксус#! — одне з найстаріших торгових поселень у цих краях. Давні люди вірили, що саме тут лежать сади Гесперид. Через століття на руїнах Ліксуса виросло місто Лараш. Його мешканці невибагливі: вони ловлять рибу в річці й океані, добувають сіль на солончаках і торгують збіжжям та готовими виробами. На початок XIV століття Лараш — невеликий, проте доволі важливий порт у складі держави Маринідів. Завдяки вдалому розташуванню біля гирла річки тут можна кинути якір, не побоюючись, що стрімка течія понесе корабель у відкрите море."
  tetouan_desc: "У родючій долині біля підніжжя хребта Ер-Риф, неподалік Середземного моря, маринідський султан Абу Табіт близько 1286 року відновив та укріпив зруйноване поселення Тетуан, перетворивши його на опорний пункт для облоги сусідньої Сеути. Завдяки розташуванню за гирлом річки, між горами та морем, Тетуан виявився природною фортецею, а водночас — і місцем бурхливої торгівлі між Ер-Рифом та узбережжям. На початок XIV століття Тетуан — укріплене маринідське місто, що відіграє для держави далеко не останню роль: звідси зручно захищати підступи до Середземномор’я та гірські шляхи Північного Марокко."