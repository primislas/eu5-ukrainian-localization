 ai_friendly: "Дружелюбие"
 ai_aggressive_desc: "Эта держава стремится к власти, используя силовые методы. Она охотно начинает войны, выдвигает жёсткие условия мира и считает соседние державы препятствиями на пути к цели, а не партнёрами для выгодного сотрудничества."
 ai_expansionist_desc: "Эта держава стремится расширять свои границы и влияние. Она предпочитает территориальную экспансию, активно выдвигает претензии на те или иные земли и по возможности старается подчинять, а не присоединять соседей."
 ai_defensive_desc: "Эта держава в первую очередь стремится сохранить то, что уже имеет. Она предпочитает избегать ненужных конфликтов, укреплять свои земли и скорее отвечать на угрозы, чем создавать новые."
 ai_cautious_desc: "Эта держава отличается терпением и избегает рисков. Она в первую очередь стремится к дипломатическим решениям, избегает затяжных войн и предпочитает стабильность авантюрам."
 ai_opportunistic_desc: "Эта держава отличается расчётливостью и прагматизмом. Она стремится найти слабое место у своего оппонента и не упускает момент воспользоваться случаем, но избегает участия в конфликтах с неопределённым исходом."
 ai_isolationist_desc: "Эта держава сосредоточена на себе, предпочитает внутреннее развитие и избегает участия в делах соседей. Она придерживается нейтралитета и с подозрением относится к дипломатическим обязательствам."
 ai_friendly_desc: "Эта держава ценит союзников, доброжелательность и честные сделки. Она много тратит на дипломатию, принимает разумные условия мира и обычно со временем обзаводится надёжными партнёрами."
 CUSTOM_SEARCH_FILTER_AI_PERSONALITY_CATEGORY_NAME: "Менталитет державы"
 AI_PERSONALITY_MODIFIERS: "Модификаторы поведения"
