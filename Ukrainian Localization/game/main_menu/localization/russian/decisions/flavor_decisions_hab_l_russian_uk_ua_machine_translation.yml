l_russian:
  hab_monastery_reform_melk_decision.title: "Реформаторський рух у Мельку"
  hab_monastery_reform_melk_decision.desc: "Деяк[ROOT.GetCountry.Custom('clergy_yiaei')] наш[ROOT.GetCountry.Custom('clergy_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] зібра[ROOT.GetCountry.Custom('clergy_vlaloly')]ся в #TOOLTIP:LOCATION,melk,X #L Мельку#!#!, щоб обговорити занепад чернечих звичаїв [ROOT.GetCountry.Custom('predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. Під час обговорення з’ясувалося, що накопичені за довгі роки негаразди монастирів можна розв’язати лише всеохопною реформою. Якщо ми діятимемо швидко й рішуче, наша країна зможе стати яскравим прикладом успішних #L [ROOT.GetCountry.GetReligion.GetAdjective|l]их#! реформ."
  hab_monastery_reform_melk_decision.desc.entry: "Монастир, що забув свій устав, для нас навряд чи корисніший за пусте поле, а наші обителі вже не перший рік занепадають. Зібрання в #TOOLTIP:LOCATION,melk,X #L Мельку#!#! дає нам чудову нагоду навести лад на очах у всього #TOOLTIP:RELIGION,$catholic_tt$,X #L католицького#!#! світу — й очолити реформу, а не плестися у хвості."
  hab_monastery_reform_melk_decision.a: "Здійснімо реформу."
  hab_monastery_reform_melk_decision.b: "Краще залишмо все як є."
  hab_vienna_concordat_decision.title: "Віденський конкордат"
  hab_vienna_concordat_decision.desc: "Після тривалих перемовин із папськими послами ми нарешті дійшли згоди, яка враховує інтереси як #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, так і #ONCLICK:COUNTRY,[GetCountry('PAP').GetKey] #TOOLTIP:COUNTRY,[GetCountry('PAP').GetKey],X [GetCountry('PAP').Custom('CL_GEN')|L]#!#!. #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священна Римська імперія#!#! та [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle|l] упродовж сотень років відчували одне до одного недовіру й ворожість, проте тепер у нас з’явилася історична нагода забути про чвари й налагодити взаємини."
  hab_vienna_concordat_decision.desc.entry: "Імператори й папи століттями сперечалися про те, хто кого має призначати, і ця боротьба не принесла користи ні тим, ні іншим. Міцна угода з папою змусить нас пожертвувати часткою свободи в призначенні єпископів, зате папство нарешті перестане бачити у Священній Римській імперії свого суперника."
  hab_vienna_concordat_decision.a: "Підпишемо угоду."
  hab_vienna_concordat_decision.b: "[GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle] нам не союзник."
  hab_monastery_reform_accepted_decision.title: "Монастирська рада [ROOT.GetCountry.Custom('CL_GEN')]"
  hab_monastery_reform_accepted_decision.title.entry: "Монастирська рада Австрії"
  hab_monastery_reform_accepted_decision.desc: "Поширення ідей Реформації в нашій країні призвело до тяжких наслідків для #TOOLTIP:BUILDING_TYPE,monastery,X #L монастирів#!#!. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] скарж[ROOT.GetCountry.Custom('clergy_ytat')]ся на скрутне грошове становище та брак охочих прийняти чернечий постриг. Для розв’язання цієї проблеми ми можемо заснувати особливу раду й передати їй відання всіма монастирями."
  hab_monastery_reform_accepted_decision.desc.entry: "Спорожнілі келії послушників і не менш порожні гаманці — це насамперед проблеми врядування, і лише потім духовні. Рада, якій буде доручено відати скарбницею кожного #TOOLTIP:BUILDING_TYPE,monastery,X #L монастиря#!#! у наших землях, наведе лад значно швидше, ніж духовенство зможе впоратися самотужки."
  hab_monastery_reform_accepted_decision.a: "Реформуймо устрій монастирів."
  hab_monastery_reform_accepted_decision.a.tt: "Відкриємо доступ до #TOOLTIP:PRODUCTION_METHOD,hab_reformed_monastery_maintenance,X #L монастирської ради#!#! для всіх монастирів нашої країни."
  hab_monastery_reform_accepted_decision.b: "Нехай пристосовуються самі."
  hab_tractatus_incorporalibus_decision.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] та їхні тягарі"
  hab_tractatus_incorporalibus_decision.title.entry: "Тягар простолюду"
  hab_tractatus_incorporalibus_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] виряди[ROOT.GetCountry.Custom('peasants_vlaloly')] до уряду своїх представників. Вони скаржаться, що через війну їхнє становище помітно погіршилося, тож просять, щоби [target_ruler.GetName|l] бодай якось [Select_CString(target_ruler.IsFemale,'полегшила', 'полегшив')] їхній тягар. Хоча зазвичай нас мало цікавить думка якихось селян, без їхньої підтримки нам буде важко оплачувати воєнні дії та набирати вояків. Ми можемо знизити суспільну напругу, схваливши низку законів, які чітко визначають обов’язки селян перед землевласниками. Це дозволить уникнути їхнього утиску та спростити розв’язання майбутніх суперечок."
  hab_tractatus_incorporalibus_decision.desc.entry: "Зобов’язання, що тримаються лише на звичаях, оскаржуються за кожного неврожаю, а через війну кожен урожай став мізерним. Якщо ж чітко закріпити повинності простолюду на папері, це зв’яже руки як їм самим, так і їхнім панам. Коли землероб достеменно знає, скільки він винен, він платитиме без зайвих суперечок."
  hab_tractatus_incorporalibus_decision.a: "Ми виконаємо їхнє прохання."
  hab_tractatus_incorporalibus_decision.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] не ма[ROOT.GetCountry.Custom('peasants_yeyut')] права будь-чого вимагати."
  hab_tractatus_incorporalibus_decision.b.entry: "Простолюд не має права будь-чого вимагати від нас."
  hab_geheime_kabinettskanzlei_decision.title: "[ShowGovernmentReformNameWithNoTooltip('geheime_kabinettskanzlei')]"
  hab_geheime_kabinettskanzlei_decision.desc: "Шпигунство — не найнадійніший засіб здобуття відомостей, оскільки ми будь-якої миті можемо втратити зв’язок зі своїми вивідачами. Інші країни вже почали створювати особливі об’єднання для збирання даних та викриття шпигунів, і ми не повинні від них відставати. Ми можемо заснувати #TOOLTIP:GOVERNMENT_REFORM,geheime_kabinettskanzlei,X #L Австрійську таємну службу#!#!, яка потай діятиме під виглядом поштового відділення й дозволить нашим посланцям швидко та безпечно переглядати все листування, що проходить крізь країну."
  hab_geheime_kabinettskanzlei_decision.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
  hab_geheime_kabinettskanzlei_decision.a.entry: "$common_string_alright$"
  hab_geheime_kabinettskanzlei_decision.a_tt: "Відкриває доступ до [Concept('government_reform', 'державної реформи')|e] «[ShowGovernmentReformName('geheime_kabinettskanzlei')]»"
  hab_geheime_kabinettskanzlei_decision.b: "Розвідка — це марнування коштів."
  hab_geheimer_rat_decision.title: "Таємна рада"
  hab_geheimer_rat_decision.desc: "Нещодавно ми заснували #TOOLTIP:ADVANCE_DEFINITION,geheimrat,X $tt_op_L$Таємну раду$tt_cl_2$, але дехто з придворних вважає, що ця установа має стати офіційною. Вони стверджують, що [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] повин[ROOT.GetCountry.Custom('crown_ennanoni')] у політичних справах покладатися на таємних радників. Тільки тоді ми будемо певні, що [ROOT.GetCountry.GetFlavorRank|l] перебува[ROOT.GetCountry.Custom('endrank_yeyut')] у руках найнадійніших і найздібніших людей."
  hab_geheimer_rat_decision.desc.entry: "Неофіційне коло радників існує рівно доти, доки править монарх, що їх скликав. #TOOLTIP:ADVANCE_DEFINITION,geheimrat,X #L Таємна рада#!#! ж, вписана в урядовий устрій, переживе будь-яких правителів. Вона гарантує, що справи держави залишаться в руках тих небагатьох, хто справді гідний ними опікуватися."
  hab_geheimer_rat_decision.a: "Зробімо свято офіційним!"
  hab_geheimer_rat_decision.a.tt: "Відкриває події, пов’язані з визначними діячами, які входили до #TOOLTIP:GOVERNMENT_REFORM,hab_geheimer_rat,X #L Таємної ради#!#!."
  hab_geheimer_rat_decision.b: "Нас і так усе влаштовує."
  hab_privilegium_maius_decision.title: "Ми здобули Privilegium Maius"
  hab_privilegium_maius_decision.desc: "Разом з імператорським титулом ми здобули змогу виправити помилки наших попередників. Очолюючи #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священну Римську Імперію#!#!, ми можемо дарувати династії [target_ruler.GetDynasty.GetName] усі привілеї, на які вона заслуговує."
  hab_privilegium_maius_decision.desc.entry: "Попередні імператори відмовлялися повною мірою надавати нам законні привілеї. Тепер, коли ми самі здобули імператорську корону, настав час виправити цю несправедливість."
  hab_privilegium_maius_decision.a: "Настав час виправити помилки."
  hab_privilegium_maius_decision.privilegium_not_granted_tt: "Ми ще не отримали Privilegium Maius повною мірою"
  hab_privilegium_maius_decision.privilegium_not_decided_tt: "Минув 1370 рік, а Privilegium Maius досі не було запропоновано"