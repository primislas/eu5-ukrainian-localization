l_russian:
  ach_greek_populace_decision.title: "Умиротворення грецької верхівки"
  ach_greek_populace_decision.desc.entry: "Дві верхівки нині ділять ці землі в напруженій рівновазі, і жодна не пристане на умови іншої без поступок навзаєм. Запобігання перед [ShowCultureName('greek_culture')] родинами купує спокій серед люду, тоді як догоджання латинській $nobles_estate$ купує вірність тих, у чиїх руках уже є мечі."
  ach_greek_populace_decision.a: "Залишимо все як є."
  ach_greek_populace_decision.b: "Стати на бік латинської [GetEstateNameWithNoTooltip('nobles_estate')]."
  ach_greek_populace_decision.b.entry: "Стати на бік латинської $nobles_estate$."
  ach_greek_populace_decision.c: "Постараємося домовитися з грецькими родинами."
  ach_pope_proposes_latin_restoration.title: "Здобути підтримку папи для відновлення Латинської імперії"
  ach_pope_proposes_latin_restoration.desc.entry: "[ShowFormableCountryName('LAT_f')] проіснувала недовго, але наші права на неї залишаються чинними. В обмін на $PAP_ADJ$ підтримку ми відповімо заснуванням справжньої [ShowReligionAdjective('catholic')] імперії на Сході зі столицею в [ShowLocationName('constantinople')], набагато тривкішої за колишню."
  ach_pope_proposes_latin_restoration.a: "Пристанемо на вимоги римського посла в обмін на підтримку."
  ach_pope_proposes_latin_restoration.b: "Нам не потрібна підтримка папи, щоб повернути [ShowLocationNameWithNoTooltip('constantinople')]."
  lat_aggressive_conversion_policies_tt: "Папа може вимагати від нас провадження жорсткої політики навернення у віру, якщо ми заснуємо [GetCountry('LAT').GetLongName], в обмін на його підтримку"
  lat_frankokratia_pope_proposes_latin_restoration.title: "Здобути підтримку папи для відновлення Латинської імперії"
  lat_frankokratia_pope_proposes_latin_restoration.desc.entry: "За вмирущою імперією та державою, що сходить, спостерігає один і той самий Рим, і папа вже вирішив, кому з нас віддати перевагу. Право на владу над відновленим [ShowLocationName('constantinople')] — у його волі дарувати, і він дарує його, якщо ми пристанемо на достатню кількість його умов, щоби цей дар видавався заслуженим."
  lat_frankokratia_pope_proposes_latin_restoration.a: "Прийняти пропозицію папи щодо відновлення [GetCountry('LAT').GetLongNameWithNoTooltip]."
  lat_frankokratia_pope_proposes_latin_restoration.b: "Ми не підемо на поводі в папських прагнень."
  lat_greater_claims_of_the_latin_empire.title: "Розширені претензії Латинської імперії"
  lat_greater_claims_of_the_latin_empire.desc.entry: "Перша Латинська імперія впала не від $BYZ_ADJ$ помсти, а від рук сусідів, яких так і не вдалося до кінця підкорити. [ShowRegionName('balkan_region')] пам’ятає, хто заявив про верховну владу 1204 року і хто згодом відкинув ці домагання, а відновлена імперія, що не зважає на тих самих суперників, ризикує спіткати той самий кінець."
  lat_greater_claims_of_the_latin_empire.a: "Постараємося розширити кордони країни коштом старих суперників."
  lat_greater_claims_of_the_latin_empire.b: "Краще не повторюватимемо помилок минулого."
  lat_restore_the_holy_patriarchate.title: "Відновити Святіший патріархат [ShowLocationNameWithNoTooltip('constantinople')]"
  lat_restore_the_holy_patriarchate.desc.entry: "Патріарх, який перебуватиме в [ShowLocationName('constantinople')] під нашим захистом, зробив би віру цього міста підзвітною нам, а не сходу. Наше $clergy_estate$ не забуло, що цей титул колись існував, і має намір знову його встановити."
  lat_restore_the_holy_patriarchate.a: "Дозволимо відновити патріархат."
  lat_restore_the_holy_patriarchate.b: "Присягнемо всіма силами захищати відновлений патріархат."
  lat_restore_the_holy_patriarchate.c: "Постараємося посилити вплив за допомогою відновленого патріархату."
  lat_restore_the_holy_patriarchate.d: "Відмовимося відновлювати патріархат."
  latin_patriarchate_of_constantinople: "Константинопольський патріархат"
  ach_greek_populace_decision.desc: "Хоча [GetCountry('LAT').GetAdjective]е правління над #TOOLTIP:SCRIPTED_GEOGRAPHY,greece_geography #L Грецією#!#! призвело до занепаду колишньої [ShowCultureName('greek_culture')]ої еліти, у деяких регіонах країни представники давніх [ShowCultureNameWithNoTooltip('greek_culture')]их родів зберегли хватку за владу завдяки угоді з латинським [GetEstateName('nobles_estate')]. Однак після падіння [GetCountry('LAT').Custom('CL_GEN')] представники [ShowCultureNameWithNoTooltip('greek_culture')]ого простолюду почали чинити дедалі сильніший опір латинському пануванню.\n\nПрагнучи більш стійкого правління, монарх запросив представників уцілілих [ShowCultureNameWithNoTooltip('greek_culture')]их родин країни до двору, щоб напрацювати домовленість. Утім, деякі представники латинської #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#! натомість почали вимагати подальшого розширення своєї влади над [ShowCultureNameWithNoTooltip('greek_culture')]им простолюдом, аргументуючи це тим, що сильніша латинська еліта зможе придушити [ShowCultureNameWithNoTooltip('greek_culture')]і заворушення."
  ach_pope_proposes_latin_restoration.desc: "Звернувши увагу на наші кампанії в #TOOLTIP:SCRIPTED_GEOGRAPHY,greece_geography #L Греції#!#!, Папство зацікавилося нашою зростаючою силою.\n\nВизнаючи наше право на реформу [ShowGovernmentReformName('ach_heirs_of_the_latin_empire')], Папа запропонував скарбову та політичну підтримку з боку [GetCountry('PAP').Custom('CL_GEN')], якщо ми погодимося допомогти зусиллям Понтифіка щодо відновлення відносин між [ShowReligionAdjective('catholic')]ими та [ShowReligionAdjective('orthodox')]ими Церквами.\n\nПапа також наполегливо закликав: якщо [ShowLocationName('constantinople')] буде відвойовано, трагедія, яку Четвертий хрестовий похід приніс у [ShowLocationNameWithNoTooltip('constantinople')], не повинна повторитися."
  lat_frankokratia_pope_proposes_latin_restoration.desc: "Зростаючий вплив нашої країни в #TOOLTIP:SCRIPTED_GEOGRAPHY,greece_geography #L Греції#!#! перетворив нас на провідну силу в цих краях, і Папа звернув увагу на нову потугу. На тлі згасання впливу, який мала [GetCountry('BYZ').GetName], Папа тепер бачить у нас головного претендента, завдяки якому [GetCountry('LAT').GetLongName] може бути відновлена в місті [ShowLocationName('constantinople')].\n\nЯкщо ми погодимося на деякі з [GetCountry('PAP').GetAdjectiveWithNoTooltip]их прохань і якщо [ShowLocationNameWithNoTooltip('constantinople')] буде відвойовано, Папа запропонує повну підтримку [GetCountry('PAP').Custom('CL_GEN')] та визнає нашого монарха законним правителем [GetCountry('LAT').Custom('CL_GEN')]."
  lat_greater_claims_of_the_latin_empire.desc: "Після падіння #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#! у 1204 році стара латинська еліта швидко почала діяти, щоб консолідувати контроль над [GetCountry('BYZ').GetAdjective]ими володіннями по всій #TOOLTIP:SCRIPTED_GEOGRAPHY,greece_geography #L Греції#!#!, а також заявити права на сюзеренітет над #TOOLTIP:REGION,balkan_region,X #L Балканами#!#!. Проте на той час [GetCountry('SER').GetName] та [GetCountry('BUL').GetName] виявилися головними суперниками латинян, причому [GetCountry('BUL').GetNameWithNoTooltip] зрештою відіграла вирішальну роль у краху початкової імперії своїми постійними військовими кампаніями на латинські землі.\n\nТепер, коли Латинську імперію відновлено, ми маємо змогу заявити права на панування над цими землями й досягти того, чого не змогла стара імперія."
  lat_restore_the_holy_patriarchate.desc: "Хоча початкове розграбування міста [ShowLocationName('constantinople')] у 1204 році викликало спротив Папи, захоплення #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#! [ShowReligionAdjective('catholic')]ими хрестоносцями відкрило можливість для відновлення Патріархату, що піднесло б [GetCountry('PAP').GetAdjective]ий авторитет. Однак відвоювання #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#! у 1261 році, яке здійснив [GetCharacter('byz_michael_viii_palaiologos').GetName], знову позбавило Папу цього титула.\n\nТепер, коли латинське правління над #TOOLTIP:LOCATION,constantinople,X #L Константинополем#!#! відновлено, багато хто в складі #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L духовенства#!#! закликає нас відродити Патріархат."