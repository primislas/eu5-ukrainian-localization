l_russian:
  ach_greek_populace_decision.title: "Умиротворення грецької верхівки"
  ach_greek_populace_decision.desc: "[ShowScriptedGeographyName('greece_geography')] під владою #ONCLICK:COUNTRY,[GetCountry('LAT').GetKey] #TOOLTIP:COUNTRY,[GetCountry('LAT').GetKey],X [GetCountry('LAT').Custom('CL_GEN')|L]#!#! переживає неспокійні часи: колишня #TOOLTIP:CULTURE,$greek_culture_tt$,X #L грецька#!#! верхівка почала занепадати, а де-не-де в країні, навпаки, вихідці зі старих грецьких родів зуміли зберегти вплив, хоч латинська [GetEstateName('nobles_estate')|l] і змусила їх піти на певні поступки. Однак після падіння [GetCountry('LAT').Custom('longname_ua_wntt_GEN')] грецький люд поволі почав чинити опір латинській владі.\n\nЩоб не допустити заворушень і досягти злагоди, монарх запросив представників уцілілих у країні грецьких родів на перемовини. З цим не згодна латинська [GetEstateNameWithNoTooltip('nobles_estate')|l]. Вона вимагає розширення своєї влади над греками і заявляє, що сильна латинська верхівка зможе приборкати баламутів."
  ach_greek_populace_decision.desc.entry: "Дві верхівки змушені вживатися на цих землях, і жодна з них не піде на поступки без вигоди для себе. Заручившись підтримкою #TOOLTIP:CULTURE,$greek_culture_tt$,X #L грецьких#!#! родів, ми забезпечимо спокій серед простого люду. Задобривши ж латинську знать, ми купимо вірність тих, хто вже тримає мечі напоготові."
  ach_greek_populace_decision.a: "Залишимо все як є."
  ach_greek_populace_decision.b: "Станьмо на бік, який обстоює латинська [GetEstateNameWithNoTooltip('nobles_estate')|l]."
  ach_greek_populace_decision.b.entry: "Станьмо на бік латинської знаті."
  ach_greek_populace_decision.c: "Постараємося домовитися з грецькими родинами."
  ach_pope_proposes_latin_restoration.title: "Заручитися папською підтримкою у відновленні Латинської імперії"
  ach_pope_proposes_latin_restoration.desc: "Слово «[ShowScriptedGeographyName('greece_geography')]» сьогодні в багатьох на устах. Дізнавшись про наші походи, Папський престол занепокоївся зростанням могутності нашої країни.\n\nОскільки ми — [ShowGovernmentReformName('ach_heirs_of_the_latin_empire')|l] за правом, папа запропонував нам грошову та політичну підтримку від імені [GetCountry('PAP').Custom('CL_GEN')] — за умови, що ми погодимося допомогти у відповідь: річ у тім, що папа зараз намагається примирити #TOOLTIP:RELIGION,$catholic_tt$,X #L католицьку#!#! та #TOOLTIP:RELIGION,$orthodox_tt$,X #L православну#!#! церкви.\n\nПапа також закликає нас — на випадок, якщо [ShowLocationName('constantinople')] повернеться на своє колишнє місце, — пам’ятати, яка трагедія спіткала його під час Четвертого хрестового походу, і не допустити її повторення."
  ach_pope_proposes_latin_restoration.desc.entry: "[ShowFormableCountryName('LAT_f')] проіснувала недовго, але наші домагання її престолу досі чинні. В обмін на підтримку з боку папи ми зобов’язуємося створити на Сході істинно #TOOLTIP:RELIGION,$catholic_tt$,X #L католицьку#!#! імперію — зі столицею в #TOOLTIP:LOCATION,constantinople,X #L Константинополі#!#! і значно міцнішу, ніж колишня."
  ach_pope_proposes_latin_restoration.a: "Пристанемо на вимоги римського посла в обмін на підтримку."
  ach_pope_proposes_latin_restoration.b: "Папська підтримка нам ні до чого: ми здобудемо Константинополь самостійно."
  lat_aggressive_conversion_policies_tt: "В обмін на підтримку папа може попросити нас запровадити сувору політику навернення у віру, якщо ми проголосимо [GetCountry('LAT').Custom('longname_ua_ACC')]."
  lat_frankokratia_pope_proposes_latin_restoration.title: "Попросити в папи підтримки у відновленні Латинської імперії"
  lat_frankokratia_pope_proposes_latin_restoration.desc: "Нарощуючи свій вплив у #TOOLTIP:SCRIPTED_GEOGRAPHY,greece_geography,X #L Греції#!#!, ми стали провідною силою регіону, і папа не міг не звернути на це уваги. Бачачи, як згаса[GetCountry('BYZ').Custom('end_yeyut')] [GetCountry('BYZ').GetName], папа заявив, що саме нас він вважає головним претендентом на відродження [GetCountry('LAT').Custom('longname_ua_GEN')] зі столицею в #TOOLTIP:LOCATION,constantinople,X #L Константинополі#!#!.\n\nЯкщо ми виконаємо деякі [GetCountry('PAP').GetAdjectiveWithNoTooltip|l]і умови, то після взяття Константинополя папа надасть нам повну підтримку [GetCountry('PAP').Custom('longname_ua_wntt_GEN')] й офіційно визнає нашого монарха законним правителем [GetCountry('LAT').Custom('longname_ua_wntt_GEN')]."
  lat_frankokratia_pope_proposes_latin_restoration.desc.entry: "За агонією імперії, що згасає, та розквітом нової Рим спостерігає з однаковою увагою, але папа вже зробив свій вибір. Лише він має право підтвердити законність влади над відродженим #TOOLTIP:LOCATION,constantinople,X #L Константинополем#!#! — і він підтвердить її. Потрібно лише виконати достатньо його умов, щоб цей дар виглядав заслуженим."
  lat_frankokratia_pope_proposes_latin_restoration.a: "Приймімо пропозицію папи та спробуймо відновити [GetCountry('LAT').Custom('longname_ua_wntt_ACC')]."
  lat_frankokratia_pope_proposes_latin_restoration.b: "Ми не підемо на поводі в папських прагнень."
  lat_greater_claims_of_the_latin_empire.title: "Подальші домагання Латинської імперії"
  lat_greater_claims_of_the_latin_empire.desc: "Після падіння #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#! у 1204 році представники старої латинської верхівки не стали гаяти часу: окрім спроб зміцнити свою владу над #L [GetCountry('BYZ').GetAdjective|l]ими#! володіннями — [ShowScriptedGeographyName('greece_geography')] виявилася для них ласим шматком — вони також намагалися утвердити панування над #TOOLTIP:REGION,balkan_region,X #L Балканами#!#!, проте [GetCountry('SER').GetName] та [GetCountry('BUL').GetName] зуміли дати відсіч латинянам. Прагнення завоювати ці країни зрештою призвело до краху першої імперії, позаяк вона виявилася нездатною протистояти постійним набігам [GetCountry('BUL').Custom('CL_GEN')] на латинські землі.\n\nСьогодні, коли Латинську імперію відроджено, ми можемо нарешті підкорити ці непокірні землі, помстившись за розпад старої імперії."
  lat_greater_claims_of_the_latin_empire.desc.entry: "Перша Латинська імперія впала не через візантійську помсту, а під ударами сусідів, яких так і не змогла підкорити. [ShowRegionName('balkan_region')] добре пам’ятають, хто заявив права на панування у 1204 році і хто потім розтоптав ці домагання. Якщо відроджена імперія знехтує давніми суперниками, на неї чекає такий самий кінець."
  lat_greater_claims_of_the_latin_empire.a: "Постараємося розширити кордони країни коштом старих суперників."
  lat_greater_claims_of_the_latin_empire.b: "Краще не повторюватимемо помилок минулого."
  lat_restore_the_holy_patriarchate.title: "Відновити Священний Константинопольський патріархат"
  lat_restore_the_holy_patriarchate.desc: "Спустошення #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#! у 1204 році викликало різкий осуд багатьох (серед них і папи), проте неможливо заперечувати, що без участі хрестоносців-#TOOLTIP:RELIGION,$catholic_tt$,X #L католиків#!#! годі було б відновити патріархат, а отже, і зміцнити #L [GetCountry('PAP').GetAdjective|l]у#! владу. Утім, цей титул знову втратив своє значення після того, як у 1261 році [GetCharacter('byz_michael_viii_palaiologos').GetName] знову [Select_CString(GetCharacter('byz_michael_viii_palaiologos').IsFemale, 'відвоювала', 'відвоював')] Константинополь.\n\nСьогодні ж, коли тут знову утвердилася латинська влада, [GetEstateNameWithNoTooltip('clergy_estate')|l] закликає нас відновити патріархат."
  lat_restore_the_holy_patriarchate.desc.entry: "Завдяки патріарху, який перебуватиме в #TOOLTIP:LOCATION,constantinople,X #L Константинополі#!#! під нашим захистом, духовне життя міста підпорядковуватиметься нам, а не сходу. Наше духовенство пам’ятає, що цей сан існував і раніше, і має намір домогтися його відновлення."
  lat_restore_the_holy_patriarchate.a: "Дозволимо відновити патріархат."
  lat_restore_the_holy_patriarchate.b: "Присягнемо всіма силами захищати відновлений патріархат."
  lat_restore_the_holy_patriarchate.c: "Постараємося посилити вплив за допомогою відновленого патріархату."
  lat_restore_the_holy_patriarchate.d: "Відмовимося відновлювати патріархат."
  latin_patriarchate_of_constantinople: "Константинопольський патріархат"