l_russian:
  byz_army_reform_decision.title: "Реформа [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ого війська"
  byz_army_reform_decision.title.entry: "Реформа візантійського війська"
  byz_army_reform_decision.desc: "Фемна система, на якій раніше трималося наше військо, дозволяла за короткий час зібрати чимало ополченців. Але часи змінилися, і вояцьке ремесло зі зростанням добробуту впорядкованих держав перетворилося на справжній фах. Тепер [target_character.GetName] і [Select_CString(target_character.IsFemale,'її', 'його')] радники розробляють нові засади устрою війська. [ROOT.GetCountry.GetGovernment.GetRulerTitle|U] не бажає, щоб [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] диктува[ROOT.GetCountry.Custom('nobles_vlaloly')|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'їй', 'йому')] свої умови — комплектування війська має бути у віданні уряду."
  byz_army_reform_decision.desc.entry: "Фемна система, на якій раніше трималося наше військо, дозволяла за короткий час зібрати чимало ополченців. Але часи змінилися, і вояцьке ремесло зі зростанням добробуту централізованих держав перетворилося на справжній фах. Наша рада могла б розробити план реформи війська, щоб ми не так сильно залежали від підтримки знаті."
  byz_army_reform_decision.a: "[target_character.GetNameWithNoTooltip] одноосібно командуватиме військом."
  byz_army_reform_decision.a.entry: "Король особисто командуватиме військом."
  byz_army_reform_decision.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|U] служ[ROOT.GetCountry.Custom('nobles_ytat')] спільній справі. Не варто ними нехтувати."
  byz_army_reform_decision.b.entry: "Знать служить спільній справі. Не варто нею нехтувати."
  BYZ_ALL_THEMATA_PROVINCES_GAIN_NOBLE_LOYALTY: "Усі [Concept('pops', 'громади')|e] #TOOLTIP:POPTYPE,nobles,X #L знаті#!#! у [Concept('locations', 'місцевостях')|e] зі #TOOLTIP:BUILDING_TYPE,thema_headquarters,X #L столицями фем#!#! отримують [ShowNamedValue('pop_satisfaction_ultimate_bonus')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]."