l_russian:
  byz_army_reform_decision.desc.entry: "Якщо раніше наше військо здобувало перемоги завдяки фемам і численним ополченням, які вони надавали, то зростання добробуту та підпорядкування країни призвели до того, що військова служба стала постійним фахом. Наша рада могла б розробити план оновлення війська, щоб зробити нас менш залежними від підтримки знаті."