l_russian:
  mos_prikazi_decision.title: "Утворення приказів $prikazi_reform$"
  mos_prikazi_decision.desc: "Несправне врядування вже давно заважає #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! посісти гідне місце серед великих держав. Щоби підвищити справність уряду, варто розподілити відання державними справами між кількома установами. Це посприяє якнайшвидшому виконанню указів, що їх видає [ROOT.GetCountry.GetGovernment.GetRuler.GetName], та зміцнить централізацію влади."
  mos_prikazi_decision.desc.entry: "Правитель, який підписав указ, не може бути певен, що його прочитають униз річкою, годі й казати про те, щоб йому підкорилися. Постійні установи, кожна з яких відповідає за свою частку державних справ, донесуть слово государя далі, ніж будь-коли змогло б саме лише його добре ім’я."
  mos_prikazi_decision.a: "Хіба можна врядувати інакше?"
  mos_prikazi_decision.b: "Запорука успіху — у свободі дій."
  mos_prikazi_decision.tt1: "У країні з’явиться кілька управ; члени [Concept('cabinet', 'ради')|e] зможуть наглядати за ними за допомогою [Concept('cabinet_action', 'доручень')|e]"
  enable_prikazi_reform: "Відкриває [Concept('government_reform', 'державну реформу')|e] #TOOLTIP:GOVERNMENT_REFORM,prikazi_reform,X #L «Прикази»#!#!"
  mos_prikazi_decision.historical_info: "Приказами називалися органи державного управління в Московському царстві та в перші роки існування Російської імперії. Вони виконували царські рішення, а також щоденні обов’язки, необхідні для роботи чиновництва. Найбільші прикази відали зовнішньою політикою; вони відіграли визначну роль у добу, коли Русь була оточена ворогами та ще виборювала незалежність від Золотої Орди."
  mos_razriadnyi_decision.title: "[ShowGovernmentReformNameWithNoTooltip('razriadnyi_reform')]"
  mos_razriadnyi_decision.desc: "У країні практично не ведеться облік населення, його майна та податків, і це ускладнює нагляд за видатками казни та утримання державного апарату. Проводячи регулярні переписи населення силами нещодавно утвореного #TOOLTIP:GOVERNMENT_REFORM,razriadnyi_reform,X #L Розрядного приказу#!#!, ми здобудемо докладні відомості про всіх #L [ROOT.GetCountry.GetAdjective|l]их#! підданих та їхні домогосподарства — якими статками вони володіють і які повинності мусять нести."
  mos_razriadnyi_decision.desc.entry: "Казна, не здатна порахувати своїх підданих, не може чесно оподатковувати їх, а наша вже котрий рік лише здогадується. Постійна установа для перепису надасть точне число, скільки людей та грошей ми здатні зібрати, і знати це варто ще до першого походу, який це оплатить."
  mos_razriadnyi_decision.a: "Якщо знадобиться, ми зазирнемо під кожен камінь."
  mos_razriadnyi_decision.b: "Це буде втручанням у їхнє особисте життя."
  enable_razriadnyi_reform: "Відкриває [Concept('government_reform', 'державну реформу')|e] #TOOLTIP:GOVERNMENT_REFORM,razriadnyi_reform,X #L «Розрядний приказ»#!#!"
  mos_razriadnyi_decision.historical_info: "Військова канцелярія, #italic Розрядний приказ#!, запровадила перепис населення, що дозволило владі визначати податкові обов’язки підданих залежно від їхнього багатства, майна та суспільного становища. Крім того, завдяки розрядним книгам держава завжди знала, скільки вояків і військового спорядження здатен виставити кожен стан відповідно до своїх повинностей. Такі реєстри населення виявилися незамінними для врядування у великих і неоднорідних землях."
  mos_build_kremlin_decision.title: "Спорудження Кремля"
  mos_build_kremlin_decision.desc: "Землі Руси повсякчас зазнають набігів, а нинішні укріплення довкола [target_location.Custom('LR_GEN')|l] [target_location.GetName] очевидно недостатньо надійні, щоби спинити ворога. Ці спустошливі набіги заважають країні розвиватися, і ми маємо зробити все, аби захистити наш люд у ці неспокійні часи.\n\nЧас обнести [target_location.Custom('LR_ACC')|l] міцними укріпленнями, стіни яких витримають будь-який напад."
  mos_build_kremlin_decision.desc.entry: "Нападники не чекатимуть, доки стіни добудують, перш ніж випробувати їх на міцність, а наші такого випробування не витримають. Відновлення оборони [ShowLocationName('moscow')] коштуватиме цілий статок, якого нам не хотілося б витрачати, але втрата міста обійдеться значно дорожче."
  mos_build_kremlin_decision.a: "Нехай купці везуть нам найкращу деревину."
  mos_build_kremlin_decision.b: "Ми не станемо провокувати сусідів."
  mos_build_kremlin_decision.c: "Розберемо замок васала на будівельні матеріали."
  threatened_by_military_expansion: "Загроза воєнної експансії"
  safe_haven_during_raids: "Надійний прихисток на випадок набігів"
  mos_build_kremlin_decision.tt1: "Недружні сусіди вважатимуть спорудження міцного Кремля ворожою дією"
  mos_build_kremlin_decision.tt2: "Сусідні васали побачать у міцному Кремлі надійний прихисток на випадок набігів"
  mos_build_kremlin_decision.a.custom1: "Кожна сусідня країна отримує [ShowBiasValue('threatened_by_military_expansion')|+=0] до [Concept('opinion', 'думки')|e] про владу #ONCLICK:COUNTRY,[target_root_country.GetKey] #TOOLTIP:COUNTRY,[target_root_country.GetKey],X [target_root_country.Custom('CL_GEN')|L]#!#!"
  mos_build_kremlin_decision.a.custom2: "Кожен сусідній [Concept('subject', 'васал')|e] отримує [ShowBiasValue('safe_haven_during_raids')|+=0] од. до [Concept('opinion', 'думки')|e] про #ONCLICK:COUNTRY,[target_root_country.GetKey] #TOOLTIP:COUNTRY,[target_root_country.GetKey],X [target_root_country.Custom('CL_PREP')|L]#!#!"
  mos_build_kremlin_decision.b.custom1: "Кожна сусідня країна отримає #G 3 од.#! [Concept('trust', 'довіра')|и] до #ONCLICK:COUNTRY,[target_root_country.GetKey] #TOOLTIP:COUNTRY,[target_root_country.GetKey],X [target_root_country.Custom('CL_DAT')|L]#!#!"
  mos_build_kremlin_decision.b.custom2: "Кожен сусідній [Concept('subject', 'васал')|e] отримує [ShowBiasValue('lack_of_protection')|+=0] до [Concept('opinion', 'думки')|e] [target_root_country.Custom('predlog_obo')] #ONCLICK:COUNTRY,[target_root_country.GetKey] #TOOLTIP:COUNTRY,[target_root_country.GetKey],X [target_root_country.Custom('CL_PREP')|L]#!#!"
  lack_of_protection: "Недостатній захист"
  mos_kremlin_construction: "Спорудження Кремля"
  mos_build_kremlin_decision.tt3: "Майже всю необхідну #TOOLTIP:GOODS,clay,X #L глину#!#! та #TOOLTIP:GOODS,lumber,X #L деревину#!#! можна отримати, розібравши замок у [castle_location.Custom('LR_PREP')|l] [castle_location.GetName]"
  mos_build_kremlin_decision.historical_info: "Перший московський Кремль був дерев’яним і складався не лише зі стін та веж, а й з безлічі урядових споруд. Спорудження Московського Кремля було вельми коштовним задумом, проте воно було необхідним — прості дерев’яні загорожі, що захищали Москву раніше, виявилися недієвими проти облог і регулярного татарського людоловства."
  mos_vestiarium_decision.title: "Вестіарій"
  mos_vestiarium_decision.desc: "Ніхто давно не робив опису державної скарбниці, ми навіть не можемо до пуття оцінити вартість збережених там цінностей. Треба придумати, як справніше розпоряджатися нашими багатствами — це не лише полегшить досягнення наших посольських цілей, а й дозволить поліпшити врядування."
  mos_vestiarium_decision.a: "Справне врядування — запорука успіху."
  mos_vestiarium_decision.b: "Для нас найважливіші таємні важелі дипломатії."
  mos_vestiarium_decision.custom: "Відкриває [Concept('law', 'закон')|e] #TOOLTIP:LAW,vestiarium,X #L «Вестіарій»#!#!"
  mos_vestiarium_decision.historical_info: "#italic  «Вестіарій»#! Васілія I — це опис цінностей, що зберігалися в царській казні. Його використовували для обліку всіх царських скарбів — від прикрас і коштовних металів до одягу й тканин. У вестіарії також вели облік дипломатичних подарунків та речей, що використовувалися в державних церемоніях."
  mos_byzantine_court_ceremonies_decision.title: "Зв’язки зі старою $BYZ_ADJ$ династією"
  mos_byzantine_court_ceremonies_decision.desc: "#TOOLTIP:LOCATION,constantinople,X #L Константинополь#!#! упав, але завдяки цій трагедії у нас з’явилася нагода поєднатися родинними узами з колишньою панівною верхівкою #ONCLICK:COUNTRY,[GetCountry('BYZ').GetKey] #TOOLTIP:COUNTRY,[GetCountry('BYZ').GetKey],X [GetCountry('BYZ').Custom('CL_GEN')|L]#!#!. Якщо [sophia_palaiologina.GetName] вийде заміж за володаря, це посприяє посиленню візантійського впливу при дворі та зміцнить наші домагання на роль провідної #TOOLTIP:RELIGION,$orthodox_tt$,X #L православної#!#! країни й законних наступників Римської імперії. Ба більше, їхні діти стануть спадкоємцями імператорів полеглої імперії."
  mos_byzantine_court_ceremonies_decision.desc.entry: "Корона, здобута силою, залишається короною, здобутою силою; а корона, отримана через шлюб, більше схожа на спадщину. З’єднавши кров [ShowLocationName('constantinople')] з нашим родом, ми досягнемо того, що дитя від цього союзу одного дня зможе заявити про походження від імператорів, а не просто від завойовників."
  mos_byzantine_court_ceremonies_decision.a: "Передвіщений союз!"
  mos_byzantine_court_ceremonies_decision.b: "Цей шлюб не дає жодних переваг."
  mos_byzantine_court_ceremonies_decision.tt1: "З’явиться [Concept('character', 'персонаж')|e] Софія"
  enable_byzantine_court_ceremonies_reform: "Відкриває [Concept('government_reform', 'державну реформу')|e] #TOOLTIP:GOVERNMENT_REFORM,byzantine_court_ceremonies_reform,X #L «Візантійські придворні церемонії»#!#!"
  mos_byzantine_court_ceremonies_decision.tt2: "Її ворожість до деяких послів зіпсує дипломатичні зносини між #ONCLICK:COUNTRY,[target_root_country.GetKey] #TOOLTIP:COUNTRY,[target_root_country.GetKey],X [target_root_country.Custom('CL_INST')|L]#!#! та сусідами-[Concept('heathen', 'іновірцями')|e]"
  STATIC_MODIFIER_NAME_mongol_intolerance: "Нетерпимість до монголів"
  mos_byzantine_court_ceremonies_decision.historical_info: "Після шлюбу Івана III із Софією Палеолог при великокняжому дворі увійшов у звичай складний візантійський придворний церемоніал. Це допомогло зміцнити домагання Москви на символічний статус Третього Риму. Софія народила одинадцять дітей і була бабусею сумнозвісного Івана Грозного. Її нетерпимість до монгольського впливу спричинила кілька дипломатичних інцидентів та посприяла остаточному розриву Москви із Золотою Ордою в 1480 році."
  mos_monastic_reformation_decision.title: "Узаконення вчення Ніла Сорського"
  mos_monastic_reformation_decision.desc: "Обурений розкішшю та багатством багатьох #L [ROOT.GetCountry.GetAdjective|l]их#! монастирів, духовний провідник Ніл Сорський закликає до церковної реформи. Його послідовники, що називають себе «нестяжателями», пропонують відмову від будь-якого майна, їхній ідеал — просте й смиренне життя, цілковито присвячене вченню Христа. Безперечно, цей рух зіткнеться із запеклим опором наявної церковної ієрархії, представники якої стверджують, що виконання духовних обов’язків неможливе без певного рівня статку."
  mos_monastic_reformation_decision.desc.entry: "Ніл Сорський проповідує, що чернець, який володіє землею, уже програв суперечку про володіння будь-чим іншим, і з ним погоджується достатньо багато духовенства, аби це тривожило Церкву. Підтримка нестяжателів коштуватиме нам прихильности кожного багатого монастиря, проте купить вірність кожного ченця, який ніколи її й не бажав."
  mos_monastic_reformation_decision.a: "Підтримаємо нестяжателів."
  mos_monastic_reformation_decision.b: "Підтримаємо любостяжателів."
  mos_monastic_reformation_decision.custom1: "Відкриває [Concept('law', 'закон')|e] #TOOLTIP:LAW,monastic_reformation_movement,X #L «Чернечий реформаторський рух»#!#!"
  mos_monastic_reformation_decision.custom2: "[Concept('policy', 'Політику')|e] в межах [Concept('law', 'закону')|e] #TOOLTIP:LAW,monastic_reformation_movement,X #L «Чернечий реформаторський рух»#!#! можна змінювати не частіше ніж раз на десять років"
  mos_monastic_reformation_decision.historical_info: "Ніл Сорський — російський православний чернець, що стояв біля витоків руху нестяжателів. Суворо дотримуючись обітниці бідности, ченці-нестяжателі засуджували церковні розкоші та монастирі, які володіли вотчинами. Вчення Ніла зіткнулося з лютим опором з боку Церкви, дехто з представників якої відкидав його погляди. Попри це, ідея нестяжательства залишила глибокий слід у російській духовності, і згодом Ніл Сорський був зарахований Російською православною церквою до лику святих."
  mos_stroganov_school_decision.title: "Заснування Строгановської школи"
  mos_stroganov_school_decision.desc: "Багата купецька родина #TOOLTIP:DYNASTY,$stroganov_dynasty_tt$,X #L Строганових#!#! — великі поціновувачі мистецтва. Вони ладні взяти на власний кошт створення цілої школи іконопису задля оздоблення своїх численних палаців, розкиданих по всій країні. Твори, написані строгановськими майстрами, призначені для приватних зібрань і навряд чи принесуть нашій країні відчутну користь. Утім, ця ініціатива сприятиме духовному добробуту #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! і дасть нам змогу заручитися підтримкою могутньої родини."
  mos_stroganov_school_decision.desc.entry: "[ShowDynastyName('stroganov_dynasty')] хочуть ікон для своїх власних каплиць, а не святих для всієї країни, і ладні платити за цей привілей. Школа, побудована їхнім коштом, не принесе казні нічого, окрім родини, яка заборгує нам менше, а очікуватиме більше."
  mos_stroganov_school_decision.a: "Чому б не допомогти одне одному?"
  mos_stroganov_school_decision.b: "Краще підтримаємо їхні торгові починання."
  mos_stroganov_school_decision.c: "Вони мають право розраховувати на певний вплив при дворі."
  enable_stroganov_influences_cabinet_action: "Для представників династії Строганових відкривається [Concept('cabinet_action', 'доручення')|e] #TOOLTIP:CABINET_ACTION,stroganov_influences,X #L «Вплив Строганових»#!#!"
  mos_stroganov_school_decision.historical_info: "Строгановська школа іконопису склалася в добу розквіту російського середньовічного малярства, до того як мистецтво Східної Європи потрапило під вплив західних майстрів. Твори строгановських іконописців багато в чому відбивали уподобання високородних покровителів школи, зокрема й самого царя. Їхні роботи мали попит аж до заснування Санкт-Петербурга, яке супроводжувалося стрімким посиленням західного впливу."
  mos_novodevichy_convent_decision.title: "Новодівочий монастир"
  mos_novodevichy_convent_decision.desc: "Тріумфальне завоювання #TOOLTIP:AREA,smolensk_area,X #L Смоленська#!#! слід відзначити. На щастя, #TOOLTIP:LOCATION,moscow,X #L Москва#!#! саме потребує захисту південного рубежу, і спорудження укріпленого монастиря дасть змогу вирішити це завдання. Окрім захисту #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, він також стане прихистком для #TOOLTIP:POPTYPE,nobles,X #L знатних#!#! жінок, які були змушені прийняти постриг. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] напевно високо оцін[ROOT.GetCountry.Custom('nobles_ytyat')] цей жест."
  mos_novodevichy_convent_decision.desc.entry: "Перемога важить більше, якщо про неї на віки вічні нагадує камінь. Укріплений монастир на південь від [ShowLocationName('moscow')] вартуватиме підступи, відвойовані під [ShowAreaName('smolensk_area')], заразом тихо приймаючи дочок [ShowPopTypeName('nobles')], з якими вже ніхто не бажає брати шлюб, — зручність, у якій $nobles_estate$ відкрито не зізнаватиметься."
  mos_novodevichy_convent_decision.a: "Це безперечно вигідна справа."
  mos_novodevichy_convent_decision.b: "Москва й так чудово захищена."
  mos_novodevichy_convent_decision.c: "Запропонуємо покривдженим жінкам грошове утримання."
  mos_novodevichy_convent_decision.historical_info: "Новодівочий монастир був заснований великим князем Васілієм III на честь здобуття Смоленська. Він був духовною обителлю, яка водночас могла слугувати фортецею для оборони західних підступів до міста. У монастирі жили жінки зі знатних російських родин, яких змушували до чернечого життя."
  mos_limit_namestnik_decision.title: "Вплив намісників"
  mos_limit_namestnik_decision.desc: "Намісники мають величезну владу й керують найвіддаленішими краями #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! від імені царя. Такий устрій створює труднощі під час збору прибутків і нагляду за працею самих чиновників. Ми мусимо встановити прямий нагляд за цими землями й прискорити централізацію країни, навіть якщо заради цього доведеться знехтувати інтересами місцевих верхівок."
  mos_limit_namestnik_decision.desc.entry: "Намісник, який керує областю без нагляду, незабаром починає правити нею як власною. Пряме правління з центру поверне прибутки, які нині привласнюють собі намісники, ціною будь-якої місцевої вірности, на якій трималися ці посади."
  mos_limit_namestnik_decision.a: "Цей устрій уже давно застарів."
  mos_limit_namestnik_decision.b: "Нехай усе залишається як є."
  disable_namestnik_policy: "[Concept('policy', 'Політика')|e] #TOOLTIP:POLICY,namestnik_policy,X #L «Канцелярія намісника»#!#! стане недоступною"
  mos_limit_namestnik_decision.historical_info: "Намісники мали значний вплив і чинили волю монарха в найвіддаленіших куточках країни. Під час правління Івана IV їхні повноваження було обмежено, однак установа намісництва зберігалася аж до запровадження Пьотром Великим низки реформ, які змінили урядовий устрій Росії."
  mos_posolsky_prikaz_decision.title: "Посольський приказ"
  mos_posolsky_prikaz_decision.desc: "Завдяки ревній праці [ivan_viskovatiy.GetName] спромігся впорядкувати наше чиновництво та покращити його дієвість. Тепер же він пропонує заснувати окрему установу для вирішення посольських справ, щоби наша зовнішня діяльність відповідала високим вимогам, запровадженим в інших відомствах."
  mos_posolsky_prikaz_decision.desc.entry: "$name_john.east_slavic_language$ $Viskovatiy$ вже давно й вельми вправно веде чужоземні справи, не маючи для цього окремої установи. Зробивши його становище постійним, ми нічого не втратимо понад те, що його дарування й так спокійно нам давало."
  mos_posolsky_prikaz_decision.a: "Розважлива порада."
  mos_posolsky_prikaz_decision.b: "Це лише засіб для плетіння політичних інтриг."
  enable_posolsky_cabinet_action: "Відкриває [Concept('cabinet_action', 'доручення')|e] #TOOLTIP:CABINET_ACTION,posolsky,X #L «Посольський приказ»#!#!"
  mos_posolsky_prikaz_decision.historical_info: "#italic Посольський приказ#! був урядовою установою, що відала справами дипломатії. Її урядовці брали участь у перемовинах з іншими державами, призначали послів і порядкували важливими документами, які стосувалися зовнішньої політики країни."
  mos_moscow_artillery_yard_decision.title: "Московський гарматний двір"
  mos_moscow_artillery_yard_decision.desc: "Гармати починають відігравати все важливішу роль на полі бою, тому ми маємо забезпечити військо достатньою кількістю гармат. Варто доручити нашим майстрам заснувати окреме виробництво для гарматного діла, аби #TOOLTIP:LOCATION,moscow,X #L Москва#!#! стала осередком військових новацій і надійним постачальником зброї."
  mos_moscow_artillery_yard_decision.a: "Це забезпечить справді вибухове зростання нашої бойової міці."
  mos_moscow_artillery_yard_decision.b: "Ліпше спрямуймо зусилля на вишкіл вояків."
  mos_moscow_artillery_yard_decision.historical_info: "Московський гарматний двір було засновано за правління Івана IV, і він відіграв важливу роль у посиленні військової спроможности країни. Виробництво гармат дало Росії змогу поширити свій вплив і здобути перемогу в багатьох війнах."
  mos_ban_oprichniki_decision.title: "Опричний терор"
  mos_ban_oprichniki_decision.desc: "Опричники й далі винищують тих, кого запідозрили у зраді. Нещодавно розграбовано кілька маєтків #TOOLTIP:POPTYPE,nobles,X #L знаті#!#! у селах, через що тамтешні #TOOLTIP:POPTYPE,peasants,X #L селяни#!#! залишилися без господарства. Якщо найближчим часом ми не виправимо становище, країна може зіткнутися з гострою нестачею харчів."
  mos_ban_oprichniki_decision.a: "Оприччині час покласти край."
  mos_ban_oprichniki_decision.b: "Нас це не обходить."
  STATIC_MODIFIER_NAME_displaced_farmers: "Знедолені селяни"
  disable_oprichnik_policy: "[Concept('policy', 'Політика')|e] #TOOLTIP:POLICY,oprichnik_policy,X #L «Опричники»#!#! стане недоступною"
  mos_ban_oprichniki_decision.historical_info: "Опричники відбирали маєтності в тих, кого вважали ворогами держави. Цей звичай іще дужче зміцнював владу царя та його поплічників, але мав і лихі наслідки. Багатьом селянам довелося кинути володіння своїх страчених чи ув'язнених господарів. Як наслідок, на нивах не стало кому працювати, що призвело спершу до мізерних врожаїв, а згодом і до голоду."
  mos_aptekarsky_prikaz_decision.title: "Аптекарський приказ"
  mos_aptekarsky_prikaz_decision.desc: "Кожен #TOOLTIP:GOVERNMENT_REFORM,prikazi_reform,X #L приказ#!#! має своє окреме значення у врядуванні, однак нещодавній чумний мор довів, що ми приділяємо замало уваги здоров'ю та добробуту люду. Ми мусимо створити окреме відомство, яке вживатиме належних заходів у разі нової пошести чи іншого лиха. Інакше на нас чекає стрімке зростання смертности, через що забракне робітників і вояків для захисту нашої [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  mos_aptekarsky_prikaz_decision.desc.entry: "Прикази непогано дають собі раду з війною, торгівлею та судом, але геть безпорадні перед чумою. Окреме відомство охорони здоров'я не мало б значення у благополучний рік, проте важило б надзвичайно багато під час наступного лихоліття — а ми пережили вже достатньо скрутних років, щоб знати, що чекає на нас попереду."
  mos_aptekarsky_prikaz_decision.a: "П'явки та пускання крови — от і всі ліки."
  mos_aptekarsky_prikaz_decision.b: "Молитва позбавить нас будь-яких напастей."
  mos_aptekarsky_prikaz_decision.tt1: "Знать зрадіє заснуванню Аптекарського приказу, який надаватиме їй лікарську допомогу в особливому порядку"
  enable_aptekarsky_cabinet_action: "Відкриває [Concept('cabinet_action', 'доручення')|e] #TOOLTIP:CABINET_ACTION,aptekarsky,X #L «Аптекарський приказ»#!#!"
  mos_aptekarsky_prikaz_decision.historical_info: "Аптекарський приказ був однією з урядових установ, що контролювала виробництво та розподіл ліків, керувала аптеками та опікувалася іншими справами охорони здоров’я. Крім того, приказ відповідав за лікування знаті та членів царської родини. У тому чи іншому вигляді ця установа залишалася важливою складовою урядового устрою Російської імперії до свого скасування після революції 1917 року."
  mos_bolshogo_dvortsa_prikaz_decision.title: "$bolshogo_dvortsa$"
  mos_bolshogo_dvortsa_prikaz_decision.desc: "Воєвода #TOOLTIP:LOCATION,nizhny_novgorod,X #L Нижнього Новгорода#!#! [alexander_lvov.GetName] нещодавно повернувся до двору, щоби заступити посаду окольничого, яка надасть йому додаткові повноваження. Ми також можемо призначити його очільником Двірцевого #TOOLTIP:GOVERNMENT_REFORM,prikazi_reform,X #L приказу#!#! та довірити йому відання монастирями. Це дозволить нам ощадливіше витрачати кошти та наглядати за втіленням заходів, запропонованих #TOOLTIP:POLICY,non_possessors,X #L нестяжателями#!#!."
  mos_bolshogo_dvortsa_prikaz_decision.desc.entry: "$name_alexis.east_slavic_language$ вже має ту довіру, яка личить чину окольничого; бракує лише посади, гідної цієї довіри. Передавши двірцеві вотчини та монастирі в одні вірні руки, ми наведемо лад у врядуванні, яке тривалий час велося незграбно й розрізнено."
  mos_bolshogo_dvortsa_prikaz_decision.a: "Непогана думка."
  mos_bolshogo_dvortsa_prikaz_decision.b: "Такий суворий нагляд ні до чого."
  enable_bolshogo_dvortsa_cabinet_action: "Відкриває [Concept('cabinet_action', 'доручення')|e] #TOOLTIP:CABINET_ACTION,bolshogo_dvortsa,X #L «Двірцевий приказ»#!#!"
  enable_bolshogo_dvortsa_cabinet_action.tt2: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] надзвичайно задоволен[ROOT.GetCountry.Custom('clergy_yiaei')] довірою уряду"
  mos_bolshogo_dvortsa_prikaz_decision.historical_info: "Алєксєй Михайлович Львов був державним діячем, який стрімко просувався по службі, ставши спершу воєводою, згодом послом, а зрештою очільником Двірцевого приказу. На останній посаді він працював до самої старости, доки добровільно не пішов у відставку."
  mos_greek_latin_academy_decision.title: "Establish the $greek_latin_academy$"
  mos_greek_latin_academy_decision.desc: "[simon_sitnianowicz.GetName], видатний богослов родом із #TOOLTIP:LOCATION,polotsk,X #L Полоцька#!#!, пропонує створити мовну школу, де державні службовці зможуть навчатися загальноприйнятою мовою дипломатії — #L [latin.GetName|l]ою#!. Крім того, він виявив бажання викладати простолюду граматику, поетику та риторику. Така смілива ініціатива варта похвали, тому нам слід виділити кошти на її підтримку."
  mos_greek_latin_academy_decision.desc.entry: "Зносини ведуться [ShowLanguageName('latin_language')]ою мовою, тоді як більшість наших посадовців цієї мови не знають. $name_simeon.east_slavic_language$ $Sitnianowicz$ пропонує вивчати її як належить, а також зголосився викладати простолюду риторику — прагнення, що виходить далеко за межі передбаченого забезпечення."
  mos_greek_latin_academy_decision.a: "Вправне володіння мовами відкриває чимало можливостей."
  mos_greek_latin_academy_decision.b: "Хай краще займається проповідями."
  mos_greek_latin_academy_decision.c: "Наймімо його як особистого наставника."
  mos_greek_latin_academy_decision.d: "Люду не потрібна освіта."
  mos_greek_latin_academy_decision.tt1: "З’явиться [Concept('character', 'персонаж')|e] Симеон Полоцький"
  mos_greek_latin_academy_decision.tt2: "Він присвятить себе віршуванню та просвіті люду"
  mos_greek_latin_academy_decision.tt3: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] задоволен[ROOT.GetCountry.Custom('clergy_yiaei')] вигнанням непересічного богослова."
  mos_greek_latin_academy_decision.historical_info: "Симеон Полоцький був білоруським ченцем, поетом і перекладачем, який зробив значний внесок у розвиток російської літератури та православної спадщини. Він запровадив викладання грецької та латинської мов у Росії, а також допоміг перекласти кілька праць західних богословів, що посприяло поширенню чужоземних ідей серед російських священників."
  mos_collegium_decision.title: "Колегії"
  mos_collegium_decision.desc: "Нова реформа врядування вимагає чіткішого розмежування відомств, аби уникнути виконання ними тих самих обов’язків. Задля цього нам слід остаточно відмовитися від системи #TOOLTIP:GOVERNMENT_REFORM,prikazi_reform,X #L приказів#!#! і замінити їх колегіями, кожна з яких матиме власні повноваження й завдання, а також надаватиме поради щодо спірних питань."
  mos_collegium_decision.a: "Країна давно потребує цих змін."
  mos_collegium_decision.b: "Не варто змінювати урядовий устрій без вагомого приводу."
  variable_prikazi_tt: "У країні діє система приказів"
  enable_collegium_reform: "Відкриває [Concept('government_reform', 'державну реформу')|e] #TOOLTIP:GOVERNMENT_REFORM,collegium_reform,X #L «Колегії»#!#!"
  mos_collegium_decision.tt1: "[Concept('government_reform', 'Державна реформа')|e] «Прикази» та всі пов’язані з нею [Concept('cabinet_action', 'доручення')|e] стануть недоступними"
  mos_collegium_decision.tt2: "Врядування #TOOLTIP:LOCATION,neva,X #L Санкт-Петербургом#!#! буде приведено у відповідність до [Concept('policy', 'політики')|e] #TOOLTIP:POLICY,dop_law_governing_senate,X #L «Правительствуючий сенат»#!#!"
  mos_collegium_decision.historical_info: "Після заснування Правительствуючого сенату Пьотр Великий утворив низку колегій, які відповідали за різні галузі державного врядування. Ідея їх створення була запозичена в сусідньої Швеції, де тоді також проводилися подібні реформи. Ці зміни були зумовлені невпинним зростанням теренів Російської імперії, яка потребувала справнішого врядування."
  mos_sukharev_tower_decision.title: "Сухарева вежа"
  mos_sukharev_tower_decision.desc: "Військовому флоту потрібен невпинний приплив вправних моряків, здатних передавати свої знання наступним поколінням. Для цього ми можемо створити школу, де молодь навчатиметься технічних наук, закладаючи цим основу для подальшого розвитку нашого війська. Нещодавно один із наших зодчих представив величний задум вежі, яка якраз стане в пригоді для наших потреб і водночас прикрасить вигляд #TOOLTIP:LOCATION,moscow,X #L Москви#!#!."
  mos_sukharev_tower_decision.a: "Це вигідна пропозиція."
  mos_sukharev_tower_decision.b: "Така розкіш ні до чого."
  mos_sukharev_tower_decision.c: "Ця споруда має приносити користь місту."
  mos_sukharev_tower_decision.c.entry: "It must meet the needs of the city."
  mos_sukharev_tower_decision.tt1: "Яків Брюс створить на горішньому поверсі вежі астрономічну обсерваторію"
  mos_sukharev_tower_decision.tt2: "На другому поверсі вежі розміщується сучасний резервуар для водопровідної системи #TOOLTIP:LOCATION,moscow,X #L Москви#!#!"
  mos_sukharev_tower_decision.historical_info: "Сухарева вежа була збудована наприкінці XVII століття за наказом Пьотра Великого й названа на честь Лаврентія Сухарева, командира стрілецького полку, який став на бік царя під час його протистояння із сестрою Софією. За час свого існування вежа слугувала різним потребам, зокрема як казарма, навчальний заклад, водяний резервуар і навіть торговий склад. У 1934 році радянське керівництво вирішило знести вежу в межах перебудови Москви."
  mos_chosen_rada_decision.title: "Вибрана рада"
  mos_chosen_rada_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] занадто владн[ROOT.GetCountry.Custom('nobles_yiaei')]; їхній вплив перешкоджає зосередженню влади в руках одного государя, а отже — швидкому ухваленню рішень. Утім, вихід є: можна заснувати особливу обрану раду, яка буде непідвладною впливу бояр. Ми зможемо швидше вирішувати державні справи та навіть здійснювати різноманітні перетворення. Ймовірно, до ради [ROOT.GetCountry.GetGovernment.GetRulerTitle|l], з-поміж усіх інших, посадить своїх близьких друзів — це [alexi_adashev.GetName] та [sylvestr_the_priest.GetName]."
  mos_chosen_rada_decision.desc.entry: "Рада улюбленців кориться государю; $nobles_estate$ же не кориться нікому, і в цьому все лихо. Поставивши $name_alexander.east_slavic_language$ $adashev$ та $name_silvester.east_slavic_language$ у центрі врядування, ми перенесемо ухвалення рішень зі зборів до кімнати, яку дійсно контролюємо."
  mos_chosen_rada_decision.a: "Грізна та дієва сила."
  mos_chosen_rada_decision.b: "Така рада буде безсилою."
  mos_chosen_rada_decision.tt3: "Алєксандр Адашев і Сильвестр будуть заарештовані та страчені; цьому рад[ROOT.GetCountry.Custom('nobles_aei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l]"
  enable_chosen_rada_reform: "Відкриває [Concept('government_reform', 'державну реформу')|e] #TOOLTIP:GOVERNMENT_REFORM,chosen_rada_reform,X #L «Вибрана рада»#!#!"
  mos_chosen_rada_decision.historical_info: "Вибрана рада — коло наближених Івана Грозного, що відіграло визначну роль в історії Московської держави в перші роки правління царя. До неї входили, крім інших, такі діячі, як Алєксєй Адашев та духівник Сильвестр — довірені радники великого князя, без яких була б неможливою централізація царської влади, здійснення правових реформ і вирішення частини питань, що поставали перед державою."
  rus_russian_absolutism_decision.title: "Цілковитий перегляд врядування державою"
  rus_russian_absolutism_decision.desc: "Стало цілком очевидно, що врядування #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#! потребує іншого, сучасного підходу. Настав час позбутися застарілих звичаїв і марних засобів. Якщо [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] матиме міцну законодавчу владу, а [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'її', 'його')] укази негайно виконуватимуться єдиною установою, то ніяке хабарництво та жодні кривди не зможуть завадити перетворенням у державі."
  rus_russian_absolutism_decision.desc.entry: "Указ, якому потрібно витримати раду, перш ніж зіткнутися з дійсністю, вже наполовину приречений на невдачу. Зосередивши владу в руках государя та єдиного злагодженого міністерства, ми дозволимо реформам оминути ті кривди й зволікання, що поховали всі попередні спроби."
  rus_russian_absolutism_decision.a: "Це стане новою віхою в історії країни."
  rus_russian_absolutism_decision.b: "Старі порядки були кращими!"
  enable_russian_absolutism_reform: "Відкриває [Concept('government_reform', 'державну реформу')|e] #TOOLTIP:GOVERNMENT_REFORM,russian_absolutism,X #L «Самовладдя»#!#!"
  rus_russian_absolutism_decision.tt1: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] люту[ROOT.GetCountry.Custom('nobles_yeyut')] через нехтування їхніми законами та привілеями"
  rus_russian_absolutism_decision.historical_info: "Застарілі середньовічні порядки державного врядування Пьотр I замінив дієвою автократією: так, у 1711 році він ліквідував Боярську думу і заснував натомість Сенат — найвищу владну установу, що відповідала за врядування, надходження коштів до казни та укладання законів. У Сенаті було встановлено сувору військову дисципліну: за засіданнями наглядали штабофіцери гвардії."
  rus_state_controlled_church_decision.title: "Урядовий нагляд"
  rus_state_controlled_church_decision.desc: "Вплив патріаршества на нашу державу надзвичайно великий — воно заважає запроваджувати необхідні новації, оскільки чіпко тримається за давні звичаї і свою владу, а тому його слід розпустити і здійснити такі перетворення, які зміцнять владу держави над церквою і навіть підпорядкують її."
  rus_state_controlled_church_decision.a: "Розпустімо патріаршество."
  rus_state_controlled_church_decision.b: "$common_string_leave_them_be$"
  rus_state_controlled_church_decision.c: "Цю справу можна владнати грошима."
  rus_state_controlled_church_decision.tt1: "Святійший синод запровадить сувору цензуру на всі видання"
  rus_state_controlled_church_decision.historical_info: "У 1721 році Пьотр I, який прагнув підпорядкувати православну церкву державі, скасував московське патріаршество. Замість нього було засновано Святійший синод — установу церковного врядування, схвалену верховною владою. Його члени займалися, крім іншого, переслідуванням інакодумців та цензурою різних творів. Самого царя в Синоді представляв оберпрокурор."
  rus_academy_of_sciences_decision.title: "Академія наук"
  rus_academy_of_sciences_decision.desc: "Підданцям #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! необхідно прищеплювати знання та виховувати в них любов до наук, аби наша держава гідно виглядала серед рівних. Для цього пропонується заснувати в столиці академію наук, де учні штудіюватимуть математику, астрономію, фізику, хімію та багато іншого, а заразом робитимуть нові відкриття."
  rus_academy_of_sciences_decision.desc.entry: "Велика держава, що запозичує свою математику й фізику в інших, завжди відставатиме від тих держав, що творять їх самі. Академія наук у нашому новому місті сповістить, краще за будь-яку звитягу, що $RUS$ має намір стати до лав останніх."
  rus_academy_of_sciences_decision.a: "Сила нашого розуму має бути співмірною із силою нашого війська."
  rus_academy_of_sciences_decision.b: "Перемовини — запорука успіху."
  rus_academy_of_sciences_decision.tt1: "Васілій Татіщев сприяє заснуванню академії та розбудові #TOOLTIP:LOCATION,neva,X $tt_op_L$Санкт-Петербурга$tt_cl_2$"
  rus_academy_of_sciences_decision.tt2: "У колекції академії з’являться праці Якова Брюса; завдяки цьому вчені отримають нові джерела"
  rus_academy_of_sciences_decision.tt3: "Найкращі уми #ONCLICK:COUNTRY,[target_root_country.GetKey] #TOOLTIP:COUNTRY,[target_root_country.GetKey],X [target_root_country.Custom('CL_GEN')|L]#!#! вестимуть ґрунтовне листування з іншими європейськими освітніми закладами, обмінюватимуться ідеями та віддадуть перевагу розмовам перед ворожнечею"
  rus_academy_of_sciences_decision.historical_info: "Повернувшись із Великого посольства (дипломатичної місії до Європи), Пьотр I заснував у Санкт-Петербурзі академію наук. За взірець він узяв Паризьку академію наук, а також Королівське товариство в Лондоні — заклади, також присвячені науковим дослідженням. Імператорська академія наук відіграла важливу роль у розвитку російської наукової та культурної думки."
  rus_manifesto_of_freedom_decision.title: "Маніфест про вольність"
  rus_manifesto_of_freedom_decision.desc: "Стабільність і сильний правитель — необхідні умови процвітання держави. Зараз [ROOT.GetCountry.GetGovernment.GetRuler.GetName] не має прихильности серед підданих, у країні зріє невдоволення. Доки становище не виправиться, ми зобов’язані робити все, аби [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] згуртува[ROOT.GetCountry.Custom('nobles_vlaloly')]ся довкола монарха. Уряд міг би піти на поступки #TOOLTIP:POPTYPE,nobles,X #L знаті#!#!, дарувати їм звільнення від державної служби та інші вольності. Це дасть нам час зміцнити поки що крихкі підвалини самовладної монархії."
  rus_manifesto_of_freedom_decision.desc.entry: "Самодержець із невдоволеним $nobles_estate$ насправді не такий уже й самовладний. Звільнивши $nobles_estate$ від обов’язкової служби, держава позбувається їхнього обов’язку, але отримує $nobles_estate$, у якого значно менше приводів для змов, поки трон набуває стійкости."
  rus_manifesto_of_freedom_decision.a: "Це необхідне лихо."
  rus_manifesto_of_freedom_decision.b: "Треба спробувати знайти компроміс."
  rus_manifesto_of_freedom_decision.c: "Обурлива пропозиція!"
  rus_manifesto_of_freedom_decision.tt1: "Поки країною править [target_root_country.GetGovernment.GetRuler.GetName], [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] збереж[ROOT.GetCountry.Custom('nobles_eut')] усі свої широкі привілеї"
  revoke_manifesto_of_freedom: "Широкі привілеї, якими користу[ROOT.GetCountry.Custom('nobles_yetsayutsa')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], залишаться чинними, доки не помре монарх, що їх надав."
  rus_manifesto_of_freedom_decision.tt2: "[target_root_country.GetGovernment.GetRuler.GetName] зіткнеться з опором знаті — [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] буд[ROOT.GetCountry.Custom('nobles_eut')] заважати [Select_CString(target_root_country.GetGovernment.GetRuler.IsFemale,'її', 'його')] владі на кожному кроці"
  rus_manifesto_of_freedom_decision.historical_info: "Публікація #italic  Маніфесту про вільність дворянства#! — одна з ключових подій нетривалого царювання Пьотра III. Різка зміна геополітичного спрямування, що позбавила Росію великої воєнної перемоги над Пруссією, відштовхнула від молодого імператора більшу частину дворянства. Щоби заручитися їхньою підтримкою та зміцнити своє становище, Пьотр зменшив дворянські повинності, а для покриття збільшених витрат відібрав церковні землі — що, своєю чергою, викликало невдоволення духовенства. Його вперте прагнення запровадити у війську муштру за прусським зразком ледь не спровокувало військовий заколот. Усе це підштовхнуло Єкатєріну, дружину Пьотра, організувати переворот задля повалення чоловіка."
  rus_speransky_liberalization_decision.title: "Наближаються зміни"
  rus_speransky_liberalization_decision.desc: "[mikhail_speransky.GetName] — людина сучасних поглядів. [Select_CString(mikhail_speransky.IsFemale, 'Вона', 'Він')] щосили прагне запровадити в державі новий конституційний лад, заради чого вдень і вночі засідає в раді. Тож нехай вітер змін наповнить наші вітрила, а компас лібералізму вкаже нам шлях!"
  rus_speransky_liberalization_decision.desc.entry: "$name_michael.east_slavic_language$ $Speransky$ роками укладав конституцію, дарувати яку досі ніхто не наважився. Підтримавши його зараз, ми зобов’язуємо себе до реформ, чий вигляд нам не під силу передбачити сповна, — саме тому всі володарі до нас воліли почекати."
  rus_speransky_liberalization_decision.a: "Тримати за вітром!"
  rus_speransky_liberalization_decision.b: "Це провокаційно та небезпечно."
  enable_speransky_liberalization_reform: "Відкриває [Concept('government_reform', 'державну реформу')|e] #TOOLTIP:GOVERNMENT_REFORM,speransky_liberalization_reform,X #L «Ліберальні реформи Сперанського»#!#!"
  rus_speransky_liberalization_decision.tt1: "На теренах #ONCLICK:COUNTRY,[target_root_country.GetKey] #TOOLTIP:COUNTRY,[target_root_country.GetKey],X [target_root_country.Custom('CL_GEN')|L]#!#! запроваджуються сучасні порядки врядування, чому протисто[ROOT.GetCountry.Custom('nobles_yityat')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]"
  rus_speransky_liberalization_decision.historical_info: "За доби реформатора Алєксандра I відбулися значні зміни: так, у 1802 році було засновано вісім міністерств, що прийшли на зміну застарілим і неповоротким колегіям. Чималий вплив на діяльність імператора мав Міхаіл Сперанський — головний радник Алєксандра і прибічник осучаснення."
  rus_free_economic_society_decision.title: "Вільне економічне товариство"
  rus_free_economic_society_decision.desc: "Сільське господарство залишається основою нашого суспільства, проте методи обробки землі та агротехнічні прийоми, які використовують [ShowPopTypeName('peasants')], є застарілими й низьковрожайними порівняно з суперницькими державами. За помірну ціну реформатор [grigory_orlov.GetName] запропонував створити господарську організацію для поглиблення знань в сільськогосподарській царині та торгівлі, а також зголосився взяти на себе провідну роль у її керівництві.\n\nУ разі успіху товариство також має поставити собі за мету покращення освіти селян та сприяння підготовці кваліфікованих робітників шляхом надання практичних порад, видання часописів і наукових праць на цю тему."
  rus_free_economic_society_decision.desc.entry: "Селянин, що оре так само, як орав його дід, нагодує не більше ротів, ніж дід його нагодував. $name_gregory.east_slavic_language$ $Orlov$ пропонує з власної волі та за скромну ціну заснувати товариство, яке навчатиме кращих способів господарювання, хоча обіцянки часописів і шкіл для хліборобів виходять далеко за межі початкового прохання."
  rus_free_economic_society_decision.a: "Без харчу життя неможливе."
  rus_free_economic_society_decision.b: "Наш шлях буде іншим."
  STATIC_MODIFIER_NAME_potato_varieties_introduced: "Впроваджено нові види картоплі"
  rus_free_economic_society_decision.tt1: "Товариство запровадить нові види #TOOLTIP:GOODS,potato,X #L картоплі#!#! та передові способи землеробства, чим допоможе збільшити врожаї"
  rus_free_economic_society_decision.tt2: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] буд[ROOT.GetCountry.Custom('nobles_eut')] радіти усьому, що допоможе їм зберегти владу над #TOOLTIP:POPTYPE,peasants,X #L селянами#!#!"
  rus_free_economic_society_decision.historical_info: "Вільне економічне товариство — наукове товариство, засноване Ґріґорієм Орловим за підтримки імператриці Єкатєріни II, яка добре розуміла, що способи землеробства в Росії значно застаріли, а країна відстала від інших великих держав, особливо Великої Британії. Товариство видавало посібники з нових способів ведення сільського господарства, допомагало вирощувати в Росії нові культури та опікувалося освітою землеробів, аби ті збирали більше врожаю."
  rus_imperial_academy_arts_decision.title: "Імператорська академія мистецтв"
  rus_imperial_academy_arts_decision.desc: "Сміливий діяч [ivan_shuvalov.GetName] твердо налаштований довести розпочату ним реформу освіти до кінця. Чимале значення для нього має підтримка культури — Шувалов збирається заснувати академію, де найкращі викладачі допоможуть студентам пізнавати мистецтво та архітектуру. Найобдарованішим учням він виділятиме кошти на подорожі до провідних міст Європи. Це починання слід усіляко вітати: #L [ROOT.GetCountry.GetAdjective|l]ий#! народ має ввібрати найкращі культурні віяння, а #TOOLTIP:LOCATION,neva,X #L Санкт-Петербург#!#! — стати світочем класицизму."
  rus_imperial_academy_arts_decision.desc.entry: "$name_john.east_slavic_language$ $Shuvalov$ уже провів реформу училищ; тепер він бажає заснувати академію, що відправляла б наших найздібніших живописців і зодчих навчатися за кордон і повертала б митців, гідних того, щоби [ShowLocationName('neva')] більше не переймала смаку в Європи."
  rus_imperial_academy_arts_decision.a: "Великодушна пропозиція."
  rus_imperial_academy_arts_decision.b: "Обов’язки перед радою важливіші."
  rus_imperial_academy_arts_decision.c: "Краще — ворог хорошого."
  rus_imperial_academy_arts_decision.tt1: "Благородний Грігорій Орлов пожертвує академії значну частку своєї мистецької збірки"
  rus_imperial_academy_arts_decision.tt2: "Іван Шувалов приділяє весь час службі в [Concept('cabinet', 'раді')|e] та досягає значних висот"
  rus_imperial_academy_arts_decision.tt3: "Архітектура переживе чергове відродження"
  rus_imperial_academy_arts_decision.historical_info: "Імператорська академія мистецтв — санкт-петербурзька академія, заснована в 1757 році урядовцем і подвижником мистецтва Іваном Шуваловим за зразком європейських академій. Тут вивчали неокласицизм, нерідко — за допомогою запрошених із Європи викладачів."
  mos_moscow_orphanage_decision.title: "Виховний будинок"
  mos_moscow_orphanage_decision.desc: "Радник [ivan_betskoy.GetName] висуває гідну уваги думку про те, як упоратися з одним із найбільших, за загальною думкою, лих нашого часу — покиданням новонароджених дітей напризволяще. Пропонується влаштувати надійний притулок для нещасних, забезпечуючи їх харчами та навчанням грамоти, аби вони виросли гідними підданими. Питання про те, хто оплачуватиме цю справу, залишається відкритим, але розглядається кілька можливих рішень для його утримання."
  mos_moscow_orphanage_decision.desc.entry: "Дитина, покинута при народженні, нічого не коштує країні сьогодні, але обходиться їй вельми дорого через двадцять років, так чи інакше. $name_john.east_slavic_language$ $Betskoy$ пропонує влаштувати притулок, який натомість виховає їх корисними підданими, — аби лише було кому оплатити цю справу."
  mos_moscow_orphanage_decision.a: "Вигідне вкладення."
  mos_moscow_orphanage_decision.b: "Гідна справа."
  mos_moscow_orphanage_decision.c: "Кожному своє."
  mos_moscow_orphanage_decision.tt1: "Виховний будинок відкриє кілька відділень банку, які відатимуть позиками та заощадженнями для підтримки роботи"
  mos_moscow_orphanage_decision.tt2: "Казна забезпечить щедре фінансування"
  mos_moscow_orphanage_decision.historical_info: "У 1763 році за ініціативою радника та прихильника освітніх реформ Івана Бєцкого й за указом імператриці Єкатєріни II було відкрито Московський імператорський виховний будинок. Поштовхом до відкриття цього закладу стали ідеї Просвітництва, що ширилися тоді в Європі та в Росії. Смертність у виховному будинку була високою, а допомога покинутим дітям — недостатньою, проте дехто з них згодом все ж зміг завдяки наданій там освіті вступити на службу."
  rus_institute_of_noble_maidens_decision.title: "Інститут шляхетних дівчат"
  rus_institute_of_noble_maidens_decision.desc: "Жіноча освіта для багатьох усе ще залишається предметом палких суперечок. Серед її прихильників [ivan_betskoy.GetName], який скликав засідання ради з наміром заснувати заклад, що дасть країні освічених жінок, однаково корисних і родині, і суспільству. Нам залишається лише визначитися, де саме розташовуватиметься це передове училище, після чого можна буде перейти до виховання нового покоління, чий розум не буде затьмарений поганим впливом неуцьких батьків."
  rus_institute_of_noble_maidens_decision.desc.entry: "Донька, вихована лише для хатніх клопотів, не зуміє порядкувати нічим понад те. $name_john.east_slavic_language$ $Betskoy$ прагне заснувати заклад, який навчить молодих жінок більшого, вважаючи, що освічена мати виростить здібніше покоління, ніж неуцька."
  rus_institute_of_noble_maidens_decision.a: "Збудувати його."
  rus_institute_of_noble_maidens_decision.b: "Зробімо з нього Новодівочий монастир."
  rus_institute_of_noble_maidens_decision.c: "Це загроза усталеному ладу."
  rus_institute_of_noble_maidens_decision.tt1: "Усі дівчата, чиї батьки — [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] та [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l], отримають копії статуту"
  rus_printed_charters: "Копії статуту"
  rus_institute_of_noble_maidens_decision.historical_info: "Інститут шляхетних дівчат, заснований Іваном Бєцким за сприяння Єкатєріни II, — перший у Росії навчальний заклад для жінок. Його вихованки здобували шляхетну освіту, зокрема вивчали Вольтера й Локка. Вступити до закладу можна було лише в дуже юному віці. Дівчаток на шість років відлучали від батьків. Утримувався він щорічними надходженнями з казни, а навчатися в інституті спочатку могли тільки дворянські доньки."
  mos_nakaz_decision.title: "Наказ"
  mos_nakaz_decision.desc: "Необхідність якнайшвидшого вступу #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! у добу розвитку та просвітництва стає дедалі очевиднішою. Важливим аспектом цього поступу стане докорінний перегляд зводу законів згідно з європейськими засадами розуму, справедливости й гуманізму. Прийнявши ці цінності, ми врешті-решт позбудемося застарілих правових звичаїв, які лише гальмують суспільний розвиток. Країні час стати на шлях реформ і гарантувати рівність усіх її жителів перед законом."
  mos_nakaz_decision.desc.entry: "A legal code inherited rather than written reflects the century that wrote it, not the one we live in. Rebuilding it around reason and equality before the law would put $RUS$ in step with the ideas now sweeping Europe, at the cost of every custom that code currently protects."
  mos_nakaz_decision.a: "Поступ буває болісним."
  mos_nakaz_decision.b: "Краще обмежимося реформою карних покарань."
  mos_nakaz_decision.c: "Це надто ризиковано."
  enable_nakaz_reform: "Відкриває [Concept('government_reform', 'державну реформу')|e] #TOOLTIP:GOVERNMENT_REFORM,nakaz_reform,X #L «Наказ»#!#!"
  mos_nakaz_decision.tt1: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] буд[ROOT.GetCountry.Custom('nobles_eut')] обурен[ROOT.GetCountry.Custom('nobles_yiaei')] зазіханням на свої привілеї"
  mos_nakaz_decision.tt2: "За відсутности повноцінних суспільних реформ людяніше ставлення до злочинців призведе до зростання злочинности у великих містах"
  mos_nakaz_decision.tt3: "Поступки консерваторам призведуть до посилення їхніх позицій"
  mos_nakaz_decision.historical_info: "#italic Наказ «Комісії для складання проєкту нового Уложення»#! — звід законів, укладений Єкатєріною II з метою реформування та осучаснення правового устрою. Написаний під впливом ідей Просвітництва, «Наказ» вимагав узгодити законодавство з панівною на той час поступовою філософією, а також спростити та уточнити чинні закони. Він запроваджував більш людяні покарання, обмежував застосування катувань і наголошував на рівності всіх підданих перед законом. «Наказ» не було втілено повною мірою через опір потужних консервативних сил, і зрештою увагою Єкатєріни заволоділи інші ідеї."
  rus_intellectual_movements_decision.title: "Пробудження націоналізму"
  rus_intellectual_movements_decision.desc: "Останнім часом учені палко сперечаються про роль #TOOLTIP:CULTUREGROUP,slavic_group,X #L слов’янської#!#! культури та намагаються дати їй визначення. Ті, хто сперечається, розділилися на два табори — одні вважають, що ми мусимо рівнятися на Захід, інакше #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! не вдасться позбутися тягаря минулого, інші ж підносять важливість звичаїв, що лежать в основі [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ої самобутності. З цього протистояння народилися два виразні інтелектуальні рухи, кожен з яких має власне бачення майбутнього країни. Час вирішити, хто з них більшою мірою виражає наші власні інтереси."
  rus_intellectual_movements_decision.desc.entry: "Учені розійшлися в думках: чи варто зберігати [ShowCultureGroupName('slavic_group')] самобутність недоторканною, чи пожертвувати нею заради західного поступу, і суперечка перетворилася на протистояння двох таборів, які не можуть обидва визначати майбутнє $RUS$. Вибір між ними не покладе край суперечці — інша сторона мовчки не змириться."
  rus_intellectual_movements_decision.a: "Ми підтримаємо слов’янофілів."
  rus_intellectual_movements_decision.b: "Ми підтримаємо західників."
  rus_intellectual_movements_decision.custom1: "Відкриває [Concept('law', 'закон')|e] #TOOLTIP:LAW,intellectual_movements,X #L «Рухи інтелектуалів»#!#!"
  rus_intellectual_movements_decision.custom2: "[Concept('policy', 'Політику')|e] в межах [Concept('law', 'закону')|e] #TOOLTIP:LAW,intellectual_movements,X #L «Рухи інтелектуалів»#!#! можна змінювати не частіше ніж раз на десять років"
  rus_intellectual_movements_decision.historical_info: "Західники та слов’янофіли — протиборчі інтелектуальні й ідеологічні течії в Росії XIX століття. Подальший розвиток Росії, її відносини із Західною Європою, збереження російської культурної самобутності — усе це було предметом палких суперечок між прихильниками двох таборів. Західники були прибічниками осучаснення, вони прагнули перейняти європейські ідеї, установи й технології, тоді як слов’янофіли виступали за збереження споконвічних російських цінностей, духовності та громадського побуту."
  rus_secretnoye_byuro_decision.title: "Канцелярія таємних розшукових справ"
  rus_secretnoye_byuro_decision.desc: "Бунтівні верхівки #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! виявляють відкриту непокору владі, і є побоювання, що [current_policy.GetName] вже не спроможна тримати їх у шорах. Чужоземні радники в #TOOLTIP:CABINET_ACTION,bironovshchina,X #L уряді Бірона#!#! пропонують створити окреме відомство для боротьби з бунтівниками та вільнодумцями. Реорганізована таємна поліція дістане широкий мандат і зможе придушувати будь-які протиурядові настрої грубою силою."
  rus_secretnoye_byuro_decision.desc.entry: "Політика, що лише стримує крамолу, — це не те саме, що політика, яка кладе їй край, і чужоземні службовці в чиновництві вже помітили цю різницю. Відродження батога та створення окремої таємної поліції відповідає на це нарікання — ціною будь-якої видимості того, що $RUS$ править чимось м’якшим, аніж страх."
  rus_secretnoye_byuro_decision.a: "Послух вимагає жертв."
  rus_secretnoye_byuro_decision.b: "Ми не опустимося до таких заходів."
  enable_secretnoye_byuro_policy: "Відкриває [Concept('policy', 'політику')|e] #TOOLTIP:POLICY,secretnoye_byuro_policy,X #L «Таємна канцелярія»#!#!"
  rus_secretnoye_byuro_decision.tt1: "Доступно за умови, що [Concept('cabinet', 'радник')|e] виконує [Concept('cabinet_action', 'доручення')|e] #TOOLTIP:CABINET_ACTION,bironovshchina,X #L «Біроновщина»#!#!"
  rus_secretnoye_byuro_decision.historical_info: "Канцелярія таємних розшукових справ відігравала важливу роль за доби правління Анни Іоанівни. Силами цього відомства імператриця придушила своїх політичних супротивників, значно зміцнивши самодержавну владу. Підслідні часто зазнавали найжорстокіших катувань, їм відрізали носи або забивали на смерть батогами з сиром’ятної шкіри. Загалом жертвами політичних чисток стали близько двадцяти тисяч дворян."
  rus_proclaim_tsardom_decision.title: "Проголосити $tsardom$"
  rus_proclaim_tsardom_decision.desc.entry: "Землі Руські зібрано, [GetInternationalOrganizationType('tatar_yoke').GetName] зруйновано, і правителю, що вже звершив працю, гідну імперії, бракує лише імперського титулу. Прийняти його не коштуватиме нічого, крім зухвалості, і покаже всім дворам Європи, як саме нас належить надалі величати."
  rus_proclaim_tsardom_decision.a: "Нехай наш государ вінчається на царство як [SelectLocalization(GetCountry('RUS').GetGovernment.GetRulerOrRegent.IsFemale,'rank_empire_tsar_ruler_female', 'rank_empire_tsar_ruler_male')] усієї Русі."
  mos_byzantine_court_ceremonies_decision.a_tt: "Наш правитель одружиться з нащадком візантійської правлячої династії, за потреби розірвавши теперішній шлюб."
  mos_chosen_rada_decision.a_tt: "$name_alexander.east_slavic_language$ $adashev$ та $name_silvester.east_slavic_language$ увійдуть до нашого [court|e]"
  rus_institute_of_noble_maidens_decision.b.tt: "Якщо він уже існує, ми перебудуємо [ShowBuildingTypeNameWithNoTooltip('novodevichy_convent')]. В іншому разі ми зведемо [ShowBuildingTypeNameWithNoTooltip('institute_of_noble_maidens')] у [ShowLocationNameWithNoTooltip('moscow')]"
  rus_nakaz_decision.desc.entry: "Необхідність запровадження нового зводу законів стає дедалі очевиднішою, і багато освічених учених звертаються до нашого правителя із закликом реформувати право. Проте силоміцьке впровадження реформи може викликати серйозний опір з боку окремих кіл нашого уряду."
  rus_proclaim_tsardom_decision.desc: "Збирання руських земель завершено, а [GetInternationalOrganizationType('tatar_yoke').GetName] скинуто. Наше [GetCountry('RUS').GetFlavorRank] тепер підноситься над іншими князівствами, і наш[GetCountry('RUS').Custom('clergy_aei')] [GetCountry('RUS').GetGovernment.GetEstateName('clergy_estate')] заклика[GetCountry('RUS').Custom('clergy_yeyut')] нас заявити про гідний сан: наш монарх має бути коронований як [SelectLocalization(GetCountry('RUS').GetGovernment.GetRulerOrRegent.IsFemale,'rank_empire_tsar_ruler_female', 'rank_empire_tsar_ruler_male')], спадкоємець давніх імператорів і захисник [ShowReligionAdjective('orthodox')|l]ої віри.\n\nТака коронація проголосить кожному двору Європи й кожному степовому ханству, що [GetCountry('RUS').GetName] не схиляється перед жодною чужою короною."
  rus_proclaim_tsardom_decision.historical_info: "16 січня 1547 року в Успенському соборі Московського кремля відбулося вінчання на царство Івана IV. Він став першим московським правителем, який офіційно прийняв титул царя. Митрополит Макарій, який палко підтримував цей новий статус, поклав на нього шапку Мономаха — оздоблену коштовностями та облямовану хутром корону, яку придворна традиція вважала дарунком візантійського імператора Костянтина IX великому князю Володимиру Мономаху, надісланим за кілька століть до того.\n\nНовий титул знаменував собою свідомий розрив із давнім статусом великого князя. Він проголошував ранг, рівний імператорському, та спадкоємність упалих християнських імперій Сходу. Іноземні двори не поспішали з його визнанням: знадобилися десятиліття зносин, перш ніж Священна Римська імперія та Папство визнали титул царя еквівалентом королівського, а не просто перекладом титулу великого князя."
