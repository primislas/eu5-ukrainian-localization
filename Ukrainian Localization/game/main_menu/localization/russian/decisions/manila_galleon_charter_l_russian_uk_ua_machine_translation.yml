l_russian:
  charter_manila_galleon.title: "Фрахтування манільського галеона"
  charter_manila_galleon.desc: "Тепер, коли зворотний шлях через Тихий океан прокладено й перевірено, океан перестав бути перепоною і став дорогою. Спорядімо великий галеон на нашому західному узбережжі, завантажмо його трюми й відправмо північним шляхом до Азії й назад, обмінявши срібло на шовк та прянощі. Витрати великі, а плавання попереду довге, проте один галеон, що щасливо повернеться, окупить себе багаторазово. Він не повернеться впродовж року, і море ще може поглинути його, але в разі успіху на нас чекає багатство."
  charter_manila_galleon.a: "Спорядіть галеон і завантажте на нього срібло цього сезону."