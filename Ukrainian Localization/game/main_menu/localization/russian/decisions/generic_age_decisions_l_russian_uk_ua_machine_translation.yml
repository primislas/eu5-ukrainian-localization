l_russian:
  sponsor_a_cathedral_decision.title: "Зведення собору"
  sponsor_a_cathedral_decision.desc: "У нашій країні все ще бракує місць для богослужінь та обрядів віри. Слід виділити кошти на будівництво нової споруди [ShowBuildingTypeName('cathedral')], щоб задовольнити потреби нашого люду."
  sponsor_a_cathedral_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  sponsor_a_cathedral_decision.a.entry: "$common_string_brilliant$"
  sponsor_a_cathedral_decision.b: "Не на часі."
  sponsor_a_cathedral_cooldown_tt: "Це [decision|e] ще не застосовувалося за правління чинного правителя"
  sponsor_a_great_madrasa_decision.title: "Будівництво великого медресе"
  sponsor_a_great_madrasa_decision.desc: "Хоча в нашій країні вже чимало місць для поклоніння, звичайні [ShowBuildingTypeName('temple')] та [ShowBuildingTypeName('madrasa')] не можуть задовольнити допитливі уми наших книжників. Слід виділити кошти на нову споруду [ShowBuildingTypeName('great_madrasa')], щоб забезпечити їм гідні умови для навчання й поширення знань."
  sponsor_a_great_madrasa_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  sponsor_a_great_madrasa_decision.a.entry: "$common_string_brilliant$"
  sponsor_a_great_madrasa_decision.b: "Не на часі."
  sponsor_a_great_madrasa_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
  construct_a_grand_palace_decision.title: "Замовити будівництво нового палацу"
  construct_a_grand_palace_decision.desc: "Ані нашому двору, ані родині правителя не вистачає осідку, гідного їхнього становища. Слід найняти [ShowArtistTypeName('architect')], щоб той розпланував будівництво нової споруди [ShowBuildingTypeName('grand_palace')]."
  construct_a_grand_palace_decision.a: "Це буде гідна резиденція."
  strive_towards_thalassocracy_decision.title: "Встановлення таласократії"
  strive_towards_thalassocracy_decision.desc: "Безкраї моря можуть стати життєво важливою частиною нашої країни та її господарського зростання, якщо тільки ми зуміємо належно утвердити своє панування у водах біля наших берегів. Вклавши значні кошти в розбудову флоту, ми зможемо узгодити наш устрій із новим поступом до заморських прагнень."
  strive_towards_thalassocracy_decision.a: "Звернімо наш погляд до моря."
  strive_towards_thalassocracy_decision.a.tt: "Ми матимемо 20 років на створення сильного флоту"
  strive_thalassocracy_coastal_markets_tt: "Володіє бодай одним прибережним [Concept('market_center', 'ринковим центром')|e]"
  abandon_thalassocracy_decision.title: "Відмова від таласократії"
  abandon_thalassocracy_decision.desc: "Правління крізь панування на морях більше не відповідає нашим прагненням. Нам слід спрямувати зусилля на суходіл, на якому ми живемо."
  abandon_thalassocracy_decision.a: "Повернімося на твердий ґрунт."
  found_trade_company_india_decision.title: "Підтримати наші азійські торгові шляхи"
  found_trade_company_india_decision.desc: "Багаті береги [ShowSubContinentName('south_asia')] та [ShowSubContinentName('south_east_asia')] обіцяють нам великі прибутки. Хоча наша нинішня торгівля ведеться переважно окремими купцями, це явно не личить становищу нашої країни. Нам слід використати засоби влади, щоб налагодити більші торгові справи між цими чужоземними ринками та нашим власним."
  found_trade_company_india_decision.a: "Вкласти кошти в Індійську торгову компанію."
  invite_foreign_advisor_decision.title: "Перейняти чужоземні новації"
  invite_foreign_advisor_decision.desc: "Наша країна відчутно відстає від інших великих держав світу. Ми не можемо сидіти склавши руки, доки інші країні перевершують нас у майстерності та новаціях. Запропонувавши щедру платню тямущій людині з однієї з таких країн, ми зможемо спробувати надолужити згаяне й не відстати ще дужче на шляху поступу."
  invite_foreign_advisor_decision.a: "Прийняти чужоземного вченого."
  invite_foreign_advisor_decision.a.tt: "Вчений із чужоземної [Concept('country', 'країни')|e] прибуде до нашого [Concept('court', 'двору')|e]"
  invite_foreign_advisor_decision.b: "Нам вистачає і власних радників."
  invite_foreign_advisor_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
  disempower_the_parliament_decision: "Оскаржити права зборів"
  disempower_the_parliament_decision_desc: "За останні століття наші збори набули певних прав, що обмежують свободу дій нашого уряду. Нам слід звернути увагу на тих, хто міцно закріпився в зборах, і позбавити їх цих прав!"
  disempower_the_parliament_decision.a: "Потрібно приборкати владу зборів."
  disempower_the_parliament_decision.b: "Зараз не час кидати виклик зборам."
  abolish_serfdom_decision.title: "Скасувати кріпацтво"
  abolish_serfdom_decision.desc: "Кріпацтво, що здавна побутує в нашій країні, перетворилося на перешкоду для нашого господарського поступу. Зважаючи на нестале політичне становище наших часів, було б розважливо скасувати цей звичай указом, аби заспокоїти середню верству, що зростає, і полегшити страждання тих, хто живе під батогом."
  abolish_serfdom_decision.a: "Підписати указ."
  abolish_serfdom_decision.b: "Це було б занадто небезпечно для стабільности."
  abandon_absolutism_decision.title: "Зректися самовладдя"
  abandon_absolutism_decision.desc: "Самовладне правління нашого володаря дедалі дужче загрожує внутрішній стабільности країни. Чутки про повстання лунають дедалі частіше, а придушення супротивників нашого ладу стає нелегкою справою. Можливо, настав час відвернутися від старих самовладних ідеалів і запровадити для нашої країни більш представницький устрій?"
  abandon_absolutism_decision.a: "Самовладдя нам більше не підходить."
  abandon_absolutism_decision.b: "Наша влада незаперечна!"
  construct_a_grand_palace_decision.a_tt: "Найнятий [ShowArtistTypeName('architect')] приєднається до нашого [Concept('court', 'двору')|e]"
  disempower_the_parliament_decision.a_building_tt: "Ми приберемо [ShowBuildingTypeName('urban_parliament_seat')] в одній з наших [locations|e]"
  disempower_the_parliament_decision.a_tt: "Кожна [Concept('pop', 'громада')|e] у [Concept('location', 'місцевості')|e] втратить [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'задоволення')|e]"
  disempower_the_parliament_decision.desc: "За останні століття наші збори набули певних прав, що обмежують свободу дій нашого уряду. Нам слід звернути увагу на тих, хто міцно закріпився в зборах, і позбавити їх цих прав!"
  disempower_the_parliament_decision.title: "Оскаржити права зборів"
  disempower_the_parliament_decision_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
  jewish_expulsion_threat.a: "Висунути ультиматум."
  jewish_expulsion_threat_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
  jews_may_choose_to_leave_tt: "Більшість наших [ShowReligionAdjective('judaism')]их [Concept('pops', 'громад')|e] переселяється до сусідніх [Concept('countries', 'країн')|e]\n\nКожна [Concept('location', 'місцевість')|e], яку вони залишать, отримає ефект [ShowModifier('jewish_expulsion_threat')], сила якого залежить від частки [ShowReligionAdjectiveWithNoTooltip('judaism')]ого [Concept('pops', 'люду')|e] в ній."
