l_russian:
  sponsor_a_cathedral_decision.title: "Звести собор коштом скарбниці"
  sponsor_a_cathedral_decision.desc: "У нашій країні й досі бракує гідних місць для служіння Богові. Щоби задовольнити потреби вірян, нам слід звести #TOOLTIP:BUILDING_TYPE,cathedral,X #L кафедральний собор#!#! коштом скарбниці."
  sponsor_a_cathedral_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  sponsor_a_cathedral_decision.a.entry: "$common_string_brilliant$"
  sponsor_a_cathedral_cooldown_tt: "Це [Concept('decision', 'рішення')|e] не обиралося за нинішнього правителя"
  sponsor_a_cathedral_cost_estimate_tt: "The [ShowBuildingTypeName('cathedral')] will have a base price of 400@gold!. This will be discounted by $royal_sponsorship$ and is influenced by the [location|e] it is built in."
  sponsor_a_great_madrasa_decision.title: "Звести велике медресе коштом скарбниці"
  sponsor_a_great_madrasa_decision.desc: "Хоч у нашій країні чимало споруд, присвячених Богові, нашим видатним богословам уже замало звичайних #TOOLTIP:BUILDING_TYPE,madrasa,X #L медресе#!#! та #TOOLTIP:BUILDING_TYPE,temple,X #L храмів#!#!. Щоби дати цим мудрецям гідне місце для поширення знань, нам слід звести #TOOLTIP:BUILDING_TYPE,great_madrasa,X #L велике медресе#!#! коштом скарбниці."
  sponsor_a_great_madrasa_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  sponsor_a_great_madrasa_decision.a.entry: "$common_string_brilliant$"
  sponsor_a_great_madrasa_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
  sponsor_a_great_madrasa_cost_estimate_tt: "The [ShowBuildingTypeName('great_madrasa')] will have a base price of [ShowNamedValue('expensive_build_price_age_of_tradition')|0]@gold!. This will be discounted by $royal_sponsorship$ and is influenced by the [location|e] it is built in."
  construct_a_grand_palace_decision.title: "Замовити новий палац"
  construct_a_grand_palace_decision.desc: "Нашій королівській родині та двору бракує оселі, гідної їхньої величі. Настав час найняти #TOOLTIP:ARTIST,architect,X #L зодчого#!#! для спорудження нового #TOOLTIP:BUILDING_TYPE,grand_palace,X #L великого палацу#!#!."
  construct_a_grand_palace_decision.a: "Це буде гідна резиденція."
  construct_a_grand_palace_decision.a_tt: "Найнятий #TOOLTIP:ARTIST,architect,X #L зодчий#!#! приєднається до вашого [Concept('court', 'двору')|e]"
  strive_towards_thalassocracy_decision.title: "Встановити таласократію"
  strive_towards_thalassocracy_decision.desc: "Безкраї морські простори можуть відіграти вирішальну роль у розширенні нашої країни та розвитку її господарства, якщо ми забезпечимо контроль над водами вздовж свого узбережжя. Вклавши значні засоби у спорудження флоту, ми здобудемо все необхідне для панування на морі."
  strive_towards_thalassocracy_decision.a: "Звернімо наш погляд до моря."
  strive_towards_thalassocracy_decision.a.tt: "Ми матимемо 20 років на те, щоби спорудити потужний флот"
  strive_thalassocracy_coastal_markets_tt: "Володіє бодай одним прибережним [Concept('market_center', 'ринковим осередком')|e]"
  abandon_thalassocracy_decision.title: "Відмовитися від таласократії"
  abandon_thalassocracy_decision.desc: "Зміцнення влади через панування на морі більше не відповідає нашим задумам. Ми маємо спрямувати зусилля на землю, на якій живемо."
  abandon_thalassocracy_decision.a: "Повернемося на тверду землю."
  found_trade_company_india_decision.title: "Підтримати торгівлю з Азією"
  found_trade_company_india_decision.desc: "Багатства узбережжя #TOOLTIP:SUB_CONTINENT,south_asia,X #L Південної#!#! та #TOOLTIP:SUB_CONTINENT,south_east_asia,X #L Південно-Східної Азії#!#! обіцяють величезні прибутки. Поки що з цими землями торгують переважно купці-одинаки, але такий стан справ не личить настільки величній країні, як наша. Скориставшись державними важелями впливу, ми маємо заснувати великі торгові місії для цих ринків."
  found_trade_company_india_decision.a: "Вкласти кошти в індійську торгову компанію."
  invite_foreign_advisor_decision.title: "Перейняти чужоземні новації"
  invite_foreign_advisor_decision.desc: "Наша країна істотно відстає від інших великих держав світу в розвитку технологій та осучасненні загалом. Ми не можемо сидіти склавши руки, доки суперники нас випереджають. Запропонувавши щедру платню чужоземному вченому, ми зможемо спробувати скоротити своє відставання."
  invite_foreign_advisor_decision.a: "Запросимо чужоземного вченого."
  invite_foreign_advisor_decision.a.tt: "Вчений з іншої [Concept('country', 'країни')|e] приєднається до нашого [Concept('court', 'двору')|e]"
  invite_foreign_advisor_decision.b: "Нам вистачає власних радників."
  invite_foreign_advisor_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
  disempower_the_parliament_decision.title: "Зазіхнути на права зборів"
  disempower_the_parliament_decision.desc: "За останні століття наші збори набули певних прав, що обмежують свободу нашого правління. Настав час як слід придивитися до цих вільнодумців і обмежити їхні повноваження!"
  disempower_the_parliament_decision.a: "Нам потрібно обмежити владу зборів."
  disempower_the_parliament_decision.a_building_tt: "Ми ліквідуємо #TOOLTIP:BUILDING_TYPE,urban_parliament_seat,X #L осідок у міських зборах#!#! в одній зі своїх [Concept('locations', 'місцевостей')|e]"
  disempower_the_parliament_decision.a_tt: "Кожна [Concept('pop', 'громада')|e] у [Concept('location', 'місцевості')|e] отримає [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  disempower_the_parliament_decision.b: "Зараз не час сваритися зі зборами."
  disempower_the_parliament_decision_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
  abolish_serfdom_decision.title: "Скасувати кріпацтво"
  abolish_serfdom_decision.desc: "Кріпацтво, що здавна побутує в нашій країні, почало заважати розвитку господарства. Зважаючи на буремність сьогодення, можливо, нам варто скасувати цей звичай власним декретом, щоб догодити дедалі більшій середній верстві та полегшити страждання пригноблених селян."
  abolish_serfdom_decision.a: "Підписати указ."
  abolish_serfdom_decision.b: "Це може спричинити смуту."
  abandon_absolutism_decision.title: "Зректися самовладдя"
  abandon_absolutism_decision.desc: "Необмежена влада нашого правителя дедалі більше загрожує внутрішньому спокою країни. Чутки про заколоти лунають дедалі частіше, а придушення невдоволених обходиться владі дедалі дорожче. Можливо, нам час відкинути застарілі ідеали самовладдя та обрати більш представницький устрій?"
  abandon_absolutism_decision.a: "Самовладдя нам більше не підходить."
  abandon_absolutism_decision.b: "Наша влада понад усе!"
  jewish_expulsion_threat.title: "Загроза вигнання"
  jewish_expulsion_threat.desc: "Корона висуває офіційний ультиматум юдейським громадам: сплатити величезний податок або вирушити у вигнання. Перелякані громади одразу ж зібрали гроші, проте загальний дух непевности порушує роботу торгових мереж, які тривалий час підтримували посередники-юдеї."
  jewish_expulsion_threat.a: "Висунемо ультиматум."
  jewish_expulsion_threat_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
  STATIC_MODIFIER_NAME_jewish_expulsion_threat: "Загроза вигнання"
  jews_may_choose_to_leave_tt: "Більша частина наших [Concept('pops', 'громад')|e], що сповідують #TOOLTIP:RELIGION,$judaism_tt$,X #L юдаїзм#!#!, переселиться до сусідніх [Concept('countries', 'країн')|e]\n\nКожна покинута ними [Concept('location', 'місцевість')|e] отримає модифікатор «[ShowModifier('jewish_expulsion_threat')]», масштабований залежно від частки юдейських [Concept('pops', 'громад')]"