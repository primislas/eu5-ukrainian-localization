l_russian:
  pol_shooting_societies_decision.title: "Стрілецькі товариства"
  pol_shooting_societies_decision.desc: "Життя небезпечне й непередбачуване — вгадати, коли на нашу квітучу країну нападуть знову, просто неможливо. Щоби мати змогу захистити свій дім, [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] заснува[ROOT.GetCountry.Custom('burghers_vlaloly')] в #TOOLTIP:LOCATION,krakow,X #L Кракові#!#! стрілецьке товариство, де майбутніх ополченців навчають поводитися з вогнепальною зброєю.\n\nУ міру розширення кордонів і зростання людности нашої країни в інших містах поступово виникають власні стрілецькі товариства. Вони стали настільки численними, що представники цих товариств звернулися до нас із проханням офіційно посприяти заснуванню подібних шкіл у кожному місті краю."
  pol_shooting_societies_decision.desc.entry: "Містяни, які вправляються з власним порохом і свинцем, не коштують скарбниці ні гроша, проте з'являються на службу за покликом. Те, що почалося як одне товариство в [ShowLocationName('krakow')], могло б стати грамотою, дарованою кожному місту, готовому його утримувати, якщо тільки $burghers_estate$ будуть вшановані довірою до зброї."
  pol_shooting_societies_decision.a: "Стріляти по півнях — це не яйця висиджувати: тут потрібні влучність та вправність!"
  pol_shooting_societies_decision.b: "Досить і того, що вже є в Кракові."
  pol_shooting_societies_decision.c: "Краще зосередимося на важливіших видатках…"
  pol_shooting_societies_decision.historical_info: "Назва Краківського стрілецького товариства — «Півняче» — сягає перших змагань стрільців, де мішенями слугували живі півні та кури. З часом їм на зміну прийшли дерев’яні фігурки у вигляді півнів (#italic  kur#!). Так виникла назва #italic  «Куркове братство»#!, оскільки в розмовній польській мові слово «кур» (#italic  kur#!) означає #italic  «півень»#!.\n\nЗа доби масового поширення вогнепальної зброї помітною стала схожість рушничного замка з головою півня. Звідси походить слово «курок», що так вдало збігається з назвою «Куркове братство»."
  pol_privilege_of_koszyce_decision.title: "Кошицький привілей"
  pol_privilege_of_koszyce_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] отримали несподіване прохання: [ruler_scope.GetName] хоче, щоб престол країни, якщо по смерті монарха не залишиться спадкоємців чоловічої статі, могла посісти [Select_CString(ruler_scope.IsFemale,'її', 'його')] донька. Сам[ROOT.GetCountry.Custom('nobles_aei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] бач[ROOT.GetCountry.Custom('nobles_ytyat')] у цьому чудову нагоду виторгувати собі нові привілеї — навряд чи [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] зможе їм відмовити. Їхні умови такі: податок, який зараз сплачу[ROOT.GetCountry.Custom('nobles_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l], буде знижено, а встановлювати нові податки без їхньої згоди буде заборонено. Крім того, надалі всі видатки на відвідини братиме на себе безпосередньо [ROOT.GetCountry.GetGovernment.GetRulerTitle|l], що [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l], певна річ, вважатим[ROOT.GetCountry.Custom('crown_eut')] принизливим."
  pol_privilege_of_koszyce_decision.desc.entry: "Трон, що переходить до доньки, потребує згоди, а згода в цьому королівстві має свою ціну. $nobles_estate$ призначить її монетою й пільгами, і кожна поступка, надана нині, стане прецедентом, який жодна майбутня $crown_estate$ не зможе скасувати."
  pol_privilege_of_koszyce_decision.a: "Ми доведемо цю справу до кінця."
  POL_may_form_union_with_lit_at_later_date: "Завдяки наданню #TOOLTIP:ESTATE_PRIVILEGE,privilege_of_koszyce,X #L Кошицького привілею#!#! влада #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! зможе утворити унію з #ONCLICK:COUNTRY,[GetCountry('LIT').GetKey] #TOOLTIP:COUNTRY,[GetCountry('LIT').GetKey],X [GetCountry('LIT').Custom('CL_INST')|L]#!#!, якщо відбудеться подія «$flavor_pol.55.title$»."
  pol_privilege_of_koszyce_decision.historical_info: "Кошицький привілей — це грамота, надана шляхті королем Угорщини та Польщі Людовиком Великим. Ціною численних поступок шляхті Людовик забезпечив своїй доньці місце на престолі, проте розширення привілеїв шляхти стало першим кроком до встановлення в Польщі шляхетської республіки. Згодом донька короля, заради якої і було укладено привілей, — Ядвіга — вийшла заміж за великого князя литовського Ягайла, що привело до об’єднання Польщі й Литви в особисту унію — Річ Посполиту."
  pol_nihil_novi_decision.title: "Nihil novi"
  pol_nihil_novi_decision.desc: "На нещодавньому засіданні [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] висуну[ROOT.GetCountry.Custom('nobles_vlaloly')] геть нечувану пропозицію. Піддавшись омані [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого характеру, вони почали вважати, що у влади не повинно бути права ухвалювати закони, які стосуються шляхтичів, без їхньої на те згоди. Це обурливо! Проте без підтримки цього стану ми втратимо кошти на будь-які подальші дії, тому висунуту пропозицію доведеться розглянути, якою б безглуздою вона не здавалася. Крім того, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] збира[ROOT.GetCountry.Custom('nobles_yetsayutsa')] обмежити права містян і прикріпити своїх селян до землі. Нам не залишають вибору — найімовірніше, доведеться погодитися."
  pol_nihil_novi_decision.desc.entry: "На розгляді нашого сейму перебуває прохання, за яким $nobles_estate$ не відповідатиме перед жодним законом, якщо сама його не схвалить, а містяни та кріпаки тим часом будуть зв’язані ще дужче. Це образа, виряджена у форму прохання, і відмова означає, що доведеться шукати інший спосіб платити за наші війни."
  pol_nihil_novi_decision.a: "Даймо їм ці нещасні права."
  pol_nihil_novi_decision.b: "Обійдуться без нових прав."
  pol_nihil_novi_decision.historical_info: "#italic  Nihil novi nisi commune consensu#! («нічого нового без загальної згоди») — це конституція, тобто закон, ухвалений у 1505 році польським сеймом. Nihil novi забороняв ухвалювати нові закони без згоди шляхти. Вважається, що саме з нього в країні почалося встановлення шляхетської республіки, а згодом — #italic  Золотої вольності#!."
  pol_rule_of_the_sejm_decision.title: "Виборна монархія в Польщі"
  pol_rule_of_the_sejm_decision.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], володарі найширших привілеїв, поступово починають згадувати про давні домагання. Усе частіше вони прагнуть відстоювати своє невіддільне право обирати, кому саме належатиме [ROOT.GetCountry.GetFlavorRank|l], стверджуючи, що в історії країни вже є такий прецедент. І хоч ці заяви безглузді, ми не можемо заперечити серйозно, оскільки [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] набува[ROOT.GetCountry.Custom('nobles_yeyut')] усе більшого впливу, тоді як [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] його втрача[ROOT.GetCountry.Custom('crown_yeyut')]. На жаль, обрання престолонаступників доведеться передати до рук цих людей — подобається нам це чи ні."
  pol_rule_of_the_sejm_decision.desc.entry: "Хто обирає монарха, той тримає монархію. $nobles_estate$ уже достатньо зміцніли, щоб заявити про це вголос, а $crown_estate$ більше не в змозі їй заперечити."
  pol_rule_of_the_sejm_decision.a: "Ми довіримося сейму!"
  pol_rule_of_the_sejm_decision.historical_info: "Окрім безлічі інших привілеїв у XIV–XV століттях польська шляхта отримала право обирати правителя країни. Спочатку престол без жодних заперечень переходив від одного Ягеллона до іншого, тому вибори вважалися чистою формальністю. Проте по смерті останнього представника династії Ягеллонів відбулися перші вибори, на яких шляхтичам довелося обирати між кількома чужоземними претендентами шляхетного походження. За підсумками виборів 1573 року королем Польщі став Генріх Валуа. З тієї миті й до поділу Речі Посполитої у XVIII столітті всі монархи обиралися з-поміж чужоземців."
  pol_nihil_novi_decision.b_tt: "Згодом ми зможемо обрати $nihil_novi$"