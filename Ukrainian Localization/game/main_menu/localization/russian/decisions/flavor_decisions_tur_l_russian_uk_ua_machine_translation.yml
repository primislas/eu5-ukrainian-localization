l_russian:
  tur_enderun_academy_decision.title: "Школа Ендерун"
  tur_enderun_academy_decision.desc: "Наша країна невпинно зростає і розвивається, і їй потрібні вправні керівники та полководці. Щоби забезпечити їхню підготовку, ми можемо заснувати особливу школу, яка діятиме при нашому дворі. Це не лише дозволить нам повністю контролювати навчальний процес, а й забезпечить зв’язок майбутніх урядовців із правлячою династією [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName], а отже — зміцнить її вплив в усіх царинах державного врядування.\n\nДо того ж змогу навчатися в цій школі мусить мати не лише знать, а й уся обдарована молодь незалежно від походження."
  tur_enderun_academy_decision.desc.entry: "Слуга, що виріс у палаці, завдячує своїм становищем правлячому дому, а не імені власного батька. Внутрішня палацова школа дасть нам урядовців та полководців, чиє служіння починається й закінчується за нашою волею, тож нема чого залишати такі посади лише для людей шляхетного походження."
  tur_enderun_academy_decision.a: "За цим майбутнє!"
  tur_enderun_academy_decision.historical_info: "У дворі нового палацу Топкапи султан Мехмед II заснував школу, де навчалися найздібніші юнаки з-поміж християнських невільників, дібраних за звичаєм девшірме. Тут вони вивчали ісламську віру, науки, військову справу та іноземні мови. З XV по XVI століття спадкове врядування в Османській імперії трималося насамперед на чиновниках з-поміж тих, хто пройшов вишкіл в Ендеруні, а тому був вірним султанові."
  tur_expanded_timariot_decision.title: "Розширення тимаріотського устрою"
  tur_expanded_timariot_decision.desc: "Для розширення тимарного устрою нам потрібні кошти, і радники пропонують використати для цього прибутки від вакфів — доброчинних установ, що допомагають хворим та незаможним. Це дасть нам змогу значно зміцнити наше військо і водночас зменшити вплив, який ма[ROOT.GetCountry.Custom('clergy_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l]. Проте слід зважати на те, що найпобожніші піддані нашої країни можуть бути невдоволені такою політикою."
  tur_expanded_timariot_decision.desc.entry: "Віддана кінноті земля окупає сама себе, благодійні ж вакфи не приносять жодного вершника. Переспрямувавши кошти вакфу, ми зможемо виставити більше кінноти й водночас урізати доходи духовенства. Щоправда, воно навряд чи не помітить, куди саме пішли ці гроші."
  tur_expanded_timariot_decision.a: "Країні знадобляться ці гроші."
  tur_expanded_timariot_decision.b: "Вакф недоторканний!"
  tur_expanded_timariot_decision.historical_info: "Мехмед II прагнув будь-що зміцнити особисту владу над Османською імперією. На схилі років свого правління він спробував позбавити улемів впливу, переспрямувавши прибутки від #italic вакфів#!, які їх підтримували, на користь тимарної системи, зміцнивши в такий спосіб османське військо. Таке рішення не всі сприйняли з однаковим захватом…"
  tur_enderun_service_decision.title: "Внутрішня служба"
  tur_enderun_service_decision.desc: "Обдаровані невільники-євнухи вже давно відіграють помітну роль у нашому врядуванні. Ці скопці, позбавлені прагнень продовжити рід та мирського панування, здатні принести нам велику користь. При дворі нині мешкає кілька здібних хлопчиків-невільників. Ми могли б зміцнити їхні зв’язки з домом [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName], віддавши їм посади в нашій господі, за які колись змагалися підлабузники-[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]."
  tur_enderun_service_decision.desc.entry: "Той, хто не здатен започаткувати власний дім, навряд чи робитиме це нашим коштом. Офіційні посади при дворі для євнухів дадуть змогу піднести найздібніших із них над знаттю, яка вже давно вважає подібні пости своїми за спадковим правом."
  tur_enderun_service_decision.a: "Двір давно час реформувати."
  tur_enderun_service_decision.b: "Ні, треба й надалі покладатися на знать."
  tur_enderun_service_decision.b.entry: "Ні, слід і надалі покладатися на знать."
  tur_enderun_service_decision.historical_info: "#italic Ендерун#! (від перського слова, що означає #italic «всередині»#!) — це коло придворних, які належали до найближчого оточення султана. Також в Османській імперії існувала «зовнішня служба», або #italic Бірун#!, що відповідала за діяльність державного механізму. Здебільшого до Ендеруну входили євнухи та юні невільники-християни. Переважно вони займалися обслуговуванням і навчанням султанської родини, але з часом дехто з них здобув значну політичну вагу."
  tur_imperial_harem_decision.title: "Облаштування гарему"
  tur_imperial_harem_decision.desc: "З давніх-давен двір дому [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] розпорошений між різними палацами й посадами. Якщо ми справді прагнемо величі, слід зосередити нашу владу та присутність у [capital_location.Custom('LR_PREP')|l] [capital_location.GetName]. Задля цього знадобиться перевезти туди всіх наложниць султана й оселити їх у пишних покоях.\n\nЗвісно, знаті такий крок видасться відверто ворожим, адже ми позбавимо шляхетних родин їхнього давнього особистого привілею — прямого доступу до султана."
  tur_imperial_harem_decision.desc.entry: "Влада тягнеться за тим, хто найближче до правителя, і зараз це той, чий палац виявився найближчим. Зібравши все придворне господарство в одній безпечній резиденції у столиці, ми раз і назавжди покладемо край цій непевності, але саме тому знать буде особливо невдоволена таким рішенням."
  tur_imperial_harem_decision.a: "Створимо султанський гарем."
  tur_imperial_harem_decision.b: "Ми цілком задоволені своїм двором."
  tur_imperial_harem_decision.historical_info: "У XVI столітті правляча османська родина осіла в константинопольському палаці Топкапи, і багато її членів, надто жінки, проводили там усе своє життя. Це призвело до перетворення гарему на дієву ієрархічну установу. Оскільки османські правителі тепер жили усамітнено, доступ до них став великим привілеєм, що лише зміцнювало їхню владу."
  tur_eunuch_viziers_decision.title: "Створити посаду кизляр-аги"
  tur_eunuch_viziers_decision.desc: "[mehmed_agha.GetName] — здібний євнух і один із вартових [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого гарему. Кілька придворних угруповань бажають, щоб для цього євнуха запровадили нову посаду #italic кизляр-аги#!, начальника охорони дівчат. На цій посаді він наглядатиме за особистими покоями правителя та правитиме за посередника між гаремом і верховною радою. Також він стане вищим за старого білого євнуха, #italic капи-агу#!, що відповідає за хлопчиків-слуг при дворі, але ніколи не відзначався особливою надійністю."
  tur_eunuch_viziers_decision.desc.entry: "Доступ до особистих покоїв правителя відчиняє значно більше, ніж просто ще одні двері. $name_muhammad.turkish_language$ має і розум, і хватку, необхідні для такої посади, а його піднесення до #italic кизляр-аги#! раз і назавжди вирішить питання щодо вірности головного білого євнуха."
  tur_eunuch_viziers_decision.a: "Ми підвищимо Кизляр-агаси."
  mehmed_agha_tt: "[Concept('character', 'Персонаж')|e] із добрими навичками приєднається до двору та отримає [Concept('modifier', 'модифікатор')|e] «[ShowModifier('kizlar_agha_modifier')]»"
  tur_eunuch_viziers_decision.b: "Капи-агаси більш гідний підвищення."
  valide_sultan_objects.tt: "Валіде-султан це не сподобається."
  mehmed_agha_fired.tt: "[mehmed_agha.GetNameWithNoTooltip] залишає двір."
  tur_eunuch_viziers_decision.historical_info: "Кількість євнухів при османському дворі безупинно зростала. У 1574 році для Мехмеда-аги створили посаду кизляр-аги, що надала євнухам нечувану владу. Африканські євнухи вважалися значно надійнішими, адже мешкали далеко від батьківщини. З часом вони набули більшої ваги, ніж білі євнухи. Почасти завдяки тісним зв’язкам кизляр-аги з могутніми валіде-султан (матерями правлячих султанів) ця посада зрівнялася з візиром першого рангу — вище стояли лише великий візир і шейх-уль-іслам."
  tur_sekban_system_decision.title: "Покінчити з тимаріотами"
  tur_sekban_system_decision.desc: "Устрій #TOOLTIP:ADVANCE_DEFINITION,timariots,X #L тимаріотів#!#!, який довго служив нам вірою й правдою, спіткав важкі клопоти. Землі, які ми роздаємо вершникам, дедалі дужче дрібняться й бідніють, а самі вершники зазнають тяжких труднощів у бою проти озброєних мушкетами ворогів. Припинивши роздавати наділи, ми могли б віддавати їх в оренду, коли їхні володарі старітимуть і вмиратимуть, що допоможе наповнити державну скарбницю. Також не завадило б осучаснити військо, зосередившись на піхоті з вогнепальною зброєю."
  tur_sekban_system_decision.a: "Все тече, все змінюється."
  timars_unavailable.tt: "[Concept('reforms', 'Реформи')|e] «Тимар» назавжди стануть недоступними."
  tur_sekban_system_decision.historical_info: "Система надання сипахам — воїнам важкої кінноти, — земельних наділів, або тимарів, з часом утратила важливість. Великі османські завоювання залишилися в минулому, і земель стало просто не вистачати. Крім того, представники інших родів військ — особливо яничари — теж почали претендувати на цей привілей. Усвідомивши, що далі так тривати не може, османська влада скасувала застарілу систему й почала більше покладатися на набір секбанів — вояків селянського походження."
  tur_kanum_i_osmani_decision.title: "[ShowPolicyNameWithNoTooltip('tur_kanum_i_osmani')]"
  tur_kanum_i_osmani_decision.desc: "Зі зростанням [ROOT.GetCountry.Custom('rank_ua_GEN')|l] у наших володіннях опинилося розмаїття різних народів. Багато з них уже прийняли старі #L [ROOT.GetCountry.GetAdjective|l]і#! закони й увійшли до нашого люду, однак [target_character.GetName] вважає, що цього недостатньо. [Select_CString(target_character.IsFemale, 'Вона', 'Він')] прагне цілковито переписати закони [ROOT.GetCountry.Custom('CL_GEN')], віддаючи перевагу не завоюванню земель, а зміцненню внутрішнього ладу."
  tur_kanum_i_osmani_decision.desc.entry: "Порядки порубіжного князівства не годяться для імперії з безліччю народів. Єдиний звід законів, виданий від нашого імені та обов’язковий для всіх, забезпечить внутрішній лад, якого не досягти самими лише завоюваннями — а завоювали ми за це століття вже чимало."
  tur_kanum_i_osmani_decision.a: "Ці закони приведуть нас до нової доби."
  tur_kanum_i_osmani_decision.b: "Ми візьмемо ці реформи до відома."
  tur_change_tur_kanum_policy_to_give_values_weighted_by_crown_power: "[Concept('modifiers', 'Модифікатори')|e] [Concept('policy', 'політики')|e] [ShowPolicyName('tur_kanum_i_osmani')] стануть ефективнішими на #Y 50%#!, але масштабуватимуться залежно від [Concept('estate_power', 'влади стану')|e] стану «[GetEstateName('crown_estate')]»"
  tur_autonomous_kadiluks_decision.title: "Посилити каді"
  tur_autonomous_kadiluks_decision.desc: "#italic Каді#!, #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламські#!#! судді з усіх питань, давно є одним зі стовпів, на яких тримається держава, і багато вчених мріють про таку посаду. Розвиток устрою врядування та податкового відкупу привів до того, що каді бажають домогтися більшої самоврядности у своїх земельних наділах — #italic кадиликах#!. Вони стверджують, що така самоврядність зміцнить наше право володарювати над усіма мусульманами та підвищить їхню взаємну довіру з Блискучою Портою."
  tur_autonomous_kadiluks_decision.a: "Вони заслужили нашу довіру."
  tur_autonomous_kadiluks_decision.b: "У них і так достатньо влади."
  has_enabled_kadiluks_privilege: "Цей [Concept('estate_privilege', 'становий привілей')|e] став доступним завдяки [Concept('decision', 'рішенню')|e] «$tur_autonomous_kadiluks_decision.title$»"
  tur_autonomous_kadiluks_decision.historical_info: "Упродовж XVII століття влада султана в Османській імперії поступово слабшала, тоді як яничари й каді, навпаки, ставали дедалі могутнішими. Каді отримували у своє розпорядження так звані кадилики, на території яких вони самостійно контролювали військову повинність і оподаткування. Завдяки цьому вони мали значний вплив — особливо у віддалених провінціях, де центральна влада не була такою сильною. Авторитет каді зріс іще більше після Едірнського інциденту 1703 року, під час якого скинули султана Мустафу II."
  tur_malikane_decision.title: "Відкупна реформа"
  tur_malikane_decision.desc: "Прагнучи полагодити стан скарбниці, [grand_vizier.GetName] [Select_CString(grand_vizier.IsFemale, 'підготувала', 'підготував')] новий порядок податкового відкупу під назвою #italic «малікане»#!. Село чи місцевість віддадуть тому, хто запропонує найбільше, після чого переможець торгу дістане пожиттєве право стягувати податки з цих земель. Великий візир запевняє, що новий устрій виправить справи скарбниці — пожиттєвий відкупник дбатиме про розквіт своїх земель, а не визискуватиме їх до крихти, перш ніж спливе угода. Також поменшають видатки на чиновницьку тяганину з річними угодами, звичними для минулих часів. З іншого боку, ці короткострокові угоди давали вельми непоганий прибуток."
  tur_malikane_decision.desc.entry: "Відкупник, який отримав село на рік, оббирає його до нитки; той самий, кому воно дісталося на все життя, буде про нього дбати. Система #italic малікяне#! дає змогу придбати таке довічне право тому, хто запропонує найбільше. Колишні щорічні торги, хоч і вельми прибуткові, поступаються володінням, які приноситимуть податки десятиліттями."
  tur_malikane_decision.a: "Ми проведемо реформу."
  malikane_available.tt: "Відкриває доступ до [Concept('government_reform', 'державної реформи')|e] «[ShowGovernmentReformName('ottoman_malikane_tax_reform')]»."
  tur_malikane_decision.historical_info: "Систему малікане запровадив у 1695 році безталанний великий візир Ельмас Мехмед-паша. Ймовірно, він щиро прагнув збільшити доходи держави в довгостроковій перспективі, але результат виявився неоднозначним. Система малікане натрапила на запеклий опір з боку відкупників, яких влаштовували старі порядки, а влада виявилася нездатною встежити за пожиттєвими наділами. Невдовзі країна зазнала великих воєнних втрат, і реформа ніяк не допомогла у виплаті платні воякам. Ельмас Мехмед-паша був убитий власними наближеними у 1697 році, а в 1703 році яничари, невдоволені затримками виплат, скинули Мустафу II."
  tur_coffee_house_espionage_decision.title: "Проникнення до кав’ярень"
  tur_coffee_house_espionage_decision.desc: "У кав’ярнях, де збира[ROOT.GetCountry.Custom('burghers_yetsayutsa')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l], нерідко лунають крамольні промови, а часом навіть обговорюються заколоти, особливо за участю яничарів. Звісно, жваві бесіди за філіжанкою кави із солодощами корисні для торгівлі та суспільного життя, але нам не завадить розширити шпигунську мережу, щоби жодна таємна розмова не сховалася від наших вух."
  tur_coffee_house_espionage_decision.desc.entry: "За чашкою кави люди говорять вільніше, ніж на допиті, і в кав’ярнях містяни обговорюють багато такого, що яничари воліли б приховати. Закрити кав’ярні — означає позбутися і торгівлі, і чуток. Куди розважливіше було б наповнити їх нашими власними людьми, тоді ми не втратимо ні того, ні іншого."
  tur_coffee_house_espionage_decision.a: "Відомості — це влада."
  tur_coffee_house_espionage_decision.b: "Треба приструнчити кав’ярні."
  tur_coffee_house_espionage_decision.c: "Кава має литися вільно."
  coffee_house_espionage_available.tt: "Відкриває доступ до [Concept('government_reform', 'державної реформи')|e] «[ShowGovernmentReformName('ottoman_coffee_house_espionage')]»."
  tur_coffee_house_espionage_decision.historical_info: "Кав’ярні в Османській імперії слугували місцем зустрічі для людей найрізноманітніших занять, народностей та віросповідань. Османські ремісники могли сидіти за одним столом із російськими волоцюгами та венеційськими купцями. Там точилися бесіди, обговорювалося мистецтво, нові ідеї — і повстання. Яничарські кав’ярні підтримували діяльність таємних мереж убивць і збирачів відомостей. Влада активно засилала до кав’ярень та інших подібних громадських закладів своїх шпигунів, щоби знати про народні настрої та вчасно довідуватися, якщо десь готується злочин чи бунт."
  tur_new_order_army_decision.title: "Армія нового порядку"
  tur_new_order_army_decision.desc: "Розмірковуючи про міць наших ворогів, небезпеки мінливого світу й загрозу заколоту з боку зухвалих і непокірних яничарів, [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'склала', 'склав')] новий задум. [Select_CString(target_ruler.IsFemale, 'Вона вирішила', 'Він вирішив')] залучити знавців із #TOOLTIP:CONTINENT,europe,X #L Європи#!#!, щоб перетворити військо на грізну сучасну силу з новим одностроєм, вишколом та звичаями. Утім, цей крок здатний розпалити лють яничарів, башибузуків, секбанів та всіх інших, кому до вподоби теперішнє становище."
  tur_new_order_army_decision.desc.entry: "Головна перепона у створенні сучасного війська — не брак грошей чи нестача наставників, а вже наявне військо. Створити дисципліноване військо нарівні з яничарами — означає озброїти людей, яким одного разу накажуть їх розпустити. І башибузуки, і секбани розуміють це не гірше за нас."
  tur_new_order_army_decision.a: "Нам потрібні ці зміни."
  tur_new_order_army_decision.b: "Старі звичаї цілком дієві."
  new_order_army_available.tt: "Відкриває доступ до [Concept('government_reform', 'державної реформи')|e] «[ShowGovernmentReformName('ottoman_new_order_army')]»."
  tur_new_order_army: "Доступна державна реформа «[ShowGovernmentReformNameWithNoTooltip('ottoman_new_order_army')]»"
  tur_new_order_army_decision.historical_info: "Нізам-і Джедід, #italic Армія нового порядку#!, була заснована у 1797 році й стала ключовим елементом програми реформ Селіма III. Султан сподівався повернути назад процес децентралізації імперії та послабити міцний вплив яничарів, поступово замінюючи їх сучасною піхотою за європейським зразком."