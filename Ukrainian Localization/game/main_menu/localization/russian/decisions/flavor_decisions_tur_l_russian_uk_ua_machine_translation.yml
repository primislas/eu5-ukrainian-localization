l_russian:
  tur_enderun_academy_decision.title: "Школа Ендерун"
  tur_enderun_academy_decision.desc: "Наша країна невпинно зростає і розвивається, і їй потрібні вправні керівники та полководці. Щоби забезпечити їхню підготовку, ми можемо заснувати особливу школу, яка діятиме при нашому дворі. Це не лише дозволить нам повністю контролювати навчальний процес, а й забезпечить зв’язок майбутніх урядовців із правлячою династією [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName], а отже — зміцнить її вплив в усіх царинах державного врядування.\n\nДо того ж змогу навчатися в цій школі мусить мати не лише знать, а й уся обдарована молодь незалежно від походження."
  tur_enderun_academy_decision.desc.entry: "Слуга, вихований у палаці, завдячує своїм становищем династії, а не імені власного батька. Школа у віданні внутрішнього двору дала б нам чиновників і воєначальників, чий шлях починається і завершується нашою волею, тож немає причини залишати її лави тільки для знатних."
  tur_enderun_academy_decision.a: "За цим майбутнє!"
  tur_enderun_academy_decision.historical_info: "У дворі палацу Топкапи султан Мехмед II заснував школу, де проходили вишкіл найздібніші юнаки з-поміж християнських невільників, відібраних за звичаєм девшірме. Тут вони вивчали ісламську віру, науки, військову справу та чужоземні мови. У XV–XVI ст. устрій спадкового правління в Османській імперії тримався переважно на чиновниках, які пройшли навчання в Ендеруні, а тому були щиро віддані султанові."
  tur_expanded_timariot_decision.title: "Розширення тимаріотської системи"
  tur_expanded_timariot_decision.desc: "Для розширення тимарного устрою нам потрібні кошти, і радники пропонують використати для цього прибутки від вакфів — доброчинних установ, що допомагають хворим та незаможним. Це дасть нам змогу значно зміцнити наше військо і водночас зменшити вплив, який мають [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l]. Проте слід зважати на те, що найпобожніші піддані нашої країни можуть бути невдоволені такою політикою."
  tur_expanded_timariot_decision.desc.entry: "Земля, дарована за кінну службу, окупає себе; благодійні вакфи не окупають геть нічого, що можна було б вивести в похід. Переспрямування вакуфних коштів дало б нам більше вершників і водночас обмежило б вплив $clergy_estate$, хоча благочестиві люди напевне помітять, куди пішли гроші."
  tur_expanded_timariot_decision.a: "Країні знадобляться ці гроші."
  tur_expanded_timariot_decision.b: "Вакф недоторканний!"
  tur_expanded_timariot_decision.historical_info: "Мехмед II прагнув будь-що зміцнити особисту владу над Османською імперією. На схилі років свого правління він спробував позбавити улемів впливу, переспрямувавши прибутки від #italic вакфів#!, які їх підтримували, на користь тимарної системи, зміцнивши в такий спосіб османське військо. Таке рішення не всі сприйняли з однаковим захватом…"
  tur_enderun_service_decision.title: "Внутрішня служба"
  tur_enderun_service_decision.desc: "Талановиті невільники-євнухи вже давно відіграють певну роль у нашому уряді. Ці кастрати, позбавлені прагнень до продовження роду та мирської влади, здатні принести нам велику користь. При дворі зараз живуть кілька обдарованих хлопчиків-невільників. Ми могли б зміцнити їхній зв’язок із династією [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName], роздавши їм посади в нашій господі, за які колись змагалися підлабузники-[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]."
  tur_enderun_service_decision.desc.entry: "Людина, не здатна започаткувати власну династію, має мало причин вибудовувати її нашим коштом. Офіційні придворні посади для палацових євнухів дозволили б піднести найздібніших із них над $nobles_estate$, які вже давно вважають такі посади своїм спадковим правом."
  tur_enderun_service_decision.a: "Двір давно час реформувати."
  tur_enderun_service_decision.b: "Ні, треба й надалі покладатися на знать."
  tur_enderun_service_decision.b.entry: "No, we must continue to rely on the $nobles_estate$."
  tur_enderun_service_decision.historical_info: "#italic Ендерун#! (від перського слова, що означає #italic «всередині»#!) — це коло придворних, які належали до найближчого оточення султана. Також в Османській імперії існувала «зовнішня служба», або #italic Бірун#!, що відповідала за діяльність державного механізму. Здебільшого до Ендеруну входили євнухи та юні невільники-християни. Переважно вони займалися обслуговуванням і навчанням султанської родини, але з часом дехто з них здобув значну політичну вагу."
  tur_imperial_harem_decision.title: "Облаштування гарему"
  tur_imperial_harem_decision.desc: "З давніх-давен двір династії [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] розділений між різними палацами й посадами. Якщо ми справді прагнемо величі, слід зосередити нашу владу та присутність у місті [capital_location.GetName]. Для цього доведеться перевезти туди всіх наложниць султана й оселити їх у розкішному помешканні.\n\nЗвісно, знаті такий крок видасться відвертим зазіханням, адже ми позбавимо її давнього особистого привілею — прямого доступу до султана."
  tur_imperial_harem_decision.desc.entry: "Влада йде за тим, хто перебуває найближче до володаря, а зараз це той, кому випало володіти найближчим палацом. Зібравши двір в одній охоронюваній резиденції в столиці, ми розв’язали б це питання назавжди, і саме тому $nobles_estate$ буде цим невдоволена."
  tur_imperial_harem_decision.a: "Створимо султанський гарем."
  tur_imperial_harem_decision.b: "Ми цілком задоволені нашим двором."
  tur_imperial_harem_decision.historical_info: "У XVI столітті правляча османська родина осіла в константинопольському палаці Топкапи, і багато її членів, надто жінки, проводили там усе своє життя. Це призвело до перетворення гарему на дієву ієрархічну установу. Оскільки османські правителі тепер жили усамітнено, доступ до них став великим привілеєм, що лише зміцнювало їхню владу."
  tur_eunuch_viziers_decision.title: "Запровадження посади кизляр-аги"
  tur_eunuch_viziers_decision.desc: "[mehmed_agha.GetName] — обдарований євнух і один із вартових [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого гарему. Кілька придворних угруповань хочуть, щоб для нього створили нову посаду #italic кизляр-аги#!, вартового дівчат. На цій посаді він наглядатиме за особистими покоями володаря та правитиме за посередника між гаремом і верховною радою. Також він піднесеться над старим білим євнухом, #italic капи-агою#!, який відповідає за хлопчиків-служок при дворі. Цей чоловік ніколи не вирізнявся особливою надійністю."
  tur_eunuch_viziers_decision.desc.entry: "Той, хто контролює доступ до особистих покоїв володаря, контролює значно більше, ніж просто двері. $name_muhammad.turkish_language$ достатньо проникливий для такої посади, і його підвищення до #italic кизляр-агаси#! також розв’язало б давнє питання вірности головного білого євнуха."
  tur_eunuch_viziers_decision.a: "Ми підвищимо Кизляр-агаси."
  tur_eunuch_viziers_decision.b: "Капи-агаси більш гідний підвищення."
  tur_eunuch_viziers_decision.c: "У цих євнухів і так достатньо влади."
  valide_sultan_objects.tt: "Валіде-султан це не сподобається."
  mehmed_agha_fired.tt: "[mehmed_agha.GetNameWithNoTooltip] залишає двір."
  tur_eunuch_viziers_decision.historical_info: "Кількість євнухів при османському дворі постійно зростала. У 1574 році для Мехмеда-аги створили посаду кизляр-аги, яка давала євнухам безпрецедентну владу. Африканські євнухи вважалися надійнішими, оскільки їхня батьківщина була далеко, і з часом вони стали впливовішими за білих євнухів. Почасти завдяки міцним зв’язкам кизляр-аги з могутніми валіде-султан (матерями правлячих султанів) ця посада стала рівнозначною візирові першого рангу — вищими були лише великий візир та $common_string_shaikh_al_islam$."
  tur_sekban_system_decision.title: "Скасувати [ShowAdvanceNameWithNoTooltip('timariots')]"
  tur_sekban_system_decision.desc: "Система тимаріотів, яка справно служила нам, зіткнулася з критичними проблемами. Землі, що ми роздаємо вершникам, стають дедалі роздробленішими та біднішими, а самим вершникам дедалі важче битися з ворогами, озброєними мушкетами. Припинивши роздавати наділи, ми могли б, у міру того як старіють і помирають їхні власники, віддавати їх в оренду, що допоможе наповнити державну скарбницю. Також не завадило б осучаснити військо, зосередившись на піхоті з вогнепальною зброєю."
  tur_sekban_system_decision.a: "Все тече, все змінюється."
  tur_sekban_system_decision.b: "Кіннота — наша головна опора."
  timars_unavailable.tt: "[Concept('reforms', 'Реформи')|e] «Тимар» назавжди стануть недоступними."
  tur_sekban_system_decision.historical_info: "Система надання сипахам — воїнам важкої кінноти, — земельних наділів, або тимарів, з часом утратила важливість. Великі османські завоювання залишилися в минулому, і земель стало просто не вистачати. Крім того, представники інших родів військ — особливо яничари — теж почали претендувати на цей привілей. Усвідомивши, що далі так тривати не може, османська влада скасувала застарілу систему й почала більше покладатися на набір секбанів — вояків селянського походження."
  tur_kanum_i_osmani_decision.title: "[ShowPolicyNameWithNoTooltip('tur_kanum_i_osmani')]"
  tur_kanum_i_osmani_decision.desc: "Зі зростанням [ROOT.GetCountry.Custom('rank_ua_GEN')|l] у наших володіннях опинилося багато найрізноманітніших народів. Багато з них уже прийняли старі #L [ROOT.GetCountry.GetAdjective|l]і#! закони й стали частиною нашого народу, але [target_character.GetName] вважає, що цього недостатньо. [Select_CString(target_character.IsFemale, 'Вона', 'Він')] хоче цілком переписати закони [ROOT.GetCountry.Custom('CL_GEN')], віддаючи перевагу не зовнішньому розширенню, а зміцненню внутрішньої стабільности."
  tur_kanum_i_osmani_decision.desc.entry: "Закони, написані для порубіжного князівства, не годяться для врядування імперією багатьох народів. Єдине зведення законів, видане від нашого імені й обов’язкове для всіх, забезпечило б той внутрішній лад, якого не дадуть подальші завоювання, а завоювали ми вже достатньо для однієї доби."
  tur_kanum_i_osmani_decision.a: "Ці закони приведуть нас до нової доби."
  tur_kanum_i_osmani_decision.b: "Ми візьмемо ці реформи до відома."
  tur_change_tur_kanum_policy_to_give_values_weighted_by_crown_power: "[Concept('modifiers', 'Модифікатори')|e] [Concept('policy', 'політики')|e] [ShowPolicyName('tur_kanum_i_osmani')] стануть ефективнішими на #Y 50%#!, але масштабуватимуться залежно від [Concept('estate_power', 'влади стану')|e] стану «[GetEstateName('crown_estate')]»"
  tur_autonomous_kadiluks_decision.title: "Розширити повноваження каді"
  tur_autonomous_kadiluks_decision.desc: "#italic Каді#!, #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламські#!#! судді з усіх питань, давно є одним зі стовпів, на яких тримається держава, і багато вчених мріють про таку посаду. Розвиток устрою врядування та податкового відкупу привів до того, що каді бажають домогтися більшої самоврядности у своїх земельних наділах — #italic кадиликах#!. Вони стверджують, що така самоврядність зміцнить наше право володарювати над усіма мусульманами та підвищить їхню взаємну довіру з Блискучою Портою."
  tur_autonomous_kadiluks_decision.a: "Вони заслужили нашу довіру."
  tur_autonomous_kadiluks_decision.b: "У них і так достатньо влади."
  has_enabled_kadiluks_privilege: "Увімкнув цей [estate_privilege|e] за допомогою [decision|e] «$tur_autonomous_kadiluks_decision.title$»"
  tur_autonomous_kadiluks_decision.historical_info: "Упродовж XVII століття влада султана в Османській імперії поступово слабшала, тоді як яничари й каді, навпаки, ставали дедалі могутнішими. Каді отримували у своє розпорядження так звані кадилики, на території яких вони самостійно контролювали військову повинність і оподаткування. Завдяки цьому вони мали значний вплив — особливо у віддалених провінціях, де центральна влада не була такою сильною. Авторитет каді зріс іще більше після Едірнського інциденту 1703 року, під час якого скинули султана Мустафу II."
  tur_malikane_decision.title: "The $ottoman_tax_farming$ Reform"
  tur_malikane_decision.desc: "Бажаючи поліпшити грошові справи держави, [grand_vizier.GetName] підготував новий порядок податкового відкупу під назвою #italic малікане#!. Село чи округа дістануться тому, хто заплатить найбільше, після чого переможець торгу отримає довічне право стягувати податок із цих земель. Великий візир стверджує, що новий устрій покращить грошове становище — довічний відкупник буде зацікавлений у тому, щоб дбати про добробут своїх земель, а не визискувати їх до останку до завершення дії угоди. Також скоротяться видатки на чиновницьке оформлення однорічних угод, звичних для колишніх часів. З іншого боку, ці короткострокові угоди були досить прибутковими."
  tur_malikane_decision.desc.entry: "Збирач податків, що тримає село один рік, оббирає його до нитки; збирач податків, що тримає його все життя, дбає про нього. #italic Малікане#! продає це пожиттєве право тому, хто заплатить найбільше, міняючи щедрі щорічні торги минулого на округи, які залишаться вигідними для оподаткування й десять років потому."
  tur_malikane_decision.a: "Ми проведемо реформу."
  tur_malikane_decision.b: "Ми залишимо старі податкові порядки."
  malikane_available.tt: "Відкриває доступ до [Concept('government_reform', 'державної реформи')|e] «[ShowGovernmentReformName('ottoman_malikane_tax_reform')]»."
  tur_malikane_decision.historical_info: "Систему малікане запровадив у 1695 році безталанний великий візир Ельмас Мехмед-паша. Ймовірно, він щиро прагнув збільшити доходи держави в довгостроковій перспективі, але результат виявився неоднозначним. Система малікане натрапила на запеклий опір з боку відкупників, яких влаштовували старі порядки, а влада виявилася нездатною встежити за пожиттєвими наділами. Невдовзі країна зазнала великих воєнних втрат, і реформа ніяк не допомогла у виплаті платні воякам. Ельмас Мехмед-паша був убитий власними наближеними у 1697 році, а в 1703 році яничари, невдоволені затримками виплат, скинули Мустафу II."
  tur_coffee_house_espionage_decision.title: "Проникнення до кав’ярень"
  tur_coffee_house_espionage_decision.desc: "У кав’ярнях, де збираються [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l], нерідко лунають крамольні промови, а часом навіть обговорюються заколоти, особливо за участю яничарів. Звісно, жваві бесіди за філіжанкою кави із солодощами корисні для торгівлі та суспільного життя, але нам не завадить розширити шпигунську мережу, щоби жодна таємна розмова не сховалася від наших вух."
  tur_coffee_house_espionage_decision.desc.entry: "За філіжанкою кави люди говорять значно відвертіше, ніж на допиті, а в кав’ярнях, де збираються $burghers_estate$, повно розмов, які $janissaries_advance$ воліли б зберегти в таємниці від нас. Закривши їх, ми втратили б і торгівлю, і чутки, тоді як, наповнивши їх нашими власними слухачами, ми не втратимо ані того, ані іншого."
  tur_coffee_house_espionage_decision.a: "Відомості — це влада."
  tur_coffee_house_espionage_decision.b: "Треба приструнчити кав’ярні."
  tur_coffee_house_espionage_decision.c: "Кава має литися вільно."
  coffee_house_espionage_available.tt: "Відкриває доступ до [Concept('government_reform', 'державної реформи')|e] «[ShowGovernmentReformName('ottoman_coffee_house_espionage')]»."
  tur_coffee_house_espionage_decision.historical_info: "Кав’ярні в Османській імперії слугували місцем зустрічі для людей найрізноманітніших занять, народностей та віросповідань. Османські ремісники могли сидіти за одним столом із російськими волоцюгами та венеційськими купцями. Там точилися бесіди, обговорювалося мистецтво, нові ідеї — і повстання. Яничарські кав’ярні підтримували діяльність таємних мереж убивць і збирачів відомостей. Влада активно засилала до кав’ярень та інших подібних громадських закладів своїх шпигунів, щоби знати про народні настрої та вчасно довідуватися, якщо десь готується злочин чи бунт."
  tur_new_order_army_decision.title: "Армія нового порядку"
  tur_new_order_army_decision.desc: "Розмірковуючи про силу наших ворогів, небезпеки мінливого світу та загрозу бунту з боку непокірних і зухвалих яничарів, [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'вигадала', 'вигадав')] новий план. [Select_CString(target_ruler.IsFemale, 'Вона вирішила', 'Він вирішив')] залучити інструкторів із #TOOLTIP:CONTINENT,europe,X #L Європи#!#!, щоби реформувати військо, перетворивши його на грізну та сучасну силу з новим одностроєм, вишколом та звичаями. Але цей крок може викликати гнів яничарів, башибузуків, секбанів та всіх інших, кому вигідне поточне становище справ."
  tur_new_order_army_decision.desc.entry: "Перешкода для створення сучасного війська — не гроші й не чужоземні наставники, а те військо, що ми вже маємо. Створити дисципліноване військо поруч із $janissaries_advance$ означає озброїти тих самих людей, яким одного разу накажуть розпустити їх самих, а $bashi_bazouks$ та $sekban_system$ здатні розгадати цей намір не гірше за нас."
  tur_new_order_army_decision.a: "Нам потрібні ці зміни."
  tur_new_order_army_decision.b: "Старі звичаї цілком дієві."
  new_order_army_available.tt: "Відкриває доступ до [Concept('government_reform', 'державної реформи')|e] «[ShowGovernmentReformName('ottoman_new_order_army')]»."
  tur_new_order_army: "Доступна державна реформа «[ShowGovernmentReformNameWithNoTooltip('ottoman_new_order_army')]»"
  tur_new_order_army_decision.historical_info: "Нізам-і Джедід, #italic Армія нового порядку#!, була заснована у 1797 році й стала ключовим елементом програми реформ Селіма III. Султан сподівався повернути назад процес децентралізації імперії та послабити міцний вплив яничарів, поступово замінюючи їх сучасною піхотою за європейським зразком."
  mehmed_agha_tt: "Здібний [character|e] приєднається до нашого двору та отримає [ShowModifier('kizlar_agha_modifier')] [modifier|e]"