l_russian:
  fra_taille_tax_decision.title: "Запровадження постійного податку"
  fra_taille_tax_decision.desc: "В результаті ретельної праці [ruler_fra.GetName|l] усе ж [Select_CString(ruler_fra.IsFemale,'завершила', 'завершив')] перетворення фінансового устрою #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Протягом багатьох років королівська влада лише зрідка, у найкритичніших випадках збирала #TOOLTIP:POLICY,exceptional_only,X #L надзвичайний податок#!#!. Тепер же [ruler_fra.GetShortNameWithNoTooltip|l] планує запровадити постійний податок. Щоби уникнути обурення серед впливових верств, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] та [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] будуть звільнені від сплати податку, проте [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] і [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] навряд чи зрадіють таким змінам."
  fra_taille_tax_decision.desc.entry: "Податок, що запроваджується лише на час війни, доводиться наново випрошувати перед кожним новим походом. Якщо зробити його постійним, потреба в цих проханнях відпаде, а знать і духовенство навряд чи заперечуватимуть, якщо основний тягар ляже на містян та простолюд."
  fra_taille_tax_decision.a: "Ухвалимо закони."
  fra_taille_tax_decision.b: "Старий устрій був надійнішим…"
  enables_taille_laws: "У #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! з’явиться доступ до закону #TOOLTIP:LAW,fra_taille,X #L «Талья»#!#!."
  fra_taille_tax_decision.historical_info: "Під час правління Карла VII фінансовий устрій Франції зазнав змін, серед яких було надання тальї статусу постійного податку. Попри те що знать і духовенство були звільнені від сплати тальї, надходження до скарбниці значно зросли та забезпечили розвиток країни після закінчення Столітньої війни."
  fra_5_percent_tax_decision.title: "[target_character.GetLastNameWithNoTooltip] пропонує п’ятивідсотковий податок"
  fra_5_percent_tax_decision.title.entry: "П’ятивідсотковий податок $de_machault$"
  fra_5_percent_tax_decision.desc: "[ROOT.GetCountry.GetLongName] — запровадження тут #TOOLTIP:LAW,fra_taille,X #L тальї#!#! замінило застарілий феодальний податковий устрій. Однак із часом привілеї, якими в межах тальї користувалися [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] та [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], стали надто згубно впливати на обсяг зібраних податків.\n\nДля розв’язання цієї проблеми радник на ім’я [target_character.GetName] запропонував стягувати #italic 5% від загального прибутку#! з усіх станів без винятку. Попри очевидну користь такого устрою для державної скарбниці, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] та [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] виступили рішуче проти цієї ініціативи."
  fra_5_percent_tax_decision.desc.entry: "Пільги, даровані за заслуги столітньої давнини, і досі щорічно обходяться скарбниці в чималу суму. $name_john.french_language$ $name_baptiste$ $de_machault$ пропонує запровадити єдиний податок на прибуток із землі для всіх її власників. Сума невелика, але сама думка для багатьох абсолютно неприйнятна — духовенство та знать уже висловили своє рішуче невдоволення."
  fra_5_percent_tax_decision.a: "Проведемо реформу попри протести."
  fra_5_percent_tax_decision_tt: "$name_john.french_language$ $name_baptiste$ $de_machault$ приєднається до нашого [Concept('court', 'двору')|e]"
  fra_5_percent_tax_decision.b: "Краще не гнівити їх."
  unlocks_machault_tax_reforms: "У #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! з’явиться доступ до закону #TOOLTIP:LAW,fra_5_percent_tax,X #L «П’ятивідсотковий податок Машо»#!#!, що розширює дію #TOOLTIP:LAW,fra_taille,X #L тальї#!#!"
  fra_5_percent_tax_decision.historical_info: "Ставши в 1745 році генеральним контролером фінансів Франції, Жан-Батіст де Машо з жахом виявив, що країна опинилася на межі банкрутства. Становище погіршувалося тим, що знать і духовенство були повністю звільнені від сплати тальї. У 1749 році Машо спробував провести реформу податкового устрою, яка передбачала заміну 10%-го податку, від якого були звільнені знать і духовенство, єдиним для всіх станів податком у розмірі 5% від загального прибутку. Втім, ця ініціатива наразилася на запеклий опір, тож Машо так і не зміг утілити її в життя повною мірою."
  fra_fouage_tax_decision.title: "Подимна подать"
  fra_fouage_tax_decision.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] [scope_ruler.GetName] живе в розкошах і витрачає величезні кошти на подорожі по #ONCLICK:COUNTRY,[GetCountry('FRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('FRA').GetKey],X [GetCountry('FRA').Custom('CL_DAT')|L]#!#! та утримання [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого палацу в місті [ROOT.GetCountry.GetCapital.GetName], що призвело до спустошення скарбниці. Щоби хоч якось поповнити скарбницю, радники запропонували запровадити #italic подимну подать#! — новий податок, який стягується з [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]их господарств за користування печами. Звісно, [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] буд[ROOT.GetCountry.Custom('peasants_eut')] не в захопленні, однак ця подать допоможе наповнити [ROOT.GetCountry.GetGovernment.GetAdjective|l]у скарбницю, не утискаючи [Select_CString(scope_ruler.IsFemale, 'нашу королеву', 'нашого короля')]. [scope_ruler.GetShortNameWithNoTooltip] і далі вестиме звичний спосіб життя."
  fra_fouage_tax_decision.desc.entry: "Палаци, пишні процесії та постійні роз’їзди королівського двору не оплачуються з кишені самого монарха. Подимний податок торкнувся б кожного дому у Франції та швидко наповнив би скарбницю. Саме тому рада виявляє до нього таку прихильність — на відміну від самих мешканців цих домівок."
  fra_fouage_tax_decision.a: "Запровадимо податок. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] — наше головне надбання."
  fra_fouage_tax_decision.a.entry: "Запровадьмо податок. Правителі — наше головне надбання."
  fra_fouage_tax_decision.b: "Поки що відкладемо запровадження податку."
  fra_fouage_tax_decision.c: "[scope_ruler.GetShortNameWithNoTooltip] [Select_CString(scope_ruler.IsFemale, 'має', 'має')] знати міру. Скарбниця — не [Select_CString(scope_ruler.IsFemale, 'її', 'його')] гаманець."
  fra_fouage_tax_decision.c.entry: "Правитель має знати міру. Скарбниця — не його гаманець."
  variable_tt_enabled_fouage_tax: "Запроваджено подимну подать"
  fra_fouage_tax_decision.historical_info: "Спочатку подимну подать запровадили лише в окремих регіонах для покриття витрат [GetCountry('FRA').GetAdjectiveWithNoTooltip|l]ого двору, а також для подолання наслідків Столітньої війни та чорного мору. Згодом її почали збирати й в інших областях, а наприкінці XIV століття її було запроваджено майже на всій території Франції. Цей податок став одним із головних способів наповнення державної скарбниці за правління низки королів."
  fra_edict_of_toleration_decision.title: "Едикт Фонтенбло"
  fra_edict_of_toleration_decision.desc: "Поширення ідей Реформації сколихнуло всю #TOOLTIP:CONTINENT,europe,X #L Європу#!#!, через що багато хто відвернувся від учення #TOOLTIP:RELIGION,$catholic_tt$,X #L католицької#!#! церкви та навернувся до #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранства#!#!. Хоча більша частина населення #ONCLICK:COUNTRY,[GetCountry('FRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('FRA').GetKey],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#! досі тримається католицької віри, чисельність лютеран невпинно зростає.\n\nУряд, занепокоєний таким перебігом подій, просить, щоб [ruler_fra.GetName|l] [Select_CString(ruler_fra.IsFemale, 'видала', 'видав')] #TOOLTIP:POLICY,edict_of_fontainebleau,X #L едикт Фонтенбло#!#!, спрямований на обмеження прав лютеран та інших протестантів. Це дасть змогу покласти край поширенню хибних учень й уникнути розбрату в суспільстві."
  fra_edict_of_toleration_decision.desc.entry: "Віру, що знайшла відгук серед купців і друкарів, викорінити значно важче, ніж просту селянську єресь. Громад #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеран#!#! поки небагато, і нашому двору належить вирішити: знищити їх просто зараз, видавши [ShowPolicyName('edict_of_fontainebleau')], чи навчитися жити з ними пліч-о-пліч."
  fra_edict_of_toleration_decision.a: "Ми мусимо вжити заходів для боротьби з єрессю."
  fra_edict_of_toleration_decision.b: "До них варто ставитися терпиміше."
  fra_colonial_ambitions_decision.title: "Повернення колоніальних задумів"
  fra_colonial_ambitions_decision.desc: "Після десятиліть внутрішньої нестабільности [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] пропонує знову спробувати щастя в Новому Світі. У минулому виправи допомогли нам багато чого довідатися про ті привабливі землі, проте з початком Реформації та чвар через віру влада #ONCLICK:COUNTRY,[GetCountry('FRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('FRA').GetKey],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#! була змушена забути про свої колоніальні наміри. Варто також зважати, що якщо ми знову спробуємо закріпитися на американському континенті, це може викликати невдоволення інших #TOOLTIP:CONTINENT,europe,X #L європейських#!#! країн, які вже давним-давно заснували там свої поселення.\n\nДехто з членів уряду взагалі пропонує відкинути задуми про Новий Світ, а натомість заснувати торгову компанію в #TOOLTIP:CONTINENT,asia,X #L Азії#!#!, що дозволить узяти під контроль індійські торгові шляхи."
  fra_colonial_ambitions_decision.desc.entry: "Шлях на захід нам давно відомий, бракувало лише спокійної пори вдома, щоб нарешті скористатися цими знаннями. Поки ми зволікали, суперники міцно закріпилися на нових землях. Будь-яка наша колонія тепер неминуче опиниться на чужій землі — хіба що ми звернемо погляд на багатства #TOOLTIP:CONTINENT,asia,X #L Азії#!#!."
  fra_colonial_ambitions_decision.a: "Час спрямувати зусилля на освоєння Нового Світу."
  fra_colonial_ambitions_decision.b: "Ми мусимо встановити свою монополію на торгівлю в Індії."
  fra_centralize_monarchy_decision.title: "Консолідація апанажів"
  fra_centralize_monarchy_decision.desc: "По сотнях років політичної роздроблености корона нарешті повернула різні апанажі до своїх володінь. Хоча молодші гілки династії Капетингів виявили себе надійними союзниками, вони також перешкоджали централізації країни. Повернувши їхні землі під свій контроль, [ROOT.GetCountry.GetGovernment.GetRuler.GetName|l] та його уряд зможуть перетворити #ONCLICK:COUNTRY,[GetCountry('FRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('FRA').GetKey],X [GetCountry('FRA').Custom('CL_ACC')|L]#!#! на сучаснішу країну."
  fra_centralize_monarchy_decision.desc.entry: "Століттями апанажами правили королівські родичі, що було зручно, але робило будь-які реформи неможливими. Тепер ці землі підпорядковані безпосередньо короні, і володіннями, підвладними єдиній волі, нарешті можна правити як єдиною країною."
  fra_centralize_monarchy_decision.a: "Це важливий крок до осучаснення країни."
  fra_code_louis_decision.title: "Скласти проєкт Кодексу Людовика"
  fra_code_louis_decision.desc: "Уже багато століть у нашій країні пліч-о-пліч існують два устрої: у північних провінціях діє звичаєве право, тоді як на півдні застосовується римське право. Прагнучи створити єдиний для всієї країни правовий устрій, [fra_ruler.GetName|l] та [Select_CString(fra_ruler.IsFemale,'її', 'його')] найближчі радники уклали #italic «Кодекс Людовіка»#! — першу збірку законів, яка діятиме на всій території #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!.\n\nПопри безсумнівні переваги єдиного зводу законів, радники просять не квапитися з його впровадженням. Вони застерігають, що деяким південним провінціям може знадобитися час, аби призвичаїтися до нового ладу."
  fra_code_louis_decision.desc.entry: "Переїжджаючи з провінції до провінції, купець змінює не лише коней, а й правові норми. Єдине зведення законів для всієї Франції поклало б цьому край, однак південні провінції тримаються за римське право ще з тих часів, коли й самого нашого королівства не існувало, і навряд чи охоче з ним розлучаться."
  fra_code_louis_decision.a: "Уся країна має підкорятися одним законам, без жодного винятку."
  fra_code_louis_decision.a.entry: "Усі ми маємо підкорятися єдиним законам, без винятку."
  fra_code_louis_decision.b: "Поки що краще обмежити дію кодексу північними провінціями."
  fra_code_louis_decision.b.entry: "Поки що ліпше обмежимо дію кодексу північними провінціями."
  fra_versailles_residence_decision.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] та Версаль"
  fra_versailles_residence_decision.title.entry: "$nobles_estate$ і Версаль"
  fra_versailles_residence_decision.desc: "Версальський палац слугує не лише осідком [ROOT.GetCountry.GetGovernment.GetAdjective|l]ої родини, а й місцем для прийому найповажніших і найшанованіших гостей. Від початку палац зводився як символ могутності й божественного права [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]их королів, але відтоді він став ще й своєрідним політичним засобом, оскільки в цьому палаці дозволено перебувати лише тим, хто має ласку монарха.\n\nЗ огляду на це радники просять, щоби [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [fra_ruler.GetName|l] [Select_CString(fra_ruler.IsFemale,'запросила', 'запросив')] до палацу представників найвпливовіших знатних родин. Це дозволить нам заручитися їхньою підтримкою та зосередити владу навколо корони."
  fra_versailles_residence_decision.desc.entry: "Розкішний палац, повний гостей, водночас сповнений заручників. Шляхетні родини, які досі тримаються за давні феодальні звичаї, можна з усіма почестями запросити до Версаля та вмовити залишитися. І з кожним роком, проведеним при дворі, вони становитимуть дедалі меншу загрозу для правителів."
  fra_versailles_residence_decision.a: "Запросимо знатні родини до Версальського палацу."
  fra_versailles_residence_decision.b: "Палац належить [ROOT.GetCountry.GetGovernment.GetAdjective|l]ій родині, стороннім у ньому не місце."
  fra_versailles_residence_decision.b.entry: "Цей палац зводився задля королівської родини — нехай і залишається королівським."
  this_may_lead_to_permanent_weakening_of_the_nobility: "Якщо дозволити їм жити у Версалі, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] мож[ROOT.GetCountry.Custom('nobles_eut')] назавжди втратити частку свого впливу."
  fra_versailles_permanent_decision.title: "Постійний осідок для стану «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]»"
  fra_versailles_permanent_decision.title.entry: "Постійний осідок для знаті"
  fra_versailles_permanent_decision.desc: "Отримавши наше запрошення, численн[ROOT.GetCountry.Custom('nobles_yiaei')] впливов[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] охоче переїха[ROOT.GetCountry.Custom('nobles_vlaloly')] зі своїх маєтків до Версаля. Беручи участь у пишних [ROOT.GetCountry.GetGovernment.GetAdjective|l]их балах і церемоніях, вони перебувають ніби в нестямі від краси й багатого оздоблення палацу, і тому ладні виконати будь-яке доручення, аби лиш [fra_ruler.GetName|l] [Select_CString(fra_ruler.IsFemale,'була до них прихильною', 'був до них прихильним')]. Можна вважати, що наш задум цілком вдався!\n\nЗ колись непотрібних покоїв Версаль перетворився на надзвичайно дієвий важіль впливу, який просто-таки змушує знатних осіб розлучатися зі своєю владою. Тепер ні в кого не може бути сумнівів: [fra_ruler.GetShortNameWithNoTooltip|l] — [Select_CString(fra_ruler.IsFemale,'беззаперечна й повновладна', 'беззаперечний і повновладний')] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] нашої країни."
  fra_versailles_permanent_decision.desc.entry: "Пастка зачинилася значно м’якше, ніж будь-хто очікував. $nobles_estate$ тепер змагаються за покої та першість у нашому палаці, а не за владу у власних землях. Правитель же, позбувшись суперників, здобуває воістину беззаперечний авторитет."
  fra_versailles_permanent_decision.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] проковтну[ROOT.GetCountry.Custom('nobles_vlaloly')] нашу розкішну наживку!"
  fra_versailles_permanent_decision.a.entry: "Пишнота Версаля назавжди затьмарила блиск знаті."
  fra_versailles_permanent_decision.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] досі заслугову[ROOT.GetCountry.Custom('nobles_yeyut')] на повагу."
  fra_versailles_permanent_decision.b_tt: "Ми зможемо обрати постійний осідок у Версалі іншим разом"
  fra_versailles_permanent_decision.b.entry: "Вплив, який споконвіку має знать, як і раніше заслуговує на повагу."
  fra_marcel_great_ordinance_decision.title: "Великий ордонанс"
  fra_marcel_great_ordinance_decision.desc: "Війна проти #ONCLICK:COUNTRY,[GetCountry('ENG').GetKey] #TOOLTIP:COUNTRY,[GetCountry('ENG').GetKey],X [GetCountry('ENG').Custom('CL_GEN')|L]#!#! вимагає значних видатків, через що [ROOT.GetCountry.GetGovernment.GetRuler.GetName|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'звернулася', 'звернувся')] до Генеральних штатів із проханням надати гроші та новобранців. Проте представники третього стану від самого початку не схвалювали ані саму думку про війну проти [GetCountry('ENG').Custom('CL_GEN')], ані фінансові заходи, спрямовані на забезпечення війська. Одним із ватажків цього спротиву став впливовий прево [SCOPE.sCharacter('etienne_marcel').GetName], який мав повагу містян. Він згоден підтримати країну, але натомість вимагає, щоби [ROOT.GetCountry.GetGovernment.GetRuler.GetShortNameWithNoTooltip|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'ухвалила', 'ухвалив')] Великий ордонанс, який передбачає обмеження королівської влади та розширення повноважень Генеральних штатів."
  fra_marcel_great_ordinance_decision.desc.entry: "Дебати в Генеральних штатах щодо оплати поточних воєн зайшли в глухий кут. Третій стан на чолі з впливовими купцями запропонував ухвалити «Великий ордонанс»: в обмін на свою підтримку вони вимагають розширення власних прав і привілеїв. Ми можемо пристати на їхні умови або знайти інші способи отримати кошти від Штатів."
  fra_marcel_great_ordinance_decision.a: "Важкі часи вимагають відчайдушних дій."
  fra_marcel_great_ordinance_decision.b: "Це неприпустимо!"
  fra_marcel_great_ordinance_decision.c: "Спробуймо домовитися з Марселем."
  fra_marcel_great_ordinance_decision_cooldown: "Нещодавня відмова від співпраці з Марселем"
  fra_marcel_great_ordinance_decision.historical_info: "Після поразки французів у битві при Пуатьє і полону короля Жана II кермо влади тимчасово перейшло до дофіна Карла, який прибрав титул регента. На тлі фінансових труднощів він був змушений скликати Генеральні штати, щоб попросити в них підтримки. Представник третього стану Етьєн Марсель виступив різко проти, а також висунув Карлу низку вимог, з-поміж яких було підписання Великого ордонансу та звільнення Карла Злого, спільника Марселя. Регент неохоче схвалив розроблений Марселем документ, однак 1357 року Жан II, досі перебуваючи в полоні, заблокував його впровадження. Це призвело до повстання, внаслідок якого опозицію було розгромлено, Етьєна Марселя вбито, а Великий ордонанс остаточно скасовано."
  fra_marcel_compromise_decision.title: "Великий ордонанс"
  fra_marcel_compromise_decision.desc: "Війна проти #ONCLICK:COUNTRY,[GetCountry('ENG').GetKey] #TOOLTIP:COUNTRY,[GetCountry('ENG').GetKey],X [GetCountry('ENG').Custom('CL_GEN')|L]#!#! вимагає значних видатків, через що [ROOT.GetCountry.GetGovernment.GetRuler.GetName|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'звернулася', 'звернувся')] до Генеральних штатів із проханням надати гроші та новобранців. Проте представники третього стану від самого початку не схвалювали ані саму думку про війну проти [GetCountry('ENG').Custom('CL_GEN')], ані фінансові заходи, спрямовані на забезпечення війська. Одним із ватажків цього спротиву став впливовий прево [SCOPE.sCharacter('etienne_marcel').GetName], який мав повагу містян. Він згоден підтримати країну, але натомість вимагає, щоби [ROOT.GetCountry.GetGovernment.GetRuler.GetShortNameWithNoTooltip|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'ухвалила', 'ухвалив')] Великий ордонанс, який передбачає обмеження королівської влади та розширення повноважень Генеральних штатів."
  fra_marcel_compromise_decision.desc.entry: "Ми відмовилися виконувати вимоги Великого ордонансу, проте війни тривають, а Генеральні штати все так само готові скористатися становищем. Якщо ми підемо з ними на перемовини, можливо, нам вдасться знайти компроміс."
  fra_marcel_compromise_decision.a: "Спробуймо домовитися з Марселем."
  fra_marcel_compromise_decision.a.tt: "Марсель більше не протистоятиме нам"
  fra_marcel_compromise_decision.historical_info: "$fra_marcel_great_ordinance_decision.historical_info$"
  fra_formalized_relations_decision.title: "Політика щодо Італії"
  fra_formalized_relations_decision.desc: "Війна проти #ONCLICK:COUNTRY,[GetCountry('ENG').GetKey] #TOOLTIP:COUNTRY,[GetCountry('ENG').GetKey],X [GetCountry('ENG').Custom('CL_GEN')|L]#!#! закінчилася, і тепер настав час приділити увагу нашим південним кордонам уздовж Альпійських гір. У минулому ми підтримували відносини з кількома #TOOLTIP:REGION,italy_region,X #L італійськими#!#! династіями та країнами, проте через війну наші можливості для співпраці були обмежені. Тепер же радники пропонують поширити наш вплив у цьому регіоні, аби здобути цінних союзників в особі місцевих правителів. Утім, дехто вважає, що ми маємо діяти рішучіше й змусити своїх італійських сусідів приєднатися до [GetCountry('FRA').Custom('CL_DAT')], хочуть вони того чи ні."
  fra_formalized_relations_decision.desc.entry: "Останніми роками альпійські перевали дедалі менше схожі на неприступний кордон і все більше — на чудову нагоду. #TOOLTIP:CULTUREGROUP,italian_group,X #L Італійські#!#! країни багаті, роздроблені й готові стати або нашими союзниками, або підданими — дивлячись, до чиєї поради ми дослухаємося."
  fra_formalized_relations_decision.a: "Спробуймо налагодити зносини з найвпливовішими сусідами."
  fra_formalized_relations_decision.b: "Поки що краще зберігати нейтралітет."
  fra_formalized_relations_decision.c: "Під нашою владою їм буде краще."