l_russian:
  ara_coronate_ruler.title: "$flavor_ara.22.entry$"
  ara_coronate_ruler.title.entry: "$flavor_ara.22.entry$"
  ara_coronate_ruler.desc: "[target_character.GetName] [Select_CString(target_character.IsFemale, 'зійшла', 'зійшов')] на престол; [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] та [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] зібралися у величній Сарагосі, щоб поглянути на [Select_CString(target_character.IsFemale, 'її', 'його')] коронацію. Тут [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] складе присягу берегти закони [ROOT.GetCountry.Custom('rank_ua_GEN')|l], вольності народу та станові привілеї."
  ara_coronate_ruler.desc.entry: "Новий правитель не зможе по-справжньому заручитися вірністю #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#! та #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L простолюду#!#! без належного обряду коронації. Некоронованого монарха ніхто не визнає правочинним правителем."
  ara_coronate_ruler.a: "$flavor_ara.23.a$"
  ara_coronate_ruler.b: "Час позбутися цього звичаю."