  ara_coronate_ruler.title: "$flavor_ara.22.entry$"
  ara_coronate_ruler.title.entry: "$flavor_ara.22.entry$"
  ara_coronate_ruler.desc: "[target_character.GetName] зійшов на престол, і [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], і [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] зібралися, аби засвідчити коронацію у славетному місці — [ShowLocationName('zaragoza')], де [ROOT.GetCountry.GetGovernment.GetRulerTitle] складе присягу берегти закони [ROOT.GetCountry.GetFlavorRank], вольності народу та привілеї станів."
  ara_coronate_ruler.desc.entry: "Новий володар, що сходить на престол, не зможе належним чином здобути вірність [ShowEstateTypeName('nobles_estate')] та [ShowEstateTypeName('peasants_estate')], якщо не буде проведено належного вінчання на царство. Некоронований монарх — невизнаний монарх."
  ara_coronate_ruler.a: "$flavor_ara.23.a$"
  ara_coronate_ruler.b: "Час позбутися цього звичаю."