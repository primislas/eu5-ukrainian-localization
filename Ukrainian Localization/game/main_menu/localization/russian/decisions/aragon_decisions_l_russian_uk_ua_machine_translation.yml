l_russian:
  aragon_develop_sitges.title: "Інвестиції в Сітжес"
  aragon_develop_sitges.desc: "Сітжес довгий час залишався тихим рибальським портом на каталонському узбережжі. За підтримки Арагону міську гавань та торгівлю сіллю можна розвинути, перетворивши місто на значно потужніший форпост у Середземномор'ї."
  aragon_develop_sitges.a: "Профінансувати розвиток (+1 до розвитку в Сітжесі)"
  aragon_develop_sitges.b: "Не зараз"
  ara_coronate_ruler.title: "$flavor_ara.22.entry$"
  ara_coronate_ruler.title.entry: "$flavor_ara.22.entry$"
  ara_coronate_ruler.desc: "[target_character.GetName] зійшов на престол, і [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], і [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] зібралися, аби засвідчити коронацію у славетному місці — [ShowLocationName('zaragoza')], де [ROOT.GetCountry.GetGovernment.GetRulerTitle] складе присягу берегти закони [ROOT.GetCountry.GetFlavorRank], вольності народу та привілеї станів."
  ara_coronate_ruler.desc.entry: "Новий володар, що сходить на престол, не зможе належним чином здобути вірність [ShowEstateTypeName('nobles_estate')] та [ShowEstateTypeName('peasants_estate')], якщо не буде проведено належного вінчання на царство. Некоронований монарх — невизнаний монарх."
  ara_coronate_ruler.a: "$flavor_ara.23.a$"
  ara_unite_barcelona_dynasty.title: "Об'єднання дому"
  ara_unite_barcelona_dynasty.desc: "Відтоді як [ShowCultureName('sicilian')]а вечірня забезпечила престол для нашого дому, наш вплив у регіоні [ShowRegionName('italy_region')] значно зріс. Попри це, область [ShowAreaName('sicily_area')] все ще зберігає свій суверенітет, тримаючись осторонь від нашої династичної політики. Замість того щоб упустити цю можливість, ми могли б зв'язатися з нашими тамтешніми родичами, щоб укласти міцнішу династичну унію і, можливо, дати поштовх нашим амбіціям у регіоні [ShowRegionNameWithNoTooltip('italy_region')]."
  ara_unite_barcelona_dynasty.a: "Спробуймо об'єднати обидві корони."
  ara_unite_barcelona_dynasty.b: "Вони служитимуть нам як піддані."
  ara_unite_barcelona_dynasty.c: "Ще не час"
  ara_effects_only_take_place_if_sic_accepts_tt: "Ефекти подіють лише в тому разі, якщо [GetCountry('SIC').GetName] погодиться"
  ara_vassalize_bosnia.title: "Вимога васалітету від [GetCountry('BOS').GetNameWithNoTooltip]"
  ara_vassalize_bosnia.desc: "Великий правитель [GetCountry('BOS').GetName] уже довгий час вимушений виборювати суверенітет своєї країни в протистоянні з жадібними до влади сусідами. Не в змозі захистити себе самотужки, кілька представників від [GetCountry('BOS').GetGovernment.GetEstateName('nobles_estate')] звернулися до нашого правителя та двору з проханням захистити їх від будь-якого вторгнення. Вони воліли б стати нашими підданими, аніж потрапити до рук іновірців, і ми можемо використати це на свою користь."
  ara_vassalize_bosnia.a: "Час висунути вимогу про їхнє підкорення."
  ara_vassalize_bosnia.b: "Ще не час."
  ara_ask_bosnia_for_vassalization: "Ми вимагатимемо покори від [GetCountry('BOS').GetName]"
  ara_coronate_ruler.b: "Час зректися цього звичаю."