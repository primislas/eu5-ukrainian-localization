l_russian:
  prospect_for_coal.title: "Розвідка вугілля"
  prospect_for_coal.desc: "Доба пари та заліза тримається на вугіллі, і наша власна земля, можливо, досі таїть у собі те, чого так палко жадає наша промисловість. Витратимо політичний вплив на те, щоб відрядити до наших вугленосних земель загони геологів та гірничих інженерів — дослідити ґрунт, закласти пробні копальні вздовж перспективних пластів і розпочати новий видобуток там, де земля дасть найбагатший пожиток. Дослідники розпочнуть із найменш продуктивних наших сільських угідь, де втрата буде невеликою, якщо віддати поля під вугільні копальні, а нова розробка розпочнеться скромно, перш ніж розростися й живити наші домни."
  prospect_for_coal.a: "Замовити розвідку."
  prospect_for_coal_effect_tt: "[coal_prospect_location.GetName] тепер вироблятиме [ShowGoodsName('coal')] замість [coal_prospect_location.GetRawMaterial.GetName]"
  prospect_for_coal.historical_info: "Великі вугільні басейни Руру, Верхньої Сілезії та Південного Уельсу дали енергію промисловій революції, а систематичний пошук вугілля перетворив тихі сільські округи на одні з найгустіших промислових регіонів на землі. Геологічна розвідка сформувалася в окрему фахову дисципліну наприкінці вісімнадцятого — на початку дев’ятнадцятого століття, коли країни та підприємці наввипередки шукали паливо, від якого залежала нова доба машин."