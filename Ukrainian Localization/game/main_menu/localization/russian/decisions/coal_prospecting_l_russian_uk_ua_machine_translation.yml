l_russian:
  prospect_for_coal.title: "Розпочати пошуки вугілля"
  prospect_for_coal.desc: "Доба пари та заліза будується на вугіллі, і в нашій землі досі можуть критися поклади, яких так відчайдушно прагне промисловість. Час скористатися нашим політичним впливом: відрядімо геологів та гірничих інженерів обстежити вугільні терени, дослідити перспективні пласти, закласти розвідувальні копальні й розпочати нову розробку там, де надра обіцяють найщедріший видобуток. Почати пошуки можна з найменш родючих сільських земель, де передача полів під вугільні розробки завдасть найменше шкоди. Спершу нова копальня буде невеликою, але з часом обсяги видобутку в ній зростатимуть."
  prospect_for_coal.a: "Виділити кошти на розвідку."
  prospect_for_coal_effect_tt: "У #L #TOOLTIP:LOCATIONRANK,[coal_prospect_location.Custom('LR_tt')],X [coal_prospect_location.Custom('LR_PREP')|l]#!#! [coal_prospect_location.GetName] тепер виробляється [ShowGoodsName('coal')|l], а не [coal_prospect_location.GetRawMaterial.GetName|l]"
  prospect_for_coal.historical_info: "Найбільші вугільні басейни Руру, Верхньої Сілезії та Південного Уельсу стали основою промислової революції. Систематичні пошуки вугілля перетворили тихі сільські землі на одні з найгустонаселеніших промислових країв світу. Наприкінці XVIII — на початку XIX століття геологічна розвідка поступово перетворилася на окрему фахову царину: держави та підприємці наввипередки шукали паливо, від якого залежала нова доба машин."