l_russian:
  build_suez_canal.title: "Спорудити Суецький канал"
  build_suez_canal.desc: "Наші інженери доповідають, що прокладання каналу через Суецький перешийок нам цілком під силу. Задум буде колосальним, але й нагорода — панування над усією східною торгівлею — не менша."
  build_suez_canal.a: "Розпочати спорудження каналу."
  build_suez_canal.b: "Не на часі."
  build_panama_canal.title: "Спорудити Панамський канал"
  build_panama_canal.desc: "Наші інженери обстежили вузький перешийок Нового Світу. Канал, що сполучає два великі океани, цілком здійсненний. Витрати будуть величезними, а вигода — незліченною."
  build_panama_canal.a: "Розпочати спорудження каналу."
  build_panama_canal.b: "Не на часі."