l_russian:
  build_suez_canal.title: "Спорудити Суецький канал"
  build_suez_canal.desc: "Наші інженери доповідають, що за нинішнього рівня поступу ми вже можемо прорити канал через Суецький перешийок. Цей задум буде величним і вимагатиме величезних витрат, однак у нагороду ми здобудемо контроль над усією торгівлею Сходу."
  build_suez_canal.a: "Розпочати будівництво каналу."
  build_suez_canal.b: "Не на часі."
  build_panama_canal.title: "Спорудити Панамський канал"
  build_panama_canal.desc: "Наші інженери дослідили вузький перешийок у Новому Світі й дійшли висновку, що два великі океани можливо з’єднати каналом. Витрати будуть колосальними, але вигода від цього буде просто незмірною."
  build_panama_canal.a: "Розпочати спорудження каналу."
  build_panama_canal.b: "Не на часі."
  close_suez_canal_to_enemies.title: "Закрити Суецький канал для всіх, крім союзників"
  close_suez_canal_to_enemies.desc: "Обмежити прохід Суецьким каналом лише для наших союзників і васалів на час війни. Ворогам прохід заборонено автоматично; це рішення додатково виключає нейтральні країни та суперників."
  close_suez_canal_to_enemies.a: "Заборонити прохід усім, крім наших союзників."
  close_suez_canal_to_enemies.b: "Не на часі."
  open_suez_canal_to_all.title: "Відкрити Суецький канал для всіх"
  open_suez_canal_to_all.desc: "Зняти обмеження на прохід Суецьким каналом і знову дозволити рух будь-якій країні, з якою ми не перебуваємо у стані війни."
  open_suez_canal_to_all.a: "Зняти обмеження."
  open_suez_canal_to_all.b: "Не зараз."
  close_panama_canal_to_enemies.title: "Закрити Панамський канал для всіх, крім союзників"
  close_panama_canal_to_enemies.desc: "Обмежити прохід Панамським каналом лише для наших союзників і васалів на час війни. Ворогам прохід заборонено автоматично; це рішення додатково виключає нейтральні країни та суперників."
  close_panama_canal_to_enemies.a: "Заборонити прохід усім, крім наших союзників."
  close_panama_canal_to_enemies.b: "Не на часі."
  open_panama_canal_to_all.title: "Відкрити Панамський канал для всіх"
  open_panama_canal_to_all.desc: "Зняти обмеження на прохід Панамським каналом і знову дозволити рух будь-якій країні, з якою ми не перебуваємо у стані війни."
  open_panama_canal_to_all.a: "Зняти обмеження."
  open_panama_canal_to_all.b: "Не на часі."