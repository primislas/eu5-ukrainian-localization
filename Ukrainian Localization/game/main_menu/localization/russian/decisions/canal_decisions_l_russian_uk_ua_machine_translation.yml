l_russian:
  build_suez_canal.title: "Спорудити Суецький канал"
  build_suez_canal.desc: "Наші інженери доповідають, що за нинішнього рівня поступу ми вже можемо прорити канал через Суецький перешийок. Цей задум буде величним і вимагатиме величезних витрат, однак у нагороду ми здобудемо контроль над усією торгівлею Сходу."
  build_suez_canal.a: "Розпочати будівництво каналу."
  build_suez_canal.b: "Не на часі."
  build_panama_canal.title: "Спорудити Панамський канал"
  build_panama_canal.desc: "Наші інженери дослідили вузький перешийок у Новому Світі й дійшли висновку, що два великі океани можливо з’єднати каналом. Витрати будуть колосальними, але вигода від цього буде просто незмірною."
  build_panama_canal.a: "Розпочати спорудження каналу."
  build_panama_canal.b: "Не на часі."
  close_suez_canal_to_enemies.title: "Close the Suez Canal to Non-Allies"
  close_suez_canal_to_enemies.desc: "Restrict passage through the Suez Canal to our allies and subjects for the duration of the war. Enemies are barred automatically; this further excludes neutrals and rivals."
  close_suez_canal_to_enemies.a: "Bar passage to all but our allies."
  close_suez_canal_to_enemies.b: "Not at this time."
  open_suez_canal_to_all.title: "Open the Suez Canal to All"
  open_suez_canal_to_all.desc: "Lift the restrictions on the Suez Canal and re-open passage to any country we are not actively at war with."
  open_suez_canal_to_all.a: "Lift the restrictions."
  open_suez_canal_to_all.b: "Not at this time."
  close_panama_canal_to_enemies.title: "Close the Panama Canal to Non-Allies"
  close_panama_canal_to_enemies.desc: "Restrict passage through the Panama Canal to our allies and subjects for the duration of the war. Enemies are barred automatically; this further excludes neutrals and rivals."
  close_panama_canal_to_enemies.a: "Bar passage to all but our allies."
  close_panama_canal_to_enemies.b: "Not at this time."
  open_panama_canal_to_all.title: "Open the Panama Canal to All"
  open_panama_canal_to_all.desc: "Lift the restrictions on the Panama Canal and re-open passage to any country we are not actively at war with."
  open_panama_canal_to_all.a: "Lift the restrictions."
  open_panama_canal_to_all.b: "Not at this time."