l_russian:
  spa_establish_the_council_of_castile_decision.title: "Заснувати $royal_council_of_castile$"
  spa_establish_the_council_of_castile_decision.desc: "Уряд не може справно діяти, доки в наших володіннях чинні різні порядки та закони, а [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] повсякчас вимага[ROOT.GetCountry.Custom('nobles_yeyut')] задоволення своїх забаганок. Щоби розв’язати ці проблеми й централізувати врядування [ROOT.GetCountry.Custom('rank_ua_INST')|l], [target_character.GetName] пропонує заснувати #TOOLTIP:GOVERNMENT_REFORM,royal_council_of_castile,X #L Кастильську раду#!#! — керівну установу, яка відповідатиме за збирання податків, судочинство та призначення урядовців. Цю думку палко підтримують і реформатори, і роялісти. На їхній погляд, це дасть нам змогу спрямувати засоби на благо всієї країни, а не лише в інтересах місцевої знаті."
  spa_establish_the_council_of_castile_decision.desc.entry: "Врядування за умов розрізнености місцевих порядків і законів робить наших правителів залежними від тих, хто нині має владу в кожній із цих юрисдикцій. Постійна установа із навчених урядовців, підзвітних винятково нам, #TOOLTIP:GOVERNMENT_REFORM,royal_council_of_castile,X #L Кастильській раді#!#!, дала би змогу вивести оподаткування, правосуддя та призначення на посади з-під впливу місцевих інтересів."
  spa_establish_the_council_of_castile_decision.a: "Нехай [ROOT.GetCountry.Custom('rank_ua_INST')|l] керує рада."
  spa_establish_the_council_of_castile_decision.a.entry: "Країною керуватиме рада."
  establish_the_council_of_castile_tt: "Заснуємо [ShowBureaucracyTypeName('spa_council_of_castile_bureaucracy')]"
  established_the_council_of_castile_tt: "Ми заснували [ShowBureaucracyTypeName('spa_council_of_castile_bureaucracy')] рішенням $spa_establish_the_council_of_castile_decision.title$."
  spa_establish_the_council_of_castile_decision.historical_info: "Кастильська рада була створена наприкінці XV століття католицькими монархами Фердинандом II та Ізабеллою I. Спершу вона виконувала роль дорадчого органу, але згодом перетворилася на головний засіб врядування королівством. Створення ради дало змогу не лише послабити вплив знаті та місцевих правителів, а й передати врядування країною до рук досвідчених правників та урядовців, готових служити в інтересах держави."