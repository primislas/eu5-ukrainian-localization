l_russian:
  eng_yorkist_tradition_decision.title: "Залучення урядовців із середньої верстви"
  eng_yorkist_tradition_decision.desc: "Щороку шукати обдарованих людей, здатних обіймати державні посади, стає дедалі складніше. Вже лунають заклики шукати гідних урядовців серед представників середньої верстви, яка зростає, — насамперед це правники та [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l]. Обидві сторони з нетерпінням чекають на наше рішення: чи наважимося ми піти на такі зміни?"
  eng_yorkist_tradition_decision.desc.entry: "Середня верства зростає, і тому лунають голоси про необхідність залучати декого з її представників до уряду. Якщо ми зможемо знаходити обдарованих людей і кликати їх на службу, долучивши середню верству до тих, з-поміж кого ми добираємо людей, це, безперечно, розширить наші спроможності."
  eng_yorkist_tradition_decision.a: "Підтримаємо їх."
  eng_yorkist_tradition_decision.b: "Їм не місце в уряді."
  enable_yorkist_tradition_policy: "Відкриває [Concept('policy', 'політику')|e] #TOOLTIP:POLICY,yorkist_tradition_policy,X #L «Йоркістський звичай»#!#!"
  eng_yorkist_tradition_decision.historical_info: "Призначення представників середньої верстви (переважно правників і священників) на урядові посади — давній звичай англійського дому Йорків. Однак не всім подобався такий лад: знать і навіть дехто зі священнослужителів вважали, що на такий привілей заслуговують лише люди високого походження або що він має походити від Господа."
  eng_court_of_the_star_chamber_decision.title: "Суд Зоряної палати"
  eng_court_of_the_star_chamber_decision.desc: "Зараз правосуддя чинять відповідно до положень, закріплених #TOOLTIP:POLICY,common_law_policy,X #L загальним правом#!#!. Однак судочинство просувається неймовірно повільно, оскільки в його основі лежать прецеденти та рішення суддів. Ухвалення вироків у певних справах може забирати тижні, а іноді й місяці. Дехто вважає, що час заснувати окрему установу з ширшими повноваженнями, яка могла б розглядати справи, надто складні для звичайних судів. Однак у такому разі є ймовірність, що [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] зміцн[ROOT.GetCountry.Custom('crown_ytyat')] свою владу й змож[ROOT.GetCountry.Custom('crown_eut')] придушувати незгодних і карати інакодумців."
  eng_court_of_the_star_chamber_decision.desc.entry: "Прецедент — наш узвичаєний спосіб чинити правосуддя, однак через нього розгляди йдуть повільно, а ухвалення рішень затягується надовго. Друга палата, вільна встановлювати власний порядок розглядів, дозволила б швидко вирішувати подібні справи, і з часом це могло б увійти у звичай, який добре прислужиться $crown_estate$."
  eng_court_of_the_star_chamber_decision.a: "Без такого засобу годі обійтися."
  eng_court_of_the_star_chamber_decision.b: "У нас є загальне право — цього поки достатньо."
  enable_court_of_the_star_chamber_reform: "Відкриває [Concept('government_reform', 'державну реформу')|e] #TOOLTIP:GOVERNMENT_REFORM,court_of_the_star_chamber_reform,X #L «Суд Зоряної палати»#!#!"
  eng_court_of_the_star_chamber_decision.historical_info: "Зоряна палата, що набрала ваги за доби правління Генріха VII, виникла як відділення королівської таємної ради. Свою назву вона отримала від прикрашеної зорями стелі в залі Вестмінстерського палацу, де проходили засідання. У 1487 році палата здобула статус окремої судової установи, незалежної від ради, і розглядала клопотання про відшкодування збитків."
  eng_benevolence_tax_decision.title: "Запровадити податок прихильності"
  eng_benevolence_tax_decision.desc: "Завдяки чудовому врядуванню [ROOT.GetCountry.GetGovernment.GetRuler.GetName] зумів(-ла) відновити міць і стабільність [ROOT.GetCountry.GetAdjective]ої монархії після лиха [ShowDisasterName('war_of_the_roses')]. Увага до дрібниць і неприйняття марнотратства здобули заслужену славу, і тепер, схоже, погляд [ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer] звернувся до пошуку нових прибутків через запровадження безжально дієвого податкового устрою."
  eng_benevolence_tax_decision.desc.entry: "Правитель, який мало витрачає і ретельно все підраховує, швидко помічає, скільки витрачають інші. Мир, здобутий після [ShowDisasterName('war_of_the_roses')], зберіг скарбницю стійкою, а увагу правителя — вільною, щоби звернутися до калиток багатіїв."
  eng_benevolence_tax_decision.a: "Хай живуть мир і процвітання."
  eng_benevolence_tax_decision.b: "Погріймося в променях стабільності."
  eng_benevolence_tax_decision.a.custom: "Відкриває [Concept('government_reform', 'державну реформу')|e] «#TOOLTIP:GOVERNMENT_REFORM,benevolence_tax_reform,X #L «Добровільний податок»#!#!»"
  eng_benevolence_tax_decision.historical_info: "Генріх VII зміцнив не лише власну владу, а й державну скарбницю. За порадою свого радника Джона Мортона він запровадив так звані «добровільні» податки, вважаючи, що якщо хтось живе скромно, отже, заощаджує гроші, а тому може дозволити собі передавати накопичене до скарбниці; якщо ж хтось живе заможно, отже, не має скрути в коштах, а значить, податок його не обтяжить."
  eng_council_of_the_north_decision.title: "Рада Півночі"
  eng_council_of_the_north_decision.desc: "Нам повідомляють, що королівське правосуддя в північних графствах перебуває в жалюгідному стані. Цьому сприяє, з-поміж іншого, той факт, що [ROOT.GetCountry.GetCapital.GetName] занадто далеко. Якщо заснувати на півночі незалежну раду (для цього чудово підійде [target_location.GetRank.GetNameWithNoTooltip|l] [target_location.GetName]), наділену певною владою, чинити там правосуддя стане простіше."
  eng_council_of_the_north_decision.desc.entry: "Правосуддя, відкладене на три тижні важкої скачки, — це правосуддя, у якому відмовлено. Рада, що засідає в [ShowLocationName('york')] і наділена власними повноваженнями, відповідала б на прохання північних графств без потреби пересилати їх через усю країну — ціною стане влада, якою ми більше не зможемо розпоряджатися самі."
  eng_council_of_the_north_decision.a: "Чудовий задум."
  eng_council_of_the_north_decision.b: "Чиновництво — поганий вибір."
  STATIC_MODIFIER_NAME_lack_of_conciliar_justice: "Слабкість правосуддя"
  eng_council_of_the_north_decision.historical_info: "Рада Півночі — урядова установа, заснована заради встановлення прямої влади над північними графствами. Члени ради не лише підтримували лад, а й пильнували, щоби піддані зберігали вірність короні. У 1641 році, коли в Англії почалася громадянська війна, раду було розпущено."
  eng_austere_monastic_life_decision.title: "Реформа монастирів"
  eng_austere_monastic_life_decision.desc: "[ROOT.GetCountry.GetName] — країна надто багатих духовних орденів. Реформатори більше не в змозі з цим миритися. Невдоволення церквою дедалі частіше висловлю[ROOT.GetCountry.Custom('peasants_yeyut')] і прост[ROOT.GetCountry.Custom('peasants_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] — вони вважають, що та має надто велику владу.\n\nМожливо, ще не пізно спробувати зруйнувати усталений лад і нагадати священнослужителям, що аскеза й самітництво понад усе.\n\nЗагальна кількість порахованих нами монастирів: #Y  [ROOT.GetVariable('num_of_monasteries').GetValue]#!."
  eng_austere_monastic_life_decision.desc.entry: "Ніщо не ображає бідноту так сильно, як багатий самітник. Реформатори твердять про це вже багато років, $peasants_estate$ почав погоджуватися з ними, і повернення орденів до їхніх обітниць припаде до вподоби всім, крім самих орденів."
  eng_austere_monastic_life_decision.a: "Проведемо реформу."
  eng_austere_monastic_life_decision.a.custom: "Ченці залишають свої ордени; тепер вони знову [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l]"
  eng_austere_monastic_life_decision.b: "$common_string_leave_them_be$"
  eng_austere_monastic_life_decision.b.custom: "#TOOLTIP:POPTYPE,clergy,X #L Духовенство#!#! у чернечих орденах отримує [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  eng_austere_monastic_life_decision.tt: "Розпустити монастирі буде не можна без скасування цього [Concept('privilege', 'привілею')|e]"
  eng_austere_monastic_life_decision.historical_info: "Розпуск монастирів — величний перелом, що супроводжував рух Реформації в Англії XVI століття. Початок йому поклав перший радник короля Томас Кромвель, який прагнув викорінити усталену монастирську систему, бо сприймав її як продовження Римо-католицької церкви. Розпуск призвів до закриття монастирів, абатств і конвентів по всій країні."
  eng_navy_board_decision.title: "Флотська колегія"
  eng_navy_board_decision.desc.entry: "Острів захищений лише настільки, наскільки захищені води навколо нього, а наші води стережуть флоти, які спорудили не ми. Якщо об'єднати корабельні, комори й постачання харчів під проводом однієї ради, ми зможемо тримати в морі більше кораблів за ті самі гроші — а іншого розширення флоту ми дозволити собі поки що не можемо."
  eng_navy_board_decision.a: "Вчинимо так, як того вимагають обставини."
  eng_navy_board_decision.b: "Немає нічого важливішого за військо."
  enable_navy_board_reform: "Відкриває [Concept('government_reform', 'державну реформу')|e] #TOOLTIP:GOVERNMENT_REFORM,navy_board_reform,X #L «Флотська колегія»#!#!"
  eng_navy_board_decision.historical_info: "За доби правління короля Генріха VIII (XVI століття) було засновано Флотську колегію — військово-морське відомство, що опікувалося в тому числі кораблебудуванням і постачанням. Під проводом короля колегія збільшувала чисельність і міць англійського флоту, прагнучи перетворити його на грізну силу, здатну захистити країну від будь-якого вторгнення."
  eng_grand_remonstrance_decision.title: "Велика ремонстрація"
  eng_grand_remonstrance_decision.desc.entry: "Парламент виклав свої кривди письмово — так чинять ті, хто розраховує отримати відповідь, а не просто бути почутим. Вони прагнуть обмежити монархію та вилучити $clergy_estate$ з ради, а натомість натякають на співпрацю, якої ми не знали вже багато років."
  eng_grand_remonstrance_decision.a: "Складемо ретельно зважену відмову."
  eng_grand_remonstrance_decision.b: "Погодитися на умови."
  eng_grand_remonstrance_decision.c: "Спробуємо домовитися про компроміс."
  eng_grand_remonstrance_decision.tt1: "Парламент може відповісти вороже й спробувати будь-якими засобами обмежити королівську владу"
  STATIC_MODIFIER_NAME_grand_remonstrance_refused: "Великій ремонстрації відмовлено"
  eng_grand_remonstrance_decision.b.custom: "Впроваджується [Concept('government_reform', 'державна реформа')|e] #TOOLTIP:GOVERNMENT_REFORM,grand_remonstrance_reform,X #L «Велика ремонстрація»#!#!"
  eng_grand_remonstrance_decision.c.custom1: "[target_root_country.GetGovernment.GetRuler.GetName] не має великого дипломатичного досвіду, тому ймовірність успіху низька"
  eng_grand_remonstrance_decision.c.custom2: "[target_root_country.GetGovernment.GetRuler.GetName] має відносно великий дипломатичний досвід, тому є змога переконати достатньо представників"
  eng_grand_remonstrance_decision.tt2: "Підсумок компромісу може виявитися несприятливим"
  eng_grand_remonstrance_decision.historical_info: "Велика ремонстрація — політичний документ, поданий у 1641 році членами парламенту англійському королю Карлу I. У цьому документі представники висловили невдоволення владою короля й висунули пропозиції, покликані докорінно обмежити можливість монарха втручатися в парламентське діловодство. Окрім цього вони висловили побоювання щодо поширення в країні католицтва й зазначили, що королівські радники мають надто великий вплив. Вручення королю Великої ремонстрації призвело до різкого спалаху напруги між монархом і парламентом. Закономірним наслідком цього спалаху стала громадянська війна."
  eng_overhauled_admiralty_decision.title: "Реорганізація Адміралтейської колегії"
  eng_overhauled_admiralty_decision.desc: "Чиновник морського відомства [samuel_pepys.GetName] — багатообіцяючий працівник, незважаючи на брак досвіду морського життя: він впливовий, старанний і обдарований. Така людина допоможе нам здійснити реформу Ради адміралтейства та зробити королівських моряків найдостойнішими представниками своєї справи."
  eng_overhauled_admiralty_decision.desc.entry: "Флоту ніколи не бракувало відважних капітанів — бракувало лише того, хто вмів би вести лік його запасам. $name_samuel$ $Pepys$ ніколи не командував кораблем, і, дуже ймовірно, саме тому він — та сама людина, яка потрібна."
  eng_overhauled_admiralty_decision.a: "Нехай [samuel_pepys.GetName] буде секретарем ради."
  eng_overhauled_admiralty_decision.b: "Плоди його праці мають належати нам."
  enable_overhauled_admiralty_reform: "Відкриває [Concept('government_reform', 'державну реформу')|e] #TOOLTIP:GOVERNMENT_REFORM,overhauled_admiralty_reform,X #L «Реформоване адміралтейство»#!#!"
  STATIC_MODIFIER_NAME_samuel_pepys_diligence: "Старанність Семюела Піпса"
  eng_overhauled_admiralty_decision.tt3: "у складі колегії Піпс спростить організацію дій флоту"
  eng_overhauled_admiralty_decision.historical_info: "Завдяки реформам Семюела Піпса королівський військово-морський флот став відповідати вимогам свого непростого й небезпечного часу. Піпс змінив порядок постачання флоту (зокрема харчами), а також запровадив регулярну платню матросам та офіцерам. Утім, запам'ятався він переважно як автор щоденника, у якому протягом десяти років надзвичайно докладно описував кожен день свого життя — зокрема, засвідчив Велику пожежу та Великий чумний мор."
  eng_taxation_law_decision.title: "Подохідний податок"
  eng_taxation_law_decision.desc: "Скарбове становище нашої країни невтішне. Реформи вкрай потрібні. Побутує думка, що чинний податковий устрій вигідний лише багатіям, тоді як скарбниця майже не одержує коштів. Радник [william_pitt_the_younger.GetName] пропонує запровадити тимчасовий прибутковий податок, щоб забезпечити додатковий приплив коштів і розподілити їх. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] та [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l], утім, не в захваті від цієї пропозиції."
  eng_taxation_law_decision.desc.entry: "Податок, що щадить багатих, приносить мало й не задовольняє нікого. $name_william$ $Pitt$ пропонує стягувати частку доходу напряму, на обмежений строк і без скільки-небудь значущих пільг, через що $nobles_estate$ та $clergy_estate$ боротимуться проти цього до останнього."
  eng_taxation_law_decision.a: "Це справедливо й цілком у дусі часу."
  eng_taxation_law_decision.b: "Нам вистачить мита та акцизів."
  eng_taxation_law_decision.c: "Це дуже дражливе питання."
  eng_taxation_law_decision.custom: "Відкриває [Concept('law', 'закон')|e] #TOOLTIP:LAW,eng_taxation_law,X #L «Оподаткування»#!#!"
  eng_taxation_law_decision.tt: "Парламент буде незадоволений нехтуванням настільки хитким фінансовим становищем #ONCLICK:COUNTRY,[target_root_country.GetKey] #TOOLTIP:COUNTRY,[target_root_country.GetKey],X [target_root_country.Custom('CL_GEN')|L]#!#!"
  STATIC_MODIFIER_NAME_temporary_income_tax: "Тимчасовий прибутковий податок"
  eng_taxation_law_decision.historical_info: "Подохідний податок в Англії був запроваджений у роки Наполеонівських війн, коли стало зрозуміло, що скарбниця ледве витримує фінансовий тягар. Першим ідею про такий збір висунув прем'єр-міністр Вільям Пітт-молодший, який розробив прогресивний подохідний податок: ті, у кого більші доходи, сплачували до скарбниці вищу частку. Невдоволення заможних верств призвело до того, що по закінченні війни податок скасували."
  eng_factory_working_conditions_decision.title: "Закон про фабрики"
  eng_factory_working_conditions_decision.desc: "Фабричні робітники зазнають безжального визиску, праця їхня небезпечна для життя, а платня занадто низька. Нині розробляються реформи, які могли б їх захистити, однак слід зважити на те, що будь-яку спробу змінити усталені порядки зустрінуть вороже, і це, ймовірно, навіть спричинить спад господарського зростання та виробництва. Проте діяти необхідно, інакше робітники просто розбіжаться."
  eng_factory_working_conditions_decision.a: "Знедоленим треба допомогти."
  eng_factory_working_conditions_decision.b: "Робітники — запорука зростання нашої економіки."
  eng_factory_working_conditions_decision.c: "Нехай виявлять хоч трохи вдячности."
  eng_factory_working_conditions_decision.custom: "Відкриває [Concept('law', 'закон')|e] #TOOLTIP:LAW,factory_working_conditions_law,X #L «Умови праці на фабриках»#!#!"
  eng_factory_working_conditions_decision.historical_info: "Закон про фабрики — важлива віха в історії британського робітничого руху, що заклала підвалини для поліпшення умов праці та захисту прав робітників, особливо дітей, змушених працювати мало не цілий день за мізерні гроші. Закон запровадив вікові обмеження, вимоги до рівня освіти та зробив інспекцію робочих місць обов’язковою, а також змусив власників фабрик подбати про безпеку праці й почати вести трудовий облік."
  eng_coke_smelting_decision.title: "Підтримати справу Дарбі"
  eng_coke_smelting_decision.desc: "Металург [abraham_darby.GetName] розробив нове паливо для доменних печей, що отримало назву «кокс». Від звичайного деревного вугілля воно вигідно різниться меншим вмістом летких речовин і вищою горючістю. Нині [abraham_darby.GetNameWithNoTooltip], чиїй родині належить ціла #TOOLTIP:BUILDING_TYPE,iron_foundry,X #L чавуноливарня#!#!, випробовує свій винахід, і наслідки вельми обнадійливі."
  eng_coke_smelting_decision.desc.entry: "Деревне вугілля палає досить гаряче для коваля, але ніколи — для плавильної печі. $name_abraham$ $Darby$ навчився перетворювати вугілля на щось значно надійніше, і перші випробування на його [ShowBuildingTypeName('iron_foundry')] свідчать, що залізо невдовзі можна буде виплавляти в таких обсягах, яких ліси зроду б не витримали."
  eng_coke_smelting_decision.a: "Зробимо застосування коксу промисловим зразком."
  eng_coke_smelting_decision.b: "Поки що нас усе влаштовує."
  eng_coke_smelting_decision.tt2: "Для нового палива знадобиться ще більше #TOOLTIP:GOODS,coal,X #L вугілля#!#!#!"
  enable_coke_smelting_advance: "Відкриває [Concept('advance', 'поступ')|e] «#L #TOOLTIP:ADVANCE_DEFINITION,coke_smelting,X #L Плавлення коксом#!#!»"
  unlocked_advance_coke_smelting_tt: "Схвалено [decision|e] «$eng_coke_smelting_decision.title$»"
  eng_coke_smelting_decision.historical_info: "Винахід виплавлення заліза за допомогою коксу Абрагамом Дарбі I значно прискорив промислову революцію, оскільки докорінно змінив усталені підходи до виробництва заліза й тим самим посприяв ширшому впровадженню заліза та сталі в різні промисли. Крім того, кокс почали застосовувати для масового виробництва чавуну — вельми важливого для промислової революції матеріалу."
  eng_royal_society_decision.title: "Королівське товариство"
  eng_royal_society_decision.desc: "Чимало величних відкриттів видатні уми нашого краю здійснили разом. Тепер доцільно заснувати незалежну установу під керуванням власної ради з осередком у місті [ROOT.GetCountry.GetCapital.GetName]. Її члени не лише опікуватимуться поступом науки, а й розкриватимуть суспільству очі на користь подібних пошуків, а разом із тим підходитимуть до питань політики й освіти з наукового погляду, заохочуючи найрізноманітніші дослідження."
  eng_royal_society_decision.desc.entry: "Учені мужі й без нашої допомоги вже збираються разом, листуються та сперечаються між собою; їм бракує хіба що даху над головою та хартії. Давши їм і те, й інше, ми наблизимо натурфілософів країни не лише до їхніх власних питань, а й до наших."
  eng_royal_society_decision.a: "Чудова думка."
  eng_royal_society_decision.b: "Краще спрямувати гроші до університетів."
  eng_royal_society_decision.c: "Це задорого й надто важко."
  eng_royal_society_decision.historical_info: "Королівське товариство було засноване в 1660 році, за доби правління англійського короля Чарльза II. Засновниками стали провідні вчені того часу, які прагнули розширювати межі пізнання та всіляко розвивати науку. Королівське товариство надало дослідникам як точних, так і гуманітарних наук, а також різним мислителям нагоду зустрічатися й ділитися наслідками своїх праць, щоби від припущень переходити до дій."
  eng_royal_society_decision.tt1: "[target_root_country.GetGovernment.GetRuler.GetName] стане покровителем нового товариства"
  eng_royal_academy_of_arts_decision.title: "Королівська академія мистецтв"
  eng_royal_academy_of_arts_decision.desc: "Нам надійшла пропозиція створити товариство, яке б сприяло всебічному плеканню творчости. Передбачається, що кошти надасть [ROOT.GetCountry.GetGovernment.GetRuler.GetName]. Тут митці-початківці зможуть пізнавати тонкощі своєї справи. Щороку товариство проводитиме виставку сучасного мистецтва, і взяти в ній участь матиме змогу кожен охочий."
  eng_royal_academy_of_arts_decision.desc.entry: "Художники, які навчалися за кордоном, привозять із собою разом із майстерністю і чужоземний смак. Власна академія — зі школою, щорічною виставкою, відкритою для будь-якого митця, та скарбницею правителя за спиною — дозволить наступному поколінню опановувати ремесло на батьківщині."
  eng_royal_academy_of_arts_decision.a: "Як майстерно! Ми цілком схвалюємо."
  eng_royal_academy_of_arts_decision.b: "Краще витратимо ці гроші на освіту бідноти."
  STATIC_MODIFIER_NAME_increased_educational_spending: "Збільшені видатки на освіту"
  eng_royal_academy_of_arts_decision.historical_info: "Королівська академія мистецтв — це приватна установа, що сприяє розвитку образотворчого мистецтва й архітектури. Вона заснована в 1768 році групою таких митців, як сер Джошуа Рейнольдс і сер Вільям Чемберс. Першим опікуном цього товариства серед монархів став король Георг III. Членство в академії вважається надзвичайно поважним і надається художникам та архітекторам, які зробили значний внесок у відповідну царину."
  eng_enclosure_act_decision.title: "Закон про обгороджування"
  eng_enclosure_act_decision.desc: "Власники фабрик і земель звернулися до парламенту з проханням. Вони просять дозволу взяти в приватну власність ще більше земель загального користування, щоби прискорити переселення робочих рук із сільських країв до міст. Переселення населення буде вельми значним, однак такий крок гарантує достаток робочих рук і навіть зможе збільшити обсяги сільськогосподарського виробництва."
  eng_enclosure_act_decision.a: "Переселений робітник — працьовитий робітник."
  eng_enclosure_act_decision.b: "Це обернеться суспільним лихом."
  eng_enclosure_act_decision.a.custom: "Обурені [ShowPopTypeName('peasants')|l] підіймають бунт. [Concept('prosperity', 'Процвітання')|e] 10 сільських [Concept('locations', 'місцевостей')|e] падає на [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%]"
  eng_enclosure_act_decision.tt: "Закон прискорить урбанізацію і посприяє індустріалізації, однак #L #TOOLTIP:ESTATE_TYPE,peasants_estate,X селяни#!#! постраждають"
  enable_enclosure_act_policy: "Відкриває [Concept('policy', 'політику')|e] #TOOLTIP:POLICY,enclosure_act,X #L «Закон про обгороджування»#!#!"
  STATIC_MODIFIER_NAME_obstructing_industrialization: "Перешкоджання індустріалізації"
  enclosure_riots: "Бунти через обгороджування"
  eng_enclosure_act_decision.historical_info: "Закони про обгороджування — низка ухвалених в Англії законів, спрямованих на підтримання політики обгороджування, тобто на переведення в приватну власність земель і полів спільного користування. Таку політику визнали необхідною з огляду на перехід сільського господарства на комерційну основу та поступову індустріалізацію країни. Закони про обгороджування посилили суспільну нерівність і спричинили масовий відплив тисяч позбавлених праці сільських трудівників до міст. Таке становище зрештою призвело до бунтів знедолених селян і робітників, які відстоювали свої звичаєві права."
  sco_witchcraft_act_decision.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]ий закон про чаклунство"
  sco_witchcraft_act_decision.title.entry: "Акт про чаклунство"
  sco_witchcraft_act_decision.desc: "Серед народу зростає неприязнь до всіляких чаклунських дійств, і [target_ruler.GetName] дедалі частіше отримує доноси на відьом. Серед них є і звинувачення на адресу невинних знахарів, які нібито варили зілля, і навіть оповіді про випадки біснуватості. Один селянин і поготів повідомив, що його якось перетворили на ящірку, але йому дивом вдалося повернути собі людську подобу.\n\nПравда це чи вигадка — одному богові відомо, але ми в будь-якому разі маємо якось відреагувати на цю ситуацію. Члени двору пропонують ухвалити новий закон проти відьом, а також просять, щоби [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'висловила', 'висловив')] свою думку з цього питання."
  sco_witchcraft_act_decision.desc.entry: "Суд тепер отримує більше звинувачень у чаклунстві, ніж у крадіжках, і хтось має вирішувати, які з них варті розгляду. Закон бодай поставить цю справу на правову основу, хоча закон проти відьом має цікаву властивість — плодити їх дедалі більше."
  sco_witchcraft_act_decision.a: "Зберегти закон про чаклунство."
  sco_witchcraft_act_decision.b: "Скасувати його."
  sco_witchcraft_act_decision.historical_info: "Шотландський закон про чаклунство 1563 року оголосив кримінальними злочинами як власне магічні дійства, так і користування послугами чаклунок. Король Яків VI особисто взяв участь у перших судах над відьмами за новим законом, які пройшли в Норт-Беріку. У 1597 році він написав трактат «Демонологія», що викривав чорнокнижників, але згодом став більш скептично ставитися до цього питання і вжив заходів для обмеження гонінь. Загалом у Шотландії судили за чаклунство близько 6000 осіб, причому 75% обвинувачених були жінками. Понад 1500 з них було страчено."
  sco_preserve_clan_autonomy_decision.title: "Статут Айони"
  sco_preserve_clan_autonomy_decision.desc: "Хоча багато хто з [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] рівнинної #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! вже давно відправляє своїх спадкоємців до місцевих шкіл, #TOOLTIP:CULTURE,$highland_tt$,X #L гайлендські#!#! клани, як і раніше, дотримуються свого звичаєвого навчання.\n\nВ останні роки ці відмінності стали серйозною проблемою для нашої країни, тому [ROOT.GetCountry.GetGovernment.GetCourtTitle] пропонує зобов’язати спадкоємців цих кланів навчатися в школах низинних регіонів.\n\nПодібний захід помітно підвищить грамотність майбутньої знаті, однак дехто побоюється, що це також може призвести до втрати неповторної культури та звичаїв горян."
  sco_preserve_clan_autonomy_decision.desc.entry: "Клан, що навчає своїх спадкоємців удома, плекає людей, вірних клану; клан, що відправляє їх на південь, плекає людей, вірних тому, хто їх навчав. Примусивши вождів [ShowCultureName('highland')] до останнього, ми отримаємо більш корисне покоління лердів — і менш горянське."
  sco_preserve_clan_autonomy_decision.a: "Затвердимо цей статут."
  sco_preserve_clan_autonomy_decision.b: "Дозволимо кланам зберегти незалежну освіту."
  eng_east_india_company_decision.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]а Ост-Індійська компанія"
  eng_east_india_company_decision.title.entry: "Ост-Індійська компанія"
  eng_east_india_company_decision.desc: "За прикладом інших морських країн, [ROOT.GetCountry.GetName] також прагне колоніальної експансії. Наші дослідники зуміли проторувати шлях до Ост-Індії, і тепер ми можемо мати зиск з її незліченних багатств, заснувавши власну торгову компанію."
  eng_east_india_company_decision.desc.entry: "Шлях на схід давно перестав бути таємницею, і кожен суперник із гаванню вже плаває ним. Привілейована компанія дозволить приватним грошам узяти на себе ризик плавань, доки корона отримує частку з того, що привозять назад."
  eng_east_india_company_decision.a: "Ми скористаємося цим!"
  eng_east_india_company_decision.b: "Краще займімося рідною землею."
  eng_east_india_company_decision.a.tt: "Відкриває доступ до [Concept('government_reform', 'державної реформи')|e] «[ShowGovernmentReformName('east_india_trading_company')]»"
  eng_council_of_the_north_decision.b_tt: "Кожне володіння в регіоні [ShowAreaName('northumbria_area')] отримає [ShowModifier('lack_of_conciliar_justice')] [modifier|e]"
  sco_company_of_scotland_decision.a: "Компанія принесе процвітання нашій країні!"
  sco_company_of_scotland_decision.b: "Звучить дещо ризиковано."
  sco_company_of_scotland_decision.desc: "Зі зростанням нашої зацікавленості в заморській торгівлі відсутність державного нагляду за міжконтинентальними торговими шляхами викликає дедалі більше занепокоєння. Нам слід надати торгові монополії гідним особам, яким буде доручено влаштування наших перевезень і захист наших вкладень."
  sco_company_of_scotland_decision.title: "Заснувати [ShowGovernmentReformNameWithNoTooltip('company_of_scotland')]"
  eng_navy_board_decision.desc: "Було визнано, що наші кордони певною мірою вразливі до іноземного вторгнення. Щоб убезпечити майбутнє країни [ROOT.GetCountry.GetName], ми повинні встановити контроль над морями навколо нашого острова, щоб припинити будь-які спроби зазіхання на наші землі.\n\nРозширивши наші логістичні можливості та оптимізувавши управління флотом, ми зможемо пожвавити суднобудування, а також утримувати більший військово-морський флот із меншими витратами."
  eng_grand_remonstrance_decision.desc: "Представник парламенту подав перелік скарг, які, на думку парламентарів, допоможуть розв'язати проблеми корупції та духовного впливу на державні справи. Вони наголошують, що [ROOT.GetCountry.GetGovernment.GetRuler.GetName] уже тривалий час править без скликання парламенту, і тепер прагнуть захистити свої права та привілеї шляхом обмеження влади монархії.\n\nКрім того, існує проблема королівських радників з #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L духовенства#!#!, чию присутність вважають продовженням впливу Церкви на державні справи. Надійшла пропозиція заборонити представникам духовенства входити до складу кабінету міністрів. Натомість парламент активніше підтримуватиме майбутні законопроєкти."