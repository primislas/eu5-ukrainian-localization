l_russian:
  ser_novo_brdo_mine_decision.title: "Ново-Брдоський законник"
  ser_novo_brdo_mine_decision.desc: "У гірничому містечку #TOOLTIP:LOCATION,novo_brdo,X #L Ново-Брдо#!#! склався унікальний звід правил і законів, що впорядковують роботу гірничих промислів та їхні правові засади. Гірники інших країв вимагають, щоб цей кодекс ліг в основу загальнодержавного законодавства у рудній справі. Запропонований ними #TOOLTIP:POLICY,novo_brdo_mining_law,X #L Ново-Брдоський законник#!#! має впорядкувати устрій гірничих містечок, визначити права й обов’язки гірників та забезпечити заходи безпеки і справедливий лад у справах на всіх теренах [ROOT.GetCountry.Custom('CL_GEN')]."
  ser_novo_brdo_mine_decision.desc.entry: "Одне гірниче місто шляхом спроб і суперечок виробило правила, які дають його копальням приносити прибуток, а рудокопам — не вбивати один одного через них. Якщо зробити звичаї [ShowLocationName('novo_brdo')] законом для всіх рудників $SER$, інші міста втратять свої місцеві порядки, проте позбудуться потреби невправно вигадувати ті самі правила наново."
  ser_novo_brdo_mine_decision.a: "Ухвалимо загальнодержавний законник."
  ser_novo_brdo_mine_decision.b: "Нас задовольняють і теперішні правила."
  has_unlocked_novo_brdo_tt: "Закон відкрито завдяки #Y «[ShowLocationNameWithNoTooltip('novo_brdo')]: Кодексу»#! [decision|e]"
  STATIC_MODIFIER_NAME_ser_novo_brdo_code: "Ново-Брдоський законник"
  ser_novo_brdo_mine_decision.historical_info: "Ново-Брдоський законник, ухвалений Стефаном Лазаревичем у 1412 році, був всеохопним зводом правил, що впорядковували всі сторони гірничої справи — від видобутку до влаштування гірничих міст. Законник регулював права власності, заходи безпеки та господарську діяльність, сприяючи розвитку й розквіту гірничих громад."
  chi_grand_pronouncements_decision.title: "Великі рескрипти"
  chi_grand_pronouncements_decision.desc: "[target_character.GetName|U] стверджує, що занепад попередньої династії спричинили повсюдне хабарництво та свавілля державних сановників. [Select_CString(target_character.IsFemale, 'Вона', 'Він')] наполягає на запровадженні суворіших законів, які дозволять уберегти #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! від такої ж долі."
  chi_grand_pronouncements_decision.desc.entry: "Династії гинуть від навал значно рідше, ніж від радників, покликаних їм служити. Двір має намір укласти звід законів, достатньо суворий, щоб жоден радник не вважав палац своєю власністю, чого б це не коштувало тій свободі дій, якою такі люди зазвичай користуються."
  chi_grand_pronouncements_decision.a: "Ми викорінимо хабарництво!"
  chi_grand_pronouncements_decision.b: "Хабарництво в нашому уряді? Та бути такого не може!"
  chi_ming_dynasty_code_will_be_changed: "До #TOOLTIP:POLICY,chi_ming_dynasty_code_policy,X #L Повного зводу законів#!#! будуть додані наслідки модифікатора «[ShowModifier('chi_grand_pronouncements')]»."
  integrated_grand_prounouncements: "«[ShowModifier('chi_grand_pronouncements')]» стали частиною #TOOLTIP:POLICY,chi_ming_dynasty_code_policy,X #L Повного зводу законів#!#!."
  cas_right_of_possession_decision.title: "Право володіння"
  cas_right_of_possession_decision.desc: "Наші #TOOLTIP:GOODS,wool,X #L вовняні#!#! промисли процвітають під умілим керівництвом #TOOLTIP:LAW,mesta_council_law,X #L Ради Мести#!#!, і вівчарство відіграє дедалі більшу роль у #L [ROOT.GetCountry.GetAdjective|l]ому#! господарстві. Щоби забезпечити подальше благополуччя спілки, було б розумно впровадити закон про #TOOLTIP:POLICY,right_of_possesion,X #L право володіння#!#!, що регулює правила користування пасовищами та вартість їхньої оренди."
  cas_right_of_possession_decision.desc.entry: "Гільдія, полишена на саму себе, з часом починає дбати лише про власні інтереси. [ShowLawName('mesta_council_law')] перетворила [ShowGoodsName('wool')] на ціле багатство, і встановлення граничної плати за оренду пасовищ не дозволить витягти це багатство цілком із кишень селян, які орендують землю."
  cas_right_of_possession_decision.a: "Запровадимо закон про право володіння."
  cas_right_of_possession_decision.b: "Краще залишимо все як є."
  cas_right_of_possession_decision.c: "Час розпустити Раду Мести!"
  cas_right_of_possession_decision.c.tt: "Усі належні нам місцевості #TOOLTIP:REGION,iberia_region,X #L Піренейського півострова#!#!, де виробляють вовну, назавжди втратять модифікатор «[ShowModifier('merino_wool')]»"
  cas_altered_nueva_recopilacion_decision.title: "Новітній звід"
  cas_altered_nueva_recopilacion_decision.desc: "#ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! поступово охоплюють ідеї #L #TOOLTIP:ADVANCE_DEFINITION,enlightenment_advance,X #L Просвітництва#!#!, однак багато наших законів безнадійно застаріли — зокрема й «[ShowPolicyName('nueva_recopilacion_policy')]». [target_character.GetName] [Select_CString(target_character.IsFemale, 'має намір', 'має намір')] переписати законодавство та позбавити наш правовий устрій спадщини римсько-канонічного права. Ця реформа прислужить інтересам просвітництва, давши людям змогу вивчати не лише догмати #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ої#! віри, які раніше становили основу народної освіти."
  cas_altered_nueva_recopilacion_decision.desc.entry: "Звід законів, укладений ще до [ShowAdvanceName('enlightenment_advance')], продовжує правити нами так, ніби нічого не змінилося. Переписати [ShowPolicyName('nueva_recopilacion_policy')], відійшовши від римського канонічного права, означало б навчити народ чогось окрім тієї віри, на яку суди спиралися ціле століття."
  cas_altered_nueva_recopilacion_decision.a: "Ми дамо шанс поступовим ідеям."
  cas_altered_nueva_recopilacion_decision.b: "Не варто відвертатися від звичаїв."
  cas_altered_nueva_recopilacion_decision.historical_info: "У «Новітньому зводі» іспанське законодавство перестало орієнтуватися на римсько-канонічне право, як це робив «Новий звід». Оновлений збірник законів, що набрав чинності 1805 року, став кроком до остаточного об’єднання Кастилії та Арагону в єдину іспанську державу. Хай і не настільки довершений, як кодекс Наполеона, «Новітній звід» став основою для розгляду судових справ по всій Іспанії."
  spa_alter_nueva_recopilacion_policy_tt: "Бонуси від [Concept('policy', 'політики')|e] «[ShowPolicyName('nueva_recopilacion_policy')]» перейдуть на [Concept('research', 'дослідження')|e], їхній рівень залежатиме від [Concept('estate_power', 'влади')|e] стану «[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]»."
  cas_spanish_cloth_industry_decision.title: "Добротна мериносова [ShowGoodsNameWithNoTooltip('wool')]"
  cas_spanish_cloth_industry_decision.desc: "Завдяки своїй винятковій якості #L [ROOT.GetCountry.GetAdjective|l]а#! #TOOLTIP:GOODS,wool,X #L вовна#!#! має незмінно високу славу на європейських ринках, а попит на неї зростає з кожним роком. Якщо підтримати виробництво вовни, то під проводом #TOOLTIP:LAW,mesta_council_law,X #L Ради Мести#!#! ця галузь перетвориться на вкрай прибуткову статтю вивозу. Зі свого боку низка членів Ради Мести пропонує використовувати їхню сировину для створення нашого власного виробництва #TOOLTIP:GOODS,fine_cloth,X #L тонкого сукна#!#!. Вони переконані, що майбутнє за #L [ROOT.GetCountry.GetCulture.GetName|l]ою#! суконною промисловістю."
  cas_spanish_cloth_industry_decision.desc.entry: "Сира [ShowGoodsName('wool')], яку продають за кордон, збагачує чужоземних ткачів більше, ніж нас самих. Розвиток торгівлі [ShowGoodsName('fine_cloth')] на основі [ShowLawName('mesta_council_law')] дав би нам змогу продавати вже готовий товар, якщо вдасться переконати раду, що цей додатковий щабель вартий вкладень."
  cas_spanish_cloth_industry_decision.a: "Зосередьмося на вивозі."
  cas_spanish_cloth_industry_decision.a.tt: "Усі належні нам місцевості #TOOLTIP:REGION,iberia_region,X #L Піренейського півострова#!#!, де добувають вовну, отримають модифікатор «[ShowModifier('quality_merino_wool')]» на 50 років"
  cas_spanish_cloth_industry_decision.b: "Краще підтримаймо власне виробництво."
  cas_spanish_cloth_industry_decision.b.tt: "Відкриває доступ до способів виробництва іспанських тканин для кравецької спілки."
  has_unlocked_spanish_cloth_industry: "Підтримали іспанську суконну промисловість під час події"
  STATIC_MODIFIER_NAME_quality_merino_wool: "Високоякісна мериносова вовна"
  por_casa_de_india_decision.title: "Каза-да-Індія"
  por_casa_de_india_decision.desc: "Нам необхідно налагодити справне врядування #L [ROOT.GetCountry.GetAdjective|l]ими#! володіннями в #TOOLTIP:SUB_CONTINENT,india,X #L Індії#!#! та #TOOLTIP:CONTINENT,africa,X #L Африці#!#!. Радники пропонують створити для цього окрему установу, яка забезпечуватиме наш контроль над торгівлею в цих регіонах і підпорядковуватиметься безпосередньо [ROOT.GetCountry.GetGovernment.GetAdjective|l]ій скарбниці."
  por_casa_de_india_decision.desc.entry: "Торгівля, розпорошена по $india$ та [ShowContinentName('africa')], — це торгівля, за якою ніхто до ладу не стежить. Єдина установа під проводом скарбника, що матиме монополію на найважливіший крам, вела б облік усього цього в одній-єдиній книзі рахунків."
  por_casa_de_india_decision.a: "Цікавий задум."
  por_casa_de_india_decision.a.tt: "Відкриває доступ до [Concept('government_reform', 'державної реформи')|e] «[ShowGovernmentReformName('por_casa_de_india')]»"
  hol_ned_shipbuilding_decision.title: "Флейт"
  hol_ned_shipbuilding_decision.desc: "Експансивне #L [ROOT.GetCountry.GetCulture.GetName|l]е#! господарство висуває значні вимоги до торгового флоту. До того ж через невелику глибину прибережних вод каравели та інші великі торгові кораблі не можуть заходити до багатьох [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]их портів. Досі цю проблему долали за допомогою невеликих боєрів, але нещодавно [target_character.GetName] із #TOOLTIP:LOCATION,hoorn,X #L Горна#!#! [Select_CString(target_character.IsFemale,'профінансувала', 'профінансував')] спорудження корабля нового типу.\nВін зветься «флейт» і вирізняється видовженим корпусом із характерною грушоподібною кормою, а для його обслуговування вистачає невеликої команди. Здатний як перевозити вантажі голландським мілководдям, так і виходити у відкритий океан, флейт стане безцінним подарунком для наших купців."
  hol_ned_shipbuilding_decision.desc.entry: "Боєр здатний підійти до мілин, яких вимагають наші порти, але бере на борт замало, щоб плавання того вартувало. $name_peter.dutch_dialect$ $name_john.dutch_dialect$ $Liorne$ профінансував довшу конструкцію з грушоподібною кормою, яка поєднує обидві якості та здатна нести справжній вантаж водою, ледь достатньо глибокою для веслового човна."
  hol_ned_shipbuilding_decision.a: "І справді чудовий корабель!"
  hol_ned_shipbuilding_decision_tt: "$name_peter.dutch_dialect$ $name_john.dutch_dialect$ $Liorne$ приєднається до нашого [Concept('court', 'двору')|e]"
  hol_ned_shipbuilding_decision.b: "Цікава думка, але зараз не найкращий час. Може, пізніше?"
  nov_ivan_hundred_strong_decision.title: "Купецьке об’єднання «Іванівське сто»"
  nov_ivan_hundred_strong_decision.desc: "[ROOT.GetCountry.GetName] — один із найбільших регіональних ринків і дім для багатьох впливових купецьких об'єднань. Серед них, однак, особливо вирізняється #TOOLTIP:ESTATE_PRIVILEGE,novgorod_ivans_hundred,X #L «Іванське сто»#!#!, що міцно тримає у своїх руках торгівлю #TOOLTIP:GOODS,beeswax,X #L бджолиним воском#!#!. Прагнучи й далі посилювати свій вплив, чимало поважних членів об'єднання хочуть, щоб [our_ruler.GetName] і віче надали їм додаткову підтримку. Деяк[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], однак, застеріга[ROOT.GetCountry.Custom('nobles_yeyut')], що внаслідок такої опіки об'єднання може здобути завелику вагу в [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ій торгівлі."
  nov_ivan_hundred_strong_decision.desc.entry: "[ShowEstatePrivilegeName('novgorod_ivans_hundred')] і без того тримає торгівлю [ShowGoodsName('beeswax')] під суворішим контролем, ніж личить будь-якій окремій гільдії, а його старшини жадають іще більшої підтримки. $nobles_estate$ тихо благають нас відмовити їм, побоюючись купецького об'єднання, надто могутнього, аби взагалі звітувати перед вічем."
  nov_ivan_hundred_strong_decision.a: "Вони отримають цілковиту підтримку віча."
  empower_ivan_hundred_privilege: "Протягом наступних 25 років привілей #TOOLTIP:ESTATE_PRIVILEGE,novgorod_ivans_hundred,X #L «Іванське сто»#!#! надаватиме такі ефекти:\n#R −5%#! до #TOOLTIP:MODIFIER_TYPE,global_crown_estate_power,X #P #V сили корони#!#! та #G +20%#! до #TOOLTIP:MODIFIER_TYPE,global_merchant_capacity_modifier,X #P #V купецьких засобів#!#!"
  ivan_hundred_strengthened_requirement: "Наступний бонус можна отримати завдяки [decision|e] «$nov_ivan_hundred_strong_decision.title$»:"
  variable_ivan_hundred_strengthened_tt: "#TOOLTIP:ESTATE_PRIVILEGE,novgorod_ivans_hundred,X #L Іванське сто#!#! посилилося"
  ivan_hundred_strengthened: "«Іванське сто» посилено"
  nov_ivan_hundred_beeswax_decision.title: "«Іванське сто» вимагає монополію на бджолиний віск"
  nov_ivan_hundred_beeswax_decision.desc: "Здобувши додаткову підтримку віча, #TOOLTIP:ESTATE_PRIVILEGE,novgorod_ivans_hundred,X #L «Іванське сто»#!#! тішиться своїм зрослим становищем. Прагнучи домогтися ще більшої прихильності до своїх задумів, об'єднання попросило виключну монополію на виробництво #TOOLTIP:GOODS,beeswax,X #L бджолиного воску#!#! у Новгороді. Хоча об'єднання завжди мало великий вплив на торгівлю цим крамом, монополія остаточно закріпить їхній повний контроль над ним."
  nov_ivan_hundred_beeswax_decision.a: "Задовольнимо їхнє прохання щодо більшого впливу на торгівлю бджолиним воском."
  nov_ivan_hundred_beeswax_decision.b: "Ми не дозволимо, щоб «Іванське сто» стало ще сильнішим."
  ivan_hundred_beeswax_increase: "Протягом наступних 25 років привілей #TOOLTIP:ESTATE_PRIVILEGE,novgorod_ivans_hundred,X #L «Іванське сто»#!#! надаватиме такі ефекти:\n#G +10%#! до #TOOLTIP:MODIFIER_TYPE,selling_efficiency,X $tt_op_P$$tt_op_V$справності продажу$tt_cl_3$ та #G +25%#! до #TOOLTIP:MODIFIER_TYPE,global_beeswax_output_modifier,X #P #V обсягу видобутку бджолиного воску#!#!"
  ivan_hundred_beeswax_increase_requirement: "Наступний бонус можна отримати завдяки [decision|e] «$nov_ivan_hundred_beeswax_decision.title$»:"
  ivan_hundred_beeswax: "Значний вплив на торгівлю бджолиним воском"
  kbo_serfdom_reform_decision.title: "Продовження людоловства"
  kbo_serfdom_reform_decision.desc: "Господарство континенту багато в чому тримається на припливі невільників і визиску підневільної праці, і наша країна — не виняток. Постійні набіги, у яких бере участь наше військо та місцеві польові ватажки, забезпечують наші ринки новими невільниками, праця яких іде на пожиток усьому нашому суспільству. Проте ми вже вклали чимало в такі виправи й захопили незліченно бранців, тому нині маємо вирішити: чи продовжувати споряджати військо й постачати на невільничі торги дедалі більше люду з підкорених країв, чи краще надати цим людям гідне становище в суспільстві й дозволити їм стати його повноправною частиною."
  kbo_serfdom_reform_decision.a: "Торгівля невільниками — підвалина нашого господарства."
  kbo_serfdom_reform_decision.b: "Ми долучимо всіх цих людей до нашого суспільства."
  kbo_pop_promotion_more_potent_tt: "Ми отримаємо доступ до унікального доручення [Concept('cabinet', 'раді')|e] — #TOOLTIP:CABINET_ACTION,kbo_pop_promote_action,X #L рівноправного долучення#!#!"
  kbo_amenokal_salt_traders_decision.title: "Азалай і Таґламт"
  kbo_amenokal_salt_traders_decision.desc: "Відколи в Західній та Центральній Африці приручили верблюдів, купці впродовж століть торували шляхи Азалай і Таґламт: попри вороже довкілля, їх незмінно вабила можливість здобути великий зиск. Ці сміливці, знані як аменокалі, здатні наглядати за цими шляхами й переходити пустелю від оази до оази, сполучаючи далекі землі та везучи #TOOLTIP:GOODS,salt,X #L сіль#!#! — один із найкоштовніших товарів нашої доби. На ринках сіль у брилах чи брусках можна виміняти на харчі, худобу та інший корисний крам. Чи варто передати у відання цих могутніх купців усю торгівлю сіллю? Аби розв'язати цю тонку справу, нам знадобиться поміч довірених радників."
  kbo_amenokal_salt_traders_decision.a: "Дозволимо караванним аменокалям заправляти торгівлею."
  kbo_sharia_courts_decision.title: "$sharia$ у країні $KBO$."
  kbo_sharia_courts_decision.desc: "Наша велика країна рано й стрімко прийняла #TOOLTIP:RELIGION,$sunni_tt$,X #L сунітський#!#! іслам. Озброївшись нестримною енергією та новонабутим завзяттям щирих вірян, ми зробили все можливе задля утвердження наших духовних цінностей і захисту нашого люду від повсюдних язичників. Втім, склалося так, що ми досі не повною мірою дотримуємося приписів шаріату. Якщо ми триматимемося законів віри, викладених у цьому збірнику, це може позначитися на справності нашої влади, а також на тому, як її сприйматиме народ. Багато наших радників виступають за впровадження засад шаріату, проте дехто вважає, що не варто змішувати політику та віру."
  kbo_sharia_courts_decision.a: "Ухвалення законів шаріату стане для нас кроком уперед!"
  kbo_enable_sharia_courts_cabinet_action_tt: "Ми отримаємо доступ до унікального доручення [Concept('cabinet', 'ради')|e] — запровадження #TOOLTIP:CABINET_ACTION,kbo_sharia_courts,X #L шаріатських судів#!#!"
  teu_kulm_law_revised_decision.title: "Перегляд $kulm_law$"
  teu_kulm_law_revised_decision.desc: "#TOOLTIP:SITUATION,black_death,X #L Чорна смерть#!#! пронеслася всією #TOOLTIP:CONTINENT,europe,X #L Європою#!#!, спустошивши її міста та села. Для земель під назвою [ROOT.GetCountry.GetLongName] це обернулося ще й тим, що збезлюдніла Німеччина перестала давати достатньо поселенців для заселення #TOOLTIP:AREA,prussia_area,X #L Пруссії#!#!. Якщо ми не знайдемо нових способів залучити людей на [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]і землі, весь наш задум християнізації цього краю опиниться під загрозою."
  teu_kulm_law_revised_decision.desc.entry: "[ShowSituationName('black_death')] настільки прорідила Німеччину, що для вирушання на схід лишилося мало переселенців, а наш лад у [ShowAreaName('prussia_area')] залежить від їхнього безперервного плину. Пом’якшення умов оселення вартує поступок, які ми воліли б зберегти, проте порожнє порубіжжя нікого не наверне."
  teu_kulm_law_revised_decision.a: "Надамо більше привілеїв колоністам."
  teu_kulm_law_revised_decision.b: "Доведеться із цим змиритися."
  teu_impact_on_kulm_law: "[ShowEstatePrivilegeName('kulm_law')] буде змінено таким чином:\n#g +0,1#! [ShowModifierTypeName('rural_migration_attraction')]\n#r -10,0%#! [ShowModifierTypeName('burghers_estate_max_tax')]"
  teu_impact_on_kulm_law_not_revised: "[ShowEstatePrivilegeName('kulm_law')] буде змінено таким чином:\n#r -50,0%#! [ShowModifierTypeName('german_migration_attraction_modifier')]\n#g +10,0%#! [ShowModifierTypeName('global_pop_assimilation_speed_modifier')]"
  kulm_law_revised_tooltip: "#TOOLTIP:ESTATE_PRIVILEGE,kulm_law,X #L Кульмське право#!#! переглянуто під час [Concept('event', 'події')|e] «$teu_kulm_law_revised_decision.title$»."
  kulm_law_not_revised_tooltip: "#TOOLTIP:ESTATE_PRIVILEGE,kulm_law,X #L Кульмське право#!#! під час [Concept('event', 'події')|e] «$teu_kulm_law_revised_decision.title$» залишено без змін."
  bra_kreditwerk_reformed_decision.title: "Реформувати $bra_kreditwerk$"
  bra_kreditwerk_reformed_decision.desc: "Попри новонабуті повноваження, Кредитверк не зумів гідно розпорядитися нашими фінансами, а його заборгованість уже вражає уяву. Оскільки банкрутство Кредитверка неминуче, нам слід вирішити, яке майбутнє на нього чекає. Думки радників розділилися: дехто радить перебудувати Кредитверк і передати його під безпосереднє відання корони, а дехто радить і зовсім скасувати цю установу."
  bra_kreditwerk_reformed_decision.a: "Реформуємо Кредитверк і передамо його короні."
  bra_kreditwerk_reformed_decision.b: "Кредитверк — це зло. Позбудьмося його."
  bra_kreditwerk_reformed_decision.c: "Викупимо його та дозволимо продовжувати діяльність."
  boh_unity_brethren_decision.title: "Підтримати Общину чеських братів"
  boh_unity_brethren_decision.desc: "За останні роки #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситських#!#! богослужінь наша віра розрослася, немов молоді пагони, і тепер плоди її рясно ростуть у кожному куточку нашої країни. Парафіяни приходять помолитися, взяти участь у церковних обрядах та очистити душу, заплямовану вченням заблукалих єретиків.\n\nПроте така набожність набула тривожного вигляду: дедалі частіше наше #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L духовенство#!#! починає тлумачити гуситське вчення у вкрай безкомпромісний спосіб. Вони проповідують про неприпустимість того, щоб знать і купці ставали священнослужителями, а також твердять, що обряди богослужіння мають бути простими й скромними, відкидаючи при цьому апостольське спадкоємство."
  boh_unity_brethren_decision.desc.entry: "Віра, що продовжує зростати, рано чи пізно переростає задум своїх засновників, і наша — не виняток. Дехто з-поміж $clergy_estate$ нині проповідує, що знаті та купцям геть немає місця в Церкві — вчення значно чистіше за те, з якого ми починали, але й куди руйнівніше."
  boh_unity_brethren_decision.a: "Нехай проповідують — у їхніх словах є істина."
  unity_brethren_privilege: "Братська єдність"
  unity_brethren_privilege_desc: "Радикальний #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситський#!#! рух. Його послідовники закликають до скромності та простоти під час церковних обрядів, як-от причастя, обстоюють уживання рідної мови як богослужбової та вважають, що [ShowEstateTypeName('burghers_estate')|l] і [ShowEstateTypeName('nobles_estate')|l] не повинні брати участі у справах віри."
  ara_sindicat_remenca_decision.title: "Селянська спілка"
  ara_sindicat_remenca_decision.desc: "The nobility in the [ROOT.GetCountry.GetLongName] has begun to strictly enforce the rules that tie peasants to the land, and this combined with a stricter enforcement of seignorial rights in general has led to unrest among the peasants. The poorest peasants strongly support open rebellion while the better off favor appealing to us for reforms and the end of seignorial abuses.\n\nIt would be an excellent opportunity to gain the support of the peasants, as we are in a constant power struggle with the nobility. Suggestions have been made regarding allowing the peasants to form a [ShowEstatePrivilegeName('ara_sindicat_remenca')], a peasants' guild or primitive trade union, which will grant them more liberty."
  ara_sindicat_remenca_decision.desc.entry: "У селянина, цілковито прикріпленого до землі, немає законного способу протистояти своєму сеньйорові — лише протиправний, і саме до протиправного опору нині схиляються найбідніші з них. Заснована грамотою спілка дає заможнішим селянам законний вихід, а нам купує їхню вірність проти знаті за вельми незначних витрат для корони."
  ara_sindicat_remenca_decision.a: "Дозволимо селянам заснувати власну спілку."
  ara_sindicat_remenca_decision.b: "Не зважатимемо на невігласів."
  ara_sindicat_remenca: "Селянська спілка"
  ara_sindicat_remenca_desc: "Селянська спілка — об’єднання сільських жителів, що нагадує робітничу спілку. Уперше з’явилося в 1448 році в Каталонії."
  nov_tysiatskii_influential_decision.title: "Старі тисяцькі"
  nov_tysiatskii_influential_decision.desc: "Хоч посада #TOOLTIP:ESTATE_PRIVILEGE,tysiatskii_privilege,X #L тисяцького#!#! при дворі #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! формально залишається виборною, насправді її загарба[ROOT.GetCountry.Custom('nobles_vlaloly')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]. Ба більше, останнім часом колишні тисяцькі почали впливати на вибори, прагнучи передати цю посаду своїм синам. Ці люди, відомі як #italic старі тисяцькі#!, мають значну владу на нашому вічі."
  nov_tysiatskii_influential_decision.desc.entry: "Виборна посада мало як стримує владу, якщо одні й ті самі родини раз у раз перемагають на виборах. #italic Старі тисяцькі#! нині скеровують голосування на користь своїх синів навіть після складання повноважень, і $nobles_estate$ тихо перетворила цю посаду на власну — по суті, якщо не за назвою."
  nov_tysiatskii_influential_decision.a: "Нам треба якось обмежити їхній вплив."
  nov_tysiatskii_influential_decision.b: "Спробуймо домогтися, щоб [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] втрати[ROOT.GetCountry.Custom('nobles_vlaloly')] частину свого впливу."
  nov_tysiatskii_influential_decision.b.entry: "Cпробуймо позбавити знать частини її впливу."
  nov_tysiatskii_influence_weakened: "Вплив тисяцьких ослаблено"
  nov_influential_tysiatskii: "Впливові тисяцькі"
  nov_tysiatskii_influence_weakened_benefits: "Протягом наступних 30 років привілей #TOOLTIP:ESTATE_PRIVILEGE,tysiatskii_privilege,X #L «Тисяцький»#!#! даватиме такі ефекти:\n#R −25%#! до #TOOLTIP:MODIFIER_TYPE,global_nobles_estate_power,X #P #V сили знаті#!#! та #G +0,1#! до #TOOLTIP:MODIFIER_TYPE,stability_investment,X #P #V видатків на стабільність#!#!"
  nov_tysiatskii_influence_event_happened: "Вплив тисяцьких посилився!"
  nov_tysiatskii_influence_event_happened_possible_event: "У майбутньому тисяцькі можуть спробувати підпорядкувати собі такий стан, як [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l]!"
  nov_influential_tysiatskii_benefits: "Протягом наступних 30 років привілей #TOOLTIP:ESTATE_PRIVILEGE,tysiatskii_privilege,X #L «Тисяцький»#!#! даватиме такі ефекти:\n#G +25%#! до #TOOLTIP:MODIFIER_TYPE,global_nobles_estate_power,X #P #V сили знаті#!#! та #G +15%#! до #TOOLTIP:MODIFIER_TYPE,army_infantry_power,X #P #V бойової міці піхоти#!#!"
  nov_influential_tysiatskii_requirement: "Цей бонус можна отримати завдяки [decision|e] «$nov_tysiatskii_influential_decision.title$»:"
  nov_tysiatskii_influence_weakened_requirement: "Цей бонус можна отримати завдяки [decision|e] «$nov_tysiatskii_influential_decision.title$»:"
  boh_district_paving_decision.title: "Права оподаткування кварталів [ShowLocationNameWithNoTooltip('prague')]"
  boh_district_paving_decision.desc: "#TOOLTIP:LOCATION,prague,X #L Прага#!#! невпинно розростається, і чимало видатних діячів, які нині очолюють ті чи інші квартали міста, як-от Мала Страна, починають вимагати від нас право стягувати податки з містян, що проживають на їхніх землях.\n\nЯкщо піти їм назустріч, наша скарбниця втратить чималу частку впливу, а #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#!, навпаки, здобуде його, тому вивчити це питання слід украй уважно."
  boh_district_paving_decision.a: "Добре, ми задовольнимо їхнє прохання."
  boh_joint_assembly_decrees_decision.title: "Спільні генеральні збори"
  boh_joint_assembly_decrees_decision.desc: "Відколи ми очолили #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священну Римську імперію#!#!, різниця між імперським та нашим власним звичаєм діловодства стала виразною як ніколи. Становище погіршується відмінностями в наших культурах та укладах — вони заважають нам відстоювати право на владу над імперією.\n\nЩоби [target_character.GetName] [Select_CString(target_character.IsFemale, 'змогла', 'зміг')] зміцнити своє становище на престолі, а люд наблизився до імперських порядків, радники запропонували започаткувати спільні генеральні збори. До них увійде дехто зі стану [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] та символічні представники всіх інших курфюрстів; крім того, ще раз буде підтверджено імперські закони, що закріплюють їхні привілеї."
  boh_joint_assembly_decrees_decision.desc.entry: "Врядування в $hre$ та врядування у власних землях — на практиці два різні завдання з двома відмінними збірками законів, і прірва між ними стає дедалі відчутнішою з кожним роком носіння обох корон. Спільні збори, де наша $nobles_estate$ засідала б нарівні з імперськими князями, підтвердили б римські закони, які вони цінують, — ціною того, що до них довелося б ставитися майже як до рівних."
  boh_joint_assembly_decrees_decision.a: "Тільки так ми забезпечимо собі право на владу."
  every_elector_25_opinion_tt: "Кожен курфюрст отримає [ShowBiasValue('granted_joint_assembly_decrees_modifier')|+=0] до думки про нас"
  ven_doges_palace_decision.title: "Розширення палацу дожів"
  ven_doges_palace_decision.desc: "Спорудження венеційського #TOOLTIP:BUILDING_TYPE,doges_palace,X #L палацу дожів#!#! розпочалося в IX столітті та тривало ще кілька століть. Спершу ця споруда нагадувала фортецю, однак із часом стала втілювати всю красу готичного зодчества. Призначення палацу — подвійне: крім того, що тут мешкає [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] — людина, якій підкоряється [GetCountry('VEN').GetLongNameWithNoTooltip], у будівлі також розміщені урядові установи та суди.\n\nЗ роками, втім, стає дедалі очевидніше, що палац зносився й потребує ґрунтовної відбудови. Можливо, настав час перетворити його на витвір мистецтва, здатний затьмарити навіть величні резиденції західних королів."
  ven_doges_palace_decision.desc.entry: "Палац, закладений як фортеця в IX столітті, став величним радше випадково, ніж за задумом, і це помітно. Перебудова [ShowBuildingTypeName('doges_palace')] на щось величніше за резиденції західних королів коштуватиме цілий маєток, який ми інакше витратили б на кораблі."
  ven_doges_palace_decision.a: "Розумна пропозиція!"
  ven_doges_palace_decision.historical_info: "До XVI століття палац дожів зазнав значних змін і розширень, що неабияк додало йому величі. Одним із найвизначніших досягнень під час перебудови стало завершення його славнозвісного фасаду, що виходив на Гранд-канал. Архітектурна велич фасаду впадала в око кожному, хто наближався до палацу водою. Ця доба оновлення та розширення закріпила статус палацу як непорушного символу могутності й влади Венеції. Його пишно оздоблені покої та зали не лише стали свідками століть політичного життя, а й слугували вагомим свідченням багатої історії міста та його ваги на світовій арені."
  ven_piazza_san_marco_decision.title: "[ShowBuildingTypeNameWithNoTooltip('piazza_san_marco')]"
  ven_piazza_san_marco_decision.desc: "[ROOT.GetCountry.GetFlavorRank|U] під нашою владою день у день стає дедалі впливовішим і багатшим, а тому виникла потреба вкласти кошти в розбудову столиці: [ShowLocationName('venice')] має стати дзеркалом нашої величі. Почати можна з перебудови #TOOLTIP:BUILDING_TYPE,piazza_san_marco',X #L площі Святого Марка#!#!. Наші зодчі готові оздобити її величними арками та мармуром, підкресливши цим пишноту морської держави. Місто стане ще прекраснішим, а народ знову переконається, що довкола немає рівних нашому впливу та культурі."
  ven_piazza_san_marco_decision.desc.entry: "Морська держава, що видається вбогою вдома, за кордоном багатою не здаватиметься. Перебудова площі перед палацом [ShowLocationName('venice')] у мармурі та арках витрачає гроші на те, чого не можна з’їсти, але здобуває повагу, яка відчиняє двері, зачинені для самих лише грошей."
  ven_piazza_san_marco_decision.a: "Ми профінансуємо оновлення."
  unlocked_piazza_san_marco_tt: "Ми відкрили [building|e] «$piazza_san_marco$» завдяки колоритному [decision|e]"
  ven_piazza_san_marco_decision.historical_info: "#italic П’яцца Сан-Марко#!, відома також як площа Святого Марка — головний громадський майдан Венеції, одна з головних її визначних пам’яток. Площа, закладена приблизно в IX столітті та розширена до сучасних розмірів у XII столітті, постійно вдосконалювалася, оновлювалася й обростала новими визначними спорудами. Її оточують такі славнозвісні будівлі, як базиліка Святого Марка, палац дожів і годинникова вежа Святого Марка. Майдан століттями слугував головним осередком зібрань у Венеції, де проводилися політичні, духовні та громадські заходи."
  ven_teatro_san_cassiano_decision.title: "[ShowBuildingTypeNameWithNoTooltip('teatro_san_cassiano')]"
  ven_teatro_san_cassiano_decision.desc: "[ShowLocationName('venice')] — справжня окраса та гордість #TOOLTIP:REGION,italy_region,X #L італійської#!#! культури: тут здавна живе безліч митців та акторів. Прихильники вищості венеційського мистецтва та свободи самовираження для її обдарованих синів і дочок почали закликати нас звести гідні нашого міста театр та оперу. [ShowBuildingTypeName('teatro_san_cassiano')] стане справжнім втіленням розкоші, багатства та геніальності Венеції, і відвідуватимуть його навіть чужинці з далеких країв."
  ven_teatro_san_cassiano_decision.desc.entry: "Місту, вже уславленому своїм мистецтвом, ніде показати найкраще з нього. Запропонований [ShowBuildingTypeName('teatro_san_cassiano')] дав би [ShowLocationName('venice')] сцену, гідну його слави, та дав би кожному портовому супернику ще один привід заздрити нам."
  ven_teatro_san_cassiano_decision.a: "Розпочнімо будівництво!"
  unlocked_teatro_san_cassiano_tt: "Ми відкрили [building|e] «$teatro_san_cassiano$» завдяки колоритному [decision|e]"
  ven_teatro_san_cassiano_decision.historical_info: "Театр Сан-Кассіано, зведений у Венеції в 1637 році — перший у світі публічний оперний театр. Його спорудження стало важливою віхою в історії виконавського мистецтва й зміцнило роль Венеції як провідного культурного осередку."
  ven_walls_of_ston_decision.title: "Укріплення Дубровника"
  ven_walls_of_ston_decision.desc: "[ShowLocationName('dubrovnik')] — великий торговий [target_location.GetRank.GetName|l], а водночас — одне з найважливіших володінь нашої морської держави. Саме тому нас пригнічує його слабка оборона: [ShowLocationNameWithNoTooltip('dubrovnik')] украй уразливий до нападу як із моря, так і із суходолу. Розумно буде виділити золото на зведення належних укріплень."
  ven_walls_of_ston_decision.desc.entry: "[ShowLocationName('dubrovnik')] приносить нам за один вдалий торговий сезон більше, ніж більшість наших провінцій заробляють за рік, а захопити його може загін розбійників, навіть не завдаючи собі клопоту справжньою облогою. Добрі мури варті золота, яке ми воліли б витратити на щось інше — аж до того дня, коли місто впаде без них."
  ven_walls_of_ston_decision.a: "[ShowLocationNameWithNoTooltip('dubrovnik')] слід надійно захистити."
  ven_walls_of_ston_decision.b: "Теперішні укріплення й так достатньо міцні."
  ven_walls_of_ston_decision.historical_info: "Фортечні мури Стона, зведені в XIV столітті — низка оборонних кам’яних мурів на півострові Пелешаць у Хорватії. Ці мури слугували для захисту важливих соляних промислів і міста Стон. Вони тяглися приблизно на 7 кілометрів і належали до найдовших фортифікацій у Європі, вирізняючись як своєю разючою довжиною, так і стратегічною вагою."
  zan_husuni_kubwa_decision.title: "[ShowBuildingTypeNameWithNoTooltip('husuni_kubwa')]"
  zan_husuni_kubwa_decision.desc: "[GetCharacter('zan_abu_al_mawahib_al_hasan_ibn_suleiman').GetName] — ось завдяки кому в самому серці [target_location.Custom('LR_GEN')|l] [target_location.GetName] розпочалося спорудження [ROOT.GetCountry.GetGovernment.GetAdjective|l]ої резиденції. Проте втілити задум щодо зведення найвеличнішого в державі палацу так і не вдалося: низка різних лих, перенаправлення вже виділених грошей на інші потреби, а згодом і хвороба замовника призвели до того, що спочатку будівництво затягнулося, а потім і зовсім припинилося. Втім, наші зодчі не падають духом — вони вже подали нам нові плани палацу, до якого збираються прибудувати різні комори та покої для зручності купців. Звісно ж, не можна обійтися без розкішної тронної зали. Залишається лише найдрібніше: гроші."
  zan_husuni_kubwa_decision.desc.entry: "Кожен правитель до нас прагнув добудувати цей палац, і кожен правитель до нас знаходив причину, чому це неможливо. Новий план для [ShowLocationName('kilwa_kisiwani')], з достатньою кількістю складів під стать нашій торгівлі та тронною залою, гідною прийому гостей, чекає лише грошей, яких бракувало й під час попередніх спроб."
  zan_husuni_kubwa_decision.a: "Розпочнімо будівництво."
  zan_husuni_kubwa_decision.b: "Зараз це нам не по кишені…"
  zan_husuni_kubwa_decision.historical_info: "Хусуні Кубва слугує символом архітектурної майстерності та політичного впливу султанату Кілва часів розквіту його могутності в XIV столітті. Зведений за султана Аль-Хасана ібн Сулеймана в Кілва-Кісівані, цей просторий палацовий комплекс займає 1,6 гектара та споруджений переважно з коралового каменю. Його архітектура є сумішшю суахілійських, ісламських та перських рис. У палаці були розкішні особисті покої, просторі двори, вишукані лазні та склади, що підкреслювало багатогранне значення палацу як монаршої резиденції, торгового осередку й укріплення."
  construct_the_building_at_another_time_tt: "Можливо, краще буде добудувати [ShowBuildingTypeNameWithNoTooltip('husuni_kubwa')] згодом…"
  unlocked_husuni_kubwa_tt: "Ми розблокували [Concept('building', 'споруду')|e] «Хусуні Кубва» в особливій [Concept('event', 'події')|e]"
  pap_quirinal_palace_decision.title: "Літня папська резиденція"
  pap_quirinal_palace_decision.desc: "[GetCountry('PAP').GetGovernment.GetRulerTitle] бажає заснувати нову літню резиденцію подалі від брудних і гамірних вулиць #TOOLTIP:LOCATION,rome,X #L Рима#!#!. Ідеальним місцем для будівництва міг би стати Квіринал — найвищий із семи пагорбів Рима, з якого відкривається чудовий краєвид на околиці. Якщо ми схвалимо цей задум, за проєктування та зведення резиденції відповідатиме наш досвідчений зодчий [fontana.GetName]."
  pap_quirinal_palace_decision.desc.entry: "Метушня осередку [ShowLocationName('rome')] — це саме те, чого папі варто уникати, а Квіринальський пагорб пропонує свіже повітря та краєвид без натовпу. $name_dominic$ $Fontana$ — зодчий, здатний це спорудити, якщо Святий Престол погодиться платити за другу резиденцію, без якої можна було б і обійтися."
  pap_quirinal_palace_decision.a: "Збудуймо літню резиденцію на Квіринальському пагорбі."
  pap_quirinal_palace_decision.b: "Зараз не час для зведення розкішних споруд."
  pap_quirinal_palace_decision.historical_info: "Квіринальський палац спорудили в 1583 році на замовлення папи Григорія XIII, і він став літньою папською резиденцією, що давала змогу відпочити від спеки й метушні центральних кварталів Рима. Над проєктом палацу працювали Доменіко Фонтана та інші визначні зодчі. Коли новостворене королівство Італія приєднало решту земель Папської держави, Квіринальський палац став резиденцією італійських королів."
  nav_camara_comptos_decision.title: "Камара-де-комптос"
  nav_camara_comptos_decision.desc: "Відання державними коштами — справа поважна, і [ROOT.GetCountry.GetGovernment.GetRuler.GetName] вважає, що [ROOT.GetCountry.GetLongName] тільки виграє, якщо ми створимо установу, що опікуватиметься такими справами.\n\n[GetCountry('FRA').GetLongName] вже має подібний досвід, і ми можемо скористатися ним, аби зміцнити власну господарську стабільність і ліпше долати грошові труднощі, які в нашому дражливому становищі просто неминучі."
  nav_camara_comptos_decision.desc.entry: "Скарбниця, якою керують на око, непогано дає собі раду в добрі роки й жорстоко підводить у лихі, а приклад $FRA$ показує, що постійна установа дає кращий лад в обох випадках. Створення власної означало б відмову від частини особистого розсуду володаря щодо скарбниці заради відомства, яке переживе увагу до нього будь-якого окремого правителя."
  nav_camara_comptos_decision.a: "Ми створимо нову установу."
  nav_camara_comptos_decision.historical_info: "До заснування Камара-де-комптос, тобто Рахункової палати, королівськими фінансами відали так звані #italic ойдори#! (від дієслова #italic oir#!, «чути»). Перша лічильна книга з’явилася в 1258 році, отже, на той час ця посада вже існувала. Згодом, надихнувшись французькими фінансовими установами, зокрема паризькою #italic Шамбр-де-компт#!, Карл II об’єднав ойдорів в окремий орган, що наглядав за видатками королівства та ради́в володарям у фінансових справах.\n\nЦя рахункова палата вважається найстарішою в Іспанії. Вона й досі діє при парламенті автономної спільноти Наварра."
  hun_bibliotheca_corviniana_decision.title: "[ShowBuildingTypeNameWithNoTooltip('bibliotheca_corviniana')]"
  hun_bibliotheca_corviniana_decision.desc: "Поки ідеї #TOOLTIP:INSTITUTION,renaissance,X #L Відродження#!#! поширюються континентом, мов лісова пожежа, роздмухуючи полум’я наукового та культурного оновлення, наші придворні щосили обговорюють нові обрії, а вчені, митці та мислителі, натхненні свіжими думками, вже сходяться до наших міст. Є пропозиція спорудити для них величну бібліотеку в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName], завдяки якій #ONCLICK:COUNTRY,[GetCountry('HUN').GetKey] #TOOLTIP:COUNTRY,[GetCountry('HUN').GetKey],X [GetCountry('HUN').Custom('CL_ACC')|L]#!#! вважатимуть справжнім оплотом Відродження. Втім, фінансування такого задуму коштуватиме вельми дорого. Чи слід нам вкладати кошти в спорудження #TOOLTIP:BUILDING_TYPE,bibliotheca_corviniana,X #L Бібліотеки Корвіна#!#!?"
  hun_bibliotheca_corviniana_decision.desc.entry: "Кожне місто, що претендує на першість у [ShowInstitutionName('renaissance')], уже збудувало щось на підтвердження цього, а $HUN$ — ще ні. Велична бібліотека в столиці привабила б учених, які зараз минають нас, — ціною, яку згодом буде легше виправдати, ніж сьогодні."
  hun_bibliotheca_corviniana_decision.a: "Пречудово!"
  hun_bibliotheca_corviniana_decision.b: "Нам це не по кишені."
  unlocked_bibliotheca_corviniana_tt: "Ми відкрили [building|e] «$bibliotheca_corviniana$» завдяки флавор-[decision|e]"
  hun_bibliotheca_corviniana_decision.historical_info: "Матяш Корвін, знаний як Король Відродження, опікувався мистецтвом і наукою: за його правління саме Угорщина стала першою країною за межами Італії, яка сприйняла ідеї Ренесансу. Визначальну роль у культурному відродженні Угорщини відіграла Бібліотека Корвіна — найважливіший осередок обміну знаннями та їх поширення всією країною. Вона приваблювала вчених з усієї Європи, які збагачували інтелектуальне розмаїття краю. Ставши справжнім символом угорського прагнення пізнавати світ, ця бібліотека унаочнила важливість опіки монарха над поступом науки та новацій."
  mam_ablaq_palace_decision.title: "Місто-цитадель [ShowLocationNameWithNoTooltip('cairo')]"
  mam_ablaq_palace_decision.desc: "[target_location.GetName] — осередок знань, освіти й торгівлі між #TOOLTIP:CONTINENT,africa,X #L Африкою#!#! та Середземномор’ям, — недарма називають серцем [ROOT.GetCountry.Custom('rank_ua_GEN')|l]. Ця цитадель тривалий час була надійним оплотом наших найвеличніших правителів. Тепер [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')|l] збирається втілити амбітний задум із розбудови цитаделі, що містить зведення нової мечеті-медресе, просторої зали для урочистих прийомів, а також майстерні з виготовлення кисви."
  mam_ablaq_palace_decision.desc.entry: "Цитадель, що приймала покоління правителів, усе ще можна уявити так, ніби вона приймала лише найвеличніших із них. Розширення її новою мечеттю-медресе, величнішою залою для прийомів і майстернею кісви сказало б про наше правління не менше, ніж будь-який похід, — до того ж значно меншою кров’ю."
  mam_ablaq_palace_decision.a: "Прекрасно."
  mam_ablaq_palace_decision.b: "Нам варто поберегти власні кошти."
  unlocked_ablaq_palace_tt: "Ми відкрили цю [building|e] завдяки [decision|e] «$mam_ablaq_palace_decision.title$»"
  son_trans_saharan_decision.title: "Розквіт торгівлі через Сахару"
  son_trans_saharan_decision.desc: "Завдяки тому, що ми встановили контроль над ключовими шляхами, торгівля через Сахару почала процвітати. Але не можна зупинятися на досягнутому — нам слід розвивати наші торгові аванпости в таких містах, як [ShowLocationName('alexandria')], [ShowLocationName('tunis')] та [ShowLocationName('fez')], оскільки вони слугують основними стоянками для наших караванів."
  son_trans_saharan_decision.a: "Нехай ці міста процвітають."
  son_trans_saharan_decision.b: "Замість окремих осередків краще розвивати торгівлю загалом."
  son_trans_saharan_decision.c: "Немає сенсу витрачати на це гроші."
  son_unlock_unique_buildings_in_alexandria_tunis_and_fez_tt: "Дозволяє споруджувати #TOOLTIP:BUILDING_TYPE,trans_saharan_trade_outposts,X #L торгові аванпости#!#! у #TOOLTIP:LOCATION,fez,X #L Фесі#!#!, #TOOLTIP:LOCATION,tunis,X #L Тунісі#!#! та #TOOLTIP:LOCATION,alexandria,X #L Александрії#!#!"
  son_conversion_west_africa_decision.title: "Навернення африканських країн"
  son_conversion_west_africa_decision.desc: "Хоча ми й найсильніша країна #TOOLTIP:REGION,guinea_region,X #L Гвінеї#!#!, у регіоні ще залишилися народи, які досі не прийняли #TOOLTIP:RELIGIONGROUP,muslim,X #L іслам#!#!. Звісно, ми могли б навернути їх силою, але [target_character.GetName] вважає, що ліпше скористатися дипломатією, аби не викликати гнів місцевого люду."
  son_conversion_west_africa_decision.desc.entry: "Меч не навертає нікого, хто пережив навернення, — він лише змушує замовкнути тих, хто міг би заперечити. Правитель волів би відрядити до [ShowRegionName('guinea_region')] місіонерів, а не вояків, обмінявши повільніше поширення віри на таке, після якого не лишається сіл, що димлять."
  son_conversion_west_africa_decision.a: "Це звучить розумно."
  son_conversion_west_africa_decision.b: "Краще застосувати силу."
  son_unlock_diplo_action_to_demand_conversion_tt: "Ми отримаємо доступ до [Concept('country_interaction', 'взаємодії з країною')|e] «[ShowCountryInteractionName('demand_conversion_to_islam')]» проти язичницьких країн #TOOLTIP:REGION,guinea_region,X #L Гвінеї#!#!"
  ori_elephant_hunting_grounds_decision.title: "Полювання на слонів"
  ori_elephant_hunting_grounds_decision.desc: "Через надлишок #TOOLTIP:GOODS,elephants,X #L слонів#!#!! у [ROOT.GetCountry.Custom('CL_PREP')] багато хто почав замислюватися про збільшення кількості полків, укомплектованих цими могутніми тваринами. Однак у наших #TOOLTIP:BUILDING_TYPE,elephant_hunting_grounds,X #L місцях полювання на слонів#!#! бракує засобів для вилову більшої кількості звірів та виробництва необхідного спорядження. Можливо, настав час довести ці угіддя до ладу. [target_character.GetName] та [ROOT.GetCountry.GetGovernment.GetCourtTitle] навіть готові вкласти в таке вдосконалення власні кошти."
  ori_elephant_hunting_grounds_decision.desc.entry: "Слон не приносить війську великої користі, доки його не впіймають, не навчать і не спорядять, а наші [ShowBuildingTypeName('elephant_hunting_grounds')] зараз ледве дають раду хоч із чимось із цього. Двір ладен витратити на розширення власні гроші, тож вибір залежить не так від грошей, як від того, чи відповідають додаткові бойові слони нашим теперішнім намірам."
  ori_elephant_hunting_grounds_decision.a: "Ми візьмемо цей задум на власний кошт."
  ori_elephant_hunting_grounds_decision.b: "Лише змарнуємо гроші."
  ori_double_elephant_hunting_ground_level_tt: "Максимальний рівень [Concept('building', 'споруд')|e] типу #TOOLTIP:BUILDING_TYPE,elephant_hunting_grounds,X #L «місця полювання на слонів»#!#! підвищиться на #G 2#!."
  INCREASED_MAX_LEVEL_ELEPHANT_HUNTING_GROUND: "Підвищення максимального рівня під час [Concept('events', 'події')|e]"
  jap_rangaku_decision.title: "Ранґаку"
  jap_rangaku_decision.desc: "З певного часу #L [target_country.GetAdjective|l]і#! купці облюбували острів Дедзіма у [target_location.Custom('LR_PREP')|l] [target_location.GetName]. Зв’язки нашого люду з цим анклавом суворо контролюються, однак культурний обмін усе одно триває. Схоже, [target_country.GetAdjectiveWithNoTooltip|l]і торговці мають глибші знання в науці, виробництві, машинобудуванні й особливо в медицині. Дехто із заможних підданих нашої країни не забажав довіритися місцевим лікарям і вдався до послуг [target_country.GetAdjectiveWithNoTooltip|l]ого хірурга з анклаву.\n\nВочевидь, нам є чого повчитися в гостей із Заходу, але для цього доведеться ризикнути й привідкрити цим чужинцям доступ до наших провінцій."
  jap_rangaku_decision.desc.entry: "Навіть за ретельно охоронюваною торговою факторією не втримати всі знання за зведеними для цього мурами, й анклав $NED_ADJ$ роками просочується до нас медициною, механікою та наукою. Послабивши нагляд, ми впустимо більше цього, поплатившись тією самою ізоляцією, яку він мав зберегти."
  jap_rangaku_decision.a: "Нехай [target_country.GetAdjectiveWithNoTooltip|l]і люди несуть просвіту до наших земель."
  jap_rangaku_decision.a.entry: "Відкрити наші провінції для знань $NED_ADJ$."
  jap_rangaku_decision.a.tt: "Відкриває доступ до [Concept('government_reform', 'державної реформи')|e] #TOOLTIP:GOVERNMENT_REFORM,jap_rangaku,X #L Ранґаку#!#!"
  jap_rangaku_decision.b: "Ми не впустимо чужинців до наших провінцій."
  mch_mandarin_language_reforms_decision.title: "За заповітами попереднього ладу"
  mch_mandarin_language_reforms_decision.desc: "Ми лише одна з гілок у родинному дереві божественних імператорів #TOOLTIP:SUB_CONTINENT,china,X #L Китаю#!#!. Різні династії до нас уже заснували справні урядові установи, щоби зберегти єдність величезної #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Серединної Держави#!#!. Чому б не перейняти цей порядок? Так ми станемо більш #TOOLTIP:SOCIETAL_VALUE,sinicized_vs_unsinicized,X #L китаїзованими#!#!, зате збережемо спадкоємність і зміцнимо свою владу в очах простого люду."
  mch_mandarin_language_reforms_decision.a: "Потрібно перейняти ці установи."
  mch_mandarin_language_reforms_decision.b: "Нехай [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')|l] бачать, що ми до них прихильні."
  mch_mandarin_language_reforms_decision.b.entry: "Підтримаймо племена."
  unlock_chinese_language_reforms: "Ця дія відкриє [Concept('government_reforms', 'державну реформу')|e] «[ShowGovernmentReformName('three_departments_system')]»."
  MCH_conditional_benefit: "Якщо ми не впровадимо [Concept('government_reforms', 'державну реформу')|e] «[ShowGovernmentReformName('three_departments_system')]», [ShowEstatePrivilegeName('mch_tribal_favor')|l] надасть додаткові переваги."
  pru_unified_legal_system_decision.title: "Правова реформа"
  pru_unified_legal_system_decision.desc: "Запорука виживання нашої країни — у вмінні пристосовуватися до змін. Зараз на її благо працює, не покладаючи рук, [target_character.GetName] — голова #italic камерального суду#!, людина, здатна очолити проведення таких необхідних реформ у правовому устрої. Його плани охоплюють #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! цілком, і якщо підтримати його в цьому починанні, реформи будуть швидкими й істотними."
  pru_unified_legal_system_decision.desc.entry: "Правовий устрій, успадкований від доброго десятка різних діб, не служить по-справжньому добре нікому, і зазвичай уже одного цього достатньо, щоби він пережив ще одне покоління без реформ. Президент #italic Кенігсберзької судової палати#! склав план, здатний це змінити, і, підтримавши його, ми візьмемо на себе зобов’язання провести реформу, повного вигляду якої поки не бачимо."
  pru_unified_legal_system_decision.a: "Підтримати реформи!"
  pru_unified_legal_system_decision.a_tt: "При [Concept('court', 'дворі')|e] з’явиться [Concept('character', 'персонаж')|e], що пропонує реформу"
  pru_unified_legal_system_decision.a.tt: "Поступ реформи значно пришвидшиться"
  pru_unified_legal_system_decision.b: "Приструнімо його."
  pru_unified_legal_system_decision.b.tt: "Поступ реформи значно сповільниться"
  boh_bohemian_commonwealth_decision.title: "Утворення Речі Посполитої"
  boh_bohemian_commonwealth_decision.desc: "На очах нашого роду #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! вдалося пройти шлях від малозначної країни до великої держави імперського розряду, яка посідає далеко не останнє місце у світовій політиці, а також править розлогими землями й численними народами. Однак завдання це непросте — для його здійснення потрібна тверда рука. Влада [ROOT.GetCountry.Custom('rank_ua_GEN')|l] побоюється зростання сепаратизму та напруги серед жителів, а тому дехто пропонує ухвалити нову конституцію, закликаючи залишити [ROOT.GetCountry.Custom('CL_ACC')] у минулому і натомість утворити повноцінну співдружність. Наша держава, що розкинулася на теренах #TOOLTIP:CONTINENT,europe,X #L Європи#!#!, неодмінно посяде належне їй місце серед сильних цього світу."
  boh_bohemian_commonwealth_decision.desc.entry: "Імперія, що виросла з невеликого королівства, досягла цього не тим, що поводилася з багатьма своїми народами як з єдиним цілим, і втримати їх разом тепер можна, лише визнавши нарешті, що це не так. Нова співдружність, ширша за ту, що споконвіку була нашою, ставить під загрозу саму самобутність, яка створила імперію, заради того, щоб не дати імперії розірватися по швах."
  boh_bohemian_commonwealth_decision.a: "Ухвалимо нову конституцію."
  ned_unified_dutch_admiralties_decision.title: "Заснування п’яти адміралтейств"
  ned_unified_dutch_admiralties_decision.desc: "Офіційно нашими землями править [target_character.GetName], однак між провінціями накопичилося чимало суперечностей, і представники #TOOLTIP:BUILDING_TYPE,admiralty,X #L адміралтейств#!#! не можуть дійти згоди. Поки [ShowLocationName('groningen')], [ShowLocationName('hoorn')], [ShowLocationName('rotterdam')], [ShowLocationName('middelburg')] та [ShowLocationName('amsterdam')] продовжують ворогувати, наш флот так і залишатиметься розрізненим. Проте, дозволивши військовим діяти незалежно, ми можемо домогтися від них більшої вірності центральній владі."
  ned_unified_dutch_admiralties_decision.desc.entry: "П’ять адміралтейств, підпорядкованих п’яти портам, — це п’ять флотів, що змагаються за одні й ті самі кораблі. Об’єднання [ShowLocationName('groningen')], [ShowLocationName('hoorn')], [ShowLocationName('rotterdam')], [ShowLocationName('middelburg')] та [ShowLocationName('amsterdam')] під єдиним командуванням поклало б край суперництву, хоча, дозволивши кожному ще деякий час дбати про власні справи, ми, можливо, матимемо від усіх п’яти більше, ніж від примусового злиття."
  ned_unified_dutch_admiralties_decision.a: "Нехай усе залишається як є."
  ned_unified_dutch_admiralties_decision.b: "Ми об’єднаємо адміралтейства."
  NED_UNLOCKS_UNIFIED_ADMIRALTIES_GOV_REFORM: "Відкриває [Concept('government_reform', 'державну реформу')|e] «[ShowGovernmentReformName('unified_admiralty_reform')]»."
  ned_unified_dutch_admiralties_decision.historical_info: "У роки Нідерландської революції, спрямованої проти династії Габсбургів, голландці створили конфедерацію, де кожна провінція зберігала певний ступінь незалежности. Однак патріоти та оранжисти продовжували воювати за контроль над провінціями, і країна залишалася глибоко розколотою. Цю систему скасували лише за часів Батавської республіки та правління Наполеона. Їй на зміну прийшло добре відоме нам Королівство Нідерландів."
  hol_ned_seven_provinces_decision.title: "Сім провінцій"
  hol_ned_seven_provinces_decision.desc: "Хоч Нідерланди й об’єднує спільна мета, ці землі залишаються розрізненими через правові та культурні відмінності. Проте ми можемо використати цю розрізненість собі на користь. Якщо ми створимо конфедерацію, де кожна провінція матиме окремі закони, але водночас підпорядковуватиметься єдиному центру, ми зможемо забезпечити нашим землям захист і процвітання та звернути увагу на зовнішні справи."
  hol_ned_seven_provinces_decision.a: "Ми створимо конфедерацію."
  hol_ned_seven_provinces_decision.b: "Самоврядність — не найкращий вибір."
  swe_age_of_freedom_decision.title: "Перегляд самовладдя"
  swe_age_of_freedom_decision.desc: "[ROOT.GetCountry.GetName|U] на межі катастрофи. [ROOT.GetCountry.GetGovernment.GetActiveRegentTitle|U] має стільки ж ворогів, скільки й прихильників, а нові клики, що підтримують чергового претендента, з’являються щодня наче з-під землі. На [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ий уряд чинять такий тиск з-за кордону, що ми перетворюємося з великої держави на маріонеткову країну, а піддані всіх станів відверто ремствують через задушливі лещата самовладдя.\n\nЯкщо [ROOT.GetCountry.GetGovernment.GetActiveRegentTitle|l] спробує втримати неподільну владу, це може стати фатальною помилкою. Та яке б рішення ми не ухвалили, нам доведеться зіткнутися із запеклим опором."
  swe_age_of_freedom_decision.desc.entry: "Регент, у якого вороги в кожному кутку королівства, насправді не править, а лише розбороняє сперечальників, і чужоземні двори помітили цю різницю так само ясно, як і наші піддані. Триматися за необмежену владу тепер означає ризикувати боротьбою, у наслідках якої ніхто з нас не може бути певен, який би шлях ми не обрали для відповіді на цей виклик."
  swe_age_of_freedom_decision.a: "Зречемося самовладдя."
  swe_age_of_freedom_decision.b: "Втримаємо віжки правління."
  swe_age_of_freedom_always: "Це обов’язкова реформа. Її не можна позбутися свідомо."
  swe_age_of_freedom_decision.historical_info: "Карл XII не залишив по собі спадкоємців, тому королевою стала його молодша сестра Ульріка Елеонора. Цим негайно скористався член риксдагу Арвід Горн — палкий прибічник повалення самовладдя та зміцнення влади парламенту, який зрештою домігся і того, і іншого. І хоча подібний демократичний нахил можна назвати похвальним, дії Горна призвели до настання в країні смути. На наступні пів століття Швеція стала безпорадною маріонеткою в руках інших держав. У добу свободи знать також зуміла повернути собі частину втрачених привілеїв. Юна королева, втім, не бачила іншого виходу, а тому вчинила так, аби не дратувати й без того втомлених від війни підданих."
  iro_iroquois_interactions_decision.title: "Спадщина Великого Миротворця"
  iro_iroquois_interactions_decision.desc: "Завдяки зусиллям Великого Миротворця Деганавіди колись розрізнені племена #TOOLTIP:CULTUREGROUP,haudenosaunee_group,X #L гауденосауні#!#! об’єдналися в конфедерацію. Поклавши край міжусобицям, вони стали єдиною родиною народів, що живе в мирі та злагоді. Проте тепер усе частіше лунає думка, що одне з племен має стати провідним і повести за собою решту. Таке рішення може похитнути самі підвалини, на яких Деганавіда заснував Конфедерацію гауденосауні."
  iro_iroquois_interactions_decision.a: "Часи змінюються."
  may_unify_haudenosaunee_confederation: "Відкриває #TOOLTIP:COUNTRY_INTERACTION,form_closer_bond_iroquois,X #L встановлення тісних зв’язків#!#! та #TOOLTIP:COUNTRY_INTERACTION,merge_tribe_iroquois,X #L злиття племен#!#! з іншими народами #TOOLTIP:CULTUREGROUP,haudenosaunee_group,X #L гауденосауні#!#!. Об’єднавши землі споріднених племен, ми зможемо утворити єдину Конфедерацію гауденосауні."