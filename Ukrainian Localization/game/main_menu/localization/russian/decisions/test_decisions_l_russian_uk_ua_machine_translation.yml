l_russian:
  test_decision_simple.title: "Тестове рішення (кілька варіантів)"
  test_decision_simple.desc: "Тестове рішення з трьома варіантами вибору. Використовується для перевірки того, що модель даних рішення працює належно, а ефект кожного вибору виконується від початку до кінця."
  test_decision_simple.a: "Взяти грошей (+10)"
  test_decision_simple.b: "Дати грошей (-10)"
  test_decision_simple.c: "Нічого не будемо робити."
  test_decision_only_once.title: "Тестове рішення (один раз за гру)"
  test_decision_only_once.desc: "Тестове рішення, яке можна ухвалити лише один раз за гру. Використовується для перевірки того, чи прапорець only_once зберігається під час перезавантаження збереження й не дає ухвалити рішення повторно."
  test_decision_only_once.a: "Отримати несподіваний прибуток (+50 од. грошей)"
  test_decision_only_once.b: "Відмовитися"