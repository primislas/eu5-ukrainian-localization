l_russian:
  test_decision_simple.title: "Тестове рішення (кілька варіантів)"
  test_decision_simple.desc: "Тестове рішення з трьома варіантами. Використовується для перевірки того, що модель даних рішень правильно розбирається і що ефект кожного варіанта відпрацьовує від початку до кінця."
  test_decision_simple.a: "Взяти гроші (+10)"
  test_decision_simple.b: "Віддати гроші (-10)"
  test_decision_simple.c: "Нічого не будемо робити."
  test_decision_only_once.title: "Тестове рішення (раз за гру)"
  test_decision_only_once.desc: "Тестове рішення, яке можна ухвалити лише раз за всю кампанію. Використовується для перевірки того, що прапорець «одноразовості» зберігається під час збереження/завантаження і не дозволяє ухвалити рішення повторно."
  test_decision_only_once.a: "Забрати несподіваний прибуток (+50 грошей)"
  test_decision_only_once.b: "Відмова"