l_russian:
  rule_player_difficulty: "Рівень складності для гравців"
  setting_player_very_easy_difficulty: "Дуже низький"
  setting_player_very_easy_difficulty_desc: "Найпростіший режим. Країни під керівництвом гравців отримають серйозні переваги."
  setting_player_easy_difficulty: "Низький"
  setting_player_easy_difficulty_desc: "Підійде для тих, кому до душі розслаблена гра. Країни під керівництвом гравців отримають низку переваг."
  setting_player_normal_difficulty: "Середній"
  setting_player_normal_difficulty_desc: "Збалансований режим. Країни під керівництвом гравців не мають переваг."
  setting_player_hard_difficulty: "Високий"
  setting_player_hard_difficulty_desc: "Режим для тих, у кого достатньо досвіду. Країни під керівництвом гравців матимуть низку недоліків."
  setting_player_very_hard_difficulty: "Дуже високий"
  setting_player_very_hard_difficulty_desc: "Найскладніший режим. Країни під керівництвом гравців матимуть серйозні недоліки."
  rule_ai_difficulty: "Рівень складності для комп'ютера"
  setting_ai_very_easy_difficulty: "Дуже низький"
  setting_ai_very_easy_difficulty_desc: "Найпростіший режим. На країни під керуванням комп'ютера будуть накладені обмеження. Вони виявлятимуть менше агресії до гравців."
  setting_ai_easy_difficulty: "Низький"
  setting_ai_easy_difficulty_desc: "Підійде для тих, кому до душі розслаблена гра. Країни під керуванням комп'ютера виявлятимуть менше агресії до гравців, ніж у складніших режимах."
  setting_ai_normal_difficulty: "Середній"
  setting_ai_normal_difficulty_desc: "Збалансований режим. Країни під керуванням комп'ютера однаково ставитимуться до всіх інших, незалежно від того, хто ними керує."
  setting_ai_hard_difficulty: "Високий"
  setting_ai_hard_difficulty_desc: "Режим для тих, у кого достатньо досвіду. Країни під керуванням комп'ютера отримають низку переваг і діятимуть агресивніше."
  setting_ai_very_hard_difficulty: "Дуже високий"
  setting_ai_very_hard_difficulty_desc: "Найскладніший режим. Країни під керуванням комп'ютера отримають серйозні переваги і діятимуть агресивніше."
  rule_ai_aggression: "Агресивність ШІ"
  setting_ai_low_aggression: "Низька агресивність"
  setting_ai_low_aggression_desc: "Підходить для розслабленої гри. Країни під керуванням комп'ютера починають [Concept('war', 'війни')|e] лише за наявності [Concept('casus_belli', 'приводу')|e]."
  setting_ai_normal_aggression: "Звичайна агресивність"
  setting_ai_normal_aggression_desc: "Звичайний ігровий режим. Країни під керуванням комп’ютера починають [Concept('war', 'війни')|e] за власним бажанням, часом навіть без [Concept('casus_belli', 'приводу')|e]."
  setting_ai_high_aggression: "Висока агресивність"
  setting_ai_high_aggression_desc: "Режим підвищеної складності. Країни під керуванням комп’ютера починають [Concept('war', 'війни')|e] з набагато більшою ймовірністю."
  rule_ahistorical_formable_countries: "Створювані країни"
  setting_no_ahistorical_formable_countries: "Тільки історичні"
  setting_no_ahistorical_formable_countries_desc: "Можна буде створювати тільки ті [Concept('formable_country_formed', 'країни')|e], які існували в реальності."
  setting_allow_plausible_ahistorical_formable_countries: "Дозволити можливі"
  setting_allow_plausible_ahistorical_formable_countries_desc: "Дозвольте створення неправдоподібних [Concept('formable_country_formation', 'країн')|e], які теоретично могли б виникнути."
  setting_allow_ahistorical_formable_countries: "Дозволити неправдоподібні"
  setting_allow_ahistorical_formable_countries_desc: "Можна створювати всі [Concept('formable_country_formed', 'країни')|e], зокрема неісторичні, що ламають атмосферу гри."
  rule_historical_ai: "Вибір під керуванням комп’ютера"
  setting_historical_ai_choices: "Історична достеменність"
  setting_historical_ai_choices_desc: "Країни під керуванням комп’ютера завжди робитимуть історично достеменний вибір під час [Concept('dynamic_historical_events', 'динамічних історичних подій')|e]."
  setting_weighted_ai_choices: "Ситуативний"
  setting_weighted_ai_choices_desc: "Вибір варіантів залежатиме від ситуації."
  setting_random_ai_choices: "Випадковий"
  setting_random_ai_choices_desc: "Країни під керуванням комп’ютера робитимуть абсолютно випадковий вибір."
  rule_mission_packs_enabled_rule: "Завдання"
  setting_mission_packs_enabled: "Завдання увімкнено"
  setting_mission_packs_enabled_desc: "Якщо обрати цей параметр, у нас буде доступ до всіх [Concept('missions', 'завдань')|e]."
  setting_mission_packs_disabled: "Завдання вимкнено"
  setting_mission_packs_disabled_desc: "Якщо обрати цей параметр, усі [Concept('missions', 'завдання')|e] будуть вимкнені, і ви не зможете їх виконати."
  rule_mission_rewards: "Нагороди за завдання"
  setting_every_task_reward: "За кожен етап"
  setting_every_task_reward_desc: "Кожен [Concept('mission_task', 'етап завдання')|e] дасть нагороду."
  setting_only_end_mission_rewards: "Лише за завершення завдання"
  setting_only_end_mission_rewards_desc: "Нагороди за [Concept('missions', 'завдання')|e] даються лише після їх завершення. За завершення [Concept('mission_tasks', 'етапів завдань')|e] нагороди не даються."
  setting_mission_no_rewards: "Без нагород"
  setting_mission_no_rewards_desc: "За завершення [Concept('missions', 'завдань')|e] ніколи не даються нагороди, що впливають на ігровий процес."
  rule_ai_colonisation_rule: "Колонізація під керуванням комп'ютера"
  setting_western_colonisation_only: "Лише західні країни"
