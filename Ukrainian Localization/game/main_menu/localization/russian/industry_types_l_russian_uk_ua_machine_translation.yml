l_russian:
  textiles: "Тканини"
  textiles_desc: "Усе, що стосується тканин та одягу — від простої вовни до вишуканого розкішного вбрання. Підтримка цієї галузі підвищує попит на тканини по всій країні та пришвидшує зростання кількості ткацьких і кравецьких майстерень в обраній області."
  crafts: "Ремесла"
  crafts_desc: "Особисте та цехове виробництво знарядь, сталевих і шкіряних виробів, а також кам’яне будівництво. Основа міських промислів."
  arms: "Зброя"
  arms_desc: "Виробництво холодної, а згодом і вогнепальної зброї. Розвинені збройові промисли дають змогу досягти незалежности в питаннях постачання війська."
  luxury: "Предмети розкоші"
  luxury_desc: "Виробництво скляних, золотарських, порцелянових і лакових виробів. Ці славетні промисли збагачують зайнятих у них містян."
  paper_goods: "Паперові вироби"
  paper_goods_desc: "Папірні та книжкові майстерні сприяють не лише збагаченню, а й поширенню грамотности."
  furnishings: "Хатнє начиння"
  furnishings_desc: "Меблі та посуд потрібні в кожному домі."
  naval: "Корабельні матеріали"
  naval_desc: "Дошки, парусина, дьоготь та інші матеріали, потрібні для спорудження й утримання флотів."
  beverages: "Хмільні напої"
  beverages_desc: "Вино, пиво та міцне хмільне. Спраглий ринок щедро винагороджує регіони, що виробляють цей крам."
  game_industry_type_struct: "$KEY_LOC$"
  game_industry_promotion_struct: "$KEY_LOC$"
  game_concept_industry_promotion: "Підтримка галузі"
  game_concept_industry_promotions: "Підтримка промислів"
  game_concept_promote_industry: "Підтримка промислу"
  game_concept_industry_promotion_desc: "Підтримка промислу закріплює одну [Concept('area', 'область')|e] за окремою галуззю промислів. Кожен промисел охоплює низку [Concept('goods', 'товарів')|e]: його підтримка збільшує [Concept('output', 'виробництво')|e] кожної [Concept('building', 'споруди')|e] в цій [Concept('area', 'області')|e], що виробляє ці [Concept('goods', 'товари')|e], а також підвищує попит ваших [Concept('pops', 'громад')|e] на них по всій [Concept('country', 'країні')|e].\n\nЩоб підтримувати промисел, потрібен [advance_icon][ShowAdvanceName('industry_promotion_advance')] [Concept('advance', 'поступ')|e]. Скільки промислів ви можете підтримувати одночасно, визначає показник $MODIFIER_TYPE_NAME_possible_industry_promotions$, що зростає разом із рангом вашої [Concept('country', 'країни')|e], [Concept('government_reforms', 'державними реформами')|e] та подальшими [Concept('advances', 'поступами')|e]. Підтримку можна будь-коли скасувати, щоб звільнити комірку."
  industry_promotion: "Підтримка галузі"
  PROMOTE_INDUSTRY_HEADER: "Підтримувані промисли"
  BROWSE_INDUSTRIES: "Переглянути промисли"
  BROWSE_INDUSTRIES_DESC: "Перегляньте всі промисли, які можна підтримати, а потім оберіть [Concept('area', 'область')|e] для розвитку промислу."
  INDUSTRY_STAT_AREA_TT_TITLE: "Цей промисел в області [Area.GetNameWithNoTooltip]"
  INDUSTRY_STAT_BUILDINGS_TT_TEXT: "[GetAreaIndustryLevels(InteractionTarget.GetArea, SelectInteractionTargetView.GetCurrentParams.GetTargetObjectFromFlag('target').GetIndustryType)|W0] [Concept('buildings_with_icon', 'споруд')|e] в області @area! [Area.GetName] зараз дають [GetAreaIndustryTaxBase(InteractionTarget.GetArea, SelectInteractionTargetView.GetCurrentParams.GetTargetObjectFromFlag('target').GetIndustryType)|+=2] [Concept('tax_base_with_icon', 'податкової бази')|e] та [GetAreaIndustryIncome(InteractionTarget.GetArea, SelectInteractionTargetView.GetCurrentParams.GetTargetObjectFromFlag('target').GetIndustryType)|+=2] [Concept('income_with_icon', 'доходу')|e]."
  INDUSTRY_SLOT_STATS_TT_TEXT: "Що ви виробляєте в області [IndustryPromotionSlot.GetAreaName] з [Concept('goods', 'товарів')|e] цього промислу:"
  BEST_CANDIDATE: "Найпродуктивніша область — [Area.GetNameWithNoTooltip]"
  BEST_CANDIDATE_DESC: "Зараз найпродуктивнішою [Concept('area_with_icon', 'областю')|e] для цієї категорії є [Area.GetName], яка приносить [GetAreaIndustryTaxBase(GetIndustryBestCandidateArea(InteractionTarget.GetIndustryType), InteractionTarget.GetIndustryType)|+=2] [Concept('tax_base_with_icon', 'податкової бази')|e] та [GetAreaIndustryIncome(GetIndustryBestCandidateArea(InteractionTarget.GetIndustryType), InteractionTarget.GetIndustryType)|+=2] [Concept('income_with_icon', 'доходу')|e] від загалом [GetAreaIndustryLevels(GetIndustryBestCandidateArea(InteractionTarget.GetIndustryType), InteractionTarget.GetIndustryType)|0W] [Concept('buildings_with_icon', 'споруд')|e]."
