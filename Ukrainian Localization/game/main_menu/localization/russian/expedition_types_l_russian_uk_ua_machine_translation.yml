  EXPEDITIONS_SUBTAB_ACTIVE_TT_TEXT: "Наші [expeditions|e], які зараз у дорозі, а також ті, що ми можемо відправити."
  EXPEDITIONS_SUBTAB_COMPLETED_TT_FLAVOR_TEXT: "Одні плавання повертаються з вантажем і мапами. Інші — з меншим числом людей, ніж вирушало в путь, та й того, що лишилося, значно менше."
