  SORT_EXPEDITION_CATEGORY: "Натисніть, щоб відсортувати [expedition|e] за категорією"
  SORT_EXPEDITION_END_DATE: "Натисніть, щоб відсортувати за датою завершення [expedition|e]"
  cape_route_to_india_expedition: "Морський шлях до Індії довкола Африки"
  cape_route_to_india_expedition_desc: "Відправте флот на південь уздовж африканського узбережжя та довкола великого південного мису, проклавши морський шлях до Островів прянощів в обхід усіх османських мит і венеційських посередників. Шлях цей суворий — два роки відкритого океану, незвіданих берегів і штормів, що розкидають кораблі, — але перша країна, яка відкриє його, володітиме світовою торгівлею прянощами."
  cape_route_to_india_expedition_high_morale_prestige_tt: "Високий бойовий дух команди збільшує здобуту славу"
  cape_route_to_india_expedition_historical_info: "Португальська виправа в пошуках морського шляху до $india$ стала підсумком майже століття поступових досліджень африканського узбережжя, що посувалися все далі на південь. Бартоломеу Діаш обігнув мис Доброї Надії в 1488 році, довівши, що такий шлях можливий. Плавання Васко да Гами в 1497–1499 роках завершило цю місію: виправа повернулася з вантажем перцю та прянощів, який окупився у шістдесят разів. Це плавання докорінно змінило світову торгівлю прянощами, зруйнувавши венеційську та османську монополію на суходільні шляхи."
  cape_route_to_india_expedition_low_morale_prestige_tt: "Низький бойовий дух команди зменшує здобуту славу"
  cargo: "Вантаж"
  cargo_desc: "Коштовний крам, завантажений під час плавання та проданий на ринку після повернення флоту."
  cartographic_survey_cooldown: "Знімання узбережжя"
  cartographic_survey_expedition: "Знімання узбережжя"
  cartographic_survey_expedition_desc: "Відправити корабель для знімання вздовж власного узбережжя, щоби нанести на мапу гавані, поміряти мілини та позначити небезпечні місця. Праця невдячна, але складені мапи слугуватимуть ціле покоління, а кожна майбутня виправа завдяки їм споряджатиметься дешевше та швидше."
  cartographic_survey_expedition_historical_info: "Систематичне знімання узбережжя по-справжньому почалося в шістнадцятому столітті, коли зростання морської торгівлі зробило точні мапи справою державної ваги. І #italic Каса-де-Контратасьйон#! у Севільї, і португальський #italic Армазен-да-Ґіне-і-Індія#! утримували офіційних картографів, чиїм завданням було складання й оновлення морських мап, а в сімнадцятому столітті їхній приклад наслідували нідерландські адміралтейства."
  circumnavigation_expedition_high_morale_prestige_tt: "Високий бойовий дух екіпажу збільшує здобуту славу"
  circumnavigation_expedition_low_morale_prestige_tt: "Низький бойовий дух екіпажу зменшує здобуту славу"
  clues: "Докази"
  clues_desc: "Наскільки близько виправа підійшла до того, щоби напевне вийти на слід реліквії. Починається з однієї-єдиної чутки та зростає або зменшується з кожною перевіреною зачіпкою. Якщо докази вичерпаються цілком, пошуки можуть припинитися."
  completed_expedition_name_text_filter_desc: "Відфільтрувати завершені [expeditions|e] за назвою."
  completed_expedition_name_text_filter_name: "Пошук за назвою виправи"
  connections: "Зв’язки"
  connections_desc: "Стосунки, зав’язані при дворах, відвіданих під час подорожі. Спадкоємець, який завершує подорож із більшим числом зв’язків, ніж будь-чого іншого, повертається [ShowTraitName('well_connected')]."
  custom_search_filter_expedition_category_name: "Тип виправи"
  discretion: "Скритність"
  discretion_desc: "Наскільки добре справжня мета делегації й особа правителя приховані від сторонніх очей. Понад 90 — двір вважає делегацію звичайними послами й нічого не підозрює. За 90 або менше господар уже дізнався, хто насправді подорожує серед них — чи то через просту підозру, чи то завдяки власній шпигунській мережі."
  expedition_name_text_filter_desc: "Відфільтрувати [expeditions|e] за назвою."
  expedition_name_text_filter_name: "Пошук за назвою виправи"
  experience_desc: "Практичний, безпосередній досвід, здобутий під час подорожі — майстерні, гавані та контори. Спадкоємець, який завершує подорож із більшим досвідом, ніж будь-чого іншого, повертається [ShowTraitName('worldly')]."
  grand_embassy_expedition: "Велике посольство"
  grand_embassy_expedition_desc: "Відправити правителя дворами Західної Європи під чужим ім’ям, щоб вивчити установи, військо та флот країн, які вже здійснили осучаснення. Делегація, представлена як монарша особа, здобуває бенкети та порожні почесті; та ж, що тримається в тіні, потрапляє до справжніх корабелень і креслярських майстерень. Утім, чутки ширяться швидко, і правитель, якого викрили занадто рано, застає двері вже зачиненими."
  grand_embassy_expedition_institution_spread_tt: "Просуває обраний інститут на [GetVariable('grand_embassy_institution_progress_amount')|V0] у всіх володіннях, де його немає, і на [GetVariable('grand_embassy_institution_progress_capital_amount')|V0] у столиці"
  grand_embassy_expedition_stalled_status: "Вивчення"
  grand_tour_expedition_desc: "Наш спадкоємець вирушить у довгу подорож величними містами регіону [ShowRegionName('italy_region')] — [ShowLocationName('florence')], [ShowLocationName('rome')], [ShowLocationName('venice')] та [ShowLocationName('naples')], — щоб учитися біля витоків інституту «[ShowInstitutionName('renaissance')]». Спадкоємець, який повернеться, — вже не та людина, що покинула нас. Усе, що він дізнається і від кого, сформує вдачу, з якою він зійде на престол."
  grand_tour_expedition_historical_info: "Гран-тур — звичай виряджати молодих європейських аристократів у довгу пізнавальну подорож Італією — поступово склався у п’ятнадцятому-шістнадцятому століттях і до сімнадцятого століття став усталеною практикою серед північноєвропейської знаті. Флоренція, Рим, Венеція та Неаполь складали класичний шлях, і кожне місто пропонувало те, чого бракувало північним дворам: гуманістичну вченість, класичну давнину, мистецтво ренесансної опіки та церемоніал найдавніших королівських дворів Європи. Від учасників очікували, що вони повернуться зміненими, готовими до державних справ і дипломатії так, як цього не могли навчити домашні наставники."
  gt_diligence: "Старанність"
  gt_diligence_desc: "Здатність спадкоємця мати користь із подорожі, що визначається його показниками [ability|e] на мить відбуття. Більш старанний спадкоємець бере більше від того, чого вчить мандрівка."
  guards: "Охоронний конвой"
  guards_desc: "Збройна охорона каравану. Зростає під час найму варти або носіння #italic махмалю #! дорогою, але зменшується від набігів та злигоднів шляху. Добре охоронюваний караван із більшою ймовірністю переживе напад."
  hajj_caravan_cooldown: "Королівський хадж"
  hajj_caravan_expedition: "Королівський хадж"
  hajj_caravan_expedition_desc: "Відправити нашого правителя у паломництво до [ShowLocationName('mecca')], виконуючи один із п’яти стовпів ісламу. Шлях далекий, а подорож коштовна, проте правитель, який повернувся зі священного міста, здобуває авторитет, якого не дасть жодне військо."
  hajj_caravan_expedition_historical_info: "Аббасидський халіф Гарун ар-Рашид здійснював паломництво з Багдада дев’ять разів за час свого правління (786–809), навіть долаючи частину шляху пішки на знак благочестя, і його відданість стала взірцем, який побожні правителі прагнули наслідувати багато століть потому."
  holy_site_pilgrimage_cooldown: "Паломництво до святині"
  holy_site_pilgrimage_expedition: "Паломництво до святині"
  holy_site_pilgrimage_expedition_desc: "Наш правитель вирушає до однієї обраної святині — щоб помолитися, щоб його бачили в молитві та щоб повернутися зі славою й релігійною валютою, що їх приносить ця подорож. Починається дією паломництва, а не через список виправ."
  holy_site_pilgrimage_expedition_order_zeal_tt: "На довгі роки вперед благочестя паломників у цьому володінні розпалюватиме завзяття ордену, який його утримує"
  hunt_retinue: "Почет"
  hunt_retinue_desc: "Охорона виправи, перекладач та вчений супутник. Сам собою не зменшується, але якщо вичерпається вщент, виправа розпадеться, а пошуки завершаться невдачею."
  knowledge: "Знання"
  knowledge_desc: "Знання, здобуті завдяки теоретичним заняттям під час мандрівки — бібліотекам, лекціям і товариству вчених. Спадкоємець, який завершив мандрівку з перевагою знань над іншим, повертається [ShowTraitName('free_thinker')]."
  mining_survey_cooldown: "Розвідка нагір’я"
  mining_survey_expedition: "Розвідка нагір’я"
  mining_survey_expedition_desc: "Відправити загін рудознавців і пробників у наші нагірні землі, щоб вони пройшли руслами струмків, обстукали молотком виходи порід і перевірили каміння на наявність дорогоцінних металів. Ці гори вже не раз віддавали свої багатства, і здобуте ціною чималої праці знання старого рудокопа варте року придворних пересудів."
  mining_survey_expedition_historical_info: "Систематична розвідка надр практикувалася по всій середньовічній і ранньомодерній Європі, найбільш відомо — у Рудних горах Саксонії та Богемії, де відкриття срібних жил у дванадцятому столітті породило такі міста-одноденки, як Фрайберг, Яхимов і Шнеєберг. #italic Про гірничу справу#! Георгія Агріколи (1556) стало основним підручником цього ремесла, докладно описуючи використання лозошукацьких прутів, пробірний аналіз зразків руди в невеликих тиглях і правові звичаї, що регулюють заявку прав на родовища."
  modernization_desc: "Накопичений делегацією поступ у засвоєнні західних методів. Кожен вивчений урок додається до нього, і що більше його правитель привезе додому, то більшою буде нагорода після завершення посольства."
  morale: "Бойовий дух екіпажу"
  morale_desc: "Настрій екіпажу. Низький бойовий дух загрожує бунтом."
  num_ships_desc: "Кораблі, які ще залишаються у флоті. Якщо не залишиться жодного, виправа загине."
  opportunities: "Можливості"
  opportunities_desc: "Скільки доступу делегації було надано для навчання при цьому конкретному дворі. Встановлюється наново на кожній зупинці, залежно від того, наскільки відкрито правитель вирішив там представитися."
  pacific_crossing_expedition: "Пошук торнавіахе"
  pacific_crossing_expedition_desc: "Відправити флот із нашого тихоокеанського узбережжя в Америці на пошуки #italic торнавіахе#! — надійного зворотного шляху крізь найбільший океан на землі. Пасати легко несуть корабель на захід, до Азії; пливти додому проти них не вдавалося нікому, і доки зворотний шлях не торовано, наші колонії та багатства Островів Прянощів лишаються недосяжними. Перша країна, що знайде шлях додому, зв’яже Америку з Азією та відкриє галеонну торгівлю через Тихий океан."
  pacific_crossing_expedition_high_morale_prestige_tt: "Високий бойовий дух команди збільшує здобуту славу"
  pacific_crossing_expedition_historical_info: "Повернення на схід — #italic торнавіахе#! — було великим нерозв’язаним завданням раннього періоду освоєння Тихого океану. Альваро де Сааведра, який відплив із Нової Іспанії, був двічі відкинутий пасатами в 1528 та 1529 роках і загинув під час цієї спроби; виправа Руя Лопеса де Вільялобоса в 1542 році також досягла Азії, але не змогла знайти шлях додому. Лише в 1565 році відкрили надійний зворотний шлях, а доти флот міг дістатися Азії, проте ніколи не міг привезти назад свій вантаж."
  pacific_crossing_expedition_low_morale_prestige_tt: "Низький бойовий дух команди зменшує здобуту славу"
  piety_desc: "Наскільки благочестиво проходить проща. Поступово спадає під час подорожі та витрачається на мирські рішення дорогою. Якщо благочестя вичерпається вщент, проща обернеться ганьбою; якщо ж зберігати його на високому рівні, це збільшить підсумкові нагороди прощі."
  provisions: "Харчі"
  provisions_desc: "Їжа та вода на час мандрівки. Поступово витрачаються в дорозі, а їхня нестача ставить під загрозу всю команду."
  relic_expedition_cooldown: "Пошуки реліквії"
  retinue: "почет"
  retinue_desc: "Супровід правителя-прочанина. Сам собою не зменшується — лише через лиха в дорозі. Якщо почет буде втрачено повністю, правитель опиниться у смертельній небезпеці, а проща зазнає невдачі."
  splendor_desc: "Наскільки щедро споряджений і прикрашений караван. Зростає від марнотратних витрат та показу багатства, але зменшується від бур і злигоднів подорожі. Визначає нагороду каравану після прибуття до [ShowLocationNameWithNoTooltip('mecca')]."
  treasure_fleet_cooldown: "Флот скарбів"
  treasure_fleet_expedition: "Флот скарбів"
  treasure_fleet_expedition_desc: "Відправити імператорський флот скарбів у державне плавання до обраного регіону. Флот прямує прибережними морськими шляхами до місця призначення й назад, заходячи дорогою до чужоземних портів. Плавання посилює дипломатичний вплив двору, підносить дари та [ShowGoodsName('silk')] правителям південних морів, збирає данину і повертається з рідкісним крамом, послами й іменами володарів, які почули звук китайського вітрила."
  western_ocean_voyage_cooldown: "Плавання до Західного океану"
  western_ocean_voyage_expedition: "Плавання до Західного океану"
  western_ocean_voyage_expedition_desc: "Відправити флот на захід через відкриту Атлантику в пошуках морського шляху до Індії. Жодна мапа не підкаже, що лежить за [ShowAreaName('canary_islands_area')] — лише вітер, вода та надія, що океан вужчий, ніж вважають учені."
  western_ocean_voyage_expedition_historical_info: "Ідея дістатися Азії, пливучи на захід, обговорювалася європейськими вченими десятиліттями, перш ніж відбулося перше таке плавання. Головною перешкодою була не форма землі, яку освічені люди вважали кулястою, а її розмір. Більшість учених слушно вважали, що океан надто широкий, щоб його перетнути. Виправи, які довели їхню неправоту, зробили це не спростуванням розрахунків, а виявленням на шляху дечого несподіваного."
  holy_site_pilgrimage_expedition_outcome_overview: "$BULLET$Прибуття до обраної [Concept('holy_site', 'святині')|e] дає винагороду залежно від нашої [Concept('religion', 'віри')|e]:\n$BULLET_WITH_TAB$#G +10#! [Concept('religious_influence', 'духовного впливу')|e], [Concept('purity', 'чистоти')|e] або [Concept('karma', 'карми')|e], що масштабується залежно від відстані від нашої столиці аж до #G +100#!.\n$BULLET_WITH_TAB$[ShowReligionGroupAdjective('folk_peruvian_group')]і віросповідання натомість зміщують [Concept('yanantin', 'янантін')|e] на #Y 20#! у бік суті [Concept('god', 'божества')|e] цієї [Concept('holy_site', 'святині')].\n$BULLET_WITH_TAB$Відповідні [ShowReligionGroupAdjective('muslim')|l]і вчення зміщуються ще на #Y 10#! у бік засад «[ShowSocietyDirectionName('mysticism')]» або «[ShowSocietyDirectionName('jurisprudence')]»."
  treasure_fleet_expedition_outcome_overview: "$BULLET$Флот вирушає з вантажем дарунків, оплачених із нашої скарбниці.\n$BULLET$У разі безпечного повернення все невитрачене стає [Concept('gold', 'грішми')|e], а також дає #G +10#! [Concept('prestige', 'слави')|e].\n$BULLET$Кожен чужоземний двір також реагує по-своєму:\n$BULLET_WITH_TAB$Двір, який нас добре приймає, додатково надає #G +5#! [Concept('prestige', 'слави')], може приєднатися до #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Серединної Країни#!#! як наш данник, а також надсилає данину й рідкісні дарунки, які збагачують наш [Concept('market', 'ринок')|e].\n$BULLET_WITH_TAB$Двір, який відмовляється від статусу данника, натомість погіршує [Concept('opinion', 'думку')|e] між нами на #R -50#! і отримує модифікатор «[ShowModifier('chi_resisting_subjugation')]»."
  western_ocean_voyage_expedition_outcome_overview: "$BULLET$Під час плавання виправа наносить на мапу відкритий океан, відкриваючи досягнуті береги.\n$BULLET$Висадка на суходіл дає:\n$BULLET_WITH_TAB$#G +10#! [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$#G +10#! [Concept('legitimacy', 'права на владу')|e].\n$BULLET_WITH_TAB$Ще #G +20#! [Concept('prestige', 'слави')] за відкриття Америки, що відкриває Новий Світ для майбутньої колонізації."
  hajj_caravan_expedition_religious_influence_bullet: "$BULLET_WITH_TAB$#G +20#! [religious_influence|e].\n"
  hajj_caravan_expedition_outcome_overview: "$BULLET$Прибуття до Мекки винагороджує пишноту каравану, даючи до:\n$BULLET_WITH_TAB$#G +20#! [Concept('prestige', 'слави')|e].\n[SelectLocalization(RELIGION.HasReligiousInfluence, 'hajj_caravan_expedition_religious_influence_bullet', '')]$BULLET$Повернення додому дає:\n$BULLET_WITH_TAB$#G +10#! [Concept('legitimacy', 'права на владу')|e].\n$BULLET_WITH_TAB$5-річний [Concept('modifier', 'модифікатор')|e] «[ShowModifier('hajj_pious_return')]».\n$BULLET_WITH_TAB$Постійну почесть «[ShowModifier('hajji_pilgrim')]» за перший хадж [Concept('ruler', 'правителя')|e].\n$BULLET$Караван має дістатися Мекки впродовж того самого року, коли вирушив, інакше проща буде повністю змарнована."
  cape_route_to_india_expedition_outcome_overview: "$BULLET$Кожна зупинка вздовж африканського узбережжя дозволяє заснувати #TOOLTIP:BUILDING_TYPE,por_feitoria,X #L фейторію#!#! або, у вільній гавані, #TOOLTIP:BUILDING_TYPE,por_trading_post,X #L купецьку осаду#!#! і здобути пряме володіння [Concept('location', 'місцевістю')|e], кожен варіант із власним тривалим торговим [Concept('modifier', 'модифікатором')|e].\n$BULLET$Прибуття до місцевости [ShowLocationName('kozhikode')] надає «[ShowModifier('calicut_trade_rights')]» і трюм #TOOLTIP:GOODS,pepper,X #L перцю#!#!, проданого за ринковою ціною за [Concept('gold', 'гроші')|e].\n$BULLET$Завершення шляху дає:\n$BULLET_WITH_TAB$#G +20#! [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$#G +10#! [Concept('legitimacy', 'права на владу')|e].\n$BULLET_WITH_TAB$Постійний [Concept('modifier', 'модифікатор')] «[ShowModifier('cape_route_pioneer')]» або натомість «[ShowModifier('portuguese_african_network')]» чи «[ShowModifier('east_africa_trade_dominance')]», якщо засновано три або п’ять фейторій."
  grand_tour_expedition_outcome_overview: "$BULLET$Кожне відвідане місто примножує знання, зв’язки або досвід залежно від зробленого вибору та дає [Concept('research_progress', 'поступ досліджень')|e] за час, проведений у навчанні, або [Concept('legitimacy', 'право на владу')|e] за час, проведений при дворі.\n$BULLET$Відвідання щонайменше трьох величних міст Італії дає:\n$BULLET_WITH_TAB$Рису «[ShowTraitName('free_thinker')]», «[ShowTraitName('well_connected')]» або «[ShowTraitName('worldly')]», залежно від того, яка виявилася найвищою.\n$BULLET_WITH_TAB$Постійний [Concept('modifier', 'модифікатор')|e] «[ShowModifier('returned_from_grand_tour')]».\n$BULLET_WITH_TAB$#G +10#! [Concept('prestige', 'слави')|e].\n$BULLET$Коротше турне дає лише #G +5#! [Concept('prestige', 'слави')] і жодної [Concept('trait', 'риси')|e]."
  grand_embassy_expedition_outcome_overview: "$BULLET$Те, наскільки потайно подорожує посольство, визначає, як довго його справжня мета лишатиметься прихованою від кожного господаря, і як зреагує двір, коли про все довідається.\n$BULLET$Кожен відвіданий двір дає низку нагод перейняти його досвід, а випадкові зустрічі на шляху можуть розвинути власні здібності правителя, поглибити осучаснення чи зменшити обачність.\n$BULLET$Після завершення посольства накопичене осучаснення прискорює поступ [Concept('institutions', 'інституцій')|e] в кожній нашій місцевості (у столиці сильніше, ніж в інших), підвищує [Concept('army_tradition', 'військовий хист')|e] і, якщо було відвідано бодай один порт, [Concept('navy_tradition', 'морський хист')|e].\n$BULLET$Двір, який відвертає посольство, позбавляє [Concept('prestige', 'слави')|e]; той, що приймає його або до кого звернулися з проханням про ширший доступ, винагороджує [Concept('prestige', 'славою')|e] та новими нагодами."
  pacific_crossing_expedition_outcome_overview: "$BULLET$Прокладання зворотного шляху через #TOOLTIP:CONTINENT,pacific_ocean_continent,X #L Тихий океан#!#! дає:\n$BULLET_WITH_TAB$#G +100#! [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$#G +15#! [Concept('legitimacy', 'права на владу')|e].\n$BULLET_WITH_TAB$Тривалий [Concept('modifier', 'модифікатор')|e] торгового шляху.\n$BULLET_WITH_TAB$#TOOLTIP:GOODS,cloves,X #L Гвоздику#!#!, зібрану в області [ShowAreaName('moluccas_area')], продану за ринковою ціною за [Concept('gold', 'гроші')|e].\n$BULLET_WITH_TAB$Постійний доступ до [Concept('decision', 'рішення')|e] «[ShowDecisionName('charter_manila_galleon')]», яке можна ухвалювати раз на п’ять років заради чималого прибутку в [Concept('gold', 'грошах')].\n$BULLET$Флот, який так і не знайде дороги додому, не здобуде нічого."
  cartographic_survey_expedition_outcome_overview: "$BULLET$Кожен досліджений [Concept('port', 'порт')|e] може залишити тривалий [Concept('location_modifier', 'модифікатор місцевости')|e] на 10–20 років, що збільшує виробництво одного з товарів, як-от #TOOLTIP:GOODS,fish,X #L риби#!#!, #TOOLTIP:GOODS,pearls,X #L перлів#!#! чи #TOOLTIP:GOODS,amber,X #L бурштину#!#!, або поліпшує саму гавань, а також приносить [Concept('prestige', 'славу')|e].\n$BULLET$Дослідження трьох або більше портів додатково дає:\n$BULLET_WITH_TAB$15-річний [Concept('modifier', 'модифікатор')|e] «[ShowModifier('accurate_charts')]».\n$BULLET_WITH_TAB$#G +10#! [Concept('prestige', 'слави')].\n$BULLET$Дослідження меншої кількості приносить лише #G +5#! [Concept('prestige', 'слави')]."
  mining_survey_expedition_outcome_overview: "$BULLET$Кожне дослідження залишає 20-річний [Concept('modifier', 'модифікатор')|e] «[ShowModifier('thorough_survey')]», що підвищує видобуток сировини по всій країні.\n$BULLET$Кожне відкрите родовище також залишає багаті поклади, як-от «[ShowModifier('rich_silver_vein')]» чи «[ShowModifier('rich_gold_strike')]», і може розроблятися відкрито заради [Concept('prestige', 'слави')|e] чи потай заради [Concept('gold', 'грошей')|e].\n$BULLET$Це також дає:\n$BULLET_WITH_TAB$#G +10#! [Concept('prestige', 'слави')] за два чи більше відкритих родовищ.\n$BULLET_WITH_TAB$#G +5#! за будь-яку досліджену височину."