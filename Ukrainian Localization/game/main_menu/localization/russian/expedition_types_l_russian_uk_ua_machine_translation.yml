  expedition_category_commercial: "Торгова"
  expedition_category_military: "Військова"
  expedition_category_religious: "Віросповідна"
  expedition_category_diplomatic: "Посольська"
  bermuda_test_expedition: "Виправа на Бермудські острови"
  bermuda_test_expedition_desc: "Спорядити атлантичну виправу на пошуки Бермудських островів."
  pilgrimage_expedition: "Велике паломництво"
  pilgrimage_expedition_desc: "Наш правитель вирушить у паломництво до святих місць #TOOLTIP:RELIGION,$catholic_tt$,X $tt_op_L$католицької$tt_cl_2$ віри, відпливши від берегів #TOOLTIP:REGION,great_britain_region,X $tt_op_L$Британії$tt_cl_2$ до Гробу Господнього в #TOOLTIP:LOCATION,jerusalem,X $tt_op_L$Єрусалимі$tt_cl_2$."
  pilgrimage_expedition_historical_info: "Паломники-християни почали вирушати до Єрусалима з IV століття, коли імператор Костянтин доручив збудувати храм Гробу Господнього на місці поховання й воскресіння Христа. Під час хрестових походів місто неодноразово переходило з рук у руки. У 1099 році його захопили учасники Першого хрестового походу. У 1187 році воно стало здобиччю Саладіна. У 1229 році, за Фрідріха II, Єрусалим ненадовго повернувся під контроль християн, після чого остаточно перейшов під владу мамлюків. Попри втрату християнського панування, святі місця залишалися доступними для паломників завдяки дипломатичним домовленостям. Так Єрусалим став головним осередком католицького паломництва в усьому середньовічному світі."
  pilgrimage_expedition_outcome_overview: "$BULLET$Кожна [Concept('holy_site', 'святиня')|e], яку відвідує наш [Concept('ruler', 'правитель')|e], дарує після прибуття власну нагороду: [Concept('legitimacy', 'право на владу')|e], [Concept('prestige', 'славу')|e] або вдячність духовенства.\n$BULLET$Завершення паломництва надає за кожне відвідане святе місце:\n$BULLET_WITH_TAB$#G +5#! [Concept('legitimacy', 'права на владу')|e].\n$BULLET_WITH_TAB$[Concept('estate_satisfaction', 'Задоволення стану')|e] #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L духовенства#!#!.\n$BULLET_WITH_TAB$Покращена [Concept('opinion', 'думка')|e] про країну [GetCountry('PAP').GetName]."
  holy_site_pilgrimage: "Паломництво до святого місця"
  holy_site_pilgrimage_desc: "Наш [Concept('ruler', 'правитель')|e] вирушає в паломництво до обраної [Concept('holy_site', 'святині')|e], щоб помолитися, зокрема при свідках, і повернутися з подорожі зі [Concept('prestige', 'славою')|e] та шаною набожної людини. Вихідною точкою слугує саме паломництво, а не план виправи."
  holy_site_pilgrimage_outcome_overview: "$BULLET$Прибуття до обраної [Concept('holy_site', 'святині')|e] дарує нагороду, яка залежить від нашої [Concept('religion', 'віри')|e]:\n$BULLET_WITH_TAB$#G Від +10 одиниць#! [Concept('religious_influence', 'впливу віри')|e], [Concept('purity', 'чистоти')|e] або [Concept('karma', 'карми')|e]. Їхня кількість може сягати #G +100#! залежно від відстані до нашої столиці.\n$BULLET_WITH_TAB$[ShowReligionGroupAdjective('folk_peruvian_group')]і віросповідання замість цього змінюють свій янантин на #Y 20#! у бік сутности [Concept('god', 'бога')|e], який опікується [Concept('holy_site', 'святинею')|e].\n$BULLET_WITH_TAB$Відповідні #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламські#!#! духовні вчення схиляються на #Y 10#! одиниць до #TOOLTIP:SOCIETAL_VALUE,mysticism_vs_jurisprudence,X #L містицизму#!#! або #TOOLTIP:SOCIETAL_VALUE,mysticism_vs_jurisprudence,X #L ісламського права#!#!."
  pining_expedition: "Вояж Пінінга"
  pining_expedition_desc: "Виправте невелику флотилію з #TOOLTIP:CULTURE,$danish_tt$,X #L данського#!#! порту на північ і захід у незвідані води Атлантики, заходячи до #TOOLTIP:AREA,shetland,X #L Шетландії#!#!, #TOOLTIP:AREA,iceland_area,X #L Ісландії#!#!, покинутих норвезьких поселень на узбережжі #TOOLTIP:AREA,greenland_area,X #L Гренландії#!#! та до лісистого берега, про який оповідають саги. Якщо капітани повернуться з доказом того, що бачили цей західний берег, корона отримає шлях через північну Атлантику, якого не має жодна інша країна."
  pining_expedition_historical_info: "Близько 1473 року Дідрік Пінінг, капер-німець на службі данської корони, отримав від Крістіана I наказ очолити виправу на захід через північну частину Атлантичного океану. У ті часи виправа офіційно не документувалася, і те небагато, що про неї відомо, взято з пізніших згадок у ганзейському листуванні та нотатках португальського космографа Мартіна Бегайма про те, що Пінінг та його поплічник Ганс Поторст дісталися узбережжя, розташованого далеко на захід від Гренландії. Данія так і не здійснила подальших досліджень після цієї виправи. Відсутність будь-яких згадок про неї в офіційних джерелах століттями живила суперечки про те, що ж насправді виявили капітани, якщо взагалі щось виявили."
  pining_expedition_outcome_overview: "$BULLET$Кожен новий рубіж шляху приносить додаткову [Concept('prestige', 'славу')|e].\n$BULLET$Остаточна нагорода залежить від того, як далеко зайшла виправа:\n$BULLET_WITH_TAB$#G +5#! за досягнення однієї лише #TOOLTIP:AREA,iceland_area,X #L Ісландії#!#!.\n$BULLET_WITH_TAB$#G +10#! за досягнення #TOOLTIP:AREA,greenland_area,X #L Гренландії#!#!.\n$BULLET_WITH_TAB$#G +20#! за вихід до #TOOLTIP:AREA,gaspe,X #L Гаспе#!#!, що також назавжди відкриває виправу $western_ocean_voyage$ для країни [GetCountry('DAN').GetName]."
  treasure_fleet: "Золотий флот"
  treasure_fleet_desc: "Виправте імператорський золотий флот у плавання до обраного регіону в державних справах. Флот прямує прибережними морськими шляхами до місця призначення і назад, заходячи дорогою до портів чужих земель. Це плавання розширює дипломатичний вплив двору, дає змогу роздати дарунки та шовк володарям південних морів, зібрати данину й повернутися з рідкісним крамом, послами та іменами королів, які познайомилися зі звуком китайського вітрила."
  treasure_fleet_outcome_overview: "$BULLET$Флот вирушає з вантажем дарунків, оплачених нашою скарбницею.\n$BULLET$Якщо виправа повернеться неушкодженою, всі залишки дарунків стануть [Concept('gold', 'грішми')|e], а ви отримаєте #G +10#! одиниць [Concept('prestige', 'слави')|e].\n$BULLET$Кожен чужоземний двір також реагує по-своєму:\n$BULLET_WITH_TAB$Двір, де нас зустріли гідно, дасть додаткові #G +5#! одиниць [Concept('prestige', 'слави')|e]. Така країна може навіть погодитися стати даником #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Серединної держави#!#! і почне надсилати данину та рідкості, які збагатять наш [Concept('market', 'ринок')|e].\n$BULLET_WITH_TAB$Якщо країна відмовиться від нашої пропозиції стати даником, вона отримає стан [ShowModifier('chi_resisting_subjugation')], а наша [Concept('opinion', 'думка')|e] про неї погіршиться на #R -50#! одиниць."
  danish_india_expedition: "Індійський чартерний флот"
  danish_india_expedition_desc: "Відправте флот, зафрахтований Данською Ост-Індською компанією, на південь уздовж узбережжя Африки, повз мис Доброї Надії та через #TOOLTIP:CONTINENT,indian_ocean_continent,X #L Індійський океан#!#! до багатих земель Індії, щоб домогтися торгової концесії. Подорож буде тривалою, а флот — невеликим, але зиск лише від однієї укріпленої торгової факторії в Індії буде сумірним із витратами."
  danish_india_expedition_historical_info: "Данська Ост-Індська компанія (#italic Dansk Ostindisk Kompagni#!) була заснована Крістіаном IV у 1616 році. Уже в 1618 році її перша виправа під командуванням адмірала Ове Ґедде вийшла з порту Копенгагена. Після тяжкого дворічного плавання, в якому більша частина екіпажу загинула від цинги та інших хвороб, виправа дісталася Коромандельського узбережжя і домовилася з правителем Танджора про торгову концесію в селі Тарангамбаді (пізніше англізованому як Транкебар). Укріплена торгова факторія Дансборг була збудована в 1620 році й залишалася данською до 1845 року, коли колонію продали британцям. Отже, Транкебар став одним із найдовговічніших європейських поселень в Індії."
  danish_india_expedition_outcome_overview: "Повернення неушкодженими забезпечить #G +10#! одиниць [Concept('prestige', 'слави')|e]. Весь вантаж #TOOLTIP:GOODS,livestock,X #L худоби#!#!, #TOOLTIP:GOODS,salt,X #L солі#!#!, #TOOLTIP:GOODS,goods_gold,X #L золота#!#!, #TOOLTIP:GOODS,ivory,X #L слонової кістки#!#!, #TOOLTIP:GOODS,coffee,X кави#! та #TOOLTIP:GOODS,pepper,X #L перцю#!#!, зібраний під час виправи, буде проданий за [Concept('gold', 'гроші')|e] і доправлений на [Concept('market', 'ринок')|e] нашої столиці. Якщо двір [ShowLocationName('karaikal')]а дасть нам дозвіл, у нашої країни з’явиться там #TOOLTIP:BUILDING_TYPE,trade_office,X #L торгова контора#!#!."
  el_dorado_expedition_outcome_overview: "$BULLET$Процес пошуку Ельдорадо забезпечує сталий приплив [Concept('prestige', 'слави')|e].\n$BULLET$Результат залежить від кількости знайдених слідів:\n$BULLET_WITH_TAB$Нічого не знайдено: #R -10#! одиниць [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$Знайдено один слід або більше: #G +10#! одиниць [Concept('prestige', 'слави')|e], [Concept('gold', 'гроші')|e] і постійний [Concept('location_modifier', 'модифікатор місцевости')|e] «[ShowModifier('el_dorado_discovered')]» на місці міста.\n$BULLET_WITH_TAB$Знайдено п’ять слідів або більше: #G +20#! одиниць [Concept('prestige', 'слави')|e] та ще більше [Concept('gold', 'грошей')|e].\n$BULLET$Усі багатства, екзотичний крам та зібрані під час пошуків артефакти доправляються на наш [Concept('market', 'ринок')|e], а найкращі з них стають [Concept('work_of_art', 'витворами')|e]."
  fountain_of_youth_expedition_outcome_overview: "$BULLET$Процес пошуку джерела забезпечує сталий приплив [Concept('prestige', 'слави')|e].\n$BULLET$Результат залежить від кількості знайдених слідів:\n$BULLET_WITH_TAB$Нічого не знайдено: #R -5#! одиниць [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$Знайдено один слід або більше: #G +10#! одиниць [Concept('prestige', 'слави')|e] і постійний [Concept('location_modifier', 'модифікатор місцевості')|e] «[ShowModifier('fountain_of_youth_discovered')]».\n$BULLET_WITH_TAB$Знайдено п’ять слідів або більше: #G +20#! одиниць [Concept('prestige', 'слави')|e].\n$BULLET$Усі води, знайдені під час виправи, дають модифікатор «[ShowModifier('rejuvenating_waters_modifier')]» і подовжують тривалість життя наших [Concept('ruler', 'правителя')|e] та [Concept('heir', 'спадкоємця')|e]. Також до нашого двору як новий [Concept('character', 'персонаж')|e] може приєднатися тубілець-лікар."
  city_of_caesars_expedition_outcome_overview: "$BULLET$Процес пошуку забезпечує сталий приплив [Concept('prestige', 'слави')|e].\n$BULLET$Результат залежить від кількості знайдених слідів:\n$BULLET_WITH_TAB$Нічого не знайдено: #R -5#! одиниць [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$Знайдено один слід або більше: #G +10#! одиниць [Concept('prestige', 'слави')|e], [Concept('gold', 'гроші')|e] і постійний [Concept('location_modifier', 'модифікатор місцевості')|e] «[ShowModifier('city_of_caesars_discovered')]» на місці міста.\n$BULLET_WITH_TAB$Знайдено чотири сліди або більше: #G +20#! одиниць [Concept('prestige', 'слави')|e] і ще більше [Concept('gold', 'грошей')|e].\n$BULLET$Усі багатства, зібрані під час пошуку, доправляються на наш [Concept('market', 'ринок')|e], а найкращі артефакти стають [Concept('work_of_art', 'витворами')|e]."
  western_ocean_voyage: "Подорож до Західного океану"
  western_ocean_voyage_desc: "Виправте флот на захід відкритими водами Атлантичного океану в пошуках морського шляху до Індії. Коли [ShowAreaName(„canary_islands_area“)] залишаться позаду, наші мапи стануть марними. З нами зостануться лише вітер, вода та надія на те, що океан усе ж не такий широкий, як вважають учені."
  western_ocean_voyage_historical_info: "Думка дістатися Азії, вирушивши морем на захід, обговорювалася європейськими вченими впродовж десятиліть до першої спроби такої подорожі. Головною перешкодою була навіть не форма Землі, яку освічені люди вже вважали кулястою, а її розмір. Більшість учених слушно вважали, що океан занадто широкий, і доходили висновку, що перетнути його неможливо. Довести їхню неправоту вдалося лише завдяки несподіваним відкриттям, які здійснили виправи на своєму шляху."
  western_ocean_voyage_outcome_overview: "$BULLET$Під час виправи складаються мапи відкритого моря та нових берегів.\n$BULLET$Прибуття дає:\n$BULLET_WITH_TAB$#G +10#! одиниць [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$#G +10#! одиниць [Concept('legitimacy', 'права на владу')|e].\n$BULLET_WITH_TAB$Ще #G +20#! одиниць [Concept('prestige', 'слави')|e] можна здобути за відкриття Америки, яке стане першим кроком на шляху до колонізації Нового Світу."
  hajj_caravan: "Королівський хадж"
  hajj_caravan_desc: "Виправте нашого [Concept('ruler', 'правителя')|e] у хадж — це п’ятий і обов’язковий стовп ісламу. Це дуже довга й коштовна подорож, але правитель, який повернувся з паломництва до Мекки, має такий авторитет, якого не забезпечить жодне військо."
  hajj_caravan_historical_info: "За час свого правління (786–809 рр.) аббасидський халіф Гарун ар-Рашид дев’ять разів здійснював паломництво з Багдада, до того ж частину шляху він долав пішки на знак благоговіння. Його набожність стала зразком, який упродовж багатьох століть намагалися наслідувати благочестиві правителі."
  hajj_caravan_outcome_overview: "$BULLET$Відвідання #TOOLTIP:LOCATION,mecca,X #L Мекки#!#! підвищує авторитет правителя:\n$BULLET_WITH_TAB$до #G +20#! од. [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$до #G +20#! од. [Concept('religious_influence', 'релігійного впливу')|e].\n$BULLET$Після повернення каравану додому:\n$BULLET_WITH_TAB$#G +10#! од. [Concept('legitimacy', 'права на владу')|e].\n$BULLET_WITH_TAB$[modifier|e] «[ShowModifier('hajj_pious_return')]» строком на 5 років.\n$BULLET_WITH_TAB$Постійний модифікатор «[ShowModifier('hajji_pilgrim')]» на честь першого хаджу [Concept('ruler', 'правителя')|e].\n$BULLET$Караван має дістатися Мекки того ж року, коли вирушив у дорогу, інакше паломництво не відбудеться."
  circumnavigation_expedition: "Навколосвітнє плавання"
  circumnavigation_expedition_desc: "Виправте флот на захід у спробі обігнути всю земну кулю — пройти на південь від Ріо-де-ла-Плати, минути протоку на краю землі, перетнути безіменний океан і дістатися Островів Прянощів — а потім повернутися додому, обігнувши мис Доброї Надії. Жодному мореплавцеві ще не вдавалося здійснити подібне. Ніхто не знає, чи це взагалі можливо."
  circumnavigation_expedition_historical_info: "У вересні 1519 року Фернан Магеллан покинув Санлукар-де-Баррамеду, щоб відшукати західний шлях до Островів Прянощів для іспанської корони. До складу виправи входили п’ять кораблів: #italic Тринідад#!, #italic Сан-Антоніо#!, #italic Консепсьйон#!, #italic Вікторія#! та #italic Сантьяго#!. Магеллан був португальським мореплавцем, він плавав до Індії та на Молуккські острови, але перейшов на службу до іспанської корони після того, як король Мануел I відмовився підвищити йому платню. Ця виправа ввійшла в історію як перша навколосвітня подорож, хоча самому Магеллану не судилося повернутися додому."
  circumnavigation_expedition_outcome_overview: "$BULLET$Перша країна, яка здійснить навколосвітнє плавання, отримує:\n$BULLET_WITH_TAB$#G +100#! од. [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$#G +10#! од. [Concept('legitimacy', 'права на владу')|e].\n$BULLET_WITH_TAB$[modifier|e] «[ShowModifier('first_circumnavigation')]».\n$BULLET$Подальші плавання приносять:\n$BULLET_WITH_TAB$#G +10#! од. [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$Додатково #G +10#! од., якщо щонайменше 3 кораблі безпечно повернулися до рідної гавані.\n$BULLET_WITH_TAB$#G +5#! од., якщо команда зберігає добрий настрій.\n$BULLET_WITH_TAB$[ShowGoodsName('cloves')], зібрана на #TOOLTIP:AREA,moluccas_area,X #L Молуккських островах#!#!, буде продана за [Concept('gold', 'гроші')|e] за ринковою ціною."
  cape_route_to_india: "Шлях до Індії через мис Доброї Надії"
  cape_route_to_india_desc: "Виправте флот на південь уздовж берега Африки, обігніть великий Південний мис і прокладіть морський шлях до Островів Прянощів в обхід османських зборів та венеційських посередників. Плавання має бути суворим — два роки у відкритому океані, незвідані береги та люті бурі. Проте країна, яка першою відкриє цей шлях, отримає владу над світовою торгівлею прянощами."
  cape_route_to_india_historical_info: "Португальська виправа з пошуку морського шляху до Індії стала наслідком майже ста років поступового просування на південь уздовж африканського узбережжя. У 1488 році Бартоломеу Діаш обігнув мис Доброї Надії, довівши, що шлях до Індії можливий. Плавання Васко да Ґами у 1497–1499 роках завершило почате — його кораблі повернулися додому з вантажем перцю та прянощів, вартість виправи окупилася в шістдесят разів. Ця подорож докорінно змінила світову торгівлю прянощами, поклавши край венеційсько-османській монополії на суходільні торгові шляхи."
  cape_route_to_india_outcome_overview: "$BULLET$Під час кожної зупинки вздовж узбережжя Африки може бути заснована #TOOLTIP:BUILDING_TYPE,por_feitoria,X #L фейторія#!#!. Якщо зупинка відбудеться в нічийній гавані, [Concept('location', 'місцевість')|e] буде захоплено й засновано #TOOLTIP:BUILDING_TYPE,por_trading_post,X #L португальську факторію#!#!. В обох випадках надається тривалий [Concept('modifier', 'модифікатор')|e] торгівлі.\n$BULLET$Прибуття до #TOOLTIP:LOCATION,kozhikode,X #L Кожикоде#!#! дає модифікатор «[ShowModifier('calicut_trade_rights')]», а також вантаж #TOOLTIP:GOODS,pepper,X #L перцю#!#!, який буде продано за [Concept('gold', 'гроші')|e] за ринковою ціною.\n$BULLET$Завершення плавання дає:\n$BULLET_WITH_TAB$#G +20#! од. [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$#G +10#! од. [Concept('legitimacy', 'права на владу')|e].\n$BULLET_WITH_TAB$Постійний [Concept('modifier', 'модифікатор')] «[ShowModifier('cape_route_pioneer')]», або модифікатори «[ShowModifier('portuguese_african_network')]» чи «[ShowModifier('east_africa_trade_dominance')]», якщо засновано три або п’ять фейторій."
  grand_tour: "Ґранд-тур"
  grand_tour_desc: "На спадкоємця престолу чекає тривала подорож величними містами #TOOLTIP:REGION,italy_region,X #L Італії#!#!. Він відвідає #TOOLTIP:LOCATION,florence,X #L Флоренцію#!#!, #TOOLTIP:LOCATION,rome,X #L Рим#!#!, #TOOLTIP:LOCATION,venice,X #L Венецію#!#! та #TOOLTIP:LOCATION,naples,X #L Неаполь#!#!, щоби пізнавати науки біля самого витоку #TOOLTIP:INSTITUTION,renaissance,X #L Відродження#!#!. Додому він повернеться іншою людиною — характер майбутнього правителя формуватиметься під впливом італійських наставників та набутих знань."
  grand_tour_historical_info: "Ґранд-тур, або Велика подорож — започаткований у XV–XVI століттях звичай виряджати знатну європейську молодь задля здобуття освіти в тривалу мандрівку Італією. До XVII століття цей звичай став обов’язковою частиною виховання в аристократичних колах Північної Європи. Класичний шлях пролягав через Флоренцію, Рим, Венецію та Неаполь. Ці міста могли дати молодим людям те, чого так бракувало на півночі: гуманітарні науки, спадщину античності, мистецтво Ренесансу та придворний церемоніал найстаріших королівських дворів Європи. Вважалося, що майбутній правитель повернеться з Італії іншою людиною, навченою мистецтву дипломатії та науці врядування державою."
  grand_tour_outcome_overview: "$BULLET$Кожне відвідане нашим [Concept('heir', 'спадкоємцем')|e] місто підвищує його [Concept('ability', 'навички')|e] та дає [Concept('research_progress', 'поступ досліджень')|e] залежно від часу, присвяченого навчанню, або [Concept('legitimacy', 'право на владу')|e] за час, проведений при дворі.\n$BULLET$Якщо відвідати бодай три величних міста #TOOLTIP:REGION,italy_region,X #L Італії#!#!, подорож дає:\n$BULLET_WITH_TAB$Рису «[ShowTraitName('free_thinker')]» або «[ShowTraitName('well_connected')]» залежно від ухвалених рішень.\n$BULLET_WITH_TAB$Постійний [Concept('modifier', 'модифікатор')|e] «[ShowModifier('returned_from_grand_tour')]».\n$BULLET_WITH_TAB$#G +10#! од. [Concept('prestige', 'слави')|e].\n$BULLET$Скорочена подорож приносить лише #G +5#! од. [Concept('prestige', 'слави')|e] і не дає [Concept('trait', 'рис')|e]."
  steppe_embassy: "Посольство до Великого степу"
  steppe_embassy_desc: "Виправте правителя з дипломатичною місією до дворів великих держав, що постали після розпаду #TOOLTIP:CULTUREGROUP,mongolian_group,X #L Монгольської#!#! імперії. Попереду чекає довга дорога через чужі землі, а хани суворо обходяться з тими, хто не вміє справити гарне враження. Принесіть їм багаті дари, покажіть силу зброї або продемонструйте свої знання та розум. А коли з’явитеся з порожніми руками, то й додому повернетеся ні з чим."
  steppe_embassy_historical_info: "Упродовж XIV століття європейські та близькосхідні правителі неодноразово прагнули встановити прямі дипломатичні зносини з державами-спадкоємицями Монгольської імперії. Західні посольства до Ільханату, Золотої Орди та до інших дворів степовиків могли набувати найрізноманітніших форм — від пишних офіційних делегацій до суто практичних ділових поїздок. Усе залежало від того, що саме розраховувала здобути країна, яка вирядила посольство."
  steppe_embassy_outcome_overview: "$BULLET$Прибувши до двору, ми отримаємо модифікатор «[ShowModifier('led_steppe_embassy')]».\n$BULLET$Нагорода залежить від обраного підходу, кожен вибір також приносить #G +10#! [Concept('prestige', 'слави')|e]:\n$BULLET_WITH_TAB$Показ зброї дає модифікатор «[ShowModifier('steppe_recognised_military')]».\n$BULLET_WITH_TAB$Багаті дари дають модифікатор «[ShowModifier('steppe_contact_established')]».\n$BULLET_WITH_TAB$Торгова пропозиція дає модифікатор «[ShowModifier('steppe_trade_agreement')]» і тривалу торгову угоду, яка звільняє наших купців від мит та поборів за захист.\n$BULLET$Зібравши в дорозі потрібні відомості, можна здобути одразу дві нагороди.\n$BULLET$Двір у #TOOLTIP:LOCATION,samarkand,X #L Самарканді#!#! дає [Concept('research_progress', 'поступ дослідження')|e], до того ж для [Concept('ruler', 'правителя')|e] з рисою «[ShowTraitName('scholar')]» нагорода подвоюється."
  eastern_alliance_embassy: "Посольство Східного союзу"
  eastern_alliance_embassy_desc: "Відправте посольство до далеких земель, що лежать по той бік #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламського#!#! світу, — до #TOOLTIP:REGION,persia_region,X #L перського#!#! шаха або до негуса #TOOLTIP:REGION,ethiopia_region,X #L Ефіопського#!#! нагір’я. Шлях ваших посланців проляже через #TOOLTIP:LOCATION,hormuz,X #L Ормузьку протоку#!#! або через #TOOLTIP:LOCATION,alexandria,X #L Александрію#!#!, їм доведеться перетнути пустелі, де без сліду зникають цілі каравани. Утім, мандрівка варта зусиль, адже навіть номінальний союз із далеким двором змусить наших ворогів зважати на загрозу війни на два фронти."
  eastern_alliance_embassy_historical_info: "Християнські країни Європи постійно прагнули налагодити прямі дипломатичні зв’язки з дворами Персії та Ефіопії. У 1460-х роках правитель Ак-Коюнлу Узун-Хасан відправив послів до Венеції, щоб домовитися про спільні дії проти османів, а на початку XVI століття португальські посли прибули до двору ефіопського негуса Либне Дингиля. Посланцям доводилося долати величезні відстані, дипломатичний звичай чужоземних дворів кардинально відрізнявся від європейського, а наслідок посольства майже ніколи не виправдовував сподівань жодної зі сторін."
  eastern_alliance_embassy_outcome_overview: "$BULLET$Прибувши до двору, ми отримаємо модифікатор «[ShowModifier('led_eastern_alliance_embassy')]». [Concept('opinion', 'Думка')|e] наших країн одна про одну покращиться на #G +30#!.\n$BULLET$Нагорода залежить від обраного підходу, кожен вибір також приносить #G +10#! [Concept('prestige', 'слави')|e]:\n$BULLET_WITH_TAB$Прохання про військову допомогу дає модифікатор «[ShowModifier('eastern_alliance_persia')]» (для #TOOLTIP:REGION,ethiopia_region,X #L Ефіопії#!#! — «[ShowModifier('eastern_alliance_ethiopia')]») та укладення [Concept('alliance', 'союзу')|e].\n$BULLET_WITH_TAB$Пропозиція торгівлі дає модифікатор «[ShowModifier('eastern_route_open')]».\n$BULLET$Зібравши завчасно потрібні відомості, можна здобути обидві нагороди."
  grand_embassy: "Велике посольство"
  grand_embassy_desc: "Відправте правителя з дипломатичною подорожжю столицями Західної Європи, щоб зміцнити взаємини з великими державами і перейняти державні установи та засади устрою війська й флоту в тих країн, які лише нещодавно стали на шлях осучаснення. Таке посольство здатне дати значно більше, ніж просто купу новоспечених угод."
  grand_embassy_outcome_overview: "$BULLET$Якщо посольство приймуть, ми отримаємо одну з таких нагород на вибір господарів. Посольство може переходити від одного двору до іншого заради нових уроків:\n$BULLET_WITH_TAB$#G +5#!, #G +15#! або #G +25#! до розвитку [Concept('institutions', 'інститутів')|e] у наших найбільш густонаселених містах.\n$BULLET_WITH_TAB$#G +1#!, #G +3#! або #G +5#! до [Concept('army_tradition', 'військового')|e] або [Concept('navy_tradition', 'морського хисту')|e].\n$BULLET$Двір, що відмовився прийняти посольство, утратить обличчя. Якщо посольство зустрінуть образливо, ми отримаємо [Concept('casus_belli', 'привід для війни')|e] проти цієї країни."
  arctic_passage_nw: "Пошуки Північно-Західного проходу"
  arctic_passage_nw_desc: "Відправте флот на північний захід крізь скуті кригою води на північ від Америки на пошуки морського шляху до Азії. Якщо прохід існує, він пролягає крізь замерзлий архіпелаг на північ від материка, крізь пакову кригу, нескінченну зимову ніч і моря, яких немає на жодній мапі. Ще жодній виправі не вдалося знайти цей прохід, але це не означає, що його не існує."
  arctic_passage_nw_historical_info: "Протягом усього XVI століття англійські, нідерландські та скандинавські мореплавці не полишали надій знайти північний морський шлях до Азії. Зрештою подолати Північно-Західний прохід вдалося лише експедиції Руаля Амундсена у 1903–1906 роках, тоді як Північний морський шлях першим пройшов Адольф Норденшельд у 1878–1879 роках. Обидва шляхи виявилися непридатними для комерційного вжитку порівняно з південними шляхами, однак ці плавання дозволили створити перші докладні мапи Арктики та започаткували торгівлю хутром і китобійний промисел на Крайній Півночі."
  arctic_passage_nw_outcome_overview: "$BULLET$У міру дослідження замерзлого архіпелагу виправа приносить [Concept('prestige', 'славу')|e] за кожну досягнуту визначну пам’ятку.\n$BULLET$Перехід до #TOOLTIP:LOCATION,hudson_bay1,X #L Гудзонової затоки#!#! через Північно-Західний прохід дає:\n$BULLET_WITH_TAB$#G +20#! [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$#G +10#! [Concept('legitimacy', 'права на владу')|e].\n$BULLET_WITH_TAB$[modifier|e] «[ShowModifier('northwest_passage_found')]» строком на 30 років.\n$BULLET$Якщо виправа повернеться назад, не досягнувши мети, це принесе #G +5#! [Concept('prestige', 'слави')] та [Concept('modifier', 'модифікатор')] «[ShowModifier('arctic_expedition_returned')]» строком на 5 років."
  pacific_crossing: "Пошуки «торнав’яхе»"
  pacific_crossing_desc: "Відправте флот із тихоокеанського узбережжя Америки на пошуки #italic торнав’яхе#! — надійного зворотного шляху через найбільший океан на планеті. Пасати охоче несуть наші кораблі на захід, до берегів Азії, проте всі спроби повернутися тим самим шляхом досі зазнавали невдачі. Наші колонії та всі багатства Островів Прянощів залишатимуться недосяжними, поки ми не знайдемо дорогу назад. Країна, яка першою нанесе на мапи дорогу назад, зможе сполучити Америку з Азією шляхами галеонів і розпочати повноцінну тихоокеанську торгівлю."
  pacific_crossing_historical_info: "#italic Торнав’яхе#!, зворотне плавання на схід, довгий час лишалося головною проблемою перших тихоокеанських виправ. Альваро де Сааведра, відпливши з Нової Іспанії, у 1528 і 1529 роках двічі мусив відступити перед пасатами й зрештою загинув у спробах знайти зворотний шлях. У 1542 році Руї Лопес де Вільялобос, діставшись Азії, так само не зумів знайти дорогу додому. Придатний шлях знайшли лише 1565 року. Доти флоти могли допливти до Азії, але не мали змоги доправити свій вантаж назад."
  pacific_crossing_outcome_overview: "$BULLET$Нанесення на мапу зворотного шляху через #TOOLTIP:CONTINENT,pacific_ocean_continent,X #L Тихий океан#!#! дає:\n$BULLET_WITH_TAB$#G +100#! [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$#G +15#! [Concept('legitimacy', 'права на владу')|e].\n$BULLET_WITH_TAB$Постійний [Concept('modifier', 'модифікатор')|e] «[ShowModifier('manila_galleon_route')]».\n$BULLET_WITH_TAB$[ShowGoodsName('cloves')], зібрана на #TOOLTIP:AREA,moluccas_area,X #L Молуккських островах#!#!, буде продана за [Concept('gold', 'гроші')|e] за ринковою ціною.\n$BULLET_WITH_TAB$Постійний доступ до [Concept('decision', 'рішення')|e] «[ShowDecisionName('charter_manila_galleon')]», яке можна ухвалювати кожні п’ять років, щоб отримати значну суму [Concept('gold', 'грошей')|e].\n$BULLET$Флот, що не зуміє знайти шлях назад, не принесе нічого."
  gold_fleet_tierra_firme: "Галеони Тьєрра-Фірме"
  gold_fleet_tierra_firme_desc: "Відправте конвой галеонів із головного порту метрополії, щоб забрати вантаж срібла, коштовного каміння та шкур із наших володінь у Новій Гранаді та на Перешийку. Флот Тьєрра-Фірме — найважливіша артерія іспанської колоніальної імперії, що несе багатства Нового Світу на ринки Севільї."
  gold_fleet_tierra_firme_historical_info: "#italic Галеони Тьєрра-Фірме#! були одним із двох конвоїв іспанського #italic Срібного флоту#!. На флот Тьєрра-Фірме було покладено завдання забезпечувати торгівлю з віцекоролівствами Південної Америки. Його кораблі вивозили срібло, видобуте в копальнях Потосі у Верховному Перу, а також інший колоніальний крам через порти Портобело й Картахени. Срібло доправляли через Панамський перешийок суходолом із тихоокеанського узбережжя і лише потім вантажили на галеони. Філіп II закріпив систему конвоїв у 1566 році, наказавши перевозити всі вантажі у складі озброєних ескадр. Колоніальний крам увозився через Севілью, водночас #italic Каса-де-Контратасьйон#! стягувала на користь корони #italic quinto real#! — п’яту частину всіх дорогоцінних металів, видобутих у Новому Світі."
  gold_fleet_tierra_firme_outcome_overview: "Завантаживши в наших колоніях #TOOLTIP:GOODS,silver,X #L срібло#!#! та #TOOLTIP:GOODS,goods_gold,X #L золото#!#!, конвой доправляє їх на батьківщину у вигляді [Concept('gold', 'грошей')|e] та після прибуття приносить #G +10#! [Concept('prestige', 'слави')|e]. Якщо взяти на борт #TOOLTIP:GOODS,gems,X #L коштовне каміння#!#!, #TOOLTIP:GOODS,pearls,X #L перли#!#! або караван мулів, цінність вантажу зросте, проте конвой привертатиме більше уваги. Зустріч із флотом Нової Іспанії на острові [ShowScriptedGeographyName('island_of_cuba_geography')] додатково принесе #G +10#! [Concept('prestige', 'слави')|e] і зробить безпечнішим перехід через Атлантику. Частину конвою може бути втрачено через бурі та напади піратів, а якщо не пощастить, загине весь конвой."
  gold_fleet_nueva_espana: "Флот Нової Іспанії"
  gold_fleet_nueva_espana_desc: "Відправте конвой Нової Іспанії з головного порту метрополії, щоб забрати вантаж срібла та цінних фарб із наших володінь у Мезоамериці. Флот проходить через протоку Мона до Карибського моря і збирається в Гавані перед переходом через Атлантику."
  gold_fleet_nueva_espana_historical_info: "#italic Флот Нової Іспанії#! був одним із двох конвоїв іспанського #italic Срібного флоту#!. Його кораблі забезпечували торгівлю з віцекоролівством Нова Іспанія, перевозячи срібло з копалень Сакатекаса, Гуанахуато та інших мексиканських родовищ, а також кошеніль із Оахаки, індиго, ваніль і какао. Завантаження відбувалося в порту Сан-Хуан-де-Улуа поблизу Веракруса. Зазвичай конвой вирушав з Іспанії навесні й повертався восени, з’єднуючись у Гавані з галеонами Тьєрра-Фірме для спільного переходу через Атлантику. Його шлях пролягав через протоку Мона між Еспаньйолою та Пуерто-Рико — стандартним шляхом до східної частини Карибського моря."
  gold_fleet_nueva_espana_outcome_overview: "Завантаживши в наших колоніях #TOOLTIP:GOODS,silver,X #L срібло#!#! та #TOOLTIP:GOODS,goods_gold,X #L золото#!#!, конвой доправляє їх на батьківщину у вигляді [Concept('gold', 'грошей')|e] та після прибуття приносить #G +10#! [Concept('prestige', 'слави')|e]. Якщо супроводжувати караван зі сріблом або взяти на борт #TOOLTIP:GOODS,lumber,X #L лісоматеріали#!#!, цінність вантажу зросте, проте конвой привертатиме більше уваги. Зустріч із галеонами Тьєрра-Фірме на острові [ShowScriptedGeographyName('island_of_cuba_geography')] додатково принесе #G +10#! [Concept('prestige', 'слави')|e] і зробить безпечнішим перехід через Атлантику. Частину конвою може бути втрачено через бурі та напади піратів, а якщо не пощастить, загине весь конвой."
  cartographic_survey: "Дослідження узбережжя"
  cartographic_survey_desc: "Вирядіть корабель для докладного вивчення наших власних берегів. Дослідники нанесуть на мапу зручні гавані, виміряють глибину мілин і позначать небезпечні місця. Праця не найпочесніша, але створені ними мапи прислужаться цілому поколінню мореплавців, пришвидшивши та здешевивши спорядження всіх наступних виправ."
  cartographic_survey_historical_info: "Систематичне дослідження узбереж набуло широкого розвою в XVI столітті — обсяги морської торгівлі стрімко зростали, і точність мап перетворилася на справу державної ваги. #italic Каса-де-Контратасьйон#! у Севільї та португальський #italic Арсенал Гвінеї та Індії#! утримували цілий штат офіційних картографів, чиїм обов’язком було складання та постійне оновлення морських мап. У XVII столітті їхній приклад наслідували нідерландські адміралтейства."
  cartographic_survey_outcome_overview: "$BULLET$Кожен досліджений [Concept('port', 'порт')|e] може надати [Concept('location_modifier', 'модифікатор місцевості')|e] на строк від 10 до 20 років. Цей модифікатор збільшує обсяг виробництва таких товарів, як #TOOLTIP:GOODS,fish,X #L риба#!#!, #TOOLTIP:GOODS,pearls,X #L перли#!#! або #TOOLTIP:GOODS,amber,X #L бурштин#!#!, а також може поліпшити саму гавань і принести країні [Concept('prestige', 'славу')|e].\n$BULLET$Дослідження трьох і більше портів також дає такі переваги:\n$BULLET_WITH_TAB$[Concept('modifier', 'Модифікатор')|e] «[ShowModifier('accurate_charts')]» на 15 років\n$BULLET_WITH_TAB$#G +10#! од. [Concept('prestige', 'слави')].\n$BULLET$У разі дослідження менш як трьох портів ви отримаєте лише #G 5#! од. [Concept('prestige', 'слави')]."
  mining_survey: "Дослідження високогір’я"
  mining_survey_desc: "Вирядити загін рудознавців та пробірників у наші високогірні землі, щоб дослідити русла річок, знайти оголені породи та перевірити їх на вміст дорогоцінних металів. У пагорбах нерідко криються великі багатства, і щоб їх добути, нам варто покладатися на знання й набутки досвідчених гірників, а не на здогадки придворних вельмож."
  mining_survey_historical_info: "У Середньовіччі та в ранній Новий час у Європі активно розвідували рудні поклади. Найбільш жваво ця діяльність велася в Рудних горах Саксонії та Богемії, де відкриття покладів срібла в XII столітті призвело до стрімкого зростання таких міст, як Фрайберг, Яхимів та Шнеберг. У 1556 році вийшов твір Георга Агріколи #italic «Про гірничу справу та металургію»#!, де були докладно описані способи лозоходства й випробування руди, а також наведені звичаєві правові норми щодо зазіхань на рудоносні ділянки. Ця праця майже 200 років правила за один із головних посібників із видобутку та обробки металів."
  mining_survey_outcome_overview: "$BULLET$Кожне дослідження дає [Concept('modifier', 'модифікатор')|e] «[ShowModifier('thorough_survey')]», який на 20 років збільшує обсяг видобутку сировини в усій країні.\n$BULLET$Кожне знайдене родовище також відкриває доступ до значних покладів, як-от [ShowModifier('rich_silver_vein')|l] або [ShowModifier('rich_gold_strike')|l]. Їх можна розробляти відкрито для здобуття [Concept('prestige', 'слави')|e] або ж таємно для отримання [Concept('gold', 'грошей')|e].\n$BULLET$Відкриття родовищ також дає такі переваги:\n$BULLET_WITH_TAB$#G +10#! од. [Concept('prestige', 'слави')] за два й більше відкритих родовищ.\n$BULLET_WITH_TAB$#G +5#! од. слави за кожне досліджене високогір’я."
  relic_expedition: "Виправа за реліквією"
  relic_expedition_desc: "Вирядити посольство до #TOOLTIP:RELIGIONGROUP,christian,X #L християнської#!#! країни, де зберігається одна з великих реліквій християнства, щоб отримати її в дар, придбати або домовитися про її передачу. На сьогодні трьома найважливішими реліквіями християнства є Животворний хрест у #TOOLTIP:LOCATION,jerusalem,X #L Єрусалимі#!#!, Терновий вінець у #TOOLTIP:LOCATION,paris,X #L Парижі#!#! та Спис Лонгина в #TOOLTIP:LOCATION,antioch,X #L Антіохії#!#!. Перша країна, що зможе здобути одну з них, безсумнівно набуде значного впливу."
  relic_expedition_historical_info: "У Середньовіччі торгівля реліквіями була звичною справою. Католицькі та православні громади повсякчас змагалися за право володіти найважливішими та найціннішими святинями. Протягом кількох століть ці реліквії неодноразово купували, обмінювали й навіть викрадали, через що вони встигли побувати в більшості тогочасних християнських країн. Так, у 1238 році Людовик IX придбав у латинського імператора Балдуїна II Терновий вінець і помістив його на зберігання до каплиці Сент-Шапель, яку звели в Парижі зумисне задля цього. Годі й казати, що для французької держави це було настільки ж важливе надбання, як і для місцевих християн."
  relic_expedition_outcome_overview: "$BULLET$Перша країна, що здобуде велику реліквію, отримає відповідний [Concept('modifier', 'модифікатор')|e] залежно від свого вибору («[ShowModifier('relic_true_cross')]», «[ShowModifier('relic_crown_of_thorns')]» або «[ShowModifier('relic_holy_lance')]»).\n$BULLET$Реліквію можна офіційно придбати за [Concept('gold', 'гроші')|e], що додатково дасть країні #G 10#! од. [Concept('prestige', 'слави')|e].\n$BULLET$Таємне придбання реліквії також дає [Concept('modifier', 'модифікатор')], але не приносить [Concept('prestige', 'слави')]."
