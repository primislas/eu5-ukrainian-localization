l_russian:
  expedition_category_exploration: "Виправи"
  expedition_category_commercial: "Торгова"
  expedition_category_military: "Військова"
  expedition_category_religious: "Віросповідна"
  expedition_category_diplomatic: "Посольська"
  EXPEDITION_VARIABLE_MONTHLY_CHANGE_TITLE: "Щомісяця змінюється на [MonthlySavedVariable.GetMonthlyChangeValue(Expedition.GetBaseClass)|+=2]. Причини:"
  EXPEDITION_VARIABLES_TT_TITLE: "Параметри мандрівки"
  pilgrimage_expedition: "Велике паломництво"
  pilgrimage_expedition_desc: "Наш правитель вирушить у паломництво до святих місць #TOOLTIP:RELIGION,$catholic_tt$,X #L католицької#!#! віри."
  pilgrimage_expedition_historical_info: "Паломники-християни почали вирушати до Єрусалима з IV століття, коли імператор Костянтин доручив збудувати храм Гробу Господнього на місці поховання й воскресіння Христа. Під час хрестових походів місто неодноразово переходило з рук у руки. У 1099 році його захопили учасники Першого хрестового походу. У 1187 році воно стало здобиччю Саладіна. У 1229 році, за Фрідріха II, Єрусалим ненадовго повернувся під контроль християн, після чого остаточно перейшов під владу мамлюків. Попри втрату християнського панування, святі місця залишалися доступними для паломників завдяки дипломатичним домовленостям. Так Єрусалим став головним осередком католицького паломництва в усьому середньовічному світі."
  pilgrimage_expedition_outcome_overview: "$BULLET$Кожна [Concept('holy_site', 'святиня')|e], яку відвідує наш [Concept('ruler', 'правитель')|e], дарує після прибуття власну нагороду: [Concept('legitimacy', 'право на владу')|e], [Concept('prestige', 'славу')|e] або вдячність духовенства.\n$BULLET$Завершення паломництва надає за кожне відвідане святе місце:\n$BULLET_WITH_TAB$#G +5#! [Concept('legitimacy', 'права на владу')|e].\n$BULLET_WITH_TAB$[Concept('estate_satisfaction', 'Задоволення стану')|e] #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L духовенства#!#!.\n$BULLET_WITH_TAB$Покращена [Concept('opinion', 'думка')|e] про країну [GetCountry('PAP').GetName]."
  piety: "Побожність"
  piety_desc: "Показує, наскільки ревно звершується паломництво. У дорозі цей показник поступово знижується, а мирські рішення лише прискорюють його витрату. Якщо побожність вичерпається повністю, паломництво обернеться ганьбою. А високий рівень правовірности відчутно збільшить підсумкову нагороду."
  retinue: "Почет"
  retinue_desc: "Супровід правителя в паломництві. Чисельність почту не зменшується сама по собі — тільки через негаразди в дорозі. Якщо втратити весь почет, правитель залишиться беззахисним перед небезпеками, а паломництво завершиться невдачею."
  pilgrimage_expedition_cooldown: "Велике паломництво"
  pilgrimage_expedition_ruler_owner_tt: "[pilgrimage_ruler.GetName] resides in [pilgrimage_ruler.GetCourtCountry.GetName]"
  holy_site_pilgrimage_expedition: "Паломництво до святого місця"
  holy_site_pilgrimage_expedition_desc: "Наш правитель вирушає в паломництво до обраної святині, щоб помолитися там при свідках, а відтак повернутися з мандрівки зі зрослою славою та репутацією набожної людини. Вихідною точкою слугує саме паломництво, а не задум подорожі."
  holy_site_pilgrimage_expedition_outcome_overview: "$BULLET$Прибуття до обраної [Concept('holy_site', 'святині')|e] дає нагороду залежно від нашої [Concept('religion', 'віри')|e]:\n$BULLET_WITH_TAB$#G +10#! [Concept('religious_influence', 'впливу віри')|e], [Concept('purity', 'чистоти')|e] або [Concept('karma', 'карми')|e], що зростає залежно від відстані від нашої столиці, аж до #G +100#!.\n$BULLET_WITH_TAB$Послідовники [ShowReligionGroupAdjective('folk_peruvian_group')|l]ої віри натомість зміщують [Concept('yanantin', 'янантін')|e] на #Y 20#! у бік єства [Concept('god', 'божества')|e] [Concept('holy_site', 'святині')].\n$BULLET_WITH_TAB$Відповідні [ShowReligionGroupAdjective('muslim')|l]і вчення зміщують її ще на #Y 10#! у бік #TOOLTIP:SOCIETAL_VALUE,mysticism_vs_jurisprudence,X #L містицизму#!#! або #TOOLTIP:SOCIETAL_VALUE,mysticism_vs_jurisprudence,X #L ісламського права#!#!."
  holy_site_pilgrimage_expedition_order_zeal_tt: "Багато років поспіль благочестя паломників, які відвідують це володіння, живитиме ревність ордену, що береже його"
  holy_site_pilgrimage_cooldown: "Паломництво до святого місця"
  treasure_fleet_expedition: "Золотий флот"
  treasure_fleet_expedition_desc: "Відрядити імператорський золотий флот до обраного регіону в державних справах. Цей флот прямує прибережними морськими шляхами до місця призначення й назад, заходячи дорогою до портів чужих земель. Це плавання розширює дипломатичний вплив двору, дає змогу роздати подарунки та [ShowGoodsName('silk')|l] правителям південних морів, зібрати данину й повернутися з рідкісним крамом, послами та іменами королів, котрі зачули шелест китайського вітрила."
  treasure_fleet_expedition_outcome_overview: "$BULLET$Флот вирушає з вантажем оплачених нашою скарбницею дарів.\n$BULLET$Якщо виправа повернеться неушкодженою, всі залишкові дари перетворяться на [Concept('gold', 'гроші')|e], також ви отримаєте #G +10#! [Concept('prestige', 'слави')|e].\n$BULLET$Кожен чужоземний двір також реагує по-своєму:\n$BULLET_WITH_TAB$Двір, де нас зустріли належно, додасть ще #G +5#! [Concept('prestige', 'слави')|e]. Така країна може навіть погодитися стати данником #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Серединної Країни#!#! й почне надсилати данину та дивовижі, які збагатять наш [Concept('market', 'ринок')|e].\n$BULLET_WITH_TAB$Якщо країна відмовиться від нашої пропозиції стати данником, вона отримає «[ShowModifier('chi_resisting_subjugation')]», а наша [Concept('opinion', 'думка')|e] про неї погіршиться на #R -50#!."
  treasure_fleet_cooldown: "Золотий флот"
  western_ocean_voyage_expedition: "Плавання до Західного океану"
  western_ocean_voyage_expedition_desc: "Відправте флот на захід крізь відкриті води Атлантичного океану в пошуках морського шляху до Індії. Коли [ShowAreaName('canary_islands_area')] лишаться позаду, наші мапи стануть марними. З нами зостануться лише вітер, вода та надія на те, що океан усе ж не такий широкий, як уважають учені."
  western_ocean_voyage_expedition_historical_info: "Ідея дістатися Азії, вирушивши морем на захід, обговорювалася європейськими вченими протягом десятиліть до першої спроби такої подорожі. Головною перепоною була навіть не форма Землі, яку освічені люди вже вважали кулястою, а її розмір. Більшість учених слушно вважали, що океан занадто широкий, і робили з цього висновок про неможливість його перетнути. Довести їхню неправоту вдалося лише завдяки несподіваним відкриттям, здійсненим виправами на своєму шляху."
  western_ocean_voyage_expedition_outcome_overview: "$BULLET$Під час виправи складаються мапи відкритого моря та нових берегів.\n$BULLET$Прибуття дає:\n$BULLET_WITH_TAB$#G +10#! [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$#G +10#! [Concept('legitimacy', 'права на владу')|e].\n$BULLET_WITH_TAB$Ще #G +20#! [Concept('prestige', 'слави')|e] можна отримати за відкриття Америки, яке стане першим кроком на шляху до колонізації Нового Світу."
  western_ocean_voyage_cooldown: "Плавання до Західного океану"
  hajj_caravan_expedition: "Королівський хадж"
  hajj_caravan_expedition_desc: "Відправте нашого правителя в хадж, який є п’ятим і обов’язковим стовпом ісламу. Це вельми тривала та коштовна мандрівка, проте правитель, що повернувся з паломництва до #TOOLTIP:LOCATION,mecca,X #L Мекки#!#!, має таку повагу, якої не забезпечить жодне військо."
  hajj_caravan_expedition_historical_info: "За часів свого правління (786–809 рр.) аббасидський халіф Харун ар-Рашид дев’ять разів здійснював паломництво з Багдада, причому частину шляху долав пішки на знак благоговіння. Його набожність стала взірцем, який протягом багатьох століть прагнули наслідувати побожні правителі."
  hajj_caravan_expedition_religious_influence_bullet: "$BULLET_WITH_TAB$до #G +20#! до [Concept('religious_influence', 'духовного впливу')|e].\n"
  hajj_caravan_expedition_outcome_overview: "$BULLET$Якщо караван дістанеться Мекки, його буде винагороджено за виявлену там пишноту, аж до:\n$BULLET_WITH_TAB$#G +20#! [Concept('prestige', 'слави')|e].\n[SelectLocalization(RELIGION.HasReligiousInfluence, 'hajj_caravan_expedition_religious_influence_bullet', '')]$BULLET$Повернення додому згодом надає:\n$BULLET_WITH_TAB$#G +10#! [Concept('legitimacy', 'права на владу')|e].\n$BULLET_WITH_TAB$П’ятирічний [Concept('modifier', 'модифікатор')|e] «[ShowModifier('hajj_pious_return')]».\n$BULLET_WITH_TAB$Постійну почесну відзнаку «[ShowModifier('hajji_pilgrim')]» — за перший хадж [Concept('ruler', 'правителя')|e].\n$BULLET$Караван має дістатися місцевості [ShowLocationNameWithNoTooltip('mecca')] того ж року, коли вирушив у путь, інакше проща буде цілком змарнована."
  guards: "Озброєний супровід"
  guards_desc: "Охорона каравану. Зростає коштом найму вояків або під час використання #italic махмаля#! і зменшується через набіги й труднощі. Що краще захищений караван, то вища його змога пережити напад."
  splendor: "Розкіш"
  splendor_desc: "Показує, наскільки щедро споряджений і прикрашений караван. Цей показник зростає від щедрих витрат та показу багатства, а знижується через бурі й труднощі в дорозі. Саме розкіш визначає розмір винагороди після прибуття до Мекки."
  hajj_caravan_cooldown: "Королівський хадж"
  circumnavigation_expedition: "Навколосвітнє плавання"
  circumnavigation_expedition_desc: "Відрядити флот на захід, щоб спробувати обігнути всю земну кулю — пройти на південь від #TOOLTIP:REGION,la_plata_region,X #L Ріо-де-ла-Плати#!#!, минути протоку на краю землі, перетнути безіменний океан і дістатися Островів прянощів — а потім повернутися додому, обігнувши #TOOLTIP:LOCATION,good_hope_cape,X #L мис Доброї Надії#!#!. Жодному мореплавцю ще не вдавалося вчинити подібне. Ніхто не знає, чи це взагалі можливо."
  circumnavigation_expedition_historical_info: "У вересні 1519 року Фернан Магеллан покинув Санлукар-де-Баррамеду, щоб відшукати західний шлях до Островів Прянощів для іспанської корони. До складу виправи входили п’ять кораблів: #italic Тринідад#!, #italic Сан-Антоніо#!, #italic Консепсьйон#!, #italic Вікторія#! та #italic Сантьяго#!. Магеллан був португальським мореплавцем, він плавав до Індії та на Молуккські острови, але перейшов на службу до іспанської корони після того, як король Мануел I відмовився підвищити йому платню. Ця виправа ввійшла в історію як перша навколосвітня подорож, хоча самому Магеллану не судилося повернутися додому."
  circumnavigation_expedition_outcome_overview: "$BULLET$Перша країна, яка здійснить навколосвітнє плавання, отримує:\n$BULLET_WITH_TAB$#G +100#! од. [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$#G +10#! од. [Concept('legitimacy', 'права на владу')|e].\n$BULLET_WITH_TAB$[modifier|e] «[ShowModifier('first_circumnavigation')]».\n$BULLET$Подальші плавання приносять:\n$BULLET_WITH_TAB$#G +10#! од. [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$Додатково #G +10#! од., якщо щонайменше 3 кораблі безпечно повернулися до рідної гавані.\n$BULLET_WITH_TAB$#G +5#! од., якщо команда зберігає добрий настрій.\n$BULLET_WITH_TAB$[ShowGoodsName('cloves')], зібрана на #TOOLTIP:AREA,moluccas_area,X #L Молуккських островах#!#!, буде продана за [Concept('gold', 'гроші')|e] за ринковою ціною."
  circumnavigation_expedition_low_morale_prestige_tt: "Низький дух команди зменшує здобуту славу"
  circumnavigation_expedition_high_morale_prestige_tt: "Високий дух команди збільшує здобуту славу"
  morale: "Дух команди"
  morale_desc: "Настрій моряків. Низький дух може призвести до бунту."
  provisions: "Припаси"
  provisions_desc: "Харчі та вода, запасені для мандрівки. Поступово тануть у дорозі, і якщо вичерпаються, під загрозою опиниться вся справа."
  num_ships: "Кораблі"
  num_ships_desc: "Кораблі у складі флотилії. Якщо не залишиться жодного, виправа зникне безвісти."
  cargo: "Вантаж"
  cargo_desc: "Коштовності, здобуті під час подорожі, які буде продано на ринку після повернення флотилії."
  cape_route_to_india_expedition: "Шлях до Індії через мис Доброї Надії"
  cape_route_to_india_expedition_desc: "Спрямуйте флот на південь уздовж узбережжя Африки, обігніть великий Південний мис і прокладіть морський шлях до Островів прянощів в обхід османських поборів та венеційських посередників. Попереду суворе плавання — два роки у відкритому океані, незвідані береги та жорстокі шторми. Натомість країна, яка першою відкриє цей шлях, отримає панування над світовою торгівлею прянощами."
  cape_route_to_india_expedition_historical_info: "Португальська виправа з пошуку морського шляху до Індії стала наслідком майже ста років поступового поступу на південь уздовж африканського узбережжя. У 1488 році Бартоломеу Діаш обігнув мис Доброї Надії, довівши, що шлях до Індії можливий. Плавання Васко да Гами у 1497–1499 роках завершило розпочате — його кораблі повернулися додому з вантажем перцю та прянощів, а витрати на виправу окупилися в шістдесят разів. Ця мандрівка докорінно змінила світову торгівлю прянощами, поклавши край венеційсько-османській монополії на суходільні торгові шляхи."
  cape_route_to_india_expedition_outcome_overview: "$BULLET$Під час кожної зупинки вздовж узбережжя Африки може бути заснована #TOOLTIP:BUILDING_TYPE,por_feitoria,X #L фейторія#!#!. Якщо зупинка відбудеться в нічийній гавані, [Concept('location', 'місцевість')|e] буде захоплено й засновано споруду #TOOLTIP:BUILDING_TYPE,por_trading_post,X #L португальська факторія#!#!. В обох випадках надається тривалий [Concept('modifier', 'модифікатор')|e] торгівлі.\n$BULLET$Прибуття до #TOOLTIP:LOCATION,kozhikode,X #L Кожикоде#!#! надає модифікатор «[ShowModifier('calicut_trade_rights')]», а також вантаж #TOOLTIP:GOODS,pepper,X #L перцю#!#!, який буде продано за [Concept('gold', 'гроші')|e] за ринковою ціною.\n$BULLET$Завершення плавання надає:\n$BULLET_WITH_TAB$#G +20#! од. [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$#G +10#! од. [Concept('legitimacy', 'права на владу')|e].\n$BULLET_WITH_TAB$Постійний [Concept('modifier', 'модифікатор')|e] «[ShowModifier('cape_route_pioneer')]» або модифікатори «[ShowModifier('portuguese_african_network')]» чи «[ShowModifier('east_africa_trade_dominance')]», якщо засновано три чи п’ять фейторій."
  cape_route_to_india_expedition_low_morale_prestige_tt: "Низький дух команди зменшує здобуту славу"
  cape_route_to_india_expedition_high_morale_prestige_tt: "Високий дух команди збільшує здобуту славу"
  grand_tour_expedition: "Марморіна"
  grand_tour_expedition_desc: "На спадкоємця престолу чекає тривала мандрівка великими містами #TOOLTIP:REGION,italy_region,X #L Італії#!#!. Він відвідає #TOOLTIP:LOCATION,florence,X #L Флоренцію#!#!, #TOOLTIP:LOCATION,rome,X #L Рим#!#!, #TOOLTIP:LOCATION,venice,X #L Венецію#!#! та #TOOLTIP:LOCATION,naples,X #L Неаполь#!#!, щоби пізнавати науки біля самих витоків #TOOLTIP:INSTITUTION,renaissance,X #L Відродження#!#!. Додому він повернеться іншою людиною — вдача майбутнього правителя формуватиметься під впливом італійських наставників та набутих знань."
  grand_tour_expedition_historical_info: "Велика подорож — звичай відправляти знатну європейську молодь у тривалу мандрівку Італією з освітньою метою, що виник у XV–XVI століттях. До XVII століття цей звичай став обов’язковою частиною виховання в аристократичних колах Північної Європи. Класичний шлях пролягав через Флоренцію, Рим, Венецію та Неаполь. Ці міста могли дати молодим людям те, чого так бракувало на півночі: гуманістичні науки, спадщину античности, мистецтво Відродження та придворний церемоніал найстаріших королівських дворів Європи. Вважалося, що майбутній правитель повернеться з Італії іншою людиною, навченою посольської справи та хисту врядування."
  grand_tour_expedition_outcome_overview: "$BULLET$Кожне відвідане місто приносить знання, зв’язки або досвід — залежно від вибору — та дає [Concept('research_progress', 'поступ досліджень')|e] за час, проведений за навчанням, або [Concept('legitimacy', 'право на владу')|e] за час, проведений при дворі.\n$BULLET$Якщо вдається відвідати щонайменше три з великих міст Італії, подорож додатково приносить:\n$BULLET_WITH_TAB$Або [ShowTraitName('free_thinker')], або [ShowTraitName('well_connected')], або [ShowTraitName('worldly')] — залежно від того, що виявилося найвищим.\n$BULLET_WITH_TAB$Постійний [Concept('modifier', 'модифікатор')|e] «[ShowModifier('returned_from_grand_tour')]».\n$BULLET_WITH_TAB$#G +10#! [Concept('prestige', 'слави')|e].\n$BULLET$Коротша подорож приносить лише #G +5#! [Concept('prestige', 'слави')] і не дає [Concept('trait', 'риси')|e]."
  grand_tour_expedition_heir_completed_tt: "Heir has not already completed the Grand Tour"
  grand_tour_expedition_stalled_status: "In Residence"
  gt_diligence: "Старанність"
  gt_diligence_desc: "Схильність спадкоємця до навчання під час поїздки, що визначається його [Concept('ability', 'навичками')|e] на мить відбуття. Що старанніший спадкоємець, то більше користі він винесе з уроків цієї подорожі."
  knowledge: "Знання"
  knowledge_desc: "Теоретичні знання, здобуті в дорозі: у бібліотеках, на лекціях та в розмовах з ученими. Якщо наприкінці поїздки знання спадкоємця перевищать усі інші показники, він здобуде рису [ShowTraitName('free_thinker')|l]."
  connections: "Зв’язки"
  connections_desc: "Знайомства, зав’язані при дворах, які відвідав спадкоємець. Якщо наприкінці поїздки зв’язки стануть його головним здобутком, він отримає рису [ShowTraitName('well_connected')|l]."
  experience: "Досвід"
  experience_desc: "Практичні навички, набуті в дорозі: у майстернях, портах і купецьких конторах. Якщо наприкінці поїздки практичний досвід перевищить усі інші показники, спадкоємець повернеться додому #TOOLTIP:TRAIT,$DESC_KEY$,X #L досвідченим#!#!."
  grand_tour_cooldown: "Гран-тур"
  grand_embassy_expedition: "Велике посольство"
  grand_embassy_expedition_desc: "Правитель вирушає в подорож дворами Західної Європи під чужим ім’ям, щоб вивчити державні установи, військо та флот країн, які вже пройшли крізь осучаснення. Делегацію, що прибула з королівським розмахом, чекають лише бенкети та порожня ввічливість. А от ті, хто поводиться скромно, зможуть проникнути просто на корабельні та до креслярських майстерень. Утім, чутки ширяться швидко, і якщо правителя викриють занадто рано, багато дверей перед ним зачиниться."
  grand_embassy_expedition_outcome_overview: "$BULLET$Те, наскільки потайно подорожує посольство, визначає, як довго його справжня мета залишатиметься таємницею для чергового двору і як цей двір відреагує, коли все розкриється.\n$BULLET$Кожен відвіданий двір дає певну кількість можливостей для навчання, а випадкові зустрічі в дорозі можуть розвинути здібності правителя, поглибити Осучаснення або підірвати Потайність.\n$BULLET$Після завершення посольства накопичене Осучаснення пришвидшує розвиток [Concept('institutions', 'інститутів')|e] в усіх наших володіннях, до того ж у столиці — найсильніше, підвищує [Concept('army_tradition', 'військовий хист')|e], а якщо хоч раз було відвідано порт — ще й [Concept('navy_tradition', 'морський хист')|e].\n$BULLET$Двір, який відмовив посольству, вартує нам [Concept('prestige', 'слави')|e]; той самий, що надає доступ або сам просить розширити його, винагороджує нас [Concept('prestige', 'славою')|e] та новими можливостями."
  grand_embassy_expedition_institution_spread_tt: "Збільшує поступ обраного інституту на [GetVariable('grand_embassy_institution_progress_amount')|V0] од. в усіх наших місцевостях, де його ще не прийнято, і на [GetVariable('grand_embassy_institution_progress_capital_amount')|V0] — у столиці"
  grand_embassy_expedition_stalled_status: "Вивчення"
  discretion: "Скритність"
  discretion_desc: "Показує, наскільки добре правителю вдається приховувати справжню мету поїздки та свою особу. Доки показник вищий за 90, при дворі делегацію сприймають як звичайних послів і ні про що не підозрюють. Коли він опускається до 90 або нижче, приймальна сторона розуміє, хто насправді до них прибув — через звичайну підозру чи завдяки своїй шпигунській мережі."
  modernization: "Осучаснення"
  modernization_desc: "Засвоєні виправою західні порядки та технології. Кожен засвоєний урок збільшує цей показник, і що більше знань правитель привезе додому, то щедрішою буде винагорода після завершення посольства."
  opportunities: "Можливості"
  opportunities_desc: "Показує, наскільки широкий доступ до знань виправа здобула при конкретному дворі. Показник розраховується наново на кожній зупинці та залежить від того, наскільки відкрито вирішив триматися правитель."
  pacific_crossing_expedition: "Пошуки «торнав’яхе»"
  pacific_crossing_expedition_desc: "Відправте флот із тихоокеанського узбережжя Америки на пошуки #italic торнав’яхе#! — надійного зворотного шляху через найбільший океан на планеті. Пасати охоче несуть наші кораблі на захід, до берегів Азії, однак усі спроби повернутися тим самим шляхом досі закінчувалися невдачею. Наші колонії та всі багатства Островів прянощів залишаться поза досяжністю, доки ми не знайдемо дорогу назад. Країна, яка першою нанесе на мапи зворотний шлях, зможе зв’язати Америку з Азією шляхами галеонів і розпочати повноцінну тихоокеанську торгівлю."
  pacific_crossing_expedition_historical_info: "#italic Торнав’яхе#!, зворотне плавання на схід, довгий час залишалося головною проблемою перших тихоокеанських виправ. Альваро де Сааведра, відпливши з Нової Іспанії, у 1528 та 1529 роках двічі був змушений відступити перед пасатами й зрештою загинув у спробах знайти зворотний шлях. У 1542 році Руї Лопес де Вільялобос, діставшись Азії, також не зумів знайти дорогу додому. Придатний шлях знайшли лише в 1565 році. Доти флоти могли доплисти до Азії, але не мали змоги доправити свій вантаж назад."
  pacific_crossing_expedition_outcome_overview: "$BULLET$Прокладання зворотного шляху через [ShowContinentName('pacific_ocean_continent')] дає:\n$BULLET_WITH_TAB$#G +100#! [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$#G +15#! [Concept('legitimacy', 'права на владу')|e].\n$BULLET_WITH_TAB$Постійний [Concept('modifier', 'модифікатор')|e] торгового шляху.\n$BULLET_WITH_TAB$[ShowGoodsName('cloves')], зібрана в області [ShowAreaName('moluccas_area')], продана за ринковою ціною за [Concept('gold', 'гроші')|e].\n$BULLET_WITH_TAB$Постійний доступ до [Concept('decision', 'рішення')|e] «[ShowDecisionName('charter_manila_galleon')]», яке можна ухвалювати наново кожні п’ять років заради значного повернення [Concept('gold', 'грошей')].\n$BULLET$Флот, який так і не знайшов дорогу додому, не отримує нічого."
  pacific_crossing_expedition_low_morale_prestige_tt: "Низький дух команди зменшує здобуту славу"
  pacific_crossing_expedition_high_morale_prestige_tt: "Високий дух команди збільшує здобуту славу"
  cartographic_survey_expedition: "Дослідження узбережжя"
  cartographic_survey_expedition_desc: "Відправте корабель для докладного вивчення наших власних берегів. Дослідники нанесуть на мапу зручні гавані, виміряють глибину мілин і позначать небезпечні місця. Праця не найбільш шанована, але створені ними мапи прислужаться цілому поколінню мореплавців, пришвидшивши та здешевивши спорядження всіх наступних виправ."
  cartographic_survey_expedition_historical_info: "Систематичне дослідження узбереж набуло широкого розвитку в XVI столітті — обсяги морської торгівлі стрімко зростали, і точність мап перетворилася на питання державної ваги. #italic Каса-де-Контратасьйон#! у Севільї та португальський #italic Арсенал Гвінеї та Індії#! утримували цілий штат офіційних картографів, до обов’язків яких належало складання та постійне оновлення морських мап. У XVII столітті за їхнім прикладом пішли нідерландські адміралтейства."
  cartographic_survey_expedition_outcome_overview: "$BULLET$Кожен досліджений [Concept('port', 'порт')|e] може надати [Concept('location_modifier', 'модифікатор місцевості')|e] на строк від 10 до 20 років. Цей модифікатор збільшує обсяг виробництва таких товарів, як #TOOLTIP:GOODS,fish,X #L риба#!#!, #TOOLTIP:GOODS,pearls,X #L перли#!#! або #TOOLTIP:GOODS,amber,X #L бурштин#!#!, а також може покращити саму гавань і принести країні [Concept('prestige', 'славу')|e].\n$BULLET$Дослідження трьох і більше портів також надає такі переваги:\n$BULLET_WITH_TAB$[Concept('modifier', 'Модифікатор')|e] «[ShowModifier('accurate_charts')]» на 15 років\n$BULLET_WITH_TAB$#G +10#! од. [Concept('prestige', 'слави')].\n$BULLET$За дослідження менш як трьох портів ви отримаєте лише #G 5#! од. [Concept('prestige', 'слави')]."
  cartographic_survey_cooldown: "Дослідження узбережжя"
  mining_survey_expedition: "Дослідження високогір’я"
  mining_survey_expedition_desc: "Вирядити загін рудошукачів і пробірників до наших високогірних земель, щоби дослідити річища, знайти відслонену породу й перевірити її на наявність дорогоцінних металів. У пагорбах нерідко криються великі багатства, і щоб їх добути, нам варто покладатися на знання та доробок досвідчених гірників, а не на здогадки придворних вельмож."
  mining_survey_expedition_historical_info: "У середні віки та за раннього нового часу в Європі активно вели розвідку рудних покладів. Найширше цією справою займалися в Рудних горах Саксонії та Богемії, де відкриття покладів срібла у XII столітті спричинило бурхливе зростання таких міст, як Фрайберг, Яхимов і Шнеберг. 1556 року вийшла праця Ґеорґа Аґріколи #italic «Про гірництво та металургію»#!, де було докладно описано прийоми лозоходства та випробування руди, а також наведено правові звичаї щодо зазіхань на рудоносні ділянки. Ця праця майже 200 років слугувала одним із головних посібників із видобутку та оброблення металів."
  mining_survey_expedition_outcome_overview: "$BULLET$Кожне дослідження надає [Concept('modifier', 'модифікатор')|e] «[ShowModifier('thorough_survey')]», який на 20 років збільшує обсяг видобутку сировини в усій країні.\n$BULLET$Кожне знайдене родовище також відкриває доступ до великих покладів, таких як [ShowModifier('rich_silver_vein')|l] або [ShowModifier('rich_gold_strike')|l]. Їх можна розробляти відкрито задля здобуття [Concept('prestige', 'слави')|e] або ж потай задля отримання [Concept('gold', 'прибутку')|e].\n$BULLET$Відкриття родовищ також надає такі переваги:\n$BULLET_WITH_TAB$#G +10#! од. [Concept('prestige', 'слави')] за два й більше відкритих родовищ.\n$BULLET_WITH_TAB$#G +5#! од. слави за кожне досліджене високогір’я."
  mining_survey_cooldown: "Дослідження високогір’я"
  relic_expedition: "Полювання на реліквію"
  relic_expedition_desc: "Вирушити у виправу до #TOOLTIP:LOCATION,jerusalem,X #L Єрусалима#!#!, а звідти — далі Святою землею та всім #TOOLTIP:REGION,crescent_region,X #L Родючим півмісяцем#!#!, де ходять чутки про прадавню святиню. Здобути її зможе лише той, кому вистачить терпіння та вдачі."
  relic_expedition_historical_info: "Торгівля реліквіями в середньовіччі та за раннього нового часу була вкрай прибутковою справою. Католицькі та православні громади змагалися за найбільш шановані святині. Реліквії століттями мандрували всім християнським світом унаслідок торгівлі, обміну чи крадіжок. Особливо вразливими були святині князівств хрестоносців: Животворний Хрест, захоплений під Хаттіном 1187 року, так і не вдалося повернути, а Спис Лонгина, знайдений в Антіохії 1098 року, зник із літописів невдовзі після першого хрестового походу. Обидві ці втрати породили багатовікові чутки про те, де їх можна знайти."
  relic_expedition_outcome_overview: "$BULLET$Яку саме реліквію буде знайдено, залежить від випадку й того, як складуться пошуки: це може виявитися сам давно втрачений Істинний Хрест чи Святий Спис або ж скромніша реліквія — цвях, кістка чи часточка.\n$BULLET$Хоч би що було знайдено, воно стає відчутним [Concept('work_of_art', 'витвором')|e], доправленим додому, до нашої столиці."
  clues: "Зачіпки"
  clues_desc: "Показує, наскільки виправа близька до того, щоб натрапити на справжній слід реліквії. Пошуки починаються з поодинокої чутки, а показник зростає чи падає з кожною перевіреною підказкою. Якщо зачіпки вичерпаються повністю, виправі, найімовірніше, доведеться повернутися з порожніми руками."
  hunt_retinue: "Почет"
  hunt_retinue_desc: "Охорона, перекладач та вчений аташе виправи. Чисельність почту не зменшується сама по собі, але якщо в загоні нікого не залишиться, подорож і пошуки завершаться нічим."
  relic_expedition_cooldown: "Полювання на реліквію"
  relic_expedition_found_relic_true_cross_tt: "We have recovered $relic_true_cross_found$"
  relic_expedition_found_relic_holy_lance_tt: "We have recovered $relic_holy_lance_found$"
