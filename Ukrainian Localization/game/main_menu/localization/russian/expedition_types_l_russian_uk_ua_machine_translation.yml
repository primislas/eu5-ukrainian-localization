  EXPEDITION_STATUS_WAITING_FOR_CONSTRUCTION_FOR: "Очікування [Expedition.GetWaitConstructionGoodsDemand.GetNameWithNoTooltip] упродовж [Expedition.GetWaitConstructionDaysRemaining|V] дн."
