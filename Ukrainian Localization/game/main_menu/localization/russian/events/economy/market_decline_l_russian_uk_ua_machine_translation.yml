l_russian:
  market_decline.1.title: "Згасання ринку [withering_market.GetName]"
  market_decline.1.desc: "Ринок у [withering_market.GetCenterLocation.Custom('LR_PREP')|l] [withering_market.GetCenterLocation.GetName] втратив свою колишню роль великого торгу. Хоча ринок продовжує підтримувати контакти з кількома місцевостями, наші купці дедалі частіше воліють везти свій крам на сусідні, популярніші ринки. Якщо залишити все як є, ринок незабаром перетвориться на пункт збору мита на шляху до жвавіших місць.\n\nНаша рада запитує, як ми воліємо вирішити це питання."
  market_decline.1.a: "Субсидувати купців і підтримати ринок."
  market_decline.1.b: "Скасувати ринок і дозволити місцевостям приєднатися до своїх природних сусідів."
  market_decline.1.b.tt: "[Concept('market', 'Ринок')|e] [withering_market.GetName] знищено. Його місцевості приєднуються до найкращого з альтернативних [Concept('market', 'ринків')|e]."
  market_decline.1.c: "Змиритися зі спадом і дозволити купцям ухвалювати власні рішення."