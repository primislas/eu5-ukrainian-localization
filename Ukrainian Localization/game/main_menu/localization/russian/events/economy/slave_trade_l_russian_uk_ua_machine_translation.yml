l_russian:
  slave_trade.1.title: "Власники невільників"
  slave_trade.1.desc: "[slaver_country.GetAdjectiveWithNoTooltip|U]і купці й раніше бували на наших ринках, але тепер ринули до нас бурхливим потоком. Схоже, в основному вони купують невільників або наші товари, які потім можна обміняти на невільників. Деякі місцеві вожді вже нажили на цьому цілий статок. Це небезпечно, адже вони зміцнюють свою могутність, а навколишні поселення розоряються.\n\nВласники невільників з міста [ROOT.GetCountry.GetCapital.GetName] просять нас розробити узгоджені закони та регулювати торгівлю за допомогою монаршої монополії. Судячи з усього, [slaver_country.GetLongName] — це країна, чиї торговці теж зацікавлені в більш формальних і стабільних умовах."
  slave_trade.1.a: "Укладемо угоду з торговцями."
  slave_trade.1.b: "Ми не потерпимо торгівлю людьми."
  STATIC_MODIFIER_NAME_protecting_against_slave_trade: "Захист від торгівлі невільниками"
  STATIC_MODIFIER_NAME_accepting_slave_trade: "Підтримка торгівлі невільниками"
  slave_trade_obstructed: "Торгівля невільниками ускладнена"
  slave_trade.5.title: "Швидка втрата влади"
  slave_trade.5.desc: "Людолови спустошили села #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Свавільні набіги призвели до того, що столичні людолови взялися за наш власний народ, щоб набити кишені. Вони не тільки знищують наші поселення, але й зміцнюють свою владу, що може призвести до дуже небезпечних наслідків."
  slave_trade.5.a: "Чергові клопоти…"
  slave_trade.5.b: "Потрібно відновити порядок!"
  slave_trade.6.title: "Ринки невільників спалено"
  slave_trade.6.desc: "Наш #TOOLTIP:BUILDING_TYPE,slave_center,X #L великий невільничий торг#!#!#! спалено жителями #ONCLICK:COUNTRY,[from.GetKey] #TOOLTIP:COUNTRY,[from.GetKey],X [from.Custom('CL_GEN')|L]#!#!. Це правомірний привід для війни. [from.GetLongName] — наш ворог!"
  slave_trade.6.a: "Можливо, так і є…"