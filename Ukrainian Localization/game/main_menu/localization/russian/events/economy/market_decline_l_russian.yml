l_russian:
 market_decline.1.title: "Угасание рынка [withering_market.GetName]"
 market_decline.1.desc: "Рынок в [withering_market.GetCenterLocation.Custom('LR_PREP')|l] [withering_market.GetCenterLocation.GetName] утратил свою былую роль крупного торгового узла. Хотя рынок продолжает поддерживать контакты с несколькими районами, наши купцы всё чаще предпочитают везти свои товары на соседние, более популярные рынки. Если оставить всё как есть, рынок вскоре превратиться в пункт сбора пошли на дороге к более оживлённым местам.\n\nНаш совет спрашивает, как мы предпочтём решить этот вопрос."
 market_decline.1.a: "Субсидировать купцов и поддержать рынок."
 market_decline.1.b: "Упразднить рынок и позволить районам присоединиться к своим естественным соседям."
 market_decline.1.b.tt: "[Concept('market', 'Рынок')|e] [withering_market.GetName] уничтожен. Его районы присоединяются к лучшему из альтернативных [Concept('market', 'рынков')|e]."
 market_decline.1.c: "Смириться с упадком и позволить купцам принимать собственные решения."