l_russian:
  thalassocracy_events.1.title: "Плоди нашої праці"
  thalassocracy_events.1.desc_success: "Стрімке розширення нашого флоту увінчалося приголомшливим успіхом! Безліч новозбудованих та модернізованих кораблів під керівництвом досвідчених моряків неодмінно вселять жах у серця наших суперників і ворогів. Віднині ні підступні пірати, ні ескадри під ворожими стягами не зможуть стати на заваді нашому пануванню над хвилями. Тепер, коли безпеку судноплавних ліній гарантовано, нам буде значно простіше управляти далекими берегами та поширювати свій вплив на морські простори."
  thalassocracy_events.1.desc_failure: "Після років виснажливих обговорень щодо забезпечення нашого флоту нам доведеться облишити мрії про морське панування. Не маючи могутньої сили на морі, здатної підкріпити наші зазіхання на таласократію, ми не зможемо захистити свої води ні від суперників, ні від каперів."
  thalassocracy_events.1.a: "Наша морська імперія процвітатиме!"
  unlock_thalassocracy_reform_tt: "Відкриває доступ до [Concept('government_reform', 'державної реформи')|e] «[ShowGovernmentReformName('thalassocracy_reform')]»"
  thalassocracy_events.1.b: "Нам доведеться змиритися з власною невдачею."
