l_russian:
  thalassocracy_events.1.title: "Плоди праці нашої"
  thalassocracy_events.1.desc_success: "Стрімке розширення військового флоту завершилося надзвичайно успішно! Безліч нових та осучаснених кораблів, споряджених вишколеними командами, віднині загрожуватимуть усім нашим ворогам і суперникам. Мерзенні пірати та ворожі ескадри більше ніколи не зможуть оскаржити наше морське панування. Убезпечивши торгові шляхи, ми полегшимо врядування далекими заморськими колоніями і зможемо поширювати нашу волю навіть через океан."
  thalassocracy_events.1.desc_failure: "Після багаторічних виснажливих обговорень про забезпечення військового флоту ми змушені полишити нашу мрію про панування на морях. Без сильного флоту ніякої таласократії бути не може, адже ми не в змозі захистити від ворожих каперів навіть власні води."
  thalassocracy_events.1.a: "Наша морська імперія стане ще сильнішою!"
  unlock_thalassocracy_reform_tt: "Відкриває доступ до [Concept('government_reform', 'державної реформи')|e] «[ShowGovernmentReformName('thalassocracy_reform')]»"
  thalassocracy_events.1.b: "Доведеться жити з наслідками нашої невдачі."