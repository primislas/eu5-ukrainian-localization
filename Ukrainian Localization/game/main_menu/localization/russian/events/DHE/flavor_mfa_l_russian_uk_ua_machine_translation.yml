l_russian:
  flavor_mfa.1.title: "Візантійські традиції"
  flavor_mfa.1.entry: "Візантійські традиції"
  flavor_mfa.1.desc: "[ROOT.GetCountry.GetLongName] сто[ROOT.GetCountry.Custom('endlong_yityat')] на роздоріжжі. Усього якихось кілька десятиліть тому на престол [ROOT.GetCountry.Custom('rank_ua_GEN')|l] [Select_CString(target_character2.IsFemale, 'зійшла', 'зійшов')] [target_character2.GetName] зі славної династії [target_character.GetDynasty.GetName]. Попри своє #TOOLTIP:STATIC_MODIFIER,byz_born_in_the_purple_modifier,X #V #L багрянородне#!#!#! походження, [Select_CString(target_character2.IsFemale, 'вона навернулася', 'він навернувся')] в #TOOLTIP:RELIGION,$catholic_tt$,X #L католицтво#!#! і повністю [Select_CString(target_character2.IsFemale, 'перейняла', 'перейняв')] #TOOLTIP:CULTURE,$piedmontese_tt$,X #L п’ємонтську#!#! культуру, відмовившись від рідних #L [target_country.GetAdjective|l]их#! коренів.\n\nСьогодні [ROOT.GetCountry.Custom('CL_INST')] править [Select_CString(target_character2.IsFemale, 'її', 'його')] нащадок [target_character.GetName] — людина, яка, можливо, ще буде віддаватися нездійсненним мріям про життя в [target_country.Custom('longname_ua_wntt_PREP')], якби [Select_CString(target_character.IsFemale, 'їй', 'йому')] пощастило народитися не в [target_character.GetLocation.Custom('LR_PREP')|l] [target_character.GetLocation.GetName]."
  flavor_mfa.1.a: "[target_character2.GetNameWithNoTooltip] правильно [Select_CString(target_character2.IsFemale, 'вчинила', 'вчинив')], що [Select_CString(target_character2.IsFemale, 'пристосувалася', 'пристосувався')]."
  flavor_mfa.1.a.entry: "Наш правитель вчинив правильно, що пристосувався."
  flavor_mfa.1.b: "Ми не відмовимося від коренів!"
  mfa_extra_information_about_reform: "[Concept('modifiers', 'Модифікатори')|e] реформи «[target_government_reform.GetName]» змінюються від від’ємних до додатних залежно від відсоткових показників #TOOLTIP:CULTURE,$greek_culture_tt$,X #L грецької#!#! [Concept('culture', 'культури')|e] і #TOOLTIP:RELIGION,$orthodox_tt$,X #L православно-християнської#!#! [Concept('religion', 'віри')|e]. У міру навернення #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! штрафи поступово почнуть перетворюватися на бонуси. Модифікатори змінюються від #N -1#! до #G +1#!"
  mfa_opportunity_for_thessaloniki: "Якщо ми впровадимо реформу «[target_government_reform.GetName]», а відсоткові показники #TOOLTIP:CULTURE,$greek_culture_tt$,X #L грецької#!#! [Concept('culture', 'культури')|e] і #TOOLTIP:RELIGION,$orthodox_tt$,X #L православно-християнської#!#! [Concept('religion', 'віри')|e] досягнуть #W 75%#!, ми зможемо запросити у #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_GEN')|L]#!#! феод у #TOOLTIP:LOCATION,thessaloniki,X #L Фессалоніках#!#! та околицях"
  flavor_mfa.2.title: "[target_character.GetNameWithNoTooltip]"
  flavor_mfa.2.entry: "Фачино Кане"
  flavor_mfa.2.desc: "До [ROOT.GetCountry.Custom('rank_ua_ACC')|l] [Select_CString(target_character.IsFemale, 'прибула', 'прибув')] знаменитий кондотьєр [target_character.GetName] родом із місцевості, що зветься [target_character.GetBirthLocation.GetName]. За довгі роки служби в інших країнах [target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'здобула', 'здобув')] славу вправного командира. [Select_CString(target_character.IsFemale, 'Її', 'Його')] заслуги воістину вражають, а тому ми вважаємо, що компанія, якою [Select_CString(target_character.IsFemale, 'вона', 'він')] керує, стане для нас цінним надбанням у війнах проти інших країн у цій області."
  flavor_mfa.2.a: "Потрібно найняти [Select_CString(target_character.IsFemale, 'її', 'його')]."
  flavor_mfa.2.a.entry: "Потрібно найняти його."
  flavor_mfa.2.b: "Запропонувати [Select_CString(target_character.IsFemale, 'їй', 'йому')] деякі землі в обмін на службу."
  flavor_mfa.2.b.entry: "Запропонувати йому деякі землі в обмін на службу."
  flavor_mfa.2.c: "Пф! Нехай волоцюги шукають роботи в інших країнах."
  mfa_facino_condotierro: "Банда Фачино"
  flavor_mfa.3.title: "Імперські амбіції"
  flavor_mfa.3.entry: "$flavor_mfa.3.title$"
  flavor_mfa.3.desc: "[target_character.GetName] — не #TOOLTIP:STATIC_MODIFIER,byz_born_in_the_purple_modifier,X #V #L багрянородне дитя#!#!#! і не нащадок імператора, однак у [Select_CString(target_character.IsFemale, 'її', 'його')] жилах все ж тече імперська кров родини [target_character.GetDynasty.GetName]. [Select_CString(target_character.IsFemale, 'Їй', 'Йому')] недостатньо бути лише одним із багатьох дрібних правителів #TOOLTIP:AREA,piemonte_area,X #L П’ємонту#!#! — [target_character.GetShortNameWithNoTooltip] вважає, що заслуговує на кращу долю, ніж усього-на-всього #TOOLTIP:COUNTRY_RANK,rank_county,X #L графства#!#!."
  flavor_mfa.3.a: "П’ємонту потрібен новий гегемон."
  flavor_mfa.3.b: "[Select_CString(target_character.IsFemale, 'Її', 'Його')] прагнення призведуть лише до того, що проти нас обернуться всі інші."
  flavor_mfa.3.b.entry: "Його прагнення призведуть лише до того, що проти нас обернуться всі інші."
  mfa_if_we_conquer_enough_in_20_years: "Якщо [ROOT.GetCountry.GetName] довед[ROOT.GetCountry.Custom('end_youtut')] чисельність [population_i|e] [Concept('population', 'населення')|e] хоча б до #W [DisplayPopulationNumber('(CFixedPoint)500')]#! протягом #W 20#! років, країна отримає [SCOPE.ScriptValue('prestige_mild_bonus')|+=] до [prestige_i|e] [Concept('prestige', 'престижу')|e] і [Concept('modifier', 'модифікатор')|e] «[ShowModifier('mfa_elevation_modifier')]» на #W 40#! років; крім того, можливе також підвищення її рангу до #TOOLTIP:COUNTRY_RANK,rank_duchy,X #L герцогства#!#!, якщо він нижчий, ніж герцогство\nЯкщо [ROOT.GetCountry.GetName] не змож[ROOT.GetCountry.Custom('end_eut')] цього досягти, країна отримає [SCOPE.ScriptValue('prestige_extreme_penalty')|+=] до [prestige_i|e] [Concept('prestige', 'престижу')|e] і [SCOPE.ScriptValue('stability_weak_penalty')|+=] до [stability_i|e] [Concept('stability', 'стабільності')|e], а всі сусіди отримають [Concept('casus_belli', 'привід для війни')|e] проти неї «[ShowCasusBelliName('cb_cut_down_in_size')]»"
  flavor_mfa.4.title: "Посміховисько на всю Італію"
  flavor_mfa.4.desc: "Кілька десятиліть тому [target_character.GetName] [Select_CString(target_character.IsFemale, 'поклялася', 'поклявся')], що стане гегемоном #TOOLTIP:AREA,piemonte_area,X #L П’ємонту#!#!. Сьогодні ж усе, що нагадує про ці прагнення, — це безперервні отруйні глузування, яких зазна[ROOT.GetCountry.Custom('nobles_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]. Династія [target_character.GetDynasty.GetName] з [ROOT.GetCountry.Custom('longname_ua_GEN')] не просто не досягла бажаного — вона нажила собі нових ворогів. Чи залишилася у сусідів [ROOT.GetCountry.Custom('rank_ua_GEN')|l] хоч дещиця співчуття до цієї нещасної країни?"
  flavor_mfa.4.a: "Ми зробили все, що змогли."
  flavor_mfa.5.title: "Перезрілий плід"
  flavor_mfa.5.desc: "В останні роки [from_country.GetLongName] не покладав рук, роблячи все, що тільки можна, аби перетворити сусідів на ворогів. Поки що, втім, успіхи сумнівні: все, чого цій країні вдалося добитися, — це насмішок навпіл з роздратуванням на свою адресу. Ми — як і багато інших — щиро зневажаємо цю убогу країну."
  flavor_mfa.5.a: "Яке нещастя!"
  flavor_mfa.6.title: "Герцоги П’ємонту"
  flavor_mfa.6.desc: "Багато років тому [target_character.GetName] [Select_CString(target_character.IsFemale, 'поклялася', 'поклявся')], що [Select_CString(target_character.IsFemale, 'її', 'його')] рід — #L [ROOT.GetCountry.GetAdjective|l]а#! династія [target_character.GetDynasty.GetName] — одного чудового дня неодмінно доб’ється заслуженої величі. І сьогодні ми зрозуміли, що [Select_CString(target_character.IsFemale, 'вона', 'він')] не кидає слів на вітер: відтепер перлина #TOOLTIP:AREA,piemonte_area,X #L П’ємонту#!#! буде іменуватися #TOOLTIP:COUNTRY_RANK,rank_duchy,X #L герцогством#!#!."
  flavor_mfa.6.a: "Можливо, [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]і правителі також заслуговують багрянородства?"
  flavor_mfa.6.b: "Хай живе[ROOT.GetCountry.Custom('crown_yeyut')] [ROOT.GetCountry.GetNameWithNoTooltip]!"
  mfa_purple_color: "Наш колір зміниться на відтінок #W темно-пурпурового#!"
  flavor_mfa.7.title: "Наші домагання на Королівство Фессалоніки"
  flavor_mfa.7.entry: "$flavor_mfa.7.title$"
  flavor_mfa.7.desc: "[target_character.GetName], виходець із династії [target_character.GetDynasty.GetName], чий родоначальник — [target_character2.GetName], має законні, хоч і не першочергові права на престол [target_country.Custom('longname_ua_GEN')] за принципом родової належности. Є у [Select_CString(target_character.IsFemale, 'неї', 'нього')] й інше домагання, про яке знають далеко не всі, — на #TOOLTIP:SCRIPTED_GEOGRAPHY,TBD #L Королівство Фессалоніки#!#!; ця претензія сягає вже такого діяча, як [target_character3.GetName], і династії [target_character3.GetDynasty.GetName]. [target_character.GetName] вважає, що за потурання родини [target_character.GetDynasty.GetNameWithNoTooltip], чиє родове гніздо — [target_country.GetCapital.GetName], ми зможемо в обмін на певні поступки добитися [target_location.Custom('LR_GEN')|l] [target_location.GetName]."
  flavor_mfa.7.a: "Висунути домагання."
  flavor_mfa.7.b: "Ми не зловживатимемо їхньою добротою."
  MFA_request_thessalonica: "Ми запросимо у [target_country.Custom('longname_ua_GEN')] всі землі в #TOOLTIP:PROVINCE_DEFINITION,chalkidiki_province,X #L Халкідіках#!#!, #TOOLTIP:PROVINCE_DEFINITION,lower_macedonia_province,X #L Нижній Македонії#!#! та #TOOLTIP:PROVINCE_DEFINITION,central_macedonia_province,X #L Центральній Македонії#!#! як #TOOLTIP:SUBJECT_TYPE,fiefdom,X #L феод#!#!"
  flavor_mfa.8.title: "Прохання [from_country.Custom('CL_GEN')]"
  flavor_mfa.8.desc: "Нашому родичу з династії [target_character.GetDynasty.GetName] у [from_country.Custom('longname_ua_PREP')] вдалося встановити в #TOOLTIP:REGION,italy_region,X #L Італії#!#! справжню #L [target_country.GetAdjective|l]у#! країну: місцеві жителі сповідують #L [ROOT.GetCountry.GetReligion.GetAdjective|l]у#! віру, дотримуються #L [ROOT.GetCountry.GetCulture.GetName|l]ої#! культури, носять пурпурні шати та розмовляють нашою мовою. Їхн[Select_CString(target_character.IsFemale, 'я правителька', 'ій правитель')] [target_character.GetName], наголошуючи на наших історичних зв’язках, а також зв’язках сучасних, просить виділити [Select_CString(target_character.IsFemale, 'їй', 'йому')] феод у [target_location.Custom('LR_PREP')|l] [target_location.GetName] та околицях, оскільки нібито здавна володіє правом на престол #TOOLTIP:SCRIPTED_GEOGRAPHY,TBD #L Королівства Фессалоніки#!#!."
  flavor_mfa.8.a: "[Select_CString(target_character.IsFemale, 'Їй', 'Йому')] має вистачати розуму не згадувати про це латинське утворення."
  flavor_mfa.8.b: "Ми виконаємо їхнє прохання."
  mfa_make_thessaloniki_subject: "Наші [Concept('locations', 'місцевості')|e] в #TOOLTIP:PROVINCE_DEFINITION,chalkidiki_province,X #L Халкідіках#!#!, #TOOLTIP:PROVINCE_DEFINITION,lower_macedonia_province,X #L Нижній Македонії#!#! та #TOOLTIP:PROVINCE_DEFINITION,central_macedonia_province,X #L Центральній Македонії#!#! стануть #TOOLTIP:SUBJECT_TYPE,fiefdom,X #L феодом#!#! #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_GEN')|L]#!#!"
  flavor_mfa.1000.title: "$flavor_mfa.7.title$"
  flavor_mfa.1000.entry: "$flavor_mfa.7.title$"
  flavor_mfa.1000.desc: "Попри походження зі славного роду [target_character.GetDynasty.GetName], [target_character.GetName] має досить серйозне домагання на #TOOLTIP:SCRIPTED_GEOGRAPHY,TBD #L Королівство Фессалоніки#!#!, яким [Select_CString(target_character.IsFemale, 'зобов’язана', 'зобов’язаний')] своєму далекому родичу на ім’я [target_character3.GetName]. І хоча однозначність цього домагання сумнівна, ми все-таки можемо розраховувати на підтримку інших країн, оскільки численні #TOOLTIP:CULTUREGROUP,italian_group,X #L італійські#!#! країни зараз намагаються, скориставшись #TOOLTIP:DISASTER_TYPE,byzantine_succession_crisis,X #L [GetCountry('BYZ').GetAdjectiveWithNoTooltip]ою кризою спадкування#!#!, урвати власний шматок [target_country.Custom('longname_ua_GEN')]."
  flavor_mfa.1000.a: "Ми вирушаємо в похід!"
  flavor_mfa.1000.b: "Буде нерозумно розв’язувати війну через такі дріб’язкові претензії."
  recipient_agrees_to_join_war: "[recipient.GetName] пообіцяв приєднатися до війни #ONCLICK:COUNTRY,[actor.GetKey] #TOOLTIP:COUNTRY,[actor.GetKey],X [actor.Custom('CL_GEN')|L]#!#! проти [GetCountry('BYZ').Custom('longname_ua_GEN')] протягом кількох років"
  MFA_gather_allies: "[ROOT.GetCountry.GetName] спробує скликати союзників за допомогою [Concept('country_interaction', 'взаємодії з країною')|e] «[ShowCountryInteractionName('mfa_join_against_byz')]»\nЧерез #W 3#! роки почнеться [Concept('event', 'подія')|e], що дозволяє оголосити [Concept('war', 'війну')|e] за підтримки союзників"
  flavor_mfa.1001.title: "Умиротворення [from_country.GetAdjectiveWithNoTooltip|l]их претендентів"
  flavor_mfa.1001.desc: "Підле #L [from_country.GetAdjective|l]е#! сімейство [target_character.GetDynasty.GetName] висунуло претензії на #TOOLTIP:SCRIPTED_GEOGRAPHY,TBD #L Королівство Фессалоніки#!#!, обґрунтовуючи їх походженням від дому [target_character3.GetDynasty.GetName]. Як повідомляють наші шпигуни, вони намагаються зібрати #TOOLTIP:CULTUREGROUP,italian_group,X #L італійську#!#! лігу та спільно відібрати ці землі, скориставшись #TOOLTIP:DISASTER_TYPE,byzantine_succession_crisis,X #L [GetCountry('BYZ').GetAdjectiveWithNoTooltip]им кризою спадкування#!#!."
  flavor_mfa.1001.a: "Ми не поступимося цим зрадникам ні п’яді землі!"
  flavor_mfa.1001.b: "Запропонуємо їм символічний наділ."
  flavor_mfa.1001.c: "Та нехай забирають на здоров’я!"
  mfa_offer_few_provinces: "Ми запропонуємо #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_DAT')|L]#!#! [Concept('provinces', 'провінції')|e] #TOOLTIP:PROVINCE_DEFINITION,chalkidiki_province,X #L Халкідікі#!#!, #TOOLTIP:PROVINCE_DEFINITION,lower_macedonia_province,X #L Нижня Македонія#!#! та #TOOLTIP:PROVINCE_DEFINITION,central_macedonia_province,X #L Центральна Македонія#!#!, щоб умиротворити цю країну"
  mfa_offer_entire_geography: "Ми запропонуємо #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_DAT')|L]#!#! всі свої землі на теренах #TOOLTIP:SCRIPTED_GEOGRAPHY,TBD #L Королівства Фессалоніки#!#!"
  flavor_mfa.1002.title: "Вдала нагода"
  flavor_mfa.1002.desc: "Багато років минуло відтоді, як ми почали збирати союзників у похід проти [target_country.Custom('longname_ua_GEN')]. Наші ослаблені міжусобицею вороги навряд чи чинитимуть серйозний опір. Під наші знамена стікаються все нові країни; ще трохи — і тоді ми доведемо всьому світу, що саме наша гілка династії [target_dynasty.GetName] сильніша за інших."
  flavor_mfa.1002.a: "Спускайте псів війни!"
  flavor_mfa.1002.b: "Зараз невідповідний час."
  flavor_mfa.1002.c: "Краще відмовитися від цього задуму."
  flavor_mfa.1003.title: "Вірність угоді"
  flavor_mfa.1003.desc: "Нарешті вибухнула давно назрівала війна з [target_country.Custom('longname_ua_INST')], і нас закликали дотриматися даного #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_DAT')|L]#!#! слова. Чи прийдемо ми на допомогу в громадянській війні за участі родини [target_character.GetDynasty.GetName], чи ж кинемо [from_country.Custom('longname_ua_wntt_ACC')] напризволяще, і нехай [target_war.GetName] іде своєю чередою?"
  flavor_mfa.1003.a: "Ми не кинемо союзника."
  flavor_mfa.1003.b: "Найправильніше буде спостерігати зі сторони."
  flavor_mfa.1005.title: "Допомога з [target_country.Custom('CL_GEN')]"
  flavor_mfa.1005.desc: "На святі малодушності в [target_country.Custom('longname_ua_PREP')] запанував здоровий глузд: нам запропонували поступитися теренами #TOOLTIP:SCRIPTED_GEOGRAPHY,TBD #L Королівства Фессалоніки#!#!. Цю пропозицію слід ретельно обміркувати, бо похід сам собою — великий ризик."
  flavor_mfa.1005.a: "Будемо задовольнятися тим, що можемо взяти."
  flavor_mfa.1005.b: "Дарма вони уявили, що зможуть нас зупинити!"
  mfa_make_thessaloniki_subject_out_of_provinces: "#L [target_country.GetAdjective]і#! [Concept('locations', 'місцевості')|e] в #TOOLTIP:PROVINCE_DEFINITION,chalkidiki_province,X #L Халкідіках#!#!, #TOOLTIP:PROVINCE_DEFINITION,lower_macedonia_province,X #L Нижній Македонії#!#! та #TOOLTIP:PROVINCE_DEFINITION,central_macedonia_province,X #L Центральній Македонії#!#! стануть #TOOLTIP:SUBJECT_TYPE,fiefdom,X #L феодом#!#! #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_GEN')|L]#!#!"
  mfa_make_thessaloniki_subject_out_of_geography: "#L [target_country.GetAdjective]і#! [Concept('locations', 'місцевості')|e] в #TOOLTIP:SCRIPTED_GEOGRAPHY,TBD #L Королівстві Фессалоніки#!#! стануть #TOOLTIP:SUBJECT_TYPE,fiefdom,X #L феодом#!#! #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_GEN')|L]#!#!"
  flavor_mfa.1006.title: "Відповідь [from_country.Custom('longname_ua_wntt_GEN')]"
  flavor_mfa.1006.desc.affirmative: "Громадянську війну за участі родини [target_character.GetDynasty.GetName] вдалося запобігти! Схоже, що мерзенна #L [from_country.GetAdjective|l]а#! гілка цього роду нарешті оговталася і вирішила припинити бойові дії, погодившись на запропоновану нами передачу земель."
  flavor_mfa.1006.desc.negative: "Підл[from_country.Custom('nobles_yiaei')] [from_country.Custom('nobles_estate')] з #L [from_country.GetAdjective|l]ої#! династії [target_character.GetDynasty.GetName] — зрадники та брехуни! На нашу скромну пропозицію розв’язати справу миром вони відповіли відмовою. Істинно кажуть нам, ці #TOOLTIP:LANGUAGE,latin_language,X #L латинські#!#! дияволи — слуги самого Сатани!"
  flavor_mfa.1006.affirmative: "Запанував мир."
  flavor_mfa.1006.negative: "Ніщо не приносить стільки болю, як зрада з боку рідних."