l_russian:
 flavor_luc.1.entry: "$flavor_luc.1.title$"
 flavor_luc.1.title: "Производство шёлка в Лукке"
 flavor_luc.1.desc: "#TOOLTIP:GOODS,silk,X #L Шёлк#!#! — одна из ценнейших редкостей в #TOOLTIP:CONTINENT,europe,X #L Европе#!#!; из этой невероятно дорогой и качественной материи многие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] предпочитают шить себе одежду. [ShowLocationName('lucca')] готовится покрывать их потребности: здесь уже разводят шелкопрядов и даже действует молодая шёлковая промышленность, хотя производство ещё не вышло на достаточные уровни. И [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l], и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] согласны, что инвестиции в производство шёлка помогут нам нарастить выпуск #TOOLTIP:GOODS,fine_cloth,X #L тонкого сукна#!#!, и тогда мы затмим любые другие #TOOLTIP:REGION,italy_region,X #L итальянские#!#! города, которые осмелятся с нами соперничать."
 flavor_luc.1.a: "Вложим деньги в разведение шелкопрядов."
 flavor_luc.1.b: "Они желают заработать? Пускай гонятся за прибылью сами."
 flavor_luc.2.entry: "$flavor_luc.2.title$"
 flavor_luc.2.title: "Торговля тонким сукном в Лукке"
 flavor_luc.2.desc: "[ShowLocationName('lucca')] может похвастать хорошо развитым производством #TOOLTIP:GOODS,fine_cloth,X #L тонкого сукна#!#!, и это — не пустые слова: в #TOOLTIP:REGION,italy_region,X #L Италии#!#! много городов, которые опережают нас по объёму выпуска, однако никто из них так и не превзошёл наши ткани по качеству; их производят самые умелые горожане, годами оттачивавшие своё мастерство. Даже обладатели несметных богатств считают #L [ROOT.GetCountry.GetAdjective|l]ую#! одежду настоящей роскошью, и одного только этого мнения достаточно, чтобы мы начали производить больше и покрывать растущий спрос."
 flavor_luc.2.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_luc.2.a.entry: "Прекрасно!"
 luc_fine_cloth_demand: "Спрос на тонкое сукно"
 flavor_luc.3.entry: "$flavor_luc.3.title$"
 flavor_luc.3.title: "Виды на Лондон"
 flavor_luc.3.desc: "Самые предприимчивые наши [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] представили замысел широкого выхода на рынок #L #TOOLTIP:LOCATIONRANK,[target_market.GetCenterLocation.Custom('LR_tt')],X [target_market.GetCenterLocation.Custom('LR_GEN')|l]#!#! [target_market.GetShortName]: многие из них собираются переехать в #TOOLTIP:LOCATION,london,X #L Лондон#!#! — город, находящийся под властью #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! и настроенный к нам дружественно.\n\nЭто предложение сегодня рассматривает [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]. Некоторые придворные рады возможности расширить торговые связи, другие же подчёркивают, что после такого [target_country.GetNameWithNoTooltip] мо[target_country.Custom('end_gegu')] начать относиться к нам с недоверием, что иностранным купцам вряд ли будут рады, и что лучше будет стремиться к взаимодействию, нежели к соперничеству."
 flavor_luc.3.a: "Расширим торговые связи."
 flavor_luc.3.b: "Будем взаимодействовать, а не соперничать."
 flavor_luc.4.entry: "$flavor_luc.4.title$"
 flavor_luc.4.title: "За свободу!"
 flavor_luc.4.desc: "За свою долгую историю народ #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! перенёс множество поражений и унижений — и всё же остался твёрдо стоять на ногах, несмотря ни на что.\n\n[ROOT.GetCountry.GetAdjectiveWithNoTooltip|U]ому человеку невозможно представить, что кто-то просто сложит руки и смирится со своей судьбой. Каждый раз, когда наступают тяжёлые времена или же наши воины гибнут на поле боя, [ShowLocationName('lucca')] неизменно может рассчитывать на то, что мы встанем стеной."
 flavor_luc.4.a: "Мы не боимся даже смерти!"
 flavor_luc.4.b: "Лучшая защита — это нападение."
 flavor_luc.5.entry: "$flavor_luc.5.title$"
 flavor_luc.5.title: "[ShowBuildingTypeNameWithNoTooltip('walls_of_lucca')]"
 flavor_luc.5.desc: "Голод и война обычно обходят нас стороной, однако бывают и такие годы, когда [ShowLocationName('lucca')] страдает от набегов. Городская стража бдительно несёт дозор на стенах, высматривая врагов, поскольку каждый знает: если недруги прорвутся за ворота, погибнут родные и близкие. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] предлагает расширить стены, сделав их как можно более широкими и высокими, чтобы наши граждане могли спать спокойно."
 flavor_luc.5.a: "Мы расширим стены."
 flavor_luc.5.b: "Нужно сделать так, чтобы враг не смог одолеть нас силой."
 flavor_luc.1000.entry: "$flavor_luc.1000.title$"
 flavor_luc.1000.title: "Приобретение [GetCountry('LUC').Custom('CL_GEN')]"
 flavor_luc.1000.desc: "Война, которую сейчас вед[target_country.Custom('end_youtut')] [target_country.GetName], предоставила нам отличную возможность перейти к другому господину — если, конечно, у нас возникнет такое желание. Вместо того чтобы добиваться этой цели военным путём, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] предлагает продаться #ONCLICK:COUNTRY,[GetCountry('PIS').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('PIS').Custom('CL_tt')],X [GetCountry('PIS').Custom('CL_DAT')|L]#!#!, чтобы и пополнить казну, и продемонстрировать свою добрую волю."
 flavor_luc.1000.a: "Обратимся с этим предложением к [target_country.Custom('CL_DAT')]."
 flavor_luc.1000.a.entry: "Обратимся с этим предложением к сюзерену."
 flavor_luc.1000.b: "Независимость можно только отвоевать."
 flavor_luc.1001.title: "$flavor_luc.1000.title$"
 flavor_luc.1001.desc: "В самый разгар войны с #ONCLICK:COUNTRY,[enemy_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[enemy_country.Custom('CL_tt')],X [enemy_country.Custom('CL_INST')|L]#!#! к нам прибыли дипломаты из #ONCLICK:COUNTRY,[GetCountry('LUC').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('LUC').Custom('CL_tt')],X [GetCountry('LUC').Custom('CL_GEN')|L]#!#!. Они обсудили с нами ход боевых действий и сообщили, что [GetCountry('PIS').GetName] готов[GetCountry('PIS').Custom('end_ityat')] войска, чтобы вторгнуться в наши края. Однако есть способ это предотвратить: нам предложили продать [GetCountry('LUC').Custom('CL_ACC')] #ONCLICK:COUNTRY,[GetCountry('PIS').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('PIS').Custom('CL_tt')],X [GetCountry('PIS').Custom('CL_DAT')|L]#!#!, обеспечив себе — мир, а им — финансовое преимущество."
 flavor_luc.1001.a: "Не будем рисковать: нам не нужен ещё один враг в Италии."
 flavor_luc.1001.b: "Наши ленники не продаются."
 flavor_luc.1002.title: "$flavor_luc.1000.title$"
 flavor_luc.1002.desc: "Власти #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! обратились к нам с любопытным предложением: они желают продать нам своего ленника #ONCLICK:COUNTRY,[GetCountry('LUC').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('LUC').Custom('CL_tt')],X [GetCountry('LUC').Custom('CL_ACC')|L]#!#!. В обмен мы заключим с ними перемирие и не станем вмешиваться в конфликт с #ONCLICK:COUNTRY,[enemy_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[enemy_country.Custom('CL_tt')],X [enemy_country.Custom('CL_INST')|L]#!#!."
 flavor_luc.1002.a: "Эта сделка того стоит."
 flavor_luc.1002.b: "Зачем покупать, если можно завоевать?"
 flavor_luc.1100.entry: "$flavor_luc.1100.title$"
 flavor_luc.1100.title: "Выгодный союз"
 flavor_luc.1100.desc: "Наше положение в #TOOLTIP:REGION,italy_region,X #L Италии#!#! достаточно прочно, однако это не означает, что можно расслабиться: угроза извне может возникнуть в любой момент. Именно поэтому [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] предлагает попытаться заключить союз с #ONCLICK:COUNTRY,[GetCountry('GEN').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GEN').Custom('CL_tt')],X [GetCountry('GEN').Custom('CL_INST')|L]#!#!: он пойдёт на пользу обеим сторонам, и всякий, кто попытается завоевать этот регион, будет вынужден противостоять сразу двум сильным державам."
 flavor_luc.1100.a: "Такой союз будет очень кстати."
 flavor_luc.1100.b: "Чтобы обезопасить границы, лучше будет их расширить."
 flavor_luc.1101.title: "$flavor_luc.1100.title$"
 flavor_luc.1101.desc: "В #TOOLTIP:REGION,italy_region,X #L Италии#!#! сегодня царит непростая обстановка, и многие державы вынуждены сражаться с врагами в гордом одиночестве. Это, впрочем, не значит, что и нам нужно оставаться одним: к нам как раз прибыли дипломаты из #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_GEN')|L]#!#!, желающие заключить с нами союз. И [target_character.GetName], и [target_character2.GetName] смогут не только отстоять свою независимость, но и, возможно, помочь друг другу избавиться от угроз извне."
 flavor_luc.1101.a: "Это определённо пойдёт на пользу нам обоим."
 flavor_luc.1101.b: "Не стоит им помогать. Лучше попробуем завоевать их..."