l_russian:
  flavor_byz_ser.1.title: "Могутній деспот"
  flavor_byz_ser.1.entry: "$flavor_byz_ser.1.title$"
  flavor_byz_ser.1.desc: "#L [ROOT.GetCountry.GetAdjective]а#! провінція [ShowProvinceDefinitionName('vardar_province')] перебуває під владою могутнього магната на ім’я [target_character.GetName], чия слава та вплив дозволили [Select_CString(target_character.IsFemale, 'їй', 'йому')] стати практично [Select_CString(target_character.IsFemale, 'незалежною правителькою', 'незалежним правителем')]. Поки що [Select_CString(target_character.IsFemale, 'вона', 'він')] зберігає формальну відданість [ROOT.GetCountry.Custom('rank_ua_DAT')|l]. Однак такі багаті та впливові правителі рідко зберігають вірність сюзерену надто довго.\n\nЗа чутками, [target_character.GetNameWithNoTooltip] подумує розірвати свої васальні узи заради титулів [target_country2.Custom('endlong_predlog_vvo')] [target_country2.Custom('longname_ua_PREP')] або навіть [target_country3.Custom('endlong_predlog_vvo')] [target_country3.Custom('longname_ua_PREP')]."
  flavor_byz_ser.1.a: "Подібний непослух лише доводить, чому [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'повинна', 'повинен')] зосередити всю владу у своїх руках."
  flavor_byz_ser.1.a.entry: "Подібний непослух лише доводить, чому влада повинна бути зосереджена в руках правителя."
  flavor_byz_ser.1.b: "Ми повинні заручитися [Select_CString(target_character.IsFemale, 'її', 'його')] відданістю."
  flavor_byz_ser.1.b.entry: "Ми повинні заручитися його відданістю."
  flavor_byz_ser.2.title: "$flavor_byz_ser.1.title$"
  flavor_byz_ser.2.entry: "$flavor_byz_ser.2.title$"
  flavor_byz_ser.2.desc: "Провінція [ShowProvinceDefinitionName('vardar_province')], колись належна могутній країні під назвою [ROOT.GetCountry.GetLongName], вже довгий час перебуває під владою варварів. Тепер же, через багато десятиліть, у нас з’явився шанс повернути її завдяки допомозі несподіваного союзника.\n\n#L [target_country.GetAdjective]ий#! магнат на ім’я [target_character.GetName] править #ONCLICK:COUNTRY,[origin_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[origin_country.Custom('CL_tt')],X [origin_country.Custom('CL_INST')|L]#!#! і, схоже, [Select_CString(target_character.IsFemale, 'сама', 'сам')] собі на думці. Формально [Select_CString(target_character.IsFemale, 'вона', 'він')] зберігає відданість [target_country.Custom('longname_ua_wntt_DAT')], однак наші шпигуни повідомляють, що [Select_CString(target_character.IsFemale, 'її', 'його')] вірність мінлива і [Select_CString(target_character.IsFemale, 'її', 'його')] можна переманити на наш бік за допомогою деякої хитрості."
  flavor_byz_ser.2.a: "Осиплемо [Select_CString(target_character.IsFemale, 'її', 'його')] золотом!"
  flavor_byz_ser.2.a.entry: "Осипати його золотом!"
  flavor_byz_ser.3.title: "$flavor_byz_ser.1.title$"
  flavor_byz_ser.3.entry: "$flavor_byz_ser.3.title$"
  flavor_byz_ser.3.desc: "[target_character.GetName], раніше [Select_CString(target_character.IsFemale, 'відзначилася', 'відзначився')] у кривавій #L [target_country2.GetAdjective|l]ій#! громадянській війні, [Select_CString(target_character.IsFemale, 'набула', 'набув')] значної влади та впливу [ROOT.GetCountry.Custom('end_predlog_vvo')] #L [ROOT.GetCountry.GetAdjective|l]ій#! провінції [ShowProvinceDefinitionName('vardar_province')]. Попри те, що [Select_CString(target_character.IsFemale, 'вона', 'він')] залишається #TOOLTIP:SUBJECT_TYPE,vassal,X #L васалом#!#! #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!, [Select_CString(target_character.IsFemale, 'її', 'його')] правління практично нічим не обмежене завдяки #TOOLTIP:SOCIETAL_VALUE,centralization_vs_decentralization,X #L самоврядності#!#! [target_country.Custom('CL_GEN')]. [Select_CString(target_character.IsFemale, 'Вона', 'Він')] [target_character.GetSheHe] може стати найвпливовішою фігурою в регіоні."
  flavor_byz_ser.3.a: "Влада розбещує, а деспотична влада розбещує деспотично."
  SER_threat_of_secession: "Якщо на початку #W 1341#! року [Concept('subject_loyalty', 'лояльність васала')|e] у #ONCLICK:COUNTRY,[origin_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[origin_country.Custom('CL_tt')],X [origin_country.Custom('CL_GEN')|L]#!#! становитиме менше #Y 50%#!, він зможе відійти від свого попереднього сюзерена та стати #TOOLTIP:SUBJECT_TYPE,vassal,X #L васалом#!#! #ONCLICK:COUNTRY,[target_country2.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country2.Custom('CL_tt')],X [target_country2.Custom('CL_GEN')|L]#!#!"
  SMC_player: "Оскільки #ONCLICK:COUNTRY,[origin_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[origin_country.Custom('CL_tt')],X [origin_country.Custom('CL_INST')|L]#!#! керує гравець, остаточне рішення повністю залежить від його вибору у відповідній [Concept('event', 'події')|e]"
  BYZ_threat_of_secession: "Якщо на початку #W 1341#! року [Concept('subject_loyalty', 'лояльність васала')|e] у #ONCLICK:COUNTRY,[origin_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[origin_country.Custom('CL_tt')],X [origin_country.Custom('CL_GEN')|L]#!#! становитиме менше #Y 50%#!, він зможе відійти від свого попереднього сюзерена та стати #TOOLTIP:SUBJECT_TYPE,vassal,X #L васалом#!#! #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!"
  SMC_threat_of_secession: "У #W 1341#! році ми зможемо стати #TOOLTIP:SUBJECT_TYPE,vassal,X #L васалом#!#! #ONCLICK:COUNTRY,[target_country2.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country2.Custom('CL_tt')],X [target_country2.Custom('CL_GEN')|L]#!#!. Залежно від нашого рівня [Concept('subject_loyalty', 'лояльності васала')|e], вибір на користь того чи іншого сюзерена може призвести до зниження [Concept('stability', 'стабільності')|e]"
  flavor_byz_ser.4.title: "Момент істини"
  flavor_byz_ser.4.entry: "$flavor_byz_ser.4.title$"
  flavor_byz_ser.4.desc: "За минулі роки [ROOT.GetCountry.GetAdjective|l]ий#! [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] неодноразово [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'приймала', 'приймав')] #L [target_country2.GetAdjective|l]их#! посланців. Вони хочуть вбити клин між нами та #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#!, сподіваючись штовхнути нас в обійми [target_country2.Custom('rank_ua_GEN')|l] біля наших південних кордонів. Однак ми наскрізь бачимо їхні інтриги й не піддамося на подібні порожні вмовляння. Зрештою все залежить від нас. Незалежно від того, яку сторону ми оберемо, це рішення визначить долю #TOOLTIP:REGION,balkan_region,X #L Балкан#!#! на багато років уперед."
  flavor_byz_ser.4.a: "Нікому не дозволено сумніватися в нашій вірності."
  flavor_byz_ser.4.b: "Настав час щось змінювати."
  flavor_byz_ser.5.title: "Доля [origin_country.Custom('longname_ua_wntt_GEN')]"
  flavor_byz_ser.5.desc: "Попри всі чутки про #L [origin_country.GetAdjective|l]у#! нелояльність, виявилося, що узи #TOOLTIP:CULTURE,$serbian_tt$,X #L сербської#!#! крови, які пов’язують магнатів та #L [target_country.GetAdjective|l]у#! країну, сильніші за жадібність... Навіть попри #L [target_country2.GetAdjective|l]е#! втручання, [origin_country.GetGovernment.GetRulerTitle|l] [origin_country.Custom('CL_GEN')] не [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'змінила', 'змінив')] своєї думки — [origin_country.GetNameWithNoTooltip] залиша[origin_country.Custom('end_yeyut')]ся частиною [target_country.Custom('longname_ua_wntt_GEN')]."
  flavor_byz_ser.5.byz: "І все ж одного дня ми повернемо собі втрачене..."
  flavor_byz_ser.5.ser: "Очікувано."
  flavor_byz_ser.6.title: "$flavor_byz_ser.5.title$"
  flavor_byz_ser.6.desc: "Між #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_INST')|L]#!#! та [target_country2.Custom('longname_ua_INST')] спалахнув дипломатичний конфлікт, під час якого сталося щось справді незвичайне! Лорди #ONCLICK:COUNTRY,[origin_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[origin_country.Custom('CL_tt')],X [origin_country.Custom('CL_GEN')|L]#!#! перейшли на бік [target_country2.Custom('longname_ua_wntt_GEN')], присягнувши ворогам своїх колишніх повелителів. Рідко який магнат наважується зрадити свого сюзерена!\n\n[origin_country.GetGovernment.GetRulerTitle] [origin_country.Custom('CL_GEN')] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'вирішила', 'вирішив')] долю провінції [ShowProvinceDefinitionName('vardar_province')] — [origin_country.GetNameWithNoTooltip] більше не схил[origin_country.Custom('end_ityat')]ся перед [target_country.Custom('CL_INST')], оскільки майбутнє цієї країни відтепер пов’язане [target_country2.Custom('end_predlog_sso')] [target_country2.Custom('CL_INST')]."
  flavor_byz_ser.6.byz: "Вони зробили мудрий вибір."
  flavor_byz_ser.6.ser: "Дехто за таке поплатиться!"
  SMC_remains_vassal_of_serbia: "[origin_country.GetName] залиша[origin_country.Custom('end_yeyut')]ся #TOOLTIP:SUBJECT_TYPE,vassal,X #L васалом#!#! #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!"