l_russian:
  flavor_rag.1000.title: "Ворог біля воріт"
  flavor_rag.1000.entry: "$flavor_rag.1000.title$"
  flavor_rag.1000.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] отримав лихі вісті: величезне #L [GetCountry('TUR').GetAdjective|l] військо#! все ж підійшло до наших кордонів. На жаль, очевидно, що [ROOT.GetCountry.GetFlavorRank|l] не висто[ROOT.GetCountry.Custom('endrank_yityat')] під його натиском, і тому деякі наші дворяни виступили зі сміливою пропозицією. На їхню думку, [GetCountry('TUR').GetNameWithNoTooltip] і [ROOT.GetCountry.GetName] не мають жодних суттєвих протиріч, і, отже, визнання їхнього верховенства з виплатою щорічної данини в обмін на захист і свободу може стати для нас єдиним способом вижити."
  flavor_rag.1000.a: "Відправимо посла домовитися з турками. Можливо, [GetCountry('TUR').GetGovernment.GetRulerTitle|l] виявить прихильність."
  flavor_rag.1000.a.entry: "Відправимо посла домовитися з ним."
  flavor_rag.1000.b: "Ми відстоїмо свою незалежність, чого б нам це не коштувало!"
  flavor_rag.1000.historical_info: "У 1458 році Республіка Рагуза офіційно визнала сюзеренітет Османської імперії. Попри те, що за угодою Рагуза була змушена виплачувати щорічну данину в розмірі близько 12 500 золотих дукатів, вона зберігала широку автономію. Крім того, їй було дозволено утримувати свій купецький флот і проводити самостійну зовнішню політику. Ця взаємовигідна угода проіснувала кілька століть, протягом яких Рагуза залишалася турецьким данником аж до свого скасування в 1808 році під час Наполеонівських війн."
  flavor_rag.1001.title: "Пропозиція з [GetCountry('RAG').Custom('CL_GEN')]"
  flavor_rag.1001.desc: "Посланець [GetCountry('RAG').Custom('CL_GEN')] прибув до #L [ROOT.GetCountry.GetAdjective|l]ого#! двору зі смиренною пропозицією. [GetCountry('RAG').GetAdjectiveWithNoTooltip]ий посланець визнає, що його [GetCountry('RAG').GetFlavorRank|l] не в змозі чинити опір нашій міці й замість цього пропонує прагматичне рішення. Вони погоджуються визнати наше верховенство, а [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] отримуватиме щорічну данину за наш захист і право вільно торгувати. Одні придворні вбачають у цьому вигідну нагоду розширити наш вплив, а інші вважають, що таку слабку країну слід негайно підкорити силою."
  flavor_rag.1001.a: "Приймемо їхню данину."
  flavor_rag.1001.b: "Навіщо йти на поступки, якщо можна підкорити країну силою?"