l_russian:
  flavor_nav.1.title: "Спільне правління [target_character.GetNameWithNoTooltip] та [target_character_2.GetNameWithNoTooltip]"
  flavor_nav.1.entry: "Спільне правління Жанни II та Філіппа д'Евре"
  flavor_nav.1.desc: "Зійшовши на престол #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! у 1329 році, [target_character.GetName] та [target_character_2.GetName] правили [ROOT.GetCountry.Custom('rank_ua_INST')] пліч-о-пліч, проте співправителі явно віддають перевагу володінням, які має [target_character_2.GetNameWithNoTooltip] у #TOOLTIP:REGION,france_region,X #L Франції#!#!, і часто залишають [ROOT.GetCountry.Custom('CL_ACC')], щоб жити у своїх [ShowCultureGroupNameWithNoTooltip('french_group')|l]их маєтностях.\n\nХоча наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] знаходив чимало здібних регентів, аби правити [ROOT.GetCountry.Custom('rank_ua_INST')] за відсутности володарів, останніми роками зростає невдоволення: численні [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]і вельможі хочуть просити обох правителів осісти на постійно в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')] [ROOT.GetCountry.GetCapital.GetName], аби [ROOT.GetCountry.GetFlavorRank|l] не видава[ROOT.GetCountry.Custom('endrank_vlaloly')]ся слабким в очах зажерливих чужоземних держав."
  flavor_nav.1.a: "Наші володіння у [ShowRegionNameWithNoTooltip('france_region')] для нас найважливіші."
  flavor_nav.1.b: "В обох королівствах слід правити однаковою мірою."
  flavor_nav.1.c: "Землі [ROOT.GetCountry.GetNameWithNoTooltip] мають бути нашим головним клопотом."
  flavor_nav.2.title: "Сходження [target_character.GetNameWithNoTooltip] на престол"
  flavor_nav.2.entry: "Сходження на престол Карла Наваррського"
  flavor_nav.2.desc: "Після смерти [GetCharacter('nav_jeanne_ii_capet').GetName] честолюбний [target_character.GetName] зійшов на престол. Після прибуття до [ROOT.GetCountry.GetCapital.GetName] для проведення [ROOT.GetCountry.GetGovernment.GetAdjective|U] церемонії та коронації [target_character.GetSheHe] уже виявляє себе як нетиповий правитель, показуючи [target_character.GetHerselfHimself] таким, оскільки [target_character.GetNameWithNoTooltip] висловив бажання скласти присягу на [ShowDialectName('aragonese_dialect')]. Це викликало певне невдоволення серед [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], яке воліло б, щоб присяга за звичаєм складалася на [ShowLanguageNameWithNoTooltip('latin_language')]."
  flavor_nav.2.a: "Скласти присягу романською мовою."
  flavor_nav.2.b: "Безглузда затія: присяга має бути складена на [ShowLanguageNameWithNoTooltip('latin_language')]."
  flavor_nav.2.c: "Нехай присягу складуть натомість на [ShowLanguageNameWithNoTooltip('basque_language')]."
  flavor_nav.3.title: "Володіння [target_character.GetNameWithNoTooltip]"
  flavor_nav.3.entry: "Французькі володіння Карла Наваррського"
  flavor_nav.3.desc: "Успадкувавши землі, якими володіли [GetCharacter('nav_philip_iii_evreux').GetName] та [GetCharacter('nav_jeanne_ii_capet').GetName], [target_character.GetName] нині править розлогими теренами, що охоплюють #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! та кілька володінь у #TOOLTIP:REGION,france_region,X #L Франції#!#!. Хоч [GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] та [GetCharacter('nav_philip_iii_evreux').GetNameWithNoTooltip] правили [ROOT.GetCountry.Custom('CL_INST')] спільно, вони навідувалися до цього [ROOT.GetCountry.('rank_ua_GEN')|l] лише ненадовго, воліючи мешкати у Франції.\n\nПісля сходження володаря [target_character.GetNameWithNoTooltip] численні прихильники при дворі закликали [target_character.GetHerHim] осісти на постійно в [ROOT.GetCountry.Custom('CL_PREP')], хоча дехто вважає, що [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] плекає значно більші прагнення щодо спірного французького престолу."
  flavor_nav.3.a: "Вести справи [ROOT.GetCountry.GetGovernment.GetCourtTitle] у наших володіннях у [ShowRegionNameWithNoTooltip('france_region')]."
  flavor_nav.3.b: "Мати [ROOT.GetCountry.GetGovernment.Custom('CL_ACC')] у [ROOT.GetCountry.GetNameWithNoTooltip]."
  flavor_nav.3.c: "Зосередимо нашу владу на [evr_country.GetNameWithNoTooltip]."
  flavor_nav.3.c.entry: "Правити нашими володіннями з Евре."
  nav_will_be_able_to_rally_other_appanages_tt: "Досягнення #G 190#! у відносинах з апанажним васалом #ONCLICK:COUNTRY,[GetCountry('FRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('FRA').GetKey],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#! зробить його схильнішим підтримати нас у війні проти [GetCountry('FRA').Custom('CL_GEN')] за здобуття престолу"
  flavor_nav.4.title: "Домагання дому [ShowDynastyNameWithNoTooltip('capet_dynasty')]"
  flavor_nav.4.entry: "Капетинзьке домагання"
  flavor_nav.4.desc: "Хоча багато хто підозрював, що [target_character.GetName] — честолюбн[Select_CString(target_character.IsFemale, 'а', 'ий')] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l], мало хто очікував почути про [target_character.GetHerHis] бажання прямо заявити права на престол #ONCLICK:COUNTRY,[fra_country.GetKey] #TOOLTIP:COUNTRY,[fra_country.GetKey],X [fra_country.Custom('CL_GEN')|L]#!#!. Хоч права претендента [target_character.GetNameWithNoTooltip] сильні завдяки крові дому #TOOLTIP:DYNASTY,$capet_dynasty_tt$,X #L Капетингів#!#!, яку мала [GetCharacter('nav_jeanne_ii_capet').GetShortName], однією з умов успадкування [GetCharacter('nav_jeanne_ii_capet').GetHerHis] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! була відмова від прав на [fra_country.Custom('CL_ACC')].\n\nІ хоча багато сеньйорів [fra_country.Custom('CL_GEN')] навряд чи повністю визнають домагання, які висуває [target_character.GetNameWithNoTooltip], через прадавній [ShowHeirSelectionName('salic_law')], дехто вважає, що [target_character.GetNameWithNoTooltip] має використати свій політичний вплив у [fra_country.Custom('CL_PREP')], аби переконати наймогутніших вельмож."
  flavor_nav.4.a: "Престол [fra_country.GetNameWithNoTooltip] по праву належить [target_character.GetNameWithNoTooltip]!"
  flavor_nav.4.a.entry: "Престол Франції по праву належить Карлу!"
  flavor_nav.4.b: "Використати ці домагання для зміцнення права на владу серед наших [ShowCultureGroupNameWithNoTooltip('french_group')] підданих."
  flavor_nav.4.c: "[GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] вже зреклася [GetCharacter('nav_jeanne_ii_capet').GetHerHis] домагання: зосередимося натомість на правлінні [ROOT.GetCountry.GetNameWithNoTooltip]."
  unlocks_enforce_the_capetian_claim_to_france_tt: "Відкриває [decision|e] «$navarre_charles_ii_claim_to_france.title$»"
  nav_appanage_support_for_french_throne_tt: "Якщо [ROOT.GetCountry.GetNameWithNoTooltip] є апанажем, досягнення #G +190#! у відносинах з іншими апанажами [GetCountry('FRA').Custom('CL_GEN')] схилить їх підтримати нас у війні проти [GetCountry('FRA').Custom('CL_GEN')] за здобуття престолу"
  flavor_nav.5.title: "Союз із [target_character_2.GetNameWithNoTooltip]"
  flavor_nav.5.entry: "Союз з Етьєном Марселем"
  flavor_nav.5.desc: "Спершу численні спроби заручитися підтримкою, які робив [target_character.GetName], зайшли в глухий кут: чимало [fra_country.GetAdjectiveWithNoTooltip|l]их сеньйорів заявили про вірність монарху [fra_ruler.GetName] і відкинули претензії, що висував [target_character.GetName]. Та хоча [target_character.GetNameWithNoTooltip] і [Select_CString(target_character.IsFemale, 'змогла схилити', 'зміг схилити')] на свій бік деяких дрібних [fra_country.GetAdjectiveWithNoTooltip|l]их вельмож, численні радники навіть не сподівалися почути, що впливова постать [target_character_2.GetName] [Select_CString(target_character_2.IsFemale, 'готова підтримати', 'готовий підтримати')] претензії [target_character.GetNameWithNoTooltip]. Хоч [target_character_2.GetNameWithNoTooltip] і належить до [fra_country.GetAdjectiveWithNoTooltip|l]их #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L містян#!#!, цей діяч давно був як скалка в оці для правителя [fra_ruler.GetNameWithNoTooltip], гальмуючи чимало його починань у Генеральних штатах. Хоч [target_character_2.GetNameWithNoTooltip] і стане безцінною знахідкою, дехто побоюється, що прагнення цього діяча можуть розходитися з намірами [target_character.GetNameWithNoTooltip], а тому [target_character_2.GetSheHe] може стати тягарем.\n\nДо того ж [target_character_2.GetNameWithNoTooltip] приніс звістку, що сеньйори #ONCLICK:COUNTRY,[nrm_country.GetKey] #TOOLTIP:COUNTRY,[nrm_country.GetKey],X [nrm_country.Custom('CL_GEN')|L]#!#! дедалі більше невдоволені монархом [fra_ruler.GetNameWithNoTooltip] і охоче підтримають претендента [target_character.GetShortNameWithNoTooltip]."
  flavor_nav.5.a: "[target_character_2.GetNameWithNoTooltip] стане неоціненним соратником."
  flavor_nav.5.a.entry: "Етьєн Марсель стане неоціненним соратником."
  flavor_nav.5.b: "Нехай [target_character_2.GetHerHim] спрямовує прибутки [fra_country.GetNameWithNoTooltip] до нашої скарбниці."
  flavor_nav.5.b.entry: "Нехай він спрямовує прибутки Франції до нашої скарбниці."
  flavor_nav.5.c: "Цілком відмовитися від [target_character_2.GetHerHis] допомоги. Ми візьмемо [fra_country.GetNameWithNoTooltip] без [target_character_2.GetHerHis] інтриг."
  flavor_nav.5.c.entry: "Цілком відмовитися від його допомоги. Ми візьмемо Францію без його інтриг."
  nav_decision_seizure_of_duchy_of_normandy_tt: "Відкриває [decision|e] «$nav_coercing_of_normandy.title$»"
  flavor_nav.6.title: "Вогняний кінець"
  flavor_nav.6.entry: "Вогняна смерть Карла Наваррського"
  flavor_nav.6.desc: "Хоча здоров’я правителя [target_character.GetName] підупало останніми роками, наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] усе ж приголомшила звістка про те, що [target_character.GetSheHe] [Select_CString(target_character.IsFemale, 'загинула', 'загинув')] у пожежі у власних покоях минулої ночі. При дворі ширяться чутки, буцімто під час лікування свічка впала в ліжко, де [Select_CString(target_character.IsFemale, 'лежала', 'лежав')] [target_character.GetNameWithNoTooltip], і все запалало.\n\nТепер престол посідає [our_ruler.GetName], маючи значно менше амбіцій, ніж [our_ruler.GetHerHis] попередник, і багато хто гадає, як літописці #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! згадуватимуть правління [target_character.GetNameWithNoTooltip]."
  flavor_nav.6.a: "[target_character.GetHerHis|U] правління запам’ятається як амбітне, але жахливе."
  flavor_nav.6.b: "[target_character.GetSheHe|U] увійде в пам’ять як завойовник [GetCountry('FRA').Custom('CL_GEN')]!"
  flavor_nav.6.c: "[target_character.GetSheHe|U] увійде в пам’ять своєю увагою до [ROOT.GetCountry.Custom('CL_GEN')], попри власне [ShowCultureGroupNameWithNoTooltip('french_group')|l]е походження."
  flavor_nav.6.d: "Нам слід дивитися в майбутнє."
  flavor_nav.7.title: "Спірні прикордонні землі"
  flavor_nav.7.entry: "Поділ прикордонних областей"
  flavor_nav.7.desc: "Хоч стосунки між #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#! та #ONCLICK:COUNTRY,[cas_country.GetKey] #TOOLTIP:COUNTRY,[cas_country.GetKey],X [cas_country.Custom('CL_INST')|L]#!#! раніше були ворожими, володарі [cas_country.Custom('CL_GEN')] ніколи не прагнули повного підкорення [ROOT.GetCountry.Custom('rank_ua_GEN')|l]. Утім, у прикордонні #TOOLTIP:PROVINCE_DEFINITION,biscay_province,X #L Біскаї#!#!, #TOOLTIP:PROVINCE_DEFINITION,gipuzkoa_province,X #L Гіпускоа#!#! та #TOOLTIP:PROVINCE_DEFINITION,alava_province,X #L Алави#!#! уже тривалий час зростає напруга між наймогутнішими місцевими родами через нечітко визначені межі краю.\n\nІ хоча посланці #ONCLICK:COUNTRY,[cas_country.GetKey] #TOOLTIP:COUNTRY,[cas_country.GetKey],X [cas_country.Custom('CL_GEN')|L]#!#! та [our_ruler.GetName] намагалися залагодити прикордонні суперечки, початок лиха «[ShowDisasterName('castilian_civil_war')]» у [cas_country.Custom('CL_PREP')] суттєво загальмував перемовини, спричинивши ще більше чвар між видатними родами краю.\n\nТепер, коли [cas_country.GetNameWithNoTooltip] загрузну[cas_country.Custom('end_vlaloly')] у міжусобицях, представники цих місцевих родин звернулися до правителя [our_ruler.GetNameWithNoTooltip] із проханням розпочати вторгнення та повернути спірні землі."
  flavor_nav.7.a: "Ці територіальні суперечки, якщо їх не розв’язати, найімовірніше, і далі обурюватимуть [ROOT.GetCountry.GetAdjectiveWithNoTooltip] родини."
  flavor_nav.7.b: "Призупинити всі подальші дипломатичні перемовини: ми мусимо забезпечити наші права на цей регіон!"
  flavor_nav.8.title: "Вакуум влади проникає до [ROOT.GetCountry.GetNameWithNoTooltip]"
  flavor_nav.8.entry: "Вакуум влади проникає до Наварри"
  flavor_nav.8.desc: "Хоча лихо «[ShowDisasterName('castilian_civil_war')]» добігло кінця, його наслідки все ще відчутні по всій #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!. Оскільки значна частина прикордоння тепер має менші залоги, застаріла ворожнеча між родами краю переросла у відкриту війну.\n\nЧерез слабкість #ONCLICK:COUNTRY,[cas_country.GetKey] #TOOLTIP:COUNTRY,[cas_country.GetKey],X [cas_country.Custom('CL_GEN')|L]#!#! приборкати таке запекле протистояння — надто важке завдання, щоби наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] зміг упоратися з ним самотужки."
  flavor_nav.8.a: "На [ROOT.GetCountry.GetNameWithNoTooltip] чекають небезпечні часи."
  nav_end_blood_feud_decision_enabled_tt: "Відкриває [decision|e] «$nav_end_the_blood_feuds.title$»"
  nav_sow_division_in_the_borderlands_enabled_tt: "Відкриває [decision|e] «$nav_sow_division_in_the_borderlands.title$»"
  flavor_nav.9.title: "Розпад [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')]"
  flavor_nav.9.entry: "Розпад Біскаї"
  flavor_nav.9.desc: "Хоча за контроль над #TOOLTIP:PROVINCE_DEFINITION,biscay_province,X #L Біскаєю#!#! тривалий час сперечалися [cas_country.GetName] та [ROOT.GetCountry.GetName], цей край був домівкою для багатьох видатних родів, з-поміж яких дім Аро залишався найвпливовішим і найвірнішим васалом. Утім, [cas_country.GetName] поча[cas_country.Custom('end_vlaloly')] безпосередньо скасовувати титули в краї і згодом приєднувати спірні землі в межах Біскаї.\n\nТакі дії [cas_country.Custom('CL_GEN')] розлютили рід Аро, який тепер закликає наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] підтримати повстанців у Біскаї, аби покарати тих, хто виступив за [cas_country.GetAdjectiveWithNoTooltip|l]е приєднання цього краю."
  flavor_nav.9.a: "Ми не можемо піти на поступки вимогам дому Аро, не ризикуючи викликати гнів [cas_country.GetAdjectiveWithNoTooltip]."
  flavor_nav.9.a.entry: "Ми не можемо піти на поступки вимогам дому Аро, не ризикуючи викликати гнів Кастилії."
  flavor_nav.9.b: "Підтримати родину Аро в їхніх спробах посіяти смуту на місцях."
  flavor_nav.10.title: "Поклик церкви"
  flavor_nav.10.entry: "$flavor_nav.10.title$"
  flavor_nav.10.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] відпускає свою старшу дочку до [ShowLocationName('paris')], і прямо зараз вона очікує на свиту, яка проведе її в нове життя.\n\n[target_character.GetName] народилася першою і успадкувала всі володіння батьків, але на цьому її везіння закінчилося. [GetCountry('ARA').GetGovernment.GetRuler.GetName] скасував весілля з нею і в результаті одружився з її молодшою сестрою на ім'я [target_sister.GetShortName].\n\nТепер жінку готов[ROOT.GetCountry.Custom('clergy_yiaei')] прийняти паризьк[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l], і вона збирається присвятити себе служінню нашому Господу і Спасителю.\n\nОднак деякі вважають, що [target_character.GetName] все ще може бути корисною країні і становить певну цінність у перемовах."
  flavor_nav.10.a: "Вона стане черницею."
  flavor_nav.10.a.entry: "Використати владу корони, аби не допустити подальшого кровопролиття."
  flavor_nav.10.b: "Вона ще нам стане в пригоді."
  flavor_nav.11.title: "Родини, підтримувані [ROOT.GetCountry.GetAdjectiveWithNoTooltip], здобувають перевагу в [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]"
  flavor_nav.11.entry: "Родини, підтримувані Наваррою, здобувають перевагу в прикордонні"
  flavor_nav.11.desc: "Хоч сутички між прихильниками [ROOT.GetCountry.Custom('CL_GEN')] та [GetCountry('CAS').Custom('CL_GEN')] у #TOOLTIP:SCRIPTED_GEOGRAPHY,nav_contested_basque_borderlands #L спірному баскському прикордонні#!#! завдали краю величезного спустошення, [ROOT.GetCountry.GetAdjective|l]і роди спромоглися зробити майже неможливе — відновити значну частку впливу [ROOT.GetCountry.Custom('CL_GEN')] над цим порубіжжям. І хоча [GetCountry('CAS').GetNameWithNoTooltip] усе ще може вдатися до маневрів, аби повернути контроль над цими землями, це безперечно виллється у чималі витрати для [GetCountry('CAS').GetAdjectiveWithNoTooltip|l]ого двору."
  flavor_nav.11.a: "Нехай це відкриє шлях до посилення [ROOT.GetCountry.GetNameWithNoTooltip]."
  navarre_gains_castile_basque_lands_tt: "Усі володіння [GetCountry('CAS').GetName] у [ShowScriptedGeographyName('nav_contested_basque_borderlands')] з високою ймовірністю перейдуть під владу [ROOT.GetCountry.GetName], якщо тільки [GetCountry('CAS').GetNameWithNoTooltip] не зважиться на крайні заходи, щоб утримати контроль над цими землями"
  flavor_nav.12.title: "Зміцнення ермандад"
  flavor_nav.12.entry: "$flavor_nav.12.title$"
  flavor_nav.12.desc: "Хоча ермандади #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! раніше були дієвими спільниками, десятиліття кривавої помсти між родами [ROOT.GetCountry.Custom('CL_GEN')] сягнули межі.\n\nЧимало придворних надали гроші на підтримку [ROOT.GetCountry.GetGovernment.GetAdjective|l]ої гілки ермандад. Хоча справа ця недешева, зміцнілі ермандади допоможуть утвердити владу, яку має [our_ruler.GetName], над ворогуючими родами і вгамувати їх раз і назавжди."
  flavor_nav.12.a: "Ермандади нарешті покладуть край цим родинним чварам."
  flavor_nav.13.title: "[target_character.GetNameWithNoTooltip] та опікунство над [scope_our_heir.GetNameWithNoTooltip]"
  flavor_nav.13.entry: "Хуан де Бомонт та опікунство над спадкоємцем"
  flavor_nav.13.desc: "Хоча Бомонти вже деякий час мають вплив у [ROOT.GetCountry.GetName], пропозиція особисто наставляти [scope_our_heir.GetName] стала несподіванкою. І хоча [target_character.GetName] має славу людини чести, дехто з радників побоюється, що [target_character.GetHerHis] пропозиція щодо опікунства може бути хитрістю, аби заслужити прихильність [scope_our_heir.GetNameWithNoTooltip], який одного дня стане правителем [ROOT.GetCountry.GetAdjectiveWithNoTooltip]."
  flavor_nav.13.a: "[target_character.GetHeShe|U] [Select_CString(target_character.IsFemale, 'була б чудовою наставницею', 'був би чудовим наставником')]."
  flavor_nav.13.a.entry: "Він стане чудовим наставником."
  flavor_nav.13.b: "Ми не можемо допустити, аби [target_character.GetHerHim] мав вплив на нашого [scope_our_heir.GetNameWithNoTooltip]."
  flavor_nav.13.b.entry: "Ми не можемо допустити, аби він мав вплив на нашого спадкоємця."
  flavor_nav.14.title: "[scope_our_consort.GetNameWithNoTooltip] та [target_character.GetNameWithNoTooltip]"
  flavor_nav.14.entry: "Вплив консорта та Педро де Перальта"
  flavor_nav.14.desc: "Одна зі знатних родин [ROOT.GetCountry.GetGovernment.GetCourtTitle], Аграмонти, здобула значний вплив за [target_character.GetName], а також налагодила тісну співпрацю з [scope_our_consort.GetName]. Хоча їхня діяльність принесла плоди для [ROOT.GetCountry.GetName], дехто побоюється, що за їхніми інтригами можуть критися темніші наміри."
  flavor_nav.14.a: "Аграмонти добре служили нам."
  flavor_nav.14.b: "[target_character.GetHerHis|U] вплив на [scope_our_consort.GetNameWithNoTooltip] непокоїть: слід розлучити їх."
  flavor_nav.14.b.entry: "Його вплив на консорта викликає занепокоєння: треба розлучити їх."
  flavor_nav.15.title: "Узурпація влади у [the_legal_heir.GetNameWithNoTooltip], що насувається"
  flavor_nav.15.entry: "Узурпація влади у спадкоємця, що насувається"
  flavor_nav.15.desc: "Хоча [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'правила', 'правив')] впевнено, нещодавно тяжка недуга прикувала [our_ruler.GetHerHis] до ліжка. Побоюючись, що життя [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] добігає кінця, прибічники аграмонтесів, вірні володарю [the_consort_usurper.GetName], потай коронували [the_consort_usurper.GetHerHim] як нов[Select_CString(the_consort_usurper.IsFemale, 'у правительку', 'ого правителя')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#.\n\nПоки [the_legal_heir.GetNameWithNoTooltip] перебуває далеко від двору, дехто з бомонтесів таємно надіслав листи до [the_legal_heir.GetNameWithNoTooltip], аби сповістити [the_legal_heir.GetHerHim] про зраду, сподіваючись зруйнувати змову аграмонтесів, поки вона не принесла плодів."
  flavor_nav.15.a: "[the_consort_usurper.GetNameWithNoTooltip] краще підходить на роль правителя [ROOT.GetCountry.GetNameWithNoTooltip]."
  flavor_nav.15.a.entry: "Двір краще підходить на роль правителя Наварри."
  flavor_nav.15.b: "Стати на бік правителя [the_legal_heir.GetNameWithNoTooltip], законного володаря [ROOT.GetCountry.Custom('CL_GEN')]!"
  flavor_nav.15.b.entry: "Стати на бік нашого спадкоємця, законного правителя Наварри!"
  flavor_nav.15.historical_info: "Співправителі Бланка I та Хуан II ухвалили, що їхній син Карл, принц Віанський, успадкує трон Наварри після смерті Бланки. Однак замість того щоб передати трон Карлу, Хуан II вирішив зберегти владу над землями Наварри, фактично ставши королем і скинувши власного сина. Заручившись підтримкою партій Бомонте та Аграмонте, вони згодом зіткнулися в Наваррській міжусобній війні, з якої Хуан II зрештою вийшов переможцем, зберігши за собою трон Наварри."
  flavor_nav.16.title: "Претензія [target_country.GetAdjectiveWithNoTooltip]"
  flavor_nav.16.desc: "Здобувши значну підтримку по всій [ShowRegionName('france_region')], [target_character.GetName] відкрито заявив(ла) про свої права на трон [ShowRegionNameWithNoTooltip('france_region')] і розіслав(ла) гінців по всій [ShowRegionNameWithNoTooltip('france_region')], пропонуючи останню нагоду приєднатися до [target_character.GetHerHim] у [target_character.GetHerHis] спробі захопити його. Хоча [target_character.GetShortNameWithNoTooltip] здобув(ла) неабияку прихильність нашого [ROOT.GetCountry.GetGovernment.GetCourtTitle], дехто з радників побоюється, що [target_character.GetSheHe] сильно похитне становище у [ShowRegionNameWithNoTooltip('france_region')], якщо [target_character.GetSheHe] досягне успіху."
  flavor_nav.16.a: "Ми заявимо про підтримку [target_character.GetNameWithNoTooltip]."
  flavor_nav.16.b: "Лишитися осторонь цієї війни."
  flavor_nav.16.c: "[target_character.GetSheHe|U] має бути зупинен[Select_CString(target_character.IsFemale, 'а', 'ий')]."
  nav_appanage_ally_join_war_tt: "[ROOT.GetCountry.GetName] приєднається до війни [target_character.GetName] за контроль над [ShowRegionName('france_region')]"
  flavor_nav.17.title: "Важка доля [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]"
  flavor_nav.17.desc: "Багато наших земель уздовж [ShowScriptedGeographyName('nav_contested_basque_borderlands')] із [GetCountry('NAV').GetName] виявилися захоплені про-[GetCountry('NAV').GetAdjectiveWithNoTooltip] фракціями, а чимало родин [ShowCultureName('basque')], вірних [ROOT.GetCountry.GetName], було розорено. Хоча дехто в [ROOT.GetCountry.GetGovernment.GetCourtTitle] вважає, що регіон ще не втрачено, відновити там владу буде непросто — багато місцевих жителів тепер залежать від могутніх [GetCountry('NAV').GetAdjectiveWithNoTooltip] родин."
  flavor_nav.17.a: "Нехай прикордонні землі відійдуть до [GetCountry('NAV').GetNameWithNoTooltip]."
  flavor_nav.17.b: "Ми запам’ятаємо це повстання люду [ShowCultureNameWithNoTooltip('basque')]."
  flavor_nav.17.c: "Негайно придушити повстання, хоч би чого це коштувало!"
  flavor_nav.20.title: "Монастир Сан-Франциско в Оліте"
  flavor_nav.20.entry: "$flavor_nav.20.title$"
  flavor_nav.20.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] — дуже побожна людина, тому [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'її', 'його')] так засмучують темпи будівництва монастиря Сан-Франциско в [ShowLocationName('olite')].\n\nРоботи ведуться вже понад сто років, і проєкт поки далекий від завершення.\n\nЩоб прискорити будівництво, потрібно багато грошей, зате цей монастир підвищить нашу славу і стане новою точкою тяжіння."
  flavor_nav.20.a: "І слава Богу!"
  flavor_nav.20.b: "Стільки чекали, і ще почекаємо."
  flavor_nav.20.historical_info: "За легендою, святий Франциск Ассізький заснував монастирську громаду в Оліте приблизно в 1213-1214 році під час паломництва до Сантьяго-де-Компостели.\n\nОфіційно орден був заснований королем Теобальдом II, а наступні правителі Наварри — особливо Іоанна II та Карл II, — підтримували об'єднання духовно та фінансово, сприяючи його розвитку та залученню нових послідовників.\n\n Згодом громада перетворилася на апостольську школу: тут навчали місіонерів для відправки до Іспанії та Америки, а під час кампанії 1795 року будівлю було переобладнано на госпіталь."
  flavor_nav.21.title: "Поклик церкви"
  flavor_nav.21.entry: "$flavor_nav.21.title$"
  flavor_nav.21.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] відпускає свою старшу доньку до [ShowLocationName('paris')], і просто зараз вона очікує на почет, який проведе її до нового життя.\n\n[target_character.GetName] народилася першою і успадкувала всі володіння батьків, але на цьому її талан скінчився. [GetCountry('ARA').GetGovernment.GetRuler.GetName] скасував весілля з нею і зрештою одружився з її молодшою сестрою на ім’я [target_sister.GetShortName].\n\nТепер жінку готові прийняти паризькі [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l], і вона збирається присвятити себе служінню нашому Господу та Спасителю.\n\nОднак дехто вважає, що [target_character.GetName] все ще може стати в пригоді країні і має певну вагу на перемовинах."
  flavor_nav.21.a: "Вона стане черницею."
  flavor_nav.21.b: "Вона ще стане нам у пригоді."
  flavor_nav.21.historical_info: "Попри те, що Жанна була заручена з Педро IV Арагонським, весілля так і не відбулося. Історики припускають, що вона страждала від недуги, яка робила її непривабливою нареченою. Натомість її місце зайняла молодша сестра Марія, яка й вийшла заміж за Педро.\n\nЧерез цей шлюб Жанна була змушена зректися прав на престолонаслідування й пішла до францисканського абатства Лоншан біля Парижа як черниця ордену кларисок."
  flavor_nav.30.title: "Іригаційні проєкти в Туделі"
  flavor_nav.30.entry: "$flavor_nav.30.title$"
  flavor_nav.30.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle|L] подовгу затримується у своїх володіннях у #TOOLTIP:REGION,france_region,X #L Франції#!#!, проте [ROOT.GetCountry.GetLongName] завжди залишається в [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'її', 'його')] думках, і [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'вона', 'він')] незмінно знаходить час на розвиток тамтешніх проєктів.\n\nПівденні області [ROOT.GetCountry.Custom('rank_ua_GEN')], зокрема [ShowLocationName('tudela')], відрізняються посушливим кліматом, проте землі там родючі. Викопавши кілька каналів, ми покращимо іригацію полів, і вони почнуть приносити більше врожаю."
  flavor_nav.30.a: "Це суттєво підвищить урожайність."
  flavor_nav.30.b: "У нас немає коштів на такі задуми."
  flavor_nav.30.historical_info: "Під час свого правління Іоанна II та Філіпп III втілили в життя низку проєктів, що сприяли господарському розвитку Наварри. Одним з них стало розширення зрошення в області Тудели — найважливішого південного міста королівства."
  flavor_nav.40.title: "Копія «Законів Наварри»"
  flavor_nav.40.entry: "$flavor_nav.40.title$"
  flavor_nav.40.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle|L] все більше уваги приділяє нагальним проблемам своєї країни, тому було вирішено замовити для [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'неї', 'нього')] копію #italic «Законів Наварри»#!.\n\nМи залучимо до роботи над копією наймайстерніших переписувачів, а її витончено прикрашена обкладинка буде виконана з першосортної шкіри. Як того вимагає звичай, при складанні подібних документів використовуються [spanish_language.GetName] та [basque_language.GetName], точніше кажучи, їх химерне змішання.\n\nБіда в тому, що [ROOT.GetCountry.GetGovernment.GetRulerTitle] знає тільки [french_language.GetName] і зовсім не володіє наваррсько-арагонською мовою."
  flavor_nav.40.a: "Ми перекладемо книгу на французьку."
  flavor_nav.40.a.entry: "Ми додамо переклад на французьку."
  flavor_nav.40.b: "Нехай правителі вчать свою споконвічну мову."
  flavor_nav.40.c: "Державною мовою має стати баскська: нею говорить більшість."
  flavor_nav.40.historical_info: "Ймовірно, для більшості підданих Королівства Наварри рідною мовою була баскська (#italic Lingua Navarrorum#!), проте в офіційних документах, як правило, використовувалася наваррсько-арагонська мова (#italic Ydiomate Navarre Terrae#!, #italic Ydiomate Navarre#! або #italic Lengoage de Navarra#!), оскільки окситанська на той час вийшла з ужитку.\n\nКрім того, з 1234 року, коли на трон Наварри зійшов перший представник Шампанської династії, у вищих колах почала набирати популярність французька."
  flavor_nav.50.title: "Облога Альхесіраса"
  flavor_nav.50.entry: "$flavor_nav.50.title$"
  flavor_nav.50.desc: "До нас дійшла новина про військові дії на #L [target_country.GetAdjective]ому#! кордоні. [GetCountry('CAS').GetName] відновлює хрестовий похід на [target_country.Custom('CL_ACC')], і [target_character.GetName] спішно [Select_CString(target_character.IsFemale,'повернулася', 'повернувся')] до [ROOT.GetCountry.Custom('CL_GEN')], щоб взяти участь у битвах.\n\nХоча втручання в цей конфлікт не несе очевидної вигоди [ROOT.GetCountry.Custom('rank_ua_DAT')], ми вважаємо своїм обов'язком допомогти сусідам вигнати #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульман#!#! з #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!."
  flavor_nav.50.a: "[target_character.GetShortNameWithNoTooltip] поведе наших бійців."
  flavor_nav.50.a.entry: "Наш чоловік поведе за собою вояків."
  flavor_nav.50.b: "Ми відправимо бійців, але [target_character.GetShortNameWithNoTooltip] [Select_CString(target_character.IsFemale,'потрібна', 'потрібен')] нам тут."
  flavor_nav.50.b.entry: "Ми відправимо вояків, але він потрібен нам тут."
  flavor_nav.50.c: "[ROOT.GetCountry.GetNameWithNoTooltip] не втручатиметься в це."
  flavor_nav.50.c.entry: "Нас це не стосується."
  flavor_nav.50.historical_info: "У 1343 році Філіп, правитель Наварри, вирішив приєднатися до хрестового походу на Гранаду: він вважав своїм обов'язком звільнити Іберію від мусульман. Хоча його військо було невеликим, воно, як і організована королем доставка харчів через Біскайську затоку, відіграло важливу роль в облозі Альхесіраса. На жаль, незабаром Філіп важко захворів і у вересні 1343 року помер. Його тіло доставили до Памплони, а серце поховали в Парижі. Свої співчуття Іоанні, вдові короля, висловив сам папа римський Климент VI. Зрештою Альхесірас упав. Іоанна правила Наваррою до своєї смерті в 1349 році, а після трон перейшов Карлу II, синові Іоанни та Філіпа."
  flavor_nav.60.title: "Остання воля королеви"
  flavor_nav.60.entry: "$flavor_nav.60.title$"
  flavor_nav.60.desc: "[target_character.GetName] відходить у ліпший світ. У листі з останньою волею король просить [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'свою наступницю', 'свого наступника')] звести каплицю для церкви Санта-Марія-ла-Реаль, розташованої в місті [ShowLocationName('olite')].\n\nДехто з придворних пропонує назвати майбутню споруду каплицею Непорочного зачаття Діви Марії. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] хоче будь-що втілити задум у життя, адже [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'їй', 'йому')] чудово відомо, наскільки набожним був [target_character.GetShortNameWithNoTooltip]."
  flavor_nav.60.a: "Остання воля королеви має бути виконана."
  flavor_nav.60.b: "Ми знайдемо цим коштам краще застосування."
  flavor_nav.60.historical_info: "У 1349 році королева Іоанна II помирає від чуми. У листі, що виражає її останню волю, вона, крім усього іншого, просить свого сина Карла II виділити кошти на будівництво каплиці для готичної церкви Санта-Марія-ла-Реаль, розташованої в Оліте.\n\nУ цій церкві члени династії Евре проводили священні церемонії та обряди. За своєю архітектурою вона нагадує Собор Паризької Богоматері."
  navarre_charles_ii_claim_to_france.title: "Законні права на [GetCountry('FRA').GetNameWithNoTooltip]"
  navarre_charles_ii_claim_to_france.desc: "Хоч [GetCharacter('nav_jeanne_ii_capet').GetName] і [Select_CString(GetCharacter('nav_jeanne_ii_capet').IsFemale, 'зреклася', 'зрікся')] прав на [GetCountry('FRA').Custom('CL_ACC')], [GetCharacter('nav_charles_ii_evreux').GetName] усе ще веде прямий родовід від колишнього монарха [GetCharacter('fra_louis_x_capet').GetName]. Навіть якщо [ShowHeirSelectionName('salic_law')] несправедливо визнає, що [GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip] не має прав на престол, домагання правителя [GetCharacter('nav_charles_ii_evreux').GetName] все одно вагоміші, ніж права нинішніх правителів [GetCountry('FRA').Custom('CL_GEN')]!"
  navarre_charles_ii_claim_to_france.a: "Настав час заявити наші законні права на [GetCountry('FRA').GetNameWithNoTooltip]!"
  navarre_charles_ii_claim_to_france_appanage_route.title: "$navarre_charles_ii_claim_to_france.title$"
  navarre_charles_ii_claim_to_france_appanage_route.desc: "$navarre_charles_ii_claim_to_france.desc$"
  navarre_charles_ii_claim_to_france_appanage_route.a: "Настав час розв’язати міжусобну війну, щоб заявити права на престол!"
  nav_appanage_willingness_to_join_tt: "Досягнення #G +190#! у відносинах з іншими апанажними васалами [GetCountry('FRA').Custom('CL_GEN')] схилить їх підтримати нас у війні проти [GetCountry('FRA').Custom('CL_GEN')] за здобуття престолу"
  nav_coercing_of_normandy.title: "Примушення [GetCountry('NRM').GetNameWithNoTooltip]"
  nav_coercing_of_normandy.desc: "Перебуваючи на вістрі [ShowSituationNameWithNoTooltip('hundred_years_war')], багато лордів [GetCountry('NRM').GetName] почали висловлювати невдоволення теперішнім правителем [GetCountry('FRA').GetName]. Завдяки успадкованим землям [GetCharacter('nav_philip_iii_evreux').GetName], [GetCharacter('nav_charles_ii_evreux').GetName] зберіг тісні зв’язки з людьми в [GetCountry('NRM').GetFlavorRank], дехто з яких, можливо, готовий визнати [GetCharacter('nav_philip_iii_evreux').GetShortNameWithNoTooltip] своїм новим сюзереном."
  nav_coercing_of_normandy.a: "Захопити владу над [GetCountry('NRM').GetNameWithNoTooltip]!"
  nav_end_the_blood_feuds.title: "Покласти край кровній ворожнечі"
  nav_end_the_blood_feuds.desc: "Від завершення [ShowDisasterName('castilian_civil_war')] значна частина [GetCountry('NAV').GetName] залишалася ареною затяжної кровної ворожнечі між родинами, що посміливішали через послаблення впливу [GetCountry('CAS').GetAdjectiveWithNoTooltip]. Тепер, коли вплив [GetCountry('NAV').GetAdjectiveWithNoTooltip] зміцнився, ми можемо скористатися цим і раз і назавжди покласти край цій ворожнечі."
  nav_end_the_blood_feuds.a: "Владу відновлено!"
  nav_sow_division_in_the_borderlands.title: "Посіяти розбрат у прикордонні"
  nav_sow_division_in_the_borderlands.desc: "Оскільки вплив [GetCountry('CAS').GetAdjective] у [ShowScriptedGeographyName('nav_contested_basque_borderlands')] нині є лише тінню колишнього, невпинна ворожнеча між родинами регіону, вірними [GetCountry('NAV').GetName], може стати в пригоді, якщо ми вирішимо підтримати їхню відкриту боротьбу проти інших родин, які все ще вірні [GetCountry('CAS').GetNameWithNoTooltip]. Хоч це й може коштувати недешево, [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')] здатні знову возз’єднатися з [GetCountry('NAV').GetNameWithNoTooltip]."
  nav_sow_division_in_the_borderlands.a: "Дозволити розоряти володіння родин суперників."
  nav_sow_division_in_the_borderlands.b: "Спалити окраїни прикордоння."
  nav_sow_division_in_the_borderlands.c: "Посіяти недовіру на землях, утримуваних [GetCountry('CAS').GetAdjectiveWithNoTooltip]."
  nav_sow_division_in_the_borderlands_a_tt: "Кожна [location|e], якою [owned|e] [GetCountry('CAS').GetName] у [ShowScriptedGeographyName('nav_contested_basque_borderlands')], отримає [ShowModifier('nav_feud_crossfire')] на 3 роки та зазнає значних втрат [prosperity|e] і [pop_satisfaction|e]"
  nav_sow_division_in_the_borderlands_b_tt: "Кожна [location|e], якою [owned|e] [GetCountry('CAS').GetName] у [ShowScriptedGeographyName('nav_contested_basque_borderlands')], отримає [ShowModifier('nav_destructive_feuds')] на 3 роки та зазнає помірних втрат [prosperity|e], [pop_satisfaction|e] і [development|e]"
  nav_sow_division_in_the_borderlands_c_tt: "Кожна [location|e], якою [owned|e] [GetCountry('CAS').GetName] у [ShowScriptedGeographyName('nav_contested_basque_borderlands')], отримає [ShowModifier('nav_widespread_distrust_caused_by_feuds')] на 3 роки та зазнає помірних втрат [prosperity|e], [pop_satisfaction|e] і [control|e]"