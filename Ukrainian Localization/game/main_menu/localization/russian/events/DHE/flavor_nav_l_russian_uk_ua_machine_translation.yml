l_russian:
  flavor_nav.1.title: "Співправителі [target_character.GetNameWithNoTooltip] та [target_character_2.GetNameWithNoTooltip]"
  flavor_nav.1.entry: "Співправителі Жанна II та Філіпп III д’Евре"
  flavor_nav.1.desc: "Після сходження на престол #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! у 1329 році [target_character.GetName] та [target_character_2.GetName] стали співправителями [ROOT.GetCountry.Custom('rank_ua_GEN')|l]. Утім, перевагу вони віддавали володінням, які [target_character_2.GetNameWithNoTooltip] свого часу [Select_CString(target_character_2.IsFemale, 'здобула', 'здобув')] у #TOOLTIP:REGION,france_region,X #L Франції#!#!. Вони повсякчас залишають [ROOT.GetCountry.Custom('CL_ACC')], воліючи жити у своїх [ShowCultureGroupNameWithNoTooltip('french_group')|l]их маєтках.\n\nХоча [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] і не має браку здібних регентів, готових правити [ROOT.GetCountry.Custom('rank_ua_INST')|l] за відсутности монархів, останніми роками дедалі більше [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]их вельмож висловлює невдоволення цим становищем. Вони збираються звернутися до співправителів із проханням осісти в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName], побоюючись, що зажерливі сусіди відчують слабкість [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  flavor_nav.1.a: "Наші володіння у Франції найважливіші."
  flavor_nav.1.b: "Обидві країни заслуговують на однакову увагу."
  flavor_nav.1.c: "Насамперед ми маємо подбати про землі [ROOT.GetCountry.Custom('CL_GEN')]."
  flavor_nav.2.title: "[target_character.GetNameWithNoTooltip] та [Select_CString(target_character.IsFemale, 'її', 'його')] сходження на престол"
  flavor_nav.2.entry: "Карл Наваррський та його сходження на престол"
  flavor_nav.2.desc: "Після того як [GetCharacter('nav_jeanne_ii_capet').GetName] відійшла у вічність, на престол [Select_CString(target_character.IsFemale, 'зійшла честолюбна', 'зійшов честолюбний')] [target_character.GetName]. Під час [ROOT.GetCountry.GetGovernment.GetAdjective|l]ої церемонії та коронації в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName] [Select_CString(target_character.IsFemale, 'вона показала', 'він показав')] себе як [Select_CString(target_character.IsFemale, 'непересічна правителька', 'непересічний правитель')], оскільки [Select_CString(target_character.IsFemale, 'побажала', 'побажав')] скласти присягу на #TOOLTIP:DIALECT,aragonese_dialect,X #L арагонському#!#! діалекті. До того ж [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] вислови[ROOT.GetCountry.Custom('clergy_vlaloly')] своє невдоволення цим вчинком, бо вважа[ROOT.GetCountry.Custom('clergy_yeyut')], що за звичаєм присягу належить складати латиною."
  flavor_nav.2.a: "Скласти присягу романською мовою."
  flavor_nav.2.b: "Безглузда затія. Присягу слід скласти латиною."
  flavor_nav.2.c: "Нехай складе присягу #TOOLTIP:LANGUAGE,basque_language,X #L баскською#!#! мовою."
  flavor_nav.3.title: "[target_character.GetNameWithNoTooltip] та [Select_CString(target_character.IsFemale, 'її', 'його')] володіння"
  flavor_nav.3.entry: "Карл Наваррський та його французькі володіння"
  flavor_nav.3.desc: "Успадкувавши володіння, якими раніше правили [GetCharacter('nav_philip_iii_evreux').GetName] та [GetCharacter('nav_jeanne_ii_capet').GetName], [target_character.GetName] нині розпоряджається великими землями, що охоплюють #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! та низку маєтностей у #TOOLTIP:REGION,france_region,X #L Франції#!#!. Попри те що [GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] та [GetCharacter('nav_philip_iii_evreux').GetNameWithNoTooltip] були співправителями [ROOT.GetCountry.Custom('CL_GEN')], вони лише зрідка бували в [ROOT.GetCountry.Custom('rank_ua_PREP')|l], воліючи жити у #TOOLTIP:REGION,france_region,X #L Франції#!#!.\n\nПісля того як [target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'зійшла', 'зійшов')] на престол, чимало союзників при [ROOT.GetCountry.GetAdjective|l]ому дворі просили [Select_CString(target_character.IsFemale, 'її', 'його')] оселитися [ROOT.GetCountry.Custom('preposition_uv')] [ROOT.GetCountry.Custom('CL_PREP')]. Інші ж вважають, що наш [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] може мати значно амбітніші наміри щодо спірної корони #TOOLTIP:REGION,france_region,X #L Франції#!#!."
  flavor_nav.3.a: "Вести справи [ROOT.GetCountry.GetAdjective|l]ого двору з наших володінь у #TOOLTIP:REGION,france_region,X #L Франції#!#!."
  flavor_nav.3.b: "Розмістити головний [ROOT.GetCountry.GetAdjective|l]ий двір [ROOT.GetCountry.Custom('preposition_uv')] [ROOT.GetCountry.Custom('CL_PREP')]."
  flavor_nav.3.c: "Перенести осідок нашої влади до [evr_country.Custom('CL_GEN')]."
  flavor_nav.3.c.entry: "Перенести осідок нашої влади до Евре."
  nav_will_be_able_to_rally_other_appanages_tt: "Якщо ми доведемо наші відносини з апанажем #ONCLICK:COUNTRY,[GetCountry('FRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('FRA').GetKey],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#! до #G +150#!, вони охочіше підтримають нас у війні проти [GetCountry('FRA').Custom('CL_GEN')] завдяки [Concept('decision', 'рішенню')|e] «[ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')]»"
  variable_tt_nav_enable_ambitions_of_charles_ii_ambition_events: "Відбулася [Concept('dynamic_historical_event', 'динамічна історична подія')|e] «$flavor_nav.2.entry$»"
  flavor_nav.4.title: "Претензії #TOOLTIP:DYNASTY,$capet_dynasty_tt$,X #L Капетингів#!#!"
  flavor_nav.4.entry: "Претензії Капетингів"
  flavor_nav.4.desc: "Хоча багато хто підозрював, що [target_character.GetName] — [Select_CString(target_character.IsFemale, 'честолюбна правителька', 'честолюбний правитель')], мало хто очікував почути про [Select_CString(target_character.IsFemale, 'її', 'його')] намір безпосередньо зазіхнути на престол #ONCLICK:COUNTRY,[fra_country.GetKey] #TOOLTIP:COUNTRY,[fra_country.GetKey],X [fra_country.Custom('CL_GEN')|L]#!#!. Претензії на престол, які висуває [target_character.GetNameWithNoTooltip], доволі вагомі, адже серед [Select_CString(target_character.IsFemale, 'її', 'його')] родичів — [GetCharacter('nav_jeanne_ii_capet').GetName], а разом із нею і весь дім #TOOLTIP:DYNASTY,$capet_dynasty_tt$,X #L Капетингів#!#!. Але однією з умов, за яких [GetCharacter('nav_jeanne_ii_capet').GetShortName] отримала #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! у спадок, була відмова від прав на престол [fra_country.Custom('CL_GEN')].\n\nЧимало лордів [fra_country.Custom('CL_GEN')] все одно навряд чи визнають [Select_CString(target_character.IsFemale, 'її', 'його')] претензії через прадавній #TOOLTIP:HEIRSELECTION,salic_law,X #L салічний закон#!#!, а дехто вважає, що [target_character.GetNameWithNoTooltip] може скористатися своїм політичним впливом [fra_country.Custom('preposition_uv')] [fra_country.Custom('CL_PREP')], аби переконати могутніших лордів."
  flavor_nav.4.a: "[target_character.GetNameWithNoTooltip] по праву [Select_CString(target_character.IsFemale, 'повинна', 'повинен')] посідати престол [fra_country.Custom('CL_GEN')]!"
  flavor_nav.4.a.entry: "Престол Франції по праву належить Карлу!"
  flavor_nav.4.b: "Слід скористатися цими домаганнями для обґрунтування свого права на владу в очах наших французьких підданих."
  flavor_nav.4.c: "[GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] вже зреклася своїх домагань. Нам ліпше зосередитися на правлінні [ROOT.GetCountry.Custom('CL_INST')]."
  unlocks_enforce_the_capetian_claim_to_france_tt: "Відкриває [Concept('decision', 'рішення')|e] «$navarre_charles_ii_claim_to_france.title$»"
  nav_appanage_support_for_french_throne_tt: "Якщо [ROOT.GetCountry.GetNameWithNoTooltip] є апанажем і довед[ROOT.GetCountry.Custom('end_eut')] свої відносини з іншими апанажами [GetCountry('FRA').Custom('CL_GEN')] до #G +150#!, вони охотніше підтримають [ROOT.GetCountry.Custom('CL_ACC')] у війні проти [GetCountry('FRA').Custom('CL_GEN')] завдяки [Concept('decision', 'рішенню')|e] «[ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')]»"
  flavor_nav.5.title: "[target_character_2.GetNameWithNoTooltip] і союз із [Select_CString(target_character_2.IsFemale, 'нею', 'ним')]"
  flavor_nav.5.entry: "Союз із Етьєном Марселем"
  flavor_nav.5.desc: "Спершу спроби, до яких [Select_CString(target_character.IsFemale, 'вдавалася', 'вдавався')] [target_character.GetName], щоб заручитися підтримкою, не давали жодних плодів: один за одним [fra_country.GetAdjectiveWithNoTooltip|l]і лорди заявляли, що [fra_ruler.GetName] — їхній законний правитель, а [target_character.GetNameWithNoTooltip] — [Select_CString(target_character.IsFemale, 'самозванка', 'самозванець')]. Утім, [target_character.GetNameWithNoTooltip] все ж [Select_CString(target_character.IsFemale, 'змогла', 'зміг')] переманити на свій бік кількох менш впливових [fra_country.GetAdjectiveWithNoTooltip|l]их лордів, тож [Select_CString(target_character.IsFemale, 'її', 'його')] радники не повірили власним вухам, коли дізналися, що [Select_CString(target_character_2.IsFemale, 'сама', 'сам')] [target_character_2.GetName] [Select_CString(target_character_2.IsFemale, 'готова', 'готовий')] підтримати нашого претендента. Попри те що [fra_country.GetAdjectiveWithNoTooltip|l][ROOT.GetCountry.Custom('burghers_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] вважа[ROOT.GetCountry.Custom('burghers_yeyut')] [Select_CString(target_character_2.IsFemale, 'її однією', 'його одним')] зі своїх, [target_character_2.GetNameWithNoTooltip] уже давно є більмом на оці [Select_CString(fra_ruler.IsFemale, 'французької королеви', 'французького короля')], заважаючи [Select_CString(fra_ruler.IsFemale, 'їй', 'йому')] проводити свої рішення через Генеральні штати. Такий союзник, як [target_character_2.GetNameWithNoTooltip], був би неоціненним, однак дехто побоюється, що [Select_CString(target_character_2.IsFemale, 'вона', 'він')] та [target_character.GetNameWithNoTooltip] можуть розходитися в деяких своїх прагненнях, а отже, [target_character_2.GetNameWithNoTooltip] може виявитися радше тягарем, ніж цінним надбанням.\n\nКрім того, [target_character_2.GetNameWithNoTooltip] [Select_CString(target_character_2.IsFemale, 'повідомила', 'повідомив')], що лорди #ONCLICK:COUNTRY,[nrm_country.GetKey] #TOOLTIP:COUNTRY,[nrm_country.GetKey],X [nrm_country.Custom('CL_GEN')|L]#!#! невдоволені тим, що чинить [fra_ruler.GetNameWithNoTooltip], і, ймовірно, [target_character.GetShortNameWithNoTooltip] знайде в їхній особі потрібну підтримку."
  flavor_nav.5.a: "[target_character_2.GetNameWithNoTooltip] стане безцінним союзником."
  flavor_nav.5.a.entry: "Етьєн Марсель стане безцінним союзником."
  flavor_nav.5.b: "Нехай [target_character_2.GetNameWithNoTooltip] переспрямовує доходи [fra_country.Custom('CL_GEN')] до нашої скарбниці."
  flavor_nav.5.b.entry: "Нехай він переспрямовує доходи Франції до нашої скарбниці."
  flavor_nav.5.c: "Цілком відмовитися від [Select_CString(target_character_2.IsFemale, 'її', 'його')] допомоги. Ми заволодіємо [fra_country.Custom('CL_INST')] і без [Select_CString(target_character_2.IsFemale, 'її', 'його')] інтриг."
  flavor_nav.5.c.entry: "Цілком відмовитися від його допомоги. Ми заволодіємо Францією і без його інтриг."
  nav_decision_seizure_of_duchy_of_normandy_tt: "Відкриває [Concept('decision', 'рішення')|e] «$nav_coercing_of_normandy.title$»"
  flavor_nav.6.title: "Вогняний кінець"
  flavor_nav.6.entry: "Загибель Карла Наваррського у вогні"
  flavor_nav.6.desc: "Хоча в останні роки [target_character.GetName] вельми [Select_CString(target_character.IsFemale, 'здала', 'здав')] і не [Select_CString(target_character.IsFemale, 'була схожа на себе колишню', 'був схожий на себе колишнього')], [ROOT.GetCountry.GetAdjective|l]ий двір все одно був приголомшений звісткою про те, що минулої ночі [Select_CString(target_character.IsFemale, 'вона загинула', 'він загинув')] під час пожежі у власних покоях. При дворі подейкують, що під час лікування свічка впала на [Select_CString(target_character.IsFemale, 'її', 'його')] постіль, і полум’я вмить охопило все довкола.\n\nНа престол тепер сходить [scope_our_heir.GetName], значно менш честолюбний правитель, ніж [Select_CString(scope_our_heir.IsFemale, 'її', 'його')] [Select_CString(target_character.IsFemale, 'попередниця', 'попередник')]. І багато хто вже гадає, що напишуть літописці #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! про [Select_CString(target_character.IsFemale, 'спочилу володарку та її', 'спочилого володаря та його')] правління."
  flavor_nav.6.a: "[Select_CString(target_character.IsFemale, 'Її', 'Його')] правління згадуватимуть як час великих амбіцій та жахливих діянь."
  flavor_nav.6.b: "[Select_CString(target_character.IsFemale, 'Її', 'Його')] пам’ятатимуть як [Select_CString(target_character.IsFemale, 'завойовницю', 'завойовника')] [GetCountry('FRA').Custom('CL_GEN')]!"
  flavor_nav.6.c: "[Select_CString(target_character.IsFemale, 'Вона', 'Він')] увійде в історію як монарх, що, попри своє французьке походження, пов’язав своє правління з [ROOT.GetCountry.Custom('CL_INST')]."
  flavor_nav.6.d: "Краще залишити минуле позаду й дивитися в майбутнє."
  flavor_nav.7.title: "Спірні порубіжні землі"
  flavor_nav.7.entry: "Поділ порубіжних земель"
  flavor_nav.7.desc: "Хоча [ROOT.GetCountry.GetName] і [cas_country.GetName] не раз ворогували в минулому, правителі [cas_country.Custom('CL_GEN')] ніколи не намагалися завоювати [ROOT.GetCountry.Custom('rank_ua_ACC')|l]. Однак у порубіжних землях провінцій [ShowProvinceDefinitionName('biscay_province')], [ShowProvinceDefinitionName('gipuzkoa_province')] та [ShowProvinceDefinitionName('alava_province')] уже давно зростає напруга між могутніми місцевими родами, що сперечаються через невиразність меж краю.\n\nПредставники [cas_country.Custom('CL_GEN')] та [our_ruler.GetName] робили спроби покласти край цим порубіжним суперечкам, однак [ShowDisasterNameWithNoTooltip('castilian_civil_war')], що спалахнула [cas_country.Custom('preposition_uv')] [cas_country.Custom('CL_PREP')], зірвала подальші перемовини. У підсумку ворожнеча між впливовими родинами краю лише загострилася.\n\nПоки [cas_country.GetNameWithNoTooltip] охоплен[cas_country.Custom('end_yiaei')] внутрішніми чварами, [our_ruler.GetNameWithNoTooltip] [Select_CString(our_ruler.IsFemale, 'отримала', 'отримав')] від представників місцевих родів пропозицію вдертися до країни та захопити спірні землі."
  flavor_nav.7.a: "Якщо не владнати ці земельні суперечки, невдоволення [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]их родів, напевно, тільки зростатиме."
  flavor_nav.7.b: "Варто призупинити подальші перемовини. Ми повинні домогтися визнання наших прав на цей край!"
  flavor_nav.8.title: "Вакуум влади перекинувся на [ROOT.GetCountry.Custom('CL_ACC')]"
  flavor_nav.8.entry: "Безвладдя перекинулося на Наварру"
  flavor_nav.8.desc: "Хоча [ShowDisasterNameWithNoTooltip('castilian_civil_war')] уже завершилася, її наслідки ще довго відчуватимуться по всій #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!. Ослаблення залог у більшій частині порубіжних земель дозволило давній ворожнечі між місцевими родами перерости у відкриту війну.\n\nЧерез слабкість #ONCLICK:COUNTRY,[cas_country.GetKey] #TOOLTIP:COUNTRY,[cas_country.GetKey],X [cas_country.Custom('CL_GEN')|L]#!#! [ROOT.GetCountry.GetAdjective|l]ому двору буде вкрай важко самотужки покласти край настільки запеклому конфлікту в цьому краї."
  flavor_nav.8.a: "На [ROOT.GetCountry.Custom('CL_ACC')] чекають небезпечні часи."
  nav_end_blood_feud_decision_enabled_tt: "Відкриває [Concept('decision', 'рішення')|e] «$nav_end_the_blood_feuds.title$»"
  nav_sow_division_in_the_borderlands_enabled_tt: "Відкриває [Concept('decision', 'рішення')|e] «$nav_sow_division_in_the_borderlands.title$»"
  flavor_nav.9.title: "Скасування провінції [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')]"
  flavor_nav.9.entry: "Скасування Біскаї"
  flavor_nav.9.desc: "Попри те, що [cas_country.GetName] та [ROOT.GetCountry.GetName] уже давно сперечаються за володіння провінцією [ShowProvinceDefinitionName('biscay_province')], цей край став домівкою для багатьох впливових родин, зокрема й для дому Аро, чиї представники були найвпливовішими та найвідданішими васалами. Втім, [cas_country.GetNameWithNoTooltip] поча[cas_country.Custom('end_vlaloly')] скасовувати титули та приєднувати спірні землі у провінції [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')].\n\nЦі дії [cas_country.Custom('CL_GEN')] неабияк розлютили дім Аро. Вони зажадали від [ROOT.GetCountry.GetAdjective|l]ого двору надати грошову підтримку повстанцям у провінції [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')], аби покарати тих, хто підтримав приєднання краю [cas_country.Custom('CL_INST')]."
  flavor_nav.9.a: "Ми не можемо піти назустріч вимогам дому Аро, не накликавши на себе гніву [cas_country.Custom('CL_GEN')]."
  flavor_nav.9.a.entry: "Ми не можемо піти назустріч вимогам дому Аро, не накликавши на себе гніву Кастилії."
  flavor_nav.9.b: "Допомогти дому Аро посіяти смуту в цьому краї."
  variable_tt_nav_enable_blood_feud_faction_events: "Відбулася [Concept('dynamic_historical_event', 'динамічна історична подія')|e] «$flavor_nav.8.entry$»"
  flavor_nav.10.title: "Поклик церкви"
  flavor_nav.10.entry: "$flavor_nav.10.title$"
  flavor_nav.10.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] відпускає свою старшу дочку до [ShowLocationName('paris')], і прямо зараз вона очікує на свиту, яка проведе її в нове життя.\n\n[target_character.GetName] народилася першою і успадкувала всі володіння батьків, але на цьому її везіння закінчилося. [GetCountry('ARA').GetGovernment.GetRuler.GetName] скасував весілля з нею і в результаті одружився з її молодшою сестрою на ім'я [target_sister.GetShortName].\n\nТепер жінку готов[ROOT.GetCountry.Custom('clergy_yiaei')] прийняти паризьк[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l], і вона збирається присвятити себе служінню нашому Господу і Спасителю.\n\nОднак деякі вважають, що [target_character.GetName] все ще може бути корисною країні і становить певну цінність у перемовах."
  flavor_nav.10.a: "Вона стане черницею."
  flavor_nav.10.a.entry: "Скористатися владою корони, щоб запобігти подальшому кровопролиттю."
  flavor_nav.10.b: "Вона ще нам стане в пригоді."
  flavor_nav.11.title: "Підтримувані [ROOT.GetCountry.Custom('CL_INST')] роди беруть гору в спірному баскському порубіжжі"
  flavor_nav.11.entry: "Підтримувані Наваррою роди беруть гору в спірному баскському порубіжжі"
  flavor_nav.11.desc: "Хоча ворожнеча між родами, що підтримують [ROOT.GetCountry.Custom('CL_ACC')] та [GetCountry('CAS').Custom('CL_ACC')] у спірному баскському порубіжжі, і спустошила цей край, [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]і родини здійснили майже неможливе й повернули [ROOT.GetCountry.Custom('CL_DAT')] значну частину колишнього впливу в баскському порубіжжі. [GetCountry('CAS').GetNameWithNoTooltip] усе ще може спробувати відновити свій контроль над цим краєм, але подібне підприємство без сумніву коштуватиме [GetCountry('CAS').GetAdjectiveWithNoTooltip|l]ому двору чималих коштів."
  flavor_nav.11.a: "Нехай це стане першим кроком до зміцнення [ROOT.GetCountry.Custom('CL_GEN')]."
  navarre_gains_castile_basque_lands_tt: "Усі володіння #ONCLICK:COUNTRY,[GetCountry('CAS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('CAS').GetKey],X [GetCountry('CAS').Custom('CL_GEN')|L]#!#! у спірному баскському порубіжжі з високою ймовірністю перейдуть під владу #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, якщо тільки [GetCountry('CAS').GetNameWithNoTooltip] не під[GetCountry('CAS').Custom('end_eut')] на крайні заходи заради збереження контролю над цими землями."
  flavor_nav.12.title: "Посилення ермандад"
  flavor_nav.12.entry: "$flavor_nav.12.title$"
  flavor_nav.12.desc: "Ермандади #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! і раніше були надійними союзниками, але десятиліття кривавої ворожнечі між різними [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ими родинами довели протистояння до краю.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] погодився виділити кошти на створення [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого відділення ермандади. Нехай це й коштуватиме скарбниці чималих грошей, зате щойно вони зберуть сили, правитель [our_ruler.GetName] здобуде могутнього союзника, який допоможе втихомирити ворожі родини та назавжди покласти край їхнім чварам."
  flavor_nav.12.a: "Ермандади нарешті покладуть край цим родинним чварам."
  flavor_nav.13.title: "[Select_CString(target_character.IsFemale, 'Наставниця', 'Наставник')] [target_character.GetNameWithNoTooltip] та [Select_CString(target_character.IsFemale, 'її', 'його')] [Select_CString(scope_our_heir.IsFemale, 'підопічна', 'підопічний')] [scope_our_heir.GetNameWithNoTooltip]"
  flavor_nav.13.entry: "Хуан де Бомон і навчання [Select_CString(scope_our_heir.IsFemale, 'спадкоємиці', 'спадкоємця')]"
  flavor_nav.13.desc: "Бомони вже давно мають вагу при дворі #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, однак їхня пропозиція стати наставниками [Select_CString(scope_our_heir.IsFemale, 'спадкоємиці', 'спадкоємця')] стала несподіванкою. Незважаючи на те що [target_character.GetName] має славу людини чести, дехто з радників побоюється, що [scope_our_heir.GetNameWithNoTooltip], [Select_CString(scope_our_heir.IsFemale, 'якій', 'якому')] судилося одного дня зійти на [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ий престол, ставши [Select_CString(target_character.IsFemale, 'її підопічною', 'його підопічним')], потрапить під цілковитий вплив [Select_CString(target_character.IsFemale, 'цієї придворної дами', 'цього придворного')]."
  flavor_nav.13.a: "З [Select_CString(target_character.IsFemale, 'неї', 'нього')] вийде [Select_CString(target_character.IsFemale, 'чудова наставниця', 'чудовий наставник')]."
  flavor_nav.13.a.entry: "З нього вийде чудовий наставник."
  flavor_nav.13.b: "Ми не можемо допустити, щоб [scope_our_heir.GetNameWithNoTooltip] [Select_CString(scope_our_heir.IsFemale, 'потрапила', 'потрапив')] під [Select_CString(target_character.IsFemale, 'її', 'його')] вплив."
  flavor_nav.13.b.entry: "Ми не можемо допустити, щоб [Select_CString(scope_our_heir.IsFemale, 'наша спадкоємиця потрапила', 'наш спадкоємець потрапив')] під його вплив."
  flavor_nav.14.title: "[scope_our_consort.GetNameWithNoTooltip] та [target_character.GetNameWithNoTooltip]"
  flavor_nav.14.entry: "Вплив консорта та Педро де Перальти"
  flavor_nav.14.desc: "Аграмони, один із найвпливовіших родів при [ROOT.GetCountry.GetAdjective|l]ому дворі, зуміли значно посилити свій вплив у країні: [target_character.GetName] надає їм підтримку, а [scope_our_consort.GetName] [Select_CString(scope_our_consort.IsFemale, 'налагодила', 'налагодив')] з ними тісні зв’язки. Їхні заслуги перед #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#! незаперечні, однак дехто побоюється, що за їхніми інтригами можуть ховатися далеко не найшляхетніші наміри."
  flavor_nav.14.a: "Аграмони завжди вірно нам служили."
  flavor_nav.14.b: "[scope_our_consort.GetNameWithNoTooltip] [Select_CString(scope_our_consort.IsFemale, 'потрапила', 'потрапив')] під [Select_CString(target_character.IsFemale, 'її', 'його')] вплив, і це вже викликає тривогу — потрібно розлучити їх."
  flavor_nav.14.b.entry: "Його вплив на консорта вже викликає тривогу — потрібно розлучити їх."
  variable_tt_beaumont_backed_heir: "Бомонтці присутні при дворі та підтримують спадкоємця"
  variable_tt_agramonteses_backed_consort: "Аграмони присутні при дворі та є близькими союзниками консорта"
  flavor_nav.15.title: "[the_legal_heir.GetNameWithNoTooltip] та неминуча узурпація [Select_CString(the_legal_heir.IsFemale, 'її', 'його')] влади"
  flavor_nav.15.entry: "Наближення узурпації влади [Select_CString(the_legal_heir.IsFemale, 'спадкоємиці', 'спадкоємця')]"
  flavor_nav.15.desc: "Тривалий час [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'правила', 'правив')] упевненою рукою, проте нещодавно [Select_CString(our_ruler.IsFemale, 'захворіла й опинилася прикутою', 'захворів і опинився прикутим')] до ліжка. Побоюючись, що [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] незабаром помре, прибічники Аграмонів, віддані консорту, таємно провели церемонію, на якій [the_consort_usurper.GetName] [Select_CString(the_consort_usurper.IsFemale, 'була коронована новою правителькою', 'був коронований новим правителем')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!.\n\nПоки [the_legal_heir.GetNameWithNoTooltip] [Select_CString(the_legal_heir.IsFemale, 'була відсутня', 'був відсутній')] при [ROOT.GetCountry.GetAdjective|l]ому дворі, дехто з роду Бомонів таємно відправив листи [Select_CString(the_legal_heir.IsFemale, 'її', 'його')] почту, бажаючи попередити про зраду Аграмонів. Якщо листи доставлять вчасно, прибічники [Select_CString(the_legal_heir.IsFemale, 'законної спадкоємиці', 'законного спадкоємця')] ще матимуть змогу зібрати сили, потрібні для розгрому Аграмонів і зриву їхньої змови."
  flavor_nav.15.a: "Саме [the_consort_usurper.GetNameWithNoTooltip] [Select_CString(the_consort_usurper.IsFemale, 'гідна', 'гідний')] очолити [ROOT.GetCountry.Custom('CL_ACC')]."
  flavor_nav.15.a.entry: "Саме двір гідний очолити Наварру."
  flavor_nav.15.b: "[the_legal_heir.GetNameWithNoTooltip] — [Select_CString(the_legal_heir.IsFemale, 'наша спадкоємиця', 'наш спадкоємець')] та [Select_CString(the_legal_heir.IsFemale, 'законна правителька', 'законний правитель')] [ROOT.GetCountry.Custom('CL_GEN')]. Ми станемо на [Select_CString(the_legal_heir.IsFemale, 'її', 'його')] бік!"
  flavor_nav.15.b.entry: "Станьмо на бік [Select_CString(the_legal_heir.IsFemale, 'нашої спадкоємиці', 'нашого спадкоємця')], [Select_CString(the_legal_heir.IsFemale, 'законної правительки', 'законного правителя')] Наварри!"
  flavor_nav.15.historical_info: "Співправителі Бланка I та Хуан II оголосили, що після смерти Бланки престол Наварри має перейти до їхнього сина Карла, принца Віанського. Однак замість того, щоб передати престол Карлу, Хуан II вирішив узурпувати владу в Наваррі — фактично він привласнив королівський титул і повалив власного сина. За підтримки Бомонів та Аграмонів протистояння між батьком і сином переросло в громадянську війну в Наваррі. Вона завершилася перемогою Хуана II, який зберіг за собою престол."
  flavor_nav.16.title: "[target_country.GetAdjectiveWithNoTooltip|U]і зазіхання"
  flavor_nav.16.desc: "Заручившись підтримкою по всій #TOOLTIP:REGION,france_region,X #L Франції#!#!, [target_character.GetName] відкрито [Select_CString(target_character.IsFemale, 'заявила', 'заявив')] про свої зазіхання на #TOOLTIP:REGION,france_region,X #L французьку#!#! корону та [Select_CString(target_character.IsFemale, 'розіслала', 'розіслав')] своїх посланців усім краєм, пропонуючи всім охочим останню нагоду приєднатися до [Select_CString(target_character.IsFemale, 'неї', 'нього')] в боротьбі за престол. Незважаючи на те що [target_character.GetShortNameWithNoTooltip] має прихильність [ROOT.GetCountry.GetAdjective|l]ого двору, деякі радники побоюються, що [Select_CString(target_character.IsFemale, 'її', 'його')] сходження на престол серйозно розхитає становище у #TOOLTIP:REGION,france_region,X #L Франції#!#!."
  flavor_nav.16.a: "[target_character.GetNameWithNoTooltip] заслуговує на нашу підтримку."
  flavor_nav.16.b: "Не варто втручатися в це протистояння."
  flavor_nav.16.c: "[Select_CString(target_character.IsFemale, 'Її', 'Його')] потрібно зупинити."
  nav_appanage_ally_join_war_tt: "У війну, яку веде [target_character.GetName] за контроль над #TOOLTIP:REGION,france_region,X #L Францією#!#!, вступ[ROOT.GetCountry.Custom('end_ytlyat')] [ROOT.GetCountry.GetName]"
  flavor_nav.17.title: "Невтішна доля спірного баскського порубіжжя"
  flavor_nav.17.desc: "Прибічники [GetCountry('NAV').GetAdjectiveWithNoTooltip|l]ої корони захопили значну частину наших володінь у спірному баскському порубіжжі #ONCLICK:COUNTRY,[GetCountry('NAV').GetKey] #TOOLTIP:COUNTRY,[GetCountry('NAV').GetKey],X [GetCountry('NAV').Custom('CL_GEN')|L]#!#!. Численні #TOOLTIP:CULTURE,$basque_tt$,X #L баскські#!#! роди, що зберегли вірність #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#!, були розорені. Дехто при [ROOT.GetCountry.GetAdjective|l]ому дворі вважає, що край ще не втрачено остаточно. Але відновити там нашу владу буде важко, позаяк чимало місцевих жителів уже потрапили в залежність від могутніх [GetCountry('NAV').GetAdjectiveWithNoTooltip|l]их родин."
  flavor_nav.17.a: "Варто відмовитися від домагань на порубіжні землі на користь [GetCountry('NAV').Custom('CL_GEN')]."
  flavor_nav.17.b: "Ми не забудемо заколоту, який зчинили баски."
  flavor_nav.17.c: "Необхідно за всяку ціну та якнайшвидше придушити заколот!"
  flavor_nav.20.title: "Монастир Сан-Франциско в Оліте"
  flavor_nav.20.entry: "$flavor_nav.20.title$"
  flavor_nav.20.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] — дуже побожна людина, тому [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'її', 'його')] так засмучують темпи будівництва монастиря Сан-Франциско в [ShowLocationName('olite')].\n\nРоботи ведуться вже понад сто років, і проєкт поки далекий від завершення.\n\nЩоб прискорити будівництво, потрібно багато грошей, зате цей монастир підвищить нашу славу і стане новою точкою тяжіння."
  flavor_nav.20.a: "І слава Богу!"
  flavor_nav.20.b: "Стільки чекали, і ще почекаємо."
  flavor_nav.20.historical_info: "За легендою, святий Франциск Ассізький заснував монастирську громаду в Оліте приблизно в 1213-1214 році під час паломництва до Сантьяго-де-Компостели.\n\nОфіційно орден був заснований королем Теобальдом II, а наступні правителі Наварри — особливо Іоанна II та Карл II, — підтримували об'єднання духовно та фінансово, сприяючи його розвитку та залученню нових послідовників.\n\n Згодом громада перетворилася на апостольську школу: тут навчали місіонерів для відправки до Іспанії та Америки, а під час кампанії 1795 року будівлю було переобладнано на госпіталь."
  flavor_nav.21.title: "Поклик церкви"
  flavor_nav.21.entry: "$flavor_nav.21.title$"
  flavor_nav.21.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] відпускає свою старшу дочку до #TOOLTIP:LOCATION,paris,X #L Парижа#!#!, і просто зараз вона очікує на почет, що проведе її в нове життя.\n\n[target_character.GetName] народилася першою і успадкувала всі батьківські володіння, але на цьому її щастя скінчилося. [GetCountry('ARA').GetGovernment.GetRuler.GetName] скасував весілля з нею і натомість одружився з її молодшою сестрою [target_sister.GetShortName].\n\nТепер жінку готов[ROOT.GetCountry.Custom('clergy_yiaei')|l] прийняти паризьк[ROOT.GetCountry.Custom('clergy_yiaei')|l] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l], і вона збирається присвятити себе служінню нашому Господу та Спасителю.\n\nУтім, дехто вважає, що [target_character.GetName] усе ще може послужити на благо країни та становить певну цінність у перемовинах."
  flavor_nav.21.a: "Вона стане черницею."
  flavor_nav.21.b: "Вона ще стане нам у пригоді."
  flavor_nav.21.historical_info: "Іоанна була заручена з королем Арагону Педро IV, однак до весілля справа так і не дійшла. Історики припускають, що наречений міг визнати її не надто привабливою через якусь недугу чи хворобу. У підсумку заміж за Педро віддали її молодшу сестру Марію.\n\nОскільки Педро одружився з її сестрою, Іоанна була змушена зректися свого права на престол, а потім приєдналася до ордену святої Клари та прожила решту життя у францисканському абатстві Лоншан поблизу Парижа."
  flavor_nav.30.title: "Іригаційні проєкти в Туделі"
  flavor_nav.30.entry: "$flavor_nav.30.title$"
  flavor_nav.30.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle|L] подовгу затримується у своїх володіннях у #TOOLTIP:REGION,france_region,X #L Франції#!#!, проте [ROOT.GetCountry.GetLongName] завжди залишається в [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'її', 'його')] думках, і [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'вона', 'він')] незмінно знаходить час на розвиток тамтешніх проєктів.\n\nПівденні області [ROOT.GetCountry.Custom('rank_ua_GEN')], зокрема [ShowLocationName('tudela')], відрізняються посушливим кліматом, проте землі там родючі. Викопавши кілька каналів, ми покращимо іригацію полів, і вони почнуть приносити більше врожаю."
  flavor_nav.30.a: "Це суттєво підвищить урожайність."
  flavor_nav.30.b: "У нас немає коштів на такі задуми."
  flavor_nav.30.historical_info: "Під час свого правління Іоанна II та Філіпп III втілили в життя низку проєктів, що сприяли господарському розвитку Наварри. Одним з них стало розширення зрошення в області Тудели — найважливішого південного міста королівства."
  flavor_nav.40.title: "Копія «Законів Наварри»"
  flavor_nav.40.entry: "$flavor_nav.40.title$"
  flavor_nav.40.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle|L] все більше уваги приділяє нагальним проблемам своєї країни, тому було вирішено замовити для [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'неї', 'нього')] копію #italic «Законів Наварри»#!.\n\nМи залучимо до роботи над копією наймайстерніших переписувачів, а її витончено прикрашена обкладинка буде виконана з першосортної шкіри. Як того вимагає звичай, при складанні подібних документів використовуються [spanish_language.GetName] та [basque_language.GetName], точніше кажучи, їх химерне змішання.\n\nБіда в тому, що [ROOT.GetCountry.GetGovernment.GetRulerTitle] знає тільки [french_language.GetName] і зовсім не володіє наваррсько-арагонською мовою."
  flavor_nav.40.a: "Ми перекладемо книгу на французьку."
  flavor_nav.40.a.entry: "Ми додамо переклад на французьку."
  flavor_nav.40.b: "Нехай правителі вчать свою споконвічну мову."
  flavor_nav.40.c: "Державною мовою має стати баскська: нею говорить більшість."
  flavor_nav.40.historical_info: "Ймовірно, для більшості підданих Королівства Наварри рідною мовою була баскська (#italic Lingua Navarrorum#!), проте в офіційних документах, як правило, використовувалася наваррсько-арагонська мова (#italic Ydiomate Navarre Terrae#!, #italic Ydiomate Navarre#! або #italic Lengoage de Navarra#!), оскільки окситанська на той час вийшла з ужитку.\n\nКрім того, з 1234 року, коли на трон Наварри зійшов перший представник Шампанської династії, у вищих колах почала набирати популярність французька."
  flavor_nav.50.title: "Облога Альхесіраса"
  flavor_nav.50.entry: "$flavor_nav.50.title$"
  flavor_nav.50.desc: "До нас дійшла новина про військові дії на #L [target_country.GetAdjective]ому#! кордоні. [GetCountry('CAS').GetName] відновлює хрестовий похід на [target_country.Custom('CL_ACC')], і [target_character.GetName] спішно [Select_CString(target_character.IsFemale,'повернулася', 'повернувся')] до [ROOT.GetCountry.Custom('CL_GEN')], щоб взяти участь у битвах.\n\nХоча втручання в цей конфлікт не несе очевидної вигоди [ROOT.GetCountry.Custom('rank_ua_DAT')], ми вважаємо своїм обов'язком допомогти сусідам вигнати #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульман#!#! з #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!."
  flavor_nav.50.a: "[target_character.GetShortNameWithNoTooltip] поведе наших бійців."
  flavor_nav.50.a.entry: "Наш чоловік поведе за собою вояків."
  flavor_nav.50.b: "Ми відправимо бійців, але [target_character.GetShortNameWithNoTooltip] [Select_CString(target_character.IsFemale,'потрібна', 'потрібен')] нам тут."
  flavor_nav.50.b.entry: "Ми відправимо вояків, але він потрібен нам тут."
  flavor_nav.50.c: "[ROOT.GetCountry.GetNameWithNoTooltip] не втручатиметься в це."
  flavor_nav.50.c.entry: "Нас це не стосується."
  flavor_nav.50.historical_info: "У 1343 році Філіп, правитель Наварри, вирішив приєднатися до хрестового походу на Гранаду: він вважав своїм обов'язком звільнити Іберію від мусульман. Хоча його військо було невеликим, воно, як і організована королем доставка харчів через Біскайську затоку, відіграло важливу роль в облозі Альхесіраса. На жаль, незабаром Філіп важко захворів і у вересні 1343 року помер. Його тіло доставили до Памплони, а серце поховали в Парижі. Свої співчуття Іоанні, вдові короля, висловив сам папа римський Климент VI. Зрештою Альхесірас упав. Іоанна правила Наваррою до своєї смерті в 1349 році, а після трон перейшов Карлу II, синові Іоанни та Філіпа."
  flavor_nav.60.title: "Остання воля королеви"
  flavor_nav.60.entry: "$flavor_nav.60.title$"
  flavor_nav.60.desc: "[target_character.GetName] відходить у ліпший світ. У листі з останньою волею король просить [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'свою наступницю', 'свого наступника')] звести каплицю для церкви Санта-Марія-ла-Реаль, розташованої в місті [ShowLocationName('olite')].\n\nДехто з придворних пропонує назвати майбутню споруду каплицею Непорочного зачаття Діви Марії. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] хоче будь-що втілити задум у життя, адже [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'їй', 'йому')] чудово відомо, наскільки набожним був [target_character.GetShortNameWithNoTooltip]."
  flavor_nav.60.a: "Остання воля королеви має бути виконана."
  flavor_nav.60.b: "Ми знайдемо цим коштам краще застосування."
  flavor_nav.60.historical_info: "У 1349 році королева Іоанна II помирає від чуми. У листі, що виражає її останню волю, вона, крім усього іншого, просить свого сина Карла II виділити кошти на будівництво каплиці для готичної церкви Санта-Марія-ла-Реаль, розташованої в Оліте.\n\nУ цій церкві члени династії Евре проводили священні церемонії та обряди. За своєю архітектурою вона нагадує Собор Паризької Богоматері."
  navarre_charles_ii_claim_to_france.title: "Законні домагання на престол [GetCountry('FRA').Custom('CL_GEN')]"
  navarre_charles_ii_claim_to_france.desc: "Попри те, що [GetCharacter('nav_jeanne_ii_capet').GetName] [Select_CString(GetCharacter('nav_jeanne_ii_capet').IsFemale, 'зреклася', 'зрікся')] своїх домагань на престол [GetCountry('FRA').Custom('CL_GEN')], [GetCharacter('nav_charles_ii_evreux').GetName] зберігає пряму кровну спорідненість із Капетингами, до яких належав покійний [GetCharacter('fra_louis_x_capet').GetName]. І навіть якщо всупереч справедливості [GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip] буде виключений із черги спадкування через #TOOLTIP:HEIRSELECTION,salic_law,X #L салічного закону#!#!, його права на корону все одно вагоміші, ніж у нинішніх правителів [GetCountry('FRA').Custom('CL_GEN')]!"
  navarre_charles_ii_claim_to_france.a: "Час заявити про наші законні домагання на престол [GetCountry('FRA').Custom('CL_GEN')]!"
  navarre_charles_ii_claim_to_france_appanage_route.title: "$navarre_charles_ii_claim_to_france.title$"
  navarre_charles_ii_claim_to_france_appanage_route.desc: "$navarre_charles_ii_claim_to_france.desc$"
  navarre_charles_ii_claim_to_france_appanage_route.a: "Час розпочати міжусобну війну та повернути трон!"
  nav_appanage_willingness_to_join_tt: "Досягнення #G +190#! у відносинах з іншими апанажними васалами [GetCountry('FRA').Custom('CL_GEN')] схилить їх підтримати нас у війні проти [GetCountry('FRA').Custom('CL_GEN')] за здобуття престолу"
  nav_coercing_of_normandy.title: "Примушення [GetCountry('NRM').Custom('CL_GEN')]"
  nav_coercing_of_normandy.desc: "Чимало знаті #ONCLICK:COUNTRY,[GetCountry('NRM').GetKey] #TOOLTIP:COUNTRY,[GetCountry('NRM').GetKey],X [GetCountry('NRM').Custom('CL_GEN')|L]#!#!, що брала участь у Столітній війні, розчарувалися в теперішньому правителеві #ONCLICK:COUNTRY,[GetCountry('FRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('FRA').GetKey],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#!. Землі, якими свого часу володів [GetCharacter('nav_philip_iii_evreux').GetName] і які згодом успадкував [GetCharacter('nav_charles_ii_evreux').GetName], дозволили останньому зберегти тісні зв’язки зі знаттю [GetCountry('NRM').Custom('rank_ua_GEN')|l]. Дехто зі знатних родин, можливо, забажає, щоб [GetCharacter('nav_philip_iii_evreux').GetShortNameWithNoTooltip] став їхнім новим сюзереном."
  nav_coercing_of_normandy.a: "Встановити контроль над [GetCountry('NRM').Custom('CL_INST')]!"
  nav_end_the_blood_feuds.title: "Кінець кровної ворожнечі"
  nav_end_the_blood_feuds.desc: "Після закінчення #TOOLTIP:DISASTER_TYPE,castilian_civil_war,X #L Громадянської війни в Кастилії#!#! на більшій частині #ONCLICK:COUNTRY,[GetCountry('NAV').GetKey] #TOOLTIP:COUNTRY,[GetCountry('NAV').GetKey],X [GetCountry('NAV').Custom('CL_GEN')|L]#!#! розгорілася давня кровна ворожнеча між родами, які осміліли через послаблення [GetCountry('CAS').GetAdjectiveWithNoTooltip|l]ої влади в краї. Тепер же, коли [GetCountry('NAV').GetName] зміцни[GetCountry('NAV').Custom('end_vlaloly')] свої позиції, настав час скористатися нагодою та покласти край кровній ворожнечі раз і назавжди."
  nav_end_the_blood_feuds.a: "Ми відновили свою владу!"
  nav_sow_division_in_the_borderlands.title: "Смута в порубіжжі"
  nav_sow_division_in_the_borderlands.desc: "Вплив [GetCountry('CAS').Custom('CL_GEN')] у спірному баскському порубіжжі майже зійшов нанівець. Місцеві роди, що зберегли вірність #ONCLICK:COUNTRY,[GetCountry('NAV').GetKey] #TOOLTIP:COUNTRY,[GetCountry('NAV').GetKey],X [GetCountry('NAV').Custom('CL_DAT')|L]#!#!, загрузли в міжусобицях, які можуть зіграти нам на руку, якщо ми вирішимо підтримати їх у відкритому протистоянні з родами прибічників [GetCountry('CAS').Custom('CL_GEN')]. Нехай подібний задум і потребуватиме чималих коштів, [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')] матимуть нагоду возз’єднатися з [GetCountry('NAV').Custom('CL_INST')]."
  nav_sow_division_in_the_borderlands.a: "Нехай розорять володіння ворожого роду."
  nav_sow_division_in_the_borderlands.b: "Віддамо вогню окраїни порубіжжя."
  nav_sow_division_in_the_borderlands.c: "Розпалити взаємну недовіру між жителями [GetCountry('CAS').GetAdjectiveWithNoTooltip|l]их земель."
  nav_sow_division_in_the_borderlands_a_tt: "Усі [Concept('location', 'місцевості')|e] [Concept('owned', 'у володінні')|e] #ONCLICK:COUNTRY,[GetCountry('CAS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('CAS').GetKey],X [GetCountry('CAS').Custom('CL_GEN')|L]#!#! у спірному баскському порубіжжі отримують модифікатор «[ShowModifier('nav_feud_crossfire')]» строком на 3 роки та відчутне зниження [Concept('prosperity', 'процвітання')|e] і [Concept('pop_satisfaction', 'задоволення громад')|e]"
  nav_sow_division_in_the_borderlands_b_tt: "Усі [Concept('location', 'місцевості')|e] [Concept('owned', 'у володінні')|e] #ONCLICK:COUNTRY,[GetCountry('CAS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('CAS').GetKey],X [GetCountry('CAS').Custom('CL_GEN')|L]#!#! у спірному баскському порубіжжі отримують модифікатор «[ShowModifier('nav_destructive_feuds')]» строком на 3 роки та помірне зниження [Concept('prosperity', 'процвітання')|e], [Concept('pop_satisfaction', 'задоволення громад')|e] і [Concept('development', 'розвитку')|e]"
  nav_sow_division_in_the_borderlands_c_tt: "Усі [Concept('location', 'місцевості')|e] [Concept('owned', 'у володінні')|e] #ONCLICK:COUNTRY,[GetCountry('CAS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('CAS').GetKey],X [GetCountry('CAS').Custom('CL_GEN')|L]#!#! у спірному баскському порубіжжі отримують модифікатор «[ShowModifier('nav_widespread_distrust_caused_by_feuds')]» строком на 3 роки та помірне зниження [Concept('prosperity', 'процвітання')|e], [Concept('pop_satisfaction', 'задоволення громад')|e] і [Concept('control', 'контролю')|e]"