l_russian:
  flavor_ath.1.title: "Недавні [target_country.GetAdjectiveWithNoTooltip|l]і набіги"
  flavor_ath.1.entry: "Недавні набіги Айдинідів"
  flavor_ath.1.desc: "В останні роки наші землі на побережжі #TOOLTIP:AREA,aegean_sea_area,X #L Егейського моря#!#! потерпають від спустошливих набігів #L [target_country.GetAdjective|l]их#! турків. Доки їх здійснював [target_character.GetName], ми гадали, що його смерть дасть нам перепочинок. Однак недавній набіг, здійснений його [Select_CString(target_character2.IsFemale, 'спадкоємицею', 'спадкоємцем')] на наші володіння у #TOOLTIP:AREA,thrace_area,X #L Фракії#!#!, не залишає сумнівів щодо [Select_CString(target_character2.IsFemale, 'її', 'його')] намірів — [target_character.GetName] повернеться з новими силами, а [ShowScriptedGeographyName('greece_geography')] знову стане [Select_CString(target_character2.IsFemale, 'її', 'його')] здобиччю. Ми повинні усунути цю загрозу, перш ніж вона принесе ще більше горя нашим містам, — нам треба здійснити набіг у відповідь або навіть організувати #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,crusade,X #L хрестовий похід#!#!."
  flavor_ath.1.a: "Відплатимо їм тією ж монетою!"
  flavor_ath.2.title: "[scope_ruler.GetShortNameWithNoTooltip] раптово гине"
  flavor_ath.2.entry: "Раптова смерть герцога Гільєма II"
  flavor_ath.2.desc: "О горе! [regent_of_athens.GetName] [Select_CString(regent_of_athens.IsFemale, 'повідомила', 'повідомив')], що [Select_CString(scope_ruler.IsFemale, 'наша дорога', 'наш дорогий')] [scope_ruler.GetName] несподівано [Select_CString(scope_ruler.IsFemale, 'померла', 'помер')] від якоїсь тяжкої хвороби. У зв’язку з цим [regent_of_athens.GetShortNameWithNoTooltip] [Select_CString(regent_of_athens.IsFemale, 'перейняла', 'перейняв')] на себе обов’язки регента, які [Select_CString(regent_of_athens.IsFemale, 'вона', 'він')] виконуватиме доти, доки не буде вирішено питання спадкування. [Select_CString(scope_ruler.IsFemale, 'Сама', 'Сам')] [scope_ruler.GetShortNameWithNoTooltip] [Select_CString(scope_ruler.IsFemale, 'заповіла', 'заповідав')], що [Select_CString(scope_ruler.IsFemale, 'її', 'його')] [Select_CString(scope_heir.IsFemale, 'спадкоємицею повинна', 'спадкоємцем повинен')] стати [scope_heir.GetName], однак наразі [Select_CString(scope_heir.IsFemale, 'вона', 'він')] перебуває [sic_country.Custom('preposition_uv')] #ONCLICK:COUNTRY,[sic_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[sic_country.Custom('CL_tt')],X [sic_country.Custom('CL_PREP')|L]#!#! і тому не може перейняти кермо влади.\n\nКористуючись тим, що [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! тимчасово утворився вакуум влади, незадоволені #TOOLTIP:CULTURE,$catalan_tt$,X #L Каталонською#!#! дружиною члени двору звернулися до регента з пропозицією: нехай замість [Select_CString(scope_heir.IsFemale, 'призначеної спадкоємиці', 'призначеного спадкоємця')] на престол зійде [arg_ruler.GetName]. На їхню думку, зараз найвідповідніший момент для того, щоб повернути владу династії [arg_ruler.GetDynasty.GetName]. Однак варто враховувати, що [sic_country.GetAdjectiveWithNoTooltip|l]ий уряд неодмінно сприйме це рішення як заколот і, можливо, у відповідь спробує позбавити нашу країну будь-якої автономії. Крім того, якщо [arg_ruler.GetShortNameWithNoTooltip] таки прийме наше запрошення, то нам також доведеться переконати Каталонську дружину визнати [Select_CString(arg_ruler.IsFemale, 'нову спадкоємицю', 'нового спадкоємця')]."
  flavor_ath.2.a: "Нехай престол займе [scope_heir.GetNameWithNoTooltip]."
  flavor_ath.2.a.entry: "Дозволимо спадкоємцю зайняти трон після правителя."
  flavor_ath.2.b: "[arg_ruler.GetShortNameWithNoTooltip] чудово підійде на цю роль. Краще запропонуємо престол [Select_CString(arg_ruler.IsFemale, 'їй', 'йому')]."
  flavor_ath.2.b.entry: "Запропонуємо йому країну."
  ath_sicily_may_declare_war: "Якщо [arg_ruler.GetName] стане [Select_CString(arg_ruler.IsFemale, 'новою правителькою', 'новим правителем')], то у #ONCLICK:COUNTRY,[sic_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[sic_country.Custom('CL_tt')],X [sic_country.Custom('CL_GEN')|L]#!#! з’явиться [Concept('casus_belli', 'привід для війни')|e] «[ShowCasusBelliName('cb_subject_broke_free')]» проти #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!"
  ath_legal_heir_of_guillem: "[scope_heir.GetName] стане [Select_CString(scope_heir.IsFemale, 'законною правителькою', 'законним правителем')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, поки [arg_ruler.GetName] розглядає пропозицію, яку [Select_CString(regent_of_athens.IsFemale, 'зробила', 'зробив')] [regent_of_athens.GetName]. У разі її прийняття [ROOT.GetCountry.Custom('CL_INST')] правитиме [arg_ruler.GetShortNameWithNoTooltip]."
  flavor_ath.3.title: "[scope_athens.GetAdjectiveWithNoTooltip][scope_athens.Custom('nobles_yiaei')] [scope_athens.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] пропону[scope_athens.Custom('nobles_yeyut')] нам зайняти престол"
  flavor_ath.3.desc: "#L [scope_athens.GetAdjective]ий#! посол прибув до нашого двору із привабливою, але вельми небезпечною пропозицією. Він повідомив, що [scope_ath_william.GetName] несподівано помер від хвороби, і тепер престол його [ROOT.GetCountry.Custom('rank_ua_GEN')|l] пустує. Хоча численн[scope_athens.Custom('nobles_yiaei')] [scope_athens.GetAdjectiveWithNoTooltip|l][scope_athens.Custom('nobles_yiaei')] [scope_athens.GetGovernment.GetEstateName('nobles_estate')|l] з нетерпінням чека[scope_athens.Custom('nobles_yeyut')] того моменту, коли до влади прийде його спадкоємець, регент [regent_of_athens.GetShortName] [Select_CString(regent_of_athens.IsFemale, 'вирішила', 'вирішив')] піти іншим шляхом. Так, [Select_CString(regent_of_athens.IsFemale, 'вона вступила', 'він вступив')] у змову з тими членами двору, які, як і раніше, зберігають вірність династії [arg_ruler.GetDynasty.GetName] і сподіваються, що наступним правителем [scope_athens.Custom('CL_GEN')] стане [arg_ruler.GetName].\n\n[regent_of_athens.GetShortNameWithNoTooltip] визнає, що відтоді, як [scope_slained_brienne.GetName] [Select_CString(scope_slained_brienne.IsFemale, 'була повалена', 'був повалений')], [arg_ruler.GetShortNameWithNoTooltip] і #TOOLTIP:CULTURE,$catalan_tt$,X #L Каталонська#!#! дружина фактично перебувають у стані ворожнечі. Проте каталонці неодноразово висловлювали своє невдоволення правлінням династії [scope_ath_william.GetDynasty.GetName], а тому є підстави вважати, що за грамотного підходу їх таки можна буде схилити на бік роду [arg_ruler.GetDynasty.GetNameWithNoTooltip]. Заручившись їхньою підтримкою, [scope_athens.GetNameWithNoTooltip] змож[scope_athens.Custom('end_eut')] значно зміцнити своє становище і, можливо, навіть здобути довгоочікувану незалежність від #L [scope_sic_country.GetAdjective|l]ого#! двору."
  flavor_ath.3.a: "Приймемо пропозицію."
  flavor_ath.3.a.entry: "Приймемо пропозицію Афін."
  flavor_ath.3.b: "У жодному разі. Ризик надто великий."
  flavor_ath.3_become_athens: "[ROOT.GetCountry.GetName] об’єдна[ROOT.GetCountry.Custom('end_yeyu')]ться [scope_athens.Custom('preposition_zzi')] [scope_athens.Custom('longname_ua_INST')] та отримає [Concept('cores', 'корінні')|e] [Concept('locations', 'місцевості')|e] на всіх [scope_athens.GetAdjectiveWithNoTooltip|l]их [Concept('core', 'корінних')|e] територіях"
  ath_arg_sicily_may_declare_war: "[scope_athens.GetAdjectiveWithNoTooltip]а країна здобуде незалежність, але [scope_sic_country.GetName] отрима[scope_sic_country.Custom('end_yeyut')] [Concept('casus_belli', 'привід для війни')|e] «[ShowCasusBelliName('cb_subject_broke_free')]» проти #ONCLICK:COUNTRY,[scope_athens.Custom('CL_tt')] #TOOLTIP:COUNTRY,[scope_athens.Custom('CL_tt')],X [scope_athens.Custom('CL_GEN')|L]#!#!"
  flavor_ath.4.title: "[arg_ruler.GetNameWithNoTooltip] [Select_CString(arg_ruler.IsFemale, 'прийняла', 'прийняв')] нашу пропозицію!"
  flavor_ath.4.desc: "Таємна посольська місія до #ONCLICK:COUNTRY,[arg_country_scope.Custom('CL_tt')] #TOOLTIP:COUNTRY,[arg_country_scope.Custom('CL_tt')],X [arg_country_scope.Custom('CL_GEN')|L]#!#!, яку [Select_CString(regent_of_athens.IsFemale, 'організувала', 'організував')] [regent_of_athens.GetShortName], пройшла успішно: [arg_ruler.GetNameWithNoTooltip] [Select_CString(arg_ruler.IsFemale, 'розглянула нашу пропозицію та погодилася', 'розглянув нашу пропозицію та погодився')] зайняти #L [ROOT.GetCountry.GetAdjective|l]ий#! престол. Тим часом звістки про те, що [scope_ath_william.GetName] помер, вже досягли #L [sic_country_scope.GetAdjective|l]ої#! влади, і скоро їм стане ясно, що [regent_of_athens.GetNameWithNoTooltip] [Select_CString(regent_of_athens.IsFemale, 'вирішила', 'вирішив')] влаштувати переворот.\n\nПопри те, що 1311 року [scope_slained_brienne.GetName] [Select_CString(scope_slained_brienne.IsFemale, 'була повалена', 'був повалений')] і [ROOT.GetCountry.GetFlavorRank|l] опини[ROOT.GetCountry.Custom('endrank_vlaloly')]ся під контролем #TOOLTIP:CULTURE,$catalan_tt$,X #L Каталонської#!#! дружини, [sic_country_scope.GetAdjectiveWithNoTooltip|l]ий двір не виявив найманцям належного визнання. У результаті каталонці помітно розчарувалися у своїх сюзеренах, і тепер вони набагато охочіше приймуть [arg_country_scope.GetAdjectiveWithNoTooltip|l]у владу, якщо нам вдасться з ними домовитися."
  flavor_ath.4.a: "Настав час провести перемови з каталонцями."
  flavor_ath.5.title: "Перемови з Каталонською дружиною"
  flavor_ath.5.desc: "Хоча з 1312 року [ROOT.GetCountry.GetName] формально належ[ROOT.GetCountry.Custom('end_ytyat')] династії [scope_ath_william.GetDynasty.GetName], по факту владу [ROOT.GetCountry.Custom('preposition_uv')] [ROOT.GetCountry.Custom('rank_ua_PREP')|l] здійснює #TOOLTIP:CULTURE,$catalan_tt$,X #L Каталонська#!#! дружина — зрозуміло, в інтересах [sic_country_scope.GetAdjectiveWithNoTooltip|l]ого двору. Однак завдяки своїм закулісним іграм [regent_of_athens.GetName] [Select_CString(regent_of_athens.IsFemale, 'зуміла', 'зумів')] дещо змінити баланс сил, і тепер багато [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]их [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] цілком підтримують претензії династії [scope_ruler.GetDynasty.GetName] на [ROOT.GetCountry.Custom('rank_ua_ACC')|l].\n\nЗа щасливим збігом обставин останнім часом багато членів дружини стали висловлювати невдоволення [sic_country_scope.GetAdjectiveWithNoTooltip|l]ою владою. Вони навіть згодні відійти від своїх колишніх сюзеренів і стати на наш бік, але натомість вони вимагають гідну винагороду."
  flavor_ath.5.a: "Виділимо дружині частину доходів [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  flavor_ath.5.a.entry: "Виділимо дружині частину доходу країни."
  flavor_ath.5.b: "Надамо дружині додаткові привілеї та права на землю."
  flavor_ath.5.c: "Проженемо найманців з [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  flavor_ath.5.c.entry: "Проженемо дружину з країни."
  flavor_ath.6.title: "[scope_athens.GetNameWithNoTooltip] скида[ROOT.GetCountry.Custom('endlong_yeyut')] владу Барселонського дому"
  flavor_ath.6.desc: "Наш двір отримав вкрай неприємні звістки: [scope_ath_william.GetName] несподівано помер від хвороби. Що ще гірше, #L [scope_athens.GetAdjective|l]і#! аристократи, користуючись тимчасовим безвладдям, вирішили влаштувати переворот і передати престол династії [arg_ruler.GetDynasty.GetName]. В результаті [scope_ruler.GetName] [Select_CString(scope_ruler.IsFemale, 'залишилася', 'залишився')] не при справах: [arg_ruler.GetName] [Select_CString(arg_ruler.IsFemale, 'відмовилася', 'відмовився')] від своєї васальної присяги і [Select_CString(arg_ruler.IsFemale, 'погодилася стати новою правителькою', 'погодився стати новим правителем')] [scope_athens.Custom('rank_ua_GEN')|l]."
  flavor_ath.6.a: "Ми повинні повернути [scope_athens.Custom('CL_ACC')] під свій контроль!"
  flavor_ath.6.a.entry: "$ATH$ необхідно повернути!"
  flavor_ath.7.title: "[arg_ruler.GetNameWithNoTooltip] [Select_CString(arg_ruler.IsFemale, 'відкинула', 'відкинув')] нашу пропозицію!"
  flavor_ath.7.entry: "Відмова герцога Аргоса"
  flavor_ath.7.desc: "Наша таємна посольська місія до #ONCLICK:COUNTRY,[arg_country_scope.Custom('CL_tt')] #TOOLTIP:COUNTRY,[arg_country_scope.Custom('CL_tt')],X [arg_country_scope.Custom('CL_GEN')|L]#!#! обернулася провалом: [arg_ruler.GetName] [Select_CString(arg_ruler.IsFemale, 'відкинула нашу пропозицію та відмовилася', 'відкинув нашу пропозицію та відмовився')] від #L [ROOT.GetCountry.GetAdjective|l]ого#! престолу. Намагаючись зберегти обличчя, [regent_of_athens.GetName] спішно [Select_CString(regent_of_athens.IsFemale, 'засудила', 'засудив')] своїх спільників до ув'язнення, однак деяких членів двору цей спектакль зовсім не переконав. Тепер вони вимагають кинути [Select_CString(regent_of_athens.IsFemale, 'її', 'його')] до темниці разом з рештою змовників, поки [scope_heir.GetName] не [Select_CString(scope_heir.IsFemale, 'повернулася', 'повернувся')] до [ROOT.GetCountry.Custom('CL_GEN')]."
  flavor_ath.7.a: "Нехай поки залишається на волі."
  flavor_ath.7.a.entry: "Поки що пощадимо його."
  flavor_ath.7.b: "Відправимо [Select_CString(regent_of_athens.IsFemale, 'її', 'його')] за ґрати!"
  flavor_ath.7.b.entry: "Ув'язнити його!"
  flavor_ath.8.title: "Правління Каталонської дружини"
  flavor_ath.8.entry: "Правління Каталонської дружини"
  flavor_ath.8.desc: "Династія [scope_ruler.GetDynasty.GetName] править [ROOT.GetCountry.Custom('longname_ua_INST')] з тих самих пір, як [ROOT.GetCountry.GetFlavorRank|l] зда[ROOT.GetCountry.Custom('endrank_vlaloly')]ся #TOOLTIP:CULTURE,$catalan_tt$,X #L Каталонській#!#! дружині та присягну[ROOT.GetCountry.Custom('endrank_vlaloly')] на вірність [sic_country.Custom('longname_ua_DAT')] у 1311 році. І хоча формально [Select_CString(scope_ruler.IsFemale, 'правителькою', 'правителем')] вважається [scope_ruler.GetName], фактично вся влада [ROOT.GetCountry.Custom('preposition_uv')] [ROOT.GetCountry.Custom('CL_PREP')] здійснюється самою дружиною. Крім того, найманці захищають [ROOT.GetCountry.Custom('rank_ua_ACC')|l] від зазіхань з боку інших претендентів, головним з яких безсумнівно є [arg_ruler.GetName].\n\nДосі каталонці вірно служили [sic_country.GetAdjectiveWithNoTooltip|l]ому двору, однак деяк[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l][ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] повідомля[ROOT.GetCountry.Custom('nobles_yeyut')], що останнім часом багато дружинників почали висловлювати своє невдоволення правлінням династії [scope_ruler.GetDynasty.GetNameWithNoTooltip]."
  flavor_ath.8.a: "Каталонці захищають [ROOT.GetCountry.Custom('CL_ACC')]. Ми повинні їм довіряти."
  flavor_ath.8.a.entry: "Будемо й надалі покладатися на Каталонську дружину."
  flavor_ath.8.b: "Ми перевіримо, наскільки правдиві чутки про невірність каталонців."
  flavor_ath.9.title: "[byz_country.GetAdjectiveWithNoTooltip]а міжусобиця"
  flavor_ath.9.entry: "Візантійська міжусобиця"
  flavor_ath.9.desc: "До нас дійшли звістки про те, що влада #ONCLICK:COUNTRY,[byz_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[byz_country.Custom('CL_tt')],X [byz_country.Custom('CL_GEN')|L]#!#! значною мірою втратила контроль над своїми прикордонними місцевостями поблизу [ROOT.GetCountry.Custom('CL_GEN')] і почала розміщувати там лише невеликі залоги. При цьому [byz_country.GetAdjectiveWithNoTooltip|l]ий уряд перебуває в сум'ятті від того, що йому доводиться одночасно вирішувати династичні чвари та тримати в узді безліч #TOOLTIP:CULTURE,$turkish_culture_tt$,X #L турецьких#!#! бейликів, чий вплив в #TOOLTIP:REGION,anatolia_region,X #L Анатолії#!#! неухильно зростає. У зв'язку з цим деякі члени #L [ROOT.GetCountry.GetAdjective|l]ого#! двору вважають, що зараз саме час завдати удару по [byz_country.Custom('longname_ua_wntt_DAT')] та розширити наші володіння в #TOOLTIP:PROVINCE_DEFINITION,thessaly_province,X #L Фессалії#!#!.\n\nВодночас каталонські дружинники пропонують влаштувати низку набігів на [byz_country.GetAdjectiveWithNoTooltip|l]і місцевості в #TOOLTIP:AREA,northern_greece_area,X #L Північній Греції#!#!, щоб наповнити нашу скарбницю."
  flavor_ath.9.a: "Настав час пробитися вглиб Фессалії."
  flavor_ath.9.b: "Доручимо Каталонській дружині розграбувати Північну Грецію."
  flavor_ath.9.c: "Ще не час діяти."
  variable_de_brienne_rule_of_athens_tt: "Брієнни не відмовляються від претензій на Афіни"
  flavor_ath.10.title: "Грецьке населення [ROOT.GetCountry.Custom('CL_GEN')]"
  flavor_ath.10.entry: "Правління в Греції"
  flavor_ath.10.desc: "Відтоді як [ShowScriptedGeographyName('greece_geography')] опинилася під владою #L [GetCountry('LAT').GetAdjective|l]их#! держав, більша частина #TOOLTIP:CULTURE,$greek_culture_tt$,X #L грецької#!#! знаті втратила свої титули та поступилася ними хрестоносцям. І хоча з падінням Латинської імперії в 1261 році контроль хрестоносців над регіоном значно ослаб, їхня спадщина, як і раніше, пронизує суспільство [ROOT.GetCountry.Custom('longname_ua_GEN')].\n\nСподіваючись отримати більше земельних прав, численн[ROOT.GetCountry.Custom('nobles_yiaei')] #L [ROOT.GetCountry.GetCulture.GetName|l][ROOT.GetCountry.Custom('nobles_yiaei')]#! [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] виріши[ROOT.GetCountry.Custom('nobles_vlaloly')] звернутися до двору з проханням надати їм частину грецьких володінь, що перебувають у власності [ROOT.GetCountry.Custom('CL_GEN')]. Водночас деякі члени уряду пропонують вчинити інакше та спробувати завоювати прихильність грецького населення країни."
  flavor_ath.10.a: "Задовольнимо їхнє клопотання та надамо їм права на землю."
  flavor_ath.10.a.entry: "Підтримаємо розширення земельних прав знаті."
  flavor_ath.10.b: "Задобримо грецьке населення країни."
  flavor_ath.10.c: "Передамо частину земель Каталонській дружині."
  flavor_ath.10.d: "Залишимо все як є."
  ath_greek_pops_lose_mild_satisfaction: "Усі наші #TOOLTIP:CULTURE,$greek_culture_tt$,X #L грецькі#!#! [Concept('pops', 'групи населення')|e] отримають [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] до [Concept('pop_satisfaction', 'вдоволення')|e]"
  ath_greek_pops_gain_severe_satisfaction: "Усі наші #TOOLTIP:CULTURE,$greek_culture_tt$,X #L грецькі#!#! [Concept('pops', 'групи населення')|e] отримають [ShowNamedValue('estate_satisfaction_severe_bonus')|+=2%] до [Concept('pop_satisfaction', 'вдоволення')|e]"
  ath_greek_pops_lose_severe_satisfaction: "Усі наші #TOOLTIP:CULTURE,$greek_culture_tt$,X #L грецькі#!#! [Concept('pops', 'групи населення')|e] отримають [ShowNamedValue('estate_satisfaction_severe_penalty')|+=2%] до [Concept('pop_satisfaction', 'вдоволення')|e]"
  flavor_ath.11.title: "Каталонська дружина проти грецького населення [target_conflict_location.Custom('LR_GEN')|l] [target_conflict_location.GetNameWithNoTooltip]"
  flavor_ath.11.entry: "Конфлікт між Каталонською дружиною та греками"
  flavor_ath.11.desc: "Отримавши від #L [ROOT.GetCountry.GetAdjective|l]ого#! двору низку привілеїв, #TOOLTIP:CULTURE,$catalan_tt$,X #L Каталонська#!#! дружина накликала на себе гнів #TOOLTIP:CULTURE,$greek_culture_tt$,X #L грецького#!#! населення [target_conflict_location.Custom('LR_GEN')|l] [target_conflict_location.GetName], яке звинувачує найманців у незаконному привласненні земель. Деякі члени уряду підтримують каталонців та їхні інтереси в цьому районі, інші ж побоюються, що це може спровокувати повстання греків у сусідніх провінціях. Стривожені чиновники вимагають, щоб [scope_ruler.GetName] якомога швидше [Select_CString(scope_ruler.IsFemale, 'втрутилася та вирішила', 'втрутився та вирішив')] цей конфлікт."
  flavor_ath.11.a: "Підтримаємо привласнення земель каталонцями."
  flavor_ath.11.b: "Докоримо Каталонській дружині за її безрозсудні дії."
  flavor_ath.11.c: "Скористаємося нагодою та виженемо Каталонську дружину з [ROOT.GetCountry.Custom('CL_GEN')]."
  flavor_ath.11.c.entry: "Скористаємося цією нагодою та виженемо Каталонську дружину!"
  flavor_ath.12.title: "[thebes_location.GetNameWithNoTooltip] та [athens_location.GetNameWithNoTooltip]: боротьба столиць"
  flavor_ath.12.entry: "Боротьба столиць"
  flavor_ath.12.desc: "[athens_location.GetName] з давніх-давен є одним із найважливіших поселень [ROOT.GetCountry.Custom('rank_ua_GEN')|l], однак колишні влади — чи то #L [GetCountry('LAT').GetAdjective|l]і#! хрестоносці, чи Каталонська дружина — зазвичай осідали в #L #TOOLTIP:LOCATIONRANK,[thebes_location.Custom('LR_tt')],X [thebes_location.Custom('LR_PREP')|l]#!#! [thebes_location.GetName] через його стратегічно вигідне розташування. Попри це, [athens_location.GetNameWithNoTooltip] не втратили свого впливу, і значна частина [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ої установи, як і раніше, розташовується саме тут.\n\nОчевидно, обидва міста мають свої переваги, але [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] наполягає, щоб [scope_ruler.GetName] остаточно [Select_CString(scope_ruler.IsFemale, 'визначилася та вирішила', 'визначився та вирішив')], яке з них стане столицею #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!."
  flavor_ath.12.a: "Залишимо поточний порядок, за якого обидва поселення зберігають свій вплив."
  flavor_ath.12.b: "[athens_location.GetRank.GetNameWithNoTooltip] [athens_location.GetNameWithNoTooltip] має знову стати столицею."
  flavor_ath.12.b.entry: "Нам слід повернутися до Афін і знову зробити їх столицею."
  flavor_ath.12.c: "Офіційно оголосимо [thebes_location.Custom('LR_ACC')|l] [thebes_location.GetNameWithNoTooltip] столицею [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  flavor_ath.12.c.entry: "Оголосимо Фіви офіційною столицею країни."
  flavor_ath.13.title: "[scope_epi_ruler.GetNameWithNoTooltip] приходить до влади [epi_country.Custom('preposition_uv')] [epi_country.Custom('CL_PREP')]"
  flavor_ath.13.entry: "Відокремлення Епіру"
  flavor_ath.13.desc: "У 1337 році [scope_epi_governor.GetName] [Select_CString(scope_epi_governor.IsFemale, 'захопила', 'захопив')] #ONCLICK:COUNTRY,[epi_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[epi_country.Custom('CL_tt')],X [epi_country.Custom('CL_ACC')|L]#!#! і знову [Select_CString(scope_epi_governor.IsFemale, 'включила', 'включив')] цю територію до складу #ONCLICK:COUNTRY,[byz_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[byz_country.Custom('CL_tt')],X [byz_country.Custom('CL_GEN')|L]#!#!. Однак нещодавно [scope_epi_ruler.GetName] та [Select_CString(scope_epi_ruler.IsFemale, 'її', 'його')] прихильники організували заколот проти [byz_country.GetAdjectiveWithNoTooltip|l]ого намісника, сподіваючись повалити поточний уряд і повернути ці землі під свій контроль. Оскільки [byz_country.GetNameWithNoTooltip] ще не встигну[byz_country.Custom('end_vlaloly')] відреагувати на дії заколотників, деякі члени нашого двору пропонують скористатися нагодою та приєднати [epi_country.Custom('CL_ACC')] до [ROOT.GetCountry.Custom('longname_ua_DAT')]."
  flavor_ath.13.a: "Ми заберемо [epi_country.Custom('longname_ua_wntt_ACC')] собі."
  flavor_ath.13.a.entry: "$EPI$ належатиме нам."
  flavor_ath.13.b: "[scope_epi_ruler.GetNameWithNoTooltip] потребує нашої підтримки."
  flavor_ath.13.b.entry: "Краще постараємося підтримати його."
  flavor_ath.13.c: "[epi_country.GetAdjectiveWithNoTooltip]і справи нас не стосуються."
  flavor_ath.13.c.entry: "Справи Епіру нас не стосуються."
  flavor_ath.14.title: "Номінальні [GetCountry('LAT').GetAdjectiveWithNoTooltip|l]і правителі [scope_ach_country.Custom('CL_GEN')]"
  flavor_ath.14.entry: "Номінальний імператор в Ахеї"
  flavor_ath.14.desc: "Перебуваючи під покровительством #ONCLICK:COUNTRY,[scope_nap_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[scope_nap_country.Custom('CL_tt')],X [scope_nap_country.Custom('CL_GEN')|L]#!#!, [scope_ach_country.Custom('longname_ua_wntt_DAT')] вдалося здобути значний вплив на тлі безлічі інших #L [GetCountry('LAT').GetAdjective|l]их#! держав Греції. Багато в чому це стало можливим завдяки тому, що [scope_ach_ruler.GetName] уміло [Select_CString(scope_ach_ruler.IsFemale, 'використала', 'використав')] свій номінальний титул [Select_CString(scope_ach_ruler.IsFemale, 'імператриці', 'імператора')] [GetCountry('LAT').Custom('longname_ua_wntt_GEN')]. І хоча з падінням [GetCountry('LAT').Custom('rank_ua_GEN')|l] у 1261 році цей титул багато в чому втратив своє колишнє значення, саме завдяки йому [scope_ach_ruler.GetShortNameWithNoTooltip] як і раніше користується підтримкою низки [GetCountry('LAT').GetAdjectiveWithNoTooltip|l]их правителів у регіоні.\n\nТим часом [ROOT.GetCountry.GetName] також поступово набира[ROOT.GetCountry.Custom('end_yeyut')] вплив, у зв’язку з чим деякі члени нашого двору вважають, що настав час кинути виклик [scope_ach_country.Custom('CL_DAT')] та остаточно позбавити тамтешніх правителів будь-яких претензій на спадщину [GetCountry('LAT').Custom('longname_ua_wntt_GEN')]."
  flavor_ath.14.a: "Війна — найкращий спосіб послабити позиції [scope_ach_country.Custom('CL_GEN')]."
  flavor_ath.14.a.entry: "Потрібно вторгнутися в Ахею, щоб їхні претензії стали ще менш вагомими."
  flavor_ath.14.b: "[scope_ach_ruler.GetShortNameWithNoTooltip] може стати для нас цінним союзником."
  flavor_ath.14.b.entry: "Натомість краще постараємося заслужити їхню прихильність."
  flavor_ath.14.c: "[scope_ach_ruler.GetShortNameWithNoTooltip] та [Select_CString(scope_ach_ruler.IsFemale, 'її', 'його')] справи нас не стосуються."
  flavor_ath.14.c.entry: "Справи правителя нас не стосуються."
  flavor_ath.15.title: "[the_pope.GetNameWithNoTooltip] шукає [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ої підтримки у відновленні [GetCountry('LAT').Custom('longname_ua_wntt_GEN')]"
  flavor_ath.15.entry: "Папа пропонує відродити Латинську імперію"
  flavor_ath.15.desc: "#L [scope_papal_states.GetAdjective]ий#! посол прибув до #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! з вельми сміливою пропозицією. Спостерігаючи за тим, як швидко наша країна набирає вплив і як слабша[scope_byz.Custom('end_yeyut')] [scope_byz.GetName], [the_pope.GetNameWithNoTooltip] [Select_CString(the_pope.IsFemale, 'вважала', 'вважав')], що у нас є всі підстави захопити [constantinople_location.Custom('LR_ACC')|l] [constantinople_location.GetName] і відновити [GetCountry('LAT').Custom('longname_ua_ACC')].\n\nЯкщо ми приймемо [Select_CString(the_pope.IsFemale, 'її', 'його')] умови і зуміємо відродити [GetCountry('LAT').Custom('longname_ua_wntt_ACC')], [the_pope.GetShortNameWithNoTooltip] гарантує нам повну підтримку з боку [scope_papal_states.Custom('longname_ua_wntt_GEN')], а також обіцяє визнати нас законними правителями Константинополя."
  flavor_ath.15.a: "Приймемо [Select_CString(the_pope.IsFemale, 'її', 'його')] пропозицію і спробуємо відновити [GetCountry('LAT').Custom('longname_ua_wntt_ACC')]."
  flavor_ath.15.a.entry: "Приймемо пропозицію відновити Латинську імперію."
  flavor_ath.15.b: "Нехай [the_pope.GetShortNameWithNoTooltip] залишить свої амбіції при собі."
  flavor_ath.15.b.entry: "Ми не станемо йти на поводу в папських устремлінь."
  flavor_ath.16.title: "Зазіхання на [GetCountry('THE').Custom('longname_ua_wntt_ACC')]"
  flavor_ath.16.entry: "Повернення фессалонікійських земель"
  flavor_ath.16.desc: "Попри свою коротку історію, [GetCountry('THE').GetName] ма[GetCountry('THE').Custom('end_vlaloly')] величезний політичний вплив у межах [GetCountry('LAT').Custom('longname_ua_GEN')], чиїм васалом вони й були. Так було доти, доки [scope_theodoros_doukas.GetName] не захопив [GetCountry('THE').Custom('rank_ua_ACC')|l] у 1224 році.\n\nВідтоді номінальний титул [GetCountry('THE').Custom('CL_GEN')] належить [achaea_country.Custom('longname_ua_DAT')], однак наше нещодавнє завоювання колишніх володінь [GetCountry('THE').Custom('rank_ua_GEN')|l] дає нам підстави самим заявити права на ці землі. На думку деяких членів #L [ROOT.GetCountry.GetAdjective|l]ого#! двору, присвоївши собі цей титул, ми зможемо помітно зміцнити свій статус як спадкоємців [GetCountry('LAT').Custom('longname_ua_wntt_GEN')]."
  flavor_ath.16.a: "Заявимо свої претензії на [GetCountry('THE').Custom('longname_ua_wntt_ACC')]."
  flavor_ath.16.a.entry: "Заявимо права на Фессалоніки!"
  flavor_ath.16.b: "Створимо на захоплених землях нову країну."
  flavor_ath.16.b.entry: "Створимо на цьому місці нову країну."
  flavor_ath.16.c: "Немає сенсу приписувати собі давно зниклі титули."
  may_form_thessalonica: "Кількість [Concept('locations', 'місцевостей')|e], які повинні знаходитися в регіоні [ShowScriptedGeographyName('claims_of_thessalonica_geography')] для утворення [GetCountry('THE').Custom('longname_ua_wntt_GEN')], зменшується на #L 30%#!"
  flavor_ath.17.title: "Повернення [constantinople_location.Custom('LR_GEN')|l] [constantinople_location.GetNameWithNoTooltip]"
  flavor_ath.17.entry: "Константинополь захоплено!"
  flavor_ath.17.desc: "#L [ROOT.GetCountry.GetAdjective]і#! вояки здійснили неможливе та звільнили #L #TOOLTIP:LOCATIONRANK,[constantinople_location.Custom('LR_tt')],X [constantinople_location.Custom('LR_ACC')|l]#!#! [constantinople_location.GetName]! Цього разу [scope_ruler.GetName] завбачливо [Select_CString(scope_ruler.IsFemale, 'заборонила', 'заборонив')] військам займатися грабунком, сподіваючись уникнути повторення тих важких наслідків, які спричинив Четвертий хрестовий похід. Тепер, коли колишня грецька знать розгромлена, [scope_ruler.GetShortNameWithNoTooltip] пропонує [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ому двору відновити [GetCountry('LAT').Custom('longname_ua_ACC')]. Хоча відчуття тріумфу окрилює багатьох наших урядовців, деякі з них все ж бояться повторити долю занепалої держави хрестоносців. На їхню думку, відродження [GetCountry('LAT').Custom('rank_ua_GEN')|l] стане можливим лише тоді, коли [ShowScriptedGeographyName('greece_geography')] цілком опиниться під нашим надійним контролем."
  flavor_ath.17.a: "Проголосимо відродження [GetCountry('LAT').Custom('longname_ua_wntt_GEN')]."
  flavor_ath.17.a.entry: "Проголосимо відродження Латинської імперії!"
  flavor_ath.17.b: "Спершу зосередимося на зміцненні нашого становища в країні [ShowScriptedGeographyNameWithNoTooltip('greece_geography')]."
  flavor_ath.17.c: "Продовжимо правити як [ROOT.GetCountry.GetLongNameWithNoTooltip]."
  flavor_ath.17.c.entry: "Натомість продовжимо правити як і раніше."
  latin_empire_reformation_conditions_unchanged_tt: "Кількість [Concept('locations', 'місцевостей')|e], які повинні знаходитися в регіоні [ShowScriptedGeographyName('frankokratia_geography')] для утворення [GetCountry('LAT').Custom('longname_ua_wntt_GEN')], зменшується на #L 33%#!"