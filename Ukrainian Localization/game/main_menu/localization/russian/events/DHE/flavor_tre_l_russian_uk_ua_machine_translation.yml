l_russian:
  flavor_tre.1.title: "Цитадель [target_location.GetNameWithNoTooltip]"
  flavor_tre.1.entry: "Цитадель Трапезунда"
  flavor_tre.1.desc: "Величне місто [target_location.GetName], розташоване в самому серці #TOOLTIP:REGION,anatolia_region,X #L Анатолії#!#!, вже багато століть служить символом нашої верховної влади. Завдяки вигідному розташуванню на березі моря столичне місто активно розвивається і процвітає, уособлюючи нашу багату культурну спадщину.\n\nЦе місто, усіяне заможними купецькими подвір'ями, ринками, акведуками та іншою інфраструктурою, стало справжньою перлиною нашої країни. Усе це забезпечує постійний приріст населення, тому нам варто задуматися про розширення меж міста, щоб за його міцними стінами можна було вмістити нові будинки."
  flavor_tre.1.historical_info: "Засноване у 756 р. до н. е. місто Трапезунд довгий час виступало оплотом грецької православної культури. Ще за часів Римської імперії тут розташовувалися легіони, що обороняли Полемонів Понт, а в роки правління Юстиніана місто служило плацдармом для завоювання Вірменії.\n\nУ VIII столітті Трапезунд став архієпископською єпархією, а ще через два століття — митрополією. У 1204 році Олексій I Комнін разом із братом Давидом заснував тут Трапезундську імперію, що проіснувала до 1461 року. Від ворогів її захищали Понтійські гори, міцні стіни та вигідні шлюбні союзи. Невеликий (у 1438 році тут проживало 4000 осіб), але добре укріплений Трапезунд славився своїми пам'ятками архітектури, такими як Софійський собор та храм Богородиці Золотоглавої (Панагія Хрисокефалос). У 1461 році його взяли османи, підкоривши тим самим останнє місто Візантійської імперії."
  flavor_tre.1.a: "Вкласти гроші в розвиток!"
  flavor_tre.1.b: "Нехай голодують за стінами…"
  flavor_tre.2.title: "Непокора схоларіїв"
  flavor_tre.2.entry: "$flavor_tre.2.title$"
  flavor_tre.2.desc: "Рухомі невгамовною жагою наживи, деякі представники місцевих дворянських ополчень вирішили скористатися ослабленням верховної влади і взяли [target_location.Custom('LR_ACC')|l] [target_location.GetName] під свій повний контроль. Звісно, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] завжди прагнули здобути якомога більше впливу та привілеїв, але цього разу вони перейшли всі межі дозволеного. Якщо ми не вживемо рішучих заходів, скоро наша країна може загрузнути в громадянській війні!"
  flavor_tre.2.a: "Спустити цих скажених псів з ланцюгів!"
  flavor_tre.2.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
  flavor_tre.2.b.entry: "$common_string_nothing_we_can_do_about_it$"
  flavor_tre.2.historical_info: "Схоларії — впливові #italic άρχοντες#! (дворяни), спочатку — гвардійський підрозділ, що охороняв місто. З часом його представники склали одне з наймогутніших сімейств Трапезунда. У 1340 році Схоларії, які прагнули заволодіти всією повнотою влади, виступили проти воцаріння імператриці Ірини. У країні, що страждала в той час від набігів туркменів на південний кордон, вибухнула громадянська війна. Це зіграло на руку туркменам: під час одного з нальотів вони змогли проникнути в Трапезунд і підпалити місто. На нещастя жителів, до пожежі додалася й епідемія: вулиці міста були завалені гниючими тілами людей і коней."
  flavor_tre.3.title: "[target_character1.GetNameWithNoTooltip] [Select_CString(target_character1.IsFemale,'отруєна', 'отруєний')]"
  flavor_tre.3.entry: "Отруєння Василя Великого Комніна"
  flavor_tre.3.desc: "[target_character2.GetName] вже давно [Select_CString(target_character2.IsFemale,'відчувала', 'відчував')] до [Select_CString(target_character1.IsFemale,'своєї дружини', 'свого чоловіка')] пекучу ненависть і ревнощі. Їхні й без того напружені стосунки погіршувалися тим, що [target_character1.GetName] [Select_CString(target_character1.IsFemale,'мала при дворі безліч коханців', 'мав при дворі безліч коханок')]. Зрештою [target_character2.GetShortNameWithNoTooltip] [Select_CString(target_character2.IsFemale,'не витримала і пішла', 'не витримав і пішов')] на відчайдушний крок, отруївши [Select_CString(target_character1.IsFemale,'свою дружину', 'свого чоловіка')] і поклавши край цьому нещасливому шлюбу."
  flavor_tre.3.a: "У коханні та на війні всі засоби добрі."
  flavor_tre.3.b: "Ми цього не потерпимо!"
  flavor_tre.3.historical_info: "Ірина — незаконнонароджена дочка Андроніка III Палеолога — стала дружиною імператора Василя аж ніяк не з любові: родина Комнінів за допомогою цього шлюбу розраховувала укласти союз з імператором Візантії. Ірина так і не змогла народити своєму чоловікові спадкоємця, а Василь волів знаходити розраду в обіймах придворної коханки. Взаємна нелюбов в августійшому подружжі виявилася фатальною для Василя: через деякий час він був убитий, а влада над Трапезундом перейшла до Ірини. У країні почалися неспокійні часи."
  flavor_tre.4.title: "[target_character_2.GetNameWithNoTooltip] і [Select_CString(target_character_2.IsFemale, 'її', 'його')] спадщина"
  flavor_tre.4.entry: "Правління Олексія II"
  flavor_tre.4.desc: "[target_character_1.GetName] посідає трон, і це знаменує собою продовження великої доби для всіх жителів [ROOT.GetCountry.Custom('rank_ua_GEN')|l]. [target_character_2.GetName] [Select_CString(target_character_2.IsFemale, 'передала', 'передав')] трон у спадок, і [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] слідом за [Select_CString(target_character_2.IsFemale, 'нею', 'ним')] править у політичній обстановці, на яку впливають династичні традиції, місцева знать та інтереси країн #TOOLTIP:AREA,black_sea_area,X #L Чорноморського#!#! узбережжя.\n\nЯким нащадки запам’ятають це правління, залежатиме не тільки від майбутніх діянь, а й від того, з якою впевненістю підтримуватиметься або переглядатиметься спадщина попередників [Select_CString(target_character_1.IsFemale, 'нової правительки', 'нового правителя')]."
  flavor_TRE_4_historical_info: "Олексій II Великий Комнін прославився одним з найтриваліших правлінь в історії Трапезунда і правив у ті часи, коли імперія набагато більше покладалася на дипломатію, торгівлю та династичну передачу влади, ніж на розширення територій. З його смертю настав перехідний період, протягом якого влада правлячого дому зберігалася, але рівновага між придворними угрупованнями та іноземними купцями залишалася дуже крихкою."
  flavor_tre.4.a: "Спочивай з миром, [ROOT.GetCountry.GetGovernment.GetRulerTitle|l]..."
  flavor_tre.4.a.entry: "Спочивай з миром, великий правителю..."
  flavor_tre.5.title: "Батьківщина вишні"
  flavor_tre.5.entry: "$flavor_tre.5.title$"
  flavor_tre.5.desc: "[target_location.GetRank.GetName] #TOOLTIP:LOCATION,giresun,X #L Ґіресун#!#! довгий час залишався невеликим, але важливим портом на півдні #TOOLTIP:AREA,black_sea_area,X #L Чорного моря#!#!. До його гавані приходять шляхи з #L [ROOT.GetCountry.GetAdjective|l]их#! гір у глибині країни, і це гарна нагода для морської торгівлі, яка за правильної підтримки допоможе загальному розвитку країни.\n\nПрямі вкладення коштів або уважне управління [target_location.Custom('LR_INST')|l] [target_location.GetNameWithNoTooltip] здатні в майбутньому не тільки призвести до процвітання місцевих земель, а й ще більше зміцнити торговельну репутацію [ROOT.GetCountry.Custom('CL_GEN')]."
  flavor_TRE_5_historical_info: "Містечко Керасус, відоме сьогодні під назвою Ґіресун, мало стратегічне значення як прибережний порт і було досить відоме в регіоні Понт. Такі поселення забезпечували Трапезундській імперії доступ до чорноморської торгівлі та виступали посередниками між джерелами товарів у горах та міжнародними торговельними об’єднаннями. Кажуть, назва #italic Керасус#! з часом стала використовуватися для позначення вишні — місцевої солодкої ягоди."
  flavor_tre.5.a: "Це розважливе вкладення."
  flavor_tre.5.b: "Нехай розвивається сам собою."
  flavor_tre.6.title: "Зростаючий вплив італійських купців"
  flavor_tre.6.entry: "Обкласти податками венеційців та генуезців"
  flavor_tre.6.desc: "#TOOLTIP:CULTUREGROUP,italian_group,X #L Італійські#!#! купці з #ONCLICK:COUNTRY,[GetCountry('VEN').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('VEN').Custom('CL_tt')],X [GetCountry('VEN').Custom('CL_GEN')|L]#!#! та #ONCLICK:COUNTRY,[GetCountry('GEN').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('GEN').Custom('CL_tt')],X [GetCountry('GEN').Custom('CL_GEN')|L]#!#! давно користуються широкими привілеями в наших портах, а також звільнені від мит завдяки укладеним договорам та взаємовигідній необхідності. Їхні кораблі забезпечують нас багатством і товарами, але автономія цих купців все частіше викликає критику у місцевих #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L містян#!#! та чиновників.\n\nЯкщо ввести нові податки, ми зможемо утвердити наш суверенітет та зміцнити скарбницю, але ризикуємо викликати дипломатичний конфлікт з могутніми морськими республіками, чий вплив простягається далеко за межі #TOOLTIP:AREA,black_sea_area,X #L Чорного моря#!#!, а також порушити багаторічні торговельні угоди."
  flavor_tre.6.a: "Введемо нові податки."
  flavor_tre.6.b: "Краще не будемо їх злити."
  flavor_tre.7.title: "Аспрон"
  flavor_tre.7.entry: "$flavor_tre.7.title$"
  flavor_tre.7.desc: "#TOOLTIP:GOODS,silver,X #L Срібло#!#!, яке видобувають в околицях міста #TOOLTIP:LOCATION,gumushane,X #L Ґюмюшхане#!#!, дарує нам не тільки відчутне багатство — воно зміцнює довіру до наших грошей, а [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] завдяки цьому піднімає свій авторитет. Якщо розширити видобуток та карбування монет у цьому #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_PREP')|l]#!#!, то [ROOT.GetCountry.GetFlavorRank] змож[ROOT.GetCountry.Custom('endrank_eut')] зміцнити свою грошову систему та сприятиме місцевому процвітанню.\n\nОднак такі зусилля вимагають впевненого керівництва та негайних вкладень, а інтенсивний видобуток може зашкодити як місцевій землі, так і її жителям, якщо не знати міри."
  flavor_tre.7.a: "Зосередимося на посиленому видобутку!"
  flavor_tre.7.b: "Жадібність до добра не доведе."
  flavor_tre.8.title: "The Inheritance of [target_location.GetNameWithNoTooltip]"
  flavor_tre.8.entry: "The Inheritance of Constantinople"
  flavor_tre.8.desc: "For generations, the [target_dynasty.GetName] of [ROOT.GetCountry.GetName] preserved what others could not, keeping the flame of the ancient [ROOT.GetCountry.GetFlavorRank] alive on the shores of the [ShowAreaName('black_sea_area')] while lesser hands let civilization falter. That vigil was never in doubt. The outcome was never in doubt.\n\nNow [target_ruler.GetName] stands where only the worthy stand. The great [target_location.GetRank.GetName] of [target_location.GetName] shall now open its gates and its archives alike. Such vast wealth of administrative wisdom, codified across centuries of governance, was never theirs to keep. We have simply come to reclaim it."
  flavor_tre.8.historical_info: "The Grand Komnenoi of Trebizond were founded in 1204 by Alexios I Komnenos, a grandson of the Byzantine Emperor Andronikos I. Throughout their existence, the Trapezuntine emperors bore the title of Emperor of the Romans and regarded themselves as the rightful successors to the Byzantine imperial legacy. Constantinople, the legendary seat of the Eastern Roman Emperors, was not merely a political prize but the spiritual and cultural heart of a civilization stretching back a millennium."
  flavor_tre.8.a: "Such is the destiny of our [ROOT.GetCountry.GetFlavorRank]."
  flavor_tre.8.a.tt: "We will gain access to many new [bureaucracies|e]."