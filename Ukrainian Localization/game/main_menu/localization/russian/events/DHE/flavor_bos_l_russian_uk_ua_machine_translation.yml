l_russian:
  flavor_bos.1.title: "Прагнення незалежності"
  flavor_bos.1.entry: "$flavor_bos.1.title$"
  flavor_bos.1.desc: "Коли [Select_CString(hun_robert.IsFemale, 'померла', 'помер')] [hun_robert.GetName], у #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! з’явилася унікальна нагода позбутися #L [GetCountry('HUN').GetAdjective|l]ого#! панування. Не бажаючи ризикувати головою у відкритому повстанні, [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'має намір', 'має намір')] нишком підточити вплив [GetCountry('HUN').Custom('CL_GEN')] та налагодити дипломатичні відносини з ворогами цієї країни, щоб заручитися їхньою підтримкою в боротьбі за незалежність."
  flavor_bos.1.a: "Ми не вправі проминути такий шанс."
  flavor_bos.1.b: "[GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|U] [GetCountry('HUN').Custom('CL_GEN')] мож[ROOT.GetCountry.Custom('crown_eut')] не сумніватися в нашій відданості."
  flavor_bos.1.b.entry: "Ми залишимося вірні угорським правителям."
  flavor_bos.1.a.tt: "Постійне підточування [GetCountry('HUN').GetAdjectiveWithNoTooltip|l]ої влади — наприклад, покращення відносин з їхніми суперниками та зниження нашої вірності — може змусити [GetCountry('HUN').Custom('CL_ACC')] переглянути наш ленний статус."
  flavor_bos.1.historical_info: "За правління Степана II Боснія використовувала суперечності між Угорщиною та її суперниками, прагнучи позбутися угорського панування. Після смерті основних угорських союзників Степана, таких як король Карл Роберт та славонський бан Мікач, боснійський бан вирішив скористатися черговою війною з Венецією, щоб підірвати авторитет сюзерена. Він роздавав хабарі, ухилявся від виконання васальних зобов’язань і навіть передавав противнику військові відомості. Недоброзичливці прозвали його «учнем диявола», він зовсім втратив довіру нового короля, проте знесилена Угорщина нічого не могла вдіяти з непокірним васалом. До кінця правління Степана II угорська влада над Боснією стала лише формальністю."
  flavor_bos.2.title: "Спад [GetCountry('SER').Custom('CL_GEN')]"
  flavor_bos.2.entry: "Спад Сербії"
  flavor_bos.2.desc: "Коли [Select_CString(ser_dusan.IsFemale, 'померла', 'помер')] [ser_dusan.GetName], [GetCountry('SER').GetName] занури[GetCountry('SER').Custom('end_vlaloly')]ся у затяжну смуту. Зі спадом центральної влади між місцевими феодалами почалася міжусобна боротьба, проте ніхто з них не має ані авторитету, ані династичних прав на трон. Наші правителі пов’язані з родом [ser_dusan.GetDynasty.GetName] династичними узами, тож ми вправі висунути законні претензії на [GetCountry('SER').GetAdjectiveWithNoTooltip|l]у корону."
  flavor_bos.2.a: "Ми скористаємося їхньою роздробленістю, щоб розширити свій вплив."
  flavor_bos.2.b: "Краще зосередимося на внутрішніх проблемах країни."
  flavor_bos.2.historical_info: "Коли припинилася династія Неманичів, сербський престол спорожнів, а землі колишньої імперії виявилися розділені між місцевими феодалами. Скориставшись вакуумом влади, Твртко I, що перебував у родинних зв’язках з Неманичами через свою бабусю по батьківській лінії, висунув претензії на сербську корону, сподіваючись розширити боснійський вплив далі на схід."
  flavor_bos.3.title: "[Select_CString(target_ruler.IsFemale, 'Перша королева', 'Перший король')] [ROOT.GetCountry.Custom('CL_GEN')]"
  flavor_bos.3.entry: "$flavor_bos.3.title$"
  flavor_bos.3.desc: "За підсумками успішної кампанії в наших руках опинилися великі території колишньої #L [GetCountry('SER').GetAdjective|l]ої#! держави. [target_ruler.GetName], [Select_CString(target_ruler.IsFemale, 'надихнута', 'надихнутий')] цим успіхом, має намір не тільки прийняти титул короля [GetCountry('SER').Custom('CL_GEN')], а й звести #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! в ранг королівства, ставши [Select_CString(target_ruler.IsFemale, 'першою королевою', 'першим королем')] в історії нашої країни."
  flavor_bos.3.a: "Нашій країні потрібен король."
  flavor_bos.3.b: "Від корони одні лише клопоти."
  flavor_bos.3.historical_info: "До початку 70-х років XIV століття колишнє Сербське царство розпалося на безліч уділів під владою місцевих феодалів, серед яких був і Твртко Боснійський. Однак його становище істотно відрізнялося: він уже правив незалежною державою, до складу якої входила чимала частина сербських земель. Більше того, на відміну від інших сербських правителів він претендував на спорідненість з династією Неманичів, що забезпечувало додаткову легітимність його правлінню. Виходячи з цього, боснійський двір виробив обґрунтування для визнання Твртко монархом двох держав. Восени 1377 року він був коронований як король сербів і Боснії."
  flavor_bos.4.title: "Рада стройників"
  flavor_bos.4.entry: "$flavor_bos.4.title$"
  flavor_bos.4.desc: "Стройники — старійшини #L [ROOT.GetCountry.GetAdjective|l]ої#! церкви — зібралися, щоб обговорити майбутнє нашої віри. Рада має вирішити застарілі суперечки, доктринальні розбіжності та інші нагальні питання."
  flavor_bos.4.a: "Насамперед церква потребує стабільності."
  flavor_bos.4.b: "Ми повинні уточнити догмати віровчення."
  flavor_bos.4.c: "Зараз найважливіше вирішити внутрішні суперечки."
  flavor_bos.4.d: "Час замислитися про церковне майно."
  flavor_bos.5.title: "Доля [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ої церкви"
  flavor_bos.5.entry: "$flavor_bos.5.title$"
  flavor_bos.5.desc: "[ROOT.GetCountry.Custom('rank_ua_DAT')] все важче виносити зростаючий тиск з боку #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L Католицької церкви#!#!. [target_pope.GetName] звинувачує нас у переховуванні небезпечних єресей. Ходять чутки, що [Select_CString(target_pope.IsFemale, 'вона', 'він')] замислюється про організацію нового хрестового походу проти #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Багато поколінь ми боролися за існування нашої власної церкви, але, можливо, настав час поступитися і приєднатися до числа #TOOLTIP:RELIGION,$catholic_tt$,X #L католицьких#!#! держав."
  flavor_bos.5.a: "Наша церква вистоїть!"
  flavor_bos.5.b: "Час стати частиною католицького світу."
  flavor_bos.5.c: "Краще звернімося до Константинополя."
  flavor_bos.5_catholic_unhappy: "Усі #TOOLTIP:RELIGION,$catholic_tt$,X #L католицькі#!#! [Concept('pops', 'групи населення')|e] отримують [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  flavor_bos.5_krstjani_unhappy: "Усі #TOOLTIP:RELIGION,$bosnian_church_tt$,X #L крстянські#!#! [Concept('pops', 'групи населення')|e] отримують [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  flavor_bos.5_orthodox_unhappy: "Усі #TOOLTIP:RELIGION,$orthodox_tt$,X #L православні#!#! [Concept('pops', 'групи населення')|e] отримують [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  flavor_bos.5.historical_info: "Протягом довгого часу Боснійська церква піддавалася критиці з боку папства, її нерідко звинувачували в єретичних поглядах. У 1203 році представники церкви підписали «Білінопольське зречення», де зобов’язалися дотримуватися католицької доктрини та відмовитися від обрядів, оголошених єретичними. Проте багато вірян таємно продовжували шанувати звичні традиції. У 1337 році папа Бенедикт XII знову оголосив хрестовий похід, але ця спроба не досягла успіху. Боснійська церква проіснувала аж до османського завоювання регіону."