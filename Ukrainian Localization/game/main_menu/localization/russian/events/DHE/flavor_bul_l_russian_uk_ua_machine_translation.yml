l_russian:
  flavor_bul.1.title: "[GetCountry('KVN').GetLongNameWithNoTooltip]"
  flavor_bul.1.entry: "Князівство Добруджа"
  flavor_bul.1.desc: "За останні роки [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] значною мірою втрати[ROOT.GetCountry.Custom('crown_vlaloly')] контроль над країною, тоді як могутн[ROOT.GetCountry.Custom('nobles_iyyayei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], навпаки, сильн[ROOT.GetCountry.Custom('nobles_yiaei')] як ніколи. Особливо явно це проявляється в #TOOLTIP:PROVINCE_DEFINITION,north_dobruja_province,X #L Північній#!#! та #TOOLTIP:PROVINCE_DEFINITION,south_dobruja_province,X #L Південній Добруджі#!#!: [target_character.GetName] править цими провінціями практично незалежно, повністю контролюючи місцеву торгівлю, фортеці та флот. Дехто вважає, що настав час надати [Select_CString(target_character.IsFemale, 'їй', 'йому')] автономію та офіційно визнати нашим васалом, інакше ми остаточно втратимо Добруджу. Втім, є й ті, хто вимагає відновлення нашої влади в регіоні."
  flavor_bul.1.a: "Ми визнаємо їхню автономію."
  dobrujan_revolt: "Повстання в Добруджі"
  flavor_bul.1.b: "Це невіддільна частина нашої країни!"
  flavor_bul.1.b.tt: "Усі [Concept('pops', 'громади')|e] корінних місцевостей Карвуни у володінні отримають [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e] та приєднаються до заколоту"
  flavor_bul.1.c: "Приймемо владу над [GetCountry('KVN').Custom('CL_INST')]."
  flavor_bul.1.c.entry: "Приймемо владу над Карвуною."
  flavor_bul.1.historical_info: "Деспотат Карвуна утворився в XIV столітті на тлі поступового занепаду центральної влади в Болгарії. Спочатку Карвуна, ймовірно, залишалася напівзалежним васалом, але згодом стала фактично незалежною країною. Деспоти карбували власну монету, проводили самостійну зовнішню політику та вели війни без огляду на Тирново."
  flavor_bul.2.title: "Проблеми з престолонаслідуванням"
  flavor_bul.2.entry: "$flavor_bul.2.title$"
  flavor_bul.2.desc: "[target_ruler.GetName] старіє, [Select_CString(target_ruler.IsFemale, 'її', 'його')] все частіше відвідують тривожні думи про те, яка доля чекає #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! після [Select_CString(target_ruler.IsFemale, 'її', 'його')] кончини. [ROOT.GetCountry.GetGovernment.GetRulerTitle|U] побоюється, що суперництво між [Select_CString(target_ruler.IsFemale, 'її', 'його')] синами переросте в громадянську війну. Щоб уникнути кризи престолонаслідування, радники пропонують розділити [ROOT.GetCountry.Custom('rank_ua_ACC')|l]: [targer_brother.GetName] отримає землі на північному заході з центром у #TOOLTIP:LOCATION,vidin,X #L Видині#!#!, тоді як [target_heir.GetName] буде [Select_CString(target_heir.IsFemale, 'визнана', 'визнаний')] як [ROOT.GetCountry.GetGovernment.GetHeirTitle|l] у [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName] та решті країни."
  flavor_bul.2.a: "Нехай кожен із синів править у мирі."
  flavor_bul.2.b: "У країні може бути лише один [ROOT.GetCountry.GetGovernment.GetRulerTitle|l]."
  flavor_bul.2.c: "Ми правитимемо у Видині."
  flavor_bul.2.historical_info: "Розділ Болгарії за правління Івана Александра був зумовлений насамперед несподіваною загибеллю його сина, співправителя та спадкоємця Михайла Асеня IV, який поліг у бою з османами. Побоюючись майбутньої міжусобиці, Іван Александр наділив свого сина Івана Срацимира царським титулом і передав йому Видин, тоді як інший син, Іван Шишман, успадкував престол у Тирново."
  flavor_bul.3.title: "Другий золотий вік [ROOT.GetCountry.Custom('CL_GEN')]"
  flavor_bul.3.entry: "$flavor_bul.3.title$"
  flavor_bul.3.desc: "[target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'висловила', 'висловив')] прагнення повернути славні часи Симеона Великого, коли [ROOT.GetCountry.GetName] бу[ROOT.GetCountry.Custom('end_vlaloly')] центром вченості та культури. Бажаючи відродити духовну та мистецьку спадщину країни, [target_ruler.GetSheHe] [Select_CString(target_ruler.IsFemale, 'готова', 'готовий')] профінансувати відродження монастирів та виділити значні кошти чернечим громадам. Дехто побоюється, що це призведе до непомірних витрат, однак [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(target_ruler.IsFemale, 'переконана', 'переконаний')], що в довгостроковій перспективі [Select_CString(target_ruler.IsFemale, 'її', 'його')] плани принесуть [ROOT.GetCountry.Custom('rank_ua_DAT')|l] чималу користь."
  flavor_bul.3.a: "Ми схвалюємо цей задум."
  flavor_bul.3.b: "Це розорить нашу скарбницю."
  flavor_bul.3.historical_info: "Останні роки царювання Івана Александра були відзначені занепадом та роздробленістю країни, проте початок його правління був часом блискучого культурного відродження. Цей період нерідко називають «другим золотим віком Болгарії». Іван Александр підтримував відновлення старих монастирів та зведення нових, приділяв увагу релігійним питанням та прагнув зміцнити Болгарську православну церкву. У цей же час у країні спостерігалося зростання літературної діяльності, результатом якого стала поява безлічі літописів та праць."
  flavor_bul.4.title: "Четвероєвангеліє царя Івана Александра"
  flavor_bul.4.entry: "$flavor_bul.4.title$"
  flavor_bul.4.desc: "[Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'Наша', 'Наш')] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] мріє про культурне відродження #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, і [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'її', 'його')] зусилля вже приносять плоди. На замовлення [ROOT.GetCountry.GetGovernment.GetAdjective|l]их властей [Select_CString(target_artist.IsFemale, 'черниця', 'чернець')] на ім'я [target_artist.GetShortName] [Select_CString(target_artist.IsFemale, 'створила', 'створив')] у #TOOLTIP:LOCATION,tarnovo,X #L Тирново#!#! багато прикрашене Євангеліє, і [bul_ivan.GetName], безсумнівно, буде [Select_CString(bul_ivan.IsFemale, 'рада', 'радий')] взяти в руки цей безцінний фоліант. Попри все, ми все ще здатні створювати витвори мистецтва, подібних до яких немає навіть у #TOOLTIP:LOCATION,constantinople,X #L Константинополі#!#!."
  flavor_bul.4.a: "Чудово!"
  flavor_bul.4.historical_info: "«Четвероєвангеліє царя Івана Александра» є, мабуть, найзначнішим із пам'яток Другого Болгарського царства, що дійшли до нас, і одним із найяскравіших творів так званого «другого золотого віку». Рукопис містить повний текст Євангелій, ілюстрований 366 чудовими мініатюрами."
  flavor_bul.5.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]о-[GetCountry('TUR').GetAdjectiveWithNoTooltip|l]і війни"
  flavor_bul.5.entry: "Болгарсько-османські війни"
  flavor_bul.5.desc_common: "У [target_location.Custom('LR_GEN')|l] [target_location.GetName] наші війська вперше в історії зійшлися в бою [GetCountry('TUR').Custom('preposition_zzi')] #L [GetCountry('TUR').GetAdjective|l]им#! військом."
  flavor_bul.5.desc_victory: "$flavor_bul.5.desc_common$ Нам вдалося взяти гору, проте мало хто з командирів всерйоз вірить, що на цьому все закінчиться. [GetCountry('TUR').GetNameWithNoTooltip] — грізний противник, який здобув чимало перемог і рветься до нових завоювань. Скоріше за все, сьогоднішня битва стане лише першою в низці битв..."
  flavor_bul.5.desc_defeat: "$flavor_bul.5.desc_common$ Сумний результат цієї битви показав, що нам протистоїть завзятий і дисциплінований ворог. Якщо ми хочемо зберегти [ROOT.GetCountry.Custom('rank_ua_ACC')|l], потрібно готуватися до довгої та відчайдушної боротьби з могутнім і амбітним противником."
  flavor_bul.5.a: "Насувається буря, і ми повинні бути готові."
  flavor_bul.5.b: "Необхідно перехопити ініціативу!"
  flavor_bul.5.historical_info: "Війни з османами стали переломним етапом в історії Болгарії. У XIV столітті турки почали просуватися вглиб Балкан, і Болгарія, роздроблена та роздирана внутрішніми суперечностями, опинилася на шляху османської країни, що набирала міць. Деякий час болгари стримували натиск ворога, їм вдалося вистояти кілька битв, які не принесли перемоги жодній стороні, але зрештою сильніше османське військо взяло гору. З падінням Видина в 1396 році болгарській державності настав кінець. Розпочався майже п'ятистолітній період турецького панування над Болгарією."
  flavor_bul.6.title: "[ROOT.GetCountry.GetGovernment.GetAdjective]е розлучення"
  flavor_bul.6.entry: "$flavor_bul.6.title$"
  flavor_bul.6.desc: "#L [ROOT.GetCountry.GetAdjective]ий#! [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] у сум’ятті: [target_ruler.GetName] оголосив про свій намір розлучитися з законною дружиною та взяти за жінку простолюдинку на ім’я [target_newwife.GetShortName] — ще й навернену #TOOLTIP:CULTUREGROUP,jewish_group,X #L юдейку#!#!! [target_oldwife.GetName], перша дружина монарха, вирушить до монастиря. Багато хто побоюється, що подібне рішення підірве й без того хитку стабільність [ROOT.GetCountry.Custom('rank_ua_GEN')|l] і посіє розбрат між царевичами, що надалі може вилитися в кризу престолонаслідування. Але коли [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] чогось бажає, хто насмілиться оскаржувати його волю?"
  flavor_bul.6.a: "Цей шлюб буде укладено."
  flavor_bul.6.b: "Інтереси [ROOT.GetCountry.Custom('rank_ua_GEN')|l] важливіші за особисте щастя монарха."
  flavor_bul.6.b.entry: "Інтереси країни понад усе."
  flavor_bul.6.historical_info: "У шлюбі Івана Олександра з другою дружиною Сарою-Феодорою народилося шестеро дітей, зокрема Іван Шишман, який успадкував батьківський престол у Тирново. Вважається, що Сара-Феодора активно відстоювала інтереси свого сина, домагаючись визнання його єдиним спадкоємцем в обхід Івана Срацимира — останнього із синів Івана Олександра від першої дружини, Феодори Валаської. Зрештою це призвело до поділу Болгарії між Тирново та Видином."
  flavor_bul.7.title: "Номінальна імперія"
  flavor_bul.7.entry: "$flavor_bul.7.title$"
  flavor_bul.7.desc: "Наші правителі гордо величають себе імператорами, але чужоземці вважають їх не імператорами, а в кращому разі королями, що вирядилися в шати не за статусом. Чужоземці стверджують, що цього титулу гідні лише лідери #ONCLICK:COUNTRY,[GetCountry('BYZ').GetKey] #TOOLTIP:COUNTRY,[GetCountry('BYZ').GetKey],X [GetCountry('BYZ').Custom('CL_GEN')|L]#!#! та #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священної Римської Імперії#!#!. Такий розрив між тим, ким ми бачимо себе, та сприйняттям збоку становить загрозу нашій владі, і ми повинні будь-що зміцнити легітимність."
  flavor_bul.7.a: "Вони почнуть нас поважати!"
  flavor_bul.7.a.tt: "Ми починаємо в статусі імперії, однак отримуємо переваги, що відповідають лише рангу королівства.\nЄ кілька способів підвищити авторитет #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! та позбутися [Concept('modifier', 'модифікатора')|e] #TOOLTIP:STATIC_MODIFIER,bul_unrecognized_imperial_title,X #V #L «Невизнана імперія»#!#!#!:\n• Впоратися з [Concept('disaster', 'лихом')|e] #TOOLTIP:DISASTER_TYPE,twilight_of_the_tsardom,X #L «Занепад царства»#!#!, будучи [Concept('great_power', 'великою державою')|e] або заволодівши #TOOLTIP:LOCATION,constantinople,X #L Константинополем#!#!.\n• Завоювати #TOOLTIP:LOCATION,constantinople,X #L Константинополь#!#! після успішної боротьби з [Concept('disaster', 'лихом')|e] #TOOLTIP:DISASTER_TYPE,twilight_of_the_tsardom,X #L «Занепад царства»#!#!.\n• Стати [Concept('great_power', 'великою державою')|e] після успішної боротьби з [Concept('disaster', 'лихом')|e] #TOOLTIP:DISASTER_TYPE,twilight_of_the_tsardom,X #L «Занепад царства»#!#!."
  flavor_bul.7.historical_info: "У 1204 році болгарський правитель Калоян був коронований посланцем, якого відправив папа Інокентій III. Церемонія пройшла напружено, оскільки Калоян отримав титул царя, а не імператора. Згідно з традицією, імператорами іменували лише володарів Священної Римської Імперії. Втім, Калоян не погодився з такими обмеженнями, і в результаті вийшло так, що самі болгари називали своїх государів імператорами, а за кордоном цей титул визнаний не був."
  flavor_bul.8.title: "Згасаюча імперія"
  flavor_bul.8.entry: "$flavor_bul.8.title$"
  flavor_bul.8.desc: "Лихо «$twilight_of_the_tsardom.1.title$» завершилося, і [ROOT.GetCountry.GetName] оправи[ROOT.GetCountry.Custom('end_vlaloly')]ся від наслідків довгої внутрішньої боротьби, тоді як [GetCountry('BYZ').GetName] все ще залиша[GetCountry('BYZ').Custom('end_youtyut')]ся роздробленою та вразливою країною. У нас з’явилася рідкісна нагода завдати удару, поки імперія не встигла залікувати рани, але потрібно поспішати."
  flavor_bul.8.a: "Значить, до бою!"
  flavor_bul.8.b: "Ми ще не готові..."
  flavor_bul.9.title: "Визнана велика держава"
  flavor_bul.9.entry: "$flavor_bul.9.title$"
  flavor_bul.9.desc: "#L [ROOT.GetCountry.GetAdjective]е#! царство увійшло до списку великих світових держав. Ми не тільки повернули колишню велич, а й примножили її. Нам більше не доведеться захищати свої права та доводити свою спроможність перед скептиками-чужоземцями, адже наша сила говорить сама за себе, і тепер її визнає весь світ."
  flavor_bul.9.a: "$rank_empire_bulgarian$ навіки!"
  flavor_bul.1000.title: "Розквіт нового царства"
  flavor_bul.1000.entry: "$flavor_bul.1000.title$"
  flavor_bul.1000.desc: "Стіни #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#! нарешті впали під натиском доблесних #L [ROOT.GetCountry.GetAdjective|l]их#! військ. Для колись могутнього міста починається нова доба, а часи занепаду та приниження #TOOLTIP:RELIGION,$orthodox_tt$,X #L православної#!#! віри назавжди залишаться в минулому. Скоро весь світ дізнається, що Фенікс згорів дотла. Хай живе [target_ruler.GetName], $STATIC_MODIFIER_NAME_bul_conqueror_of_constantinople$!"
  flavor_bul.1000.a: "Сьогодні народжується нова імперія!"
  flavor_bul.1000.a.tt: "Усі сусідні [Concept('countries', 'країни')|e], які не перебувають у [Concept('alliance', 'союзі')|e] з нами та не є нашими [Concept('subject', 'васалами')|e], а також усі наші [Concept('rivals', 'суперники')|e] отримають [ShowBiasValue('opinion_bul_proclaimed_an_empire')|+=] до [Concept('opinion', 'думки')|e] про нас."
  flavor_bul.1000.b: "Нам не потрібні гучні титули — вистачить і того, що ми перемогли."
  flavor_bul.1001.title: "Царгород"
  flavor_bul.1001.desc: "З перетворенням #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! на імперію слава і світове значення країни різко зросли. Тепер багато хто при дворі сумнівається, чи може [ROOT.GetCountry.GetCapital.GetRank.GetNameWithNoTooltip|l] [ROOT.GetCountry.GetCapital.GetName] залишатися центром такої славної та могутньої країни, як [ROOT.GetCountry.GetLongNameWithNoTooltip]. Вони пропонують перенести столицю до #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#!, який століттями вважався політичним і духовним центром усього #TOOLTIP:RELIGION,$orthodox_tt$,X #L православного#!#! світу."
  flavor_bul.1001.a: "У нас буде столиця, гідна великої імперії!"
  flavor_bul.1001.b: "[ROOT.GetCountry.GetCapital.GetRank.GetNameWithNoTooltip] [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] нас цілком влаштовує."
  flavor_bul.1001.b.entry: "Нас цілком влаштовує і столиця."
  flavor_bul.1001.historical_info: "Протягом століть багато країн мріяли володіти Константинополем, і Болгарія не виняток. Болгарські правителі не раз намагалися захопити велике місто, проте жоден з них не досяг успіху. Найближче до мети підійшов Симеон Великий: хоча Константинополь і вистояв, війна з Болгарією закінчилася принизливою поразкою Візантії. Імперії довелося визнати за Симеоном царську гідність, що перетворило Болгарію на одну з провідних балканських країн."