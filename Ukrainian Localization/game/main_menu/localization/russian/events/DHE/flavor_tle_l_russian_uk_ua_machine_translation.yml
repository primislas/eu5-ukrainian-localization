l_russian:
  banu_al_wad: "Бану Абд аль-Вад"
  FATE_OF_TLEMCEN: "Доля [ShowLocationNameWithNoTooltip('tlemcen')]"
  flavor_tle.1.title: "Падіння міста [capital_scope.GetNameWithNoTooltip]"
  flavor_tle.1.desc: "Місто [capital_scope.GetName], столиця нашої славної країни, пало під натиском ворожих військ. Та що ще гірше, [Select_CString(ruler_scope.IsFemale,'наша дорога правителька', 'наш дорогий правитель')] [ruler_scope.GetName] і [Select_CString(ruler_scope.IsFemale,'її', 'його')] сини були підступно вбиті під час нападу.\n\nЖителі [ROOT.GetCountry.Custom('rank_ua_GEN')] потрясені цією жахливою трагедією, і всі розуміють, що тепер дати відсіч ворогу буде ще складніше…"
  flavor_tle.1.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
  tle_morrocan_tlemcen_war: "Якщо [target_location.GetName] захопить [mor_scope.GetLongName] під час [target_war.GetName], [mor_scope.GetName] зможе силою перетворити [tle_scope.GetName] на [ShowSubjectTypeName('fiefdom')]"
  tle_additional_warning: "[target_siege.GetName] необхідно зняти якнайшвидше!"
  flavor_tle.2.title: "Падіння міста [target.GetNameWithNoTooltip]"
  flavor_tle.2.desc: "[target.GetName], перлина [target.GetArea.GetName], зрештою впала під нашою облогою та здалася нашим могутнім військам. Щойно брама відчинилася, наші війська вдерлися до [target.GetRank.GetName], прагнучи захопити головну цитадель у надії на здобич і бранців. У цитаделі опинилося чимало членів [target_country.GetGovernment.GetAdjective] родини, яких наші вояки хутко схопили та вивели до [from_country.GetAdjective] полководців. Може, це кінець [target_war.GetName]?"
  flavor_tle.2.a: "Подбайте про те, щоб [target_dynasty.GetNameWithNoTooltip] не стали на заваді."
  flavor_tle.2.b: "Уперед, на [ShowLocationNameWithNoTooltip('oran')]!"
  TLE_once_truce_ends_zayyanid_pretenders_tt: "Once the [truce|e] with [target_country.GetName] ends, they will have access to the [ShowDecisionName('zayyanid_pretenders_decision')] [decision|e], allowing them to declare a special [ShowCasusBelliName('cb_independence')] [war|e]"
  flavor_tle.3.title: "$flavor_tle.2.title$"
  flavor_tle.3.desc: "The capital of our beloved [ROOT.GetCountry.GetFlavorRank], [target.GetName], has fallen to our heinous enemies from the [from_country.GetLongName]. To add to this tragedy, many of our beloved [target_dynasty.GetName] family members were killed during the assault.\n\nThis calamity has sent a shockwave of despair throughout the [ROOT.GetCountry.GetLongName], and has made continuing the war practically impossible. Though the killings alone are not enough to paralyze the country, the loss of trust in the leadership certainly is. Having been abandoned by our tribal allies, our morale is at an all-time low, and with no established resistance movement, this marks the end of the [target_war.GetName]."
  flavor_tle.3.a: "[ROOT.GetCountry.Custom('common_string_negative')]."
  TLE_as_per_the_warning: "Ми не зважили на застереження й допустили, щоб наш улюблений [target.GetName] було захоплено. Родину [target_dynasty.GetName] винищено, і тепер ми — [ShowSubjectTypeName('fiefdom')] [from_country.GetName]."
  zayyanid_pretenders_decision.title: "Звести на престол принца [ShowDynastyNameWithNoTooltip('zayyanid_dynasty')]"
  zayyanid_pretenders_decision.desc: "Правління [ROOT.GetCountry.GetDiplomacy.GetOverlord.GetName] у кращому разі незручне для [ROOT.GetCountry.GetLongName], а в гіршому — тиранічне. Запросімо ж принца [ShowDynastyName('zayyanid_dynasty')] знову правити нами й об’єднаймо всі [ShowEstateTypeName('tribes_estate')] проти спільного ворога."
  zayyanid_pretenders_decision.desc.entry: "Правління нашого сюзерена справді тиранічне. Воно хитає зверхність племен $banu_al_wad$ до самих основ. Запросімо ж принца [ShowDynastyName('zayyanid_dynasty')] знову правити нами й об’єднаймо всі [ShowEstateTypeName('tribes_estate')] проти спільного ворога."
  zayyanid_pretenders_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  zayyanid_pretenders_decision.a.entry: "$common_string_great$"
  zayyanid_prince_takes_over: "Принц [dynasty|e] [ShowDynastyName('zayyanid_dynasty')] приходить до влади"
  flavor_tle.4.title: "$flavor_tle.7.title$"
  flavor_tle.4.desc: "Становище в [from_country.GetName] стає дедалі безнадійнішим. Багато претендентів із династії [target_dynasty.GetName] вийшли з тіні й активно шукають підтримки серед племен [ShowCultureName('zenati')] у цих землях. Якщо нам не вдасться заручитися прихильністю місцевих станів, [target_location.GetName] може стати вогнищем народного повстання, що покладе край нашій владі над [ShowRegionName('maghreb_region')]. Чи зможе [target_country.GetName] встояти перед такою бурею?"
  flavor_tle.4.a: "Ми мусимо прислухатися до цих застережень."
  tle_rules_for_zayyanid_pretenders: "If [target_country.GetName] fails to keep the [from_country.GetLongName] [subject_loyalty|e] above #Y 30#! for the following #Y 20#! years, [from_country.GetName] will be able to declare [ShowCasusBelliName('cb_independence_war')] [war|e] with the [ShowDecisionName('zayyanid_pretenders_decision')] [decision|e]"
  tle_rules_part_two: "Якщо це станеться, [from_country.GetName] отримає значні бонуси до військової міці, а [target_country.GetName] отримає таке:"
  flavor_tle.5.title: "[ShowDynastyNameWithNoTooltip('zayyanid_dynasty')] повертаються до [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]!"
  flavor_tle.5.desc: "[target_character.GetName], a pretender to the [from_country.GetAdjective] throne, has just entered [ROOT.GetCountry.GetCapital.GetName] to an ovation from the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] and representatives of the [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]. This act is an open declaration of war from [from_country.GetName] against the [target_country.GetLongName], the state that has ruled [ROOT.GetCountry.GetCapital.GetName] for far too long. [target_character.GetShortNameWithNoTooltip] enjoys widespread support in [from_country.GetNameWithNoTooltip], but most importantly has secured the [ShowModifier('tle_zayyanid_tribe_support')]: the backing of the largest and most powerful [ShowCultureName('zenati')] tribe in the [ROOT.GetCountry.GetFlavorRank], and the home tribe of the [target_dynasty.GetName].\n\nWe will show those [target_country.GetAdjectiveWithNoTooltip] bastards who shall be victorious in the [target_war.GetName]!"
  flavor_tle.5.a: "Хай буде слава [ROOT.GetCountry.GetReligion.GetGodName]!"
  zayyanid_pretender_effect: "Ми оголосимо [ShowCasusBelliName('cb_independence_war')] проти нашого [overlord|e] й отримаємо додаткові переваги за такою подією:"
  flavor_tle.6.title: "Повстання в [from_country.GetLongNameWithNoTooltip]!"
  flavor_tle.6.desc: "Our ardent efforts — privileges bestowed, diplomatic missions, luxurious gifts, posts granted — have all been for naught, as the tribes of [from_country.GetName] still choose to support the tyrannical [target_character.GetName] from the [target_dynasty.GetName] over more benevolent [target_country.GetAdjective] rule.\n\nSo it shall be, then! Let them face the wrath of our armies! We will inflict the divine punishment of [ROOT.GetCountry.GetReligion.GetGodName] upon them and seize victory in the [target_war.GetName]!"
  flavor_tle.6.a: "Наша гегемонія в [ShowRegionNameWithNoTooltip('maghreb_region')] непохитна!"
  flavor_tle.7.title: "[target_dynasty.GetNameWithNoTooltip] претенденти"
  flavor_tle.7.entry: "[ShowDynastyNameWithNoTooltip('zayyanid_dynasty')] претенденти"
  flavor_tle.7.desc: "За останні кілька років багато вцілілих представників роду [target_dynasty.GetName] вийшли з тіні, намагаючись заявити права на [target_location.GetName] та [from_country.GetAdjective] престол. Вони мають стриману підтримку серед люду та [target_country.GetGovernment.GetEstateName('tribes_estate')], і суспільні настрої поступово схиляються на їхню користь. Якщо наші володарі з [target_country.GetLongName] і далі поглиблюватимуть кризу в [target_location.GetProvince.GetName], ми цілком можемо стати свідками повернення роду [target_dynasty.GetNameWithNoTooltip] до влади."
  flavor_tle.7.a: "Можливо, це піде нам на користь."
  flavor_tle.11.title: "Вірність забезпечено"
  flavor_tle.11.desc: "Минули десятиліття відтоді, як відбулося [target_country.GetAdjective] підкорення [from_country.GetName], і чутки про повернення [ShowDynastyName('zayyanid_dynasty')] майже стихли. Схоже, нам нарешті вдалося втихомирити [ShowCultureName('zenati')] [from_country.GetGovernment.GetEstateName('tribes_estate')] і головного вождя серед них — $banu_al_wad$. Щойно їхні землі буде інтегровано, ми проголосимо нову добу процвітання для [ShowRegionName('maghreb_region')]."
  flavor_tle.11.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  tle_secured: "[from_country.GetName] більше не зможе здійняти повстання через [ShowDecisionName('zayyanid_pretenders_decision')]"
  flavor_tle.13.title: "Зростання [ShowLocationNameWithNoTooltip('oran')]"
  flavor_tle.13.entry: "$flavor_tle.13.title$"
  flavor_tle.13.desc: "Якщо [target_location2.GetName] — наша брама для торгівлі в [ShowScriptedGeographyName('sahara_desert_geography')], то [target_location.GetName] — наше вікно для торгівлі з [ShowContinentName('europe')]. Жоден інший порт не відіграє настільки важливої ролі, як [target_location.GetNameWithNoTooltip], адже це головна гавань, що пов’язує нас із нашими морськими партнерами в [ShowScriptedGeographyName('mediterranean_sea_geography')]. Можливо, [target_location.GetRank.GetName] заслуговує на додаткові привілеї для посилення місцевого [target_estate.GetName]."
  flavor_tle.13.a: "A splendid idea!"
  flavor_tle.13.b: "[target_location.GetNameWithNoTooltip] не заслуговує на особливе ставлення."