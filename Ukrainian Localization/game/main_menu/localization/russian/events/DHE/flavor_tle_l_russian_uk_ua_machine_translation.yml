l_russian:
  banu_al_wad: "Бану Абд аль-Вад"
  FATE_OF_TLEMCEN: "Доля Тлемсена"
  flavor_tle.1.title: "Падіння міста [capital_scope.GetNameWithNoTooltip]"
  flavor_tle.1.desc: "Місто [capital_scope.GetName], столиця нашої славної країни, пало під натиском ворожих військ. Та що ще гірше, [Select_CString(ruler_scope.IsFemale,'наша дорога правителька', 'наш дорогий правитель')] [ruler_scope.GetName] і [Select_CString(ruler_scope.IsFemale,'її', 'його')] сини були підступно вбиті під час нападу.\n\nЖителі [ROOT.GetCountry.Custom('rank_ua_GEN')] потрясені цією жахливою трагедією, і всі розуміють, що тепер дати відсіч ворогу буде ще складніше…"
  flavor_tle.1.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
  tle_morrocan_tlemcen_war: "Якщо [mor_scope.GetLongName] захоп[mor_scope.Custom('endlong_ytlyat')] [target_location.Custom('LR_ACC')|l] [target_location.GetName], поки триває «[target_war.GetName]», [mor_scope.GetName] змож[mor_scope.Custom('end_eut')] силою обернути #ONCLICK:COUNTRY,[tle_scope.GetKey] #TOOLTIP:COUNTRY,[tle_scope.GetKey],X [tle_scope.Custom('CL_ACC')|L]#!#! на свій #TOOLTIP:SUBJECT_TYPE,fiefdom,X #L феод#!#!"
  tle_additional_warning: "Облогу [target_siege.Custom('LR_GEN')|l] [target_siege.GetName] необхідно зняти якнайшвидше!"
  flavor_tle.2.title: "Падіння міста [target.GetNameWithNoTooltip]"
  flavor_tle.2.desc: "[target.GetRank.GetName|U] [target.GetName], перлина області [target.GetArea.GetName], не витримує облоги і зрештою здається нашому могутньому війську. Коли брама відчинилася, наші війська ринули в #L #TOOLTIP:LOCATIONRANK,[target.GetRank.Custom('LR_tt')],X [target.GetRank.Custom('LR_ACC')|l]$tt_cl_2$, прагнучи захопити головну цитадель, щоб заволодіти здобиччю та бранцями. Серед тих, хто сховався за її мурами, виявилося чимало представників правлячого [target_country.GetGovernment.GetAdjective|l]ого дому. Наші вояки негайно схопили їх і доправили до [from_country.GetAdjective|l]их воєначальників. Невже війна «[target_war.GetName]» добігає кінця?"
  flavor_tle.2.a: "Переконайтеся, що представники дому [target_dynasty.GetNameWithNoTooltip] не стануть на заваді нашим планам."
  flavor_tle.2.b: "Вперед, на Оран!"
  TLE_once_truce_ends_zayyanid_pretenders_tt: "Після закінчення [Concept('truce', 'перемир’я')|e] з #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_INST')|L]#!#! їм відкриється [Concept('decision', 'рішення')|e] «[ShowDecisionName('zayyanid_pretenders_decision')]», яке дозволяє оголосити особливу [Concept('war', 'війну')|e] за [ShowCasusBelliName('cb_independence_war')|l]"
  flavor_tle.3.title: "$flavor_tle.2.title$"
  flavor_tle.3.desc: "Столиця нашої улюбленої країни, [target.GetName], захоплена нашими запеклими ворогами із [from_country.Custom('longname_ua_GEN')]. На довершення цієї трагедії під час приступу загинуло багато представників нашого дорогого дому [target_dynasty.GetName].\n\nЗвістка про цю катастрофу прокотилася хвилею розпачу [ROOT.GetCountry.Custom('longname_ua_INST')] і майже позбавила країну сил продовжувати війну. Загибель членів правлячої родини сама по собі не змогла б знекровити країну, а от втрата довіри до правителів — зовсім інша річ. Після того як союзні племена покинули нас напризволяще, наш бойовий дух упав так низько, як ніколи досі. А оскільки організованого опору так і не виникло, війна «[target_war.GetName]» добігає кінця."
  flavor_tle.3.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
  TLE_as_per_the_warning: "Ми не дослухалися до застережень і допустили захоплення нашого улюбленого [target.GetRank.Custom('LR_GEN')|l] [target.GetName]. Усіх представників дому [target_dynasty.GetName] було перебито, а ми стали #TOOLTIP:SUBJECT_TYPE,fiefdom,X #L феодом#!#! #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_GEN')|L]#!#!."
  zayyanid_pretenders_decision.title: "Сходження на престол заянідського принца"
  zayyanid_pretenders_decision.desc: "Панування #ONCLICK:COUNTRY,[ROOT.GetCountry.GetDiplomacy.GetOverlord.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetDiplomacy.GetOverlord.GetKey],X [ROOT.GetCountry.GetDiplomacy.GetOverlord.Custom('CL_GEN')|L]#!#! у кращому разі сковує [ROOT.GetCountry.Custom('longname_ua_ACC')], а в гіршому — обертається тиранією. Запросімо принца з дому #TOOLTIP:DYNASTY,$zayyanid_dynasty_tt$,X #L Заянідів#!#!. Нехай він знову править нами й об’єднає всі #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племена#!#! у боротьбі зі спільним ворогом."
  zayyanid_pretenders_decision.desc.entry: "Наш сюзерен — тиран. Його панування підриває становище племен $banu_al_wad$. Запросімо принца з дому #TOOLTIP:DYNASTY,$zayyanid_dynasty_tt$,X #L Заянідів#!#!. Нехай він знову править нами й об’єднає всі #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племена#!#! у боротьбі зі спільним ворогом."
  zayyanid_pretenders_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  zayyanid_pretenders_decision.a.entry: "$common_string_great$"
  zayyanid_prince_takes_over: "Прихід до влади принца з [Concept('dynasty', 'дому')|e] #TOOLTIP:DYNASTY,$zayyanid_dynasty_tt$,X #L Заянідів#!#!"
  flavor_tle.4.title: "$flavor_tle.7.title$"
  flavor_tle.4.desc: "Становище в #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_PREP')|L]#!#! щодня стає дедалі небезпечнішим. Чимало претендентів із дому [target_dynasty.GetName] вийшли з тіні й активно шукають підтримки серед #TOOLTIP:CULTURE,$zenati_tt$,X #L зенатських#!#! племен, що мешкають у цих краях. Якщо місцеві стани не вдасться схилити на наш бік, [target_location.GetName] може стати осередком народного повстання, яке покладе край нашому пануванню в #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#!. Чи змож[target_country.Custom('end_eut')] [target_country.GetName] впоратися з бурею, що насувається?"
  flavor_tle.4.a: "Не можна легковажити цими застереженнями."
  tle_rules_for_zayyanid_pretenders: "Якщо впродовж наступних #Y 20#! років [target_country.GetName] не змож[target_country.Custom('end_eut')] утримувати [Concept('subject_loyalty', 'вірність свого васала')|e], [from_country.Custom('longname_ua_GEN')], вище #Y 30#! од., [from_country.GetName] отрима[from_country.Custom('end_yeyut')] змогу скористатися [Concept('decision', 'рішенням')|e] «[ShowDecisionName('zayyanid_pretenders_decision')]» та оголосити [Concept('war', 'війну')|e] за [ShowCasusBelliName('cb_independence_war')|l]"
  tle_rules_part_two: "Якщо таке станеться, [from_country.GetName] отрима[from_country.Custom('end_yeyut')] вагомі переваги до чисельності свого війська, а [target_country.GetName] отрима[target_country.Custom('end_yeyut')] таке:"
  flavor_tle.5.title: "Повернення Заянідів до [ROOT.GetCountry.GetCapital.Custom('LR_GEN')|l] [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]!"
  flavor_tle.5.desc: "[target_character.GetName], [Select_CString(target_character.IsFemale, 'претендентка', 'претендент')] на [from_country.GetAdjective|l]ий трон, [Select_CString(target_character.IsFemale, 'прибула', 'прибув')] до [ROOT.GetCountry.GetCapital.Custom('LR_GEN')|l] [ROOT.GetCountry.GetCapital.GetName], де [Select_CString(target_character.IsFemale, 'її', 'його')] вітали [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] та #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племена#!#!. Фактично цей крок рівнозначний оголошенню війни з боку #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_GEN')|L]#!#! [target_country.Custom('longname_ua_DAT')], країні, яка вже надто довго утримує владу над [ROOT.GetCountry.GetCapital.Custom('LR_INST')|l] [ROOT.GetCountry.GetCapital.GetName]. [target_character.GetShortNameWithNoTooltip] має значну підтримку [from_country.Custom('preposition_uv')] [from_country.Custom('CL_PREP')], але найголовніше те, що [Select_CString(target_character.IsFemale, 'вона заручилася', 'він заручився')] підтримкою Бану Абд аль-Вад, найбільшого та найсильнішого з-поміж #TOOLTIP:CULTURE,$zenati_tt$,X #L зенатських#!#! племен у [ROOT.GetCountry.Custom('rank_ua_PREP')|l], до якого належить і дім [target_dynasty.GetName].\n\nМи ще покажемо цим [target_country.GetAdjectiveWithNoTooltip|l]им мерзотникам, що війна «[target_war.GetName]» завершиться нашою перемогою!"
  flavor_tle.5.a: "Хвала Аллагові!"
  zayyanid_pretender_effect: "Ми оголосимо нашому [Concept('overlord', 'сюзерену')|e] війну за [ShowCasusBelliName('cb_independence_war')|l] і отримаємо додаткові переваги від наступної події:"
  flavor_tle.6.title: "Повстання у [from_country.Custom('longname_ua_wntt_PREP')]!"
  flavor_tle.6.desc: "Попри всі наші ревні зусилля — надання привілеїв, посольські місії, щедрі дари та призначення на високі посади, — здобути прихильність племен #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_GEN')|L]#!#! не вдалося. Вони, як і раніше, вірні дому [target_dynasty.GetName], який очолює [target_character.GetName], і, на жаль, відкидають м’якше правління #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_GEN')|L]#!#!.\n\nХай буде так! Ми обрушимо на них усю міць нашого війська! Нехай [ROOT.GetCountry.GetReligion.GetGodName] покарає їх, а війна «[target_war.GetName]» з божої ласки закінчиться нашою перемогою!"
  flavor_tle.6.a: "Ми нікому не дозволимо посягнути на наше панування в Магрибі!"
  flavor_tle.7.title: "Претенденти з дому [target_dynasty.GetNameWithNoTooltip]"
  flavor_tle.7.entry: "Заянідські претенденти"
  flavor_tle.7.desc: "За останні кілька років чимало представників дому [target_dynasty.GetName], які пережили різанину, вийшли з підпілля та розпочали боротьбу за повернення [target_location.Custom('LR_GEN')|l] [target_location.GetName] і [from_country.GetAdjective|l]ого престолу. Їхня підтримка серед люду та #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племен#!#! поки незначна, але настрої людей поволі змінюються на їхню користь. Якщо наш сюзерен із [target_country.Custom('longname_ua_GEN')] і надалі загострюватиме становище в провінції [target_location.GetProvince.GetName], повернення дому [target_dynasty.GetNameWithNoTooltip] на престол цілком може стати дійсністю."
  flavor_tle.7.a: "Це може бути нам на руку."
  flavor_tle.11.title: "Зміцнення вірности"
  flavor_tle.11.desc: "З миті [target_country.GetAdjective|l]ого завоювання #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_GEN')|L]#!#! минуло кілька десятиліть, і чутки про повернення дому #TOOLTIP:DYNASTY,$zayyanid_dynasty_tt$,X #L Заянідів#!#! уже майже забуті. Схоже, нам удалося зламати опір #TOOLTIP:CULTURE,$zenati_tt$,X #L зенатських#!#! #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племен#!#!, зокрема $banu_al_wad$. Після приєднання їхніх земель #TOOLTIP:REGION,maghreb_region,X #L Магриб#!#! вступить у нову добу розквіту."
  flavor_tle.11.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  tle_secured: "[from_country.GetName] більше не змож[from_country.Custom('end_eut')] повставати завдяки рішенню «[ShowDecisionName('zayyanid_pretenders_decision')]»"
  flavor_tle.13.title: "Зростання Орана"
  flavor_tle.13.entry: "$flavor_tle.13.title$"
  flavor_tle.13.desc: "Якщо [target_location2.GetName] — наша брама до торгівлі в Сахарі, то [target_location.GetName] — наше вікно до торгівлі в #TOOLTIP:CONTINENT,europe,X #L Європі#!#!. Значення порту в [target_location.Custom('CL_PREP')] годі переоцінити, оскільки це головна гавань, що пов’язує нас із нашими морськими партнерами в Середземномор’ї. Можливо, варто надати #L #TOOLTIP:COUNTRY_RANK,[target_location.GetRank.Custom('CF_tt')],X [target_location.GetRank.Custom('rank_ua_DAT')|l]#!#! додаткові привілеї. Так місцеві [target_estate.GetName|l] зможуть зміцнити своє становище завдяки нашій допомозі."
  flavor_tle.13.a: "Чудова думка!"
  flavor_tle.13.b: "[target_location.GetNameWithNoTooltip] не заслуговує на особливе ставлення."