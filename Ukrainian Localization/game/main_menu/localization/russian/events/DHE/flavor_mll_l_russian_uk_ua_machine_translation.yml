l_russian:
  flavor_mll.1.title: "Напружені відносини [target_country.Custom('end_predlog_sso')] [target_country.Custom('CL_INST')]"
  flavor_mll.1.entry: "Напружені відносини з Арагоном"
  flavor_mll.1.desc: "Відтоді як [Select_CString(GetCharacter('ara_jacme_i_arago').IsFemale, 'померла', 'помер')] [GetCharacter('ara_jacme_i_arago').GetName], [ROOT.GetCountry.GetLongName] та [target_country.GetLongName] незмінно зберігали добросусідські відносини, при цьому [ROOT.GetCountry.GetNameWithNoTooltip] визнавав[ROOT.GetCountry.Custom('end_fem')] [target_country.GetAdjectiveWithNoTooltip|l]ий сюзеренітет. Усе змінилося, коли до влади [Select_CString(our_ruler.IsFemale, 'прийшла', 'прийшов')] [our_ruler.GetName]. Вважаючи, що [Select_CString(our_ruler.IsFemale, 'вона', 'він')] та [ara_ruler.GetName] рівні за становищем, [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'оголосила', 'оголосив')], що не коритиметься іншому монарху. Годі й казати, що [target_country.GetCapital.GetName] не в захваті від цієї заяви.\n\nДосі [target_country.GetNameWithNoTooltip] не чинив[target_country.Custom('end_fem')] ворожих дій проти [ROOT.GetCountry.Custom('CL_GEN')], однак багато хто при [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ому дворі побоюється, що своїми різкими заявами [our_ruler.GetNameWithNoTooltip] дасть [target_country.GetAdjectiveWithNoTooltip|l]ій владі привід поглинути країну."
  flavor_mll.1.a: "Ми маємо бути вкрай обачними."
  repair_or_damage_relations_with_aragon_tt: "Якщо найближчими роками [ROOT.GetCountry.GetName] зумі[ROOT.GetCountry.Custom('end_etyut')] покращити відносини [target_country.Custom('end_predlog_sso')] #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_INST')|L]#!#! до #G +190#!, це дозволить згладити конфлікт з [target_country.GetAdjectiveWithNoTooltip|l]им двором. В іншому разі нам варто готуватися до остаточного розриву [target_country.Custom('end_predlog_sso')] [target_country.Custom('CL_INST')]."
  flavor_mll.2.title: "Наслідки [target_country_1.GetAdjectiveWithNoTooltip|l]ого конфлікту"
  flavor_mll.2.entry: "Наслідки конфлікту з Генуєю"
  flavor_mll.2.desc: "Недавнє протистояння між #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_INST')|L]#!#! та #ONCLICK:COUNTRY,[target_country_1.GetKey] #TOOLTIP:COUNTRY,[target_country_1.GetKey],X [target_country_1.Custom('CL_INST')|L]#!#! обернулося господарською катастрофою для [ROOT.GetCountry.Custom('longname_ua_GEN')]. [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] обурені тим, що [target_country.GetAdjectiveWithNoTooltip|l]а влада конфіскувала їхні кораблі для ведення воєнної кампанії на #TOOLTIP:AREA,sardinia_area,X #L Сардинії#!#!. Цей конфлікт уже завершився, але [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]і торгові шляхи досі не відновилися, і тепер [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] вимагають, щоб [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] відшкодували їм збитки. Водночас багато хто при дворі наполягає на запровадженні нових податків, адже з утратою багатьох кораблів [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]і береги стали беззахисними перед нападами #TOOLTIP:REGION,maghreb_region,X #L магрибських#!#! корсарів."
  flavor_mll.2.a: "Ми запровадимо новий податок, щоб поповнити скрині [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  flavor_mll.2.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|U] не мають залишитися без підтримки. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|U] виділять необхідні кошти."
  flavor_mll.3.title: "[our_ruler.GetNameWithNoTooltip] та [Select_CString(our_ruler.IsFemale, 'її', 'його')] палатинські закони"
  flavor_mll.3.entry: "Палатинські закони Хайме III"
  flavor_mll.3.desc: "Бажаючи зміцнити своє становище [Select_CString(our_ruler.IsFemale, 'незалежної правительки', 'незалежного правителя')] в очах #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_GEN')|L]#!#!, [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'наказала', 'наказав')] укласти звід законів, що дістав назву «[ShowPolicyName('mll_leges_palatinae')]». Новий кодекс підкреслює незалежний статус [ROOT.GetCountry.Custom('CL_GEN')] та зміцнює владні повноваження [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого двору."
  flavor_mll.3.a: "Ми негайно запровадимо новий звід законів, щоб зміцнити становище країни!"
  flavor_mll.3.b: "Поки що відкладемо ухвалення нового зводу, але триматимемо його під рукою."
  flavor_mll.3.c: "Наявні закони нас цілком влаштовують, ми не станемо їх змінювати."
  flavor_mll.4.title: "Ілюстрований рукопис «[ShowPolicyNameWithNoTooltip('mll_leges_palatinae')]»"
  flavor_mll.4.entry: "Ілюстрований рукопис Leges Palatinae"
  flavor_mll.4.desc: "Заклавши основи нового #TOOLTIP:LAW,legal_code_law,X #L зводу законів#!#!, [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'найняла', 'найняв')] кількох #TOOLTIP:CULTUREGROUP,italian_group,X #L італійських#!#! майстрів, щоби створити багато оздоблений рукопис цього кодексу. Мистці попрацювали на славу, рукопис вирізняється найвищою майстерністю, і дехто з вельмож при дворі радить подарувати його комусь із сусідніх правителів для зміцнення дипломатичних зносин."
  flavor_mll.4.a: "Нехай артефакт поки залишається при дворі."
  flavor_mll.4.b: "[fra_ruler.GetShortNameWithNoTooltip] із [target_country_1.Custom('CL_GEN')] зрадіє такому подарунку."
  flavor_mll.4.b.entry: "Гідний подарунок для правителя Франції."
  flavor_mll.4.c: "Ми надішлемо рукопис у [target_country.GetCapital.Custom('LR_ACC')|l] [target_country.GetCapital.GetNameWithNoTooltip] як свідчення високої слави [ROOT.GetCountry.Custom('CL_GEN')]."
  flavor_mll.4.c.entry: "Ми надішлемо рукопис до Арагону як свідчення високої слави Майорки."
  flavor_mll.5.title: "Володіння у [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
  flavor_mll.5.entry: "Володіння в Монпельє"
  flavor_mll.5.desc: "Коли [Select_CString(GetCharacter('ara_jacme_i_arago').IsFemale, 'померла', 'помер')] [GetCharacter('ara_jacme_i_arago').GetName], #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! відійшла низка володінь у материковій #TOOLTIP:CONTINENT,europe,X #L Європі#!#!. Особливе місце серед них посідає [target_location.GetRank.GetName|l] [target_location.GetName], тісно пов’язаний із #L [target_country_1.GetAdjective|l]им#! двором.\n\nЗ огляду на напружені відносини між #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_INST')|L]#!#! та [ROOT.GetCountry.Custom('CL_INST')] дехто з придворних вважає, що [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'повинна', 'повинен')] звернутися по підтримку, щоб на заклик відгукнулася #TOOLTIP:CULTURE,$languedocien_tt$,X #L лангедоцька#!#! [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] із [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]. Інші радять запропонувати [target_location.Custom('LR_ACC')|l] [target_country_1.Custom('CL_DAT')], щоб заручитися опікою могутнього сусіда."
  flavor_mll.5.a: "Скористаймося своїм становищем у [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip], щоб отримати підтримку місцевої знаті."
  flavor_mll.5.a.entry: "Скористаймося своїм становищем у Монпельє, щоб отримати підтримку місцевої знаті."
  flavor_mll.5.b: "Краще зосередьмося на справах [ROOT.GetCountry.Custom('CL_GEN')]."
  flavor_mll.5.c: "Домовмося [target_country_1.Custom('end_predlog_sso')] [target_country_1.Custom('CL_INST')] про передачу [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
  flavor_mll.5.c.entry: "Ми домовимося з Францією про передачу Монпельє."
  mll_unlock_sale_of_montpellier_decision_tt: "Розблоковує [Concept('decision', 'рішення')|e] «$mll_exchange_of_montpellier.title$», яке дозволяє заручитися дипломатичною підтримкою #ONCLICK:COUNTRY,[target_country_1.GetKey] #TOOLTIP:COUNTRY,[target_country_1.GetKey],X [target_country_1.Custom('CL_GEN')|L]#!#!"
  flavor_mll.6.title: "Захист Балеарських островів"
  flavor_mll.6.entry: "Захист Балеарських островів"
  flavor_mll.6.desc: "У минулому #L [target_country.GetAdjective|l]і#! патрулі успішно стримували #TOOLTIP:CULTUREGROUP,maghrebi_group,X #L магрибські#!#! набіги на #TOOLTIP:AREA,balearics_area,X #L Балеарські острови#!#!, проте останніми роками напади корсарів стали серйозною проблемою для [ROOT.GetCountry.Custom('longname_ua_GEN')].\n\nДоки у відносинах [target_country.Custom('end_predlog_sso')] [target_country.Custom('CL_INST')] зберігається напруженість, дехто з вельмож при дворі пропонує звести комплекс берегових укріплень для оборони островів від магрибських нападників — а заразом і від імовірного вторгнення з боку [target_country.Custom('CL_GEN')]…"
  flavor_mll.6.a: "Ми виділимо потрібні кошти, щоб зробити Балеарські острови неприступними для ворогів."
  flavor_mll.6.b: "Такі видатки нам не по кишені."
  mll_area_gains_naval_defensives_tt: "Усі [Concept('locations', 'місцевості')|e] #TOOLTIP:AREA,balearics_area,X #L Балеарських островів#!#! на 60 років отримають модифікатор «[ShowModifier('mll_expansion_of_coastal_fortifications')]»"
  flavor_mll.7.title: "У пошуках чужоземної допомоги"
  flavor_mll.7.entry: "$flavor_mll.7.title$"
  flavor_mll.7.desc: "Відносини між #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#! та [target_country.Custom('longname_ua_INST')] безнадійно зіпсовані. Багато хто з придворних радників вважає, що настав час звернутися по допомогу до давніх суперників [target_country.Custom('CL_GEN')]. Лише заручившись їхньою підтримкою, [our_ruler.GetName] матиме надію звільнитися від гніту [target_country.GetAdjectiveWithNoTooltip|l]ої столиці."
  flavor_mll.7.a: "Звернімося по допомогу до [target_country_2.Custom('CL_DAT')]."
  flavor_mll.7.a.entry: "Звернімося по допомогу до Кастилії."
  flavor_mll.7.b: "Звернімося по допомогу до [target_country_3.Custom('longname_ua_wntt_DAT')]."
  flavor_mll.7.b.entry: "Звернімося по допомогу до Неаполітанського королівства."
  flavor_mll.7.c: "Пошукаймо підтримки в наших давніх ворогів із [target_country_4.Custom('CL_GEN')]."
  flavor_mll.7.c.entry: "Пошукаймо підтримки в наших давніх ворогів із Генуї."
  flavor_mll.7.d: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|U] нашої країни — ось наша єдина надія."
  mll_conditions_for_castile_support_tt: "Якщо найближчими роками [ROOT.GetCountry.GetName] зумі[ROOT.GetCountry.Custom('end_etyut')] поліпшити відносини [target_country_2.Custom('end_predlog_sso')] #ONCLICK:COUNTRY,[target_country_2.GetKey] #TOOLTIP:COUNTRY,[target_country_2.GetKey],X [target_country_2.Custom('CL_INST')|L]#!#! до #G +150#!, ця країна отримає #G +50#! до схвалення будь-якого нашого руху за незалежність"
  mll_conditions_for_naples_support_tt: "Якщо найближчими роками [ROOT.GetCountry.GetName] зумі[ROOT.GetCountry.Custom('end_etyut')] поліпшити відносини [target_country_3.Custom('end_predlog_sso')] #ONCLICK:COUNTRY,[target_country_3.GetKey] #TOOLTIP:COUNTRY,[target_country_3.GetKey],X [target_country_3.Custom('CL_INST')|L]#!#! до #G +120#!, ця країна отримає #G +50#! до схвалення будь-якого нашого руху за незалежність"
  mll_conditions_for_genoa_support_tt: "Якщо найближчими роками [ROOT.GetCountry.GetName] змож[ROOT.GetCountry.Custom('end_etyut')] поліпшити відносини [target_country_4.Custom('end_predlog_sso')] #ONCLICK:COUNTRY,[target_country_4.GetKey] #TOOLTIP:COUNTRY,[target_country_4.GetKey],X [target_country_4.Custom('CL_INST')|L]#!#! до #G +100#!, ця країна отримає #G +50#! до схвалення будь-якого нашого руху за незалежність"
  MLL_PLEDGED_SUPPORT: "Обіцянка підтримки"
  flavor_mll.8.title: "Кінець присяги"
  flavor_mll.8.entry: "Кінець арагонської присяги"
  flavor_mll.8.desc: "Усі спроби примирити #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! [target_country.Custom('end_predlog_sso')] #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_INST')|L]#!#! шляхом перемовин себе вичерпали, [target_country.GetAdjectiveWithNoTooltip|l]і посли більше не вірять, що [our_ruler.GetName] піде на компроміс. Слід очікувати, що незабаром [target_country.GetLongNameWithNoTooltip] почн[target_country.Custom('endlong_youtut')] шукати привід для відкритого захоплення [ROOT.GetCountry.Custom('CL_ACC')]."
  flavor_mll.8.a: "Наші відносини досягли точки кипіння!"
  mll_ara_will_likely_pursue_subjugation_tt: "Найімовірніше, влада #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_GEN')|L]#!#! спробує захопити #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! і напряму підкорити країну [target_country.GetAdjectiveWithNoTooltip|l]ій короні"
  flavor_mll.9.title: "Налагодження відносин"
  flavor_mll.9.entry: "Налагодження відносин з Арагоном"
  flavor_mll.9.desc: "Зусиллями #L [target_country.GetAdjective|l]их#! та #L [ROOT.GetCountry.GetAdjective|l]их#! послів кризу між країнами, що наростала, вдалося відвернути. І хоча [target_country.GetNameWithNoTooltip] і надалі не визна[target_country.Custom('end_youtyut')] нашого прагнення незалежности, ми звільнилися від більшої частини фінансових зобов’язань перед сюзереном. Багато хто при дворі вважає, що [our_ruler.GetNameWithNoTooltip] вже [Select_CString(our_ruler.IsFemale, 'здобула', 'здобув')] велику дипломатичну перемогу, хоча дехто з вельмож наполягає, що [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'повинна', 'повинен')] домагатися повної незалежности від [target_country.Custom('CL_GEN')]."
  flavor_mll.9.a: "Криза минула."
  mll_ara_will_not_pursue_hostile_action_tt: "[target_country.GetName] відмов[target_country.Custom('end_etut')]ся від політики силового приєднання #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, водночас [ROOT.GetCountry.GetNameWithNoTooltip] змо[ROOT.GetCountry.Custom('end_gegu')]ть і надалі шукати способів досягти повної незалежности від сюзерена"
  flavor_mll.10.title: "Становлення віцекоролівства"
  flavor_mll.10.entry: "Віцекоролівство [ROOT.GetCountry.GetNameWithNoTooltip]"
  flavor_mll.10.desc: "З відновленням колишніх відносин між #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_INST')|L]#!#! та #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#! [target_country.GetLongNameWithNoTooltip] знову звернув[target_country.Custom('endlong_fem')] свій погляд до #TOOLTIP:AREA,balearics_area,X #L Балеарських островів#!#!. Господарство [ROOT.GetCountry.Custom('CL_GEN')] серйозно потерпіло через #TOOLTIP:CULTUREGROUP,maghrebi_group,X #L магрибські#!#! набіги та наслідки конфлікту [target_country_1.Custom('end_predlog_sso')] #ONCLICK:COUNTRY,[target_country_1.GetKey] #TOOLTIP:COUNTRY,[target_country_1.GetKey],X [target_country_1.Custom('CL_INST')|L]#!#!, і [target_country.GetAdjectiveWithNoTooltip|l]ий двір пропонує надати [ROOT.GetCountry.Custom('longname_ua_wntt_ACC')] статус віцекоролівства, що забезпечить островам подальшу підтримку [target_country.GetAdjectiveWithNoTooltip|l]ої корони."
  flavor_mll.10.a: "Слід використати свій новонабутий статус, щоб посилити становище [ROOT.GetCountry.Custom('CL_GEN')]."
  flavor_mll.10.b: "Наше завдання — захистити середземноморські інтереси [target_country.Custom('CL_GEN')] та [ROOT.GetCountry.Custom('CL_GEN')]."
  flavor_mll.10.b.entry: "Наше завдання — захистити середземноморські інтереси Арагону та Майорки."
  flavor_mll.10.c: "Відмовмося від запропонованого [target_country.Custom('CL_INST')] віцекоролівства."
  flavor_mll.10.c.entry: "Відмовмося від запропонованого Арагоном віцекоролівства."
  flavor_mll.11.title: "[source_of_piracy.GetNameWithNoTooltip] — розсадник піратства"
  flavor_mll.11.entry: "[ShowCultureGroupNameWithNoTooltip('maghrebi_group')] — розсадник піратства"
  flavor_mll.11.desc: "[ROOT.GetCountry.GetLongName] уже давно потерпа[ROOT.GetCountry.Custom('endlong_etyut')] від набігів #TOOLTIP:REGION,maghreb_region,X #L магрибських#!#! корсарів, проте останніми роками становище різко погіршилося, і виною тому [source_of_piracy.GetName]. Обурена [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] вимагає, щоб [our_ruler.GetNameWithNoTooltip] [Select_CString(our_ruler.IsFemale, 'атакувала', 'атакував')] цей розсадник піратства та назавжди [Select_CString(our_ruler.IsFemale, 'покінчила', 'покінчив')] із цією загрозою нашим берегам."
  flavor_mll.11.a: "Час розібратися [source_of_piracy.Custom('end_predlog_sso')] [source_of_piracy.GetAdjectiveWithNoTooltip|l]ими піратами."
  flavor_mll.11.a.entry: "Час розібратися з піратами."
  flavor_mll.11.b: "Щоб покінчити з ними, необхідно захопити [source_of_piracy.GetAdjectiveWithNoTooltip|l]і володіння."
  flavor_mll.11.b.entry: "Щоб покінчити з ними, необхідно захопити їхні володіння."
  flavor_mll.12.title: "Мури Алькудії"
  flavor_mll.12.entry: "$flavor_mll.12.title$"
  flavor_mll.12.desc: "Алькудія, розташована на краю [target_location.Custom('LR_GEN')|l] [target_location.GetName], ось уже ціле століття повсякчас зазнає набігів #TOOLTIP:REGION,maghreb_region,X #L магрибських#!#! корсарів. Знаючи про вразливість цього поселення, [GetCharacter('mll_jacme_ii_mallorca').GetName] свого часу [Select_CString(GetCharacter('mll_jacme_ii_mallorca').IsFemale, 'наказала', 'наказав')] звести нові фортечні мури для захисту від майбутніх нападів. І хоча будівництво досі не завершено, наявні укріплення вже довели свою дієвість. Деякі придворні вельможі вважають, що [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] має звести такі самі мури для захисту #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#! [target_location.GetNameWithNoTooltip]."
  flavor_mll.12.a: "Ми коштом скарбниці зведемо нові укріплення для захисту [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
  flavor_mll.12.a.entry: "Ми коштом скарбниці зведемо нові укріплення для захисту всього Манакора."
  flavor_mll.12.b: "Необхідно завершити зведення мурів Алькудії."
  flavor_mll.12.c: "Будівництво в Алькудії час припинити."
  flavor_mll.13.title: "Свобода від [target_country.Custom('CL_GEN')]"
  flavor_mll.13.entry: "Проголошення незалежности"
  flavor_mll.13.desc: "[our_ruler.GetName] та [ROOT.GetCountry.GetGovernment.GetAdjective|l]ий двір урешті домоглися справжньої незалежности [ROOT.GetCountry.Custom('CL_GEN')] від [target_country.Custom('longname_ua_GEN')]. [target_country.GetAdjectiveWithNoTooltip]а влада була змушена змиритися з відокремленням [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]их володінь, і [target_country.GetCapital.GetName] нам більше не указ. Тепер [ShowScriptedGeographyName('mediterranean_sea_geography')] належить нам!"
  flavor_mll.13.a: "Відтепер [ROOT.GetCountry.GetNameWithNoTooltip] буд[ROOT.GetCountry.Custom('end_etut')] будувати власне майбутнє."
  flavor_mll.14.title: "[our_ruler.GetNameWithNoTooltip] здобуває підтримку університету з [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  flavor_mll.14.entry: "Вчені з Монпельє підтримують наше правління"
  flavor_mll.14.desc: "#TOOLTIP:BUILDING_TYPE,university,X #L Університетські#!#! вчені з [target_location.Custom('LR_GEN')|l] [target_location.GetName] — нашого володіння в континентальній Європі — палко підтримали владу [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ої корони. [our_ruler.GetName] тішиться безмежною довірою цих вчених; їхній внесок у схвалення нового зводу законів «[ShowPolicyName('mll_leges_palatinae')]» зміцнює авторитет нашого монарха та посилює владу [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого двору."
  flavor_mll.14.a: "Ми раді їхній підтримці."
  flavor_mll.14.b: "Завдяки їхній високій оцінці [our_ruler.GetShortNameWithNoTooltip] зможе зміцнити свої політичні позиції."
  flavor_mll.14.b.entry: "Завдяки їхній високій оцінці [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] зможе зміцнити свої політичні позиції."
  flavor_mll.15.title: "Відновлення торгового впливу [ROOT.GetCountry.Custom('CL_GEN')]"
  flavor_mll.15.entry: "Відновлення торгового впливу Майорки"
  flavor_mll.15.desc: "Господарська політика [ROOT.GetCountry.Custom('longname_ua_GEN')] більше не залежить від примх #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_GEN')|L]#!#!, і чимало наших купців із завзяттям відкривають власні підприємства, сподіваючись повернути #L [ROOT.GetCountry.GetAdjective|l]ій#! торгівлі колишній вплив у Середземномор’ї. Зіткнення між #ONCLICK:COUNTRY,[target_country_1.GetKey] #TOOLTIP:COUNTRY,[target_country_1.GetKey],X [target_country_1.Custom('CL_INST')|L]#!#! та [target_country.Custom('CL_INST')] добряче підірвали господарську спроможність [ROOT.GetCountry.Custom('CL_GEN')], але коли [ROOT.GetCountry.GetFlavorRank|l] здобуд[ROOT.GetCountry.Custom('endrank_youtut')] незалежність, [ShowScriptedGeographyName('mediterranean_sea_geography')] знову рахуватиметься з купцями з нашої країни.\n\nДехто при дворі каже, що [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] мають отримати додаткові привілеї — разом зі скасуванням колишніх обмежень, які лишилися з часів [target_country.GetAdjectiveWithNoTooltip|l]ого правління, аби розвиток нашої торгівлі отримав додатковий поштовх. Інші, втім, побоюються, що з посиленням міського стану [ROOT.GetCountry.GetNameWithNoTooltip] ризику[ROOT.GetCountry.Custom('end_etyut')] з часом перетворитися на #TOOLTIP:GOVTYPE,republic,X #L республіку#!#! на зразок #TOOLTIP:REGION,italy_region,X #L італійських#!#!."
  flavor_mll.15.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|U] вірно служать країні та заслуговують на нові привілеї."
  flavor_mll.15.b: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] самостійно займеться цими питаннями."
  flavor_mll.15.c: "Нам варто зосередитися на внутрішніх негараздах."
  mll_a_hub_of_mediterranean_trade.title: "Осередок середземноморської торгівлі"
  mll_a_hub_of_mediterranean_trade.desc: "Війни між #ONCLICK:COUNTRY,[GetCountry('ARA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('ARA').GetKey],X [GetCountry('ARA').Custom('CL_INST')|L]#!#! та #ONCLICK:COUNTRY,[GetCountry('GEN').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GEN').GetKey],X [GetCountry('GEN').Custom('CL_INST')|L]#!#! завдали #L [GetCountry('MLL').GetAdjective|l]им#! торговим шляхам великої шкоди, але зі здобуттям незалежности [GetCountry('MLL').Custom('longname_ua_wntt_GEN')] має змогу вдихнути нове життя в колись прибуткові маршрути. Більш того, з огляду на вигідне географічне розташування Балеарських островів ми маємо чудову нагоду стати провідною торговою державою Середземномор’я."
  mll_a_hub_of_mediterranean_trade.a: "Незабаром [GetCountry('MLL').GetNameWithNoTooltip] буд[GetCountry('MLL').Custom('end_etut')] панувати в Середземному морі."
  mll_exchange_of_montpellier.title: "Передача Монпельє"
  mll_exchange_of_montpellier.desc: "Згідно із заповітом, який [Select_CString(GetCharacter('ara_jacme_i_arago').IsFemale, 'залишила', 'залишив')] [GetCharacter('ara_jacme_i_arago').GetName], землями Монпельє тепер володіє [GetCharacter('mll_jacme_ii_mallorca').GetName], і відтоді вони залишаються найважливішим володінням [GetCountry('MLL').Custom('longname_ua_wntt_GEN')] на континенті. Втім, зважаючи на зростання напруги між [GetCountry('MLL').Custom('CL_INST')] та [GetCountry('ARA').Custom('CL_INST')], є сенс запропонувати цю землю [GetCountry('FRA').Custom('longname_ua_wntt_DAT')] — і в такий спосіб заручитися підтримкою могутньої держави."
  mll_exchange_of_montpellier.a: "Запропонуємо [GetCountry('FRA').Custom('longname_ua_wntt_DAT')] купити Монпельє."
  mll_exchange_of_montpellier.b: "Передамо [GetCountry('FRA').Custom('longname_ua_wntt_DAT')] Монпельє в обмін на гарантії."
  mll_exchange_of_montpellier.c: "[ShowLocationNameWithNoTooltip('montpellier')] — [GetCountry('MLL').GetAdjectiveWithNoTooltip|l]а земля!"
  mll_french_support_for_montpellier_tt: "[GetCountry('FRA').GetName] на 50 років одерж[GetCountry('FRA').Custom('end_itat')] #G +100#! до схвалення будь-якого нашого руху за незалежність."