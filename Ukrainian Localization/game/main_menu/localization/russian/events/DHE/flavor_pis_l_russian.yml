l_russian:
 flavor_pis.1.entry: "$flavor_pis.1.title$"
 flavor_pis.1.title: "Падение [ROOT.GetCountry.Custom('CL_GEN')]"
 flavor_pis.1.desc: "Славные годы [ROOT.GetCountry.Custom('longname_ua_GEN')], некогда грозной и внушительной силы, которой подчинялась #TOOLTIP:REGION,italy_region,X #L Италия#!#!, давно позади. Наше влияние простиралось от #TOOLTIP:REGION,iberia_region,X #L Иберии#!#! до #TOOLTIP:REGION,crescent_region,X #L Плодородного полумесяца#!#!, однако многолетняя блокада [ShowBuildingTypeName('porto_pisano')] в #TOOLTIP:LOCATION,pisa,X #L Пизе#!#! со стороны #L [GetCountry('GEN').GetAdjective|l]ого#! флота оказалась тем самым сокрушительным ударом, который привёл к нашему падению. Кроме того, #L [GetCountry('ARA').GetAdjective|l]ие#! войска отобрали у нас область [ShowAreaName('sardinia_area')].\n\nТеперь [ROOT.GetCountry.GetFlavorRank|l] являет собой прискорбное зрелище: наш когда-то могучий флот — лишь бледное подобие того флота, который ещё не так давно наводил ужас на врагов; теперь же он остался в тени других #TOOLTIP:CULTUREGROUP,italian_group,X #L итальянских#!#! держав. Наших торговцев вытесняют более надёжные соперники, а в [ROOT.GetCountry.Custom('rank_ua_PREP')|l] вовсю разгораются политические дрязги.\n\nНо вместо того чтобы сидеть и смотреть, как нас отодвигают на обочину истории, лучше заняться восстановлением утерянного блеска. Нам предстоит собраться с силами и отомстить виновникам того незавидного положения, в котором мы оказались."
 flavor_pis.1.a: "Пока нами правит [target_character.GetNameWithNoTooltip], мы непобедимы!"
 flavor_pis.1.a.entry: "Мы непобедимы!"
 flavor_pis.2.title: "Падение [target.Custom('CL_GEN')]"
 flavor_pis.2.desc: "Войска #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! одержали очередную громкую победу, захватив #L #TOOLTIP:LOCATIONRANK,[target.Custom('LR_tt')],X [target.Custom('LR_ACC')|l]#!#! [target.GetName]. В их сердцах пылает ярость: ещё свежи воспоминания о разрушении #TOOLTIP:LOCATION,pisa,X #L Пизы#!#! и о вызванных блокадой голодных смертях. Солдаты и командиры собираются стереть [target.Custom('LR_ACC')|l] с лица земли, посыпать пепелище солью и привезти местные богатства в столицу."
 flavor_pis.2.a: "Око за око!"
 flavor_pis.2.b: "Не стоит ровнять это место с землёй."
 pis_allow_upgrade_of_porto_pisano: "[ShowBuildingTypeName('porto_pisano')] в #TOOLTIP:LOCATION,pisa,X #L Пизе#!#! можно улучшить ещё на один уровень"
 flavor_pis.3.entry: "$flavor_pis.3.title$"
 flavor_pis.3.title: "Освобождение Сардинии"
 flavor_pis.3.desc: "Мы получили долгожданную радостную весть: [ShowAreaName('sardinia_area')] снова в наших руках!\n\nСолдаты, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] не могут нарадоваться очередной блестящей победе: они уже предвкушают, как вернутся в край, где когда-то пользовались влиянием и уважением. Многие из них, в своё время вынужденные бежать в другие уголки державы, уже перебираются в [target_location.Custom('LR_ACC')|l] [target_location.GetName], намереваясь сделать его областной столицей.\n\nМнений о том, как лучше застраивать #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_ACC')|l]#!#!, столько же, сколько и самих жителей, но всех объединяет одно: забота о переселенцах, которым предстоит вернуть [ShowBuildingTypeName('porto_pisano')] былое благосостояние. Однако есть и те, кто считает, что не стоит уделять всё внимание только одной области, поскольку в нашей помощи нуждается весь остров целиком."
 flavor_pis.3.a: "[target_location.GetNameWithNoTooltip] станет жемчужиной Сардинии."
 flavor_pis.3.a.entry: "Это место станет жемчужиной Сардинии."
 flavor_pis.3.b: "Под нашей властью будет процветать весь остров."
 pis_all_of_sardinia_gains_development_and_prosperity: "Каждый принадлежащий нам [Concept('location', 'район')|e] в области [ShowAreaName('sardinia_area')] получит [ShowNamedValue('development_mild_bonus')|+=2%] к [Concept('development', 'развитию')|e] и [ShowNamedValue('prosperity_mild_bonus')|+=2%] к [Concept('prosperity', 'процветанию')|e]"
 flavor_pis.4.entry: "$flavor_pis.4.title$"
 flavor_pis.4.title: "Расширение Пизанской башни"
 flavor_pis.4.desc: "[ShowWorkOfArtName('leaning_tower_of_pisa')|U] достроена, однако [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] не собирается на этом останавливаться и считает, что над внутренними помещениями тоже стоит поработать.\n\n[target_character.GetName] хочет украсить колокольню готическими элементами, элегантно соединив их с уже существующими украшениями в романском стиле. На это, разумеется, потребуются деньги, о чём хорошо известно [ROOT.GetCountry.Custom('rank_ua_DAT')|l]. Известно также и то, что подобный проект непременно возвысит наш престиж в #TOOLTIP:REGION,italy_region,X #L Италии#!#!."
 flavor_pis.4.a: "Расширим башню."
 flavor_pis.4.b: "Башня уже построена, всё остальное — лишнее."
 flavor_pis.5.entry: "$flavor_pis.5.title$"
 flavor_pis.5.title: "Смена курса"
 flavor_pis.5.desc: "Стремление вновь окутать себя славой, которая простиралась бы от одного берега Средиземноморья до другого, сегодня уже не так сильно, как раньше, однако нас по-прежнему манит жажда власти над #TOOLTIP:REGION,italy_region,X #L Италией#!#!. В этот раз мы сделаем ставку не на купцов и мореходов, а на военные походы: всё имеющееся в нашем распоряжении богатство мы пустим на то, чтобы нанять многочисленных кондотьеров и приказать им завоевать близлежащие города.\n\nТакой замысел не нашёл расположения у опытных государственных мужей — им больше по душе перспектива перестроить #TOOLTIP:BUILDING_TYPE,porto_pisano,X #L Порто-Пизано#!#! — однако те, в ком играет горячая кровь, выступают за политику расширения — только так, по их мнению, мы сможем затмить соперничающие с нами города-государства."
 flavor_pis.5.a: "Вперёд, к завоеваниям!"
 flavor_pis.5.b: "Что нам проку от войны? Лучше будем налаживать торговлю."
 pis_gain_casus_belli_on_every_neighbor_country_in_italy: "Если у нас нет [Concept('casus_belli', 'повода для войны')|e], мы получим [Concept('casus_belli', 'повод')|e] «[ShowCasusBelliName('cb_conquer_province')]» в отношении каждой [Concept('capital', 'столичной')|e] [Concept('province', 'провинции')|e] соседних [Concept('country', 'держав')|e]"
 flavor_pis.6.title: "Джоко-дель-Понте"
 flavor_pis.6.desc.a: "На состоявшемся на днях в #TOOLTIP:LOCATION,pisa,X #L Пизе#!#! праздновании Джоко-дель-Понте объявилась весьма любопытная фигура по имени [target_character.GetName]: оказалось, что [Select_CString(target_character.IsFemale, 'эта женщина', 'этот человек')] — превосходный командир, и под [Select_CString(target_character.IsFemale, 'её', 'его')] началом участвовавшие в состязании солдаты успешно протолкали повозку по мосту Понте-ди-Меццо. [target_character.GetName] немедленно [Select_CString(target_character.IsFemale, 'завоевала', 'завоевал')] расположение народа, проявив задатки прирождённого руководителя."
 flavor_pis.6.desc.b: "Жители #TOOLTIP:LOCATION,pisa,X #L Пизы#!#! ликуют: в их краях недавно прошёл праздник Джоко-дель-Понте. Шествие вдоль реки Арно оказалось незабываемым зрелищем — посмотреть на него стянулись граждане всяких поприщ и сословий, поскольку ничто так не объединяет народ #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! (конкретно — самых влиятельных его представителей), как ежегодное традиционное празднество, во время которого можно позабыть об общественных барьерах."
 flavor_pis.6.desc.c: "На ежегодное празднество Джоко-дель-Понте в #TOOLTIP:LOCATION,pisa,X #L Пизе#!#! съехались зрители со всей #TOOLTIP:CONTINENT,europe,X #L Европы#!#!. Зрелище оказалось впечатляющим: шествие по реке Арно, напряжённое состязание между солдатами... Многие из наблюдавших за праздником вернулись на родину с рассказами о том, насколько весёлой бывает жизнь в #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!."
 flavor_pis.6.a: "Порадуемся стабильности, пусть даже она не навсегда."
 flavor_pis.6.b: "О празднике узнают в каждом краю мира."
 flavor_pis.6.c: "Пусть [target_character.GetNameWithNoTooltip] получит повышение."
 flavor_pis.6.c.entry: "Пусть этот персонаж получит повышение."
 flavor_pis.6.d: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] не потерпит, чтобы #L [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ой#! державе служил кто попало."
 flavor_pis.6.d.entry: "Мы не потерпим, чтобы нашей державе служил кто попало."
 flavor_pis.1000.entry: "$flavor_pis.1000.title$"
 flavor_pis.1000.title: "Новая власть"
 flavor_pis.1000.desc: "В #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! начались тяжёлые времена.\n\nДержава погрязла в долгах, экономика идёт на спад, а отсутствие уверенности в завтрашнем дне всё больше заставляет народ сомневаться, что [target_character.GetName] сможет удержать шаткое правительство от распада. Мы отчаянно нуждаемся в иностранной помощи. Вместо того чтобы сидеть сложа руки, богатые и влиятельные граждане начали подыскивать нового кандидата на управление [ROOT.GetCountry.Custom('rank_ua_INST')|l]. Некоторые считают, что династия [target_country.GetGovernment.GetRuler.GetDynasty.GetName] из #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! сможет поддержать нас экономически. Другим больше по душе семейство [target_country2.GetGovernment.GetRuler.GetDynasty.GetName] из #ONCLICK:COUNTRY,[target_country2.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country2.Custom('CL_tt')],X [target_country2.Custom('CL_GEN')|L]#!#!, третьи же и вовсе утверждают, что нет более подходящего выбора, чем род [target_country3.GetGovernment.GetRuler.GetDynasty.GetName] из #ONCLICK:COUNTRY,[target_country3.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country3.Custom('CL_tt')],X [target_country3.Custom('CL_GEN')|L]#!#!, и что мы окажемся полными дураками, если не пригласим его править нами."
 flavor_pis.1000.a: "Пошлём письмо в [target_country.Custom('CL_ACC')]."
 flavor_pis.1000.a.entry: "Пошлём им письмо."
 pis_offer_rulership_to_country1: "Мы предложим #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_DAT')|L]#!#! править нами. Если они согласятся, произойдёт следующее:"
 pis_a_member_of_target_country_dynasty_becomes_ruler: "Выходец из [Concept('dynasty', 'династии')|e] [target_country.GetGovernment.GetRuler.GetDynasty.GetName] станет нашим [Concept('ruler', 'правителем')|e]"
 flavor_pis.1000.b: "Лучше будет выбрать [target_country2.Custom('CL_ACC')]."
 flavor_pis.1000.b.entry: "Лучше будет выбрать другую державу."
 pis_offer_rulership_to_country2: "Мы предложим #ONCLICK:COUNTRY,[target_country2.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country2.Custom('CL_tt')],X [target_country2.Custom('CL_DAT')|L]#!#! править нами. Если они согласятся, произойдёт следующее:"
 pis_a_member_of_target_country2_dynasty_becomes_ruler: "Выходец из [Concept('dynasty', 'династии')|e] [target_country2.GetGovernment.GetRuler.GetDynasty.GetName] станет нашим [Concept('ruler', 'правителем')|e]"
 flavor_pis.1000.c: "Нет никого более подходящего, чем правители из [target_country3.Custom('CL_GEN')]."
 flavor_pis.1000.c.entry: "Нет никого более подходящего, чем правители из этой державы."
 pis_offer_rulership_to_country3: "Мы предложим #ONCLICK:COUNTRY,[target_country3.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country3.Custom('CL_tt')],X [target_country3.Custom('CL_DAT')|L]#!#! править нами. Если они согласятся, произойдёт следующее:"
 pis_a_member_of_target_country3_dynasty_becomes_ruler: "Выходец из [Concept('dynasty', 'династии')|e] [target_country3.GetGovernment.GetRuler.GetDynasty.GetName] станет нашим [Concept('ruler', 'правителем')|e]"
 flavor_pis.1000.d: "Мы не станем продавать [ROOT.GetCountry.Custom('rank_ua_ACC')|l] соперникам."
 flavor_pis.1001.title: "$flavor_pis.1000.title$"
 flavor_pis.1001.desc: "Политические потрясения в #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_PREP')|L]#!#! вот-вот достигнут кульминации: [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] принимает у себя послов — представителей высшего общества этой державы, обратившихся к нам за помощью. Суть их просьбы сводится к следующему: пусть [ROOT.GetCountry.GetGovernment.GetRuler.GetName] поспособствует тому, чтобы на престол [from_country.Custom('rank_ua_GEN')|l] [Select_CString(target_character.IsFemale, 'взошла', 'взошёл')] [target_character.GetName]; кроме того, [Select_CString(target_character.IsFemale, 'ей', 'ему')] потребуется финансовая помощь."
 flavor_pis.1001.a: "Для династии [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetNameWithNoTooltip] такая обстановка — отличная возможность нарастить влияние."
 flavor_pis.1001.a.entry: "Отличная возможность нарастить влияние."
 flavor_pis.1001.b: "Подобные связи станут для нас лишним грузом."
 flavor_pis.1100.entry: "$flavor_pis.1100.title$"
 flavor_pis.1100.title: "In Supremae Dignitatis"
 flavor_pis.1100.desc: "#TOOLTIP:LOCATION,pisa,X #L Пизанские#!#! учёные пользуются уважением во всей #TOOLTIP:REGION,italy_region,X #L Италии#!#!, однако в #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! до сих пор нет официального учебного заведения. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|U] предложили следующее: пусть [target_character.GetName] подаст прошение, чтобы [target_character2.GetName] [Select_CString(target_character2.IsFemale, 'признала', 'признал')] Пизу «Studium Generale» («домом общего обучения») — в таком случае университеты начнут процветать как никогда."
 flavor_pis.1100.a: "Пошлём делегацию, пусть [GetCountry('PAP').GetCapital.GetNameWithNoTooltip] рассмотрит наше прошение."
 flavor_pis.1100.a.entry: "Пошлём делегацию, пусть Рим рассмотрит наше прошение."
 flavor_pis.1100.b: "Не станем вмешиваться в [GetCountry('PAP').GetAdjectiveWithNoTooltip|l]ую политику."
 flavor_pis.1100.b.entry: "Не станем вмешиваться в римскую политику."
 flavor_pis.1101.title: "$flavor_pis.1100.title$"
 flavor_pis.1101.desc: "[target_character.GetName] из #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_GEN')|L]#!#! [Select_CString(target_character.IsFemale, 'послала', 'послал')] к нам делегацию. Послы растекаются перед нами пылкими речами о том, насколько уважаемы учёные мужи, получившие образование в #TOOLTIP:LOCATION,pisa,X #L Пизе#!#!, и о том, как много жителей [from_country.Custom('rank_ua_GEN')|l] хотят пойти по их стопам. От нас просят дать официальное одобрение со стороны #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! и разрешить построить образовательное учреждение на территории [from_country.Custom('rank_ua_GEN')|l]."
 flavor_pis.1101.a: "Одобряем."
 flavor_pis.1101.b: "В Италии много где можно учиться."