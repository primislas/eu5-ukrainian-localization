l_russian:
  flavor_byz_ven.1.title: "Лихо"
  flavor_byz_ven.1.entry: "$flavor_byz_ven.1.title$"
  flavor_byz_ven.1.desc: "Поки наша країна переживає #TOOLTIP:DISASTER_TYPE,byzantine_succession_crisis,X #L [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]ий спадковий розбрат#!#!, її скарбниця стрімко порожніє, а становище стає дедалі безвихіднішим на тлі тривалих конфліктів. Якщо внутрішні чвари не припиняться, саме існування [origin_country.Custom('longname_ua_GEN')] потрапить під загрозу.\n\nОпинившись у такому скрутному становищі, придворні пропонують раніше немислиме. Витвір «[target_woa.GetName]» буде закладено як забезпечення позики в однієї з торгових республік."
  flavor_byz_ven.1.a: "Відчайдушні часи вимагають таких же відчайдушних заходів."
  flavor_byz_ven.1.b: "Це обурливо."
  BYZ_crown_jewels_tt: "Якщо [THIS.GetCountry.GetName] погод[THIS.GetCountry.Custom('end_ytyat')]ся, то нам нададуть [Concept('loan', 'позику')|e] в розмірі [SCOPE.GetLocalVariable('loan_size').GetValue|+=] [gold_i|e], а ми отримаємо [Concept('modifier', 'модифікатор')|e] #TOOLTIP:STATIC_MODIFIER,BYZ_lacking_jewels,X #V #L «Регалії в заставі»#!#!#!. [Concept('work_of_art', 'Витвір')|e] «[target_woa.GetName]» має бути повернено, щоб модифікатор перестав діяти"
  flavor_byz_ven.2.title: "Застава [origin_country.GetAdjectiveWithNoTooltip|l]их регалій"
  flavor_byz_ven.2.entry: "Застава візантійських регалій"
  flavor_byz_ven.2.desc: "[origin_country.GetLongName] перебува[origin_country.Custom('endlong_yeyut')] в украй скрутному становищі. В умовах #TOOLTIP:DISASTER_TYPE,byzantine_succession_crisis,X #L [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]ого спадкового розбрату#!#! скарбниця країни тане на очах і гостро потребує додаткових коштів. Ситуація настільки плачевна, що вони звернулися до нас із доволі несподіваною пропозицією. Вони пропонують нам [Concept('work_of_art', 'витвір')|e] «[target_woa.GetName]» під заставу. Хтось вважатиме такий вчинок знаком довіри... а хтось — актом відчаю."
  flavor_byz_ven.2.a: "Непогане поповнення нашої колекції."
  flavor_byz_ven.2.b: "Нехай [origin_country.GetFlavorRank|l] згин[origin_country.Custom('endrank_youtut')]."
  flavor_byz_ven.2.b.entry: "Нехай ця негідна країна згине!"
  pawning_of_crown_jewels: "Застава регалій"
  LOAN_SHORT_NAME_pawning_of_crown_jewels_L: "$pawning_of_crown_jewels$"
  LOAN_SHORT_NAME_pawning_of_crown_jewels_B: "$pawning_of_crown_jewels$"
  LOAN_TOOLTIP_pawning_of_crown_jewels: "Сторони уклали угоду, за якою позикодавець надає позику, а позичальник за отримані кошти надає забезпечення — $byzantine_crown_jewels$. Після виплати позики в повному обсязі закладені коштовності мають бути повернені — принаймні, в теорії."
  LOAN_TITLE_pawning_of_crown_jewels: "$pawning_of_crown_jewels$"
  LOAN_NAME_pawning_of_crown_jewels_L: "$pawning_of_crown_jewels$"
  LOAN_NAME_pawning_of_crown_jewels_B: "$pawning_of_crown_jewels$"
  flavor_byz_ven.3.title: "Позику виплачено"
  flavor_byz_ven.3.entry: "$flavor_byz_ven.3.title$"
  flavor_byz_ven.3.desc: "Позику щойно було виплачено. Витвір «[target_woa.GetName]» має бути повернено, цього вимага[origin_country.Custom('endlong_yeyut')] [origin_country.GetLongName]. За умовами угоди ми зобов'язані це зробити, однак при цьому ми позбудемося останнього важеля тиску на них.\n\nЗрештою, якщо ми не повернемо коштовності, навряд чи станеться щось по-справжньому серйозне..."
  flavor_byz_ven.3.a: "Ми не можемо ризикувати репутацією."
  flavor_byz_ven.3.b: "А з іншого боку — чому б і ні? Чому б і не залишити собі ці коштовності?"
  flavor_byz_ven.4.title: "Регалії повернено"
  flavor_byz_ven.4.desc: "Згідно з домовленістю ми виплатили нашу позику [target_country.Custom('longname_ua_DAT')]. [Concept('work_of_art', 'Витвір')|e] «[target_woa.GetName]» було повернено #ONCLICK:COUNTRY,[origin_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[origin_country.Custom('CL_tt')],X [origin_country.Custom('CL_DAT')|L]#!#! до [target_location.Custom('LR_ACC')|l] [target_location.GetName].\n\nБуло приємно мати справу зі світлішою #TOOLTIP:GOVERNMENT_REFORM,merchant_republic,X #L купецькою республікою#!#!."
  flavor_byz_ven.4.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  flavor_byz_ven.4.a.entry: "$common_string_brilliant$"
  flavor_byz_ven.5.title: "Угоду порушено"
  flavor_byz_ven.5.desc: "Попри те, що ми виплатили позику в рамках домовленості, #L [target_country.GetAdjective|l]а#! сторона проігнорувала нашу вимогу. Витвір «[target_woa.GetName]» не було повернено. Інакше як грабунком подібну поведінку не назвати!\n\nВони пізнають гнів [origin_country.Custom('longname_ua_GEN')]..."
  flavor_byz_ven.5.a: "Не слід було укладати угоду з гаспидом."
  flavor_byz_ven.6.title: "$flavor_byz_ven.4.title$"
  flavor_byz_ven.6.desc: "[target_army.GetName] — герої. Їм вдалося повернути [Concept('work_of_art', 'витвір')|e] «[target_woa.GetName]» до #ONCLICK:COUNTRY,[target.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target.Custom('CL_tt')],X [target.Custom('CL_GEN')|L]#!#!, де їх тепло вітали при #L [ROOT.GetCountry.GetAdjective|l]ому#! дворі. Відтепер жоден ворог не зможе використовувати коштовності проти нас!"
  flavor_byz_ven.6.desc_recovered: "The [target_woa.GetName] are once more in our possession, recovered along with [target.GetName]. Our property has been brought back to where it belongs, warmly received by the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. No longer can our enemies use these jewels to leverage their will upon us!"
  flavor_byz_ven.6.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  flavor_byz_ven.6.a.entry: "$common_string_brilliant$"
  flavor_byz_ven.7.title: "[target_woa.GetNameWithNoTooltip]"
  flavor_byz_ven.7.desc: "Нещодавнє захоплення [location.Custom('LR_GEN')|l] [location.GetName] стало великим успіхом для #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. [target_army.GetName] — ці наші війська ретельно «оглянули» територію. Тепер у них в руках [Concept('work_of_art', 'витвір')|e] «[target_woa.GetName]», який має велику цінність для наших союзників [origin_country.Custom('preposition_uv')] #ONCLICK:COUNTRY,[origin_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[origin_country.Custom('CL_tt')],X [origin_country.Custom('CL_PREP')|L]#!#!. Ми могли б повернути їм ці коштовності... але хіба ми не заслужили свою частку здобичі?"
  flavor_byz_ven.7.a: "Ми все повернемо нашим дорогим союзникам."
  flavor_byz_ven.7.b: "Все це по праву належить нам! Ми це чесно вкрали!"
  flavor_byz_ven.8.title: "Коштовності вкрадено!"
  flavor_byz_ven.8.desc: "До нас дійшли звістки про видатне роззявство наших позикодавців! [Concept('work_of_art', 'Витвір')|e] «[target_woa.GetName]» перебував у них у заставі, і вони дозволили його вкрасти просто з-під носа. Ми щиро сподіваємося, що вони зуміють повернути наше майно. В іншому випадку нам доведеться самим забрати його у #ONCLICK:COUNTRY,[target.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target.Custom('CL_tt')],X [target.Custom('CL_GEN')|L]#!#!..."
  flavor_byz_ven.8.a: "Набивати свої скрині золотом — це все, що вони вміють?"
  byz_woa_was_moved: "[Concept('work_of_art', 'Витвір')|e] «[target_woa.GetName]» перевезли до #ONCLICK:COUNTRY,[target.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target.Custom('CL_tt')],X [target.Custom('CL_GEN')|L]#!#!"
  flavor_byz_ven.9.title: "A Deal is Struck"
  flavor_byz_ven.9.entry: "$flavor_byz_ven.9.title$"
  flavor_byz_ven.9.desc: "Our envoys have returned from [target_country.GetName] with most welcome news: the [target_country.GetAdjective] merchants have agreed to our offer. In exchange for the [target_woa.GetName], a loan has been extended to us, giving our treasury the breathing room it so desperately needed. Let us make the most of this reprieve."
  flavor_byz_ven.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  flavor_byz_ven.9.a.entry: "$common_string_brilliant$"
  flavor_byz_ven.10.title: "Refused by the Serenissima"
  flavor_byz_ven.10.entry: "$flavor_byz_ven.10.title$"
  flavor_byz_ven.10.desc: "Our envoys have returned empty-handed. The [target_country.GetLongName] has refused our offer, unwilling to provide a loan even with the [target_woa.GetName] as collateral. The insult stings almost as much as the blow to our finances. We must seek other means to weather this crisis."
  flavor_byz_ven.10.a: "So be it."
  flavor_byz_ven.11.title: "Втрата застави"
  flavor_byz_ven.11.entry: "$flavor_byz_ven.11.title$"
  flavor_byz_ven.11.desc: "Наша скарбниця спорожніла. Серед зобов’язань, розірваних унаслідок фінансового краху, виявилася позика, яку ми надали [origin_country.Custom('longname_ua_DAT')]. [target_woa.GetName] — цей витвір слугував заставою. Тепер контракт розірвано, і безцінні скарби, а з ним і важелі впливу, повертаються до [origin_country.Custom('CL_GEN')]."
  flavor_byz_ven.11.a: "Ще один цвях у кришку нашої домовини."
  flavor_byz_ven.12.title: "Падіння Венеції"
  flavor_byz_ven.12.entry: "$flavor_byz_ven.12.title$"
  flavor_byz_ven.12.desc: "До нашого двору долетіла звістка з лагуни. [target_country.GetLongName] оголоси[target_country.Custom('endlong_vlaloly')] себе банкрутом, і скоро всі багатства Сереніссіми перейдуть позикодавцям. Скориставшись метушнею, влада [target_country.Custom('CL_GEN')] повернула заставу. [target_woa.GetName] — ним виявився цей витвір. Контракт розірвано, і скарби знову в нас у руках."
  flavor_byz_ven.12.a: "Нас врятувало саме провидіння."
  flavor_byz_ven.13.title: "Банкрутство та конфіскація"
  flavor_byz_ven.13.entry: "$flavor_byz_ven.13.title$"
  flavor_byz_ven.13.desc: "Наша скарбниця порожня, і ми не можемо сплачувати борги. Позика, яку ми взяли в [target_country.Custom('longname_ua_GEN')], прострочена. [target_woa.GetName] — цей витвір слугував заставою під час укладання угоди. У межах угоди наші скарби перейдуть [target_country.Custom('CL_DAT')], і весь християнський світ стане свідком нашої ганьби."
  flavor_byz_ven.13.a: "Ми втратили і гроші, і честь."
  flavor_byz_ven.14.title: "Банкрутство позичальника"
  flavor_byz_ven.14.entry: "$flavor_byz_ven.14.title$"
  flavor_byz_ven.14.desc: "До нашого двору дійшли тривожні звістки з [origin_country.Custom('longname_ua_GEN')]: ця країна відмовилася від сплати боргів та оголосила себе банкрутом. [target_woa.GetName] — витвір, який ми прийняли як заставу, — залишається в нас. Він стане символом розсудливості та ще однією окрасою Сереніссіми."
  flavor_byz_ven.14.a: "У них зменшилося, у нас прибуло."
  flavor_byz_ven.15.title: "Боротьба проти [GetCountry('GEN').GetAdjectiveWithNoTooltip|l]ої експансії"
  flavor_byz_ven.15.entry: "Боротьба проти генуезької експансії"
  flavor_byz_ven.15.desc: "[GetCountry('GEN').GetName] напа[GetCountry('GEN').Custom('end_vlaloly')] на [GetCountry('BYZ').Custom('longname_ua_ACC')] та захопи[GetCountry('GEN').Custom('end_vlaloly')] #TOOLTIP:LOCATION,chios,X #L Хіос#!#! та сусідні острови, що дуже стривожило купців лагуни. [ROOT.GetCountry.GetFlavorRank] не терп[GetCountry('GEN').Custom('end_ytlyat')] того, щоб [GetCountry('GEN').GetName] встанови[GetCountry('GEN').Custom('end_vlaloly')] контроль над #TOOLTIP:AREA,aegean_sea_area,X #L Егейським морем#!#!. Крім того, [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]а країна — наш природний союзник.\n\nЧи повинні ми простягнути руку допомоги [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]му двору?"
  flavor_byz_ven.15.a: "Відправимо послів із пропозицією укласти пакт про співпрацю."
  flavor_byz_ven.15.b: "У нас свої інтереси."
  flavor_byz_ven.16.title: "[GetCountry('VEN').GetAdjectiveWithNoTooltip]а пропозиція"
  flavor_byz_ven.16.entry: "Ініціатива Венеції"
  flavor_byz_ven.16.desc: "Посли з [GetCountry('VEN').Custom('longname_ua_GEN')] прибули до двору із заманливою пропозицією: вони хочуть об’єднатися проти [GetCountry('GEN').Custom('longname_ua_GEN')], чиї торговельні флоти почали поводитися надто зухвало в #TOOLTIP:AREA,aegean_sea_area,X #L Егейському морі#!#! після захоплення #TOOLTIP:LOCATION,chios,X #L Хіоса#!#!.\n\nХоча наші відносини [GetCountry('VEN').Custom('preposition_zzi')] [GetCountry('VEN').Custom('CL_INST')] не завжди складалися гладко, ми будемо тільки раді знайти союзника в боротьбі [GetCountry('GEN').Custom('preposition_zzi')] [GetCountry('GEN').GetAdjectiveWithNoTooltip|l]ими завойовниками."
  flavor_byz_ven.16.a: "Ворог нашого ворога — наш друг."
  flavor_byz_ven.16.b: "Латинянам довіряти не можна."