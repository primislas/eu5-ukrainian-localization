l_russian:
  flavor_byz_ven.1.title: "Лихо"
  flavor_byz_ven.1.entry: "$flavor_byz_ven.1.title$"
  flavor_byz_ven.1.desc: "Поки наша країна переживає #TOOLTIP:DISASTER_TYPE,byzantine_succession_crisis,X #L [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]ий спадковий розбрат#!#!, її скарбниця стрімко порожніє, а становище стає дедалі безвихіднішим на тлі тривалих конфліктів. Якщо внутрішні чвари не припиняться, саме існування [origin_country.Custom('longname_ua_GEN')] потрапить під загрозу.\n\nОпинившись у такому скрутному становищі, придворні пропонують раніше немислиме. Витвір «[target_woa.GetName]» буде закладено як забезпечення позики в однієї з торгових республік."
  flavor_byz_ven.1.a: "Відчайдушні часи вимагають таких же відчайдушних заходів."
  flavor_byz_ven.1.b: "Це обурливо."
  BYZ_crown_jewels_tt: "Якщо [THIS.GetCountry.GetName] погод[THIS.GetCountry.Custom('end_ityat')]ся, то нада[THIS.GetCountry.Custom('end_ityat')] нам [Concept('loan', 'позику')|e] в розмірі [SCOPE.GetLocalVariable('loan_size').GetValue|+=] [gold_i|e], а ми отримаємо [Concept('modifier', 'модифікатор')|e] #TOOLTIP:STATIC_MODIFIER,BYZ_lacking_jewels,X #V #L «Регалії в заставі»#!#!#!. [Concept('work_of_art', 'Витвір')|e] «[target_woa.GetName]» має бути повернено, щоб модифікатор перестав діяти"
  flavor_byz_ven.2.title: "Застава [origin_country.GetAdjectiveWithNoTooltip|l]их регалій"
  flavor_byz_ven.2.entry: "Pawning the $BYZ_ADJ$ Crown Jewels"
  flavor_byz_ven.2.desc: "[origin_country.GetLongName] перебува[origin_country.Custom('endlong_ityat')] в украй скрутному становищі. В умовах #TOOLTIP:DISASTER_TYPE,byzantine_succession_crisis,X #L [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]ого спадкового розбрату#!#! скарбниця країни тане на очах і гостро потребує додаткових коштів. Ситуація настільки плачевна, що вони звернулися до нас із доволі несподіваною пропозицією. Вони пропонують нам [Concept('work_of_art', 'витвір')|e] «[target_woa.GetName]» під заставу. Хтось вважатиме такий вчинок знаком довіри... а хтось — актом відчаю."
  flavor_byz_ven.2.a: "Непогане поповнення нашої колекції."
  flavor_byz_ven.2.b: "Нехай [origin_country.GetFlavorRank|l] згин[origin_country.Custom('endrank_youtut')]."
  flavor_byz_ven.2.b.entry: "Нехай ця негідна країна згине!"
  pawning_of_crown_jewels: "Застава регалій"
  LOAN_SHORT_NAME_pawning_of_crown_jewels_L: "$pawning_of_crown_jewels$"
  LOAN_SHORT_NAME_pawning_of_crown_jewels_B: "$pawning_of_crown_jewels$"
  LOAN_TOOLTIP_pawning_of_crown_jewels: "Сторони уклали угоду, за якою позикодавець надає позику, а позичальник за отримані кошти надає забезпечення — $byzantine_crown_jewels$. Після виплати позики в повному обсязі закладені коштовності мають бути повернені — принаймні, в теорії."
  LOAN_TITLE_pawning_of_crown_jewels: "$pawning_of_crown_jewels$"
  LOAN_NAME_pawning_of_crown_jewels_L: "$pawning_of_crown_jewels$"
  LOAN_NAME_pawning_of_crown_jewels_B: "$pawning_of_crown_jewels$"
  flavor_byz_ven.3.title: "Позику виплачено"
  flavor_byz_ven.3.entry: "$flavor_byz_ven.3.title$"
  flavor_byz_ven.3.desc: "Позику щойно було виплачено. Витвір «[target_woa.GetName]» має бути повернено, цього вимага[origin_country.Custom('endlong_etyut')] [origin_country.GetLongName]. За умовами угоди ми зобов'язані це зробити, однак при цьому ми позбудемося останнього важеля тиску на них.\n\nЗрештою, якщо ми не повернемо коштовності, навряд чи станеться щось по-справжньому серйозне..."
  flavor_byz_ven.3.a: "Ми не можемо ризикувати репутацією."
  flavor_byz_ven.3.b: "А з іншого боку — чому б і ні? Чому б і не залишити собі ці коштовності?"
  flavor_byz_ven.4.title: "Регалії повернено"
  flavor_byz_ven.4.desc: "Згідно з домовленістю ми виплатили нашу позику [target_country.Custom('longname_ua_DAT')]. [Concept('work_of_art', 'Витвір')|e] «[target_woa.GetName]» було повернено #ONCLICK:COUNTRY,[origin_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[origin_country.Custom('CL_tt')],X [origin_country.Custom('CL_DAT')|L]#!#! до [target_location.Custom('LR_ACC')|l] [target_location.GetName].\n\nБуло приємно мати справу зі світлішою #TOOLTIP:GOVERNMENT_REFORM,merchant_republic,X #L купецькою республікою#!#!."
  flavor_byz_ven.4.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  flavor_byz_ven.4.a.entry: "$common_string_brilliant$"
  flavor_byz_ven.5.title: "Угоду порушено"
  flavor_byz_ven.5.desc: "Попри те, що ми виплатили позику в рамках домовленості, #L [target_country.GetAdjective|l]а#! сторона проігнорувала нашу вимогу. Витвір «[target_woa.GetName]» не було повернено. Інакше як грабунком подібну поведінку не назвати!\n\nВони пізнають гнів [origin_country.Custom('longname_ua_GEN')]..."
  flavor_byz_ven.5.a: "Не слід було укладати угоду з гаспидом."
  flavor_byz_ven.6.title: "$flavor_byz_ven.4.title$"
  flavor_byz_ven.6.desc: "[target_army.GetName] — герої. Їм вдалося повернути [Concept('work_of_art', 'витвір')|e] «[target_woa.GetName]» [target.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[target.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target.Custom('CL_tt')],X [target.Custom('CL_ACC')|L]#!#!, де їх тепло вітали при #L [ROOT.GetCountry.GetAdjective|l]ому#! дворі. Відтепер жоден ворог не зможе використовувати коштовності проти нас!"
  flavor_byz_ven.6.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  flavor_byz_ven.6.a.entry: "$common_string_brilliant$"
  flavor_byz_ven.7.title: "[target_woa.GetNameWithNoTooltip]"
  flavor_byz_ven.7.desc: "Нещодавнє захоплення [location.Custom('LR_GEN')|l] [location.GetName] стало великим успіхом для #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. [target_army.GetName] — ці наші війська ретельно «оглянули» територію. Тепер у них в руках [Concept('work_of_art', 'витвір')|e] «[target_woa.GetName]», який має велику цінність для наших союзників [origin_country.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[origin_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[origin_country.Custom('CL_tt')],X [origin_country.Custom('CL_PREP')|L]#!#!. Ми могли б повернути їм ці коштовності... але хіба ми не заслужили свою частку здобичі?"
  flavor_byz_ven.7.a: "Ми все повернемо нашим дорогим союзникам."
  flavor_byz_ven.7.b: "Все це по праву належить нам! Ми це чесно вкрали!"
  flavor_byz_ven.8.title: "Коштовності вкрадено!"
  flavor_byz_ven.8.desc: "До нас дійшли звістки про видатне роззявство наших позикодавців! [Concept('work_of_art', 'Витвір')|e] «[target_woa.GetName]» перебував у них у заставі, і вони дозволили його вкрасти просто з-під носа. Ми щиро сподіваємося, що вони зуміють повернути наше майно. В іншому випадку нам доведеться самим забрати його у #ONCLICK:COUNTRY,[target.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target.Custom('CL_tt')],X [target.Custom('CL_GEN')|L]#!#!..."
  flavor_byz_ven.8.a: "Набивати свої скрині золотом — це все, що вони вміють?"
  byz_woa_was_moved: "[Concept('work_of_art', 'Витвір')|e] «[target_woa.GetName]» перевезли [target.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[target.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target.Custom('CL_tt')],X [target.Custom('CL_ACC')|L]#!#!"