l_russian:
  flavor_luc.1.entry: "$flavor_luc.1.title$"
  flavor_luc.1.title: "Виробництво шовку в Луцці"
  flavor_luc.1.desc: "#TOOLTIP:GOODS,silk,X #L Шовк#!#! — одна з найцінніших рідкісних речей у #TOOLTIP:CONTINENT,europe,X #L Європі#!#!; з цієї неймовірно дорогої та якісної матерії численн[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] волі[ROOT.GetCountry.Custom('nobles_yeyut')] шити собі одяг. [ShowLocationName('lucca')] готується покривати їхні потреби: тут вже розводять шовкопрядів і навіть діє молода шовкова промисловість, хоча виробництво ще не вийшло на достатні рівні. І [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l], і [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] погоджу[ROOT.GetCountry.Custom('nobles_yetsayutsa')], що інвестиції у виробництво шовку допоможуть нам наростити випуск #TOOLTIP:GOODS,fine_cloth,X #L шовкових тканин#!#!, і тоді ми затьмаримо будь-які інші #TOOLTIP:REGION,italy_region,X #L італійські#!#! міста, які насміляться з нами змагатися."
  flavor_luc.1.a: "Вкладімо гроші в розведення шовкопрядів."
  flavor_luc.1.b: "Вони бажають заробити? Нехай женуться за прибутком самі."
  flavor_luc.2.entry: "$flavor_luc.2.title$"
  flavor_luc.2.title: "Торгівля тонким шовком у Луцці"
  flavor_luc.2.desc: "[ShowLocationName('lucca')] може похвалитися добре розвиненим виробництвом #TOOLTIP:GOODS,fine_cloth,X #L тонкого шовку#!#!, і це — не порожні слова: в #TOOLTIP:REGION,italy_region,X #L Італії#!#! багато міст, які випереджають нас за обсягом випуску, однак ніхто з них так і не перевершив наші тканини за якістю; їх виробляють найуміліші містяни, що роками відточували свою майстерність. Навіть володарі незліченних багатств вважають #L [ROOT.GetCountry.GetAdjective|l]ий#! одяг справжньою розкішшю, і однієї лише цієї думки достатньо, щоб ми почали виробляти більше та покривати зростаючий попит."
  flavor_luc.2.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  flavor_luc.2.a.entry: "Чудово!"
  luc_fine_cloth_demand: "Попит на шовкові тканини"
  flavor_luc.3.entry: "$flavor_luc.3.title$"
  flavor_luc.3.title: "Плани на Лондон"
  flavor_luc.3.desc: "Найбільш підприємлив[ROOT.GetCountry.Custom('burghers_yiaei')] наш[ROOT.GetCountry.Custom('burghers_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] представи[ROOT.GetCountry.Custom('burghers_vlaloly')] задум широкого виходу на ринок #L #TOOLTIP:LOCATIONRANK,[target_market.GetCenterLocation.Custom('LR_tt')],X [target_market.GetCenterLocation.Custom('LR_GEN')|l]#!#! [target_market.GetShortName]: багато з них збираються переїхати до #TOOLTIP:LOCATION,london,X #L Лондона#!#! — міста, що перебуває під владою #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_GEN')|L]#!#! і налаштований до нас приязно.\n\nЦю пропозицію сьогодні розглядає [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]. Деякі придворні раді можливості розширити торгові зв’язки, інші ж підкреслюють, що після такого [target_country.GetNameWithNoTooltip] мож[target_country.Custom('end_eut')] почати ставитися до нас з недовірою, що чужоземним купцям навряд чи будуть раді, і що краще буде прагнути до взаємодії, ніж до суперництва."
  flavor_luc.3.a: "Розширимо торгові зв’язки."
  flavor_luc.3.b: "Взаємодіятимемо, а не змагатимемося."
  flavor_luc.4.entry: "$flavor_luc.4.title$"
  flavor_luc.4.title: "За свободу!"
  flavor_luc.4.desc: "За свою довгу історію народ #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! переніс безліч поразок та принижень — і все ж залишився твердо стояти на ногах, попри все.\n\n[ROOT.GetCountry.GetAdjectiveWithNoTooltip|U]ій людині неможливо уявити, що хтось просто складе руки та змириться зі своєю долею. Щоразу, коли настають важкі часи або ж наші вояки гинуть на полі бою, [ShowLocationName('lucca')] незмінно може розраховувати на те, що ми станемо стіною."
  flavor_luc.4.a: "Ми не боїмося навіть смерті!"
  flavor_luc.4.b: "Найкращий захист — це напад."
  flavor_luc.5.entry: "$flavor_luc.5.title$"
  flavor_luc.5.title: "[ShowBuildingTypeNameWithNoTooltip('walls_of_lucca')]"
  flavor_luc.5.desc: "Голод і війна зазвичай оминають нас стороною, однак бувають і такі роки, коли [ShowLocationName('lucca')] страждає від набігів. Міська варта пильно несе дозор на стінах, вишукуючи ворогів, оскільки кожен знає: якщо недруги прорвуться за ворота, загинуть рідні та близькі. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] пропонує розширити стіни, зробивши їх якомога ширшими та вищими, щоб наші містяни могли спати спокійно."
  flavor_luc.5.a: "Ми розширимо стіни."
  flavor_luc.5.b: "Потрібно зробити так, щоб ворог не зміг здолати нас силою."
  flavor_luc.1000.entry: "$flavor_luc.1000.title$"
  flavor_luc.1000.title: "Придбання [GetCountry('LUC').Custom('CL_GEN')]"
  flavor_luc.1000.desc: "Війна, яку нині вед[target_country.Custom('end_youtut')] [target_country.GetName], надала нам чудову нагоду перейти до іншого пана — якщо, звісно, у нас виникне таке бажання. Замість того, щоб домагатися цієї мети військовим шляхом, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] пропонує продатися #ONCLICK:COUNTRY,[GetCountry('PIS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('PIS').GetKey],X [GetCountry('PIS').Custom('CL_DAT')|L]#!#!, щоб і поповнити скарбницю, і продемонструвати свою добру волю."
  flavor_luc.1000.a: "Звернімося з цією пропозицією до [target_country.Custom('CL_DAT')]."
  flavor_luc.1000.a.entry: "Звернімося з цією пропозицією до сюзерена."
  flavor_luc.1000.b: "Незалежність можна лише відвоювати."
  flavor_luc.1001.title: "$flavor_luc.1000.title$"
  flavor_luc.1001.desc: "У самий розпал війни з #ONCLICK:COUNTRY,[enemy_country.GetKey] #TOOLTIP:COUNTRY,[enemy_country.GetKey],X [enemy_country.Custom('CL_INST')|L]#!#! до нас прибули посли з #ONCLICK:COUNTRY,[GetCountry('LUC').GetKey] #TOOLTIP:COUNTRY,[GetCountry('LUC').GetKey],X [GetCountry('LUC').Custom('CL_GEN')|L]#!#!. Вони обговорили з нами хід бойових дій і повідомили, що [GetCountry('PIS').GetName] збира[GetCountry('PIS').Custom('end_yeyut')] війська, щоб вторгнутися в наші краї. Однак є спосіб цьому запобігти: нам запропонували продати [GetCountry('LUC').Custom('CL_ACC')] #ONCLICK:COUNTRY,[GetCountry('PIS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('PIS').GetKey],X [GetCountry('PIS').Custom('CL_DAT')|L]#!#!, забезпечивши собі — мир, а їм — скарбову перевагу."
  flavor_luc.1001.a: "Не ризикуватимемо: нам не потрібен ще один ворог в Італії."
  flavor_luc.1001.b: "Наші васали не продаються."
  flavor_luc.1002.title: "$flavor_luc.1000.title$"
  flavor_luc.1002.desc: "Влада #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_GEN')|L]#!#! звернулася до нас із цікавою пропозицією: вони бажають продати нам свого васала #ONCLICK:COUNTRY,[GetCountry('LUC').GetKey] #TOOLTIP:COUNTRY,[GetCountry('LUC').GetKey],X [GetCountry('LUC').Custom('CL_ACC')|L]#!#!. В обмін ми укладемо з ними перемир’я і не втручатимемося в конфлікт із #ONCLICK:COUNTRY,[enemy_country.GetKey] #TOOLTIP:COUNTRY,[enemy_country.GetKey],X [enemy_country.Custom('CL_INST')|L]#!#!."
  flavor_luc.1002.a: "Ця угода того варта."
  flavor_luc.1002.b: "Навіщо купувати, якщо можна завоювати?"
  flavor_luc.1100.entry: "$flavor_luc.1100.title$"
  flavor_luc.1100.title: "Вигідний союз"
  flavor_luc.1100.desc: "Наше становище в #TOOLTIP:REGION,italy_region,X #L Італії#!#! досить міцне, однак це не означає, що можна розслабитися: загроза ззовні може виникнути будь-якої миті. Саме тому [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] пропонує спробувати укласти союз із #ONCLICK:COUNTRY,[GetCountry('GEN').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GEN').GetKey],X [GetCountry('GEN').Custom('CL_INST')|L]#!#!: він піде на користь обом сторонам, і всякий, хто спробує завоювати цей регіон, буде змушений протистояти одразу двом сильним країнам."
  flavor_luc.1100.a: "Такий союз буде дуже доречним."
  flavor_luc.1100.b: "Щоб убезпечити кордони, краще буде їх розширити."
  flavor_luc.1101.title: "$flavor_luc.1100.title$"
  flavor_luc.1101.desc: "В #TOOLTIP:REGION,italy_region,X #L Італії#!#! сьогодні панує непроста обстановка, і багато країн змушені битися з ворогами в гордій самотності. Це, втім, не означає, що й нам потрібно залишатися самим: до нас саме прибули посли з #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_GEN')|L]#!#!, які бажають укласти з нами союз. І [target_character.GetName], і [target_character2.GetName] зможуть не тільки відстояти свою незалежність, а й, можливо, допомогти одне одному позбутися загроз ззовні."
  flavor_luc.1101.a: "Це безперечно піде на користь нам обом."
  flavor_luc.1101.b: "Не варто їм допомагати. Краще спробуймо завоювати їх..."