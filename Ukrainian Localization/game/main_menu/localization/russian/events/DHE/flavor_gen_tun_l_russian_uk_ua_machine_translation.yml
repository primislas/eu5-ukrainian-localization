l_russian:
  flavor_gen_tun.1.title: "Стиглий плід"
  flavor_gen_tun.1.entry: "$flavor_gen_tun.1.title$"
  flavor_gen_tun.1.desc: "Стародавнє і прекрасне, [target_location.GetRank.GetName] [target_location.GetName] височіє над [ShowLocationName('cape_tajura')]. Попри його значення для господарства краю [ShowScriptedGeographyName('mediterranean_sea_geography')], він залишається в руках [target_country.Custom('longname_ua_GEN')] — країни надто слабкої, щоб наодинці протистояти нашому вторгненню. Ми могли б висадитися в землі [ShowProvinceDefinitionName('tripolitania_province')], пограбувати узбережжя, а потім продати наші завоювання сусідній країні — або навіть залишити їх собі."
  flavor_gen_tun.1.a: "Прекрасна ідея!"
  flavor_gen_tun.1.b: "Такі нагоди — доля охочих до війни."
  flavor_gen_tun.2.title: "Продаж $tripoli$"
  flavor_gen_tun.2.entry: "$flavor_gen_tun.1.title$"
  flavor_gen_tun.2.desc: "Після завоювання та розграбування [target_location.Custom('LR_GEN')] [target_location.GetName] [ROOT.GetCountry.GetFlavorRank] тепер володіє великою колонією в області [target_location.GetArea.GetName] — землею, вельми відмінною за культурою та вірою від нашої метрополії в [ROOT.GetCountry.GetCapital.Custom('LR_GEN')] [ROOT.GetCountry.GetCapital.GetName]. Можливо, варто передати її одному із сусідніх племен."
  flavor_gen_tun.2.a: "Продати її сусідньому племені Бану Сабіт."
  flavor_gen_tun.2.b: "Можливо, Бану Маккі зацікавляться викупом своїх колишніх земель."
  flavor_gen_tun.2.c: "Ми впевнені, що [tunis_location.GetOwner.GetLongNameWithNoTooltip] будуть зацікавлені."
  flavor_gen_tun.2.d: "[target_location.GetNameWithNoTooltip] належить нам!"
  flavor_gen_tun.2.d.entry: "$tripoli$ належить нам!"
  sale_of_tripoli_tt: "Ми продамо наші колонії в [target_location.Custom('LR_GEN')] [target_location.GetName] за [SCOPE.GetLocalVariable('proposed_price_of_sale').GetValue|+] [gold_i|e] [gold|e], передавши всі пов’язані з ними [locations|e] — разом #Y [SCOPE.GetLocalVariable('num_of_locations_to_be_sold').GetValue]#! [locations|e]"
  flavor_gen_tun.3.title: "$flavor_gen_tun.2.title$"
  flavor_gen_tun.3.desc: "Посланець від [from_country.Custom('CL_GEN')] прибув до [ROOT.GetCountry.GetCapital.Custom('LR_GEN')] [ROOT.GetCountry.GetCapital.GetName], пропонуючи продати нам свої володіння в [target_location.Custom('LR_PREP')] [target_location.GetName] за чималу ціну. Однак вартість [target_location.Custom('LR_GEN')] [target_location.GetRank.GetName] не варто недооцінювати — це було б добрим надбанням для [ROOT.GetCountry.Custom('rank_ua_GEN')]]."
  flavor_gen_tun.3.desc_banu_makki: "Зухвалість, яку виявляє [from_country.GetLongName], [ROOT.GetCountry.GetReligion.GetGodName] не залишить без покарання! Завоювавши наше прекрасне [target_location.Custom('LR_PREP')] [target_location.GetRankAndName], вони тепер пропонують нам «нагоду» заплатити за його повернення. Найприкріше в цьому те, що ми, мабуть, і справді можемо прийняти їхню пропозицію…"
  flavor_gen_tun.3.a: "Добре, ми погодимося."
  flavor_gen_tun.3.b: "Навіщо платити за те, що ми можемо завоювати?"
  flavor_gen_tun.3.c: "При всій повазі, нам це неважливо."