l_russian:
  flavor_gen_tun.1.title: "Легка здобич"
  flavor_gen_tun.1.entry: "$flavor_gen_tun.1.title$"
  flavor_gen_tun.1.desc: "Старовинне та прекрасне [target_location.GetRank.GetName|l] [target_location.GetName] височіє над #TOOLTIP:LOCATION,cape_tajura,X #L мисом Таджура#!#!. Попри те що [ShowScriptedGeographyName('mediterranean_sea_geography')] та його господарство годі уявити без цього важливого осередку торгівлі, воно й досі лишається у володінні [target_country.Custom('longname_ua_GEN')] — країни, надто слабкої, щоб самотужки відбити наше вторгнення. Ми можемо висадитися у провінції [ShowProvinceDefinitionName('tripolitania_province')], розграбувати узбережжя, а відтак продати завойовані землі сусідній країні чи й узагалі залишити їх собі."
  flavor_gen_tun.1.a: "Прекрасна ідея!"
  flavor_gen_tun.1.b: "Така нагода випадає лише тим, хто готовий узятися до зброї."
  flavor_gen_tun.2.title: "Продаж Триполі"
  flavor_gen_tun.2.entry: "$flavor_gen_tun.1.title$"
  flavor_gen_tun.2.desc: "Завоювавши та розграбувавши [target_location.GetRank.Custom('LR_ACC')|l] [target_location.GetName], [ROOT.GetCountry.GetFlavorRank|l] отрима[ROOT.GetCountry.Custom('endrank_vlaloly')] велику колонію в області [target_location.GetArea.GetName], чиї культура та віра разюче відрізняються від культури та віри її нової метрополії у [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName]. Можливо, варто передати ці землі одному із сусідніх племен."
  flavor_gen_tun.2.a: "Продамо нову колонію сусідньому племені Бану Табіт."
  flavor_gen_tun.2.b: "Можливо, плем’я Бану Маккі забажає викупити свої землі."
  flavor_gen_tun.2.c: "[tunis_location.GetOwner.GetLongNameWithNoTooltip] безперечно зацікав[tunis_location.GetOwner.Custom('endlong_ytlyat')]ся нашою пропозицією."
  flavor_gen_tun.2.d: "[target_location.GetRank.GetNameWithNoTooltip|U] [target_location.GetNameWithNoTooltip] належить нам!"
  flavor_gen_tun.2.d.entry: "Триполі належить нам!"
  sale_of_tripoli_tt: "Ми продамо наші колонії у [target_location.Custom('LR_PREP')|l] [target_location.GetName] за [SCOPE.GetLocalVariable('proposed_price_of_sale').GetValue|+] [gold_i|e] [Concept('gold', 'золотих')|e], передавши разом із ними всі пов’язані [Concept('locations', 'місцевості')|e] (загалом [Concept('locations', 'місцевостей')|e]: #Y [SCOPE.GetLocalVariable('num_of_locations_to_be_sold').GetValue]#!)"
  flavor_gen_tun.3.title: "$flavor_gen_tun.2.title$"
  flavor_gen_tun.3.desc: "Посланець із #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_GEN')|L]#!#! прибув до [ROOT.GetCountry.GetCapital.Custom('LR_GEN')|l] [ROOT.GetCountry.GetCapital.GetName] із пропозицією продати нам їхні володіння у [target_location.Custom('LR_PREP')|l] [target_location.GetName] за чималі гроші. І все ж значення #L #TOOLTIP:COUNTRY_RANK,[target_location.GetRank.Custom('CF_tt')],X [target_location.GetRank.Custom('rank_ua_GEN')|l]#!#! важко переоцінити — придбання цих володінь стало б вельми корисним для [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  flavor_gen_tun.3.desc_banu_makki: "За зухвалість, яку вияви[from_country.Custom('endlong_vlaloly')] [from_country.GetLongName], їх покарає [ROOT.GetCountry.GetReligion.GetGodName]! Захопивши наше прекрасне [target_location.Custom('LR_ACC')|l] [target_location.GetName], вони тепер пропонують нам «нагоду» викупити його назад. А найприкріше те, що нам, певно, і справді доведеться пристати на їхню пропозицію…"
  flavor_gen_tun.3.a: "Добре, ми згодні."
  flavor_gen_tun.3.b: "Навіщо платити за те, що можна взяти силою?"
  flavor_gen_tun.3.c: "За всієї поваги, нам байдуже."