l_russian:
  flavor_hun_ven.1.title: "Приєднання Далмації"
  flavor_hun_ven.1.entry: "Задарський мир — угорська подія"
  flavor_hun_ven.1.desc: "Вихід до моря дає країні величезні переваги, тому [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] багато років прагнули заволодіти частиною #TOOLTIP:AREA,adriatic_sea_area,X #L Адріатичного#!#! узбережжя. Судячи з донесень наших шпигунів, [GetCountry('VEN').GetName] перебува[GetCountry('VEN').Custom('end_yeyut')] в глибокому занепаді, і при дворі говорять, що зараз найвідповідніший момент зробити наш хід. Втім, можна й не поспішати з оголошенням війни — у поточній ситуації [GetCountry('VEN').Custom('CL_ACC')] можна примусити до поступок дипломатичним шляхом."
  flavor_hun_ven.1.a: "Будь-які переговори — марна трата часу."
  flavor_hun_ven.1.b: "Спробуємо натиснути на них за допомогою дипломатії."
  flavor_hun_ven.1.historical_info: "За правління Людовика I Угорщина прагнула розширити свою присутність на Адріатиці та послабити венеційське панування на узбережжі Далмації. У 1356 році Людовик розпочав воєнну кампанію проти Венеції та стрімким ударом захопив кілька ключових далматських міст. Після низки відчутних поразок та внутрішніх негараздів у 1358 році венеційці були змушені піти на переговори. За умовами Задарського миру Венеція відмовилася від своїх володінь у Далмації та визнала республіку Рагуза васалом Угорщини."
  flavor_hun_ven.2.title: "Приєднання Далмації"
  flavor_hun_ven.2.desc: "Внутрішні конфлікти, що охопили [ROOT.GetCountry.Custom('rank_ua_ACC')|l], не вислизнули з уваги сусідів. #L [GetCountry('HUN').GetAdjective]і#! влада бажає організувати переговори, щоб обговорити передачу наших #TOOLTIP:CULTURE,$dalmatian_tt$,X #L далматських#!#! володінь на користь [GetCountry('HUN').Custom('CL_GEN')]. Думки двору розділилися: одні вважають [GetCountry('HUN').GetAdjectiveWithNoTooltip|l]у пропозицію обурливою образою нашої честі, інші ж закликають проявити обережність та розсудливість. Відмова може призвести до війни, поразка в якій коштуватиме нам не лише Далмації..."
  flavor_hun_ven.2.a: "Це така ж божевільна ідея, як і їхній [GetCountry('HUN').GetGovernment.GetRulerTitle|l]!"
  flavor_hun_ven.2.a.entry: "Ця ідея така ж божевільна, як і їхній правитель!"
  flavor_hun_ven.2.b: "Особливого вибору в нас немає, доведеться погодитися."