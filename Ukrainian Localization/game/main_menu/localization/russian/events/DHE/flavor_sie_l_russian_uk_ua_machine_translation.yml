l_russian:
  unlocked_advance_marble_tradition_tt: "Пройдено [Concept('dynamic_historical_event', 'динамічна історична подія')|e] «$flavor_sie.1.title$»"
  flavor_sie.1.title: "Банк Монте дей Паскі"
  flavor_sie.1.entry: "$flavor_sie.1.title$"
  flavor_sie.1.desc: "#italic Монті ді п'єта#!, або «банки милосердя», стають усе частішим явищем у нашій країні. Це благодійні фінансові організації, які отримують гроші з пожертв і видають малозабезпеченим позики з низькою лихвою. Можливо, уряду варто виділити кошти на створення подібної установи в [monte_paschi_bank_hq.Custom('LR_PREP')|l] [monte_paschi_bank_hq.GetName]. Фактично вона слугуватиме національним банком нашої країни та сприятиме підвищенню добробуту нашого народу."
  flavor_sie.1.a: "Це допоможе нам наповнити скарбницю."
  flavor_sie.1.b: "Воістину, це богоугодна справа!"
  flavor_sie.1.historical_info: "#italic Банк Монте дей Паскі ді Сієна#!, заснований у Сієнській республіці в 1472 році, вважається найстарішим із банків, що діють досі. Спочатку він був створений як некомерційний ломбард, а свій статус сучасного банку набув лише після приєднання до Великого герцогства Тосканського в 1624 році. Після об'єднання Італії його діяльність поширилася на весь Апеннінський півострів."
  flavor_sie.2.title: "$flavor_sie.1.title$"
  flavor_sie.2.desc: "Банки милосердя є свого роду благодійними організаціями, які намагаються допомагати бідним верствам населення. Втім, гуманітарний характер цих банків зовсім не забороняє нам отримувати прибуток від цієї діяльності…"
  flavor_sie.2.a: "Вони будуть нашими!"
  flavor_sie.3.entry: "$flavor_sie.3.title$"
  flavor_sie.3.title: "Золота доба Сієни"
  flavor_sie.3.desc: "Роки миру та процвітання поряд із розширенням #L [ROOT.GetCountry.GetAdjective|l]их#! кордонів призвели до того, що в #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_PREP')|l]#!#! [target_location.GetName] настала справжнісінька золота доба. Місцеві жителі знаходять час і для старанної праці, і для відпочинку, а тому живуть у багатстві та процвітанні. Іншими словами, справи тут ідуть вкрай добре, і місцеві жителі впевнені, що ця ідилія триватиме вічно."
  flavor_sie.3.a: "Наша золота доба ніколи не закінчиться!"
  sie_gain_modifier_until_the_black_death: "[ShowLocationName('siena')] отримає [Concept('location_modifier', 'модифікатор')|e] «[ShowModifier('sie_golden_age_of_siena')]», який діятиме до початку [Concept('situation', 'ситуації')|e] «[ShowSituationNameWithNoTooltip('black_death')]»"
  flavor_sie.4.entry: "$flavor_sie.4.title$"
  flavor_sie.4.title: "Відновлення після чорної смерті"
  flavor_sie.4.desc: "Чума, що прокотилася #TOOLTIP:REGION,italy_region,X #L Італією#!#! та іншими країнами #TOOLTIP:CONTINENT,europe,X #L Європи#!#!, завдала [target_location.Custom('LR_DAT')|l] [target_location.GetName] непоправної шкоди. Тепер його колись гамірні вулиці пустують, нагадуючи про те, що і грішники, і праведники рівні перед лицем смерті. Втім, замість того, щоб сумувати, ми можемо допомогти місцевим жителям, що залишилися, знову стати на ноги."
  flavor_sie.4.a: "Ми виділимо державні кошти на відновлення [target_location.Custom('LR_GEN')|l]."
  flavor_sie.4.a.entry: "Ми виділимо державний кошт на відновлення цієї місцевості."
  sie_all_pops_lose_satisfaction: "Усі [Concept('pops', 'громади')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] отримають [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  flavor_sie.4.b: "Це вічний кругообіг життя та смерті. З нього немає виходу."
  flavor_sie.5.entry: "$flavor_sie.5.title$"
  flavor_sie.5.title: "Заснування порту в Гроссето"
  flavor_sie.5.desc: "Зараз наша присутність на узбережжі #TOOLTIP:REGION,italy_region,X #L Італії#!#! вельми невелика. Попри це, численн[ROOT.GetCountry.Custom('burghers_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] заклика[ROOT.GetCountry.Custom('burghers_yeyut')] уряд #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! розширити флот і запевня[ROOT.GetCountry.Custom('burghers_yeyut')], що нещодавно придбаний нами [target_location.GetRank.GetName|l] [target_location.GetName] чудово підходить для будівництва нового порту.\n\nЧисленні громадяни [ROOT.GetCountry.Custom('rank_ua_GEN')|l] переїхали сюди в надії на те, що ми помітимо потенціал цього [target_location.Custom('LR_GEN')|l] і вкладемо кошти в розвиток його морської інфраструктури."
  flavor_sie.5.a: "Новий порт допоможе нам налагодити морську торгівлю."
  flavor_sie.5.b: "Краще зосередимося на наших сухопутних кордонах."
  flavor_sie.6.entry: "$flavor_sie.6.title$"
  flavor_sie.6.title: "Морський вплив у Пітільяно"
  flavor_sie.6.desc: "Наш[ROOT.GetCountry.Custom('burghers_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] уже давно намага[ROOT.GetCountry.Custom('burghers_yetsayutsa')] конкурувати з морськими купцями з інших #TOOLTIP:REGION,italy_region,X #L італійських#!#! країн, але в них немає для цього необхідної інфраструктури. Передусім їм бракує портів на ринку #L #TOOLTIP:LOCATIONRANK,[target_location.GetMarket.GetCenterLocation.Custom('LR_tt')],X [target_location.GetMarket.GetCenterLocation.Custom('LR_GEN')|l]#!#! [target_location.GetMarket.GetShortName], однак у них на прикметі є й інші місцевості.\n\nЗокрема, численн[ROOT.GetCountry.Custom('burghers_yiaei')] наш[ROOT.GetCountry.Custom('burghers_aei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] зверну[ROOT.GetCountry.Custom('burghers_vlaloly')] увагу на перспективний #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_ACC')|l]#!#! [target_location.GetName]. Вони вважають, що нам варто розширити місцевий порт і перетворити його на повноцінний великий торг, доступний усім купцям."
  flavor_sie.6.a: "Це вигідне вкладення."
  flavor_sie.6.b: "Ми не будемо витрачати кошти лише тому, що так бажа[ROOT.GetCountry.Custom('burghers_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l]."
  flavor_sie.6.b.entry: "Ми не будемо витрачати кошти лише тому, що так бажають багатії."
  flavor_sie.7.entry: "$flavor_sie.7.title$"
  flavor_sie.7.title: "Порт Пйомбіно"
  flavor_sie.7.desc: "Купці, [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] та [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] масово переїжджають в #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_ACC')|l]#!#! [target_location.GetName], якому наш двір приділяє особливу увагу.\n\nРозуміючи, що розширення місцевого порту дозволить нам наростити морську торгівлю, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] зверну[ROOT.GetCountry.Custom('burghers_vlaloly')]ся до уряду з проханням виділити кошти на розвиток цієї місцевості. Вони твердо переконан[ROOT.GetCountry.Custom('burghers_yiaei')], що за правильного підходу порт [target_location.GetNameWithNoTooltip] може стати одним із найбагатших та найпривабливіших в усій #TOOLTIP:REGION,italy_region,X #L Італії#!#!."
  flavor_sie.7.a: "Розвиток цього порту позитивно позначиться на нашій торгівлі."
  flavor_sie.7.b: "Нам не потрібен ще один великий порт."
  flavor_sie.8.entry: "$flavor_sie.8.title$"
  flavor_sie.8.title: "Повернення з вигнання"
  flavor_sie.8.desc: "Численн[ROOT.GetCountry.Custom('nobles_yiaei')] впливов[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] бер[ROOT.GetCountry.Custom('nobles_eut')] участь у #L [ROOT.GetCountry.GetAdjective|l]ій#! політиці, але нікому з них не вдавалось здобути навіть малої частки тієї влади, яку здобула родина [GetDynasty('petrucci').GetName]. Принаймні, так було доти, доки всіх її членів не вигнали через звинувачення в підготовці перевороту.\n\nУтім, попри заплямовану репутацію, [Select_CString(target_character.IsFemale, 'одна представниця', 'один представник')] цього роду все ж [Select_CString(target_character.IsFemale, 'насмілилася', 'насмілився')] повернутися на батьківщину своїх пращурів, до легендарного [target_capital.Custom('LR_ACC')|l] #L #TOOLTIP:LOCATIONRANK,[target_capital.Custom('LR_tt')],X [target_capital.Custom('LR_ACC')|l]#!#! [target_capital.GetName]. Місцевий простолюд з радістю зустрів [Select_CString(target_character.IsFemale, 'її', 'його')] та висловив надію, що [Select_CString(target_character.IsFemale, 'вона', 'він')] нарешті забере собі владу, яку окупува[ROOT.GetCountry.Custom('nobles_vlaloly')] корумпован[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l]. Звісно, є й ті, хто вбачає в [Select_CString(target_character.IsFemale, 'цій жінці', 'цьому чоловікові')] загрозу усталеному порядку. Вони вимагають, щоб уряд якнайшвидше вигнав [Select_CString(target_character.IsFemale, 'її', 'його')], доки [Select_CString(target_character.IsFemale, 'вона не спробувала', 'він не спробував')] влаштувати черговий переворот."
  flavor_sie.8.a: "Одна впливова людина для нас не загроза."
  flavor_sie.8.b: "Є багато чудових способів приструнити вискочнів..."
  flavor_sie.8.c: "Цю родину вигнали не просто так."
  sie_triumphant_return_means_possibility_of_coup: "Повернувшись до #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! та ставши [Select_CString(target_character.IsFemale, 'правителькою', 'правителем')], [target_character.GetName] намагатиметься зосередити владу у своїх руках."
  flavor_sie.9.entry: "$flavor_sie.9.title$"
  flavor_sie.9.title: "Прихід до влади"
  flavor_sie.9.desc: "Багато років тому [ROOT.GetCountry.GetLongName] бу[ROOT.GetCountry.Custom('endlong_vlaloly')] поділен[ROOT.GetCountry.Custom('endlong_clean')] між родинами, які обіймали різні посади. Та коли до влади [Select_CString(target_character.IsFemale, 'прийшла', 'прийшов')] [target_character.GetName], багато з цих посад виявилися зайнятими лоялістами — [Select_CString(target_character.IsFemale, 'її', 'його')] наближеними та членами династій, які повністю підтримали зміщення балансу сил.\n\nНа зібранні [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] не наважу[ROOT.GetCountry.Custom('crown_yeyut')]ся заперечувати: у [Select_CString(target_character.IsFemale, 'правительки', 'правителя')] достатньо впливу, щоб вгамувати будь-якого політичного опонента.\n\nТакий рівень контролю над [ROOT.GetCountry.Custom('rank_ua_INST')|l] призводить до того, що династія [target_character.GetDynasty.GetName] зміцнює свої позиції в країні."
  flavor_sie.9.a: "Одна династія правитиме всіма."
  flavor_sie.10.entry: "$flavor_sie.10.title$"
  flavor_sie.10.title: "Мистецький стиль Сієни"
  flavor_sie.10.desc: "У добу #TOOLTIP:INSTITUTION,renaissance,X #L Відродження#!#! на теренах #TOOLTIP:REGION,italy_region,X #L Італії#!#! з’явилося безліч мистецьких напрямів. Одним із найвизначніших став #L [ROOT.GetCountry.GetAdjective|l]ий#! стиль. Його релігійно-містична спрямованість різко контрастує з гуманістичними та експресіоністськими традиціями #TOOLTIP:LOCATION,florence,X #L Флоренції#!#!. [ROOT.GetCountry.GetGovernment.GetCourtTitle] вважає, що цей стиль послужить поширенню нашої культури в #TOOLTIP:CONTINENT,europe,X #L Європі#!#! та підвищить нашу славу."
  flavor_sie.10.a: "Сієна стане найславетнішим містом!"
  flavor_sie.10.b: "Ми не маємо коштів на подібні проєкти."
  flavor_sie.11.entry: "$flavor_sie.11.title$"
  flavor_sie.11.title: "Розширення сієнської школи живопису"
  flavor_sie.11.desc: "У розпал доби #TOOLTIP:INSTITUTION,renaissance,X #L Відродження#!#! культурна самосвідомість #TOOLTIP:REGION,italy_region,X #L Італії#!#! повністю перетворилася, і в багатьох містах почали розвиватися самобутні мистецькі напрями. Однак #L [ROOT.GetCountry.GetAdjective|l]а#! традиція, на щастя, не пішла в небуття. Навпаки, з’являється все більше митців, які бажають працювати в нашому стилі.\n\nЗ-поміж них — [target_character.GetName]. [Select_CString(target_character.IsFemale, 'Вона', 'Він')] прагне привнести більше духовності в естетику #TOOLTIP:LOCATION,siena,X #L Сієни#!#!."
  flavor_sie.11.a: "Нам потрібні такі митці, як [Select_CString(target_character.IsFemale,'вона', 'він')]."
  flavor_sie.11.a.entry: "Нам потрібні нові митці."
  flavor_sie.11.b: "Краще не чіплятися за старе, а черпати натхнення в інших стилях."
  flavor_sie.12.entry: "$flavor_sie.12.title$"
  flavor_sie.12.title: "Сієнська святість"
  flavor_sie.12.desc: "[target_character.GetName] надзвичайно [Select_CString(target_character.IsFemale,'побожна', 'побожний')], і [target_character.GetReligion.GetGodName] відіграє в [Select_CString(target_character.IsFemale,'її', 'його')] житті першочергову роль. Численні жителі #TOOLTIP:LOCATION,siena,X #L Сієни#!#! вважають [Select_CString(target_character.IsFemale,'її найревнішою вірянкою', 'його найревнішим вірянином')] після папи римського.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] не може не помічати [Select_CString(target_character.IsFemale,'її', 'його')] запалу та любові до богослов’я. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] вважа[ROOT.GetCountry.Custom('clergy_yeyut')], що [Select_CString(target_character.IsFemale,'вона', 'він')] пода[ROOT.GetCountry.Custom('clergy_yeyut')] приклад нашого благочестя всьому #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ому#! світу, а [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] став[ROOT.GetCountry.Custom('peasants_ytlyat')]ся до [Select_CString(target_character.IsFemale,'неї', 'нього')] як до [Select_CString(target_character.IsFemale,'святої, яка здатна', 'святого, який здатен')] дарувати їм процвітання."
  flavor_sie.12.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  flavor_sie.12.a.entry: "Чудово!"