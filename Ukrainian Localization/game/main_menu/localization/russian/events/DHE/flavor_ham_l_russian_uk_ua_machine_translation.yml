l_russian:
  flavor_ham.1.title: "Банк Беренбергів"
  flavor_ham.1.entry: "$flavor_ham.1.title$"
  flavor_ham.1.desc: "До нас у [ROOT.GetCountry.Custom('rank_ua_ACC')|l] стікаються численні торговці та комерсанти — їх вабить багатство наших земель. Серед новоприбулих є й династія [GetDynasty('berenberg_dynasty').GetName]; ці люди чудово розбираються в тонкощах відання грошовими потоками та хочуть заснувати приватну банківську контору в місцевості, що зветься [berenberg_bank_hq.GetName]. Установа такого роду може принести нам чималу користь: з її допомогою буде простіше розбиратися з торговими позиками та займатися товарообміном у Північному морі."
  flavor_ham.1.historical_info: "Гамбурзький #italic банк Беренбергів#! — один із найстаріших нині чинних банків, заснований 1590 року Гансом і Паулем Беренбергами — фламандськими торговцями, що втекли з Антверпена від іспанських завойовників. Банк, що сприяв розвитку торгівлі в Північній Європі, ніколи не покидав приватних рук і розвивався завдяки ретельному підходу до купецьких позик та інвестицій."
  flavor_ham.1.a: "Ми раді кожному вмілому купцю."
  flavor_ham.1.b: "Подивимося, чого вони доб’ються!"
  flavor_ham.2.title: "$flavor_ham.1.title$"
  flavor_ham.2.desc: "[berenberg_bank_hq.GetRank.GetName|U] [berenberg_bank_hq.GetName] — ось де ми заснували свою банківську контору, і кращого місця для неї не знайти. Зв’язки з купцями в Північній Європі та за її межами відкривають нам не один десяток дверей, і ми готові зіграти чи не найважливішу роль у торгівлі в цьому регіоні."
  flavor_ham.2.a: "Наш статок зростає з кожною угодою."
  flavor_ham.3.title: "Гамбурзький банк"
  flavor_ham.3.entry: "$flavor_ham.3.title$"
  flavor_ham.3.desc: "[hamburger_bank_hq.GetName] приймає в себе все більше купців, і сьогодні кожному зрозуміло: нам потрібен надійний, здатний гідно переносити труднощі обмінний банк, який гарантуватиме вартість різних валют і проводитиме великі комерційні угоди. [hamburger_bank_hq.GetNameWithNoTooltip], де розташується державний банк (за приклад ми візьмемо інші схожі установи), забезпечить нам основу для фінансового успіху."
  flavor_ham.3.historical_info: "1619 року у вільному місті Гамбург було засновано #italic Гамбурзький банк#!, створений за зразком заснованого десятьма роками раніше Амстердамського банку. У Гамбурзі проводилися обміни валюти, приймалися вклади та оброблялися міжнародні платежі, що проводилися в надійній банківській валюті. Протягом понад двохсот років і до поглинання 1875 року Райхсбанком Гамбурзький банк вважався однією з найважливіших фінансових установ Північної Європи."
  flavor_ham.3.a: "Банк діятиме в наших інтересах."
  flavor_ham.3.b: "Ми будемо купатися в грошах!"
  flavor_ham.4.title: "$flavor_ham.3.title$"
  flavor_ham.4.desc: "Нам доручили завідування фінансами наших покровителів та їхніх торгових партнерів. Тепер від наших рішень залежить благополуччя північних країв, і ми не посоромимо свого імені."
  flavor_ham.4.a: "$flavor_ham.3.b$"