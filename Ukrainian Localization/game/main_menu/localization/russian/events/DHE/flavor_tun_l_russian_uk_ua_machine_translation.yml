l_russian:
  flavor_tun.1.desc: "$ibn_khaldun_patronage$"
  flavor_tun.1.entry: "$flavor_gra.5.title$"
  flavor_tun.1.a: "Чудово."
  flavor_tun.1.b: "Це марна трата коштів!"
  tun_have_more_gp_score_than_us: "[THIS.GetCountry.GetName] ма[THIS.GetCountry.Custom('end_yeyut')] найвищий [Concept('great_power_score', 'рахунок великої держави')|e] серед #TOOLTIP:RELIGION,$sunni_tt$,X #L сунітських#!#! [Concept('country', 'країн')|e]"
  flavor_tun.2.caliphal_backstory: "Наша країна постала на уламках [GetCountry('ALM').GetAdjective]ого халіфату. У ті часи вельмишановний Абу Закарія, засновник дому #TOOLTIP:DYNASTY,$hafsid_dynasty_tt$,X #L Хафсідів#!#!, прийняв титул #italic амір аль-мумінін#!, або #italic повелитель правовірних#!, узявши на себе обов’язки халіфа та #italic фактично#! оголосивши про незалежність своєї країни. Його домагання одразу ж визнав дім Насрідів, що правив у [ShowCountryNameIfActive('GRA')], а слідом за ним — еміри інших #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалуських#!#! міст. Згодом наші домагання визнали й новостворені [ShowCountryNameIfActive('TLE')] та [ShowCountryNameIfActive('MOR')]. Вплив нашої країни сягає самого священного міста [ShowLocationName('mecca')], шериф якого визнав наші права на титул халіфа в 1259 році після того, як Аббасиди впали під навалою монголів."
  flavor_tun.2.title: "Занепад халіфату"
  flavor_tun.2.entry: "$flavor_tun.2.title$"
  flavor_tun.2.desc: "$flavor_tun.2.caliphal_backstory$\n\nНині від колишньої величі майже нічого не залишилося. Через наші внутрішні негаразди [ROOT.GetCountry.GetGovernment.GetRulerTitle|l], який уже давно був халіфом лише на папері, дуже ослаб. Його вплив розвіявся. Нам належить відновити авторитет халіфської влади [ROOT.GetCountry.Custom('longname_ua_GEN')]!"
  flavor_tun.2.a: "Ми змусимо їх поважати нас!"
  flavor_tun.2.b: "Настав час зректися титулу."
  tun_caliphate_decision_enabled: "Відкриває доступ до [Concept('decision', 'рішення')|e] «[ShowDecisionName('hafsid_caliphate_decision')]»"
  flavor_tun.3.title: "Відновлення авторитету халіфів"
  flavor_tun.3.desc: "$flavor_tun.2.caliphal_backstory$\n\nХоча в наступному столітті авторитет халіфів похитнувся, нам все ж вдалося вберегти [ROOT.GetCountry.Custom('longname_ua_ACC')] від цілковитого забуття. [ROOT.GetCountry.GetFlavorRank|U] знову посідає одне з провідних місць серед країн [ROOT.GetCountry.GetReligion.GetGroup.GetAdjective|l]ого світу."
  flavor_tun.3.a: "Ми подбаємо про #italic умму#!!"
  hafsid_caliphate_name_tt: "Відтепер наша країна іменуватиметься #Y халіфатом#!!"
  hafsid_caliphate_decision.title: "$flavor_tun.3.title$"
  hafsid_caliphate_decision.entry: "$flavor_tun.3.title$"
  hafsid_caliphate_decision.desc: "$flavor_tun.3.desc$"
  hafsid_caliphate_decision.desc.entry: "Нам не вдалося утвердитися спадкоємцями [GetCountry('ALM').GetAdjective]ого халіфату. Цьому слід покласти край! Ми маємо повернути собі першість серед послідовників #TOOLTIP:RELIGION,$sunni_tt$,X #L сунізму#!#!!"
  hafsid_caliphate_decision.a: "$flavor_tun.3.a$"
  flavor_tun.4.title: "[aging_monarch.GetNameWithNoTooltip] і питання спадкоємництва"
  flavor_tun.4.entry: "[GetCharacter('tun_abu_yahya_abu_bakr_ii').GetNameWithNoTooltip] і питання спадкоємництва"
  flavor_tun.4.desc: "[aging_monarch.GetName] дряхліє і все частіше замислюється про найтяжче, але необхідне для літнього монарха питання — призначення спадкоємця. На перший погляд, сумнівів тут бути не може, оскільки [preferred_heir.GetName] завжди [Select_CString(preferred_heir.IsFemale, 'вважалася улюбленицею', 'вважався улюбленцем')] [Select_CString(aging_monarch.IsFemale, 'нашої дорогої правительки', 'нашого дорогого правителя')]. Проблема в тому, що [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] має й інших дітей. Так, [future_usurper.GetName] допомагає уряду в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName]. Але є й ще один можливий претендент на престол — [third_way.GetName] [target_country2.GetAdjective][Select_CString(third_way.IsFemale, 'а', 'ий')].\n\nЦей вибір матиме далекосяжні наслідки для стабільности [ROOT.GetCountry.Custom('longname_ua_GEN')], які ще довго даватимуться взнаки навіть після того, як [aging_monarch.GetShortNameWithNoTooltip] відійде у вічність."
  flavor_tun.4.a: "Нехай престол успадкує [preferred_heir.GetNameWithNoTooltip] [target_country.GetAdjective][Select_CString(preferred_heir.IsFemale, 'а', 'ий')]."
  flavor_tun.4.a.entry: "Нехай престол успадкує [GetCharacter('tun_abu_l_abbas_ahmad').GetNameWithNoTooltip] із Гафси."
  flavor_tun.4.b: "[future_usurper.GetNameWithNoTooltip] — розважливий вибір."
  flavor_tun.4.b.entry: "[GetCharacter('tun_abu_hafs_umar').GetNameWithNoTooltip] — розважливий вибір."
  flavor_tun.4.c: "[third_way.GetNameWithNoTooltip] допоможе об’єднати країни."
  flavor_tun.4.c.entry: "[GetCharacter('tun_abu_zakariya_yahya').GetNameWithNoTooltip] допоможе об’єднати країни."
  TUN_THIS_will_be_appointed_heir_tt: "[THIS.GetCharacter.GetName] буде [Select_CString(THIS.GetCharacter.IsFemale, 'призначена спадкоємицею', 'призначений спадкоємцем')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!"
  TUN_unite_two_realms_tt: "Оскільки [THIS.GetCharacter.GetName] є [Select_CString(THIS.GetCharacter.IsFemale, 'спорідненою намісницею', 'спорідненим намісником')] у країні [THIS.GetCharacter.GetCourtCountry.GetName], [Select_CString(THIS.GetCharacter.IsFemale, 'її', 'його')] сходження на престол приведе до об’єднання двох країн"
  TUN_civil_war_from_preferred_heir_tt: "Оскільки [Select_CString(preferred_heir.IsFemale, 'бажаною спадкоємицею', 'бажаним спадкоємцем')] є [preferred_heir.GetName], [Select_CString(preferred_heir.IsFemale, 'вона', 'він')] незабаром розв’яже [Concept('war', 'війну')|e], заручившись підтримкою #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племен#!#!. Це призведе до відпадіння наших [Concept('locations', 'місцевостей')|e], що перебувають під впливом Гафси"
  TUN_abu_hafs_will_try_to_start_a_civil_war_tt: "[future_usurper.GetName] може спробувати узурпувати владу, внаслідок чого [THIS.GetCharacter.GetName] втратить престол"
  TUN_we_will_succeed_when_target_ruler_dies_tt: "Якщо не буде спроби узурпації престолу, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] зійде на престол #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_GEN')|L]#!#!, об’єднавши обидві країни під [from_country.GetAdjectiveWithNoTooltip|l]им стягом"
  flavor_tun.5.title: "Призначення [from_country.Custom('preposition_uv')] [from_country.Custom('CL_PREP')]"
  flavor_tun.5.desc_positive: "Чудові новини! [Select_CString(aging_monarch.IsFemale, 'Правителька', 'Правитель')] [from_country.Custom('longname_ua_GEN')] [aging_monarch.GetName] щойно [Select_CString(aging_monarch.IsFemale, 'оголосила', 'оголосив')], що [preferred_heir.GetName] стане [Select_CString(preferred_heir.IsFemale, 'спадкоємицею', 'спадкоємцем')] [from_country.Custom('rank_ua_GEN')|l]. Втім, це не дивно, оскільки [preferred_heir.GetShortNameWithNoTooltip] вже давно вважається [Select_CString(preferred_heir.IsFemale, 'найімовірнішою наступницею', 'найімовірнішим наступником')]. З таким правителем на чолі на Іфрикію чекає світле майбутнє."
  flavor_tun.5.desc_negative: "Хай йому грець! [Select_CString(aging_monarch.IsFemale, 'Правителька', 'Правитель')] #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_GEN')|L]#!#! [aging_monarch.GetName] щойно, всупереч усім сподіванням, [Select_CString(aging_monarch.IsFemale, 'оголосила', 'оголосив')], що [appointed_heir.GetName] успадкує [Select_CString(aging_monarch.IsFemale, 'її', 'його')] престол. Проте вся Іфрикія знає, що [preferred_heir.GetName] має найбільшу підтримку та є [Select_CString(preferred_heir.IsFemale, 'законною наступницею', 'законним наступником')]. Призначення ж [Select_CString(appointed_heir.IsFemale, 'наступницею', 'наступником')] когось іншого навіює думку, що тут не обійшлося без темних справ."
  flavor_tun.5.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  flavor_tun.5.b: "[preferred_heir.GetNameWithNoTooltip] не залишить це без відповіді!"
  flavor_tun.5.c: "Нам доведеться змиритися."
  flavor_tun.6.title: "Очікувана відповідь"
  flavor_tun.6.desc: "[aging_monarch.GetName] [Select_CString(aging_monarch.IsFemale, 'оголосила', 'оголосив')], що [appointed_heir.GetName] успадкує [Select_CString(aging_monarch.IsFemale, 'її', 'його')] престол. Як і очікувалося, це призначення [Select_CString(appointed_heir.IsFemale, 'наступницею', 'наступником')] викликало невдоволення — [preferred_heir.GetName] [Select_CString(preferred_heir.IsFemale, 'поквапилася', 'поквапився')] заявити про свої права на трон. За підтримки #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племен#!#! країна [target_country.GetName] оголосила війну за престол #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, а [preferred_heir.GetShortNameWithNoTooltip] [Select_CString(preferred_heir.IsFemale, 'рушила', 'рушив')] зі своїми військами на [ROOT.GetCountry.GetCapital.Custom('LR_ACC')|l] [ROOT.GetCountry.GetCapital.GetName]."
  flavor_tun.6.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
  GFS_will_receive_following: "Якщо [target_country.GetName] вирішить через це розпочати [Concept('war', 'війну')|e]:"
  flavor_tun.7.title: "Узурпація престолу!"
  flavor_tun.7.desc: "Попри те, що [target_character2.GetName] [Select_CString(target_character2.IsFemale, 'була оголошена спадкоємицею', 'був оголошений спадкоємцем')] [from_country.Custom('longname_ua_GEN')], [Select_CString(target_character2.IsFemale, 'її', 'його')] непокірн[Select_CString(target_character.IsFemale, 'а сестра', 'ий брат')] [target_character.GetName] [Select_CString(target_character.IsFemale, 'вирішила', 'вирішив')] скористатися своїм становищем у столиці, щоб привласнити владу [from_country.Custom('preposition_uv')] [from_country.Custom('rank_ua_PREP')|l]. [target_character2.GetShortNameWithNoTooltip] [target_country.GetAdjective|l][Select_CString(target_character2.IsFemale, 'а', 'ий')] напевно лютуватиме і, безсумнівно, виступить проти [Select_CString(target_character.IsFemale, 'своєї', 'свого')] [Select_CString(target_character2.IsFemale,'сестри', 'брата')] зі зброєю в руках."
  flavor_tun.7.a: "Хто перший прийшов, той і отримав."
  flavor_tun.7.b: "Це обурливо! Це несправедливо!"
  flavor_tun.8.title: "$flavor_tun.7.title$"
  flavor_tun.8.desc: "[target_character2.GetName] [Select_CString(target_character2.IsFemale, 'втратила', 'втратив')] своє право на престол [from_country.Custom('longname_ua_GEN')]. Владу [Select_CString(target_character.IsFemale, 'узурпувала', 'узурпував')] [Select_CString(target_character2.IsFemale, 'її', 'його')] [Select_CString(target_character.IsFemale,'сестра', 'брат')] на ім’я [target_character.GetName]. [Select_CString(target_character.IsFemale,'Вона', 'Він')] негайно [Select_CString(target_character.IsFemale, 'захопила', 'захопив')] владу [from_country.Custom('preposition_uv')] [from_country.Custom('rank_ua_PREP')|l] і [Select_CString(target_character.IsFemale, 'підкорила', 'підкорив')] [from_country.GetAdjective|l]ий двір.\n\n[target_character2.GetShortNameWithNoTooltip] бачить, як [Select_CString(target_character2.IsFemale, 'її', 'його')] ім’я вкривається ганьбою. Яке приниження! [target_character.GetShortNameWithNoTooltip] заслуговує на відплату."
  flavor_tun.8.a: "До бою!"
  flavor_tun.8.b: "Війни ми не можемо собі дозволити."
  flavor_tun.10.title: "Еміризм"
  flavor_tun.10.entry: "$flavor_tun.10.title$"
  flavor_tun.10.desc: "Іфрикія стала прихистком беззаконня та розпусти. Впродовж майже ста років [ROOT.GetCountry.GetLongName] і підвладні #TOOLTIP:DYNASTY,$hafsid_dynasty_tt$,X #L Хафсідам#!#! володіння були неспроможні утвердити свою владу за межами власних міських мурів, через що сільські провінції поринули в безлад та злочинність. Та все ж #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалуська#!#! знать і найвидатніші шейхи-[ShowEstateTypeName('nobles_estate')|l] вірять, що зажеврів промінь надії — еміризм. Ця ідеологія обіцяє майбутнє, в якому #TOOLTIP:AREA,tunis_area,X #L Аль-Магриб аль-Адна#!#! підпорядкований одному емірові, що поверне краєві колишнє процвітання."
  flavor_tun.10.a: "Хай вкаже нам [ROOT.GetCountry.GetReligion.GetGodName] шлях до світла!"
  flavor_tun.10.a.entry: "Хай вкаже нам Аллах шлях до світла!"
  tun_info_about_tunis_decentralization: "Нам конче потрібно за першої ж нагоди позбутися [Concept('government_reform', 'державної реформи')|e] «[ShowGovernmentReformName('tun_strong_familial_governors')]»"
  tun_additional_benefits_for_farfanes_tt: "[Concept('government_reform', 'Державна реформа')|e] «[ShowGovernmentReformName('catalan_merchant_privileges')]» надає бонуси до нашого модифікатора «[ShowModifierTypeName]» залежно від того, скільки в нас військ типу «[ShowUnitDefinitionName('a_farfanes')]»"
  flavor_tun.11.title: "Возз’єднання Іфрикії"
  flavor_tun.11.desc: "З децентралізацією [ROOT.GetCountry.Custom('longname_ua_GEN')] покінчено раз і назавжди. Доба [Concept('government_reform', 'державної реформи')|e] «[ShowGovernmentReformName('tun_strong_familial_governors')]» добігла кінця, і вся Іфрикія возз’єдналася під знаменами дому [ROOT.GetCountry.GetGovernment.GetRulerOrHeirIfRegent.GetDynasty.GetName]. Розгул злочинности більше не терзатиме [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]их сільських областей, [ShowEstateTypeName('nobles_estate')|l] більше не шантажуватиме [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]их емірів, а [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]а країна більше не залежатиме від чужинців.\n\nНастав час покінчити зі старими порядками і скористатися цією нагодою, щоб перегорнути сторінку історії."
  flavor_tun.11.a: "Починається нова доба."
  flavor_tun.11.b: "Народження нової спільноти."
  IFRIQIYA_NAME: "Іфрикія"
  IFRIQIYA_NAME_ADJ: "$IFRIQIYA_NAME$"
  ifriqiya_reunited_decision.title: "$flavor_tun.11.title$"
  ifriqiya_reunited_decision.entry: "$flavor_tun.11.title$"
  ifriqiya_reunited_decision.desc: "$flavor_tun.11.desc$"
  ifriqiya_reunited_decision.desc.entry: "Занадто довго Іфрикія була розділена на безліч країн, чимала частина яких перебувала під владою бічних гілок дому #TOOLTIP:DYNASTY,$hafsid_dynasty_tt$,X #L Хафсідів#!#!. Час покласти край цій роздробленості."
  ifriqiya_reunited_decision.a: "$flavor_tun.11.a$"
  flavor_tun.12.title: "Зростання піратства в Беджаї"
  flavor_tun.12.entry: "$flavor_tun.12.title$"
  flavor_tun.12.desc: "В останні роки місцевість [target_location.GetName] стала осередком незвичного, проте доволі прибуткового промислу — піратства в Середземному морі. Уже не одне десятиліття місцеві шейхи всіляко підтримують піратський схрон та його відкриті набіги на #TOOLTIP:RELIGIONGROUP,christian,X #L християнські#!#! села, попри наявні торгові зв’язки. Такі набіги шкодять нашим відносинам із потенційними торговими партнерами, проте прибутки від #TOOLTIP:POLICY,state_piracy_policy,X #L державного піратства#!#! годі переоцінити."
  flavor_tun.12.a: "[ROOT.GetCountry.GetReligion.GetGodName] — наш Всевишній, а вони його вороги!"
  flavor_tun.12.a.entry: "$muslim_god_name$ — наш всевишній, а вони його вороги!"
  flavor_tun.12.b: "Ну й гаразд."
  flavor_tun.12.c: "Піратство лише зашкодить нам."
  flavor_tun.13.title: "Господарський зашморг"
  flavor_tun.13.entry: "$flavor_tun.13.title$"
  flavor_tun.13.desc: "#TOOLTIP:RELIGIONGROUP,christian,X #L Християнські#!#! купці в #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! уже здобули широкі привілеї за державною реформою «[ShowGovernmentReformName('catalan_merchant_privileges')]». Попри всі надані привілеї, щедро виділені подвір’я, дароване право звертатися до своєї влади та свободу віросповідання, [target_country.GetAdjective|l][target_country.Custom('burghers_yiaei')|l] [target_country.GetGovernment.GetEstateName('burghers_estate')|l] і надалі вимага[target_country.Custom('burghers_yeyut')] нових поступок, погрожуючи в іншому разі цілком припинити торгові зв’язки з нами."
  flavor_tun.13.a: "Найманці надто важливі."
  flavor_tun.13.b: "Подумаєш! Ми й самі впораємося."
  tun_economic_stranglehold_tt: "Модифікатор «[ShowModifierTypeName('global_merchant_power')]» у державній реформі «[ShowGovernmentReformName('catalan_merchant_privileges')]» буде зменшено на #R 10%#!"
  flavor_tun.14.title: "Вимога [Select_CString(target_character.IsFemale, 'родички', 'родича')]"
  flavor_tun.14.desc: "[Select_CString(target_character.IsFemale, 'Одна з хафсідських принцес', 'Один із хафсідських принців')] на ім’я [target_character.GetName] [Select_CString(target_character.IsFemale, 'набула такого впливу', 'набув такого впливу')], що [Select_CString(target_character.IsFemale, 'зажадала', 'зажадав')] посаду [Select_CString(target_character.IsFemale, 'родинної намісниці', 'родинного намісника')]. Якщо ми не поступимося, і [target_character.GetNameWithNoTooltip] не отримає [target_location.Custom('LR_ACC')|l] [target_location.GetName], ми ризикуємо спричинити заворушення [ROOT.GetCountry.Custom('preposition_uv')] [ROOT.GetCountry.Custom('longname_ua_PREP')]."
  flavor_tun.14.a: "Нехай забирає!"
  flavor_tun.14.b: "Зараз невідповідний час."
  tun_target_character_expects_a_governorship_tt: "[target_character.GetName] хоче стати [Select_CString(target_character.IsFemale, 'родинною намісницею', 'родинним намісником')], і, доки [target_character.GetName] не отримає цієї посади через взаємодію з персонажем «[ShowCharacterInteractionName('assign_familial_governor')]», [Select_CString(target_character.IsFemale, 'вона', 'він')] зможе знову й знову викликати цю [Concept('event', 'подію')|e]"
  flavor_tun.15.title: "Суперечка про престолонаслідування"
  flavor_tun.15.desc: "[Select_CString(old_ruler.IsFemale, 'Стара правителька', 'Старий правитель')] [old_ruler.GetName] [Select_CString(old_ruler.IsFemale, 'померла', 'помер')], а з [Select_CString(old_ruler.IsFemale, 'її', 'його')] смертю у [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName] запанувало безвладдя. Формально [Select_CString(new_ruler.IsFemale, 'намісницею', 'намісником')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! [Select_CString(new_ruler.IsFemale, 'має', 'має')] стати [new_ruler.GetName], проте [Select_CString(new_ruler.IsFemale, 'її', 'його')] прихід до влади зовсім не є гарантованим. Вулиці столиці заполонив повсталий місцевий люд, за яким стоїть невідома сила. Повстанці вимагають, щоб [target_character2.GetName] [Select_CString(target_character2.IsFemale, 'посіла', 'посів')] престол. Чи станемо ми на бік законного спадкоємця, чи поступимося вимогам #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L містян#!#!?"
  flavor_tun.15.a: "[new_ruler.GetNameWithNoTooltip] — [Select_CString(new_ruler.IsFemale, 'законна спадкоємиця', 'законний спадкоємець')]!"
  flavor_tun.15.b: "Ми маємо піти назустріч повстанцям."
  flavor_tun.16.title: "Престолонаслідування [target.Custom('preposition_uv')] [target.Custom('CL_PREP')]"
  flavor_tun.16.desc: "Після того як [new_ruler.GetName] [Select_CString(new_ruler.IsFemale, 'зійшла', 'зійшов')] на престол, [target.GetLongName] та [ROOT.GetCountry.GetName] знову об’єдналися під владою єдиного правителя з дому #TOOLTIP:DYNASTY,$hafsid_dynasty_tt$,X #L Хафсідів#!#!. Сподіваймося, що незабаром Іфрикія знову возз’єднається й назавжди забуде про згубну для себе #TOOLTIP:SOCIETAL_VALUE,centralization_vs_decentralization,X #L самоврядність#!#!."
  flavor_tun.16.a: "Ще на один крок ближче до єдиної країни."
  flavor_tun.16.b: "[ROOT.GetCountry.Custom('common_string_positive')]"
  tun_target_was_annexed_tt: "Країна [target.GetName] була [Concept('annexed', 'поглинена')|e] країною [ROOT.GetCountry.GetName]"
  flavor_tun.17.title: "Суперечка про престолонаслідування [from_country.Custom('preposition_uv')] [from_country.Custom('CL_PREP')]"
  flavor_tun.17.desc: "[from_country.GetGovernment.GetEstateName('burghers_estate')] у [from_country.GetCapital.Custom('LR_PREP')|l] [from_country.GetCapital.GetName] запропонува[from_country.Custom('burghers_vlaloly')] свою широку підтримку, чому [target_character2.GetShortNameWithNoTooltip] [Select_CString(target_character2.IsFemale, 'неймовірно зраділа', 'неймовірно зрадів')], бо завдяки їй [Select_CString(target_character2.IsFemale, 'вона стала номінальною правителькою', 'він став номінальним правителем')] країни. При цьому [new_ruler.GetNameWithNoTooltip] [Select_CString(new_ruler.IsFemale, 'втратила', 'втратив')] належний [Select_CString(new_ruler.IsFemale, 'їй', 'йому')] спадок, а ми — [Select_CString(new_ruler.IsFemale, 'її як нашу правительку', 'його як нашого правителя')]."
  flavor_tun.17.a: "Ми цього не потерпимо!"
  flavor_tun.17.b: "Є важливіші справи."
  flavor_tun.18.title: "Андалуськ[Select_CString(target_character.IsFemale, 'а аристократка', 'ий аристократ')]"
  flavor_tun.18.desc: "[Select_CString(target_character.IsFemale, 'Місцева андалуська аристократка', 'Місцевий андалуський аристократ')], що [Select_CString(target_character.IsFemale, 'народилася й виросла', 'народився й виріс')] в області [target_character.GetBirthLocation.GetArea.GetName], нещодавно [Select_CString(target_character.IsFemale, 'просунулася', 'просунувся')] по службі й [Select_CString(target_character.IsFemale, 'здобула', 'здобув')] місце при [ROOT.GetCountry.GetAdjective|l]ому дворі у [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName]. Ймовірно, незабаром [target_character.GetName] стане [Select_CString(target_character.IsFemale, 'однією', 'одним')] із [Select_CString(target_character.IsFemale, 'представниць', 'представників')] #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалуської#!#! знаті [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  flavor_tun.18.a: "Чудово!"
  flavor_tun.19.title: "[Select_CString(target_character.IsFemale, 'Нова спадкоємиця', 'Новий спадкоємець')]?"
  flavor_tun.19.desc: "Останнім часом вулицями [ROOT.GetCountry.GetCapital.Custom('LR_GEN')|l] [ROOT.GetCountry.GetCapital.GetName] ширяться різні чутки та пересуди. [ROOT.GetCountry.GetCapital.GetRank.GetName] обговорює те, як править [target_character2.GetName], і хто міг би [Select_CString(target_character2.IsFemale, 'їй', 'йому')] успадкувати. [ShowEstateTypeName('burghers_estate')] висунули гідного кандидата — [target_character.GetName]. На їхню думку, [Select_CString(target_character.IsFemale, 'вона', 'він')] стане [Select_CString(target_character.IsFemale, 'гідною спадкоємицею', 'гідним спадкоємцем')] [ROOT.GetCountry.GetAdjective|l]ого престолу. Подейкують, [ShowEstateTypeNameWithNoTooltip('burghers_estate')|l] спокусилися на [Select_CString(target_character.IsFemale, 'її', 'його')] щедрі обіцянки нових привілеїв та прав."
  flavor_tun.19.a: "Що ж, нехай [target_character.GetNameWithNoTooltip] стане [Select_CString(target_character.IsFemale, 'спадкоємицею', 'спадкоємцем')]."
  flavor_tun.19.b: "Лише дурні можуть у це повірити."