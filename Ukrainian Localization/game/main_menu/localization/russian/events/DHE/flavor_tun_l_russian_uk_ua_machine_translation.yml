l_russian:
  flavor_tun.1.desc: "$ibn_khaldun_patronage$"
  flavor_tun.1.entry: "$flavor_gra.5.title$"
  flavor_tun.1.a: "Чудово."
  flavor_tun.1.b: "Це марна трата коштів!"
  tun_have_more_gp_score_than_us: "No [ShowReligionAdjective('sunni')] [country|e] has more [great_power_score|e] than [THIS.GetCountry.GetName]"
  flavor_tun.2.caliphal_backstory: "Наша країна постала під час розпаду [GetCountry('ALM').GetAdjective] халіфату. Саме тоді засновник династії [ShowDynastyName('hafsid_dynasty')], вельмишановний Абу Закарія, прийняв титул #italic«Амір аль-Мумінін»#!, узявши на себе роль $rank_empire_muslim_ruler_male$, і #italic де-факто#! проголосив незалежність. Ці домагання негайно визнала династія [ShowDynastyName('nasrid_dynasty')] у [ShowCountryNameIfActive('GRA')], а також правителі інших [ShowCultureName('andalusi')] міст. Коли виникли держави [ShowCountryNameIfActive('TLE')] та [ShowCountryNameIfActive('MOR')], вони теж незабаром визнали наші права. Нашу владу поважають навіть у священному місті [ShowLocationName('mecca')], де шариф визнав наші домагання на халіфат у 1259 році, після недавнього падіння Аббасидів під навалою монголів."
  flavor_tun.2.title: "Ослаблення халіфату"
  flavor_tun.2.entry: "$flavor_tun.2.title$"
  flavor_tun.2.desc: "$flavor_tun.2.caliphal_backstory$\n\nСьогодні від тієї колишньої пишноти мало що зосталося. Наші внутрішні негаразди вкрай послабили владу нашого володаря: [ROOT.GetCountry.GetGovernment.GetRulerTitle] є халіфом лише за назвою. Ми мусимо повернути халіфську владу [ROOT.GetCountry.Custom('longname_ua_DAT')]!"
  flavor_tun.2.a: "Ми змусимо їх поважати нас!"
  flavor_tun.2.b: "Зректися титулу."
  tun_caliphate_decision_enabled: "Відкриває [ShowDecisionName('hafsid_caliphate_decision')] [decision|e]"
  flavor_tun.3.title: "Відновлення влади халіфа"
  flavor_tun.3.desc: "$flavor_tun.2.caliphal_backstory$\n\nПопри те, що ця влада похитнулася в наступному столітті, нам удалося вивести [ROOT.GetCountry.Custom('longname_ua_ACC')] із забуття. [ROOT.GetCountry.GetFlavorRank] знову посі[ROOT.GetCountry.Custom('endrank_vlaloly')] чільне місце серед провідних країн у [ROOT.GetCountry.GetReligion.GetGroup.GetAdjective|l]ому світі."
  flavor_tun.3.a: "Ми подбаємо про #italic умму#!!"
  hafsid_caliphate_name_tt: "До нашої назви увійде титул #Y халіфат#!"
  hafsid_caliphate_decision.title: "$flavor_tun.3.title$"
  hafsid_caliphate_decision.entry: "$flavor_tun.3.title$"
  hafsid_caliphate_decision.desc: "$flavor_tun.3.desc$"
  hafsid_caliphate_decision.desc.entry: "We failed to secure ourselves as the successors to the [GetCountry('ALM').GetAdjective] Caliphate. This cannot stand! Our spot as the heads of the [ShowReligionAdjective('sunni')] community must be reclaimed!"
  hafsid_caliphate_decision.a: "$flavor_tun.3.a$"
  flavor_tun.4.title: "Спадкоємство [aging_monarch.GetNameWithNoTooltip]"
  flavor_tun.4.entry: "Спадкоємство [GetCharacter('tun_abu_yahya_abu_bakr_ii').GetNameWithNoTooltip]"
  flavor_tun.4.desc: "[aging_monarch.GetName] дедалі більше переймається найпохмурішим, але й найважливішим рішенням, яке доводиться ухвалювати монарху на схилі літ: призначенням свого наступника. Здавалося б, вибір має бути очевидним, адже [preferred_heir.GetName] завжди [Select_CString(preferred_heir.IsFemale, 'була улюбленицею', 'був улюбленцем')], [Select_CString(preferred_heir.IsFemale, 'яку', 'якого')] щиро люби[Select_CString(aging_monarch.IsFemale, 'ла', 'в')] наш дорогий [ROOT.GetCountry.GetGovernment.GetRulerTitle]. Втім, [aging_monarch.GetName] має й інших дітей: [future_usurper.GetName], що допомагає у врядуванні в столиці [ROOT.GetCountry.GetCapital.GetName], та [third_way.GetName] із #ONCLICK:COUNTRY,[target_country2.GetKey] #TOOLTIP:COUNTRY,[target_country2.GetKey],X [target_country2.Custom('CL_GEN')|L]#!#! — [Select_CString(third_way.IsFemale, 'можлива претендентка', 'можливий претендент')] на престол.\n\nЦей вибір глибоко вплине на стабільність [ROOT.GetCountry.Custom('longname_ua_GEN')] ще довго після того, як піде з життя [aging_monarch.GetShortNameWithNoTooltip]."
  flavor_tun.4.a: "Нехай [preferred_heir.GetNameWithNoTooltip] із [target_country.GetNameWithNoTooltip] візьме владу."
  flavor_tun.4.a.entry: "Нехай [GetCharacter('tun_abu_l_abbas_ahmad').GetNameWithNoTooltip] із $GFS$ візьме владу."
  flavor_tun.4.b: "[future_usurper.GetNameWithNoTooltip] — безпечний вибір."
  flavor_tun.4.b.entry: "[GetCharacter('tun_abu_hafs_umar').GetNameWithNoTooltip] — безпечний вибір."
  flavor_tun.4.c: "[third_way.GetNameWithNoTooltip] допоміг би об'єднати володіння."
  flavor_tun.4.c.entry: "[GetCharacter('tun_abu_zakariya_yahya').GetNameWithNoTooltip] допоміг би об'єднати володіння."
  TUN_THIS_will_be_appointed_heir_tt: "[THIS.GetCharacter.GetName] буде призначено як [heir|e] [ROOT.GetCountry.GetName]"
  TUN_unite_two_realms_tt: "Оскільки [THIS.GetCharacter.GetName] є [ruler|e] країни-[ShowSubjectTypeName('familial_governor')] у складі [THIS.GetCharacter.GetCourtCountry.GetName], коли [THIS.GetCharacter.GetSheHe] зійде на престол, обидві країни об'єднаються"
  TUN_civil_war_from_preferred_heir_tt: "Оскільки [preferred_heir.GetName] є бажаним спадкоємцем, [preferred_heir.GetSheHe] незабаром розпочне [war|e] за підтримки стану «[ShowEstateTypeName('tribes_estate')]», через що наші [locations|e], розташовані в [ShowScriptedGeographyName('gafsa_sphere_of_influence_geography')], перейдуть на інший бік"
  TUN_abu_hafs_will_try_to_start_a_civil_war_tt: "[usurper_scope.GetName] може спробувати захопити престол, який посідає [THIS.GetCharacter.GetName]"
  TUN_we_will_succeed_when_target_ruler_dies_tt: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] зійде на престол #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_GEN')|L]#!#!, об’єднавши обидві країни під [from_country.GetAdjectiveWithNoTooltip|l]им стягом"
  flavor_tun.5.title: "Призначення в [from_country.GetNameWithNoTooltip]"
  flavor_tun.5.desc_positive: "Чудові новини! [aging_monarch.GetName] із [from_country.GetLongName] щойно призначив [preferred_heir.GetName] спадкоємцем [aging_monarch.GetHerHis] [from_country.GetFlavorRank]. Це не дивно, адже [preferred_heir.GetShortNameWithNoTooltip] уже давно вважається очікуваним наступником. Із таким правителем при владі майбутнє [ShowScriptedGeographyName('ifriqiya_geography')] бачиться світлим."
  flavor_tun.5.desc_negative: "Хай йому грець! Нечуваним рішенням [aging_monarch.GetName] із [from_country.GetName] щойно призначив [appointed_heir.GetName] наступником замість [aging_monarch.GetHerHim]. В [ShowScriptedGeographyName('ifriqiya_geography')] добре відомо, що [preferred_heir.GetName] — найулюбленіший кандидат і природний спадкоємець, тож, вочевидь, сталося щось незаконне, аби [appointed_heir.GetNameWithNoTooltip] здобув титул спадкоємця."
  flavor_tun.5.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  flavor_tun.5.b: "[preferred_heir.GetNameWithNoTooltip] не терпітиме цього!"
  flavor_tun.5.c: "Нам доведеться змиритися з цим."
  flavor_tun.6.title: "Очікувана відповідь"
  flavor_tun.6.desc: "Як і очікувалося, призначення [appointed_heir.GetName] не сподобалося [preferred_heir.GetName], який поквапився оскаржити це рішення. Спираючись на підтримку стану «[ShowEstateTypeName('tribes_estate')]», [target_country.GetName] оголосив війну за престол [ROOT.GetCountry.Custom('CL_ACC')], і війська [preferred_heir.GetShortNameWithNoTooltip] вже прямують до [ROOT.GetCountry.GetCapital.GetName]."
  flavor_tun.6.a: "[ROOT.GetCountry.Custom('common_string_negative')]."
  GFS_will_receive_following: "Якщо [target_country.GetName] вирішить розпочати [war|e] через це:"
  flavor_tun.7.title: "Захоплення престолу!"
  flavor_tun.7.desc: "Попри те, що [target_character2.GetName] було призначено спадкоємцем [from_country.GetLongName], їхній непокірний брат/сестра [target_character.GetName] вирішив(ла) скористатися теперішнім становищем [target_character.GetHerHis] у столиці, щоб захопити владу над [from_country.GetFlavorRank]. Це безсумнівно розгніває [target_character2.GetShortNameWithNoTooltip] з [target_country.GetName], який(яка) неодмінно візьметься за зброю проти [target_character.GetHerHis] [target_character2.GetSisterBrother]."
  flavor_tun.7.a: "Хто перший прийшов, той і отримав."
  flavor_tun.7.b: "Це обурливо! Це несправедливо!"
  flavor_tun.8.title: "$flavor_tun.7.title$"
  flavor_tun.8.desc: "Законні права на престол [from_country.Custom('longname_ua_GEN')], що їх має [target_character2.GetName], зухвало узурпува[Select_CString(target_character.IsFemale, 'ла', 'в')] [target_character2.GetHerHis] [target_character.GetSisterBrother], [target_character.GetName], [Select_CString(target_character.IsFemale, 'яка', 'який')] без зволікань захопи[Select_CString(target_character.IsFemale, 'ла', 'в')] владу над [from_country.Custom('rank_ua_INST')], де [Select_CString(target_character.IsFemale, 'їй', 'йому')] тепер підкоряється [from_country.GetGovernment.GetCourtTitle].\n\nЦе принизливо — що чесне ім’я, яке має [target_character2.GetShortNameWithNoTooltip], виявилося так заплямованим! Ми мусимо домогтися, щоб [target_character.GetShortNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'зазнала', 'зазнав')] заслуженої кари."
  flavor_tun.8.a: "До бою!"
  flavor_tun.8.b: "Ми не можемо дозволити собі воювати."
  flavor_tun.10.title: "Еміризм"
  flavor_tun.10.entry: "$flavor_tun.10.title$"
  flavor_tun.10.desc: "[ShowScriptedGeographyName('ifriqiya_geography')] — це кубло беззаконня й пороку. Упродовж майже століття [ROOT.GetCountry.GetLongName] та його підлеглі з [ShowDynastyName('hafsid_dynasty')] не могли встановити контроль за межами міст, що призвело до повсюдних заворушень і злочинності в сільських провінціях. Та все ж промінь надії осяває знатних людей [ShowCultureName('andalusi')] та провідних шейхів [ShowEstateTypeName('nobles_estate')] — це ідеологія еміризму, яка проголошує майбутнє, в якому один регіональний емір правитиме всім [ShowAreaName('tunis_area')], знову ведучи його до процвітання."
  flavor_tun.10.a: "Нехай [ROOT.GetCountry.GetReligion.GetGodName] вкаже нам шлях."
  flavor_tun.10.a.entry: "Нехай $muslim_god_name$ вкаже нам шлях."
  tun_info_about_tunis_decentralization: "Нам слід якнайшвидше скасувати [ShowGovernmentReformName('tun_strong_familial_governors')] [government_reform|e]"
  tun_additional_benefits_for_farfanes_tt: "Привілей [ShowEstatePrivilegeName('catalan_merchant_privileges')] надаватиме до #Y +0.25#! [ShowModifierTypeName('monthly_towards_centralization')] залежно від чисельности наших [ShowUnitDefinitionName('a_farfanes')]"
  flavor_tun.11.title: "[ShowScriptedGeographyNameWithNoTooltip('ifriqiya_geography')], возз’єднана"
  flavor_tun.11.desc: "Проблему роздроблености [ROOT.GetCountry.Custom('longname_ua_GEN')] подолано в самому зародку. Доба порядку «[ShowGovernmentReformName('tun_strong_familial_governors')]» добігла кінця, і вся #TOOLTIP:SCRIPTED_GEOGRAPHY,ifriqiya_geography #L Іфрікія#!#! знову об’єднана під знаменами дому [ROOT.GetCountry.GetGovernment.GetRulerOrHeirIfRegent.GetDynasty.GetName]. [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]і села більше не потерпатимуть від розгулу злочинности; [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]і еміри більше не зазнаватимуть погроз від #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L вельмож#!#!; [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]а країна більше не залежатиме від підтримки чужоземних сил.\n\nНастав час розплати для старого порядку й чудова нагода для нас розпочати нову добу."
  flavor_tun.11.a: "Починається нова доба."
  flavor_tun.11.b: "Народження нової ідентичності."
  IFRIQIYA_NAME: "Іфрікія"
  IFRIQIYA_NAME_ADJ: "$IFRIQIYA_NAME$"
  ifriqiya_reunited_decision.title: "$flavor_tun.11.title$"
  ifriqiya_reunited_decision.entry: "$flavor_tun.11.title$"
  ifriqiya_reunited_decision.desc: "$flavor_tun.11.desc$"
  ifriqiya_reunited_decision.desc.entry: "Надто довго [ShowScriptedGeographyName('ifriqiya_geography')] залишалася розділеною на безліч країн, багатьма з яких правили гілки дому #TOOLTIP:DYNASTY,$hafsid_dynasty_tt$,X #L Хафсідів#!#!. Ми більше не можемо миритися з цією роздробленістю."
  ifriqiya_reunited_decision.a: "$flavor_tun.11.a$"
  flavor_tun.12.title: "Зростання піратства в [ShowLocationNameWithNoTooltip('bejaia')]"
  flavor_tun.12.entry: "$flavor_tun.12.title$"
  flavor_tun.12.desc: "В останні роки [target_location.GetName] став свідком розростання вельми незвичного, але дуже прибуткового промислу — піратства в [ShowScriptedGeographyName('mediterranean_sea_geography')]. Ось уже багато десятиліть місцеві шейхи всіляко підтримують [ShowBuildingTypeName('pirate_haven')] та його не такі вже й таємні набіги на [ShowReligionGroupAdjective('christian')] села, попри наявні торгові зв’язки. Подібні набіги дійсно шкодять нашим стосункам із потенційними торговими партнерами, але прибуток, який ми отримуємо завдяки політиці «[ShowPolicyName('state_piracy_policy')]», не можна недооцінювати."
  flavor_tun.12.a: "Вони вороги [ROOT.GetCountry.GetReligion.GetGodName]!"
  flavor_tun.12.a.entry: "Вони вороги $muslim_god_name$!"
  flavor_tun.12.b: "Як скажете."
  flavor_tun.12.c: "Піратство не принесе нам нічого доброго."
  flavor_tun.13.title: "Господарський зашморг"
  flavor_tun.13.entry: "$flavor_tun.13.title$"
  flavor_tun.13.desc: "[ShowReligionGroupAdjective('christian')]і купці [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! уже здобули широкі права завдяки реформі «[ShowGovernmentReformName('catalan_merchant_privileges')]». Попри це, попри подвір’я, які ми так щедро їм надали, змогу судитися власним судом та свободу віросповідання, яку ми їм забезпечили, [target_country.GetAdjective|l][target_country.Custom('burghers_yiaei')] [target_country.GetGovernment.GetEstateName('burghers_estate')] однаково вимага[target_country.Custom('burghers_yeyut')] більшого — інакше їхня рідна країна може взагалі припинити вести з нами будь-які справи."
  flavor_tun.13.a: "Найманці надто важливі для нас."
  flavor_tun.13.b: "Ба! Нам не потрібні їхні послуги."
  tun_economic_stranglehold_tt: "[ShowModifierTypeName('global_merchant_power')] у привілеї «[ShowEstatePrivilegeName('catalan_merchant_privileges')]» збільшиться на #R -10.0%#!"
  flavor_tun.14.title: "Вимога родича"
  flavor_tun.14.desc: "Один із принців роду [ShowDynastyName('hafsid_dynasty')], [target_character.GetName], здобув достатньо впливу, аби вимагати посаду [ShowSubjectTypeName('familial_governor')]. Якщо ми не поступимося й не надамо [target_location.GetName] [target_character.GetNameWithNoTooltip], це неодмінно спричинить заворушення в [ROOT.GetCountry.GetLongName]."
  flavor_tun.14.a: "Нехай [target_character.GetHerHim] отримає це!"
  flavor_tun.14.b: "Зараз невідповідний час."
  tun_target_character_expects_a_governorship_tt: "[target_character.GetName] сподівається стати [ShowSubjectTypeName('familial_governor')], і доки [target_character.GetSheHe] не здобуде цю посаду через [ShowCharacterInteractionName('assign_familial_governor')], у [target_character.GetSheHe] зберігатиметься змога знову викликати цю [event|e]"
  flavor_tun.15.title: "Суперечка про престолонаслідування"
  flavor_tun.15.desc: "Смерть старого [old_ruler.GetName] залишила порожнечу у владі в [ROOT.GetCountry.GetCapital.GetName]. Формально [new_ruler.GetName] має стати правителем у [ROOT.GetCountry.GetName], однак спадкоємність аж ніяк не гарантована. Народне повстання, підтримуване невідомою силою, зараз рухається вулицями столиці, намагаючись забезпечити престолонаслідування для [target_character2.GetName]. Чи підтримаємо ми законного спадкоємця, чи дозволимо [ShowEstateTypeName('burghers_estate')] домогтися свого?"
  flavor_tun.15.a: "[new_ruler.GetNameWithNoTooltip] — законний спадкоємець!"
  flavor_tun.15.b: "Ми маємо дослухатися до повсталих."
  flavor_tun.16.title: "Престолонаслідування [target.GetNameWithNoTooltip]"
  flavor_tun.16.desc: "Зі сходженням на престол [new_ruler.GetName] землі [target.GetLongName] та [ROOT.GetCountry.GetName] знову об’єднані під владою єдиного центрального правителя з династії [ShowDynastyName('hafsid_dynasty')]. Сподіваймося, що [ShowScriptedGeographyName('ifriqiya_geography')] незабаром возз’єднається й більше не потерпатиме від важкої [ShowSocietyDirectionName('decentralization')]."
  flavor_tun.16.a: "Ще один крок до єдности."
  flavor_tun.16.b: "[ROOT.GetCountry.Custom('common_string_positive')]"
  tun_target_was_annexed_tt: "[target.GetName] був [Concept('annexed', 'приєднаний')|e] до [ROOT.GetCountry.GetName]"
  flavor_tun.17.title: "Суперечка про престолонаслідування в [from_country.GetNameWithNoTooltip]"
  flavor_tun.17.desc: "Заручившись достатньою підтримкою серед [from_country.GetGovernment.GetEstateName('burghers_estate')] у [from_country.GetCapital.GetName], [target_character2.GetShortNameWithNoTooltip] став номінальним правителем країни, тим самим фактично позбавивши [new_ruler.GetNameWithNoTooltip] законної спадщини, а нас — їхнього проводу."
  flavor_tun.17.a: "Ми цього не потерпимо!"
  flavor_tun.17.b: "Нас турбують важливіші справи."
  flavor_tun.18.title: "Іменитий [ShowCultureNameWithNoTooltip('andalusi')]"
  flavor_tun.18.desc: "Місцевий(а) [target_character.GetWomanMan] [ShowCultureName('andalusi')] походження, народжений(а) і вихований(а) у [target_character.GetBirthLocation.GetArea.GetName], нещодавно просунувся(лася) по службі й увійшов(ла) до [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetGovernment.GetCourtTitle] у [ROOT.GetCountry.GetCapital.GetName]. Схоже, що [target_character.GetName] незабаром стане одним із членів [ShowEstatePrivilegeName('andalusi_elite')] нашого [ROOT.GetCountry.GetFlavorRank]."
  flavor_tun.18.a: "Чудово!"
  flavor_tun.19.title: "Новий претендент на престол?"
  flavor_tun.19.desc: "Останнім часом вулиці [ROOT.GetCountry.GetCapital.GetName] повняться чутками та пересудами. [ROOT.GetCountry.GetCapital.GetRank.GetName] обмірковує правління [target_character2.GetName] і розмірковує, хто міг би стати гідним наступником [target_character2.GetHerHim]. [ShowEstateTypeName('burghers_estate')] обрали визначну особу — [target_character.GetName], — яку вважають належним спадкоємцем престолу [ROOT.GetCountry.GetName]. Подейкують, що [ShowEstateTypeNameWithNoTooltip('burghers_estate')] спокусилися щедрими обіцянками [target_character.GetHerHis] про привілеї та додаткові права."
  flavor_tun.19.a: "Що ж, призначмо [target_character.GetNameWithNoTooltip]."
  flavor_tun.19.b: "Дурні, якщо вірять у це."