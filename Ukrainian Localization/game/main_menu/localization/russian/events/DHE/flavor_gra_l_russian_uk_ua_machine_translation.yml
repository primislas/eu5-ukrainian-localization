l_russian:
  flavor_gra.1.title: "Мавританські біженці"
  flavor_gra.1.desc: "Гранада впала під натиском невірних! Останній оплот знань та перлина Аль-Андалусу тепер у руках кастильців. Поки ісламський світ оговтується від потрясіння, мавританські біженці стікаються до мусульманських міст Північної Африки та Близького Сходу, привозячи з собою рукописи таких видатних учених, як Ібн Рушд, Абуль-Касім аз-Заграві та Ібн Туфайль. Запросивши їх до #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, ми прискоримо розвиток науки та мистецтва."
  flavor_gra.1.a: "Звісно, нехай приїжджають!"
  flavor_gra.1.a.entry: "Звісно, нехай приїжджають до нас!"
  flavor_gra.1.b: "Ні. Ми не потребуємо їх"
  flavor_gra.2.title: "Сицилійський емірат"
  flavor_gra.2.entry: "$flavor_gra.2.title$"
  flavor_gra.2.desc: "У минулому Сицилійський емірат сотні років служив бастіоном нашої віри, але в 1087 році хрестоносці все-таки захопили острів.\n\nТепер ці заповітні землі належать нам, і ми не повинні їх втратити!"
  flavor_gra.2.a: "Для абсолютного контролю потрібна абсолютна влада."
  STATIC_MODIFIER_NAME_sicily_in_safe_hands: "Зміцнення влади"
  STATIC_MODIFIER_NAME_DESC_sicily_in_safe_hands: "Завдяки безпосередньому контролю над Сицилією ми можемо вкладати більше коштів у розвиток та добробут острова."
  flavor_gra.3.title: "Допомога [GetCountry('TUR').Custom('CL_GEN')]"
  flavor_gra.3.entry: "Прохання про османську підтримку"
  flavor_gra.3.desc: "Війна проти #ONCLICK:COUNTRY,[GetCountry('CAS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('CAS').GetKey],X [GetCountry('CAS').Custom('CL_GEN')|L]#!#! може обернутися для нас катастрофою, тому має сенс попросити підтримки в наших братів у вірі. Можливо, дім [GetCountry('TUR').GetGovernment.GetRuler.GetDynasty.GetName] відповість на наш заклик, якщо ми поступимося своєю гордістю та звернемося до них по допомогу…"
  flavor_gra.3.a: "Це наша єдина надія!"
  flavor_gra.3.tt: "[GetCountry('TUR').GetNameWithNoTooltip] може захистити нас від [GetCountry('CAS').Custom('CL_GEN')]"
  flavor_gra.3.b: "Ми впораємося самі."
  flavor_gra.3.historical_info: "Насрідські правителі Гранади відправили послів до османів та мамлюків, щоб попросити їхньої підтримки в боротьбі проти Кастилії. У той час османи саме розширювали свою присутність у західному Середземномор'ї, тому влада Гранади розраховувала, що вони погодяться відправити 200 000 турецьких вояків до Валенсії для відбиття християнської загрози."
  flavor_gra.4.title: "Пригнічуюча відповідь"
  flavor_gra.4.entry: "$flavor_gra.4.title$"
  flavor_gra.4.desc: "[GetCountry('TUR').GetName] повідоми[GetCountry('TUR').Custom('end_vlaloly')], що #italic не зможуть#! нам допомогти, оскільки у них є більш нагальні справи. У своєму листі вони схвально відгукуються про Аль-Андалус та його колишню славу, але, на жаль, від цих слів мало користі…"
  flavor_gra.4.a: "Ми не здамося!"
  flavor_gra.4.historical_info: "Правителі Гранади до останнього сподівалися на допомогу османів та мамлюків, проте ті невдовзі загрузли у війні між собою, тому не могли надати жодної суттєвої підтримки на полі бою. Проте турки задіяли свій флот, який під командуванням Кемаль-реїса почав влаштовувати набіги на кастильські володіння в західному Середземномор'ї, а надалі допомагав перевозити мусульманських біженців з Іспанії."
  ibn_khaldun_patronage: "До нашого двору прибула людина видатного розуму — знаменитий вчений та філософ [target_character.GetName], який потребує нашої опіки, щоб продовжити свої праці та дослідження. Він багато писав про врядування, господарство, а також розквіт та занепад імперій, тому [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] тільки виграє від його присутности. Нам не завадив би такий мудрий порадник. Чи варто нам надати йому заступництво?"
  flavor_gra.5.title: "[target_character.GetNameWithNoTooltip] просить про покровительство"
  flavor_gra.5.entry: "Ібн Хальдун просить про заступництво"
  flavor_gra.5.desc: "$ibn_khaldun_patronage$"
  flavor_gra.5.a: "Славно."
  flavor_gra.5.b: "Це марна трата коштів!"
  flavor_gra.6.title: "Перлина протоки"
  flavor_gra.6.entry: "$flavor_gra.6.title$"
  flavor_gra.6.desc: "Нам надійшло донесення від #italic валі#! [target_location.Custom('LR_GEN')|l] [target_location.GetName]: мури як і раніше міцні, у гавані не проштовхнутися від кораблів, а грошей до нашої скарбниці за цей місяць надійшло більше, ніж за весь рік — з інших місцевостей [ROOT.GetCountry.Custom('rank_ua_GEN')|l]. З алькасаби, увінчаної фортецею Гібральфаро, погожого ранку відкривається чудовий краєвид на протоку, і нехай наш [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] знайде спокій у цьому знанні.\n\n[ROOT.GetCountry.GetCapital.GetName] забезпечує нам місце на престолі, а [target_location.GetNameWithNoTooltip] — майже всю решту: податкові надходження від кораблів, що входять у гавань, близькість #L [GetCountry('GEN').GetAdjective|l]их#! торгових представництв, які воліють залишатися тут на зимівлю, та безліч солодкого міцного вина з глибини краю — воно зажило слави навіть [GetCountry('FLA').Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[GetCountry('FLA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('FLA').GetKey],X [GetCountry('FLA').Custom('CL_PREP')|L]#!#!. Якщо ми раптом втратимо це місто, ніщо не зможе надолужити нам таку втрату.\n\nСаме в цьому, втім, і зацікавлені наші суперники. За гаванню вже два покоління поспіль пильно стеж[GetCountry('CAS').Custom('end_ytat')] [GetCountry('CAS').GetName], але ворог може вдарити й зсередини: не один наш попередник, піднісши своє знамено на мури цієї фортеці, згодом змушений був відбивати твердиню в бунтівників."
  flavor_gra.6.a: "Ми боронитимемо Малаку так само відчайдушно, як боронимо корону."
  flavor_gra.6.historical_info: "Малака (Малага) — друге за величиною місто Гранадського емірату, один із найважливіших середземноморських портів для ісламських країн Середньовіччя. Після того як у 1239 році Насріди приєднали до себе залишки останньої тайфи доби Хаммадідів, влада над містом зосередилася в руках #italic валі#! — намісника, призначуваного безпосередньо султаном. Першим валі Малаки став Ісмаїл, брат Мухаммада I. Згодом валі за звичаєм обиралися з-поміж близьких родичів султана, а строк їхніх повноважень був майже не обмежений.\n\nНаріжним каменем оборони Малаки була алькасаба — розташована на пагорбі фортеця, що виходила на гавань. Незабаром її доповнила фортеця Гібральфаро, збудована вище від алькасаби та з’єднана з нею проходом — корачею. З фортечних мурів варта могла спостерігати за кораблями в Гібралтарській протоці — їх було видно задовго до входу в порт. У розташованих у низині #italic фундуках#! — заїжджих дворах — зупинялися генуезькі, каталонські та магрибські купці. Митні збори, що стягувалися в порту Малаки, становили основну статтю доходів насрідської скарбниці.\n\nКрам із Малаки постачався навіть до таких далеких країн, як Фландрія та Єгипет. Значним попитом на європейських ринках користувалися андалузький шовк, люстрова кераміка, сушені фіги та родзинки з Ахаркії, а також солодке міцне вино. З корабелень Ґвадалмедіни на воду сходили насрідські галери, які патрулювали затоку разом із маринідськими кораблями.\n\nПосада правителя Малаки була, однак, пов’язана з великим ризиком: від неї до престолу залишався лише один крок, і в роки роздробленості заколоти підіймали зазвичай саме місцеві валі. У 1359 році над містом замайоріли знамена Мухаммада VI — «малинового султана», а в 1487 році Малака остаточно впала під натиском католицьких монархів. З її завоюванням завершилася доба Аль-Андалусу, а за півдесятиліття впала й Гранада."
  flavor_gra.9.entry: "$flavor_gra.9.title$"
  flavor_gra.9.title: "Юдеї-сефарди"
  flavor_gra.9.desc: "[ShowReligionName('judaism')|U] — віра, далеко не чужа жителям #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!: у її квітучих містах склалися цілі громади послідовників цього віросповідання, і дехто з них уже всерйоз має намір перетворити #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_ACC')|l]#!#! [target_location.GetName] на надійний прихисток для одновірців, де вони не зазнаватимуть переслідувань та принижень.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] розходиться в думках: дехто підтримує це починання, інші ж, менш терпимі в питаннях віри, вважають такі зазіхання спробою потоптати все святе, що тільки є в [ROOT.GetCountry.Custom('rank_ua_PREP')|l], і що [target_location.Custom('LR_ACC')|l] [target_location.GetNameWithNoTooltip] необхідно захистити від морального занепаду."
  flavor_gra.9.a: "Ми захищатимемо права юдеїв."
  flavor_gra.9.b: "Невірні ніколи не житимуть у мирі, [ROOT.GetCountry.GetReligion.GetGodName] тому свідок!"
  gra_jewish_people_in_target_location_become_unhappy: "Кожна #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейська#!#! [Concept('pop', 'громада')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] отримає [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] до задоволення"
  flavor_gra.10.entry: "Нашого правителя вбито"
  flavor_gra.10.title: "[target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale,'убита', 'убитий')]"
  flavor_gra.10.desc: "У #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! сталася трагедія!\n\nНевідомий шаленець, дочекавшись, коли [target_character.GetName] завершить молитву у [target_location.Custom('LR_PREP')|l] [target_location.GetName], напав на [Select_CString(target_character.IsFemale, 'неї', 'нього')] та завдав кількох жахливих ударів. Навіть найкращі придворні лікарі виявилися безсилими зцілити страшні рани, і лише за кілька годин [Select_CString(target_character.IsFemale, 'нещасну', 'нещасного')] спіткала смерть.\n\nНаш [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] у жалобі. Дехто певен, що напад було підлаштовано заздалегідь: за їхніми словами, супротивники [Select_CString(target_character.IsFemale, 'убитої', 'убитого')] зумисне відвернули увагу [Select_CString(target_character.IsFemale, 'її', 'його')] охоронців, щоби вбивця міг скористатися нагодою. Правди, втім, не знає ніхто. Краще не ворушити минуле."
  flavor_gra.10.a: "Що тепер буде з [ROOT.GetCountry.Custom('CL_INST')]?"
  leader_is_scarred: "#Y [target_character.GetName] виживає, але залишається зі шрамами#!"
  leader_dies: "#Y [target_character.GetName] не виживає#!"
  flavor_gra.11.entry: "$flavor_gra.11.title$"
  flavor_gra.11.title: "Гранадський шовк"
  flavor_gra.11.desc: "Вироблений [ROOT.GetCountry.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! #TOOLTIP:GOODS,silk,X #L шовк#!#! — найуславленіший у #TOOLTIP:CONTINENT,europe,X #L Європі#!#!. Чужоземні купці шикуються в чергу за цим крамом, щоби #TOOLTIP:LOCATION,genoa,X #L генуезька#!#!, #TOOLTIP:LOCATION,venice,X #L венеційська#!#! та навіть #TOOLTIP:LOCATION,prague,X #L празька#!#! #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знать#!#! могла задовольнити свою потребу в розкошах. Для нас таке становище, ясна річ, більш ніж вигідне.\n\nПроте вигода може бути не лише грошовою: наш[ROOT.GetCountry.Custom('burghers_aei')|l] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] пропону[ROOT.GetCountry.Custom('burghers_yeyut')] поширити торгівлю шовком на весь світ, аби спонукати й інші країни купувати наш крам, а отже — монополізувати торгівлю ним. Водночас зросте й слава нашої країни."
  flavor_gra.11.a: "Гранадський шовк знатимуть у всьому світі!"
  unlock_expand_iberian_silk_decision: "Буде відкрито [Concept('decision', 'рішення')|e] «$gra_expand_seda_de_granada.title$». Для його ухвалення потрібно завоювати [ShowLocationName('murcia')]"
  flavor_gra.12.entry: "$flavor_gra.12.title$"
  flavor_gra.12.title: "Торгова вигода"
  flavor_gra.12.desc: "Наш #TOOLTIP:GOODS,silk,X #L шовк#!#! славиться на всю #TOOLTIP:CONTINENT,europe,X #L Європу#!#!. [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|U] з усіх куточків #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! прагн[ROOT.GetCountry.Custom('burghers_eut')] не лише заробити на його продажу, а й показати всьому світові неперевершену якість наших виробів. Оскільки зробити це самотужки неможливо, вони звернулися до нас із проханням торувати нові торгові шляхи, які сприятимуть не лише збереженню товарообміну, а й підтримці доброго імені та слави нашої країни в усьому, що стосується торгівлі шовком."
  flavor_gra.12.a: "Спробуймо збільшити купецькі засоби за допомогою дипломатії."
  flavor_gra.13.entry: "$flavor_gra.13.title$"
  flavor_gra.13.title: "$ghuzat_mujahidin_bureaucracy$"
  flavor_gra.13.desc: "Існування #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! під загрозою, і багато хто вступає до нашого війська добровільно.\n\nЦими бійцями, переважно #TOOLTIP:CULTUREGROUP,amazigh_group,X #L амазизького#!#! походження, командує [target_character2.GetName] — вправний, хоч і не зовсім надійний полководець. [ShowSituationName('battle_for_the_strait')|U] завершиться на нашу користь лише в тому разі, якщо ми усунемо якомога більше невизначеностей, і ці добровольці ще можуть стати нам опорою для зведення когось на престол. Замість того щоб передавати їх під командування чужинців, ми спробуємо зробити так, аби ними керували вихідці з дому [target_character.GetDynasty.GetName], — у такому разі небезпеку зради буде усунено."
  flavor_gra.13.a: "Нехай кожен із них служить нашій країні."
  flavor_gra.13.b: "Ми позбудемося кожного, чия вірність не абсолютна."
  gra_mercenary_company_will_be_weaker_and_more_expensive: "У загоні [Concept('mercenary', 'найманців')|e] буде #Y вполовину#! менше вояків, і їхні послуги коштуватимуть дорожче"
  flavor_gra.14.entry: "$flavor_gra.14.title$"
  flavor_gra.14.title: "Каср ар-Ріяд-ас-Саїд"
  flavor_gra.14.desc: "Мало що приносить нам стільки ж слави, скільки [ShowBuildingTypeName('alhambra')] в #TOOLTIP:LOCATION,granada,X #L Гранаді#!#!. Проте [target_character.GetName], у чиїх руках перебуває [ROOT.GetCountry.GetRank.GetName|l], вважає, що цього замало, і слава про дім [target_character.GetDynasty.GetName] має поширитися далеко за межі #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!, усім #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламським#!#! світом. Задля цього [Select_CString(target_character.IsFemale, 'вона', 'він')] має намір найняти найкращих у країні архітекторів, щоби ті звели в центрі Альгамбри палац, оздоблений статуями левів та стільниковими склепіннями — #italic мукарнасами#!."
  flavor_gra.14.a: "Ми підтримаємо цей задум грішми."
  flavor_gra.14.b: "Хай слава династії [target_character.GetDynasty.GetNameWithNoTooltip] огорне весь світ!"
  flavor_gra.14.b.entry: "Хай слава нашої династії огорне весь світ!"
  gra_construct_alhambra_increment_tt: "Додає #G +1#! до максимального рівня [ShowBuildingTypeName('alhambra')]"
  flavor_gra.14.c: "Марна справа — намагатися наситити ненажерливих."
  flavor_gra.15.entry: "$flavor_gra.15.title$"
  flavor_gra.15.title: "Нагода в боротьбі"
  flavor_gra.15.desc: "Наші посли та шпигуни доповіли, що #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_ACC')|L]#!#! шматує смута — настільки велика, що [target_character2.GetName] [Select_CString(target_character2.IsFemale, 'змушена', 'змушений')] спрямовувати всю свою увагу на внутрішню політику, тим самим даючи нам перепочинок від важкого ярма. [target_character.GetName] навіть вважає, що цим становищем слід скористатися — ми можемо відвернути увагу від [target_country.Custom('CL_GEN')], і тоді [ShowSituationName('battle_for_the_strait')], можливо, обернеться на нашу користь."
  flavor_gra.15.a: "Помолімося, щоби їхня смута тривала."
  gra_gain_granadan_sovereignty_for_the_rest_of_the_disaster: "Поки в #ONCLICK:COUNTRY,[GetCountry('CAS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('CAS').GetKey],X [GetCountry('CAS').Custom('CL_PREP')|L]#!#! або #ONCLICK:COUNTRY,[GetCountry('MOR').GetKey] #TOOLTIP:COUNTRY,[GetCountry('MOR').GetKey],X [GetCountry('MOR').Custom('CL_PREP')|L]#!#! триває [Concept('disaster', 'лихо')|e], ми щомісяця отримуватимемо #G 0,1#! од. [Concept('granadan_sovereignty', 'гранадського суверенітету')|e]"
  flavor_gra.16.entry: "$flavor_gra.16.title$"
  flavor_gra.16.title: "Суперечності в Малазі"
  flavor_gra.16.desc: "Боротьба за суверенне існування на теренах #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! іде важко: володарі #ONCLICK:COUNTRY,[GetCountry('MOR').GetKey] #TOOLTIP:COUNTRY,[GetCountry('MOR').GetKey],X [GetCountry('MOR').Custom('CL_GEN')|L]#!#! надійно засіли в провінції [ShowProvinceDefinitionName('malaga_province')], яка за правом належить нам.\n\n[target_character2.GetName] вважає, що вони заслужили це володіння, позаяк ми як [ROOT.GetCountry.GetRank.GetName|l] зобов’язані їм за колись надану допомогу. З іншого боку, стани #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! стверджують, що такий вчинок — зазіхання на нашу незалежність, і закликають нас повернути цей край."
  flavor_gra.16.a: "Уперед, до завоювань!"
  flavor_gra.16.b: "Ми не станемо воювати із сусідами."
  flavor_gra.18.entry: "$flavor_gra.18.title$"
  flavor_gra.18.title: "Наперекір [GetCountry('CAS').Custom('CL_DAT')]"
  flavor_gra.18.desc: "Ми пишаємося своєю спадкоємністю від Андалусії, проте наш [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] не поділяє цієї гордости: ми змушені сплачувати #ONCLICK:COUNTRY,[GetCountry('CAS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('CAS').GetKey],X [GetCountry('CAS').Custom('CL_DAT')|L]#!#! принизливу данину. Вона не дає нашому господарству зростати й лише зміцнює нашого головного супротивника в боротьбі за #TOOLTIP:REGION,iberia_region,X #L Іберію#!#!. Замість того щоб миритися зі становищем, наші командувачі пропонують нарешті скинути із себе ярмо та звільнитися від нав’язаного тягаря — навряд чи для цього випаде слушніша мить."
  flavor_gra.18.a: "Навіть якщо цього разу не вийде, рано чи пізно ми скинемо кайдани."
  flavor_gra.18.b: "Зачекаємо кращої нагоди, а поки залишаймося покірними."
  flavor_gra.19.title: "Обтяження тягаря"
  flavor_gra.19.desc: "Наші добрі стосунки з #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_INST')|L]#!#! добігли кінця. Замість того щоб радіти процвітанню своєї країни, [target_character.GetName], помітивши вразливість наших кордонів, [Select_CString(target_character.IsFemale, 'вирішила', 'вирішив')] взагалі припинити сплачувати нам данину. Звісно, таке рішення не залишилося непоміченим, і тепер наш [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] одностайно заявляє: цим зухвальцям слід нагадати про їхні обов’язки. Якщо нам і надалі не сплачуватимуть данину, ми матимемо привід приєднати [from_country.Custom('CL_ACC')] до себе раз і назавжди."
  flavor_gra.19.a: "[from_country.GetCapital.GetNameWithNoTooltip] упаде!"
  flavor_gra.19.a.entry: "Вони поплатяться за це!"
  flavor_gra.20.entry: "$flavor_gra.20.title$"
  flavor_gra.20.title: "Квітучі ринки Гранади"
  flavor_gra.20.desc: "Виробництво #TOOLTIP:GOODS,silk,X #L шовку#!#, яким з таким завзяттям наш[ROOT.GetCountry.Custom('burghers_aei')|l] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] торгу[ROOT.GetCountry.Custom('burghers_yeyut')] по всій #TOOLTIP:CONTINENT,europe,X #L Європі#!#, і далі приносить плоди: у #TOOLTIP:LOCATION,granada,X #L Гранаді#!#! відкриваються нові ринки, що, своєю чергою, лише дужче підживлює торгівлю. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|U] всіляко — і грішми, і зв’язками — заохочу[ROOT.GetCountry.Custom('burghers_yeyut')] її розвиток.\n\nМи збудуємо найвеличніший #TOOLTIP:BUILDING_TYPE,marketplace,X #L ринок#!#! в усій #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! — [ShowBuildingTypeName('al_qaysariyya_market')], куди стікатимуться і наші, і чужоземні купці, привозячи товари навіть із найвіддаленіших куточків світу."
  flavor_gra.20.a: "[ShowBuildingTypeNameWithNoTooltip('al_qaysariyya_market')] — гідне вкладення! Ставаймо до будівництва."
  flavor_gra.20.b: "На жаль, цього разу наші [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] залишаться розчарованими."
  flavor_gra.1000.entry: "$flavor_gra.1000.title$"
  flavor_gra.1000.title: "Видатна особистість"
  flavor_gra.1000.desc: "[target_character.GetName], виходець із дому [ShowDynastyName('nasrid_dynasty')], нещодавно [Select_CString(target_character.IsFemale, 'зажила', 'зажив')] собі слави в #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. За останні кілька років кривавих воєн із сусідами ця людина показала себе якнайгіднішим полководцем — тисячі вояків готові йти за [Select_CString(target_character.IsFemale, 'нею', 'ним')] куди завгодно. [Select_CString(target_character.IsFemale, 'Нею', 'Ним')] [Select_CString(target_character2.IsFemale, 'зацікавилася сама', 'зацікавився сам')] [target_character2.GetName] — [Select_CString(target_character2.IsFemale, 'вона', 'він')] вважає, що наш [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] напевне гідно оцінить присутність настільки яскравої постаті. Однак такі [Select_CString(target_character.IsFemale, 'її', 'його')] риси, як честолюбство разом із великими домаганнями, змушують непокоїтися…"
  flavor_gra.1000.a: "Великій державі потрібні великі люди."
  gra_yusuf_will_most_likely_rebel: "Якщо [target_character.GetName] отримає пропозицію служити #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#!, згодом [Select_CString(target_character.IsFemale, 'вона', 'він')] може зчинити повстання, в якому буде [Select_CString(target_character2.IsFemale, 'повалена', 'повалений')] [target_character2.GetName]"
  flavor_gra.1000.b: "Краще не ризикувати."
  gra_banishing_yusuf_prevents_the_rebellion: "Якщо [target_character.GetName] буде [Select_CString(target_character.IsFemale, 'вигнана', 'вигнаний')], [Select_CString(target_character.IsFemale, 'вона', 'він')] не зможе підняти заколот"
  flavor_gra.1000.c: "Обізнані люди стверджують, що цей задум обернеться проти нас."
  flavor_gra.1001.title: "[target_character.GetNameWithNoTooltip] піднімає повстання"
  flavor_gra.1001.desc: "Скориставшись любов’ю народу до себе та зібравши під свої знамена легіон прибічників, [target_character.GetName] — людина, чи не могутніша і впливовіша, ніж навіть [target_character2.GetName], — висуває владі країни ультиматум: або ми зрікаємося престолу на [Select_CString(target_character.IsFemale, 'її', 'його')] користь, або [target_character.GetNameWithNoTooltip] розпочне в #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! нищівну війну."
  flavor_gra.1001.a: "Ми ніколи не відмовимося від престолу заради якогось вискочня!"
  flavor_gra.1001.b: "Не будемо зайвий раз проливати кров. [target_character2.GetNameWithNoTooltip] зречеться."
  flavor_gra.1001.b.entry: "Не будемо зайвий раз проливати кров. Ми зречемося."
  flavor_gra.1100.entry: "$flavor_gra.1100.title$"
  flavor_gra.1100.title: "Висхідна зірка"
  flavor_gra.1100.desc: "Серед наших вояків на передовій починають ширитися чутки про [Select_CString(target_character.IsFemale, 'якусь дівчину', 'якогось юнака')] на ім’я [target_character.GetName] — людину надзвичайного хисту, що стрімко просувається по службі й уже дослужилася до полководця. Подейкують, що в [Select_CString(target_character.IsFemale, 'неї', 'нього')] орлине око: навіть у вирі бою [Select_CString(target_character.IsFemale, 'вона', 'він')] може окинути поглядом поле битви й ухвалити правильне рішення. Кажуть, що ніхто ще не зміг здолати [Select_CString(target_character.IsFemale, 'її', 'його')] в двобої на мечах. Проте лише час покаже, скільки правди в цьому поголосі…"
  flavor_gra.1100.a: "Ми з великою цікавістю спостерігатимемо за кар’єрою цього дарування."
  flavor_gra.1100.b: "Від таких людей можна чекати лише лиха."
  flavor_gra.1101.title: "Один із багатьох"
  flavor_gra.1101.desc: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetOralAddress|U]! Ми дійшли висновку, що безглузді чутки, які розносять прості вояки, почасти мають під собою підґрунтя: ця людина справді здатна на неймовірні звершення. Так, нам стало відомо, що [Select_CString(target_character.IsFemale, 'їй', 'йому')] вдалося відбити фланговий удар ворожої кінноти силами лише одного полку. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] вважає, що [Select_CString(target_character.IsFemale, 'їй', 'йому')] варто надати високий титул, адже такі визначні звитяги заслуговують на гідну винагороду. Нехай навіть у країні багато таких, як [Select_CString(target_character.IsFemale, 'вона', 'він')], проте також імовірно, що перед нами — провісник другого пришестя Халіда ібн аль-Валіда."
  flavor_gra.1101.a: "Нам потрібно більше таких людей."
  flavor_gra.1102.title: "В оточенні прибічників"
  flavor_gra.1102.desc: "Після того як [target_character.GetName] [Select_CString(target_character.IsFemale, 'отримала', 'отримав')] свій шляхетний титул, [Select_CString(target_character.IsFemale, 'її', 'його')] найближчі соратники уявили себе кимось на зразок почту: вони намагаються всіляко догоджати [Select_CString(target_character.IsFemale, 'її', 'його')] потребам і навіть говорять від [Select_CString(target_character.IsFemale, 'її', 'його')] імені, коли [target_character.GetName] [Select_CString(target_character.IsFemale, 'відсутня', 'відсутній')]. У маєтку, що розташований у #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.GetKey],X [ROOT.GetCountry.GetCapital.Custom('CL_PREP')|L]#!#!, не відбитися від відвідувачів: простий люд жадає побачити шляхетний лик. Дехто навіть настільки звеличує [Select_CString(target_character.IsFemale, 'її', 'його')] звитяги, що доводить себе до шаленства у вірі й ледь не вклоняється цій людині, мов богові."
  flavor_gra.1102.a: "Це надто впадає в око…"
  flavor_gra.1103.title: "Поява претендента"
  flavor_gra.1103.desc: "Ми з’ясували, чому почет, яким оточує себе [target_character.GetName], поводиться саме так: ці люди розпускають чутки, ніби полководець — насправді виходець із молодшої гілки легендарного дому [ShowDynastyName('umayyad_dynasty')], за якого в #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! колись настала золота доба. І хоч підтвердити чи спростувати цю заяву годі, деяк[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] уже побачи[ROOT.GetCountry.Custom('nobles_vlaloly')] для себе нагоду посісти вище становище, заручившись прихильністю самозваного претендента. Чисельність цього гурту розрослася до повноцінної дивізії, і незабаром під загрозою може опинитися вся наша влада над військом."
  flavor_gra.1103.a: "Сподіватимемося, що з цього нічого не вийде."
  flavor_gra.1104.title: "День розплати"
  flavor_gra.1104.desc: "Прокляття! Проти нас підняли повстання! Під приводом походження з дому [ShowDynastyName('umayyad_dynasty')] [Select_CString(target_character.IsFemale, 'бунтівниця згуртувала', 'бунтівник згуртував')] довкола себе вірних прибічників і [Select_CString(target_character.IsFemale, 'наказала', 'наказав')] їм рушити на найбільші міста країни, аби розпалювати там заколоти та розповідати люду про появу в країні справжнього претендента на престол. Ми не заперечуємо величі #TOOLTIP:LOCATION,cordoba,X #L кордовського#!#! дому [ShowDynastyNameWithNoTooltip('umayyad_dynasty')], за якого нашим пращурам сприяло процвітання, проте навряд чи в нього лишилися прямі нащадки. Втім, простий люд про це не замислюється; йому вистачає славетних ратних подвигів. До справи претендента пристають усе нові люди, і вигуки про те, що [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRulerOrRegent.IsFemale, 'повинна', 'повинен')] скласти повноваження, лунають усе гучніше."
  flavor_gra.1104.a: "Розтрощити претендента!"
  flavor_gra.1104.b: "Тут ми безсилі."
  flavor_gra.1200.entry: "$flavor_gra.1200.title$"
  flavor_gra.1200.title: "Допомога з Магрибу"
  flavor_gra.1200.desc: "[ShowSituationName('battle_for_the_strait')|U] у самому розпалі, і лише втручання іншої країни здатне врятувати нас від неминучого розгрому. Оскільки за право здолати нас першими змагаються [GetCountry('CAS').GetName] та [GetCountry('MOR').GetName], очевидно, що слід звернутися до третьої сторони. Країни #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! близькі нам за духом, і вони, надто найсильніша країна регіону — #ONCLICK:COUNTRY,[strongest_maghreb_country.GetKey] #TOOLTIP:COUNTRY,[strongest_maghreb_country.GetKey],X [strongest_maghreb_country.Custom('CL_GEN')|L]#!#!, мають власний погляд на події. Можливо, [target_character2.GetName] не відмовить нам у допомозі, якщо ми звернемося з проханням про втручання?"
  flavor_gra.1200.a: "Нам відчайдушно потрібна підмога."
  flavor_gra.1200.b: "Ми не допустимо втручання навіть заради власного виживання."
  flavor_gra.1201.title: "$flavor_gra.1200.title$"
  flavor_gra.1201.desc: "З #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_GEN')|L]#!#! до нас прибув посол, аби обговорити становище в #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!. Нам повідомили, що [from_country.GetName] опини[from_country.Custom('end_vlaloly')]ся в безвиході, та попросили будь-якими засобами, чи то грошима, чи вояками, допомогти відстояти державність, яка опинилася під загрозою."
  flavor_gra.1201.a: "Виділимо їм гроші."
  flavor_gra.1201.b: "Спрямуємо їм на допомогу вояків."
  flavor_gra.1201.c: "Поділимося і грошима, і вояками."
  flavor_gra.1201.d: "Ми не бачимо причини втручатися."
  flavor_gra.1300.entry: "$flavor_gra.1300.title$"
  flavor_gra.1300.title: "Допомога зі сходу"
  flavor_gra.1300.desc: "Падіння #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#! під натиском #L [target_country.GetAdjective|l]их#! військ стало важким ударом для #TOOLTIP:RELIGIONGROUP,christian,X #L християнських#!#! королівств #TOOLTIP:CONTINENT,europe,X #L Європи#!#!, які усвідомили свою вразливість перед #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманськими#!#! загарбниками. [Select_CString(target_character2.IsFemale, 'Сп’яніла', 'Сп’янілий')] від тріумфу [target_character2.GetName] тепер прагне заволодіти новими землями відомого світу. Можливо, зараз буде помірковано вирядити делегацію до міста [target_country.GetCapital.GetName] та попросити надіслати нам досвідчених полководців і вояків, аби перейняти в них цінний досвід."
  flavor_gra.1300.a: "Вирядимо делегацію."
  flavor_gra.1300.b: "Обійдемося без їхньої допомоги."
  gra_demand_a_mercenary_company: "Ми попросимо #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_ACC')|L]#!#! надати нам або [Concept('gold', 'гроші')|e], або загін [Concept('mercenary', 'найманців')|e] під командуванням одного з їхніх [Concept('characters', 'персонажів')|e]"
  flavor_gra.1301.title: "$flavor_gra.1300.title$"
  flavor_gra.1301.desc: "[target_character.GetName], [Select_CString(target_character.IsFemale, 'володарка', 'володар')] #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_GEN')|L]#!#!, [Select_CString(target_character.IsFemale, 'вирядила', 'вирядив')] у #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.GetKey],X [ROOT.GetCountry.GetCapital.Custom('CL_ACC')|L]#!#! делегацію. Посли, що прибули до міста, привітали нас із завоюванням #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#! та висловили найтепліші слова про воїнську вправність наших полководців. Ми завдали нищівного удару #TOOLTIP:RELIGIONGROUP,christian,X #L християнському#!#! світу, і тепер нас просять надати іншій стороні військову допомогу: в #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! збираються яструби, для яких немає нічого мерзеннішого, ніж #TOOLTIP:RELIGIONGROUP,muslim,X #L іслам#!#!. Очолити виправу [Select_CString(mercenary_general.IsFemale, 'зголосилася', 'зголосився')] [mercenary_general.GetName]; [Select_CString(mercenary_general.IsFemale, 'її', 'його')] вабить не лише прагнення слави, а й бажання догодити: у разі успішного походу [target_character2.GetName] розширить кордони [ROOT.GetCountry.Custom('rank_ua_GEN')|l] до самих Геркулесових стовпів."
  flavor_gra.1301.a: "Хто ми такі, аби заважати нашим воякам підкорювати нові землі?"
  flavor_gra.1301.b: "Полководці й вояки потрібні нам самим, але ми можемо поділитися грошима."
  flavor_gra.1301.c: "Немає сенсу підкидати дрова у вогонь, що майже згас."