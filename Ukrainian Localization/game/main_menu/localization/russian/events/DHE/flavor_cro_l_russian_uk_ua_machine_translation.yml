l_russian:
  flavor_cro.1000.title: "Об’єднання Хорватії та Славонії"
  flavor_cro.1000.entry: "Об’єднання Хорватії та Славонії"
  flavor_cro.1000.desc: "Невблаганна експансія #ONCLICK:COUNTRY,[GetCountry('TUR').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('TUR').Custom('CL_tt')],X [GetCountry('TUR').Custom('CL_GEN')|L]#!#! становить серйозну загрозу для [ROOT.GetCountry.Custom('rank_ua_GEN')|l], а розділення земель, якими володіє #L [GetCountry('HUN').GetCountry.GetGovernment.GetAdjective|l]а#! [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|l], створює вразливість, якою можуть скористатися наші вороги. У відповідь на цю ситуацію при #L [ROOT.GetCountry.GetAdjective|l]ому#! дворі з’явилася пропозиція звернутися до [GetCountry('HUN').Custom('CL_DAT')] із проханням передати #TOOLTIP:AREA,croatia_area,X #L Хорватію#!#! та #TOOLTIP:AREA,slavonia_area,X #L Славонію#!#! під єдине управління. На думку прихильників цієї ідеї, об’єднання істотно зміцнить нашу оборону та полегшить управління землями."
  flavor_cro.1000.a: "Приступимо до реалізації пропозиції."
  flavor_cro.1001.a.tt: "Усі [Concept('location', 'місцевості')|e] у володінні, які або є [Concept('core', 'корінними місцевостями')|e] #TOOLTIP:AREA,slavonia_area,X #L Славонії#!#!, або розташовані на її території, будуть передані #ONCLICK:COUNTRY,[GetCountry('CRO').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CRO').Custom('CL_tt')],X [GetCountry('CRO').Custom('CL_DAT')|L]#!#!"
  flavor_cro.1000.b: "Це ляже важким тягарем на наші плечі."
  flavor_cro.1000.historical_info: "У минулому Славонія була окремою від Хорватії адміністративною одиницею під управлінням власного бана, який, своєю чергою, підпорядковувався безпосередньо угорській короні. Однак експансія Османської імперії кардинально змінила політичну ситуацію в регіоні, а спустошення, спричинене війною, змусило місцевих жителів тікати на північ. У 1476 році король Матьяш I об’єднав Хорватсько-Далматинський і Славонський банати, щоб зміцнити оборону проти османських набігів. Процес об’єднання остаточно завершився в 1558 році з політичною інтеграцією та злиттям парламентів Хорватії та Славонії."
  flavor_cro.1001.title: "$flavor_cro.1000.title$"
  flavor_cro.1001.desc: "Посланці від наших підданих [GetCountry('CRO').Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[GetCountry('CRO').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CRO').Custom('CL_tt')],X [GetCountry('CRO').Custom('CL_PREP')|L]#!#! прибули до #L [ROOT.GetCountry.GetAdjective|l]ого#! двору з пропозицією об’єднати посади бана #TOOLTIP:AREA,croatia_area,X #L Хорватії#!#! та бана #TOOLTIP:AREA,slavonia_area,X #L Славонії#!#!. На їхню думку, єдине управління зміцнить оборону та полегшить адміністративне навантаження перед обличчям #L [GetCountry('TUR').GetAdjective|l]ої#! загрози."
  flavor_cro.1001.a: "Єдиний кордон зміцнить нашу оборону."
  flavor_cro.1001.b: "[GetCountry('HUN').GetAdjectiveWithNoTooltip]а [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|l] володіє областю [ShowAreaNameWithNoTooltip('slavonia_area')]."
  flavor_cro.1001.b.entry: "[ShowAreaNameWithNoTooltip('slavonia_area')] — власність угорських правителів."
  flavor_cro.1100.title: "[target_character.GetNameWithNoTooltip] та [Select_CString(target_character.IsFemale, 'її', 'його')] володіння"
  flavor_cro.1100.entry: "Володіння Івана Нелипича"
  flavor_cro.1100.desc: "Могутній магнат на ім’я [target_character.GetName] поступово посилює свій вплив [ROOT.GetCountry.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. На своїх рідних землях він зумів усунути багатьох своїх супротивників, завдяки чому #L [GetCountry('HUN').GetAdjective|l]а#! [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|l] послабила тут хватку. Одні вважають такий стан справ вигідним, а інші побоюються, що [GetCountry('HUN').GetNameWithNoTooltip] мо[GetCountry('HUN').Custom('end_gegu')] в будь-який момент відновити свою владу. З’явилася пропозиція: якщо [target_character.GetNameWithNoTooltip] визнає, що #L [GetCountry('HUN').GetAdjective|l]а#! [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|l] має владу над цією територією, то [GetCountry('HUN').GetNameWithNoTooltip], своєю чергою, визна[GetCountry('HUN').Custom('end_etyut')] його владу над [ROOT.GetCountry.Custom('CL_INST')]."
  flavor_cro.1100.a: "[GetCountry('HUN').GetAdjectiveWithNoTooltip]а [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|l] — не та, з ким варто зв’язуватися."
  flavor_cro.1100.a.entry: "Не будемо втручатися у справи правителів."
  flavor_cro.1100.b: "Відправимо пропозицію."
  flavor_cro.1100.historical_info: "Іван Нелипич був хорватським дворянином, який фактично встановив контроль над більшою частиною Хорватії в 1322 році, попередньо скинувши попереднього бана Младена II з роду Шубичів. У період його правління титул бана Хорватії залишався незайнятим, а сама Хорватія майже повністю вийшла з-під влади угорської корони. Угорський король і бан Славонії неодноразово намагалися змістити Нелипича, але всі їхні спроби закінчувалися невдачею. Лише в 1345 році, після смерті Нелипича, Угорщині вдалося відновити свою владу над Хорватією."
  flavor_cro.1101.title: "[GetCountry('CRO').GetNameWithNoTooltip] шука[GetCountry('CRO').Custom('end_etut')] компроміс"
  flavor_cro.1101.desc: "[GetCountry('CRO').GetName] перебува[GetCountry('CRO').Custom('end_ityat')] під владою могутнього магната на ім’я [target_character.GetName] відтоді, як далматська [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] здобула перемогу в Битві біля Блиски в 1322 році. У своїх нових володіннях [Select_CString(target_character.IsFemale, 'вона', 'він')] робить так, щоб #L [GetCountry('HUN').GetAdjective|l]а#! [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] поступово втрачала тут владу. Як не парадоксально, [target_character.GetLastNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'відправила', 'відправив')] посла до #L [ROOT.GetCountry.GetAdjective|l]ого#! двору з пропозицією компромісу. [Select_CString(target_character.IsFemale, 'Вона готова', 'Він готовий')] офіційно визнати, що #L [GetCountry('HUN').GetAdjective|l]а#! [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|l] має владу над цією територією, і присягнути на вірність трону, однак натомість [Select_CString(target_character.IsFemale, 'вона', 'він')] вимагає, щоб ми визнали [Select_CString(target_character.IsFemale, 'її законною правителькою', 'його законним правителем')] [GetCountry('CRO').Custom('CL_GEN')]."
  flavor_cro.1101.a: "Унія збережеться."
  flavor_cro.1101.b: "Узаконимо [Select_CString(target_character.IsFemale, 'її', 'його')] владу."
  flavor_cro.1101.b.entry: "Узаконимо його владу."
  flavor_cro.1102.title: "[GetCountry('HUN').GetNameWithNoTooltip] відкида[GetCountry('HUN').Custom('end_etyut')] наші претензії"
  flavor_cro.1102.desc: "Наш посол повернувся з тривожними звістками. [GetCountry('HUN').GetAdjective]а [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|l] відкинула пропозицію визнати [Select_CString(target_character.IsFemale, 'нашу пані законною правителькою', 'нашого пана законним правителем')] #ONCLICK:COUNTRY,[GetCountry('CRO').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CRO').Custom('CL_tt')],X [GetCountry('CRO').Custom('CL_GEN')|L]#!#!, наполягаючи на тому, що [ROOT.GetCountry.GetFlavorRank|l] є невід’ємною частиною унії. І хоча при #L [ROOT.GetCountry.GetAdjective|l]ому#! дворі багато хто згоден, що тут нічого не змінити, дехто пропонує крайні заходи: [target_character.GetName] [Select_CString(target_character.IsFemale, 'повинна', 'повинен')] анулювати договір Pacta Conventa, що пов’язує наш трон [GetCountry('HUN').Custom('end_predlog_sso')] [GetCountry('HUN').Custom('CL_INST')], і коронувати себе як [Select_CString(target_character.IsFemale, 'першу', 'першого')] за понад два століття [Select_CString(target_character.IsFemale, 'місцеву королеву', 'місцевого короля')] [GetCountry('CRO').Custom('CL_GEN')]."
  flavor_cro.1102.a: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]."
  flavor_cro.1102.a.entry: "$common_string_nothing_we_can_do_about_it$"
  flavor_cro.1102.b: "Анулюємо Pacta Conventa, а корону нехай забере [target_character.GetLastNameWithNoTooltip]!"
  flavor_cro.1102.b.entry: "Анулюємо Pacta Conventa та коронуємо його!"
  flavor_cro.1103.title: "[GetCountry('CRO').GetNameWithNoTooltip] анулю[GetCountry('CRO').Custom('end_etyut')] Pacta Conventa"
  flavor_cro.1103.desc: "Після нашої відмови визнавати владу [Select_CString(target_character.IsFemale, 'цієї узурпаторки', 'цього узурпатора')] над #ONCLICK:COUNTRY,[GetCountry('CRO').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('CRO').Custom('CL_tt')],X [GetCountry('CRO').Custom('CL_INST')|L]#!#! [target_character.GetName] [Select_CString(target_character.IsFemale, 'вирішила', 'вирішив')] піти на куди радикальніші заходи, ніж будь-хто міг передбачити. [GetCountry('CRO').GetName] оголоси[GetCountry('CRO').Custom('end_vlaloly')] про угоду Pacta Conventa, завдяки якій анульована #L [GetCountry('HUN').GetAdjective|l]а#! [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|l] буде пов’язана з цією частиною нашої держави. Крім того, тепер [target_character.GetLastNameWithNoTooltip] — їхн[Select_CString(target_character.IsFemale, 'я нова', 'ій новий')] [GetCountry('CRO').GetGovernment.GetRulerTitle|l]!"
  flavor_cro.1103.a: "Ми не допустимо подібного свавілля!"
  flavor_cro.1103.b: "Ми не будемо втручатися."