l_russian:
 flavor_ham.1.title: "Банк Беренбергов"
 flavor_ham.1.entry: "$flavor_ham.1.title$"
 flavor_ham.1.desc: "К нам в [ROOT.GetCountry.Custom('rank_ua_ACC')|l] стекаются многочисленные торговцы и коммерсанты — их влечёт богатство наших земель. Среди новоприбывших есть и династия [GetDynasty('berenberg_dynasty').GetName]; эти люди замечательно разбираются в тонкостях управления денежными потоками и хотят учредить частную банковскую контору в месте, что называется [berenberg_bank_hq.GetName]. Учреждение такого рода может принести нам немалую пользу: с его помощью будет проще разбираться с торговыми кредитами и заниматься товарообменом в Северном море."
 flavor_ham.1.historical_info: "Гамбургский #italic банк Беренбергов#! — один из старейших ныне действующих банков, основанный в 1590 году Гансом и Паулем Беренбергами — фламандскими торговцами, бежавшими из Антверпена от испанских завоевателей. Банк, способствовавший развитию торговли в Северной Европе, никогда не покидал частных рук и развивался благодаря тщательному подходу к купеческим кредитам и инвестициям."
 flavor_ham.1.a: "Мы рады каждому умелому купцу."
 flavor_ham.1.b: "Посмотрим, чего они добьются!"
 flavor_ham.2.title: "$flavor_ham.1.title$"
 flavor_ham.2.desc: "[berenberg_bank_hq.GetRank.GetName|U] [berenberg_bank_hq.GetName] — вот где мы основали свою банковскую контору, и лучшего места для неё не найти. Связи с купцами в Северной Европе и за её пределами открывают нам не один десяток дверей, и мы готовы сыграть едва ли не важнейшую роль в торговле в этом регионе."
 flavor_ham.2.a: "Наше состояние растёт с каждой сделкой."
 flavor_ham.3.title: "Гамбургский банк"
 flavor_ham.3.entry: "$flavor_ham.3.title$"
 flavor_ham.3.desc: "[hamburger_bank_hq.GetName] принимает у себя всё больше купцов, и сегодня каждому понятно: нам нужен надёжный, способный достойно переносить трудности обменный банк, который будет гарантировать стоимость различных валют и проводить крупные коммерческие сделки. [hamburger_bank_hq.GetNameWithNoTooltip], где расположится государственный банк (за пример мы возьмём другие похожие учреждения), обеспечит нам основу для финансового успеха."
 flavor_ham.3.historical_info: "В 1619 году в вольном городе Гамбург был основан #italic Гамбургский банк#!, созданный по образцу учреждённого десятью годами ранее Амстердамского банка. В Гамбурге проводились обмены валюты, принимались вклады и обрабатывались международные платежи, проводимые в надёжной банковской валюте. На протяжении более чем двухсот лет и до поглощения в 1875 году Рейхсбанком Гамбургский банк считался одним из важнейших финансовых учреждений Северной Европы."
 flavor_ham.3.a: "Банк будет действовать в наших интересах."
 flavor_ham.3.b: "Мы будем купаться в деньгах!"
 flavor_ham.4.title: "$flavor_ham.3.title$"
 flavor_ham.4.desc: "Нам поручили заведование финансами наших покровителей и их торговых партнёров. Теперь от наших решений зависит благополучие северных краёв, и мы не ударим лицом в грязь."
 flavor_ham.4.a: "$flavor_ham.3.b$"