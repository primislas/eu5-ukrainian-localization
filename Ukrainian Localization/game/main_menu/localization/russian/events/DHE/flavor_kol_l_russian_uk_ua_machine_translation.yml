  flavor_kol.1.title: "Баварські архієпископи"
  flavor_kol.1.entry: "$flavor_kol.1.title$"
  flavor_kol.1.desc: "На посаду архієпископа Кельна був призначений член правлячого баварського дому. Тепер у Баварії з'явиться новий важіль впливу на цю землю. Як нам слід вчинити?"
  flavor_kol.1.a: "Ми не проти впливу баварців."
  flavor_kol.1.b: "Ми підемо своїм шляхом."
