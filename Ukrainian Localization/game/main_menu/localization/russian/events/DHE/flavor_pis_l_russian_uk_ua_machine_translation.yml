l_russian:
  flavor_pis.1.entry: "$flavor_pis.1.title$"
  flavor_pis.1.title: "Падіння [ROOT.GetCountry.Custom('CL_GEN')]"
  flavor_pis.1.desc: "Славні роки [ROOT.GetCountry.Custom('longname_ua_GEN')], колись грізної та значної сили, якій підкорялася #TOOLTIP:REGION,italy_region,X #L Італія#!#!, давно позаду. Наш вплив простягався від #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! до #TOOLTIP:REGION,crescent_region,X #L Родючого півмісяця#!#!, однак багаторічна блокада [ShowBuildingTypeName('porto_pisano')] у #TOOLTIP:LOCATION,pisa,X #L Пізі#!#! з боку #L [GetCountry('GEN').GetAdjective|l]ого#! флоту виявилася тим самим нищівним ударом, що призвів до нашого падіння. Крім того, #L [GetCountry('ARA').GetAdjective|l]і#! війська відібрали в нас область [ShowAreaName('sardinia_area')].\n\nТепер [ROOT.GetCountry.GetFlavorRank|l] являє собою жалюгідне видовище: наш колись могутній флот — лише бліда подоба того флоту, який ще не так давно наводив жах на ворогів; тепер же він залишився в тіні інших #TOOLTIP:CULTUREGROUP,italian_group,X #L італійських#!#! країн. Наших купців витісняють надійніші суперники, а в [ROOT.GetCountry.Custom('rank_ua_PREP')|l] повсюдно розгоряються політичні чвари.\n\nАле замість того, щоб сидіти й дивитися, як нас відсувають на узбіччя історії, краще зайнятися відновленням втраченого блиску. Нам належить зібратися з силами й помститися винуватцям того скрутного становища, в якому ми опинилися."
  flavor_pis.1.a: "Доки нами править [target_character.GetNameWithNoTooltip], ми непереможні!"
  flavor_pis.1.a.entry: "Ми непереможні!"
  flavor_pis.2.title: "Падіння [target.Custom('CL_GEN')]"
  flavor_pis.2.desc: "Війська #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! здобули чергову гучну перемогу, захопивши #L #TOOLTIP:LOCATIONRANK,[target.Custom('LR_tt')],X [target.Custom('LR_ACC')|l]#!#! [target.GetName]. В їхніх серцях палає лють: ще свіжі спогади про руйнування #TOOLTIP:LOCATION,pisa,X #L Пізи#!#! та про спричинені блокадою голодні смерті. Вояки та командири збираються стерти [target.Custom('LR_ACC')|l] з лиця землі, посипати попелище сіллю та привезти місцеві багатства до столиці."
  flavor_pis.2.a: "Око за око!"
  flavor_pis.2.b: "Не варто рівняти це місце із землею."
  pis_allow_upgrade_of_porto_pisano: "[ShowBuildingTypeName('porto_pisano')] у #TOOLTIP:LOCATION,pisa,X #L Пізі#!#! можна покращити ще на один рівень"
  flavor_pis.3.entry: "$flavor_pis.3.title$"
  flavor_pis.3.title: "Визволення Сардинії"
  flavor_pis.3.desc: "Ми отримали довгоочікувану радісну звістку: [ShowAreaName('sardinia_area')] знову в наших руках!\n\nВояки, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] та [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] не можуть натішитися черговій блискучій перемозі: вони вже передчувають, як повернуться в край, де колись користувалися впливом та повагою. Багато з них, свого часу змушені тікати в інші куточки країни, вже перебираються до [target_location.Custom('LR_ACC')|l] [target_location.GetName], маючи намір зробити його обласною столицею.\n\nДумки про те, як краще забудовувати #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_ACC')|l]#!#!, стільки ж, скільки й самих жителів, але всіх об’єднує одне: турбота про переселенців, яким належить повернути [ShowBuildingTypeName('porto_pisano')] колишній добробут. Однак є й ті, хто вважає, що не варто приділяти всю увагу лише одній області, оскільки нашої допомоги потребує весь острів цілком."
  flavor_pis.3.a: "[target_location.GetNameWithNoTooltip] стане перлиною Сардинії."
  flavor_pis.3.a.entry: "Це місце стане перлиною Сардинії."
  flavor_pis.3.b: "Під нашою владою процвітатиме весь острів."
  pis_all_of_sardinia_gains_development_and_prosperity: "Кожна належна нам [Concept('location', 'місцевість')|e] в області [ShowAreaName('sardinia_area')] отримає [ShowNamedValue('development_mild_bonus')|+=2%] до [Concept('development', 'розвитку')|e] та [ShowNamedValue('prosperity_mild_bonus')|+=2%] до [Concept('prosperity', 'процвітання')|e]"
  flavor_pis.4.entry: "$flavor_pis.4.title$"
  flavor_pis.4.title: "Розширення Пізанської вежі"
  flavor_pis.4.desc: "[ShowWorkOfArtName('leaning_tower_of_pisa')|U] добудована, однак [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] не збирається на цьому зупинятися і вважає, що над внутрішніми приміщеннями також варто попрацювати.\n\n[target_character.GetName] хоче прикрасити дзвіницю готичними елементами, елегантно поєднавши їх з уже наявними прикрасами в романському стилі. На це, зрозуміло, знадобляться гроші, про що добре відомо [ROOT.GetCountry.Custom('rank_ua_DAT')|l]. Відомо також і те, що подібний проєкт неодмінно піднесе наш престиж в #TOOLTIP:REGION,italy_region,X #L Італії#!#!."
  flavor_pis.4.a: "Розширимо вежу."
  flavor_pis.4.b: "Вежа вже збудована, все інше — зайве."
  flavor_pis.5.entry: "$flavor_pis.5.title$"
  flavor_pis.5.title: "Зміна курсу"
  flavor_pis.5.desc: "Прагнення знову огорнути себе славою, яка простягалася б від одного берега Середземномор’я до іншого, сьогодні вже не таке сильне, як колись, однак нас, як і раніше, вабить жага влади над #TOOLTIP:REGION,italy_region,X #L Італією#!#!. Цього разу ми зробимо ставку не на купців та мореплавців, а на воєнні походи: усе наявне в нашому розпорядженні багатство ми пустимо на те, щоб найняти численних кондотьєрів та наказати їм завоювати прилеглі міста.\n\nТакий задум не знайшов прихильності в досвідчених державних мужів — їм більше до душі перспектива перебудувати #TOOLTIP:BUILDING_TYPE,porto_pisano,X #L Порто-Пізано#!#! — однак ті, в кому грає гаряча кров, виступають за політику розширення — лише так, на їхню думку, ми зможемо затьмарити міста-держави, що суперничають із нами."
  flavor_pis.5.a: "Вперед, до завоювань!"
  flavor_pis.5.b: "Яка нам користь від війни? Краще налагоджуватимемо торгівлю."
  pis_gain_casus_belli_on_every_neighbor_country_in_italy: "Якщо в нас немає [Concept('casus_belli', 'приводу для війни')|e], ми отримаємо [Concept('casus_belli', 'привід')|e] «[ShowCasusBelliName('cb_conquer_province')]» щодо кожної [Concept('capital', 'столичної')|e] [Concept('province', 'провінції')|e] сусідніх [Concept('country', 'країн')|e]"
  flavor_pis.6.title: "Джоко-дель-Понте"
  flavor_pis.6.desc.a: "На святкуванні Джоко-дель-Понте, що відбулося днями в #TOOLTIP:LOCATION,pisa,X #L Пізі#!#, з’явилася вельми цікава постать на ім’я [target_character.GetName]: виявилося, що [Select_CString(target_character.IsFemale, 'ця жінка', 'цей чоловік')] — чудовий командир, і під [Select_CString(target_character.IsFemale, 'її', 'його')] началом солдати, які брали участь у змаганні, успішно проштовхнули візок по мосту Понте-ді-Меццо. [target_character.GetName] негайно [Select_CString(target_character.IsFemale, 'завоювала', 'завоював')] прихильність народу, проявивши задатки природженого керівника."
  flavor_pis.6.desc.b: "Жителі #TOOLTIP:LOCATION,pisa,X #L Пізи#!#! тріумфують: у їхніх краях нещодавно відбулося свято Джоко-дель-Понте. Хода вздовж річки Арно виявилася незабутнім видовищем — подивитися на неї зібралися громадяни всіх поприщ і станів, оскільки ніщо так не об’єднує народ #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! (конкретно — найвпливовіших його представників), як щорічне звичаєве святкування, під час якого можна забути про суспільні бар’єри."
  flavor_pis.6.desc.c: "На щорічне святкування Джоко-дель-Понте в #TOOLTIP:LOCATION,pisa,X #L Пізі#!#! з’їхалися глядачі з усієї #TOOLTIP:CONTINENT,europe,X #L Європи#!#!. Видовище виявилося вражаючим: хода річкою Арно, напружене змагання між солдатами... Багато хто з тих, хто спостерігав за святом, повернулися на батьківщину з розповідями про те, наскільки веселим буває життя в #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!."
  flavor_pis.6.a: "Порадіймо стабільності, нехай навіть вона не назавжди."
  flavor_pis.6.b: "Про свято дізнаються в кожному краю світу."
  flavor_pis.6.c: "Нехай [target_character.GetNameWithNoTooltip] отримає підвищення."
  flavor_pis.6.c.entry: "Нехай цей персонаж отримає підвищення."
  flavor_pis.6.d: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] не потерпить, щоб #L [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ій#! країні служив абихто."
  flavor_pis.6.d.entry: "Ми не потерпимо, щоб нашій країні служив абихто."
  flavor_pis.1000.entry: "$flavor_pis.1000.title$"
  flavor_pis.1000.title: "Нова влада"
  flavor_pis.1000.desc: "У #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! почалися важкі часи.\n\nКраїна загрузла в боргах, господарство йде на спад, а відсутність впевненості в завтрашньому дні все більше змушує народ сумніватися, що [target_character.GetName] зможе утримати хиткий уряд від розпаду. Ми відчайдушно потребуємо чужоземної допомоги. Замість того щоб сидіти склавши руки, багаті та впливові громадяни почали підшукувати нового кандидата на управління [ROOT.GetCountry.Custom('rank_ua_INST')|l]. Дехто вважає, що династія [target_country.GetGovernment.GetRuler.GetDynasty.GetName] з #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! зможе підтримати нас економічно. Іншим більше до душі сімейство [target_country2.GetGovernment.GetRuler.GetDynasty.GetName] з #ONCLICK:COUNTRY,[target_country2.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country2.Custom('CL_tt')],X [target_country2.Custom('CL_GEN')|L]#!#!, треті ж і зовсім стверджують, що немає більш відповідного вибору, ніж рід [target_country3.GetGovernment.GetRuler.GetDynasty.GetName] з #ONCLICK:COUNTRY,[target_country3.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country3.Custom('CL_tt')],X [target_country3.Custom('CL_GEN')|L]#!#!, і що ми виявимося повними дурнями, якщо не запросимо його правити нами."
  flavor_pis.1000.a: "Надішлемо листа до [target_country.Custom('CL_ACC')]."
  flavor_pis.1000.a.entry: "Надішлемо їм листа."
  pis_offer_rulership_to_country1: "Ми запропонуємо #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_DAT')|L]#!#! правити нами. Якщо вони погодяться, відбудеться таке:"
  pis_a_member_of_target_country_dynasty_becomes_ruler: "Виходець із [Concept('dynasty', 'династії')|e] [target_country.GetGovernment.GetRuler.GetDynasty.GetName] стане нашим [Concept('ruler', 'правителем')|e]"
  flavor_pis.1000.b: "Краще буде обрати [target_country2.Custom('CL_ACC')]."
  flavor_pis.1000.b.entry: "Краще буде обрати іншу країну."
  pis_offer_rulership_to_country2: "Ми запропонуємо #ONCLICK:COUNTRY,[target_country2.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country2.Custom('CL_tt')],X [target_country2.Custom('CL_DAT')|L]#!#! правити нами. Якщо вони погодяться, відбудеться таке:"
  pis_a_member_of_target_country2_dynasty_becomes_ruler: "Виходець із [Concept('dynasty', 'династії')|e] [target_country2.GetGovernment.GetRuler.GetDynasty.GetName] стане нашим [Concept('ruler', 'правителем')|e]"
  flavor_pis.1000.c: "Немає нікого більш гідного, ніж правителі з [target_country3.Custom('CL_GEN')]."
  flavor_pis.1000.c.entry: "Немає нікого більш гідного, ніж правителі з цієї країни."
  pis_offer_rulership_to_country3: "Ми запропонуємо #ONCLICK:COUNTRY,[target_country3.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country3.Custom('CL_tt')],X [target_country3.Custom('CL_DAT')|L]#!#! правити нами. Якщо вони погодяться, відбудеться таке:"
  pis_a_member_of_target_country3_dynasty_becomes_ruler: "Виходець із [Concept('dynasty', 'династії')|e] [target_country3.GetGovernment.GetRuler.GetDynasty.GetName] стане нашим [Concept('ruler', 'правителем')|e]"
  flavor_pis.1000.d: "Ми не станемо продавати [ROOT.GetCountry.Custom('rank_ua_ACC')|l] суперникам."
  flavor_pis.1001.title: "$flavor_pis.1000.title$"
  flavor_pis.1001.desc: "Політичні потрясіння в #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_PREP')|L]#!#! ось-ось досягнуть кульмінації: [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] приймає в себе послів — представників вищого суспільства цієї країни, які звернулися до нас по допомогу. Суть їхнього прохання зводиться до такого: нехай [ROOT.GetCountry.GetGovernment.GetRuler.GetName] посприяє тому, щоб на престол [from_country.Custom('rank_ua_GEN')|l] [Select_CString(target_character.IsFemale, 'зійшла', 'зійшов')] [target_character.GetName]; крім того, [Select_CString(target_character.IsFemale, 'їй', 'йому')] потрібна грошова підмога."
  flavor_pis.1001.a: "Для династії [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetNameWithNoTooltip] такі обставини — чудова нагода наростити вплив."
  flavor_pis.1001.a.entry: "Чудова нагода наростити вплив."
  flavor_pis.1001.b: "Подібні зв’язки стануть для нас зайвим тягарем."
  flavor_pis.1100.entry: "$flavor_pis.1100.title$"
  flavor_pis.1100.title: "In Supremae Dignitatis"
  flavor_pis.1100.desc: "#TOOLTIP:LOCATION,pisa,X #L Пізанські#!#! вчені користуються повагою в усій #TOOLTIP:REGION,italy_region,X #L Італії#!#!, однак у #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! досі немає офіційного навчального закладу. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|U] запропонува[ROOT.GetCountry.Custom('clergy_vlaloly')] наступне: нехай [target_character.GetName] подасть прохання, щоб [target_character2.GetName] [Select_CString(target_character2.IsFemale, 'визнала', 'визнав')] Пізу «Studium Generale» («домом загального навчання») — у такому разі університети почнуть процвітати як ніколи."
  flavor_pis.1100.a: "Вирядимо послів, нехай [GetCountry('PAP').GetCapital.GetNameWithNoTooltip] розгляне наше прохання."
  flavor_pis.1100.a.entry: "Вирядимо послів, нехай Рим розгляне наше прохання."
  flavor_pis.1100.b: "Не втручатимемося в [GetCountry('PAP').GetAdjectiveWithNoTooltip|l]у політику."
  flavor_pis.1100.b.entry: "Не втручатимемося в римську політику."
  flavor_pis.1101.title: "$flavor_pis.1100.title$"
  flavor_pis.1101.desc: "[target_character.GetName] з #ONCLICK:COUNTRY,[from_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[from_country.Custom('CL_tt')],X [from_country.Custom('CL_GEN')|L]#!#! [Select_CString(target_character.IsFemale, 'вирядив', 'вирядив')] до нас посольство. Посли розтікаються перед нами палкими промовами про те, наскільки шановані вчені мужі, що здобули освіту в #TOOLTIP:LOCATION,pisa,X #L Пізі#!#!, і про те, як багато жителів [from_country.Custom('rank_ua_GEN')|l] хочуть піти їхніми стопами. Від нас просять дати офіційне схвалення з боку #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! та дозволити побудувати освітній заклад на землях [from_country.Custom('rank_ua_GEN')|l]."
  flavor_pis.1101.a: "Схвалюємо."
  flavor_pis.1101.b: "В Італії багато де можна навчатися."