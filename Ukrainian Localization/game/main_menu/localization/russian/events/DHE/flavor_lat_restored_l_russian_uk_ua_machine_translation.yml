l_russian:
  flavor_lat.1.title: "Створення нової [latin_country.GetAdjectiveWithNoTooltip|l] бюрократії"
  flavor_lat.1.entry: "Нова латинська бюрократія"
  flavor_lat.1.desc: "[constantinople_location.GetName] знову під нашою владою, і тепер значна частина #L [latin_country.GetAdjective|l]их#! еліт працює над тим, щоб забезпечити нам міцний фундамент для нових бюрократичних установ — вони повинні прийти на зміну застарілим [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l] порядкам. Ми не збираємося повторювати помилки своїх попередників: ті виявилися не в силах справлятися з регіональним тиском на [ROOT.GetCountry.Custom('longname_ua_wntt_ACC')], через що в [ROOT.GetCountry.Custom('rank_ua_PREP')|l] так і не склалася надійна та сильна влада.\n\n[scope_ruler.GetName] робитиме все інакше: в [Select_CString(scope_ruler.IsFemale, 'її', 'його')] руках в [ROOT.GetCountry.Custom('rank_ua_PREP')|l] складеться зовсім інша бюрократія — надійна, за #L [ROOT.GetCountry.GetCulture.GetName|l]им#! зразком."
  flavor_lat.1.a: "Створити новий, винятково [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l] бюрократичний механізм."
  flavor_lat.1.a.entry: "Створити новий, винятковий бюрократичний механізм."
  flavor_lat.1.b: "Створити новий бюрократичний механізм на основі старих держав хрестоносців."
  flavor_lat.1.c: "Частково перейняти [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l] бюрократичний механізм."
  flavor_lat.1.c.entry: "Частково перейняти візантійський бюрократичний механізм."
  flavor_lat.1.d: "Створити бюрократичний механізм за зразком каталонського."
  flavor_lat.1.e: "Створити бюрократичний механізм за зразком неаполітанського."
  flavor_lat.2.title: "Наростаюча турецька загроза в Анатолії"
  flavor_lat.2.entry: "Наростаюча турецька загроза в Анатолії"
  flavor_lat.2.desc: "[GetCountry('BYZ').GetAdjectiveWithNoTooltip] володіння в #TOOLTIP:REGION,anatolia_region,X #L Анатолії#!#! з давніх пір, ще до повернення нами [constantinople_location.Custom('LR_GEN')|l] [constantinople_location.GetName], перебувають у небезпечному становищі: їм загрожують #TOOLTIP:CULTURE,$turkish_culture_tt$,X #L турки#!#!, що розташувалися по сусідству. Одна з найгрізніших постатей серед них — [rising_turkish_country_ruler.GetName]: ця людина твердо має намір зібрати під своєю владою анатолійські землі, і #L [ROOT.GetCountry.GetAdjective|l]і#! придворні побоюються, що відвоювання нами [constantinople_location.Custom('LR_GEN')|l] [constantinople_location.GetNameWithNoTooltip] може підштовхнути [Select_CString(rising_turkish_country_ruler.IsFemale, 'її', 'його')] до наступного кроку; в такому разі наступною ціллю завоювань стане вже [ShowScriptedGeographyName('greece_geography')]. Втім, страх відчувають не всі: дехто вважає, що [scope_ruler.GetName] [Select_CString(scope_ruler.IsFemale, 'повинна', 'повинен')] скористатися наявною перевагою та вторгнутися в Анатолію, щоб послабити турків та їхню [rising_turkish_country.Custom('rank_ua_ACC')|l]."
  flavor_lat.2.a: "Ми відтіснимо їхню [rising_turkish_country.Custom('rank_ua_ACC')|l]!"
  flavor_lat.2.a.entry: "Ми відтіснимо їхню державу!"
  flavor_lat.2.b: "Потрібно дотримуватися обережності та швидше оборонятися, ніж наступати."
  flavor_lat.3.title: "Великі домагання [ROOT.GetCountry.Custom('longname_ua_wntt_GEN')]"
  flavor_lat.3.entry: "$flavor_lat.3.title$"
  flavor_lat.3.desc: "Після падіння в 1204 році [constantinople_location.Custom('LR_GEN')|l] [constantinople_location.GetName] представники старої #L [ROOT.GetCountry.GetAdjective|l] еліти#! не стали гаяти часу дарма: крім спроб зміцнити свою владу над #L [GetCountry('BYZ').GetAdjective|l]ими#! володіннями — [ShowScriptedGeographyName('greece_geography')] виявилася для них ласим шматком — вони також постаралися утвердити панування над Балканами, проте [serbia_country.GetName] та [bul_country.GetName] зуміли дати відсіч [ROOT.GetCountry.Custom('CL_DAT')]. Бажання посягнути на ці держави врешті-решт призвело до краху [ROOT.GetCountry.Custom('rank_ua_GEN')|l] через нездатність протистояти постійним набігам [bul_country.Custom('CL_GEN')] на [ROOT.GetCountry.Custom('CL_ACC')].\n\nСьогодні ж, коли [scope_ruler.GetName] панує [ROOT.GetCountry.Custom('longname_ua_wntt_INST')], у нас є можливість нарешті завоювати ці непокірні землі, помстившись за розпад [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  flavor_lat.3.a: "Ми постараємося розширити кордони [ROOT.GetCountry.Custom('rank_ua_GEN')|l] за рахунок старих суперників."
  flavor_lat.3.a.entry: "Ми постараємося розширити кордони держави за рахунок старих суперників."
  flavor_lat.3.b: "Краще не повторювати помилок минулого."
  flavor_lat.4.title: "Відновлення священного патріархату [constantinople_location.Custom('LR_GEN')|l] [constantinople_location.GetName]"
  flavor_lat.4.entry: "Відновлення священного патріархату Константинополя"
  flavor_lat.4.desc: "Хоча розорення [constantinople_location.Custom('LR_GEN')|l] [constantinople_location.GetName] у 1204 році викликало різке засудження багатьох (серед них і [pap_country.GetGovernment.GetRulerTitle|l]), неможливо заперечувати, що без участі хрестоносців-#TOOLTIP:RELIGION,$catholic_tt$,X #L католиків#!#! відновлення патріархату, а отже, і зміцнення #L [pap_country.GetAdjective|l]ої#! влади було б неможливим. Цей титул, втім, знову втратив своє значення після того, як у 1261 році [scope_michael_palaiologos.GetName] знову [Select_CString(scope_michael_palaiologos.IsFemale, 'завоювала', 'завоював')] [constantinople_location.Custom('LR_ACC')|l] [constantinople_location.GetNameWithNoTooltip].\n\nСьогодні ж, коли тут знову утвердилася #L [ROOT.GetCountry.GetAdjective|l] влада#!, багато [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] закликають нас відновити патріархат."
  flavor_lat.4.a: "Дозволити відновлення патріархату."
  flavor_lat.4.b: "Поклястися всіма силами захищати відновлений патріархат."
  flavor_lat.4.c: "Постаратися посилити вплив за допомогою відновленого патріархату."
  flavor_lat.4.d: "Відмовитися відновлювати патріархат."
  latin_patriarchate_of_constantinople: "Константинопольський патріархат"
  flavor_lat.5.title: "Відновлено контроль над Анатолією"
  flavor_lat.5.entry: "Відновлено контроль над Анатолією"
  flavor_lat.5.desc: "Завдання, що стояло перед [ROOT.GetCountry.Custom('longname_ua_INST')], здавалося неймовірно складним, однак наші відважні воїни досягли чималих успіхів у підкоренні #TOOLTIP:REGION,anatolia_region,X #L Анатолії#!#!. Нечисленні #TOOLTIP:CULTURE,$turkish_culture_tt$,X #L турецькі#!#! утворення, до яких ще не дотягнувся наш меч, вже не становлять для [ROOT.GetCountry.Custom('CL_GEN')] серйозної загрози."
  flavor_lat.5.a: "Слава [ROOT.GetCountry.Custom('longname_ua_wntt_DAT')]!"
  flavor_lat.5.a.entry: "Слава нашій країні!"
  flavor_lat_anatolia_secured: "Кожна [Concept('location', 'місцевість')|e] #TOOLTIP:REGION,anatolia_region,X #L Анатолії#!#!, що належить #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! або нашим [Concept('subjects', 'васалам')|e], отримає [Concept('modifier', 'модифікатор')|e] «[ShowModifier('lat_improved_location_integration')]» на #Y 15#! років"
  flavor_lat.6.title: "Успішні походи в [target_country.Custom('CL_ACC')]"
  flavor_lat.6.entry: "Болгарія розгромлена"
  flavor_lat.6.desc: "[target_country.GetLongName] — країна, що колись становила чималу небезпеку для [ROOT.GetCountry.Custom('longname_ua_GEN')] — сьогодні значно слабша, ніж раніше; чимала частка колишніх земель цієї країни перебуває під #L [ROOT.GetCountry.GetAdjective|l]ою#! владою. Малоймовірно, що [target_country.GetAdjectiveWithNoTooltip|l]і еліти коли-небудь зможуть повернути своїй батьківщині колишню велич і знову стати загрозою для [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  flavor_lat.6.a: "Потрібно інтегрувати колишні [target_country.GetAdjectiveWithNoTooltip|l]і провінції."
  flavor_lat.6.a.entry: "Потрібно інтегрувати їхні колишні провінції."
  flavor_lat_balkan_rival_lands_secured: "Кожна [Concept('location', 'місцевість')|e] #TOOLTIP:REGION,balkan_region,X #L Балкан#!#!, що вважається [Concept('core', 'корінною місцевістю')|e] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! і належить #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! або нашим [Concept('subjects', 'васалам')|e], отримує [Concept('modifier', 'модифікатор')|e] «[ShowModifier('lat_improved_location_integration')]» на #Y 15#! років"
  flavor_lat.7.title: "[target_country.GetAdjectiveWithNoTooltip]і устремління розгромлені"
  flavor_lat.7.entry: "Сербські устремління розгромлені"
  flavor_lat.7.desc: "Усі амбіції #L [target_country.GetAdjective|l]ої#! країни, що прагнула могутності та величі, виявилися розчавлені чоботом #L [ROOT.GetCountry.GetAdjective|l]ого#! вояка. Після наших походів [target_country.GetNameWithNoTooltip] перетворив[target_country.Custom('end_assya')] на дрібного гравця, який майже не має жодного впливу на #TOOLTIP:REGION,balkan_region,X #L Балканах#!#!. Одним клопотом менше."
  flavor_lat.7.a: "Негайно навести лад у провінціях, відвойованих у [target_country.Custom('CL_GEN')]."
  flavor_lat.7.a.entry: "Негайно навести лад у відвойованих провінціях."
  flavor_lat.8.title: "Стара [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]а еліта"
  flavor_lat.8.entry: "Стара візантійська еліта"
  flavor_lat.8.desc: "Після відвоювання [constantinople_location.Custom('LR_GEN')|l] [constantinople_location.GetName] ми не тільки змогли відродити [ROOT.GetCountry.Custom('longname_ua_ACC')], а й поклали край усім надіям на відновлення [GetCountry('BYZ').Custom('longname_ua_GEN')]. Майже всі представники старої [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]ої еліти з неохотою присягнули на вірність [ROOT.GetCountry.Custom('CL_DAT')].\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] єдиної думки: історія [GetCountry('BYZ').Custom('longname_ua_wntt_GEN')] добігла кінця. [ROOT.GetCountry.Custom('longname_ua_wntt_DAT')] судилося зайняти звільнене місце серед світових країн і піти своїм шляхом."
  flavor_lat.8.a: "Час проводжати стару [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]у культуру в останню путь."
  flavor_lat.8.a.entry: "Настав час провести стару візантійську культуру в останню путь."
  flavor_lat.8.b: "Потрібно зберегти в [ROOT.GetCountry.Custom('rank_ua_PREP')|l] [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]ий дух."
  flavor_lat.8.b.entry: "Потрібно зберегти в країні візантійський дух."
  flavor_lat.9.title: "[pap_country.GetAdjectiveWithNoTooltip]е прохання про навернення православних земель"
  flavor_lat.9.entry: "Папське прохання про навернення візантійських земель"
  flavor_lat.9.desc: "В обмін на допомогу #L [pap_country.GetAdjective|l]ої#! сторони з відновленням [ROOT.GetCountry.Custom('longname_ua_GEN')] ми зобов’язалися одразу після відвоювання [constantinople_location.Custom('LR_GEN')|l] [constantinople_location.GetName] посприяти прийняттю новою [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ою елітою політик, спрямованих на ослаблення впливу #TOOLTIP:RELIGION,$orthodox_tt$,X #L православної#!#! віри та зміцнення #TOOLTIP:RELIGION,$catholic_tt$,X #L католицтва#!#! — про це нас просить особисто [pap_country.GetGovernment.GetRulerTitle|l]. Оскільки [constantinople_location.GetNameWithNoTooltip] знову в наших руках, а [ROOT.GetCountry.GetLongNameWithNoTooltip] — у числі світових держав, [scope_pope_ruler.GetName] [Select_CString(scope_pope_ruler.IsFemale, 'попросила', 'попросив')] нас дотриматися слова та прийняти обіцяні політики."
  flavor_lat.9.a: "[scope_pope_ruler.GetShortNameWithNoTooltip] [Select_CString(scope_pope_ruler.IsFemale, 'уклала', 'уклав')] з нами угоду. Ми маємо бути вірними своєму слову."
  flavor_lat.9.a.entry: "Він уклав з нами угоду. Ми маємо бути вірними своєму слову."
  flavor_lat.9.b: "Дозволити політикам набути чинності, але не нав’язувати їх надто сильно."
  flavor_lat.9.c: "Порушити угоду та проявити терпимість до православного населення."
  lat_accepted_pope_latin_empire_proposal_tt: "Has accepted the Pope offer to restore the Latin empire"