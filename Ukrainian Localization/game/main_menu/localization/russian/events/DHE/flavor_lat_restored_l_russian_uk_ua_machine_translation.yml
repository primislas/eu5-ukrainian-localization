l_russian:
  flavor_lat.1.title: "Створення нової [latin_country.GetAdjectiveWithNoTooltip|l]ої бюрократії"
  flavor_lat.1.entry: "Нова латинська бюрократія"
  flavor_lat.1.desc: "[constantinople_location.GetName] знову під нашою владою, і тепер значна частина #L [latin_country.GetAdjective|l]их#! еліт працює над тим, щоб забезпечити нам міцний фундамент для нових бюрократичних установ — вони повинні прийти на зміну застарілим [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]им порядкам. Ми не збираємося повторювати помилки своїх попередників: ті виявилися не в силах справлятися з регіональним тиском на [ROOT.GetCountry.Custom('longname_ua_wntt_ACC')], через що в [ROOT.GetCountry.Custom('rank_ua_PREP')|l] так і не склалася надійна та сильна влада.\n\n[scope_ruler.GetName] робитиме все інакше: в [Select_CString(scope_ruler.IsFemale, 'її', 'його')] руках в [ROOT.GetCountry.Custom('rank_ua_PREP')|l] складеться зовсім інша бюрократія — надійна, за #L [ROOT.GetCountry.GetCulture.GetName|l]им#! зразком."
  flavor_lat.1.a: "Створимо унікальну [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]у установу."
  flavor_lat.1.a.entry: "Створимо унікальну установу."
  flavor_lat.1.b: "Створимо установу на основі старих держав хрестоносців."
  flavor_lat.1.c: "Частково візьмемо [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]у установу."
  flavor_lat.1.c.entry: "Частково візьмемо візантійську установу."
  flavor_lat.1.d: "Створимо установу за зразком каталонської."
  flavor_lat.1.e: "Створимо установу за зразком неаполітанської."
  flavor_lat.2.title: "Наростаюча турецька загроза в Анатолії"
  flavor_lat.2.entry: "Наростаюча турецька загроза в Анатолії"
  flavor_lat.2.desc: "[GetCountry('BYZ').GetAdjectiveWithNoTooltip]і володіння в #TOOLTIP:REGION,anatolia_region,X #L Анатолії#!#! з давніх-давен, ще до того, як ми повернули [constantinople_location.Custom('LR_ACC')|l] [constantinople_location.GetName], перебувають у небезпечному становищі: їм загрожують #TOOLTIP:CULTURE,$turkish_culture_tt$,X #L турки#!#!, що розташувалися по сусідству. Одна з найгрізніших постатей серед них — [rising_turkish_country_ruler.GetName]: [Select_CString(rising_turkish_country_ruler.IsFemale, 'вона твердо має намір', 'він твердо має намір')] зібрати під своєю владою анатолійські землі, і #L [ROOT.GetCountry.GetAdjective|l]ий#! [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] побоюється, що перехід [constantinople_location.Custom('LR_GEN')|l] [constantinople_location.GetNameWithNoTooltip] до нас може підштовхнути [Select_CString(rising_turkish_country_ruler.IsFemale, 'її', 'його')] до наступного кроку; у такому разі наступною ціллю завоювань стане вже [ShowScriptedGeographyName('greece_geography')]. Втім, такий страх відчувають не всі: дехто вважає, що [scope_ruler.GetName] [Select_CString(scope_ruler.IsFemale, 'повинна', 'повинен')] скористатися моментом і вторгнутися в Анатолію, щоб послабити турків та їхній [rising_turkish_country.Custom('rank_ua_ACC')|l]."
  flavor_lat.2.a: "Ми відтіснимо їхню [rising_turkish_country.Custom('rank_ua_ACC')|l]!"
  flavor_lat.2.a.entry: "Ми відтіснимо їхню державу!"
  flavor_lat.2.b: "Потрібно дотримуватися обережності та швидше оборонятися, ніж наступати."
  flavor_lat.3.title: "Великі домагання [ROOT.GetCountry.Custom('longname_ua_wntt_GEN')]"
  flavor_lat.3.entry: "$flavor_lat.3.title$"
  flavor_lat.3.desc: "Після падіння в 1204 році [constantinople_location.Custom('LR_GEN')|l] [constantinople_location.GetName] представники старої #L [ROOT.GetCountry.GetAdjective|l]ої еліти#! не стали гаяти часу дарма: крім спроб зміцнити свою владу над #L [GetCountry('BYZ').GetAdjective|l]ими#! володіннями — [ShowScriptedGeographyName('greece_geography')] виявилася для них ласим шматком — вони також постаралися утвердити панування над Балканами, проте [serbia_country.GetName] та [bul_country.GetName] зуміли дати відсіч [ROOT.GetCountry.Custom('CL_DAT')]. Бажання посягнути на ці держави врешті-решт призвело до краху [ROOT.GetCountry.Custom('rank_ua_GEN')|l] через нездатність протистояти постійним набігам [bul_country.Custom('CL_GEN')] на [ROOT.GetCountry.Custom('CL_ACC')].\n\nСьогодні ж, коли [scope_ruler.GetName] панує [ROOT.GetCountry.Custom('longname_ua_wntt_INST')], у нас є можливість нарешті завоювати ці непокірні землі, помстившись за розпад [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  flavor_lat.3.a: "Постараємося розширити кордони [ROOT.GetCountry.Custom('rank_ua_GEN')|l] за рахунок старих суперників."
  flavor_lat.3.a.entry: "Постараємося розширити кордони країни за рахунок старих суперників."
  flavor_lat.3.b: "Краще не повторюватимемо помилок минулого."
  flavor_lat.4.title: "Відновлення священного патріархату [constantinople_location.Custom('LR_GEN')|l] [constantinople_location.GetName]"
  flavor_lat.4.entry: "Відновлення священного патріархату Константинополя"
  flavor_lat.4.desc: "Хоча розорення [constantinople_location.Custom('LR_GEN')|l] [constantinople_location.GetName] у 1204 році викликало різке засудження багатьох (серед них і [pap_country.GetGovernment.GetRulerTitle|l]), неможливо заперечувати, що без участі хрестоносців-#TOOLTIP:RELIGION,$catholic_tt$,X #L католиків#!#! відновлення патріархату, а отже, і зміцнення #L [pap_country.GetAdjective|l]ої#! влади було б неможливим. Цей титул, втім, знову втратив своє значення після того, як у 1261 році [scope_michael_palaiologos.GetName] знову [Select_CString(scope_michael_palaiologos.IsFemale, 'завоювала', 'завоював')] [constantinople_location.Custom('LR_ACC')|l] [constantinople_location.GetNameWithNoTooltip].\n\nСьогодні ж, коли тут знову утвердилася #L [ROOT.GetCountry.GetAdjective|l]а влада#!, численн[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] заклика[ROOT.GetCountry.Custom('clergy_yeyut')] нас відновити патріархат."
  flavor_lat.4.a: "Дозволимо відновити патріархат."
  flavor_lat.4.b: "Поклянемося всіма силами захищати відновлений патріархат."
  flavor_lat.4.c: "Постараємося посилити вплив за допомогою відновленого патріархату."
  flavor_lat.4.d: "Відмовимося відновлювати патріархат."
  latin_patriarchate_of_constantinople: "Константинопольський патріархат"
  flavor_lat.5.title: "Відновлено контроль над Анатолією"
  flavor_lat.5.entry: "Відновлено контроль над Анатолією"
  flavor_lat.5.desc: "Завдання, що стояло перед [ROOT.GetCountry.Custom('longname_ua_INST')], здавалося неймовірно складним, однак наші відважні воїни досягли чималих успіхів у підкоренні #TOOLTIP:REGION,anatolia_region,X #L Анатолії#!#!. Нечисленні #TOOLTIP:CULTURE,$turkish_culture_tt$,X #L турецькі#!#! утворення, до яких ще не дотягнувся наш меч, вже не становлять для [ROOT.GetCountry.Custom('CL_GEN')] серйозної загрози."
  flavor_lat.5.a: "Слава [ROOT.GetCountry.Custom('longname_ua_wntt_DAT')]!"
  flavor_lat.5.a.entry: "Слава нашому народу!"
  flavor_lat_anatolia_secured: "Кожна [Concept('location', 'місцевість')|e] #TOOLTIP:REGION,anatolia_region,X #L Анатолії#!#!, що належить #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! або нашим [Concept('subjects', 'васалам')|e], отримає [Concept('modifier', 'модифікатор')|e] «[ShowModifier('lat_improved_location_integration')]» на #Y 15#! років"
  flavor_lat.6.title: "Успішні походи на [target_country.Custom('CL_ACC')]"
  flavor_lat.6.entry: "Болгарія розгромлена"
  flavor_lat.6.desc: "[target_country.GetLongName] колись станови[target_country.Custom('endlong_vlaloly')] чималу небезпеку для [ROOT.GetCountry.Custom('longname_ua_GEN')]. Сьогодні ця країна значно слабша, ніж раніше; чимала частка її колишніх земель перебуває під владою #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Малоймовірно, що [target_country.GetAdjectiveWithNoTooltip|l]і еліти коли-небудь зможуть повернути своїй батьківщині колишню велич і знову стати загрозою для [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  flavor_lat.6.a: "Потрібно інтегрувати колишні [target_country.GetAdjectiveWithNoTooltip|l]і провінції."
  flavor_lat.6.a.entry: "Потрібно інтегрувати їхні колишні провінції."
  flavor_lat_balkan_rival_lands_secured: "Кожна [Concept('location', 'місцевість')|e] #TOOLTIP:REGION,balkan_region,X #L Балкан#!#!, яка вважається [Concept('core', 'корінною місцевістю')|e] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!, а також належить #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! або нашим [Concept('subjects', 'васалам')|e], отримує [Concept('modifier', 'модифікатор')|e] «[ShowModifier('lat_improved_location_integration')]» на #Y 15#! років"
  flavor_lat.7.title: "[target_country.GetAdjectiveWithNoTooltip]і устремління розгромлені"
  flavor_lat.7.entry: "Сербські устремління розгромлені"
  flavor_lat.7.desc: "Усі амбіції #L [target_country.GetAdjective|l]ої#! країни, що прагне могутності та величі, виявилися розчавленими чоботом #L [ROOT.GetCountry.GetAdjective|l]ого#! вояка. Після наших походів [target_country.GetNameWithNoTooltip] перетвори[target_country.Custom('end_vlaloly')]ся на дрібного гравця і розгуби[target_country.Custom('end_vlaloly')] майже весь вплив на #TOOLTIP:REGION,balkan_region,X #L Балканах#!#!. Однією турботою менше."
  flavor_lat.7.a: "Зараз же наведемо лад у провінціях, відвойованих у [target_country.Custom('CL_GEN')]."
  flavor_lat.7.a.entry: "Зараз же наведемо лад у відвойованих провінціях."
  flavor_lat.8.title: "Стара [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]а еліта"
  flavor_lat.8.entry: "Стара візантійська еліта"
  flavor_lat.8.desc: "Після відвоювання [constantinople_location.Custom('LR_GEN')|l] [constantinople_location.GetName] ми не тільки змогли відродити [ROOT.GetCountry.Custom('longname_ua_ACC')], а й поклали край усім надіям на відновлення [GetCountry('BYZ').Custom('longname_ua_GEN')]. Майже всі представники старої [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]ої еліти з неохотою присягнули на вірність [ROOT.GetCountry.Custom('CL_DAT')].\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] єдиної думки: історія [GetCountry('BYZ').Custom('longname_ua_wntt_GEN')] добігла кінця. [ROOT.GetCountry.Custom('longname_ua_wntt_DAT')] судилося зайняти звільнене місце серед світових країн і піти своїм шляхом."
  flavor_lat.8.a: "Час проводжати стару [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]у культуру в останню путь."
  flavor_lat.8.a.entry: "Настав час провести стару візантійську культуру в останню путь."
  flavor_lat.8.b: "Потрібно зберегти [ROOT.GetCountry.Custom('preposition_uv')] [ROOT.GetCountry.Custom('rank_ua_PREP')|l] [GetCountry('BYZ').GetAdjectiveWithNoTooltip|l]ий дух."
  flavor_lat.8.b.entry: "Потрібно зберегти в країні візантійський дух."
  flavor_lat.9.title: "[pap_country.GetAdjectiveWithNoTooltip]е прохання про навернення православних земель"
  flavor_lat.9.entry: "Папське прохання про навернення візантійських земель"
  flavor_lat.9.desc: "#L [pap_country.GetAdjective]а#! сторона допомогла нам із відновленням [ROOT.GetCountry.Custom('longname_ua_GEN')], і тепер, одразу після відвоювання [constantinople_location.Custom('LR_GEN')|l] [constantinople_location.GetName], [pap_country.GetGovernment.GetRulerTitle|l] просить нас вплинути на нову [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]у еліту, щоб вона прийняла політики, спрямовані на послаблення впливу #TOOLTIP:RELIGION,$orthodox_tt$,X #L православної#!#! віри та зміцнення #TOOLTIP:RELIGION,$catholic_tt$,X #L католицтва#!#!. Оскільки [constantinople_location.GetNameWithNoTooltip] знову в наших руках, а [ROOT.GetCountry.GetLongNameWithNoTooltip] — у числі світових держав, [scope_pope_ruler.GetName] [Select_CString(scope_pope_ruler.IsFemale, 'попросила', 'попросив')] нас дотримати слова та прийняти обіцяні політики."
  flavor_lat.9.a: "[scope_pope_ruler.GetShortNameWithNoTooltip] [Select_CString(scope_pope_ruler.IsFemale, 'уклала', 'уклав')] з нами угоду. Ми маємо бути вірними своєму слову."
  flavor_lat.9.a.entry: "Він уклав з нами угоду. Ми маємо бути вірними своєму слову."
  flavor_lat.9.b: "Приймемо ці політики, але не нав’язуватимемо їх надто сильно."
  flavor_lat.9.c: "Порушимо угоду і проявимо терпимість до православного населення."
  lat_accepted_pope_latin_empire_proposal_tt: "Прийняли папську пропозицію відновити Латинську імперію"