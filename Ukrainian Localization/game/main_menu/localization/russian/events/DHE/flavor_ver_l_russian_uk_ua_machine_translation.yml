l_russian:
  VER_benefits_from_winning_the_war: "У війні «[target_war.GetName]» нам буде доступна [Concept('peace_offer', 'мирна пропозиція')|e] «[ShowPeaceTreatyTypeName('scaligeri_victory')]»"
  ver_remove_antagonism: "Зникне [Concept('antagonism', 'ворожість')|e] #ONCLICK:COUNTRY,[THIS.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[THIS.GetCountry.Custom('CL_tt')],X [THIS.GetCountry.Custom('CL_GEN')|L]#!#! щодо інших [Concept('countries', 'країн')|e], спричинена вимогами [Concept('peace_treaty', 'мирного договору')|e]"
  ver_add_integration_in_every_location: "Кожна [Concept('owned', 'підвладна')|e] [Concept('location', 'місцевість')|e] у регіоні [ShowScriptedGeographyName('scaligeri_conquests_geography')] отримає #G +100%#! до [Concept('integration', 'інтеграції')|e]"
  SCALIGER_WAR_NAME: "Війна Скалігерів"
  ver_demands_start: "Ми вимагатимемо"
  ver_demands_end: "як частину мирного договору в конфлікті «[target_war.GetName]»"
  ver_demands_FLO_pescia_demand: "$ver_demands_start$ місцевість [ShowLocationName('pescia')] $ver_demands_end$"
  ver_demands_FLO_lucca_demand: "$ver_demands_start$ провінцію [ShowProvinceDefinitionName('lucca_province')] $ver_demands_end$"
  ver_demands_VEN_mestre_demand: "$ver_demands_start$ місцевість [ShowLocationName('mestre')] $ver_demands_end$"
  ver_demands_VEN_treviso_demand: "$ver_demands_start$ провінцію [ShowProvinceDefinitionName('venice_province')] $ver_demands_end$"
  ver_demands_MLO_brescia_demand: "$ver_demands_start$ провінцію [ShowProvinceDefinitionName('brescia_province')] $ver_demands_end$"
  ver_demands_MLO_parma_demand: "$ver_demands_start$ провінцію [ShowProvinceDefinitionName('parma_province')] $ver_demands_end$"
  ver_effect_depends_on_scope: "Ефекти [Concept('peace_treaty', 'мирного договору')|e] залежатимуть від виборів, зроблених під час [Concept('event', 'події')|e]"
  VER_benefits_for_coalition_members: "Сторона, що нападає у війні «[target_war.GetName]» отримуватиме [Concept('events', 'події')|e], що дозволяють висунути претензії на різні прикордонні землі; захоплення земель іншими способами буде недоступним"
  VER_cannot_take_territory_besides_scripted_peace_deal: "Захоплювати землі необхідно за допомогою особливих мирних договорів, доступ до яких відкривається в [Concept('events', 'подіях')|e] війни Скалігерів"
  scaligeri_war_historical_info: "До середини 1336 року тривалі чвари роду Скалігерів з Венецією призвів до війни. Приводом для конфлікту стало перекриття річки По ланцюгами — таким чином Верона могла збирати мита на прохід, що прямо загрожувало венеційській комерції. Спроби вирішити суперечку шляхом перемовин наштовхнулися на жорстку позицію сенату Світлішої Республіки: Венеція призупинила постачання солі, через що Падуя, яка тоді належала Скалігерам, була змушена самостійно зайнятися виробництвом цього продукту. До 22 червня настало безповоротне загострення: Флоренція та Венеція підписали угоду, за якою перша зобов’язувалася покрити дві третини витрат на майбутню війну."
  flavor_ver.1.title: "[target_war.GetNameWithNoTooltip]"
  flavor_ver.1.desc: "Володіння династії [target_dynasty.GetName], які свого часу потом і кров’ю [Select_CString(target_character.IsFemale, 'здобувала', 'здобував')] [target_character.GetName], в останні роки стали ласим шматочком для величезного союзу невеликих країн півночі #TOOLTIP:REGION,italy_region,X #L Італії#!#!, куди спочатку входили лише [GetCountry('VEN').GetLongName] та [GetCountry('FLO').GetLongName]. Наші спроби розв'язати суперечки мирним шляхом зазнали краху: судді вирішили найпідступнішим чином стати на бік наших ворогів. Втім, їм же гірше: тепер вони також понесуть покарання."
  flavor_ver.1.historical_info: "$scaligeri_war_historical_info$"
  flavor_ver.1.a: "Слабких чекає винищення."
  flavor_ver.2.title: "[target_war.GetNameWithNoTooltip]"
  flavor_ver.2.desc: "На войовничий дім [target_dynasty.GetName] гострить ножі величезний союз, який очолює [anti_scaligeri_leader.GetLongName]. [target_war.GetName|U] може закінчитися на нашу користь, якщо ми знайдемо в собі сили створити перелам, але для цього нам знадобиться допомога нових союзників. На кордоні з #ONCLICK:COUNTRY,[target_ver.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_ver.Custom('CL_tt')],X [target_ver.Custom('CL_INST')|L]#!#! збираються #L [mlo_participant.GetAdjective|l]і#! сили — [mlo_army.GetName], [flo_participant.GetLongName] підтримує війну своїми великими фінансами, а на чолі нашої армії стоїть [target_character.GetName]. Незабаром [target_ver.GetAdjectiveWithNoTooltip|l]і вояки святкуватимуть перемогу, і в #TOOLTIP:REGION,italy_region,X #L Італії#!#! знову запанує мир."
  flavor_ver.2.historical_info: "$scaligeri_war_historical_info$"
  flavor_ver.2.a: "Ми зітремо з лиця землі проклятих Скалігерів!"
  ver_owner_is_an_defender: "[THIS.GetLocation.Custom('LR_INST')] [THIS.GetLocation.GetName] [Concept('owner', 'володіє')|e] країна, що є [Concept('defender', 'оборонною стороною')|e] у конфлікті «[target_war.GetName]»"
  ver_controller_is_an_attacker: "[THIS.GetLocation.Custom('LR_ACC')|l] [THIS.GetLocation.GetName] [Concept('controller', 'контролює')|e] країна, що є [Concept('attacker', 'нападником)|e] у війні «[target_war.GetName]»."
  flavor_ver.3.title: "Наші претензії на провінцію [target_province.GetNameWithNoTooltip]"
  flavor_ver.3.desc: "[target_war.GetName] проти династії [target_dynasty.GetName] [target_country.Custom('preposition_uv')] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_PREP')|L]#!#! йде чудово: нещодавно наші війська зайняли провінцію [target_province.GetName] — місцевість, де [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetDynasty.GetName] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! користується сильним впливом. Можливо, варто висунути на неї претензії, щоб наші союзники в #ONCLICK:COUNTRY,[war_leader.Custom('CL_tt')] #TOOLTIP:COUNTRY,[war_leader.Custom('CL_tt')],X [war_leader.Custom('CL_PREP')|L]#!#! знали, що у нас є власний інтерес до володінь династії [target_dynasty.GetNameWithNoTooltip]."
  flavor_ver.3.entry: "Міланські вимоги у війні Скалігерів"
  flavor_ver.3.a: "Висунути претензії."
  flavor_ver.3.b: "Можливо, нам краще підійде [ShowProvinceDefinitionNameWithNoTooltip('parma_province')]?"
  flavor_ver.4.title: "Наші претензії на місцевість [target_location.GetNameWithNoTooltip]"
  flavor_ver.4.desc: "На наших очах зазнає краху династія [target_dynasty.GetName] — колишній гегемон Північної #TOOLTIP:REGION,italy_region,X #L Італії#!#!. Такий успіх став можливий лише завдяки нашим старанням та старанням наших союзників. Тепер про свої інтереси неодмінно заяв[ROOT.GetCountry.Custom('endlong_ytlyat')] [ROOT.GetCountry.GetLongName] — країна, що 1336 року покрила зі своєї скарбниці дві третини видатків на війну. А що стосується нас, то нам до душі [target_country.GetName] — країна Скалігерів, що довго й уперто опиралася владарюванню #TOOLTIP:LOCATION,florence,X #L Флоренції#!#!."
  flavor_ver.4.entry: "Флорентійські вимоги у війні Скалігерів"
  flavor_ver.4.a: "Пред’явити претензії на місцевість [ShowLocationNameWithNoTooltip('pescia')]."
  flavor_ver.4.b: "[target_country.GetCapital.GetRank.GetNameWithNoTooltip] належить нам цілком!"
  flavor_ver.4.b.entry: "Місто належить нам цілком!"
  flavor_ver.5.title: "Наші претензії на провінцію [target_province.GetNameWithNoTooltip]"
  flavor_ver.5.desc: "Війна — страшенно витратна справа... Чи ж не зовсім?\n\n[target_war.GetName|U], схоже, все-таки може обернутися для нас виграшним чином, навіть попри всю пролиту кров. Заявлена мета цього конфлікту — повалення династії [target_dynasty.GetName], однак у процесі ми зможемо отримати землі, які представники цієї самої династії відвоювали в інших, не менш кривавих битвах. Можливо, ми розширимо кордони в бік таких земель, як [target_location.GetName] і навіть провінція [target_province.GetName] — земель, культурно близьких до [ROOT.GetCountry.Custom('rank_ua_DAT')|l]."
  flavor_ver.5.entry: "Венеційські вимоги у війні Скалігерів"
  flavor_ver.5.a: "[target_location.GetNameWithNoTooltip] належатиме нам!"
  flavor_ver.5.a.entry: "Местре належатиме нам!"
  flavor_ver.5.b: "[target_province.GetNameWithNoTooltip] стане основою #italic Terraferma#!."
  flavor_ver.5.b.entry: "Веронська Венето стане основою #italic Terraferma#!."
  flavor_ver.6.title: "Притязання [from_country.Custom('CL_GEN')]"
  flavor_ver.6.desc: "З [from_country.Custom('longname_ua_GEN')] прибув гонець, що привіз нам вимоги цієї країни до династії [target_dynasty.GetName] з #ONCLICK:COUNTRY,[war_enemy.Custom('CL_tt')] #TOOLTIP:COUNTRY,[war_enemy.Custom('CL_tt')],X [war_enemy.Custom('CL_GEN')|L]#!#!. Нам потрібно поміркувати, якого вигляду набуде [target_peace_treaty.GetName] і на яких умовах закінчиться [target_war.GetName], інакше [from_country.GetAdjectiveWithNoTooltip|l]і посли вважатимуть, що ми порушили слово."
  flavor_ver.6.a: "Ми розглянемо їхнє прохання — коли настане час."
  ver_peace_treaty_has_become_available: "У війні «[target_war.GetName]» доступний мирний договір «[target_peace_treaty.GetName]»"
  flavor_ver.7.title: "Наш тріумф"
  flavor_ver.7.desc: "Довгі роки кровопролиття добігли кінця: $SCALIGER_WAR_NAME$ завершилася. Сьогодні #L [ROOT.GetCountry.GetAdjective|l]і#! війська крокують [target_location.Custom('LR_DAT')|l] [target_location.GetName], тріумфуючи над поваленими ворогами. Ми воювали не просто за панування над північчю #TOOLTIP:REGION,italy_region,X #L Італії#!#!: на кону стояло ім’я «[target_character.GetName]» — людини, що заснувала [ROOT.GetCountry.Custom('longname_ua_ACC')], і ми всіма силами відстоювали [Select_CString(target_character.IsFemale, 'її', 'його')] спадщину."
  flavor_ver.7.a: "Слава династії [target_dynasty.GetNameWithNoTooltip]!"
  flavor_ver.8.title: "Перемога ліги"
  flavor_ver.8.desc: "Доля войовничої династії [target_dynasty.GetName] вирішилася: прокляті Скалігери зазнали поразки, а володіння, де колись [Select_CString(target_character.IsFemale, 'панувала', 'панував')] [target_character.GetName], спустошені. Закінчилися ті роки, коли Північною #TOOLTIP:REGION,italy_region,X #L Італією#!#! могли одноосібно правити тирани. Ми творимо історію #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, і на наших очах настав поворотний її момент!"
  flavor_ver.8.a: "Скатертиною дорога!"
  flavor_ver.1000.title: "[target_character2.GetNameWithNoTooltip] та [Select_CString(target_character2.IsFemale, 'її', 'його')] рідня"
  flavor_ver.1000.desc: "[target_character.GetName], [Select_CString(target_character.IsFemale, 'вигнана правителька', 'вигнаний правитель')] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! та [Select_CString(target_character.IsFemale, 'родичка', 'родич')] такого діяча, як [target_character2.GetName], навіть сьогодні обіймає посаду вікарія. Це означає, що [target_country.GetCapital.GetRankAndName|l] і сьогодні якоюсь мірою перебуває під [Select_CString(target_character.IsFemale, 'її', 'його')] впливом. [target_character.GetShortNameWithNoTooltip] формально [Select_CString(target_character.IsFemale, 'вірна', 'вірний')] родині [target_dynasty.GetName], але при цьому користується прихильністю у своїх старих володіннях і напевно тримає злість на Скалігерів за злочини проти династії [target_character.GetDynasty.GetName]. Крім того, нам відомо, що [Select_CString(target_character.IsFemale, 'вона небайдужа', 'він небайдужий')] до кондотьєра, що служить нам, на ім’я [target_character2.GetShortNameWithNoTooltip]. Якщо [Select_CString(target_character.IsFemale, 'її', 'його')] [target_country.GetCapital.GetRank.GetName|l] опиниться під обстрілом наших облогових знарядь, ми не сумніваємося, що [Select_CString(target_character.IsFemale, 'вона', 'він')] переметнеться."
  flavor_ver.1000.a: "Який гарний — і диявольський! — задум..."
  ver_padua_incident_rules: "Якщо #TOOLTIP:LOCATION,padova,X #L Падуя#!#! буде окупована до #W 1339.1.1#!, [target_country.GetName] змін[target_country.Custom('end_ytyat')] сторону у війні «[target_war.GetName]» і здобуд[target_country.Custom('end_eut')] незалежність"
  flavor_ver.1001.title: "Можлива зрада"
  flavor_ver.1001.desc: "Наші шпигуни в [target_location.Custom('LR_PREP')|l] [target_location.GetName] повідомляють, що, можливо, прямо у нас під носом відбуваються ворожі перемовини: поки йде [target_war.GetName], хтось із [target_country.Custom('longname_ua_GEN')] листується з нашими ворогами. Ці новини змусили нас засумніватися у вірності #L [target_country.GetAdjective|l]ої#! сторони — що, якщо згодом нас зрадять? Поки що ми доручили детективам знайти винуватця, але невідомо, чи зуміють вони впоратися з цим дорученням вчасно."
  flavor_ver.1001.desc_pad: "Наші шпигуни зі столиці повідомляють, що, можливо, прямо у нас під носом відбуваються ворожі перемовини: поки йде [target_war.GetName], хтось листується з нашими ворогами. Серед нас закрався зрадник, і [target_location.GetName] у небезпеці! Поки що ми доручили вивідувачам знайти винуватця, але невідомо, чи зуміють вони впоратися з цим дорученням вчасно."
  flavor_ver.1001.a: "Цю погань треба викорінити!"
  flavor_ver.1002.title: "Змовника знайдено!"
  flavor_ver.1002.entry: "$flavor_ver.1002.title$"
  flavor_ver.1002.desc: "[target_character2.GetName] особисто спостерігає за тим, як [target_character.GetName] постає перед судом за звинуваченням у змові з ворогами династії [target_dynasty.GetName]. Кілька місяців поспіль [target_character.GetShortNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'листувалася', 'листувався')] з нашими противниками, сподіваючись, що [target_war.GetName] закінчиться на їхніх умовах. Причиною всього цього стала глибока ненависть: [target_character.GetShortName] так і не [Select_CString(target_character.IsFemale, 'змогла', 'зміг')] змиритися з втратою влади десять років тому."
  flavor_ver.1002.a: "Смерть!"
  flavor_ver.1003.title: "Браму відчинено!"
  flavor_ver.1003.desc: "В останні години облоги наш союзник у [target_location.Custom('LR_PREP')|l] [target_location.GetName] — [target_character.GetName] — [Select_CString(target_character.IsFemale, 'наказала', 'наказав')] гарнізону відбити обманний напад біля одних воріт, тим самим залишивши відчиненими інші. Весь [target_location.GetRank.GetName|l] виявився беззахисним перед нашими військами. Наслідки не забарилися: поселення взято, а [target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'проголошена', 'проголошений')] правителькою #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!, чому вельми зраді[target_estate.Custom('POSTEDIT_ESTATE_ENDING')] місцеві [target_estate.GetName|l]. Тепер [target_war.GetName] набуде зовсім іншого оберту: династія [target_dynasty.GetName] щойно позбулася одного з найцінніших своїх володінь."
  flavor_ver.1003.a: "Побільше б таких перемог!"
  flavor_ver.1004.title: "Передсмертні муки союзника"
  flavor_ver.1004.desc: "Страшні новини! Династія [target_dynasty.GetName] дізналася, що [target_character.GetName] — [Select_CString(target_character.IsFemale, 'колишня правителька', 'колишній правитель')] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! і наш союзник у цій країні — таємно сприяє нам. #L [target_country2.GetAdjective]і#! владики не роздумували двічі: [target_character.GetShortNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'була взята', 'був взятий')] у полон і відразу ж [Select_CString(target_character.IsFemale, 'засуджена', 'засуджений')] до смерті; відповідний наказ [Select_CString(target_character2.IsFemale, 'віддала', 'віддав')] [target_character2.GetName]."
  flavor_ver.1004.a: "Ми втратили сильного союзника."
  flavor_ver.1005.title: "Падіння Падуї"
  flavor_ver.1005.desc: "Виявилося, що змовник у #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_PREP')|L]#!#!, — це не хто інший, як [target_character.GetName]! [Select_CString(target_character.IsFemale, 'Ця підступна жінка, яку', 'Цей підступний чоловік, якого')] [target_character2.GetName] близько десяти років тому [Select_CString(target_character2.IsFemale, 'позбавила', 'позбавив')] посади вікарія, весь цей час [Select_CString(target_character.IsFemale, 'виношувала', 'виношував')] задум помсти династії [target_dynasty.GetName]. І сьогодні цей задум нарешті вдалося втілити в життя: [target_location.GetRank.GetName|l] зданий нашим ворогам, а [target_country.GetNameWithNoTooltip] сьогодні у [Select_CString(target_character.IsFemale, 'неї', 'нього')] в руках."
  flavor_ver.1005.a: "Ми переможемо, і неважливо, в чиїх руках [target_country.GetNameWithNoTooltip]."
  ver_will_join_target_war: "[THIS.GetCountry.GetName] приєдна[THIS.GetCountry.Custom('end_yeyu')]ться до війни «[target_war.GetName]» на боці атакувальних"