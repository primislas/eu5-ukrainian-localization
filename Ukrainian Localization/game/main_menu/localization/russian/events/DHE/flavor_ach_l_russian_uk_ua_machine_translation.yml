l_russian:
  flavor_ach.1.title: "[target_country.GetGovernment.GetRulerTitle] тікає з #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!"
  flavor_ach.1.entry: "Втеча епірського спадкоємця"
  flavor_ach.1.desc: "Після #L [target_country2.GetAdjective|l]ого#! вторгнення [target_country.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_ACC')|L]#!#! [GetCharacter('byz_andronikos_iii_palaiologos').GetName] [Select_CString(GetCharacter('byz_andronikos_iii_palaiologos').IsFemale, 'вигнала', 'вигнав')] [Select_CString(target_character.IsFemale,'законну спадкоємицю', 'законного спадкоємця')], [Select_CString(target_character.IsFemale,'яка мала', 'який мав')] взяти кермо влади після того, як помре [target_character.GetShortName], [Select_CString(target_character.IsFemale,'її', 'його')] [target_character.GetFather.GetName]. Замість [Select_CString(target_character.IsFemale,'неї', 'нього')] було призначено [target_country2.GetAdjectiveWithNoTooltip|l]ого намісника [GetCharacter('epi_theodoros_synadenos').GetName]. На щастя, [target_character.GetShortNameWithNoTooltip] [Select_CString(target_character.IsFemale,'була таємно вивезена', 'був таємно вивезений')] з країни за сприяння противників [target_country2.GetAdjectiveWithNoTooltip|l]ої влади. [target_character2.GetName] [Select_CString(target_character2.IsFemale,'очікувала', 'очікував')] зустрічі з [Select_CString(target_character.IsFemale,'нею', 'ним')]."
  flavor_ach.1.a: "[target_character.GetNameWithNoTooltip] — [Select_CString(target_character.IsFemale,'законна володарка', 'законний володар')] [target_country.Custom('CL_GEN')]!"
  flavor_ach.1.a.entry: "Він — законний господар їхніх володінь!"
  flavor_ach.1.b: "Ми втратили [target_country.Custom('CL_ACC')]."
  flavor_ach.1.b.entry: "Це безнадійний випадок."
  flavor_ach.2.title: "Підтримка [target_country.GetAdjectiveWithNoTooltip|l]ого претендента"
  flavor_ach.2.desc: "[Select_CString(target_character.IsFemale, 'Остання латинська правителька', 'Останній латинський правитель')] #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#!, [Select_CString(target_character.IsFemale, 'юна', 'юний')] [target_character.GetName], [Select_CString(target_character.IsFemale, 'була таємно вивезена', 'був таємно вивезений')] з країни та [Select_CString(target_character.IsFemale, 'переправлена', 'переправлений')] [target_country3.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[target_country3.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country3.Custom('CL_tt')],X [target_country3.Custom('CL_ACC')|L]#!#!, чий [target_country3.GetGovernment.GetRulerTitle|l] надає [Select_CString(target_character.IsFemale, 'їй', 'йому')] підтримку. [target_country3.GetLongName] постара[target_country3.Custom('endlong_yeyut')]ся відновити на троні [Select_CString(target_character.IsFemale, 'вигнану спадкоємицю', 'вигнаного спадкоємця')], у цьому немає жодних сумнівів.\n\nМи повинні остерігатися вторгнень, оскільки [target_character2.GetName] може завдати удару, поки ми слабкі."
  flavor_ach.2.a: "Нехай тільки посміють!"
  flavor_ach.3.title: "Згасаючий латинський вплив"
  flavor_ach.3.desc: "Хоча країною формально править латинська династія [target_character.GetDynasty.GetName], її вплив з кожним роком неухильно слабшає. #L [ROOT.GetCountry.GetCulture.GetName]а#! [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] часто виявляє байдужість до бід #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греків#!#!-простолюдинів. Дедалі більше людей з найрізноманітніших верств суспільства віддають перевагу грецькому претенденту на престол. [target_character2.GetName] може звільнити #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! від франкського гніту."
  flavor_ach.3.a: "Династія [target_character.GetDynasty.GetNameWithNoTooltip] впаде!"
  flavor_ach.3.a.entry: "Геть династію!"
  flavor_ach.3.b: "Придушити цей рух!"
  flavor_ach.4.title: "Латинська імператриця"
  flavor_ach.4.entry: "$flavor_ach.4.title$"
  flavor_ach.4.desc: "Попри те, що #TOOLTIP:FORMABLE_COUNTRY,LAT_f,X #L Латинська імперія#!#! впала 1261 року, її спадщина живе й досі в особі безперервної лінії титулярних імператорів. Чинна імператриця [target_character.GetName] з династії [target_character.GetDynasty.GetName], попри номінальний характер свого титулу, все ще користується значною повагою серед латинських країн, а представники її родини досі правлять [ROOT.GetCountry.Custom('longname_ua_INST')], одним із наймогутніших уламків імперії."
  flavor_ach.4.a: "[ShowFormableCountryNameWithNoTooltip('LAT_f')] відродиться!"
  flavor_ach.5.title: "[GetCountry('LAT').GetFlavorRank], але титулярно"
  flavor_ach.5.entry: "Титулярна імперія"
  flavor_ach.5.desc: "[GetCountry('LAT').GetGovernment.GetRulerTitle] [GetCountry('LAT').Custom('longname_ua_GEN')] [scope_ruler.GetName] [Select_CString(scope_ruler.IsFemale, 'володіє', 'володіє')] своїм «[GetCountry('LAT').GetAdjectiveWithNoTooltip|l]им» титулом виключно номінально, все ще користується значним впливом на решту представників #L [GetCountry('LAT').GetAdjectiveWithNoTooltip|l]ої#! еліти — для багатьох із них [ShowScriptedGeographyName('greece_geography')] стала домом — і зберігає зв’язки з #ONCLICK:COUNTRY,[naples_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[naples_country.Custom('CL_tt')],X [naples_country.Custom('CL_INST')|L]#!#!. Усі хитрощі та інтриги, до яких вдавався [scope_philip_latin_emperor.GetName] у надії зібрати сильне військо, здатне відновити імперію, закінчилися нічим: він помер, не довершивши своїх задумів, і ніхто не наважився продовжити його справу.\n\nЗа угодою, яку підписав [scope_alb_king.GetName], землі виявилися розподілені так: [scope_alb_king.GetShortNameWithNoTooltip] має право володарювати над #ONCLICK:COUNTRY,[albania_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[albania_country.Custom('CL_tt')],X [albania_country.Custom('CL_INST')|L]#!#!, а [ach_heir.GetName] — над #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#!; при цьому [scope_ruler.GetShortNameWithNoTooltip] продовжує офіційно керувати останньою країною.\n\nРадники, до яких [Select_CString(scope_ruler.IsFemale, 'близька', 'близький')] [scope_ruler.GetNameWithNoTooltip], вважають, що зараз складаються сприятливі обставини: в #ONCLICK:COUNTRY,[ath_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ath_country.Custom('CL_tt')],X [ath_country.Custom('CL_PREP')|L]#!#! розташувалася #TOOLTIP:CULTURE,$catalan_tt$,X #L Каталонська#!#! дружина, а [byz_country.GetGovernment.GetCourtTitle|l] #ONCLICK:COUNTRY,[byz_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[byz_country.Custom('CL_tt')],X [byz_country.Custom('CL_GEN')|L]#!#!, за чутками, занурюється в хаос. Це означає, що незабаром може випасти нагода відновити [GetCountry('LAT').Custom('longname_ua_wntt_ACC')], як того й хотів колись [scope_philip_latin_emperor.GetShortNameWithNoTooltip]."
  flavor_ach.5.a: "Постараємося заручитися прихильністю місцевих еліт."
  flavor_ach.5.b: "Будемо шукати дипломатичної підтримки в Греції."
  flavor_ach.5.c: "Нехай [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] почне закладати основу для майбутнього відродження."
  flavor_ach.5.c.entry: "Нехай двір почне закладати основу для майбутнього відродження."
  flavor_ach.6.title: "[naples_country.GetGovernment.GetCourtTitle] [naples_country.Custom('CL_GEN')] та наші зв’язки"
  flavor_ach.6.entry: "Зв’язки з двором Неаполя"
  flavor_ach.6.desc: "[scope_ruler.GetName] не тільки панує над #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#!, але й користується значним впливом — це може підтвердити [naples_country.GetGovernment.GetCourtTitle|l] [naples_country.Custom('CL_GEN')], а також [nap_ruler.GetName], з [Select_CString(nap_ruler.IsFemale, 'якою', 'яким')] [scope_ruler.GetShortNameWithNoTooltip] підтримує близькі стосунки. Деякі радники, що виступають за те, щоб [ShowScriptedGeographyName('greece_geography')] більше залежала від влади династії [scope_ruler.GetDynasty.GetName], пропонують за допомогою наявного авторитету заручитися підтримкою заможних [naples_country.GetAdjectiveWithNoTooltip|l] еліт."
  flavor_ach.6.a: "[naples_country.GetGovernment.GetCourtTitle|U] — цінний союзник. Нехай [scope_ruler.GetShortNameWithNoTooltip] спробує здобути прихильність [naples_country.GetAdjectiveWithNoTooltip|l]их придворних."
  flavor_ach.6.a.entry: "Нехай правитель спробує здобути прихильність неаполітанського двору."
  flavor_ach.6.b: "Нехай [scope_ruler.GetShortNameWithNoTooltip] скористається своїм впливом, щоб отримати фінансову підтримку."
  flavor_ach.6.b.entry: "Скористаємося його впливом, щоб отримати фінансову підтримку."
  flavor_ach.6.c: "Ім’я «[scope_ruler.GetShortNameWithNoTooltip]» користується доброю славою — [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ої країни отримає чимало користі від такої підтримки."
  flavor_ach.6.c.entry: "Наш двір отримає чимало користі від підтримки з його боку: його ім’я користується доброю славою."
  flavor_ach.7.title: "[nikephoros_ii_orsini.GetNameWithNoTooltip] та [epirus_country.GetLongNameWithNoTooltip]"
  flavor_ach.7.entry: "Відокремлення Епіру"
  flavor_ach.7.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, де переховується вигнанець [nikephoros_ii_orsini.GetName] — вельми цінний інструмент у політичній боротьбі, яку [scope_ruler.GetName] веде з #L [byz_country.GetAdjective|l]ою#! елітою, уважно слухає свіжі новини: вельми ймовірно, що незабаром [nikephoros_ii_orsini.GetLastNameWithNoTooltip] зможе знову зійти на престол, оскільки деякі #L [epirus_country.GetAdjective|l]ські#! [epirus_country.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] заручилися значною підтримкою і тепер готові підняти повстання проти [byz_country.GetAdjectiveWithNoTooltip|l]ого намісника.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle|U], миттєво вгледівши можливість ще більше поглибити розбрат, що роздирає [byz_country.Custom('CL_ACC')], закликає до того, щоб [scope_ruler.GetNameWithNoTooltip] [Select_CString(scope_ruler.IsFemale, 'скористалася', 'скористався')] нагодою: нехай [nikephoros_ii_orsini.GetLastNameWithNoTooltip] з [Select_CString(scope_ruler.IsFemale, 'її', 'його')] дозволу повернеться до [epirus_country.Custom('CL_ACC')]."
  flavor_ach.7.a: "Ми не проти: нехай [nikephoros_ii_orsini.GetLastNameWithNoTooltip] повертається до [epirus_country.Custom('CL_ACC')] за нашої підтримки."
  flavor_ach.7.a.entry: "Ми не проти: нехай $Orsini$ повертається до $EPI$ за нашої підтримки."
  flavor_ach.7.b: "Ми можемо висунути претензію на [epirus_country.Custom('CL_ACC')] від [Select_CString(nikephoros_ii_orsini.IsFemale, 'її', 'його')] імені — можливо, [nikephoros_ii_orsini.GetShortNameWithNoTooltip] погодиться."
  flavor_ach.7.b.entry: "Ми можемо висунути претензію на $EPI$ від імені цієї людини — можливо, $name_nikephoros.greek_language$ погодиться."
  flavor_ach.7.c: "Зараз це надто небезпечно."
  nikephoros_ii_orsini_revolt: "Повстання Орсіні"
  flavor_ach.8.title: "[nikephoros_ii_orsini.GetNameWithNoTooltip] повертає собі [epirus_country.Custom('CL_ACC')]!"
  flavor_ach.8.entry: "$name_nikephoros.greek_language$ $Orsini$ Reclaims $EPI$!"
  flavor_ach.8.desc: "По #L [ROOT.GetCountry.GetAdjective|l]ій#! землі розносяться вісті, до яких уважно прислухається [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]: [nikephoros_ii_orsini.GetLastNameWithNoTooltip] за підтримки своїх прихильників знову зайняв престол #ONCLICK:COUNTRY,[epirus_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[epirus_country.Custom('CL_tt')],X [epirus_country.Custom('CL_GEN')|L]#!#! та оголосив про відокремлення [epirus_country.Custom('CL_GEN')] від #ONCLICK:COUNTRY,[byz_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[byz_country.Custom('CL_tt')],X [byz_country.Custom('CL_GEN')|L]#!#!! Немає жодних сумнівів, що [scope_ruler.GetName] оголосить те, що сталося, великою перемогою, оскільки [byz_country.GetGovernment.GetCourtTitle|l] [byz_country.GetAdjectiveWithNoTooltip|l]ої країни тепер слабший, ніж раніше. Деякі, втім, вважають, що тепер [scope_ruler.GetShortNameWithNoTooltip] [Select_CString(scope_ruler.IsFemale, 'повинна', 'повинен')] захопити [epirus_country.Custom('CL_ACC')], поки [nikephoros_ii_orsini.GetShortNameWithNoTooltip] ще не зосередив у своїх руках усю повноту влади."
  flavor_ach.8.a: "Замість цього укладемо офіційний союз з [epirus_country.Custom('CL_INST')]."
  flavor_ach.8.a.entry: "Замість цього укладемо офіційний союз з Епіром."
  flavor_ach.8.b: "Наша країна та [nikephoros_ii_orsini.GetLastNameWithNoTooltip] збережуть близькі стосунки — і все."
  flavor_ach.8.b.entry: "Наша країна та $Orsini$ збережуть близькі стосунки — і все."
  flavor_ach.8.c: "Зараз це надто небезпечно."
  flavor_ach.9.title: "Заколот у [epirus_country.Custom('CL_PREP')]"
  flavor_ach.9.desc: "Страшні новини! #L [epirus_country.GetAdjective|U]а#! [epirus_country.GetGovernment.GetEstateName('nobles_estate')|l], яку підтримує [ach_scope_ruler.GetName], підняла заколот: вони хочуть, щоб #ONCLICK:COUNTRY,[epirus_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[epirus_country.Custom('CL_tt')],X [epirus_country.Custom('CL_INST')|L]#!#! [Select_CString(nikephoros_ii_orsini.IsFemale, 'правила', 'правив')] [nikephoros_ii_orsini.GetName]. [epi_scope_ruler.GetName] [Select_CString(epi_scope_ruler.IsFemale, 'запросила', 'запросив')] у #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! термінової допомоги в придушенні заколоту."
  flavor_ach.9.a: "Допомогти [epirus_country.GetAdjectiveWithNoTooltip|l]ому наміснику!"
  flavor_ach.9.a.entry: "Допомогти епірському наміснику!"
  flavor_ach.9.b: "Це не наша турбота."
  flavor_ach_9_tt: "Якщо [nikephoros_ii_orsini.GetName] переможе, [epirus_country.GetName] здобуд[epirus_country.Custom('end_youtut')] незалежність"
  flavor_ach.10.title: "Відвоювання Пелопоннесу"
  flavor_ach.10.entry: "$flavor_ach.10.title$"
  flavor_ach.10.desc: "Після завершення в 1204 році четвертого хрестового походу #TOOLTIP:AREA,morea_area,X #L Морея#!#! опинилася в числі численних регіонів, завойованих хрестоносцями після падіння #ONCLICK:COUNTRY,[byz_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[byz_country.Custom('CL_tt')],X [byz_country.Custom('CL_GEN')|L]#!#!. Втім, за останні кілька десятиліть [byz_country.GetAdjectiveWithNoTooltip|l]і еліти зуміли повернути собі частину регіону, хоча значна його частка залишається під #L [ROOT.GetCountry.GetAdjective|l]ою#! владою.\n\n[byz_country.GetGovernment.GetCourtTitle|U] [byz_country.GetAdjectiveWithNoTooltip|l]ої країни сьогодні на межі сповзання в хаос; деякі наші радники вважають, що нам випала вдала нагода влаштувати новий похід, відвоювати втрачене і назавжди позбавити Морею [byz_country.GetAdjectiveWithNoTooltip|l]ого впливу."
  flavor_ach.10.a: "Час потіснити [byz_country.Custom('longname_ua_wntt_ACC')]!"
  flavor_ach.10.a.entry: "Час потіснити Візантію!"
  flavor_ach.10.b: "Краще почекати: можливо, [byz_country.GetAdjectiveWithNoTooltip|l]а країна і правда нестійка."
  flavor_ach.10.b.entry: "Краще почекати: можливо, візантійська країна і правда нестійка."
  flavor_ach.11.title: "Повсюдна нестабільність у [byz_country.Custom('CL_PREP')]"
  flavor_ach.11.entry: "Отримати вигоду з громадянської війни у Візантії"
  flavor_ach.11.desc: "#L [ROOT.GetCountry.GetAdjective|U]і#! шпигуни вкотре повідомляють: [byz_country.GetGovernment.GetCourtTitle|l] #ONCLICK:COUNTRY,[byz_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[byz_country.Custom('CL_tt')],X [byz_country.Custom('CL_GEN')|L]#!#!, за чутками, все ще в політично нестабільному стані. Цього разу, втім, до їхніх донесень додалося ще одне: вельми ймовірно, що [byz_country.GetAdjectiveWithNoTooltip|l]а [byz_country.GetGovernment.GetEstateName('nobles_estate')|l], будучи більше не в силах терпіти правлячу династію [byz_ruler.GetDynasty.GetName], замишляє переворот.\n\nЧастина радників сподівається, що [scope_ruler.GetName] зможе отримати вигоду з обстановки, що складається: у [byz_country.Custom('CL_PREP')] може розгорітися громадянська війна."
  flavor_ach.11.a: "Час обрізати орлу крила!"
  flavor_ach.11.b: "Не будемо втручатися в [byz_country.GetAdjectiveWithNoTooltip|l]і справи."
  flavor_ach.11.b.entry: "Не будемо втручатися у візантійські справи."
  flavor_ach.12.title: "Умиротворення грецької еліти"
  flavor_ach.12.entry: "Грецьке населення Ахеї"
  flavor_ach.12.desc: "[ShowScriptedGeographyName('greece_geography')] під владою #L [GetCountry('LAT').GetAdjective|l]их#! правителів переживає неспокійні часи: колишня #TOOLTIP:CULTURE,$greek_culture_tt$,X #L грецька#!#! еліта почала занепадати; у деяких куточках #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! ж, навпаки, вихідці зі старих грецьких сімейств зуміли зберегти вплив, нехай навіть #L [ROOT.GetCountry.GetCulture.GetName|l]а#! [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] змусила їх піти на певні поступки. Однак після падіння [GetCountry('LAT').Custom('longname_ua_wntt_GEN')] грецьке населення поступово почало чинити опір [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]ій владі.\n\nЩоб не допустити заворушень, [scope_ruler.GetNameWithNoTooltip] і [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] країни запросили представників грецьких сімейств, що залишилися в [ROOT.GetCountry.Custom('CL_PREP')], на переговори, щоб дійти згоди. З цим не згодні деякі [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]і [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l]: вони, навпаки, вимагають розширення своєї влади над греками і заявляють, що сильна [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]а еліта зможе приборкати баламутів."
  flavor_ach.12.a: "Залишимо все як є."
  flavor_ach.12.b: "[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|U]а [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] заслуговує нашої підтримки."
  flavor_ach.12.b.entry: "Знать заслуговує нашої підтримки."
  flavor_ach.12.c: "Спробуємо домовитися з грецькими сімействами."
  flavor_ach.13.title: "Загроза з [athens_country.Custom('CL_GEN')]"
  flavor_ach.13.entry: "Каталонська влада над Афінами"
  flavor_ach.13.desc: "[scope_ruler.GetName], [Select_CString(scope_ruler.IsFemale, 'яка заявляє', 'який заявляє')] права на [GetCountry('LAT').Custom('longname_ua_wntt_ACC')], користується підтримкою багатьох місцевих #L [GetCountry('LAT').GetAdjective|l]их#! володарів, яким частково підкоряється [ShowScriptedGeographyName('greece_geography')]. Водночас влада [athens_country.Custom('longname_ua_GEN')] щороку виявляє все більше ворожості, сподіваючись, вочевидь, на підтримку #TOOLTIP:CULTURE,$catalan_tt$,X #L Каталонської#!#! дружини. Утім, деякі невдоволені [athens_country.GetAdjectiveWithNoTooltip|l]і [athens_country.GetGovernment.GetEstateName('nobles_estate')|l] звернулися безпосередньо до #L [ROOT.GetCountry.GetAdjective|l]ого#! двору в надії, що їм допоможуть вигнати найманців з [athens_country.Custom('CL_GEN')]; натомість вони обіцяють присягнути на вірність [ROOT.GetCountry.Custom('CL_DAT')]."
  flavor_ach.13.a: "Натомість нехай каталонські [athens_country.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] у [athens_country.Custom('CL_PREP')] стануть нам друзями."
  flavor_ach.13.a.entry: "Натомість нехай каталонські аристократи в Афінах стануть нам друзями."
  flavor_ach.13.b: "Ми виконаємо їхнє прохання і виженемо Каталонську дружину з [athens_country.Custom('CL_GEN')]."
  flavor_ach.13.b.entry: "Ми виконаємо їхнє прохання і виженемо Каталонську дружину з Афін."
  flavor_ach.13.c: "Скористаємося цією нагодою і завоюємо [athens_country.Custom('rank_ua_ACC')|l]."
  flavor_ach.13.c.entry: "Скористаємося цією нагодою і завоюємо країну."
  ach_vassalize_athens_for_reward: "Якщо нам вдасться підкорити #ONCLICK:COUNTRY,[athens_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[athens_country.Custom('CL_tt')],X [athens_country.Custom('CL_ACC')|L]#!#!, ми зможемо встановити нового правителя, зручного для #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!"
  flavor_ach.14.title: "Каталонська дружина вигнана з [athens_country.Custom('CL_GEN')]"
  flavor_ach.14.entry: "Відновлення франкської влади над Афінами"
  flavor_ach.14.desc: "Після того як [scope_ruler.GetName] [Select_CString(scope_ruler.IsFemale, 'розгромила', 'розгромив')] #TOOLTIP:CULTURE,$catalan_tt$,X #L Каталонську#!#! дружину і [Select_CString(scope_ruler.IsFemale, 'вигнала', 'вигнав')] її з #ONCLICK:COUNTRY,[athens_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[athens_country.Custom('CL_tt')],X [athens_country.Custom('CL_GEN')|L]#!#!, багато представників [athens_country.GetAdjectiveWithNoTooltip|l]ої еліти присягнули [Select_CString(scope_ruler.IsFemale, 'їй', 'йому')] на вірність. Оскільки колишній володар [athens_country.Custom('rank_ua_GEN')|l] тепер у вигнанні, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] пропонує повернути на престол [athens_country.Custom('CL_GEN')] франкську династію; деякі, втім, вважають, що не варто проминути нагоди налагодити відносини з греками: місцеві [athens_country.GetGovernment.GetEstateName('nobles_estate')|l] будуть вдячні, якщо до влади прийде один із місцевих представників цього стану."
  flavor_ach.14.a: "Франкські [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] будуть раді, якщо [athens_country.GetGovernment.GetRulerTitle|l] вийде з їхніх лав. Так ми й зробимо."
  flavor_ach.14.a.entry: "Франкські аристократи будуть раді, якщо правитель вийде з їхніх лав. Так ми й зробимо."
  flavor_ach.14.b: "Франкські [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] отримають бажане, але разом з цим ми наділимо привілеями грецьке населення [athens_country.Custom('CL_GEN')]."
  flavor_ach.14.b.entry: "Франкські аристократи отримають бажане, але разом з цим ми наділимо привілеями грецьке населення Афін."
  flavor_ach.14.c: "Нехай деякі грецькі [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] візьмуть кермо влади [athens_country.Custom('CL_INST')]."
  flavor_ach.14.c.entry: "Нехай деякі грецькі аристократи візьмуть кермо влади Афінами."
  flavor_ach.15.title: "[scope_ruler.GetNameWithNoTooltip] сходить на престол"
  flavor_ach.15.entry: "Передача імператорського титулу"
  flavor_ach.15.desc: "Після того як померла [latin_empress_catherine_valois.GetName], [scope_ruler.GetName] [Select_CString(scope_ruler.IsFemale, 'успадкувала', 'успадкував')] право на титул [GetCountry('LAT').Custom('longname_ua_wntt_GEN')]. З цієї нагоди [ROOT.GetCountry.GetCapital.GetName] готується до грандіозного свята. Однак, хоча [latin_empress_catherine_valois.GetShortNameWithNoTooltip] і [scope_philip_latin_emperor.GetName] відчайдушно боролися за забезпечення цьому титулу важливості та впливу, багато місцевих [GetCountry('LAT').GetAdjectiveWithNoTooltip|l]их володарів, яким частково підкоряється [ShowScriptedGeographyName('greece_geography')], відмовляються визнавати претензії династії [scope_ruler.GetDynasty.GetName] на [GetCountry('LAT').Custom('longname_ua_wntt_ACC')].\n\nНа щастя, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] багато в чому на [Select_CString(scope_ruler.IsFemale, 'її', 'його')] боці: багато хто закликає до того, щоб [scope_ruler.GetNameWithNoTooltip] [Select_CString(scope_ruler.IsFemale, 'пішла', 'пішов')] стопами своїх батьків і [Select_CString(scope_ruler.IsFemale, 'скористалася', 'скористався')] майбутньою церемонією як способом залучити нові сили до відновлення імперії."
  flavor_ach.15.a: "Залишити коронацію винятково церемоніальною."
  flavor_ach.15.b: "Намагатися за допомогою церемонії підкріпити зусилля з відродження імперії."
  flavor_ach.15.c: "Намагатися за допомогою церемонії домогтися політичної прихильності у вірних лордів."
  flavor_ach.16.title: "[the_pope.GetNameWithNoTooltip] пропонує допомогу у відновленні [GetCountry('LAT').Custom('longname_ua_wntt_GEN')]"
  flavor_ach.16.entry: "Папа зацікавлений у відновленні Латинської імперії"
  flavor_ach.16.desc: "Слово «[ShowScriptedGeographyName('greece_geography')]» сьогодні на вустах у багатьох. Дізнавшись про наші походи, [the_pope.GetName] [Select_CString(the_pope.IsFemale, 'надіслала', 'надіслав')] з #ONCLICK:COUNTRY,[scope_papal_states.Custom('CL_tt')] #TOOLTIP:COUNTRY,[scope_papal_states.Custom('CL_tt')],X [scope_papal_states.Custom('CL_GEN')|L]#!#! гінця з пропозицією допомоги.\n\nОскільки ми — [ShowGovernmentReformName('ach_heirs_of_the_latin_empire')|l] по праву, [the_pope.GetShortNameWithNoTooltip] [Select_CString(the_pope.IsFemale, 'запропонувала', 'запропонував')] нам грошову та політичну підтримку [scope_papal_states.Custom('CL_GEN')] — за умови, що ми погодимося допомогти у відповідь: [scope_papal_states.GetGovernment.GetRulerTitle|l] зараз намагається примирити #TOOLTIP:RELIGION,$catholic_tt$,X #L католицьку#!#! та #TOOLTIP:RELIGION,$orthodox_tt$,X #L православну#!#! церкви.\n\n[the_pope.GetNameWithNoTooltip] також закликає нас — на випадок, якщо [constantinople_location.GetName] повернеться на своє колишнє місце — пам’ятати, яка трагедія спіткала #L #TOOLTIP:LOCATIONRANK,[constantinople_location.Custom('LR_tt')],X [constantinople_location.Custom('LR_ACC')|l]#!#! під час четвертого хрестового походу, і не допустити її повторення."
  flavor_ach.16.a: "Погодитися на вимоги [scope_papal_states.GetAdjectiveWithNoTooltip|l]ого гінця в обмін на підтримку."
  flavor_ach.16.a.entry: "Погодитися на вимоги римського посла в обмін на підтримку."
  flavor_ach.16.b: "[the_pope.GetShortNameWithNoTooltip] нам ні до чого: ми візьмемо [constantinople_location.Custom('LR_ACC')|l] [constantinople_location.GetNameWithNoTooltip] самотужки."
  flavor_ach.16.b.entry: "Він нам ні до чого: ми візьмемо Константинополь самотужки."
  lat_aggressive_conversion_policies_tt: "В обмін на підтримку [the_pope.GetName] може попросити нас прийняти суворі політики навернення в релігію, якщо ми проголосимо [GetCountry('LAT').Custom('longname_ua_ACC')]"
  flavor_ach.17.title: "[constantinople_location.GetNameWithNoTooltip] знову в наших руках!"
  flavor_ach.17.entry: "Константинополь знову в наших руках!"
  flavor_ach.17.desc: "Ми здійснили неможливе: [constantinople_location.GetName] знову належить нам! Оскільки [constantinople_location.GetRank.GetName|l] перебуває в плачевному стані, [scope_ruler.GetName] [Select_CString(scope_ruler.IsFemale, 'наказала', 'наказав')] #L [ROOT.GetCountry.GetAdjective|l]им#! воякам поводитися обережно, щоб не викликати зайвий раз гніву жителів.\n\nСьогодні значна частина [constantinople_location.Custom('LR_GEN')|l] [constantinople_location.GetNameWithNoTooltip] у наших руках, зокрема імператорський палац у Влахернах, поспіхом залишений попереднім власником. [scope_ruler.GetNameWithNoTooltip] [Select_CString(scope_ruler.IsFemale, 'звернулася', 'звернувся')] до [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]их еліт із проханням якнайшвидше проголосити відродження [GetCountry('LAT').Custom('longname_ua_GEN')], хоча [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] попереджає, що буде розумніше спочатку як слід тут закріпитися."
  flavor_ach.17.a: "Час знову взяти владу над [constantinople_location.Custom('LR_INST')|l] [constantinople_location.GetNameWithNoTooltip] у свої руки."
  flavor_ach.17.a.entry: "Час знову взяти владу над Константинополем у свої руки."
  flavor_ach.17.b: "Перед тим як відроджувати імперію, треба закріпити успіх."
  flavor_ach.17.c: "Розграбувати [constantinople_location.Custom('LR_ACC')|l] [constantinople_location.GetNameWithNoTooltip]!"
  flavor_ach.17.c.entry: "Розграбувати Константинополь!"