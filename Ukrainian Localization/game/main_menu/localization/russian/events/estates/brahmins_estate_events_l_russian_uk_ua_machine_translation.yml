l_russian:
  brahmins_estate_events.2.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|U] вимага[ROOT.GetCountry.Custom('clergy_yeyut')] офіційно закріпити придворні посади"
  brahmins_estate_events.2.desc: "Нерідко [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] прагн[ROOT.GetCountry.Custom('clergy_eut')] не тільки до духовної, а й до мирської влади. Останнім часом вони стали вельми впливові на території #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! і займають там багато важливих адміністративних посад. Звикши до високого становища, ц[ROOT.GetCountry.Custom('clergy_eyyaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] виріши[ROOT.GetCountry.Custom('clergy_vlaloly')], що [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] підкориться їхнім примхам. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] вимага[ROOT.GetCountry.Custom('clergy_yeyut')] законодавчого закріплення деяких адміністративних позицій за собою, неухильного дотримання своїх звичаїв при дворі та навіть успадкування вищих міністерських посад у своїх родинах. Ці вимоги обурливі, але [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] настільки впливов[ROOT.GetCountry.Custom('clergy_yiaei')], що відмова може помітно підірвати управління країною."
  brahmins_estate_events.2.a: "Визнаємо їхню владу."
  STATIC_MODIFIER_NAME_religious_court_life: "Перевага духовенства"
  STATIC_MODIFIER_DESC_religious_court_life: "При нашому дворі панує каста священнослужителів, і всі повинні дотримуватися правил, встановлених їхніми текстами. Ці суворі порядки необхідні, щоб зберегти прихильність нашого могутнього духовенства. Однак багато наших підданих, незалежно від їхнього становища та багатства, противляться застарілому укладу."
  brahmins_estate_events.2.b: "Нехай краще [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] поверн[ROOT.GetCountry.Custom('clergy_etsautsa')] до своїх молитов."
  brahmins_estate_events.3.title: "Брахманізм"
  brahmins_estate_events.3.desc: "#L [ROOT.GetCountry.GetReligion.GetAdjective]е#! суспільство #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! схиляється до брахманізму. Згідно з цією ідеєю, [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] повин[ROOT.GetCountry.Custom('clergy_ennanoni')] шануватися як представники духовної та світської влади.\n\nВони ревно захищають свою монополію поширювати освіту санскритом і зберігають виняткове право проповідувати ведичні писання. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] дом[ROOT.GetCountry.Custom('clergy_ihohlaloly')]ся могутності завдяки своєму суспільному та духовному впливу. До того ж [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName|l] підтримує тісні стосунки з кастою жерців, щоб зберегти стійкий суспільний порядок на території #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!."
  brahmins_estate_events.3.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  brahmins_estate_events.4.title: "Впливов[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l]"
  brahmins_estate_events.4.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] ста[ROOT.GetCountry.Custom('clergy_yeyut')] впливов[ROOT.GetCountry.Custom('clergy_ymoyuymy')] на території #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Будучи кастою жерців, висвячених самими богами, вони користуються підтримкою #L [ROOT.GetCountry.GetReligion.GetAdjective|l]их#! громад та займають низку ключових посад в [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ій адміністрації."
  brahmins_estate_events.4.a: "Хай так і буде."
  est_val_brahmin_advance: "Впливові брахмани"
  brahmins_estate_events.5.title: "Влада брахманів слабшає"
  brahmins_estate_events.5.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] спира[ROOT.GetCountry.Custom('clergy_yetsayutsa')] на підтримку #L [ROOT.GetCountry.GetReligion.GetAdjective|l]их#! громад більше, ніж будь-яка інша каста. Важко сказати точно, чому так сталося, але її членів стали вважати не стільки хранителями ведичних доктрин, скільки багатими корумпованими інтриганами.\n\nДо того ж їм бракує політичної гнучкості, а [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] не виявляє до них прихильності. Усе це призвело до того, що [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] ста[ROOT.GetCountry.Custom('clergy_vlaloly')] втрачати владу та вплив."
  brahmins_estate_events.5.a: "Хай так і буде."
  brahmins_estate_events.6.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|U] розпалю[ROOT.GetCountry.Custom('clergy_yeyut')] народне повстання"
  brahmins_estate_events.6.desc: "Уряд і [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] досягли точки кипіння у своїх взаєминах. Під час церемоній пуджарі відкрито заявляють, що [ROOT.GetCountry.GetGovernment.GetRuler.GetName|l] — негідна людина, а [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] відмовля[ROOT.GetCountry.Custom('clergy_yetsayutsa')] допомагати нам керувати #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ими#! підданими.\n\nКоли [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'допустила', 'допустив')] релігійну помилку, обурення переросло в справжній бунт. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] підня[ROOT.GetCountry.Custom('clergy_vlaloly')] народ на заколот проти нас!"
  brahmins_estate_events.6.a: "Хай так і буде."
  brahmins_estate_events.7.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|U] утиска[ROOT.GetCountry.Custom('clergy_yeyut')] купців у провінції [brahmin_trade_province.GetName]"
  brahmins_estate_events.7.desc: "Провінція [brahmin_trade_province.GetName] — важливий торговий вузол #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Сюди часто заглядали мусульманські купці з Гуджарату, Аравії та Персії. Провінція [brahmin_trade_province.GetName] підтримувала з ними міцні торгові зв'язки, що приносило їй лише вигоду.\n\nЗараз провінцією [brahmin_trade_province.GetNameWithNoTooltip] керу[ROOT.GetCountry.Custom('clergy_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l], чий вплив відчувається на всіх рівнях суспільного життя. Політика, що проводиться ними, значно погіршила ставлення суспільства до заїжджих мусульманських торговців. Зіткнувшись з неприязню, багато з цих купців вирішили вести свої справи в більш сприятливому місці.\n\nПотрібно щось зробити і знову залучити купців, інакше провінція [brahmin_trade_province.GetNameWithNoTooltip] може втратити репутацію центру торгівлі."
  brahmins_estate_events.7.a: "Проблеми купців з нижчої касти — не наша турбота."
  brahmins_estate_events.7.b: "Передамо управління містом до рук тих, хто більше дбає про торгові відносини."
  brahmins_estate_events.9.title: "Релігійні течії, з якими не пов'язан[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l]"
  brahmins_estate_events.9.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] зазвичай користува[ROOT.GetCountry.Custom('clergy_vlaloly')]ся винятковим правом на духовну #L [ROOT.GetCountry.GetReligion.GetAdjective|l]у#! владу, однак нові вірування стають проблемою для брахманізму. Ці течії набирають популярність на території #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, попри те, що [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] відчайдушно намага[ROOT.GetCountry.Custom('clergy_yetsayutsa')] їх придушити.\n\nПредставники нового вчення стверджують, що [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] постира[ROOT.GetCountry.Custom('clergy_vlaloly')] зі своїх лобів священні мітки та уника[ROOT.GetCountry.Custom('clergy_yeyut')] своїх духовних обов'язків, щоб зайняти світські посади та пригнічувати бідняків. Вони заявляють, що єдиний шлях до спасіння полягає в самозабутній відданості, і будь-який ревний прихильник [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip|l]ої віри може виховати в собі цю чесноту.\n\nВпливов[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] прос[ROOT.GetCountry.Custom('clergy_ytyat')], щоб [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'допомогла', 'допоміг')] їм повернути довіру суспільства та придушити сторонні [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip|l]і течії."
  brahmins_estate_events.9.a: "Нехай [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] насаджу[ROOT.GetCountry.Custom('clergy_yeyut')] традиційні вірування."
  STATIC_MODIFIER_NAME_brahmin_orthodoxy_enforced: "Примусовий догматизм брахманів"
  STATIC_MODIFIER_DESC_brahmin_orthodoxy_enforced: "Релігійні течії, не пов'язані з брахманами, підкоряються брахманським догмам."
  brahmins_estate_events.9.b: "Підтримаємо популярні релігійні течії."
  STATIC_MODIFIER_NAME_nonbrahmin_movements: "Релігійні течії, не пов'язані з брахманами"
  STATIC_MODIFIER_DESC_nonbrahmin_movements: "Простий люд захопився індуїстськими релігійними вченнями, які підривають авторитет брахманів."
  brahmins_estate_events.10.title: "Проблеми у фортеці провінції [brahmin_fort_province.GetNameWithNoTooltip]"
  brahmins_estate_events.10.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] та військові касти розпалили конфлікт, куди залучений увесь двір #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Напруга зростає, і перед нами постає питання управління фортецею. Фортеця провінції [brahmin_fort_province.GetName], якою зараз керує вельми сварливий воєначальник, знаходиться там, де набира[ROOT.GetCountry.Custom('clergy_yeyut')] силу [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l].\n\nНе виключено, що протиріччя переростуть у відкриту ворожнечу. Можливо, буде розумно зробити так, щоб контроль над цією важливою фортецею отрима[ROOT.GetCountry.Custom('clergy_vlaloly')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] і тим самим позбавити норовливого воєначальника потужного важеля впливу. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] не настільки обізнан[ROOT.GetCountry.Custom('clergy_yiaei')] в мистецтві облоги, як військові, але [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] хоча б може розраховувати на їхню вірність.\n\nЄ й інший шлях — переконати воєначальника стримати запал, а натомість зберегти його високе становище в провінції [brahmin_fort_province.GetNameWithNoTooltip]."
  brahmins_estate_events.10.a: "Нехай [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] забира[ROOT.GetCountry.Custom('clergy_yeyut')] фортецю."
  brahmins_estate_events.10.b: "Нехай знать керує фортецею, доки зберігає вірність."