l_russian:
  clergy_events_common: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] здавна є одним зі стовпів [ROOT.GetCountry.Custom('longname_ua_GEN')]. Вони наставляють суспільство на шлях істинний, до того ж [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] отримує собі на службу управлінців, правознавців та послів з цього стану."
  clergy_estate_common_ending: "Однак настали непрості часи, і країні потрібно покривати збільшені витрати. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] м[ROOT.GetCountry.Custom('clergy_ihohlaloly')] б надати добровільну допомогу, але ця пропозиція не зустріла ентузіазму."
  clergy_estate_events.1.title: "Libertas Ecclesiae"
  clergy_estate_events.1.desc: "$clergy_events_common$ Натомість церковні маєтки, монастирі та інші володіння не сплачують податків країні; крім того, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] вирішу[ROOT.GetCountry.Custom('clergy_yeyut')] свої внутрішні справи без втручання світської влади.\n\n$clergy_estate_common_ending$"
  clergy_estate_events.1.a: "Дамо зрозуміти, що їм потрібно зробити свій внесок."
  clergy_estate_events.1.b: "Знайдемо гроші деінде."
  clergy_estate_events.101.title: "Храмові землі"
  clergy_estate_events.101.desc: "$clergy_events_common$ Натомість країна та небайдужі люди протягом багатьох років жертвували села, щоб [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] м[ROOT.GetCountry.Custom('clergy_ihohlaloly')] існувати на пожертвуване. Ці землі отримали назву «брахмадея», і завдяки їм наш[ROOT.GetCountry.Custom('clergy_aei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] значно розбагаті[ROOT.GetCountry.Custom('clergy_vlaloly')] за минулі століття.\n\n$clergy_estate_common_ending$"
  clergy_estate_events.101.a: "Дамо зрозуміти, що їм потрібно зробити свій внесок."
  clergy_estate_events.101.b: "Знайдемо гроші деінде."
  clergy_estate_events.102.title: "Багат[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l]"
  clergy_estate_events.102.desc: "$clergy_events_common$ Натомість [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] та шановані ними боги багато років отримували пожертви від країни та небайдужих людей. Завдяки цим дарам [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] ста[ROOT.GetCountry.Custom('clergy_vlaloly')] значно багатш[ROOT.GetCountry.Custom('clergy_ymoyuymy')] та впливовіш[ROOT.GetCountry.Custom('clergy_ymoyuymy')] за минулі століття.\n\n$clergy_estate_common_ending$"
  clergy_estate_events.102.a: "Дамо зрозуміти, що їм потрібно зробити свій внесок."
  clergy_estate_events.102.b: "Знайдемо гроші деінде."
  clergy_estate_events.103.title: "Багат[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l]"
  clergy_estate_events.103.desc: "$clergy_events_common$ Натомість багато земель були визнані релігійною власністю та звільнені від більшої частини податків, завдяки чому [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] не відчува[ROOT.GetCountry.Custom('clergy_yeyut')] потреби та мож[ROOT.GetCountry.Custom('clergy_eut')] підтримувати багато гідних починань.\n\n$clergy_estate_common_ending$"
  clergy_estate_events.103.a: "Дамо зрозуміти, що їм потрібно зробити свій внесок."
  clergy_estate_events.103.b: "Знайдемо гроші деінде."
  clergy_estate_events.104.title: "Багат[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l]"
  clergy_estate_events.104.desc: "$clergy_events_common$ За свою чудову службу [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] багато років отримува[ROOT.GetCountry.Custom('clergy_vlaloly')] пожертви від країни та небайдужих людей. Завдяки цим дарам вони стали значно багатшими та впливовішими за минулі століття.\n\n$clergy_estate_common_ending$"
  clergy_estate_events.104.a: "Дамо зрозуміти, що їм потрібно зробити свій внесок."
  clergy_estate_events.104.b: "Знайдемо гроші деінде."
  clergy_estate_events.105.title: "Багат[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l]"
  clergy_estate_events.105.desc: "$clergy_events_common$ За свою чудову службу [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] та їхні обширні земельні володіння багато років отримували пожертви від країни та небайдужих людей. Завдяки цим дарам [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] ста[ROOT.GetCountry.Custom('clergy_vlaloly')] значно багатш[ROOT.GetCountry.Custom('clergy_ymoyuymy')] та впливовіш[ROOT.GetCountry.Custom('clergy_ymoyuymy')] за минулі століття.\n\n$clergy_estate_common_ending$"
  clergy_estate_events.105.a: "Дамо зрозуміти, що їм потрібно зробити свій внесок."
  clergy_estate_events.105.b: "Знайдемо гроші деінде."
  clergy_estate_events.2.title: "Впливов[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l]"
  clergy_estate_events.2.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] ніколи не поклада[ROOT.GetCountry.Custom('clergy_vlaloly')]ся на країну. Навпаки, завдяки своєму зв'язку з духовним світом [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] нада[ROOT.GetCountry.Custom('clergy_yeyut')] духовної правочинности світській владі, і [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] багато в чому спирається на їхню підтримку. За останній час вправні політичні маневри, розпалювання страху та щедрі пожертви наших підданих міцно зміцнили владу цього стану."
  clergy_estate_events.2.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
  clergy_estate_events.3.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] втрача[ROOT.GetCountry.Custom('clergy_yeyut')] вплив"
  clergy_estate_events.3.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] поклада[ROOT.GetCountry.Custom('clergy_yetsayutsa')] на єдність з народом більше, ніж будь-який інший стан. Важко сказати точно, чому так сталося, але в останні роки [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] ста[ROOT.GetCountry.Custom('clergy_vlaloly')] сприйматися не як духовні наставники нашої країни, а скоріше як багаті корумповані інтригани. До того ж [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] не найкращим чином розвива[ROOT.GetCountry.Custom('clergy_vlaloly')] свої володіння та прийма[ROOT.GetCountry.Custom('clergy_vlaloly')] невірні політичні рішення. Все це призвело до того, що [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] поча[ROOT.GetCountry.Custom('clergy_vlaloly')] втрачати владу та вплив. На жаль, вони не бажають брати провину за те, що відбувається, на себе і замість цього перекладають відповідальність на уряд."
  clergy_estate_events.3.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
  clergy_estate_events.4.title: "Антиклерикалізм"
  clergy_estate_events.4.desc: "У кількох великих містах нашої країни [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] останнім часом повод[ROOT.GetCountry.Custom('clergy_ytyat')]ся як ненажерливі нероби. Набожний простолюд та [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] об'єдналися і на знак незгоди з особливо кричущими зловживаннями відмовилися виплачувати десятину.\n\n[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] у люті та вимага[ROOT.GetCountry.Custom('clergy_yeyut')], щоб [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l], які нібито стоять на чолі цього руху, виплатили штраф."
  clergy_estate_events.4.a: "Ми змусимо їх заплатити!"
  clergy_estate_events.4.b: "Достатньо буде й м'якого докору."
  clergy_estate_events.5.title: "Ворож[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l]"
  clergy_estate_events.5.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] не в найкращих стосунках з країною — дійшло до того, що будь-яке спілкування з ними неодмінно ведеться в обставинах недовіри і навіть відвертої зневаги. Святині нашої країни стали осередками опору, де [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] відверто засуджується. Більша частина вірян на наших землях сумнівається в нашому праві на владу.\n\nНе дивно, що навіть незначні помилки підігрівають бурхливе невдоволення. По всій країні повста[ROOT.GetCountry.Custom('peasants_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l], яких підбурю[ROOT.GetCountry.Custom('clergy_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l], спрямовуючи народний гнів проти нас."
  clergy_estate_events.5.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
  clergy_estate_events.6.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] взя[ROOT.GetCountry.Custom('clergy_vlaloly')] гору?"
  clergy_estate_events.6.desc: "Хоча [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] повсюдно користу[ROOT.GetCountry.Custom('clergy_yetsayutsa')] повагою, і ніхто не сміє відкрито кинути їм виклик, мало в яких країнах вони так само впливові, як на території #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. У нас немає жодного інституту, який би не контролюва[ROOT.GetCountry.Custom('clergy_vlaloly')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l], а [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] залежить від них ще більше, ніж раніше.\n\nНапевно, цілком природно, що [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] захоті[ROOT.GetCountry.Custom('clergy_vlaloly')] активніше брати участь у правлінні країною. Останнім часом його представники внесли низку пропозицій, покликаних привести наші закони у відповідність до духовних звичаїв, оскільки, на їхню думку, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] нашої країни — розсадник єресі. Вони прагнуть домогтися того, щоб управління країною відповідало ідеалам і законам віри."
  clergy_estate_events.6.a: "Дотримуймося їхніх рекомендацій."
  clergy_estate_events.6.b: "Відхилити їхню пропозицію."
  clergy_estate_events.7.title: "Впливов[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l]"
  clergy_estate_events.7.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] нерідко підтриму[ROOT.GetCountry.Custom('clergy_yeyut')] правителів, але мало в кого є такі впливові прихильники, як у нас. Ми і [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] здавна віддані одне одному і діємо спільно. Це призвело до того, що [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l], а точніше, його правляча верхівка вважає себе частиною державного управління, а не самостійним інститутом. По всій країні вони проповідують про те, що [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] — зразок благочестя та духовної сили."
  clergy_estate_events.7.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  clergy_estate_events.8.title: "Присвоєння земель"
  clergy_estate_events.8.desc: "Багато земельних пожертв зроблено досить давно. Вони завжди оформляються в письмовому вигляді, але з плином років імена та ландшафт можуть сильно відрізнятися від того, що записано в дарчій. Останнім часом [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] стверджу[ROOT.GetCountry.Custom('clergy_yeyut')], що деяк[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] нахабно захопи[ROOT.GetCountry.Custom('nobles_vlaloly')] землю, яку [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] багато років тому отрима[ROOT.GetCountry.Custom('clergy_vlaloly')] в дар. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|U] ж заперечує, що це [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] намага[ROOT.GetCountry.Custom('clergy_yetsayutsa')] привласнити чужі ділянки, на які вони не мають жодного права.\n\nТі, чию сторону ми приймемо, стануть найбільшими землевласниками в цій області."
  clergy_estate_events.8.a: "Заявимо, що прав[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l]."
  clergy_estate_events.8.b: "Заявимо, що прав[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l]."
  clergy_estate_events.8.c: "Не будемо приймати нічиєї сторони."