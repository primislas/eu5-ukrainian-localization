l_russian:
  oligarchic_capture.1.title: "Повстання фракції"
  oligarchic_capture.1.desc: "Роки занепаду підточили наші республіканські установи. Один зі станів, відчувши слабкість влади, намірився прибрати до рук законодавчі органи, усунувши суперників і підкоривши закон своїй волі. Нам належить вирішити, як зустріти цей виклик: скоритися фракції й зберегти крихкий мир чи дати їй відсіч, ризикуючи відкритим заколотом."
  oligarchic_capture.1.a: "Скоритися вимогам фракції."
  oligarchic_capture.1.b: "Дати їм відсіч, хоч би чого це коштувало!"
  oligarchic_capture.1.tt: "Найбільш невдоволені провінції повстануть на підтримку фракції [ShowDisasterName('oligarchic_capture')]"
  oligarchic_capture.2.title: "Олігархи вимагають данину"
  oligarchic_capture.2.desc: "Ватажки фракції висувають нам ледь приховану вимогу грошей, видаючи її за внесок у спільне благо. Заплатимо — і їхній запал на якийсь час ущухне. Відмовимо — і вони скористаються нашою непокорою, щоб зібрати під своїми знаменами ще більше прибічників."
  oligarchic_capture.2.a: "Ми заплатимо воякам."
  oligarchic_capture.2.b: "Нас не залякати здирництвом."
  oligarchic_capture.3.title: "Громадяни вимагають реформ"
  oligarchic_capture.3.desc: "На майданах збираються натовпи, вимагаючи відновлення чесного врядування і краю владі фракцій. Їхнє завзяття — нагода повернути республіканський дух, хоч потурання юрбі загрожує заворушеннями."
  oligarchic_capture.3.a: "Підтримати їхню справу."
  oligarchic_capture.3.b: "Навести лад на вулицях."
  oligarchic_capture.4.title: "Чистка в сенаті"
  oligarchic_capture.4.desc: "Олігархи мають намір вигнати групу сенаторів, яких вважають неблагонадійними. Дозволити цю чистку — означає на якийсь час заспокоїти країну, але подарувати фракції ще одну перемогу. Захистити звинувачених — означає відстояти наші установи ціною нових потрясінь."
  oligarchic_capture.4.a: "Дозволити чистці відбутися."
  oligarchic_capture.4.b: "Захистити звинувачених."
  oligarchic_capture.5.title: "Заворушення на вулицях"
  oligarchic_capture.5.desc: "Сутички між прибічниками фракції та їхніми противниками вихлюпуються на ринки та в порт. Ми можемо дати пристрастям ущухнути самим або вислати варту навести лад твердою рукою."
  oligarchic_capture.5.a: "Дати пристрастям ущухнути."
  oligarchic_capture.5.b: "Рішуче навести лад."
  oligarchic_capture.100.title: "The Republic Restored"
  oligarchic_capture.100.desc: "Хватку фракції зламано. Наші суди, ради та збори знову відповідають перед громадянами, а не перед клікою знаті. Республіка витримала бурю, і її установи загартувалися цим випробуванням."
  oligarchic_capture.100.a: "Наші установи встояли."
  oligarchic_capture.101.title: "Олігархічна конституція вкоренилася"
  oligarchic_capture.101.desc: "Фракція перемогла. Нова конституція, складена на догоду олігархам, закріплює їхнє панування в самих підвалинах держави. На ціле покоління наша республіка залишиться республікою лише за назвою, а її посади переходитимуть із рук у руки серед вузького кола могутніх осіб."
  oligarchic_capture.101.desc.ringleader: "Фракція перемогла, і її ватажок, [oligarchic_ringleader_scope.GetName], виходить із тіні сенатських кулуарів, щоб відкрито заявити свої права на корону. На ціле покоління наша республіка залишиться республікою лише за назвою, а її посади переходитимуть із рук у руки серед вузького кола могутніх осіб."
  oligarchic_capture.101.a: "Фракція перемогла."
  oligarchic_capture.101.b: "[oligarchic_ringleader_scope.GetName] отримує корону."
  oligarchic_capture.6.title: "Викриття ватажка"
  oligarchic_capture.6.desc: "Наші вивідачі тижнями простежували монети, послуги й таємні вказівки в лавах фракції. Нарешті вдалося дізнатися єдине ім’я того, хто насправді скеровує її рух: [oligarchic_ringleader_scope.GetName]."
  oligarchic_capture.6.a: "Тепер ми знаємо, з ким маємо справу."
  oligarchic_capture.7.title: "Confront the Ringleader"
  oligarchic_capture.7.desc.ready: "Тепер, коли [oligarchic_ringleader_scope.GetName] викритий, ми можемо діяти проти нього безпосередньо. Влада корони відновилася достатньою мірою, щоб фракцію можна було швидко здолати."
  oligarchic_capture.7.desc.not_ready: "Тепер, коли [oligarchic_ringleader_scope.GetName] викритий, ми могли б діяти проти нього безпосередньо, проте влада корони ще не відновилася достатньою мірою. Поквапливий удар може лише дужче згуртувати фракцію."
  oligarchic_capture.7.a: "Виступити проти них."
  oligarchic_capture.7.a.fail_tt: "Наша [crown_power|e] ще не досягла 30%, тому спроба провалиться, а удар у відповідь дорого коштуватиме нашій стабільності"
  oligarchic_capture.8.title: "Negotiate Estate Concessions"
  oligarchic_capture.8.desc: "Замість того щоб відкрито протистояти фракції, ми відкриваємо таємний канал перемовин, пропонуючи гроші та незначні поступки, аби пом’якшити її невдоволення й сповільнити зростання."
  oligarchic_capture.8.a: "Розпочати перемовини."
  oligarchic_capture.12.title: "Ватажок обходжує придворного"
  oligarchic_capture.12.desc: "До нас доходить звістка, що ватажок фракції таємно обходжує одного з придворних нашого двору, пропонуючи послуги й обіцянки в обмін на підтримку. Ми можемо заплющити на це очі або зміцнити вірність придворного."
  oligarchic_capture.12.a: "Залишити все як є; це не варте клопоту."
  oligarchic_capture.12.b: "Підтвердити вірність придворного короні."
  oligarchic_capture.13.title: "Ватажок випробовує коронні володіння"
  oligarchic_capture.13.desc: "Ватажок фракції відкрито випробовує, наскільки далеко ще сягає влада коронних володінь, вишукуючи слабкі місця на очах у всього двору. Ми можемо залишити цей виклик без відповіді або відповісти рішуче."
  oligarchic_capture.13.a: "Залишити виклик без відповіді."
  oligarchic_capture.13.b: "Відповісти рішуче."
  oligarchic_capture.10.title: "Rally the Citizenry"
  oligarchic_capture.10.desc: "Вісники розносять наш заклик по кожному кварталу й ринку: республіка належить своїм громадянам, а не купці знатних осіб. Майдани заповнюються тими, хто готовий відстояти старий лад, хоча подібні збіговиська завжди загрожують заворушеннями."
  oligarchic_capture.10.a: "На майдани!"
  oligarchic_capture.11.title: "Purge the Oligarchs"
  oligarchic_capture.11.desc: "Ми вирішуємо завдати удару просто по верхівці фракції. Тривають арешти, їхні зв’язки руйнуються, а хватка на наших установах слабшає. Знать обурена суворими заходами, і країна здригається, але олігархів відкинуто назад."
  oligarchic_capture.11.a: "Завдати удару по їхніх ватажках."
  oligarchic_capture.7.a.success_tt: "Наша [crown_power|e] досягла 30% або більше, тому спроба увінчається успіхом"