l_russian:
  oligarchic_capture.1.title: "Посилення табору"
  oligarchic_capture.1.desc: "Довгі роки занепаду підточили наші республіканські установи зсередини. Відчувши слабкість держави, один із впливових станів вирішив прибрати до рук увесь законодавчий лад, відтіснивши від влади політичних суперників і підпорядкувавши закон власній волі. Перед нами стоїть непростий вибір: прийняти вимоги табору й зберегти крихкий мир або дати відсіч, ризикуючи розпалити відкритий заколот."
  oligarchic_capture.1.a: "Доведеться поступитися вимогам табору."
  oligarchic_capture.1.b: "Ми чинитимемо опір, чого б це не коштувало!"
  oligarchic_capture.1.tt: "Найбільш невдоволені провінції виступлять на підтримку табору, пов’язаного з #TOOLTIP:DISASTER_TYPE,oligarchic_capture,X #L олігархічним захопленням влади#!#!"
  oligarchic_capture.2.title: "Олігархи вимагають грошей"
  oligarchic_capture.2.desc: "Ватажки табору висувають нам ледь приховану вимогу виплатити їм значну суму грошей під виглядом турботи про загальне добро. Якщо ми поступимося, їхнє невдоволення на деякий час вщухне. Якщо відмовимо, вони обернуть наше рішення собі на користь і привернуть на свій бік ще більше прибічників."
  oligarchic_capture.2.a: "Ми заплатимо воякам."
  oligarchic_capture.2.b: "Ми не терпітимемо здирництва."
  oligarchic_capture.3.title: "Громадяни вимагають реформ"
  oligarchic_capture.3.desc: "На міських площах збираються юрби людей, які вимагають покласти край свавіллю таборів і повернути республіці чесне врядування. Їхнє завзяття дає нам змогу відродити республіканські ідеали, проте потурання розлюченому натовпу загрожує новими заворушеннями."
  oligarchic_capture.3.a: "Варто підтримати їхні вимоги."
  oligarchic_capture.3.b: "Наведіть лад на вулицях."
  oligarchic_capture.4.title: "Чистка серед сенаторів"
  oligarchic_capture.4.desc: "Олігархи вимагають вигнання з сенату цілої верстви сенаторів, чию відданість вони беруть під сумнів. Згода на цю чистку дозволить ненадовго заспокоїти становище в країні, але посилить позиції табору. Заступившись за звинувачених, ми захистимо наші установи, хоча це й загрожує новими потрясіннями."
  oligarchic_capture.4.a: "Нічого не маємо проти чистки."
  oligarchic_capture.4.b: "Забезпечте захист звинуваченим."
  oligarchic_capture.5.title: "Заворушення на вулицях"
  oligarchic_capture.5.desc: "Протистояння прибічників табору та його противників вилилося в бійки на ринках і причалах. Ми можемо зачекати, доки пристрасті вщухнуть самі собою, або відрядити варту на придушення безладу."
  oligarchic_capture.5.a: "Нехай пристрасті вляжуться."
  oligarchic_capture.5.b: "Придушіть заворушення твердою рукою."
  oligarchic_capture.100.title: "Відновлення республіки"
  oligarchic_capture.100.desc: "Пануванню табору покладено край. Наші суди, ради та збори знову діють на користь громадян, а не вузького кола вельмож. Республіка здолала кризу, а її державні установи лише загартувалися."
  oligarchic_capture.100.a: "Наші установи вистояли."
  oligarchic_capture.101.title: "Затвердження олігархічної конституції"
  oligarchic_capture.101.desc: "Табір здобув перемогу. Нова конституція, укладена на користь олігархів, закріплює їхнє панування в самому підґрунті держави. На ціле покоління від республіки залишиться лише назва, а всі державні посади стануть предметом торгу між вузьким колом можновладців."
  oligarchic_capture.101.desc.ringleader: "Табір здобув перемогу, а його ватажок, [oligarchic_ringleader_scope.GetName], виходить із закулісних інтриг у сенаті та відкрито зазіхає на корону. На ціле покоління від республіки залишиться лише назва, а всі державні посади стануть предметом торгу між вузьким колом можновладців."
  oligarchic_capture.101.a: "Фракція здобула перемогу."
  oligarchic_capture.101.b: "[oligarchic_ringleader_scope.GetName] захоплює корону."
  oligarchic_capture.6.title: "Викриття ватажка"
  oligarchic_capture.6.desc: "Тижнями наші вивідувачі йшли слідом грошових переказів, подарунків і таємних розпоряджень усередині фракції. Зрештою з’ясувалося, хто насправді стоїть за її діями — особа на ім’я [oligarchic_ringleader_scope.GetName]."
  oligarchic_capture.6.a: "Тепер ми знаємо, з ким маємо справу."
  oligarchic_capture.7.title: "Протистояння з ватажком"
  oligarchic_capture.7.desc.ready: "[oligarchic_ringleader_scope.GetName] [Select_CString(oligarchic_ringleader_scope.IsFemale, 'викрита', 'викритий')], і тепер ми можемо відкрито виступити проти [Select_CString(oligarchic_ringleader_scope.IsFemale, 'неї', 'нього')]. Авторитет корони достатньо зміцнів, щоб без зволікань розгромити фракцію."
  oligarchic_capture.7.desc.not_ready: "[oligarchic_ringleader_scope.GetName] [Select_CString(oligarchic_ringleader_scope.IsFemale, 'викрита', 'викритий')], і ми могли б відкрито виступити проти [Select_CString(oligarchic_ringleader_scope.IsFemale, 'неї', 'нього')], однак авторитет корони ще недостатньо високий. Поспішний удар лише згуртує фракцію."
  oligarchic_capture.7.a: "Час виступити проти них."
  oligarchic_capture.7.a.success_tt: "Наша [Concept('crown_power', 'влада правителя')|e] становить не менше 30%, тому спроба матиме успіх"
  oligarchic_capture.7.a.fail_tt: "Наша [Concept('crown_power', 'влада правителя')|e] наразі нижча за 30%, тому спроба приречена на невдачу, а зворотний удар серйозно підірве стабільність"
  oligarchic_capture.8.title: "Перемовини зі станом про поступки"
  oligarchic_capture.8.desc: "Замість прямого протистояння з фракцією ми розпочинаємо негласні перемови, пропонуючи гроші та незначні поступки з надією вгамувати невдоволення і стримати подальше зростання її впливу."
  oligarchic_capture.8.a: "Розпочнемо перемови."
  oligarchic_capture.12.title: "Ватажок підлещується до придворного"
  oligarchic_capture.12.desc: "До нас дійшли звістки, що ватажок фракції веде таємні перемови з одним із наших придворних, обіцяючи йому всілякі блага в обмін на підтримку. Ми можемо заплющити на це очі або вжити заходів, щоб забезпечити вірність придворного."
  oligarchic_capture.12.a: "Нехай усе йде своєю чередою. Воно того не варте."
  oligarchic_capture.12.b: "Нагадайте придворному про його обов’язок перед короною."
  oligarchic_capture.13.title: "Ватажок випробовує владу корони"
  oligarchic_capture.13.desc: "На очах у всього двору ватажок фракції відкрито випробовує владу корони на міцність, намагаючись намацати її слабкості. Ми можемо залишити ці випади без відповіді або рішуче покласти край подібним вихваткам."
  oligarchic_capture.13.a: "Залиште ці випади без відповіді."
  oligarchic_capture.13.b: "Необхідно рішуче покласти край цим випадам."
  oligarchic_capture.10.title: "Гуртування громадян"
  oligarchic_capture.10.desc: "Наші оповісники розносять усіма кварталами та ринками звістку про те, що республіка належить її громадянам, а не купцям та вельможам. На майданах збираються ті, хто готовий стати на захист давнього ладу, однак подібні збори можуть обернутися заворушеннями."
  oligarchic_capture.10.a: "Уперед, на міські майдани!"
  oligarchic_capture.11.title: "Очищення від олігархів"
  oligarchic_capture.11.desc: "Ми вирішуємо позбутися верхівки табору. За нашим наказом усюди відбуваються арешти, колишні зв’язки фракції рушаться, а її влада над нашими установами підупадає. Знать обурена діями уряду, країну охоплюють потрясіння, однак олігархи втрачають своє становище."
  oligarchic_capture.11.a: "Позбудьтеся ватажків табору."