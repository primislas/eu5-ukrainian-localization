l_russian:
  twilight_of_the_tsardom.1.title: "Падіння царства"
  twilight_of_the_tsardom.1.desc: "Колись над #TOOLTIP:REGION,balkan_region,X #L Балканами#!#! гордо майоріли наші знамена, однак ті славні часи давно минули. Наша влада хистка; наші кордони обложені ворогами, а рани, що залишилися після воєн та міжусобиць, ще не встигли загоїтися. Якщо ми не почнемо діяти рішуче, незабаром від [GetCountry('BUL').Custom('rank_ua_GEN')|l] залишаться лише спогади. Не можна допустити, щоб нас спіткала та сама доля, що й Першу #L [GetCountry('BUL').GetAdjective]у#! імперію."
  twilight_of_the_tsardom.1.a: "[GetCountry('BUL').GetFlavorRank] висто[GetCountry('BUL').Custom('endrank_yityat')]!"
  twilight_of_the_tsardom.1.a.tt: "Якщо до завершення [Concept('disaster', 'лиха')|e] «$twilight_of_the_tsardom$» ми не володітимемо #TOOLTIP:LOCATION,constantinople,X #L Константинополем#!#!, станеться таке:"
  twilight_of_the_tsardom.1.a.tt2: "Якщо до завершення [Concept('disaster', 'лиха')|e] «$twilight_of_the_tsardom$» ми володітимемо #TOOLTIP:LOCATION,constantinople,X #L Константинополем#!#!, станеться таке:"
  twilight_of_the_tsardom.1.a.tt3: "Якщо до завершення [Concept('disaster', 'лиха')|e] «$twilight_of_the_tsardom$» ми володітимемо #TOOLTIP:LOCATION,constantinople,X #L Константинополем#!#! та вважатимемося [Concept('great_power', 'великою державою')|e], станеться таке:"
  twilight_of_the_tsardom.1.historical_info: "Після смерти 1241 року царя Івана Асеня II у Болгарії розпочався тривалий період міжусобиці серед знаті, посилений відсутністю сильної влади та набігами монголів. Спадкоємці царя виявилися майже безсилими перед обличчям держав, що оточили Болгарію, що призвело до значних територіальних втрат. Кульмінацією цього смутного часу стало повстання Івайла, за яким послідували десятиліття внутрішніх чвар та вторгнень інших країн. На початку XIV століття настала деяка подоба стабільності, однак уже 1330 року поразка болгарського війська при Вельбужді та зростаючий тиск з боку інших країн знову вилилися в ослаблення Болгарії, яка до 1337 року стала ще вразливішою до внутрішніх та зовнішніх загроз. Згодом країна, так і не зумівши оговтатися від нещасть, була завойована османами."
  twilight_of_the_tsardom.2.title: "Царство вистояло"
  twilight_of_the_tsardom.2.desc: "Всупереч усьому царство пережило добу колотнечі, підступів та занепаду. Минуле залишило шрами, а держава ще не встигла повністю відновитися, але ми вижили, що багатьом здавалося неможливим. Сутінки добігли кінця, але ще не ясно, чи чекає на нас новий світанок."
  twilight_of_the_tsardom.2.a: "Ми відновимо все, що було втрачено."
  twilight_of_the_tsardom_modifier_removal_tt: "Кожен район, що перебуває у володінні, з модифікатором «[ShowModifier('bul_powerful_local_elites')]» втратить його"
  twilight_of_the_tsardom.3.title: "Зростаюча могутність [GetCountry('BUL').Custom('CL_GEN')]"
  twilight_of_the_tsardom.3.desc: "Навіть затяжна смута не змогла погубити #ONCLICK:COUNTRY,[GetCountry('BUL').GetKey] #TOOLTIP:COUNTRY,[GetCountry('BUL').GetKey],X [GetCountry('BUL').Custom('CL_ACC')|L]#!#!: ми повстали сповнені сил, ми відновили країну, що опинилася на межі загибелі. Захоплення #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#! — подвиг, здійснити який під силу не кожному, а тим паче — у нестерпно важкі роки. Сьогодні немає на #TOOLTIP:REGION,balkan_region,X #L Балканах#!#! такої сили, яка могла б протистояти нашому царству, і зважати на нього тепер доведеться кожному, хто раніше не вважав нас гідними."
  twilight_of_the_tsardom.3.a: "Ми явимо світові свою міць!"
  twilight_of_the_tsardom.4.title: "Розквіт нового царства"
  twilight_of_the_tsardom.4.desc: "#L [GetCountry('BUL').GetAdjective]е#! царство, що колись опинилося на краю прірви, сьогодні по праву може величати себе однією з найсильніших держав у світі. Боротьба за існування додала нам надії, а головне — сил побудувати нове царство. #TOOLTIP:LOCATION,constantinople,X #L Константинополь#!#! належить нам, і ми твердо маємо намір залишити яскравий слід на сторінках історії. Хай живе Третє [GetCountry('BUL').GetAdjectiveWithNoTooltip]е Царство!"
  twilight_of_the_tsardom.4.a: "Починається золота доба!"
  twilight_of_the_tsardom.5.title: "Місцеві еліти ставлять під сумнів нашу владу"
  twilight_of_the_tsardom.5.desc: "Представники вищого суспільства в [target_location.Custom('LR_PREP')|l] [target_location.GetName] перестали підкорятися нам: вони не виконують указів і правлять так, немов вони — господарі цих земель. Незабаром їхньому прикладу можуть наслідувати й інші, побачивши слабкість центральної влади. Якщо ми не вживемо рішучих дій, роздробленість тільки посилиться."
  twilight_of_the_tsardom.5.a: "У нас є важливіші турботи."
  twilight_of_the_tsardom.5.b: "Відновимо владу над [target_location.Custom('LR_INST')|l] [target_location.GetNameWithNoTooltip]."
  twilight_of_the_tsardom.6.title: "Придворного звинувачено у зраді"
  twilight_of_the_tsardom.6.desc: "[Select_CString(target_character.IsFemale, 'Одна з наших довірених радниць', 'Один з наших довірених радників')] [target_character.GetName] [Select_CString(target_character.IsFemale, 'опинилася', 'опинився')] під серйозною підозрою: [Select_CString(target_character.IsFemale, 'її', 'його')] звинувачують у продажу іншій державі особливо таємних відомостей; якщо вони потраплять не в ті руки, ворог зможе відчутно нашкодити нашому царству. У нас поки що немає вагомих доказів, однак [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] відчуває помітне занепокоєння вже через одні лише звинувачення. Якщо ми залишимо ці звинувачення без уваги, у можливого зрадника виявляться розв’язані руки, однак поспішність може призвести до того, що ми ненароком покараємо невинного."
  twilight_of_the_tsardom.6.a: "Негайно звільнити [Select_CString(target_character.IsFemale, 'її', 'його')]!"
  twilight_of_the_tsardom.6.b: "Напевно, це просто чутки."
  twilight_of_the_tsardom.7.title: "Бунт у війську"
  twilight_of_the_tsardom.7.desc: "Бойовий дух наших військ падає: вояки не отримують платні й поступово починають ремствувати, а командирам усе складніше підтримувати лад. Що більше затримуються виплати й що слабшою стає ланцюжок підпорядкування, то вищою з кожним днем стає небезпека, що сила, яка колись слугувала опорою нашої країни, обернеться проти неї самої."
  twilight_of_the_tsardom.7.a: "Виплатимо їм належне."
  twilight_of_the_tsardom.7.b: "Нам це не по кишені."
  twilight_of_the_tsardom.7.c: "Придушимо бунт, поки він не розрісся!"
  twilight_of_the_tsardom.8.title: "Бунтівний васал"
  twilight_of_the_tsardom.8.desc: "До столиці дійшли чутки, що верхівка суспільства в #ONCLICK:COUNTRY,[subject_target.GetKey] #TOOLTIP:COUNTRY,[subject_target.GetKey],X [subject_target.Custom('CL_PREP')|L]#!#! все рідше починає нам коритися; подейкують навіть, що там склалася змова, учасники якої хочуть випробувати межі дозволеного. І хоча справа поки не дійшла до відкритого бунту, довірені джерела повідомляють, що [subject_target.GetGovernment.GetCourtTitle|l] бунтівників усе більше схиля[ROOT.GetCountry.Custom('nobles_yeyut')]ся до думки оголосити незалежність."
  twilight_of_the_tsardom.8.a: "Підемо на поступки, щоб умиротворити їх."
  twilight_of_the_tsardom.8.b: "Зараз ми мало що можемо зробити."
  twilight_of_the_tsardom.9.title: "Залога без платні"
  twilight_of_the_tsardom.9.desc: "Наша залога у [target_location.Custom('LR_INST')|l] [target_location.GetName] поступово починає бунтувати: захисники звинувачують місцевих правителів у безтурботному ставленні до оборони та небажанні виплачувати утримання. Вояки більше не хочуть служити короні, нездатній забезпечити їм прожиток. Наслідки такого бунту можуть виявитися тяжкими, оскільки [target_area.GetName] цілком перебуває під захистом фортеці, в якій знаходиться залога, що ремствує."
  twilight_of_the_tsardom.9.a: "Негайно виплатити їм належне!"
  twilight_of_the_tsardom.9.b: "Змусити місцеві еліти заплатити їм."
  twilight_of_the_tsardom.9.c: "У нас немає зайвих грошей."
  twilight_of_the_tsardom.10.title: "Ворожі стани"
  twilight_of_the_tsardom.10.desc: "На хвилі занепаду центральної влади осмілілі стани нашого царства почали суперничати один з одним за вплив: кожен хоче, щоб ослабл[ROOT.GetCountry.Custom('crown_yiaei')] [GetEstateName('crown_estate')|l] зайня[ROOT.GetCountry.Custom('crown_vlaloly')] його сторону. Протиріччя, що роками накопичувалися, сьогодні виливаються у відкриту ворожнечу, і зберігати непричетність стає все складніше. Ми ризикуємо обернути проти себе обидві сторони, тому, можливо, варто спробувати заручитися вірністю однієї з них. Ціною за це, втім, стане подальше поглиблення міжусобиці."
  twilight_of_the_tsardom.10.a: "[first_estate.GetNameWithNoTooltip|U] будуть нашими союзниками."
  twilight_of_the_tsardom.10.b: "[second_estate.GetNameWithNoTooltip|U] знайдуть у нас захисників своїх інтересів."
  twilight_of_the_tsardom.10.c: "Ми не станемо займати чиюсь сторону."
  bul_restore_the_realms_unity: "Відновлення єдності країни"
  bul_restore_the_realms_unity_desc: "Землі, без яких колись немислиме було існування [GetCountry('BUL').Custom('rank_ua_GEN')|l], вислизнули в нас із рук і більше не підкоряються престолу. Щоб вийти з цієї скрути з гідністю, потрібно неодмінно возз’єднати їх з батьківщиною — зокрема й силою, якщо інакше буде ніяк..."
  bul_reassert_our_authority: "Повторне утвердження влади"
  bul_reassert_our_authority_desc: "Користуючись внутрішньою слабкістю #ONCLICK:COUNTRY,[GetCountry('BUL').GetKey] #TOOLTIP:COUNTRY,[GetCountry('BUL').GetKey],X [GetCountry('BUL').Custom('CL_GEN')|L]#!#!, численні вихідці з вищого суспільства [GetCountry('BUL').Custom('rank_ua_GEN')|l] відмовляються визнавати нашу владу і правлять своїми землями так, немов ні перед ким не тримають відповіді. Щоб приборкати роздробленість, нам доведеться знову утвердити владу над цими землями і змусити бунтівних володарів схилити перед нами голови."
  bul_push_for_diplomatic_reintegration: "Прагнення до дипломатичної реінтеграції"
  bul_push_for_diplomatic_reintegration_desc: "Щоб не допустити міжусобної війни, ми здали частину своїх земель правителям, згодним керувати ними від нашого імені. На якийсь час такий підхід ще може себе виправдати, однак у наших же інтересах возз’єднати царство дипломатичним шляхом: країна, що розділилася сама в собі, не встоїть."
  twilight_of_the_tsardom.11.title: "Серед стерв’ятників"
  twilight_of_the_tsardom.11.desc: "Ми загрузли в безодні міжусобиць, а сусіди тим часом стягуються до наших кордонів, немов стерв’ятники, що відчули свіжу кров. Вони знають, що ми слабкі, і жадібно вишукують найменшу можливість завдати удару й відірвати від нашого царства шматок плоті. Так, нещодавно нам стало відомо, що [target_country.GetName] заяви[target_country.Custom('end_vlaloly')] права на провінцію [border_claim_province.GetName] з наміром відібрати її, щойно випаде слушна нагода."
  twilight_of_the_tsardom.11.a: "Нехай спробують!"
  twilight_of_the_tsardom.11.b: "Підкупимо їх, щоб вони відмовились від домагань."