l_russian:
  crisis_of_faith.1.title: "Розкол розгоряється"
  crisis_of_faith.1.desc: "Прихильність до нашої державної церкви похитнулася, і віряни більше не дослухаються до її вчення. Проповідники-розкольники збирають прибічників, а духовенство розколюється на реформаторів і непримиренних. Нам належить обрати шлях: піти назустріч реформаторам і шукати примирення чи придушити розкол вогнем і мечем."
  crisis_of_faith.1.a: "Піти назустріч реформаторам."
  crisis_of_faith.1.b: "Придушити розкольників!"
  crisis_of_faith.1.tt: "Найбільш неспокійні провінції повстануть на підтримку фракції «[ShowDisasterName('crisis_of_faith')]»"
  crisis_of_faith.2.title: "Єресь шириться"
  crisis_of_faith.2.desc: "Надходять донесення про цілі парафії, що навернулися до розкольницького вчення. Ми можемо спрямувати вірне духовенство, щоби викорінити єретиків, перш ніж пошесть пошириться далі, або пустити справу на самоплив у надії, що полум’я єресі згасне само собою."
  crisis_of_faith.2.a: "Викорінити єретиків."
  crisis_of_faith.2.b: "Залишити все як є."
  crisis_of_faith.3.title: "Згуртування вірних"
  crisis_of_faith.3.desc: "Попри розкол, побожні юрби сходяться, щоб підтвердити відданість істинній вірі. Їхня ревність може знову розпалити благочестя по всій країні, хоча подібні пристрасті можуть легко обернутися заворушеннями, якщо дати їм волю."
  crisis_of_faith.3.a: "Розділити їхню ревність."
  crisis_of_faith.3.b: "Підтримати порядок."
  crisis_of_faith.4.title: "Духовенство вимагає реформи віровчення"
  crisis_of_faith.4.desc: "Посланці поміркованого духовенства просять нас змінити церковне вчення й залагодити розкол, поки він не розрісся. Згода на реформи заспокоїть духовенство й сповільнить розкол, але перегляд священного вчення — справа серйозна. Відмова ж збереже колишній лад ціною прихильности кліру."
  crisis_of_faith.4.a: "Схвалити їхні реформи."
  crisis_of_faith.4.b: "Відмовитися змінювати доктрину."
  crisis_of_faith.5.title: "Нагода для інквізиції"
  crisis_of_faith.5.desc: "Наше найревніше духовенство просить дозволу розпочати інквізицію проти розкольників. Чистка відновить благочестя та втихомирить єретиків, але породжений нею страх розійдеться всім королівством. Ми також можемо виявити стриманість, зберігши народ від зайвих страждань."
  crisis_of_faith.5.a: "Розпочати інквізицію."
  crisis_of_faith.5.b: "Виявити стриманість."
  crisis_of_faith.100.title: "Єресь подолано"
  crisis_of_faith.100.desc: "Розкол подолано. Проповідників розколу розпорошено, їхні послідовники повернулися до отари, а духовенство знову згуртувалося під стягом істинної віри. Наша церква оновилася, а її авторитет та наше благочестя відновилися."
  crisis_of_faith.100.a: "Віра вистояла."
  crisis_of_faith.101.title: "Розкольницька доктрина утвердилася"
  crisis_of_faith.101.desc: "Розкол узяв гору. Реформоване вчення пускає коріння в наших храмах і судах, а старе правовір’я відкинуто геть. Ціле покоління наша країна житиме з розколотою вірою та духовенством, яке більше не підкоряється нашому престолу сповна."
  crisis_of_faith.101.a: "Розкол бере гору."
  crisis_of_faith.10.title: "Проповідувати оновлення"
  crisis_of_faith.10.desc: "Ми посилаємо наше найвідданіше духовенство до народу, щоб проповідувати оновлення та закликати вірян повернутися додому. Їхні проповіді відроджують благочестя всією країною й позбавляють розкольників прибічників, хоча потрясіння великого відродження порушує звичний порядок речей."
  crisis_of_faith.10.a: "Відіслати проповідників."
  crisis_of_faith.11.title: "Скликати синод"
  crisis_of_faith.11.desc: "Ми скликаємо духовенство на великий собор, щоб остаточно розв’язати суперечливу доктрину. Зібрані прелати змикають ряди довкола правовірного вчення, відокремлюючи розкольницький табір та відновлюючи певною мірою єдність церкви."
  crisis_of_faith.11.a: "Скликати собор."
  crisis_of_faith.1.a.tt: "Духовенство в кількох найнеспокійніших провінціях усе ж приєднається до фракції «[ShowDisasterName('crisis_of_faith')]»"
  crisis_of_faith.10.a.tt: "Усі громади, які нині підтримують фракцію [ShowDisasterName('crisis_of_faith')], отримають певне задоволення"
  crisis_of_faith.101.b: "Нехай єресіарх зійде на престол."
  crisis_of_faith.101.desc.heresiarch: "Розкол здобув перемогу, і він має обличчя. [crisis_of_faith_heresiarch_scope.GetName] проповідував реформоване вчення, доки його годі було змусити мовчати, хоча саме збунтоване духовенство зламало нашу владу на полі бою. Тепер переможне духовенство проголошує піднесення [crisis_of_faith_heresiarch_scope.GetHerHis], і в нашій церкві не лишилося нікого, хто бажав би їм відмовити. Те, що ми боронили як священне, тихо відкладено вбік."
  crisis_of_faith.102.a: "Церква більше не наша, щоб нею правити."
  crisis_of_faith.102.desc: "Ми більше не правимо як церква. Що б не проповідували розкольники, наше духовенство їм не відповість, бо воно більше не промовляє від імені держави. Доктрина, яку ми перестали боронити, лишилася на устах вірян, а ті, хто беріг для нас старе правовір’я, пам’ятають, хто залишив їх без захисту."
  crisis_of_faith.102.title: "Віру полишено"
  crisis_of_faith.11.a.tt: "Кожна громада, яка нині підтримує фракцію [ShowDisasterName('crisis_of_faith')], отримає певне задоволення"
  crisis_of_faith.12.a: "Повернути цю вірність за гроші."
  crisis_of_faith.12.b: "Ми не в силах устежити за кожною залою."
  crisis_of_faith.12.desc: "Справа розкольників знайшла собі гаманець. [crisis_of_faith_heresiarch_scope.GetName] був прийнятий в одній із величних зал нашого королівства, і вельможа, який відчинив йому двері, тепер оплачує переписування проповідей, які ми заборонили. Ми можемо таємно запропонувати йому більше за вірність або ж визнати, що не в силах устежити за кожною залою в країні."
  crisis_of_faith.12.title: "Покровитель розколу"
  crisis_of_faith.13.a: "Змусити проповідника замовкнути."
  crisis_of_faith.13.b: "Нехай віряни самі розсудять."
  crisis_of_faith.13.desc: "[crisis_of_faith_heresiarch_scope.GetName] більше не проповідує по підвалах. На ринковому майдані зібрався натовп, щоб почути розкольницьку доктрину, виголошену вголос, і ніхто не спробував цьому завадити. Змусити проповідника замовкнути означало б показати, що наша церква досі зберігає владу, хоча стягувати проповідника з кафедри на очах у натовпу — сама по собі ганьба."
  crisis_of_faith.13.title: "Проповідь просто неба"
  crisis_of_faith.6.a: "Назвати єресіарха."
  crisis_of_faith.6.a.tt: "Єресіарха виявлено, відкрито дію «Викрити єресіарха»"
  crisis_of_faith.6.desc: "Наші вивідачі простежили шлях заборонених проповідей крізь переписувачів та гінців, що їх розносили, і кожен слід веде до тих самих дверей. [crisis_of_faith_heresiarch_scope.GetName] — автор розкольницького вчення, і досі [crisis_of_faith_heresiarch_scope.GetSheHe] проповідував(ла) його всередині нашої ж церкви."
  crisis_of_faith.6.title: "Рука, що стоїть за розколом"
  crisis_of_faith.7.a: "Осудити єресіарха перед вірянами."
  crisis_of_faith.7.a.fail_tt: "У корони недостатньо влади, щоб виступити проти єресіарха"
  crisis_of_faith.7.desc.not_ready: "Ми б назвали [crisis_of_faith_heresiarch_scope.GetName] перед зібраними вірянами і поклали край розколові, але корона не має влади в цій залі. Духовенство, що переховує [crisis_of_faith_heresiarch_scope.GetHerHim], сильніше за трон, який бажав би осудити [crisis_of_faith_heresiarch_scope.GetHerHim], а невдале викриття запам’ятається як викриття знехтуване."
  crisis_of_faith.7.desc.ready: "Корона знову говорить владно, і настав час скористатися цим. Ми назвемо [crisis_of_faith_heresiarch_scope.GetName] перед зібраними вірянами, викладемо [crisis_of_faith_heresiarch_scope.GetHerHis] омани в повному обсязі й позбавимо [crisis_of_faith_heresiarch_scope.GetHerHim] становища, яке й зробило розкол можливим. Без свого автора реформоване вчення — не більше ніж поговір."
  crisis_of_faith.7.title: "Викрити єресіарха"
  crisis_of_faith.8.a: "Дозволити їм отримати своє вчення."
  crisis_of_faith.8.desc: "Розкол не зламати, отже, його треба купити. Ми надамо реформаторам бажане вчення і становище всередині нашої церкви, пов’язане з ним. Фракція розпуститься, а її проповідники повернуться до громад, які тепер по праву належать їм. Наша набожність не відновиться після цього, і поступку не можна буде скасувати."
  crisis_of_faith.8.title: "Поступитися розкольникам"