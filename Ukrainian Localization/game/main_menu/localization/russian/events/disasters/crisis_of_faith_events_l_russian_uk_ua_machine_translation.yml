l_russian:
  crisis_of_faith.1.title: "Початок розколу"
  crisis_of_faith.1.desc: "Благоговіння перед нашою державною церквою похитнулося, і віряни перестали дослухатися до її вчення. Проповідники, що сіють розкол, знаходять дедалі більше прихильників, а духовенство розділилося на реформаторів і консерваторів. Нам належить вирішити, як вчинити: піти на поступки реформаторам і знайти згоду чи знищити розкол вогнем і мечем."
  crisis_of_faith.1.a: "Піти на поступки реформаторам."
  crisis_of_faith.1.b: "Знищити розкольників!"
  crisis_of_faith.1.tt: "Найнеспокійніші провінції виступлять на підтримку табору, пов’язаного з #TOOLTIP:DISASTER_TYPE,crisis_of_faith,X #L кризою віри#!#!"
  crisis_of_faith.1.a.tt: "Духовенство в деяких найнеспокійніших провінціях усе ж приєднається до табору, пов’язаного з #TOOLTIP:DISASTER_TYPE,crisis_of_faith,X #L кризою віри#!#!"
  crisis_of_faith.2.title: "Поширення єресі"
  crisis_of_faith.2.desc: "До нас доходять звістки про те, що цілі парафії приймають розкольницьке вчення. Ми можемо відрядити вірних священнослужителів, щоб винищити єретиків, доки ця зараза не поширилася далі, або ж не втручатися й сподіватися, що ревність у вірі з часом згасне сама собою."
  crisis_of_faith.2.a: "Час винищити єретиків."
  crisis_of_faith.2.b: "Нехай іде, як іде."
  crisis_of_faith.3.title: "Згуртування вірян"
  crisis_of_faith.3.desc: "На противагу розкольникам усюди стали збиратися юрби побожних людей, щоб знову заявити про свою відданість істинній вірі. Їхня ревність здатна наново розпалити завзяття у вірі по всій країні, але без належного нагляду воно може обернутися заворушеннями."
  crisis_of_faith.3.a: "Ревність вірян заслуговує на нашу підтримку."
  crisis_of_faith.3.b: "Не допустіть заворушень."
  crisis_of_faith.4.title: "Духовенство закликає змінити віровчення"
  crisis_of_faith.4.desc: "Посольство поміркованих священнослужителів просить нас внести зміни до церковного вчення та усунути розбіжності, доки вони не призвели до ще більшого розколу. Схвалення запропонованих ними реформ заспокоїть священнослужителів і сповільнить поширення розколу, проте відступ від священного вчення має свою ціну. Відмова дозволить відстояти непорушність догматів, але точно зашкодить відносинам із духовенством."
  crisis_of_faith.4.a: "Ми готові схвалити запропоновані ними реформи."
  crisis_of_faith.4.b: "Ми нізащо не змінимо наше віровчення."
  crisis_of_faith.5.title: "Привід заснувати інквізицію"
  crisis_of_faith.5.desc: "Наші найревніші священнослужителі благають нас заснувати інквізицію та з її допомогою розпочати переслідування розкольників. Вони допоможуть відродити благочестя й утихомирити єретиків. Однак посіяний ними страх охопить усю країну. А можна виявити стриманість і вберегти люд від іще більших страждань."
  crisis_of_faith.5.a: "Розкольниками займеться інквізиція."
  crisis_of_faith.5.b: "Варто виявити стриманість."
  crisis_of_faith.12.title: "Покровитель розколу"
  crisis_of_faith.12.desc: "У розкольників з’явився щедрий покровитель. [crisis_of_faith_heresiarch_scope.GetName] [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'була запрошена', 'був запрошений')] на прийом до одного з розкішних палаців нашої країни, а його вельможний господар тепер оплачує переписування заборонених нами проповідей. Ми можемо таємно перекупити його вірність або ж змиритися з тим, що уряд не може стежити за кожним палацом у наших землях."
  crisis_of_faith.12.a: "Перекупімо його вірність."
  crisis_of_faith.12.b: "Неможливо стежити за кожним палацом."
  crisis_of_faith.13.title: "Привселюдні проповіді"
  crisis_of_faith.13.desc: "[crisis_of_faith_heresiarch_scope.GetName] більше не проповідує по підвалах. На ринковій площі зібрався натовп, щоб почути розкольницьке вчення, і ніхто не спробував його розігнати. Зупинити проповідь — означає показати, що наша церква ще здатна стверджувати свою владу, але силою стягнути проповідника з кафедри на очах у натовпу — саме по собі спричинить гучну ганьбу."
  crisis_of_faith.13.a: "Зупиніть проповідь."
  crisis_of_faith.13.b: "Нехай віряни самі вирішують."
  crisis_of_faith.100.title: "Викорінення єресі"
  crisis_of_faith.100.desc: "Розкол вдалося подолати. Проповідників-розкольників розігнано, їхні послідовники повернулися до лона церкви, а духовенство знову сповідує єдине віровчення. Церква відродилася, її повагу відновлено, а наша віра зміцніла."
  crisis_of_faith.100.a: "Віра встояла."
  crisis_of_faith.101.title: "Утвердження розкольницького вчення"
  crisis_of_faith.101.desc: "Розкол узяв гору. Реформоване віровчення повсюдно утверджується в наших церквах і при дворі, а старе вчення відкидається. Цілому поколінню жителів нашої країни доведеться жити в умовах розколу у вірі, а духовенство більше не визнаватиме владу нашої корони цілковито."
  crisis_of_faith.101.desc.heresiarch: "Розкол узяв гору, і він має провідника з конкретним ім’ям. [crisis_of_faith_heresiarch_scope.GetName] [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'проповідувала', 'проповідував')] реформоване вчення аж доти, доки його вже неможливо було заглушити. Проте нашу владу зламало не [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'її', 'його')] слово, а повстале духовенство, яке здобуло перемогу на полі бою. Тепер переможці проголошують піднесення єресіарха, і в церкві не залишилося нікого, хто був би готовий дати їм відсіч. Святині, які ми раніше боронили, тепер без зайвого розголосу віддають забуттю."
  crisis_of_faith.101.a: "Розкол торжествує."
  crisis_of_faith.101.b: "Нехай єресіарх сяде на трон."
  crisis_of_faith.102.title: "Зречення віри"
  crisis_of_faith.102.desc: "Церква більше не перебуває під нашою владою. Розкольники й далі проповідують своє вчення, але наші священнослужителі вже не сперечаються з ними, адже наше духовенство більше не представляє державу. Вчення, яке ми відмовилися захищати, все ще живе в промовах вірян, а прибічники старих догматів пам’ятають, як ми залишили їх без підтримки."
  crisis_of_faith.102.a: "Церква більше не кориться нашій владі."
  crisis_of_faith.10.title: "Проповідь оновлення"
  crisis_of_faith.10.desc: "Ми відряджаємо найвідданіших церкві священнослужителів до народу, щоб ті проповідували оновлення віри та закликали вірян повернутися до лона церкви. Їхні проповіді зміцнюють віру по всій країні та відвертають людей від розкольників, однак загальне піднесення віри загрожує порушити звичний лад."
  crisis_of_faith.10.a: "Відправте проповідників."
  crisis_of_faith.10.a.tt: "Усі громади, які зараз підтримують табір, пов’язаний із #TOOLTIP:DISASTER_TYPE,crisis_of_faith,X #L кризою віри#!#!, отримають певну частку задоволення"
  crisis_of_faith.11.title: "Проведення синоду"
  crisis_of_faith.11.desc: "Ми скликаємо духовенство на великий собор, щоб раз і назавжди розв’язати розбіжності в питаннях віри. Архієреї, що зібралися, гуртуються довкола ортодоксального вчення, залишаючи розкольників у самотності та почасти відновлюючи єдність церкви."
  crisis_of_faith.11.a: "Скличемо собор."
  crisis_of_faith.11.a.tt: "Усі громади, які зараз підтримують табір, пов’язаний із #TOOLTIP:DISASTER_TYPE,crisis_of_faith,X #L кризою віри#!#!, отримають певну частку задоволення"
  crisis_of_faith.6.title: "Винуватець церковного розколу"
  crisis_of_faith.6.desc: "Наші вивідувачі простежили шлях заборонених проповідей, виявивши переписувачів і гінців, які передавали їх далі. Усі сліди ведуть до однієї людини. Це [crisis_of_faith_heresiarch_scope.GetName]! Саме [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'вона', 'він')] стоїть за розкольницьким вченням і саме [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'вона', 'він')] досі [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'проповідувала', 'проповідував')] його просто в стінах нашої церкви."
  crisis_of_faith.6.a: "Розкрийте ім’я єресіарха."
  crisis_of_faith.6.a.tt: "Особу єресіарха встановлено. Відкрито дію «Осуд єресіарха»"
  crisis_of_faith.7.title: "Осуд єресіарха"
  crisis_of_faith.7.desc.ready: "Корона знову здобула авторитет, і настав час показати свою силу в дії. [crisis_of_faith_heresiarch_scope.GetName] буде [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'викрита', 'викритий')] перед очима зібраних вірян — ми в усіх подробицях розкриємо [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'її', 'його')] омани та позбавимо впливу, завдяки якому став можливим поточний розкол. Без свого творця реформоване віровчення обернеться на порожні чутки."
  crisis_of_faith.7.desc.not_ready: "Ми могли б назвати ім’я єресіарха перед очима зібраних вірян, а [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'нею виявилася', 'ним виявився')] [crisis_of_faith_heresiarch_scope.GetName], і могли б покласти край розколу раз і назавжди. Проте корона тут не має влади. Духовенство, що вкриває [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'її', 'його')], має більшу владу, ніж престол, охочий засудити [Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'єретичку', 'єретика')]. Тож якщо спроба викрити єресіарха зазнає невдачі, у пам’яті залишиться не саме звинувачення, а відмова церкви підкоритися волі корони."
  crisis_of_faith.7.a: "Засудити єрезіарха перед вірянами."
  crisis_of_faith.7.a.fail_tt: "Короні бракує влади, щоб виступити проти єресіарха."
  crisis_of_faith.8.title: "Згода з розкольниками"
  crisis_of_faith.8.desc: "Розкол неможливо подолати силою, і залишається лише піти на поступки. Ми визнаємо віровчення реформаторів і надамо їм належне становище в нашій церкві. Їхній табір розпадеться, а проповідники повернуться до парафій, які тепер належатимуть їм за правом. Колишнього благочестя нам уже не повернути, а зроблені поступки неможливо буде скасувати."
  crisis_of_faith.8.a: "Нехай сповідують своє вчення."