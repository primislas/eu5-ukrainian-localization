l_russian:
  crisis_of_faith.1.title: "Розкол розгоряється"
  crisis_of_faith.1.desc: "Прихильність до нашої державної церкви похитнулася, і віряни більше не дослухаються до її вчення. Проповідники-розкольники збирають прибічників, а духовенство розколюється на реформаторів і непримиренних. Нам належить обрати шлях: піти назустріч реформаторам і шукати примирення чи придушити розкол вогнем і мечем."
  crisis_of_faith.1.a: "Піти назустріч реформаторам."
  crisis_of_faith.1.b: "Придушити розкольників!"
  crisis_of_faith.1.tt: "Найбільш неспокійні провінції повстануть на підтримку фракції «[ShowDisasterName('crisis_of_faith')]»"
  crisis_of_faith.1.a.tt: "Духовенство в кількох найнеспокійніших провінціях однаково приєднається до табору «[ShowDisasterName('crisis_of_faith')]»"
  crisis_of_faith.2.title: "Єресь шириться"
  crisis_of_faith.2.desc: "Надходять донесення про цілі парафії, що навернулися до розкольницького вчення. Ми можемо спрямувати вірне духовенство, щоби викорінити єретиків, перш ніж пошесть пошириться далі, або пустити справу на самоплив у надії, що полум’я єресі згасне само собою."
  crisis_of_faith.2.a: "Викорінити єретиків."
  crisis_of_faith.2.b: "Залишити все як є."
  crisis_of_faith.3.title: "Згуртування вірних"
  crisis_of_faith.3.desc: "Попри розкол, побожні юрби сходяться, щоб підтвердити відданість істинній вірі. Їхня ревність може знову розпалити благочестя по всій країні, хоча подібні пристрасті можуть легко обернутися заворушеннями, якщо дати їм волю."
  crisis_of_faith.3.a: "Розділити їхню ревність."
  crisis_of_faith.3.b: "Підтримати порядок."
  crisis_of_faith.4.title: "Духовенство вимагає реформи віровчення"
  crisis_of_faith.4.desc: "Посланці поміркованого духовенства просять нас змінити церковне вчення й залагодити розкол, поки він не розрісся. Згода на реформи заспокоїть духовенство й сповільнить розкол, але перегляд священного вчення — справа серйозна. Відмова ж збереже колишній лад ціною прихильности кліру."
  crisis_of_faith.4.a: "Схвалити їхні реформи."
  crisis_of_faith.4.b: "Відмовитися змінювати доктрину."
  crisis_of_faith.5.title: "Нагода для інквізиції"
  crisis_of_faith.5.desc: "Наше найревніше духовенство просить дозволу розпочати інквізицію проти розкольників. Чистка відновить благочестя та втихомирить єретиків, але породжений нею страх розійдеться всім королівством. Ми також можемо виявити стриманість, зберігши народ від зайвих страждань."
  crisis_of_faith.5.a: "Розпочати інквізицію."
  crisis_of_faith.5.b: "Виявити стриманість."
  crisis_of_faith.12.title: "Покровитель розколу"
  crisis_of_faith.12.desc: "Справа розколу знайшла собі гаманець. У величній залі наших володінь знайшов прихисток [crisis_of_faith_heresiarch_scope.GetName], і шляхтич, що відчинив перед ним двері, тепер оплачує переписування заборонених нами проповідей. Ми можемо тихцем зробити зустрічну пропозицію заради цієї вірності або змиритися з тим, що не здатні пильнувати кожну залу в цьому краї."
  crisis_of_faith.12.a: "Перекупити цю вірність."
  crisis_of_faith.12.b: "Ми не можемо пильнувати кожну залу."
  crisis_of_faith.13.title: "Проповіді просто неба"
  crisis_of_faith.13.desc: "[crisis_of_faith_heresiarch_scope.GetName] більше не проповідує по підвалах. На ринковій площі зібрався натовп, щоб почути виголошене вголос розкольницьке вчення, і ніхто й не поворухнувся, аби цьому завадити. Обірвати проповідь означало б показати, що наша церква все ще має владу, хоча стягнути проповідника з казальниці перед очима юрби — це окрема ганьба."
  crisis_of_faith.13.a: "Обірвати проповідь."
  crisis_of_faith.13.b: "Нехай віряни розсудять самі."
  crisis_of_faith.100.title: "Єресь подолано"
  crisis_of_faith.100.desc: "Розкол подолано. Проповідників розколу розпорошено, їхні послідовники повернулися до отари, а духовенство знову згуртувалося під стягом істинної віри. Наша церква оновилася, а її авторитет та наше благочестя відновилися."
  crisis_of_faith.100.a: "Віра вистояла."
  crisis_of_faith.101.title: "Розкольницька доктрина утвердилася"
  crisis_of_faith.101.desc: "Розкол узяв гору. Реформоване вчення пускає коріння в наших храмах і судах, а старе правовір’я відкинуто геть. Ціле покоління наша країна житиме з розколотою вірою та духовенством, яке більше не підкоряється нашому престолу сповна."
  crisis_of_faith.101.desc.heresiarch: "Розкол узяв гору, і він має обличчя. [crisis_of_faith_heresiarch_scope.GetName] проповіду[Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'ла', 'в')] оновлене вчення, доки його вже несила було заглушити, хоча саме бунтівне духовенство зламало нашу владу на полі бою. Тепер переможне духовенство проголошує [crisis_of_faith_heresiarch_scope.GetHerHis] піднесення, і в нашій церкві не лишилося нікого, хто наважився б їм відмовити. Те, що ми боронили як святиню, тишком відкидають геть."
  crisis_of_faith.101.a: "Розкол бере гору."
  crisis_of_faith.101.b: "Нехай єрезіарх посяде престол."
  crisis_of_faith.102.title: "Покинута віра"
  crisis_of_faith.102.desc: "Ми більше не правимо як церква. Що б не проповідували розкольники, наше духовенство їм не відповідатиме, бо воно більше не говорить від імені держави. Вчення, захист якого ми облишили, все ще живе на вустах вірян, і ті, хто беріг для нас старе правовір’я, пам’ятають, хто покинув їх напризволяще."
  crisis_of_faith.102.a: "Церква більше нам не підвладна."
  crisis_of_faith.10.title: "Проповідь оновлення"
  crisis_of_faith.10.desc: "Ми посилаємо наше найвідданіше духовенство до народу, щоб проповідувати оновлення та закликати вірян повернутися додому. Їхні проповіді відроджують благочестя всією країною й позбавляють розкольників прибічників, хоча потрясіння великого відродження порушує звичний порядок речей."
  crisis_of_faith.10.a: "Відіслати проповідників."
  crisis_of_faith.10.a.tt: "Кожна громада, що нині підтримує табір «[ShowDisasterName('crisis_of_faith')]», отримає дещицю задоволення"
  crisis_of_faith.11.title: "Проведення синоду"
  crisis_of_faith.11.desc: "Ми скликаємо духовенство на великий собор, щоб остаточно розв’язати суперечливу доктрину. Зібрані прелати змикають ряди довкола правовірного вчення, відокремлюючи розкольницький табір та відновлюючи певною мірою єдність церкви."
  crisis_of_faith.11.a: "Скликати собор."
  crisis_of_faith.11.a.tt: "Кожна громада, що нині підтримує табір «[ShowDisasterName('crisis_of_faith')]», отримає дещицю задоволення"
  crisis_of_faith.6.title: "Рука за розколом"
  crisis_of_faith.6.desc: "Наші вивідачі вистежили заборонені проповіді крізь переписувачів та вісників, що їх розносили, і кожен слід веде до одних і тих самих дверей. [crisis_of_faith_heresiarch_scope.GetName] — творець розкольницького вчення, і досі [crisis_of_faith_heresiarch_scope.GetSheHe] проповіду[Select_CString(crisis_of_faith_heresiarch_scope.IsFemale, 'ла', 'в')] його зсередини нашої власної церкви."
  crisis_of_faith.6.a: "Назвати ім’я єрезіарха."
  crisis_of_faith.6.a.tt: "Особу єрезіарха встановлено, що відкриває дію «Осудити єрезіарха»"
  crisis_of_faith.7.title: "Засудити єрезіарха"
  crisis_of_faith.7.desc.ready: "Корона знову промовляє владно, і настав час цим скористатися. Ми назвемо ім’я [crisis_of_faith_heresiarch_scope.GetName] перед зібраними вірянами, сповна викладемо всі [crisis_of_faith_heresiarch_scope.GetHerHis] омани й позбавимо [crisis_of_faith_heresiarch_scope.GetHerHis] впливу, який уможливив розкол. Без свого творця оновлене вчення залишиться лише чуткою."
  crisis_of_faith.7.desc.not_ready: "Ми б охоче назвали ім’я [crisis_of_faith_heresiarch_scope.GetName] перед зібраними вірянами й поклали край розколові, але короні бракує влади над присутніми. Духовенство, яке дає прихисток [crisis_of_faith_heresiarch_scope.GetHerHim], сильніше за престол, що прагне осудити [crisis_of_faith_heresiarch_scope.GetHerHis], а невдалий осуд запам’ятається як осуд, який було відкинуто."
  crisis_of_faith.7.a: "Засудити єрезіарха перед вірянами."
  crisis_of_faith.7.a.fail_tt: "Короні бракує влади, щоб виступити проти єрезіарха"
  crisis_of_faith.8.title: "Поступитися розкольникам"
  crisis_of_faith.8.desc: "Розкол неможливо зламати, тож його доведеться підкупити. Ми надамо реформаторам учення, якого вони вимагають, а заразом і становище в нашій церкві, яке з ним пов’язане. Табір розійдеться, а його проповідники повернуться до громад, які відтепер належать їм по праву. Наша побожність уже не оговтається після цього, а саму поступку годі буде забрати назад."
  crisis_of_faith.8.a: "Нехай мають своє вчення."