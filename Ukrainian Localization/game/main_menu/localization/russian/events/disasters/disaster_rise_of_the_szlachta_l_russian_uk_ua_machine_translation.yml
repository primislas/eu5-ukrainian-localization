l_russian:
  rise_of_the_szlachta.1.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] посилю[ROOT.GetCountry.Custom('nobles_yeyut')] вплив"
  rise_of_the_szlachta.1.desc: "Причиною більшості придворних інтриг та махінацій зазвичай є невгамовна жага влади. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] здавна назива[ROOT.GetCountry.Custom('nobles_vlaloly')] себе опорою країни і завжди стверджува[ROOT.GetCountry.Custom('nobles_vlaloly')], що ді[ROOT.GetCountry.Custom('nobles_yeyut')] виключно в інтересах #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!.\n\nАле абсолютна влада абсолютно розбещує людей, і наші аристократи не виняток. Тепер вони не тільки заперечують верховну владу монарха, а й ставлять під сумнів самі основи нашої країни!"
  rise_of_the_szlachta.1.a: "Як вони сміють?"
  rise_of_the_szlachta.2.title: "Вимоги привілейованих станів"
  rise_of_the_szlachta.2.desc: "Подібно до голодних стерв'ятників, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] та [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] завжди шукають можливості урвати побільше влади та впливу. Користуючись тим, що ослаблена корона змушена йти на поступки впливовим магнатам, представники обох станів вимагають подальшого розширення своїх і без того великих вольностей."
  rise_of_the_szlachta.2.a: "Їх отрима[ROOT.GetCountry.Custom('nobles_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l]."
  rise_of_the_szlachta.2.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] більш гідні нашої підтримки."
  rise_of_the_szlachta.2.c: "Ми не підемо на поводі у цих скажених псів!"
  rise_of_the_szlachta.3.title: "Станові суперечки"
  rise_of_the_szlachta.3.desc: "Боротьба за владу рідко проходить спокійно, часто конфлікти між провідними станами переростають у відкрите протистояння. Так сталося і в [target_location.Custom('LR_PREP')|l] [target_location.GetName]. Місцеві [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] та [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] висувають взаємовиключні вимоги та погрожують відкритим бунтом, якщо суперники доб'ються свого."
  rise_of_the_szlachta.3.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] заручаються нашою прихильністю."
  rise_of_the_szlachta.3.b: "Ми вважаємо, що прав[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l]."
  based_on_burghers_estate_power_tt: "З урахуванням [Concept('estate_power', 'влади')|e] стану «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l]»:"
  based_on_burghers_estate_satisfaction_tt: "З урахуванням поточного [Concept('estate_satisfaction', 'задоволення')|e] стану «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l]»:"
  based_on_nobles_estate_power_tt: "З урахуванням поточної [Concept('estate_power', 'влади')|e] стану «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l]»:"
  estate_satisfaction_burghers_tt: "Залежить від поточного рівня задоволення стану"
  rise_of_the_szlachta.4.title: "Народна підтримка"
  rise_of_the_szlachta.4.desc: "Для представників різних станів дебати стали чимось на зразок спортивних змагань. Їхні делегати завжди готові заблокувати будь-які спроби провести необхідні реформи — хоча від їхньої впертості залежать долі цілого народу. Процес пішов би набагато швидше, якби ми активно підтримували інтереси декого з цих впливових громадян…"
  rise_of_the_szlachta.4.a: "Нашою опорою буд[ROOT.GetCountry.Custom('nobles_eut')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l]."
  rise_of_the_szlachta.4.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] нам допоможуть."
  rise_of_the_szlachta.4.c: "Нам не потрібна їхня підтримка."
  rise_of_the_szlachta.5.title: "Стани вимагають скликання [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]"
  rise_of_the_szlachta.5.desc: "Засідання [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] — основний засіб політичних махінацій для багатьох впливових магнатів нашої країни. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|U] та [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] незадоволені тим, що ми давно не скликали делегатів на нові засідання."
  rise_of_the_szlachta.5.a: "Добре, ми зберемо [ROOT.GetCountry.Custom('parliament_ua_ACC')|l]"
  rise_of_the_szlachta.5.b: "Ми влаштуємо засідання, але [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] запрошення не отрима[ROOT.GetCountry.Custom('nobles_yeyut')]!"
  rise_of_the_szlachta.5.c: "Ці дешеві куртизанки нам не указ."
  based_on_crown_estate_power_tt: "З урахуванням [Concept('estate_power', 'влади')|e] стану «[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|l]»:"
  rise_of_the_szlachta.6.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] святку[ROOT.GetCountry.Custom('nobles_yeyut')] перемогу"
  rise_of_the_szlachta.6.desc: "Країна на багато років загрузла в міжусобицях, [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] ста[ROOT.GetCountry.Custom('crown_vlaloly')] блідою тінню сам[ROOT.GetCountry.Custom('crown_ohooyiyh')] себе. За допомогою нескінченних інтриг, таємних угод і повсюдної корупції, що пронизала суспільство зверху донизу, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] зумі[ROOT.GetCountry.Custom('nobles_vlaloly')] відтіснити інші стани і перетвори[ROOT.GetCountry.Custom('nobles_vlaloly')]ся на єдину панівну силу в країні."
  rise_of_the_szlachta.6.a: "І що це означає для народу?"
  rise_of_the_szlachta.7.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] святкують перемогу"
  rise_of_the_szlachta.7.desc: "Коли [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] почина[ROOT.GetCountry.Custom('nobles_vlaloly')] свій виступ проти столичного уряду, ніхто й не припускав, що могутні [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] готові швидко відтіснити їх від важелів влади. Одним рішучим ударом [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] позбавили аристократію влади та прав, на добро чи на згубу ставши єдиною панівною силою в нашій країні."
  rise_of_the_szlachta.7.a: "Який несподіваний поворот…"
  rise_of_the_szlachta.8.title: "Тріумф правителів"
  rise_of_the_szlachta.8.desc: "Мало хто вірив, що [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] зумі[ROOT.GetCountry.Custom('crown_yeyut')] подолати випробування, що обрушилися на країну. Однак, всупереч очікуванням, ні [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], ні [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] не зуміли зломити волю корони. [target_character.GetName] [Select_CString(target_character.IsFemale,'зуміла', 'зумів')] зберегти за собою трон і відновити авторитет уряду в очах підданих. Для #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! починається нова доба."
  rise_of_the_szlachta.8.a: "Нарешті!"
  has_had_struggle_for_royal_power_disaster_tt: "Успішне завершення [Concept('disaster', 'лиха')|e] #Y  «Боротьба за владу короля»#!"