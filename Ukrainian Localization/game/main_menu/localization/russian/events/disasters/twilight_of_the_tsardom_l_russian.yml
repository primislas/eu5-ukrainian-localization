l_russian:
 twilight_of_the_tsardom.1.title: "Падение царства"
 twilight_of_the_tsardom.1.desc: "Когда-то над #TOOLTIP:REGION,balkan_region,X #L Балканами#!#! гордо реяли наши знамёна, однако эти славные времена давно ушли в прошлое. Наша власть зыбка; наши границы осаждены врагами, а раны, оставшиеся после войн и междоусобиц, ещё не успели затянуться. Если мы не начнём действовать решительно, вскоре от [GetCountry('BUL').Custom('rank_ua_GEN')|l] останутся только воспоминания. Нельзя допустить, чтобы нас постигла та же судьба, что и Первую #L [GetCountry('BUL').GetAdjective]ую#! империю."
 twilight_of_the_tsardom.1.a: "[GetCountry('BUL').GetFlavorRank] высто[GetCountry('BUL').Custom('endrank_ityat')]!"
 twilight_of_the_tsardom.1.a.tt: "Если к завершению [Concept('disaster', 'бедствия')|e] «$twilight_of_the_tsardom$» мы не будем владеть #TOOLTIP:LOCATION,constantinople,X #L Константинополем#!#!, произойдёт следующее:"
 twilight_of_the_tsardom.1.a.tt2: "Если к завершению [Concept('disaster', 'бедствия')|e] «$twilight_of_the_tsardom$» мы будем владеть #TOOLTIP:LOCATION,constantinople,X #L Константинополем#!#!, произойдёт следующее:"
 twilight_of_the_tsardom.1.a.tt3: "Если к завершению [Concept('disaster', 'бедствия')|e] «$twilight_of_the_tsardom$» мы будем владеть #TOOLTIP:LOCATION,constantinople,X #L Константинополем#!#! и считаться [Concept('great_power', 'великой державой')|e], произойдёт следующее:"
 twilight_of_the_tsardom.1.historical_info: "После смерти в 1241 году царя Ивана Асеня II в Болгарии начался длительный период междоусобицы среди знати, усугублённый отсутствием сильной власти и набегами монголов. Наследники царя оказались почти бессильны перед лицом окруживших Болгарию держав, что привело к значительным территориальным потерям. Кульминацией этого смутного времени стало восстание Ивайло, за которым последовали десятилетия внутренних распрей и вторжений других стран. В начале XIV века наступило некоторое подобие стабильности, однако уже в 1330 году поражение болгарского войска при Вельбужде и возросшее давление со стороны других стран снова вылились в ослабление Болгарии, к 1337 году ставшей ещё более уязвимой к угрозам внутренним и внешним. Впоследствии страна, так и не сумевшая оправиться от несчастий, была завоёвана османами."
 twilight_of_the_tsardom.2.title: "Царство выстояло"
 twilight_of_the_tsardom.2.desc: "Вопреки всему царство пережило эпоху хаоса, интриг и упадка. Прошлое оставило шрамы, а держава ещё не успела полностью восстановиться, но мы выжили, что многим казалось невозможным. Сумерки подошли к концу, но ещё не ясно, ждёт ли нас новый рассвет."
 twilight_of_the_tsardom.2.a: "Мы восстановим всё, что было утрачено."
 twilight_of_the_tsardom_modifier_removal_tt: "Каждый находящийся во владении район с модификатором «[ShowModifier('bul_powerful_local_elites')]» потеряет его"
 twilight_of_the_tsardom.3.title: "Растущее могущество [GetCountry('BUL').Custom('CL_GEN')]"
 twilight_of_the_tsardom.3.desc: "Даже затянувшаяся смута не смогла погубить #ONCLICK:COUNTRY,[GetCountry('BUL').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BUL').Custom('CL_tt')],X [GetCountry('BUL').Custom('CL_ACC')|L]#!#!: мы воспряли полны сил, мы восстановили оказавшуюся на грани гибели страну. Захват #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#! — подвиг, совершить который под силам не каждому, а тем более — в невыносимо тяжёлые годы. Сегодня нет на #TOOLTIP:REGION,balkan_region,X #L Балканах#!#! такой силы, которая могла бы противостоять нашему царству, и считаться с ним теперь придётся каждому, кто прежде не считал нас достойными."
 twilight_of_the_tsardom.3.a: "Мы явим миру свою мощь!"
 twilight_of_the_tsardom.4.title: "Расцвет нового царства"
 twilight_of_the_tsardom.4.desc: "#L [GetCountry('BUL').GetAdjective]ое#! царство, некогда оказавшееся на краю пропасти, сегодня по праву может величать себя одной из сильнейших держав в мире. Борьба за существование придала нам надежды, а главное — сил построить новое царство. #TOOLTIP:LOCATION,constantinople,X #L Константинополь#!#! принадлежит нам, и мы твёрдо намерены оставить яркий след на страницах истории. Да здравствует Третье [GetCountry('BUL').GetAdjectiveWithNoTooltip]ое Царство!"
 twilight_of_the_tsardom.4.a: "Начинается золотой век!"
 twilight_of_the_tsardom.5.title: "Местные элиты ставят под сомнение нашу власть"
 twilight_of_the_tsardom.5.desc: "Представители высшего общества в [target_location.Custom('LR_PREP')|l] [target_location.GetName] перестали подчиняться нам: они не повинуются указам и правят так, словно они — хозяева этих земель. Вскоре их примеру могут последовать и остальные, увидев слабость центральной власти. Если мы не предпримем решительных действий, раздробленность только усугубится."
 twilight_of_the_tsardom.5.a: "У нас есть более важные заботы."
 twilight_of_the_tsardom.5.b: "Восстановим власть над [target_location.Custom('LR_INST')|l] [target_location.GetNameWithNoTooltip]."
 twilight_of_the_tsardom.6.title: "Придворный обвинён в измене"
 twilight_of_the_tsardom.6.desc: "[Select_CString(target_character.IsFemale, 'Одна из наших доверенных советниц', 'Один из наших доверенных советников')] [target_character.GetName] [Select_CString(target_character.IsFemale, 'оказалась', 'оказался')] под серьёзным подозрением: [Select_CString(target_character.IsFemale, 'её', 'его')] обвиняют в продаже другой державе особо тайных сведений; если они попадут не в те руки, враг сможет ощутимо навредить нашему царству. У нас пока что нет весомых доказательств, однако [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] испытывает видимое беспокойство уже из-за одних только обвинений. Если мы оставим эти обвинения без внимания, у возможного предателя окажутся развязаны руки, однако поспешность может привести к тому, что мы ненароком накажем невиновного."
 twilight_of_the_tsardom.6.a: "Немедленно уволить [Select_CString(target_character.IsFemale, 'её', 'его')]!"
 twilight_of_the_tsardom.6.b: "Наверняка это просто слухи."
 twilight_of_the_tsardom.7.title: "Мятежники в армии"
 twilight_of_the_tsardom.7.desc: "Боевой дух наших войск падает: воины не получают жалование и постепенно начинают роптать, а командирам всё сложнее поддерживать порядок. Чем больше задерживаются выплаты и чем слабее становится цепочка подчинения, тем выше с каждым днём опасность, что сила, некогда служившая опорой нашей державы, обернётся против неё самой."
 twilight_of_the_tsardom.7.a: "Выплатим им причитающееся."
 twilight_of_the_tsardom.7.b: "Нам это не по карману."
 twilight_of_the_tsardom.7.c: "Подавим мятеж, пока он не разросся!"
 twilight_of_the_tsardom.8.title: "Мятежный ленник"
 twilight_of_the_tsardom.8.desc: "До столицы дошли слухи, что верхушка общества в #ONCLICK:COUNTRY,[subject_target.Custom('CL_tt')] #TOOLTIP:COUNTRY,[subject_target.Custom('CL_tt')],X [subject_target.Custom('CL_PREP')|L]#!#! всё реже начинает нам повиноваться; поговаривают даже, что там сложился заговор, участники которого хотят испытать пределы дозволенного. И хотя дело пока не дошло до открытого мятежа, доверенные источники сообщают, что [subject_target.GetGovernment.GetCourtTitle|l] бунтовщиков всё больше склоняется к мысли объявить независимость."
 twilight_of_the_tsardom.8.a: "Пойдём на уступки, чтобы умиротворить их."
 twilight_of_the_tsardom.8.b: "Сейчас мы мало что можем сделать."
 twilight_of_the_tsardom.9.title: "Гарнизон без жалования"
 twilight_of_the_tsardom.9.desc: "Наш гарнизон в [target_location.Custom('LR_INST')|l] [target_location.GetName] постепенно начинает бунтовать: защитники обвиняют местных правителей в беспечном отношении к обороне и нежелании платить жалование. Воины больше не хотят служить короне, неспособной обеспечить им существование. Последствия такого мятежа могут оказаться тяжёлыми, поскольку [target_area.GetName] целиком находится под защитой крепости, в которой находится ропщущий гарнизон."
 twilight_of_the_tsardom.9.a: "Немедленно выплатить им причитающееся!"
 twilight_of_the_tsardom.9.b: "Вынудить местные элиты заплатить им."
 twilight_of_the_tsardom.9.c: "У нас нет лишних денег."
 twilight_of_the_tsardom.10.title: "Враждующие сословия"
 twilight_of_the_tsardom.10.desc: "На волне упадка центральной власти осмелевшие сословия нашего царства начали соперничать друг с другом за влияние: каждый хочет, чтобы ослабшие [GetEstateName('crown_estate')|l] заняли его сторону. Годами копившиеся противоречия сегодня выливаются в открытую вражду, и сохранять непричастность становится всё сложнее. Мы рискуем обернуть против себя обе стороны, поэтому, возможно, стоит попробовать заручиться верностью одной из них. Ценой за это, впрочем, станет дальнейшее усугубление междоусобицы."
 twilight_of_the_tsardom.10.a: "[first_estate.GetNameWithNoTooltip|U] будут нашими союзниками."
 twilight_of_the_tsardom.10.b: "[second_estate.GetNameWithNoTooltip|U] найдут в нас защитников своих интересов."
 twilight_of_the_tsardom.10.c: "Мы не станем занимать чью-либо сторону."
 bul_restore_the_realms_unity: "Восстановление единства державы"
 bul_restore_the_realms_unity_desc: "Земли, без которых когда-то немыслимо было существование [GetCountry('BUL').Custom('rank_ua_GEN')|l], выскользнули у нас из рук и больше не подчиняются престолу. Чтобы выйти из этой смуты с достоинством, нужно непременно воссоединить их с родиной — в том числе и силой, если иначе будет никак..."
 bul_reassert_our_authority: "Повторное утверждение власти"
 bul_reassert_our_authority_desc: "Пользуясь внутренней слабостью #ONCLICK:COUNTRY,[GetCountry('BUL').Custom('CL_tt')] #TOOLTIP:COUNTRY,[GetCountry('BUL').Custom('CL_tt')],X [GetCountry('BUL').Custom('CL_GEN')|L]#!#!, многие выходцы из высшего общества [GetCountry('BUL').Custom('rank_ua_GEN')|l] отказываются признавать нашу власть и правят своими землями так, словно ни перед кем не держат ответ. Чтобы обуздать раздробленность, нам придётся вновь утвердить власть над этими землями и вынудить взбунтовавшихся властителей преклонить перед нами колено."
 bul_push_for_diplomatic_reintegration: "Стремление к дипломатической реинтеграции"
 bul_push_for_diplomatic_reintegration_desc: "Чтобы не допустить гражданской войны, мы сдали часть своих земель правителям, согласным управлять ими от нашего имени. На какое-то время такой подход ещё может себя оправдать, однако в наших же интересах воссоединить царство дипломатическим путём: держава, разделившаяся сама в себе, не устоит."
 twilight_of_the_tsardom.11.title: "Среди стервятников"
 twilight_of_the_tsardom.11.desc: "Мы погрязли в пучине междоусобиц, а соседи тем временем стягиваются к нашим границам, словно стервятники, почуявшие свежую кровь. Они знают, что мы слабы, и жадно высматривают малейшую возможность нанести удар и оторвать от нашего царства кусок плоти. Так, недавно нам стало известно, что [target_country.GetName] выдвинул[target_country.Custom('end_fem')] притязания на провинцию [border_claim_province.GetName] с намерением отобрать её, как только представится удачная возможность."
 twilight_of_the_tsardom.11.a: "Пусть попробуют!"
 twilight_of_the_tsardom.11.b: "Подкупим их, чтобы они отозвали притязания."