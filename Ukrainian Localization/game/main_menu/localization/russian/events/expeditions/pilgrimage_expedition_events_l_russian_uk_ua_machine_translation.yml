l_russian:
  pilgrimage_expedition_events.1.title: "[target_location.GetNameWithNoTooltip] — Святе місто"
  pilgrimage_expedition_events.1.desc: "Після місяців виснажливої подорожі [target_ruler.GetName] стоїть нарешті перед мурами [target_location.Custom('LR_GEN')] [target_location.GetName] — міста Розп’яття, міста Воскресіння, найсвятішої землі в усьому християнському світі. Курява від ходи тисячі прочан висить у повітрі, змішуючись із пахощами ладану, що линуть із сотні каплиць.\n\nУ самому серці височіє Храм Гробу Господнього, зведений над самою скелею Голгофи. [target_ruler.GetSheHe|U] [Select_CString(target_ruler.IsFemale, 'подолала', 'подолав')] довгий шлях заради цієї миті. Далека дорога, збиті до пухирів ноги, безсонні ночі — усе це відступає, коли важкі двері відчиняються, і пахощі священного єлею та давнього каменю линуть назустріч [target_ruler.GetHimHer]."
  pilgrimage_expedition_events.1.a: "Впасти ниць перед Гробом Господнім."
  pilgrimage_expedition_events.1.b: "Замовити каплицю в ім’я [ROOT.GetCountry.GetNameWithNoTooltip]."
  pilgrimage_expedition_events.1.c: "Це паломництво досягло своєї вершини. Час повертатися додому."
  pilgrimage_expedition_events.1.historical_info: "Єрусалим приваблював християнських паломників із IV століття, коли імператор Костянтин звелів звести Храм Гробу Господнього на місці поховання та воскресіння Христа. Місто неодноразово переходило з рук у руки під час Хрестових походів: його захопили учасники Першого хрестового походу в 1099 році, втратили на користь Саладіна в 1187 році та ненадовго повернули за угодою за Фрідріха II в 1229 році, перш ніж воно остаточно перейшло під владу мамлюків. Попри втрату християнського правління, святі місця залишалися доступними паломникам завдяки дипломатичним угодам, що робило Єрусалим найвеличнішою ціллю католицького благочестя в усьому середньовічному світі."
  pilgrimage_expedition_events.2.title: "Вічне місто"
  pilgrimage_expedition_events.2.desc: "[target_location.GetName] повільно виростає з рівнини, куполи та вежі якої ловлять вечірнє світло, коли почет, який очолює [target_ruler.GetName], перетинає останній міст через Тибр. Це місто величне й прадавнє, його вулиці переповнені прочанами з усіх куточків християнського світу, і кожного з них веде сюди одна й та сама невидима сила.\n\nНа верхівці Ватиканського пагорба до неба здіймається собор Святого Петра. Тут височіє престол Намісника Христа, жива влада Церкви на землі. [target_ruler.GetNameWithNoTooltip] сповнюється трепету від того, що перебуває в самому осерді [ShowReligionAdjective('catholic')|l]ої духовности."
  pilgrimage_expedition_events.2.a: "Смиренно визнати божественну владу."
  pilgrimage_expedition_events.2.b: "Зробити пожертву, гідну [ROOT.GetCountry.Custom('CL_GEN')]."
  pilgrimage_expedition_events.2.c: "Ми віддали належну шану. Наш люд потребує нашого повернення."
  pilgrimage_expedition_events.2.historical_info: "Рим став осередком християнської влади з перших століть існування Церкви завдяки мученицькій кончині апостола Петра, чия гробниця спочиває під величного базилікою, що носить його ім’я. Папство здобуло як духовну, так і мирську владу, приваблюючи володарів і паломників з усієї Європи, які шукали відпущення гріхів, визнання свого права на владу та благословення наступника Петра. Ювілейні роки, започатковані в 1300 році папою Боніфацієм VIII, привабили сотні тисяч паломників і закріпили за Римом місце головної мети католицького паломництва."
  pilgrimage_expedition_events.3.title: "Кінець Каміно"
  pilgrimage_expedition_events.3.desc: "Останні милі Каміно-де-Сантьяго — найлюдніші. З усіх доріг та долин потоки прочан сходяться до величного собору в [target_location.Custom('LR_PREP')] [target_location.GetName]; їхні палиці стерті до гладкости, а плащі вкриті пилом п’ятисот ліг. Дехто плаче. Дехто йшов босоніж сотню миль.\n\n[target_ruler.GetName] їде верхи на чолі свого почту, але спішується, щойно на видноті з’являються вежі собору. Здається правильним пройти цю останню ділянку пішки. Могутній спів прочанського гімну лине за вітром: #italic Ultreia! Ultreia!#! — і каміння дороги, здається, вторить йому."
  pilgrimage_expedition_events.3.a: "Скласти подяку біля гробниці святого Якова."
  pilgrimage_expedition_events.3.b: "[target_ruler.GetNameWithNoTooltip] [Select_CString(target_ruler.IsFemale, 'знайшла', 'знайшов')] щось в цій подорожі. [target_ruler.GetSheHe|U] відчуває це."
  pilgrimage_expedition_events.3.c: "Знаменний день. Але нашими [ROOT.GetCountry.GetFlavorRank] все одно потрібно правити."
  pilgrimage_expedition_events.3.historical_info: "Шанування святого апостола Якова в Сантьяго-де-Компостела виникло в IX столітті, коли реліквії, визнані останками Якова, були знайдені в Галісії та покладені в раку королем Астурії Альфонсо II. Паломницький шлях, відомий як Каміно-де-Сантьяго, став одним із трьох великих паломництв середньовічного християнського світу поряд із Римом та Єрусалимом. До XII століття обабіч дороги постали притулки, монастирі та церкви, якими йшли прочани з усіх європейських народів. Прибуття до Сантьяго давало прочанинові право на отримання грамоти «Компостела» та повного відпущення гріхів."
  pilgrimage_expedition_events.4.title: "Рака Трьох Королів"
  pilgrimage_expedition_events.4.desc: "[target_location.GetName] — це [target_location.GetRank.GetName|l] підйомних кранів та будівельних риштувань. Величний собор зводиться вже майже два століття, і його незавершені вежі щороку здіймаються все вище до завершення, якого не побачать ще навіть ненароджені покоління. Проте навіть недобудована, споруда вражає своїми безмірними розмірами — люди кажуть, що вона найбільша у світі.\n\nУ південному трансепті, за сяйвом сухозлітного золота та свічок вівтаря, височіє Рака Трьох Царів: золотий мощовик із кістками волхвів, які йшли за зорею до Вифлеєма. [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'чула', 'чув')] про неї з дитинства. Та ніщо не могло по-справжньому підготувати [target_ruler.GetHimHer] до цього видовища."
  pilgrimage_expedition_events.4.a: "Схилити коліна й ушанувати раку Трьох Волхвів."
  pilgrimage_expedition_events.4.b: "Зробити щедру пожертву на будівництво собору."
  pilgrimage_expedition_events.4.c: "Помолімося, а потім вирушаймо в дорогу."
  pilgrimage_expedition_events.4.historical_info: "Рака Трьох Волхвів у Кельні — найбільший релікварій західного світу, де, як вважається, спочивають кістки біблійних волхвів. Мощі захопив імператор Священної Римської імперії Фрідріх Барбаросса після завоювання Мілана в 1164 році й передав кельнському архієпископу Райнальду фон Дасселю. Їхнє прибуття перетворило Кельн на один із найважливіших осередків паломництва в Північній Європі та стало поштовхом до будівництва величного готичного собору, розпочатого в 1248 році, — задуму, завершеного лише в 1880 році. Зв’язок волхвів із царською владою та Богоявленням робив їхній культ особливо значущим для мирських правителів, які шукали божественного схвалення."
  pilgrimage_expedition_events.5.title: "Богоматір із [target_location.Custom('LR_PREP')] [target_location.GetNameWithNoTooltip]"
  pilgrimage_expedition_events.5.desc: "Кажуть, вітражі в [target_location.Custom('LR_PREP')] [target_location.GetName] неможливо описати — їх треба тільки бачити. [target_ruler.GetName] стоїть у наві й розуміє чому. Собор сповнений синього світла — світла, що пройшло крізь тисячі кольорових скелець і перетворилося на щось уже не зовсім земне. Воно лягає на кам’яну підлогу мінливими плямами, осяває обличчя схилених у молитві прочан і давню святиню в золотому ковчезі за головним вівтарем.\n\n#italic Sancta Camisa#! — покров Діви Марії, який вона, як подейкують, носила в час Благовіщення, приваблює сюди вірян ще з часів Карла Великого. [target_ruler.GetNameWithNoTooltip] завмирає на місці, зворушен[Select_CString(target_ruler.IsFemale, 'а', 'ий')] до глибини душі."
  pilgrimage_expedition_events.5.a: "Ушанувати #italic Sancta Camisa#! і помолитися Богоматері."
  pilgrimage_expedition_events.5.b: "Краса цього місця варта споглядання."
  pilgrimage_expedition_events.5.c: "Прекрасний собор. Ми мусимо рушати далі."
  pilgrimage_expedition_events.5.historical_info: "Собор Нотр-Дам-де-Шартр — один із найкращих зразків французької готичної архітектури, що слугував місцем паломництва з раннього Середньовіччя. Його головна реліквія, #italic Sancta Camisa#! — відріз тканини, що вважається тунікою, яку носила Діва Марія під час Благовіщення, — була подарована собору Карлом Великим й уціліла під час катастрофічної пожежі 1194 року, яка знищила колишню романську споруду. Собор відбудували довкола реліквії з дивовижною швидкістю, а його західна троянда та стрілчасті вікна, датовані приблизно 1220 роком, вважаються одними з найвідоміших середньовічних вітражів у світі. #italic Sancta Camisa#! зробила Шартр одним із головних місць паломництва в Європі, присвячених Богоматері."
  pilgrimage_expedition_events.6.title: "Рака мученика"
  pilgrimage_expedition_events.6.desc: "[target_location.GetRank.GetNameWithNoTooltip] [target_location.GetName] розкинулося в неглибокій долині серед зеленого [ShowCultureName('english')|l]ого краю, а вежі тамтешнього собору видно за багато миль, ще задовго до прибуття. Місто переповнене прочанами: заїзди переповнені, тож люди ночують у клунях та на подвір’ях, а дороги запруджені подорожніми, що розмовляють десятками мов і прямують до спільної мети.\n\nРака святого Томаса Бекета стоїть у каплиці Святої Трійці за головним вівтарем. Колись це була найрозкішніше прикрашена святиня в #TOOLTIP:SCRIPTED_GEOGRAPHY,england_geography #L Англії#!#!: коштовне каміння, золото, усілякі пожертви за обітницею. [target_ruler.GetName] завмирає перед нею. Тут поліг чоловік, який кинув виклик королю. Тут ця сама непокора обернулася святістю. У цьому криється повчальний урок — так чи інакше."
  pilgrimage_expedition_events.6.a: "Запалити свічку й помолитися біля гробниці Бекета."
  pilgrimage_expedition_events.6.b: "Замовити месу за душі вірян."
  pilgrimage_expedition_events.6.c: "Святому досить шани від правителів. Час повертатися додому."
  pilgrimage_expedition_events.6.historical_info: "Томас Бекет, архієпископ Кентерберійський, був убитий у власному соборі лицарями, які діяли за мовчазною згодою короля Англії Генріха II, 29 грудня 1170 року. Його смерть приголомшила весь християнський світ, і лише через три роки, у 1173 році, його канонізували. Генріх II був змушений привселюдно покаятися біля гробниці Бекета, яка невдовзі стала найбільш відвідуваним місцем паломництва в Англії, увічненим у #italic «Кентерберійських оповідках» #! Джеффрі Чосера. Гробницю прикрашало дивовижне зібрання коштовного каміння та золота, пожертвуваних за два століття, зокрема «Регалія Франції» — великий рубін, подарований королем Людовиком VII. У 1538 році Генріх VIII наказав зруйнувати гробницю та забрати її скарби."
  pilgrimage_expedition_events.7.title: "Катедра святого Патрика"
  pilgrimage_expedition_events.7.desc: "[target_location.GetName] височіє на невисокому пагорбі на півночі #TOOLTIP:REGION,ireland_region,X #L Ірландії#!#!, а його парні собори видно з навколишніх угідь. Це місто не назвеш величним — це не #TOOLTIP:LOCATION,rome,X #L Рим#!#! і не #TOOLTIP:LOCATION,jerusalem,X #L Єрусалим#!#!, — але воно несе свою давнину зі спокійною величчю. Це найстаріша [ShowReligionGroupAdjective('christian')|l]а громада в Ірландії, єпископська катедра, заснована самим святим Патриком, коли той прибув навертати острів до віри.\n\n[target_ruler.GetName] прибуває на світанку, коли пагорби ще оповиті туманом. Канонік собору зустрічає [target_ruler.GetHerHis] біля брами й веде на місце, де, за переказами, молився Патрик. Непримітна простота цього місця несподівана й водночас промовисто доречна."
  pilgrimage_expedition_events.7.a: "Бути присутнім на месі в соборі святого Патрика."
  pilgrimage_expedition_events.7.b: "Залишити пожертву біля гробниці святого Патрика."
  pilgrimage_expedition_events.7.c: "Відвідини здійснено з належною шаною. Час повертатися."
  pilgrimage_expedition_events.7.historical_info: "Армаг споконвіку вважається церковною столицею Ірландії — статус, зумовлений його зв’язком зі святим Патриком, який, за переказами, заснував там свою головну церкву близько 445 року. Кафедра Армага стала першопрестольною для Ірландської церкви — становище, за яке й досі сперечаються католицький і протестантський собори, що височіють на двох пагорбах міста. З наближенням Реформації значення Армага полягало не лише в політичній силі, а й у символічній вазі — як церкви апостола, що навернув Ірландію до віри, — що робило його привабливим для володарів, охочих засвідчити побожність або солідарність з Ірландською церквою."
  pilgrimage_expedition_events.8.title: "Абатство Святого Спасителя"
  pilgrimage_expedition_events.8.desc: "Бригідське абатство в [target_location.Custom('LR_PREP')] [target_location.GetName] стоїть на березі озера #TOOLTIP:LOCATION,vattern,X #L Веттерн#!#!, і його білені стіни відбиваються в нерухомій сірій воді. Засноване самою святою Бригідою, яка у видінні побачила його спорудження ще до того, як було закладено перший камінь, воно є найновішим серед великих прочанських осередків християнського світу й єдиним, яке заснувала жінка.\n\n[target_ruler.GetName] зустрітий мовчазними черницями, які ведуть [target_ruler.GetHimHer] прохолодними критими галереями до каплиці, де зберігаються мощі святої. Тут панує особливе північне світло, бліде й чисте, що так різниться від золотого тепла #TOOLTIP:LOCATION,rome,X #L Рима#!#! чи прадавнього пилу #TOOLTIP:LOCATION,jerusalem,X #L Єрусалима#!#!. Святість, розмірковує [target_ruler.GetNameWithNoTooltip], має багато облич."
  pilgrimage_expedition_events.8.a: "Помолитися в каплиці святої Бригіди."
  pilgrimage_expedition_events.8.b: "Доручити сестрам переписати [target_ruler.GetHerHis] духовні роздуми."
  pilgrimage_expedition_events.8.c: "Ми й так забарилися. Дорога додому кличе."
  pilgrimage_expedition_events.8.historical_info: "Бригіда Шведська (бл. 1303–1373) була містикинею, богословом і засновницею ордену бригідок. Значну частину зрілих літ вона провела в Римі, обстоюючи повернення папського престолу з Авіньйона. Вона пережила сотні одкровень, які диктувала шведською мовою і які згодом переклали та широко поширили під назвою #italic Revelationes#! («Одкровення»). Папа Урбан V особисто благословив заснування Вадстенського абатства за її видіннями. 1391 року її канонізували, і вона стала однією з покровительок Європи. Вадстена приваблювала прочан з усієї Скандинавії та Північної Європи, а її значущість підсилювалася зв’язками ордену бригідок із монаршими домами та незвичним подвійним монастирем як для ченців, так і для черниць."
  pilgrimage_expedition_events.10.a: "Смиренно схилити коліна, як зробив би сам Франциск."
  pilgrimage_expedition_events.10.b: "Подати милостиню жебракам коло входу, в дусі самого святого."
  pilgrimage_expedition_events.10.c: "Ми вшанували це місце. Час повертатися."
  pilgrimage_expedition_events.10.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.10.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.10.historical_info: "Франциск Ассізький (1181/2–1226) зрікся багатства своєї родини, щоби жити в бідності, і заснував орден францисканців на засадах смирення, мандрівної проповіді та служіння бідним і хворим. Він був канонізований папою Григорієм IX у 1228 році, лише через два роки після смерті — одна з найшвидших канонізацій в історії Середньовіччя. Будівництво базиліки Сан-Франческо розпочалося того ж року і було в основному завершено до 1253 року; її нижню та верхню церкви згодом прикрасили фресками, які приписують Чімабуе та Джотто. Попри те що сам святий цурався матеріальних статків, Ассізі став одним із найвеличніших місць прощі католицької Європи, приваблюючи як володарів, так і звичайних прочан."
  pilgrimage_expedition_events.10.title: "Бідняк з Ассізі"
  pilgrimage_expedition_events.11.a: "Вшанувати гробницю й отримати посудину з миром."
  pilgrimage_expedition_events.11.b: "Замовити месу за моряків, які привезли святого додому."
  pilgrimage_expedition_events.11.c: "Святий благословив нас. Тепер ми повертаємося додому."
  pilgrimage_expedition_events.11.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.11.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.11.historical_info: "У 1087 році шістдесят два моряки з Барі відпливли до Мир Лікійських, яким тоді загрожувало сельджуцьке завоювання, і вивезли мощі святого Миколая, перш ніж ті могли бути втрачені або знищені. Мощі прибули до Барі 9 травня 1087 року — цей день і досі відзначають як свято перенесення мощей, — і для їхнього зберігання звели базиліку Сан-Нікола, крипта якої була освячена в присутності папи Урбана II у 1089 році. Від моменту прибуття мощей довкола кісток продовжує утворюватися прозора рідина, яку віряни називають #italic миром#!, її щороку збирає архієпископ Барі. Як покровитель моряків, купців і дітей, а також один із небагатьох святих, шанованих з однаковим благоговінням як у католицькому, так і в православному світі, Миколай зробив Барі осередком паломництва, що не має рівних в Італії."
  pilgrimage_expedition_events.11.title: "Святий покровитель моряків"
  pilgrimage_expedition_events.12.a: "Схилити коліна перед Чорною Мадонною в мовчазній побожності."
  pilgrimage_expedition_events.12.b: "Обдарувати славетну бібліотеку та писарню абатства."
  pilgrimage_expedition_events.12.c: "Годі з нас цих темних лісів. Рушаймо далі."
  pilgrimage_expedition_events.12.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.12.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.12.historical_info: "Айнзідельн бере свій початок від самітника Майнрада, який оселився в цьому лісі і був убитий розбійниками у 861 році. Справжній монастир заснував на цьому місці в 934 році монах Ебергард, і, згідно з невмирущою легендою, його каплицю в чудесний спосіб освятив сам Христос у ніч проти 14 вересня 948 року — домагання, згодом підтверджене папою Левом VIII. Чорна Мадонна абатства впродовж століть була осередком паломницького шанування, що зробило Айнзідельн одним із найвідвідуваніших марійних святилищ у німецькомовному світі."
  pilgrimage_expedition_events.12.title: "Освячення ангелами"
  pilgrimage_expedition_events.13.a: "Вшанувати ікону та її нетлінні рани."
  pilgrimage_expedition_events.13.b: "Пожертвувати золото на укріплення, аби обитель не розграбували."
  pilgrimage_expedition_events.13.c: "Ми побачили Ясну Гору. Час додому."
  pilgrimage_expedition_events.13.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.13.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.13.historical_info: "Монастир паулінів на Ясній Горі заснував у 1382 році князь Владислав Опольчик, який привіз із собою ікону Богородиці з Дитятком у візантійському стилі, що вже шанувалася як чудотворна. На Великдень 1430 року загін гуситських нападників із Богемії, Моравії та Сілезії розграбував монастир, розбивши ікону на частини та двічі розсікши шаблею лик Богородиці. Відновлювачі при королівському дворі Владислава Ягайла в Кракові відновили образ, але шрами проступали крізь кожен новий шар фарби, і врешті-решт їх залишили як незмінну, навмисну частину зображення. Ченстоховська Богоматір стала головною марійною святинею Польщі, а її посічений лик копіювали на іконах по всьому краю впродовж століть."
  pilgrimage_expedition_events.13.title: "Світла гора"
  pilgrimage_expedition_events.14.a: "Вшанувати пам’ять святого Стефана мовчазною молитвою."
  pilgrimage_expedition_events.14.b: "Довго розмовляти з архієпископом-примасом Угорщини."
  pilgrimage_expedition_events.14.c: "Гідні відвідини для християнського правителя. Час вирушати."
  pilgrimage_expedition_events.14.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.14.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.14.historical_info: "Стефан I Угорський народився близько 975 року в Естергомі й там само був коронований напередодні Різдва 1000 року — подія, що знаменувала офіційне народження християнського Угорського королівства. У 1001 році Стефан заснував Естергомську архієпархію, найдавнішу в країні, і її архієпископи відтоді носять титул примаса Угорщини. Естергом слугував політичним і духовним осідком королівства до середини XIII століття, а канонізація самого Стефана у 1083 році остаточно закріпила за містом статус духовного осередку угорського християнства."
  pilgrimage_expedition_events.14.title: "Катедра святого Стефана"
  pilgrimage_expedition_events.15.a: "Вклонитися іконі Трсатської Богоматері."
  pilgrimage_expedition_events.15.b: "Замовити месу за благополучну мандрівку в [current_location.GetRank.GetNameWithNoTooltip], що розташоване коло моря."
  pilgrimage_expedition_events.15.c: "Дім рушив далі, до Лорето. Отже, і нам час — додому."
  pilgrimage_expedition_events.15.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.15.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.15.historical_info: "За переказами, Святий дім з Назарета, оселя Діви Марії, був перенесений янголами на пагорб Трсат над Рієкою 10 травня 1291 року й залишався там три роки, перш ніж 10 грудня 1294 року вирушити далі, до Лорето в Італії. Нікола I Франкопан звів на цьому місці першу церкву, щоби вшанувати місце, де стояв дім. У 1367 році папа Урбан V надіслав святилищу ікону Богоматері з Немовлям, за переказами написану самим святим Лукою, на втіху через втрату дому, а від наступного століття святиню стережуть ченці-францисканці. Переказ закріпив за містом стійке прізвисько — Хорватський Назарет."
  pilgrimage_expedition_events.15.title: "Хорватський Назарет"
  pilgrimage_expedition_events.16.a: "Вшанувати нетлінного короля коло його гробниці."
  pilgrimage_expedition_events.16.b: "Урок Олава: віра, здобута мечем, усе ж є вірою."
  pilgrimage_expedition_events.16.c: "Холодне й святе місце. Час додому."
  pilgrimage_expedition_events.16.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.16.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.16.historical_info: "Олав Гаральдссон, король Норвегії, поліг у битві коло Стікластадіра 29 липня 1030 року, б'ючись за повернення свого престолу й завершення християнізації свого королівства силою зброї. Коли його могилу відкрили через рік і п'ять днів, 3 серпня 1031 року, єпископ Грімкель виявив тіло нетлінним і лише на цій підставі оголосив Олава святим — місцева канонізація, згодом підтверджена папою Олександром III у 1164 році. Над його гробницею звели Нідароський собор, який став головним місцем паломництва Півночі й приваблював вірян з усієї Скандинавії та з-поза її меж мережею доріг, що й донині звуться Шляхами Святого Олава."
  pilgrimage_expedition_events.16.title: "Король-мученик"
  pilgrimage_expedition_events.17.a: "Ми повертаємося зі соромом, не виконавши обітниці, даної Богові."
  pilgrimage_expedition_events.17.desc: "[target_leader.GetName] повертає додому, не виконавши обітниці — паломництво покинуте, не досягнувши мети. Звістка про порушену обітницю доходить до [ROOT.GetCountry.GetName] раніше, ніж повертається [target_leader.GetHimHer], і [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] пам'ятатиме про це ще довго після того, як [ROOT.GetCountry.GetGovernment.GetCourtTitle] вже забуде."
  pilgrimage_expedition_events.17.title: "Покинуте паломництво"
  pilgrimage_expedition_events.18.a: "Найняти місцевих провідників, які знають кожен безпечний уступ."
  pilgrimage_expedition_events.18.b: "Рушати далі без них, покладаючись на віру й твердість ходи."
  pilgrimage_expedition_events.18.c: "Повернути назад і піти довгим шляхом в обхід хребта."
  pilgrimage_expedition_events.18.title: "Гірський перевал"
  pilgrimage_expedition_events.19.a: "Перечекати бурю внизу, під палубою, і сподіватися, що корабель витримає."
  pilgrimage_expedition_events.19.afloat_tt: "Команді вдається втримати корабель на плаву"
  pilgrimage_expedition_events.19.b: "Зібрати супутників на палубі й молитися, поки не вщухне буря."
  pilgrimage_expedition_events.19.faith_protects_tt: "Наша віра захищає нас у бурю"
  pilgrimage_expedition_events.19.off_course_tt: "Буря сильно збиває корабель із курсу"
  pilgrimage_expedition_events.19.piety_lacking_tt: "Нашого благочестя недостатньо перед бурею"
  pilgrimage_expedition_events.19.title: "Буря на морі"
  pilgrimage_expedition_events.2.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.2.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.20.a: "Заплатити поромникові за безпечну переправу."
  pilgrimage_expedition_events.20.b: "Перейти річку вбрід самим і заощадити на оплаті."
  pilgrimage_expedition_events.20.title: "Переправа через річку"
  pilgrimage_expedition_events.21.a: "Поквапитися вперед і залишити болота позаду."
  pilgrimage_expedition_events.21.b: "Зупинитися й дати хворим одужати, перш ніж продовжити шлях."
  pilgrimage_expedition_events.21.title: "Лихоманка на болотах"
  pilgrimage_expedition_events.22.a: "Перечекати зиму в найближчому місті."
  pilgrimage_expedition_events.22.b: "Заплатити за провідників і вози, щоб пробитися крізь перевал."
  pilgrimage_expedition_events.22.title: "Зима перекриває дорогу"
  pilgrimage_expedition_events.23.a: "Прийняти гостинність із вдячністю."
  pilgrimage_expedition_events.23.b: "Відмовитися від затримки й помолитися на самоті."
  pilgrimage_expedition_events.23.title: "Гостинність лорда"
  pilgrimage_expedition_events.24.a: "Сплатити вимагане мито."
  pilgrimage_expedition_events.24.b: "Прорватися силою разом із нашим почтом."
  pilgrimage_expedition_events.24.c: "Звернути й пошукати довший шлях в обхід його земель."
  pilgrimage_expedition_events.24.title: "Мито ворожого лорда"
  pilgrimage_expedition_events.25.a: "Посперечатися з місцевими про переваги істинної віри."
  pilgrimage_expedition_events.25.b: "Не будити лиха, поки тихо, і пройти повз."
  pilgrimage_expedition_events.25.title: "Іншої віри"
  pilgrimage_expedition_events.26.a: "Відкупитися від них і покінчити з цим."
  pilgrimage_expedition_events.26.b: "Встати й битися за честь прощі."
  pilgrimage_expedition_events.26.title: "Розбійники на дорозі"
  pilgrimage_expedition_events.27.a: "Прийняти їх до свого товариства."
  pilgrimage_expedition_events.27.b: "Прогнати їх геть, щоб не сповільнювати ходи."
  pilgrimage_expedition_events.27.title: "Паломники приєднуються до каравану"
  pilgrimage_expedition_events.28.a: "Вирядити почет на пошуки харчів в околицях."
  pilgrimage_expedition_events.28.b: "Скупити всі знайдені харчі, не зважаючи на ціну."
  pilgrimage_expedition_events.28.c: "Нічого не вдієш. Повертаємо назад."
  pilgrimage_expedition_events.28.title: "Порожні засіки"
  pilgrimage_expedition_events.29.a: "Узятися до зброї та дати відсіч."
  pilgrimage_expedition_events.29.b: "Віддати корабельні припаси і сподіватися, що цього вистачить."
  pilgrimage_expedition_events.29.title: "Корсари біля узбережжя"
  pilgrimage_expedition_events.3.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.3.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.30.a: "Сплатити потрібний викуп."
  pilgrimage_expedition_events.30.b: "Спробувати вислизнути під покровом темряви."
  pilgrimage_expedition_events.30.title: "Захоплені заради викупу"
