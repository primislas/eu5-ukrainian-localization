  pilgrimage_resupply_light: "Заплатити місцевим за свіжих коней, харчі та найманих робітників."
  pilgrimage_expedition_events.10.desc: "[target_ruler.GetName] долає останній схил на шляху до [current_location.Custom('LR_GEN')] [current_location.GetName], і перед [Select_CString(target_ruler.IsFemale('нею', 'ним'))] постає велична базиліка з двох ярусів блідого каменю, вбудована просто в схил пагорба та зведена з дивовижною швидкістю після смерти чоловіка, якого вона вшановує, — жебрака, що не мав нічого, а нині спочиває в одному з найвеличніших храмів Італії.\n\nУсередині нижньої церкви, у висіченій просто в скелі крипті, лежить сам Франциск Ассізький. [target_ruler.GetSheHe|U] схиляє коліна перед гробницею чоловіка, який зрікся шовку й золота заради мотузяного пояса й босих ніг, і який, за переказами, проповідував птахам та приборкав вовка. Разюча суперечність між убогістю святого та розкішшю, зведеною на його пам’ять, не лишається [Select_CString(target_ruler.IsFemale('нею', 'ним'))] непоміченою."
  pilgrimage_expedition_events.11.desc: "Подих моря відчувається задовго до того, як [target_ruler.GetName] дістається мурів [current_location.Custom('LR_GEN')] [current_location.GetName] — це портове [current_location.GetRank.GetName|l], розбудоване довкола одного величного скарбу. Під романськими склепіннями базиліки лежить гробниця Миколая Мирлікійського, привезеного сюди місцевими моряками понад сто років тому із занепалих церков християнського Сходу, що вже не міг їх захистити.\n\nРаз на рік гробницю відкривають і збирають із кісток святого прозору рідину — #italic манну#!, яка, як вірять і [ShowReligionAdjective('catholic')|l]і, і [ShowReligionAdjective('orthodox')|l]ні віряни, має цілющу силу. Коли перед правителем [target_ruler.GetName] постає пляшечка з нею, спадає на думку, що жодна інша святиня на цьому шляху не користується такою спільною шаною в обох гілках християнства водночас."
  pilgrimage_expedition_events.12.desc: "Бенедиктинське абатство в [current_location.Custom('LR_PREP')] [current_location.GetName] стоїть на узліссі темного лісу у #TOOLTIP:CULTUREGROUP,swiss_group,X #L швейцарських#!#! горах, а його одягнені в чорне ченці ведуть свій родовід від самітника, якого розбійники вбили на цьому місці багато поколінь тому. [target_ruler.GetName] ще з дитинства знає переказ про те, як тутешню каплицю освятив не якийсь єпископ, а сам Христос, який зійшов із хором янголів і святих напередодні її освячення.\n\nУ каплиці Богородиці стоїть святиня того першого, неосвяченого людьми дійства: невелика статуя Діви Марії, що за століття від свічкового диму потемніла до глибокої чорноти. Прочани з усіх німецькомовних земель схиляють перед нею коліна безперервною вервечкою, що тягнеться з часів давніших, ніж [target_ruler.GetNameWithNoTooltip] узагалі може уявити."
  pilgrimage_expedition_events.13.desc: "#italic Ясна Гора#! височіє над рівниною задовго до того, як [target_ruler.GetName] дістається монастирської брами, а її білі мури виграють на сонці саме так, як і задумували ченці-пауліни, що звели їх. Усередині, за стіною з вотивного срібла та палаючих свічок, висить темнолика ікона Богородиці, яка перетворила це скромне #TOOLTIP:CULTUREGROUP,polish_group,X #L польське#!#! [current_location.GetRank.GetName|l] на місце паломництва для прочан з усієї півночі.\n\n[target_ruler.GetName] уважно вдивляється в обличчя Мадонни й бачить їх: два паралельні рубці на правій щоці, давні рани, які жодна реставрація так і не змогла загоїти. Колись давно ворожий меч розсік святиню, і ченці, які згодом намагалися поновити образ, знову й знову бачили, як крізь свіжу фарбу проступає кров, доки врешті не облишили спроб приховати заподіяне."
  pilgrimage_expedition_events.14.desc: "[current_location.GetName] стоїть там, де робить вигин Дунай, а соборний пагорб височіє над річкою, яка колись позначала кордон християнської Європи. Тут, у каплиці, яку відтоді безліч разів перебудовували, Іштван Угорський народився, охрестився і зимового дня на зламі тисячоліть був коронований як перший християнський король свого народу.\n\n[target_ruler.GetName] отримує прийом від архієпископа міста [current_location.GetNameWithNoTooltip], примаса Угорщини та наступника катедри, яку заснував сам Іштван. Архієпископ розповідає про юного короля, який обрав хрещення замість давніх богів, звів цей храм перш ніж збудував власний палац, і був канонізований за лічені десятиліття після смерти саме тому, що збагнув: християнська корона має спиратися на християнську церкву."
  pilgrimage_expedition_events.15.desc: "На пагорбі над [current_location.Custom('LR_INST')] [current_location.GetName], звідки відкривається вид на затоку, височіє скромний францисканський храм, зведений довкола порожнього місця, де, як запевняють тутешні прочани, колись стояло дещо надзвичайне. Кажуть, три роки на цій землі стояв сам будинок Святої родини, цілком перенесений ангелами з Назарета, коли Свята земля стала надто небезпечною, перш ніж продовжити свій дивовижний шлях до Лорето в Італії.\n\n[target_ruler.GetName] бачить образ, надісланий Папою на втіху [current_location.Custom('LR_DAT')] через втрату святині: Діву Марію, що годує Немовля Христа, яка вважається роботою самого святого Луки. Відтоді цей образ кличе покоління прочан на цей схил — святиня тому, чого тут уже немає, але що водночас незримо присутнє."
  pilgrimage_expedition_events.16.desc: "Собор у [current_location.Custom('LR_PREP')] [current_location.GetName] суворо й сіро здіймається на тлі північного неба. Його звели над піщаною косою, де трохи більше ніж через рік після смерти короля розкрили його могилу й на превеликий подив усіх присутніх виявили, що тіло не зазнало тління. Переказують, що його волосся та нігті продовжували рости в темній землі, а з домовини, де мав би стояти сморід смерти, линули солодкі пахощі.\n\n[target_ruler.GetName] стоїть перед ракою Олава Гаральдссона — колишнього ватажка вікінгів, що поліг у бою, намагаючись силою навернути до християнства королівство, яке цього не бажало, і якого визнали святим за рік після загибелі простим народним визнанням, без жодного дозволу далекого Папи. Це, міркує [target_ruler.GetNameWithNoTooltip], дивна святість: здобута не смиренною побожністю, а мечем і смертю за справу, яка видалася праведною лише з плином часу."
  pilgrimage_expedition_events.18.desc: "Дорога підіймається в оголені, обвітрені краї, звужуючись до вузької стежки вздовж гірського схилу. [target_ruler.GetName] зупиняється на роздоріжжі: довший шлях оминає найважчі підйоми, а прямий, за словами місцевих пастухів, не завжди до снаги непідготовленим мандрівникам.\n\n[target_ruler.GetSheHe|U] зіставляє небезпеку гори з часом. Кожен день, згаяний на пошуки легшого шляху, віддаляє загін від мети подорожі."
  pilgrimage_expedition_events.19.desc: "Небо над кораблем темніє без попередження, і вже за годину екіпаж бореться з хвилями, що перекочуються через облавок. [target_ruler.GetName] відкидає на щоглу, перш ніж вдається за щось ухопитися, а палуба під ногами [target_ruler.GetHimHer] здригається, наче жива істота.\n\nУ трюмі прочани чіпляються за все прикріплене й моляться десятками говірок водночас. Більше нічого не лишається, доки море не вирішить зглянутися над ними."
  pilgrimage_expedition_events.20.desc: "Дорога раптово уривається біля річки, каламутної й повноводної після нещодавніх дощів: брід сховався під течією, достатньо потужною, щоб збити з ніг коня. З протилежного берега спостерігає поромник, який не поспішає переправлятися, доки не побачить дзвінкої монети.\n\n[target_ruler.GetName] по черзі дивиться то на воду, то на поромника. Жоден із них сьогодні не викликає особливої довіри."
  pilgrimage_expedition_events.21.desc: "Дорога на багато миль занурюється в стоячу воду, а повітря гусне від смороду гнилі та кусючих комах. За лічені дні кашель серед супроводу переростає в гарячку, і багатьох подорожніх доводиться нести на руках.\n\n[target_ruler.GetName] бачить, як загін рідшає й затихає з кожною милею цим краєм, і міркує, скільки з них сподівалися на прощу, а не на пошесть."
  pilgrimage_expedition_events.22.desc: "Снігові замети вище людського зросту перекривають перевал попереду, і місцеві селяни прямо кажуть, що до весни цією дорогою ніхто не пройде. [target_ruler.GetName] не [Select_CString(target_ruler.IsFemale, 'планувала', 'планував')] марнувати цілу пору року через негоду, але гора не зважає на плани мандрівників.\n\nПоблизу є містечко, де знайдеться прихисток для всього загону, якщо [target_ruler.GetHerHis] гаманець витримає витрати на постій. Або ж є провідники, які за певну платню стверджують, що знають прохід навіть зараз."
  pilgrimage_expedition_events.23.desc: "Звістка про наближення прочан поширилася швидше, ніж рухається сам загін, і місцевий вельможа особисто виїжджає назустріч, щоб привітати правителя [target_ruler.GetName] і запросити до свого столу на перепочинок перед подальшою дорогою. Запропонована гостинність щедра й явно розрахована на те, щоб її помітили й запам’ятали.\n\n[target_ruler.GetSheHe|U] розуміє справжню суть цієї пропозиції: і побожність, і слава, якщо прийняти її з належною гідністю."
  pilgrimage_expedition_events.24.desc: "Шлях попереду пролягає землями вельможі, який зараховує #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! до своїх ворогів, і його люди чекають на кордоні з митною заставою та вимогами. [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'сподівалася', 'сподівався')] пройти непомітно, але ця надія згасає при виді виставлених упоперек дороги списів.\n\nЗбирач мита називає ціну, яка є радше образою, ніж домовленістю, і чекає, у скільки обійдеться [target_ruler.GetHerHis] гордість."
  pilgrimage_expedition_events.25.desc: "Шлях пролягає повз святиню, священну для [current_location.GetDominantReligion.GetAdjective|l]их вірян, незвичну своїми образами та обрядами. [target_ruler.GetName] спостерігає за місцевими вірянами під час їхніх молитов — ті дивляться на чужинців із цікавістю та певною настороженістю.\n\nСеред прочан є давній звичай сперечатися про віру з кожним, хто ладен слухати. [target_ruler.GetSheHe|U] роздумує, чи не настав час піддатися цій спокусі."
  pilgrimage_expedition_events.26.desc: "Дорога заглиблюється в дикі хащі, де немає жодної влади, здатної гарантувати безпеку. Перш ніж загін встигає зреагувати, з-за дерев виринають постаті: озброєні, обідрані й явно досвідчені в грабунку подорожніх. [target_ruler.GetName] квапливо рахує їх: їх забагато, щоб пройти повз без клопоту, але замало, щоб вважатися військом.\n\nЇхній ватажок виходить уперед і називає плату за безпечний прохід таким тоном, що не лишає сумнівів щодо наслідків у разі відмови."
  pilgrimage_expedition_events.27.desc: "Звістка про володаря, що вирушив на прощу, летить попереду подорожніх, і на час, коли [target_ruler.GetName] дістається наступного роздоріжжя, там уже зібрався обірваний гурт простих прочан, сподіваючись здолати решту шляху під захистом правителевого почту.\n\nСеред них є родини й піші дідусі, які самі вже далеко не зайдуть. [target_ruler.GetSheHe|U] не може годувати всіх нескінченно, але прогнати їх звідси означало б покинути напризволяще."
  pilgrimage_expedition_events.29.desc: "Низький темний корпус розтинає небокрай, весла виблискують на сонці, а невідомий корабель наближається до судна прочан швидше, ніж будь-який чесний купець мав би причину рухатися. [target_ruler.GetName] упізнає обриси піратського судна задовго до того, як пролунає крик вартового, а поблизу немає ані порту, ані берега, ані допомоги.\n\n[target_ruler.GetSheHe|U] збирає на палубі всіх бійців, яких тільки має почет, і роздумує, чи вистачить їх, чи корабельні припаси варті того, щоб за них битися."
  pilgrimage_expedition_events.30.desc: "Через те, що дорога порідшала ряди почту, [target_ruler.GetName] стає легкою здобиччю, і хтось дорогою це запримітив. Озброєні люди оточують загін перш ніж охорона встигає вишикуватися, а їхній ватажок називає ціну за волю володаря так само буденно, як купець призначає ціну на хліб.\n\n[target_ruler.GetSheHe|U] має обмаль людей і ще менше добрих виходів із становища."
  pilgrimage_expedition_events.28.desc: "Запаси загону вичерпалися десь за останнім містечком, що взагалі заслуговувало на таку назву, і шлунки супутників спорожніли так само, як і торби, де колись лежав хліб. [target_ruler.GetName] ніколи раніше не [Select_CString(target_ruler.IsFemale, 'водила', 'водив')] війська, і це помітно: голоду байдуже до святости обраного шляху.\n\nЦей край принаймні досить щедрий, аби щось запропонувати: поблизу є поля, сади й сільський базар, якщо загін, який очолює [target_ruler.GetName], готовий витратити час, гроші чи гордість, щоб скористатися цим."