  pilgrimage_expedition_events.9.a: "Ми оплакуватимемо нашу втрату."
  pilgrimage_expedition_events.9.desc: "[target_leader.GetName] помирає в дорозі, і паломництво залишилося незавершеним. Звістка про втрату дійде до [ROOT.GetCountry.GetName] нескоро — її принесуть додому ті слуги, що залишалися поруч, з [target_leader.GetHerHis] боку до останньої години."
  pilgrimage_expedition_events.9.title: "Паломництво, що закінчилося скорботою"
