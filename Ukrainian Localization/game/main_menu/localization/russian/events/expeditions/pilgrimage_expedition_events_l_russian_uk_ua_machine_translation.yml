l_russian:
  pilgrimage_expedition_events.1.title: "Священне місто [current_location.GetNameWithNoTooltip]"
  pilgrimage_expedition_events.1.desc: "Після довгих місяців виснажливої дороги [target_ruler.GetName] нарешті стоїть перед мурами [current_location.Custom('LR_GEN')|l] [current_location.GetName] — міста Розп’яття, міста Воскресіння, найсвятішої землі для всього християнського світу. Місцева курява, піднята тисячами паломників, змішується з пахощами ладану, що линуть із сотень каплиць.\n\nУ самісінькому серці цієї землі височіє Храм Гроба Господнього, зведений на тій самій скелі Голгофі. Довгий шлях [Select_CString(target_ruler.IsFemale, 'подолала', 'подолав')] [target_ruler.GetName] заради цієї миті. Дорожні знегоди, стерті до крові ноги, безсонні ночі — усе це вмить забувається, коли відчиняються величні брами, звідки линуть пахощі святого єлею та стародавнього каменю."
  pilgrimage_expedition_events.1.a: "Впадімо ниць перед Гробом Господнім."
  pilgrimage_expedition_events.1.b: "Закладімо каплицю на славу [ROOT.GetCountry.Custom('CL_GEN')]."
  pilgrimage_expedition_events.1.historical_info: "Християнські прочани почали вирушати до Єрусалима з IV століття, коли імператор Костянтин наказав збудувати церкву Гроба Господнього на місці поховання й воскресіння Христа. За часів хрестових походів місто неодноразово переходило з рук до рук. У 1099 році його захопили учасники Першого хрестового походу. У 1187 році воно стало здобиччю Саладіна. У 1229 році, за Фрідріха II, Єрусалим ненадовго повернувся під владу християн, після чого остаточно перейшов під панування мамлюків. Попри втрату християнського панування, святі місця залишаються доступними для паломників завдяки дипломатичним угодам. Так Єрусалим став головним осередком католицького паломництва в усьому середньовічному світі."
  pilgrimage_expedition_events.2.title: "Вічне місто"
  pilgrimage_expedition_events.2.desc: "[current_location.GetRank.GetNameWithNoTooltip] [current_location.GetName] повільно здіймається над рівниною. Його бані та вежі купаються в променях полуденного сонця, поки [target_ruler.GetName] та [Select_CString(target_ruler.IsFemale, 'її', 'його')] почет перетинають останній міст через Тибр. На вулицях цього величезного й стародавнього #L #TOOLTIP:LOCATIONRANK,[current_location.Custom('LR_tt')],X [current_location.Custom('LR_GEN')|l]#!#! повно паломників з усіх усюд християнського світу, і кожного з них привів сюди той самий невидимий потік.\n\nМайже під небесами, на вершині Ватиканського пагорба видніється собор Святого Петра. Тут розташований престол намісника Христа — живе втілення церковної влади на землі. [target_ruler.GetNameWithNoTooltip], опинившись у самісінькому серці #TOOLTIP:RELIGION,$catholic_tt$,X $tt_op_L$католицької$tt_cl_2$ віри, відчуває благоговіння."
  pilgrimage_expedition_events.2.a: "Смиренно схилімося перед священною владою."
  pilgrimage_expedition_events.2.b: "Зробімо пожертву, гідну нашого титулу."
  pilgrimage_expedition_events.2.c: "Ми виконали свій обов’язок. Настав час повертатися до свого народу."
  pilgrimage_expedition_events.2.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.2.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.2.historical_info: "Рим став осідком християнської влади в перші століття існування Церкви після мученицької кончини апостола Петра, чия гробниця спочиває під величною базилікою, що носить його ім’я. Папство з часом перетворилося як на духовну, так і на світську силу: воно приваблювало правителів і прочан з усієї Європи, які шукали відпущення гріхів, визнання права на владу та благословення від наступника Петра. Ювілейні роки, запроваджені в 1300 році папою Боніфацієм VIII, привели до Рима сотні тисяч пілігримів і остаточно закріпили за містом статус головного осередку католицького паломництва."
  pilgrimage_expedition_events.3.title: "Кінець Каміно"
  pilgrimage_expedition_events.3.desc: "Останню частину #italic шляху Святого Якова#! доводиться долати в тісноті. З усіх доріг, з кожної долини сюди стікаються потоки прочан і прямують до величного собору в [current_location.Custom('LR_PREP')|l] [current_location.GetName]. Їхні костури стерті до блиску, а плащі вкриті пилом п’ятисот ліг дороги. Дехто плаче. Дехто пройшов босоніж не одну сотню кілометрів.\n\n[target_ruler.GetName] їде на чолі почту, але спішується, щойно на видноколі показуються вежі собору. Найкраще буде пройти останню ділянку дороги пішки. Вітер розносить гучний хор паломницького гімну: #italic «Ультрея! Ультрея!»#! — і здається, ніби саме каміння бруківки вторить цьому заклику."
  pilgrimage_expedition_events.3.a: "Віддаймо подяку могилі Святого Якова."
  pilgrimage_expedition_events.3.b: "Проголосімо це знаком того, що Господу вгодне наше правління."
  pilgrimage_expedition_events.3.c: "Знаменний день. Але нам час повертатися до [ROOT.GetCountry.Custom('rank_ua_ACC')|l]."
  pilgrimage_expedition_events.3.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.3.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.3.historical_info: "Культ святого апостола Якова в Сантьяго-де-Компостела зародився в IX столітті, коли в Галісії було виявлено мощі апостола Якова, і король Астурії Альфонсо II заклав собор, щоб їх там зберігати. Незабаром туди почали сходитися прочани, і #italic Каміно-де-Сантьяго#!, або шлях Святого Якова, став поряд із Римом та Єрусалимом одним із трьох великих місць паломництва середньовічних християн. До XII століття вздовж шляху постали численні лікарні, монастирі та церкви, цією дорогою йшли пілігрими з усіх куточків Європи. Відвідання Сантьяго давало прочанину право на отримання свідоцтва «Компостела» та повну індульгенцію."
  pilgrimage_expedition_events.4.title: "Рака Трьох Волхвів"
  pilgrimage_expedition_events.4.desc: "[current_location.GetName] — це [current_location.GetRank.GetName|l] риштувань та кранів. Величний собор будується вже майже два століття: його вежі з кожним роком здіймаються все вище, та завершення будівництва не застануть навіть наші майбутні нащадки. Проте й недобудована споруда вражає неймовірним розмахом: свідки кажуть, що це найбільший храм у світі.\n\nУ південному трансепті, за вівтарем, що сяє сухозлітним золотом і освітлений полум’ям свічок, спочиває Рака Трьох Волхвів — золотий ковчег із мощами мудреців, які йшли за зорею до Вифлеєма. [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'чула', 'чув')] про це святе місце з самого дитинства. Та на власні очі ця споруда однаково приголомшує до глибини душі."
  pilgrimage_expedition_events.4.a: "Схилімо коліна й помолімося перед Ракою Трьох Волхвів."
  pilgrimage_expedition_events.4.b: "Зробімо щедру пожертву на будівництво собору."
  pilgrimage_expedition_events.4.c: "Помолімося — і в дорогу."
  pilgrimage_expedition_events.4.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.4.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.4.historical_info: "Рака Трьох Волхвів у Кельні — це найбільший релікварій у західному світі та місце спочинку біблійних мудреців, які прийшли до немовляти Ісуса. Ці святині були захоплені імператором Священної Римської імперії Фрідріхом Барбароссою після взяття Мілана в 1164 році та подаровані архієпископу Кельнському Райнальду фон Дасселю. Мощі перетворили Кельн на один із найважливіших осередків паломництва Північної Європи. Спеціально для них у 1248 році тут заклали величний готичний собор, будівництво якого завершилося лише в 1880 році. Зв’язок волхвів із королівською владою та святом Богоявлення зробив їхній культ особливо значущим для світських правителів, які шукали божественного заступництва."
  pilgrimage_expedition_events.5.title: "Собор Шартрської Богоматері"
  pilgrimage_expedition_events.5.desc: "Кажуть, вітражі собору в #L #TOOLTIP:LOCATIONRANK,[current_location.Custom('LR_tt')],X [current_location.Custom('LR_PREP')|l]#!#! неможливо описати словами — їх слід побачити на власні очі. [target_ruler.GetName] стоїть у наві та розуміє чому. Собор залитий сяйливим синім світлом, яке заломилося в тисячі барвистих шибок і перетворилося на щось неземне. Воно падає на кам’яну підлогу тремтливими кольоровими променями, лягає на обличчя схилених навколішки прочан і осяває стародавню святиню в золотому ковчезі за головним вівтарем.\n\nЦе частина Плата Богородиці, який, за переказами, був на ній у мить Благовіщення. Ця святиня приваблює сюди вірян із часів Карла Великого. [target_ruler.GetNameWithNoTooltip] стоїть непорушно, відчуваючи несподіване й глибоке хвилювання."
  pilgrimage_expedition_events.5.a: "Схилімося перед #italic Платом#! і помолімося Богородиці."
  pilgrimage_expedition_events.5.b: "Краса цього місця схиляє до роздумів."
  pilgrimage_expedition_events.5.c: "Гарний собор. Але на нас чекають удома."
  pilgrimage_expedition_events.5.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.5.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.5.historical_info: "Собор Шартрської Богоматері — один із найвеличніших шедеврів французької готичної архітектури, що слугував місцем паломництва з часів раннього Середньовіччя. Його головна святиня, Плат Богородиці, — це полотно, яке, за переказами, було на Діві Марії під час Благовіщення. Його передав собору Карл Великий, і реліквія дивом уціліла у страшній пожежі 1194 року, що знищила попередню романську споруду. Храм відбудували довкола врятованої реліквії з неймовірною швидкістю, і нині його західна троянда та стрілчасті вікна, датовані приблизно 1220 роком, вважаються одними з найвідоміших зразків середньовічного вітражного мистецтва у світі. Завдяки Плату Богородиці Шартр став одним із головних осередків Марійського паломництва в Європі."
  pilgrimage_expedition_events.6.title: "Гробниця мученика"
  pilgrimage_expedition_events.6.desc: "[current_location.GetRank.GetNameWithNoTooltip] [current_location.GetName] примостився в пологій долині серед зелених просторів #L [ShowCultureName('english')|l]ої#! провінції, а вежі його собору здалеку видно подорожньому, що прямує до них. Це [current_location.GetRank.GetName|l] паломників: його заїзди переповнені, людям доводиться тіснитися в коморах та внутрішніх подвір’ях, а шляхи забиті юрбами, що розмовляють десятком різних мов. І всі вони прямують до одного й того самого місця.\n\nГробниця святого Томаса Бекета розташована в каплиці Святої Трійці за головним вівтарем. Колись це була найрозкішніше оздоблена усипальниця в усьому регіоні [ShowScriptedGeographyName('england_geography')]: дорогоцінне каміння, золото, обітні дари всіх мастей. [target_ruler.GetName] завмирає перед нею. На цьому місці людина загинула за те, що насмілилася піти проти короля. Тут же ця непокора обернулася святістю. Тут є над чим замислитися — як до цієї історії не стався."
  pilgrimage_expedition_events.6.a: "Поставмо свічку та помолімося біля гробниці Бекета."
  pilgrimage_expedition_events.6.b: "Замовмо месу за упокій душ вірян."
  pilgrimage_expedition_events.6.c: "Цьому святому молилося багато правителів. Краще поїдьмо додому."
  pilgrimage_expedition_events.6.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.6.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.6.historical_info: "Архієпископ Кентерберійський Томас Бекет був убитий 29 грудня 1170 року у власному соборі лицарями, які діяли за мовчазною згодою короля Англії Генріха II. Його загибель приголомшила весь християнський світ, і його канонізували лише через три роки, у 1173 році. Генріх II був змушений привселюдно покаятися біля гробниці Бекета, а сама усипальниця швидко стала найвідвідуванішим місцем паломництва в Англії — про неї писав у своїх «Кентерберійських оповіданнях» Джеффрі Чосер. За два століття гробниця була прикрашена неймовірною збіркою дорогоцінного каміння та золота, пожертвуваних паломниками: серед них був і велетенський самоцвіт, подарований королем Людовиком VII. У 1538 році Генріх VIII наказав знищити усипальницю, а всі її скарби конфіскувати на користь корони."
  pilgrimage_expedition_events.7.title: "Катедра Святого Патрика"
  pilgrimage_expedition_events.7.desc: "[current_location.GetRank.GetNameWithNoTooltip] [current_location.GetName] розташовується на пологому пагорбі в Північній #TOOLTIP:REGION,ireland_region,X $tt_op_L$Ірландії$tt_cl_2$, а два місцеві собори височіють над навколишніми нивами на багато миль довкола. За розмірами це, звісно, не [ShowLocationName('rome')] і не [ShowLocationName('jerusalem')], але місцева прадавня історія анітрохи не менш визначна. Перед нами найстаріша #TOOLTIP:RELIGIONGROUP,christian,X #L християнська#!#! громада в Ірландії — єпископську катедру тут заснував святий Патрик, коли прибув на острів для навернення місцевих жителів у віру.\n\n[target_ruler.GetName] прибуває рано-вранці, коли пагорби ще оповиті туманом. Канонік собору зустрічає посольство біля брами й проводжає його до місця, де, за переказами, молився сам Патрик. Це святе місце дивує своєю скромністю, але розкіш була б йому не до лиця."
  pilgrimage_expedition_events.7.a: "Відвідаймо месу в соборі Святого Патрика."
  pilgrimage_expedition_events.7.b: "Залишмо пожертву біля каплиці Святого Патрика."
  pilgrimage_expedition_events.7.c: "Ми відвідали це місце з благою метою. Настав час повертатися додому."
  pilgrimage_expedition_events.7.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.7.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.7.historical_info: "Арма споконвіку вважається духовною столицею Ірландії. Цей статус закріпився за містом завдяки його зв’язку зі святим Патриком, який, за переказами, заснував тут свою головну церкву близько 445 року нашої ери. Арманська катедра стала архієпископським престолом примаса Ірландської церкви — за це становище згодом змагалися католицький і протестантський собори, які й досі вінчають два пагорби цього міста. На тлі Реформації значення Арми було однаковою мірою символічним (адже це був храм апостола, що навернув усю Ірландію) та політичним. Тому це місто мало велику цінність для правителів, які прагнули засвідчити благочестя або солідарність з Ірландською церквою."
  pilgrimage_expedition_events.8.title: "Святилище біля дороги"
  pilgrimage_expedition_events.8.desc: "[target_ruler.GetName] прибуває у [current_location.Custom('LR_ACC')|l] [current_location.GetName] — ще одну подорожню обитель на довгому шляху благочестя. Хоч би яка святиня чи пам’ять про святість привабила до цього місця перших прочан, вони продовжують сходитися сюди покоління за поколінням, навіть коли більшість подорожніх на цьому шляху вже забула подробиці її історії.\n\n[target_ruler.GetName] завмирає посеред інших мандрівників, таких самих виснажених і вкритих дорожнім пилом, як і [Select_CString(target_ruler.IsFemale, 'її', 'його')] власний почет, та підносить подяку за щасливе подолання цієї частини шляху."
  pilgrimage_expedition_events.8.a: "Складімо подяку за безпечну подорож."
  pilgrimage_expedition_events.8.b: "Залишмо дари майбутнім паломникам."
  pilgrimage_expedition_events.8.c: "У цьому святому місці ми побували. Пора повертатися додому."
  pilgrimage_expedition_events.8.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.8.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.9.title: "Паломництво обертається скорботою"
  pilgrimage_expedition_events.9.desc: "[target_leader.GetName] [Select_CString(target_ruler.IsFemale, 'померла', 'помер')] в дорозі, і [Select_CString(target_ruler.IsFemale, 'її', 'його')] паломництво залишиться незавершеним. Звістки про втрату дійдуть до #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! нескоро: їх принесуть додому вірні слуги, які до останнього подиху залишалися біля [Select_CString(target_ruler.IsFemale, 'своєї правительки', 'свого правителя')]."
  pilgrimage_expedition_events.9.a: "Нас спіткала непоправна втрата."
  pilgrimage_expedition_events.17.title: "Паломництво облишено"
  pilgrimage_expedition_events.17.desc: "[target_leader.GetName] повертає додому з невиконаною обітницею: паломництво облишено, так і не досягши мети. Звістки про порушену клятву дійдуть до #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! раніше за самого правителя, і [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] буд[ROOT.GetCountry.Custom('clergy_eut')] пам’ятати про це ще довго після того, як ущухнуть пересуди при дворі."
  pilgrimage_expedition_events.17.a: "Ми повертаємося зі соромом, зрадивши нашу клятву Господу."
  pilgrimage_expedition_events.10.title: "Ассізький бідняк"
  pilgrimage_expedition_events.10.desc: "[target_ruler.GetName] долає останній пагорб на шляху до [current_location.Custom('LR_DAT')|l] [current_location.GetName], і перед [Select_CString(target_ruler.IsFemale, 'її', 'його')] поглядом постає велична базиліка. Два її яруси з блідого каменю, вбудовані просто у схил пагорба, були зведені з дивовижною швидкістю після упокоєння чоловіка, на чию честь освячено цей храм, — жебрака, який не мав нічого, а тепер володарює в одній з найпишніших церков Італії.\n\nУ нижній церкві, висіченій у скелі крипті, спочиває сам Франциск Ассізький. [target_ruler.GetName] опускається на коліна перед гробницею людини, яка проміняла шовк і золото на мотузяний пояс та босі ноги, а також, за переказами, проповідувала птахам і приручила вовка. Суперечність між убогістю святого і зведеною на його пам’ять пишнотою не лишається [Select_CString(target_ruler.IsFemale, 'нею', 'ним')] непоміченою."
  pilgrimage_expedition_events.10.a: "Смиренно схилімо коліна, як зробив би сам Франциск."
  pilgrimage_expedition_events.10.b: "Подаймо милостиню вбогим біля входу, наслідуючи самого святого."
  pilgrimage_expedition_events.10.c: "Ми віддали шану. Час додому."
  pilgrimage_expedition_events.10.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.10.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.10.historical_info: "Франциск Ассізький (1181/2 — 1226) зрікся багатства своєї родини заради життя в злиднях. Він заснував орден францисканців на засадах смирення, мандрівного проповідування та служіння бідним і недужим. Франциск був канонізований папою Григорієм IX у 1228 році, лише через два роки після свого упокоєння, що стало одним із найшвидших зарахувань до лику святих у середньовічній історії. Зведення базиліки Святого Франциска розпочалося того самого року і здебільшого завершилося до 1253 року; пізніше її нижню та верхню церкви прикрасили фресками, авторами яких вважають Чімабуе та Джотто. Попри те, що сам святий відкидав матеріальні блага, Ассізі став одним із головних осередків паломництва в католицькій Європі, що приваблював як правителів, так і простих прочан."
  pilgrimage_expedition_events.11.title: "Святий покровитель моряків"
  pilgrimage_expedition_events.11.desc: "[current_location.GetRank.GetNameWithNoTooltip] [current_location.GetName] починає пахнути морем задовго до того, як [target_ruler.GetName] дістається його мурів. Це портовий [current_location.GetRank.GetName|l], збудований довкола одного-єдиного великого скарбу. Під романськими склепіннями базиліки спочиває гробниця Миколая Мирлікійського, перенесена сюди місцевими моряками понад сто років тому зі зруйнованих святинь християнського Сходу, що вже не міг їх захистити.\n\nРаз на рік гробницю відкривають і збирають прозоре миро, яке виточують мощі святого, — #italic манну#!. У його цілющу силу однаково вірять як #TOOLTIP:RELIGION,$catholic_tt$,X $tt_op_L$католики$tt_cl_2$, так і #TOOLTIP:RELIGION,$orthodox_tt$,X $tt_op_L$православні$tt_cl_2$. [target_ruler.GetName] розглядає ковчег із цією святинею, і [Select_CString(target_ruler.IsFemale, 'її', 'його')] вражає думка: жодне інше святе місце на всьому паломницькому шляху не вшановується настільки одностайно обома гілками християнського світу водночас."
  pilgrimage_expedition_events.11.a: "Вшануймо усипальницю та отримаймо посудину зі святою манною."
  pilgrimage_expedition_events.11.b: "Замовмо месу за моряків, які повернули святого додому."
  pilgrimage_expedition_events.11.c: "Святий нас благословив. Тепер ми повертаємося додому."
  pilgrimage_expedition_events.11.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.11.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.11.historical_info: "У 1087 році шістдесят два моряки з Барі відпливли до Мир Лікійських, які тоді перебували під загрозою сельджуцького завоювання, і вивезли мощі святого Миколая, рятуючи їх від можливої втрати чи знищення. Реліквії прибули до Барі 9 травня 1087 року — ця подія і донині святкується як перенесення мощей, — і для їхнього зберігання була зведена базиліка Святого Миколая, крипту якої у 1089 році освятили в присутності папи Урбана II. З миті прибуття реліквій довкола кісток продовжувала утворюватися прозора рідина, яку віряни називають #italic манною#!; архієпископ Барі збирає її раз на рік. Будучи покровителем моряків, купців і дітей, а також одним із небагатьох святих, шанованих з однаковим благоговінням як у католицькому, так і в православному світі, Миколай перетворив Барі на осередок паломництва, що не мав собі рівних у всій Італії."
  pilgrimage_expedition_events.12.title: "Ангельське освячення"
  pilgrimage_expedition_events.12.desc: "Бенедиктинське абатство у [current_location.Custom('LR_PREP')|l] [current_location.GetName] примостилося на узліссі дрімучого лісу у верхів’ях #TOOLTIP:CULTUREGROUP,swiss_group,X #L швейцарських#!#! земель. Його зодягнені в чорні ряси ченці ведуть свій лік від мовчазного самітника, по-звірячому вбитого тут розбійниками багато поколінь тому. [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'чула', 'чув')] цей переказ ще в дитинстві: тутешня каплиця була освячена не єпископською рукою, а самим Христом, який зійшов сюди разом із хором ангелів і святих напередодні дня її урочистого відкриття.\n\nУ каплиці Богоматері височіє предмет того самого першого, оскаржуваного освячення — невелика статуя Діви Марії, що потемніла від багатовікової кіптяви церковних свічок до глибокого чорного кольору. Прочани з усіх німецькомовних земель схиляються перед нею в незбагненній для уяви нескінченній вервечці."
  pilgrimage_expedition_events.12.a: "Схилімо коліна перед Чорною Мадонною в мовчазній молитві."
  pilgrimage_expedition_events.12.b: "Складімо пожертву славетній бібліотеці та писарні абатства."
  pilgrimage_expedition_events.12.c: "Годі з нас цих темних лісів. Ходімо далі."
  pilgrimage_expedition_events.12.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.12.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.12.historical_info: "Абатство Айнзідельн веде свій лік від самітника Майнрада, який оселився в цьому лісі та був убитий розбійниками у 861 році. Офіційний монастир заснував на цьому місці в 934 році чернець Ебергард. Згідно зі старовинним переказом, тутешня каплиця була дивовижним чином освячена самим Христом у ніч проти 14 вересня 948 року — це твердження згодом офіційно визнав папа Лев VIII. Місцева статуя Чорної Мадонни впродовж століть приваблює паломників: завдяки їй Айнзідельн став одним із найвідвідуваніших осередків ушанування Богородиці в усьому німецькомовному світі."
  pilgrimage_expedition_events.13.title: "Ясна гора"
  pilgrimage_expedition_events.13.desc: "#italic Ясна Гора#! з’являється над рівниною задовго до того, як [target_ruler.GetName] дістається монастирської брами; її білі мури купаються в сонячному промінні — саме такого враження і домагалися ченці-пауліни, які її звели. Всередині, за стіною з обітного срібла та палаючих свічок, спочиває образ Темноликої Мадонни, що перетворив цей скромний #TOOLTIP:CULTUREGROUP,polish_group,X #L польський#!#! [current_location.GetRank.GetName|l] на осередок тяжіння для паломників з усієї півночі.\n\n[target_ruler.GetName] уважно вдивляється в лик Богоматері й помічає їх: два паралельні шрами на її правій щоці — давні рани, які так і не змогла цілком згладити жодна відбудова. Колись давно клинок грабіжника розітнув ікону, і ченці, які згодом намагалися переписати святиню, раз у раз виявляли, що порізи проступають крізь свіжу фарбу, аж доки врешті не облишили спроб приховати скоєне."
  pilgrimage_expedition_events.13.a: "Вшануймо ікону та її невигойні рани."
  pilgrimage_expedition_events.13.b: "Пожертвуймо гроші на укріплення, щоб ніхто більше не зміг пограбувати монастир."
  pilgrimage_expedition_events.13.c: "Побачили Ясну Гору, а тепер час додому."
  pilgrimage_expedition_events.13.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.13.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.13.historical_info: "Паулінський монастир на Ясній Горі був заснований у 1382 році князем Владиславом Опольчиком, який привіз із собою ікону Пресвятої Діви з Дитятком, написану у візантійському стилі, що вже тоді вважалася чудотворною. На Великдень 1430 року загін гуситських нападників із Богемії, Моравії та Сілезії вдерся до монастиря: вони розбили ікону на частини та двічі розтяли лик Богоматері шаблею. Майстри при королівському дворі Владислава II Ягайла в Кракові відновили полотно, однак шрами проступали крізь кожен новий шар фарби, і врешті їх вирішили залишити як невіддільну, навмисну рису зображення. Ченстоховська ікона Божої Матері стала головною марійною святинею Польщі, а її позначений шрамами образ упродовж століть відтворювався на іконах по всьому краю."
  pilgrimage_expedition_events.14.title: "Престол святого Іштвана"
  pilgrimage_expedition_events.14.desc: "[current_location.GetRank.GetNameWithNoTooltip] [current_location.GetName] стоїть біля самого закруту Дунаю; його соборний пагорб височіє над річкою, яка колись позначала межу християнської Європи. Тут, у каплиці, яку відтоді не раз перебудовували, Іштван Святий народився, прийняв хрещення та одного зимового дня на зламі тисячоліть був увінчаний короною як перший християнський король свого народу.\n\n[target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'удостоїлася', 'удостоївся')] прийому в архієпископа [current_location.Custom('LR_GEN')|l] [current_location.GetNameWithNoTooltip], примаса Угорщини та спадкоємця кафедри, заснованої самим Іштваном. Архієпископ оповідає про юного короля, який вибрав хрещення замість давніх богів, звів цей храм ще до того, як заклав свій палац, і був зарахований до лику святих лише через кілька десятиліть по своїй смерті — саме тому, що усвідомлював: християнська корона має спиратися на християнську церкву."
  pilgrimage_expedition_events.14.a: "Вшануймо пам’ять святого Іштвана тихою молитвою."
  pilgrimage_expedition_events.14.b: "Проведімо довгу бесіду з архієпископом-примасом Угорщини."
  pilgrimage_expedition_events.14.c: "Гідний візит для християнського правителя. Час у дорогу."
  pilgrimage_expedition_events.14.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.14.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.14.historical_info: "Іштван I Святий народився близько 975 року в Естергомі та був коронований там у переддень Різдва 1000 року. Ця подія ознаменувала офіційне народження християнського королівства Угорщина. У 1001 році Іштван заснував найстаріше в країні Естергомське архієпископство. Відтоді його архієпископи незмінно носять титул примаса Угорщини. Естергом слугував політичною та духовною столицею королівства аж до середини XIII століття, а канонізація самого Іштвана в 1083 році остаточно закріпила за містом статус духовного осердя угорського християнства."
  pilgrimage_expedition_events.15.title: "Хорватський Назарет"
  pilgrimage_expedition_events.15.desc: "На пагорбі над [current_location.Custom('LR_INST')|l] [current_location.GetName], звідки відкривається краєвид на затоку, стоїть скромна францисканська церква. Вона зведена біля порожнього місця, де, як стверджують тутешні прочани, колись стояло дещо надзвичайне. За їхніми словами, протягом трьох років на цій землі спочивав сам дім Святої Родини, перенесений янголами цілком із Назарета, коли на Святій Землі стало надто небезпечно, а згодом продовжив свою чудесну мандрівку до італійського Лорето.\n\n[target_ruler.GetName] бачить тут ікону, яку папа римський надіслав на розраду місцевим жителям через відбуття святині. Богоматір, що годує немовля Христа, вважається витвором самого апостола Луки. Відтоді цей образ із покоління в покоління приваблює прочан на цей схил пагорба — святилище на честь того, чого тут більше немає, але що якимось чином усе ще незримо присутнє."
  pilgrimage_expedition_events.15.a: "Вклонімося іконі Богоматері Трсатської."
  pilgrimage_expedition_events.15.b: "Замовмо у святилищі біля моря месу за безпечну мандрівку."
  pilgrimage_expedition_events.15.c: "Дім Марії перенісся до Лорето. Перенесімося й ми — додому."
  pilgrimage_expedition_events.15.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.15.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.15.historical_info: "Згідно з переказом, Святий дім із Назарета, оселя Діви Марії, був перенесений янголами на пагорб Трсат над Рієкою 10 травня 1291 року й залишався там упродовж трьох років, після чого 10 грудня 1294 року продовжив свій шлях до італійського Лорето. Князь Нікола I Франкопан звів на місці хижі першу церкву. У 1367 році папа Урбан V на розраду через відбуття Святого дому надіслав до святилища ікону Богоматері з Дитятком, яку за звичаєм приписують пензлю святого Луки. З наступного століття охоронцями цього святого місця стали ченці-францисканці. Легенда закріпила за містом його негласне й вічне прізвисько — Хорватський Назарет."
  pilgrimage_expedition_events.16.title: "Король і мученик"
  pilgrimage_expedition_events.16.desc: "Собор у [current_location.Custom('LR_PREP')|l] [current_location.GetName] виситься суворою та сірою громадою на тлі північного неба. Він зведений просто над піщаною косою, де був похований король Олав Гаральдсон. Трохи більше ніж за рік по його смерті могилу відкрили, і на подив усіх присутніх, його тіло лишилося нетлінним. Переказ свідчить, що його волосся та нігті продовжували рости в темній землі, а з труни, звідки мав би ширитися трупний сморід, линули солодкі пахощі.\n\n[target_ruler.GetName] стоїть перед усипальницею Олава Гаральдсона — колишнього ватажка вікінгів, який поліг у бою, намагаючись силою насадити християнство в королівстві, яке не бажало цього, і якого всього через рік по смерті визнали святим загальним визнанням, без участі далекого папи римського. [target_ruler.GetNameWithNoTooltip] розмірковує про дивну долю цього святого: він здобув святість не лагідною побожністю, а мечем і смертю за справу, яку визнали праведною лише багато років потому."
  pilgrimage_expedition_events.16.a: "Вшануймо нетлінного короля в його усипальниці."
  pilgrimage_expedition_events.16.b: "Олав дав нам урок: насаджувати віру мечем — усе одно праведна справа."
  pilgrimage_expedition_events.16.c: "Яке холодне та святе місце. Вирушаймо додому."
  pilgrimage_expedition_events.16.d: "$pilgrimage_resupply_light$"
  pilgrimage_expedition_events.16.e: "$pilgrimage_resupply_heavy$"
  pilgrimage_expedition_events.16.historical_info: "Король Норвегії Олав Гаральдсон загинув під Стіклестадом 29 липня 1030 року в битві за повернення свого престолу й завершення насильницької християнізації свого королівства. Коли за рік і п’ять днів, 3 серпня 1031 року, його могилу відкрили, єпископ Ґрімкель виявив, що тіло правителя лишилося нетлінним. На підставі лише цього відкриття він проголосив Олава святим — цю місцеву канонізацію згодом офіційно підтвердив папа Александр III у 1164 році. Нідароський собор, зведений над його усипальницею, став головним осередком паломництва на всій півночі, приваблюючи вірян з усієї Скандинавії та інших земель мережею шляхів, які й досі відомі як Стежки святого Олава."
  pilgrimage_expedition_events.18.title: "Гірський перевал"
  pilgrimage_expedition_events.18.desc: "Дорога веде вгору, у безплідні, обдувані вітрами землі, а шлях звужується до стежки на самому схилі гори. [target_ruler.GetName] зупиняється на роздоріжжі. Перший шлях — довгий, в обхід крутого підйому. Другий — прямий, однак місцеві пастухи кажуть, що непідготовлені мандрівники на ньому часто гинуть.\n\n[target_ruler.GetSheHe|U] прикидає, скільки часу піде на подолання гори. Кожен день, згаяний на обхідний шлях, подовжуватиме й без того затяжний перехід."
  pilgrimage_expedition_events.18.a: "Наймімо місцевих провідників, які знають безпечні стежки."
  pilgrimage_expedition_events.18.b: "Ходімо вперед без них, покладаючись на віру та власні сили."
  pilgrimage_expedition_events.18.c: "Повернімо назад і рушаймо довгою дорогою в обхід гори."
  pilgrimage_expedition_events.18.d: "Відіслати відсталих назад з гори напризволяще."
  pilgrimage_expedition_events.19.title: "Морський шторм"
  pilgrimage_expedition_events.19.desc: "Небо зненацька темніє, і вже за годину корабель захльостують велетенські хвилі. [target_ruler.GetName] не встигає намацати опору і з силою вдаряється об щоглу, тим часом як палуба під [Select_CString(target_ruler.IsFemale, 'її', 'його')] ногами здіймається, наче живий звір.\n\nУ трюмі прочани хапаються за все, що міцно прибито, і моляться десятками різних говірок. Їм лишається тільки чекати, доки розлючене море вдовольниться їхніми стражданнями."
  pilgrimage_expedition_events.19.a: "Сховаймося в трюмі та сподіваймося, що корабель витримає."
  pilgrimage_expedition_events.19.b: "Зберімо супутників на палубі й молімося впродовж шторму."
  pilgrimage_expedition_events.19.c: "Полегшити корабель, пересадивши частину почту на човни."
  pilgrimage_expedition_events.19.afloat_tt: "Команді вдається втримати корабель на плаву"
  pilgrimage_expedition_events.19.off_course_tt: "Через шторм корабель значно збивається з курсу"
  pilgrimage_expedition_events.19.faith_protects_tt: "Наша віра допомагає нам пережити шторм"
  pilgrimage_expedition_events.19.piety_lacking_tt: "Нашої побожности замало, щоб утихомирити шторм"
  pilgrimage_expedition_events.20.title: "Переправа"
  pilgrimage_expedition_events.20.desc: "Дорога різко уривається біля річки, яка стала повноводною і каламутною після недавніх дощів. Брід геть зник під бурхливою течією, яка завиграшки звалить і потягне за собою будь-якого коня. З протилежного берега за вами спостерігає поромник. Він не квапиться плисти назустріч, доки не побачить блиску дзвінкої монети.\n\n[target_ruler.GetName] переводить погляд з річки на поромника й назад. Ані те, ані інше сьогодні не викликає особливої довіри."
  pilgrimage_expedition_events.20.a: "Заплатимо поромникові за безпечну переправу."
  pilgrimage_expedition_events.20.b: "Перейдемо річку вбрід і збережемо гроші."
  pilgrimage_expedition_events.20.c: "Відіслати частину почту шукати власну переправу."
  pilgrimage_expedition_events.21.title: "Болотяна лихоманка"
  pilgrimage_expedition_events.21.desc: "Дорога на милі довкола занурюється у стоячу воду, а повітря сповнюється хмарами ґнусу та запахом гниття. За лічені дні звичайний кашель переростає в тяжку лихоманку — і ось уже багатьох хворих доводиться нести на собі, бо йти вони не мають сили.\n\n[target_ruler.GetName] оглядає поріділі лави супутників і запитує себе, скільки з них вирушали в паломництво, а знайшли натомість погибель."
  pilgrimage_expedition_events.21.a: "Поквапимося вперед, щоб скоріше залишити болота позаду."
  pilgrimage_expedition_events.21.b: "Зробимо привал і дамо недужим одужати."
  pilgrimage_expedition_events.22.title: "Зимове бездоріжжя"
  pilgrimage_expedition_events.22.desc: "Перевал попереду завалило сніговими заметами, вищими за людський зріст, і тутешні селяни в один голос твердять: до весни пройти далі не вийде. [target_ruler.GetName] не хоче гаяти цілі місяці через примхи природи, але в гори свої плани.\n\nНеподалік є містечко, де можна розмістити весь загін, якщо [Select_CString(target_ruler.IsFemale, 'її', 'його')] гаманець витримає такі витрати. З іншого боку, за добру плату можна найняти провідників. Вони божаться, що здатні провести мандрівників крізь завірюху навіть у таку пору."
  pilgrimage_expedition_events.22.a: "Перечекаємо зиму в найближчому містечку."
  pilgrimage_expedition_events.22.b: "Наймемо провідників і проб’ємося крізь снігові замети."
  pilgrimage_expedition_events.23.title: "Гостинність лорда"
  pilgrimage_expedition_events.23.desc: "Звістка про наближення паломників рознеслася швидше, ніж рухався сам загін. Тутешній лорд особисто виїжджає назустріч, щоб привітати їх, і [target_ruler.GetName] отримує запрошення розділити з ним трапезу перед продовженням шляху. Гостинність господаря б’є через край — він явно прагне, щоб його щедрість запам’ятали.\n\n[target_ruler.GetName] чудово бачить, що криється за цим запрошенням — змога здобути пошану та побожність, якщо поставитися до нього з усією чемністю."
  pilgrimage_expedition_events.23.a: "З радістю приймемо запрошення."
  pilgrimage_expedition_events.23.a.host_opinion_tt: "[host_lord.GetName] отримує +20 до [Concept('opinion', 'думки')|E] про нас"
  pilgrimage_expedition_events.23.b: "Відхилимо запрошення, віддавши перевагу самітній молитві."
  pilgrimage_expedition_events.24.title: "Плата ворожому лорду"
  pilgrimage_expedition_events.24.desc: "Шлях пролягає через володіння лорда, який вважає #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! одним зі своїх ворогів, і його варта вже вишикувалася в лаву на кордоні біля митної застави. [target_ruler.GetName] марно сподівається безперешкодно пройти цими землями — дорогу загону перегороджують піки.\n\nМитник оголошує плату, яка скидається радше на образу, і вичікувально дивиться на гостей, ніби перевіряючи, чого варта їхня гордість."
  pilgrimage_expedition_events.24.a: "Сплатимо оголошене мито."
  pilgrimage_expedition_events.24.b: "Підемо напролом силами того загону, що в нас є."
  pilgrimage_expedition_events.24.c: "Звернемо вбік і знайдемо довший обхідний шлях."
  pilgrimage_expedition_events.25.title: "Інша віра"
  pilgrimage_expedition_events.25.desc: "Шлях пролягає повз святилище, яке шанують послідовники #L [current_location.GetDominantReligion.GetAdjective|l]ої#! віри, чиї образи та обряди видаються нам чужими. [target_ruler.GetName] спостерігає за місцевими вірянами, які творять молитви, — ті косяться на загін, що проходить повз, із цікавістю й легким недовір’ям.\n\nПаломники мають давній звичай сперечатися про віру з кожним, хто ладен слухати. [target_ruler.GetName] роздумує, чи варто сьогодні піддатися цій спокусі."
  pilgrimage_expedition_events.25.a: "Вступимо з місцевими в суперечку про істинну віру."
  pilgrimage_expedition_events.25.b: "Виявімо обачність і пройдімо повз без зайвого галасу."
  pilgrimage_expedition_events.26.title: "Розбійники на дорозі"
  pilgrimage_expedition_events.26.desc: "На одній із ділянок шляху дорога пірнає в глуху гущавину, де не діє закон жодного лорда, здатний захистити подорожніх. Не встигає загін схаменутися, як із лісової тіні висипають озброєні обідранці. Одразу видно, що для них грабунок — справа звична. [target_ruler.GetName] швидко оцінює їхні сили. Для дрібної ватаги їх, мабуть, забагато, а для справжнього війська — замало.\n\nЇхній ватажок виходить уперед і називає ціну за прохід; суворий голос розбійника красномовно свідчить про те, що чекає на загін у разі відмови."
  pilgrimage_expedition_events.26.a: "Відкупімося від них і покінчімо з цим."
  pilgrimage_expedition_events.26.b: "Приймімо бій і биймося за честь паломництва."
  pilgrimage_expedition_events.26.c: "Купити безпечний прохід, віддавши розбійникам частину почту."
  pilgrimage_expedition_events.27.title: "Ще більше паломників"
  pilgrimage_expedition_events.27.desc: "Поголос про паломництво вінценосної особи випереджає сам загін. Коли [target_ruler.GetName] дістається чергового роздоріжжя, там уже юрмиться вбога вервечка простих прочан, які сподіваються подолати решту шляху під захистом володарської варти.\n\nСеред них чимало родин із дітьми та немічних старих, які навряд чи подужають дорогу самотужки. [target_ruler.GetName] не має змоги годувати таку силу-силенну людей до скону віку, але прогнати їх зараз — означає покинути напризволяще."
  pilgrimage_expedition_events.27.a: "Приймімо стражденних під свій захист."
  pilgrimage_expedition_events.27.b: "Проженімо їх, щоб не баритися в дорозі."
  pilgrimage_expedition_events.29.title: "Корсари біля узбережжя"
  pilgrimage_expedition_events.29.desc: "Низький темний силует корабля ріже обрій, а його весла хижо виблискують на сонці. Він наближається до корабля паломників швидше, ніж личило б будь-якому чесному торговцеві. Задовго до вигуку матроса на щоглі [target_ruler.GetName] впізнає в ньому піратський корабель — а поблизу ані гавані, ані рятівного суходолу, ані живої душі, яка могла б зарадити.\n\n[target_ruler.GetName] скликає на палубу всіх боєздатних людей зі своєї гвардії та ретельно зважує: чи витримають вони натиск, чи простіше віддати корабельне добро без кровопролиття."
  pilgrimage_expedition_events.29.a: "Візьмімося до зброї та даймо відсіч піратам."
  pilgrimage_expedition_events.29.b: "Пожертвуймо припасами й сподіваймося, що цього вистачить."
  pilgrimage_expedition_events.29.c: "Убезпечити корабель, пожертвувавши частиною нашого почту."
  pilgrimage_expedition_events.30.title: "Вимога викупу"
  pilgrimage_expedition_events.30.desc: "Оскільки дорога добряче прорідила почет, [target_ruler.GetName] стає легкою здобиччю — і дехто на шляху це вже запримітив. Не встигла варта вишикувати оборону, як загін оточили озброєні розбійники. Їхній ватажок називає ціну за волю правителя таким же буденним тоном, як купець називає ціну хліба.\n\nСили вочевидь нерівні, і виплутатися з цієї халепи буде непросто."
  pilgrimage_expedition_events.30.a: "Сплатімо потрібний викуп."
  pilgrimage_expedition_events.30.b: "Спробуймо втекти під покровом ночі."
  pilgrimage_expedition_events.28.title: "Порожні засіки"
  pilgrimage_expedition_events.28.desc: "Припаси вичерпалися незабаром після того, як позаду залишилося останнє пристойне містечко. Шлунки гвардійців порожні, а в мішках з-під хліба гуляє вітер. Одразу видно, що [target_ruler.GetName] знає про походи лише з чуток: голоду байдуже до того, наскільки святий ваш шлях.\n\nНа щастя, цей край не зовсім безплідний: поблизу є ниви, сади та сільський ринок. Питання лише в тому, чи переступить загін через власну гордість, щоб витратити дорогоцінні дні та дзвінке золото на харчі."
  pilgrimage_expedition_events.28.a: "Розішлімо людей по околицях на збір припасів."
  pilgrimage_expedition_events.28.b: "Скупімо всі припаси за будь-яку ціну, яку назвуть."
  pilgrimage_expedition_events.28.c: "Вибору немає. Доведеться повернути назад."
  pilgrimage_resupply_light: "Заплатімо місцевим за свіжих коней, харчі та найманих робітників."
  pilgrimage_resupply_heavy: "Не пошкодуймо коштів, щоб повністю поповнити запаси та посилити почет."
  pilgrimage_expedition_events.piety_up_5_tt: "Наше благочестя міцніє (#G +5#! до побожности)"
  pilgrimage_expedition_events.piety_up_8_tt: "Наше благочестя міцніє (#G +8#! до побожности)"
  pilgrimage_expedition_events.piety_up_10_tt: "Наше благочестя міцніє (#G +10#! до побожности)"
  pilgrimage_expedition_events.piety_up_15_tt: "Наше благочестя міцніє (#G +15#! до побожности)"
  pilgrimage_expedition_events.piety_up_20_tt: "Наша побожність міцнішає (#G +20#! до побожности)"
