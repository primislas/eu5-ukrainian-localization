l_russian:
  expedition_succession_events.new_leader_tt: "[target_leader.GetName] перебирає командування виправою"
  expedition_succession_events.morale_down_tt: "The crew's spirits suffer at the loss of their leader"
  expedition_succession_events.1.title: "Нова рука біля мап"
  expedition_succession_events.1.desc: "Word reaches [ROOT.GetCapital.GetName] that the expedition's leader has died. Luckily, among the officers still aboard is a man with enough learning and nerve to read a chart and hold a crew together, and the others have deferred to him since the loss.\n\nHe is confirmed in command, and the expedition sails on under his direction."
  expedition_succession_events.1.a: "Хай буде так. Плавання триває."
  expedition_succession_events.2.title: "Новий капітан-генерал"
  expedition_succession_events.2.desc: "Word reaches [ROOT.GetCapital.GetName] that the fleet's admiral has died. A fleet cannot sail leaderless through these waters, but thankfully one of its officers is one senior and capable enough that the others accept his word as law, and he has already taken the quarterdeck.\n\nHe is confirmed as the fleet's new commander, and the voyage continues under him."
  expedition_succession_events.2.a: "Хай буде так. Флот іде далі."
  expedition_succession_events.3.a: "Справа важливіша за будь-яку окрему людину."
  expedition_succession_events.3.title: "Командування переходить далі"
  expedition_succession_events.generic_new_leader_tt: "[target.GetName] перебирає командування виправою"
  expedition_succession_events.3.desc: "A dispatch carried home by the last returning boat reports that [former_leader.GetName], who led the expedition, has died in the field. The company did not wait for instructions; by the time the letter was sealed the survivors had already settled the question among themselves, as men far from any court tend to do.\n\n[target.GetName] has taken command, and the expedition presses on."