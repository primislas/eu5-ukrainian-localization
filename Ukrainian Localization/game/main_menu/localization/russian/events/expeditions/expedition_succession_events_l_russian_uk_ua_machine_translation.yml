l_russian:
  expedition_succession_events.new_leader_tt: "[target_leader.GetName] очолює виправу"
  expedition_succession_events.morale_down_tt: "Втрата очільника пригнічує дух команди (#R −20#! до духу)"
  expedition_succession_events.1.title: "Новий очільник виправи"
  expedition_succession_events.1.desc: "[ROOT.GetCountry.GetCapital.GetName] [Select_CString(ROOT.GetCountry.GetCapital.IsFemale, 'отримала', 'отримав')] донесення про те, що очільник виправи помер. На щастя, серед старшини на борті є людина, чиїх знань та відваги вистачить, щоб читати морські мапи й тримати лад серед команди. По смерті колишнього очільника виправи решта вже визнала його негласним керманичем подорожі.\n\nКоманда офіційно передає йому оруду, і виправа торує шлях далі під його проводом."
  expedition_succession_events.1.a: "Хай буде так. Подорож триває."
  expedition_succession_events.2.title: "Новий командувач флоту"
  expedition_succession_events.2.desc: "[ROOT.GetCountry.GetCapital.GetName] [Select_CString(ROOT.GetCountry.GetCapital.IsFemale, 'отримала', 'отримав')] донесення про те, що флотоводець помер. А без нього флот не може продовжувати плавання в цих водах. Втім, на щастя, серед старшин знайшовся один досвідчений та здібний офіцер, якому решта беззастережно кориться. Він уже зайняв місце на шханцях.\n\nСтаршини визнають його новим командувачем флоту, і плавання триває під його орудою."
  expedition_succession_events.2.a: "Хай буде так. Флот тримає курс далі."
  expedition_succession_events.generic_new_leader_tt: "[target.GetName] очолює виправу"
  expedition_succession_events.3.title: "Передання оруди"
  expedition_succession_events.3.desc: "Останній човен, що повернувся додому, привіз листа зі звісткою про те, що [former_leader.GetName], [Select_CString(former_leader.IsFemale, 'яка вела', 'який вів')] виправу, [Select_CString(former_leader.IsFemale, 'загинула', 'загинув')] під час подорожі. Команда не чекала подальших наказів. Уцілілі самі вирішили, хто перебере оруду, ще до того, як сургуч застиг на листі. Таке нерідко трапляється з людьми, які опинилися далеко від двору.\n\n[target.GetName] перебирає оруду, а виправа торує шлях далі."
  expedition_succession_events.3.a: "Ця справа важливіша за долю окремої людини."