l_russian:
  expedition_succession_events.new_leader_tt: "[target_leader.GetName] перебирає командування виправою"
  expedition_succession_events.morale_down_tt: "Втрата очільника пригнічує бойовий дух команди"
  expedition_succession_events.1.title: "Нова рука біля мап"
  expedition_succession_events.1.desc: "До столиці [ROOT.GetCapital.GetName] доходить звістка, що очільник виправи загинув. На щастя, серед офіцерів на борту знайшовся чоловік із достатнім хистом та витримкою, щоб розбиратися в мапах і гуртувати команду, тож після втрати решта визнала його за старшого.\n\nЙого затверджено очільником, і виправа рушає далі під його проводом."
  expedition_succession_events.1.a: "Хай буде так. Плавання триває."
  expedition_succession_events.2.title: "Новий капітан-генерал"
  expedition_succession_events.2.desc: "До столиці [ROOT.GetCapital.GetName] доходить звістка, що флотоводець помер. Флот не може ходити цими водами без проводиря, але, на щастя, один із офіцерів настільки досвідчений і шанований, що решта визнає його слово за закон, і він уже зійшов на шканці.\n\nЙого затверджено новим командувачем флоту, і плавання триває під його проводом."
  expedition_succession_events.2.a: "Хай буде так. Флот іде далі."
  expedition_succession_events.3.a: "Справа важливіша за будь-яку окрему людину."
  expedition_succession_events.3.title: "Командування переходить далі"
  expedition_succession_events.generic_new_leader_tt: "[target.GetName] перебирає командування виправою"
  expedition_succession_events.3.desc: "У донесенні, яке привіз останній корабель, повідомляється, що очільник виправи [former_leader.GetName] загинув у поході. Загін не чекав наказів: поки запечатували листа, уцілілі вже владнали справу між собою, як зазвичай і роблять люди, далекі від будь-якого двору.\n\nКомандування перейняв [target.GetName], і виправа рушає далі."