l_russian:
  danish_india_expedition_events.1.title: "Індійський привілейований флот"
  danish_india_expedition_events.1.desc: "Привілей видано, товариство засновано, а кораблі зафрахтовано або споруджено. Невеликий флот із двох чи трьох океанських кораблів вийде з [ROOT.GetCountry.GetAdjective|l]ого порту, вирушить на південь уздовж африканського узбережжя, обігне мис Доброї Надії, перетне #TOOLTIP:REGION,indian_ocean_region,X #L Індійський океан#!#! і спробує здобути торгову концесію на Коромандельському узбережжі південної Індії. Це плавання — перше у своєму роді під [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ими знаменами. Мине щонайменше вісімнадцять місяців, перш ніж надійдуть бодай якісь вістки. Наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] розділився в думках щодо того, великий це задум чи велике безглуздя."
  danish_india_expedition_events.1.a: "Щедро забезпечити флот харчами. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] не повин[ROOT.GetCountry.Custom('crown_ennanoni')] запам’ятатися тим, що посла[ROOT.GetCountry.Custom('crown_vlaloly')] своїх купців на смерть."
  danish_india_expedition_events.1.b: "Скромна підтримка. Привілейоване товариство має власний капітал."
  danish_india_expedition_events.1.historical_info: "Данська Ост-Індійська компанія (#italic Dansk Ostindisk Kompagni#!) отримала королівський привілей від Кристіана IV у 1616 році, а її перша виправа під орудою адмірала Ове Г’єдде відпливла з Копенгагена у 1618 році. Після важкого дворічного плавання, під час якого більша частина команди загинула від цинги та хвороб, виправа досягла Коромандельського узбережжя й домовилася з наяком Танджура про торгову концесію в селі Тарангамбаді (згодом англізованому як Транкебар). Укріплена факторія Дансборг була завершена в 1620 році й залишалася данською, аж поки колонію не продали британцям у 1845 році, що зробило Транкебар одним із найтриваліших європейських поселень в Індії."
  danish_india_expedition_events.2.title: "Мис Бур"
  danish_india_expedition_events.2.desc: "Флот досяг великого мису на південному краї #TOOLTIP:CONTINENT,africa,X #L Африки#!#! — того самого мису, який [ShowCultureName('portuguese')]і влучно назвали Cabo das Tormentas («Мис Бур»). Погода тут навіть улітку така, якої не бачив жоден капітан із #TOOLTIP:REGION,baltic_region,X #L Балтії#!#!: вітер дме з південного заходу з такою силою, що кладе кораблі на борт, а прибій біля підвітряного берега білий, наче сивина старця. Лоцман пропонує стати на кілька днів у Столовій бухті заради прісної води та м’яса від [ShowCultureGroupName('khoisan_group')|l]их скотарів, які пасуть худобу біля узбережжя. Капітани розділилися в думках, чи вартий цей час втрати попутного південного вітру."
  danish_india_expedition_events.2.a: "Зайти в Столову бухту. Прісна вода та яловичина врятують більше людей, ніж коштуватимуть згаяні дні."
  danish_india_expedition_events.2.b: "Обігнути мис на повних вітрилах. Люди питимуть дощову воду, коли піде дощ."
  danish_india_expedition_events.2.historical_info: "Мис Доброї Надії, який уперше обігнув Бартоломеу Діаш у 1488 році, став звичною зупинкою для поповнення запасів на східному шляху з Європи до Індійського океану. Постійне голландське поселення на мисі виникло 1652 року із заснуванням Яном ван Рібеком станції в Столовій бухті, створеної спеціально для постачання водою, свіжою городиною та м’ясом, купленим у місцевих скотарів кой-кої, кораблів Ост-Індійської компанії, що проходили повз. До появи голландського поселення кораблі, що проходили повз, неофіційно заходили до Столової бухти й домовлялися напряму з кой-кої про купівлю корів, овець та солонуватої води з невеликих струмків, що стікають зі Столової гори."
  danish_india_expedition_events.3.title: "[ShowRegionNameWithNoTooltip('swahili_coast_region')]"
  danish_india_expedition_events.3.desc: "Флот прибув до [target_location.Custom('LR_GEN')] [target_location.GetName], головного порту #TOOLTIP:REGION,swahili_coast_region,X #L узбережжя Суахілі#!#!, де торгівлю в #TOOLTIP:REGION,indian_ocean_region,X #L Індійському океані#!#! араби та африканці вели майже тисячу років до того, як народилася бодай одна [ROOT.GetCountry.GetAdjective|l]а душа. Гавань переповнена: [ShowCultureName('omani_culture')|l]і дау, [ShowCultureName('gujarati')|l]і патамари і навіть пошарпаний [ShowCultureName('portuguese')|l]ий хольк, який лагодять на кренуванні. Місцеві лоцмани пропонують провести нас через мусон до Коромандельського узбережжя за плату, яка видається захмарною. Місцеві купці пропонують [ShowGoodsName('ivory')|l], мангрові жердини та [ShowGoodsName('goods_gold')|l] з верхів’їв #TOOLTIP:AREA,zambezi_area,X #L Замбезі#!#! за цінами, які на будь-якому іншому узбережжі здалися б надмірними. [target_country.Custom('GetRulerOrRegentTitle')] пропонує нам теплий прийом і захист на весь час нашого перебування в тамтешніх водах."
  danish_india_expedition_events.3.a: "Найняти [ShowCultureNameWithNoTooltip('swahili_culture')|l]ого лоцмана й дізнатися про мусони від тих, хто ними володіє."
  danish_india_expedition_events.3.b: "Довіритися власним штурманам. Сезонні вітри достатньо описані."
  danish_india_expedition_events.3.historical_info: "Узбережжя Суахілі від Могадішо до Софали було самоорганізованою торговельною мережею майже тисячоліття до того, як сюди масово почали прибувати європейські флотилії. Момбаса, Малінді, Кілва та менші кам’яні прибережні міста перевозили товари Індійським океаном на власних кораблях, користалися послугами власних лоцманів і підкорялися власним султанам. Втручання португальців у цю мережу на початку XVI століття так і не змогло повністю витіснити місцеву торгівлю, і в XVII столітті європейські флотилії, що прямували до Індії, регулярно наймали суахілійських лоцманів для переходу під час південно-західного мусону — домовленість, яка водночас давала суахілійським купецьким домам цінні торгові відомості."
  danish_india_expedition_events.4.title: "[european_power.GetAdjectiveWithNoTooltip]ий рейд біля островів Кабо-Верде"
  danish_india_expedition_events.4.desc: "Флот став на якір біля невеликої [european_power.GetAdjective|l]ої факторії в [target_location.Custom('LR_PREP')] [target_location.GetName]. Фактор — чоловік непевного походження та неабиякої проникливости — веде обачну торгівлю сушеним м’ясом, водою з вулканічних джерел над містом і врожаєм, який у скромних кількостях вирощують на навітряних схилах навколишніх земель. Він пропонує нашим капітанам свою гостинність, свої ціни й відверту думку про те, що будь-який флот, який збирається перетнути #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L Атлантичний океан#!#! без поповнення запасів тут, насправді планує поховати свою команду в морі. Капітани, поміркувавши, не можуть із ним не погодитися."
  danish_india_expedition_events.4.a: "Заплатити за цінами фактора. Загиблий моряк дорожчий за оплачений рахунок."
  danish_india_expedition_events.4.b: "Узяти лише воду. Люди ще якийсь час можуть поїсти сухарів."
  danish_india_expedition_events.4.historical_info: "Острови Кабо-Верде, на які Португалія заявила права в середині XV століття, стали звичною зупинкою для поповнення запасів на довгому атлантичному переході до Ост-Індії та Бразилії. Рібейра-Гранде на острові Сантьягу, заснована близько 1462 року, була першим європейським містом у тропіках і понад століття слугувала осередком португальської трансатлантичної торгівлі невільниками. На той час, коли туди міг зайти данський привілейований флот, місто вже переходило з рук у руки, а його значення як пункту постачання зберігалося для іноземних кораблів, готових платити тому європейському факторові, який керував цим місцем."
  danish_india_expedition_events.5.title: "[ShowAreaNameWithNoTooltip('gold_coast_area')] під [european_power.GetAdjectiveWithNoTooltip|l]ими знаменами"
  danish_india_expedition_events.5.desc: "Флот підійшов до #TOOLTIP:AREA,gold_coast_area,X #L Золотого Берега#!#!, де невелика [european_power.GetAdjective|l]а факторія панує в місцевій торгівлі з глибинними володіннями [ShowCultureName('akan')|l]ого люду, обмінюючи #TOOLTIP:GOODS,goods_gold,X #L золотий#!#! пісок, #TOOLTIP:GOODS,slaves_goods,X #L невільників#!#! та #TOOLTIP:GOODS,ivory,X #L слонову кістку#!#!. Далі вздовж берега видно кілька пінасів інших європейських суперників, але над головним замком на цій широті майорить прапор [european_power.Custom('CL_GEN')]. Місцеві кабосери надіслали вісника із запрошенням наших капітанів на перемови, натякаючи, що в обмін на належну шану з рук у руки може перейти невелика партія золотого піску. Капітани відчувають спокусу, але пам’ятають, що флот прямує до Ост-Індії, а не для торгівлі в Африці."
  danish_india_expedition_events.5.a: "Узяти невелику партію золотого піску. Індія далеко, а покриті витрати — це справжній здобуток."
  danish_india_expedition_events.5.b: "Пройти повз узбережжя без торгівлі. Ми тут не для того, щоб стати сьомим європейським купцем на цьому березі."
  danish_india_expedition_events.5.historical_info: "Золотий Берег (сучасна Гана) був осередком європейської торгівлі із Західною Африкою відтоді, як португальці звели замок Ельміна в 1482 році. До початку XVII століття за узбережжя змагалися з пів десятка європейських держав, а факторії під різними прапорами діяли в межах прямої видимості одна від одної. Торгівля велася через прибережні африканські протодержави фанті та га, які контролювали доступ до внутрішніх золотих копалень аканів та караванів невільників із глибини суходолу."
  danish_india_expedition_events.6.title: "[european_power.GetAdjectiveWithNoTooltip]а цитадель у [target_location.Custom('LR_PREP')] [target_location.GetNameWithNoTooltip]"
  danish_india_expedition_events.6.desc: "Флот піднявся #TOOLTIP:AREA,mozambique_channel_area,X #L Мозамбіцькою протокою#!#! і наблизився до [target_location.Custom('LR_GEN')] [target_location.GetName] — невеликого укріпленого острова, що є оплотом влади #ONCLICK:COUNTRY,[european_power.GetKey] #TOOLTIP:COUNTRY,[european_power.GetKey],X [european_power.Custom('CL_GEN')|L]#!#! на півдні #TOOLTIP:REGION,swahili_coast_region,X #L Суахілійського узбережжя#!#!. Кам’яна фортеця височіє над входом до гавані; ост-індський корабель розвантажується біля митної пристані; великий хольк набирає воду перед плаванням до Індії. Капітан-майор, який закликав наших капітанів засвідчити шану в цитаделі, поводиться ввічливо, насторожено та охоче ділиться вістками. Він питає, під чиїм стягом ми йдемо і куди прямуємо, а його писар ретельно занотовує відповіді. Про нас знатимуть у столиці [european_power.GetCapital.GetName] з найближчим поштовим судном, що прямуватиме додому."
  danish_india_expedition_events.6.a: "Засвідчити шану в цитаделі. Дружній візит обійдеться дешевше, ніж чвари з [european_power.Custom('CL_INST')]."
  danish_india_expedition_events.6.b: "Стати на якір на рейді. Вони можуть переписати нас і звідти, де сидять."
  danish_india_expedition_events.6.historical_info: "Острів Мозамбік, укріплений португальцями з 1507 року, був урядовим осередком Португальської Східної Африки до 1898 року й обов’язковою зупинкою для ост-індських кораблів, що курсували між Лісабоном і Ґоа. Фортеця Сан-Себастьян, добудована в 1583 році, залишається найбільшою збереженою європейською колоніальною спорудою на південь від Сахари. До кінця XVII століття цитадель могла переходити з рук у руки; її вигідне становище на півдні Суахілійського узбережжя робило її природною здобиччю для будь-якої європейської держави, здатної утвердити свою морську міць у західній частині Індійського океану."
  danish_india_expedition_events.14.title: "[danish_fleet.GetAdjectiveWithNoTooltip]ий флот у факторії на Островах Зеленого Мису"
  danish_india_expedition_events.14.desc: "Фактор з нашої станції на #TOOLTIP:AREA,cape_verde_area,X #L Островах Зеленого Мису#!#! доповідає, що [danish_fleet.GetAdjective|l]ий флот — два справних кораблі незнайомої будови під знаменами [danish_fleet.GetAdjectiveWithNoTooltip]ої Ост-Індійської компанії — зайшов учора по воду та харчі. Вони розплатилися щирим сріблом, набрали достатньо припасів, щоб прогодувати команди під час переходу через #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L Атлантичний океан#!#!, і наступного ранку з вітром рушили на південь. Фактор описує [danish_fleet.GetAdjectiveWithNoTooltip|l]ого капітана як тихого, спостережливого й вочевидь добре обізнаного. За його словами, флот прямує до #TOOLTIP:SUBCONTINENT,south_asia,X #L Південної Азії#!#!. Ми ще почуємо про них."
  danish_india_expedition_events.14.a: "Цікавий розвиток подій. Зазначити це в наступному донесенні додому."
  danish_india_expedition_events.15.title: "[danish_fleet.GetAdjectiveWithNoTooltip]ий корабель на Золотому Березі"
  danish_india_expedition_events.15.desc: "Наш фактор на #TOOLTIP:AREA,gold_coast_area,X #L Золотому Березі#!#! доповідає, що [danish_fleet.GetAdjective|l]ий корабель ненадовго кинув якір, виміняв невелику партію #TOOLTIP:GOODS,goods_gold,X #L золотого#!#! піску на ринку місцевого володаря й попрямував далі на схід. Капітан дав зрозуміти, що його флот прямує до Ост-Індії, а не для торгівлі в #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L Атлантичному океані#!#!. Фактор додає з певною тривогою, що [danish_fleet.GetNameWithNoTooltip] напрочуд добре зна[danish_fleet.Custom('end_yeyut')] обриси цього берега як для країни, що не має тут власної факторії."
  danish_india_expedition_events.15.a: "Стежити за ними. [danish_fleet.GetAdjectiveWithNoTooltip]а присутність на цьому узбережжі — це те, на що варто зважити, доки вона не посилилася."
  danish_india_expedition_events.16.title: "[danish_fleet.GetAdjectiveWithNoTooltip]ий флот біля цитаделі Мозамбіку"
  danish_india_expedition_events.16.desc: "Капітан-майор нашої цитаделі на #TOOLTIP:LOCATION,mozambique,X #L Мозамбіку#!#! доповідає про прибуття [danish_fleet.GetAdjective|l]ого спорядженого флоту, який, очевидно, прямує до Коромандельського берега з торговим дорученням. [danish_fleet.GetAdjectiveWithNoTooltip]ий капітан засвідчив шану в цитаделі, прийняв частування, сердечно відповів на запитання й сам обережно дещо розпитав про плавання до #TOOLTIP:SUBCONTINENT,south_asia,X #L Південної Азії#!#!. Він відплив протягом тижня. Капітан-майор відрядив поштове судно з описом цієї зустрічі; ми знатимемо більше, коли воно прибуде."
  danish_india_expedition_events.16.a: "Взяти цей візит до уваги. Новий стяг в Індійському океані — це новина, про яку варто пам’ятати."
  danish_india_expedition_events.7.title: "[target_location.GetNameWithNoTooltip] і мусон"
  danish_india_expedition_events.7.desc: "Флот дістався [target_location.Custom('LR_GEN')] [target_location.GetName] в #TOOLTIP:AREA,oman_sea_zones_area,X #L Оманському морі#!#!, де місцевий правлячий дім нещодавно спорудив власний флот, що кидає виклик судноплавству в #TOOLTIP:REGION,indian_ocean_region,X #L Індійському океані#!#! від Перської затоки до східноафриканського узбережжя. [ShowCultureName('omani_culture')]ий начальник гавані ввічливий, ціни прийнятні, а #TOOLTIP:CULTUREGROUP,arabian_group,X #L арабські#!#! лоцмани, які наймаються для переходу під час мусону, знають Коромандельський берег так само добре, як #TOOLTIP:REGION,baltic_region,X #L балтійський#!#! моряк знає підступи до #TOOLTIP:LOCATION,riga,X #L Риги#!#!. Вони пропонують провести кораблі за платню, що здається надмірною. Втім, капітани після того, що їм довелося пережити в #TOOLTIP:LOCATION,mombasa,X #L Момбасі#!#!, схиляються до того, щоб погодитися."
  danish_india_expedition_events.7.a: "Найняти [ShowCultureNameWithNoTooltip('omani_culture')|l]ого лоцмана. Мусон більш милостивий, коли мапа в надійних руках."
  danish_india_expedition_events.7.b: "Покластися на власних лоцманів і момбаські мапи. Вітер такий, який є."
  danish_india_expedition_events.7.historical_info: "Оманський імамат Ярубідів, заснований у 1624 році, вигнав португальців із Маската у 1650 році та розбудував торгову й піратську імперію в Індійському океані, яка понад століття оскаржувала європейську першість на східноафриканському та перському узбережжях. Оманські лоцмани вважалися найліпшими провідниками під час переходів за мусонів між Африкою, Аравією, Індією та Ост-Індією, і платня за їхні послуги була звичною статтею витрат для європейських флотів, готових визнати, що їхні власні мореплавці не знають Індійського океану так добре, як їм хотілося б."