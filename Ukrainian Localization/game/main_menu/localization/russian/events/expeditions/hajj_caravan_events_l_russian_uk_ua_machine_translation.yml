l_russian:
  hajj_caravan_events.1.title: "Шлях до Мекки"
  hajj_caravan_events.1.desc: "Караван зібрано, молитви виголошено, і починається довгий шлях до [ShowAreaName('hedjaz_area')]. Юрби вишиковуються вздовж вулиць, щоб вирядити нас, — доказ того, що наш дім усе ще шанує заповіти віри. До [ShowLocationName('mecca')] — місяці шляху крізь пустелі й відкриті води, що карають непідготовлених."
  hajj_caravan_events.1.a: "Наш [ROOT.GetCountry.GetGovernment.GetRulerTitle] вирушає в путь і як правитель, і як слуга [ROOT.GetCountry.GetReligion.GetGodName]."
  hajj_caravan_events.1.b: "Добре спорядити караван і зібрати чималий супровід для охорони шляху."
  hajj_caravan_events.1.c: "Подбати, щоб караван мав усе необхідне та надійну охорону, і нести поперед нас #italic махмаль#!."
  hajj_caravan_events.1.historical_info: "Аббасидський халіф Гарун ар-Рашид здійснював прощу з Багдада дев’ять разів за часи свого правління (786–809), навіть долаючи частину шляху пішки на знак благочестя, і його відданість стала взірцем, який побожні правителі прагнули наслідувати багато століть по тому."
  hajj_caravan_events.display_wealth: "Несіть #italic махмаль#! відкрито, щоб усі могли узріти багатство [ROOT.GetCountry.Custom('CL_GEN')]."
  hajj_caravan_events.guards_up_tt: "Охоронний супровід каравану збільшується"
  hajj_caravan_events.guards_down_tt: "Охоронний супровід каравану зменшується"
  hajj_caravan_events.splendor_up_tt: "Пишнота каравану зростає"
  hajj_caravan_events.splendor_down_tt: "Пишнота каравану зменшується"
  hajj_caravan_events.weakened_tt: "Гнаний уперед без перепочинку, караван ослаб перед прийдешніми випробуваннями"
  hajj_caravan_events.recovered_tt: "Перепочивши й напоївши тварин, караван скидає втому"
  hajj_caravan_events.2.title: "Брама [ShowLocationNameWithNoTooltip('mecca')]"
  hajj_caravan_events.2.desc: "[ShowLocationName('jeddah')]. Стародавній порт [jeddah_location.GetRank.GetName|l] пахне [ShowGoodsName('salt')], [ShowGoodsName('incense')] і потом десяти тисяч прочан, які прибули раніше за нас морем. Торговці продають припаси за подвійною ціною, а книжники сперечаються про правильний порядок обрядів. [ShowLocationName('mecca')] вже близько, менш як три дні суходолом, але караван знесилений, а припаси добігають кінця. Можна рушити далі без зупинки чи провести тут день, відпочиваючи й поповнюючи запаси."
  hajj_caravan_events.2.a: "Перепочити тут і ввійти до святого міста зі свіжими силами."
  hajj_caravan_events.2.b: "Ми подолали забагато, щоб зупинятися тепер. Рушити просто до [ShowLocationNameWithNoTooltip('mecca')]."
  hajj_caravan_events.2.c: "$hajj_caravan_events.display_wealth$"
  hajj_caravan_events.2.historical_info: "Халіф Усман ібн Аффан, третій із праведних халіфів (рашидун), у 646 році призначив Джидду офіційним портом прибуття для прочан, що припливають морем, — роль, яку місто зберігає для хаджу й донині."
  hajj_caravan_events.3.title: "Кааба"
  hajj_caravan_events.3.desc: "Перед нами відкривається Заповідна мечеть, а в її серці височіє Кааба — чорна, вкрита покривалом, прадавня, старіша за саму пам’ять. Навколо неї в терплячому русі кружляють тисячі вірян у білому вбранні, що прийшли з усіх земель, де лунає заклик до молитви. Тут султан і пастух убрані однаково. Шлях скінчився. Тепер питання лише в тому, якими прочанами ми постанемо. Те, що буде подаровано тут, відгукнеться на ринках, у мечетях та при дворах мусульманського світу на ціле покоління."
  hajj_caravan_events.3.a: "Щедро роздавати золото. Нехай через нас жоден тутешній паломник не потерпає від голоду."
  hajj_caravan_events.3.b: "Обдарувати мечеті та книжників, які бережуть святе місто."
  hajj_caravan_events.3.c: "Здійснити обряди тихо. Це справа між нами та [ROOT.GetCountry.GetReligion.GetGodName]."
  hajj_caravan_events.3.d: "Наш диван аль-хадж уже подбав про все необхідне. Здійсніть усі обряди сповна."
  hajj_caravan_events.3.e: "Не шкодувати коштів. Нехай караван сяє золотом і шовком на диво всім."
  hajj_caravan_events.3.historical_info: "Найвідомішим в історії хаджем правителя стало паломництво Манси Муси I Малійського 1324 року. Він мандрував у супроводі шістдесяти тисяч людей і віз із собою стільки золота, що роздавав його щедрою рукою на кожній зупинці, — ця проща спричинила десятирічний обвал цін на золото по всій Північній Африці та на Близькому Сході. Його візит до двору єгипетського султана докладно описали арабські хроністи, які відзначили як його надзвичайну щедрість, так і викликане нею господарське потрясіння."
  hajj_caravan_events.4.title: "Місто тисячі мінаретів"
  hajj_caravan_events.4.desc: "[ShowLocationName('cairo')] величезний і старий, і він поглинає караван тієї ж миті, як ми проходимо крізь північну браму — гамір, прянощі, вичинена шкіра, смажене м’ясо. Над дахами височіє велика мечеть Аль-Азгар, чиї книжники вважаються одними з найкращих в усьому [ROOT.GetCountry.GetReligion.GetGroup.GetAdjective] світі. Наш правитель може затриматися тут, щоб повчитися в них, або ж просто поповнити запаси й рушити далі, до [ShowLocationName('mecca')]."
  hajj_caravan_events.4.a: "Провести час із книжниками Аль-Азгара, доки є змога."
  hajj_caravan_events.4.b: "Ми йшли заради [ShowLocationNameWithNoTooltip('mecca')], а не заради [ShowLocationNameWithNoTooltip('cairo')]. Поповнити запаси й іти далі."
  hajj_caravan_events.4.c: "$hajj_caravan_events.display_wealth$"
  hajj_caravan_events.4.historical_info: "Історик і мислитель Ібн Хальдун оселився в Каїрі 1382 року, де викладав в Аль-Азгарі та служив головним малікітським суддею міста. Його слава приваблювала правителів і книжників з усього мусульманського світу, які прагнули послухати його виклади чи отримати його пораду."
  hajj_caravan_events.5.title: "Стара столиця"
  hajj_caravan_events.5.desc: "[ShowLocationName('baghdad')] колись був найвеличнішим містом світу, столицею халіфату, що простягався від [ShowContinentName('atlantic_ocean_continent')] до [ShowSubContinentName('central_asia')], перш ніж монголи спалили його вщент. Те, що лишилося, — це скромніші ринки та менш ревні книжники, проте святині його спочилих праведників досі приваблюють прочан з усього сходу, і наш правитель міг би вшанувати їхню пам’ять тут, перш ніж повернути на південь, до [ShowAreaName('hedjaz_area')]."
  hajj_caravan_events.5.a: "Відвідати святині та розшукати їхніх книжників."
  hajj_caravan_events.5.b: "Вшанувати пам’ять, а потім іти далі."
  hajj_caravan_events.5.c: "$hajj_caravan_events.display_wealth$"
  hajj_caravan_events.5.historical_info: "Зубайда бінт Джафар, дружина аббасидського халіфа Гаруна ар-Рашида, особисто зазнавши лиха в дорозі, власним коштом збудувала Дарб Зубайда — паломницький шлях із колодязями, цистернами та стоянками, що простягався від околиць Багдада до самої Мекки."
  hajj_caravan_events.6.title: "Дамаська зупинка"
  hajj_caravan_events.6.desc: "Сади змінюються мурами [ShowLocationName('damascus')] — одного з найдавніших міст, що стоять і понині, чия Велика мечеть славиться всією громадою вірян. Молитва під її куполом і бесіди з правознавцями, які наповнюють її подвір’я, забрали б у нас дні, яких у нас може й не бути; з таким же успіхом караван міг би напоїти тварин, поповнити припаси й уранці рушити далі."
  hajj_caravan_events.6.a: "Затриматися ненадовго серед мечетей і правознавців."
  hajj_caravan_events.6.b: "Напоїти тварин і рушити на світанку."
  hajj_caravan_events.6.c: "$hajj_caravan_events.display_wealth$"
  hajj_caravan_events.6.historical_info: "У 1550-х роках османський султан Сулейман Пишний звелів збудувати в Дамаску комплекс Теккіє ас-Сулейманія — мечеть, притулок для мандрівників і безкоштовну їдальню, зведені навмисне для того, щоб приймати та забезпечувати тисячі паломників, які збиралися тут щороку перед тим, як караван хаджу вирушав до Мекки."
  hajj_caravan_events.7.title: "Хаджі"
  hajj_caravan_events.7.desc: "Караван повертається додому — зі спустілими припасами та зміненими паломниками. Поголос випередив верблюдів, і юрми збираються, щоби зустріти правителя, який постав перед Каабою й залишився живим, аби розповісти про це. Віднині наш правитель носить титул хаджі — зароблений, а не дарований, і який по праву належить йому."
  hajj_caravan_events.7.a: "Хай знають про це від самої Мекки й назад з ласки, що дарує [ROOT.GetCountry.GetReligion.GetGodName]."
  hajj_caravan_events.7.historical_info: "Аскія Мухаммад Туре з імперії Сонгай здійснив хадж у 1496–1497 роках із почтом у кілька сотень людей і цілим статком у золоті, щоб роздавати його як милостиню в дорозі. У Каїрі аббасидський претендент на халіфат надав йому титул халіфа Судану, і він повернувся додому як аль-Хадж, а це паломництво зміцнило його духовний авторитет серед мусульман Західної Африки."
  hajj_caravan_events.8.title: "Смерть на шляху до Мекки"
  hajj_caravan_events.8.desc: "До каравану доходить звістка, що наш правитель помер у дорозі — далеко від дому й ще далі від Кааби. Без володаря на чолі караван не може продовжувати шлях, як раніше. Він розпадається: одні паломники повертають назад, інші продовжують путь поодинці, щоб завершити обряди, заради яких прийшли."
  hajj_caravan_events.8.a: "Хай змилується [ROOT.GetCountry.GetReligion.GetGodName] над його душею."
  hajj_caravan_events.hire_escorts: "Найняти більше охорони на решту шляху."
  hajj_caravan_events.adorn: "Замовити стяги, шовк та пишні оздоби для каравану й зачекати, доки все буде готове."
  hajj_caravan_events.2.d: "$hajj_caravan_events.adorn$"
  hajj_caravan_events.4.e: "$hajj_caravan_events.adorn$"
  hajj_caravan_events.5.e: "$hajj_caravan_events.adorn$"
  hajj_caravan_events.6.e: "$hajj_caravan_events.adorn$"
  hajj_caravan_events.4.d: "$hajj_caravan_events.hire_escorts$"
  hajj_caravan_events.5.d: "$hajj_caravan_events.hire_escorts$"
  hajj_caravan_events.6.d: "$hajj_caravan_events.hire_escorts$"
  hajj_caravan_events.9.title: "Розбійники на шляху"
  hajj_caravan_events.9.desc: "Із марева спеки з’являються вони — вершники пустелі з піднятими списами, що кружляють навколо колони. Вони бачили, як ми перетинали їхні піски, і вирішили, що караван вартий того, щоб його захопити. Наша варта змикає лави, але бій у відкритій пустелі ніколи не віщує певного успіху."
  hajj_caravan_events.9.a: "Сплатити данину. Срібло дешевше за кров."
  hajj_caravan_events.9.b: "Хай варта відпрацює свій хліб."
  hajj_caravan_events.9.c: "Нагадати їм, що це паломники, які прямують до Мекки під захистом, що дарує [ROOT.GetCountry.GetReligion.GetGodName]."
  hajj_caravan_events.10.title: "Висохлі колодязі"
  hajj_caravan_events.10.desc: "Колодязі попереду порожні — потріскана багнюка на дні, вичерпана до краплі якимось караваном, що пройшов тут за кілька днів до нас. Бурдюки на боках верблюдів уже зовсім легкі, тварини глухо ревуть від спраги, а сонце безжально підіймається все вище. Провідники починають тривожно шепотітися про те, як далеко лежить найближча добра вода."
  hajj_caravan_events.10.a: "Краще повільно, ніж мертво. Звернути до далекого колодязя."
  hajj_caravan_events.10.b: "Наступна вода згодиться. Продовжувати шлях."
  hajj_caravan_events.11.title: "Самум"
  hajj_caravan_events.11.desc: "Обрій забарвлюється в колір іржі, і вітер здіймається до крику. Стіна піску обрушується на колону, і за лічені миті не лишається ні шляху, ні неба, ні вершника попереду — лише колюча темрява."
  hajj_caravan_events.11.a: "Спустити тюки, підняти покривала. Перечекаємо."
  hajj_caravan_events.11.b: "Зв’язати колону мотузками й пробиватися крізь бурю."
  hajj_caravan_events.12.title: "Гарячка в каравані"
  hajj_caravan_events.12.desc: "Усе починається з кількох випадків, але на ранок вона вже в кожному наметі — гарячка, що за лічені дні знесилює навіть найміцніших. Збившись укупі в дорозі, паломники не мають жодної змоги її уникнути."
  hajj_caravan_events.12.a: "Ми зупинимося. Жоден прочанин не помре покинутим."
  hajj_caravan_events.12.b: "Час паломництва не чекатиме на хворих."
  hajj_caravan_events.13.title: "Ціна еміра"
  hajj_caravan_events.13.desc: "Шлях попереду перетинає землі місцевого володаря, і його вершники стали впоперек дороги, уперши списи в землю й зовсім не кваплячись. Його глашатай виходить з посмішкою: є мито на воду, мито на прохід, мито навіть на пісок під нашими ногами — і караван не рушить далі, поки все не буде сплачено. Позаду нас прочани чекають на спеці, дивлячись, з якого тіста зліплений їхній володар."
  hajj_caravan_events.13.a: "Заплатити й покінчити з цим."
  hajj_caravan_events.13.b: "Ми нічого йому не винні. Обійдемо його криниці стороною."
  hajj_caravan_events.13.c: "Нехай емір погляне на наш караван і замислиться, з кого він намірився брати мито."
  hajj_caravan_events.14.title: "Зелений привал"
  hajj_caravan_events.14.desc: "Попереду з пісків здіймаються пальми, а під ними — джерело, довкола якого люди виходять зустрічати прочан із фініками та прохолодною водою. Прихистити подорожніх до священного міста — саме собою діло благочестя, і цей дар даровано від щирого серця."
  hajj_caravan_events.14.a: "Відпочити й удосталь напоїти караван, перш ніж рушити далі."
  hajj_caravan_events.14.b: "Поділитися припасами з біднотою оази."
  hajj_caravan_events.14.c: "Подякувати їм і продовжити шлях."
  hajj_caravan_events.15.title: "Вчені в дорозі"
  hajj_caravan_events.15.desc: "До каравану приєднується гурт мандрівних книжників, що тримають путь до того ж священного міста, а їхні торби обтяжені книгами. Біля вечірніх багать вони до пізньої ночі розмірковують про закон і Писання."
  hajj_caravan_events.15.a: "Сісти серед них і слухати."
  hajj_caravan_events.15.b: "Відповідати доводом на довід."
  hajj_caravan_events.16.title: "Пора минула"
  hajj_caravan_events.16.desc: "Ми прибуваємо надто пізно. Рік змінився, а з ним минуло й стояння на Арафаті — години між полуднем і заходом сонця, коли кожен прочанин цієї пори мав стояти разом з іншими на тій рівнині під Горою Милосердя, молячись і благаючи прощення. Слова Пророка промовляють, що Гадж — це не що інше, як той єдиний полудень; проминеш його, і жоден обряд, здійснений опісля, не зарахується як паломництво. Каравану лишається хіба розійтися й повернутися додому, щоб наступного року розпочати шлях наново."
  hajj_caravan_events.16.a: "Ми забарилися надто довго. Доведеться почати все наново."
  hajj_caravan_events.17.title: "Буря"
  hajj_caravan_events.17.desc: "Небо чорніє, і море здіймається сірими водяними валами. Корабель хитає, снасті пронизливо верещать, і одна хибна хвиля може розтрощити борт або затягнути корабель на дно разом з усіма душами на борту."
  hajj_caravan_events.17.a: "Триматися. Корабельники збудували її на славу."
  hajj_caravan_events.17.b: "Вітрила за вітром і вперед."
  hajj_caravan_events.18.title: "Штиль"
  hajj_caravan_events.18.desc: "Вітер стихає геть чисто. Вітрила безпорадно повисли, море лежить непорушне й гладке, немов викуваний метал, і корабель закляк без руху під безжальним сонцем. З кожним безвітряним днем води стає дедалі менше, а норови людей — дедалі палкішими."
  hajj_caravan_events.18.a: "Чекати. Вітер завжди повертається."
  hajj_caravan_events.18.b: "Спустити шлюпки. Ми не сидітимемо й не гнитимемо."
  hajj_caravan_events.19.title: "Гарячка в трюмі"
  hajj_caravan_events.19.desc: "Хвороба шиpatternться затхлим, важким повітрям нижніх палуб, і за кілька днів недужих стає більше, ніж здорових. Корабель усе ж потребує догляду, а робочих рук із кожним світанком меншає."
  hajj_caravan_events.19.a: "Ідемо до берега. Команді потрібна чиста вода."
  hajj_caravan_events.19.b: "Тримаємо курс і віримо, що люди витримають."
  hajj_caravan_events.20.title: "Морські розбійники"
  hajj_caravan_events.20.desc: "Низька швидка галера розтинає хвилі назустріч флоту, а за нею ще дві — весла виблискують проти сонця. Ані стягів, ані вигуку — лише полиск шабель уздовж бортів та прискорений бій барабанів, що котиться над водою. Морські розбійники — і вони обрали прочан своєю здобиччю. Вартові б'ють на сполох, а в трюмах віряни пригортають до себе клунки та шепочуть молитви."
  hajj_caravan_events.20.a: "Відкупитися й піти."
  hajj_caravan_events.20.b: "Очистити палуби. Прорвемося з боєм."
  hajj_caravan_events.21.title: "Риф"
  hajj_caravan_events.21.desc: "Скреготливий удар струшує весь корпус, і палуба йде з-під ніг — незнаний риф своїми кораловими зубцями пропоров дошки нижче ватерлінії. Морська вода вже клекоче в трюмі, і команда кидається до помп. Корабель пробитий і осідає, але ще не втрачений, а найближча земля — лише тонка зелена смужка на видноколі."
  hajj_caravan_events.21.a: "Витягти флот на берег і доладно його полагодити."
  hajj_caravan_events.21.b: "Залишити команду рятувати корабель. Решта пливе далі."
  hajj_caravan_events.22.title: "Купець у морі"
  hajj_caravan_events.22.desc: "Купецький корабель гукає нас через хвилі, його палуби встелені сувоями шовку та вишуканих тканин із далеких гаваней. Його капітан готовий торгувати за купецькою ціною, але тільки після неспішного торгу."
  hajj_caravan_events.22.a: "Купити найкращу тканину на борту."
  hajj_caravan_events.22.b: "Ніколи торгуватися. Нехай собі пливуть."
  hajj_caravan_events.20.b.chance_tt: "Наша варта може не відбити корсарів, що обернеться втратою вартових і величі замість [prestige|e]"
  hajj_caravan_events.9.b.chance_tt: "Наша варта може не здолати розбійників, що обернеться втратою вартових і пишноти замість [prestige|e]"
  hajj_caravan_events.9.c.chance_tt: "Заклик може не злякати розбійників, що обернеться втратою вартових і пишноти замість [prestige|e] та [legitimacy|e]"
  hajj_caravan_events.guards_down_15_tt: "Охорона каравану меншає (#R -15#! до охорони каравану)"
  hajj_caravan_events.guards_down_20_tt: "Охорона каравану меншає (#R -20#! до охорони каравану)"
  hajj_caravan_events.mahmal_gained_tt: "Тепер караван везе махмаль, що дозволяє виявляти багатство чужоземним володарям у дорозі, хоча його можна втратити від рук розбійників або в бурю"
  hajj_caravan_events.mahmal_lost_tt: "Махмаль утрачено в бурю"
  hajj_caravan_events.splendor_down_10_tt: "Пишнота каравану згасає (#R -10#! до пишноти)"
  hajj_caravan_events.splendor_down_15_tt: "Пишнота каравану згасає (#R -15#! до пишноти)"
  hajj_caravan_events.splendor_down_20_tt: "Пишнота каравану згасає (#R -20#! до пишноти)"
  hajj_caravan_events.splendor_down_25_tt: "Пишнота каравану зменшилася (#R -25#! пишноти)"
  hajj_caravan_events.splendor_up_15_tt: "Пишнота каравану зростає (#G +15#! до пишноти)"
  hajj_caravan_events.splendor_up_20_tt: "Пишнота каравану зростає (#G +20#! до пишноти)"
  hajj_caravan_events.splendor_up_30_tt: "Пишнота каравану зростає (#G +30#! до пишноти)"