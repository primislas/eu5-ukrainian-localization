l_russian:
  hajj_caravan_events.1.title: "Шлях до Мекки"
  hajj_caravan_events.1.desc: "Караван зібрано, молитви прочитано, і починається довгий шлях до Хіджазу. Юрми людей заповнюють вулиці, щоб провести нас, — знак того, що цей рід, як і раніше, виконує обов’язки перед вірою. Мекка лежить за кілька місяців подорожі, за пустелями та морями, нещадними до непідготовлених."
  hajj_caravan_events.1.a: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] вирушає в дорогу водночас як володар і слуга Аллаха."
  hajj_caravan_events.1.b: "Спорядимо караван усім необхідним і зберемо варту на час дороги."
  hajj_caravan_events.1.c: "Спорядимо й захистимо караван, а перед нами понесуть #italic махмал#!."
  hajj_caravan_events.1.historical_info: "За час свого правління (786–809 рр.) аббасидський халіф Харун ар-Рашид дев’ять разів здійснював паломництво з Багдада, причому частину шляху він проходив пішки на знак благоговіння. Його набожність стала взірцем, який упродовж багатьох століть прагнули наслідувати благочестиві правителі."
  hajj_caravan_events.display_wealth: "Понесемо #italic махмал#! відкрито, щоб усі могли побачити багатство [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  hajj_caravan_events.guards_up_tt: "Збройний супровід каравану посилюється (#G +25#! до збройного супроводу)"
  hajj_caravan_events.guards_down_15_tt: "Збройний супровід каравану слабшає (#R -15#! до збройного супроводу)"
  hajj_caravan_events.guards_down_20_tt: "Збройний супровід каравану слабшає (#R -20#! до збройного супроводу)"
  hajj_caravan_events.splendor_up_15_tt: "Розкіш каравану зростає (#G +15#! до розкоші)"
  hajj_caravan_events.splendor_up_20_tt: "Розкіш каравану зростає (#G +20#! до розкоші)"
  hajj_caravan_events.splendor_up_30_tt: "Розкіш каравану зростає (#G +30#! до розкоші)"
  hajj_caravan_events.splendor_down_10_tt: "Розкіш каравану падає (#G -10#! до розкоші)"
  hajj_caravan_events.splendor_down_15_tt: "Розкіш каравану падає (#G -15#! до розкоші)"
  hajj_caravan_events.splendor_down_20_tt: "Розкіш каравану падає (#G -20#! до розкоші)"
  hajj_caravan_events.splendor_down_25_tt: "Розкіш каравану падає (#G -25#! до розкоші)"
  hajj_caravan_events.weakened_tt: "Караван змушений іти без перепочинку, що робить його вразливим перед майбутніми випробуваннями"
  hajj_caravan_events.recovered_tt: "Перепочивши та втамувавши спрагу, караван відновлює сили"
  hajj_caravan_events.mahmal_lost_tt: "Махмал було втрачено під час бурі"
  hajj_caravan_events.mahmal_gained_tt: "Тепер караван несе махмал, що засвідчує багатство чужоземним володарям на шляху, але його можна втратити через розбійників або бурі"
  hajj_caravan_events.2.title: "Брама Мекки"
  hajj_caravan_events.2.desc: "[ShowLocationName('jeddah')]. У повітрі стародавнього портового [jeddah_location.Custom('LR_GEN')|l] змішалися запахи #TOOLTIP:GOODS,salt,X #L солі#!#!, #TOOLTIP:GOODS,incense,X #L пахощів#!#! та поту десяти тисяч паломників, які прибули сюди раніше за нас морем. Торговці навперебій пропонують харчі за подвійними цінами, а книжники сперечаються про правильний порядок обрядів. #TOOLTIP:LOCATION,mecca,X #L Мекка#!#! уже близько, до неї менше ніж три дні ходи суходолом, але караван стомився, а припаси добігають кінця. Ми можемо відразу рушити далі або спершу виділити день на перепочинок і поповнення запасів."
  hajj_caravan_events.2.a: "Перепочиньмо тут і ввійдімо до священного міста зі свіжими силами."
  hajj_caravan_events.2.b: "Ми зайшли надто далеко, щоб зупинятися. Продовжимо шлях до Мекки."
  hajj_caravan_events.2.c: "$hajj_caravan_events.display_wealth$"
  hajj_caravan_events.2.historical_info: "Халіф Усман ібн Аффан, третій із праведних халіфів, у 646 році призначив Джидду офіційним портом для паломників, що прибувають морем. Відтоді місто зберігає цю роль в устрої хаджу."
  hajj_caravan_events.3.title: "Кааба"
  hajj_caravan_events.3.desc: "Перед нами відкривається Велика мечеть, а в її серці височіє Кааба — стародавня, вкрита чорним покривалом, старша за саму пам’ять. Довкола неї неспішно рухаються по колу віряни в білому вбранні: тисячі людей з усіх куточків світу, де лине заклик до молитви. Тут султан і пастух убрані однаково. Шлях скінчився. Лишилося тільки вирішити, якими паломниками ми станемо. Те, що пропонуватиметься тут, ще ціле покоління відлунюватиме на ринках, у мечетях і при дворах мусульманського світу."
  hajj_caravan_events.3.a: "Щедро роздамо золото. Нехай жоден паломник не залишиться тут голодним."
  hajj_caravan_events.3.b: "Пожертвуємо кошти мечетям та вченим, які оберігають священне місто."
  hajj_caravan_events.3.c: "Здійснимо обряди тихо. Нехай це залишиться між нами та Всевишнім."
  hajj_caravan_events.3.d: "[ShowBureaucracyTypeNameWithNoTooltip('diwan_al_hajj_bureaucracy')] забезпечує нас усім необхідним."
  hajj_caravan_events.3.e: "Не пошкодуємо коштів. Прикрасимо караван золотом і шовком."
  hajj_caravan_events.3.historical_info: "Найвідомішим королівським хаджем в історії стало паломництво Манси Муси I з Малі у 1324 році. Він вирушив у дорогу зі світою з шістдесяти тисяч людей і з такою кількістю золота, що міг щедро роздавати його на кожній зупинці, через що ціни на золото в Північній Африці та на Близькому Сході обвалилися і не могли оговтатися близько десяти років. Відвідини Манси Муси двору єгипетського султана докладно описали арабські літописці, які відзначили як його виняткову щедрість, так і спричинені нею господарські потрясіння."
  hajj_caravan_events.4.title: "Місто тисячі мінаретів"
  hajj_caravan_events.4.desc: "#TOOLTIP:LOCATION,cairo,X #L Каїр#!#! величезний і стародавній, він ковтає караван, щойно ми минаємо північну браму: довкола гамір, прянощі, запах дубленої шкіри та смаженого м’яса. Над дахами височіє велика мечеть аль-Азхар, чиї вчені вважаються найкращими в [ROOT.GetCountry.GetReligion.GetGroup.GetAdjective|l]ому світі. Наш правитель міг би затриматися, щоб повчитися в них, або просто поповнити запаси та рушити далі, до Мекки."
  hajj_caravan_events.4.a: "Посидьмо з вченими аль-Азхара, поки є нагода."
  hajj_caravan_events.4.b: "Ми прийшли заради Мекки, а не Каїра. Поповнимо запаси та рушимо далі."
  hajj_caravan_events.4.c: "$hajj_caravan_events.display_wealth$"
  hajj_caravan_events.4.historical_info: "Історик і вчений Ібн Хальдун оселився в Каїрі у 1382 році, де викладав в аль-Азхарі та обіймав посаду головного малікітського судді міста. Його слава приваблювала правителів і вчених з усього мусульманського світу, які прагнули послухати його лекції чи отримати пораду."
  hajj_caravan_events.5.title: "Стара столиця"
  hajj_caravan_events.5.desc: "Багдад колись був найвеличнішим містом світу, столицею халіфату, чиї землі простягалися від Атлантичного океану до #TOOLTIP:SUB_CONTINENT,central_asia,X #L Центральної Азії#!#!, поки монголи не спалили його вщент. Тепер тут тихіше: ринки зменшилися, а вчені вже не такі завзяті, втім гробниці спочилих святих і далі приваблюють паломників з усього сходу, тож наш правитель міг би вшанувати їхню пам’ять, перш ніж повернути на південь, де лежить [ShowAreaName('hedjaz_area')]."
  hajj_caravan_events.5.a: "Відвідаємо святині й розшукаємо місцевих вчених."
  hajj_caravan_events.5.b: "Вшануємо пам’ять і рушимо далі."
  hajj_caravan_events.5.c: "$hajj_caravan_events.display_wealth$"
  hajj_caravan_events.5.historical_info: "Зубайда бінт Джафар, дружина аббасидського халіфа Харуна ар-Рашида, взяла на власний кошт спорудження Дарб-Зубайди, дороги для паломників із криницями, водоймами та заїжджими дворами, що простяглася від околиць Багдада до самої Мекки. Вона зробила це після того, як сама побачила, наскільки важким є цей шлях."
  hajj_caravan_events.6.title: "Дамаський привал"
  hajj_caravan_events.6.desc: "Сади поступаються місцем фортечним мурам #TOOLTIP:LOCATION,damascus,X $tt_op_L$Дамаска$tt_cl_2$, одного з найдавніших міст, збережених донині, а його Велика мечеть відома в усьому мусульманському світі. Молитва під банею мечеті та розмови з правознавцями, що заповнюють її двори, забрали б багато днів, яких ми, можливо, не маємо; караван міг би в цей час напоїти тварин, поповнити запаси та рушити далі до світанку."
  hajj_caravan_events.6.a: "Затримаймося ненадовго серед тутешніх мечетей і правознавців."
  hajj_caravan_events.6.b: "Напоїмо тварин і підемо до світанку."
  hajj_caravan_events.6.c: "$hajj_caravan_events.display_wealth$"
  hajj_caravan_events.6.historical_info: "У 50-х роках XIV століття османський султан Сулейман Пишний наказав збудувати в Дамаску комплекс Теккіє ас-Сулейманія — мечеть, заїжджий двір і громадську їдальню, зведені спеціально для того, щоб розміщувати та годувати тисячі паломників, які збиралися там щороку перед вирушенням хаджського каравану до Мекки."
  hajj_caravan_events.7.title: "Хаджі"
  hajj_caravan_events.7.desc: "Караван повертається додому: його припаси зменшилися, а паломники змінилися. Поголос уже випередив верблюдів, і натовпи сходяться, щоб зустріти правителя, який стояв перед Каабою і повернувся, щоби розповісти про це. З цього дня наш правитель носить титул Хаджі — заслужений, а не дарований, і він залишиться з ним назавжди."
  hajj_caravan_events.7.a: "Хай буде відомо: [ROOT.GetCountry.GetReligion.GetGodName] був до нас милостивим, і ми подолали шлях до Мекки й назад."
  hajj_caravan_events.7.historical_info: "Аскія Мухаммад Туре із Сонгайської імперії здійснив хадж у 1496–1497 роках зі світою в кілька сотень людей і з цілим багатством у золоті, яке він роздавав як милостиню на своєму шляху. У Каїрі аббасидський претендент на халіфат надав йому титул халіфа Судану, і додому він повернувся аль-Хаджі, а його авторитет в ісламі Західної Африки було підтверджено цим паломництвом."
  hajj_caravan_events.8.title: "Смерть на шляху до Мекки"
  hajj_caravan_events.8.desc: "До каравану доходить звістка про смерть нашого правителя в дорозі, далеко від дому і ще далі від Кааби. Без володаря на чолі караван не може продовжувати шлях. Він розпадається: одні прочани повертають назад, інші йдуть далі самотою, щоб звершити обряди, заради яких вирушили."
  hajj_caravan_events.8.a: "Хай змилується [ROOT.GetCountry.GetReligion.GetGodName] над їхніми душами."
  hajj_caravan_events.hire_escorts: "Наймемо більше вартових для подальшого шляху."
  hajj_caravan_events.adorn: "Прикрасимо караван знаменами й шовком, а тоді зачекаємо."
  hajj_caravan_events.2.d: "$hajj_caravan_events.adorn$"
  hajj_caravan_events.4.e: "$hajj_caravan_events.adorn$"
  hajj_caravan_events.5.e: "$hajj_caravan_events.adorn$"
  hajj_caravan_events.6.e: "$hajj_caravan_events.adorn$"
  hajj_caravan_events.4.d: "$hajj_caravan_events.hire_escorts$"
  hajj_caravan_events.5.d: "$hajj_caravan_events.hire_escorts$"
  hajj_caravan_events.6.d: "$hajj_caravan_events.hire_escorts$"
  hajj_caravan_events.9.title: "Розбійники на шляху"
  hajj_caravan_events.9.desc: "З тремтливого марева з’являються пустельні вершники з піднятими списами, які кружляють довкола валки. Вони стежили, як ми долаємо їхні піски, і вирішили, що караван варто захопити. Наша охорона змикає лави, але наслідок бою у відкритій пустелі ніколи не буває визначеним наперед."
  hajj_caravan_events.9.a: "Сплатимо данину. Срібло дешевше за кров."
  hajj_caravan_events.9.b: "Нехай охорона відпрацює свою платню."
  hajj_caravan_events.9.b.chance_tt: "Охорона може не відбити нападників, і замість [Concept('prestige', 'слави')|e] ми втратимо вартових та розкіш."
  hajj_caravan_events.9.c: "Це прочани, що йдуть до Мекки. Їх береже [ROOT.GetCountry.GetReligion.GetGodName]."
  hajj_caravan_events.9.c.chance_tt: "Благання можуть не подіяти, і замість [Concept('prestige', 'слави')|e] та [Concept('legitimacy', 'права на владу')|e] ми втратимо вартових та розкіш."
  hajj_caravan_events.10.title: "Пересохлі колодязі"
  hajj_caravan_events.10.desc: "Колодязі попереду порожні: на їхньому дні лише потрісканий намул, а воду вичерпав до останньої краплі якийсь караван, що пройшов тут за кілька днів до нас. Бурдюки на боках верблюдів уже полегшали, тварини ревуть від спраги, а нещадне сонце підіймається все вище. Провідники починають шепотітися про те, як далеко до наступного доброго джерела."
  hajj_caravan_events.10.a: "Краще затриматися, ніж загинути. Повернемо до далекого колодязя."
  hajj_caravan_events.10.b: "Наступного джерела вистачить. Продовжимо шлях."
  hajj_caravan_events.11.title: "Самум"
  hajj_caravan_events.11.desc: "Обрій забарвлюється у колір іржі, а вітер починає завивати. Стіна піску накочується на валку, і за мить уже не видно ані дороги, ані неба, ані вершника попереду — лише пекуча темрява."
  hajj_caravan_events.11.a: "Скинемо поклажу, затулимо обличчя хустками. Перечекаємо бурю."
  hajj_caravan_events.11.b: "Зв’яжемо валку мотузкою і рушимо крізь бурю."
  hajj_caravan_events.12.title: "Гарячка в каравані"
  hajj_caravan_events.12.desc: "Усе починається з кількох недужих, але до ранку пропасниця вже в кожному наметі: вона за лічені дні виснажує навіть найдужчих. У тісної валки прочан немає жодних сподівань уникнути зарази."
  hajj_caravan_events.12.a: "Зупинимося. Жоден прочанин не помре покинутим."
  hajj_caravan_events.12.b: "Погода не чекатиме на хворих."
  hajj_caravan_events.13.title: "Ціна, яку призначив [toll_owner.GetGovernment.GetRulerTitle]"
  hajj_caravan_events.13.desc: "Дорога попереду перетинає землі місцевого володаря, і його вершники ліниво перегороджують шлях, сидячи в сідлах і вперши списи в землю. Назустріч виходить усміхнений оповісник: за воду належить сплатити мито, за прохід — мито, навіть за пісок під нашими ногами — теж мито, і доки його не сплатять, караван не зрушить з місця. Позаду нас на спеці чекають прочани, дивлячись, чого вартий їхній правитель."
  hajj_caravan_events.13.a: "Сплатимо й покінчимо з цим."
  hajj_caravan_events.13.b: "Ми йому нічого не винні. Об’їдемо його колодязі."
  hajj_caravan_events.13.c: "Нехай [toll_owner.GetGovernment.GetRulerTitle] побачить наш караван і перегляне мито."
  hajj_caravan_events.14.title: "Зелений перепочинок"
  hajj_caravan_events.14.desc: "Попереду з піску здіймаються пальми, під ними б’є джерело, а довкола збираються люди, що виходять назустріч прочанам із фініками та прохолодною водою. Прихистити подорожніх до священного міста — саме собою благочестя, і роблять це безкорисливо."
  hajj_caravan_events.14.a: "Дамо каравану як слід відпочити та напитися, перш ніж рушимо далі."
  hajj_caravan_events.14.b: "Поділимося припасами з біднотою оази."
  hajj_caravan_events.14.c: "Подякуємо їм і продовжимо шлях."
  hajj_caravan_events.15.title: "Книжники на шляху"
  hajj_caravan_events.15.desc: "До каравану приєднується гурт мандрівних книжників із торбами, повними книг, які прямують до того ж священного міста. Вечорами біля багать вони до пізньої ночі розмірковують про право та Писання."
  hajj_caravan_events.15.a: "Присядьмо серед них і послухаймо."
  hajj_caravan_events.15.b: "Влаштуємо з ними дебати."
  hajj_caravan_events.16.title: "Сезон згаяно"
  hajj_caravan_events.16.desc: "Ми прибуваємо занадто пізно. Рік минув, і разом із ним минув і день Арафа — години між полуднем та заходом сонця, коли кожен прочанин сезону мав разом з іншими стояти на тій рівнині біля підніжжя гори Милосердя, молячись і благаючи прощення. За словом Пророка, хадж — це не що інше, як цей єдиний день. Пропустиш його — і жоден обряд, здійснений опісля, не завершить прощі. Каравану лишається тільки розійтися та повернутися додому, а шлях доведеться починати наново наступного року."
  hajj_caravan_events.16.a: "Ми надто довго барилися. Доведеться починати все наново."
  hajj_caravan_events.17.title: "Буря"
  hajj_caravan_events.17.desc: "Небо чорніє, і море здіймається сірими пагорбами. Корабель кидає з боку в бік, такелаж несамовито рипить, і одна лиха хвиля здатна проломити корпус або потягти корабель на дно з усіма на борту."
  hajj_caravan_events.17.a: "Тримаймося міцніше. Корабельники спорудили його на совість."
  hajj_caravan_events.17.b: "Піднімемо вітрила та спробуємо втекти від шторму."
  hajj_caravan_events.18.title: "Штиль"
  hajj_caravan_events.18.desc: "Вітер вщухає. Вітрила мляво обвисли, море стало гладеньким, наче метал, і корабель нерухомо стоїть під нещадним сонцем. Із кожним безвітряним днем води лишається все менше, як і терпцю."
  hajj_caravan_events.18.a: "Зачекаємо. Вітер завжди повертається."
  hajj_caravan_events.18.b: "Спустимо шлюпки. Ми не сидітимемо й не гнитимемо."
  hajj_caravan_events.19.title: "Гарячка в трюмі"
  hajj_caravan_events.19.desc: "Хвороба розповзається душним, затхлим повітрям нижніх палуб, і за кілька днів недужих стає більше, ніж здорових. Корабель, як і раніше, потрібно вести, а робочих рук із кожним днем усе менше."
  hajj_caravan_events.19.a: "Підемо до берега. Команді потрібна чиста вода."
  hajj_caravan_events.19.b: "Триматимемо курс і покладемося на витривалість команди."
  hajj_caravan_events.20.title: "Корсари"
  hajj_caravan_events.20.desc: "Низька швидка галера йде на зближення з флотом, а слідом за нею — ще дві, з веслами, які виблискують на сонці. Ані стягів, ані вигуків — лише виблиски клинків уздовж бортів та дедалі частіший бій барабана, що котиться над водою. Корсари обрали прочан своєю здобиччю. Вартові здіймають тривогу, а під палубою віряни притискають до себе клунки та моляться."
  hajj_caravan_events.20.a: "Відкупимося та продовжимо шлях."
  hajj_caravan_events.20.b: "Розчистимо палуби. Прорвемося крізь них."
  hajj_caravan_events.20.b.chance_tt: "Охорона може не відбити напад корсарів, і замість [Concept('prestige', 'слави')|e] ми втратимо охорону та розкіш"
  hajj_caravan_events.21.title: "Риф"
  hajj_caravan_events.21.desc: "Різке тремтіння пробігає всім корпусом, і палуба йде з-під ніг: не нанесений на мапи риф розтинає кораловими зубцями обшивку нижче ватерлінії. До трюму вже надходить морська вода, і команда кидається до помп. Корабель пробитий і осідає, але ще не втрачений, а найближча земля — лише зелена цятка на обрії."
  hajj_caravan_events.21.a: "Підведемо флот до берега і полагодимо корабель як слід."
  hajj_caravan_events.21.b: "Залишимо частину команди рятувати корабель. Решта попливе далі."
  hajj_caravan_events.22.title: "Купець у морі"
  hajj_caravan_events.22.desc: "Торговий корабель гукає нас: його палуби завалені рулонами шовку та тонких тканин із далеких портів. Капітан ладен торгувати за собівартістю, але тільки після неквапливого торгу."
  hajj_caravan_events.22.a: "Купимо найкращу тканину на борту."
  hajj_caravan_events.22.b: "Ніколи торгуватися. Нехай пливуть далі."