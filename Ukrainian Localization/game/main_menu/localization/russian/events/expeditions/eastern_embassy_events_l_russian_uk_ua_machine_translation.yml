l_russian:
  received_eastern_alliance_embassy: "Отримано посольство з далекого двору"
  eastern_embassy_events.1.title: "Посольство до далеких дворів"
  eastern_embassy_events.1.desc: "Посольство має вирушити до двору, що лежить далеко за звичним небокраєм. Землі між нами утримують володарі, здатні перетнути шлях, на морі чатують флоти, готові захопити вантаж, а володар на іншому кінці світу не має жодних підстав зважати на нашу велич."
  eastern_embassy_events.1.desc.persia: "$eastern_embassy_events.1.desc$ [dest_country.GetName] посідає престол у [dest_city.Custom('LR_PREP')] [dest_city.GetName] — це [desc_country.GetFlavorRank|l], чиїм власним війнам вельми зарадив би другий фронт, який ми можемо пообіцяти. Шлях пролягає через #TOOLTIP:LOCATION,hormuz,X #L Ормуз#!#!, де торгівля #TOOLTIP:REGION,indian_ocean_region,X #L Індійського океану#!#! стикається із [dest_country.GetAdjectiveWithNoTooltip|l]ими суходільними шляхами. Те, як [target_leader.GetName] покаже себе, коли [target_leader.GetHerHim] прийме [dest_country.GetGovernment.GetCourtTitle] правителя [dest_country.Custom('GetRulerOrRegentTitle')|l], визначить, чи приймуть посольство як рівних, чи як дивину."
  eastern_embassy_events.1.desc.ethiopia: "$eastern_embassy_events.1.desc$ [dest_country.GetName] посідає стародавній престол у [dest_city.Custom('LR_PREP')] [dest_city.GetName] — це високогірн[desc_country.Custom('endrank_yiaei')] [desc_country.GetFlavorRank|l], чиєю вірою є [dest_country.GetReligion.GetName|l], і про яке в літописах століттями згадували без жодної певности. Шлях пролягає через #TOOLTIP:LOCATION,alexandria,X #L Александрію#!#!, далі через #TOOLTIP:AREA,red_sea_area,X #L Червоне море#!#! і веде до землі висічених у скелі церков. Мало кому з посольств нашої частини світу взагалі вдавалося дістатися до правителя, що величає себе [dest_country.Custom('GetRulerOrRegentTitle')|l]."
  eastern_embassy_events.1.a: "Скромне посольство з посланців та духовенства, суворе, проте з чітким наміром."
  eastern_embassy_events.1.a.tt: "Позначає посольство як суворе: при дворі призначення вибір спільного пакту надасть «[ShowModifier('eastern_alliance_persia')]» або «[ShowModifier('eastern_alliance_ethiopia')]» залежно від сторони, що приймає"
  eastern_embassy_events.1.b: "Пишне посольство, що везе скарби, [ShowGoodsNameWithNoTooltip('silk')|l] і має пишний церемоніал, аби вшанувати володаря як рівню."
  eastern_embassy_events.1.b.tt: "Позначає посольство як пишне: при дворі призначення вибір піднесення дарів надасть «[ShowModifier('eastern_alliance_persia')]» або «[ShowModifier('eastern_alliance_ethiopia')]», а також принесе надбавки до слави та права на владу"
  eastern_embassy_events.1.c: "Діловита торгова делегація з купцями та скромними дарами."
  eastern_embassy_events.1.c.tt: "Позначає посольство як торгову делегацію: при дворі призначення вибір торгового шляху надасть «[ShowModifier('eastern_route_open')]»"
  eastern_embassy_events.1.historical_info: "Прямі посольства до дворів Персії та Ефіопії були давнім прагненням християнської Європи. Узун-Хасан з Ак-Коюнлу в 1460-х роках відряджав послів до Венеції, шукаючи спільних дій проти османів, а португальські місії дісталися ефіопського двору Лебна Денгеля на початку XVI століття. Відстані були величезними, посольські звичаї зовсім не скидалися на європейські звичаї, а наслідки майже завжди були скромнішими за сподівання обох сторін."
  eastern_embassy_events.2.title: "На роздоріжжі Сходу"
  eastern_embassy_events.2.desc: "Посольство дістається великого перехрестя, де торгом усього світу заправляють уже тисячу років. #TOOLTIP:BUILDING_TYPE,caravanserai,X #L караван-сараї#!#! повні купців, які вже не раз мандрували далі цим шляхом, духовенство, обізнане зі звичаями двору, та вивідачі, готові продати свої відомості за добру ціну. З їхніми знаннями дорога на схід буде значно легшою."
  eastern_embassy_events.2.desc.hormuz: "$eastern_embassy_events.2.desc$ [crossroad_city.GetName] — це осердя східної торгівлі, острівна фортеця, де #TOOLTIP:AREA,persian_gulf_sea_zones_area,X #L Перська затока#!#! виходить до #TOOLTIP:REGION,indian_ocean_region,X #L Індійського океану#!#!. Кожен поважний купець між #TOOLTIP:LOCATION,cairo,X #L Каїром#!#! та #TOOLTIP:LOCATION,goa,X #L Гоа#!#! бодай раз зупинявся в місцевих #TOOLTIP:BUILDING_TYPE,caravanserai,X #L караван-сараях#!#!. Шлях до двору, де править [dest_country.Custom('GetRulerOrRegentTitle')|l], пролягає звідси на північ, через землі, якими на людській пам’яті не проходило жодне західне посольство."
  eastern_embassy_events.2.desc.alexandria: "[crossroad_city.GetName] — великий порт східного Середземномор’я, де перетинаються шляхи прочан, купців та біженців усіх [ShowReligionGroupAdjective('christian')|l]их течій. [ShowCultureName('coptic_culture')]і ченці не раз вирушали на південь до [dest_country.GetAdjective|l]ого високогір’я, і їхні розповіді про цей край достатньо докладні, щоби стати в пригоді війську — якщо заплатити належну ціну."
  eastern_embassy_events.2.a: "Затримайся та слухай. Знання про [dest_country.GetAdjectiveWithNoTooltip|l]ий [dest_country.GetGovernment.GetCourtTitle] варті більше за поспіх."
  eastern_embassy_events.2.a.tt: "Відкриває особливий вибір на аудієнції, що надає «[ShowModifier('eastern_alliance_persia')]» або «[ShowModifier('eastern_alliance_ethiopia')]» разом із «[ShowModifier('eastern_route_open')]»"
  eastern_embassy_events.2.b: "Рушати далі. Наше послання нічого не виграє від зволікання."
  eastern_embassy_events.2.c: "Розшукати в місті одновірців, аби вони допомогли налагодити знайомства."
  eastern_embassy_events.2.historical_info: "Ормуз та Александрія були двома великими осередками обміну відомостями в середньовічному та ранньомодерному світі. За певну суму чужоземне посольство могло довідатися про придворний звичай, поточні чвари між таборами, особисті вподобання правителя та імена урядовців, від яких насправді залежало прийняття послів. Посольства, що прибували без такої підготовки, зазвичай зазнавали невдачі з причин, які не мали жодного стосунку до суті їхніх пропозицій."
  eastern_embassy_events.3.title: "Караван зупиняється"
  eastern_embassy_events.3.desc: "Дорога звужується серед перетятих ярів, і шлях заступають зо два десятки вершників, на добрих конях і добре озброєних. Їхній ватажок вимагає плату за проїзд: [ShowGoodsName('silver')|l], частку запасів посольства або кращих #TOOLTIP:GOODS,horses,X #L коней#!#! на вибір. Тлумач пояснює, що це звичний тут порядок і в такій сплаті немає жодної неслави."
  eastern_embassy_events.3.a: "Сплатити мито та рушати далі без пригод."
  eastern_embassy_events.3.b: "Пробиватися силою зброї. Ми пройшли такий довгий шлях не для того, щоб нас грабували."
  eastern_embassy_events.3.historical_info: "Збирання племенами мита з караванів було звичною господарською основою життя вздовж кожного далекого торгового шляху. Місцевий шейх чи вождь, який тримав під наглядом ущелину або водопій, за звичаєм, давнішим за будь-яку з імперій, через які пролягав шлях, мав право на частку вартости кожного каравану. Відмова платити не захищала від крадіжки; вона лише означала, що караван ставить себе поза місцевими порядками, з усіма вислідними з цього ризиками."
  eastern_embassy_events.4.title: "Аудієнція у [court_city.Custom('LR_PREP')] [court_city.GetNameWithNoTooltip]"
  eastern_embassy_events.4.desc: "Зала у [court_city.Custom('LR_PREP')] [court_city.GetName] зовсім не схожа на жодну тронну залу на Заході. [court_country.Custom('GetRulerOrRegentTitle')] #ONCLICK:COUNTRY,[court_country.GetKey] #TOOLTIP:COUNTRY,[court_country.GetKey],X [court_country.Custom('CL_GEN')|L]#!#!, [shah.GetName], сидить на узвишші над прохачами в оточенні візирів у пишних урядових шатах, писарів, що записують усе [court_country.GetCourtLanguage.GetName|l]им письмом, та послів із десятка дворів, яких Захід офіційно не визнає. [target_leader.GetName] потрапляє до другого рангу чужоземних гостей — саме таке місце розпорядники протоколу відвели для володаря нашої віддалености та ваги."
  eastern_embassy_events.4.a: "Запропонувати союз проти спільних ворогів."
  eastern_embassy_events.4.b: "Піднести дари з усією пишністю, якої вимагає ця нагода."
  eastern_embassy_events.4.c: "Відкрити південний торговий шлях через [crossroad_city.Custom('LR_ACC')] [crossroad_city.GetNameWithNoTooltip], щоб наш крам був у кожному каравані."
  eastern_embassy_events.4.d: "Скористатися тим, що ми дізналися у [crossroad_city.Custom('LR_PREP')] [crossroad_city.GetNameWithNoTooltip] про звичаї цього двору."
  eastern_embassy_events.4.historical_info: "Перські двори пізнього середньовіччя та раннього нового часу, від Ак-Коюнлу до Сефевідів, дотримувалися витонченого церемоніалу, що поєднував монгольські уявлення про всесвітнє володарювання з перською вишуканістю врядування. Чужоземні посольства приймали з підкресленою ґречністю, але розподіляли за суворою ієрархією віддалености та пошани. Спільні дії проти Османської імперії залишалися постійною можливістю, яка майже ніколи не переростала у справжню військову співпрацю, хоча сама загроза таких дій сковувала османську стратегію впродовж усієї цієї доби."
  eastern_embassy_events.5.title: "Прийом у [court_city.Custom('LR_PREP')] [court_city.GetNameWithNoTooltip]"
  eastern_embassy_events.5.desc: "[court_country.GetGovernment.GetCourtTitle] у [court_city.Custom('LR_PREP')] [court_city.GetName] збирається в залі, стіни якої розписані сценами з житій святих та написами [court_country.GetCourtLanguage.GetName|l]им письмом, яке жоден зі священнослужителів посольства не може прочитати. [negus.GetName], [court_country.Custom('GetRulerOrRegentTitle')] [court_country.Custom('CL_GEN')], приймає посольство, сидячи на троні, перенесеному зі старішого палацу, в оточенні #italic абуни#! та #italic деджазмача#! у багряно-золотих шатах. Зв’язок спільної віри є безсумнівним, хоч би якими відмінними були обряди. Посольство зустріли як [ROOT.GetCountry.GetReligion.GetGroup.GetAdjectiveWithNoTooltip|l]е до [court_country.GetReligion.GetGroup.GetAdjectiveWithNoTooltip|l]ого."
  eastern_embassy_events.5.a: "Запропонувати спільний хрестовий похід проти [ShowReligionGroupAdjective('muslim')|l]их держав між нашими землями."
  eastern_embassy_events.5.b: "Піднести дари та реліквії, гідні помазаного [ROOT.GetCountry.GetReligion.GetGroup.GetAdjectiveWithNoTooltip|l]ого короля."
  eastern_embassy_events.5.c: "Домовитися про доступ до торгівлі в Червоному морі, головний крам якої — прянощі, [ShowGoodsNameWithNoTooltip('goods_gold')|l] та [ShowGoodsNameWithNoTooltip('ivory')|l]."
  eastern_embassy_events.5.d: "Скористатися тим, що ми дізналися у [crossroad_city.Custom('LR_PREP')] [crossroad_city.GetNameWithNoTooltip] про звичаї цього двору."
  eastern_embassy_events.5.historical_info: "Християнське королівство Ефіопія зберігало безперервну церковну спадщину з часів пізньої античности, а починаючи з XIV століття європейські прагнення встановити з ним зв’язок живилися легендою про пресвітера Йоана — християнського правителя, союз із яким мав би розтрощити мусульманські держави між Європою та Індією. Португальські посольства нарешті дісталися ефіопського двору в 1493 році та знову під проводом Родрігу де Ліми в 1520 році. Ці взаємини були цілком реальними, проте стратегічні очікування Заходу завжди виявлялися непомірними порівняно з тим, що могла дати будь-яка зі сторін."