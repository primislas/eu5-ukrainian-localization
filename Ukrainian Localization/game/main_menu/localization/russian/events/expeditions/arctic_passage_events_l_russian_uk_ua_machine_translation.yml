l_russian:
  arctic_passage_events.1.title: "У північну пітьму"
  arctic_passage_events.1.desc: "Логіка проста: південні морські шляхи вже добре відомі й звідані. Північний прохід, на схід чи на захід, належатиме тому, хто відкриє його першим. Флот споряджено для виправи у води, які жодна мапа не описує достеменно. Керманичі вивчили все написане про північ, але знайшли дуже мало користи.\n\nЩо відомо: влітку море не замерзає повністю. Що невідомо: скільки з нього придатне для судноплавства і як довго."
  arctic_passage_events.1.a: "Спорядити флот до найгіршого, що може запропонувати північ — кожну діжку вщент, кожен канат замінити."
  arctic_passage_events.1.b: "Міцна команда — найкраща підготовка. Відпливаємо з припливом."
  arctic_passage_events.1.historical_info: "Пошуки північного морського шляху до Азії займали англійських, нідерландських та скандинавських мореплавців протягом усього шістнадцятого століття. Північно-Західний прохід був уперше успішно подоланий лише під час експедиції Руаля Амундсена в 1903–1906 роках; Північно-Східний прохід уперше пройшов Адольф Норденшельд у 1878–1879 роках. Обидва шляхи виявилися комерційно недоцільними порівняно з південними альтернативами, однак ці виправи дали змогу скласти перші докладні мапи Арктики та відкрили хутряний і китобійний промисли на далекій півночі."
  arctic_passage_events.2.title: "Паковий лід"
  arctic_passage_events.2.desc: "Туман розсіюється, відкриваючи стіну пакового льоду, яка простягається від обрію до обрію, кректучи від тертя крижин одна об одну. Лід не суцільний — між крижинами є смуги відкритої води, але вони зміщуються й закриваються без попередження. Три кораблі флоту вже зазнали ушкоджень корпусу від підводних крижиноподібних уламків.\n\nЛюди не зводять очей з [target_leader.GetName]. [target_leader.GetSheHe|U] спостерігає за кригою вже дві доби. Вона, суворо кажучи, не є непрохідною. Але це найближче до непрохідної місцевости з усього, що будь-хто з них бачив."
  arctic_passage_events.2.a: "Пробитися крізь крижини — кожна смуга води стане шляхом, якщо рухатися досить швидко."
  arctic_passage_events.2.b: "[target_leader.GetNameWithNoTooltip] вміє читати кригу. [target_leader.GetSheHe|U] знайде вихід."
  arctic_passage_events.2.c: "Повернути назад. Жоден прохід не вартий втрати флоту."
  arctic_passage_events.2.historical_info: "Паковий лід — морська крига, що відкололася від свого полярного осердя й була занесена на південь — був головною фізичною перешкодою для всього арктичного мореплавства. На відміну від льодовикових щитів, прикріплених до суші, паковий лід постійно зміщується під дією вітру й течій, без попередження відкриваючи й закриваючи смуги води. Мореплавці шістнадцятого століття не мали надійного способу передбачити його рух; найуспішніші виправи покладалися на досвідчених керманичів, які вміли визначати стан криги за кольором води, шумом моря та поведінкою звірів."
  arctic_passage_events.3.title: "Укритий кригою берег"
  arctic_passage_events.3.desc: "[ShowAreaName('greenland_area')] здіймається з моря білою стіною — це не скелясті кручі, а крижані, що тягнуться від самого урізу води до високого плато далеко вгорі. Узбережжя там, що простягається на північ уздовж краю крижаного щита, прохідне лише влітку. Не видно жодних поселень, жодного диму, жодних ознак життя, окрім поодиноких руїн кам’яних споруд, напівзанесених снігом.\n\nКоманда ніколи не бачила подібного берега. Він непридатний для землеробства, для заготовлення лісу, майже ні для чого, окрім як орієнтир. Але це орієнтир, і вони йдуть правильним курсом."
  arctic_passage_events.3.a: "Узяти час на складання мапи узбережжя — ніхто ще не описав цей берег належним чином."
  arctic_passage_events.3.b: "Позначити пеленг і прямувати далі на північ. Тут немає нічого вартого зупинки."
  arctic_passage_events.3.historical_info: "Гренландія була відома скандинавським поселенцям із десятого століття й у п’ятнадцятому та шістнадцятому століттях усе ще номінально перебувала під норвезько-данським суверенітетом. Однак із двох її головних поселень Західне занепало ще до середини чотирнадцятого століття, а зв'язок зі Східним було втрачено менш ніж через сто років після того. Англійські та португальські рибалки зрідка повідомляли, що бачили це узбережжя під час промислу тріски у північно-західній Атлантиці, але систематичні європейські дослідження гренландського берега розпочалися лише з виправ Фробішера у 1570-х роках."
  arctic_passage_events.4.title: "Замерзлий лабіринт"
  arctic_passage_events.4.desc: "Море попереду захаращене кригою — це не рухливий паковий лід, що розступається, а багаторічна стара крига, розламана й знову замерзла в лабіринт торосів та крижин, настільки величезних, що на їх перетин пішли б години. Протоки між ними вузькі й без попередження закінчуються глухими кутами. Три спроби за три дні не відкрили жодного наскрізного проходу.\n\nЦе місце, де північний шлях уривається, якщо він узагалі десь уривається. Керманичі бачать із щогли відкриту воду на заході, що блищить за крижаним полем. Чи до неї година шляху, чи тиждень — ніхто сказати не може."
  arctic_passage_events.4.a: "Пробиватися попри все. Відкриту воду видно, ми дістанемося її."
  arctic_passage_events.4.b: "[target_leader.GetNameWithNoTooltip] бачить смуги води згори. [target_leader.GetSheHe|U] знає шлях крізь кригу."
  arctic_passage_events.4.c: "Жоден корабель, створений людськими руками, не пройде крізь це. Повертаємося додому."
  arctic_passage_events.4.historical_info: "Головною перешкодою Північно-Західного проходу є архіпелаг островів на північ від канадського материка, де зіткнення морської криги з Арктичного басейну утворює постійний багаторічний паковий лід у багатьох протоках. Більшість виправ шістнадцятого століття — Фробішера, Девіса, Гудзона — повернули назад десь у цьому регіоні. Перше успішне подолання цього проходу вимагало корабля, спеціально спроєктованого для льодових умов, і тривало три зимові сезони."
  arctic_passage_events.5.title: "Море на заході"
  arctic_passage_events.5.desc: "Лід розступається, і флот виходить у відкриту воду: велике внутрішнє море, спокійне й холодне, оточене низькими берегами з ялин та скель, що простягаються в усіх напрямках. Це не Тихий океан. Керманичі це знають. Але це відкрита вода на захід від криги, і жоден європейський флот ще не бував тут раніше, принаймні з того, що нам відомо.\n\nТочний обрис віднайденого ними поки невідомий. Чи є ця велика затока проходом до Азії, чи це замкнене водоймище без виходу, покаже подальше плавання. Наразі вони зробили те, що вважалося неможливим."
  arctic_passage_events.5.a: "Накреслити мапу того, що бачимо, і рушати далі. Ми мусимо знати, як далеко простягається це море."
  arctic_passage_events.5.b: "Море знайдено. Цього доказу достатньо, повертаємося."
  arctic_passage_events.5.historical_info: "Гудзонової затоки досяг Генрі Гудзон у 1610–1611 роках під час пошуків Північно-Західного проходу. Гудзон провів зиму, впершись у лід у затоці Джеймс, а навесні його висадила на дезіль бунтівна команда; уцілілі повернулися до Англії з мапами затоки, але без проходу за її межі. Пізніше з'ясувалося, що затока не має західного виходу, однак ця виправа закріпила претензії Англії на цей регіон і відкрила землі, що згодом стали торговельною імперією Компанії Гудзонової затоки."
  arctic_passage_events.8.title: "Край затоки"
  arctic_passage_events.8.desc: "Протягом трьох днів море ставало дедалі вужчим, і тепер зрозуміло, що західного виходу немає. Велика затока замкнена — це не прохід до Азії, а внутрішнє море надзвичайних розмірів, невідоме жодній європейській мапі до цієї виправи. Керманичі склали мапу його східного та західного берегів, а тепер і південного краю.\n\nЦе не те, по що всі вирушали. Але в тому, що знайдено, немає сорому. Море такого розміру, так глибоко в материку, відкриває можливості, які ще ніхто й не починав обчислювати. Команда знає, що здійснила щось велике. Пам'ять про цю затоку переживе кожного з присутніх на борту."
  arctic_passage_events.8.a: "Скласти мапу кожного берега перед поверненням. Нехай ця затока носить наше ім'я."
  arctic_passage_events.8.b: "Розпочати повернення. Ми зайшли далі за будь-кого."
  arctic_passage_events.8.historical_info: "Затока Джеймс, південне продовження Гудзонової затоки, стала місцем, де команда Генрі Гудзона збунтувалася й висадила його на дезіль у 1611 році після суворої зими. Уцілілі повернулися до Англії з мапами, достатніми для визначення обрисів затоки, хоча знадобилися подальші виправи, щоб підтвердити відсутність західного проходу. Компанія Гудзонової затоки, заснована в 1670 році, використовувала затоку як ворота до величезних земель торгівлі хутром у Землі Руперта — одного з найбільших земельних наділів в історії."