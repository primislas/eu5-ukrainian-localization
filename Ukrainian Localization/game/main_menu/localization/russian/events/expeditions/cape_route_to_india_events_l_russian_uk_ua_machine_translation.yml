  cape_route_to_india_events.1.desc: "Our waters have not seen a fleet like this in a generation. Four ships, a hundred and seventy men, enough [ShowGoodsName('salt')], [ShowGoodsName('fish')], and hard biscuit for years — and orders from [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetHerselfHimself] to find the sea road to $india$. Priests bless the hulls. The crowd presses to the water's edge. Some are weeping.\n\n[target_leader.GetName] stands at the prow as the ships clear the bar and meet the open [ShowContinentName('atlantic_ocean_continent')]. Behind [target_leader.GetHerHim], the harbor dwindles to a white smear on a green hill. Before [target_leader.GetHerHim], the ocean extends without boundary in every direction. [target_leader.GetSheHe|U] has done the calculations. [target_leader.GetSheHe|U] knows what the voyage requires. Whether that is enough remains, as always, in the hands of [ROOT.GetCountry.GetReligion.GetGodName]."
  cape_route_to_india_events.2.desc: "Ten volcanic islands rising from a flat and featureless sea: that is the [ShowProvinceDefinitionName('cape_verde_province')] archipelago. The fleet knew to expect them, and still they come as a relief — solid ground after weeks of open ocean. The governor's residence at [ShowLocationName('santiago')] is a modest affair of whitewashed stone. The harbor smells of salt and dried fish and, faintly, of the orchil lichen scraped from the rocks for dye.\n\n[target_leader.GetName] weighs the choice. [ROOT.GetCountry.GetName] has held these islands for decades, but 'held' is a generous word — a small garrison, a few settlers, an annual supply ship. If this route is to mean anything to [ROOT.GetCountry.GetNameWithNoTooltip]'s future, the islands need to be more than a rest stop."
  cape_route_to_india_events.3.desc: "$cape_route_to_india_events.3.desc_common$\n\nA small settlement clings to the western shore. The soil here, the settlers say, is extraordinarily rich. Anything planted grows. A man could make a fortune in sugar on this island, if he had the labor to work it."
  cape_route_to_india_events.3.desc.uninhabited: "$cape_route_to_india_events.3.desc_common$\n\nNo smoke rises from any shore. No boat waits in any cove. The island is empty of people entirely — the fleet's boats are the first to touch this beach. And yet the soil, where the jungle can be cut back, is black and deep and endlessly fertile. A man could make a fortune in sugar on an island like this, if he had the labor to work it — and if the fevers of the equator did not take him first."
  cape_route_to_india_events.4.desc: "The ocean turns brown here. The fleet has been watching it happen for a day — the color bleeding into the sea from the south, tea-colored and thick with silt. Then they see the cause: a river wider than any in [ROOT.GetCountry.GetName], wider than any river any of these men has seen, emptying into the [ShowContinentName('atlantic_ocean_continent')] in a brown torrent that stains the sea for kilometers in every direction.\n\nFrom out of the mangrove fringe, dugout canoes emerge. They are enormous — hollowed from a single trunk, thirty feet long, paddled by a dozen men in perfect unison. The men standing in the bows are not armed. They are watching the fleet with the composed curiosity of people who have never been afraid of strangers."
  cape_route_to_india_events.5.desc: "Every officer on the expedition recognizes it the moment they see it. None of the sailors have seen a harbor like this anywhere along the African coast: a long curved bay sheltered from the south-west by a natural sandspit, deep water close to shore, and behind it a low promontory with commanding views in every direction. The local fishermen call it Loanda — the flat place.\n\n[target_leader.GetName] walks the length of the sandspit in the afternoon light, the bay on one side and the open [ShowContinentName('atlantic_ocean_continent')] on the other. [target_leader.GetSheHe|U] is already thinking about walls. About fresh water. About the number of ships a garrison here could protect — or intercept. A town built here could command the entire southern Atlantic trade."
  cape_route_to_india_events.5.desc.owned: "The fleet stands into a bay it need not be told the worth of: [ShowLocationName('luanda')] already flies [ROOT.GetCountry.GetName]'s colors, its long sandspit sheltering ships that answer to our own crown.\n\n[target_leader.GetName] walks the length of the spit in the afternoon light, the bay on one side and the open [ShowContinentName('atlantic_ocean_continent')] on the other — thinking not of whether to seize this ground, but of how much more it might yet yield. Strengthened further, a town here could command the whole of the southern Atlantic trade."
  cape_route_to_india_events.7.desc: "Nothing in three months of sailing has prepared them for this. The storm arrives without warning, from the south-west, driving before it waves that stand forty feet high. The lead ship disappears into a trough and does not reappear for thirty seconds. Tackle is carried away. Men are knocked from the rigging. [target_leader.GetName] grips the stern rail with both hands and stares at the chaos around [target_leader.GetHerHim], and somewhere in the cacophony of wind and breaking water [target_leader.GetSheHe] understands something: they are through. The Cape — the great southern tip of the African continent, the end of the known world — lies astern.\n\nThe way to $india$ is open."
  cape_route_to_india_events.9.desc: "The harbor at [ShowLocationName('sofala')] is crowded with dhows. These are not the small fishing craft the fleet has grown accustomed to along the southern coast; they are ocean-going vessels from [ShowRegionName('arabia_region')] and [ShowRegionName('persia_region')], laden deep in the water with [ShowGoodsName('ivory')], ebony, and [ShowGoodsName('cloth')]. On the waterfront, merchants are conducting business in [ShowLanguageName('arabic_language')] and in [location.GetDominantCulture.GetLanguage.GetName], a tongue none of the fleet's interpreters can place. Small pinches of gold dust change hands for bolts of Indian cotton.\n\nArab traders who have dominated this port for centuries watch the arrival of the [ROOT.GetCountry.GetAdjective] fleet from beneath the awnings of their warehouses. Their expressions are unreadable but their body language is unmistakable: the appearance of these strangers, with their iron cannon and their crosses painted on their sails, is not a welcome development. The fleet captain makes note of the largest warehouses, the positions of the dhow moorings, the depth of water at the entrance to the bay."
  cape_route_to_india_events.15.desc.owned: "The island rises from the sea as before — a volcanic peak trailing cloud, jungle crowding to the water's edge — but the anchorage below already flies our flag, and the boats that put out to meet the fleet are our own.\n\n[target_leader.GetName] has no need to wonder whether the island is worth the stopping. The question now is only how much more might be made of the foothold [ROOT.GetCountry.GetNameWithNoTooltip] already holds here, astride the [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] trade."
  cape_route_to_india_events.30.desc: "The order is given, and there is no argument on this ship — only relief on some faces and disappointment on others. The bow comes about. Behind them, the unknown coast recedes; ahead, the long familiar road home. No charts of $india$, no holds of [ShowGoodsName('pepper')], no place in the historians' accounts of who first found the sea road east. But the ships are whole, and the crews are alive, and the harbor of home is a certainty rather than a hope.\n\n[target_leader.GetName] watches the horizon astern for a long moment before turning [target_leader.GetHerHis] attention to the tasks of the voyage still ahead of [target_leader.GetHerHim]."
  cape_route_to_india_events.31.desc: "Their captain came ashore with gifts rather than gunners, and the terms were settled over three days of talk: a plot of ground beside the water for their [ShowBuildingTypeName('por_feitoria')], a rent paid into our treasury, our own courts to judge any quarrel between their men and ours, and their fleet to stand between this harbor and our rivals. The timber came out of their holds already cut to measure, and the post was raised in a matter of days.\n\nIt flies the arms of [por_feitoria_builder.GetName] beside our own, and the anchorage below is busier than it has been in a generation. Our grandchildren may yet curse the bargain, but the account today is plain enough: we have powder, cloth, and a friend with cannon, and they have a warehouse and a wharf."