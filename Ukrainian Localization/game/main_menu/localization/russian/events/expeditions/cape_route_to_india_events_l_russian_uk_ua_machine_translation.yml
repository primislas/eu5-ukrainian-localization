l_russian:
  cape_route_to_india_events.1.title: "Флот виходить у море"
  cape_route_to_india_events.1.desc: "Такого флоту наші води не бачили вже ціле покоління. Чотири кораблі, сто сімдесят душ, запаси #TOOLTIP:GOODS,salt,X солі#!, #TOOLTIP:GOODS,fish,X #L риби#!#! та сухарів на кілька років наперед — і наказ правителя! [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] прагне, щоб ми відшукали морський шлях до Індії. Духовенство благословляє кораблі. Натовп тісниться біля самої кромки води. Дехто плаче.\n\n[target_leader.GetName] стоїть на носі корабля, доки судна виходять із гавані в Атлантичний океан. Позаду [Select_CString(target_leader.IsFemale, 'неї', 'нього')] гавань поступово перетворюється на білу цятку на зеленому схилі пагорба. А попереду — безкрайній океан. [Select_CString(target_leader.IsFemale, 'Вона зробила', 'Він зробив')] усі розрахунки. [Select_CString(target_leader.IsFemale, 'Вона', 'Він')] знає, що чекає на нас у цьому плаванні. Але все вирішує лише [ROOT.GetCountry.GetReligion.GetGodName]."
  cape_route_to_india_events.1.a: "Якщо [ROOT.GetCountry.GetReligion.GetGodName|U] змилується, ми повернемося з трюмами, повними прянощів."
  cape_route_to_india_events.1.b: "Помолимося — і враз же рушаймо."
  cape_route_to_india_events.1.historical_info: "Португальська виправа з пошуку морського шляху до Індії стала наслідком майже ста років поступового просування на південь уздовж африканського узбережжя. У 1488 році Бартоломеу Діаш обігнув мис Доброї Надії, довівши, що шлях до Індії можливий. Плавання Васко да Ґами у 1497–1499 роках завершило розпочате — його кораблі повернулися додому з вантажем перцю та прянощів, а вартість виправи окупилася в шістдесят разів. Ця мандрівка докорінно змінила світову торгівлю прянощами, поклавши край венеційсько-османській монополії на суходільні торгові шляхи."
  cape_route_to_india_events.2.title: "Острови Зеленого Мису"
  cape_route_to_india_events.2.desc: "Десять вулканічних островів височіють над рівною, безликою морською гладінню — такий він, архіпелаг Зеленого Мису. Флот знав, що зустріне їх на шляху, і все ж їхня поява принесла полегшення: тверда земля після довгих тижнів у відкритому океані. Осідок намісника у [ShowLocationName('santiago')] являє собою скромну будівлю з побіленого каменю. У гавані пахне сіллю, сушеною рибою і ледь відчутним орселем, лишайником, який зіскрібають зі скель для виготовлення барвника.\n\n[target_leader.GetName] зважує вибір. [ROOT.GetCountry.GetName] володі[ROOT.GetCountry.Custom('end_yeyut')] цими островами вже кілька десятиліть, але «володі[ROOT.GetCountry.Custom('end_yeyut')]» — надто гучно сказано: крихітна залога, жменька поселенців і щорічний корабель із припасами. Щоб цей шлях набув значення для майбутнього [ROOT.GetCountry.Custom('CL_GEN')], острови мають стати чимось більшим, ніж просто місцем відпочинку та поповнення запасів."
  cape_route_to_india_events.2.a: "Виділимо кошти на розбудову форпосту, що охороняє наш південний морський шлях."
  cape_route_to_india_events.2.b: "Поповнимо запаси, наберемо прісної води та рушимо далі в плавання."
  cape_route_to_india_events.2.c: "Не варто баритися — ми щойно відпливли й не маємо гаяти час."
  cape_route_to_india_events.2.d: "Повернутися додому."
  cape_route_to_india_events.2.historical_info: "Острови Зеленого Мису відкрили португальські мореплавці приблизно у 1456 році, а з 1462 року почалося заселення архіпелагу. Завдяки своєму розташуванню в Атлантичному океані, на шляху північно-східних пасатів, острови стали важливим перевалковим вузлом для плавань до Південної Америки та довкола Африки. Після того як Васко да Ґама підтвердив, що існує морський шлях до Індійського океану, стратегічне значення островів суттєво зросло. До XVI століття вони перетворилися на великий осередок трансатлантичної торгівлі невільниками."
  cape_route_to_india_events.3.title: "[ShowLocationNameWithNoTooltip('sao_tome')]"
  cape_route_to_india_events.3.desc_common: "Спека дається взнаки ще до того, як марсовий помічає на видноколі суходіл: щойно флот перетинає екватор, на палубу накочується волога, задушлива стіна зною. Моряки задихаються, а океан не несе ані прохолоди, ані полегшення. [ShowLocationName('sao_tome')] виринає з ранкового туману темно-зеленою короною з двома повитими хмарами вершинами. Водоспади прорізають схили й губляться серед настільки густого лісу, що світло не сягає землі."
  cape_route_to_india_events.3.desc: "$cape_route_to_india_events.3.desc_common$\n\nНевелике поселення тулиться на західному березі. За словами поселенців, тутешня земля надзвичайно родюча: що не посади — все росте. На цьому острові можна заробити цілий статок, вирощуючи цукрову тростину, аби лише були люди, здатні працювати на плантаціях."
  cape_route_to_india_events.3.desc.uninhabited: "$cape_route_to_india_events.3.desc_common$\n\nНа березі не видно димів, у бухтах — човнів. Острів безлюдний — шлюпки флоту першими досягають цього узбережжя. І все ж там, де вдається розчистити хащі, ґрунт чорний, глибокий і надзвичайно родючий. На такому острові можна заробити цілий статок, вирощуючи цукрову тростину, аби лише знайшлися люди, здатні працювати на плантаціях — якщо тільки їх раніше не згубить екваторіальна пропасниця."
  cape_route_to_india_events.3.desc.foreign: "$cape_route_to_india_events.3.desc_common$\n\nНа західному березі вже тулиться поселення під чужим стягом: причали, каплиця, перші поля цукрової тростини, облаштовані [rival_owner.GetAdjective|l]ими поселенцями, які дісталися цього родючого острова раніше за #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#!. Земля тут і справді багата, як і розповідали інші мандрівники, але вона вже зайнята. Усе, чого ми прагнемо досягти на Сан-Томе, тепер доведеться або відібрати, або виторгувати в [rival_owner.Custom('CL_GEN')]."
  cape_route_to_india_events.3.a: "Потрібно заснувати факторію — цей острів вартий вкладених коштів."
  cape_route_to_india_events.3.a.owned: "Вкладемо в острів додаткові кошти — Сан-Томе вже визнав нашу владу."
  cape_route_to_india_events.3.b: "Зведемо #italic падран#! і заявимо права на острів від імені корони."
  cape_route_to_india_events.3.c: "Поповнимо запаси прісної води та продовжимо шлях на південь."
  cape_route_to_india_events.3.d: "Повернутися додому."
  cape_route_to_india_events.3.historical_info: "Сан-Томе був безлюдним, доки приблизно в 1470 році до його берегів не прибули португальські мореплавці. Екваторіальний клімат виявився вкрай згубним для європейських поселенців — смертність від хвороб була високою. Проте для вирощування цукрової тростини місцеві умови були надзвичайно сприятливими. До 1520-х років Сан-Томе став найбільшим у світі виробником цукрової тростини. На його плантаціях працювали майже винятково поневолені африканці. Згодом острів перетворився на один із головних перевалкових вузлів трансатлантичної торгівлі невільниками та зберігав цю роль понад два століття поспіль."
  cape_route_to_india_events.4.title: "Гирло Великої річки"
  cape_route_to_india_events.4.desc: "Тут океан змінює свій колір на бурий. Уже цілий день моряки спостерігають, як бірюзове море змішується з густою, каламутно-коричневою, наче міцний чай, мулистою рідиною. А потім вони бачать початок цього потоку: річка, ширша за будь-яку річку [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! і ширша за всі ріки, які доводилося бачити цим людям, впадає в [ShowContinentName('atlantic_ocean_continent')] могутнім бурим потоком, забарвлюючи море на багато кілометрів навколо.\n\nІз мангрових хащів з'являються велетенські човни тридцять футів завдовжки, видовбані з цільного стовбура дерева. У кожному — по дюжині веслярів, які ведуть його з бездоганною злагодженістю. Чоловіки, що стоять на носі човнів, беззбройні. Вони спостерігають за флотом зі спокійною цікавістю людей, які не відчувають страху перед чужинцями."
  cape_route_to_india_events.4.a: "Попросимо про аудієнцію, якщо правитель цих земель [target_owner.Custom('GetRulerOrRegentTitle')] зможе нас прийняти."
  cape_route_to_india_events.4.b: "Купимо в місцевих слонову кістку, мідь і все, що вони запропонують."
  cape_route_to_india_events.4.c: "Нанесемо гирло річки на мапу та рушимо далі на південь — ми не маємо баритися."
  cape_route_to_india_events.4.d: "Повернутися додому."
  cape_route_to_india_events.4.historical_info: "Королівство Конго було одним із найрозвиненіших політичних утворень Африки на південь від Сахари. Під його владою перебували просторі землі, що охоплювали значну частину сучасних Конго, Анголи та Габону. Маніконго (король) правив через ієрархічне чиновництво та спирався на складний устрій врядування провінціями. У 1480-х роках португальські місіонери встановили зв’язки з королівством, започаткувавши взаємини, які глибоко вплинули на обидві сторони, а зрештою обернулися для них катастрофою. У 1490-х роках королівство прийняло християнство, а тогочасний маніконго взяв ім’я Жуан I."
  cape_route_to_india_events.5.title: "Бухта [ShowLocationNameWithNoTooltip('luanda')]"
  cape_route_to_india_events.5.desc: "Кожен офіцер виправи впізнає це місце з першого погляду. Жоден із моряків не бачив на всьому африканському узбережжі такої гавані: довга вигнута бухта, захищена з південного заходу природною піщаною косою, глибокі води до самісінького берега та невеликий мис за бухтою, звідки відкривається огляд на всі боки. Місцеві рибалки називають її Лоандою — «пласким місцем».\n\nУ променях пообіднього сонця [target_leader.GetName] проходить уздовж усієї піщаної коси: з одного боку лежить бухта, з іншого — розкинувся відкритий [ShowContinentName('atlantic_ocean_continent')]. [Select_CString(target_leader.IsFemale, 'Вона', 'Він')] уже роздумує про зведення фортечних мурів. І про прісну воду. І про те, скільки кораблів місцева залога зможе захистити чи перехопити. Місто, засноване в цій бухті, могло б узяти під контроль усю торгівлю південної Атлантики."
  cape_route_to_india_events.5.desc.owned: "Флот заходить у бухту, чиї чесноти й без того очевидні: над Луандою вже майорить стяг #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, а довга піщана коса дає прихисток кораблям, що служать нашій короні.\n\nУ променях пообіднього сонця [target_leader.GetName] проходить уздовж усієї піщаної коси: з одного боку лежить бухта, з іншого — розкинувся відкритий [ShowContinentName('atlantic_ocean_continent')]. [Select_CString(target_leader.IsFemale, 'Вона', 'Він')] думає вже не про те, чи варто займати цю землю, а про те, скільки ще вона може дати. Якщо ще ґрунтовніше укріпити місто, воно могло б узяти під контроль усю торгівлю південної Атлантики."
  cape_route_to_india_events.5.a: "Зведемо тут велику фейторію — їй не буде рівних."
  cape_route_to_india_events.5.a.owned: "Розширимо нашу велику факторію в Луанді — на всьому узбережжі їй не буде рівних."
  cape_route_to_india_events.5.b: "Зведемо невелику факторію та військову комору."
  cape_route_to_india_events.5.b.owned: "Розширимо наявні тут факторію та військову комору."
  cape_route_to_india_events.5.c: "Позначимо це місце на мапах і рушимо далі на південь."
  cape_route_to_india_events.5.d: "Повернутися додому."
  cape_route_to_india_events.5.historical_info: "Луанда була офіційно заснована як португальська колонія у 1575 році під проводом Паулу Діаша де Новаїша і стала одним із найстаріших європейських поселень в Африці на південь від Сахари. Завдяки природній гавані вона впродовж понад чотирьох століть залишалася головним портом португальської Анголи. Починаючи з XVI століття, Луанда перетворилася на головний порт вивезення невільників у межах трансатлантичної работоргівлі в південній частині Африки: звідси мільйони людей вивозили до Бразилії та на Кариби."
  cape_route_to_india_events.6.title: "Пустельне узбережжя"
  cape_route_to_india_events.6.desc: "Тут пустеля підходить до самісінького моря, червоні дюни здіймаються просто від смуги прибою, а з їхніх гребенів вітер підхоплює струмистий пісок. Ані дерев, ані найменших ознак прісної води. Узбережжя на північ, яке моряки охрестили [ShowLocationName('skeleton_coast')] через китові кістки, що біліють на березі, здається геть безлюдним на сотні миль навсібіч.\n\nІ все ж бухта спокійна. Захищена від потужних океанських хвиль, вона дає змогу флоту полагодити пошкоджену щоглу та поповнити запаси води з солонуватого джерела серед дюн. На крутому березі над бухтою штурман за допомогою своїх приладів вимірює кут сонця та робить записи. Мис Бур, каже він, лежить усього лише за тиждень плавання на південь. Дехто з моряків осіняє себе хресним знаменням."
  cape_route_to_india_events.6.a: "Підбадьормо команду: до Мису Бур рукою сягнути. Вперед!"
  cape_route_to_india_events.6.b: "У цих течій і вітрів власна мова, і я вмію її читати."
  cape_route_to_india_events.6.c: "Нехай люди перепочинуть: їм знадобляться сили для бур, що чекають попереду."
  cape_route_to_india_events.6.d: "Час повертати додому — це узбережжя надто пустельне, навіщо випробовувати долю далі?"
  cape_route_to_india_events.6.historical_info: "Португальські моряки називали узбережжя Намібії #italic «Costa dos Esqueletos»#!, або #italic «Берег Скелетів»#!, через безліч китових і тюленячих кісток, а також уламків кораблів, викинутих на навітряний берег потужними південно-західними вітрами. Затока Волфіш-Бей, названа нідерландцями #italic «Walvischbaai»#!, або #italic «Китова затока»#!, була однією з небагатьох захищених якірних стоянок на цьому вкрай непривітному узбережжі. У 1488 році Бартоломеу Діаш зупинився тут під час плавання на південь."
  cape_route_to_india_events.7.title: "Мис Бур"
  cape_route_to_india_events.7.desc: "За три місяці плавання ніщо не могло підготувати моряків до такого випробування. Буря налітає з південного заходу без попередження, обрушуючи на кораблі хвилі заввишки сорок футів. Головний корабель зникає в глибокій улоговині між хвилями, і на кілька миттєвостей усі завмирають у чеканні, чи з’явиться він знову. Такелаж рветься, а моряків скидає з щогл. [target_leader.GetName] обома руками чіпляється за кормове поруччя і дивиться на хаос довкола. І десь посеред шаленства вітру та гуркоту розбитих хвиль [Select_CString(target_leader.IsFemale, 'вона', 'він')] розуміє: вони проминули мис Бур. Величний південний край Африки, край відомого світу, лишився за кормою.\n\nШлях до Індії відкрито."
  cape_route_to_india_events.7.a: "Наречемо його мисом Доброї Надії і негайно в путь на схід!"
  cape_route_to_india_events.7.b: "Сховаємося з підвітряного боку мису й перечекаємо бурю."
  cape_route_to_india_events.7.d: "Ми зробили достатньо: Мис Бур обійшли. Повертаємо додому."
  cape_route_to_india_events.7.historical_info: "У 1488 році Бартоломеу Діаш уперше обігнув південний край Африки та нарік його #italic «Cabo das Tormentas»#!, або #italic «Мис Бур»#!. Згідно з португальськими джерелами, король Жуан II згодом перейменував його на #italic «Cabo da Boa Esperança»#!, або #italic «Мис Доброї Надії»#!, прагнучи надихнути майбутніх мореплавців. Цілком імовірно, що ця оповідка — просто вигадка. Мис не є найпівденнішою точкою Африки — ця першість належить мису Агульяс (Голковому), розташованому приблизно за двісті кілометрів на схід. Проте мис Доброї Надії позначає місце зустрічі Атлантичного та Індійського океанів і слугує брамою на схід."
  cape_route_to_india_events.8.title: "Затока Пастухів"
  cape_route_to_india_events.8.desc: "Бухта спокійна й чарівна. З південного заходу її захищає невисокий мис. Уздовж берега ростуть молочні дерева, що дарують бажаний затінок. А на схилі пагорба над пляжем пасеться худоба — вгодовані, здорові тварини, що зібралися у велетенські отари. За ними доглядають високі люди з червонувато-жовтим розписом на тілі та скляним намистом. Відколи флот кинув якір, вони спостерігають за кораблями з безпечної відстані.\n\nНа вигляд свіжого м’яса в декого з моряків навертаються сльози на очі. Вони тижнями живляться лише солоною рибою та черствими сухарями. Зрештою один із пастухів спускається до самісінької води й завмирає, стежачи за флотом, доки капітан не сідає в довгу шлюпку та не вирушає йому назустріч. На березі починається обмін: #TOOLTIP:GOODS,copper,X #L мідні#!#! кільця, сушена риба та безліч терплячих жестів. До настання ночі в трюмі опиняються три корови. Для кожного моряка на кораблі мукання стає найпрекраснішим звуком, який йому коли-небудь випадало чути."
  cape_route_to_india_events.8.a: "Обміняємо в місцевих мідь і тканини на худобу та зведемо #italic падран#!."
  cape_route_to_india_events.8.a.morale_tt: "Бойовий дух команд значно міцнішає (#G +15#! до бойового духу)"
  cape_route_to_india_events.8.b: "Зведемо #italic падран#!! [ROOT.GetCountry.GetNameWithNoTooltip] заявля[ROOT.GetCountry.Custom('end_yeyut')] права на ці землі."
  cape_route_to_india_events.8.b.morale_tt: "Бойовий дух команд дещо міцнішає (#G +8#! до бойового духу)"
  cape_route_to_india_events.8.c: "Даймо нашим людям трохи перепочити й відновити сили, перш ніж ми рушимо далі на північ."
  cape_route_to_india_events.8.c.morale_tt: "Бойовий дух команд помітно міцнішає (#G +10#! до бойового духу)"
  cape_route_to_india_events.8.d: "Повернутися додому."
  cape_route_to_india_events.8.historical_info: "Серед португальських мореплавців затоку Моссел називали #italic «Bahia dos Vaqueiros»#!, або #italic «Затока пастухів»#!, а згодом — #italic «Aguada de São Brás»#!, або #italic «Водопій Святого Власія»#!. У 1488 році Бартоломеу Діаш встановив тут кам’яний #italic падран#! — звичай, який у 1497 році продовжив Васко да Гама. Готтентоти, корінні жителі цих місць, спочатку охоче торгували з учасниками обох виправ, але потім стосунки між ними зіпсувалися. Коли люди Васко да Гами спробували набрати прісної води без належної плати, місцеві жителі закидали їх камінням."
  cape_route_to_india_events.9.title: "Золотий порт Софали"
  cape_route_to_india_events.9.desc: "Гавань Софали переповнена дау. Це не звичні для флоту невеликі рибальські човни, яких було чимало вздовж південного узбережжя, а океанські кораблі з #TOOLTIP:REGION,arabia_region,X #L Аравії#!#! та #TOOLTIP:REGION,persia_region,X #L Персії#!#!, що осіли під вагою вантажу #TOOLTIP:GOODS,ivory,X #L слонової кістки#!#!, чорного дерева та #TOOLTIP:GOODS,cloth,X #L тканин#!#!. На набережній купці торгують #TOOLTIP:LANGUAGE,arabic_language,X #L арабською#!#! та [location.GetDominantCulture.GetLanguage.GetAdjective|l]ою, яку не може розпізнати жоден із перекладачів флоту. Сувої індійської бавовняної тканини вимінюють на крихітні дрібки золотого піску.\n\nАрабські купці, які століттями порядкували всіма справами в цьому порту, спостерігають за прибуттям [ROOT.GetCountry.GetAdjective|l]ого флоту з-під навісів своїх комор. Їхні обличчя незворушні, але постави виказують ставлення до подій: поява цих чужинців, озброєних залізними гарматами і з хрестами на вітрилах, не віщує нічого доброго. Капітан флоту занотовує у своєму журналі найбільші комори, розташування стоянок дау та глибину біля входу до бухти."
  cape_route_to_india_events.9.a: "Збудуємо тут велику фейторію. Місцеве золото збагатить [ROOT.GetCountry.Custom('CL_ACC')]."
  cape_route_to_india_events.9.a.owned: "Вкладемо кошти в нашу факторію в Софалі. Це золото збагатить [ROOT.GetCountry.Custom('CL_ACC')]."
  cape_route_to_india_events.9.b: "Закупимо в місцевих золотий пісок і довідаємося, що криється в глибині материка."
  cape_route_to_india_events.9.c: "Зберемо потрібні відомості й вирушимо в дорогу — час дорогий."
  cape_route_to_india_events.9.d: "Повернутися додому."
  cape_route_to_india_events.9.historical_info: "Софала була найпівденнішим великим портом торговельної мережі суахілі та контролювала доступ до золотих копалень у царстві #italic Мутапа#!, або #italic Велике Зімбабве#!, розташованому на гірському плато на захід. Арабські купці вели тут торгівлю щонайменше з X століття. У 1505 році португальці захопили Софалу, зруйнували арабську торгову мережу та спробували спрямувати торгівлю золотом власними шляхами. Їм вдалося це лише почасти, оскільки значна частка торгівлі перемістилася в глибину материка, куди португальці ще не змогли проникнути."
  cape_route_to_india_events.10.title: "Острів [ShowLocationNameWithNoTooltip('mozambique')]"
  cape_route_to_india_events.10.desc: "Невеликий острів, не більше трьох кілометрів упоперек, відділений від материка вузькою протокою, глибини якої ледь вистачає для проходу океанських кораблів. На острові височіє кам’яна факторія під зеленим стягом, а гавань переповнена дау, що прибули з усіх куточків #TOOLTIP:CONTINENT,indian_ocean_continent,X #L Індійського океану#!#!. З глибини материка надходить #TOOLTIP:GOODS,ivory,X #L слонова кістка#!#! та чорне дерево, з материка женуть невільників, з півдня доправляють [ShowGoodsName('copper')|l], а з Індії та Китаю везуть [ShowGoodsName('cloth')|l] та [ShowGoodsName('porcelain')|l] — і все це мандрує з рук у руки торговими шляхами, що не згасали вже шість століть поспіль.\n\n[target_ruler_country.Custom('GetRulerOrRegentTitle')] має чимале багатство та неабияку підозріливість. Купці з #TOOLTIP:CULTUREGROUP,arabian_group,X #L Аравії#!#!, які прибули сюди раніше за флот, попередили [Select_CString(target_ruler.IsFemale, 'її', 'його')], що чужинці — [ROOT.GetCountry.GetReligion.GetAdjective|l]і пірати, які нищать усе, чого не можуть украсти. [target_ruler.GetHeShe|U] приймає посланця флоту з обережною ґречністю, в оточенні озброєної варти, і наполегливо розпитує про зброю. Опинившись у самому осерді гавані, під прицілом численних гармат, [target_ruler.GetHeShe|l] навряд чи почувається в безпеці — у будь-якому разі, [ROOT.GetCountry.GetAdjective|l]і розбійники визнали б таке становище доволі непевним."
  cape_route_to_india_events.10.a: "[target_ruler_country.Custom('GetRulerOrRegentTitle')] не гребує хабарями; пообіцяйте крам і викупіть право на будівництво."
  cape_route_to_india_events.10.b: "Виторгуємо торгові права за допомогою посольських хитрощів і багатих дарів."
  cape_route_to_india_events.10.c: "Запропонуємо арабським купцям вигідніші умови, переманимо місцевих, і тоді [target_ruler_country.Custom('GetRulerOrRegentTitle')] буде на нашому боці."
  cape_route_to_india_events.10.d: "Поки що визнаймо домагання, які висуває [target_ruler_country.Custom('GetRulerOrRegentTitle')], і рушаймо далі на північ."
  cape_route_to_india_events.10.f: "Встановімо #italic падран Святого Юрія#!."
  cape_route_to_india_events.10.e: "Повернутися додому."
  cape_route_to_india_events.10.historical_info: "Острів Мозамбік став найважливішим португальським осередком у Східній Африці після офіційного заснування тут факторії в 1507 році. Форт Сан-Себастьян, зведений у XVI столітті, і сьогодні залишається однією з найстаріших збережених європейських фортець в Африці на південь від Сахари. Понад два століття острів слугував урядовим осередком португальських володінь у Східній Африці та проміжною зупинкою на морському шляху до Індії. Його захоплення фактично зруйнувало систему арабського контролю над торговельною мережею північного узбережжя суахілі."
  cape_route_to_india_events.11.title: "Пастка біля Момбаси"
  cape_route_to_india_events.11.desc: "Прохід до гавані Момбаси доволі вузький, не більше двох кабельтових. По обидва боки височіють береги. Коли кораблі заходять у гавань, команди починають підозрювати неладне. На набережній безтурботно походжають люди, чия показна невимушеність виказує в них добре озброєних вояків, яким наказали вдавати беззбройних. Дау стоїть на якорі в незвичному місці, ніби маючи намір перекрити вихід із протоки. А посланець, якого вирядив [target_ruler_country.Custom('GetRulerOrRegentTitle')], піднявшись на флагман із дарами та почестями, ставить підозріло багато запитань про кількість озброєних людей на борту.\n\nТієї ночі перекладач флоту потай пробирається до каюти капітана. Перш ніж повернутися на берег, посланець розмовляв зі своїми супутниками [location.GetDominantCulture.GetLanguage.GetAdjective|l]ою мовою, яку перекладач знає. Слова посланця не залишали сумнівів: флоту не дозволять покинути Момбасу."
  cape_route_to_india_events.11.a: "Відчалимо до світанку, подібний прийом не вартий ризику."
  cape_route_to_india_events.11.b: "Залишимося і спробуємо поторгувати, попри очевидну напруженість у стосунках."
  cape_route_to_india_events.11.c: "Якщо вони замишляють підступ, ми вдаримо першими. Усім приготуватися!"
  cape_route_to_india_events.11.d: "Час додому — ми не станемо тут важити флотом."
  cape_route_to_india_events.11.historical_info: "У квітні 1498 року Васко да Гама ледь не втрапив у пастку біля Момбаси. Згідно з португальськими джерелами, надані султаном місцеві лоцмани спробували скерувати кораблі флоту на піщану мілину. Да Гама відвів флот, перш ніж пастка закрилася. У наступні десятиліття португальці неодноразово поверталися, щоби обстріляти й пограбувати Момбасу. Зведений у 1593 році форт Ісус забезпечив португальцям контроль над гаванню, однак у 1698 році після тривалої облоги місто захопили оманці."
  cape_route_to_india_events.12.title: "Дружній [target_ruler_country.Custom('GetRulerOrRegentTitle')|l]"
  cape_route_to_india_events.12.desc: "У [ShowLocationName('malindi')] все інакше, ніж в інших місцях, де флот бував раніше. [target_ruler_country.Custom('GetRulerOrRegentTitle')|U] [target_ruler.GetName] сходить до гавані в одежі з білого та зеленого шовку в супроводі музик, які грають на інструментах, чийого звучання ніхто з [ROOT.GetCountry.GetAdjective|l]их мандрівників досі не чув. Завдяки своїм зв’язкам на півдні [target_ruler.GetSheHe|U] вже знає про наближення флоту та очікує на його прибуття.\n\nУ [Select_CString(target_ruler.IsFemale, 'неї', 'нього')] є скарб, цінніший за слонову кістку — лоцман, який дванадцять разів ходив морем до Калікута. Він знає кожну течію, кожен риф і кожну зміну вітру на шляху звідси до Малабарського узбережжя. Він знає, коли південно-західний мусон дозволить кораблю перетнути [ShowContinentName('indian_ocean_continent')] за три тижні, а коли погубить його за двадцять чотири години. Ім’я лоцмана, наполягає [target_ruler.GetNameWithNoTooltip], важко вимовити європейською мовою. Але [Select_CString(target_ruler.IsFemale, 'її', 'його')] знання не потребують перекладу, а ціна цих знань — дружба."
  cape_route_to_india_events.12.a: "Ми з радістю приймемо і [Select_CString(target_ruler.IsFemale, 'її', 'його')] лоцмана, і [Select_CString(target_ruler.IsFemale, 'її', 'його')] дружбу."
  cape_route_to_india_events.12.b: "[target_ruler_country.Custom('GetRulerOrRegentTitle')] отримає від нас дарунки, допомогу й захист."
  cape_route_to_india_events.12.c: "[ROOT.GetCountry.GetReligion.GetGodName|U] чекає від нас звершень. Помолімося ж перед відплиттям!"
  cape_route_to_india_events.12.e: "Зведімо #italic падран Ешпіріту-Санту#! та розпочнімо велику справу."
  cape_route_to_india_events.12.d: "Повернімося додому: до Калікута далеко, а мандрівка обіцяє бути небезпечною."
  cape_route_to_india_events.12.historical_info: "Через давню ворожнечу з Момбасою султан Малінді був прихильним до португальців, сподіваючись, що вони допоможуть йому здобути перевагу в затяжній боротьбі. Особа знавця Індійського океану, наданого Васко да Гамі (у португальських джерелах він відомий як Малемо Канака), довгі століття залишалася предметом наукових суперечок. Дехто з істориків вважає, що це Ахмад ібн Маджид — найвидатніший арабський лоцман XV століття, автор низки праць про перетин Індійського океану. Інші рішуче відкидають цю теорію і вважають, що йдеться про гуджаратського купця. Ким ця людина була насправді, невідомо й досі."
  cape_route_to_india_events.13.title: "Калікут — столиця прянощів"
  cape_route_to_india_events.13.desc: "[ShowLocationName('kozhikode')] більше, ніж [ROOT.GetCountry.GetCapital.GetName]. У цьому порту стільки кораблів, що й годі злічити: тут стоять кораблі з #TOOLTIP:REGION,arabia_region,X #L Аравії#!#!, #TOOLTIP:REGION,persia_region,X #L Персії#!#!, #TOOLTIP:AREA,gujarat_area,X #L Гуджарату#!#!, #TOOLTIP:REGION,bengal_region,X #L Бенгалії#!#!, Китаю, #TOOLTIP:LOCATION,malacca,X #L Малакки#!#! та з острова #TOOLTIP:AREA,java_area,X #L Ява#!#!. #TOOLTIP:GOODS,pepper,X #L Перець#!#!, кориця, кардамон і #TOOLTIP:GOODS,cloves,X #L гвоздика#!#! мають воістину чарівну привабливість! Флот кидає якорі на рейді, вже заставленому дау, а #TOOLTIP:CULTUREGROUP,arabian_group,X #L аравійські#!#! купці спостерігають за цим рухом із берега.\n\nЦілих два місяці [target_ruler_country.Custom('GetRulerOrRegentTitle')|l] — [Select_CString(target_ruler.IsFemale, 'правителька', 'правитель')] Калікута, що рідко полишає свій пишний осідок, — чує, що прибульці — зовсім не купці, а пірати з холодної півночі. [target_ruler_country.Custom('GetRulerOrRegentTitle')|U] [Select_CString(target_ruler.IsFemale, 'погодилася', 'погодився')] прийняти капітана з далеких країв, однак [Select_CString(target_ruler.IsFemale, 'її', 'його')] [target_ruler_country.GetGovernment.GetCourtTitle|l] залишається насторожі, а [Select_CString(target_ruler.IsFemale, 'її', 'його')] купці помітно нервують. У тутешньому повітрі витають пахощі чорного перцю та морської солі: торгові кораблі борознять ці води вже тисячу років. Доля виправи вирішиться в найближчу годину."
  cape_route_to_india_events.13.a: "Нехай [target_ruler_country.Custom('GetRulerOrRegentTitle')|l] оцінить наш крам, а потім попросимо про факторію."
  cape_route_to_india_events.13.b: "Виголосимо вимоги: сталі мита, захист і безпечна стоянка."
  cape_route_to_india_events.13.c: "Звинуватимо аравійських купців у брехні. Нехай [target_ruler_country.Custom('GetRulerOrRegentTitle')|l] обирає."
  cape_route_to_india_events.13.d: "Дослухаймося до поради лоцмана. Він і [target_ruler_country.GetGovernment.GetCourtTitle|l] — давні знайомі."
  cape_route_to_india_events.13.e: "Виставимо #italic падран Сан-Ґабріела#! на загальний огляд."
  cape_route_to_india_events.13.historical_info: "Порт Кожикоде, який європейці називали Калікутом, був одним із найважливіших осередків торгівлі прянощами в Індійському океані. Правив ним #italic самутірі#! — «володар морів», також відомий як заморін. Він підтримував рівновагу між аравійськими купцями, які відігравали провідну роль у торгівлі, індійськими князівствами-суперниками та — згодом — гостями з Європи. Перший прийом Васко да Гами в 1498 році минув неоднозначно: його дарунки визнали недостатньо цінними, а аравійські купці зуміли налаштувати двір проти нього. Зрештою капітан полишив гавань лише з невеликим і незначним вантажем. Вигідної співпраці вдалося досягти лише під час наступних виправ і після погроз застосувати проти іншої сторони корабельні гармати."
  cape_route_to_india_events.14.title: "Золотий Берег"
  cape_route_to_india_events.14.desc: "Ліс розташований за день ходи від узбережжя, і цією дорогою ходять доволі часто. Два-три рази на тиждень на берег прибувають каравани: робітники переносять золотий пісок, видобутий із річкового гравію у внутрішніх землях. #TOOLTIP:CULTURE,$akan_tt$, #L Аканські#!#! королі тримають під владою розсипні родовища й продають надлишки золота через вангарську торгову мережу, якій виповнилося вже чотири століття.\n\nПіддані #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! багато чули про це місце. Будь-який #TOOLTIP:CULTUREGROUP,arabian_group,X $tt_op_L$аравійський$tt_cl_2$ капітан, якому доводилося тут торгувати, називав ринки Золотого Берега найбагатшими на всьому узбережжі Гвінеї. Місцеві жителі звикли до чужоземних кораблів і не бояться чужинців: їх цікавить лише можливий зиск."
  cape_route_to_india_events.14.a: "Зведімо форт Сан-Жоржі-да-Міна, і акани торгуватимуть із його комендантом."
  cape_route_to_india_events.14.a.owned: "Зміцнімо форт Сан-Жоржі-да-Міна: акани вже торгують із нашою країною."
  cape_route_to_india_events.14.b: "Домовимося про бранців, яких акани беруть як воєнну данину."
  cape_route_to_india_events.14.c: "Нападемо на поселення, поки вангарські купці не відбули."
  cape_route_to_india_events.14.d: "Подумаємо згодом, а поки рушаймо на південь. Зволікати не можна."
  cape_route_to_india_events.14.e: "Повернімося додому. Що ще потрібно, крім золота?"
  cape_route_to_india_events.14.historical_info: "У 1482 році португальці звели на Золотому Березі форт Сан-Жоржи-да-Міна, також знаний як фортеця Елміна. Матеріалами послужили камінь, видобутий на сусідньому мисі, а також деревина, заготовлена в Португалії та доставлена морем. Споруду звели всього за кілька тижнів: почасти завдяки домовленості з місцевим вождем Карамансою, почасти просто через поспіх. Від початку завдання форту полягало в нагляді за торгівлею золотом з аканськими лісовими королівствами, однак за кілька десятиліть фортеця перетворилася на головний осередок торгівлі невільниками в Атлантичному океані: сюди доправляли бранців, захоплених у місцевих війнах. Згодом їх відправляли на захід: на цукрові плантації острова Сан-Томе, а пізніше — Бразилії. Історик Волтер Родні підрахував, що торгівля із Золотим Берегом приносила португальцям кілька сотень тисяч крузадо на рік, доки невільники не витіснили золото з позиції головного товару."
  cape_route_to_india_events.15.title: "Острів Фернандо-По"
  cape_route_to_india_events.15.desc: "З вод Гвінейської затоки здіймається острів: це вулканічний пік, увінчаний хмарами й густо порослий джунглями, що спускаються до самісінької води. Тут живе народ #TOOLTIP:CULTURE,$bubi_tt$, #L бубі#!#!, зроду не бачив європейців. Ховаючись за деревами, місцеві жителі спостерігають, як флот зупиняється в природній бухті, а моряки спускають човен на воду.\n\nМандрівник, на честь якого названо острів, побував тут кілька десятиліть тому й лише в загальних рисах наніс його на мапу. У лоцмана ця мапа є, але на ній не зазначено, чи варто взагалі зупинятися в цьому місці."
  cape_route_to_india_events.15.desc.owned: "Острів і досі височіє над хвилями: це вулканічний пік, увінчаний хмарами й густо порослий джунглями, що спускаються до самої води. Проте над стоянкою кораблів уже майорить португальський стяг, а наш флот зустрічають співвітчизники на човнах.\n\nТепер [target_leader.GetName] може не гадати, чи варто тут зупинятися. Питання в тому, яку ще користь можна мати з цього оплоту [ROOT.GetCountry.Custom('CL_GEN')], що тримає під наглядом торгівлю в Гвінейській затоці."
  cape_route_to_india_events.15.a: "Заснуємо на острові форпост і відатимемо торгівлею в Гвінейській затоці."
  cape_route_to_india_events.15.a.owned: "Зміцнимо форпост на острові: ми вже взяли під контроль торгівлю в Гвінейській затоці."
  cape_route_to_india_events.15.b: "Зведемо #italic падран#!, нанесемо острів на мапу й привласнимо його собі."
  cape_route_to_india_events.15.c: "Полагодимо днища, наповнимо бочки та запасемося харчами."
  cape_route_to_india_events.15.c.tt: "Корпуси чистять і смолять, тож у цій виправі корабельні деревоточці флоту не страшні"
  cape_route_to_india_events.15.d: "Повернімося додому. Зрештою, Гвінейську затоку ми дослідили."
  cape_route_to_india_events.15.historical_info: "У 1472 році португальський мореплавець Фернан ду По став першим європейцем, який дістався острова Фернандо-По, нині відомого як Біоко. Народ бубі, що самотньо мешкав тут століттями, прибув сюди з материка значно раніше. Португальці використовували острів як перевалковий вузол, але заснувати постійне поселення їм не вдавалося: почасти через тропічні пошесті, а почасти через те, що бубі відмовлялися йти на зближення. У наступні століття Біоко кілька разів переходив з рук у руки: так, у 1778 році за договором в Ель-Пардо Португалія поступилася островом Іспанії в обмін на земельні поступки в Південній Америці. Зрештою він увійшов до складу сучасної Екваторіальної Гвінеї."
  cape_route_to_india_events.16.title: "Місто морського султана"
  cape_route_to_india_events.16.desc: "[ShowLocationName('mogadishu')] більше, ніж ми очікували. Міська гавань заповнена індійськими та #TOOLTIP:REGION,arabia_region,X #L аравійськими#!#! дау: їхні трюми вгинаються під #TOOLTIP:GOODS,cloth,X #L тканинами#!#!, #TOOLTIP:GOODS,copper,X #L міддю#!#! та #TOOLTIP:GOODS,porcelain,X #L порцеляною#!#!. [ShowLocationNameWithNoTooltip('mogadishu')] править [target_owner.Custom('GetRulerOrRegentTitle')|l]: ця людина, яку призначає [target_owner.GetName], керує торгівлею між #TOOLTIP:CULTURE,$somali_culture_tt$,X #L сомалійцями#!#! та зовнішнім світом. Купці, що зібралися на пристані, пильно розглядають наші кораблі. Ми не перші чужинці, які прибули сюди під незнайомими знаменами й з дивовижним крамом, але, можливо, з таких далеких західних земель сюди ще ніхто не діставався."
  cape_route_to_india_events.16.a: "Торгуватимемо із сомалійськими купцями. Для нас важливі будь-які зв’язки."
  cape_route_to_india_events.16.b: "Поспостерігаймо й рушаймо на північ. Зрештою, наша ціль — $india$."
  cape_route_to_india_events.16.c: "Повернімо назад. Шлях нам невідомий, а харчі добігають кінця."
  cape_route_to_india_events.16.historical_info: "Могадішо було одним із найстаріших і найбагатших приморських міст Східної Африки. Його розгалужені торгові зв’язки почали зароджуватися за століття до прибуття португальців: на аравійських мапах воно значилося як великий порт уже в IX столітті. За часів Вашку да Ґами Могадішо перебувало під владою султанату й належало до торгової мережі Суахілійського узбережжя, яка пов’язувала Африку з Аравією, Персією та Індійським краєм. Намір португальців оминути ці міста-держави або підкорити їх силою задля встановлення власної торгової монополії спричинив пряме протистояння з наявним й до того ж вельми дієвим торговим устроєм."
  cape_route_to_india_events.17.title: "Ібадитський порт"
  cape_route_to_india_events.17.desc: "[ShowLocationName('masqat')] височіє над червоними скелями, і море тут пахне інакше: його запах сухіший і гостріший, у ньому відчувається #TOOLTIP:GOODS,salt,X #L сіль#!#! з домішкою пилу. Ця гавань — одна з найкращих в #TOOLTIP:PROVINCE_DEFINITION,arabian_sea_province,X #L Аравії#!#!: тутешні води достатньо глибокі для великих кораблів, а рельєф надійно береже місто від південно-західного мусону. #TOOLTIP:CULTURE,$omani_culture_tt$,X #L Оманські#!#! купці торували шлях до Індії ще тисячу років тому. Людям на пристані достеменно відомі всі вітри, строки та шляхи. Вони знають, коли виходити в море, а коли ліпше почекати. Вони дивляться на нас, намагаючись угадати наші наміри."
  cape_route_to_india_events.17.a: "Розшукаймо оманську владу й відрекомендуймося їй."
  cape_route_to_india_events.17.b: "Придбаймо мапи до Індії в аравійських лоцманів."
  cape_route_to_india_events.17.c: "Поповнімо запаси й відпливемо. Оманські моряки нам не друзі."
  cape_route_to_india_events.17.d: "Повернемо назад. Подорож до Індії нам не під силу."
  cape_route_to_india_events.17.historical_info: "Маскат був головним портом ібадитського імамату Оман — однієї з найбільших морських держав у західній частині Індійського океану. Оманські моряки чудово знали морські шляхи та розклад мусонних вітрів, адже від цього залежала тривалість мандрівок між Аравією та Індійським макрорегіоном. Прибуття португальців поставило під удар посередницьку роль оманців у торгівлі прянощами: відносини цих двох народів залишалися напруженими протягом майже всього XVI століття, і зрештою протистояння вилилося в низку воєн за контроль над Перською затокою та східноафриканськими портами. У XVII столітті оманці витіснили португальців із більшості своїх осередків у Східній Африці."
  cape_route_to_india_events.18.title: "Португальці звели фейторію"
  cape_route_to_india_events.18.desc: "Португальці заскочили нас зненацька. Вони кинули якорі на зовнішньому рейді та навели гармати на гавань. Їхнє прохання, ввічливе за формою, по суті було беззаперечним. Вони хочуть збудувати факторію. Вони згодні сплачувати невеликий податок. Вони поважатимуть місцеві закони. Вони не згадали, що станеться, якщо ми їм відмовимо, але цього й не було потрібно. Деревину португальці заготовили заздалегідь і привезли в трюмах. Факторію звели за лічені дні. Тепер там, де раніше майорів наш стяг, височіє #L [por_feitoria_builder.GetAdjective|l]ий#! хрест."
  cape_route_to_india_events.18.a: "У нас немає вибору: проти гармат не підеш."
  cape_route_to_india_events.18.b: "Ми протестуємо: наш суверенітет слід поважати."
  cape_route_to_india_events.18.historical_info: "Португальська система фейторій стала одним із перших прикладів європейського торгового імперіалізму в Африці та Азії. Будівництво укріплених купецьких поселень у чужих портах дало змогу португальцям проникнути у вже сформовані торгові мережі, не витрачаючи сил на повноцінні завоювання. Якщо місцеві правителі приставали на умови, їм надавали доступ до португальських товарів і забезпечували захист від ворогів із моря, якщо відмовлялися — у хід ішли гармати. Таким чином, Індійський океан із порівняно вільного торгового простору перетворився на вотчину португальського флоту, фактично на монополію компанії «Каса-да-Індія»."
  cape_route_to_india_events.provisioned_25_tt: "Флот повністю забезпечений припасами, і команди легше переноситимуть подальшу подорож (#G +25#! до харчів)"
  cape_route_to_india_events.provisioned_30_tt: "Флот повністю забезпечений припасами, і команди легше переноситимуть подальшу подорож (#G +30#! до харчів)"
  cape_route_to_india_events.provisioned_40_tt: "Флот повністю забезпечений припасами, і команди легше переноситимуть подальшу подорож (#G +40#! до харчів)"
  cape_route_to_india_events.supplies_up_10_tt: "Припаси флоту поповнено (#G +10#! до харчів)"
  cape_route_to_india_events.supplies_up_15_tt: "Припаси флоту поповнено (#G +15#! до харчів)"
  cape_route_to_india_events.supplies_up_20_tt: "Припаси флоту поповнено (#G +20#! до харчів)"
  cape_route_to_india_events.supplies_up_25_tt: "Припаси флоту поповнено (#G +25#! до харчів)"
  cape_route_to_india_events.supplies_up_30_tt: "Припаси флоту поповнено (#G +30#! до харчів)"
  cape_route_to_india_events.supplies_down_tt: "Припаси флоту витрачено (#G −10#! до харчів)"
  cape_route_to_india_events.morale_up_3_tt: "Бойовий дух команд міцніє (#G +3#! до бойового духу)"
  cape_route_to_india_events.morale_up_5_tt: "Бойовий дух команд міцніє (#G +5#! до бойового духу)"
