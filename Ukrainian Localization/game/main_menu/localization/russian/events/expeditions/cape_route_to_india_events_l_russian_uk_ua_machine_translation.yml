l_russian:
  cape_route_to_india_events.1.title: "Флот виходить у море"
  cape_route_to_india_events.1.a: "Якщо того воліє [ROOT.GetCountry.GetReligion.GetGodName|U], ми повернемося з трюмами, повними прянощів."
  cape_route_to_india_events.1.b: "Помолімося — а тоді вирушаймо в дорогу з усією квапливістю."
  cape_route_to_india_events.1.historical_info: "Португальська виправа в пошуках морського шляху до Індії стала підсумком майже століття поступових досліджень африканського узбережжя, які просувалися все далі на південь. Бартоломеу Діаш обігнув мис Доброї Надії в 1488 році, довівши, що такий шлях можливий. Плавання Васко да Гами в 1497–99 роках завершило цю місію: виправа повернулася з вантажем перцю та прянощів, який окупився в шістдесят разів. Це плавання докорінно змінило світову торгівлю прянощами, зруйнувавши венеційську та османську монополію на суходільні шляхи."
  cape_route_to_india_events.2.title: "Острови [ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]"
  cape_route_to_india_events.2.a: "Вкладімося тут — заснуємо осаду, яка стане опорою нашого південного морського шляху."
  cape_route_to_india_events.2.b: "Поповнити запаси, набрати свіжої води та вирушити далі."
  cape_route_to_india_events.2.c: "Іти далі — ми не можемо дозволити собі зволікати так рано."
  cape_route_to_india_events.2.d: "Повернутися додому."
  cape_route_to_india_events.2.historical_info: "Острови Кабо-Верде відкрили португальські мореплавці близько 1456 року, а постійно заселені вони були з 1462 року. Завдяки їхньому розташуванню в Атлантиці — на шляху північно-східних пасатів — вони стали найважливішим перевалковим вузлом для плавань до Південної Америки та довкола Африки. Їхнє стратегічне значення значно зросло після того, як плавання Васко да Гами довело можливість шляху через Індійський океан. До шістнадцятого століття вони перетворилися на важливий осередок атлантичної работоргівлі."
  cape_route_to_india_events.3.title: "Острів [ShowLocationNameWithNoTooltip('sao_tome')]"
  cape_route_to_india_events.3.desc_common: "Спека сповіщає про себе перш ніж покажеться берег: волога, задушлива стіна спадає на палубу в ту саму мить, коли флот перетинає екватор, змушуючи людей задихатися в повітрі, яке ніколи не стає прохолоднішим. [ShowLocationName('sao_tome')] здіймається з ранкового туману, немов темно-зелена корона: дві вершини, повиті хмарами, та водоспади, що пробиваються крізь ліс, настільки густий, що світло не сягає землі."
  cape_route_to_india_events.3.desc.foreign: "$cape_route_to_india_events.3.desc_common$\n\nНа західному узбережжі вже тулиться поселення під чужим прапором — причали, каплиця, перші незаймані плантації цукрової тростини ворожої корони, яка дісталася цього родючого острова раніше за [ROOT.GetCountry.GetName]. Ґрунт тут точно такий багатий, як і обіцяли перекази, але він уже зайнятий. Усе, що ми хочемо отримати від [ShowLocationNameWithNoTooltip('sao_tome')], тепер доведеться або відбирати силою, або виторговувати з чужих рук."
  cape_route_to_india_events.3.a: "Заснувати торговельну фейторію — можливості цього острова варті вкладень."
  cape_route_to_india_events.3.b: "Встановити #italic падран#! на узвишші та офіційно проголосити права на острів."
  cape_route_to_india_events.3.c: "Набрати прісної води та йти на південь."
  cape_route_to_india_events.3.d: "Повернутися додому."
  cape_route_to_india_events.3.historical_info: "Сан-Томе був безлюдним, коли близько 1470 року туди прибули португальські мореплавці. Його екваторіальний клімат виявився згубним для європейських поселенців — смертности від хвороб була високою, — але надзвичайно сприятливим для вирощування цукрової тростини. До 1520-х років Сан-Томе став найбільшим у світі виробником цукрової тростини, яку вирощували майже виключно поневолені африканці. Згодом острів перетворився на великий перевалковий вузол атлантичної торгівлі невільниками — роль, яку він зберігав понад два століття."
  cape_route_to_india_events.4.title: "Гирло великої річки"
  cape_route_to_india_events.4.a: "Seek an audience with the great king of this land."
  cape_route_to_india_events.4.b: "Trade for [ShowGoodsNameWithNoTooltip('ivory')], [ShowGoodsNameWithNoTooltip('copper')], and whatever else they will offer."
  cape_route_to_india_events.4.c: "Chart the river mouth and press south — we must not be delayed."
  cape_route_to_india_events.4.d: "Повернутися додому."
  cape_route_to_india_events.4.historical_info: "Королівство Конго було одним із найрозвиненіших політичних утворень Африки на південь від Сахари, що контролювало території на землях сучасних Конго, Анголи та Габону. Маніконго (король) правив через ієрархічне чиновництво та підтримував розвинений устрій провінційного врядування. У 1480-х роках португальські місіонери встановили зв’язок із королівством, поклавши початок відносинам, які виявляться доленосними — а зрештою катастрофічними — для обох сторін. У 1490-х роках королівство прийняло християнство, і маніконго взяв собі ім’я Жуан I."
  cape_route_to_india_events.5.title: "Бухта [ShowLocationNameWithNoTooltip('luanda')]"
  cape_route_to_india_events.5.a: "Звести тут велику [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] — їй не буде рівних."
  cape_route_to_india_events.5.b: "Заснувати тут невелику торгову факторію та склад."
  cape_route_to_india_events.5.c: "Note its position carefully on the charts and continue south."
  cape_route_to_india_events.5.d: "Повернутися додому."
  cape_route_to_india_events.5.historical_info: "Луанда була офіційно заснована як португальська колонія 1575 року Паулу Діашем де Новайшем, що робить її одним із найстаріших європейських поселень в Африці південніше Сахари. Її природна гавань понад чотири століття слугувала головним портом португальської Анголи. Починаючи з XVI століття Луанда стала основним осередком відправлення трансатлантичної торгівлі рабами в південній Африці, звідки мільйони поневолених людей вирушали до Бразилії та на Кариби."
  cape_route_to_india_events.6.title: "Пустельне узбережжя"
  cape_route_to_india_events.6.desc: "The desert comes to the sea here, red dunes rising directly from the surf-line, their crests streaming sand into the air. There are no trees. There is no fresh water visible. The coast to the north — the men are already calling it the [ShowProvinceDefinitionName('skeleton_coast_province')], for the whale bones bleaching on the beach — shows no sign of human habitation for hundreds of miles in any direction.\n\nAnd yet the bay is calm. Sheltered from the worst of the swells, it offers the fleet a chance to repair a damaged mast and refill the water from a brackish spring in the dunes. On the headland above, the ship's navigator is measuring the angle of the sun with his instruments and making notes. The Cape, he says, is no more than a week's sailing to the south. Some of the men cross themselves."
  cape_route_to_india_events.6.a: "Rally the men — the Cape of Good Hope lies within reach. Forward!"
  cape_route_to_india_events.6.b: "These currents and winds tell a navigator much — let me read them."
  cape_route_to_india_events.6.c: "Let the men rest here. They will need strength for the storms ahead."
  cape_route_to_india_events.6.d: "Повернутися додому — це узбережжя занадто безлюдне, щоб іти далі."
  cape_route_to_india_events.6.historical_info: "Узбережжя Намібії було відоме португальським морякам як #italic Costa dos Esqueletos#! (Берег Скелетів) через безліч кісток китів і тюленів, а також уламків кораблів, викинутих на підвітряний берег потужними південно-західними вітрами. Волфіш-Бей, названа голландцями #italic Walvischbaai#! (Китова бухта), була однією з небагатьох захищених якірних стоянок на цьому ворожому відтинку узбережжя. Бартоломеу Діаш зупинявся тут 1488 року під час свого плавання на південь."
  cape_route_to_india_events.7.title: "Мис Бур"
  cape_route_to_india_events.7.a: "Назвати його мисом Доброї Надії та без зволікань рушати на схід!"
  cape_route_to_india_events.7.b: "Сховатися під захистом мису, доки не вщухне шторм."
  cape_route_to_india_events.7.d: "We have done enough — the Cape has been rounded. Turn for home."
  cape_route_to_india_events.7.historical_info: "#italic Bartolomeu Dias#! first rounded the Cape in 1488, naming it #italic Cabo das Tormentas#! (Cape of Storms). According to Portuguese sources, King João II renamed it #italic Cabo da Boa Esperança#! (Cape of Good Hope) to encourage future expeditions, though this account may be apocryphal. The Cape is not the southernmost point of Africa — that distinction belongs to Cape Agulhas, some two hundred kilometers to the east — but it marks the meeting point of the Atlantic and Indian Oceans and the door to the east."
  cape_route_to_india_events.8.title: "Бухта Пастухів"
  cape_route_to_india_events.8.desc: "The bay is calm and beautiful, sheltered from the south-west by a low headland. Milkwood trees provide welcome shade along the shore. And on the hillside above the beach — cattle. Fat, healthy cattle grazing in enormous herds, tended by tall people wearing ochre and glass beads who have been watching the fleet from a safe distance since it anchored.\n\nSome of the men are near tears at the sight of fresh meat. They have been living on salt fish and hard biscuit for weeks. Eventually one of the herders walks down to the waterline and stands there, watching, until the fleet's captain climbs into a longboat and rows to meet him. An exchange takes place that involves copper rings, dried fish, and a great deal of patient gesture. By nightfall, three cattle are in the hold. The sound of lowing is, to every man on the fleet, the most beautiful noise they have ever heard."
  cape_route_to_india_events.8.a: "Trade [ShowGoodsNameWithNoTooltip('copper')] and [ShowGoodsNameWithNoTooltip('cloth')] for cattle and plant a #italic padrão#! to mark our claim."
  cape_route_to_india_events.8.b: "Erect a stone #italic padrão#! and formally claim this land for [ROOT.GetCountry.GetNameWithNoTooltip]."
  cape_route_to_india_events.8.c: "Дати людям перепочити й відновити сили тут, перш ніж вирушати на північ."
  cape_route_to_india_events.8.d: "Повернутися додому."
  cape_route_to_india_events.8.historical_info: "Мосселбай був відомий португальським морякам як #italic Bahia dos Vaqueiros#! (бухта Пастухів), а пізніше — як #italic Aguada de São Brás#! (Водопій Святого Власія). Бартоломеу Діаш встановив тут кам’яний #italic padrão#! 1488 року, а звичай цей продовжив Васко да Гама в 1497-му. Місцеві койкої спочатку охоче торгували з обома експедиціями, але згодом стали ворожими — людей Васко да Гами закидали камінням, коли ті спробували набрати прісної води без належної плати."
  cape_route_to_india_events.9.title: "Золотий порт [ShowLocationNameWithNoTooltip('sofala')]"
  cape_route_to_india_events.9.a: "Establish a major [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] — this gold will make [ROOT.GetCountry.GetNameWithNoTooltip] rich."
  cape_route_to_india_events.9.b: "Виміняти золотий пісок і довідатися, що криється в глибинних землях."
  cape_route_to_india_events.9.c: "Зібрати відомості та рушати далі — час дорогий."
  cape_route_to_india_events.9.d: "Повернутися додому."
  cape_route_to_india_events.9.historical_info: "Софала була найпівденнішим визначним портом суахілійської торгової мережі, що контролював доступ до золотоносного царства #italic Мутапа #! (Великого Зімбабве) на плато на заході. Арабські купці вели тут торгівлю щонайменше з десятого століття. Португальці захопили Софалу в 1505 році, зруйнувавши арабську торгову мережу та спробувавши спрямувати торгівлю золотом власними каналами — з мінливим успіхом, оскільки значна частина торгівлі просто перемістилася глибше у внутрішні землі, поза їхньою досяжністю."
  cape_route_to_india_events.10.title: "Острів [ShowLocationNameWithNoTooltip('mozambique')]"
  cape_route_to_india_events.10.desc: "A small island, no more than three kilometers from end to end, separated from the mainland by a narrow channel just deep enough for ocean-going ships. The island is dominated by a stone trading post flying a green flag, and the harbor is packed with dhows from all corners of the [ShowContinentName('indian_ocean_continent')]. [ShowGoodsName('ivory')] and ebony flow down from the interior, enslaved men and women are marched in from the mainland, [ShowGoodsName('copper')] comes up from the south, and [ShowGoodsName('cloth')] and [ShowGoodsName('porcelain')] arrive from $india$ and $china$ — all of it changing hands in a trading network that has functioned for six centuries.\n\nThe [target_ruler_country.Custom('GetRulerOrRegentTitle')] is wealthy and suspicious. Arab merchants who arrived ahead of the fleet have warned [target_ruler.GetHimHer] that the strangers are [ROOT.GetCountry.GetReligion.GetAdjective] pirates who destroy what they cannot steal. [target_ruler.GetHeShe|U] receives the fleet's envoy with careful courtesy, surrounded by armed guards, and asks many questions about armaments. [target_ruler.GetHerHis|U] own position, in the heart of a harbor ringed by cannon-points, is not what the [ROOT.GetCountry.GetAdjective] would call comfortable."
  cape_route_to_india_events.10.a: "Bribe the [target_ruler_country.Custom('GetRulerOrRegentTitle')] with goods from our hold and buy the right to build here."
  cape_route_to_india_events.10.b: "Домовитися про торгові права через дипломатію та дарунки."
  cape_route_to_india_events.10.c: "Outmaneuver the Arab merchants — offer the [target_ruler_country.Custom('GetRulerOrRegentTitle')] terms they cannot match."
  cape_route_to_india_events.10.d: "Acknowledge the [target_ruler_country.Custom('GetRulerOrRegentTitle')]'s position for now and continue north."
  cape_route_to_india_events.10.f: "Встановити #italic Сан-Жоржі падрáн#!."
  cape_route_to_india_events.10.e: "Повернутися додому."
  cape_route_to_india_events.10.historical_info: "Острів Мозамбік став найважливішою базою Португалії у Східній Африці, офіційно заснованою в 1507 році. Форт Сан-Себастьян, збудований у XVI столітті, лишається однією з найстаріших збережених європейських фортифікаційних споруд в Африці на південь від Сахари. Острів слугував урядовою столицею Португальської Східної Африки та перевальним пунктом на шляху до $india$ понад два століття. Його захоплення фактично знищило арабський контроль над північною частиною торгової мережі суахілійського узбережжя."
  cape_route_to_india_events.11.title: "Пастка біля [ShowLocationNameWithNoTooltip('mombasa')]"
  cape_route_to_india_events.11.desc: "[ShowLocationName('mombasa')]'s entrance channel is narrow, no more than two cables wide, with high ground on either shore. As the fleet passes through, the men begin to sense something is wrong — men loitering along the waterfront with the excessive casualness of heavily armed men who have been told to appear unarmed, a dhow anchored in an odd position that would block the channel exit, and the [target_ruler_country.Custom('GetRulerOrRegentTitle')]'s envoy who boards the flagship with elaborate ceremony, gifts, and too many questions about the number of fighting men aboard.\n\nThat night, an interpreter employed by the fleet slips into the captain's cabin. Before returning ashore, the [target_ruler_country.Custom('GetRulerOrRegentTitle')]'s envoy spoke to his companions in a dialect the man understands. The words were unambiguous: the fleet is not to leave [ShowLocationNameWithNoTooltip('mombasa')]."
  cape_route_to_india_events.11.a: "Leave quietly before dawn — this man's hospitality is not worth the risk."
  cape_route_to_india_events.11.b: "Залишитися і спробувати торгувати, попри явне напруження."
  cape_route_to_india_events.11.c: "If they plan treachery, we shall act first — prepare the men."
  cape_route_to_india_events.11.d: "Повернутися додому — ми не ризикуватимемо флотом тут."
  cape_route_to_india_events.11.historical_info: "Васко да Гама ледь не потрапив у засідку в Момбасі у квітні 1498 року. Згідно з португальськими хроніками, місцеві лоцмани, призначені султаном, намагалися посадити флот на мілину. Да Гама відступив перш ніж пастка закрилася. У наступні десятиліття португальці неодноразово поверталися, аби бомбардувати та грабувати Момбасу. Форт Ісус, зведений у 1593 році, остаточно закріпив португальський контроль над гаванню — хоча місто було захоплене оманцями в 1698 році після тривалої облоги."
  cape_route_to_india_events.12.title: "Приязний [target_ruler_country.Custom('GetRulerOrRegentTitle')|U]"
  cape_route_to_india_events.12.desc: "Everything about [ShowLocationName('malindi')] is different from what came before. [target_ruler.GetName], the [target_ruler_country.Custom('GetRulerOrRegentTitle')], comes down to the harbor [target_ruler.GetHerselfHimself], dressed in white and green silk, attended by musicians playing an instrument that produces music none of the [ROOT.GetCountry.GetAdjective] have ever heard. [target_ruler.GetSheHe|U] has word of the fleet from [target_ruler.GetHerHis] contacts to the south and has been expecting their arrival.\n\n[target_ruler.GetSheHe|U] has a gift that is worth more than ivory: in [target_ruler.GetHerHis] employ [target_ruler.GetSheHe] has a man who has sailed to Calicut twelve times. A man who knows every current, every reef, every wind shift between here and the Malabar coast. Who knows when the south-west monsoon will carry a ship across the [ShowContinentName('indian_ocean_continent')] in three weeks and when it will kill the same ship in twenty-four hours. The pilot's name, [target_ruler.GetName] explains, is hard to render in a European tongue. But [target_ruler.GetHerHis] knowledge is not, and the price of that knowledge is friendship."
  cape_route_to_india_events.12.a: "Accept [target_ruler.GetNameWithNoTooltip]'s friendship and [target_ruler.GetHerHis] gift of a pilot — we will honor it."
  cape_route_to_india_events.12.b: "Formalize this friendship: gifts, a presence here, and protection for the [target_ruler_country.Custom('GetRulerOrRegentTitle')]."
  cape_route_to_india_events.12.c: "Let us pray together before the final crossing — [ROOT.GetCountry.GetReligion.GetGodName|U] brought us to this moment."
  cape_route_to_india_events.12.e: "Встановити #italic падран Ешпіріту-Санту#! перед великим переходом."
  cape_route_to_india_events.12.d: "Return home — Calicut is too far, and the crossing too dangerous."
  cape_route_to_india_events.12.historical_info: "The Sultan of Malindi maintained a long rivalry with Mombasa and was therefore well-disposed toward the Portuguese, who arrived as potential counterweights to his enemies. The Indian Ocean pilot he provided to Vasco da Gama — referred to in Portuguese sources as #italic Malemo Canaca#! — has been the subject of scholarly debate for centuries. Some historians identify him with #italic Ahmad ibn Majid#!, the greatest Arab navigator of the fifteenth century and author of several works on Indian Ocean navigation. Others argue the identification is incorrect and the pilot was a Gujarati merchant. His identity remains uncertain."
  cape_route_to_india_events.13.title: "Калікут — брама прянощів"
  cape_route_to_india_events.13.desc: "[ShowLocationName('kozhikode')] is larger than [ROOT.GetCountry.GetCapital.GetName]. The harbor contains more ships than the fleet's officers can count — vessels from [ShowRegionName('arabia_region')], [ShowRegionName('persia_region')], [ShowAreaName('gujarat_area')], [ShowRegionName('bengal_region')], $china$, [ShowLocationName('malacca')], and [ShowAreaName('java_area')]. A whole connected world has been drawn together by the magnetic pull of [ShowGoodsName('pepper')], cinnamon, cardamom, and [ShowGoodsName('cloves')], and all of it flows through this port. The fleet drops anchor in a roadstead already crowded with dhows as Arab merchants on the waterfront stare.\n\nFor two months they have been telling the [target_ruler_country.Custom('GetRulerOrRegentTitle')] — Calicut's ruler, who governs from behind elaborate ceremonial walls — that these newcomers are pirates from the cold north, not merchants. The [target_ruler_country.Custom('GetRulerOrRegentTitle')|U] has agreed to receive the fleet's captain, but [target_ruler.GetHerHis] court is wary and [target_ruler.GetHerHis] merchants nervous. The air smells of black [ShowGoodsNameWithNoTooltip('pepper')] and the salt of a sea that has seen a thousand years of trade. Everything the voyage was for comes down to what is said in the next hour."
  cape_route_to_india_events.13.a: "Lay our finest goods before the [target_ruler_country.Custom('GetRulerOrRegentTitle')] and negotiate a trading post."
  cape_route_to_india_events.13.b: "Propose a treaty: fixed duties, guaranteed anchorage, mutual protection."
  cape_route_to_india_events.13.c: "Call the Arab merchants liars, and demand the [target_ruler_country.Custom('GetRulerOrRegentTitle')] choose."
  cape_route_to_india_events.13.d: "Our pilot knows this court. His counsel guides our opening words."
  cape_route_to_india_events.13.e: "Plant the #italic São Gabriel padrão#!, and let all see who reached this shore."
  cape_route_to_india_events.13.historical_info: "Кожикоде (відомий європейцям як Калікут) був найважливішим портом торгівлі прянощами в Індійському океані. Правив ним #italic самутірі#! (заморін, або Володар моря), який ретельно підтримував рівновагу між арабськими купцями, що панували в торгівлі, суперницькими індійськими державами та європейцями, які прибули пізніше. Перший прийом Васко да Гами в 1498 році був неоднозначним: його дарунки визнали вбогими, а арабські купці успішно зіпсували стосунки при дворі. Він відбув із невеликим і малоцінним вантажем. Лише в наступних плаваннях, підкріплених загрозою португальських гармат, вдалося домогтися справжніх торгових угод."
  cape_route_to_india_events.14.title: "Золотий Берег"
  cape_route_to_india_events.14.desc: "The forest begins a day's walk from the shoreline, and the path between coast and forest is well worn. Caravans arrive at the beach two, three times a week: porters carrying leather pouches of gold dust, ground from river gravels in the interior where the [ShowCultureName('akan')] kings control the washing sites and trade their surplus through a network of Wangara merchants that stretches back four centuries.\n\nThe [ROOT.GetCountry.GetAdjective] have heard of this place. Every Arab captain who traded along these shores spoke of the Gold Coast's markets as the most productive stretch of the Guinea littoral. The people here have seen foreign ships before. They are not afraid. They are calculating what the newcomers are worth."
  cape_route_to_india_events.14.a: "Build the São Jorge da Mina fort. The [ShowCultureNameWithNoTooltip('akan')] will sell to whoever holds it."
  cape_route_to_india_events.14.b: "Negotiate for captives the [ShowCultureNameWithNoTooltip('akan')] take as tribute in their wars."
  cape_route_to_india_events.14.c: "Storm the settlement before the Wangara merchants can depart."
  cape_route_to_india_events.14.d: "Note the trade volume and press south. There is no time to linger."
  cape_route_to_india_events.14.e: "Повернутися додому. Одного золота досить, щоб виправдати плавання."
  cape_route_to_india_events.14.historical_info: "У 1482 році португальці звели Сан-Жоржи-да-Міну (форт Ельміна) на Золотому Березі, використавши камінь, видобутий на сусідньому мисі, та колоди, заздалегідь заготовлені в Португалії й завантажені на кораблі навмисне для цього. Форт постав за лічені тижні — почасти завдяки перемовинам із місцевим вождем на ім’я Караманса, почасти завдяки зненацькості дій. Спершу він призначався для контролю над торгівлею золотом із лісовими царствами акан. За кілька десятиліть фортеця стала головним осередком атлантичної работоргівлі, приймаючи бранців із внутрішніх воєн і відправляючи їх на захід — на цукрові плантації Сан-Томе, а згодом до Бразилії. Історик Волтер Родні оцінював, що торгівля на Золотому Березі приносила Португалії кілька сотень тисяч золотих крузаду на рік, доки работоргівля не витіснила золото як головний товар."
  cape_route_to_india_events.15.title: "Острів Фернан-ду-По"
  cape_route_to_india_events.15.desc: "An island rises from the Gulf of Guinea: a volcanic peak trailing cloud from its summit, dense with jungle to the water's edge. The Bubi people who live here have seen no Europeans before. They watch from the tree line as the fleet drops anchor in a natural bay, and a boat is lowered.\n\nThe explorer who gave this island his name passed this way a generation ago and drew it roughly in the charts. The fleet's pilot has that chart. What it does not show is whether the island is worth stopping for."
  cape_route_to_india_events.15.a: "Establish a post here. The island sits astride the [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] trade."
  cape_route_to_india_events.15.b: "Plant a #italic padrão#!, record the island on our charts, and claim it for the Crown."
  cape_route_to_india_events.15.c: "Take on fresh water and continue south. The island offers nothing we need."
  cape_route_to_india_events.15.d: "Повернутися додому. [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] — довід достатній."
  cape_route_to_india_events.15.historical_info: "Острів Фернандо-По (сучасний Біоко) відкрив португальський мореплавець Фернан ду По близько 1472 року — він став першим європейцем, який побачив цей острів. Корінний народ бубі жив тут усамітнено впродовж століть, переселившись із материка задовго до того. Португальці використовували острів як перевалковий вузол, але не змогли закріпитися там надовго — почасти через тропічні хвороби, почасти через опір бубі будь-яким зв’язкам. У наступні століття острів неодноразово переходив із рук у руки; за договором в Ель-Пардо 1778 року Португалія поступилася ним Іспанії в обмін на територіальні поступки в Південній Америці, і зрештою він увійшов до складу сучасної Екваторіальної Гвінеї."
  cape_route_to_india_events.16.title: "Місто султана морів"
  cape_route_to_india_events.16.desc: "[ShowLocationName('mogadishu')] is larger than we expected. The harbor is busy with dhows from [ShowRegionName('arabia_region')] and $india$, their holds full of [ShowGoodsName('cloth')], [ShowGoodsName('copper')], and [ShowGoodsName('porcelain')]. [ShowLocationNameWithNoTooltip('mogadishu')] is ruled by a sultan who governs the trade between the [ShowCultureName('somali_culture')] interior and the wider ocean world. Merchants on the waterfront regard our ships with a calculating eye. We are not the first strangers to arrive here with strange sails and strange goods, but we may be the first to have come from so far west."
  cape_route_to_india_events.16.a: "Trade with the [ShowCultureNameWithNoTooltip('somali_culture')] merchants. Every contact here is worth making."
  cape_route_to_india_events.16.b: "Observe, record, and move north. We came to find $india$, not to linger here."
  cape_route_to_india_events.16.c: "Turn back. The route ahead is unknown and our provisions will not last."
  cape_route_to_india_events.16.historical_info: "Могадішо був одним із найдавніших і найбагатших міст східноафриканського узбережжя, з безперервною історією торгівлі, коріння якої сягало багатьох століть до приходу португальців. Арабські географи згадували його як значний порт уже в дев’ятому столітті. До часу походу да Гами містом правив султанат, що входив до торгової мережі Суахілійського узбережжя, яка пов’язувала внутрішні землі Африки з Аравією, Персією та Індійським субконтинентом. Рішення португальців оминати або схиляти ці суахілійські міста-держави до покори заради встановлення власної торгової монополії призвело їх до прямого зіткнення з уже наявною та вельми дієвою торговою системою."
  cape_route_to_india_events.17.title: "Ібадитський порт"
  cape_route_to_india_events.17.desc: "[ShowLocationName('masqat')] підіймається з червоних скель, а запах моря тут інший — сухіший, гостріший, із присмаком куряви та [ShowGoodsName('salt')] водночас. Гавань — одна з найкращих на [ShowProvinceDefinitionName('arabian_sea_province')], доволі глибока для великих кораблів і захищена від південно-західного мусону. Купці [ShowCultureName('omani_culture')] плавають до $india$ вже тисячу років. Люди на набережній знають шляхи, вітри та строки. Вони знають, коли виходити в море, а коли чекати. Вони дивляться на нас і гадають, чого ми хочемо."
  cape_route_to_india_events.17.a: "Seek an audience with the [ShowCultureNameWithNoTooltip('omani_culture')] authorities and announce our presence."
  cape_route_to_india_events.17.b: "Pay Arab navigators for their charts and knowledge of the crossing to $india$."
  cape_route_to_india_events.17.c: "Resupply quickly and leave. The [ShowCultureNameWithNoTooltip('omani_culture')] sailors are no friends of ours."
  cape_route_to_india_events.17.d: "Повернути назад. Перехід до $india$ нам не під силу."
  cape_route_to_india_events.17.historical_info: "Masqat (Muscat) was a principal port of the Ibadi Imamate of Oman, one of the major maritime powers of the western Indian Ocean. Omani sailors were among the most skilled navigators in the world, deeply familiar with the monsoon winds that governed crossing times between Arabia and the Indian subcontinent. The Portuguese arrival threatened the Omani role as intermediary in the spice trade, and relations between Portugal and Oman remained hostile for most of the sixteenth century, culminating in repeated wars for control of the Persian Gulf and East African ports. Oman eventually expelled the Portuguese from much of their East African network in the seventeenth century."
  cape_route_to_india_events.18.title: "The [por_feitoria_builder.GetAdjective|U] Have Built a [ShowBuildingTypeNameWithNoTooltip('por_feitoria')]"
  cape_route_to_india_events.18.desc: "Their ships arrived without warning, dropped anchor in the outer roads, and trained their guns on the harbor. The request was polite in form and absolute in substance. They wished to build a trading post. They would pay a small rent. They would respect local laws. What they did not say — what did not need saying — was what would happen if we refused. The timber was already cut and loaded in their holds. The post was raised in a matter of days. It flies the Portuguese cross now, where our own banner flew before."
  cape_route_to_india_events.18.a: "We have no choice. Their cannon speaks louder than our protests."
  cape_route_to_india_events.18.b: "Send a formal protest and demand they respect our sovereignty."
  cape_route_to_india_events.18.historical_info: "Португальська система фейторій стала одним із перших прикладів європейського торгового імперіалізму в Азії та Африці. Засновуючи укріплені торгові факторії у вже наявних гаванях, Португалія здобувала доступ до усталених торгових мереж, не зазнаючи витрат на повне територіальне завоювання. Місцеві правителі, які погоджувалися на такі умови, отримували доступ до португальських товарів і морський захист від суперників; ті ж, хто відмовлявся, зазнавали обстрілів. Ця система перетворила Індійський океан з порівняно відкритого торгового простору на простір, вибудуваний довкола португальського морського панування та торгової монополії Casa da Índia."
  cape_route_to_india_events.provisioned_tt: "The fleet is fully provisioned, and its crews will better withstand the long legs ahead"
  cape_route_to_india_events.supplies_up_tt: "The fleet's provisions are replenished"
  cape_route_to_india_events.supplies_down_tt: "The fleet's provisions run lower"
  cape_route_to_india_events.morale_up_tt: "Morale among the crews rises"
  cape_route_to_india_events.morale_down_tt: "Morale among the crews falls"
  cape_route_to_india_events.morale_crash_tt: "Morale collapses — the crews are pushed to the edge of mutiny"
  cape_route_to_india_events.ship_lost_tt: "A vessel is lost, and the expedition is reduced"
  cape_route_to_india_events.cargo_loaded_tt: "Трюми наповнюються вантажем [ShowGoodsName('pepper')] — що більше вцілілих повернеться з плавання, то багатшим буде привезений вантаж"
  cape_route_to_india_events.cargo_spent_tt: "The holds are lighter — the cargo spent to buy this favor will not be sold at journey's end"
  cape_route_to_india_events.19.title: "Морська недуга"
  cape_route_to_india_events.19.desc: "Починається все, як завжди, з ясен. Вони розм’якшуються, потім починають кровоточити, а згодом зуби хитаються у своїх лунках. Старі рани, загоєні багато років тому, знову відкриваються, немов завдані наново. Люди стають млявими, потім задихаються, а зрештою й геть не можуть підвестися з гамаків. У лікаря немає ради проти цього — ні в кого немає. Діжки із солоною рибою та поточеними довгоносиком сухарями, що підтримували флот упродовж пустельних морських миль, не містять нічого, що могло б зарадити лиху. Щоранку на переклику звучить усе менше голосів. Тіла, загорнуті у власні гамаки, ідуть за борт, а милі до найближчого дружнього берега тягнуться без жодного жалю."
  cape_route_to_india_events.19.a: "Ration the last of the preserved fruit and make what speed we can for land."
  cape_route_to_india_events.19.b: "Nothing to be done. Bury the dead; pray the living outlast the crossing."
  cape_route_to_india_events.19.b.tt: "Багато членів екіпажу не виживе — прибутки від плавання зменшаться"
  cape_route_to_india_events.19.historical_info: "Цинга, спричинена нестачею вітаміну C, була найстрашнішим убивцею моряків у добу далеких плавань. У першому плаванні Васко да Гами до $india$ зі ста сорока восьми людей загинули, за різними оцінками, дев’яносто троє — переважна більшість від цинги під час тривалих переходів далеко від свіжої їжі. Причину хвороби вдасться достеменно встановити лише через два з половиною століття; моряки та лікарі розуміли лише одне — свіжі харчі, і насамперед цитрусові, якимось чином стримують недугу, але це знання знову й знову відкривалося й забувалося."
  cape_route_to_india_events.20.title: "Південний шторм"
  cape_route_to_india_events.20.desc: "Барометр попереджав — якби хтось умів його читати: з південного заходу під ясним небом накочувалася довга важка хвиля. А потім небо перестало бути ясним. Вітер дужчав, і дужчав ще сильніше, зриваючи гребені хвиль і розкидаючи піну плиском по воді. Море здіймається до висоти, для якої ні в кого на борту немає слів — сіро-зелені стіни, помережані піною, підносять кораблі кормою вперед до стрімких хмар і кидають їх у провалля, де вітер раптом щухне, моторошно й нерухомо. Десь у пітьмі інші кораблі палять із гармат, щоб не загубити одне одного, але гуркіт майже миттєво тоне в ревінні стихії. Тепер немає іншого курсу, окрім того, що дозволить море."
  cape_route_to_india_events.20.a: "Hand the sails and heave to. We ride it out and trust the ships."
  cape_route_to_india_events.20.b: "Run before it under a scrap of canvas and pray we are not pooped."
  cape_route_to_india_events.20.b.win_tt: "Ризик виправдався — флот оминає найстрашніше в бурі"
  cape_route_to_india_events.20.b.lose_tt: "Море бере своє"
  cape_route_to_india_events.20.historical_info: "Води біля південного краю Африки, де тепла течія мису Голкового сходиться з холодними атлантичними хвилями, що йдуть із Південного океану, вважаються одними з найнебезпечніших у світі. Хвилі-вбивці, здатні поглинути великий корабель, фіксують там і донині. Для невеликих кораблів доби великих відкриттів — карак і каравел водотоннажністю в кілька сотень тонн — південноатлантична буря була смертельною загрозою, і шлях довкола мису недарма дістав свою першу назву — мис Бур."
  cape_route_to_india_events.21.title: "Безвітряне море"
  cape_route_to_india_events.21.desc: "Вітер ущухає опівдні й більше не повертається. Вітрила безсило повисають на щоглах, безпорадно ляскаючи в такт погойдуванню на хвилях. До другого дня море стає гладким, як скло — велетенське сліпуче дзеркало, що простягається до тремтливого від спеки обрію. Смола тане в палубних пазах. Вода в бочках стає теплою, зеленою й затхлою. Не залишається нічого іншого, окрім як чекати — чекати, дивитися на сонце, слухати рипіння шпангоутів і намагатися не рахувати, скільки харчів з’їдають люди, що стоять на місці. Моряки стиха оповідають про кораблі, які знаходили через роки дрейфуючими, чиї команди давно повмирали від спраги, виглядаючи вітер, якого так і не дочекалися."
  cape_route_to_india_events.21.a: "Чекати на вітер. Більше нічого не вдієш."
  cape_route_to_india_events.21.b: "Put the boats out and tow — anything is better than this stillness."
  cape_route_to_india_events.21.historical_info: "Екваторіальні штилі — так звані doldrums, або зона міжтропічної конвергенції — були сумнозвісною небезпекою атлантичного переходу до південної півкулі й назад. Вітрильний корабель міг застрягти там у мертвому штилі на дні або тижні, марнуючи харчі та воду й не просуваючись водночас ані на милю. Саме для того, щоб уникнути цієї смуги штилів і зустрічних вітрів, португальські мореплавці винайшли спосіб #italic volta do mar#! — великий маневр із виходом далеко на захід в Атлантику, майже до Бразилії, щоб упіймати попутні південні вітри, перш ніж повернути назад на схід до мису."
  cape_route_to_india_events.22.title: "Черв’як у корпусі"
  cape_route_to_india_events.22.desc: "Тесля виявляє це під час звичайного вимірювання трюмної води: свердло виходить м’яким, а коли він перевіряє обшивку нижче за ватерлінію, інструмент легко заходить у дерево, яке мало б бути твердим, як залізо. Корабельний черв’як. Тепла тропічна вода кишить цими істотами, і вони точать корпуси відтоді, як флот перетнув екватор — тисячі блідих ходів, що поточили деревину зсередини стільниками, непомітні доти, доки не підведе дошка або помпи вже не даватимуть ради. Якщо знехтувати цим, одного дня такий поточений корабель просто розійдеться по швах і піде на дно зі всією командою. Обличчя теслі промовляє до [target_leader.GetName] ще до того, як той встигає вимовити хоч слово."
  cape_route_to_india_events.22.a: "Careen the ships on the nearest strand and burn the worm from the timbers."
  cape_route_to_india_events.22.a.tt: "Кренгування потребує часу й грошей, але рятує флот"
  cape_route_to_india_events.22.b: "Розібрати найгірший корпус на припаси й дерево та покинути його."
  cape_route_to_india_events.22.c: "Рушити до дружньої гавані й провести належне лагодження."
  cape_route_to_india_events.22.c.tt: "Справжнє лагодження в безпечній гавані підносить дух флоту"
  cape_route_to_india_events.22.historical_info: "Корабельний черв’як #italic Teredo navalis#! — насправді зовсім не черв’як, а вид морського молюска — був лихом дерев’яних кораблів у теплих водах, здатним зруйнувати незахищений корпус за один сезон. Його згубна діяльність породила цілі століття засобів протидії: корпуси обшивали свинцем, покривали смолою та салом або робили подвійну обшивку з жертовним зовнішнім шаром. Проблема була настільки гострою на шляху до $india$, що португальці зрештою спорудили спеціальні місця для кренгування на своїх базах в Індійському океані, щоб очищати й лагодити корпуси між плаваннями."
  cape_route_to_india_events.24.title: "Заколот"
  cape_route_to_india_events.24.desc: "It has been coming for weeks — in the muttered conversations that stop when an officer approaches, in the sullen slowness with which orders are obeyed, in the looks. Now it comes into the open. A knot of men on the forecastle, one of them with a marlinspike in his fist, and behind them a crowd of others who have not yet decided which way they will jump. Their demands are the demands of frightened men who believe they have been led to their deaths: turn back, make for a Christian port, anything but sail on into an ocean that has already swallowed so many of their fellows. [target_leader.GetName] stands alone at the break of the quarterdeck. What [target_leader.GetSheHe] does in the next minute will decide whether there is a voyage left at all."
  cape_route_to_india_events.24.a: "Put the ringleaders ashore, and let the fainthearted go with them."
  cape_route_to_india_events.24.b: "Зустріти їх холодною сталлю. Корабель — не місце для демократії."
  cape_route_to_india_events.24.fight_win_tt: "Офіцери беруть гору, і лад відновлено"
  cape_route_to_india_events.24.fight_lose_tt: "Сутичка кривава, і флот розплачується за неї"
  cape_route_to_india_events.24.c: "Speak to them of $india$, of the riches that await, of the glory of the endeavor."
  cape_route_to_india_events.24.rouse_tt: "Слова [target_leader.GetNameWithNoTooltip] знову зміцнюють рішучість команди"
  cape_route_to_india_events.25.title: "Безлюдний берег"
  cape_route_to_india_events.25.desc: "Низький зелений берег підіймається з імли з підвітряного боку — ні диму, ні вітрила, ні сліду людської руки, лише ліс, що спускається до смуги прибою, а за ним — обіцянка прісної води та якоїсь дичини, яку здатна дати ця земля. На мапах тут нічого не позначено. Земля не належить нікому, вона невідома й може таїти в собі будь-що: привітні джерела та легке полювання, або лихоманку, або ворожий люд, що незримо спостерігає з-за дерев. Але бочки з водою майже порожні, а люди змарніли від голоду, і берег є берег."
  cape_route_to_india_events.25.a: "Send the boats ashore for water and whatever the land will yield."
  cape_route_to_india_events.25.b: "Too great a risk on an unknown coast. Note it on the chart and sail on."
  cape_route_to_india_events.26.title: "Берег, готовий до торгівлі"
  cape_route_to_india_events.26.desc: "Туттешній берег заселений, і його жителі не ворожі. Каное виходять назустріч флоту — спершу насторожено, потім дедалі сміливіше, показуючи рибу й садовину та вказуючи на узбережжя, де вже похапцем збирається щось на кшталт ринку. Той, хто володіє цим відтинком узбережжя, не плекає ворожості до чужинців, а вигляд флотських [ShowGoodsName('iron')] і [ShowGoodsName('cloth')], схоже, розпалив інтерес до торгівлі. Це саме той випадок, який так рідко випадає під час довгих порожніх переходів: місце, де можна наповнити бочки водою, придбати свіжих харчів і дати людям ступити на тверду землю серед тих, хто не бажає їм лиха."
  cape_route_to_india_events.26.a: "Barter [ShowGoodsNameWithNoTooltip('iron')] and [ShowGoodsNameWithNoTooltip('cloth')] for all the fresh provisions they will sell."
  cape_route_to_india_events.26.b: "Нам не до того, щоб гаяти дні. Наберемо тільки води й рушимо далі."
  cape_route_to_india_events.27.title: "Зниклі безвісти"
  cape_route_to_india_events.27.desc: "Останній корабель зник. Чи через море, чи через пошесть, чи відчай самих людей, чи ворожий берег — удома про це ніколи не дізнаються напевне. Відомо буде лише те, що флот, який вирушив у путь із такими урочистостями, не повернеться. Ані трюмів, повних [ShowGoodsName('pepper')]. Ані тріумфального повернення. Ані мап шляху до $india$. Десь на цій неозорій дузі океану, між берегом Африки та багатствами Сходу, виправа просто урвалася, і море зімкнулося над нею, наче її ніколи й не було. У Лісабоні родини чекатимуть місяці, а згодом і роки, перш ніж збагнуть правду."
  cape_route_to_india_events.27.a: "Нехай [ROOT.GetCountry.GetReligion.GetGodName] прийме їхні душі. Ми не скоро наважимося на це знову."
  cape_route_to_india_events.27.historical_info: "Морський шлях до $india$ було прокладено ціною немислимих людських жертв. Навіть успішні плавання нерідко забирали половину екіпажу та частину кораблів; невдалі ж зникали безслідно, не лишаючи нічого, крім того факту, що флот не повернувся. З-поміж кораблів, що в наступне століття намагалися пройти #italic Carreira da Índia#!, значну частину було втрачено безповоротно — розбившись біля берегів Африки, загинувши в штормах Південного океану чи просто зникнувши безвісти. Великі багатства, можливо, й потекли до Лісабона, але плата за них — потоплені й змарнілі від гарячки люди — була такою, що забувати про неї не можна."
  cape_route_to_india_events.28.title: "Висадка біля [ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]"
  cape_route_to_india_events.28.desc.empty: "Десять конусів чорної вулканічної породи здіймаються з байдужого моря, і жодна жива душа не мешкає на жодному з них. Ані диму, ані вітрила, ані стяга — лише морські птахи, вітер та кілька солонуватих джерел серед попелу. Старі мапи називають ці острови на ім’я, але жодна корона так і не заселила їх. Вони лежать просто на шляху наших вод, і [target_leader.GetName] розуміє їхню цінність так само ясно, як [target_leader.GetSheHe] знає [target_leader.GetHerHis] власне ім’я: той, хто володіє [ShowProvinceDefinitionName('cape_verde_province')], володіє брамою до [ShowContinentName('atlantic_ocean_continent')]. І цієї миті ними не володіє ніхто."
  cape_route_to_india_events.28.desc.foreign: "Another crown's banner snaps over the anchorage at [ShowLocationName('santiago')]. Someone reached these islands ahead of us and put down roots — a garrison, a battery, a harbormaster who rows out to ask our business in a tone that is courteous and unwelcoming in equal measure. The islands sit astride the very waters our route must cross; in a rival's hands they are a knife held to the throat of every voyage south. [target_leader.GetName] studies the fortifications from the rail, says nothing, and thinks a great deal."
  cape_route_to_india_events.28.a: "Claim the islands and raise a [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] — it must fly our flag."
  cape_route_to_india_events.28.b: "Put ashore for water and forage what little the islands offer."
  cape_route_to_india_events.28.c: "Ці острови не наші, щоб ними користуватися. Рушаймо далі на південь."
  cape_route_to_india_events.28.d: "Повернутися додому."
  cape_route_to_india_events.28.historical_info: "Острови Кабо-Верде були помічені португальськими мореплавцями близько 1456 року й заселені з 1462 року, а до того були цілком безлюдними. Їхнє розташування в середній частині Атлантики, де дмуть північно-східні пасати, зробило їх незамінним перевалковим вузлом для плавань навколо Африки та до Америки. Країна, що володіла Кабо-Верде, отримувала до своїх рук вузлову точку на всіх південних шляхах; невипадково Португалія взялася до заселення й укріплення островів у міру зростання своїх океанських прагнень."
  cape_route_to_india_events.29.title: "Кам’яний стовп"
  cape_route_to_india_events.29.desc.rafael: "The fleet has put in at the mouth of a broad, muddy river the pilots are already calling the [ShowLocationNameWithNoTooltip('quelimane')] — the River of Good Signs — for here, at last, the men have found what they crossed half the world to see: local craft rigged in the Arab fashion, traders who know the word for '$india$' and point east when they say it. The great crossing is near. In the hold lie the worked limestone pillars carried from home for exactly this purpose, each crowned with a cross and the royal arms. The carpenter asks whether to bring one ashore. To raise it is to plant a claim in stone and take on fresh water and wood while the masons work — but it will cost the fleet days it may not have."
  cape_route_to_india_events.29.desc.maria: "Тут біля берега лежать низькі острівці, зелені й добре зрошені, вкриті від хвиль, — та земля, яку стомлений флот цінує вище за золото. $india$ тепер уже близько; малабарський берег — за кілька днів плавання на південь. У трюмі чекає ще один вапняковий стовп, оздоблений і з написом ще до початку плавання, готовий проголосити, що кораблі нашої корони першими досягли цих вод. Установити його — означає залишити слід, який переживе всіх, хто зараз на борту, — але церемонія разом із кілюванням і поповненням запасів води затримає флот, поки змінюється пора року."
  cape_route_to_india_events.29.desc: "Тутешній берег варто відзначити. У трюмі лежить один з обтесаних вапнякових стовпів, узятих із дому, — увінчаний хрестом і королівським гербом, — призначений постати на мисі й проголосити, що наші кораблі пройшли тут першими. Звести його — справа врочиста й некваплива; флоту доведеться стояти на якорі, поки муляри встановлюють камінь."
  cape_route_to_india_events.29.a: "Звести #italic падран#! — нехай камінь і хрест позначать наш шлях."
  cape_route_to_india_events.29.b: "Не час для церемоній — поповнити запаси води, роздобути харчів і йти далі."
  cape_route_to_india_events.29.historical_info: "#italic Падран#! являв собою кам’яний стовп, увінчаний хрестом і гербом Португалії; його везли на борту вже готовим і встановлювали на щойно досягнутих берегах, щоб заявити про відкриття й суверенітет. За свідченням гуманіста Даміана де Гойша, флот Васко да Гами встановив п’ять таких стовпів під час плавання до $india$: #italic Сан-Рафаел#! на Річці Добрих Знамень, #italic Сан-Жоржи#! в Мозамбіку, #italic Ешпіріту-Санту#! в Малінді, #italic Санта-Марію#! на острівцях і #italic Сан-Габріел#! у Калікуті. Ці стовпи прийшли на зміну недовговічним дерев’яним хрестам колишніх плавань і були розраховані на віки; деякі з них простояли століттями."
  cape_route_to_india_events.30.title: "Плавання полишено"
  cape_route_to_india_events.30.a: "So be it. We return with what we have learned, if nothing else."
  cape_route_to_india_events.30.historical_info: "Не кожна португальська виправа вздовж африканського берега доходила кінцевої мети. Капітани незмінно зважували ризики невідомого переходу проти вже зібраних кораблів і людей, і безпечне повернення з неповними відомостями про нове узбережжя нерідко вважалося розважливішим рішенням. Такі плавання поволі поповнювали мапи, навіть якщо не досягали $india$, а накопичені за життя цілого покоління часткові відомості зрештою й уможливили повне плавання Васко да Гами."
  cape_route_to_india_events.14.a.owned: "Укріпити Сан-Жоржи-да-Міну — [ShowCultureNameWithNoTooltip('akan')] уже торгують через наші руки."
  cape_route_to_india_events.15.a.owned: "Укріпити нашу факторію тут — острів уже утримує нашу [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] торгівлю."
  cape_route_to_india_events.15.c.tt: "Корпуси кораблів очищені та просмолені — у цьому плаванні корабельний черв’як флоту не страшний"
  cape_route_to_india_events.3.a.owned: "Вкласти ще коштів в острів — [ShowLocationNameWithNoTooltip('sao_tome')] уже кориться нашому стягу."
  cape_route_to_india_events.31.a: "Дотримаємося умов — двір побурчить на чужоземну зброю, але стерпить."
  cape_route_to_india_events.31.b: "Викладімо все на папері: податки й права закріплені за обома коронами."
  cape_route_to_india_events.31.historical_info: "Не кожна фейторія зводилася під загрозою обстрілу. Султан Малінді, що давно ворогував із Момбасою, прийняв флот Васко да Гами як корисну противагу та надав лоцмана, який провів кораблі до Калікута. Малінді на десятиліття залишилося португальським союзником на суахілійському узбережжі, де спершу розташувалася португальська фейторія, а згодом і форт. Правителі, які вчасно пішли на змову, діставали доступ до португальських товарів і морський захист від власних ворогів, а дехто користався цим союзом, щоб звести давні рахунки. Такі угоди рідко бували рівноправними, але укладені добровільно трималися значно довше за ті, що були нав’язані силою."
  cape_route_to_india_events.31.title: "Португальці будують свою [ShowBuildingTypeNameWithNoTooltip('por_feitoria')]"
  cape_route_to_india_events.5.a.owned: "Розширити наш великий пост у [ShowLocationNameWithNoTooltip('luanda')] — йому не буде рівних на цьому узбережжі."
  cape_route_to_india_events.5.b.owned: "Розширити торгову факторію та склад, які в нас уже тут є."
  cape_route_to_india_events.8.a.morale_tt: "Бойовий дух команд значно зростає (#G +15#! до бойового духу екіпажу)"
  cape_route_to_india_events.8.b.morale_tt: "Бойовий дух команд трохи зростає (#G +8#! до бойового духу екіпажу)"
  cape_route_to_india_events.8.c.morale_tt: "Бойовий дух команд помітно зростає (#G +10#! до бойового духу екіпажу)"
  cape_route_to_india_events.9.a.owned: "Вкласти кошти в нашу торгову факторію в [ShowLocationNameWithNoTooltip('sofala')] — це золото зробить [ROOT.GetCountry.GetNameWithNoTooltip] багатою."
  cape_route_to_india_events.morale_crash_15_tt: "Бойовий дух падає — команда на межі бунту (#R -15#! до бойового духу екіпажу)"
  cape_route_to_india_events.morale_crash_20_tt: "Бойовий дух падає — команда на межі бунту (#R -20#! до бойового духу екіпажу)"
