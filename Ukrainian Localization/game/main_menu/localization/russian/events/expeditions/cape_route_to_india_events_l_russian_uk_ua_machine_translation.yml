  cape_route_to_india_events.morale_up_10_tt: "Бойовий дух команд міцніє (#G +10#! до бойового духу)"
  cape_route_to_india_events.morale_up_15_tt: "Бойовий дух команд міцніє (#G +15#! до бойового духу)"
  cape_route_to_india_events.morale_up_20_tt: "Бойовий дух команд міцніє (#G +20#! до бойового духу)"
  cape_route_to_india_events.morale_up_30_tt: "Бойовий дух команд міцніє (#G +30#! до бойового духу)"
  cape_route_to_india_events.morale_down_3_tt: "Бойовий дух команд слабшає (#G −3#! до бойового духу)"
  cape_route_to_india_events.morale_down_5_tt: "Бойовий дух команд слабшає (#G −5#! до бойового духу)"
  cape_route_to_india_events.morale_down_10_tt: "Бойовий дух команд слабшає (#G −10#! до бойового духу)"
  cape_route_to_india_events.morale_crash_15_tt: "Бойовий дух підірвано: команди на межі заколоту (#G −15#! до бойового духу)"
  cape_route_to_india_events.morale_crash_20_tt: "Бойовий дух підірвано: команди на межі заколоту (#G −20#! до бойового духу)"
  cape_route_to_india_events.ship_lost_tt: "Корабель втрачено, і флот поменшав (#R −1#! до числа кораблів)"
  cape_route_to_india_events.cargo_loaded_tt: "Трюми заповнені #TOOLTIP:GOODS,pepper,X #L перцем#!#!: що багатші вцілілі мандрівники, то більше вантажу вони привезуть додому."
  cape_route_to_india_events.cargo_spent_tt: "У трюмах стало вільніше: вантаж, витрачений на купівлю цієї прихильности, не буде продано до кінця мандрівки (#R −20#! до кількості вантажу)"
  cape_route_to_india_events.pilot_gained_tt: "До флоту приєднався досвідчений лоцман. Мудра порада цієї людини стане нам у пригоді під час перемовин з Калікутом."
  cape_route_to_india_events.19.title: "Спалах цинги"
  cape_route_to_india_events.19.desc: "Першими вона завжди вражає ясна. Вони м’якшають, починають кровоточити й тоншати. Старі, давно загоєні рани відкриваються знову. Людина слабне, у неї з’являється задишка, і незабаром вона вже не може звестися з ліжка. Корабельний лікар розводить руками. Він не знає, що діяти, — та й ніхто не знає. Чим лікувати нещасних моряків? Ну не солоною ж рибою та сухарями, поточеними довгоносиком! Щоранку під час переклички когось немає на місці. Тіла, загорнуті в парусину, скидають за борт. Шлях до найближчої землі видається нескінченним."
  cape_route_to_india_events.19.a: "Роздамо останні фрукти й помчимо до берега на всіх вітрилах."
  cape_route_to_india_events.19.b: "Вибору в нас немає. Поховаємо померлих і будемо молитися за живих."
  cape_route_to_india_events.19.b.tt: "Багато членів команди загине, а ви отримаєте менше прибутку від виправи"
  cape_route_to_india_events.19.historical_info: "Цинга — хвороба, спричинена нестачею вітаміну C, — була головною причиною смерті моряків у добу далеких плавань. За наявними оцінками, під час першої виправи Васко да Гами до Індії зі 148 членів команди загинуло 93 людини. Більшість померли від цинги під час тривалих переходів відкритим морем, далеко від джерел свіжих харчів. Справжня причина появи недуги залишалася невідомою ще два з половиною століття. Деякі лікарі та моряки помічали, що свіжі фрукти, особливо цитрусові, сповільнюють розвиток хвороби, але то були лише їхні особисті спостереження."
  cape_route_to_india_events.20.title: "Буря з півдня"
  cape_route_to_india_events.20.desc: "Стрілка барометра стрімко падає ліворуч, але ніхто не звертає на неї уваги. З південного заходу морем котиться важка бриж, і незабаром ясне небо затягується хмарами. Вітер зрізає гребені хвиль, розкидаючи клапті піни. Вище бортів здіймаються велетенські сіро-зелені вали, укриті білим шумовинням. Вони несуть кораблі кормою вперед до хмар, що біжать, а потім кидають їх у глибокі провалля, де завивання вітру змінюється моторошною тишею. Десь у пітьмі моряки палять із гармат, але звуки пострілів майже вмить заглушає ревіння моря. Робити нічого — доведеться віддатися на волю стихії."
  cape_route_to_india_events.20.a: "Приберемо вітрила й ляжемо в дрейф. Наші кораблі все витримають."
  cape_route_to_india_events.20.b: "Продовжимо шлях під штормовими вітрилами й будемо молитися, щоб нас не накрило хвилею."
  cape_route_to_india_events.20.b.win_tt: "Ризик виправдався: флот вийшов з осердя бурі"
  cape_route_to_india_events.20.b.lose_tt: "Флот опинився у владі моря"
  cape_route_to_india_events.20.historical_info: "Води біля узбережжя Південної Африки, де тепла Агульясова течія стикається з холодними хвилями Південного океану, вважаються одними з найнебезпечніших у світі. Тут і досі виникають велетенські хвилі-вбивці, здатні нищити великі кораблі. Для невеликих кораблів доби Великих географічних відкриттів, таких як карака та каравела водотоннажністю в кілька сотень тонн, шторм у Південній Атлантиці становив смертельну загрозу. Тому Агульяс раніше називали мисом Бур."
  cape_route_to_india_events.21.title: "Безвітряне море"
  cape_route_to_india_events.21.desc: "Опівдні вітер ущухає і настає мертвий штиль. Вітрила безсило звисають уздовж щогл, плескаючи, поки корабель ліниво перекочується з хвилі на хвилю. Під кінець другого дня море нагадує дзеркало: неозоре, зі сліпучою від сонця поверхнею, що розкинулося до самого небокраю і затягнуте серпанком спекотної імли. У палубних швах плавиться смола. Вода в бочках нагрівається, зеленіє та стає огидною на смак. Залишається лише спостерігати за палючим світилом, слухати рипіння корабельних балок і намагатися не думати про те, скільки харчів споживають люди, що потрапили в морську пастку. Моряки шепочуться про кораблі, які блукають океаном, чиї команди загинули від спраги, так і не дочекавшись рятівного вітру."
  cape_route_to_india_events.21.a: "Будемо чекати вітру. Інших варіантів у нас немає."
  cape_route_to_india_events.21.b: "Спускаємо човни на воду й беремо корабель на буксир. Усе ліпше, ніж слухати зловісну тишу."
  cape_route_to_india_events.21.historical_info: "Штилі в екваторіальній зоні затишшя, або внутрішньотропічній зоні конвергенції, становили велику небезпеку для кораблів, що перетинали Атлантичний океан у Південній півкулі. Вітрильні кораблі могли стояти без руху кілька днів і навіть тижнів, що призводило до збільшення витрат води та харчів. Щоб уникнути штилю й зустрічних вітрів, португальські моряки вигадали спосіб навігації, який отримав назву #italic вольта-ду-мар#!. Капітани робили великий гак на захід, майже допливали до Бразилії, щоб упіймати попутні вітри, а потім повертали на схід, до мису."
  cape_route_to_india_events.22.title: "Черви в корпусі"
  cape_route_to_india_events.22.desc: "Під час огляду трюмного колодязя тесля помічає щось недобре. Свердел виходить зі стіни, геть укритий пухкою тріскою, а під час перевірки обшивки нижче від ватерлінії знаряддя надто легко занурюється в деревину, зазвичай тверду як залізо. Корабельні черви. Теплі тропічні води кишать цими тварюками. Схоже, вони завелися на кораблях, коли ті перетнули екватор. Тисячі ходів у корпусі лишаються непоміченими, доки дошки не розсиплються або помпи не вийдуть із ладу. Якщо нічого не вдіяти, корабель розійдеться по швах і піде на дно. Тесля ще не вимовив жодного слова, а [target_leader.GetName] уже все розуміє."
  cape_route_to_india_events.22.a: "Треба покласти кораблі на бік і випалити червів."
  cape_route_to_india_events.22.a.tt: "Кренування потребує часу й грошей, але це єдиний спосіб урятувати флот."
  cape_route_to_india_events.22.b: "Заберемо з найбільш пошкодженого корабля всі припаси й деревину, після чого полишимо його в морі."
  cape_route_to_india_events.22.c: "Вирушимо до дружньої гавані. Там і полагодимо корабель."
  cape_route_to_india_events.22.c.tt: "Відпочинок у спокійній гавані підніме дух моряків"
  cape_route_to_india_events.22.historical_info: "Шашіль, або #italic Teredo navalis#!, — паразит, здатний знищити корабель у теплих водах лише за один сезон, — насправді ніякий не черв’як, а морський двостулковий молюск. Люди століттями шукали способів захиститися від нього: обшивали корпуси кораблів свинцевими листами, вкривали їх сумішшю смоли й тваринного жиру або споряджали подвійною обшивкою, буквально жертвуючи верхній шар на корм червам. Особливо тяжко доводилося кораблям, що тримали путь до Індії. Зрештою португальці почали зводити на своїх базах в Індійському океані споруди для кренування, щоби чистити й лагодити кораблі між плаваннями."
  cape_route_to_india_events.24.title: "Заколот"
  cape_route_to_india_events.24.desc: "Бунт стався не зненацька: невдоволення серед моряків визрівало тижнями. Вони перешіптувалися, озираючись на всі боки, і замовкали, коли наближалися офіцери. Не поспішали виконувати накази. Дивилися зухвало й із викликом. Тепер же все вихлюпнулося назовні. Бунтівники зібралися в носовому кубрику: хтось стискав у кулаці свайку, а найбільш нерішучі трималися позаду. Вони не розбійники: їхніми діями керує страх. Ці люди впевнені, що їх ведуть на вірну смерть, і тому вимагають, щоб капітан повернув назад, до #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ого#! порту. Вони готові на все, аби тільки не заходити вглиб відкритого океану, який погубив їхніх побратимів. [target_leader.GetName] стоїть біля краю кормової палуби. Зараз у руках цієї людини доля всієї команди."
  cape_route_to_india_events.24.a: "Висадимо заводіїв на берег, а малодушних відпустимо."
  cape_route_to_india_events.24.b: "Поговоримо з ними мовою зброї. Нічого розводити демократію."
  cape_route_to_india_events.24.fight_win_tt: "Офіцери беруть гору, лад відновлено"
  cape_route_to_india_events.24.fight_lose_tt: "Люди гинуть у сутичці, нічого доброго це не віщує"
  cape_route_to_india_events.24.c: "Розповімо їм про Індію. Хто не мріє про багатство та славу?"
  cape_route_to_india_events.24.rouse_tt: "[target_leader.GetNameWithNoTooltip] виголошує натхненну промову"
  cape_route_to_india_events.25.title: "Безлюдний берег"
  cape_route_to_india_events.25.desc: "З підвітряного боку з туману виринає низький зелений берег. Схоже, він геть безлюдний: ми не бачимо ані диму, ані кораблів, ані інших слідів людської присутності. Густий ліс спускається до самої смуги прибою. Можливо, тут ми знайдемо прісну воду та якусь живність. Цієї землі немає на мапі — вона нічия, незвідана. Тут на нас може чекати що завгодно: чисті джерела та всіляка дичина або ж лихоманка й ворожі тубільці, які вже стежать за нами з-за дерев. Але вибору немає: запаси води добігають кінця, а голодні й знесилені моряки ледве тримаються на ногах."
  cape_route_to_india_events.25.a: "Відрядимо човни з моряками по воду та припаси."
  cape_route_to_india_events.25.b: "Ризик надто великий. Позначимо землю на мапі й рушимо далі."
  cape_route_to_india_events.26.title: "Торгівля на березі"
  cape_route_to_india_events.26.desc: "На узбережжі ми бачимо тубільців, які, здається, налаштовані приязно. Коли кораблі підходять ближче, від берега відчалюють каное. Люди показують нам рибу та садовину — спершу нерішуче, згодом уже сміливіше. Біля води виникає стихійний торг. Вочевидь, місцеві не бажають ворогувати з нами, адже їх цікавлять наші #TOOLTIP:GOODS,iron,X #L залізо#!#! та #TOOLTIP:GOODS,cloth,X #L тканини#!#!. Тепер ми можемо наповнити бочки, запастися харчами й дати морякам спочити на твердій землі, де їм ніщо не загрожує. Коли ще нам випаде така нагода?"
  cape_route_to_india_events.26.a: "Обміняємо залізо та тканини на свіжі харчі."
  cape_route_to_india_events.26.b: "У нас немає часу. Наповнимо бочки водою — і в путь."
  cape_route_to_india_events.27.title: "Зниклі в морі"
  cape_route_to_india_events.27.desc: "Останній корабель згинув у дорозі. Ніхто не знає, що стало його згубою: стихія, хвороба, розпач чи ворожий клинок. Відомо лише одне: флотилія, що так урочисто відпливала від берега, вже не повернеться. Не буде ані трюмів, забитих #TOOLTIP:GOODS,pepper,X $tt_op_L$перцем$tt_cl_2$, ані тріумфального прийому, ані мап із новим шляхом до Індії. Десь між Африкою та Азією море зімкнулося над кораблями виправи. Вони зникли в безодні, немовби їх ніколи й не було. У Лісабоні рідні моряків чекатимуть своїх синів і чоловіків, доки не збагнуть гіркої правди."
  cape_route_to_india_events.27.a: "Хай упокоїть [ROOT.GetCountry.GetReligion.GetGodName] їхні душі. Ми ще не скоро зважимося на нову виправу."
  cape_route_to_india_events.27.historical_info: "Відкриття морського шляху до Індії було пов’язане з великими втратами. Навіть під час успішних плавань капітани нерідко втрачали половину команди та частину кораблів. Учасники невдалих виправ зникали безслідно. За наступне століття чимало кораблів, що йшли шляхом #italic Carreira da Índia#!, розбилися біля берегів Африки, потонули під час штормів у Південному океані або просто зникли безвісти. Ці мандрівки принесли Лісабону незліченні багатства, але забрали життя безлічі людей: хтось згинув у безодні, хтось згас від недуги. Про ці жертви не можна забувати."
  cape_route_to_india_events.28.title: "Благословенні острови Зеленого Мису"
  cape_route_to_india_events.28.desc.empty: "Над байдужим морем височіють десять конусів із чорної вулканічної породи. Ані стяг, ані корабель, ані дим із димарів не порушують цей похмурий краєвид. Тут немає нічого, крім птахів, вітру, попелу та парочки джерел із солонуватою водою. Ніхто навіть не намагався тут оселитися. Проте [target_leader.GetName] чудово розуміє, наскільки важливі ці острови. [ShowProvinceDefinitionName('cape_verde_province')] — ключ до #TOOLTIP:CONTINENT,atlantic_ocean_continent,X $tt_op_L$Атлантики$tt_cl_2$, і зараз у цього ключа немає володаря."
  cape_route_to_india_events.28.desc.foreign: "Над якірною стоянкою [ShowLocationName('santiago')] майорять #L [rival_owner.GetAdjective|l]і$tt_cl_1$ знамена. Судячи з залоги та батареї, [rival_owner.GetName] уже тут. Ми запізнилися. Портовий доглядач пливе до нас на човні, щоб дізнатися про мету нашого візиту. Він розмовляє ґречно, але в його словах відчувається ворожість. Наш шлях пролягає прямісінько повз острови. У руках ворога вони подібні до ножа, приставленого до горла капітана кожного корабля, що прямує на південь. [target_leader.GetName] стоїть біля леєра і мовчки оглядає укріплення."
  cape_route_to_india_events.28.a: "Завоюємо острови та збудуємо фейторію під нашим стягом."
  cape_route_to_india_events.28.b: "Висадимося на берег, щоб набрати води та поповнити запаси."
  cape_route_to_india_events.28.c: "Ці острови належать не нам. Рушаймо далі на південь."
  cape_route_to_india_events.28.d: "Повертаймося додому."
  cape_route_to_india_events.28.historical_info: "Острови Зеленого Мису відкрили португальці приблизно в 1456 році, а заселяти їх почали тільки в 1462 році. Вони розташовані посеред Атлантичного океану, де дмуть північно-східні пасати. Це робить їх чудовим перевалковим вузлом для тих, хто пливе до Америки та вздовж узбережжя Африки. Країна, що захопила острови, здобувала контроль над важливим стратегічним вузлом усіх південних шляхів. З цієї причини португальці, які прагнули панування на морі, почали зміцнювати їх і колонізувати."
  cape_route_to_india_events.29.title: "Кам’яний стовп"
  cape_route_to_india_events.29.desc.rafael: "Флот зупинився у у місцевості [ShowLocationNameWithNoTooltip('quelimane')], у гирлі широкої та каламутної річки, яку лоцмани вже встигли охрестити «Річкою добрих знамень». Саме тут мандрівники знайшли те, заради чого подолали пів світу: споряджений на #TOOLTIP:CULTUREGROUP,arabian_group,X #L арабський#!#! кшталт корабель і купців, які, почувши слово «Індія», впевнено вказують на схід. Наша мета вже близько: лишилося тільки перетнути Аравійське море. У трюмі лежать привезені з батьківщини вапнякові колони, увінчані хрестами та королівськими гербами. Тесляр запитує, чи варто винести одну з них на берег. Звівши її тут, ми заявимо про свої домагання на цю землю, а заодно встигнемо набрати прісної води та деревини для лагодження кораблів, поки працюватимуть каменярі. Утім, на все це потрібен час, якого у флоту й так обмаль."
  cape_route_to_india_events.29.desc.maria: "Неподалік від берега розкинулося безліч острівців, багатих на зелень та прісну воду, а також добре захищених від великих хвиль, що для пошарпаного в дорозі флоту є справжнім даром небес. Індія вже поруч: малабарський берег лише за кілька днів плавання на південь. У трюмі лежить чергова вапнякова колона, заготовлена ще до початку мандрівки та прикрашена символами нашої країни. Звівши її тут, ми заявимо про свою першість у цих водах і залишимо на місцевих берегах незгладимий слід, що переживе кожного з нас. Проте ця урочистість разом із лагодженням кораблів та набиранням прісної води для подальшого плавання безсумнівно забере у флоту дорогоцінний час."
  cape_route_to_india_events.29.desc: "Ці береги варті того, щоб стати частиною нашої корони. На щастя, в трюмі лежить привезена з батьківщини вапнякова колона, увінчана хрестом і королівським гербом. Такі стовпи встановлюють на мысах, щоб кожен корабель, що проходить повз, знав, що наш флот побував тут першим. Зведення колони — це завжди врочиста подія, яка вимагає чимало часу, а отже, флоту доведеться стояти в гавані доти, доки каменярі не закінчать роботу."
  cape_route_to_india_events.29.a: "Встановимо тут #italic падран#!. Нехай він засвідчить наш прохід."
  cape_route_to_india_events.29.b: "У нас немає часу на церемонії. Збираємо припаси та відчалюємо."
  cape_route_to_india_events.29.historical_info: "#italic Падрани#! — це кам’яні стовпи, увінчані хрестами та королівськими гербами Португалії. Їх виготовляли заздалегідь і вантажили на кораблі, а потім моряки встановлювали їх на далеких берегах на знак того, що їхня країна першою відкрила та привласнила цю землю. Згідно з хроніками гуманіста Даміана де Гойша, флот Васко да Гами звів п’ять таких стовпів дорогою до Індії: #italic Сан-Рафаел#! на річці Добрих Знамень, #italic Сан-Жорже#! у Мозамбіку, #italic Ешпіріту-Санту#! в Малінді, #italic Санта-Марія#! на однойменних островах і #italic Сан-Габріел#! у Калікуті. Ці стовпи прийшли на зміну недовговічним дерев’яним хрестам, які використовували в раніших виправах. Деякі з таких падранів простояли не одне століття."
  cape_route_to_india_events.30.title: "Перервана виправа"
  cape_route_to_india_events.30.desc: "Наказ віддано, і хоча ніхто його не оскаржує, дехто з моряків зітхає з полегшенням, тоді як на обличчях інших видно розчарування. Корабель розвертається. Незвідані береги позаду поступово віддаляються, а довгий і добре знайомий шлях додому тільки починається. Ми не привеземо із собою ані мапи Індії, ані вантажів #TOOLTIP:GOODS,pepper,X $tt_op_L$перцю$tt_cl_2$, а літописці так і не напишуть про те, як ми відкрили морський шлях на схід. Утім, наші кораблі цілі, а команда жива й здорова, тож їхнє повернення до рідної гавані — лише питання часу.\n\n[target_leader.GetName] довго й замислено оглядає обрій позаду, перш ніж повернутися до своїх обов’язків на кораблі."
  cape_route_to_india_events.30.a: "Що ж, повертаймося з тими скромними знаннями, які встигли здобути."
  cape_route_to_india_events.30.historical_info: "Не кожна португальська виправа вздовж африканського узбережжя досягала своєї мети. Капітани ретельно зважували небезпеки й у разі сумнівів нерідко повертали флот назад, лише частково дослідивши нові береги. Хоч їм і не вдавалося дістатися Індії, такі подорожі все ж приносили користь, потроху доповнюючи мапи новими землями та шляхами. Саме накопичені під час таких виправ досвід і знання зрештою дозволили Васко да Гамі відкрити морський шлях із Португалії до Індії."
  cape_route_to_india_events.31.title: "Португальці засновують свою фейторію"
  cape_route_to_india_events.31.desc: "Їхній капітан зійшов на берег із дарами, а не з гарматами. Протягом трьох днів усі умови було узгоджено: ми маємо надати їм ділянку узбережної землі під #TOOLTIP:BUILDING_TYPE,por_feitoria,X #L фейторію#!#!, а вони — сплатити за неї оренду; до того ж будь-які суперечки між нами вирішуватимуть наші суди, а їхній флот муситиме боронити гавань від наших ворогів. Вони вивантажили з трюму заздалегідь відміряну деревину і за лічені дні звели свій торговий пост.\n\nТепер поруч із нашим стягом над берегом має й #L [por_feitoria_builder.GetAdjective|l]ий#!, а кораблів до нього прибуває за тиждень більше, ніж прибуло за минуле століття. Можливо, в майбутньому наші онуки зі злістю згадуватимуть цю угоду, проте сьогодні вигода очевидна: ми здобули порох, тканини й сильного союзника, а вони отримали натомість лише клапоть землі для комори та корабельні."
  cape_route_to_india_events.31.a: "Двір обурюватиметься, але ми виконаємо свою частину домовленості."
  cape_route_to_india_events.31.b: "Закріпимо умови оренди на папері, щоб уникнути непорозумінь."
  cape_route_to_india_events.31.historical_info: "Не кожну фейторію заснували під загрозою обстрілу з корабельних гармат. Наприклад, султан Малінді, який багато років ворогував із правителями Момбаси, заручився допомогою флоту Васко да Гами та натомість надав йому свого лоцмана, який допоміг мореплавцеві дістатися Калікута. Як наслідок, місто Малінді кілька десятиліть залишалося головним союзником Португалії на суахілійському узбережжі, де спершу звели торговий пост, а згодом і фортецю. Так правителі, які добровільно домовлялися з португальцями, отримували доступ до їхніх товарів і могли сподіватися на їхню військову допомогу, чим дехто користався для зведення давніх рахунків. Такі угоди рідко були справедливими для тубільців, проте вони діяли значно довше за ті, що були нав’язані силою."