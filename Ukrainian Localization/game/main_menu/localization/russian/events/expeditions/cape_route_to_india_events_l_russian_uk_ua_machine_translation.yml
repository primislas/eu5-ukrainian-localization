l_russian:
  cape_route_to_india_events.1.title: "Флот виходить у море"
  cape_route_to_india_events.1.desc: "Наші води не бачили такого флоту вже ціле покоління. Чотири кораблі, сто сімдесят людей, запас #TOOLTIP:GOODS,salt,X #L солі#!#!, #TOOLTIP:GOODS,fish,X #L риби#!#! та твердих сухарів на роки вперед — і наказ від [Select_CString(ROOT.GetCountry.GetGovernment.GetRulerOrRegent.IsFemale, 'правительки', 'правителя')] [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetHerselfHimself] — відшукати морський шлях до Індії. Священники благословляють кораблі. Юрба тиснеться біля самої води. Хтось плаче.\n\n[target_leader.GetName] стоїть на носі, коли кораблі проходять мілину і виходять у відкритий #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L Атлантичний океан#!#!. Позаду [Select_CString(target_leader.IsFemale, 'неї', 'нього')] гавань перетворюється на білу цятку на зеленому пагорбі. Перед [Select_CString(target_leader.IsFemale, 'нею', 'ним')] океан простягається без меж у всі боки. [target_leader.GetSheHe|U] [Select_CString(target_leader.IsFemale, 'зробила', 'зробив')] усі розрахунки. [target_leader.GetSheHe|U] знає, чого вимагає це плавання. Чи вистачить цього — як завжди, в руках [ROOT.GetCountry.GetReligion.GetGodName]."
  cape_route_to_india_events.1.a: "Якщо того воліє [ROOT.GetCountry.GetReligion.GetGodName|U], ми повернемося з трюмами, повними прянощів."
  cape_route_to_india_events.1.b: "Помолімося — а тоді вирушаймо в дорогу з усією квапливістю."
  cape_route_to_india_events.1.historical_info: "Португальська виправа для пошуку морського шляху до Індії стала наслідком майже ста років поступового просування на південь уздовж африканського узбережжя. У 1488 році Бартоломеу Діаш обігнув мис Доброї Надії, довівши, що шлях до Індії можливий. Плавання Васко да Гами в 1497–1499 роках завершило почате — його кораблі повернулися додому з вантажем перцю та прянощів, вартість виправи окупилася в шістдесят разів. Ця подорож докорінно змінила світову торгівлю прянощами, поклавши край венеційсько-османській монополії на суходільні торгові шляхи."
  cape_route_to_india_events.2.title: "Острови [ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]"
  cape_route_to_india_events.2.desc: "Десять вулканічних островів, що здіймаються з плаского й безликого моря: таким є архіпелаг [ShowProvinceDefinitionName('cape_verde_province')]. Флот знав, чого очікувати, і все ж ці острови приносять полегшення — тверда земля після тижнів відкритого океану. Осідок намісника в #TOOLTIP:LOCATION,santiago,X #L Сантьяго#!#! — скромна будівля з побіленого каменю. У гавані пахне сіллю, в’яленою рибою і ледь помітно — лишайником орсейль, зішкрябаним зі скель для фарби.\n\n[target_leader.GetName] зважує вибір. [ROOT.GetCountry.GetName] утриму[ROOT.GetCountry.Custom('end_yeyut')] ці острови вже десятиліттями, але «утримує» — надто щедре слово: невелика залога, кілька поселенців, щорічний корабель із припасами. Якщо цьому шляху судилося важити бодай щось для майбутнього [ROOT.GetCountry.Custom('CL_GEN')], острови мають стати чимось більшим, ніж просто перевалковий вузол."
  cape_route_to_india_events.2.a: "Вкладімося тут — заснуємо осаду, яка стане опорою нашого південного морського шляху."
  cape_route_to_india_events.2.b: "Поповнити запаси, набрати свіжої води та вирушити далі."
  cape_route_to_india_events.2.c: "Іти далі — ми не можемо дозволити собі зволікати так рано."
  cape_route_to_india_events.2.d: "Повернутися додому."
  cape_route_to_india_events.2.historical_info: "Острови Кабо-Верде відкрили португальські мореплавці близько 1456 року, а постійно заселені вони були з 1462 року. Завдяки їхньому розташуванню в Атлантиці — на шляху північно-східних пасатів — вони стали найважливішим перевалковим вузлом для плавань до Південної Америки та довкола Африки. Їхнє стратегічне значення значно зросло після того, як плавання Васко да Гами довело можливість шляху через Індійський океан. До шістнадцятого століття вони перетворилися на важливий осередок атлантичної работоргівлі."
  cape_route_to_india_events.3.title: "Острів [ShowLocationNameWithNoTooltip('sao_tome')]"
  cape_route_to_india_events.3.desc_common: "Спека сповіщає про себе перш ніж покажеться берег: волога, задушлива стіна спадає на палубу в ту саму мить, коли флот перетинає екватор, змушуючи людей задихатися в повітрі, яке ніколи не стає прохолоднішим. [ShowLocationName('sao_tome')] здіймається з ранкового туману, немов темно-зелена корона: дві вершини, повиті хмарами, та водоспади, що пробиваються крізь ліс, настільки густий, що світло не сягає землі."
  cape_route_to_india_events.3.desc: "$cape_route_to_india_events.3.desc_common$\n\nНевелике поселення тулиться до західного берега. Тутешній ґрунт, за словами поселенців, надзвичайно родючий. Усе, що посадиш, росте. На цьому острові можна заробити статки на цукрі — якщо знайдеться, ким обробляти цю землю."
  cape_route_to_india_events.3.desc.uninhabited: "$cape_route_to_india_events.3.desc_common$\n\nЗ жодного берега не підіймається дим. У жодній бухті не чекає човен. Острів зовсім безлюдний — шлюпки флоту першими торкаються цього узбережжя. І все ж ґрунт там, де можна вирубати джунглі, чорний, глибокий і безмежно родючий. На такому острові можна заробити статки на цукрі — якщо знайдеться, ким обробляти цю землю, і якщо екваторіальна лихоманка не забере робітника дочасно."
  cape_route_to_india_events.3.desc.foreign: "$cape_route_to_india_events.3.desc_common$\n\nПоселення вже притулилося до західного берега під чужим стягом — корабельні, капличка, перші сирі очеретяні поля [rival_owner.GetAdjective|l]их поселенців, які дісталися цього родючого острова раніше, ніж [ROOT.GetCountry.GetName]. Ґрунт тут настільки ж багатий, як і обіцяли розповіді, але земля вже зайнята. Усе, що нам потрібно від [ShowLocationNameWithNoTooltip('sao_tome')], тепер доведеться брати — або виторговувати — з рук [rival_owner.Custom('CL_GEN')]."
  cape_route_to_india_events.3.a: "Заснувати торговельну фейторію — можливості цього острова варті вкладень."
  cape_route_to_india_events.3.a.owned: "Вкласти більше в цей острів — [ShowLocationNameWithNoTooltip('sao_tome')] уже скоряється нашому стягу."
  cape_route_to_india_events.3.b: "Встановити #italic padrão#! та заявити права на острів від імені корони."
  cape_route_to_india_events.3.c: "Набрати прісної води та йти на південь."
  cape_route_to_india_events.3.d: "Повернутися додому."
  cape_route_to_india_events.3.historical_info: "Сан-Томе був безлюдним, коли близько 1470 року туди прибули португальські мореплавці. Його екваторіальний клімат виявився згубним для європейських поселенців — смертности від хвороб була високою, — але надзвичайно сприятливим для вирощування цукрової тростини. До 1520-х років Сан-Томе став найбільшим у світі виробником цукрової тростини, яку вирощували майже виключно поневолені африканці. Згодом острів перетворився на великий перевалковий вузол атлантичної торгівлі невільниками — роль, яку він зберігав понад два століття."
  cape_route_to_india_events.4.title: "Гирло великої річки"
  cape_route_to_india_events.4.desc: "Океан тут стає бурим. Флот спостерігає за цим уже добу — колір перетікає в море з півдня, чайного відтінку й густий від намулу. Потім моряки бачать причину: річка, ширша за будь-яку [ROOT.GetCountry.Custom('preposition_uv')] [ROOT.GetCountry.Custom('CL_PREP')], ширша за все, що вони будь-коли бачили, впадає у [ShowContinentName('atlantic_ocean_continent')] бурим потоком, що забарвлює море на багато кілометрів навсібіч.\n\nЗ мангрових заростей з’являються човни-довбанки. Вони величезні — видовбані з єдиного стовбура, тридцять футів завдовжки, і ними веслує дюжина людей у цілковитій злагоді. Чоловіки, що стоять на носах, беззбройні. Вони спостерігають за флотом зі спокійною цікавістю людей, які ніколи не боялися чужинців."
  cape_route_to_india_events.4.a: "Домогтися прийому у великого правителя цієї землі."
  cape_route_to_india_events.4.b: "Виміняти слонову кістку, мідь і все інше, що вони запропонують."
  cape_route_to_india_events.4.c: "Нанести гирло річки на мапу й квапитися на південь — не можна зволікати."
  cape_route_to_india_events.4.d: "Повернутися додому."
  cape_route_to_india_events.4.historical_info: "Королівство Конго було одним із найрозвиненіших політичних утворень Африки на південь від Сахари, що контролювало території на землях сучасних Конго, Анголи та Габону. Маніконго (король) правив через ієрархічне чиновництво та підтримував розвинений устрій провінційного врядування. У 1480-х роках португальські місіонери встановили зв’язок із королівством, поклавши початок відносинам, які виявляться доленосними — а зрештою катастрофічними — для обох сторін. У 1490-х роках королівство прийняло християнство, і маніконго взяв собі ім’я Жуан I."
  cape_route_to_india_events.5.title: "Бухта [ShowLocationNameWithNoTooltip('luanda')]"
  cape_route_to_india_events.5.desc: "Кожен офіцер виправи впізнає це в ту саму мить, як бачить. Ніхто з моряків не зустрічав такої гавані ніде на африканському узбережжі: довга вигнута затока, захищена з південного заходу природною піщаною косою, глибока вода біля самого берега, а за нею — низький мис із видом на всі боки. Місцеві рибалки називають його Луанда — пласке місце.\n\n[target_leader.GetName] проходить уздовж усієї піщаної коси у вечірньому світлі: затока з одного боку і відкритий [ShowContinentName('atlantic_ocean_continent')] з іншого. [target_leader.GetSheHe|U] вже думає про мури. Про свіжу воду. Про число кораблів, які залога тут могла б захистити — або перехопити. Місто, розбудоване тут, могло б тримати під контролем усю торгівлю південної Атлантики."
  cape_route_to_india_events.5.desc.owned: "Флот підходить до бухти, чия цінність їм добре відома: над #TOOLTIP:LOCATION,luanda,X #L Луандою#!#! вже майорять барви #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, а її довга піщана коса дає прихисток кораблям, підпорядкованим нашій короні.\n\n[target_leader.GetName] іде вздовж коси у світлі полуденного сонця — з одного боку бухта, з іншого відкритий [ShowContinentName('atlantic_ocean_continent')], — думаючи не про те, чи варто зайняти ці землі, а про те, скільки ще вони можуть дати. Укріплене як належить, місто тут могло б тримати під контролем усю торгівлю південної Атлантики."
  cape_route_to_india_events.5.a: "Звести тут велику [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] — їй не буде рівних."
  cape_route_to_india_events.5.a.owned: "Розбудувати нашу велику факторію в Луанді — жодна на цьому узбережжі не зрівняється з нею."
  cape_route_to_india_events.5.b: "Заснувати тут невелику торгову факторію та склад."
  cape_route_to_india_events.5.b.owned: "Розширити торгову факторію та склад, які в нас уже тут є."
  cape_route_to_india_events.5.c: "Ретельно позначити це місце на мапах і пливти далі на південь."
  cape_route_to_india_events.5.d: "Повернутися додому."
  cape_route_to_india_events.5.historical_info: "Луанда була офіційно заснована як португальська колонія 1575 року Паулу Діашем де Новайшем, що робить її одним із найстаріших європейських поселень в Африці південніше Сахари. Її природна гавань понад чотири століття слугувала головним портом португальської Анголи. Починаючи з XVI століття Луанда стала основним осередком відправлення трансатлантичної торгівлі рабами в південній Африці, звідки мільйони поневолених людей вирушали до Бразилії та на Кариби."
  cape_route_to_india_events.6.title: "Пустельне узбережжя"
  cape_route_to_india_events.6.desc: "Тут пустеля підходить до самого моря: червоні дюни здіймаються просто від лінії прибою, і з їхніх гребенів у повітря зривається пісок. Дерев немає. Прісної води не видно. Узбережжя на північ — люди вже називають його [ShowLocationName('skeleton_coast')] через китові кістки, що біліють на березі, — не виявляє слідів людського житла на сотні миль у будь-який бік.\n\nІ все ж бухта спокійна. Захищена від найсильніших хвиль, вона дає флоту змогу полагодити пошкоджену щоглу й наповнити бочки солонуватою водою з джерела серед дюн. На мисі над бухтою штурман корабля вимірює кут сонця своїми приладами й робить записи. Мис, за його словами, лежить не далі як за тиждень плавання на південь. Дехто з моряків хреститься."
  cape_route_to_india_events.6.a: "Підбадьорити людей — Мис Доброї Надії вже близько. Уперед!"
  cape_route_to_india_events.6.b: "Ці течії та вітри багато про що скажуть мореплавцю — дозвольте мені розгадати їх."
  cape_route_to_india_events.6.c: "Нехай люди перепочинуть тут. Їм знадобляться сили для прийдешніх бур."
  cape_route_to_india_events.6.d: "Повернутися додому — це узбережжя занадто безлюдне, щоб іти далі."
  cape_route_to_india_events.6.historical_info: "Узбережжя Намібії було відоме португальським морякам як #italic Costa dos Esqueletos#! (Берег Скелетів) через безліч кісток китів і тюленів, а також уламків кораблів, викинутих на підвітряний берег потужними південно-західними вітрами. Волфіш-Бей, названа голландцями #italic Walvischbaai#! (Китова бухта), була однією з небагатьох захищених якірних стоянок на цьому ворожому відтинку узбережжя. Бартоломеу Діаш зупинявся тут 1488 року під час свого плавання на південь."
  cape_route_to_india_events.7.title: "Мис Бур"
  cape_route_to_india_events.7.desc: "Ніщо за три місяці плавання не підготувало їх до цього. Буря налітає без попередження, з південного заходу, женучи перед собою хвилі заввишки сорок футів. Головний корабель шугає у провалля між хвилями і не з’являється добрих тридцять секунд. Снасті зриваються. Людей збиває з такелажу. [target_leader.GetName] обома руками чіпляється за кормовий борт і дивиться на безлад довкола себе, і десь у цьому ревінні вітру й розбурханих вод [target_leader.GetSheHe] розуміє: вони пройшли. Мис — великий південний край африканського континенту, межа відомого світу — лишився за кормою.\n\nШлях до $india$ відкрито."
  cape_route_to_india_events.7.a: "Назвати його мисом Доброї Надії та без зволікань рушати на схід!"
  cape_route_to_india_events.7.b: "Сховатися під захистом мису, доки не вщухне шторм."
  cape_route_to_india_events.7.d: "З нас досить — ми обійшли мис. Повертаємо додому."
  cape_route_to_india_events.7.historical_info: "Бартоломеу Діаш уперше обігнув мис у 1488 році, назвавши його #italic Cabo das Tormentas#! («Мис Бур»). Згідно з португальськими джерелами, король Жуан II перейменував його на #italic Cabo da Boa Esperança#! («Мис Доброї Надії»), щоб заохотити майбутні виправи, хоча ця оповідь може бути апокрифічною. Цей мис не є найпівденнішою точкою Африки — ця честь належить мису Голковому, що лежить приблизно за двісті кілометрів на схід, — але він позначає місце зустрічі Атлантичного та Індійського океанів і відкриває браму на схід."
  cape_route_to_india_events.8.title: "Бухта Пастухів"
  cape_route_to_india_events.8.desc: "Бухта спокійна й прекрасна, захищена від південного заходу низьким мисом. Молочні дерева дають жаданий затінок уздовж берега. А на схилі пагорба над пляжем — худоба. Вгодована, здорова худоба пасеться величезними отарами, за якими доглядають високі люди в охрі та скляному намисті, що спостерігають за флотом із безпечної відстані відтоді, як він став на якір.\n\nДехто з моряків мало не плаче при виді свіжого м’яса. Вони харчувалися солоною рибою та сухими коржами вже кілька тижнів. Нарешті один із пастухів спускається до води й стоїть там, спостерігаючи, доки капітан флоту не сідає в шлюпку й не підпливає до нього. Відбувається обмін, у якому беруть участь кільця з #TOOLTIP:GOODS,copper,X #L міді#!#!, сушена риба та чимало терплячих жестів. До заходу сонця три голови худоби вже в трюмі. Мукання для кожного на флоті звучить найпрекраснішою музикою, яку вони коли-небудь чули."
  cape_route_to_india_events.8.a: "Виміняти [ShowGoodsNameWithNoTooltip('copper')|l] та [ShowGoodsNameWithNoTooltip('cloth')|l] на худобу; встановити #italic padrão#!."
  cape_route_to_india_events.8.a.morale_tt: "Бойовий дух команд значно міцнішає (#G +15#! до бойового духу)"
  cape_route_to_india_events.8.b: "Встановити кам’яний #italic padrão#! та заявити права на ці землі для [ROOT.GetCountry.Custom('CL_GEN')]."
  cape_route_to_india_events.8.b.morale_tt: "Бойовий дух команд дещо міцнішає (#G +8#! до бойового духу)"
  cape_route_to_india_events.8.c: "Дати людям перепочити й відновити сили тут, перш ніж вирушати на північ."
  cape_route_to_india_events.8.c.morale_tt: "Бойовий дух команд помітно міцнішає (#G +10#! до бойового духу)"
  cape_route_to_india_events.8.d: "Повернутися додому."
  cape_route_to_india_events.8.historical_info: "Мосселбай був відомий португальським морякам як #italic Bahia dos Vaqueiros#! (бухта Пастухів), а пізніше — як #italic Aguada de São Brás#! (Водопій Святого Власія). Бартоломеу Діаш встановив тут кам’яний #italic padrão#! 1488 року, а звичай цей продовжив Васко да Гама в 1497-му. Місцеві койкої спочатку охоче торгували з обома виправами, але згодом стали ворожими — людей Васко да Гами закидали камінням, коли ті спробували набрати прісної води без належної плати."
  cape_route_to_india_events.9.title: "Золотий порт [ShowLocationNameWithNoTooltip('sofala')]"
  cape_route_to_india_events.9.desc: "Гавань [ShowLocationName('sofala')] повна дау. Це не ті малі рибальські човни, до яких флот звик уздовж південного узбережжя; це океанські кораблі з #TOOLTIP:REGION,arabia_region,X #L Аравії#!#! та #TOOLTIP:REGION,persia_region,X #L Персії#!#!, що глибоко осіли у воді під вагою #TOOLTIP:GOODS,ivory,X #L слонової кістки#!#!, чорного дерева та #TOOLTIP:GOODS,cloth,X #L тканин#!#!. На набережній купці ведуть справи [ShowLanguageName('arabic_language')|l]ою мовою та [location.GetDominantCulture.GetLanguage.GetName]ою говіркою — якої жоден із тлумачів флоту не може розпізнати. Дрібки золотого піску переходять з рук у руки за сувої індійської бавовни.\n\nАрабські купці, які віками панували в цій гавані, спостерігають за прибуттям [ROOT.GetCountry.GetAdjective|l]ого флоту з-під навісів своїх комор. Їхні обличчя годі розібрати, але мова тіла красномовна: поява цих чужинців з їхніми залізними гарматами та хрестами, намальованими на вітрилах, навряд чи є втішною новиною. Капітан флоту помічає найбільші комори, розташування стоянок дау, глибину води при вході до бухти."
  cape_route_to_india_events.9.a: "Заснувати велику фейторію — це золото збагатить [ROOT.GetCountry.Custom('CL_ACC')]."
  cape_route_to_india_events.9.a.owned: "Вкласти кошти в нашу факторію в Софалі — це золото збагатить [ROOT.GetCountry.Custom('CL_ACC')]."
  cape_route_to_india_events.9.b: "Виміняти золотий пісок і довідатися, що криється в глибинних землях."
  cape_route_to_india_events.9.c: "Зібрати відомості та рушати далі — час дорогий."
  cape_route_to_india_events.9.d: "Повернутися додому."
  cape_route_to_india_events.9.historical_info: "Софала була найпівденнішим визначним портом суахілійської торгової мережі, що контролював доступ до золотоносного царства #italic Мутапа #! (Великого Зімбабве) на плато на заході. Арабські купці вели тут торгівлю щонайменше з десятого століття. Португальці захопили Софалу в 1505 році, зруйнувавши арабську торгову мережу та спробувавши спрямувати торгівлю золотом власними каналами — з мінливим успіхом, оскільки значна частина торгівлі просто перемістилася глибше у внутрішні землі, поза їхньою досяжністю."
  cape_route_to_india_events.10.title: "Острів [ShowLocationNameWithNoTooltip('mozambique')]"
  cape_route_to_india_events.10.desc: "Невеликий острів, не більше трьох кілометрів від краю до краю, відділений від суходолу вузькою протокою, якраз достатньо глибокою, щоб пропускати морські кораблі. На острові височіє кам’яна торгова осада під зеленим стягом, а гавань переповнена дау з усіх кінців #TOOLTIP:CONTINENT,indian_ocean_continent,X #L Індійського океану#!#!. [ShowGoodsName('ivory')] та чорне дерево стікаються сюди з глибини суходолу, з материка женуть невільників та невільниць, з півдня надходить [ShowGoodsName('copper')|l], а з країв $india$ та $china$ прибувають [ShowGoodsName('cloth')|l] та [ShowGoodsName('porcelain')|l] — і все це переходить з рук у руки в торговій мережі, що діє вже шість століть.\n\n[target_ruler_country.Custom('GetRulerOrRegentTitle')] [Select_CString(target_ruler.IsFemale, 'багата й підозрілива', 'багатий і підозріливий')]. [ShowCultureGroupName('arabian_group')]і купці, які прибули раніше за флот, попередили [target_ruler.GetHerHis], що чужинці — це [ROOT.GetCountry.GetReligion.GetAdjective]і пірати, які нищать усе, чого не можуть украсти. [target_ruler.GetHeShe|U] приймає посланця флоту з настороженою ґречністю, в оточенні озброєної варти, і ставить безліч запитань про озброєння. [target_ruler.GetHerHis|U] власне становище в самісінькому серці гавані, оточеній гарматними позиціями, не назвеш зручним з [ROOT.GetCountry.GetAdjective|l]ого погляду."
  cape_route_to_india_events.10.a: "Підкупити правителя ([target_ruler_country.Custom('GetRulerOrRegentTitle')]) крамом із нашого трюму й викупити право будувати тут."
  cape_route_to_india_events.10.b: "Домовитися про торгові права через дипломатію та дарунки."
  cape_route_to_india_events.10.c: "Перехитрити арабських купців — запропонувати правителю ([target_ruler_country.Custom('GetRulerOrRegentTitle')]) умови, з якими ті не зрівняються."
  cape_route_to_india_events.10.d: "Поки що зважити на становище, яке займає [target_ruler_country.Custom('GetRulerOrRegentTitle')], і рушити далі на північ."
  cape_route_to_india_events.10.f: "Встановити #italic Сан-Жоржі падрáн#!."
  cape_route_to_india_events.10.e: "Повернутися додому."
  cape_route_to_india_events.10.historical_info: "Острів Мозамбік став найважливішою базою Португалії у Східній Африці, офіційно заснованою в 1507 році. Форт Сан-Себастьян, збудований у XVI столітті, лишається однією з найстаріших збережених європейських фортифікаційних споруд в Африці на південь від Сахари. Острів слугував урядовою столицею Португальської Східної Африки та перевальним пунктом на шляху до $india$ понад два століття. Його захоплення фактично знищило арабський контроль над північною частиною торгової мережі суахілійського узбережжя."
  cape_route_to_india_events.11.title: "Пастка біля [ShowLocationNameWithNoTooltip('mombasa')]"
  cape_route_to_india_events.11.desc: "Вхідний канал #TOOLTIP:LOCATION,mombasa,X #L Момбаси#!#! вузький, не більше двох кабельтових завширшки, а по обидва береги тягнеться височина. Поки флот проходить крізь нього, люди починають відчувати недобре: на набережній товпляться чоловіки з надмірною безтурботністю важко озброєних людей, яким наказали вдавати беззбройних, дау стоїть на якорі в дивному місці, перекриваючи вихід із каналу, а посланець, якого відрядив [target_ruler_country.Custom('GetRulerOrRegentTitle')|l], підіймається на флагман з пишною церемонією, дарунками й аж надто багатьма запитаннями про число озброєних людей на борту.\n\nТієї ж ночі перекладач, що служить на флоті, прослизає до капітанської каюти. Перш ніж повернутися на берег, посланець, якого відрядив [target_ruler_country.Custom('GetRulerOrRegentTitle')|l], говорив зі своїми супутниками[location.GetDominantCulture.GetLanguage.GetName|l]ою мовою — говіркою, яку цей чоловік розуміє. Слова були недвозначні: флоту не дадуть вийти покинути поселення [ShowLocationNameWithNoTooltip('mombasa')]."
  cape_route_to_india_events.11.a: "Тихо піти до світанку — гостинність цієї людини не варта такого ризику."
  cape_route_to_india_events.11.b: "Залишитися і спробувати торгувати, попри явне напруження."
  cape_route_to_india_events.11.c: "Якщо вони замислили зраду, ми вдаримо першими — підготувати людей."
  cape_route_to_india_events.11.d: "Повернутися додому — ми не ризикуватимемо флотом тут."
  cape_route_to_india_events.11.historical_info: "Васко да Гама ледь не потрапив у засідку в Момбасі у квітні 1498 року. Згідно з португальськими хроніками, місцеві лоцмани, призначені султаном, намагалися посадити флот на мілину. Да Гама відступив перш ніж пастка закрилася. У наступні десятиліття португальці неодноразово поверталися, аби бомбардувати та грабувати Момбасу. Форт Ісус, зведений у 1593 році, остаточно закріпив португальський контроль над гаванню — хоча місто було захоплене оманцями в 1698 році після тривалої облоги."
  cape_route_to_india_events.12.title: "Приязний [target_ruler_country.Custom('GetRulerOrRegentTitle')|U]"
  cape_route_to_india_events.12.desc: "Усе в [ShowLocationName('malindi')] зовсім не схоже на те, що траплялося раніше. [target_ruler.GetName], [target_ruler_country.Custom('GetRulerOrRegentTitle')|l], спускається до гавані [target_ruler.GetHimHerself], [Select_CString(target_ruler.IsFemale, 'вбрана', 'вбраний')] у білий та зелений шовк, у супроводі музик, які грають на інструменті, чиєї музики ніхто з [ROOT.GetCountry.GetAdjective|l]их мореплавців досі не чув. [target_ruler.GetSheHe|U] вже знає про флот від своїх вивідувачів на півдні й [Select_CString(target_ruler.IsFemale, 'чекала', 'чекав')] на їхнє прибуття.\n\nУ [Select_CString(target_ruler.IsFemale, 'неї', 'нього')] є дарунок, що коштує дорожче за слонову кістку: [target_ruler.GetHerHim] служить чоловік, який ходив до Калікута дванадцять разів. Чоловік, який знає кожну течію, кожен риф, кожну зміну вітру між цими берегами та Малабарським узбережжям. Який знає, коли південно-західний мусон домчить корабель через #TOOLTIP:CONTINENT,indian_ocean_continent,X #L Індійський океан#!#! за три тижні, а коли потопить той самий корабель за двадцять чотири години. Ім’я лоцмана, пояснює [target_ruler.GetNameWithNoTooltip], важко передати європейською мовою. Але знання його передати легко, а ціна цим знанням — дружба."
  cape_route_to_india_events.12.a: "Ми з радістю приймемо і [Select_CString(target_ruler.IsFemale, 'її', 'його')] лоцмана, і [Select_CString(target_ruler.IsFemale, 'її', 'його')] дружбу."
  cape_route_to_india_events.12.b: "[target_ruler_country.Custom('GetRulerOrRegentTitle')] отримає від нас дарунки, допомогу й захист."
  cape_route_to_india_events.12.c: "[ROOT.GetCountry.GetReligion.GetGodName|U] чекає від нас звершень. Помолімося ж перед відплиттям!"
  cape_route_to_india_events.12.e: "Зведімо #italic падран Ешпіріту-Санту#! та розпочнімо велику справу."
  cape_route_to_india_events.12.d: "Повернімося додому: до Калікута далеко, а мандрівка обіцяє бути небезпечною."
  cape_route_to_india_events.12.historical_info: "Через давню ворожнечу з Момбасою султан Малінді був прихильним до португальців, сподіваючись, що вони допоможуть йому здобути перевагу в затяжній боротьбі. Особа знавця Індійського океану, наданого Васко да Гамі (у португальських джерелах він відомий як Малемо Канака), довгі століття залишалася предметом наукових суперечок. Дехто з істориків вважає, що це Ахмад ібн Маджид — найвидатніший арабський лоцман XV століття, автор низки праць про перетин Індійського океану. Інші рішуче відкидають цю теорію і вважають, що йдеться про гуджаратського купця. Ким ця людина була насправді, невідомо й досі."
  cape_route_to_india_events.13.title: "Калікут — столиця прянощів"
  cape_route_to_india_events.13.desc: "[ShowLocationName('kozhikode')] більше, ніж [ROOT.GetCountry.GetCapital.GetName]. У цьому порту стільки кораблів, що й годі злічити: тут стоять кораблі з #TOOLTIP:REGION,arabia_region,X #L Аравії#!#!, #TOOLTIP:REGION,persia_region,X #L Персії#!#!, #TOOLTIP:AREA,gujarat_area,X #L Гуджарату#!#!, #TOOLTIP:REGION,bengal_region,X #L Бенгалії#!#!, Китаю, #TOOLTIP:LOCATION,malacca,X #L Малакки#!#! та з острова #TOOLTIP:AREA,java_area,X #L Ява#!#!. #TOOLTIP:GOODS,pepper,X #L Перець#!#!, кориця, кардамон і #TOOLTIP:GOODS,cloves,X #L гвоздика#!#! мають воістину чарівну привабливість! Флот кидає якорі на рейді, вже заставленому дау, а #TOOLTIP:CULTUREGROUP,arabian_group,X #L аравійські#!#! купці спостерігають за цим рухом із берега.\n\nЦілих два місяці [target_ruler_country.Custom('GetRulerOrRegentTitle')|l] — [Select_CString(target_ruler.IsFemale, 'правителька', 'правитель')] Калікута, що рідко полишає свій пишний осідок, — чує, що прибульці — зовсім не купці, а пірати з холодної півночі. [target_ruler_country.Custom('GetRulerOrRegentTitle')|U] [Select_CString(target_ruler.IsFemale, 'погодилася', 'погодився')] прийняти капітана з далеких країв, однак [Select_CString(target_ruler.IsFemale, 'її', 'його')] [target_ruler_country.GetGovernment.GetCourtTitle|l] залишається насторожі, а [Select_CString(target_ruler.IsFemale, 'її', 'його')] купці помітно нервують. У тутешньому повітрі витають пахощі чорного перцю та морської солі: торгові кораблі борознять ці води вже тисячу років. Доля виправи вирішиться в найближчу годину."
  cape_route_to_india_events.13.a: "Нехай [target_ruler_country.Custom('GetRulerOrRegentTitle')|l] оцінить наш крам, а потім попросимо про факторію."
  cape_route_to_india_events.13.b: "Виголосимо вимоги: сталі мита, захист і безпечна стоянка."
  cape_route_to_india_events.13.c: "Звинуватимо аравійських купців у брехні. Нехай [target_ruler_country.Custom('GetRulerOrRegentTitle')|l] обирає."
  cape_route_to_india_events.13.d: "Дослухаймося до поради лоцмана. Він і [target_ruler_country.GetGovernment.GetCourtTitle|l] — давні знайомі."
  cape_route_to_india_events.13.e: "Виставимо #italic падран Сан-Ґабріела#! на загальний огляд."
  cape_route_to_india_events.13.historical_info: "Порт Кожикоде, який європейці називали Калікутом, був одним із найважливіших осередків торгівлі прянощами в Індійському океані. Правив ним #italic самутірі#! — «володар морів», також відомий як заморін. Він підтримував рівновагу між аравійськими купцями, які відігравали провідну роль у торгівлі, індійськими князівствами-суперниками та — згодом — гостями з Європи. Перший прийом Васко да Гами в 1498 році минув неоднозначно: його дарунки визнали недостатньо цінними, а аравійські купці зуміли налаштувати двір проти нього. Зрештою капітан полишив гавань лише з невеликим і незначним вантажем. Вигідної співпраці вдалося досягти лише під час наступних виправ і після погроз застосувати проти іншої сторони корабельні гармати."
  cape_route_to_india_events.14.title: "Золотий Берег"
  cape_route_to_india_events.14.desc: "Ліс розташований за день ходи від узбережжя, і цією дорогою ходять доволі часто. Два-три рази на тиждень на берег прибувають каравани: робітники переносять золотий пісок, видобутий із річкового гравію у внутрішніх землях. #TOOLTIP:CULTURE,$akan_tt$, #L Аканські#!#! королі тримають під владою розсипні родовища й продають надлишки золота через вангарську торгову мережу, якій виповнилося вже чотири століття.\n\nПіддані #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! багато чули про це місце. Будь-який #TOOLTIP:CULTUREGROUP,arabian_group,X $tt_op_L$аравійський$tt_cl_2$ капітан, якому доводилося тут торгувати, називав ринки Золотого Берега найбагатшими на всьому узбережжі Гвінеї. Місцеві жителі звикли до чужоземних кораблів і не бояться чужинців: їх цікавить лише можливий зиск."
  cape_route_to_india_events.14.a: "Зведімо форт Сан-Жоржі-да-Міна, і акани торгуватимуть із його комендантом."
  cape_route_to_india_events.14.a.owned: "Зміцнімо форт Сан-Жоржі-да-Міна: акани вже торгують із нашою країною."
  cape_route_to_india_events.14.b: "Домовимося про бранців, яких акани беруть як воєнну данину."
  cape_route_to_india_events.14.c: "Нападемо на поселення, поки вангарські купці не відбули."
  cape_route_to_india_events.14.d: "Подумаємо згодом, а поки рушаймо на південь. Зволікати не можна."
  cape_route_to_india_events.14.e: "Повернімося додому. Що ще потрібно, крім золота?"
  cape_route_to_india_events.14.historical_info: "У 1482 році португальці звели на Золотому Березі форт Сан-Жоржи-да-Міна, також знаний як фортеця Елміна. Матеріалами послужили камінь, видобутий на сусідньому мисі, а також деревина, заготовлена в Португалії та доставлена морем. Споруду звели всього за кілька тижнів: почасти завдяки домовленості з місцевим вождем Карамансою, почасти просто через поспіх. Від початку завдання форту полягало в нагляді за торгівлею золотом з аканськими лісовими королівствами, однак за кілька десятиліть фортеця перетворилася на головний осередок торгівлі невільниками в Атлантичному океані: сюди доправляли бранців, захоплених у місцевих війнах. Згодом їх відправляли на захід: на цукрові плантації острова Сан-Томе, а пізніше — Бразилії. Історик Волтер Родні підрахував, що торгівля із Золотим Берегом приносила португальцям кілька сотень тисяч крузадо на рік, доки невільники не витіснили золото з позиції головного товару."
  cape_route_to_india_events.15.title: "Острів Фернандо-По"
  cape_route_to_india_events.15.desc: "З вод Гвінейської затоки здіймається острів: це вулканічний пік, увінчаний хмарами й густо порослий джунглями, що спускаються до самісінької води. Тут живе народ #TOOLTIP:CULTURE,$bubi_tt$, #L бубі#!#!, зроду не бачив європейців. Ховаючись за деревами, місцеві жителі спостерігають, як флот зупиняється в природній бухті, а моряки спускають човен на воду.\n\nМандрівник, на честь якого названо острів, побував тут кілька десятиліть тому й лише в загальних рисах наніс його на мапу. У лоцмана ця мапа є, але на ній не зазначено, чи варто взагалі зупинятися в цьому місці."
  cape_route_to_india_events.15.desc.owned: "Острів і досі височіє над хвилями: це вулканічний пік, увінчаний хмарами й густо порослий джунглями, що спускаються до самої води. Проте над стоянкою кораблів уже майорить португальський стяг, а наш флот зустрічають співвітчизники на човнах.\n\nТепер [target_leader.GetName] може не гадати, чи варто тут зупинятися. Питання в тому, яку ще користь можна мати з цього оплоту [ROOT.GetCountry.Custom('CL_GEN')], що тримає під наглядом торгівлю в Гвінейській затоці."
  cape_route_to_india_events.15.a: "Заснуємо на острові форпост і відатимемо торгівлею в Гвінейській затоці."
  cape_route_to_india_events.15.a.owned: "Зміцнимо форпост на острові: ми вже взяли під контроль торгівлю в Гвінейській затоці."
  cape_route_to_india_events.15.b: "Зведемо #italic падран#!, нанесемо острів на мапу й привласнимо його собі."
  cape_route_to_india_events.15.c: "Полагодимо днища, наповнимо бочки та запасемося харчами."
  cape_route_to_india_events.15.c.tt: "Корпуси чистять і смолять, тож у цій виправі корабельні деревоточці флоту не страшні"
  cape_route_to_india_events.15.d: "Повернімося додому. Зрештою, Гвінейську затоку ми дослідили."
  cape_route_to_india_events.15.historical_info: "У 1472 році португальський мореплавець Фернан ду По став першим європейцем, який дістався острова Фернандо-По, нині відомого як Біоко. Народ бубі, що самотньо мешкав тут століттями, прибув сюди з материка значно раніше. Португальці використовували острів як перевалковий вузол, але заснувати постійне поселення їм не вдавалося: почасти через тропічні пошесті, а почасти через те, що бубі відмовлялися йти на зближення. У наступні століття Біоко кілька разів переходив з рук у руки: так, у 1778 році за договором в Ель-Пардо Португалія поступилася островом Іспанії в обмін на земельні поступки в Південній Америці. Зрештою він увійшов до складу сучасної Екваторіальної Гвінеї."
  cape_route_to_india_events.16.title: "Місто морського султана"
  cape_route_to_india_events.16.desc: "[ShowLocationName('mogadishu')] більше, ніж ми очікували. Міська гавань заповнена індійськими та #TOOLTIP:REGION,arabia_region,X #L аравійськими#!#! дау: їхні трюми вгинаються під #TOOLTIP:GOODS,cloth,X #L тканинами#!#!, #TOOLTIP:GOODS,copper,X #L міддю#!#! та #TOOLTIP:GOODS,porcelain,X #L порцеляною#!#!. [ShowLocationNameWithNoTooltip('mogadishu')] править [target_owner.Custom('GetRulerOrRegentTitle')|l]: ця людина, яку призначає [target_owner.GetName], керує торгівлею між #TOOLTIP:CULTURE,$somali_culture_tt$,X #L сомалійцями#!#! та зовнішнім світом. Купці, що зібралися на пристані, пильно розглядають наші кораблі. Ми не перші чужинці, які прибули сюди під незнайомими знаменами й з дивовижним крамом, але, можливо, з таких далеких західних земель сюди ще ніхто не діставався."
  cape_route_to_india_events.16.a: "Торгуватимемо із сомалійськими купцями. Для нас важливі будь-які зв’язки."
  cape_route_to_india_events.16.b: "Поспостерігаймо й рушаймо на північ. Зрештою, наша ціль — $india$."
  cape_route_to_india_events.16.c: "Повернімо назад. Шлях нам невідомий, а харчі добігають кінця."
  cape_route_to_india_events.16.historical_info: "Могадішо було одним із найстаріших і найбагатших приморських міст Східної Африки. Його розгалужені торгові зв’язки почали зароджуватися за століття до прибуття португальців: на аравійських мапах воно значилося як великий порт уже в IX столітті. За часів Вашку да Ґами Могадішо перебувало під владою султанату й належало до торгової мережі Суахілійського узбережжя, яка пов’язувала Африку з Аравією, Персією та Індійським краєм. Намір португальців оминути ці міста-держави або підкорити їх силою задля встановлення власної торгової монополії спричинив пряме протистояння з наявним й до того ж вельми дієвим торговим устроєм."
  cape_route_to_india_events.17.title: "Ібадитський порт"
  cape_route_to_india_events.17.desc: "[ShowLocationName('masqat')] височіє над червоними скелями, і море тут пахне інакше: його запах сухіший і гостріший, у ньому відчувається #TOOLTIP:GOODS,salt,X #L сіль#!#! з домішкою пилу. Ця гавань — одна з найкращих в #TOOLTIP:PROVINCE_DEFINITION,arabian_sea_province,X #L Аравії#!#!: тутешні води достатньо глибокі для великих кораблів, а рельєф надійно береже місто від південно-західного мусону. #TOOLTIP:CULTURE,$omani_culture_tt$,X #L Оманські#!#! купці торували шлях до Індії ще тисячу років тому. Людям на пристані достеменно відомі всі вітри, строки та шляхи. Вони знають, коли виходити в море, а коли ліпше почекати. Вони дивляться на нас, намагаючись угадати наші наміри."
  cape_route_to_india_events.17.a: "Розшукаймо оманську владу й відрекомендуймося їй."
  cape_route_to_india_events.17.b: "Придбаймо мапи до Індії в аравійських лоцманів."
  cape_route_to_india_events.17.c: "Поповнімо запаси й відпливемо. Оманські моряки нам не друзі."
  cape_route_to_india_events.17.d: "Повернемо назад. Подорож до Індії нам не під силу."
  cape_route_to_india_events.17.historical_info: "Маскат був головним портом ібадитського імамату Оман — однієї з найбільших морських держав у західній частині Індійського океану. Оманські моряки чудово знали морські шляхи та розклад мусонних вітрів, адже від цього залежала тривалість мандрівок між Аравією та Індійським макрорегіоном. Прибуття португальців поставило під удар посередницьку роль оманців у торгівлі прянощами: відносини цих двох народів залишалися напруженими протягом майже всього XVI століття, і зрештою протистояння вилилося в низку воєн за контроль над Перською затокою та східноафриканськими портами. У XVII столітті оманці витіснили португальців із більшості своїх осередків у Східній Африці."
  cape_route_to_india_events.18.title: "Португальці звели фейторію"
  cape_route_to_india_events.18.desc: "Португальці заскочили нас зненацька. Вони кинули якорі на зовнішньому рейді та навели гармати на гавань. Їхнє прохання, ввічливе за формою, по суті було беззаперечним. Вони хочуть збудувати факторію. Вони згодні сплачувати невеликий податок. Вони поважатимуть місцеві закони. Вони не згадали, що станеться, якщо ми їм відмовимо, але цього й не було потрібно. Деревину португальці заготовили заздалегідь і привезли в трюмах. Факторію звели за лічені дні. Тепер там, де раніше майорів наш стяг, височіє #L [por_feitoria_builder.GetAdjective|l]ий#! хрест."
  cape_route_to_india_events.18.a: "У нас немає вибору: проти гармат не підеш."
  cape_route_to_india_events.18.b: "Ми протестуємо: наш суверенітет слід поважати."
  cape_route_to_india_events.18.historical_info: "Португальська система фейторій стала одним із перших прикладів європейського торгового імперіалізму в Африці та Азії. Будівництво укріплених купецьких поселень у чужих портах дало змогу португальцям проникнути у вже сформовані торгові мережі, не витрачаючи сил на повноцінні завоювання. Якщо місцеві правителі приставали на умови, їм надавали доступ до португальських товарів і забезпечували захист від ворогів із моря, якщо відмовлялися — у хід ішли гармати. Таким чином, Індійський океан із порівняно вільного торгового простору перетворився на вотчину португальського флоту, фактично на монополію компанії «Каса-да-Індія»."
  cape_route_to_india_events.provisioned_25_tt: "Флот повністю забезпечений припасами, і команди легше переноситимуть подальшу подорож (#G +25#! до харчів)"
  cape_route_to_india_events.provisioned_30_tt: "Флот повністю забезпечений припасами, і команди легше переноситимуть подальшу подорож (#G +30#! до харчів)"
  cape_route_to_india_events.provisioned_40_tt: "Флот повністю забезпечений припасами, і команди легше переноситимуть подальшу подорож (#G +40#! до харчів)"
  cape_route_to_india_events.supplies_up_10_tt: "Припаси флоту поповнено (#G +10#! до харчів)"
  cape_route_to_india_events.supplies_up_15_tt: "Припаси флоту поповнено (#G +15#! до харчів)"
