l_russian:
  cape_route_to_india_events.1.title: "Флот виходить у море"
  cape_route_to_india_events.1.desc: "Наші води не бачили такого флоту вже ціле покоління. Чотири кораблі, сто сімдесят людей, достатньо #TOOLTIP:GOODS,salt,X #L солі#!#!, #TOOLTIP:GOODS,fish,X #L риби#!#! та сухарів на роки вперед — і наказ, що його особисто відда[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.IsFemale('ла', 'в')] [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetHerselfHimself] — відшукати морський шлях до Індії. Священники благословляють кораблі. Юрба тиснеться до самого берега. Дехто плаче.\n\n[target_leader.GetName] стоїть на носі, доки судна долають мілину й виходять у #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L відкритий Атлантичний океан#!#!. Позаду [Select_CString(target_leader.IsFemale, 'неї', 'нього')] гавань меншає, перетворюючись на білу цятку на тлі зеленого пагорба. Попереду — в усі боки безмежно простягається океан. [target_leader.GetSheHe|U] усе вирахува[target_leader.IsFemale('ла', 'в')]. [target_leader.GetSheHe|U] знає, чого вимагає ця виправа. Чи вистачить цього — як і завжди, вирішить [ROOT.GetCountry.GetReligion.GetGodName]."
  cape_route_to_india_events.1.a: "Якщо того воліє [ROOT.GetCountry.GetReligion.GetGodName|U], ми повернемося з трюмами, повними прянощів."
  cape_route_to_india_events.1.b: "Помолімося — а тоді вирушаймо в дорогу з усією квапливістю."
  cape_route_to_india_events.1.historical_info: "Португальська виправа в пошуках морського шляху до Індії стала підсумком майже століття поступових досліджень африканського узбережжя, які просувалися все далі на південь. Бартоломеу Діаш обігнув мис Доброї Надії в 1488 році, довівши, що такий шлях можливий. Плавання Васко да Гами в 1497–99 роках завершило цю місію: виправа повернулася з вантажем перцю та прянощів, який окупився в шістдесят разів. Це плавання докорінно змінило світову торгівлю прянощами, зруйнувавши венеційську та османську монополію на суходільні шляхи."
  cape_route_to_india_events.2.title: "Острови [ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]"
  cape_route_to_india_events.2.desc: "Десять вулканічних островів, що здіймаються над пласкою безкраєю гладінню моря — ось що таке архіпелаг [ShowProvinceDefinitionName('cape_verde_province')]. Моряки знали, чого чекати, та все ж острови стали полегшенням: тверда земля після тижнів відкритого океану. Оселя намісника в #TOOLTIP:LOCATION,santiago,X #L Сантьягу#!#! — це скромна споруда з біленого каменю. У гавані пахне сіллю, сушеною рибою і ледь помітно — лишайником, який зішкрібають зі скель для фарби.\n\n[target_leader.GetName] зважує вибір. [ROOT.GetCountry.GetName] утриму[ROOT.GetCountry.Custom('end_yeyut')] ці острови вже десятиліттями, але «утримує» — надто гучне слово: невелика залога, жменька поселенців і щорічний корабель із припасами. Якщо цей шлях має важити бодай щось для майбутнього [ROOT.GetCountry.Custom('CL_GEN')], острови повинні стати чимось більшим, ніж просто стоянкою для перепочинку."
  cape_route_to_india_events.2.a: "Вкладімося тут — заснуємо осаду, яка стане опорою нашого південного морського шляху."
  cape_route_to_india_events.2.b: "Поповнити запаси, набрати свіжої води та вирушити далі."
  cape_route_to_india_events.2.c: "Іти далі — ми не можемо дозволити собі зволікати так рано."
  cape_route_to_india_events.2.d: "Повернутися додому."
  cape_route_to_india_events.2.historical_info: "Острови Кабо-Верде відкрили португальські мореплавці близько 1456 року, а постійно заселені вони були з 1462 року. Завдяки їхньому розташуванню в Атлантиці — на шляху північно-східних пасатів — вони стали найважливішим перевалковим вузлом для плавань до Південної Америки та довкола Африки. Їхнє стратегічне значення значно зросло після того, як плавання Васко да Гами довело можливість шляху через Індійський океан. До шістнадцятого століття вони перетворилися на важливий осередок атлантичної работоргівлі."
  cape_route_to_india_events.3.title: "Острів [ShowLocationNameWithNoTooltip('sao_tome')]"
  cape_route_to_india_events.3.desc: "$cape_route_to_india_events.3.desc_common$\n\nНевелике поселення тулиться до західного берега. Земля тут, за словами поселенців, надзвичайно родюча. Що не посади — все росте. На цьому острові можна було б нажити статки на цукрі, якби тільки вистачало робочих рук."
  cape_route_to_india_events.3.desc.uninhabited: "$cape_route_to_india_events.3.desc_common$\n\nЖоден димок не здіймається над берегами. Жоден човен не чекає в бухтах. Острів геть безлюдний — шлюпки флоту першими торкнулися цього піску. І все ж земля там, де вдається вирубати джунглі, чорна, глибока й незрівнянно родюча. На такому острові можна було б нажити статки на цукрі, якби вистачало робочих рук — і якби екваторіальні лихоманки не звели людину в могилу раніше."
  cape_route_to_india_events.3.desc_common: "Спека сповіщає про себе перш ніж покажеться берег: волога, задушлива стіна спадає на палубу в ту саму мить, коли флот перетинає екватор, змушуючи людей задихатися в повітрі, яке ніколи не стає прохолоднішим. [ShowLocationName('sao_tome')] здіймається з ранкового туману, немов темно-зелена корона: дві вершини, повиті хмарами, та водоспади, що пробиваються крізь ліс, настільки густий, що світло не сягає землі."
  cape_route_to_india_events.3.desc.foreign: "$cape_route_to_india_events.3.desc_common$\n\nНа західному узбережжі вже тулиться поселення під чужим прапором — причали, каплиця, перші незаймані плантації цукрової тростини ворожої корони, яка дісталася цього родючого острова раніше за [ROOT.GetCountry.GetName]. Ґрунт тут точно такий багатий, як і обіцяли перекази, але він уже зайнятий. Усе, що ми хочемо отримати від [ShowLocationNameWithNoTooltip('sao_tome')], тепер доведеться або відбирати силою, або виторговувати з чужих рук."
  cape_route_to_india_events.3.a: "Заснувати торговельну фейторію — можливості цього острова варті вкладень."
  cape_route_to_india_events.3.b: "Встановити #italic падран#! на узвишші та офіційно проголосити права на острів."
  cape_route_to_india_events.3.c: "Набрати прісної води та йти на південь."
  cape_route_to_india_events.3.d: "Повернутися додому."
  cape_route_to_india_events.3.historical_info: "Сан-Томе був безлюдним, коли близько 1470 року туди прибули португальські мореплавці. Його екваторіальний клімат виявився згубним для європейських поселенців — смертности від хвороб була високою, — але надзвичайно сприятливим для вирощування цукрової тростини. До 1520-х років Сан-Томе став найбільшим у світі виробником цукрової тростини, яку вирощували майже виключно поневолені африканці. Згодом острів перетворився на великий перевалковий вузол атлантичної торгівлі невільниками — роль, яку він зберігав понад два століття."
  cape_route_to_india_events.4.title: "Гирло великої річки"
  cape_route_to_india_events.4.desc: "Океан тут набуває брунатного кольору. Флот спостерігав за цим цілий день: каламуть кольору чаю, густа від намулу, розтікалася морем із півдня. Згодом моряки побачили й причину: річка, ширша за будь-яку [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!, ширша за все, що будь-коли бачили ці люди, впадала в #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L Атлантичний океан#!#! коричневим потоком, що забарвлював море на багато кілометрів навсібіч.\n\nЗ-за мангрових заростей випливають човни-довбанки. Вони велетенські — видовбані з єдиного стовбура, завдовжки тридцять футів, керовані дюжиною веслувальників у дивовижній злагоді. Чоловіки на носах човнів беззбройні. Вони дивляться на флот зі спокійною цікавістю людей, які зроду не боялися чужинців."
  cape_route_to_india_events.4.a: "Домогтися аудієнції у великого правителя цієї землі."
  cape_route_to_india_events.4.b: "Виміняти слонову кістку, мідь і все інше, що вони запропонують."
  cape_route_to_india_events.4.c: "Нанести гирло річки на мапу й квапитися на південь — не можна зволікати."
  cape_route_to_india_events.4.d: "Повернутися додому."
  cape_route_to_india_events.4.historical_info: "Королівство Конго було одним із найрозвиненіших політичних утворень Африки на південь від Сахари, що контролювало території на землях сучасних Конго, Анголи та Габону. Маніконго (король) правив через ієрархічне чиновництво та підтримував розвинений устрій провінційного врядування. У 1480-х роках португальські місіонери встановили зв’язок із королівством, поклавши початок відносинам, які виявляться доленосними — а зрештою катастрофічними — для обох сторін. У 1490-х роках королівство прийняло християнство, і маніконго взяв собі ім’я Жуан I."
  cape_route_to_india_events.5.title: "Бухта [ShowLocationNameWithNoTooltip('luanda')]"
  cape_route_to_india_events.5.desc: "Кожен офіцер у виправі розуміє це з першого ж погляду. Жоден матрос не бачив такої гавані ніде вздовж африканського узбережжя: довга вигнута затока, захищена з південного заходу природною піщаною косою, глибока вода біля самого берега, а позаду — невисокий мис із панівним оглядом на всі боки. Місцеві рибалки називають її Луанда — рівне місце.\n\n[target_leader.GetName] походжає вздовж коси у передвечірньому світлі: затока з одного боку і відкритий #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L Атлантичний океан#!#! — з іншого. [target_leader.GetSheHe|U] вже міркує про мури. Про прісну воду. Про кількість кораблів, які тутешня залога могла б захистити — чи перехопити. Місто, зведене тут, могло б панувати над усією південноатлантичною торгівлею."
  cape_route_to_india_events.5.desc.owned: "Флот заходить у затоку, чию ціну не треба пояснювати: у місті [ShowLocationName('luanda')] вже майорять знамена #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, а довга піщана коса боронить кораблі, що підкоряються нашій короні.\n\n[target_leader.GetName] походжає вздовж коси у передвечірньому світлі — затока з одного боку і відкритий #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L Атлантичний океан#!#! з іншого — розмірковуючи не про те, чи варто зайняти цю землю, а про те, скільки користі вона ще може принести. Якщо тутешнє поселення укріпити ще дужче, воно зможе тримати під контролем усю південноатлантичну торгівлю."
  cape_route_to_india_events.5.a: "Звести тут велику [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] — їй не буде рівних."
  cape_route_to_india_events.5.a.owned: "Розширити наш великий пост у [ShowLocationNameWithNoTooltip('luanda')] — йому не буде рівних на цьому узбережжі."
  cape_route_to_india_events.5.b: "Заснувати тут невелику торгову факторію та склад."
  cape_route_to_india_events.5.b.owned: "Розширити торгову факторію та склад, які в нас уже тут є."
  cape_route_to_india_events.5.c: "Ретельно позначити це місце на мапах і пливти далі на південь."
  cape_route_to_india_events.5.d: "Повернутися додому."
  cape_route_to_india_events.5.historical_info: "Луанда була офіційно заснована як португальська колонія 1575 року Паулу Діашем де Новайшем, що робить її одним із найстаріших європейських поселень в Африці південніше Сахари. Її природна гавань понад чотири століття слугувала головним портом португальської Анголи. Починаючи з XVI століття Луанда стала основним осередком відправлення трансатлантичної торгівлі рабами в південній Африці, звідки мільйони поневолених людей вирушали до Бразилії та на Кариби."
  cape_route_to_india_events.6.title: "Пустельне узбережжя"
  cape_route_to_india_events.6.desc: "Тут пустеля підступає до самого моря: червоні дюни здіймаються просто з лінії прибою, а вітер зриває пісок із їхніх гребенів. Тут немає дерев. Не видно прісної води. Узбережжя на півночі — люди вже охрестили його «[ShowProvinceDefinitionName('skeleton_coast_province')]» через китові кістки, що біліють на березі, — не має жодних ознак людського житла на сотні миль навсібіч.\n\nІ все ж затока спокійна. Захищена від найлютіших хвиль, вона дає флоту змогу полагодити пошкоджену щоглу й поповнити запаси води з солонуватого джерела в дюнах. На мисі вгорі корабельний штурман вимірює приладами висоту сонця та робить записи. До Мису, каже він, не більше тижня плавання на південь. Дехто з людей хреститься."
  cape_route_to_india_events.6.a: "Підбадьорити людей — Мис Доброї Надії вже близько. Уперед!"
  cape_route_to_india_events.6.b: "Ці течії та вітри багато про що скажуть мореплавцю — дозвольте мені розгадати їх."
  cape_route_to_india_events.6.c: "Нехай люди перепочинуть тут. Їм знадобляться сили для прийдешніх бур."
  cape_route_to_india_events.6.d: "Повернутися додому — це узбережжя занадто безлюдне, щоб іти далі."
  cape_route_to_india_events.6.historical_info: "Узбережжя Намібії було відоме португальським морякам як #italic Costa dos Esqueletos#! (Берег Скелетів) через безліч кісток китів і тюленів, а також уламків кораблів, викинутих на підвітряний берег потужними південно-західними вітрами. Волфіш-Бей, названа голландцями #italic Walvischbaai#! (Китова бухта), була однією з небагатьох захищених якірних стоянок на цьому ворожому відтинку узбережжя. Бартоломеу Діаш зупинявся тут 1488 року під час свого плавання на південь."
  cape_route_to_india_events.7.title: "Мис Бур"
  cape_route_to_india_events.7.desc: "Ніщо за три місяці плавання не готувало їх до такого. Шторм накочується без попередження, з південного заходу, котячи перед собою хвилі заввишки сорок футів. Головний корабель шугає в провалля між хвилями й зникає з очей на цілих тридцять секунд. Зносить такелаж. Людей зриває зі снастей. [target_leader.GetName] обома руками стискає кормовий поручень і вдивляється в хаос довкола [Select_CString(target_leader.IsFemale, 'неї', 'нього')], і десь серед цього гуркоту вітру й розбитих хвиль [target_leader.GetSheHe] раптом усвідомлює: вони прорвалися. Мис — великий південний край Африканського континенту, межа відомого світу — залишився за кормою.\n\nШлях до Індії відкрито."
  cape_route_to_india_events.7.a: "Назвати його мисом Доброї Надії та без зволікань рушати на схід!"
  cape_route_to_india_events.7.b: "Сховатися під захистом мису, доки не вщухне шторм."
  cape_route_to_india_events.7.d: "З нас досить — ми обійшли мис. Повертаємо додому."
  cape_route_to_india_events.7.historical_info: "#italic Бартоломеу Діаш#! першим обігнув мис у 1488 році, назвавши його #italic Cabo das Tormentas#! (мис Бур). Згідно з португальськими джерелами, король Жуан II перейменував його на #italic Cabo da Boa Esperança#! (мис Доброї Надії), щоб заохотити майбутні виправи, хоча ця оповідь може бути апокрифічною. Цей мис не є найпівденнішою точкою Африки — ця честь належить мису Агульяс, розташованому десь за двісті кілометрів на схід, — але він позначає місце зустрічі Атлантичного та Індійського океанів і відкриває браму на схід."
  cape_route_to_india_events.8.title: "Бухта Пастухів"
  cape_route_to_india_events.8.desc: "Затока спокійна й чарівна, захищена з південного заходу невисоким мисом. Молочні дерева дарують рятівний затінок уздовж берега. А на схилі пагорба над берегом — худоба. Вгодовані, здорові корови пасуться величезними чередами під наглядом високих людей, укритих вохрою та скляним намистом, які пильнували за флотом із безпечної відстані відколи той став на якір.\n\nДехто з людей ледь не плаче при виді свіжого м’яса. Кілька тижнів поспіль вони харчувалися солоною рибою та твердими сухарями. Зрештою один із пастухів сходить до самої води і стоїть, вичікуючи, доки капітан флоту не сідає в баркас і не веслує йому назустріч. Відбувається міна за участю мідних кілець, сушеної риби та безлічі терплячих жестів. До заходу сонця в трюмі опиняються троє голів худоби. Мукання для кожного на флоті — найсолодша музика, яку вони коли-небудь чули."
  cape_route_to_india_events.8.a: "Обміняти [ShowGoodsNameWithNoTooltip('copper')] та [ShowGoodsNameWithNoTooltip('cloth')] на худобу й встановити #italic padrão#! на знак наших прав."
  cape_route_to_india_events.8.a.morale_tt: "Бойовий дух команд значно зростає (#G +15#! до бойового духу екіпажу)"
  cape_route_to_india_events.8.b: "Встановити кам’яний #italic padrão#! й офіційно оголосити ці землі володінням [ROOT.GetCountry.Custom('CL_GEN')]."
  cape_route_to_india_events.8.b.morale_tt: "Бойовий дух команд трохи зростає (#G +8#! до бойового духу екіпажу)"
  cape_route_to_india_events.8.c: "Дати людям перепочити й відновити сили тут, перш ніж вирушати на північ."
  cape_route_to_india_events.8.c.morale_tt: "Бойовий дух команд помітно зростає (#G +10#! до бойового духу екіпажу)"
  cape_route_to_india_events.8.d: "Повернутися додому."
  cape_route_to_india_events.8.historical_info: "Мосселбай був відомий португальським морякам як #italic Bahia dos Vaqueiros#! (бухта Пастухів), а пізніше — як #italic Aguada de São Brás#! (Водопій Святого Власія). Бартоломеу Діаш встановив тут кам’яний #italic padrão#! 1488 року, а звичай цей продовжив Васко да Гама в 1497-му. Місцеві койкої спочатку охоче торгували з обома виправами, але згодом стали ворожими — людей Васко да Гами закидали камінням, коли ті спробували набрати прісної води без належної плати."
  cape_route_to_india_events.9.title: "Золотий порт [ShowLocationNameWithNoTooltip('sofala')]"
  cape_route_to_india_events.9.desc: "Гавань міста [ShowLocationName('sofala')] вкрита дау. Це не дрібні рибальські суденця, до яких флот звик уздовж південного берега; це океанські кораблі з #TOOLTIP:REGION,arabia_region,X #L Аравії#!#! та #TOOLTIP:REGION,persia_region,X #L Персії#!#!, що глибоко осіли під вагою #TOOLTIP:GOODS,ivory,X #L слонової кістки#!#!, чорного дерева та #TOOLTIP:GOODS,cloth,X #L тканин#!#!. На набережній купці ведуть справи [ShowLanguageName('arabic_language')|l]ою мовою та мовою [location.GetDominantCulture.GetLanguage.GetName]их мешканців, якої жоден перекладач флоту не може розпізнати. Пучки золотого піску переходять із рук у руки за сувої індійської бавовни.\n\nАрабські купці, які віками панували в цій гавані, з-під навісів своїх комор спостерігають за прибуттям [ROOT.GetCountry.GetAdjective|l]ого флоту. Вирази їхніх облич годі розібрати, але мова тіла красномовна: поява цих чужинців із залізними гарматами та намальованими на вітрилах хрестами — подія зовсім не бажана. Капітан флоту занотовує розташування найбільших комор, місця стоянки дау та глибину води на вході до затоки."
  cape_route_to_india_events.9.a: "Заснувати велику фейторію — це золото збагатить [ROOT.GetCountry.Custom('CL_ACC')]."
  cape_route_to_india_events.9.a.owned: "Вкласти кошти в нашу торгову факторію в [ShowLocationNameWithNoTooltip('sofala')] — це золото зробить [ROOT.GetCountry.GetNameWithNoTooltip] багатою."
  cape_route_to_india_events.9.b: "Виміняти золотий пісок і довідатися, що криється в глибинних землях."
  cape_route_to_india_events.9.c: "Зібрати відомості та рушати далі — час дорогий."
  cape_route_to_india_events.9.d: "Повернутися додому."
  cape_route_to_india_events.9.historical_info: "Софала була найпівденнішим визначним портом суахілійської торгової мережі, що контролював доступ до золотоносного царства #italic Мутапа #! (Великого Зімбабве) на плато на заході. Арабські купці вели тут торгівлю щонайменше з десятого століття. Португальці захопили Софалу в 1505 році, зруйнувавши арабську торгову мережу та спробувавши спрямувати торгівлю золотом власними каналами — з мінливим успіхом, оскільки значна частина торгівлі просто перемістилася глибше у внутрішні землі, поза їхньою досяжністю."
  cape_route_to_india_events.10.title: "Острів [ShowLocationNameWithNoTooltip('mozambique')]"
  cape_route_to_india_events.10.desc: "Невеликий острів, не більше трьох кілометрів від краю до краю, відділений від материка вузькою протокою, якраз достатньо глибокою для океанських кораблів. Над островом височіє кам’яна купецька осада під зеленим стягом, а гавань ущент заповнена доу з усіх куточків #TOOLTIP:CONTINENT,indian_ocean_continent,X #L Індійського океану#!#!. [ShowGoodsName('ivory')] та чорне дерево стікаються сюди з глибини суходолу, з материка женуть невільників та невільниць, з півдня надходить [ShowGoodsName('copper')|l], а з країв $india$ та $china$ прибувають [ShowGoodsName('cloth')|l] та [ShowGoodsName('porcelain')|l] — і все це переходить із рук у руки в торговій мережі, яка діє вже шість століть.\n\nПравитель [target_ruler_country.Custom('GetRulerOrRegentTitle')] багатий і підозріливий. Арабські купці, які прибули раніше за флот, попередили [target_ruler.GetHimHer], що чужинці — це [ROOT.GetCountry.GetReligion.GetAdjective|l]і пірати, які нищать усе, чого не можуть украсти. [target_ruler.GetHeShe|U] приймає посланця флоту з підкресленою чемністю, в оточенні озброєної варти, і ставить багато запитань про озброєння. Власне становище [target_ruler.GetHerHis|l] у серці гавані, оточеної жерлами гармат, навряд чи [ROOT.GetCountry.GetAdjective|l]і мореплавці назвали б затишним."
  cape_route_to_india_events.10.a: "Підкупити правителя ([target_ruler_country.Custom('GetRulerOrRegentTitle')]) крамом із нашого трюму й викупити право будувати тут."
  cape_route_to_india_events.10.b: "Домовитися про торгові права через дипломатію та дарунки."
  cape_route_to_india_events.10.c: "Перехитрити арабських купців — запропонувати правителю ([target_ruler_country.Custom('GetRulerOrRegentTitle')]) умови, з якими ті не зрівняються."
  cape_route_to_india_events.10.d: "Поки що зважити на становище, яке займає [target_ruler_country.Custom('GetRulerOrRegentTitle')], і рушити далі на північ."
  cape_route_to_india_events.10.f: "Встановити #italic Сан-Жоржі падрáн#!."
  cape_route_to_india_events.10.e: "Повернутися додому."
  cape_route_to_india_events.10.historical_info: "Острів Мозамбік став найважливішою базою Португалії у Східній Африці, офіційно заснованою в 1507 році. Форт Сан-Себастьян, збудований у XVI столітті, лишається однією з найстаріших збережених європейських фортифікаційних споруд в Африці на південь від Сахари. Острів слугував урядовою столицею Португальської Східної Африки та перевальним пунктом на шляху до $india$ понад два століття. Його захоплення фактично знищило арабський контроль над північною частиною торгової мережі суахілійського узбережжя."
  cape_route_to_india_events.11.title: "Пастка біля [ShowLocationNameWithNoTooltip('mombasa')]"
  cape_route_to_india_events.11.desc: "Вхідна протока міста #TOOLTIP:LOCATION,mombasa,X #L Момбаса#!#! вузька, не ширша двох кабельтових, із пагорбами по обох берегах. Коли флот проходить нею, люди починають відчувати недобре — уздовж набережної вештаються озброєні до зубів чоловіки з удаваною безтурботністю тих, кому наказали здаватися беззбройними; доу стоїть на дивному якорі, немов перекриваючи вихід із протоки; а посланець, якого відрядив [target_ruler_country.Custom('GetRulerOrRegentTitle')|l], піднімається на флагман із пишними церемоніями, дарами й аж надто численними розпитуваннями про кількість бійців на борту.\n\nТієї ночі тлумач, найнятий флотом, прослизає до капітанської каюти. Перш ніж повернутися на берег, посланець, якого відрядив [target_ruler_country.Custom('GetRulerOrRegentTitle')|l], говорив зі своїми супутниками наріччям, яке тлумач розуміє. Слова були недвозначні: флот не повинен покинути поселення [ShowLocationNameWithNoTooltip('mombasa')]."
  cape_route_to_india_events.11.a: "Тихо піти до світанку — гостинність цієї людини не варта такого ризику."
  cape_route_to_india_events.11.b: "Залишитися і спробувати торгувати, попри явне напруження."
  cape_route_to_india_events.11.c: "Якщо вони замислили зраду, ми вдаримо першими — підготувати людей."
  cape_route_to_india_events.11.d: "Повернутися додому — ми не ризикуватимемо флотом тут."
  cape_route_to_india_events.11.historical_info: "Васко да Гама ледь не потрапив у засідку в Момбасі у квітні 1498 року. Згідно з португальськими хроніками, місцеві лоцмани, призначені султаном, намагалися посадити флот на мілину. Да Гама відступив перш ніж пастка закрилася. У наступні десятиліття португальці неодноразово поверталися, аби бомбардувати та грабувати Момбасу. Форт Ісус, зведений у 1593 році, остаточно закріпив португальський контроль над гаванню — хоча місто було захоплене оманцями в 1698 році після тривалої облоги."
  cape_route_to_india_events.12.title: "Приязний [target_ruler_country.Custom('GetRulerOrRegentTitle')|U]"
  cape_route_to_india_events.12.desc: "Усе в місті #TOOLTIP:LOCATION,malindi,X #L Малінді#!#! зовсім не схоже на те, що траплялося раніше. Правитель [target_ruler.GetName], що носить титул [target_ruler_country.Custom('GetRulerOrRegentTitle')], особисто сходить до гавані в біло-зеленому шовку, у супроводі музик, які грають на інструменті, чиєї музики [ROOT.GetCountry.GetAdjective|l]і мореплавці ніколи раніше не чули. [target_ruler.GetSheHe|U] вже знає про флот від своїх людей на півдні й очікує на прибуття кораблів.\n\n[target_ruler.GetSheHe|U] має дарунок, цінніший за слонову кістку: на службі в [target_ruler.GetHerHis] перебуває чоловік, який дванадцять разів ходив до Калікута. Чоловік, який знає кожну течію, кожен риф і кожну зміну вітру між цими берегами та Малабарським узбережжям. Який знає, коли південно-західний мусон домчить корабель через #TOOLTIP:CONTINENT,indian_ocean_continent,X #L Індійський океан#!#! за три тижні, а коли згубить той самий корабель за добу. Ім’я лоцмана, як пояснює [target_ruler.GetName], важко вимовити європейською мовою. Але його знання зрозумілі без слів, і ціна цим знанням — дружба."
  cape_route_to_india_events.12.a: "Прийняти дружбу, яку пропонує [target_ruler.GetNameWithNoTooltip], та [target_ruler.GetHerHis] дар — лоцмана. Ми шануватимемо це."
  cape_route_to_india_events.12.b: "Скріпити цю дружбу: дарами, нашою присутністю тут і захистом для правителя ([target_ruler_country.Custom('GetRulerOrRegentTitle')])."
  cape_route_to_india_events.12.c: "Помолімося разом перед останнім переходом — [ROOT.GetCountry.GetReligion.GetGodName|U] привів нас до цієї миті."
  cape_route_to_india_events.12.e: "Встановити #italic падран Ешпіріту-Санту#! перед великим переходом."
  cape_route_to_india_events.12.d: "Повернути додому — Калікут надто далеко, а перехід надто небезпечний."
  cape_route_to_india_events.12.historical_info: "Султан Малінді тривалий час ворогував із Момбасою, а тому прихильно поставився до португальців, убачаючи в них противагу своїм ворогам. Лоцман в Індійському океані, якого він надав Васко да Гамі (у португальських джерелах згадуваний як #italic Malemo Canaca#!), протягом століть залишався предметом наукових суперечок. Деякі історики ототожнюють його з #italic Ахмадом ібн Маджидом#!, найвидатнішим арабським мореплавцем п’ятнадцятого століття й автором численних праць про навігацію в Індійському океані. Інші ж стверджують, що це ототожнення помилкове і лоцманом насправді був гуджаратський купець. Його особа й досі достеменно не відома."
  cape_route_to_india_events.13.title: "Калікут — брама прянощів"
  cape_route_to_india_events.13.desc: "Місто [ShowLocationName('kozhikode')] більше за столицю [ROOT.GetCountry.GetCapital.GetName]. У гавані більше кораблів, ніж офіцери флоту можуть налічити — судна з #TOOLTIP:REGION,arabia_region,X #L Аравії#!#!, #TOOLTIP:REGION,persia_region,X #L Персії#!#!, #TOOLTIP:AREA,gujarat_area,X #L Гуджарату#!#!, #TOOLTIP:REGION,bengal_region,X #L Бенгалії#!#!, країв $china$, #TOOLTIP:LOCATION,malacca,X #L Малакки#!#! та #TOOLTIP:AREA,java_area,X #L Яви#!#!. Цілий взаємопов’язаний світ зійшовся воєдино під притягальною силою таких прянощів, як [ShowGoodsName('pepper')], кориця, кардамон та [ShowGoodsName('cloves')], і все це пливе крізь цей порт. Флот кидає якір на рейді, вже переповненому доу, під пильними поглядами арабських купців на набережній.\n\nУже два місяці вони переконують володаря Калікута, який править із-за пишних церемоніальних стін, що ці прибульці зовсім не купці, а пірати з холодної півночі. [target_ruler_country.Custom('GetRulerOrRegentTitle')|U] погодився прийняти капітана флоту, але [target_ruler.GetHerHis] двір сповнений настороги, а [target_ruler.GetHerHis] купці нервують. Повітря напоєне пахощами: тут і чорний [ShowGoodsNameWithNoTooltip('pepper')], і сіль моря, яке бачило тисячу років торгівлі. Усе, заради чого починалася ця виправа, тепер залежить від того, що буде сказано протягом наступної години."
  cape_route_to_india_events.13.a: "Розкласти наші найкращі товари, щоб з ними міг ознайомитися [target_ruler_country.Custom('GetRulerOrRegentTitle')], і домовитися про купецьку осаду."
  cape_route_to_india_events.13.b: "Запропонувати договір: фіксовані мита, гарантована стоянка, взаємний захист."
  cape_route_to_india_events.13.c: "Оголосити арабських купців брехунами й вимагати, щоб [target_ruler_country.Custom('GetRulerOrRegentTitle')] [Select_CString(target_ruler.IsFemale, 'зробила', 'зробив')] вибір."
  cape_route_to_india_events.13.d: "Наш лоцман знає цей двір. Його порада спрямує наші перші слова."
  cape_route_to_india_events.13.e: "Встановити #italic São Gabriel padrão#!, і хай усі бачать, хто дістався цього берега."
  cape_route_to_india_events.13.historical_info: "Кожикоде (відомий європейцям як Калікут) був найважливішим портом торгівлі прянощами в Індійському океані. Правив ним #italic самутірі#! (заморін, або Володар моря), який ретельно підтримував рівновагу між арабськими купцями, що панували в торгівлі, суперницькими індійськими державами та європейцями, які прибули пізніше. Перший прийом Васко да Гами в 1498 році був неоднозначним: його дарунки визнали вбогими, а арабські купці успішно зіпсували стосунки при дворі. Він відбув із невеликим і малоцінним вантажем. Лише в наступних плаваннях, підкріплених загрозою португальських гармат, вдалося домогтися справжніх торгових угод."
  cape_route_to_india_events.14.title: "Золотий Берег"
  cape_route_to_india_events.14.desc: "Ліс починається за день ходи від берегової лінії, і стежка між узбережжям та лісом добре втоптана. Каравани прибувають до берега двічі або тричі на тиждень: носії несуть шкіряні мішечки із золотим піском, намитим із річкового гравію в глибині краю, де [ShowCultureName('akan')|l]і правителі контролюють промивальні місця та торгують лишками через мережу купців вангара, якій уже чотири століття.\n\n[ROOT.GetCountry.GetAdjective]і мореплавці чули про це місце. Кожен арабський капітан, що торгував уздовж цих берегів, називав ринки Золотого Берега найбагатшою ділянкою гвінейського узбережжя. Тутешній люд уже бачив чужоземні кораблі. Вони не бояться. Вони лише прикидають, яку вигоду можуть принести прибульці."
  cape_route_to_india_events.14.a: "Звести форт Сан-Жоржі-да-Міна. [ShowCultureNameWithNoTooltip('akan')]ий люд продаватиме золото кожному, хто ним володіє."
  cape_route_to_india_events.14.b: "Домовитися про викуп бранців, яких [ShowCultureNameWithNoTooltip('akan')|l]ий люд бере як данину у своїх війнах."
  cape_route_to_india_events.14.c: "Узяти поселення приступом, доки купці вангара не встигли піти."
  cape_route_to_india_events.14.d: "Оцінити обсяги торгівлі та рушати на південь. Гаяти час не можна."
  cape_route_to_india_events.14.e: "Повернутися додому. Одного золота досить, щоб виправдати плавання."
  cape_route_to_india_events.14.historical_info: "У 1482 році португальці звели Сан-Жоржи-да-Міну (форт Ельміна) на Золотому Березі, використавши камінь, видобутий на сусідньому мисі, та колоди, заздалегідь заготовлені в Португалії й завантажені на кораблі навмисне для цього. Форт постав за лічені тижні — почасти завдяки перемовинам із місцевим вождем на ім’я Караманса, почасти завдяки зненацькості дій. Спершу він призначався для контролю над торгівлею золотом із лісовими царствами акан. За кілька десятиліть фортеця стала головним осередком атлантичної работоргівлі, приймаючи бранців із внутрішніх воєн і відправляючи їх на захід — на цукрові плантації Сан-Томе, а згодом до Бразилії. Історик Волтер Родні оцінював, що торгівля на Золотому Березі приносила Португалії кілька сотень тисяч золотих крузаду на рік, доки работоргівля не витіснила золото як головний товар."
  cape_route_to_india_events.15.title: "Острів Фернан-ду-По"
  cape_route_to_india_events.15.desc: "Острів здіймається посеред Гвінейської затоки: вулканічний пік, оповитий хмарою на самій вершині, густо порослий джунглями аж до самої води. Народ бубі, що мешкає тут, зроду не бачив європейців. Вони спостерігають з узлісся, як флот кидає якір у природній бухті й спускає човен на воду.\n\nДослідник, який дав цьому острову своє ім’я, проходив цим шляхом покоління тому й наніс його приблизні обриси на мапу. Стерновий флоту має цю мапу. Чого вона не показує — так це того, чи вартий цей острів зупинки."
  cape_route_to_india_events.15.desc.owned: "Острів височіє з моря, як і раніше — вулканічний пік в обіймах хмар, джунглі, що підступають до самісінької води, — але над якірною стоянкою внизу вже майорить наш стяг, а човни, які пливуть назустріч флоту, — наші власні.\n\n[target_leader.GetName] не має потреби роздумувати, чи вартий цей острів зупинки. Питання тепер лише в тому, скільки ще зиску можна витиснути з опертя, яке [ROOT.GetCountry.GetNameWithNoTooltip] уже має тут, на перетині торгових шляхів області [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]."
  cape_route_to_india_events.15.a: "Заснувати тут поселення. Цей острів лежить прямо посеред торгових шляхів Гвінейської затоки."
  cape_route_to_india_events.15.b: "Встановити #italic padrão#!, нанести острів на наші мапи та оголосити його володінням Корони."
  cape_route_to_india_events.15.c: "Поповнити запаси прісної води та рушати далі на південь. На цьому острові немає нічого потрібного нам."
  cape_route_to_india_events.15.d: "Повернутися додому. [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] — довід достатній."
  cape_route_to_india_events.15.historical_info: "Острів Фернандо-По (сучасний Біоко) відкрив португальський мореплавець Фернан ду По близько 1472 року — він став першим європейцем, який побачив цей острів. Корінний народ бубі жив тут усамітнено впродовж століть, переселившись із материка задовго до того. Португальці використовували острів як перевалковий вузол, але не змогли закріпитися там надовго — почасти через тропічні хвороби, почасти через опір бубі будь-яким зв’язкам. У наступні століття острів неодноразово переходив із рук у руки; за договором в Ель-Пардо 1778 року Португалія поступилася ним Іспанії в обмін на територіальні поступки в Південній Америці, і зрештою він увійшов до складу сучасної Екваторіальної Гвінеї."
  cape_route_to_india_events.16.title: "Місто султана морів"
  cape_route_to_india_events.16.desc: "[ShowLocationName('mogadishu')] виявилося більшим, ніж ми очікували. У гавані вирує життя серед дау з #TOOLTIP:REGION,arabia_region,X #L Аравії#!#! та Індії, трюми яких повні #TOOLTIP:GOODS,cloth,X #L тканин#!#!, #TOOLTIP:GOODS,copper,X #L міді#!#! та #TOOLTIP:GOODS,porcelain,X #L порцеляни#!#!. У [ShowLocationNameWithNoTooltip('mogadishu')] править султан, який тримає в руках торгівлю між [ShowCultureName('somali_culture')]ими внутрішніми землями та просторами океану. Купці на набережній оглядають наші кораблі з холодним розрахунком. Ми не перші чужинці, що прибули сюди під незвичними вітрилами та з дивним крамом, проте, напевно, перші, хто прийшов із такого далекого заходу."
  cape_route_to_india_events.16.a: "Торгувати з [ShowCultureNameWithNoTooltip('somali_culture')|l]ими купцями. Тут варто налагодити будь-які зв’язки."
  cape_route_to_india_events.16.b: "Оглянути все, занотувати та рушати на північ. Ми прибули, щоби знайти Індію, а не гаяти тут час."
  cape_route_to_india_events.16.c: "Повернути назад. Попереду невідомий шлях, а наших харчів надовго не вистачить."
  cape_route_to_india_events.16.historical_info: "Могадішо був одним із найдавніших і найбагатших міст східноафриканського узбережжя, з безперервною історією торгівлі, коріння якої сягало багатьох століть до приходу португальців. Арабські географи згадували його як значний порт уже в дев’ятому столітті. До часу походу да Гами містом правив султанат, що входив до торгової мережі Суахілійського узбережжя, яка пов’язувала внутрішні землі Африки з Аравією, Персією та Індійським субконтинентом. Рішення португальців оминати або схиляти ці суахілійські міста-держави до покори заради встановлення власної торгової монополії призвело їх до прямого зіткнення з уже наявною та вельми дієвою торговою системою."
  cape_route_to_india_events.17.title: "Ібадитський порт"
  cape_route_to_india_events.17.desc: "[ShowLocationName('masqat')] підіймається з червоних скель, а запах моря тут інший — сухіший, гостріший, із присмаком куряви та [ShowGoodsName('salt')] водночас. Гавань — одна з найкращих на [ShowProvinceDefinitionName('arabian_sea_province')], доволі глибока для великих кораблів і захищена від південно-західного мусону. Купці [ShowCultureName('omani_culture')] плавають до $india$ вже тисячу років. Люди на набережній знають шляхи, вітри та строки. Вони знають, коли виходити в море, а коли чекати. Вони дивляться на нас і гадають, чого ми хочемо."
  cape_route_to_india_events.17.a: "Домогтися прийому у [ShowCultureNameWithNoTooltip('omani_culture')|l]ої влади й оголосити про нашу появу."
  cape_route_to_india_events.17.b: "Заплатити арабським мореплавцям за їхні мапи та знання про перехід до Індії."
  cape_route_to_india_events.17.c: "Швидко поповнити запаси та відплисти. [ShowCultureNameWithNoTooltip('omani_culture')]і моряки нам не друзі."
  cape_route_to_india_events.17.d: "Повернути назад. Перехід до $india$ нам не під силу."
  cape_route_to_india_events.17.historical_info: "Маскат був головним портом Ібадитського імамату Оман — однієї з провідних морських держав західної частини Індійського океану. Оманські моряки належали до найвправніших мореплавців у світі й досконало знали мусонні вітри, які визначали час переходів між Аравією та півостровом Індостан. Поява португальців загрожувала ролі Оману як посередника в торгівлі прянощами, і відносини між Португалією та Оманом залишалися ворожими протягом більшої частини XVI століття, що призвело до неодноразових воєн за контроль над Перською затокою та портами Східної Африки. Зрештою у XVII столітті Оман витіснив португальців із більшості їхніх східноафриканських осередків."
  cape_route_to_india_events.18.title: "[por_feitoria_builder.GetAdjective|U]і мореплавці звели фейторію"
  cape_route_to_india_events.18.desc: "Їхні кораблі прибули без попередження, стали на якір на зовнішньому рейді та навели свої гармати на гавань. Прохання було ввічливим за формою, проте беззаперечним за суттю. Вони забажали збудувати фейторію. Обіцяли сплачувати невелику оренду. Обіцяли поважати місцеві закони. Чого вони не сказали — і про що й казати не треба було, — так це те, що станеться в разі нашої відмови. Деревину вже було обтесано й завантажено в трюми. Фейторію звели за лічені дні. Тепер там майорить португальський хрест — там, де раніше майорів наш власний стяг."
  cape_route_to_india_events.18.a: "У нас немає вибору. Їхні гармати звучать переконливіше за наші протести."
  cape_route_to_india_events.18.b: "Надіслати офіційний протест і вимагати поваги до нашого суверенітету."
  cape_route_to_india_events.18.historical_info: "Португальська система фейторій стала одним із перших прикладів європейського торгового імперіалізму в Азії та Африці. Засновуючи укріплені торгові факторії у вже наявних гаванях, Португалія здобувала доступ до усталених торгових мереж, не зазнаючи витрат на повне територіальне завоювання. Місцеві правителі, які погоджувалися на такі умови, отримували доступ до португальських товарів і морський захист від суперників; ті ж, хто відмовлявся, зазнавали обстрілів. Ця система перетворила Індійський океан з порівняно відкритого торгового простору на простір, вибудуваний довкола португальського морського панування та торгової монополії Casa da Índia."
  cape_route_to_india_events.provisioned_25_tt: "Флот цілком забезпечений харчами, і його команди краще витримають майбутні довгі переходи (#G +25#! Харчі)"
  cape_route_to_india_events.provisioned_30_tt: "Флот цілком забезпечений харчами, і його команди краще витримають майбутні довгі переходи (#G +30#! Харчі)"
  cape_route_to_india_events.provisioned_40_tt: "Флот цілком забезпечений харчами, і його команди краще витримають майбутні довгі переходи (#G +40#! Харчі)"
  cape_route_to_india_events.supplies_up_10_tt: "Запаси харчів флоту поповнено (#G +10#! Харчі)"
  cape_route_to_india_events.supplies_up_15_tt: "Запаси харчів флоту поповнено (#G +15#! Харчі)"
