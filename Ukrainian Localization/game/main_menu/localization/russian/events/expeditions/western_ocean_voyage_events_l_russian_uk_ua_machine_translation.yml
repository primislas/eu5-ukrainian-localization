l_russian:
  western_ocean_voyage_events.1.title: "Ми пливемо на захід"
  western_ocean_voyage_events.1.columbus: "According to [target_leader.GetName]'s precise calculations it is three thousand miles, no more."
  western_ocean_voyage_events.1.a: "Sail on. Whatever lies across this ocean, we shall find it first."
  western_ocean_voyage_events.1.historical_info: "Думка дістатися Азії, пливучи на захід, обговорювалася європейськими вченими десятиліттями, перш ніж відбулося перше таке плавання. Головною перешкодою була не форма Землі, яку освічені люди вважали кулястою, а її розмір. Більшість учених слушно вважали, що океан занадто широкий, аби його перетнути. Виправи, що довели їхню неправоту, зробили це не спростуванням розрахунків, а виявленням на шляху дечого несподіваного."
  western_ocean_voyage_events.2.title: "Край звіданого світу"
  western_ocean_voyage_events.2.a: "Поповнити запаси та відплисти протягом тижня."
  western_ocean_voyage_events.2.b: "Люди не готові. Ми повертаємо назад."
  western_ocean_voyage_events.2.historical_info: "Канарські острови слугували звичним осередком вирушення для атлантичних плавб у невідомість завдяки своєму розташуванню на краю досліджених атлантичних вод і надійним пасатам, що дмуть звідти на південний захід до Карибського моря. Їхнє важливе значення розуміли настільки добре, що контроль над островами оскаржувався Португалією та Кастилією впродовж більшої частини п’ятнадцятого століття."
  western_ocean_voyage_events.3.title: "Ми зайшли вже далеко"
  western_ocean_voyage_events.3.desc: "The bread is going moldy. The water casks smell. Three men have taken a fever. This morning a delegation came to [target_leader.GetName] with a simple message: they have sailed west long enough, seen nothing but open sea, and intend to sail east again whether [target_leader.GetNameWithNoTooltip] agrees or not.\n\nThere is no land in any direction. There is nothing at all, only the wind from behind, which has carried them this far and would carry them no further back."
  western_ocean_voyage_events.3.columbus: "[target_leader.GetNameWithNoTooltip] обіцяє команді ще три дні, посилаючись на підроблений судновий журнал."
  western_ocean_voyage_events.3.a: "Пообіцяти ще три дні й частку в усьому, що ми знайдемо."
  western_ocean_voyage_events.3.b: "Люди мають рацію. Ми повертаємо назад."
  western_ocean_voyage_events.3.historical_info: "Свідчення про плавання 1492 року фіксують справжній занепад духу приблизно через місяць атлантичного переходу, коли команда погрожувала бунтом і вимагала від Колумба повернути назад додому. Вирішення цього розбрату, яке приписують то обіцянці дістатися землі за три дні, то поміченій рослинності на воді, то просто силі переконання самого Колумба, залишається предметом суперечок. Землю побачили вже наступного ранку."
  western_ocean_voyage_events.4.title: "Land!"
  western_ocean_voyage_events.4.desc: "Just before dawn a cry comes from the crow's nest. Then another, louder. Then every man on deck is shouting.\n\nA shape on the horizon. Low at first, barely more than a darkening of the sky, but as the light grows it becomes unmistakable: trees, a shoreline, green hills rising from still water. The sea around the ships has turned from deep blue to green to pale turquoise. Strange birds circle overhead. Branches with unfamiliar leaves drift past the hull.\n\n[target_leader.GetName] stands at the bow and says nothing for a long time."
  western_ocean_voyage_events.4.columbus: "[target_leader.GetNameWithNoTooltip] plants the royal banner and names the island San Salvador, certain he has reached the Indies."
  western_ocean_voyage_events.4.a: "Plant the flag. Whatever this place is, it belongs to us now."
  western_ocean_voyage_events.4.b: "This matches no account of the Indies. Claim nothing until we know more."
  western_ocean_voyage_events.4.historical_info: "Перша зустріч європейців із народами Америки відбулася на Карибах у 1492 році. Таїно, корінні жителі Багамських островів, які називали свій острів #italic Гуанахані#!, зустрічали прибулі кораблі на узбережжі. За одне покоління моровиці, проти яких таїно не мали вродженого захисту, згубили більшу частину населення Карибських островів. Довготривалі наслідки цього плавання змінили природу, господарство й населення всіх материків Землі."
  western_ocean_voyage_events.5.a: "Спрямувати курс за нею — раптом старі мапи не брешуть."
  western_ocean_voyage_events.5.b: "Морські мапи рясніють островами, яких ніколи не існувало."
  western_ocean_voyage_events.5.historical_info: "Антилія, Острів семи міст, з’являлася на португальських і генуезьких мапах ще в 1424 році — як великий острів на захід від Азорських островів. Легенда свідчила, що семеро вестготських єпископів утекли з Іберії в 714 році під час завоювання Омеядів і заснували сім міст на острові в західному океані. Переказ пережив саму добу відкриттів, яка, здавалося б, мала б його спростувати: десятиліттями пізніше, коли Франсіско Васкес де Коронадо вирушив на пошуки семи золотих міст на південному заході Америки, він нарік свою ціль на честь цього давнішого суто європейського переказу."
  western_ocean_voyage_events.5.title: "Острів семи міст"
  western_ocean_voyage_events.6.a: "Записати як є, разом із суперечностями."
  western_ocean_voyage_events.6.b: "Залишити лише те, у чому всі згодні: у глибину суходолу, і золото."
  western_ocean_voyage_events.6.historical_info: "Перші свідчення про зустрічі на Карибах описують таїно, які носили невеликі золоті прикраси, радше виготовлені деінде, ніж добуті на місці в скільки-небудь помітній для прибульців кількості. На запитання знаками, звідки воно взялося, острів’яни повсякчас показували в глибину краю, а за деякими свідченнями — на землі ще далі на південь і захід. Саме ці переказані з чужих уст, спотворені перекладом вказівки, а зовсім не якесь підтверджене відкриття, визначили, де наступні покоління дослідників шукали золото в Америці."
  western_ocean_voyage_events.6.title: "Звідки береться золото"
  western_ocean_voyage_events.7.a: "Залишити донесення без змін."
  western_ocean_voyage_events.7.historical_info: "Письмові та усні донесення виправ, що повернулися, зачитувалися при королівських дворах Західної Європи вже за кілька місяців після кожної висадки, а перекладені оповіді згодом набували великої слави. Ці розповіді, спотворені перекладом і пихою їхніх авторів, описували небачені скарби в глибині суходолу, яких жоден європеєць іще не бачив на власні очі. Саме ці переказані з других уст свідчення, а не якесь підтверджене відкриття, спонукали наступні покоління мандрівників шукати джерела того, що перші прибульці бачили лише мигцем, усе далі в глибині суходільних просторів і все далі на південь."
  western_ocean_voyage_events.7.title: "Ми читаємо донесення при [ROOT.GetCountry.Custom('CL_PREP')]"
  western_ocean_voyage_mythical_cities_tt: "Складання мап узбережжя Америки відкриє [expeditions|e] для пошуку легендарних загублених міст"
  western_ocean_voyage_events.1.desc: "The ships sit low in the harbor, provisioned for a voyage no chart has prepared us for. [target_leader.GetName] has spent months at [ROOT.GetCountry.GetGovernment.GetCourtTitle] arguing [target_leader.GetHisHer] case, that the ocean to the west is narrower than the scholars claim, and that the Indies lie within reach of a determined fleet.\n\nThe learned men remain unconvinced. The sailors are uneasy. But the wind is fair, the tide is turning, and there is nothing left to do but cast off the lines."
  western_ocean_voyage_events.2.desc: "The Fortunate Islands, so the ancients named them, sit at the very edge of every chart we carry in [ShowLocationName('northern_fuerteventura_coast')]. Beyond it the ocean has no names, no depths recorded, no coastline drawn. The local fishermen say they sometimes see birds flying from the west before a storm, which [target_leader.GetName] takes as a sign of land beyond the horizon. The crew takes it as a sign of storms.\n\nWe take on fresh water, salt meat, and hard biscuit. At sunset the men watch the sea turn gold, then dark."
  western_ocean_voyage_events.5.desc: "Somewhere past the midpoint of the crossing, with the wind steady and the ships making good way, the pilots bring an old chart to [target_leader.GetName]. Drawn by men who never sailed this ocean, it marks a great island far west of the [ShowAreaName('azores_area')]: Antillia, walled and studded with seven cities, said to have been founded by bishops who fled [ShowRegionName('iberia_region')] when the Umayyad armies overran it.\n\nNo one aboard has seen this island, and no one aboard expects to. But the chart is old, the men who drew it were no fools, and out here, with nothing on any horizon, an old story is worth more than it would be in port."
  western_ocean_voyage_events.6.desc: "Word for word, the interpreters do not agree. One insists the islanders are naming a place. Another, that they are naming a people. A third, that the gesture south and the gesture inland are two different answers to two different questions nobody translates correctly.\n\nWhat is certain is the direction: inland, and beyond that, south, toward mountains and rivers none of the crew have seen. [target_leader.GetName] has the pilots mark it on the chart anyway, half rumor and half guess, in case anyone ever needs to know where to look."
  western_ocean_voyage_events.7.desc: "The ships make harbor at last, salt-crusted and battered, and within days we read [target_leader.GetName]'s account aloud at [ROOT.GetCountry.GetGovernment.GetCourtTitle]. The islands, the crossing, the strange birds and stranger fruit, the gold worn by people who had never heard of us until the moment we arrived.\n\nSome doubt most of what is said, yet we write all of it down regardless. Charts begin to change, cautiously, in the western margins where nothing used to be drawn."