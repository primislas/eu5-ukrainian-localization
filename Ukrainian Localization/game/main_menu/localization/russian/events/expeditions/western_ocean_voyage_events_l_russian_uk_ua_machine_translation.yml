l_russian:
  western_ocean_voyage_events.1.title: "Ми пливемо на захід"
  western_ocean_voyage_events.1.desc: "Кораблі глибоко осіли в гавані, споряджені до плавання, до якого не готова жодна мапа. [target_leader.GetName] місяцями [Select_CString(target_leader.IsFemale, 'переконувала', 'переконував')] наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] у правоті [target_leader.GetHisHer] справи: що західний океан вужчий, ніж твердять учені мужі, і що Індії лежать у межах досяжности рішучого флоту.\n\nУчені мужі лишаються непохитними. Моряки непокояться. Але вітер попутний, починається приплив, і не лишається нічого іншого, як віддати швартови."
  western_ocean_voyage_events.1.columbus: "За точними розрахунками, які здійснив [target_leader.GetName], до мети три тисячі миль, не більше."
  western_ocean_voyage_events.1.a: "Пливти далі. Що б не лежало за цим океаном, ми знайдемо це першими."
  western_ocean_voyage_events.1.historical_info: "Думка дістатися Азії морем на захід обговорювалася європейськими вченими впродовж десятиліть до першої спроби такої мандрівки. Головною перепоною була навіть не форма Землі, яку освічені люди вже вважали кулястою, а її розмір. Більшість учених слушно вважала, що океан надто широкий, і робила висновок, що перетнути його неможливо. Довести їхню неправоту вдалося лише завдяки несподіваним відкриттям, зробленим виправами на своєму шляху."
  western_ocean_voyage_events.2.title: "Край звіданого світу"
  western_ocean_voyage_events.2.desc: "Щасливі острови, як називали їх давні, лежать на самісінькому краю всіх мап, що ми маємо при собі в місцевості [ShowLocationName('northern_fuerteventura_coast')]. За їхніми межами океан не має назв, не поміряні глибини, не нанесені береги. Місцеві рибалки кажуть, що часом бачать птахів, які летять із заходу перед бурею, і [target_leader.GetName] вважає це ознакою землі за обрієм. Команда ж вважає це передвістям бурі.\n\nМи беремо на борт свіжу воду, солонину та сухарі. На заході сонця люди дивляться, як море стає золотим, а відтак темним."
  western_ocean_voyage_events.2.a: "Поповнити запаси та відплисти протягом тижня."
  western_ocean_voyage_events.2.b: "Люди не готові. Ми повертаємо назад."
  western_ocean_voyage_events.2.historical_info: "Канарські острови слугували звичним осередком вирушення для атлантичних плавб у невідомість завдяки своєму розташуванню на краю досліджених атлантичних вод і надійним пасатам, що дмуть звідти на південний захід до Карибського моря. Їхнє важливе значення розуміли настільки добре, що контроль над островами оскаржувався Португалією та Кастилією впродовж більшої частини п’ятнадцятого століття."
  western_ocean_voyage_events.3.title: "Ми зайшли вже далеко"
  western_ocean_voyage_events.3.desc: "Хліб укривається цвіллю. Діжки з водою тхнуть гниллю. Троє злягли з гарячкою. Цього ранку перед очільником [target_leader.GetName] постали посланці з простими словами: вони вже досить довго йшли на захід, не бачачи нічого, крім відкритого моря, і мають намір повернути назад на схід, згодиться [target_leader.GetNameWithNoTooltip] чи ні.\n\nЗемлі не видно в жодному боці. Немає геть нічого, лише попутний вітер, що ніс їх так далеко і не понесе назад."
  western_ocean_voyage_events.3.columbus: "[target_leader.GetNameWithNoTooltip] обіцяє команді ще три дні, посилаючись на підроблений судновий журнал."
  western_ocean_voyage_events.3.a: "Пообіцяти ще три дні й частку в усьому, що ми знайдемо."
  western_ocean_voyage_events.3.b: "Люди мають рацію. Ми повертаємо назад."
  western_ocean_voyage_events.3.historical_info: "Свідчення про плавання 1492 року фіксують справжній занепад духу приблизно через місяць атлантичного переходу, коли команда погрожувала бунтом і вимагала від Колумба повернути назад додому. Вирішення цього розбрату, яке приписують то обіцянці дістатися землі за три дні, то поміченій рослинності на воді, то просто силі переконання самого Колумба, залишається предметом суперечок. Землю побачили вже наступного ранку."
  western_ocean_voyage_events.4.title: "Земля!"
  western_ocean_voyage_events.4.desc: "Незадовго до світанку зі щоглового коша лунає вигук. Потім ще один, гучніший. А за мить кричить уже вся палуба.\n\nНа видноколі — обриси. Спершу ледь помітні, лише темна пляма на небі, але на світанку стає зрозуміло: дерева, берегова смуга, зелені пагорби, що постають зі спокійної води. Море довкола кораблів із темно-синього стало зеленим, а відтак блідо-бірюзовим. Над головою кружляють дивні птахи. Повз борт пропливають гілки з незнайомим листям.\n\n[target_leader.GetName] стоїть на носі корабля й довго мовчить.\n\nКоли човни досягають берега, острів’яни вже зібралися подивитися, і в декого з них у носі видно маленькі золоті прикраси. На запитання, більше на мигах, ніж словами, звідки взято золото, вони показують углиб острова, а дехто — на південь, у бік пагорбів, яких ніхто з команди звідси не бачить."
  western_ocean_voyage_events.4.columbus: "[target_leader.GetNameWithNoTooltip] встановлює королівський стяг і нарікає острів Сан-Сальвадором, переконаний, що дістався Індії."
  western_ocean_voyage_events.4.a: "Підняти стяг. Хай що це за земля, тепер вона належить нам."
  western_ocean_voyage_events.4.b: "Це не схоже на жодні описи Індії. Не заявляти прав, доки ми не дізнаємося більше."
  western_ocean_voyage_events.4.historical_info: "Перша зустріч європейців із народами Америки відбулася на Карибах у 1492 році. Таїно, корінні жителі Багамських островів, які називали свій острів #italic Гуанахані#!, зустрічали прибулі кораблі на узбережжі. За одне покоління моровиці, проти яких таїно не мали вродженого захисту, згубили більшу частину населення Карибських островів. Довготривалі наслідки цього плавання змінили природу, господарство й населення всіх материків Землі."
  western_ocean_voyage_events.5.title: "Острів семи міст"
  western_ocean_voyage_events.5.desc: "Десь посеред шляху, за стійкого вітру та доброго ходу кораблів, лоцмани приносять очільнику [target_leader.GetName] стару мапу. Накреслена людьми, які ніколи не борознили цей океан, вона позначає великий острів далеко на захід від #TOOLTIP:AREA,azores_area,X #L Азорських островів#!#!: Антилію, обнесену мурами й усіяну сімома містами, засновану, як подейкують, єпископами, що втекли з #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!, коли її захопило омейядське військо.\n\nНіхто на борту не бачив цього острова, і ніхто не сподівається його побачити. Але мапа стара, люди, які її креслили, не були дурнями, а тут, де на обрії немає нічого, давня оповідка варта більше, ніж коштувала б у порту."
  western_ocean_voyage_events.5.a: "Спрямувати курс за нею — раптом старі мапи не брешуть."
  western_ocean_voyage_events.5.b: "Морські мапи рясніють островами, яких ніколи не існувало."
  western_ocean_voyage_events.5.historical_info: "Антилія, або Острів семи міст, з’явилася на португальських і генуезьких морських мапах ще в 1424 році, позначаючи великий острів на захід від Азорських островів. Згідно з переказом, семеро вестготських єпископів утекли з Іберії в 714 році під час омейядського завоювання й заснували сім міст на острові в західному океані. Ця легенда пережила добу Відкриттів, яка, здавалося б, мала її спростувати: коли десятиліття потому Франсіско Васкес де Коронадо вирушив на пошуки семи золотих міст на американському Південному Заході, він назвав свою мету на честь цієї давнішої, суто європейської оповіді."
  western_ocean_voyage_events.6.title: "Where the Gold Comes From"
  western_ocean_voyage_events.6.desc: "Тлумачі ніяк не дійдуть згоди щодо кожного слова. Один запевняє, що острів’яни називають місцевість. Інший — що вони називають народ. Третій — що рух рукою на південь і жест углиб острова є двома різними відповідями на два різні запитання, які ніхто не перекладає правильно.\n\nБезперечним є лише напрямок: углиб острова, а за ним — на південь, до гір та річок, яких ніхто з команди не бачив. [target_leader.GetName] усе ж велить лоцманам позначити це на мапі — наполовину чутку, наполовину здогад, — на випадок, якщо комусь колись знадобиться знати, куди дивитися."
  western_ocean_voyage_events.6.a: "Записати як є, разом із суперечностями."
  western_ocean_voyage_events.6.b: "Залишити лише те, у чому всі згодні: у глибину суходолу, і золото."
  western_ocean_voyage_events.6.historical_info: "Ранні свідчення про перші зустрічі в Карибському морі описують, що таїно носили невеликі золоті прикраси — радше оброблені, ніж добуті на місці в скільки-небудь помітній для новоприбулих кількості. Коли їх жестами запитували, звідки взялося золото, острів’яни раз у раз показували вглиб суходолу, а за деякими свідченнями — на землі далі на південь і захід. Саме ці переказані з чужих слів і хибно витлумачені вказівки, значно більше, ніж будь-яка підтверджена знахідка, визначили, де саме наступні покоління першовідкривачів шукатимуть золото в Америці."
  western_ocean_voyage_events.7.title: "Ми читаємо донесення при [ROOT.GetCountry.Custom('endrank_PREP')]"
  western_ocean_voyage_events.7.desc: "Кораблі нарешті входять у гавань, укриті сіллю та пошарпані, і вже за кілька днів розповідь, яку [Select_CString(target_leader.IsFemale, 'подала', 'подав')] [target_leader.GetName], зачитують уголос при дворі. Острови, перехід через океан, дивні птахи та ще дивніші плоди, золото, яке носили люди, що ніколи раніше про нас не чули, — аж до тієї самої миті, коли ми з’явилися.\n\nБагато хто сумнівається в більшій частині почутого, але ми все ж записуємо все до єдиного слова. Мапи починають змінюватися, обережно, на західних полях, де раніше нічого не було накреслено."
  western_ocean_voyage_events.7.a: "Залишити донесення без змін."
  western_ocean_voyage_events.7.historical_info: "Письмові та усні донесення виправ, що повернулися, зачитувалися при королівських дворах Західної Європи вже за кілька місяців після кожної висадки, а перекладені оповіді згодом набували великої слави. Ці розповіді, спотворені перекладом і пихою їхніх авторів, описували небачені скарби в глибині суходолу, яких жоден європеєць іще не бачив на власні очі. Саме ці переказані з других уст свідчення, а не якесь підтверджене відкриття, спонукали наступні покоління мандрівників шукати джерела того, що перші прибульці бачили лише мигцем, усе далі в глибині суходільних просторів і все далі на південь."
  western_ocean_voyage_mythical_cities_tt: "Складання мап узбережжя Америки відкриє [expeditions|e] для пошуку легендарних загублених міст"