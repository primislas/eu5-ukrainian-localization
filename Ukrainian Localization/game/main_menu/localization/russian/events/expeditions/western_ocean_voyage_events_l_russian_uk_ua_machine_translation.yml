l_russian:
  western_ocean_voyage_events.provisions_up_10_tt: "The fleet takes on fresh provisions (#G +10#! Provisions)"
  western_ocean_voyage_events.provisions_up_20_tt: "The fleet takes on fresh provisions (#G +20#! Provisions)"
  western_ocean_voyage_events.morale_up_5_tt: "Morale among the crews rises (#G +5#! Crew Morale)"
  western_ocean_voyage_events.morale_up_10_tt: "Morale among the crews rises (#G +10#! Crew Morale)"
  western_ocean_voyage_events.morale_up_15_tt: "Morale among the crews rises (#G +15#! Crew Morale)"
  western_ocean_voyage_events.morale_up_30_tt: "Morale among the crews rises (#G +30#! Crew Morale)"
