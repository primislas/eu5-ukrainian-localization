  western_ocean_voyage_events.morale_down_15_tt: "Morale among the crews falls (#R -15#! Crew Morale)"
  western_ocean_voyage_events.morale_crash_20_tt: "Morale collapses, and the crews edge toward mutiny (#R -20#! Crew Morale)"
  western_ocean_voyage_events.ship_gained_tt: "The fleet gains an additional ship (#G +1#! Ships)"
  western_ocean_voyage_events.ship_lost_tt: "The fleet loses a vessel (#R -1#! Ships)"
  western_ocean_voyage_events.charted_kept_tt: "The waters the fleet charted remain on our maps"
  western_ocean_voyage_mythical_cities_tt: "Картографування берегів Америки дасть змогу спорядити [Concept('expeditions', 'виправи')|e] на пошуки її легендарних загублених міст"
  western_ocean_voyage_events.1.title: "Курс на захід"
  western_ocean_voyage_events.1.desc: "Кораблі глибоко осіли в гавані, навантажені припасами для плавання, до якого нас не готувала жодна мапа. [target_leader.GetName] місяцями [Select_CString(target_leader.IsFemale,'обстоювала', 'обстоював')] перед придворними свою правоту: океан на заході вужчий, ніж твердять учені, а Індія лежить у межах досяжности для рішучого флоту.\n\nУчені стоять на своєму. Моряки стривожені. Але вітер попутний, приплив змінюється, і лишається тільки віддати швартови."
  western_ocean_voyage_events.1.a: "Попливемо далі, хай що таїть океан. Ми знайдемо це першими."
  western_ocean_voyage_events.1.b: "Sail on, whatever the ocean holds. We shall find it first."
  western_ocean_voyage_events.1.c: "Let the winds be our chart."
  western_ocean_voyage_events.1.columbus: "[target_leader.GetNameWithNoTooltip] запевняє, що за точними розрахунками до цілі три тисячі миль, не більше."
  western_ocean_voyage_events.1.historical_info: "Ідея дістатися Азії, вирушивши морем на захід, десятки років обговорювалася європейськими вченими до першої спроби такої мандрівки. Головною перешкодою була навіть не форма Землі, яку освічені люди вже вважали кулястою, а її розмір. Більшість учених слушно вважали, що океан занадто широкий, і робили з цього висновок про те, що перетнути його неможливо. Довести їхню неправоту вдалося лише завдяки несподіваним відкриттям, які зробили виправи на своєму шляху."
  western_ocean_voyage_events.2.title: "На краю мапи"
  western_ocean_voyage_events.2.desc: "Щасливі острови, як називали їх стародавні люди, лежать на самому краю кожної мапи, якою ми послуговуємося в регіоні [ShowLocationName('northern_fuerteventura_coast')]. За ними в океану немає ні назв, ні записаних глибин, ні накреслених берегів. Місцеві рибалки кажуть, що перед бурею іноді бачать птахів, які летять із заходу, і [target_leader.GetName] вважає це знаком землі за обрієм, а команда — передвістям шторму.\n\nМи беремо прісну воду, солоне м’ясо та сухарі. На заході сонця люди дивляться, як море стає золотим, а потім темніє."
  western_ocean_voyage_events.2.a: "Поповнимо припаси та відпливемо протягом тижня."
  western_ocean_voyage_events.2.b: "Люди не готові. Повернемо назад."
  western_ocean_voyage_events.2.c: "Send boats ashore for water and goats."
  western_ocean_voyage_events.2.c.calm_tt: "The landing party returns without trouble"
  western_ocean_voyage_events.2.c.clash_tt: "The landing party clashes with the islanders"
  western_ocean_voyage_events.2.d: "Buy a caravel from the island shipwrights."
  western_ocean_voyage_events.2.e: "Water the ships and sail on with what we carry."
  western_ocean_voyage_events.2.f: "The men are not ready. We turn back."
  western_ocean_voyage_events.2.historical_info: "Канарські острови слугували звичною відправною точкою для атлантичних плавань у невідомість: вони лежать на краю досліджених вод Атлантики, а звідти на південний захід, до Карибського моря, дмуть постійні вітри. Стратегічне значення островів було настільки очевидним, що за контроль над ними Португалія та Кастилія сперечалися протягом більшої частини XV століття."
  western_ocean_voyage_events.3.title: "Ми зайшли досить далеко"
  western_ocean_voyage_events.3.desc: "Хліб укривається цвіллю. Діжки з водою тхнуть гниллю. Троє злягли в лихоманці. Цього ранку [target_leader.GetName] приймає людей із простим посланням: вони досить пливли на захід, не бачили нічого, крім відкритого моря, і мають намір повернути на схід, незалежно від того, чи погодиться із цим [target_leader.GetNameWithNoTooltip].\n\nЗемлі немає в жодному боці. Немає взагалі нічого, тільки попутний вітер у корму, який доніс їх сюди, а назад уже не понесе."
  western_ocean_voyage_events.3.a: "Пообіцяємо ще три дні й частку в усьому, що знайдемо."
  western_ocean_voyage_events.3.b: "Люди праві. Повернемо назад."
  western_ocean_voyage_events.3.columbus: "[target_leader.GetNameWithNoTooltip] обіцяє команді ще три дні, підробивши записи в судновому журналі."
  western_ocean_voyage_events.3.columbus.tt: "[target_leader.GetNameWithNoTooltip] calms the crew with a falsified log, so Crew Morale does not fall"
  western_ocean_voyage_events.3.historical_info: "У розповідях про плавання 1492 року згадується справжній занепад духу приблизно за місяць після початку переправи через Атлантику: команда погрожувала бунтом і вимагала від Колумба змінити курс і повернутися додому. Як саме владнали кризу — обіцянкою землі протягом трьох днів, появою плавучих водоростей чи просто силою особистості Колумба, — лишається предметом суперечок. Землю помітили наступного ранку."
  western_ocean_voyage_events.4.title: "Земля!"
  western_ocean_voyage_events.4.desc: "Незадовго до світанку з верхівки щогли лунає крик. Потім інший, гучніший. Потім кричить кожен, хто є на палубі.\n\nНа обрії бовваніють обриси. Спершу ледь помітне потемніння неба, але що більше світає, то виразнішими вони стають: дерева, берегова смуга, зелені пагорби над нерухомою водою. Море довкола кораблів із темно-синього стало зеленим, а потім блідо-бірюзовим. Над головою кружляють незнайомі птахи. Повз борти пропливають гілки з дивним листям.\n\n[target_leader.GetName] стоїть на носі й довго мовчить.\n\nКоли човни підходять до берега, острів’яни вже зібралися подивитися, і в декого в носі помітні малі золоті прикраси. На запитання — радше жестом, ніж словом, — звідки взялося золото, вони вказують углиб острова, а дехто — на південь, на пагорби, яких ніхто з команди звідси не бачить."
  western_ocean_voyage_events.4.a: "Встановимо стяг. Хай чим є це місце, воно належить нам."
  western_ocean_voyage_events.4.b: "Це не схоже на жоден опис Індій. Поки що нічого не оголошуватимемо своїм."
  western_ocean_voyage_events.4.columbus: "Встановимо знамено. [target_leader.GetShortNameWithNoTooltip] [Select_CString(target_leader.IsFemale,'певна', 'певен')], що ми досягли Індій."
  western_ocean_voyage_events.4.historical_info: "Перший контакт між європейцями та народами Америки стався на Карибах у 1492 році. Жителі Багамських островів таїно, які називали свій острів #italic Гуанахані#!, зустрічали прибулі кораблі з берега. Протягом одного покоління пошесті, з якими таїно раніше не стикалися, забрали життя більшости населення Карибських островів. Довгострокові наслідки цього плавання змінили природу, господарство та населення кожного континенту Землі."
  western_ocean_voyage_events.5.title: "Острів семи міст"
  western_ocean_voyage_events.5.desc: "Десь посеред переправи, за рівного вітру та доброго ходу кораблів, [target_leader.GetName] вивчає стару мапу, яку принесли лоцмани. Намальована людьми, які ніколи не плавали в цьому океані, вона позначає величезний острів далеко на захід від #TOOLTIP:AREA,azores_area,X #L Азорських островів#!#!: Антілію, обнесену мурами й усіяну сімома містами, заснованими, як подейкують, єпископами, що втекли з #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!, коли її захопили війська Омеядів.\n\nНіхто на борту цього острова не бачив і не сподівається побачити. Але мапа стара, ті, хто її креслив, не були дурнями, а тут, де на обрії нічого немає, стара легенда цінується більше, ніж у порту."
  western_ocean_voyage_events.5.a: "Прокладемо курс за нею — а раптом старі мапи не брешуть."
  western_ocean_voyage_events.5.b: "На морських мапах повно островів, яких зроду не існувало."
  western_ocean_voyage_events.5.historical_info: "Антилія, Острів семи міст, з’являється на португальських і генуезьких мапах уже в 1424 році, позначаючи великий острів на захід від Азорських островів. Легенда оповідала, що сім вестготських єпископів утекли з Іберії в 714 році під час завоювання Омеядами й заснували сім міст на острові в західному океані. Легенда пережила добу Відкриттів, яка, як вважалося, її спростувала: коли десятиліття потому Франсіско Васкес де Коронадо вирушив на пошуки семи золотих міст на південному заході Північної Америки, він запозичив назву для своєї мети з цього давнішого, суто європейського переказу."
  western_ocean_voyage_events.6.title: "Звідки береться золото"
  western_ocean_voyage_events.6.desc: "Тлумачі не сходяться у розумінні слів. Один твердить, що острів’яни називають місцевість. Інший — що народ. Третій — що рух рукою на південь і вглиб острова — це дві різні відповіді на два різних запитання, які ніхто не перекладає правильно.\n\nОдне відомо напевно — напрямок: углиб острова, а далі на південь, до гір і річок, яких ніхто з команди не бачив. [target_leader.GetName] усе одно велить лоцманам нанести на мапу цей наполовину поголос, наполовину здогад — про всяк випадок, якщо комусь колись знадобиться знати, де шукати."
  western_ocean_voyage_events.6.a: "Занесемо як є, разом із суперечностями."
  western_ocean_voyage_events.6.b: "Залишимо лише те, в чому всі згодні: золото і глибина острова."
  western_ocean_voyage_events.6.historical_info: "Ранні перекази про перший контакт на Карибах описують таїно, які носили маленькі золоті прикраси. Золото там, судячи з усього, радше обробляли, ніж добували — принаймні в обсягах, помітних для прибульців. На питання, звідки воно береться, острів’яни рухами рук неодноразово вказували вглиб суходолу, а іноді — на землі далі на південь і захід. Саме ці чужі, хибно витлумачені вказівки, а не якісь підтверджені знахідки, визначили напрямок, у якому наступні покоління шукачів рушали за золотом в Америці."
  western_ocean_voyage_events.7.title: "Ми зачитали донесення перед двором"
  western_ocean_voyage_events.7.desc: "Кораблі нарешті входять у гавань, покриті сіллю та пошарпані бурями, і вже за кілька днів ми зачитуємо вголос оповідь, яку [Select_CString(target_leader.IsFemale,'привезла', 'привіз')] [target_leader.GetName]: острови, переправи, дивовижні птахи та ще дивовижніші плоди, золото на людях, які нічого про нас не чули до нашої появи.\n\nДехто бере під сумнів більшість почутого, проте ми все одно записуємо геть усе. Мапи починають обережно змінюватися на західних полях, де раніше нічого не зображували."
  western_ocean_voyage_events.7.desc.later: "The ships make harbor at last, salt-crusted and battered, and within days we read [target_leader.GetName]'s account aloud at [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Another crown's sailors reached these islands before ours, and their reports have long since made the rounds of every court.\n\nYet our fleet has crossed the same ocean and come home, and that is no small thing. Our pilots now know the western winds for themselves, and no foreign chart can teach them that."
  western_ocean_voyage_events.7.a: "Залишимо доповідь як є."
  western_ocean_voyage_events.7.historical_info: "Письмові й усні звіти повернутих виправ зачитувалися при королівських дворах по всій Західній Європі впродовж кількох місяців після кожного сходу на берег, а їхні переклади згодом розійшлися повсюди. Ці оповіді, викривлені під час перекладу та роздуті марнославством самих розповідачів, описували казкові багатства в глибині суходолу, яких жоден європеєць ще не бачив на власні очі. Саме ці свідчення з чужих уст, значно більше, ніж будь-які підтверджені відкриття, спонукали наступні покоління мандрівників вирушати все далі вглиб материка й усе південніше на пошуки джерел того, що перші прибульці встигли побачити лише краєм ока."
  western_ocean_voyage_events.8.title: "Mutiny on the Open Sea"
  western_ocean_voyage_events.8.desc: "It begins with muttering at the change of watch and ends with knives drawn on the main deck. The crew of one of our ships has locked its officers below and sends word across the water: they will steer for home at first light, and they will board any ship that tries to stop them.\n\n[target_leader.GetName] stands at the rail and weighs the distance between the two hulls. Behind [target_leader.GetHerHim], the loyal crews watch to see what [target_leader.GetSheHe] will do."
  western_ocean_voyage_events.8.a: "Let the mutineers take their ship and go home."
  western_ocean_voyage_events.8.b: "Board them. A ship at sea is no council."
  western_ocean_voyage_events.8.fight_win_tt: "The officers prevail and restore order"
  western_ocean_voyage_events.8.fight_lose_tt: "The fighting is bloody, and the fleet pays for it"
  western_ocean_voyage_events.8.c: "Speak to them of the Indies, and the gold waiting there."
  western_ocean_voyage_events.8.rouse_tt: "[target_leader.GetNameWithNoTooltip]'s words rekindle the crew's resolve"
  western_ocean_voyage_events.9.title: "Fever Below Decks"
  western_ocean_voyage_events.9.desc: "The water in the casks has gone green and the salt meat crawls. First a few men take to their hammocks with fever, then a dozen, then so many that the officers can barely man the watches. The surgeon has bled them and purged them and can do no more.\n\nThe healthy look at the sick and then at the empty horizon, and do not say aloud what they are all thinking."
  western_ocean_voyage_events.9.a: "Shorten sail and tend the sick until the fever breaks."
  western_ocean_voyage_events.9.b: "We cannot spare the days. Bury the dead and sail on."
  western_ocean_voyage_events.9.historical_info: "Long ocean passages in the fifteenth century were limited less by navigation than by what a ship could carry. Water stored in wooden casks fouled within weeks, salted provisions spoiled in the heat, and crews packed into small hulls passed fevers and dysentery between them. Captains bound for the open Atlantic took on fresh stores at the last port they could, often the Canaries or the Cape Verde islands, because once they left it there was nowhere to take on more."
  western_ocean_voyage_events.10.title: "Home Before the Edge"
  western_ocean_voyage_events.10.desc: "The fleet comes back into harbor long before anyone expected it, its holds still half full and its crews whole. They found no land, only open water and a wind that would not let them forget how far they were from home.\n\nAt court, people speak of the voyage quietly, when they speak of it at all. Still, the pilots kept their logs, and our charts of the western waters now reach a little further than they did before."
  western_ocean_voyage_events.10.a: "The ocean will still be there next time."
  western_ocean_voyage_events.11.title: "Never Heard From Again"
  western_ocean_voyage_events.11.desc: "Months pass with no word from the fleet that sailed west. Then a year. The merchants who invested in the voyage write off their shares, and the families of the crews stop waiting at the harbor wall.\n\nWhether the ships foundered in a storm, ran out of water in the open ocean, or simply sailed on until there was nothing left, no one will ever know. All we have left is the last report the fleet sent home before it sailed beyond the charted world."
  western_ocean_voyage_events.11.a: "The sea has taken them. Pray for their souls."
  western_ocean_voyage_events.11.historical_info: "Atlantic voyages into the unknown often ended without a trace. The Genoese brothers Ugolino and Vadino Vivaldi sailed west through the Strait of Gibraltar in 1291, seeking a sea route to India, and were never heard from again. Two centuries later, the Portuguese brothers Gaspar and Miguel Corte-Real vanished on separate voyages to the northwestern Atlantic in 1501 and 1502."
  western_ocean_voyage_events.13.title: "A Sea of Weed"
  western_ocean_voyage_events.13.desc: "For days now the ships have sailed through floating meadows of yellow-green weed, so thick in places that it seems to hold the hulls back. The older hands swear it means shallows ahead, and that the fleet will run aground on some sunken shore before anyone sees it.\n\n[target_leader.GetName] orders the lead line made ready. The men watch the water, and wait to hear what it will tell them."
  western_ocean_voyage_events.13.a: "Heave to and sound the depths."
  western_ocean_voyage_events.13.b: "Weed is no reef. Hold our course and sail through."
  western_ocean_voyage_events.13.c: "Our pilot reads the weed as current, not shallows."
  western_ocean_voyage_events.13.historical_info: "The Sargasso Sea, a region of the North Atlantic covered by floating mats of sargassum seaweed, lies across the route from the Canaries to the Caribbean. Columbus's fleet entered it in September 1492. His crews feared the weed marked hidden shallows or would trap the ships, but soundings found no bottom, and the fleet passed through unharmed."
  western_ocean_voyage_events.14.title: "Signs of Land"
  western_ocean_voyage_events.14.desc: "A lookout spots a carved stick drifting past the bow, then a green branch still bearing leaves and berries. Flocks of birds pass overhead at dusk, all flying the same way, toward the southwest.\n\nNo one says the word aloud yet. But the men who threatened to turn back a few days ago now crowd the rails at every change of watch, staring at the horizon."
  western_ocean_voyage_events.14.a: "Follow the birds. Land cannot be far."
  western_ocean_voyage_events.14.b: "Mark it in the log and keep our heading."
  western_ocean_voyage_events.14.historical_info: "In the days before landfall in October 1492, Columbus's log records a carved stick, a branch with berries, reeds, and great flocks of birds flying southwest. On 7 October he altered course to follow the birds, a change that brought the fleet to the Bahamas five days later."
  western_ocean_voyage_events.15.c: "Our pilot knows these skies. Steer for the calm quarter."
  western_ocean_voyage_events.16.c: "Our pilot knows where the wind returns. Go and find it."