l_russian:
  steppe_embassy_events.1.title: "Посольство до степових дворів"
  steppe_embassy_events.1.desc: "Посольство вирушає в дорогу. Двір, де править великий $rank_kingdom_horde_ruler_suffix_male$, лежить за багато місяців шляху на схід, крізь пустелі та безкраї степи."
  steppe_embassy_events.1.desc.glh: "$steppe_embassy_events.1.desc$ [dest_city.GetName] — перлина волзького степу, осідок, звідки править $rank_kingdom_horde_ruler_suffix_male$ #ONCLICK:COUNTRY,[dest_country.GetKey] #TOOLTIP:COUNTRY,[dest_country.GetKey],X [dest_country.Custom('CL_GEN')|L]#!#!. Шлях пролягає на північний схід через порти #TOOLTIP:AREA,black_sea_area,X #L Причорномор’я#!#! просто у відкритий степ. Те, як покаже [target_leader.GetHimHerself] [target_leader.GetName] при [dest_country.GetAdjectiveWithNoTooltip|l]ому дворі, вирішить усе."
  steppe_embassy_events.1.desc.chg: "$steppe_embassy_events.1.desc$ [dest_city.GetName] — стародавнє місто Шовкового шляху, столиця #ONCLICK:COUNTRY,[dest_country.GetKey] #TOOLTIP:COUNTRY,[dest_country.GetKey],X [dest_country.Custom('CL_GEN')|L]#!#!. Шлях пролягає через #TOOLTIP:REGION,persia_region,X #L Персію#!#! та крізь гори просто в серце #TOOLTIP:CONTINENT,asia,X #L Азії#!#!. Те, як покаже [target_leader.GetHimHerself] [target_leader.GetName] при [dest_country.GetAdjectiveWithNoTooltip|l]ому дворі, вирішить усе."
  steppe_embassy_events.1.a: "Їхати як воїни: наша сила — єдина грамота, що нам потрібна."
  steppe_embassy_events.1.b: "Пишне посольство: [ShowGoodsNameWithNoTooltip('silver')|l], [ShowGoodsNameWithNoTooltip('silk')|l] та пишні церемонії — цього вистачить, щоб вразити навіть таку величну особу, як [dest_country.Custom('GetRulerOrRegentTitle')]."
  steppe_embassy_events.1.c: "Скромне торгове посольство: ділове, шанобливе та з дарами, яких вистачить, аби відчинити будь-які двері."
  steppe_embassy_events.1.historical_info: "Прямі посольські зносини з монгольськими державами-спадкоємицями були повсякчасним прагненням європейських та близькосхідних правителів протягом усього XIV століття. Західні посольства до Ільханату, Золотої Орди та інших дворів різнилися від пишних урочистих виправ до суто ділових торгових починань, і кожне залежало від того, яку вигоду сподівався здобути відправник."
  steppe_embassy_events.2.title: "На краю степу"
  steppe_embassy_events.2.desc: "Караван зупиняється на межі. Попереду земля вирівнюється в безкрає море трав, що сягає самого небокраю. Вершники, яких вислав [dest_country.GetAdjectiveWithNoTooltip|l]ий [dest_country.GetGovernment.GetCourtTitle|l], уже кілька днів стежать за колоною, яку веде [target_leader.GetName], пильнуючи здалеку й не наближаючись. Хоч би яке враження склалося тут, воно докотиться до двору раніше за саме посольство."
  steppe_embassy_events.2.a: "Рушати вперед строєм, піднявши знамена й наставивши списи. Нехай розкажуть про те, що побачили."
  steppe_embassy_events.2.b: "Вислати наперед оповісника з дарами й просити про почесну сторожу до двору."
  steppe_embassy_events.2.c: "Офіційно сповістити про себе й чекати на їхній дозвіл перетнути межу."
  steppe_embassy_events.2.historical_info: "Кордони монгольських держав-спадкоємиць були відкритими, але пильно охоронялися. Купці, посли та місіонери вільно перетинали їх, проте поява без належного представлення могла бути сприйнята як образа чи загроза."
  steppe_embassy_events.3.title: "Вершники на обрії"
  steppe_embassy_events.3.desc: "Уже три дні ті самі далекі постаті невідступно слідують за колоною: з десяток вершників, які не наближаються, не відступають, а лише спостерігають. Степ належить тим, хто вміє його розуміти. [dest_country.GetAdjectiveWithNoTooltip|l]ий [dest_country.GetGovernment.GetCourtTitle|l] дізнається про все задовго до того, як туди дістанеться [target_leader.GetName]."
  steppe_embassy_events.3.a: "Тримати колону щільно. Нехай побачать нашу дисципліну."
  steppe_embassy_events.3.b: "Вислати вершника наперед із запрошенням. Можливо, вони приєднаються до нашого багаття."
  steppe_embassy_events.3.historical_info: "Стеження за наближенням чужоземних посольств було звичною справою при степових дворах. Відомості про чисельність гостей, їхнє спорядження та поведінку визначали те, як їх прийматимуть."
  steppe_embassy_events.4.title: "Розбійники на шляху"
  steppe_embassy_events.4.desc: "Шлях звужується в ущелині, і дорогу перетинають озброєні люди — зо два десятки, у лахмітті, але з доброю зброєю. Їхній ватажок вигукує вимогу сплатити мито мовою, якої не знає [target_leader.GetName]. Тлумач перекладає: десять коней або срібло на ту саму ціну. Вони роблять це не вперше."
  steppe_embassy_events.4.a: "Заплатити. Сутичка тут може коштувати дорожче за гроші."
  steppe_embassy_events.4.b: "Показати їм, що ми подолали такий шлях не для того, щоб нас грабували якісь розбійники."
  steppe_embassy_events.4.historical_info: "Великі степові шляхи ніколи не були цілком безпечними. Навіть офіційні посольства ризикували наразитися на розбійників, збунтованих вояків та пройдисвітів, які орудували там, де послаблювалася влада ханів."
  steppe_embassy_events.5.title: "Купецькі знання"
  steppe_embassy_events.5.desc: "У #TOOLTIP:BUILDING_TYPE,caravanserai,X #L караван-сараї#!#! на шляху на схід бувалий купець за чаєм заводить розмову з нашим посланцем, якого звуть [target_leader.GetName]. Він уже п’ять разів відвідував [dest_country.GetAdjectiveWithNoTooltip|l]ий [dest_country.GetGovernment.GetCourtTitle]. Він знає, які дарунки можуть образити, яких звичаїв слід дотримуватися при вході до тронної зали і чого цьогоріч очікує від чужоземних гостей [dest_country.Custom('GetRulerOrRegentTitle')|l]. Він пропонує поділитися всіма відомостями — за певну ціну."
  steppe_embassy_events.5.a: "Заплатити за його поради. Відомості про [dest_country.GetAdjectiveWithNoTooltip|l]ий [dest_country.GetGovernment.GetCourtTitle] дорожчі за золото."
  steppe_embassy_events.5.b: "Ми вже дізналися все, що було потрібно. Подякувати йому та рушити далі."
  steppe_embassy_events.5.historical_info: "Мережі купців Шовкового шляху були найкращими розвідувальними службами середньовічного світу. Досвідчений торговець, який неодноразово об'їжджав великі азійські двори, володів політичними відомостями, недоступними в жодній європейській книгозбірні."
  steppe_embassy_events.6.title: "Прийом в [target_location.Custom('LR_PREP')] [target_location.GetNameWithNoTooltip]"
  steppe_embassy_events.6.desc: "Намети [target_location.Custom('LR_GEN')] [target_location.GetName] тягнуться вздовж Волги на багато миль. Посередині височіє велика юрта, де сидить правитель [court_host.GetName]: вона сяє сусальним #TOOLTIP:GOODS,goods_gold,X #L золотом#!#! та #TOOLTIP:GOODS,silk,X #L шовковими#!#! завісами в оточенні шатер десятка підвладних князів і незмінного урядового ладу світової імперії. Нашого посланця на ймення [target_leader.GetName], приймають у зовнішній залі й відводять йому місце за три ряди від трону — саме там, де й належить бути слугам дрібної чужоземної країни. Правитель [court_host.GetNameWithNoTooltip] спостерігає за цим із терплячою байдужістю володаря, який прийняв уже сотню подібних посольств."
  steppe_embassy_events.6.a: "Кинути виклик їхнім вершникам і помірятися військовою вправністю у відкритому полі."
  steppe_embassy_events.6.b: "Піднести дарунки з усією урочистістю, якої вимагає ця подія."
  steppe_embassy_events.6.c: "Запропонувати відкрити торговий шлях через землі [court_country.Custom('CL_GEN')]."
  steppe_embassy_events.6.d: "Скористатися знаннями, здобутими в дорозі: звичаями, протоколом і тим, що цікавить цей [court_country.GetGovernment.GetCourtTitle]."
  steppe_embassy_events.6.historical_info: "Золота Орда плекала витончену придворну культуру, що поєднувала монгольські звичаї з перською урядовою вишуканістю та дивовижною відкритістю до чужоземних купців і послів. Упродовж XIV століття двір у Сараї приймав посольства з Візантії, Єгипту та багатьох європейських королівств."
  steppe_embassy_events.7.title: "Прийом в [target_location.Custom('LR_PREP')] [target_location.GetNameWithNoTooltip]"
  steppe_embassy_events.7.desc: "[target_location.GetName] виявляється зовсім не таким, як [Select_CString(target_leader.IsFemale, 'сподівалася', 'сподівався')] [target_leader.GetName]. Медресе та мінарети височіють над вулицями, сповненими купців з усіх куточків відомого світу. Двір, де править [court_host.GetName], приймає посольство в залі з блакитних кахлів і різьбленого стуко в оточенні астрономів, поетів і послів із десятка східних країн. Правитель [court_host.GetNameWithNoTooltip] сидить на троні, оздобленому нефритом, а обабіч нього писарі одночасно занотовують усе [ShowLanguageName('persian_language')|l]им та [ShowLanguageName('mongolian_language')|l]им письмом."
  steppe_embassy_events.7.a: "Розпочати філософську бесіду з придворними вченими. Правитель [court_host.GetNameWithNoTooltip] може запропонувати дещо більше, ніж просто війська."
  steppe_embassy_events.7.b: "Піднести дарунки з усією урочистістю, якої вимагає ця подія."
  steppe_embassy_events.7.c: "Запропонувати торгову угоду, щоб відкрити шляхи через землі [court_country.Custom('CL_GEN')]."
  steppe_embassy_events.7.d: "Застосувати поради купця щодо особливих звичаїв, які має цей [court_country.GetGovernment.GetCourtTitle]."
  steppe_embassy_events.7.historical_info: "Самарканд за часів Чагатайського ханства, а згодом і Тимуридів, став одним із найвизначніших осередків ісламської вченості й торгівлі у світі. Тут панував витончений і космополітичний двір, відтак від чужоземних посольств очікували не лише політичного, а й культурного авторитету."