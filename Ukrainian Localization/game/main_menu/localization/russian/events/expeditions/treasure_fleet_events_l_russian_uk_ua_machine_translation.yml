l_russian:
  treasure_fleet_events.1.title: "Доба морських виправ"
  treasure_fleet_events.1.entry: "$treasure_fleet_events.1.title$"
  treasure_fleet_events.1.desc: "Останні десятиліття були напрочуд щедрими, і в скарбниці зібралося багато грошей та іншої сировини. Ці кошти можна спрямувати на подальше зміцнення і без того міцного становища #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Серединної держави#!#! в очах решти світу. Ми спорудимо величезний флот і спорядимо в усі кінці світу ескадри, сповнені найкоштовніших скарбів #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, аби переконати заморські країни стати нашими #TOOLTIP:SUBJECT_TYPE,tributary,X #L данниками#!#!."
  treasure_fleet_events.1.a: "Так ми й вчинимо!"
  chi_able_to_send_treasure_voyages: "[ROOT.GetCountry.GetName] отримає доступ до [Concept('action', 'дії')|e] «[ShowGenericActionName('start_a_treasure_voyage')]», яка дає змогу в обмін на [Concept('gold', 'гроші')|e] залучати нові країни до системи #TOOLTIP:SUBJECT_TYPE,tributary,X #L данників#!#!. Це можливо лише доти, доки [ROOT.GetCountry.GetName] залишається [Concept('international_organization_leader_short', 'лідером')|e] #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,middle_kingdom,X #L Серединної держави#!#!."
  treasure_fleet_events.2.title: "Кінець доби"
  treasure_fleet_events.2.desc: "Оглядаючись на добу морських виправ, люд #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! бачить лише марнування коштів. Задля швидкоплинної слави країни було витрачено величезні кошти. Майбутнім літописцям краще не згадувати про цей ганебний випадок у нашій історії…"
  treasure_fleet_events.2.a: "Що ж, нічого не вдієш."
  chi_unable_to_send_treasure_voyages: "[ROOT.GetCountry.GetName] більше не зможе здійснювати дію «[ShowGenericActionName('start_a_treasure_voyage')]»."
  treasure_fleet_events.3.title: "Виправа вирушає"
  treasure_fleet_events.3.desc: "Після тривалих зборів наш великий флот нарешті готовий до відплиття. $expedition_leader_name$ з командою вирушають у невідомість: на шляху до області [target_area.GetName] вони зіткнуться з дивовижними пригодами та страшними лихами, але ми певні, що наші моряки не підведуть — адже для цього завдання їх [Select_CString(ROOT.GetCountry.GetGovernment.GetRulerOrRegent.IsFemale, 'обрала сама', 'обрав сам')] [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName].\n\nНа світанку флот вирушить із порту [start_location.Custom('LR_GEN')|l] [start_location.GetName]. Мине не один рік, перш ніж ескадра повернеться до наших берегів. Побажаємо їм щасливої дороги!"
  treasure_fleet_events.3.a: "Хай щастить!"
  chinese_treasure_expeditions_send_tooltip: "The $expedition_name_treasure_voyage$ is sent towards [ROOT.GetVariable('chinese_treasure_target_location').GetLocation.GetName] under the leadership of [character_expedition_leader_target.GetName].\nThe fleet holds #g [ROOT.GetVariable('chinese_treasure_voyage_cargo').GetValue|2]#! [gold|e] worth in cargo intended for gifts to [countries|e] that they will visit."
  treasure_fleet_events.4.title: "Вісті з $expedition_name_treasure_voyage$"
  treasure_fleet_events.4.desc: "A junk has put in at one of the southern ports with news from the $expedition_name_treasure_voyage$. The fleet under $expedition_leader_name$ has reached the harbor of [port_location.GetName] in the country of [port_country.GetName], and the local court has been received in due form. Trade goods have been exchanged, the customary gifts presented to the ruler. The fleet's chronicler reports the wind and the season are favorable for the next leg of the journey. There is, the captain notes, no immediate reason for the imperial court to expect ill news."
  treasure_fleet_events.4.a: "Нехай вітер і надалі буде попутним."
  treasure_fleet_events.5.title: "$expedition_name_treasure_voyage$ прибуває з [expedition_initiator.Custom('CL_GEN')]"
  treasure_fleet_events.5.desc: "На світанку перед містянами [target_stop.Custom('LR_GEN')|l] [target_stop.GetName] постає неймовірне, навіть лячне видовище. Обрій перетворюється на справжній ліс щогл — до гавані наближається величезний #L [expedition_initiator.GetAdjective|l]ий#! флот #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Серединної держави#!#!. $expedition_leader_name$ на чолі ескадри сходить на берег за дозволом поповнити припаси в [target_stop.Custom('LR_PREP')|l] [target_stop.GetNameWithNoTooltip]. А потому стається дещо дивне: [expedition_initiator.GetAdjectiveWithNoTooltip|l]і моряки буквально обсипають місцевих урядовців коштовними дарунками. Вони хочуть, аби [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'прийняла', 'прийняв')] їхнє посольство."
  treasure_fleet_events.5.a: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] з радістю зустріне чужоземних гостей."
  treasure_fleet_events.5.a.entry: "Запросимо їх до нашого двору."
  treasure_fleet_events.6.title: "[ROOT.GetCountry.GetGovernment.GetRulerTitle|U] приймає гостей"
  treasure_fleet_events.6.desc: "$expedition_leader_name$ зі супутниками нарешті прибули до палацу. Спочатку [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'наша вельмишановна', 'наш вельмишановний')] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'була глибоко вражена', 'був глибоко вражений')] розмірами їхньої ескадри та щедрими дарунками. Тим сильнішим було розчарування, коли чужоземці, власне, запропонували нам стати [expedition_initiator.GetAdjectiveWithNoTooltip|l]ими #TOOLTIP:SUBJECT_TYPE,tributary,X #L данниками#!#!. З іншого боку, коритися настільки могутній країні не так уже й погано, як може здатися…"
  treasure_fleet_events.6.a: "Усяка дружба має свою ціну."
  treasure_fleet_events.6.b: "Ми не скоримося!"
  chinese_expedition_resolution_tt: "$expedition_name_treasure_voyage$ з Китаю наступні кілька місяців стоятиме в порту [target_stop.GetName]. У цей час відбуватимуться [Concept('events', 'події')|e], під час яких ми зможемо поспілкуватися з китайцями та змінити їхню думку про нас. Коли флот відпливе додому, ми дізнаємося, яке враження наша васальна країна справила на посланців: \n\nСлухняне (від #y 67#! до #y 100#!):\n[ShowScriptedEffectForScope('chi_expedition_resolution_very_positive', ROOT.GetCountry.MakeScope.Self)]\nДружнє (від #y 33#! до #y 66#!):\n[ShowScriptedEffectForScope('chi_expedition_resolution_positive', ROOT.GetCountry.MakeScope.Self)]\nБайдуже (від #y −32#! до #y 32#!):\n$NOTHING_HAPPENS_EFFECT$\nНешанобливе (від #y −66#! до #y −33#!):\n[ShowScriptedEffectForScope('chi_expedition_resolution_negative', ROOT.GetCountry.MakeScope.Self)]\nЗверхнє (від #y −100#! до #y −67#!):\n[ShowScriptedEffectForScope('chi_expedition_resolution_very_negative', ROOT.GetCountry.MakeScope.Self)]"
  treasure_fleet_events.7.title: "Гідні дарунки"
  treasure_fleet_events.7.desc: "Завершивши виправу на землях #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, золотий флот #ONCLICK:COUNTRY,[expedition_initiator.GetKey] #TOOLTIP:COUNTRY,[expedition_initiator.GetKey],X [expedition_initiator.Custom('CL_GEN')|L]#!#! готується до швидкого виходу в море. За звичаєм, на знак пошани та на підтвердження нашого становища #TOOLTIP:SUBJECT_TYPE,tributary,X #L данників#!#! ми маємо піднести їм усе найкраще, чим славиться наша країна."
  treasure_fleet_events.7.a: "Ми покажемо їм свою щедрість."
  treasure_fleet_events.7.gift: "Ми піднесемо їм свої дивовижі."
  treasure_fleet_events.7.b: "Ми не можемо собі цього дозволити…"
  treasure_fleet_events.8.title: "Виправа відпливає"
  treasure_fleet_events.8.desc: "#L [expedition_initiator.GetAdjective]ий#! золотий флот нарешті залишає гавань [target_stop.Custom('LR_GEN')|l] [target_stop.GetName]. Чужоземні гості надовго запам’ятають гостинність нашої країни, ми ж побажаємо їм успіху й доброї путі."
  treasure_fleet_events.8.a: "До побачення!"
  chi_fleet_will_depart: "#L [expedition_initiator.GetAdjective]а#! виправа покине #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#!."
  chinese_expedition_opinion: "Думка членів золотого флоту"
  based_on_expedition_opinion: "$chinese_expedition_opinion$ зараз становить [ROOT.GetVariable('chinese_expedition_opinion').GetValue], тому відбудеться таке:"
  treasure_fleet_events.9.title: "$expedition_name_treasure_voyage$ повернеться додому"
  treasure_fleet_events.9.desc: "Ескадра, яку ми кілька років тому відрядили до [ROOT.GetVariable('chinese_treasure_target_location').GetLocation.Custom('LR_ACC')|l] [ROOT.GetVariable('chinese_treasure_target_location').GetLocation.GetName], нарешті повернулася додому. Відважні мореплавці привезли із собою чужоземних посланців і безліч дарів, отриманих під час довгих мандрів. $expedition_leader_name$ уже їде до столиці, щоб представити двору чужоземних послів і дарунки з далеких країн."
  treasure_fleet_events.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  treasure_fleet_events.9.a.entry: "$common_string_brilliant$"
  treasure_fleet_events.10.title: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] зустрічає виправу"
  treasure_fleet_events.10.desc: "$expedition_leader_name$ із тріумфом повертається до міста [ROOT.GetCountry.GetCapital.GetName], де виправу зустрічає радісний натовп. Мандрівники доправили до двору посланців із багатьох країн, готових присягнути на вірність [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'нашій володарці', 'нашому володарю')]. [ROOT.GetCountry.GetGovernment.GetRulerTitle] вельми [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'втішена', 'втішений')] їхньою згодою відвідати столицю."
  treasure_fleet_events.10.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  treasure_fleet_events.10.a.entry: "$common_string_brilliant$"
  treasure_fleet_events.11.title: "Завершення справи"
  treasure_fleet_events.11.desc: "$expedition_name_treasure_voyage$ повернувся додому. Залишилося підбити підсумки та з’ясувати, чи виправдала ця виправа витрачені кошти й чи варто організовувати такі коштовні почини в майбутньому."
  treasure_fleet_events.11.a: "Треба готувати нові справи."
  chi_we_will_gift_cloves: "[expedition_initiator.GetName] отримає від нас #TOOLTIP:GOODS,cloves,X #L гвоздику#!#!."
  chi_we_will_gift_giraffe: "[expedition_initiator.GetName] отримає від нас жирафа."
  chi_we_will_gift_persian_blue: "[expedition_initiator.GetName] отримає від нас місцевий #TOOLTIP:GOODS,dyes,X #L барвник#!#!."
  treasure_fleet_events.12.title: "Дивовижний звір"
  treasure_fleet_events.12.desc: "$expedition_name_treasure_voyage$ привозить додому дивовижного звіра, від вигляду якого [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] і [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] сповнюються невимовного захвату! Цю велику плямисту тварину з неймовірно довгою шиєю за кордоном називають жирафом, проте наші придворні знаходять у ній разючу схожість із #italic цилінем#! — істотою з #TOOLTIP:CULTUREGROUP,chinese_group,X #L китайських#!#! міфів, що віщує золоту добу для нинішньої династії. Ми можемо скористатися цією легендою, щоб примножити нашу славу, але в такому разі завищимо сподівання людей."
  treasure_fleet_events.12.a: "Це легендарний #italic цилінь#!!"
  treasure_fleet_events.12.b: "Звір і справді дивовижний."
  treasure_fleet_events.13.title: "Незрівнянний колір"
  treasure_fleet_events.13.desc: "Наша славетна виправа привезла з #TOOLTIP:SUB_CONTINENT,middle_east,X #L Близького Сходу#!#! дивовижний #TOOLTIP:GOODS,dyes,X #L барвник#!#! насиченого синього кольору, який матиме чудовий вигляд на нашій уславленій #TOOLTIP:GOODS,pottery,X #L кераміці#!#!. Такого обсягу якраз вистачить на глазурування перших партій."
  treasure_fleet_events.13.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  treasure_fleet_events.13.a.entry: "$common_string_brilliant$"
  treasure_fleet_events.14.title: "Вишуканий смак"
  treasure_fleet_events.14.desc: "#TOOLTIP:REGION,indonesia_region,X #L Індонезія#!#! славиться своїми прянощами, але такої духмяної #TOOLTIP:GOODS,cloves,X #L гвоздики#!#!, як на #TOOLTIP:AREA,moluccas_area,X #L Молуккських островах#!#!, немає більше ніде. Місцеві жителі прийняли нашу делегацію винятково гостинно і подарували нам велику партію цієї вишуканої приправи. $expedition_name_treasure_voyage$ привозить додому стільки гвоздики, що [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] та [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] зможуть насолоджуватися її смаком кілька місяців поспіль."
  treasure_fleet_events.14.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  treasure_fleet_events.14.a.entry: "$common_string_brilliant$"
  treasure_fleet_events.15.title: "Спіймання [Select_CString(extradited_character.IsFemale,'втікачки', 'втікача')]"
  treasure_fleet_events.15.desc: "$expedition_name_treasure_voyage$ приносить несподівані плоди: $expedition_leader_name$ та $expedition_leader_name_herhis$ вірна команда моряків зуміли вистежити [Select_CString(extradited_character.IsFemale,'відому баламутку', 'відомого баламута')] на ім'я [extradited_character.GetName]. [extradited_character.GetShortNameWithNoTooltip] давним-давно [Select_CString(extradited_character.IsFemale,'покинула', 'покинув')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#!, уникнувши правосуддя. Проте наша виправа не лише знайшла [Select_CString(extradited_character.IsFemale,'нікчему', 'нікчему')], а й відбила [Select_CString(extradited_character.IsFemale,'її', 'його')] в охорони сховку на території #ONCLICK:COUNTRY,[asylum_country.GetKey] #TOOLTIP:COUNTRY,[asylum_country.GetKey],X [asylum_country.Custom('CL_GEN')|L]#!#!. Тепер [Select_CString(extradited_character.IsFemale,'вона', 'він')] перебуває в #TOOLTIP:SUB_CONTINENT,china,X #L Китаї#!#! й очікує на покарання."
  treasure_fleet_events.15.a: "Ми повісимо [Select_CString(extradited_character.IsFemale,'цю жалюгідну злочинницю', 'цього жалюгідного злочинця')]!"
  treasure_fleet_events.15.b: "Ми [Select_CString(extradited_character.IsFemale,'її', 'його')] стинемо!"
  treasure_fleet_events.15.b.entry: "Відрубаємо йому голову."
  treasure_fleet_events.15.c: "Ми проведемо #italic лінчі#!: покраємо [Select_CString(extradited_character.IsFemale,'її', 'його')] на шматки."
  treasure_fleet_events.15.d: "Ми помилуємо [Select_CString(extradited_character.IsFemale,'втікачку: вона', 'втікача: він')] нам ще стане у пригоді."
  treasure_fleet_events.15.d.entry: "Помилуємо інакодумця: він ще стане нам у пригоді."
  treasure_fleet_events.16.title: "Страта пірата на ім'я [executed_character.GetNameWithNoTooltip]"
  treasure_fleet_events.16.desc: "[executed_character.GetName] походить із області [executed_character.GetBirthLocation.GetArea.GetName]. Після запровадження #TOOLTIP:POLICY,haijin_policy,X #L Хайцзіня#!#! [Select_CString(executed_character.IsFemale,'її', 'його')] родина подається в пірати. Утікши з країни, [executed_character.GetShortNameWithNoTooltip] очолює піратську спільноту на території #ONCLICK:COUNTRY,[loser_country.GetKey] #TOOLTIP:COUNTRY,[loser_country.GetKey],X [loser_country.Custom('CL_GEN')|L]#!#!. $expedition_leader_name$ згодом бере участь у кількох битвах біля берегів [loser_country.Custom('rank_ua_GEN')], де [executed_character.GetNameWithNoTooltip] виступає на боці супротивника. Час поквитатися з [Select_CString(executed_character.IsFemale,'цією негідницею', 'цим негідником')], щоби іншим не кортіло!"
  treasure_fleet_events.16.a: "Правосуддя здійснилося."
  treasure_fleet_events.17.title: "[Select_CString(loser_character.IsFemale,'Норовиста володарка', 'Норовистий володар')]"
  treasure_fleet_events.17.desc: "$expedition_name_treasure_voyage$ підносить приємну несподіванку: під час мандрівки $expedition_leader_name$ та команда схопили дуже важливу особу. Це [loser_character.GetName], у минулому [loser_country.GetGovernment.GetRulerTitle|l] [loser_country.Custom('longname_ua_GEN')]. Кричуща неповага до сюзерена привела [Select_CString(loser_character.IsFemale,'норовисту володарку', 'норовистого володаря')] до стрімкої поразки. Тепер [Select_CString(loser_character.IsFemale,'вона', 'він')] карається в нашому полоні."
  treasure_fleet_events.17.a: "Ми з [Select_CString(loser_character.IsFemale,'нею', 'ним')] порахуємося."
  treasure_fleet_events.17.a.entry: "Покараємо його для науки іншим."
  treasure_fleet_events.17.b: "Ми виявимо милосердя."
  treasure_fleet_events.18.title: "Майбутнє [loser_country.Custom('CL_GEN')]"
  treasure_fleet_events.18.desc: "Правитель #ONCLICK:COUNTRY,[loser_country.GetKey] #TOOLTIP:COUNTRY,[loser_country.GetKey],X [loser_country.Custom('CL_GEN')|L]#!#! через власне безглуздя вирішує виступити проти #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Серединної Держави#!#!, яку представляє $expedition_leader_name$ зі своєю виправою. [loser_country.GetLongNameWithNoTooltip] зазнає поразки в запеклій сутичці, і, доки триває розгляд справи, на порожнє місце тимчасово призначається [loser_country.GetGovernment.GetRulerTitle|l]."
  treasure_fleet_events.18.a: "Відправимо намісника. Нехай ним стане [target_character_for_viceroyalty.GetNameWithNoTooltip]."
  treasure_fleet_events.18.a.entry: "Нехай править як наш намісник."
  treasure_fleet_events.18.b: "Нехай місцевий номінальний правитель залишається."
  treasure_fleet_events.19.title: "Намісник із країни [expedition_initiator.GetNameWithNoTooltip]"
  treasure_fleet_events.19.desc: "Ми отримали вісті з #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Серединної Держави#!#!. Тепер наша країна — китайський #TOOLTIP:SUBJECT_TYPE,tributary,X #L данник#!#!, і в найближчому майбутньому нею правитиме китайський намісник, [target_character_for_viceroyalty.GetName]. Така наша доля: жити під ворожою п'ятою."
  treasure_fleet_events.19.a: "Одного дня ми скинемо китайське ярмо."
  treasure_fleet_events.20.title: "Дари з далеких земель"
  treasure_fleet_events.20.desc: "Під час виправи наші моряки отримали безліч різних дарунків від місцевих жителів і привезли ці брязкальця до #TOOLTIP:SUB_CONTINENT,china,X #L Китаю#!#!. Вони не мають особливої цінності, але підвищують привабливість #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Серединної Держави#!#! та зміцнюють нашу славу."
  treasure_fleet_events.20.a: "Іншого ми й не очікували."
  treasure_fleet_events.21.title: "Помирає [target.GetNameWithNoTooltip]"
  treasure_fleet_events.21.desc: "Ми дізналися, що $expedition_leader_name$, очільник нашої виправи золотого флоту, більше не з нами. На жаль, часом мандрівки бувають смертельно небезпечними. Тепер виправу очолить [new_leader.GetName]. Відтепер її доля залежить від нового очільника."
  treasure_fleet_events.21.a: "Сподіваємося, це не лихий знак."
  chi_new_expedition_leader: "[new_leader.GetName] тепер очолює нашу виправу «$expedition_name_treasure_voyage$»."
  treasure_fleet_events.22.title: "Нестача коштів"
  treasure_fleet_events.22.desc: "Ми отримали звістку, що в $expedition_name_treasure_voyage$ скінчилися дари для посольських справ. Не маючи належних дарів, флот відмовиться від подальших візитів увічливости до чужоземних портів до кінця плавання. Можливо, наступного разу слід виділяти нашим виправам більш належні кошти."
  treasure_fleet_events.22.a: "Це ганебно."
  chi_expedition_is_returning_to_china: "The $expedition_name_treasure_voyage$ has run out of gifts and will no longer call at foreign ports for the rest of the voyage."
  show_current_chinese_expedition_amount: "[COUNTRY.MakeScope.GetVariable('chinese_expedition_opinion').GetValue]"
  change_amount_of_treasure_voyage_tt: "Обсяг вантажу, який перевозить $expedition_name_treasure_voyage$, збільшено на $VALUE|+$"
  change_amount_of_treasure_voyage_tt_neg: "Обсяг вантажу, який перевозить $expedition_name_treasure_voyage$, зменшено на $VALUE|-$"
  change_opinion_of_expedition: "$chinese_expedition_opinion$ щодо нас покращується на $VALUE|0Y$ (зараз: $show_current_chinese_expedition_amount$)"
  change_opinion_of_expedition_neg: "$chinese_expedition_opinion$ щодо нас погіршується на $VALUE|0Y$ (зараз: $show_current_chinese_expedition_amount$)"
  give_gold_to_expedition: "Учасники виправи «$expedition_name_treasure_voyage$» отримають $VALUE|2Y$."
  chi_gift_received_count: "Ми отримали [ROOT.GetVariable('gifts_received').GetValue|2+=] [Concept('gold', 'грошей')|e]. Ця сума перетворюється на:"
  treasure_fleet_events.23.title: "Золотий флот потрапив у шторм"
  treasure_fleet_events.23.desc: "Під час плавання наш найбільший золотий флот зіткнувся з найпідступнішим із ворогів — лютою бурею, яка зненацька заскочила навіть найдосвідченіших моряків. Багато кораблів затонуло, а разом із ними пішли на дно наші дарунки та крам."
  treasure_fleet_events.23.a: "Ми нічого не можемо вдіяти."
  treasure_fleet_events.23.a.entry: "$common_string_nothing_we_can_do_about_it$"
  treasure_fleet_events.24.title: "Бій із піратським флотом"
  treasure_fleet_events.24.desc: "[target_location.GetTopography.GetName] у [TARGET_LOCATION.Custom('LR_PREP')|l] [TARGET_LOCATION.GetName] назавжди залишиться в пам’яті наших моряків. Тут наш славний золотий флот зіткнувся з мерзенними піратами. Звісно ж, наші хоробрі вояки не розгубилися. Вони негайно стали з ворогом до вирішального бою, знищили піратські кораблі та взяли в полон їхніх ватажків. На жаль, у цій битві наш флот утратив багато людей і кораблів, а також позбувся важливих припасів."
  treasure_fleet_events.24.a: "Ця битва піднесе нашу славу."
  treasure_fleet_events.25.title: "Далеке вітрило"
  treasure_fleet_events.25.desc: "Lookouts hail a sail on the horizon: a merchant fleet, richly laden, plying the same waters as our own. $expedition_leader_name$ orders our captains to greet them in peace, and a brisk exchange follows: bolts of silk and fine porcelain traded for spices, gemstones, and rarities of the southern seas.\n\nThe holds of the $expedition_name_treasure_voyage$ ride heavier than before."
  treasure_fleet_events.25.a: "Попутний вітер і чесна угода."
  treasure_fleet_events.30.title: "Бенкет при дворі"
  treasure_fleet_events.30.a: "Нехай узріють нашу велич."
  treasure_fleet_events.31.title: "Curios for the Emperor"
  treasure_fleet_events.31.a: "Скупити найкраще, що пропонує ринок."
  treasure_fleet_events.31.b: "Наше золото ліпше зберегти для дарів."
  treasure_fleet_events.26.title: "Випробування влади"
  treasure_fleet_events.26.desc: "Відкрите море та ненадійна мапа сіють розбрат серед офіцерів $expedition_name_treasure_voyage$. Одні наполягають, щоб $expedition_leader_name$ тримав(-ла) обережний курс; інші обстоюють швидший, проте небезпечний шлях. Усі погляди звернені до флотоводця, і те, як $expedition_leader_name_herhis$ явить свою владу нині, запам'ятається надовго."
  treasure_fleet_events.26.a: "Тримати обережний і розмірений курс."
  treasure_fleet_events.26.b: "Ризикнути й піти швидшим шляхом."
  treasure_fleet_events.27.title: "Диво морських глибин"
  treasure_fleet_events.27.desc: "Цілі день і ніч флот іде пліч-о-пліч із істотою небачених розмірів, чия спина розтинає хвилі, немов плавучий острів. Літописці $expedition_name_treasure_voyage$ заповнюють сувої описами побаченого, а моряки сприймають це за найсприятливіше знамення. Оповіді про це диво лунатимуть у кожній чайній, коли флот повернеться додому."
  treasure_fleet_events.27.a: "Диво, що вразить двір."
  treasure_fleet_events.28.title: "Знамення в небесах"
  treasure_fleet_events.28.desc: "Флотські астрономи помічають дивне світло, що перетинає нічне небо, і схиляються над мапами, силячись збагнути його зміст. Хоч би якою була його справжня природа, моряки вбачають у небесах знак згори, і над палубами $expedition_name_treasure_voyage$ запановує благоговійна тиша."
  treasure_fleet_events.28.a: "Зважити на те, що віщують небеса."
  treasure_fleet_events.29.title: "Штиль"
  treasure_fleet_events.29.desc: "Вітер стихає зовсім, і величні кораблі $expedition_name_treasure_voyage$ завмирають на морській гладіні, неначе скляній. День у день вітрила безсило висять, і $expedition_leader_name$ разом з офіцерами лишається тільки чекати та вдивлятися в обрій з надією на подих вітру. Шлях від цього стане лише довшим."
  treasure_fleet_events.29.a: "Чекати повернення вітру."
  treasure_fleet_events.32.title: "Пожежа в порту"
  treasure_fleet_events.32.desc: "A fire breaks out among the crowded warehouses of [target_stop.GetName], where a portion of the fleet's goods lay in storage. The sailors of the $expedition_name_treasure_voyage$ join the bucket lines, but not before the flames claim crates of silk and porcelain set aside as gifts."
  treasure_fleet_events.32.a: "Ніч, що дорого нам коштувала."
  treasure_fleet_events.33.title: "Місцевий лоцман"
  treasure_fleet_events.33.desc: "Бувалий моряк із [target_stop.GetName], який знає тутешні рифи й течії, пропонує провести $expedition_name_treasure_voyage$ подальшим шляхом. $expedition_leader_name$ роздумує, чи варто довіряти курс флоту чужій руці."
  treasure_fleet_events.33.a: "Прийняти його знання на борт."
  treasure_fleet_events.33.b: "Своїх штурманів вистачає."
  treasure_fleet_events.34.title: "Дар флотоводцю"
  treasure_fleet_events.34.desc: "Коли флот готується знятися з якоря в [target_stop.GetName], місцевий двір підносить $expedition_leader_name$ прощальний дар рідкісної цінности — знак пошани, який [GetInternationalOrganization('middle_kingdom').GetName] повезе додому до [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
  treasure_fleet_events.34.a: "Гідне поповнення для данини."
  treasure_fleet_events.35.title: "Пошук перекладача"
  treasure_fleet_events.35.desc: "Що далі кораблі #TOOLTIP:CULTUREGROUP,chinese_group,X #L китайської#!#! виправи у пошуках скарбів віддаляються від дому, то важче морякам підтримувати з нами зв’язок. Проте вони сповнені рішучости плисти далі й зустрітися з представниками різних культур. На жаль, без перекладача спілкування з ними навряд чи буде плідним. Члени виправи просять нас знайти місцевого перекладача, який допоможе їм здолати мовний бар’єр."
  treasure_fleet_events.35.a: "Негайно знайдемо перекладача!"
  treasure_fleet_events.35.b: "Це не наш клопіт."
  treasure_fleet_events.36.title: "Передавання мап"
  treasure_fleet_events.36.desc: "Команда виправи «$expedition_name_treasure_voyage$» просить нас надати їм мапи місцевих водних шляхів. Ми не зобов’язані цього робити, але $expedition_leader_name$ та #TOOLTIP:CULTUREGROUP,chinese_group,X #L китайська#!#! знать, яка зараз перебуває в місцевості «$expedition_location_name$», сприймуть нашу допомогу як жест доброї волі та будуть дуже нам вдячні."
  treasure_fleet_events.36.a: "Передаймо їм усе, що в нас є."
  treasure_fleet_events.36.b: "Нам нема чим із ними поділитися."
  treasure_fleet_events.37.title: "Витрати на визиск"
  treasure_fleet_events.37.desc: "Місцеві [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] вирішили ошукати моряків із виправи «$expedition_name_treasure_voyage$» і відкрили нові ринки поблизу гавані місцевості $expedition_location_name$. На цих ринках вони продають крам втридорога, а найжадібніші купці взагалі підняли ціни до небес. А що? Морякам діватися нікуди — однаково куплять! Через це на вулицях почалися збройні сутички, що призвели до заворушень. [fleet_loc.GetRank.GetName] поринає в хаос."
  treasure_fleet_events.37.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] мають понести покарання!"
  treasure_fleet_events.37.a.entry: "Покарати містян!"
  treasure_fleet_events.37.b: "Притягнемо до відповідальности моряків."
  treasure_fleet_events.38.title: "Протверезний ляпас"
  treasure_fleet_events.38.desc: "Наші [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] вкрай невдоволені тією увагою, яку ми приділяємо членам виправи «$expedition_name_treasure_voyage$». Вони вважають #TOOLTIP:CULTUREGROUP,chinese_group,X #L китайців#!#! зарозумілими загарбниками, не вартими такого прийому. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] вимагають, щоб ми позбавили китайських моряків частини привілеїв. Нехай знають, що їм тут не раді."
  treasure_fleet_events.38.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] мають рацію. Прислухаймося до їхніх порад."
  treasure_fleet_events.38.a.entry: "Задовольнити прохання знаті."
  treasure_fleet_events.38.b: "Останнє, що нам потрібно, — це розгнівані китайці."
  treasure_fleet_events.39.title: "Зневага до віри"
  treasure_fleet_events.39.desc: "#TOOLTIP:CULTUREGROUP,chinese_group,X #L Китайські#!#! моряки з виправи у пошуках скарбів через незнання порушили #L [ROOT.GetCountry.GetReligion.GetAdjective|l]і#! звичаї та вчинили страшне святотатство. Наші [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] страшенно розлючені. Вони вимагають вибачень від очільника виправи на ім’я $expedition_leader_name$."
  treasure_fleet_events.39.a: "Нехай $expedition_leader_name_tooltipless$ попросить вибачення."
  treasure_fleet_events.39.b: "Не будемо втручатися."
  treasure_fleet_events.40.title: "Запит на видачу"
  treasure_fleet_events.40.desc: "Члени виправи «$expedition_name_treasure_voyage$» кажуть, що один із наших придворних, [target_escapee.GetName], — заколотник, який утік із #ONCLICK:COUNTRY,[expedition_initiator.GetKey] #TOOLTIP:COUNTRY,[expedition_initiator.GetKey],X [expedition_initiator.Custom('CL_GEN')|L]#!#!. $expedition_leader_name$ та #TOOLTIP:CULTUREGROUP,chinese_group,X #L китайська#!#! знать вимагають передати його #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Серединній Державі#!#!, де його судитимуть за всією суворістю закону."
  treasure_fleet_events.40.a: "Виконаймо їхнє прохання."
  treasure_fleet_events.40.b: "Це цілковите безглуздя!"
  treasure_fleet_events.41.title: "Спільні військові навчання"
  treasure_fleet_events.41.desc: "Очільник виправи «$expedition_name_chinese_expedition$» пропонує нам узяти участь у спільних навчаннях. Ці навчання будуть корисними для обох сторін і зміцнять довіру між нами та китайцями, проте нам слід бути напоготові: ніколи не знаєш, чого очікувати від чужоземних вояків. Найближче до місцевості $expedition_location_name$ розташований загін «[target_unit.GetName]». Саме він і братиме участь у спільних навчаннях із китайцями."
  treasure_fleet_events.41.a: "Приймемо пропозицію."
  treasure_fleet_events.41.b: "Ми завжди можемо відмовитися."
  treasure_fleet_events.42.title: "Допомога від китайців"
  treasure_fleet_events.42.desc: "Коли учасники китайської виправи «$expedition_name_treasure_voyage$» прибули до місцевості $expedition_location_name$, то дізналися: [ROOT.GetCountry.GetLongName] — ця країна веде кровопролитну війну. З’ясувалося, що [expedition_initiator.GetLongName] не надто високої думки про наших ворогів. Тепер китайці пропонують нам допомогу в цій війні."
  treasure_fleet_events.42.a: "Нам стане в пригоді будь-яка допомога."
  treasure_fleet_events.42.b: "Це наша війна, а не їхня."
  treasure_fleet_events.43.title: "Китайські мандрівники допомагають ворогам"
  treasure_fleet_events.43.desc: "Наші вивідачі повідомили нам: [expedition_initiator.GetLongName] — ця країна проводить велику управу «$expedition_name_treasure_voyage$», яку очолює $expedition_leader_name$. Нещодавно її учасники прибули до ворожого порту в місцевості $expedition_location_name$. Схоже, вони погодилися допомогти #ONCLICK:COUNTRY,[from.GetKey] #TOOLTIP:COUNTRY,[from.GetKey],X [from.Custom('CL_DAT')|L]#!#! у війні проти нас!"
  treasure_fleet_events.43.a: "Ми ніколи не пробачимо китайцям!"
  treasure_fleet_events.44.title: "Запит на спорудження мечеті"
  treasure_fleet_events.44.desc: "Як з’ясувалося, очільник виправи «$expedition_name_chinese_expedition$» $expedition_leader_name$, як і багато інших її учасників, сповідує віру «[target_religion.GetName]». Вони просять дозволити їм збудувати мечеть, щоби підтримати місцеву [target_religion.GetAdjectiveWithNoTooltip|l]у громаду."
  treasure_fleet_events.44.a: "Задовольнимо прохання."
  treasure_fleet_events.44.b: "Пояснимо їм, що це гріх."
  treasure_fleet_events.45.title: "$expedition_location_name_tooltipless$ і китайська діаспора"
  treasure_fleet_events.45.desc: "У місцевості $expedition_location_name$ живе велика #TOOLTIP:CULTUREGROUP,chinese_group,X #L китайська#!#! діаспора, що формувалася багато десятиліть. Китайські купці брали за дружин місцевих жінок, оселялися тут і ставали повноправними членами нашого суспільства. Нещодавно сюди прибула виправа «$expedition_name_treasure_voyage$» із #ONCLICK:COUNTRY,[expedition_initiator.GetKey] #TOOLTIP:COUNTRY,[expedition_initiator.GetKey],X [expedition_initiator.Custom('CL_GEN')|L]#!#!. Її очільник прагне підтримати діаспору своїх колишніх співвітчизників."
  treasure_fleet_events.45.a: "Чудова думка."
  treasure_fleet_events.45.b: "Зупинити їх!"
  treasure_fleet_events.46.title: "Вояки залишаються"
  treasure_fleet_events.46.desc: "Кілька демобілізованих вояків із виправи «$expedition_name_chinese_expedition$» одружилися з місцевими дівчатами та вирішили осісти в місцевості $expedition_location_name$. З часом вони набудуть корисних зв’язків, що буде нам дуже на руку."
  treasure_fleet_events.46.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
  treasure_fleet_events.46.a.entry: "$common_string_alright$"
  treasure_fleet_events.47.title: "$expedition_name_treasure_voyage$ допомагає нам"
  treasure_fleet_events.47.desc: "Коли учасники виправи «$expedition_name_chinese_expedition$» прибули до місцевості $expedition_location_name$, то виявили, що [ROOT.GetCountry.GetFlavorRank|l] перебуває в стані міжусобної війни. Очільник виправи «$expedition_name_treasure_voyage$» $expedition_leader_name$ та інші її учасники виявилися не з лякливих. Вони перейнялися співчуттям до #L [ROOT.GetCountry.GetAdjective|l]ого#! народу й пропонують нам військову допомогу від імені #TOOLTIP:INTERNATIONAL_ORGANIZATION,$middle_kingdom_tt$,X #L Серединної держави#!#!."
  treasure_fleet_events.47.a: "Ми приймемо будь-яку допомогу."
  treasure_fleet_events.47.b: "Ні, нам не потрібна їхня допомога."
  treasure_fleet_events.48.title: "$treasure_fleet_events.47.title$"
  treasure_fleet_events.48.desc: "Учасники виправи «$expedition_name_chinese_expedition$» стали на один із боків у війні, що дістала назву «[target_war.GetName]». Може, $expedition_leader_name$ — і кмітливий очільник, але рішення підтримати #ONCLICK:COUNTRY,[country_at_war_with.GetKey] #TOOLTIP:COUNTRY,[country_at_war_with.GetKey],X [country_at_war_with.Custom('CL_ACC')|L]#!#! замість #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! мудрим не назвеш. Ми розіб'ємо їх на полі бою."
  treasure_fleet_events.48.a: "Ми цього не забудемо!"
  treasure_fleet_events.49.title: "Китайці в люті"
  treasure_fleet_events.49.desc: "Відносини між #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#! та нашими гостями з виправи «$expedition_name_treasure_voyage$» загострилися до краю. Останніми днями сутички між нашою залогою та чужоземними моряками значно почастішали. Проте гості продовжували підтримувати з нами зв'язок, хай і без колишньої привітності. Однак тепер їхній терпець, схоже, увірвався. $expedition_leader_name$ більше не бажає мати з нами жодної справи. Учасники виправи збираються покинути землі [ROOT.GetCountry.Custom('longname_ua_wntt_GEN')], поки становище остаточно не вийшло з-під контролю."
  treasure_fleet_events.49.a: "Слід залагодити стосунки з китайцями."
  treasure_fleet_events.49.b: "Скатертиною дорога!"
  chinese_interregnum: "#ONCLICK:COUNTRY,[THIS.GetCountry.GetKey] #TOOLTIP:COUNTRY,[THIS.GetCountry.GetKey],X [THIS.GetCountry.Custom('CL_ACC')|L]#!#! чекає доба #TOOLTIP:CULTUREGROUP,chinese_group,X #L китайського#!#! безкоролів'я."
  treasure_fleet_events.50.title: "Заклик до війни"
  treasure_fleet_events.50.desc: "Очільник виправи «$expedition_name_treasure_voyage$» $expedition_leader_name$ просить нас вступити у війну проти #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_GEN')|L]#!#!. Ми не знаємо, чому #TOOLTIP:CULTUREGROUP,chinese_group,X #L китайці#!#! так зненавиділи цю країну. Так чи інакше, на [target_country.Custom('rank_ua_ACC')] чекають скрутні часи, а [target_country.GetGovernment.GetRulerTitle|l], можливо, незабаром і геть накладе головою. Очільники виправи закликають нас покарати непокірних в ім'я Небес."
  treasure_fleet_events.50.a: "Ми зробимо все, про що вони просять."
  treasure_fleet_events.50.b: "Ми не коритимемося їм."
  treasure_fleet_events.51.title: "Невдалі дари"
  treasure_fleet_events.51.desc: "Ми дізналися, що знатні учасники виправи «$expedition_name_treasure_voyage$» невдоволені нашими дарами, хоч і не кажуть про це вголос. Ми помітили це невдоволення на їхніх обличчях ще тоді, коли [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'приймала', 'приймав')] їх у себе. Шпигуни підслухали їхні розмови й підтвердили наші побоювання."
  treasure_fleet_events.51.a: "Виплатимо їм відшкодування."
  treasure_fleet_events.51.b: "Нехай спершу звернуться до нас, а тоді побачимо."
  treasure_fleet_events.52.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] у центрі скандалу"
  treasure_fleet_events.52.desc: "Під час аудієнції в [ROOT.GetCountry.GetGovernment.GetRulerTitle] один із [ROOT.GetCountry.GetGovernment.GetCourtTitle] мовив мерзенні слова про наших гостей із [ShowCultureGroupName('chinese_group')], тяжко їх зневаживши. Якщо нічого не вдіяти, $expedition_name_treasure_voyage$ може повідомити про цю пригоду [expedition_initiator.GetGovernment.GetRulerTitle]."
  treasure_fleet_events.52.a: "Принесемо їм офіційні вибачення."
  treasure_fleet_events.52.b: "Обдаруємо їх подарунками."
  treasure_fleet_events.52.c: "Ми не каратимемо своїх."
  treasure_fleet_events.53.title: "Радушний прийом"
  treasure_fleet_events.53.desc: "Очільники виправи «$expedition_name_treasure_voyage$» вельми вдоволені наданим прийомом та отриманими привілеями. Ми не лише обмінялися з ними дарами, а й допомогли їм полагодити кораблі. Ми знаємо, що вони вдячні нам за гостинність, хоча й не кажуть про це відкрито."
  treasure_fleet_events.53.a: "Гостинність — це ключ до успіху!"
  treasure_fleet_events.53.b: "Нехай не спокушаються."
  treasure_fleet_events.54.title: "Образа наших посланців"
  treasure_fleet_events.54.a: "Такій зневазі не бувати."
  treasure_fleet_events.54.b: "Не личить нам зважати на це."
  treasure_fleet_events.54.a.tt: "Сусідні [nations|e], які згодом відвідає $expedition_name_treasure_voyage$, дістануть змогу оголосити [war|e] країні [insulting_court.GetName] за нашої підтримки"
  treasure_fleet_events.55.title: "Вплутані в чужі справи"
  treasure_fleet_events.55.a: "Хай увесь світ побачить, як далеко сягає наш вплив."
  treasure_fleet_events.55.b: "Далекі війни нас не обходять."
  treasure_fleet_events.56.title: "Меч, оголений далеко від батьківщини"
  treasure_fleet_events.56.a: "Хай навчаться боятися нашої міці."
  treasure_fleet_events.56.b: "Така ворожнеча нам не на користь, адже ми так далеко від дому."
  treasure_fleet_events.57.title: "Відкинуті зі зневагою"
  treasure_fleet_events.57.a: "Образу буде запам’ятовано."
  treasure_fleet_events.57.b: "Не личить нам таїти таку образу."
  treasure_fleet_events.57.a.tt: "Сусідній двір, який згодом відвідає $expedition_name_treasure_voyage$, може бути закликаний оголосити [war|e] проти [contemptuous_court.GetName]"
  treasure_fleet_events.58.title: "За образу відомщено"
  treasure_fleet_events.58.a: "Хай усі, хто зневажає нас, візьмуть це до уваги."
  treasure_fleet_events.59.title: "Одноплемінці за морями"
  treasure_fleet_events.59.a: "Хай наші одноплемінці за морями з гордістю несуть наше ім’я."
  treasure_fleet_events.59.b: "Їхнє місце вдома, серед пращурів."
  treasure_fleet_events.60.title: "Хиба посланця"
  treasure_fleet_events.60.a: "Наші посли не підвладні чужому вівтарю."
  treasure_fleet_events.60.b: "Флотоводець залагодить провину."
  treasure_fleet_events.1.zheng_he_owned_tt: "Чжен Хе нині має перебувати в нас на службі"
  treasure_fleet_events.7.desc_no_tributary: "$treasure_fleet_events.7.desc_shared$ за їхні відвідини."
  treasure_fleet_events.7.desc_shared: "Завершивши свою місію в [ROOT.GetCountry.GetName], флот скарбів [expedition_initiator.GetName] нині поповнює припаси, маючи намір рушити в путь за кілька місяців. За звичаєм годилося б піднести їм найкраще, що може запропонувати [ROOT.GetCountry.GetFlavorRank], на знак вдячності"
  treasure_fleet_events.30.desc: "While the fleet lies at anchor off [target_stop.GetName], the local court hosts a great banquet in honor of the $expedition_name_treasure_voyage$. Musicians, dancers, and dishes of a hundred kinds are laid before $expedition_leader_name$ and the captains, who present the customary gifts and speak of the greatness of the [GetInternationalOrganization('middle_kingdom').GetName].\n\nWord of the fleet's splendid conduct abroad will surely reach home."
  treasure_fleet_events.31.desc: "The markets of [target_stop.GetName] overflow with wonders unknown in our lands: caged birds of impossible color, strange beasts, aromatic woods, and jewels cut in foreign fashion. The merchants of the $expedition_name_treasure_voyage$ could fill a hold with curiosities fit to delight the [ROOT.GetCountry.GetGovernment.GetRulerTitle], though it would mean parting with a portion of the gold set aside for gifts.\n\nShall we open the coffers?"
  treasure_fleet_events.54.desc: "Word reaches the [ROOT.GetCountry.GetGovernment.GetCourtTitle] that at the court of [insulting_court.GetName], the envoys of the $expedition_name_treasure_voyage$ were met not with the deference owed the [GetInternationalOrganization('middle_kingdom').GetName], but with open scorn — and [insulting_court.GetGovernment.GetRulerTitle] let the insult stand.\n\n$expedition_leader_name$ awaits our word. Shall such contempt be answered, or is it beneath us to take notice?"
  treasure_fleet_events.55.desc: "Dispatches from the [ROOT.GetCountry.GetGovernment.GetCourtTitle] carry unexpected news. Far from home, $expedition_leader_name$ has thrown the arms and treasure of the $expedition_name_treasure_voyage$ behind the ruler of [country_at_war_with.GetName], a realm now torn by a war of succession.\n\nSome at [ROOT.GetCountry.GetGovernment.GetCourtTitle] marvel at how far the reach of the [GetInternationalOrganization('middle_kingdom').GetName] now extends. Others mutter that the quarrels of distant realms are no fit business of ours."
  treasure_fleet_events.56.desc: "Word comes from the $expedition_name_treasure_voyage$ that $expedition_leader_name$ has lent imperial soldiers to a host court's war. [target_country.GetName], who found our men arrayed against them, now number the [GetInternationalOrganization('middle_kingdom').GetName] among their foes.\n\nThe [ROOT.GetCountry.GetGovernment.GetCourtTitle] is divided. To some it is proof that the reach of the throne now extends even to the far side of the world. To others it is a needless enemy earned in a war that was never ours."
  treasure_fleet_events.57.desc: "Grave news reaches the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. At the court of [contemptuous_court.GetName], the envoys of the $expedition_name_treasure_voyage$ were met with such open contempt that $expedition_leader_name$ weighed anchor and quit their waters, the customary courtesies flung back in our faces.\n\nThe fleet's chronicler has entered [contemptuous_court.GetNameWithNoTooltip] in its ledger of those who have wronged the [GetInternationalOrganization('middle_kingdom').GetName]. Shall the affront be remembered, or forgiven?"
  treasure_fleet_events.58.desc: "Word of triumph reaches the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Stirred by the presence of the $expedition_name_treasure_voyage$, the court of [avenging_court.GetName] has taken up arms against [target_country.GetName], the very realm that once held our envoys in contempt.\n\nHeaven's displeasure, it seems, needs no imperial army to make itself felt. The reach of the [GetInternationalOrganization('middle_kingdom').GetName] carries even into the wars of distant kings."
  treasure_fleet_events.59.desc: "Reports reach the [ROOT.GetCountry.GetGovernment.GetCourtTitle] of a flourishing community of our countrymen in far-off [diaspora_port.GetName]. Merchants and sailors who settled there generations ago have taken local wives and prospered, and now $expedition_leader_name$ has extended the hand of the $expedition_name_treasure_voyage$ to these distant kin.\n\nSome at [ROOT.GetCountry.GetGovernment.GetCourtTitle] swell with pride that the blood of the [GetInternationalOrganization('middle_kingdom').GetName] runs in every port of the southern seas. Others frown upon subjects who would make their home so far from the graves of their ancestors."
  treasure_fleet_events.60.desc: "Word reaches the [ROOT.GetCountry.GetGovernment.GetCourtTitle] of an unhappy incident at the court of [offended_court.GetName]. $expedition_leader_name$, unversed in the rites of a foreign faith, has given grave offense, and the [offended_court.GetGovernment.GetRulerTitle] now demands that our envoy make amends.\n\nThe [ROOT.GetCountry.GetGovernment.GetCourtTitle] is of two minds. Some hold that the envoys of the [GetInternationalOrganization('middle_kingdom').GetName] owe no deference to foreign altars. Others fear that such carelessness sullies our name in every port yet to come."