l_russian:
  pining_expedition_events.1.title: "[ROOT.GetCountry.GetGovernment.GetAdjective]е доручення для Північних морів"
  pining_expedition_events.1.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] доручи[ROOT.GetCountry.Custom('crown_vlaloly')] досвідченому каперу з неабиякою славою, який нещодавно повернувся з нападів на [ShowCultureName('hanseatic')|l]і торгові шляхи, повести невелику ескадру на північ і захід у незвідані води #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L Атлантичного океану#!#!. Ескадра кине якір біля #TOOLTIP:LOCATION,shetland,X #L Шетландських островів#!#!, попрямує до холодних земель #TOOLTIP:AREA,iceland_area,X #L Ісландії#!#! та #TOOLTIP:AREA,greenland_area,X #L Ґренландії#!#!, про які пам’ятають саги, а відтак рушить ще далі, назустріч невідомому. Старовинні [ShowCultureName('icelandic')|l]і морські мапи натякають на лісистий берег значно далі на захід, ніж бачив будь-який нині живий мореплавець. [target_leader.GetName] запевняє, що [target_leader.GetSheHe] впорається з цим, якщо матиме належні припаси. Писарі, якими керує [ROOT.GetCountry.Custom('GetHeadOfCabinetName')], досі обраховують, у що обійдеться загибель ескадри."
  pining_expedition_events.1.a: "Спорядити ескадру повністю. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] не запам’ята[ROOT.GetCountry.Custom('crown_yetsayutsa')] своєю скупістю."
  pining_expedition_events.1.b: "Скромне доручення. Нехай [target_leader.GetNameWithNoTooltip] спершу доведе, що шлях справжній, перш ніж скарбниця розкриється ширше."
  pining_expedition_events.1.historical_info: "Дідрік Пінінґ, капер німецького походження на службі данської корони, близько 1473 року отримав від данського короля Кристіана I доручення очолити виправу на захід через північну Атлантику. Офіційних документів про виправу на той час не збереглося, і ті крихти відомостей, що дійшли до нас, походять із пізнішого листування Ганзи та згадки португальського космографа Мартіна Бегайма про те, що Пінінґ і його соратник Ганс Потгорст дісталися узбережжя далеко на захід від Ґренландії. Данія більше не споряджала подібних плавб, а мовчанка в офіційних джерелах породила багатовікові історичні суперечки про те, що саме (і чи взагалі щось) насправді знайшли капітани."
  pining_expedition_events.2.title: "[ShowCultureNameWithNoTooltip('icelandic')]і мореплавці та давні саги"
  pining_expedition_events.2.desc: "Ескадра сховалася за узбережжям #TOOLTIP:AREA,iceland_area,X #L Ісландії#!#!, щоб набрати свіжої води та переговорити з доглядачами гаваней у невеликих рибальських селищах. Місцевий [ShowCultureName('icelandic')|l]ий люд спершу тримається стримано, але стає говіркішим, коли з’являється [ShowGoodsName('wine')|l]: вони розповідають про дідів, які ще пам’ятали людей, що поверталися з #TOOLTIP:AREA,greenland_area,X #L Ґренландії#!#! з розповідями про лісистий край ще далі на заході, про кораблі, які згинули в льодах, та про одного старого, який твердив, що бачив кістки дивного звіра в каплиці в поселенні #TOOLTIP:LOCATION,brattahlid,X #L Браттаглід#!#!. Лоцман пропонує за справедливу ціну продати нам уривки мап, які його родина зберігала відтоді, як західним шляхом востаннє ходили кораблі."
  pining_expedition_events.2.a: "Купити саги та уривки мап. Знання рідко коштували дешево."
  pining_expedition_events.2.b: "Узяти лише те, чим діляться задарма. Наші лоцмани мають власні спостереження."
  pining_expedition_events.2.historical_info: "Середньовічна Ісландія зберегла значну усну та писемну пам’ять про скандинавські плавби до Ґренландії та земель далі на захід, закарбовану в «Сазі про Ейріка Рудого» та сагах про Вінланд Лейфа Ейрікссона. До кінця XV століття ці оповіді майже вийшли з ужитку мореплавців, проте уривки давніх знань збереглися в родинах ісландських рибалок і торгових капітанів. Наприкінці Середньовіччя данські, англійські та бристольські експедиції до західної Атлантики зазвичай проходили через Ісландію для поповнення запасів і майже напевно знаходили там ісландських провідників та оповідачів."
  pining_expedition_events.3.title: "Покинуті садиби на узбережжі Ґренландії"
  pining_expedition_events.3.desc: "Ескадра дісталася західного узбережжя #TOOLTIP:AREA,greenland_area,X #L Ґренландії#!#! і висадила людей на берег в одному з невеликих фіордів, описаних на старовинних [ShowCultureName('icelandic')|l]их мапах. Поселення, яке мало там бути, зникло: церква стоїть без даху, довгі будинки завалилися, а цвинтар поріс травою. В одній із хатин ми знаходимо тіло, частково збережене холодом, одягнене в північноєвропейське вбрання, пошите, за оцінкою літописця, ще покоління тому. Не лишилося нікого, хто міг би розповісти, що сталося. Люди повертаються на кораблі пригніченими. Земля, яку ми прибули нанести на мапу, вже поховала своїх колишніх мешканців."
  pining_expedition_events.3.a: "Поховати всі знайдені кістки. Залишити камінь, на якому викарбувано знак, що його має наш [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')|l]. Рушати далі на захід."
  pining_expedition_events.3.b: "Пливти далі. [ShowCultureNameWithNoTooltip('icelandic')]і поселення нас більше не обходять."
  pining_expedition_events.3.historical_info: "Скандинавські поселення в Ґренландії — Східне поселення (Ейстрібюґд) і Західне поселення (Вестрібюґд), засновані Ейріком Рудим у 980-х роках, проіснували близько чотирьох століть, перш ніж спорожніти. Точні причини цього є предметом дискусій і, ймовірно, були численними: похолодання під час Малого льодовикового періоду, що вдарило по сільському господарству Ґренландії, суперництво з експансією туле (ескімосів-інуїтів), крах контрольованої Норвегією торгівлі моржовою кісткою, на якій тримався експорт колоній, і, можливо, переселення назад до Ісландії та Норвегії. На той час, коли Пінінґ вирушив у плавання в 1470-х роках, Західне поселення не існувало вже понад століття, а Східне, найімовірніше, або вже спорожніло, або переживало остаточний занепад."
  pining_expedition_events.5.title: "[norse_greenland.GetCulture.GetAdjectiveWithNoTooltip]ий люд"
  pining_expedition_events.5.desc: "Ескадра дісталася [target_location.Custom('LR_GEN')] [target_location.GetName] — осідку, де перебуває [norse_greenland.Custom('GetRulerOrRegentTitle')|l], і фактичної столиці [norse_greenland.GetCulture.GetAdjective|l]ої колонії в #TOOLTIP:AREA,greenland_area,X #L Ґренландії#!#!. Поселення значно занепало порівняно з описами в давніх сагах, але все ще тримається: собор із неушкодженим свинцевим дахом, кілька десятків торф’яних довгих хатин, вівці на схилах пагорбів, рибальські човни, витягнуті на гравійний берег. [norse_greenland.Custom('GetRulerOrRegentTitle')] та законовідець приймають наших капітанів зі статечністю людей, які вже багато років не бачили жодного корабля з #TOOLTIP:CONTINENT,europe,X #L Європи#!#!. Вони спраглі новин, прагнуть товарів і не проти поділитися тим, що знають про західні води."
  pining_expedition_events.5.a: "Залишити щедрий дарунок там, де має осідок [norse_greenland.Custom('GetRulerOrRegentTitle')|l]. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] не забува[ROOT.GetCountry.Custom('crown_yeyut')] своїх найвіддаленіших підданих."
  pining_expedition_events.5.b: "Набрати води та харчів, обмінятися люб’язностями й рушати далі на захід."
  pining_expedition_events.5.historical_info: "Скандинавські поселення в Ґренландії були засновані Ейріком Рудим близько 985 року і проіснували приблизно чотириста років. Єпископська резиденція в Ґардарі, заснована в 1124 році, була найзахіднішою єпархією середньовічної Католицької церкви й залишалася заселеною принаймні з перервами до кінця XV століття, коли колонія врешті остаточно спорожніла. Причина занепаду є предметом суперечок і, ймовірно, криється в комплексі чинників: Малий льодовиковий період, просування інуїтів на південь, втрата норвезького ринку збуту моржової кістки та переселення назад до Ісландії й Норвегії."
  pining_expedition_events.4.title: "Лісистий берег"
  pining_expedition_events.4.desc: "Ескадра три тижні йшла на захід і північ від #TOOLTIP:AREA,greenland_area,X #L Ґренландії#!#! крізь чисту воду та битий лід і тепер підійшла до узбережжя, якого немає на жодній із наших мап. Берег аж до самої води темніє від густого лісу. [target_leader.GetName] на судновому човні веде невеликий загін крізь прибій, який ґренландські моряки назвали б непрохідним. Увечері вони повертаються з гілками невідомого дерева, майстерно витесаним наконечником стріли із сірого #TOOLTIP:GOODS,stone,X #L каменю#!#! та розповіддю про сліди на піску, які не схожі ані на європейські чоботи, ані на щось інше, що вони могли б назвати. Літописець, побачивши наконечник, ставить капітану питання, на яке [target_leader.GetNameWithNoTooltip] не має відповіді."
  pining_expedition_events.4.a: "Встановити на березі стяг, що його нада[ROOT.GetCountry.Custom('crown_vlaloly')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]. Нехай світ дізнається, що тут бу[ROOT.Custom('end_vlaloly')] [ROOT.GetNameWithNoTooltip]."
  pining_expedition_events.4.b: "Позначити узбережжя на таємній мапі. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] про все знатим[ROOT.GetCountry.Custom('crown_eut')], а іншим знати не слід."
  pining_expedition_events.4.historical_info: "Питання про те, чи справді Дідрік Пінінґ дістався узбережжя Лабрадору або Ньюфаундленду під час своєї плавби 1473 року, залишається суперечливим в історії доколумбових досліджень Атлантики. Найчастіше згадуваними свідченнями є маргіналія на глобусі Мартіна Бегайма 1492 року та лист данського географа Якоба Кноєна 1551 року, де згадується «північна виправа для пошуку протоки» Пінінґа й Потгорста. Невелика частина дослідників вважає, що ця виправа досягла материкової частини Північної Америки за двадцять років до першого плавання Колумба на півдні; поширенішою є думка, що капітани могли дійти до Ґренландії чи Лабрадору, але не залишили жодних практичних претензій чи мап. У будь-якому разі Данія не надала цьому відкриттю жодного значення."