l_russian:
  pacific_crossing_events.morale_up_tt: "The crew's spirits rise"
  pacific_crossing_events.morale_down_tt: "The crew's spirits suffer"
  pacific_crossing_events.morale_crash_tt: "The crew's spirits collapse"
  pacific_crossing_events.ship_lost_tt: "A ship is lost"
  pacific_crossing_events.provisions_up_tt: "The fleet's provisions are replenished"
  pacific_crossing_events.provisions_down_tt: "The fleet's provisions are reduced"
  pacific_crossing_cargo_loaded_effect: "The cargo of silk, porcelain, and spices is loaded, to be sold when the fleet reaches home."
  pacific_crossing_events.1.title: "Шлях додому"
  pacific_crossing_events.1.a: "Fit out a larger fleet — an extra ship for the long search ahead."
  pacific_crossing_events.1.a.tt: "An additional ship is outfitted and added to the fleet."
  pacific_crossing_events.1.b: "Provision for the outward passage and trust to fortune for the rest."
  pacific_crossing_events.1.c: "[target_leader.GetName] will chart every wind and current we cross."
  pacific_crossing_events.1.historical_info: "Повернення на схід — #italic торнавіахе#! — було великим нерозв’язаним завданням ранньої доби освоєння Тихого океану. Альваро де Сааведра, який відплив із Нової Іспанії, був двічі відкинутий пасатами в 1528 та 1529 роках і загинув під час цієї спроби; виправа Руя Лопеса де Вільялобоса в 1542 році також досягла Азії, проте не змогла знайти шлях додому. Лише в 1565 році було відкрито надійний зворотний шлях, а доти флот міг дістатися Азії, проте ніколи не міг привезти назад свій вантаж."
  pacific_crossing_events.2.title: "Острови злодіїв"
  pacific_crossing_events.2.a: "Trade honestly — beads, cloth, and iron for their water and fruit."
  pacific_crossing_events.2.b: "Взяти силою те, що потрібно кораблям. Часу на зволікання немає."
  pacific_crossing_events.2.fight_win_tt: "Острів’яни розбігаються перед зброєю кораблів, і команда без перешкод запасається водою та садовиною"
  pacific_crossing_events.2.fight_lose_tt: "Острів’яни чинять опір куди запекліше, ніж очікувалося, і команда повертається до човнів ні з чим"
  pacific_crossing_events.2.c: "Забути про воду — краще примітити їхні швидкі корпуси та вітрила."
  pacific_crossing_events.2.historical_info: "6 березня 1521 року, понад три місяці не бачивши землі, вцілілі з флоту Фернана Магеллана дісталися Гуаму. Чаморро вийшли назустріч на швидких аутригерних проа, якими захоплювався літописець Антоніо Пігафетта, називаючи їх швидшими за все, на чому коли-небудь ходили іспанці. Після того як острів’яни забрали одну з корабельних шлюпок, Магеллан назвав архіпелаг #italic Islas de los Ladrones#! — Острови злодіїв — і висадився із загоном по харчі, перш ніж вирушити далі до Філіппін."
  pacific_crossing_events.3.title: "Сорок днів порожнечі"
  pacific_crossing_events.3.a: "Урізати пайки. Ми стерпимо те, що мусимо стерпіти."
  pacific_crossing_events.3.b: "Курс вірний. Земля попереду — тримайте курс."
  pacific_crossing_events.3.c: "Дисциплінувати команду — слово капітана є законом!"
  pacific_crossing_events.4.title: "Земля за Західним морем"
  pacific_crossing_events.4.desc: "A week out from the Islands of Thieves, the look-out sees green hills through the morning haze. As the fleet enters the great bay, it becomes clear this is no empty shore. A settlement of whitewashed walls and palm-thatched roofs climbs the hill above the water. Outrigger canoes put out toward the ships, crewed by men in colored cloth who show no alarm.\n\nThe largest of them, wearing gold at his throat, speaks [location.GetDominantCulture.GetLanguage.GetName], a tongue none of the pilots know, and gestures toward shore with the ease of a man who trades with strangers often. These islands have a world of their own — and through them already flow the [ShowGoodsName('silk')] and [ShowGoodsName('porcelain')] of far Cathay."
  pacific_crossing_events.4.desc.owned: "A week out from the Islands of Thieves, the look-out sees green hills through the morning haze — and then, unmistakable above the settlement climbing the hillside, our own colors flying. The fleet has not stumbled on some unknown shore but sailed into a harbor of our own: [pacific_colony.GetName], a possession of our Crown, its wharves and warehouses already at work.\n\nBoats put out to meet the ships with countrymen aboard, astonished to see a fleet come out of the empty ocean to the east. Here the crews can water and victual in safety, and load the [ShowGoodsName('silk')] and [ShowGoodsName('porcelain')] that Chinese merchants bring to our own quays."
  pacific_crossing_events.4.desc.hostile: "A week out from the Islands of Thieves, the look-out sees green hills through the morning haze — and then a flag that is not ours flying above a stockade at the water's edge. Another power has reached these islands first. As the fleet stands into the bay, [pacific_rival_shore.GetName] shows guns run out along its walls, and armed boats pull toward the ships to demand their business.\n\nThis is [pacific_rival.GetName]'s ground now, and the reception will be wary at best. The silk and porcelain of Cathay still flow through the archipelago — but through a rival's hands, and not freely to ours."
  pacific_crossing_events.4.a: "Open trade for the [ShowGoodsName('silk')] and [ShowGoodsName('porcelain')] passing through these islands."
  pacific_crossing_events.4.b: "Пограбувати поселення — силою захопити воду та запаси."
  pacific_crossing_events.4.b.raid_win_tt: "Мешканці тікають углиб острова, і команди вивозять із поселення всі харчі та воду"
  pacific_crossing_events.4.b.raid_lose_tt: "Мешканці б’ються за свої домівки й відкидають нападників назад до човнів, з порожніми руками та в крові"
  pacific_crossing_events.4.d: "Завантажити сезонні товари з наших власних складів."
  pacific_crossing_events.4.e: "Дати командам перепочинок і полагодити кораблі в нашому порту."
  pacific_crossing_events.4.f: "Обережно вести справи з факторами суперника, під прицілом їхніх гармат."
  pacific_crossing_events.4.g: "Силою оволодіти якірною стоянкою та взяти все необхідне."
  pacific_crossing_events.4.h: "Триматися подалі від їхніх гармат і продовжити свій шлях."
  pacific_crossing_events.4.raid_win_tt: "Форпост узято приступом, його запаси вивезено; команди тріумфують"
  pacific_crossing_events.4.raid_lose_tt: "Приступ відбито із втратами, тож пошкоджений корабель доводиться покинути"
  pacific_crossing_events.4.historical_info: "Руй Лопес де Вільялобос, перетинаючи океан із Нової Іспанії в 1542 році, назвав архіпелаг #italic Лас-Іслас-Філіпінас #! на честь спадкоємця іспанського престолу, майбутнього Філіппа II. Постійна іспанська присутність розпочалася лише в 1565 році, коли Мігель Лопес де Легаспі заснував перше поселення на Себу; в 1571 році він захопив Манілу в раджі Сулеймана і зробив її столицею іспанської Ост-Індії та західним краєм торгівлі манільськими галеонами."
  pacific_crossing_events.5.title: "Острів гвоздики"
  pacific_crossing_events.5.desc: "The smell reaches the fleet before the island does — a sweetness on the wind, heavy and sharp and spiced. A single volcanic peak trailing cloud, green to the water's edge. The harbor is busy with Malay and Javanese proas, and the Sultan's palace stands plainly visible from the anchorage.\n\nEvery merchant in [ShowLocationName('lisbon')] and [ShowLocationName('sevilla')] pays a fortune for this scent, without ever knowing where its source is. No one in this fleet has ever stood this close to the source — the trees heavy with unripe [ShowGoodsName('cloves')] on the slopes above the bay, where a single shipload is worth more than the whole voyage has cost. The holds can be filled here. What remains is to carry them home."
  pacific_crossing_events.5.desc_known: "The smell reaches the fleet before the island does — a sweetness on the wind, heavy and sharp and spiced. A single volcanic peak trailing cloud, green to the water's edge. The harbor is busy with Malay and Javanese proas, and the Sultan's palace stands plainly visible from the anchorage.\n\nEvery merchant in [ShowLocationName('lisbon')] and [ShowLocationName('sevilla')] knows this scent secondhand, and pays a fortune for it. No one in this fleet has ever stood this close to the source — the trees heavy with unripe [ShowGoodsName('cloves')] on the slopes above the bay, where a single shipload is worth more than the whole voyage has cost. The holds can be filled here. What remains is to carry them home."
  pacific_crossing_events.5.a: "Fill the hold with [ShowGoodsName('cloves')] — load every last barrel."
  pacific_crossing_events.5.b: "Спорядити кораблі харчами для довгої дороги додому."
  pacific_crossing_events.5.c: "Дати командам відпочити й набратися сил на березі."
  pacific_crossing_events.5.d: "Відмовитися від пошуків — плисти додому довгим шляхом, навколо мису."
  pacific_crossing_events.5.historical_info: "Португальські мореплавці дісталися Молуккських островів у 1512 році, де Франсішку Серран став радником султана Тернате. Уцілілі кораблі Магеллана завантажилися гвоздикою в суперницькому султанаті Тідоре в 1521 році. Іспансько-португальську суперечку щодо островів було залагоджено Сарагоською угодою 1529 року, за якою імператор Карл V, потребуючи грошей, продав іспанські зазіхання на Молуккські острови Португалії за 350 000 дукатів."
  pacific_crossing_events.6.title: "Дорога додому"
  pacific_crossing_events.6.a: "The northern route — hug the Asian coast, then ride the winds east."
  pacific_crossing_events.6.a.tt: "Stand north along the coast of [ShowRegionName('japan_region')] and beyond, then let the westerlies of the high latitudes carry the fleet clear across to [ShowContinentName('america')] and home."
  pacific_crossing_events.6.b: "Середній шлях — іти на схід проти пасатів."
  pacific_crossing_events.6.b.tt: "Drive due east into the teeth of the trades, by way of the old islands. The wind has thrown back every fleet that tried it — expect to be beaten all the way back to the Spice Islands."
  pacific_crossing_events.6.c: "Далекий південний шлях — величезна дуга, довга, проте вільна."
  pacific_crossing_events.6.c.tt: "Strike far south and east through the island-strewn southern ocean. A passage may well lie that way — but it is immensely long, and the fleet's provisions may not last to the end of it."
  pacific_crossing_events.6.historical_info: "Усі спроби пройти на схід від Азії вздовж тропіків закінчувалися невдачею. #italic Тринідад #! Гонсало Гомеса де Еспіноси, що намагався повернутися до Нової Іспанії в 1522 році, був відкинутий назад і захоплений португальцями; Альваро де Сааведра зазнавав невдачі двічі, в 1528 і 1529 роках. У 1565 році чернець-августинець Андрес де Урданета досяг успіху, рушивши далеко на північ — приблизно до сорокового градуса широти, — щоб зловити течію Куросіо та західні вітри, а потім пройти на них через північну частину Тихого океану до Каліфорнії і далі вниз до Акапулько. Його шлях служив манільським галеонам наступні два з половиною століття."
  pacific_crossing_events.7.title: "Тихий океан"
  pacific_crossing_events.7.a: "Чекати й берегти кожну краплю та крихту. Вітер повернеться."
  pacific_crossing_events.7.b: "Спустити шлюпки — буксирувати кораблі, поки не повернеться вітер."
  pacific_crossing_events.7.c: "Хвилювання йде на південний схід — дрейфувати разом із ним назустріч вітру."
  pacific_crossing_events.8.title: "Повернення галеона"
  pacific_crossing_events.8.desc: "Зафрахтований галеон повернувся додому. Місяці в морі, пройдені довгою північною дугою, глибоко осадили його у воду, коли він входить на рейд, обтяжений вантажем — багатствами [ShowContinentName('asia')], перевезеними через увесь океан і успішно доправленими на берег. Причали повняться представниками та покупцями ще до того, як корабель кинув якір. Шлях тримається, а справа приносить прибуток; наступного року прийде ще один галеон, а згодом і наступний."
  pacific_crossing_events.8.a: "Багатство, щасливо доставлене на берег."
  pacific_crossing_events.8.historical_info: "Манільський галеон ходив шляхом Акапулько — Маніла майже щороку з 1565 по 1815 рік, що робить цей зв’язок однією з найдовговічніших судноплавних ліній в історії. Він віз американське срібло на захід, а китайський шовк, порцеляну та прянощі — на схід; вантаж одного галеона міг принести його вкладникам цілий статок. Ця торгівля пов’язала срібло Америк із ринками Китаю та перетворила Тихий океан на магістраль світової торгівлі."
  pacific_crossing_events.9.title: "Знайомий берег"
  pacific_crossing_events.9.desc: "The long climb north into cold gray water, then the endless arc east across empty ocean, ends when the look-out sees it at last: a high, forested coast, headlands marching away to the south under a bank of fog. This is no part of Asia, nor any island — it is the western shore of [ShowContinentName('america')] itself. The fleet has come out of the Pacific on the near side of the world, and has only to run south down a coast that its charts already know to reach a friendly port.\n\nThe way home has been found. All that remains is to sail the last of it."
  pacific_crossing_events.9.a: "Йти на південь, додому, вздовж знайомого берега."
  pacific_crossing_events.9.b: "Спершу поповнимо запаси води й дамо людям відпочити — вони на це заслужили."
  pacific_crossing_events.9.historical_info: "Зворотне плавання Андреса де Урданети 1565 року дісталося американського берега біля мису Мендосіно в Каліфорнії після приблизно чотирьох місяців у відкритій північній частині Тихого океану. Звідти #italic Сан-Педро#! рушив на південь і досяг Акапулько 8 жовтня 1565 року, довівши придатність шляху. Північна дуга стала звичним шляхом повернення манільських галеонів."
  pacific_crossing_events.10.title: "Море здіймається"
  pacific_crossing_events.10.a: "Лягти в дрейф і перечекати під голими щоглами."
  pacific_crossing_events.10.b: "Йти за вітром і молитися, аби обшивка витримала."
  pacific_crossing_events.10.weathered_tt: "Флот виходить із бурі пошарпаним, але неушкодженим"
  pacific_crossing_events.10.foundered_tt: "Один із кораблів іде на дно разом з усією командою"
  pacific_crossing_events.11.title: "Сире дерево"
  pacific_crossing_events.11.a: "Кренгувати корабель і провести справжнє лагодження."
  pacific_crossing_events.11.b: "Відкачувати воду позмінно й іти далі, попри все."
  pacific_crossing_events.11.c: "Abandon the failing hull and crowd her crew aboard the others."
  pacific_crossing_events.12.title: "Дар моря"
  pacific_crossing_events.12.a: "Спустити всі шлюпки й сіті — взяти все, що вдасться виловити."
  pacific_crossing_events.12.b: "Узяти швидкий улов і знову лягти на курс."
  pacific_crossing_events.13.title: "Гнилі припаси"
  pacific_crossing_events.13.a: "Викинути зіпсовані припаси за борт і змиритися з утратою."
  pacific_crossing_events.13.b: "Все одно видати пайок — люди їстимуть те, що є."
  pacific_crossing_events.17.title: "Поглинуті морем"
  pacific_crossing_events.17.a: "Вони будуть не останніми, кого ми втратимо в цьому океані."
  pacific_crossing_events.17.end_tt: "Виправу втрачено, і на цьому її шлях закінчено"
  pacific_crossing_events.17.historical_info: "Східний океан забрав багатьох, хто намагався його перетнути. Очільник виправи Гарсія Хофре де Лоайса і мореплавець Хуан Себастьян Елькано обидва загинули в морі під час Тихоокеанського переходу 1526 року; Альваро де Сааведра помер посеред океану 1529 року, намагаючись повернутися назад; а Фернан Магеллан був убитий на Мактані 1521 року. З приблизно 270 людей, які вирушили з Іспанії разом із Магелланом, на батьківщину повернулися лише вісімнадцять — на борту #italic«Вікторії»#!."
  pacific_crossing_events.18.title: "Бунт команди"
  pacific_crossing_events.18.a: "Поступитися — нехай заколотники беруть корабель і повертають назад."
  pacific_crossing_events.18.b: "Придушити силою. Повісити заколотників і пливти далі."
  pacific_crossing_events.18.c: "Нагадати їм, що чекає вдома, і хто веде їх туди."
  pacific_crossing_events.18.fight_win_tt: "The mutiny is broken and order restored"
  pacific_crossing_events.18.fight_lose_tt: "Сутичка обертається кровопролиттям, і в цьому безладді втрачається один корабель"
  pacific_crossing_events.18.overboard_tt: "Бунтівники долають офіцерів і кидають [target_leader.GetName] в море. На цьому подорож закінчується"
  pacific_crossing_events.19.title: "Острови злодіїв, знову"
  pacific_crossing_events.19.desc: "Пробиваючись на схід проти вітру, флот не може втримати подолану відстань, і нарешті над носом знову здіймаються низькі зелені острови [ShowLocationName('guahan')] — ті самі береги, які було залишено позаду після переходу. Як і раніше, назустріч ковзають проа, насторожені й допитливі, їхні команди розглядають чужинців, що повернулися з порожнього океану ні з чим. Хай би що тут сталося першого разу, острів’яни це пам’ятають."
  pacific_crossing_events.19.a: "Знову торгувати з людьми, які пам’ятають нас по-доброму."
  pacific_crossing_events.19.b: "Узяти силою те, що потрібно, доки вони не зібралися із силами."
  pacific_crossing_events.19.b.win_tt: "Десант захоплює харчі й воду перш, ніж острів’яни встигають зібратися"
  pacific_crossing_events.19.b.lose_tt: "Цього разу острів’яни готові; нападників відкинуто із втратами"
  pacific_crossing_events.19.c: "Узяти на борт воду, скільки вдасться без бою, і йти далі."
  pacific_crossing_events.19.historical_info: "Маріанські острови стали постійною стоянкою для поповнення запасів води для кораблів, що перетинали Тихий океан, а стосунки з чаморро впродовж століть галеонного шляху коливалися між настороженою торгівлею та відкритим насильством. Флот, який добре поводився з острів’янами, міг сподіватися на харчі; той самий, що діяв інакше, часто знаходив ті самі береги зачиненими для себе або був змушений битися за кожну діжку води."
  pacific_crossing_events.20.title: "Лютий берег"
  pacific_crossing_events.20.a: "Обійти острів стороною — тут не місце для сутичок."
  pacific_crossing_events.20.b: "Stand in and trade — hold up iron and cloth, and hope."
  pacific_crossing_events.20.trade_ok_tt: "Острів’яни опускають списи й охоче стають до обміну; човни повертаються завантажені харчами та водою"
  pacific_crossing_events.20.trade_ambush_tt: "Перемовини виявляються пасткою — каное обступають човни з усіх боків, і флоту доводиться з боєм та кров’ю прориватися геть"
  pacific_crossing_events.20.c: "Висадитися значними силами і взяти те, що є на острові, зброєю."
  pacific_crossing_events.20.raid_win_tt: "Висадка заганяє острів’ян назад у ліс, а їхні припаси дістаються нападникам"
  pacific_crossing_events.20.raid_lose_tt: "Острів’яни люто боронять свої оселі, і нападники, зазнавши втрат, відступають назад до човнів"
  pacific_crossing_events.21.title: "Відкинуті назад"
  pacific_crossing_events.21.a: "Цього моря не підкорити силою."
  pacific_crossing_events.22.title: "Петиція команди"
  pacific_crossing_events.22.a: "Дослухатися до них і повернути флот назад, до Островів Прянощів."
  pacific_crossing_events.22.b: "Відмовити. Ми зайшли надто далеко, щоб повертати назад."
  pacific_crossing_events.23.a: "Втрутитися й розборонити бійців."
  pacific_crossing_events.23.b: "Викинути заколотника за борт і покласти цьому край."
  pacific_crossing_events.23.break_up_lose_tt: "Штовханина обертається кровопролиттям перш ніж лад відновлено"
  pacific_crossing_events.23.break_up_win_tt: "Бійку вдається припинити перш ніж проллється справжня кров"
  pacific_crossing_events.23.c: "Дослухатися до них і повернути флот назад, до Островів Прянощів."
  pacific_crossing_events.23.overboard_tt: "Заколотника хапають і без зайвих балачок викидають у море. Команда спостерігає в крижаній мовчанці"
  pacific_crossing_events.23.title: "Кров на палубі"
  pacific_crossing_events.24.a: "Підвести свій корабель борт у борт, щоб допомогти гасити пожежу."
  pacific_crossing_events.24.b: "Триматися на відстані й дати їм радувати самим."
  pacific_crossing_events.24.caught_fire_tt: "Іскри перелітають через проміжок, і ваш власний корабель також займається"
  pacific_crossing_events.24.distance_tt: "Інший корабель згорає вщент, поки флот спостерігає за цим із безпечної відстані"
  pacific_crossing_events.24.saved_tt: "Додаткові руки збивають полум’я, не давши йому поширитися"
  pacific_crossing_events.24.title: "Пожежа в морі"
  pacific_crossing_events.25.a: "Висадитися на корабель і підтримати вірну команду."
  pacific_crossing_events.25.b: "Триматися на відстані й дати їм владнати це самим."
  pacific_crossing_events.25.c: "Дослухатися до них і повернути флот назад до Островів Прянощів."
  pacific_crossing_events.25.distance_tt: "Бунтівники викрадають корабель перш ніж вдається хоч щось вдіяти"
  pacific_crossing_events.25.loyal_lose_tt: "Бунтівники долають висаджений загін і захоплюють корабель"
  pacific_crossing_events.25.loyal_win_tt: "Вірні перемагають, і лад на борту відновлено"
  pacific_crossing_events.25.title: "Бунт на борту"
  pacific_crossing_events.26.a: "Вислухати їх і піти на незначні поступки."
  pacific_crossing_events.26.b: "Знову відмовити їм і продовжити шлях."
  pacific_crossing_events.26.title: "Знову прохання"
  pacific_crossing_events.27.a: "Провести розслідування та знайти винного."
  pacific_crossing_events.27.b: "Подвоїти вахти та продовжити шлях без відповідей."
  pacific_crossing_events.27.culprit_found_tt: "Винного знаходять і показово карають перед усією командою"
  pacific_crossing_events.27.culprit_free_tt: "Розслідування нічого не дає, і шкідник завдає нового удару, перш ніж пошуки припиняють"
  pacific_crossing_events.27.no_investigation_tt: "Вахти подвоюють, але шкоди припасам уже завдано"
  pacific_crossing_events.27.title: "Нічний саботаж"
