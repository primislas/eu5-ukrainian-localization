  pacific_crossing_cargo_loaded_effect: "Вантаж шовку, порцеляни та прянощів завантажено; його буде продано, коли флот повернеться додому."
  pacific_crossing_events.1.title: "Шлях додому"
  pacific_crossing_events.1.desc: "Доручення полягає не просто в тому, щоб дістатися #TOOLTIP:CONTINENT,asia,X #L Азії#!#! — кораблі вже робили це, несучись на захід із пасатами, немов листя за течією. Доручення полягає в тому, щоб повернутися назад. Колонія на далекому березі цього океану нічого не варта, якщо флот здатний дійти до неї, але не може повернутися; увесь задум тримається на тому, щоб відшукати надійний зворотний шлях, яким корабель міг би ходити з року в рік, коли туди йде [ShowGoodsName('silver')|l], а назад вертається [ShowGoodsName('silk')|l].\n\nВітер у той бік знаний і стійкий. Але що лежить за видноколом і чи дасть море флоту дорогу назад — про це не скаже жодна мапа в цій гавані. Керманичі певні лише в одному: шлях туди не буде дорогою додому."
  pacific_crossing_events.1.a: "Спорядити більший флот — ще один корабель для довгих пошуків попереду."
  pacific_crossing_events.1.a.tt: "Додатковий корабель буде споряджено та приєднано до флоту."
  pacific_crossing_events.1.b: "Запастися харчами на шлях туди і покластися на долю в усьому іншому."
  pacific_crossing_events.1.c: "[target_leader.GetName] нанесе на мапу кожен вітер і кожну течію, що стрінуться на нашому шляху."
  pacific_crossing_events.1.historical_info: "Повернення на схід — #italic торнавіахе#! — було великим нерозв’язаним завданням ранньої доби освоєння Тихого океану. Альваро де Сааведра, який відплив із Нової Іспанії, був двічі відкинутий пасатами в 1528 та 1529 роках і загинув під час цієї спроби; виправа Руя Лопеса де Вільялобоса в 1542 році також досягла Азії, проте не змогла знайти шлях додому. Лише в 1565 році було відкрито надійний зворотний шлях, а доти флот міг дістатися Азії, проте ніколи не міг привезти назад свій вантаж."
  pacific_crossing_events.2.title: "Острови злодіїв"
  pacific_crossing_events.2.desc: "Тижні, коли навколо не було нічого, крім води та неба, добігають кінця, коли впередглядач вигукує: «Земля!». Це низький зелений острів, облямований білим шумовинням прибою. Перш ніж флот устигає кинути якір, назустріч йому вже мчать каное — стрункі човни з балансирами під трикутними вітрилами, що ковзають від хвилі до хвилі так стрімко, що керманичі лише завмирають і дивляться. Острів’яни, сміючись і нічого не боячись, видираються на борти та забирають усе, що не прив’язане. Для них немає крадіжки в тому, щоб узяти нічиє; для зголоднілих за місяць у морі людей це виглядає як зухвала образа.\n\nАле тут є прісна вода, і фрукти, і риба, які тільки й чекають, щоб їх узяли — так чи інакше."
  pacific_crossing_events.2.a: "Торгувати чесно — намисто, тканини та залізо в обмін на їхню воду та садовину."
  pacific_crossing_events.2.b: "Взяти силою те, що потрібно кораблям. Часу на зволікання немає."
  pacific_crossing_events.2.fight_win_tt: "Острів’яни розбігаються перед зброєю кораблів, і команда без перешкод запасається водою та садовиною"
  pacific_crossing_events.2.fight_lose_tt: "Острів’яни чинять опір куди запекліше, ніж очікувалося, і команда повертається до човнів ні з чим"
  pacific_crossing_events.2.c: "Забути про воду — краще примітити їхні швидкі корпуси та вітрила."
  pacific_crossing_events.2.historical_info: "6 березня 1521 року, понад три місяці не бачивши землі, вцілілі з флоту Фернана Магеллана дісталися Гуаму. Чаморро вийшли назустріч на швидких аутригерних проа, якими захоплювався літописець Антоніо Пігафетта, називаючи їх швидшими за все, на чому коли-небудь ходили іспанці. Після того як острів’яни забрали одну з корабельних шлюпок, Магеллан назвав архіпелаг #italic Islas de los Ladrones#! — Острови злодіїв — і висадився із загоном по харчі, перш ніж вирушити далі до Філіппін."
  pacific_crossing_events.3.title: "Сорок днів порожнечі"
  pacific_crossing_events.3.desc: "Ані землі, ані птахів, ані навіть пасма водоростей на воді. Команда проводить у морі тиждень за тижнем, і з кожним із них упевненість керманича тане. У людей кровоточать ясна й хитаються зуби; один божиться, що стара рана, яка загоїлася роки тому, знову розійшлася. Діжки з водою майже порожні, а в сухарях більше довгоносиків, ніж хліба. Вітер милосердний, рівний і прохолодний, але він несе їх усе глибше в океан, якому не видно краю.\n\nКапітан тримає спокійне обличчя та рівний голос, рахує дні на мапі й не говорить нічого, у що сам не вірить."
  pacific_crossing_events.3.a: "Урізати пайки. Ми стерпимо те, що мусимо стерпіти."
  pacific_crossing_events.3.b: "Курс вірний. Земля попереду — тримайте курс."
  pacific_crossing_events.3.c: "Дисциплінувати команду — слово капітана є законом!"
  pacific_crossing_events.4.title: "Земля за Західним морем"
  pacific_crossing_events.4.desc: "Через тиждень після Островів Злодіїв спостерігач крізь ранковий серпанок бачить зелені пагорби. Коли флот заходить у велику затоку, стає зрозуміло, що це зовсім не безлюдний берег. Поселення з біленими стінами та дахами з пальмового листя здіймається на пагорб над водою. До кораблів прямують човни з балансирами, веслувальники на яких одягнені в барвисті тканини і геть не виказують тривоги.\n\nНайкремезніший із них, із золотою прикрасою на шиї, розмовляє [location.GetDominantCulture.GetLanguage.GetName|l]ою мовою — говіркою, якої не знає жоден з керманичів, — і невимушено вказує на берег, наче людина, яка часто торгує з чужинцями. Ці острови живуть власним світом, і крізь них уже течуть [ShowGoodsName('silk')|l] та [ShowGoodsName('porcelain')|l] далекого Катаю."
  pacific_crossing_events.4.desc.owned: "Через тиждень після Островів Злодіїв спостерігач крізь ранковий серпанок бачить зелені пагорби — а далі над поселенням на схилі пагорба безпомилково майорять наші власні кольори. Флот не просто натрапив на незнаний берег, а увійшов у нашу рідну гавань: поселення [pacific_colony.GetName], володіння нашої Корони, де вже повним ходом працюють пристані та комори.\n\nНазустріч кораблям вирушають човни з нашими співвітчизниками, які вражені появою флоту з безкрайнього океану на сході. Тут команди можуть у безпеці запастися водою й харчами та завантажити [ShowGoodsName('silk')|l] і [ShowGoodsName('porcelain')|l], які китайські купці привозять просто до наших причалів."
  pacific_crossing_events.4.desc.hostile: "Через тиждень після Островів Злодіїв спостерігач крізь ранковий серпанок бачить зелені пагорби — а тоді над частоколом біля самої води зринає чужий стяг. Інша держава дісталася цих островів першою. Коли флот заходить у затоку, форпост [pacific_rival_shore.GetName] виставляє гармати вздовж своїх мурів, а озброєні човни веслують до кораблів, вимагаючи пояснити мету прибуття.\n\nТепер це земля #ONCLICK:COUNTRY,[pacific_rival.GetKey] #TOOLTIP:COUNTRY,[pacific_rival.GetKey],X [pacific_rival.Custom('CL_GEN')|L]#!#!, і прийом тут буде щонайменше настороженим. Шовк і порцеляна Катаю все ще проходять крізь архіпелаг — але через руки суперника, і не потрапляють вільно до наших."
  pacific_crossing_events.4.a: "Почати торгівлю, щоби придбати [ShowGoodsName('silk')|l] та [ShowGoodsName('porcelain')|l], що проходять крізь ці острови."
  pacific_crossing_events.4.b: "Пограбувати поселення — силою захопити воду та запаси."
  pacific_crossing_events.4.b.raid_win_tt: "Мешканці тікають углиб острова, і команди вивозять із поселення всі харчі та воду"
  pacific_crossing_events.4.b.raid_lose_tt: "Мешканці б’ються за свої домівки й відкидають нападників назад до човнів, з порожніми руками та в крові"
  pacific_crossing_events.4.d: "Завантажити сезонні товари з наших власних складів."
  pacific_crossing_events.4.e: "Дати командам перепочинок і полагодити кораблі в нашому порту."
  pacific_crossing_events.4.f: "Обережно вести справи з факторами суперника, під прицілом їхніх гармат."
  pacific_crossing_events.4.g: "Силою оволодіти якірною стоянкою та взяти все необхідне."
  pacific_crossing_events.4.h: "Триматися подалі від їхніх гармат і продовжити свій шлях."
  pacific_crossing_events.4.raid_win_tt: "Форпост узято приступом, його запаси вивезено; команди тріумфують"
  pacific_crossing_events.4.raid_lose_tt: "Приступ відбито із втратами, тож пошкоджений корабель доводиться покинути"
  pacific_crossing_events.4.historical_info: "Руй Лопес де Вільялобос, перетинаючи океан із Нової Іспанії в 1542 році, назвав архіпелаг #italic Лас-Іслас-Філіпінас #! на честь спадкоємця іспанського престолу, майбутнього Філіппа II. Постійна іспанська присутність розпочалася лише в 1565 році, коли Мігель Лопес де Легаспі заснував перше поселення на Себу; в 1571 році він захопив Манілу в раджі Сулеймана і зробив її столицею іспанської Ост-Індії та західним краєм торгівлі манільськими галеонами."
  pacific_crossing_events.5.title: "Острів гвоздики"
  pacific_crossing_events.5.desc: "Запах долинає до флоту раніше, ніж з’являється сам острів — солодкуваті пахощі на вітрі, важкі, гострі та пряні. Самотній вулканічний пік, оповитий хмарою, зеленіє аж до самого урізу води. Гавань кипить від малайських та яванських проа, а з місця якірної стоянки добре видно палац султана.\n\nКожен купець у #TOOLTIP:LOCATION,lisbon,X #L Лісабоні#!#! та #TOOLTIP:LOCATION,sevilla,X #L Севільї#!#! віддає цілі статки за ці пахощі, навіть не знаючи, звідки вони беруться. Ніхто на цьому флоті ще ніколи не був так близько до їхнього джерела — схили над затокою вкриті деревами, що гнуться під вагою недостиглої #TOOLTIP:GOODS,cloves,X #L гвоздики#!#!, де один-єдиний корабельний вантаж коштує дорожче, ніж уся ця виправа. Тут можна вщерть заповнити трюми. Залишається лише доправити їх додому."
  pacific_crossing_events.5.desc_known: "Запах долинає до флоту раніше, ніж з’являється сам острів — солодкуваті пахощі на вітрі, важкі, гострі та пряні. Самотній вулканічний пік, оповитий хмарою, зеленіє аж до самого урізу води. Гавань кипить від малайських та яванських проа, а з місця якірної стоянки добре видно палац султана.\n\nКожен купець у #TOOLTIP:LOCATION,lisbon,X #L Лісабоні#!#! та #TOOLTIP:LOCATION,sevilla,X #L Севільї#!#! знає ці пахощі з других рук і платить за них шалені гроші. Ніхто на цьому флоті ще ніколи не був так близько до їхнього джерела — схили над затокою вкриті деревами, що гнуться під вагою недостиглої #TOOLTIP:GOODS,cloves,X #L гвоздики#!#!, де один-єдиний корабельний вантаж коштує дорожче, ніж уся ця виправа. Тут можна вщерть заповнити трюми. Залишається лише доправити їх додому."
  pacific_crossing_events.5.desc.no_owner: "The smell reaches the fleet before the island does: a sweetness on the wind, heavy and sharp and spiced. A single volcanic peak trailing cloud, green to the water's edge. The harbor is busy with Malay and Javanese proas, though no banner or palace marks who claims this shore.\n\nEvery merchant in [ShowLocationName('lisbon')] and [ShowLocationName('sevilla')] pays a fortune for this scent, without ever knowing where its source is. No one in this fleet has ever stood this close to the source, the trees heavy with unripe [ShowGoodsName('cloves')] on the slopes above the bay, where a single shipload is worth more than the whole voyage has cost. The holds can be filled here. What remains is to carry them home."
  pacific_crossing_events.5.desc.driven_back: "Острови прянощів знову зринають перед носом корабля — та сама зелена вершина, та сама тісна якірна стоянка, а з ними й гірке усвідомлення, що флот відкинуло назад на самісінький початок, а шлях додому так і не знайдено. Пасати не залишили кораблям іншого вибору, окрім як бігти назад до цих берегів.\n\nТепер на якірній стоянці панує похмурий звичний уклад. Острови знову дадуть воду та харчі; хворих можна звести на суходіл, команди перепочинуть, а трюми поповняться тим, що кораблі ще спроможні вмістити. Але кожен на борту знає, яка розплата чекає попереду: флоту доведеться зібратися з силами й знову вийти у відкрите море, щоб спробувати знайти шлях додому, і таких спроб у нього залишилося небагато."
  pacific_crossing_events.5.a: "Заповнити трюм #TOOLTIP:GOODS,cloves,X #L гвоздикою#!#! — завантажити все до останньої бочки."
  pacific_crossing_events.5.b: "Спорядити кораблі харчами для довгої дороги додому."
  pacific_crossing_events.5.c: "Дати командам відпочити й набратися сил на березі."
  pacific_crossing_events.5.d: "Відмовитися від пошуків — плисти додому довгим шляхом, навколо мису."
  pacific_crossing_events.5.historical_info: "Португальські мореплавці дісталися Молуккських островів у 1512 році, де Франсішку Серран став радником султана Тернате. Уцілілі кораблі Магеллана завантажилися гвоздикою в суперницькому султанаті Тідоре в 1521 році. Іспансько-португальську суперечку щодо островів було залагоджено Сарагоською угодою 1529 року, за якою імператор Карл V, потребуючи грошей, продав іспанські зазіхання на Молуккські острови Португалії за 350 000 дукатів."
  pacific_crossing_events.6.title: "Дорога додому"
  pacific_crossing_events.6.desc: "Трюми повні, а легша половина плавання вже позаду. Тепер флот повинен зробити те єдине, чого не покаже жодна мапа на борту: знайти шлях назад через океан, який він щойно перетнув. Вітер, що так лагідно ніс кораблі на захід, дме просто в лоб поверненню, і кожен керманич за столом розуміє, що це означає.\n\nОфіцери флоту засиджуються допізна над мапами, і вперше керманичі не можуть дійти згоди. Кожен наполягає на своєму курсі й боїться інших, а за межею відомого моря ніхто з них не може поручитися, куди веде хоч один із шляхів — є лише здогади та відвага зробити на них ставку. Рішення належить лише капітану, і кожна душа на борту житиме чи загине за тим курсом, який він прокладе."
  pacific_crossing_events.6.desc.driven_back: "Офіцери флоту збираються знову, і настрій за столом похмурнів. Курс було обрано, але океан відкинув кораблі назад; флот з боєм подолав увесь цей шлях лише заради гіркого уроку. Інші напрямки лишаються тільки припущеннями — не більш перевіреними, ніж доти, а кораблів і людей у командах, якими можна ризикнути, поменшало.\n\nКерманичі вже не підвищують голос. Кожен, схилившись над мапою, знає, що кидати виклик цьому морю знову й знову задарма не вийде. Потрібно ще раз прокласти курс геть із цих вод, і нагод для вибору залишилося небагато."
  pacific_crossing_events.6.a: "Північний шлях — триматися азійського узбережжя, а потім летіти з вітрами на схід."
  pacific_crossing_events.6.a.tt: "Йти на північ уздовж узбережжя #TOOLTIP:REGION,japan_region,X #L Японії#!#! та далі, а потім дозволити західним вітрам високих широт пронести флот через увесь океан просто до #TOOLTIP:CONTINENT,america,X #L Америки#!#! і додому."
  pacific_crossing_events.6.b: "Середній шлях — іти на схід проти пасатів."
  pacific_crossing_events.6.b.tt: "Рушити просто на схід наперекір пасатам, повз уже знайомі острови. Вітер відкидав кожен флот, що наважувався на це, — будьте готові, що нас відкине назад аж до Островів Прянощів."
  pacific_crossing_events.6.c: "Далекий південний шлях — величезна дуга, довга, проте вільна."
  pacific_crossing_events.6.c.tt: "Взяти курс далеко на південь і схід крізь всіяний островами південний океан. Цілком можливо, що там є прохід — але цей шлях неймовірно довгий, і харчів на флоті може не вистачити до його кінця."
  pacific_crossing_events.6.historical_info: "Усі спроби пройти на схід від Азії вздовж тропіків закінчувалися невдачею. #italic Тринідад #! Гонсало Гомеса де Еспіноси, що намагався повернутися до Нової Іспанії в 1522 році, був відкинутий назад і захоплений португальцями; Альваро де Сааведра зазнавав невдачі двічі, в 1528 і 1529 роках. У 1565 році чернець-августинець Андрес де Урданета досяг успіху, рушивши далеко на північ — приблизно до сорокового градуса широти, — щоб зловити течію Куросіо та західні вітри, а потім пройти на них через північну частину Тихого океану до Каліфорнії і далі вниз до Акапулько. Його шлях служив манільським галеонам наступні два з половиною століття."
  pacific_crossing_events.7.title: "Тихий океан"
  pacific_crossing_events.7.desc: "Вітер стихає. Вітрила звисають безживно, море лежить рівне й дзеркальне до самого обрію, а кораблі непорушно стоять під білим палючим небом. Саме через такий штиль цей океан і назвали «тихим морем» — лагідність, яка вже не раз морила команди голодом.\n\nВода в діжках стає теплою й смердючою. Кожен день безвітря — це витрачений денний харч без жодної пройденої милі, і люди це знають. Вони дивляться на нерухоме оснащення та обрій і вже двічі кричали: «Земля!», побачивши пасмо хмар, яке розтануло без сліду. А бездіяльні руки на знерухомленому кораблі рідко довго лишаються без діла."
  pacific_crossing_events.7.a: "Чекати й берегти кожну краплю та крихту. Вітер повернеться."
  pacific_crossing_events.7.b: "Спустити шлюпки — буксирувати кораблі, поки не повернеться вітер."
  pacific_crossing_events.7.c: "Хвилювання йде на південний схід — дрейфувати разом із ним назустріч вітру."
  pacific_crossing_events.8.title: "Повернення галеона"
  pacific_crossing_events.8.desc: "Зафрахтований галеон повернувся додому. Місяці в морі, пройдені довгою північною дугою, глибоко осадили його у воду, коли він входить на рейд, обтяжений вантажем — багатствами [ShowContinentName('asia')], перевезеними через увесь океан і успішно доправленими на берег. Причали повняться представниками та покупцями ще до того, як корабель кинув якір. Шлях тримається, а справа приносить прибуток; наступного року прийде ще один галеон, а згодом і наступний."
  pacific_crossing_events.8.a: "Багатство, щасливо доставлене на берег."
  pacific_crossing_events.8.historical_info: "Манільський галеон ходив шляхом Акапулько — Маніла майже щороку з 1565 по 1815 рік, що робить цей зв’язок однією з найдовговічніших судноплавних ліній в історії. Він віз американське срібло на захід, а китайський шовк, порцеляну та прянощі — на схід; вантаж одного галеона міг принести його вкладникам цілий статок. Ця торгівля пов’язала срібло Америк із ринками Китаю та перетворила Тихий океан на магістраль світової торгівлі."
  pacific_crossing_events.9.title: "Знайомий берег"
  pacific_crossing_events.9.desc: "Довгий підйом на північ у холодні сірі води, а потім нескінченна дуга на схід через порожній океан добігають кінця, коли спостерігач нарешті бачить це: високий, порослий лісом берег і миси, що тягнуться на південь під пеленою туману. Це не частина Азії і не острів — це західний берег самої #TOOLTIP:CONTINENT,america,X #L Америки#!#!. Флот вийшов із Тихого океану на наш бік світу, і тепер йому лишається тільки йти на південь уздовж уже нанесеного на мапи узбережжя, щоб дістатися дружньої гавані.\n\nШлях додому знайдено. Залишилося лише пройти його решту."
  pacific_crossing_events.9.a: "Йти на південь, додому, вздовж знайомого берега."
  pacific_crossing_events.9.b: "Спершу поповнимо запаси води й дамо людям відпочити — вони на це заслужили."
  pacific_crossing_events.9.historical_info: "Зворотне плавання Андреса де Урданети 1565 року дісталося американського берега біля мису Мендосіно в Каліфорнії після приблизно чотирьох місяців у відкритій північній частині Тихого океану. Звідти #italic Сан-Педро#! рушив на південь і досяг Акапулько 8 жовтня 1565 року, довівши придатність шляху. Північна дуга стала звичним шляхом повернення манільських галеонів."
  pacific_crossing_events.10.title: "Море здіймається"
  pacific_crossing_events.10.desc: "Небо набуває кольору синця, а вітер накочується, немов стіна. За якусь годину флот уже бореться за життя — хвилі здимаються вище за грот-рею, зелена вода перекочується через шкот, полотно рветься з тріскотом, схожим на гарматні постріли. Кораблі тяжко долають буруни та хитаються на хвилях, і в темряві один за одним гублять одне одного з очей. Керманичі можуть лише міцно триматися й лічити години.\n\nЄ вибір, і зовсім немає часу зважувати: прибрати вітрила й перечекати шторм на місці чи летіти за вітром у пітьму, сподіваючись, що корпуси витримають."
  pacific_crossing_events.10.a: "Лягти в дрейф і перечекати під голими щоглами."
  pacific_crossing_events.10.b: "Йти за вітром і молитися, аби обшивка витримала."
  pacific_crossing_events.10.weathered_tt: "Флот виходить із бурі пошарпаним, але неушкодженим"
  pacific_crossing_events.10.foundered_tt: "Один із кораблів іде на дно разом з усією командою"
  pacific_crossing_events.11.title: "Сире дерево"
  pacific_crossing_events.11.desc: "Кораблі закладали похапцем на нових корабельнях тихоокеанського узбережжя Америки, з деревини, яка не встигла просохнути, теслями, які зроду не будували для такого океану. Тепер море збирає свій борг. Дошка відходить по шву посеред судна; конопатка викришується; у трюмі люди стоять у воді, що невпинно прибуває, а помпи брязкають удень і вночі без жодного перепочинку. Обличчя теслі каже саме за себе.\n\nТак далі тривати не може, а найближча тверда земля — за пів океану звідси."
  pacific_crossing_events.11.a: "Кренгувати корабель і провести справжнє лагодження."
  pacific_crossing_events.11.b: "Відкачувати воду позмінно й іти далі, попри все."
  pacific_crossing_events.11.c: "Покинути пошкоджений корпус і розмістити команду на решті кораблів."
  pacific_crossing_events.12.title: "Дар моря"
  pacific_crossing_events.12.desc: "Усе починається з дельфінів — великої зграї, яка щось жене перед собою до кораблів. Потім здається, що саме море спалахує: велетенський одвір риби виринає на поверхню, безкрає срібло виблискує й вирує довкола корпусів, затиснуте колом дельфінів так щільно, що через рибу ледь видно воду.\n\nКоманді не потрібні накази. Шлюпки спускають на воду, слідом летять снасті й сіті, і матроси перехиляються через борти, витягуючи рибу оберемками на палуби, які незабаром стають слизькими від гори здобичі. Після тижнів на сухарях і солонині це бенкет, манна небесна й милосердя водночас."
  pacific_crossing_events.12.a: "Спустити всі шлюпки й сіті — взяти все, що вдасться виловити."
  pacific_crossing_events.12.b: "Узяти швидкий улов і знову лягти на курс."
  pacific_crossing_events.13.title: "Гнилі припаси"
  pacific_crossing_events.13.desc: "Шафар приходить до капітана, тримаючи капелюха в руках. У трюмі відкоркували цілі ряди бочок і побачили, що все зіпсовано — солонина засолена сяк-так, сухарі запаковано вогкими, вода затухла в діжках, які не вистоялися як слід. Припаси, нашвидкуруч завантажені й закорковані мокрими в портах відплиття, згнили в тропічній спеці, і те, що мало годувати команду тижнями, перетворилося на смердючу масу, кишілу хробаками.\n\nТут немає ринку й немає іншої нагоди — лише зіпсовані запаси та зголоднілі люди."
  pacific_crossing_events.13.a: "Викинути зіпсовані припаси за борт і змиритися з утратою."
  pacific_crossing_events.13.b: "Все одно видати пайок — люди їстимуть те, що є."
  pacific_crossing_events.17.title: "Поглинуті морем"
  pacific_crossing_events.17.desc: "Звістки, коли вони нарешті надходять, складаються з уламків — ім’я, дата, останній відомий курс. Флот, що вирушив шукати дорогу додому, так її й не знайшов. Чи поглинув кораблі шторм, чи розбило їх об безіменний риф, чи вони просто дрейфували, доки не закінчилася вода, а з нею й життя людей — ніхто вже достеменно не скаже. Океан забрав їх собі.\n\nШлях додому лишається невідомим. Десь там вітер усе ще дме не в той бік."
  pacific_crossing_events.17.a: "Вони будуть не останніми, кого ми втратимо в цьому океані."
  pacific_crossing_events.17.end_tt: "Виправу втрачено, і на цьому її шлях закінчено"
  pacific_crossing_events.17.historical_info: "Східний океан забрав багатьох, хто намагався його перетнути. Очільник виправи Гарсія Хофре де Лоайса і мореплавець Хуан Себастьян Елькано обидва загинули в морі під час Тихоокеанського переходу 1526 року; Альваро де Сааведра помер посеред океану 1529 року, намагаючись повернутися назад; а Фернан Магеллан був убитий на Мактані 1521 року. З приблизно 270 людей, які вирушили з Іспанії разом із Магелланом, на батьківщину повернулися лише вісімнадцять — на борту #italic«Вікторії»#!."
  pacific_crossing_events.18.title: "Бунт команди"
  pacific_crossing_events.18.desc: "З людей годі. Урізані харчі, безкраїй океан і курс, за який ніхто, крім керманичів, не може поручитися, — це зламало будь-яку покірність команди. Юрма моряків збирається на кормі, похмура й озброєна, і висуває просту вимогу: повернути флот назад, або вони повернуть його самі. Офіцерів мало проти натовпу, а мушкети є не лише в одного боку.\n\nХоч що б зараз вирішили, це коштуватиме флоту того, що нелегко відновити."
  pacific_crossing_events.18.desc.last_ship: "З людей годі. Від флоту залишився лише один корабель, і на його переповненій смердючій палубі офіцеру ніде сховатися. Ватажки бунту всі разом виходять на корму, і цього разу вони не просять — вони говорять капітанові правду про їхнє становище з моторошною простотою: іншого корабля немає, морську піхоту покликати нізвідки, а за бортом — безкрає море. Повертай додому просто зараз, кажуть вони, або тебе викинуть у воду.\n\nКерманичі принишкли. Капітан стоїть сам біля борту спиною до моря й мусить дати відповідь."
  pacific_crossing_events.18.a: "Поступитися — нехай заколотники беруть корабель і повертають назад."
  pacific_crossing_events.18.b: "Придушити силою. Повісити заколотників і пливти далі."
  pacific_crossing_events.18.c: "Нагадати їм, що чекає вдома, і хто веде їх туди."
  pacific_crossing_events.18.fight_win_tt: "Заколот придушено, а лад відновлено"
  pacific_crossing_events.18.fight_lose_tt: "Сутичка обертається кровопролиттям, і в цьому безладді втрачається один корабель"
  pacific_crossing_events.18.overboard_tt: "Бунтівники долають офіцерів і кидають [target_leader.GetName] в море. На цьому подорож закінчується"
  pacific_crossing_events.19.title: "Острови злодіїв, знову"
  pacific_crossing_events.19.desc: "Пробиваючись на схід проти вітру, флот не може втримати подолану відстань, і нарешті над носом знову здіймаються низькі зелені острови [ShowLocationName('guahan')] — ті самі береги, які було залишено позаду після переходу. Як і раніше, назустріч ковзають проа, насторожені й допитливі, їхні команди розглядають чужинців, що повернулися з порожнього океану ні з чим. Хай би що тут сталося першого разу, острів’яни це пам’ятають."
  pacific_crossing_events.19.desc.friendly: "Лавіруючи на схід проти вітру, флот не може закріпити поступ, і нарешті над носом знову зринають низькі зелені острови [ShowLocationName('guahan')]. Цього разу проа виходять назустріч без страху — острів’яни пам’ятають чесну торгівлю, і серед них є обличчя, які команда вже впізнає. Вони підносять товари, обмінюються знаками, і обіцянка води та свіжих харчів цілком очевидна.\n\nФлот відчайдушно потребує і того, і іншого. Схоже, давня прихильність варта тут більше за будь-яку мапу."
  pacific_crossing_events.19.desc.hostile: "Лавіруючи на схід проти вітру, флот не може закріпити поступ, і нарешті над носом знову зринають низькі зелені острови [ShowLocationName('guahan')]. Але проа, що вирушають назустріч тепер, ідуть численно, і в них немає сміху — острів’яни не забули набігу й чекали. Уздовж берега стирчать списи, і якірна стоянка, що раніше щедро давала воду, тепер так просто її не віддасть.\n\nФлоту попри все потрібні вода та харчі, і люди знають, що доведеться добувати їх силою в тих, хто вже чекає на них."
  pacific_crossing_events.19.a: "Знову торгувати з людьми, які пам’ятають нас по-доброму."
  pacific_crossing_events.19.b: "Узяти силою те, що потрібно, доки вони не зібралися із силами."
  pacific_crossing_events.19.b.win_tt: "Десант захоплює харчі й воду перш, ніж острів’яни встигають зібратися"
  pacific_crossing_events.19.b.lose_tt: "Цього разу острів’яни готові; нападників відкинуто із втратами"
  pacific_crossing_events.19.c: "Узяти на борт воду, скільки вдасться без бою, і йти далі."
  pacific_crossing_events.19.historical_info: "Маріанські острови стали постійною стоянкою для поповнення запасів води для кораблів, що перетинали Тихий океан, а стосунки з чаморро впродовж століть галеонного шляху коливалися між настороженою торгівлею та відкритим насильством. Флот, який добре поводився з острів’янами, міг сподіватися на харчі; той самий, що діяв інакше, часто знаходив ті самі береги зачиненими для себе або був змушений битися за кожну діжку води."
  pacific_crossing_events.20.title: "Лютий берег"
  pacific_crossing_events.20.desc: "Ще один острів підіймається з безкрайнього південного моря — крутий, зелений і оперезаний рифами. Він заселений: з-поміж дерев підіймається дим, а від берега вже відчалюють каное, переповнені розфарбованими людьми зі списами, чий галас над водою схожий чи то на вітання, чи то на пересторогу. Ніхто на борту не може второпати, на що саме.\n\nКерманичі ніколи не наносили це місце на мапу й не знають, хто тут живе. Але діжки з водою майже порожні, а люди голодні, і заселений острів означає їжу, якщо вдасться її роздобути. Чи нагодує цей берег флот, чи кинеться на нього, залежить від того, як ми поведемося впродовж наступної години."
  pacific_crossing_events.20.a: "Обійти острів стороною — тут не місце для сутичок."
  pacific_crossing_events.20.b: "Підійти ближче й торгувати — показати залізо й тканини та сподіватися на краще."
  pacific_crossing_events.20.trade_ok_tt: "Острів’яни опускають списи й охоче стають до обміну; човни повертаються завантажені харчами та водою"
  pacific_crossing_events.20.trade_ambush_tt: "Перемовини виявляються пасткою — каное обступають човни з усіх боків, і флоту доводиться з боєм та кров’ю прориватися геть"
  pacific_crossing_events.20.c: "Висадитися значними силами і взяти те, що є на острові, зброєю."
  pacific_crossing_events.20.raid_win_tt: "Висадка заганяє острів’ян назад у ліс, а їхні припаси дістаються нападникам"
  pacific_crossing_events.20.raid_lose_tt: "Острів’яни люто боронять свої оселі, і нападники, зазнавши втрат, відступають назад до човнів"
  pacific_crossing_events.21.title: "Відкинуті назад"
  pacific_crossing_events.21.desc: "Тиждень за тижнем флот продирається на схід, і тиждень за тижнем море забирає все, чого вдалося досягти. Пасат не слабшає і не змінює напрямку; він стоїть стіною просто перед носом, а течія під ним іде в той самий бік, відносячи кораблі на захід уночі швидше, ніж вони просуваються на схід удень. Керманичі проводять виміри, звіряють їх і замовкають — лінія на мапі перестала рухатися вперед і поповзла назад.\n\nСперечатися з цим марно — це біг на місці, а не плавання, і кожен прожитий тут день марнує воду й життя задурно. Лишається тільки гіркий вихід: лягти на зворотний курс, побігти за вітром, який здолав їх, і відвести флот назад до Островів прянощів, щоб обміркувати все наново."
  pacific_crossing_events.21.a: "Цього моря не підкорити силою."
  pacific_crossing_events.22.title: "Петиція команди"
  pacific_crossing_events.22.desc: "Щодня запаси тануть швидше, ніж ми долаємо милі. Води обмаль і вона тухла, сухарі перетворилися на порох, а список хворих щоранку довшає. Ватага бувалих матросів іде на корму — ще не для заколоту, але з непохитною впевненістю людей, які вміють рахувати діжки. Вони вирахували запаси плавання, і розрахунок не на їхню користь. Повертаймо назад, кажуть вони, доки в трюмі ще вистачить припасів дійти до знайомого берега. Рушимо далі — і флот ляже на дно цього океану.\n\nУ їхніх словах є глузд, хай як неохоче це чути."
  pacific_crossing_events.22.a: "Дослухатися до них і повернути флот назад, до Островів Прянощів."
  pacific_crossing_events.22.b: "Відмовити. Ми зайшли надто далеко, щоб повертати назад."
  pacific_crossing_events.23.title: "Кров на палубі"
  pacific_crossing_events.23.desc: "Суперечка, що розпочалася в день, коли прохання відкинули, так по-справжньому й не вщухла, а сьогодні вона переростає в бійку. Боцман, вірний справі плавання, обмінюється образами з гуртом матросів, які досі лютують через відмову повернути назад; образи переходять у стусани, а стусани — у сварку, що стрімко охоплює палубу, де вже блиснуло не одне лезо.\n\n[target_leader.GetName] прибуває на місце події й бачить, що вахта вже б’ється через чвари, які насправді зовсім не стосувалися боцмана."
  pacific_crossing_events.23.a: "Втрутитися й розборонити бійців."
  pacific_crossing_events.23.b: "Викинути заколотника за борт і покласти цьому край."
  pacific_crossing_events.23.c: "Дослухатися до них і повернути флот назад, до Островів Прянощів."
  pacific_crossing_events.23.break_up_win_tt: "Бійку вдається припинити перш ніж проллється справжня кров"
  pacific_crossing_events.23.break_up_lose_tt: "Штовханина обертається кровопролиттям перш ніж лад відновлено"
  pacific_crossing_events.23.overboard_tt: "Заколотника хапають і без зайвих балачок викидають у море. Команда спостерігає в крижаній мовчанці"
  pacific_crossing_events.24.title: "Пожежа в морі"
  pacific_crossing_events.24.desc: "З корми долинає крик: один з інших кораблів флоту охоплений полум’ям. Те, що почалося як чергова бійка через повернення додому, призвело до перекинутого в метушні ліхтаря, і вогонь уже біжить оснащенням швидше, ніж встигають наповнювати відра. Іскри летять за вітром у бік решти флоту.\n\n[target_leader.GetName] мусить швидко вирішити, чи скоротити відстань і допомогти загасити пожежу, чи триматися осторонь, полишивши охоплений полум’ям корабель напризволяще."
  pacific_crossing_events.24.a: "Підвести свій корабель борт у борт, щоб допомогти гасити пожежу."
  pacific_crossing_events.24.b: "Триматися на відстані й дати їм радувати самим."
  pacific_crossing_events.24.saved_tt: "Додаткові руки збивають полум’я, не давши йому поширитися"
  pacific_crossing_events.24.caught_fire_tt: "Іскри перелітають через проміжок, і ваш власний корабель також займається"
  pacific_crossing_events.24.distance_tt: "Інший корабель згорає вщент, поки флот спостерігає за цим із безпечної відстані"
  pacific_crossing_events.25.title: "Бунт на борту"
  pacific_crossing_events.25.desc: "[target_leader.GetName] отримує сигнал з одного з інших кораблів: команда там повстала проти своїх офіцерів, адже ті самі суперечки про повернення додому переросли у відкритий заколот. Вірні матроси забарикадувалися внизу, поки заколотники сперечаються про те, що робити далі. Часу на роздуми про те, чи варто втручатися, майже немає.\n\nШлюпка, спущена зараз на воду, ще може перехилити шальки терезів на іншому кораблі, або ж просто віддати заколотникам другу здобич."
  pacific_crossing_events.25.a: "Висадитися на корабель і підтримати вірну команду."
  pacific_crossing_events.25.b: "Триматися на відстані й дати їм владнати це самим."
  pacific_crossing_events.25.c: "Дослухатися до них і повернути флот назад до Островів Прянощів."
  pacific_crossing_events.25.loyal_win_tt: "Вірні перемагають, і лад на борту відновлено"
  pacific_crossing_events.25.loyal_lose_tt: "Бунтівники долають висаджений загін і захоплюють корабель"
  pacific_crossing_events.25.distance_tt: "Бунтівники викрадають корабель перш ніж вдається хоч щось вдіяти"
  pacific_crossing_events.26.title: "Знову прохання"
  pacific_crossing_events.26.desc: "Делегація повертається, цього разу стриманіша, але не менш рішуча. Вони не погрожують і не підвищують голос; вони просто наводять ті самі розрахунки, що й раніше, які стали ще похмурішими за дні, що минули від попередньої відмови. Кілька дрібних поступок могли б купити спокій на нижніх палубах, якщо [target_leader.GetName] погодиться на них піти.\n\nАбо ж відповідь може бути такою самою, як і минулого разу, і прохання можна відіслати назад униз ні з чим."
  pacific_crossing_events.26.a: "Вислухати їх і піти на незначні поступки."
  pacific_crossing_events.26.b: "Знову відмовити їм і продовжити шлях."
  pacific_crossing_events.27.title: "Нічний саботаж"
  pacific_crossing_events.27.desc: "Уночі хтось дістався припасів: діжка з водою пробита, бухта канатів перерізана наполовину. Дрібниці, але зроблені з явним наміром. Той, хто хоче повернути плавання назад, вирішив, що слів більше недостатньо. [target_leader.GetName] може наказати провести ретельний пошук винуватця або просто подвоїти варту та йти далі без нього.\n\nХай там як, але натяк зрозуміло."
  pacific_crossing_events.27.a: "Провести розслідування та знайти винного."
  pacific_crossing_events.27.b: "Подвоїти вахти та продовжити шлях без відповідей."
  pacific_crossing_events.27.culprit_found_tt: "Винного знаходять і показово карають перед усією командою"
  pacific_crossing_events.27.culprit_free_tt: "Розслідування нічого не дає, і шкідник завдає нового удару, перш ніж пошуки припиняють"
  pacific_crossing_events.27.no_investigation_tt: "Вахти подвоюють, але шкоди припасам уже завдано"