  pacific_crossing_cargo_loaded_effect: "У трюми завантажено #TOOLTIP:GOODS,silk,X #L шовк#!#!, #TOOLTIP:GOODS,porcelain,X порцеляну#! та прянощі — їх продадуть, коли флот повернеться до рідних портів."
  pacific_crossing_events.1.title: "Шлях додому"
  pacific_crossing_events.1.desc: "Завдання полягає не в тому, щоб просто дістатися #TOOLTIP:CONTINENT,asia,X #L Азії#!#!. Кораблі вже робили це, гнані на захід пасатами, немов листок — течією струмка. Завдання в тому, щоб повернутися. Колонія на далекому березі цього океану марна, якщо флот не може з неї повернутися; увесь задум залежить від того, чи знайдеться надійний шлях додому — такий, яким кораблі могли б ходити з року в рік, вивозячи #TOOLTIP:GOODS,silver,X #L срібло#!#! і повертаючись із #TOOLTIP:GOODS,silk,X #L шовком#!#!.\n\nПопутний вітер відомий і стійкий. Що лежить далі й чи дасть море флоту дорогу назад, не скаже жодна мапа в цій гавані. Лоцмани певні лише в одному: шлях туди не стане шляхом додому."
  pacific_crossing_events.1.a: "Спорядимо більший флот, зі ще одним кораблем для майбутніх пошуків."
  pacific_crossing_events.1.a.tt: "Ще один корабель споряджено та приєднано до флоту (#G +1#! корабель) "
  pacific_crossing_events.1.b: "Запасемося харчами на перехід, а решту довіримо вдачі."
  pacific_crossing_events.1.c: "[target_leader.GetNameWithNoTooltip] нанесе на мапу кожен вітер і течію на нашому шляху."
  pacific_crossing_events.1.historical_info: "#italic Торнав’яхе#!, зворотне плавання на схід, довгий час лишалося головною проблемою перших тихоокеанських виправ. Альваро де Сааведра, відпливши з Нової Іспанії, у 1528 та 1529 роках двічі був змушений відступити перед пасатами й зрештою загинув у спробах знайти зворотний шлях. У 1542 році Руї Лопес де Вільялобос, діставшись до Азії, також не зумів знайти дорогу додому. Придатний шлях знайшли лише у 1565 році. Доти флоти могли доплисти до Азії, але не мали змоги доправити свій вантаж назад."
  pacific_crossing_events.2.title: "Острови злодіїв"
  pacific_crossing_events.2.desc: "Тижні, коли довкола не було нічого, крім води та неба, добігають кінця, коли дозорний гукає: «Земля!» Це низький зелений острів, оточений білою піною прибою. Не встигає флот кинути якір, як назустріч мчать човни — стрункі човни під трикутними вітрилами, що ковзають із хвилі на хвилю так швидко, що лоцмани просто не можуть відвести очей. Острів’яни обліплюють борти, сміючись і нічого не боячись, та забирають усе, що не прив’язане. За їхніми звичаями, взяти те, що лежить без господаря, — не крадіжка; для людей, голодних після місяця в морі, це виклик.\n\nАле тут є прісна вода, і плоди, і риба — усе тільки й чекає, щоб його взяли."
  pacific_crossing_events.2.a: "Обміняємо намисто, тканину та залізо на воду й плоди."
  pacific_crossing_events.2.b: "Візьмемо потрібне для кораблів силою. Часу обмаль."
  pacific_crossing_events.2.fight_win_tt: "Острів’яни тікають від корабельної зброї, а команда без сорому набирає воду та плоди."
  pacific_crossing_events.2.fight_lose_tt: "Острів’яни чинять відчайдушніший опір, ніж очікувалося, і команду відкинуто до шлюпок з порожніми руками."
  pacific_crossing_events.2.c: "Забудемо про воду — придивимося до їхніх швидкохідних корпусів та вітрил."
  pacific_crossing_events.2.historical_info: "6 березня 1521 року, після понад трьох місяців без землі на видноколі, вцілілі з флоту Фернана Магеллана дісталися Гуаму. Чаморро вийшли назустріч на швидких проа з аутригерами, які, за словами літописця Антоніо Пігафетти, були швидшими за все, на чому коли-небудь плавали іспанці. Після того як острів’яни поцупили одну зі шлюпок, Магеллан назвав архіпелаг #italic «островами злодіїв»#! і висадився зі збройним загоном по харчі, перш ніж пливти далі до Філіппін."
  pacific_crossing_events.3.title: "Сорок днів порожнечі"
  pacific_crossing_events.3.desc: "Ані землі, ані птахів, ані навіть клаптика водоростей на воді. Команда вже багато тижнів у морі, і з кожним тижнем упевненість лоцмана тане. У людей кровоточать ясна та хитаються зуби; один клянеться, що стара рана, яка загоїлася багато років тому, знову відкрилася. Діжки з водою майже порожні, а в сухарях більше довгоносиків, ніж хліба. Вітер рівний і прохолодний, але він несе їх усе глибше в океан, якому не видно кінця.\n\nКапітан зберігає незворушний вигляд і спокійний голос, відраховує дні на мапі й не говорить нічого, у що сам не вірить."
  pacific_crossing_events.3.a: "Уріжемо пайки. Ми витерпимо все, що мусимо."
  pacific_crossing_events.3.b: "Курс вірний. Земля попереду — тримаємо курс."
  pacific_crossing_events.3.c: "Закличемо людей до порядку: слово капітана — закон!"
  pacific_crossing_events.4.title: "Земля за Західним морем"
  pacific_crossing_events.4.desc: "Через довгий час після того, як Острови злодіїв лишилися позаду, дозорний бачить крізь ранковий серпанок зелені пагорби. Коли флот заходить у велику бухту, стає ясно, що цей берег не порожній. На пагорбі над водою розкинулося поселення з вибіленими стінами та дахами, вкритими пальмовим листям. До кораблів відчалюють аутригери з людьми у барвистих тканинах, які не виявляють жодного занепокоєння.\n\nНайкремезніший із них, із золотом на шиї, звертається до нас [location.GetDominantCulture.GetLanguage.GetName|l]ою мовою, якої не знає жоден із лоцманів; він жестом вказує на берег із невимушеністю людини, яка часто торгує з чужоземцями. Ці острови мають свій власний світ — і через них уже пролягає торговий шлях, яким надходять #TOOLTIP:GOODS,silk,X #L шовк#!#! та #TOOLTIP:GOODS,porcelain,X порцеляна#! з далекого Катаю."
  pacific_crossing_events.4.desc.owned: "Через довгий час після того, як Острови злодіїв лишилися позаду, дозорний бачить крізь ранковий серпанок зелені пагорби — а потім над поселенням на пагорбі розрізняє барви наших власних стягів. Флот натрапив не на невідомий берег, а ввійшов у власну гавань: [pacific_colony.GetName], володіння нашої корони, чиї причали та склади вже діють.\n\nНазустріч кораблям виходять човни зі співвітчизниками на борту, які з подивом дивляться на флот, що виринув із порожнього океану на сході. Тут команда може спокійно поповнити запаси води та харчів і завантажити #TOOLTIP:GOODS,silk,X #L шовк#!#! та #TOOLTIP:GOODS,porcelain,X #L порцеляну#!#!, які китайські купці привозять до наших причалів."
  pacific_crossing_events.4.desc.hostile: "Через довгий час після того, як Острови злодіїв лишилися позаду, дозорний бачить крізь ранковий серпанок зелені пагорби — а потім чужий стяг над укріпленням біля самої води. Інша країна дісталася цих островів раніше. Коли флот заходить у бухту, [pacific_rival_shore.GetName] виставляє вздовж стін гармати, а озброєні човни прямують до кораблів, щоб з’ясувати, навіщо ми тут.\n\nТепер цією землею володі[pacific_rival.Custom('end_yeyut')] [pacific_rival.GetName], і зустріч буде в кращому разі настороженою. Шовк і порцеляна з Катаю, як і раніше, надходять на архіпелаг, але через руки наших суперників, а не безпосередньо до нас."
  pacific_crossing_events.4.a: "Відкриємо торгівлю шовком та порцеляною, що проходять крізь ці води."
  pacific_crossing_events.4.b: "Здійснимо набіг на поселення та візьмемо воду й харчі силою."
  pacific_crossing_events.4.b.raid_win_tt: "Жителі тікають углиб острова, а команди спустошують поселення, забираючи їжу та воду."
  pacific_crossing_events.4.b.raid_lose_tt: "Жителі б’ються за свої домівки та відганяють нападників до шлюпок — з порожніми руками й у крові."
  pacific_crossing_events.4.d: "Завантажимо сезонні товари з наших власних складів."
  pacific_crossing_events.4.e: "Дамо командам перепочинок і спорядження у нашому власному порту."
  pacific_crossing_events.4.f: "Обережно вестимемо справи з посередниками суперника під прицілом їхніх гармат."
  pacific_crossing_events.4.g: "Прорвемося на якірну стоянку та візьмемо необхідне силою."
  pacific_crossing_events.4.h: "Оминемо їхні гармати стороною та збережемо курс."
  pacific_crossing_events.4.raid_win_tt: "Аванпост узято приступом, його запаси пограбовано; команди тріумфують."
  pacific_crossing_events.4.raid_lose_tt: "Приступ відбито із втратами, а пошкоджений корабель доводиться кинути."
  pacific_crossing_events.4.historical_info: "Руї Лопес де Вільялобос, що прибув із Нової Іспанії в 1542 році, назвав архіпелаг #italic Las Islas Filipinas#! на честь спадкоємця іспанського престолу, майбутнього Філіппа II. Міцна іспанська присутність розпочалася лише в 1565 році, коли Мігель Лопес де Легаспі заснував перше поселення на Себу; в 1571 році він відвоював Манілу в раджі Сулеймана і зробив її столицею Іспанської Ост-Індії та західним кінцевим пунктом галеонної торгівлі."
  pacific_crossing_events.5.title: "Острів гвоздики"
  pacific_crossing_events.5.desc: "Запах досягає флоту раніше за острів: у вітрі відчувається солодкість тяжка, різка й пряна. Самітній вулканічний пік, увінчаний хмарою, зелений до самісінької води. Гавань повна малайських та яванських проа, а з якірної стоянки виразно видно палац, де живе [target_owner.Custom('GetRulerOrRegentTitle')] [target_owner.Custom('CL_GEN')|l].\n\nКожен купець у #TOOLTIP:LOCATION,lisbon,X #L Лісабоні#!#! та #TOOLTIP:LOCATION,sevilla,X #L Севільї#!#! віддає цілі статки за ці пахощі, навіть не знаючи, звідки вони родом. Ніхто на цих кораблях ще не був так близько до самого джерела — дерев над бухтою, на вітах яких важко висить ще не достигла #TOOLTIP:GOODS,cloves,X гвоздика#!. Одна партія цього вантажу варта більше, ніж коштувало все плавання. Трюми можна наповнити просто тут. Лишається тільки довезти крам додому."
  pacific_crossing_events.5.desc_known: "Запах досягає флоту раніше за острів: у вітрі відчувається солодкість тяжка, різка й пряна. Самітній вулканічний пік, увінчаний хмарою, зелений до самісінької води. Гавань повна малайських та яванських проа, а з якірної стоянки виразно видно палац, де живе [target_owner.Custom('GetRulerOrRegentTitle')] [target_owner.Custom('CL_GEN')|l].\n\nКожен купець у #TOOLTIP:LOCATION,lisbon,X #L Лісабоні#!#! та #TOOLTIP:LOCATION,sevilla,X #L Севільї#!#! знає ці пахощі й віддає за них цілі статки. Ніхто на цих кораблях ще не був так близько до самого джерела — дерев над бухтою, на вітах яких важко висить ще не достигла #TOOLTIP:GOODS,cloves,X гвоздика#!. Одна партія цього вантажу варта більше, ніж коштувало все плавання. Трюми можна наповнити просто тут. Лишається тільки довезти крам додому."
  pacific_crossing_events.5.desc.no_owner: "The smell reaches the fleet before the island does: a sweetness on the wind, heavy and sharp and spiced. A single volcanic peak trailing cloud, green to the water's edge. The harbor is busy with Malay and Javanese proas, though no banner or palace marks who claims this shore.\n\nEvery merchant in [ShowLocationName('lisbon')] and [ShowLocationName('sevilla')] pays a fortune for this scent, without ever knowing where its source is. No one in this fleet has ever stood this close to the source, the trees heavy with unripe [ShowGoodsName('cloves')] on the slopes above the bay, where a single shipload is worth more than the whole voyage has cost. The holds can be filled here. What remains is to carry them home."
  pacific_crossing_events.5.desc.driven_back: "Острови прянощів знову височіють перед кораблями — той самий зелений пік, та сама людна якірна стоянка — і разом із ними приходить гірке усвідомлення того, що флот мусив повернутися назад до місця відплиття, а шлях додому й досі не знайдено. Пасати не залишили кораблям іншого вибору, окрім як повернутися до цих берегів.\n\nТепер життя на стоянці перетворилося на похмуру буденність. Острови знову дадуть воду й поживу; недужих можна висадити на берег, дати перепочинок командам, а трюми поповнити всім, що кораблі ще здатні підняти. Але кожен на борту знає, що на них чекає: флоту доведеться зібратися на силах і знову вийти в море, щоб спробувати знайти шлях додому, і таких спроб у нього лишається небагато."
  pacific_crossing_events.5.a: "Наповнимо трюми гвоздикою. Завантажимо всі бочки до останньої."
  pacific_crossing_events.5.b: "Забезпечимо кораблі харчами для тривалого плавання додому."
  pacific_crossing_events.5.c: "Дамо команді відпочити й набратися сил на березі."
  pacific_crossing_events.5.d: "Облишимо пошуки й підемо додому довгим шляхом навколо мису."
  pacific_crossing_events.5.historical_info: "Португальські мореплавці досягли Молуккських островів у 1512 році, де Франсішку Серран став радником султана Тернате. Вцілілі кораблі Магеллана завантажили гвоздику в суперницькому султанаті Тідоре в 1521 році. Іспансько-португальське суперництво за острови розв'язав Сарагоський договір 1529 року, за яким імператор Карл V, зазнаючи грошової скрути, продав Португалії домагання Іспанії на Молуккські острови за 350 000 дукатів."
  pacific_crossing_events.6.title: "Шлях додому"
  pacific_crossing_events.6.desc: "Трюми наповнені, і легша частина плавання лишилася позаду. Тепер флоту належить зробити те єдине, чого не навчить жодна мапа: знайти зворотний шлях крізь щойно перетнутий океан. Вітер, який так лагідно ніс кораблі на захід, нині дме просто в лоб, і кожен лоцман за столом знає, що це означає.\n\nОфіцери флоту засиджуються над мапами допізна, і цього разу лоцмани не можуть дійти згоди. Кожен має власний курс, який він обстоює, і власні причини остерігатися решти, а за межами відомого моря ніхто з них не може поручитися, куди все це приведе, — є лише здогади та відвага поставити на них. Рішення належить одному лиш капітанові, і доля кожної живої душі на борту залежить від обраного ним курсу."
  pacific_crossing_events.6.desc.driven_back: "Офіцери флоту знову зібралися, і настрій за столом різко погіршився. Курс було обрано, але океан відкинув його; флот пробивався сюди весь шлях, щоб у підсумку отримати лише цей урок. Решта варіантів поки що лишаються тільки припущеннями — не більш перевіреними, ніж раніше, — а кораблів і людей зосталося надто мало, щоб ними важити.\n\nЛоцмани облишили підвищувати голос. Кожен, хто схилився над мапою, знає, що не можна раз у раз кидати виклик цьому морю без втрат. Потрібно наново прокласти курс із цих вод, а спроб для вибору лишилося не так уже й багато."
  pacific_crossing_events.6.a: "Північний шлях: триматися узбережжя Азії, а потім рушати на схід."
  pacific_crossing_events.6.a.tt: "Ходімо на північ уздовж берегів #TOOLTIP:REGION,japan_region,X $tt_op_L$Японії$tt_cl_2$ і далі, а потім хай західні вітри високих широт пронесуть флот крізь увесь океан і приведуть додому, до #TOOLTIP:CONTINENT,america,X #L Америки#!#!."
  pacific_crossing_events.6.b: "Серединний шлях — плисти на схід проти пасатів."
  pacific_crossing_events.6.b.tt: "Ходімо строго на схід, просто назустріч пасатам, повз уже знайомі острови. Цей вітер відкидав кожен флот, що намагався тут пройти, тож варто очікувати, що нас відкине назад аж до Островів прянощів."
  pacific_crossing_events.6.c: "Далекий південний шлях: велетенська дуга, довга, але відкрита."
  pacific_crossing_events.6.c.tt: "Ходімо далеко на південний схід усіяним островами південним океаном. Прохід там цілком може знайтися, але шлях неймовірно довгий, і харчів у флоту може забракнути до кінця."
  pacific_crossing_events.6.historical_info: "Усі спроби плисти на схід від Азії вздовж тропіків зазнавали невдачі. #italic «Тринідад»#! Гонсало Гомеса де Еспіноси, який намагався повернутися до Нової Іспанії в 1522 році, був відкинутий назад і захоплений португальцями; Альваро де Сааведра зазнав невдачі двічі — у 1528 та 1529 роках. У 1565 році августинський монах Андрес де Урданета досяг успіху, пішовши далеко на північ — приблизно до сорока градусів широти, — щоб зловити течію Куросіо та західні вітри, а потім перетнув з їхньою допомогою північну частину Тихого океану до Каліфорнії й спустився до Акапулько. Його шлях слугував манільським галеонам наступні два з половиною століття."
  pacific_crossing_events.7.title: "Тихий океан"
  pacific_crossing_events.7.desc: "Вітер ущухає. Вітрила бездиханно обвисли, море гладеньке, наче скло, до самого обрію, а кораблі нерухомо стоять під білим, розжареним небом. Саме за таке затишшя океан і дістав назву «Тихий» — за ту саму безтурботність, яка неодноразово прирікала команди на голодну смерть.\n\nВода в бочках робиться теплою й затхлою. Кожен безвітряний день — це змарнований пайок, і люди це розуміють. Вони дивляться на спорожнілий такелаж та обрій і вже двічі кричали «земля!», забачивши пасмо хмар, що розтануло без сліду. Бездіяльні руки на скутому штилем кораблі рідко залишаються без діла надовго."
  pacific_crossing_events.7.a: "Зачекаємо, заощаджуючи кожну краплю й крихту. Вітер повернеться."
  pacific_crossing_events.7.b: "Спустимо шлюпки й буксируватимемо кораблі, доки не повернеться вітер."
  pacific_crossing_events.7.c: "Зиб рухається на південний схід — дрейфуймо разом із нею назустріч вітру."
  pacific_crossing_events.8.title: "Повернення галеона"
  pacific_crossing_events.8.desc: "Зафрахтований галеон повернувся додому. Після кількох місяців плавання довгою північною дугою він заходить на рейд, тяжко навантажений скарбами #TOOLTIP:CONTINENT,asia,X #L Азії#!#!, які подолали шлях через увесь океан і щасливо прибули до берега. Ще до того, як він кинув якір, причали заповнилися агентами й покупцями. Маршрут себе виправдав, і справа принесла прибуток: наступного року і через рік ним вирушать нові галеони."
  pacific_crossing_events.8.a: "Цілий статок щасливо доправлено на берег."
  pacific_crossing_events.8.historical_info: "Манільський галеон курсував маршрутом Акапулько — Маніла майже щороку з 1565 по 1815 рік, ставши однією з найдовговічніших судноплавних ліній в історії. Він віз американське срібло на захід, а китайський шовк, порцеляну та прянощі — на схід; вантаж одного галеона міг принести вкладникам цілий статок. Ця торгівля зв’язала срібло Америки з ринками Китаю та перетворила Тихий океан на магістраль світової торгівлі."
  pacific_crossing_events.9.title: "Знайомий берег"
  pacific_crossing_events.9.desc: "Довгий шлях на північ, у холодні сірі води, а відтак нескінченна дуга на схід через порожній океан закінчується, коли дозорний нарешті помічає високий, порослий лісом берег і миси, що ховаються на півдні під шаром туману. Це не #TOOLTIP:CONTINENT,asia,X #L Азія#!#! і не якийсь острів — це західний берег самої #TOOLTIP:CONTINENT,america,X #L Америки#!#!. Флот перетнув [ShowContinentName('pacific_ocean_continent')] і вийшов до ближнього боку світу, і тепер йому лишається лише йти на південь уздовж узбережжя, вже знайомого за мапами, щоб дістатися дружньої гавані.\n\nШлях додому знайдено. Лишається лише пройти його до кінця."
  pacific_crossing_events.9.a: "Ходімо на південь додому вздовж знайомого берега."
  pacific_crossing_events.9.b: "Спершу зайдемо поповнити запаси води й відпочити — люди на це заслужили."
  pacific_crossing_events.9.historical_info: "Під час зворотного плавання 1565 року виправа Андреса де Урданети вийшла до американського берега біля узбережжя Каліфорнії, неподалік від мису Мендосіно, після приблизно чотирьох місяців плавання у відкритому північному Тихому океані. Звідти #italic «Сан-Педро»#! вирушив на південь і 8 жовтня 1565 року дістався Акапулько, підтвердивши можливість проходження цього маршруту. Північна дуга стала звичним шляхом повернення манільських галеонів."
  pacific_crossing_events.10.title: "Море здіймається"
  pacific_crossing_events.10.desc: "Небо набуває кольору синця, а вітер налітає, немов стіна. Вже за годину флот бореться за життя — хвилі здіймаються вище грот-реї, зелена вода перехлюпує через борт, вітрила рвуться з тріском, схожим на постріли. Кораблі насилу пробиваються крізь хвилі й хитаються з боку в бік, а в темряві вони один за одним зникають з очей. Лоцмани не можуть вдіяти нічого, окрім як триматися й лічити години.\n\nВибір є, але часу на роздуми катма: прибрати вітрила й перечекати шторм там, де кораблі є зараз, чи тікати від нього в пітьму з надією, що кораблі витримають."
  pacific_crossing_events.10.a: "Ляжемо в дрейф і перечекаємо бурю з прибраними вітрилами."
  pacific_crossing_events.10.b: "Підемо за вітром і молитимемося, щоб корпуси витримали."
  pacific_crossing_events.10.weathered_tt: "Флот виходить зі шторму пошарпаним, але цілим."
  pacific_crossing_events.10.foundered_tt: "Один корабель іде під воду й гине з усіма на борту."
  pacific_crossing_events.11.title: "Сира деревина"
  pacific_crossing_events.11.desc: "Кораблі поспіхом спорудили на нових корабельнях американського тихоокеанського узбережжя з деревини, яка не встигла просохнути, силами корабельників, що ніколи не будували для такого океану. Тепер море вимагає сплатити борг. Дошка розходиться по шву в середній частині корпусу; конопачення вибивається; під палубою люди стоять у прибулій воді, а помпи стукотять день і ніч, не в змозі впоратися з роботою. Обличчя теслі говорить саме за себе.\n\nТак тривати не може, а найближчий суходіл — на іншому боці океану."
  pacific_crossing_events.11.a: "Займемося кренуванням і все полагодимо."
  pacific_crossing_events.11.b: "Позмінно станемо до помп і підемо далі, попри все."
  pacific_crossing_events.11.c: "Покинемо напівзруйнований корабель, а його команду розмістимо на решті кораблів."
  pacific_crossing_events.12.title: "Дар моря"
  pacific_crossing_events.12.desc: "Усе починається з дельфінів — величезної зграї, що жене щось перед собою до кораблів. Потім саме море ніби спалахує: на поверхню підіймається велетенський косяк риби — акри срібла, які виблискують і вирують довкола корпусів, затиснуті дельфінами, що кружляють поруч, так тісно, що під ними майже не видно води.\n\nКоманді наказ не потрібен. За борт ідуть шлюпки, слідом — линви й сіті, а люди, перехилившись через поруччя, витягають рибу оберемками на палуби, які швидко стають заваленими та слизькими від улову. Після тижнів сухарів і солонини це водночас бенкет, несподівана удача й благодать."
  pacific_crossing_events.12.a: "Спустимо всі шлюпки й снасті — візьмемо все, що зможемо витягнути."
  pacific_crossing_events.12.b: "Швидко наловимо риби — і знову в дорогу."
  pacific_crossing_events.13.title: "Гнилі припаси"
  pacific_crossing_events.13.desc: "Стюард приходить до капітана, бгаючи капелюха в руках. У трюмі цілі яруси діжок розкриті й визнані непридатними: солонина погано просолена, сухарі спаковані вогкими, а вода протухла в бочках, яких ніхто не завдав собі клопоту як слід підготувати. Харчі, завантажені поспіхом і закупорені вогкими в портах відправлення, згнили в тропічній спеці, і те, що мало годувати команду тижнями, обернулося смердючою втратою, яка кишить хробаками.\n\nТут немає ринку й ще однієї нагоди — лише зіпсовані запаси й голодні люди."
  pacific_crossing_events.13.a: "Викинемо зіпсовані запаси за борт і змирімося із втратою."
  pacific_crossing_events.13.b: "Все одно роздамо пайки — їстимуть те, що знайдеться."
  pacific_crossing_events.17.title: "Загублені в морі"
  pacific_crossing_events.17.desc: "Звістки, коли вони нарешті надходять, — це лише уривки відомостей: ім’я, дата, останній відомий курс. Флот, що відплив на пошуки шляху додому, так його й не знайшов. Чи кораблі поглинув шторм, чи їх викинуло на якийсь безіменний риф, або ж вони просто дрейфували, доки не скінчилася вода, а разом із нею і люди, — ніхто не скаже напевно. Океан залишив їх собі.\n\nШлях додому лишається незнайденим. Десь там вітер усе ще віє не в той бік."
  pacific_crossing_events.17.a: "Вони не будуть останніми, кого ми втратимо в цьому океані."
  pacific_crossing_events.17.end_tt: "Виправа загинула, і її плавання завершується тут."
  pacific_crossing_events.17.historical_info: "Східний океан забрав життя багатьох, хто намагався його подолати. Очільник виправи Гарсія Хофре де Лоайса та навколосвітній мореплавець Хуан Себастьян Елькано загинули під час перетину Тихого океану в 1526 році; Альваро де Сааведра загинув у відкритому океані в 1529 році, намагаючись повернутися; а Фернан Магеллан був убитий на Мактані в 1521 році. З приблизно 270 людей, які вирушили з Іспанії разом із Магелланом, лише вісімнадцятеро повернулися на борту #italic «Вікторії»#!."
  pacific_crossing_events.18.title: "Команда бунтує"
  pacific_crossing_events.18.desc: "Люди так більше не можуть. Урізані пайки, безкраїй океан і курс, за який, крім лоцманів, ніхто не поручиться, — усе це довело команду до стану, коли вона вже не здатна коритися. На кормі збирається купка похмурих озброєних матросів, які чітко висловлюють свою вимогу: розвернути флот, інакше вони зроблять це самі. Офіцерів обмаль, а бунтівників багато, і мушкети тепер є в обох сторін.\n\nХоч би що ми вирішили зараз, це дорого обійдеться флоту."
  pacific_crossing_events.18.desc.last_ship: "Люди так більше не можуть. Від флоту залишився один корабель, і на його тісній, смердючій палубі офіцерові ніде сховатися. Заколотники йдуть на корму всім натовпом і цього разу не просять — вони з моторошною простотою кажуть капітанові правду про їхнє становище: бігти на інший корабель нікуди, морських піхотинців не покликати, а за бортом — безкраїй океан. Повертайте додому зараз, кажуть вони, інакше вас викинуть за борт.\n\nЛоцмани замовкли. Капітан стоїть сам біля борту, за його спиною — море, і він має відповісти."
  pacific_crossing_events.18.a: "Поступимося: нехай заколотники візьмуть корабель і повернуть назад."
  pacific_crossing_events.18.b: "Придушимо бунт силою. Повісимо заколотників і попливемо далі."
  pacific_crossing_events.18.c: "Нагадаємо їм, що чекає вдома, і хто веде їх туди."
  pacific_crossing_events.18.fight_win_tt: "Заколот придушено, лад відновлено (дух команди #G +5#!)"
  pacific_crossing_events.18.fight_lose_tt: "Сутичка стає кривавою, і в хаосі гине один із кораблів."
  pacific_crossing_events.18.overboard_tt: "Заколотники долають офіцерів, і [target_leader.GetName] летить у море. Плавання завершується тут."
  pacific_crossing_events.19.title: "Острови злодіїв (знову)"
  pacific_crossing_events.19.desc: "Ідучи на схід проти вітру, флот не може втримати курс, і зрештою перед його носом знову постають низькі зелені острови [ShowLocationName('guahan')], ті самі береги, які ми залишили позаду після переправи. Проа вислизають назустріч, як і раніше, насторожені та допитливі, а їхні команди розглядають чужинців, що повернулися з порожнього океану ні з чим. Хоч би що тут сталося першого разу, острів’яни це пам’ятають."
  pacific_crossing_events.19.desc.friendly: "Ідучи на схід проти вітру, флот не може втримати курс, і зрештою перед його носом знову постають низькі зелені острови [ShowLocationName('guahan')]. Цього разу проа виходять без страху: острів’яни пам’ятають чесний торг, і серед них є обличчя, які видаються команді знайомими. Люди підіймають товари, обмінюються знаками й цілком ясно обіцяють воду та свіжі харчі.\n\nФлоту вкрай потрібно і те й інше. Добрі стосунки, як виявилося, цінуються тут більше за будь-яку мапу."
  pacific_crossing_events.19.desc.hostile: "Ідучи на схід проти вітру, флот не може втримати курс, і зрештою перед його носом знову постають низькі зелені острови [ShowLocationName('guahan')]. Але проа тепер збираються великими гуртами, і в них не чути сміху: острів’яни не забули набіг і чекали на нас. Уздовж берега їжаться списи, а якірна стоянка, що колись щедро давала воду, тепер не видається привітною.\n\nФлоту все одно потрібні вода та харчі, і люди знають, що брати їх доведеться в народу, готового до зустрічі."
  pacific_crossing_events.19.a: "Знову поторгуємо з людьми, які мають про нас добрі спогади."
  pacific_crossing_events.19.b: "Візьмемо необхідне силою, доки вони не зібралися великим гуртом."
  pacific_crossing_events.19.b.win_tt: "Висаджений загін захоплює харчі та воду раніше, ніж острів’яни встигають зібратися."
  pacific_crossing_events.19.b.lose_tt: "Цього разу острів’яни готові; нападники відкинуті з втратами."
  pacific_crossing_events.19.c: "Наберемо води без бою, скільки вдасться, і підемо далі."
  pacific_crossing_events.19.historical_info: "Маріанські острови стали постійною зупинкою для кораблів, що перетинали Тихий океан, де можна було поповнити запаси води, а відносини з чаморро протягом століть існування галеонного шляху коливалися між настороженою торгівлею та відкритим насильством. Флот, який добре поводився з острів’янами, міг розраховувати на харчі; той, хто повівся з ними інакше, нерідко заставав ті самі береги закритими або мусив битися за кожну бочку води."
  pacific_crossing_events.20.title: "Грізний берег"
  pacific_crossing_events.20.desc: "Ще один острів здіймається з безкрайого південного моря — стрімкий, зелений, оперезаний рифом. Цей заселений: над деревами в’ється дим, а від берега вже відчалюють каное, повні людей із розмальованими тілами та списами, і вони видають звуки, схожі чи то на вітання, чи то на пересторогу. Ніхто на борту не може сказати напевно.\n\nЛоцмани ніколи не наносили цю місцину на мапу й не можуть назвати люд, що ним володіє. Але запаси води добігають кінця, люди зголодніли, а заселений острів — це харчі, якщо їх удасться здобути. Нагодує цей берег флот чи обернеться проти нього, залежатиме від того, як мине найближча година."
  pacific_crossing_events.20.a: "Оминемо острів — битися тут немає чого."
  pacific_crossing_events.20.b: "Підійдемо й поторгуємо — покажемо залізо та тканини й сподіватимемося на краще."
  pacific_crossing_events.20.trade_ok_tt: "Остров’яни опускають списи й охоче міняються; шлюпки повертаються, завантажені харчами та водою."
  pacific_crossing_events.20.trade_ambush_tt: "Перемови виявляються пасткою: каное оточують кораблі, і флот пробивається ціною великої крови."
  pacific_crossing_events.20.c: "Висадимося на острів і візьмемо силою все, що зможемо."
  pacific_crossing_events.20.raid_win_tt: "Висаджений загін заганяє остров’ян назад у ліс і забирає їхні запаси."
  pacific_crossing_events.20.raid_lose_tt: "Остров’яни люто б’ються за свої домівки, тож нападників розбивають і відганяють до шлюпок."
  pacific_crossing_events.21.title: "Поразка"
  pacific_crossing_events.21.desc: "Тиждень за тижнем флот насилу просувається на схід, і тиждень за тижнем море відбирає назад усі наші успіхи. Пасат не слабшає й не змінюється; він стоїть стіною просто перед носом, а течія під ним прямує туди ж, зносячи кораблі на захід уночі швидше, ніж вони просуваються на схід удень. Лоцмани роблять заміри, звіряють їх і замовкають — лінія на мапі перестала рухатися вперед і поповзла назад.\n\nІз цим годі сперечатися — це біляче колесо, а не шлях, і кожен день на ньому марнує воду та життя. Залишається лише гіркий вибір: розвернутися, піти за вітром, що здолав нас, і повести флот назад до Островів Прянощів, щоб усе наново обміркувати."
  pacific_crossing_events.21.a: "Це море не підкорити силою."
  pacific_crossing_events.22.title: "Прохання команди"
  pacific_crossing_events.22.desc: "З кожним днем припаси тануть швидше, ніж зростає число подоланих миль. Води обмаль, та й та протухла, сухарі розсипалися на порох, а перелік хворих довшає щоранку. На корму приходить делегація старих матросів — ще не для заколоту, але з твердою переконаністю людей, які вміють лічити бочки. Вони все порахували й дійшли висновку, що розрахунки не на їхню користь. Повертайте, кажуть вони, доки в трюмі ще достатньо запасів, щоб дістатися відомого берега. Підемо далі — поховаємо флот у цьому океані.\n\nУ їхніх словах є глузд, хай як неприємно було це чути."
  pacific_crossing_events.22.a: "Дослухатися до них і повернути флот назад, до Островів Прянощів."
  pacific_crossing_events.22.b: "Відмовимо. Ми зайшли надто далеко, щоб повертати."
  pacific_crossing_events.23.title: "Кров на палубі"
  pacific_crossing_events.23.desc: "Суперечка, що спалахнула в день відмови на прохання, так і не вщухла й сьогодні дійшла до бійки. Боцман, вірний виправі, обмінюється образами з кількома людьми, які все ще не змирилися з відмовою повернути назад; образи переростають у штовханину, а штовханина — у бійку, яка хутко шириться палубою, і вже миготять оголені клинки.\n\n[target_leader.GetName] біжить на шум і застає вахту, що вже б’ється через сварку, яка насправді зовсім не стосувалася боцмана."
  pacific_crossing_events.23.a: "Втрутимося й рознімемо бійку."
  pacific_crossing_events.23.b: "Викинемо заводія за борт — та й по всьому."
  pacific_crossing_events.23.c: "Heed them and turn the fleet back for the Spice Islands."
  pacific_crossing_events.23.break_up_win_tt: "Бійку вдається розняти, доки не пролилася справжня кров."
  pacific_crossing_events.23.break_up_lose_tt: "Сутичка стає кривавою, перш ніж удається відновити лад."
  pacific_crossing_events.23.overboard_tt: "Заводія хапають і без зайвих слів жбурляють у море. Команда спостерігає за цим у крижаній мовчанці."
  pacific_crossing_events.24.title: "Пожежа в морі"
  pacific_crossing_events.24.desc: "З корми лунає лемент: один із кораблів флоту охоплений вогнем. Те, що розпочалося як чергова сварка через повернення додому, у метушні призвело до перекинутого ліхтаря, і полум’я вже біжить такелажем швидше, ніж устигають наповнювати відра. Вітер несе іскри до решти кораблів.\n\n[target_leader.GetName] мусить швидко вирішити: скоротити відстань і допомогти боротися з вогнем чи триматися осторонь і полишити охоплений полум’ям корабель напризволяще."
  pacific_crossing_events.24.a: "Підійдемо впритул до їхнього борту й допоможемо загасити пожежу."
  pacific_crossing_events.24.b: "Триматимемося на відстані, нехай гасять самі."
  pacific_crossing_events.24.saved_tt: "Разом ми швидко гасимо пожежу, поки вона не встигла охопити весь корабель"
  pacific_crossing_events.24.caught_fire_tt: "Через іскри, що летять, полум’я перекидається на наш корабель"
  pacific_crossing_events.24.distance_tt: "Охоплений полум’ям корабель догоряє до ватерлінії, поки решта флоту спостерігає за пожежею з безпечної відстані"
  pacific_crossing_events.25.title: "Бунт на кораблі"
  pacific_crossing_events.25.desc: "[target_leader.GetName] отримує звістку з одного з інших кораблів: його команда збунтувалася проти офіцерів. Уже знайомі суперечки про потребу повернути назад переросли у відкритий заколот. Вірні капітанові моряки забарикадувалися в трюмі, поки заколотники сперечаються про те, що робити далі. Часу на роздуми про те, чи варто втручатися, майже не лишилося.\n\nСпущена на воду шлюпка ще може переломити перебіг подій на борту бунтівного корабля — або ж стане для заколотників новою легкою здобиччю."
  pacific_crossing_events.25.a: "Піднімемося на борт і підтримаємо вірну команду."
  pacific_crossing_events.25.b: "Станемо віддалік, нехай розбираються самі."
  pacific_crossing_events.25.c: "Послухаємо бунтівників і повернемо назад до Островів Прянощів."
  pacific_crossing_events.25.loyal_win_tt: "Вірні моряки беруть гору, лад відновлено"
  pacific_crossing_events.25.loyal_lose_tt: "Бунтівники перемагають абордажну команду та захоплюють корабель"
  pacific_crossing_events.25.distance_tt: "Бунтівники відводять корабель геть, поки ми не встигли нічого вдіяти"
  pacific_crossing_events.26.title: "Чергове прохання"
  pacific_crossing_events.26.desc: "Делегація повертається. Цього разу її учасники поводяться покірніше, але все ще твердо стоять на своєму. Вони не сиплють погрозами й не підвищують голосу, лише знову викладають свої підрахунки, які стали похмурішими відтоді, як ми минулого разу відкинули пропозицію. Якщо [target_leader.GetName] забажає піти на невеликі поступки, це дещо заспокоїть настрої в трюмі.\n\nАбо ж ми можемо відповісти так само, як і минулого разу, щоб прохачі повернулися до трюму ні з чим."
  pacific_crossing_events.26.a: "Вислухаємо прохачів і підемо на невеликі поступки."
  pacific_crossing_events.26.b: "Знову відмахнемося від них і продовжимо, як раніше."
  pacific_crossing_events.27.title: "Нічний саботаж"
  pacific_crossing_events.27.desc: "Уночі хтось пробрався до припасів: бочку з водою розбито, бухту такелажного каната перерубано навпіл. Це дрібні капості, але вони вочевидь зроблені з умислом. Той, хто жадає повернути виправу назад, вирішив, що самих слів уже замало. [target_leader.GetName] може наказати обшукати всі кораблі в пошуках винуватця або ж просто подвоїти варту та продовжити шлях без зайвих розглядів.\n\nТак чи інакше, послання заколотників помітили."
  pacific_crossing_events.27.a: "Проведемо розслідування та знайдемо винного."
  pacific_crossing_events.27.b: "Подвоїмо варту та продовжимо без розглядів."
  pacific_crossing_events.27.culprit_found_tt: "Винного знайдено й показово покарано перед усією командою"
  pacific_crossing_events.27.culprit_free_tt: "Пошуки ні до чого не привели, їх припинено після того, як шкідник знову зіпсував припаси"
  pacific_crossing_events.27.no_investigation_tt: "Охорону подвоєно, але припаси вже зіпсовано"