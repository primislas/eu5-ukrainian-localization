  pacific_crossing_events.ships_lost_2_tt: "Втрачено два кораблі (#R -2#! Кораблі)"
  pacific_crossing_events.1.desc: "The commission is not simply to reach [ShowContinentName('asia')] — ships have done that, borne west on the trade winds like a leaf on a stream. The commission is to come back. A colony on the far shore of this ocean is worthless if a fleet can sail to it but never return; the whole enterprise depends on finding a reliable passage home, one a ship can sail year after year with [ShowGoodsName('silver')] going out and [ShowGoodsName('silk')] coming back.\n\nThe outward wind is known and steady. What lies beyond, and whether the sea will ever give the fleet a road back, no chart in this harbor can say. The pilots are certain of only one thing: the way out will not be the way home."
  pacific_crossing_events.2.desc: "Weeks of nothing but water and sky end when the look-out cries land: a low green island ringed with white surf. Before the fleet can anchor, canoes are racing out to meet it — slender outriggers under triangular sails, skimming from wave to wave so fast the pilots stand and stare. The islanders swarm up the sides, laughing and unafraid, and carry off whatever is not lashed down. To them there is no theft in taking what lies unclaimed; to hungry men a month at sea, it is provocation.\n\nBut there is fresh water here, and fruit, and fish, ripe for the taking — one way or another."
  pacific_crossing_events.3.desc: "No land, no birds, not even a strand of seaweed floating upon the water. The crew has been at sea for weeks and the pilot's confidence thins with each one. Men have bleeding gums and loosening teeth; one swears an old wound, healed for years, has split open again. The water casks are low and the biscuit is more weevil than bread. The wind is kind, steady and cool, but it carries them ever deeper into an ocean that shows no sign of ending.\n\nThe captain keeps his face calm and his voice level, counts the days on the chart, and says nothing he does not believe."
  pacific_crossing_events.5.desc.driven_back: "The Spice Islands rise over the bow once more — the same green peak, the same crowded anchorage — and with them the bitter knowledge that the fleet has been driven all the way back to where it began, the way home still unfound. The trades gave the ships no choice but to run back to these shores.\n\nThere is a grim routine to the anchorage now. The islands will give up water and food again; the sick can be landed, the crews rested, the holds topped up with whatever the ships can still carry. But every man aboard knows the reckoning that waits — the fleet must gather itself and stand out to sea to try the passage home again, and it will not have many more attempts left in it."
  pacific_crossing_events.6.desc: "The holds are full, and the easy half of the voyage is behind us. Now the fleet must do the one thing no chart aboard can show it how to do: find its way back across the ocean it has just crossed. The wind that bore the ships so gently westward stands square against their return, and every pilot at the table knows what that means.\n\nThe fleet's officers sit late over the charts, and for once the pilots cannot agree. Each has a course to urge and a reason to fear the others, and beyond the edge of the known sea none of them can promise where any of it leads — there is only conjecture, and the nerve to wager on it. The decision belongs to the captain alone, and every soul aboard will live or die by the course he sets."
  pacific_crossing_events.6.desc.driven_back: "The fleet's officers convene again, and the mood at the table has curdled. A course was chosen, and the ocean threw it back; the fleet struggled all the way here for nothing but the lesson of it. The courses that remain are only arguments still — no better proven than before, and now there are fewer ships and thinner crews to hazard upon them.\n\nThe pilots have stopped raising their voices. Every man bent over the chart knows this sea cannot be thrown against again and again without cost. A course has to be set out of these waters once more, and there will not be many more chances to choose."
  pacific_crossing_events.7.desc: "The wind dies. The sails hang slack, the sea lies flat and glassy to every horizon, and the ships sit motionless beneath a white and burning sky. It was for calm like this that the ocean was named 'the peaceful sea' — a gentleness that has starved crews before now.\n\nThe water in the casks grows warm and foul. Every windless day is a day's ration spent for no distance made, and the men know it. They watch the empty rigging and the horizon, and twice already have cried land at a bank of cloud that melted into nothing. Idle hands aboard a becalmed ship rarely stay idle for long."
  pacific_crossing_events.10.desc: "The sky goes the color of a bruise and the wind comes on like a wall. Within an hour the fleet is fighting for its life — seas rearing higher than the mainyard, green water bursting over the waist, canvas splitting with cracks like gunfire. The ships labor and roll, and in the murk they lose sight of one another one by one. The pilots can do nothing but hold on and count the hours.\n\nThere is a choice, and no time to weigh it: shorten sail and ride out the storm where the ships currently lie, or run before it into the dark and trust the hulls to hold together."
  pacific_crossing_events.11.desc: "The ships were laid down in haste in the new yards of the American Pacific coast, from timber that never had time to season, by shipwrights who had never built for an ocean like this. Now the sea is collecting the debt. A plank starts from its seam amidships; the caulking works loose; below decks the men stand in rising water and the pumps clank day and night without gaining. The carpenter's face tells its own story.\n\nThis cannot continue, and the nearest dry land is half an ocean away."
  pacific_crossing_events.12.desc: "It begins with the dolphins — a great pod of them, driving something ahead of them toward the ships. Then the sea itself seems to catch fire: an enormous shoal of fish thrown up to the surface, acres of silver flashing and boiling around the hulls, hemmed in by the circling dolphins until the water can barely be seen for the press of them.\n\nThe crew needs no order. Boats go over the side, lines and nets follow, and men lean from the rails hauling fish by the armful onto decks that are soon heaped and slick with the catch. After weeks of biscuits and salt meat, it is a feast, a windfall, and a mercy all at once."
  pacific_crossing_events.13.desc: "The steward comes to the captain with his hat in his hands. Down in the hold, whole tiers of barrels have been broached and found ruined — salt meat improperly cured, biscuits packed damp, water gone foul in casks that were never properly seasoned. Provisions loaded in haste and sealed wet in the ports of departure have rotted in the tropical heat, and what should have fed the crew for weeks is a reeking, maggot-ridden loss.\n\nThere is no market out here, and no second chance — only spoiled stores and hungry men."
  pacific_crossing_events.17.desc: "The reports, when they finally come, are fragments — a name, a date, a last known heading. The fleet that sailed to find the way home never found it. Whether the ships were swallowed by a storm, driven onto some nameless reef, or simply drifted until the water ran out and the men with it, no one will ever say for certain. The ocean has kept them.\n\nThe route home remains unfound. Somewhere out there, the wind still blows the wrong way."
  pacific_crossing_events.18.desc: "The men have had enough. Short rations, an ocean without end, and a course no one but the pilots can vouch for — it has ground the crew down past obedience. A knot of sailors gathers aft, sullen and armed, and puts the demand plainly: turn the fleet around, or they will turn it themselves. The officers stand few against many, and the muskets are not all on one side.\n\nWhatever is decided now, it will cost the fleet something it cannot easily replace."
  pacific_crossing_events.18.desc.last_ship: "The men have had enough. One ship is all that remains of the fleet, and on its crowded, stinking deck there is nowhere for an officer to hide. The ringleaders come aft in a body, and this time they do not ask — they tell the captain the truth of their situation with terrible simplicity: there is no other ship to flee to, no marines to call, and a great deal of ocean over the side. Turn for home now, they say, or be thrown to it.\n\nThe pilots have gone quiet. The captain stands alone at the rail with the sea at his back, and must answer."
  pacific_crossing_events.19.desc.friendly: "Beating east against the wind, the fleet makes no ground it can keep, and at last the low green islands of [ShowLocationName('guahan')] rise again over the bow. This time the proas come out without fear — the islanders remember fair dealing, and there are faces among them the crews half recognize. Trade goods are held up, gestures exchanged, and the promise of water and fresh food is plain enough.\n\nThe fleet needs both badly. Old goodwill, it seems, is worth more out here than any chart."
  pacific_crossing_events.19.desc.hostile: "Beating east against the wind, the fleet makes no ground it can keep, and at last the low green islands of [ShowLocationName('guahan')] rise again over the bow. But the proas that put out now come in numbers, and there is no laughter in them — the islanders have not forgotten the raid, and they have been waiting. Spears bristle along the shore, and the anchorage that gave water freely before will not give it easily now.\n\nThe fleet needs water and food regardless, and the men know they will have to take it through a people ready for them."
  pacific_crossing_events.20.desc: "Another island lifts out of the endless southern sea — steep, green, and ringed with reef. This one is inhabited: smoke rises from the trees, and canoes are already pushing off the beach, crowded with figures who paint themselves and carry spears, and who raise a wall of sound across the water that is either welcome or warning. No one aboard can tell which.\n\nThe pilots have never charted this place and cannot name the people who hold it. But the water-casks are low and the men are hungry, and an inhabited island means food, if it can be had. Whether this shore feeds the fleet or turns on it will depend on how the next hour is played."
  pacific_crossing_events.21.desc: "Week after week the fleet claws east, and week after week the sea sets back everything we have gained. The trade wind never slackens and never shifts; it stands square on the bows like a wall, and the current beneath runs the same way, carrying the ships west faster by night than they make east by day. The pilots take their sightings, compare them, and fall silent — the line on the chart has stopped moving forward, and begun to slide back.\n\nThere is no arguing with it — a treadmill, not a passage, and every day spent on it costs water and lives for nothing. The only course left is the bitter one: come about, run before the wind that has defeated them, and carry the fleet back to the Spice Islands to think again."
  pacific_crossing_events.22.desc: "Every day, the provisions are failing at a faster rate than the number of miles we advance. The water is short and foul, the biscuits are gone to dust, and the sick list grows longer every morning. A delegation of the older hands comes aft — not in mutiny, not yet, but with the flat conviction of men who can count barrels. They have done the arithmetic of the voyage, and it does not come out in their favor. Turn back, they say, while there is still enough in the hold to reach a known shore. Press on, and they will bury the fleet in this ocean.\n\nThere is logic in what they say, however unwelcome it is to hear."
  pacific_crossing_events.23.desc: "The argument that began the day the petition was refused has never truly died down, and today it turns to blows. A boatswain loyal to the voyage trades insults with a knot of men still nursing the refusal to turn back; insults become shoves, and shoves become a brawl spreading fast across the deck, with more than one blade already drawn.\n\n[target_leader.GetName] reaches the scene to find the watch already come to blows over a quarrel that was never truly about the boatswain at all."
  pacific_crossing_events.24.desc: "A cry goes up from astern: one of the fleet's other ships is ablaze. What began as another brawl over the course home has knocked over a lantern in the confusion, and flame is already running up the rigging faster than buckets can be filled. Sparks carry on the wind toward the rest of the fleet.\n\n[target_leader.GetName] must decide quickly whether to close the distance and help fight the blaze, or hold clear and let the burning ship take its chances."
  pacific_crossing_events.25.desc: "Word reaches [target_leader.GetName] by signal from one of the other ships: the crew there has risen against their officers, the same argument over turning back having curdled into open mutiny. Loyal hands are barricaded below while the mutineers argue over what to do next. There is little time to decide whether to intervene.\n\nA boat lowered now might yet turn the balance aboard the other ship, or simply hand the mutineers a second prize."
  pacific_crossing_events.26.desc: "The delegation is back, more subdued this time but no less determined. They do not threaten, nor do they raise their voices; they simply lay out the same arithmetic as before, a little grimmer for the days that have passed since it was last refused. A few small concessions might buy some peace belowdecks, if [target_leader.GetName] is willing to make them.\n\nOr the answer can be the same as last time, and the petition can be sent back below with nothing to show for it."
  pacific_crossing_events.27.desc: "Someone has been at the stores in the night: a cask of water staved in, a coil of rigging cut half through. Small things, but done with clear intent. Whoever wants this voyage turned back has decided that words are no longer enough. [target_leader.GetName] can order a proper search for the culprit, or simply double the watches and press on without one.\n\nEither way, the message has been received."