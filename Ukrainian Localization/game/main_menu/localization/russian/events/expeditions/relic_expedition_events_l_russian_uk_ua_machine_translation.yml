l_russian:
  relic_expedition_events.1.title: "Посольство по реліквію"
  relic_expedition_events.1.desc: "Єпископи звернулися з проханням, і [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')|l] дає згоду. Посольство вирушить до охоронців однієї з величних християнських святинь, щоб отримати як дарунок, викупити або здобути обачними перемовинами те, чого жодне військо не візьме силою. Нашим посланцям доведеться подорожувати водночас і як послам, і як прочанам — добре спорядженими, красномовними та пильними. Питання лише в тому, скільки пишноти й державної ваги надати їхній виправі."
  relic_expedition_events.1.a: "Спорядити їх як належить: дарунки, тлумач, поважний чернець і щедрий капшук грошей."
  relic_expedition_events.1.b: "Вистачить одного довіреного посланця зі скромним капшуком. Менше знають — ліпше."
  relic_expedition_events.1.historical_info: "Торгівля реліквіями в добу Середньовіччя та Раннього Нового часу була значною справою. Католицькі та православні громади змагалися за найшанованіші святині; продаж, обмін та відверті крадіжки століттями переміщували реліквії християнським світом. Відомо, що в 1238 році король Франції Луї IX викупив Терновий вінець у латинського імператора Балдуїна II та збудував для нього каплицю Сент-Шапель у Парижі — справа, що була настільки ж державним актом, як і виявом благочестя."
  relic_expedition_events.20.title: "Прочанин із мапою"
  relic_expedition_events.20.desc: "Старий чоловік наздоганяє посольство в дорозі, тримаючи пошарпану торбу через плече та гладенько витертий у руці ціпок. Він уже бував у святині, до якої ми прямуємо; він бачив саму реліквію й може описати каплицю, варту, єпископа та навколишні землі на пів ліги довкола. Він просить лише місце біля вогнища, кухоль вина й змогу виговоритися. [target_leader.GetName] саджає його поруч і слухає дві години."
  relic_expedition_events.20.a: "Попрощатися з ним, давши монету та взявши благословення. Дорога щойно стала значно коротшою."
  relic_expedition_events.20.historical_info: "Мережі прочан середньовічного християнського світу зберігали в собі величезний пласт практичних відомостей: про дороги, ціни, небезпечні перевали, гостинні монастирі, вдачу єпископів і графів, яких зустрічали на шляху. Прочанин, що вертався, часто був кориснішим оповісником, ніж будь-який офіційний посланець, якого могла спорядити корона, тому посольства повсякчас набирали своїх провідників із-поміж них."
  relic_expedition_events.21.title: "[target_country.GetAdjectiveWithNoTooltip]а командорія"
  relic_expedition_events.21.desc: "Посольство прибуває до #TOOLTIP:BUILDING_TYPE,order_commandery,X #L командорії ордену#!#! [target_country.Custom('longname_ua_GEN')] на внутрішній дорозі в [target_location.Custom('LR_PREP')] [target_location.GetName], захищеної низьким кам’яним муром і над якою майорить стяг із хрестом. Комтур приймає очільника посольства з належною пошаною, розпоряджається розмістити гостей у палаті для приїжджих, напоїти коней і нагодувати людей, а також видає охоронну грамоту на наступну ділянку шляху через землі, за які сперечаються троє володарів. Брати не просять нічого натомість, окрім служби Божої в каплиці командорії."
  relic_expedition_events.21.a: "Вислухати службу, залишити щедрий дар на вівтарі та рушити далі, добре відпочивши."
  relic_expedition_events.21.historical_info: "Лицарські ордени, насамперед госпітальєри й тамплієри до їхнього розпуску в 1312 році, утримували низку укріплених прихистків і командорій уздовж головних паломницьких шляхів із Західної Європи до Святої землі. Мандрівні загони з благочестивою метою могли розраховувати на харч, прихисток і безпечний перехід від однієї командорії до іншої, а рекомендаційні листи орденів мали значну вагу при кожному католицькому дворі."
  relic_expedition_events.22.title: "Благословення ігумена"
  relic_expedition_events.22.desc: "Дорога в [target_location.Custom('LR_PREP')] [target_location.GetName] в’ється повз сусідній #TOOLTIP:BUILDING_TYPE,orthodox_monastery,X #L православний монастир#!#!, зведений на схилі ущелини, і коли посольство минає його, дзвони саме кличуть на вечірню. Ігумен, довідавшись про мету виправи, спускається благословити очільника й наполягає, щоб посольство заночувало в монастирській гостиниці. Він довго веде бесіду до самої ночі про реліквію, яку ми шукаємо, про поважність її охоронців та про те, як належить до них звертатися. Очільник усе ретельно записує."
  relic_expedition_events.22.a: "Прийняти благословення, залишити милостиню для монастирських нужденних і рушити далі."
  relic_expedition_events.22.historical_info: "Православне чернецтво зберегло безперервну спадщину шанування реліквій та міжхристиянських зносин протягом усього Середньовіччя. Католицькі посольства, споряджені по реліквії, на внутрішніх ділянках свого шляху часто залежали від гостинности православних монастирів, а рекомендаційний лист ігумена до місцевого патріарха чи імператорського двору міг суттєво полегшити подальші перемовини."
  relic_expedition_events.23.title: "Забутий релікварій"
  relic_expedition_events.23.desc: "У капличці на пагорбі, куди вже хтозна-відколи ніхто не заходив, чернець із нашого посольства знаходить на бічному вівтарі невеличкий релікварій — запилений, залишений без нагляду й, вочевидь, геть забутий парафією. Усередині, загорнутий у вицвілий шовк, лежить уламок кістки з латинським написом: #italic SS. THEODORI MARTYRIS#!. Місцевий священник, коли його розпитали, невиразно пригадує, що щось подібне мало тут бути, і радо погоджується віддати релікварій в обмін на щедру пожертву для парафії."
  relic_expedition_events.23.a: "Сховати релікварій у переметні суми. Менша реліквія — теж реліквія."
  relic_expedition_events.23.historical_info: "У середньовічному християнському світі було повно малих реліквій: часточок мощей маловідомих святих, клаптиків святого одягу, посудин із нібито священною землею чи водою, поміщених у дерев’яні, зроблені зі слонової кістки або з коштовних металів релікварії та розісланих по сільських капличках і святинях. Багато таких релікваріїв переставали вшановувати, коли занепадала парафія, що їх отримала, або згасало шанування святого; знайти такий було звичною супутньою вигодою будь-якої тривалої церковної подорожі."
  relic_expedition_events.30.title: "Розбійники на перевалі"
  relic_expedition_events.30.desc: "Ватага розбійників, знаючи про багату скарбницю посольства, влаштувала засідку серед скель над гірським перевалом. Охорона, вчасно попереджена козопасом, що прибіг дорогою, стає в коло й відбиває напад, однак двох наших людей поранено, а одного з в’ючних мулів із дарунками зіштовхнули в прірву разом із вантажем. Розбійники зникають у високогір’ї. Посольство рушає далі, значно полегшавши з часу свого виходу."
  relic_expedition_events.30.a: "Рушати далі. Нічого не вдієш, треба йти."
  relic_expedition_events.30.historical_info: "Гірські перевали в добу Середньовіччя та Раннього Нового часу повсякчас кишіли розбійниками, які доповнювали вбоге верховинне господарство здирництвом мита та відвертим грабунком кожного загону, що не міг дати відсіч. Великі шляхи на Балканах, Анатолійському плоскогір’ї та в глибині Леванту мали перевали, до яких жоден мандрівник не наближався без охорони, а втрата в’ючних тварин, що зривалися зі скелі чи в ущелину, постійно згадується в літописах прочан."
  relic_expedition_events.31.title: "Місто, уражене пошестю"
  relic_expedition_events.31.desc: "Посольство прибуло до [target_location.Custom('LR_GEN')] [target_location.GetName], але виявило, що місто замкнув власний зневірений [target_country.GetAdjective|l]ий магістрат. Спалахнула пошесть; брами зачинені для всіх подорожніх; з-за мурів здіймається дим від охоплених вогнем осель. [target_leader.GetName] наказує посольству обійти місто довколишніми полями, однак двоє наших людей, які вирушили вперед домовитися про нічліг, опинилися замкненими всередині, щойно брами зачинилися. Чи виживуть вони, ми не знатимемо ще кілька тижнів."
  relic_expedition_events.31.a: "Піти в обхід і рушати далі. Молитися за тих, кого довелося залишити."
  relic_expedition_events.31.historical_info: "Пошесті, зокрема катастрофічний чумний мор XIV століття, були постійною загрозою для мандрівників у добу середньовіччя та раннього модерну. Міста звично замикали свої брами для подорожніх, щойно спалахував мор, і паломникам чи посольствам, яким не пощастило опинитися біля воріт у невдалу мить, доводилося робити довгий обхід, зазнаючи значних збитків. Доля вісників, які опинялися замкненими всередині, нерідко ставала гірким спогадом у тогочасних подорожніх записах."
  relic_expedition_events.32.title: "Буря на морі"
  relic_expedition_events.32.desc: "Найнята посольством галера, що пливла вздовж незнайомого узбережжя, потрапила під раптовий північний шквал, який викинув її на підвітряну мілину. Корпус витримав, однак щогли зламалися, а вантаж дарунків розкидало трюмом так, що половину було зіпсовано. Капітан витягнув корабель на берег для двотижневого лагодження. [target_leader.GetName], лютуючи, пише листи додому, відповіді на які не буде місяцями, і блукає берегом, марно згадуючи, коли востаннє бодай щось ішло до ладу."
  relic_expedition_events.32.a: "Зачекати, доки корабель полагодять. Реліквія, вочевидь, нікуди не подінеться."
  relic_expedition_events.32.historical_info: "Мореплавство в Середземному та Егейському морях у домодерну добу цілковито залежало від погоди. Раптові шквали з Адріатики, вітри мельтемі у відкритому Егейському морі та несподівані бурі біля узбережжя Леванту зазвичай викидали кораблі на незнайомі береги й змушували ставати на тривале та дороге лагодження. У паломницьких і дипломатичних описах того часу такі аварії вважалися звичайною дорожньою прикрістю, а не приводом для справжньої паніки."
  relic_expedition_events.33.title: "Тлумач занедужав"
  relic_expedition_events.33.desc: "Тлумач-багатомовець, наша головна опора для майбутніх перемовин, зліг із раптовою гарячкою в заїжджому дворі. [target_leader.GetName], не бажаючи кидати його помирати серед чужинців, зупиняє посольство на три дні; табірний лікар робить усе можливе; посилають по місцевого священника — ніщо не допомагає. На четвертий ранок тлумача поховали на сільському цвинтарі. Посольство рушає далі, але тепер наші можливості порозумітися вкрай обмежені."
  relic_expedition_events.33.a: "Рушати далі. Місія надто важлива, щоб зупиняти її через одну смерть."
  relic_expedition_events.33.historical_info: "Вправні тлумачі були одними з найцінніших учасників будь-якого домодерного посольства. Перемовини між різними християнськими течіями, попри спільну віру, вимагали знання латини й грецької, яким володів далеко не кожен клірик; втрата тямущого тлумача в дорозі могла перекреслити всю мету виправи. Ті, хто опинявся в такій скруті, зазвичай покладалися на писемну латину та церковну мову жестів, аби сяк-так порозумітися."
  relic_expedition_events.10.title: "Животворний Хрест"
  relic_expedition_events.10.desc: "Посольство прибуло до [target_location.Custom('LR_GEN')] [target_location.GetName], де його з усіма почестями зустріли [ShowReligionGroupAdjective('christian')|l]і хранителі міста. Реліквію, яку вони оберігають, — частку Животворного Хреста в золотому мощовику, — пропонують нам за ціною, що личить її святості. Патріарх стиха й розлого розповідає про катастрофу під Хаттіном, про древо, втрачене в битві із Саладіном, і про меншу частку, яка вціліла завдяки франкському священнику, що сховав її під плащем. Зрештою, він не проти розлучитися з нею. Залишилося погодити умови."
  relic_expedition_events.10.a: "Сплатити всю названу ціну. Нехай кожен [ShowReligionAdjectiveWithNoTooltip('catholic')|l]ий двір почує про це надбання."
  relic_expedition_events.10.b: "Придбати її без зайвого розголосу. Запитана ціна зависока, а секретар єпископа відкритий до інших домовленостей."
  relic_expedition_events.10.c: "Відмовитися. Така ціна — святотатство; ми не торгуватимемося за Хрест."
  relic_expedition_events.10.historical_info: "Реліквія Животворного Хреста, що вважалася часткою хреста Господнього розп’яття, знайденого святою Оленою в IV столітті, була найвеличнішою святинею середньовічного католицького світу. Головну частку несли перед військом у битві біля Рогів Хаттіна в 1187 році, де її захопили війська Саладіна. Віднайти її так і не вдалося. Менші уламки, деякі вельми сумнівної автентичности, століттями оберталися в католицьких і православних скарбницях, а величні католицькі собори відкрито змагалися за право придбати їх."
  relic_expedition_events.11.title: "Терновий вінець"
  relic_expedition_events.11.desc: "Посольство прийняли в [target_country.GetGovernment.GetAdjective|l]ому палаці в [target_location.Custom('LR_PREP')] [target_location.GetName] та провели до великої каплиці реліквій. Там, за залізними ґратами та під світлом невгасимих лампад, спочиває вінець, який римські вояки поклали на чоло Христа в преторії. [target_country.GetAdjective|l]ий скарбник ладен обговорити передачу святині нам, хоча перемовини вимагатимуть і золота, і належних почестей. Подібне ставалося й раніше: свого часу [GetCountry('BYZ').GetLongName], коли скарбниця спорожніла, вже прода[GetCountry('BYZ').Custom('endlong_vlaloly')] цю саму реліквію."
  relic_expedition_events.11.a: "Сплатити відкрито, з усією поважністю, притаманною угоді між правителями. Для неї зведуть окрему каплицю."
  relic_expedition_events.11.b: "Тихо домовитися зі скарбницею. Реліквія, здобута без зайвого шуму, обійдеться дешевше."
  relic_expedition_events.11.c: "Відмовитися. Така ціна зухвала; ми не торгуватимемося за Христовий вінець."
  relic_expedition_events.11.historical_info: "Терновий вінець зберігався в імператорській релікварній каплиці Фароського маяка в Константинополі починаючи з VII століття. Після заснування Латинської імперії під час Четвертого хрестового походу в 1204 році нові латинські імператори заклали вінець венеційському банкіру й не змогли його викупити. Король Франції Луї IX сплатив позику в 1238 році й перевіз реліквію до Парижа, де звів каплицю Сент-Шапель (завершену в 1248 році) спеціально для її зберігання. Перенесення святині вважалося однією з найвизначніших подій його правління."
  relic_expedition_events.12.title: "Святий Спис"
  relic_expedition_events.12.desc: "Посольство прибуло до [target_location.Custom('LR_GEN')] [target_location.GetName], де його провели до реліквії, що зберігається в соборі [target_location.Custom('LR_GEN')]. Цей спис, який вважають зброєю сотника Лонгина, що простромила бік Христа під час розп’яття, знайшли хрестоносці під час облоги 1098 року. Капітул згоден передати його; єпископ згоден; [target_country.Custom('GetRulerOrRegentTitle')|l] також не заперечує, якщо ціна буде слушною. Вони розлого розповідають про те, як цей спис у минулому підносив бойовий дух [ShowReligionGroupAdjective('christian')|l]их оборонців [target_location.Custom('LR_GEN')]."
  relic_expedition_events.12.a: "Щедро заплатити. Спис вирушить у похід разом із нашим військом."
  relic_expedition_events.12.b: "Здобути спис, таємно підкупивши капітул і єпископських писарів."
  relic_expedition_events.12.c: "Відмовитися. [target_location.GetNameWithNoTooltip] потребує цього списа дужче за нас."
  relic_expedition_events.12.historical_info: "Святий Спис, знайдений в Антіохії під час Першого хрестового походу прованським священником П’єром Бартелемі 14 червня 1098 року, вважався хрестоносцями головною запорукою перемоги над військом Кербоги того ж місяця. Знахідка викликала суперечки ще за тих часів: інші списи-реліквії зберігалися в Константинополі, Відні, Кракові та Римі, а справжність антіохійського списа бралася під сумнів. Віденський спис, так званий Спис Долі, увійшов до імперських клейнодів Священної Римської імперії і донині зберігається в Гофбурзі."
  relic_expedition_announce_holy_lance_tt: "Кожен католицький правитель дізнається, що $relic_holy_lance_found$ знайдено"
  relic_expedition_announce_holy_shroud_tt: "Кожен католицький правитель дізнається, що $relic_holy_shroud_found$ знайдено"
  relic_expedition_announce_true_cross_tt: "Кожен католицький правитель дізнається, що $relic_true_cross_found$ знайдено"
  relic_expedition_events.10.desc_baptist_head: "Спираючись на уривок хроніки, знайдений у монастирському архіві, вчений твердить, що релікварій, шанований як голова Івана Хрестителя, було заховано під долівкою каплиці під час давньої облоги, а сама каплиця згодом завалилася просто на нього."
  relic_expedition_events.10.desc_holy_chalice: "Тут побутує власна гілка легенди про Грааль, ніяк не пов’язана зі славетними домаганнями в [ShowLocationName('genoa')] та [ShowLocationName('valencia')]. Вчений, що йде її слідом, вважає, що проста кам’яна чаша спочиває під зруйнованою під час давньої облоги каплицею, чия паства розсіялася задовго до того, як хтось замислився про розкопки."
  relic_expedition_events.10.desc_holy_lance: "Один із літописців Першого хрестового походу вважає, що знайшов, спираючись на власну оповідь [GetCharacter('koj_petrus_bartholomaeus').GetName], той самий льох, звідки в 1098 році було піднято $relic_holy_lance_found$. Він стверджує, що те, що лежало поруч, так і не було знайдено повністю. Священники-суперники свого часу називали цю думку безглуздою, але спростувати її так і не змогли."
  relic_expedition_events.10.desc_holy_nail: "Знавець реліквій вказує на напівзруйновану каплицю, де, за місцевим переказом, священник-утікач закопав цвях із Розп’яття, рятуючись від вояків, що проходили повз."
  relic_expedition_events.10.desc_holy_shroud: "Літній антиквар майже повірив у чутку, джерело якої він до пуття не може назвати: плащаниця із зображенням, замурована в склепі ченцями, які тікали від набігу, про який не згадує жодна хроніка. Він майже сліпий і хоче наостанок зробити ще одне відкриття — і сам приведе нас на це місце."
  relic_expedition_events.10.desc_holy_thorn: "Вчений простудіював приватне листування згаслого роду і простежив шлях шипа із самого тернового вінця до їхнього родового склепу, запечатаного ще з часів чуми, яка спустошила цей дім."
  relic_expedition_events.10.desc_saint_bones: "Місцевий агіограф, вивчивши старі парафіяльні книги, зупинився на безіменній могилі на краю старого цвинтаря: там спочиває маловідомий святий, чиї мощі колись сховали, аби тільки вони не дісталися ворожому війську."
  relic_expedition_events.10.desc_titulus_crucis: "Місцевий переказ стверджує, що табличка з написом із Хреста зовсім не була вивезена на захід. Вчений, який серйозно ставиться до цього переказу, вважає, що її замурували в тутешній каплиці під час останнього відступу хрестоносців, і пропонує допомогти відшукати цю стіну."
  relic_expedition_events.10.desc_true_cross: "Мандрівний вчений, прочитавши всі хроніки про битву під Хаттіном, зіставив три свідчення, які випадково майже збіглися між собою, і звузив ділянку землі, де, як кажуть, лицарі, що відступали, закопали частку $relic_true_cross_found$, аби тільки вона не дісталася Саладіну. Він пропонує свої записи, пошарпані мапи і самого себе."
  relic_expedition_events.10.desc_true_cross_fragment: "Три покоління монастирських записів, прочитані від початку до кінця, привели вченого до наспіх покинутого скиту, де, як свідчить переказ, останній самітник сховав під долівкою каплиці частку $relic_true_cross_found$, перш ніж утікати, рятуючи власне життя."
  relic_expedition_events.10.desc_virgin_milk: "Вчений, посилаючись на щоденник прочанина, який до нього ніхто не завдав собі клопоту прочитати, вказує на замуровану нішу в занедбаній святині, де хранителі, за переказом, сховали посудину з молоком Богородиці, аби тільки не віддавати її грабіжникам."
  relic_expedition_events.13.a: "Заплатити йому за його слова, але тільки раз."
  relic_expedition_events.13.b: "Нехай почет на нього натисне. Страх дешевший за срібло."
  relic_expedition_events.13.desc: "Ремесника ловлять на продажу довірливому прочанину пальця святого, вирізаного того ж ранку з баранини й підфарбованого чаєм. Коли його притискають питанням, кого ще він ошукав, він замість відповіді клянеться, що знає про щось справжнє — натрапив на це, збираючи старе дерево та ще старіше залізо для майстерні. Він назве квартал, але не вулицю, доки не побачить монету. Слово фальшивомонетника варте рівно стільки, скільки варте слово фальшивомонетника."
  relic_expedition_events.13.forger_cheated_tt: "У названому ним кварталі немає нічого, крім пліток; фальшивомонетникові двічі заплатили за ту саму брехню"
  relic_expedition_events.13.forger_honest_tt: "Цього разу монета купує щось справжнє, і слова фальшивомонетника виявляються правдою"
  relic_expedition_events.13.threats_fail_tt: "Він лише голосніше скиглить із відмовками; погрози почту не принесли нічого, крім розбитих кісточок"
  relic_expedition_events.13.threats_work_tt: "Страх розв’язує те, чого не змогло срібло, і фальшивомонетник видає щось справжнє"
  relic_expedition_events.13.title: "Майстерня фальшивомонетника"
  relic_expedition_events.14.a: "Іти напролом. Шлях не може бути далеко."
  relic_expedition_events.14.b: "Притиснути намети вантажем, розбити табір і перечекати, доки буря не вщухне."
  relic_expedition_events.14.desc: "Около полудня на обрії встає стіна охристого пилу, і за годину вона поглинає шлях. Верблюди підгинають ноги й відмовляються вставати, пісок забивається в кожну складку тканини й у кожен бурдюк із водою, а провідник зізнається, що більше не може розрізнити кам’яні піраміди, які позначають шлях. [target_leader.GetName] може рухатися далі наосліп або втратити дні, перечікуючи бурю."
  relic_expedition_events.14.title: "Піщана буря на шляху"
  relic_expedition_events.15.a: "Не шкодувати коштів на лікування хворих та їхнє відокремлення."
  relic_expedition_events.15.b: "Нехай хвороба йде своєю чередою. Лихоманка швидко згасає сама."
  relic_expedition_events.15.desc_land: "Лихоманка прийшла разом із водоносами й забирає людей по двоє-троє майже без попередження: на світанку ломить голову, опівдні починаються дрижаки, а наступного ранку — свіжа могила. Обидва лікарі загону вже не встигають допомогти всім, хто до них звертається, а здорові намагаються триматися якомога далі від хворих. [target_leader.GetName] має вирішити, скільки скарбниця витратить на те, щоб зупинити цю напасть."
  relic_expedition_events.15.desc_sea: "Лихоманка проникла на борт разом з останньою партією води, набраної в порту, і забирає людей по двоє-троє майже без попередження: на світанку ломить голову, опівдні починаються дрижаки, а наступного ранку тіло вже спускають за борт. Обидва лікарі загону в тісному трюмі вже не встигають допомогти всім, хто до них звертається, а здорові намагаються триматися від хворих так далеко, як тільки дозволяє палуба. [target_leader.GetName] має вирішити, скільки скарбниця витратить на те, щоб зупинити цю напасть."
  relic_expedition_events.15.title: "Спалах лихоманки"
  relic_expedition_events.16.a: "Сплатити мито й піти, поки він не передумав щодо ціни."
  relic_expedition_events.16.b: "Прорватися силою. Ми не для того подолали такий шлях, щоб нас грабували."
  relic_expedition_events.16.c: "Нехай говорить наша чисельність. Мало хто наважиться сперечатися з таким загоном."
  relic_expedition_events.16.desc: "Озброєні люди перегородили дорогу там, де вона спускається між двома пасмами — їх забагато й тримаються вони надто злагоджено, як для звичайних розбійників із битого шляху. Їхній ватажок виїжджає верхи перед строєм, називає ціну за безпечний прохід і ясно дає зрозуміти, що вже розрахував, у що стане інший вислід."
  relic_expedition_events.16.title: "Пустельні розбійники вимагають данину"
  relic_expedition_events.17.a: "Піднести йому ще кухоль і витягнути кожну дрібницю."
  relic_expedition_events.17.b: "Ще одна вигадка з тисячі. Вирушаємо з першим промінням сонця."
  relic_expedition_events.17.desc: "Караван прочан ділить із загоном заїзд на ніч, і розмова біля багаття, як заведено, звертає до реліквій. Один із них, син торгівця вовною родом здалеку, переповідає історію, яку непевно пам’ятає зі слів дядька, що помер двадцять років тому: ченці виносять пакунок із будівлі у вогні, ніч на прибережній дорозі й поховання, якого ніхто не мав бачити. Назви дому він назвати не може. Але напрочуд упевнений щодо дороги."
  relic_expedition_events.17.tale_confirmed_tt: "Монета розв’язує йому язика, і виривається подробиця, якою йому, мабуть, не варто було ділитися"
  relic_expedition_events.17.tale_fades_tt: "Ще одна чаша не допомагає — подробиці лише дедалі більше змазуються з кожним новим переказом"
  relic_expedition_events.17.title: "Поголос прочанина"
  relic_expedition_events.18.a: "Покрити нестачу з королівської скарбниці, та якнайшвидше."
  relic_expedition_events.18.b: "Нехай зачекають на платню ще трохи. Іти їм однаково нікуди."
  relic_expedition_events.18.desc: "Невдалий місяць з обміном грошей і лихварі, які раптом стали обережними у справах із чужинцями, залишають скарбницю виправи значно скрутнішою, ніж очікувалося. Платню почту вже затримують на два тижні, погоничі мулів вимагають плати монетою, якій довіряють, а не нашою, а поголоски про неплатоспроможний загін ширяться цими містами швидше за будь-які наші розпитування."
  relic_expedition_events.18.title: "Гроші добігають кінця"
  relic_expedition_events.19.a: "Виявити належну шану на очах у потрібних людей."
  relic_expedition_events.19.b: "Не зважати на попередження та продовжувати працю. Часу й так обмаль."
  relic_expedition_events.19.desc_christian: "Місцеві [relic_hunt_current_loc.GetOwner.GetGovernment.GetEstateName('clergy_estate')] помітили, що чужоземний загін надто вже пильно розпитує про реліквії, які вони вважають справою самої лише Церкви й нікого більше. Архідиякон приймає [target_leader.GetName] з усією ґречністю, доволі розлого розмірковує про гріх зажерливості й не залишає жодних сумнівів у тому, що його подальша прихильність вимагатиме дару на вівтар."
  relic_expedition_events.19.desc_fallback: "Поголос про розпитування виправи дійшов до вух, які ліпше було б не тривожити. Чоловік, якого ніхто не завдав собі клопоту відрекомендувати, приходить до заїзду після настання темряви, сідає без запрошення й докладно пояснює, скільки прикрощів може знайти собі чужоземний загін у такому місті, як це. Попередження лунає неквапливо, цілком ґречно й абсолютно ясно."
  relic_expedition_events.19.desc_muslim: "Місцевий #italic каді#! прочув, що чужинці ставлять незручні питання про франкські скарби й про те, які родини що приховали собі, коли впали королівства. Його писар навідується до [target_leader.GetName] із чаєм, компліментами та посланням, чия суть за ввічливими словами цілком зрозуміла: подібні розпитування йдуть значно гладше, якщо про них відомо його панові і якщо знайдеться належна пожертва на потреби мечеті."
  relic_expedition_events.19.title: "Місцева влада виявляє зацікавленість"
  relic_expedition_events.2.a: "Розпитати місцевих. Прочани та вояки балакучі, якщо заплатити [ShowGoodsNameWithNoTooltip('wine')]."
  relic_expedition_events.2.b: "Нарешті ми натрапили на слід реліквії."
  relic_expedition_events.2.c: "Найняти тут ще людей до почту. Добра охорона дешево не обходиться."
  relic_expedition_events.2.d: "Підкупити придворного чиновника, щоб отримати доступ до місцевого архіву."
  relic_expedition_events.2.desc_acre_first: "Виправа дістається [ShowLocationName('acre')], столиці хрестоносного королівства, доки мамлюки не здобули його в 1291 році. Собор сяк-так ще стоїть, там, де був дах, тепер небо, а цілі квартали так і не відбудували після плюндрування. Досі ніхто не мав причини перерити ці руїни."
  relic_expedition_events.2.desc_acre_repeat: "Знову [ShowLocationNameWithNoTooltip('acre')]. [target_leader.GetName] уже знає, якими завулками варто пройтися вдруге."
  relic_expedition_events.2.desc_antioch_first: "Виправа дістається [ShowLocationName('antioch')], престолу зниклого хрестоносного князівства та міста, де $relic_holy_lance_found$ було викопано з-під церковної долівки відчайдушного літа 1098 року. Куди подівся спис після того, як військо рушило на південь до [ShowLocationNameWithNoTooltip('jerusalem')], на Заході так ніхто й не з’ясував. І це не єдине, що це місто втратило з очей."
  relic_expedition_events.2.desc_antioch_repeat: "[target_leader.GetName] знову в [ShowLocationNameWithNoTooltip('antioch')], так само розпитує про зниклий спис і так само дістає по три відповіді на кожне питання."
  relic_expedition_events.2.desc_damascus_first: "Виправа дістається [ShowLocationName('damascus')], великої [location_scope.GetOwner.GetAdjective] столиці [ShowProvinceDefinitionName('shaam_province')] та останнього місця, де, за достовірними відомостями, перебував $relic_true_cross_found$ після Хаттіна. Чи залишилася ця реліквія тут і понині — інше питання. Місто такого розміру за століття прийняло безліч скарбів і дуже мало які повернуло назад."
  relic_expedition_events.2.desc_damascus_repeat: "Знову в [ShowLocationNameWithNoTooltip('damascus')]. [target_leader.GetName] уже дізнався, хто говорить у цьому [location_scope.GetRank.GetNameWithNoTooltip] і чого це варте."
  relic_expedition_events.2.desc_fallback: "Ще одна зупинка, ще одне коло знайомств. [target_leader.GetName] починає наново й чекає на те, за чим варто погнатися."
  relic_expedition_events.2.desc_famagusta_first: "Виправа дістається міста [ShowLocationName('famagusta')] — великого порту [location_scope.GetOwner.GetAdjective] [location_scope.GetOwner.GetFlavorRank] у [ShowProvinceDefinitionName('cyprus_province')]. Латинські родини юрмами тікали сюди після падіння [ShowLocationNameWithNoTooltip('acre')] у 1291 році, і чимало з них вивезли з материка значно більше, ніж власні титули."
  relic_expedition_events.2.desc_famagusta_repeat: "Знову в місті [ShowLocationNameWithNoTooltip('famagusta')]. При соборі Святого Миколая тепер знають [target_leader.GetName]."
  relic_expedition_events.2.desc_gaza_first: "Виправа дістається міста [ShowLocationName('gaza')] — стародавнього міста, де колись стояла залога тамплієрів, на пустельній дорозі, що веде на південь до [ShowRegionName('egypt_region')]. Орден було скасовано, а його братів розвіяло християнським світом багато поколінь тому. Не все, що вони тут зберігали, пішло разом із ними."
  relic_expedition_events.2.desc_gaza_repeat: "Знову в місті [ShowLocationNameWithNoTooltip('gaza')]. [target_leader.GetName] порозмовляв із більшістю родин, які мешкають там, де колись жили тамплієри."
  relic_expedition_events.2.desc_hebron_first: "Виправа дістається міста [ShowLocationName('hebron')] та Печери Патріархів, де, за переказами, спочивають Авраам, Ісаак та Яків — святині, шанованої і [ShowReligionGroupAdjective('israelite_group')], і [ShowReligionGroupAdjective('christian')], і [ShowReligionGroupAdjective('muslim')] вірянами. Три віри впродовж століть збагачували цю святиню та брали з неї. Щось невелике, сховане не того століття, могло пролежати тут непоміченим назавжди."
  relic_expedition_events.2.desc_hebron_repeat: "Знову в місті [ShowLocationNameWithNoTooltip('hebron')]. [target_leader.GetName] уже блукав теренами святині й знає, де не варто з’являтися."
  relic_expedition_events.2.desc_jaffa_first: "Виправа дістається міста [ShowLocationName('jaffa')], куди колись прочани прибували цілими кораблями й де, за переказами, апостол Петро воскресив удовицю Тавиту. Два століття наплив прочан ішов крізь цю гавань в обидва боки. Не все з цього плину пішло назад."
  relic_expedition_events.2.desc_jaffa_repeat: "Знову в місті [ShowLocationNameWithNoTooltip('jaffa')]. Портовий квартал уже звик до розпитувань [target_leader.GetName]."
  relic_expedition_events.2.desc_jerusalem_first: "Виправа прибула до [ShowLocationName('jerusalem')] і стоїть перед храмом Гробу Господнього. [location_scope.GetOwner.GetAdjective] залога оглядає загін і втрачає до нього цікавість. Чужинці прибувають сюди щосезону заради тієї самої гробниці й тих самих історій. Десь за цими історіями криється слід, вартий того, щоб піти ним, але знайти його — це довго, дорого і здебільшого зведеться до того, кому вірити."
  relic_expedition_events.2.desc_jerusalem_repeat: "Знову в [ShowLocationNameWithNoTooltip('jerusalem')]. Каноніки храму Гробу Господнього вже знають [target_leader.GetName], а залога більше не завдає собі клопоту поглядом."
  relic_expedition_events.2.desc_karak_first: "Виправа дістається міста [ShowLocationName('karak')] — пустельного замку, яким Рено де Шатільйон володів як сеньйор Зайордання. Рено роками грабував каравани прочан і, за переказами, ховав тут здобич на випадок облоги, яку, як він знав, влаштує Саладін. Кожна родина в місті під замком розповідає цю історію по-своєму."
  relic_expedition_events.2.desc_karak_repeat: "Знову біля мурів [ShowLocationNameWithNoTooltip('karak')]. [target_leader.GetName] уже чув легенди замку один раз, а від балакучих мешканців — двічі."
  relic_expedition_events.2.desc_nicosia_first: "Виправа досягає міста [ShowLocationName('nicosia_cyp')] — осередку влади на [ShowProvinceDefinitionName('cyprus_province')]. [location_scope.GetOwner.GetAdjective] [location_scope.GetOwner.GetGovernment.GetCourtTitle] зберігає великий архів того, що вигнана материкова знать привезла з собою, і ще більший — того, що вона згодом заставила."
  relic_expedition_events.2.desc_nicosia_repeat: "Знову в місті [ShowLocationNameWithNoTooltip('nicosia_cyp')]. [location_scope.GetOwner.GetAdjective] архіваріуси облишили питати, чому [target_leader.GetName] повертається знов і знов."
  relic_expedition_events.2.desc_rhodes_first: "Виправа прибуває на [ShowLocationName('rodos')], до володінь [location_scope.GetOwner.GetAdjective]. Тут, в ордені, падіння [ShowLocationNameWithNoTooltip('acre')] пам’ятають як частину власної історії й зберігають списки всіх командорств, залишених на материку. Жодне інше місто в цих водах не відкриє таких архівів католицькому загону."
  relic_expedition_events.2.desc_rhodes_repeat: "Знову на [ShowLocationNameWithNoTooltip('rodos')]. Архіваріуси [location_scope.GetOwner.GetAdjective] зустрічають [target_leader.GetName] як стару знайому заваду."
  relic_expedition_events.2.desc_sidon_first: "Виправа досягає міста [ShowLocationName('sidon')], ще одного міста, яке, згідно з Євангеліями, відвідував Христос, і володіння хрестоносців аж до падіння королівства. Старе франкське подвір’я відтоді заселяли наново двічі. Теперішні мешканці й гадки не мають, що зберігається в їхніх власних підвалах."
  relic_expedition_events.2.desc_sidon_repeat: "Знову в місті [ShowLocationNameWithNoTooltip('sidon')]. У [target_leader.GetName] є список франкських будинків, які варто оглянути ще раз."
  relic_expedition_events.2.desc_tripoli_first: "Виправа досягає [ShowLocationName('tripoli_syria')], хрестоносного графства аж до його падіння в 1289 році. Торгівля в гавані йде так само жваво, як і колись, але каплиця старої цитаделі вже довше, ніж будь-хто тут пам’ятає, стоїть неосвяченою, і ніхто її так і не сплюндрував."
  relic_expedition_events.2.desc_tripoli_repeat: "Знову в [ShowLocationNameWithNoTooltip('tripoli_syria')]. Портові купці вже знають [target_leader.GetName] в обличчя."
  relic_expedition_events.2.desc_tyre_first: "Виправа досягає міста [ShowLocationName('sur')] — [location_scope.GetRank.GetName], настільки стародавнього, що Євангелія згадують, як його землями проходив Христос, — одного з останніх оплотів хрестоносців на материку, утриманого до 1291 року. Його архієпископство вело записи два століття. Те, що від них уціліло, розкидане десятком приватних будинків, і жодні два власники не згодні між собою щодо того, чим саме вони володіють."
  relic_expedition_events.2.desc_tyre_repeat: "Знову в місті [ShowLocationNameWithNoTooltip('sur')]. [target_leader.GetName] уже прочитав більшу частину того, що залишило по собі старе архієпископство."
  relic_expedition_events.2.e: "Знайти вченого. Досвідчений розум ліпше розуміється на чутках."
  relic_expedition_events.2.f: "Піти багатонадійним слідом у бік [relic_hunt_new_lead.GetNameWithNoTooltip]."
  relic_expedition_events.2.g: "Припинити пошуки й повернути назад."
  relic_expedition_events.2.title: "Прибуття"
  relic_expedition_events.3.a: "Продовжувати розпитування. Хтось тут знає більше, ніж каже."
  relic_expedition_events.3.b: "Нарешті сам слід. Ми знайшли його."
  relic_expedition_events.3.c: "Найняти більше почоту, поки ми тут."
  relic_expedition_events.3.d: "Підкупити ще одного чиновника. У цьому місті записи ведуться ліпше."
  relic_expedition_events.3.desc_acre: "Простукувалися порожні стіни, переверталася завалена кладка там, де ніхто не тривожив її поколіннями. [ShowLocationNameWithNoTooltip('acre')] — значний [relic_hunt_loc.GetRank.GetName], де майже не лишилося жителів, а один загін здатен обстежити лише малу його частину."
  relic_expedition_events.3.desc_antioch: "[target_leader.GetName] простежує межу зниклих стін, звіряючи те, що ще стоїть, із розповідями прочан про місце, де було знайдено Спис. Оповіді суперечать одна одній, і жодна з них не сходиться з тим, що видно на власні очі."
  relic_expedition_events.3.desc_damascus: "Квартал за кварталом, базар за базаром, [target_leader.GetName] налагоджує зв’язки серед купців та лихварів. Чутки розходяться таким великим містом повільно, але все ж розходяться — і доходять уже з визначеною ціною."
  relic_expedition_events.3.desc_fallback: "[target_leader.GetName] продовжує пошуки, перевіряючи кожну дрібну зачіпку по черзі, перш ніж залишити її."
  relic_expedition_events.3.desc_famagusta: "Скриня за скринею крізь домашні скарби вигнаних материкових родин у [ShowLocationNameWithNoTooltip('famagusta')], переписуючи те, що було вивезено з [ShowLocationNameWithNoTooltip('acre')], і те, про що відтоді тихо забули."
  relic_expedition_events.3.desc_gaza: "[target_leader.GetName] не відступає від володінь скасованого ордену в [ShowLocationNameWithNoTooltip('gaza')], допитуючись у сусідів, які комори тамплієри тримали замкненими і хто забрав ключі після них."
  relic_expedition_events.3.desc_hebron: "Святиня оглядається поволі, приділ за приділом, з якнайбільшою обережністю, щоб не образити жодну з трьох вір, що її бережуть. [target_leader.GetName] позначає кожен замкнений прохід, але вголос не питає про жоден із них."
  relic_expedition_events.3.desc_jaffa: "[target_leader.GetName] проводить дні у гавані [ShowLocationNameWithNoTooltip('jaffa')], купуючи випивку для вантажників і човнярів та розпитуючи, які склади приймали вантажі прочан до того, як пішли франки."
  relic_expedition_events.3.desc_jerusalem: "[target_leader.GetName] повертається до Гробу Господнього ще до світанку, випереджаючи юрми прочан. Тут є ще одна крипта, яку треба оглянути при свічці, ще один стертий напис, який треба списати, ще один канонік, готовий поговорити за належну винагороду."
  relic_expedition_events.3.desc_karak: "З ліхтарем у руці [target_leader.GetName] обходить підвали та цистерни [ShowLocationNameWithNoTooltip('karak')], звіряючи скарбницю Рено де Шатільйона, як її змальовують оповідачі, з тим, що насправді підтверджують стіни."
  relic_expedition_events.3.desc_nicosia: "[target_leader.GetName] досліджує архів [relic_hunt_loc.GetOwner.GetAdjective] [relic_hunt_loc.GetOwner.GetGovernment.GetCourtTitle] у [ShowLocationNameWithNoTooltip('nicosia_cyp')], звіряючи описи зі спадковими реєстрами в пошуках реліквії, про яку ніхто й не здогадався спитати."
  relic_expedition_events.3.desc_rhodes: "[target_leader.GetName] допитується в [relic_hunt_loc.GetOwner.GetAdjective] архіваріусів на [ShowLocationNameWithNoTooltip('rodos')] щодо книг, які ті так і не надали, і звіряє їхні списки з тим, що, за словами старших братів, було вивезено з [ShowLocationNameWithNoTooltip('acre')]."
  relic_expedition_events.3.desc_sidon: "Будинок за будинком у наново заселеному франкському кварталі [target_leader.GetName] стукає у двері, розпитуючи про льохи й горища, які ніхто не відчиняв відколи пішли останні християнські мешканці."
  relic_expedition_events.3.desc_tripoli: "Каплицю цитаделі розбирають плита за плитою, тиньк збивають скрізь, де стіна відлунює підозріло. Сама лише каплиця — праця на кілька тижнів."
  relic_expedition_events.3.desc_tyre: "[target_leader.GetName] перебирає те, що вціліло від архієпископських записів [ShowLocationNameWithNoTooltip('sur')], розкладаючи поплямовані водою книги поруч із напівстертими грамотами та розшукуючи запис, що не збігається з рештою."
  relic_expedition_events.3.e: "Звернутися до місцевого вченого, перш ніж вирушати далі."
  relic_expedition_events.3.f: "Свіжа зачіпка вказує в інший бік. Вирушити за нею до [relic_hunt_new_lead.GetNameWithNoTooltip]."
  relic_expedition_events.3.g: "Припинити пошуки й повернути назад."
  relic_expedition_events.3.title: "Пошуки тривають"
  relic_expedition_events.4.b: "Досить. Відкликати виправу."
  relic_expedition_events.4.desc: "Усі нитки, за які хапався [target_leader.GetName], привели в нікуди. Тлумачі вже обійшли всі корчми, підкупленим чиновникам більше нема чого продати, а калитка з кожним тижнем, доки загін сидить без діла на чужині, стає дедалі легшою. До столиці йде звістка: платити за подальші пошуки чи припинити їх зовсім."
  relic_expedition_events.4.title: "Слід охолов"
  relic_expedition_events.5.a: "Без них місія не може тривати."
  relic_expedition_events.5.title: "Охорону втрачено"
  relic_expedition_events.6.a: "Поторгуватися. Ціна висока, але домовитися можна."
  relic_expedition_events.6.b: "Заплатити, скільки просять. Деякі речі варті своєї ціни."
  relic_expedition_events.6.c: "Нехай за нас промовляє чисельність нашого почту."
  relic_expedition_events.6.desc_baptist_head: "Церква в цьому краї вшановує те, що називає главою Івана Хрестителя. Поголос про це ніколи не виходив далеко за межі парафії, і духовенство готове обговорити передачу реліквії."
  relic_expedition_events.6.desc_holy_chalice: "Купець одразу каже, що не очікує віри на слово, але все ж пропонує просту кам’яну чашу, яку називає істинною чашею Таємної вечері, що б там не стверджували знаніші власники подібних реліквій деінде. Ціну він править немалу."
  relic_expedition_events.6.desc_holy_lance: "Родина загиблого вояка береже наконечник списа з часів служби прадіда і запевняє, що це $relic_holy_lance_found$, той самий, що був знайдений у 1098 році. Гроші їм потрібніші."
  relic_expedition_events.6.desc_holy_nail: "Вдова коваля дістає почорнілий від часу залізний цвях. Родина її чоловіка завжди клялася, що це один із цвяхів розп’яття. Вона готова його продати."
  relic_expedition_events.6.desc_holy_shroud: "Купець розгортає лляне полотно з ледь помітним зображенням розіп’ятого чоловіка. Він не може пояснити, де воно перебувало всі ці століття, але в будь-якому разі править за нього величезну суму."
  relic_expedition_events.6.desc_holy_thorn: "Один незнатний шляхетський рід володіє єдиним шипом у скромному релікварії, що дістався, за їхніми словами, їхньому пращуру із самого тернового вінця. Вони воліли б, аби продаж залишився непоміченим."
  relic_expedition_events.6.desc_saint_bones: "Парафіяльний священник пропонує невеличку скриньку з кістками, на якій вицвілою латиною виведене ім’я святого. Плату він назве пожертвою для церкви."
  relic_expedition_events.6.desc_titulus_crucis: "Місцевий переказ оповідає, що коли дерево Хреста вирушило на захід, табличка з написом, що була прибита над ним, лишилася тут і була схована. Одна тутешня родина стверджує, ніби саме така табличка дісталася їм у спадок, і готова її продати."
  relic_expedition_events.6.desc_true_cross: "Купець у місті, обережно озираючись, чи не підслуховує хтось, каже, що володіє уламком самого $relic_true_cross_found$ — тієї деревини, що була втрачена під Хаттіном, — який дістався йому через руки, що їх він відмовляється називати. Ціну, втім, він назве."
  relic_expedition_events.6.desc_true_cross_fragment: "Бідний, напівзабутий монастир береже скалку дерева у простому ковчезі, позначену лишень як часточка $relic_true_cross_found$. Абат тихцем розлучиться з нею, якщо виручені гроші допоможуть зберегти дах над головою."
  relic_expedition_events.6.desc_virgin_milk: "У невеличкій каплиці зберігається запечатана посудина з білим крейдяним осадком, який поколіннями шанують як молоко Пресвятої Діви Марії. Доглядач готовий продати її разом зі срібним ковчегом."
  relic_expedition_events.6.title: "Готовий продавець"
  relic_expedition_events.7.a: "Заплатити й відвезти реліквію додому."
  relic_expedition_events.7.b: "Щось тут не так. Піти геть."
  relic_expedition_events.7.desc: "Умови узгоджено, релікварій загорнуто в тканину. Залишилося лиш вирішити, наскільки [target_leader.GetName] вірить розповіді продавця."
  relic_expedition_events.7.title: "Скріплюючи угоду"
  relic_expedition_events.8.a: "Обережність вартує грошей."
  relic_expedition_events.8.b: "Обійдемося без нього. Що менше платимо, то менше патякають."
  relic_expedition_events.8.c: "Спільники ні до чого. Наш почет просто забере це сам."
  relic_expedition_events.8.d: "Гроші ні до чого. [target_leader.GetHerHis|U] власна чарівність забезпечить їхню допомогу."
  relic_expedition_events.8.desc_baptist_head: "Молодший канонік, якого надто часто обходили підвищенням, пропонує провести нас до раки, яку старше духовенство шанує як голову Івана Хрестителя."
  relic_expedition_events.8.desc_holy_chalice: "Ризничий катедрального собору не плекає добрих почуттів до капітулу, якому служив довгі роки, і пропонує допомогти нам винести просту кам’яну чашу, яку потай називають істинною чашею Таємної вечері."
  relic_expedition_events.8.desc_holy_lance: "Залоговий вояк, якому заборгували платню за цілий рік, прохоплюється, що в зброярні зберігається старий наконечник списа, якого ніхто не заносив до опису на пам’яті живих. Старі люди й досі звуть його $relic_holy_lance_found$. Він може провести нас усередину."
  relic_expedition_events.8.desc_holy_nail: "Загрузлий у боргах писар скарбниці зізнається, що старий залізний цвях, шанований як один із цвяхів Розп’яття, лежить без опису в бічному сховищі. Ключ від нього є лише в нього самого."
  relic_expedition_events.8.desc_holy_shroud: "Брамник монастиря, що нещодавно посварився з настоятелем, каже, що братія береже складене полотно з відбитим на ньому образом, доступне лише старшим братам. Він залишить одні з дверей незамкненими."
  relic_expedition_events.8.desc_holy_thorn: "Управитель, якого колись звільнили й поновили з милости, достеменно знає, де родина береже релікварій з єдиним шипом із Тернового вінця."
  relic_expedition_events.8.desc_saint_bones: "Гробокопач, якому все життя недоплачували, знає, де парафія береже ковчег із кістками святого, і о котрій годині ризничий лягає подрімати пополудні."
  relic_expedition_events.8.desc_titulus_crucis: "Родина, що дбайливо береже стару, напівзабуту легенду, пропонує дещо інше: допомогти їм повернути те, що вони вважають справжньою табличкою з Хреста, у родича, який відмовляється їм її продати."
  relic_expedition_events.8.desc_true_cross: "Слуга в домі одного місцевого шляхтича, чимось роздратований, про що воліє не розповідати, згадує, що його пан береже загорнутий уламок темного дерева, який називає $relic_true_cross_found$, ніяк не вирізняючи його серед решти своїх скарбів. За плату слуга допоможе нам його забрати."
  relic_expedition_events.8.desc_true_cross_fragment: "Невдоволений своїм покликанням послушник пропонує залишити відчиненою віконницю каплиці, де його обитель береже свою часточку $relic_true_cross_found$."
  relic_expedition_events.8.desc_virgin_milk: "Доглядач святині, який роками потай кипів від обурення через злиденну платню, залишить ковчег із реліквією незамкненим у обрану ним ніч."
  relic_expedition_events.8.title: "Послужливий спільник"
  relic_expedition_events.9.a: "Справу зроблено. Реліквія тепер наша, і ніхто нічого не помітив."
  relic_expedition_events.9.b: "Хтось прокинувся. Крики, тупіт ніг. Відступаємо!"
  relic_expedition_events.9.desc: "Поки що все йде за планом. Той, хто мав стояти на варті, спить, або його нема на місці, або йому заплатили, щоб він дивився в інший бік, а двері, які обіцяв відчинити спільник, стоять без засува. [target_leader.GetName] чекає в темряві на крик, який означав би протилежне."
  relic_expedition_events.9.title: "Крадіжка"
  relic_expedition_events.clues_down_1_tt: "Слід холоне (#R -1#! Докази)"
  relic_expedition_events.clues_up_1_tt: "Слід теплішає (#G +1#! докази)"
  relic_expedition_events.retinue_down_10_tt: "Почет виправи рідшає (#R -10#! до почту)"
  relic_expedition_events.retinue_down_15_tt: "Почет виправи рідшає (#R -15#! до почту)"
  relic_expedition_events.retinue_down_25_tt: "Почет виправи рідшає (#R -25#! Почет)"
  relic_expedition_events.retinue_down_5_tt: "Почет виправи рідшає (#R -5#! Почет)"
  relic_expedition_events.retinue_down_8_tt: "Почет виправи рідшає (#R -8#! Почет)"
  relic_expedition_events.retinue_up_10_tt: "Почет виправи поповнюється (#G +10#! почет)"
  relic_expedition_events.5.desc: "Від супроводу, який мав [target_leader.GetName], не лишилося нікого: люди гинули по двоє й по троє від рук розбійників, від гарячки або нишком тікали, бо їм платили надто мало за пошуки без кінця і краю. Ніхто не змусить сеньйора чи абата віддати реліквію, з якою той не бажає розлучатися, якщо за проханням не стоять озброєні вояки.\n\nПошуки добігли кінця."