l_russian:
  relic_expedition_events.1.title: "Пошуки реліквії"
  relic_expedition_events.1.desc: "Єпископи піднесли благання, і [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')|l] дає згоду на їхнє прохання. Купець, що повернувся з Леванту, тлумачить про цю справу так: дамаський торговець переказував батькові слова, ніби в пору, коли гинули князівства хрестоносців, добру частку церковного добра франки встигли винести й заховати в землі, щоби врятувати від вогню. А що закопано, те можна й викопати. Та й викупити теж не гріх — якщо вийти на потрібних людей у слушний час і не торгуватися там, де стіни мають вуха.\n\nЯка то була святиня і де захована — про те невідомо. Схожі байки ширяться кожною гаванню того узбережжя. Проте ця звістка дійшла до вух тих, хто розуміє її справжній зміст."
  relic_expedition_events.1.a: "Спорядимо цілу процесію: дамо дари, тлумача, ченця і золота досхочу."
  relic_expedition_events.1.b: "Потрібна вірна людина і трохи золота. Ліпше не привертати зайвої уваги."
  relic_expedition_events.1.historical_info: "Животворний Хрест винесли на поле битви на Рогах Хаттіна в липні 1187 року, де його захопило військо Саладіна. Річард Левове Серце, візантійський імператор і цариця Грузії намагалися викупити його, проте марно. Останнє достеменне свідчення вказує на те, що хрест перебував у Дамаску, після чого слід святині остаточно губиться. Спис Господній, знайдений в Антіохії в 1098 році, зник так само непомітно, щойно Перший хрестовий похід рушив далі. Доля цих реліквій досі невідома, і саме тому їхні пошуки все ще тривають."
  relic_expedition_events.2.title: "Прибуття"
  relic_expedition_events.2.desc_jerusalem_first: "Шлях привів виправу до #TOOLTIP:LOCATION,jerusalem,X #L Єрусалима#!#! — просто до брами храму Гробу Господнього. #L [location_scope.GetOwner.GetAdjective|l]а#! варта мигцем оглядає прибулих і тут же відвертається. Чужинці прибувають сюди кожного сезону заради однієї й тієї самої гробниці та тих самих оповідок. Десь за цими оповідками криється слід, яким варто піти, але його пошуки будуть тривалими й коштовними, і багато в чому все зведеться до того, щоби вирішити, кому саме вірити."
  relic_expedition_events.2.desc_jerusalem_repeat: "[target_leader.GetName] знову в місті [ShowLocationNameWithNoTooltip('jerusalem')]. Місцеві каноніки вже за версту нас упізнають, а залогова варта й геть перестала підводити голови, коли бачить наш загін."
  relic_expedition_events.2.desc_acre_first: "Виправа прибуває до міста [ShowLocationName('acre')], столиці Єрусалимського королівства, що впала під натиском мамлюків у 1291 році. Собор усе ще стоїть — якщо можна так висловитися, адже замість даху над ним тепер зяє небо, а цілі квартали так і не відбудовані наново після пограбування. Ні в кого досі просто не було причини нишпорити в цих руїнах."
  relic_expedition_events.2.desc_acre_repeat: "І знову [ShowLocationNameWithNoTooltip('acre')]. [target_leader.GetName] уже знає, якими вуличками варто прогулятися ще раз."
  relic_expedition_events.2.desc_antioch_first: "Виправа прибуває до міста [ShowLocationName('antioch')], столиці князівства хрестоносців, що пішло в небуття. Саме тут відчайдушного літа 1098 року з-під підлоги церкви дістали $relic_holy_lance_found$. На Заході так і не дійшли згоди щодо того, куди зник спис після того, як військо рушило на південь, до міста [ShowLocationNameWithNoTooltip('jerusalem')]. І це далеко не єдине, що безслідно зникло в цих краях."
  relic_expedition_events.2.desc_antioch_repeat: "[target_leader.GetName] знову в місті [ShowLocationNameWithNoTooltip('antioch')] у пошуках списа і так само на кожне запитання отримує три різні відповіді."
  relic_expedition_events.2.desc_damascus_first: "Виправа прибуває до міста [ShowLocationName('damascus')] — великої #L [location_scope.GetOwner.GetAdjective|l]ої#! столиці регіону [ShowProvinceDefinitionName('shaam_province')] й останнього місця, де, за достеменними відомостями, бачили $relic_true_cross_found$ після розгрому біля Хаттіна. Чи перебуває ця святиня тут і досі — зовсім інше питання. За довгі століття таке величне місто ввібрало в себе безліч скарбів, але неохоче ділилося своїм добром із чужинцями."
  relic_expedition_events.2.desc_damascus_repeat: "Нас знову зустрічає [ShowLocationNameWithNoTooltip('damascus')]. [target_leader.GetName] тепер знає, хто задає тон [location_scope.GetRank.Custom('end_predlog_vvo')] [location_scope.GetRank.Custom('LR_PREP')|l], і якою ціною це дається."
  relic_expedition_events.2.desc_tripoli_first: "Виправа прибуває до #TOOLTIP:LOCATION,tripoli_syria,X #L Триполі#!#! — столиці графства хрестоносців, що впало в 1289 році. У порту вирує жвава торгівля, а от каплиця в глибині старовинної цитаделі вже кілька поколінь припадає пилом. Її давно не освячували, проте оздоба й досі на місці."
  relic_expedition_events.2.desc_tripoli_repeat: "Ми знову в Триполі. [target_leader.GetName] звично вітається зі знайомими купцями в порту."
  relic_expedition_events.2.desc_tyre_first: "Виправа дісталася #TOOLTIP:LOCATION,sur,X #L Тира#!#! — міста настільки стародавнього, що про його відвідання Христом згадується в Євангеліях. Місцева твердиня до 1291 року залишалася одним із останніх оплотів хрестоносців, а літописці архієпископства протягом двох століть вели детальні хроніки #L #TOOLTIP:LOCATIONRANK,[location_scope.GetRank.Custom('LR_tt')],X [location_scope.GetRank.Custom('LR_GEN')|l]#!#!. Уцілілі уривки їхніх записів усе ще зберігаються в приватних руках, проте ніхто з приблизно десятка власників не знає повного змісту літописів."
  relic_expedition_events.2.desc_tyre_repeat: "Ми повертаємося до Тира. [target_leader.GetName] вже [Select_CString(target_ruler.IsFemale, 'вивчила', 'вивчив')] більшу частину записів, що лишилися від старовинного архієпископства."
  relic_expedition_events.2.desc_jaffa_first: "Виправа прибула до #TOOLTIP:LOCATION,jaffa,X #L Яффи#!#! — гавані, де за старих часів приставали незліченні кораблі прочан. Вважається, що саме там апостол Петро воскресив із мертвих вдову на ім’я Тавифа. Протягом двох століть крізь Яффу йшов безупинний потік прочан, і дехто з них так і лишився на Святій Землі."
  relic_expedition_events.2.desc_jaffa_repeat: "Ми повернулися до Яффи. Мешканці портового кварталу вже знають, які питання ставитиме [target_leader.GetName]."
  relic_expedition_events.2.desc_hebron_first: "Виправа досягла #TOOLTIP:LOCATION,hebron,X #L Хеврона#!#! з його Печерою патріархів — місцем спочинку Авраама, Ісаака та Якова, однаково священним для #TOOLTIP:RELIGIONGROUP,israelite_group,X #L юдеїв#!#!, #TOOLTIP:RELIGIONGROUP,christian,X #L християн#!#! та #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульман#!#!. Послідовники трьох віросповідань століттями несли до цієї святині свої дари. Якась невеличка річ, залишена тут на збереження в лихі роки, могла легко загубитися без сліду…"
  relic_expedition_events.2.desc_hebron_repeat: "Ми повернулися до Хеврона. [target_leader.GetName] вже [Select_CString(target_ruler.IsFemale, 'бувала', 'бував')] у межах святині й знає, як оминути її [Select_CString(target_ruler.IsFemale, 'непоміченою', 'непоміченим')]."
  relic_expedition_events.2.desc_sidon_first: "Виправа досягла #TOOLTIP:LOCATION,sidon,X #L Сидона#!#!, ще одного міста, де бував Христос. До падіння королівств хрестоносців місто було осередком великого феодального володіння. Відтоді старий франкський квартал двічі заселяли нові мешканці, і нинішній люд гадки не має, що може зберігатися в їхніх власних підвалах…"
  relic_expedition_events.2.desc_sidon_repeat: "Ми знову в Сидоні. [target_leader.GetName] [Select_CString(target_ruler.IsFemale, 'склала', 'склав')] перелік франкських будинків, куди варто навідатися знову."
  relic_expedition_events.2.desc_karak_first: "Виправа прибула до #TOOLTIP:LOCATION,karak,X #L Карака#!#!, могутньої фортеці посеред пустелі, якою володів Рено де Шатільйон, коли був синьйором Зайордання. Рено роками грабував каравани прочан, а здобич, за чутками, ховав саме тут, готуючись до неминучої розплати з боку Саладіна. Проте в кожному домі цю історію розповідають по-своєму…"
  relic_expedition_events.2.desc_karak_repeat: "Ми повертаємося до Карака. [target_leader.GetName] вже [Select_CString(target_ruler.IsFemale, 'чула', 'чув')] перекази про замок, а деякі й не по одному разу."
  relic_expedition_events.2.desc_gaza_first: "Виправа дісталася #TOOLTIP:LOCATION,gaza,X #L Гази#!#!, стародавнього міста на шляху до #TOOLTIP:REGION,egypt_region,X #L Єгипту#!#!. Колись його боронила залога тамплієрів, але після розгрому ордену вцілілі брати розпорошилися по всьому християнському світу. Залишаючи Газу, вони могли забрати з собою не все…"
  relic_expedition_events.2.desc_gaza_repeat: "Ми знову в Газі. [target_leader.GetName] уже [Select_CString(target_ruler.IsFemale, 'поговорила', 'поговорив')] із більшістю мешканців колишньої обителі тамплієрів."
  relic_expedition_events.2.desc_famagusta_first: "Виправа дісталася #TOOLTIP:LOCATION,famagusta,X #L Фамагусти#!#!, великого #L [location_scope.GetOwner.GetAdjective|l]ого#! порту у [location_scope.GetOwner.Custom('rank_ua_PREP')|l] #TOOLTIP:PROVINCE_DEFINITION,cyprus_province,X #L Кіпр#!#!. Після падіння Акри у 1291 році сюди втекло багато родин латинян, і чимало з них привезли з собою не лише титули…"
  relic_expedition_events.2.desc_famagusta_repeat: "Ми знову у Фамагусті. [target_leader.GetName] вирішує відвідати собор Святого Миколая."
  relic_expedition_events.2.desc_nicosia_first: "Виправа прибула до #TOOLTIP:LOCATION,nicosia_cyp,X #L Нікосії#!#!, найбільшого міста #TOOLTIP:PROVINCE_DEFINITION,cyprus_province,X #L Кіпру#!#!. При #L [location_scope.GetOwner.GetAdjective|l]ому#! дворі зберігаються докладні переписи майна, яке привезли з собою вигнанці зі Святої Землі — і ще довші списки того, що вони згодом віддали в заставу…"
  relic_expedition_events.2.desc_nicosia_repeat: "Ми повертаємося до Нікосії. #L [location_scope.GetOwner.GetAdjective]і#! архіваріуси й далі сушать собі голову, коли ж [target_leader.GetName] дасть їм спокій."
  relic_expedition_events.2.desc_rhodes_first: "Виправа прибула до #L [location_scope.GetOwner.GetAdjective|l]ого#! володіння #TOOLTIP:LOCATION,rodos,X #L Родос#!#!. Орден усе ще пам’ятає падіння Акри, адже це частина його власної історії. Лицарі й досі бережуть список командорств у Святій Землі, якими їм довелося поступитися ворогу. Жодне інше місто в цій частині світу не допустить дослідників-католиків до таких архівів."
  relic_expedition_events.2.desc_rhodes_repeat: "Ми повертаємося до Родосу. #L [location_scope.GetOwner.GetAdjective]і#! архіваріуси зітхають, розуміючи, що [target_leader.GetName] від них так просто не відступиться."
  relic_expedition_events.2.desc_fallback: "Чергова зупинка в дорозі, чергові формальні знайомства. [target_leader.GetName] і далі шукає будь-які зачіпки."
  relic_expedition_events.2.a: "Треба розпитати місцевих. Вино легко розв’язує язики воякам і паломникам."
  relic_expedition_events.2.b: "Ми врешті-решт натрапили на слід священної реліквії."
  relic_expedition_events.2.c: "Треба найняти більше людей до почту. Надійні охоронці коштують недешево."
  relic_expedition_events.2.d: "За хабар придворні чиновники допустять нас до місцевих архівів."
  relic_expedition_events.2.e: "Пошукаємо вчених людей. Мислячий розум швидше відрізняє правду від вигадок."
  relic_expedition_events.2.f: "Ми знайшли обнадійливі відомості. [relic_hunt_new_lead.GetNameWithNoTooltip] — ось куди веде наш шлях."
  relic_expedition_events.2.g: "Пошуки скасовуються. Час повертатися додому."
  relic_expedition_events.3.title: "Пошуки тривають"
  relic_expedition_events.3.desc_jerusalem: "[target_leader.GetName] повертається до Храму Гроба Господнього до світанку, кваплячись випередити натовпи паломників. На [Select_CString(target_leader.IsFemale, 'неї', 'нього')] чекає ще один склеп, який слід оглянути при світлі свічок, ще один напівстертий напис, який треба переписати, ще один священнослужитель, готовий поділитися таємницями за винагороду."
  relic_expedition_events.3.desc_acre: "[target_leader.GetName] простукує стіни в пошуках порожнин, розкопує обвалену кладку, яку не чіпали впродовж поколінь. Акра — велике місто, а жителів там лишилося зовсім небагато. Одному пошуковому загону не вистачить і всього життя, щоб обшукати #L #TOOLTIP:COUNTRY_RANK,[relic_hunt_loc.GetRank.Custom('CF_tt')],X [relic_hunt_loc.GetRank.Custom('rank_ua_ACC')|l]#!#! повністю."
  relic_expedition_events.3.desc_antioch: "[target_leader.GetName] оглядає сліди, що лишилися від зруйнованих стін, звіряючи лінії на землі з розповідями паломників. Оповіді про те, де знайшли списа, різняться між собою — і жодна з них не сходиться з навколишньою місцевістю."
  relic_expedition_events.3.desc_damascus: "[target_leader.GetName] обходить базар за базаром, налагоджуючи зв’язки з купцями та міняйлами. У такому великому місті чутки розходяться повільно, але все ж розходяться — і вони завжди мають ціну."
  relic_expedition_events.3.desc_tripoli: "Церкву при цитаделі розбирають камінь за каменем. Якщо стіна озивається підозрілим звуком, з неї негайно збивають тиньк. На розбирання однієї лише каплиці підуть місяці праці."
  relic_expedition_events.3.desc_tyre: "[target_leader.GetName] розбирає вцілілі документи архієпископства Тира, розклавши перед собою зіпсовані водою облікові книги й ледь розбірливі розписки в пошуках записів, що вирізняються із загальної маси."
  relic_expedition_events.3.desc_jaffa: "[target_leader.GetName] цілими днями пропадає в гавані Яффи, частуючи випивкою вантажників і моряків. [Select_CString(target_leader.IsFemale, 'Вона', 'Він')] сподівається дізнатися, на яких складах зберігалися вантажі паломників до виходу франків."
  relic_expedition_events.3.desc_hebron: "[target_leader.GetName] повільно й з превеликою обережністю оглядає святилище, намагаючись не накликати на себе гнів жодної з трьох вір, які його вшановують. [Select_CString(target_leader.IsFemale, 'Вона', 'Він')] позначає всі запечатані проходи, але прагне зайвий раз про них не згадувати."
  relic_expedition_events.3.desc_sidon: "[target_leader.GetName] обходить старе франкське подвір’я будинок за будинком. [Select_CString(target_leader.IsFemale, 'Вона', 'Він')] стукає в кожні двері й розпитує нових мешканців про підвали й горища, що стоять замкненими з часів виходу з міста останніх християн."
  relic_expedition_events.3.desc_karak: "З ліхтарем у руці [target_leader.GetName] обходить підземні склепіння та резервуари Карака, подумки зіставляючи описи скарбниці Рено де Шатільйона зі справжнім розташуванням стін фортеці."
  relic_expedition_events.3.desc_gaza: "[target_leader.GetName] продовжує шукати власність розгромленого ордену по всій Газі. [Select_CString(target_leader.IsFemale, 'Вона', 'Він')] розпитує сусідів, які комори тамплієри стерегли особливо пильно і до кого могли потрапити ключі від них."
  relic_expedition_events.3.desc_famagusta: "[target_leader.GetName] оглядає майно вигнаних зі Святої Землі родин скриня за скринею, складаючи ретельний опис усього, що було вивезено з Акри до Фамагусти — і відтоді припадало пилом у куфрах."
  relic_expedition_events.3.desc_nicosia: "[target_leader.GetName] читає архіви #L [relic_hunt_loc.GetOwner.GetAdjective|l]ого#! двору в Нікосії, порівнюючи описи майна зі спадковими реєстрами в пошуках реліквії, про місце схову якої ніхто так і не здогадався поцікавитися."
  relic_expedition_events.3.desc_rhodes: "[target_leader.GetName] не відстає від #L [relic_hunt_loc.GetOwner.GetAdjective|l]их#! архіваріусів на Родосі, вимагаючи видати книги, які вони вирішили приберегти. [Select_CString(target_leader.IsFemale, 'Вона', 'Він')] хоче зіставити їхні списки з тим, що, за словами старих братів ордену, вивезли з Акри."
  relic_expedition_events.3.desc_fallback: "[target_leader.GetName] не припиняє пошуків, хапаючись бодай за найменшу зачіпку та розглядаючи її з усіх боків."
  relic_expedition_events.3.a: "Треба розпитувати далі. Хтось тут напевне знає більше, ніж каже."
  relic_expedition_events.3.b: "Нарешті ми вийшли на слід!"
  relic_expedition_events.3.c: "Наймімо більше людей до почту, поки ми тут."
  relic_expedition_events.3.d: "Підкупімо іншого чиновника. У цьому місті є ще чимало архівів."
  relic_expedition_events.3.e: "Треба порадитися з місцевим ученим."
  relic_expedition_events.3.f: "Отримані відомості вказують на нове місце пошуків. Це [relic_hunt_new_lead.GetNameWithNoTooltip]."
  relic_expedition_events.3.g: "Пошуки скасовуються. Час повертатися додому."
  relic_expedition_events.4.title: "Слід охолов"
  relic_expedition_events.4.desc: "Усі сліди, які [Select_CString(target_leader.IsFemale, 'шукала', 'шукав')] [target_leader.GetName], так ні до чого й не привели. Тлумачі порозбігалися з шинків, підкупленим чиновникам більше нема чого продавати, а тим часом гаманець порожніє з кожним змарнованим на чужині днем. До столиці летить послання — потрібно більше грошей на пошуки, або ж доведеться припинити їх зовсім."
  relic_expedition_events.4.a: "Надішлемо кошти на розвиток."
  relic_expedition_events.4.b: "Усе, годі. Пошуки припиняються."
  relic_expedition_events.5.title: "Супровід утрачено"
  relic_expedition_events.5.desc: "[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'втратила', 'втратив')] усіх супутників. Хтось поліг у сутичці з розбійниками, інших звела лихоманка, а решта просто розбіглася, втомившись від нескінченних пошуків за надто скромну винагороду.\n\nБез підтримки озброєних супутників годі й переконати володаря чи настоятеля розлучитися з безцінною реліквією. Пошуки доведеться згорнути."
  relic_expedition_events.5.a: "Без гідного почту завдання стане нездійсненним."
  relic_expedition_events.6.title: "Реліквія на продаж"
  relic_expedition_events.6.desc_true_cross: "Переконавшись, що ніхто не підслуховує, один міський купець заявляє, що до його рук потрапила частка Істинного хреста, втрачена після розгрому під Хаттіном. Він відмовляється розголошувати, звідки в нього реліквія, але готовий назвати ціну."
  relic_expedition_events.6.desc_holy_lance: "Нащадки давно померлого вояка стверджують, що вістря списа, яке зберігалося в їхній родині з прадідових часів, — той самий Священний спис, знайдений у 1098 році. Гроші приваблюють їх більше за реліквію."
  relic_expedition_events.6.desc_holy_shroud: "Купець розгортає лляне полотно, на якому ледь проступає образ розп’ятого чоловіка. Він не знає, звідки воно взялося й де перебувало весь цей час, але бажає отримати за нього чималу суму."
  relic_expedition_events.6.desc_holy_nail: "Удова коваля викладає почорнілий від часу залізний цвях. Родина її покійного чоловіка завжди стверджувала, що це один із цвяхів, якими було розп’ято Спасителя. І вона готова його продати."
  relic_expedition_events.6.desc_true_cross_fragment: "У бідному, забутому всіма монастирі зберігається дерев’яна тріска, вміщена в простий релікварій. На кришці зазначено, що це частка Істинного хреста. Настоятель готовий розлучитися з реліквією, якщо отримані гроші дадуть йому змогу зберегти дах над головою."
  relic_expedition_events.6.desc_saint_bones: "Парафіяльний священник виносить маленьку скриньку з кістками. Вицвілий напис латиною свідчить, що це мощі святого. Священник називає суму, оголосивши її «пожертвою церкві»."
  relic_expedition_events.6.desc_baptist_head: "В одній з місцевих церков шанують стародавній череп, який, як вважають, належав Івану Хрестителю. За межами парафії про це майже ніхто не знає, і священники готові обговорити передачу реліквії."
  relic_expedition_events.6.desc_virgin_milk: "У невеликій каплиці зберігається запечатаний флакон із білим, схожим на крейду осадом, який ось уже багато поколінь шанують як молоко Діви Марії. Доглядач готовий продати його разом зі срібним релікварієм."
  relic_expedition_events.6.desc_holy_thorn: "В одному дрібному шляхетському роді зберігається скромний релікварій, всередині якого лежить терновий шип. За їхніми словами, шип належав їхньому пращуру і був частиною Тернового вінця. Вони сподіваються, що про продаж ніхто не дізнається."
  relic_expedition_events.6.desc_holy_chalice: "Одразу застерігши, що йому навряд чи повірять, купець показує простий кам’яний кубок і стверджує, що саме він є справжньою чашею з Таємної вечері, хай що там кажуть інші. Ціну він заправив чималу."
  relic_expedition_events.6.desc_titulus_crucis: "Якщо вірити місцевим переказам, коли Хрест несли на захід, прибиту над ним дошку з написом залишили тут і надійно сховали. Одна з тутешніх родин стверджує, що дошка дісталася їм у спадок — і вони готові її продати."
  relic_expedition_events.6.a: "Треба поторгуватися. Заправлена ціна висока, але її можна збити."
  relic_expedition_events.6.b: "Ми заплатимо, скільки вимагають. Деякі речі варті будь-яких грошей."
  relic_expedition_events.6.c: "Чисельність нашого почту стане найкращим доводом у суперечці."
  relic_expedition_events.7.title: "Завершення угоди"
  relic_expedition_events.7.desc: "Умови узгоджено, релікварій уже загорнули в тканину. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] лише вирішити, чи можна довіряти словам продавця."
  relic_expedition_events.7.a: "Ми заплатимо й відвеземо реліквію додому."
  relic_expedition_events.7.b: "Щось тут нечисто. Угоди не буде."
  relic_expedition_events.8.title: "Зговірливий помічник"
  relic_expedition_events.8.desc_true_cross: "Слуга в домі місцевого вельможі, що затаїв злобу на свого пана, згадує, що серед скарбів його господаря зберігається загорнутий у ганчірку шматок темного дерева. Вельможа стверджував, що це скалка Істинного хреста. За гроші слуга допоможе нам забрати реліквію."
  relic_expedition_events.8.desc_holy_lance: "Один вояк із місцевої залоги, який не бачив платні вже рік, прохопився, що у зброярні лежить старе вістря списа, на яке давно не зважають. Старі люди твердять, що це той самий Священний спис. Вояк готовий провести нас усередину."
  relic_expedition_events.8.desc_holy_shroud: "Монастирський брамник, що нещодавно вщент посварився з настоятелем, зізнається, що в його монастирі зберігається складене полотно з відбитком образу. Його тримають під замком, і тільки старші з братів мають доступ до святині. Брамник готовий залишити вхід незачиненим."
  relic_expedition_events.8.desc_holy_nail: "Загрузлий у боргах писар скарбниці зізнається, що в одному з бічних сховищ лежить старий залізний цвях, шанований як один із цвяхів Розп’яття. Реліквію не внесено до жодного опису, а єдиний ключ зберігається в нього."
  relic_expedition_events.8.desc_true_cross_fragment: "Зневірений у своєму покликанні послушник готовий залишити незачиненою віконницю в каплиці, де зберігається скалка Істинного хреста."
  relic_expedition_events.8.desc_saint_bones: "Грабар, якому все життя недоплачували за його працю, знає, де священники його парафії зберігають скриньку з кістками святого і в яку годину ризничий лягає відпочити пополудні."
  relic_expedition_events.8.desc_baptist_head: "Молодший канонік, якому набридло чекати підвищення, зголосився провести нас до релікварію, де, за переказами, зберігається голова Івана Хрестителя."
  relic_expedition_events.8.desc_virgin_milk: "Сам доглядач святині, який роками таїв образу через жебрацьку платню, в одну з обраних ним ночей готовий залишити корпус релікварію незамкненим."
  relic_expedition_events.8.desc_holy_thorn: "Управитель маєтку, спершу звільнений, а потім із жалю повернутий на службу, точно знає, де родина зберігає релікварій із шипом із Тернового вінця."
  relic_expedition_events.8.desc_holy_chalice: "Ризничий собору не має прихильності до капітулу, якому служив стільки років. Він готовий допомогти нам викрасти простий кам’яний кубок, який ченці між собою називають справжньою чашею з Таємної вечері."
  relic_expedition_events.8.desc_titulus_crucis: "Родина, в якій із покоління в покоління передається старий переказ, пропонує незвичну угоду: допомогти їм повернути дошку з написом, що була прибита до Хреста. Реліквія перебуває в руках їхнього родича, і той відмовляється її продавати."
  relic_expedition_events.8.a: "Потайність коштує грошей."
  relic_expedition_events.8.d: "Навіщо витрачати гроші, адже [target_leader.GetName] може вмовити будь-кого!"
  relic_expedition_events.8.b: "Обійдемося без їхньої допомоги. Будь-який спільник — потенційний свідок."
  relic_expedition_events.8.c: "Помічники нам не потрібні. Наш почет просто відбере реліквію."
  relic_expedition_events.9.title: "Крадіжка"
  relic_expedition_events.9.desc: "Поки все йде за планом. Ті, хто мав вартувати, або сплять, або відлучилися, або взяли свої гроші й удали, ніби нічого не бачили. Двері, як і обіцяв спільник, лишилися незамкненими. [target_leader.GetName] ховається в темряві, чекаючи на умовлений знак від вивідача."
  relic_expedition_events.9.a: "Діло зроблене. Реліквія в нас, а вони так нічого й не знають."
  relic_expedition_events.9.b: "Хтось прокинувся! Звідусіль чути лемент і тупіт ніг. Тікаймо!"
  relic_expedition_events.10.title: "Настанови мудреця"
  relic_expedition_events.10.desc_true_cross: "Мандрівний вчений, прочитавши всі хроніки про битву під Хаттіном, зіставив три свідчення, які випадково майже збіглися між собою, і звузив ділянку землі, де, як кажуть, лицарі, що відступали, закопали частку Животворного Хреста, аби тільки вона не дісталася Саладіну. Він пропонує свої записи, пошарпані мапи і самого себе."
  relic_expedition_events.10.desc_holy_lance: "Один із літописців Першого хрестового походу вважає, що знайшов, спираючись на власну оповідь [GetCharacter('koj_petrus_bartholomaeus').GetName], той самий льох, звідки в 1098 році було піднято $relic_holy_lance_found$. Він стверджує, що те, що лежало поруч, так і не було знайдено повністю. Священники-суперники свого часу називали цю думку безглуздою, але спростувати її так і не змогли."
  relic_expedition_events.10.desc_holy_shroud: "Літній антиквар майже повірив у чутку, джерело якої він до пуття не може назвати: плащаниця із зображенням, замурована в склепі ченцями, які тікали від набігу, про який не згадує жодна хроніка. Він майже сліпий і хоче наостанок зробити ще одне відкриття — і сам приведе нас на це місце."
  relic_expedition_events.10.desc_holy_nail: "Знавець реліквій вказує на напівзруйновану каплицю, де, за місцевим переказом, священник-утікач закопав цвях із Розп’яття, рятуючись від вояків, що проходили повз."
  relic_expedition_events.10.desc_true_cross_fragment: "Три покоління монастирських записів, прочитані від початку до кінця, привели вченого до наспіх покинутого скиту, де, як свідчить переказ, останній самітник сховав під долівкою каплиці частку $relic_true_cross_found$, перш ніж утікати, рятуючи власне життя."
  relic_expedition_events.10.desc_saint_bones: "Місцевий агіограф, вивчивши старі парафіяльні книги, зупинився на безіменній могилі на краю старого цвинтаря: там спочиває маловідомий святий, чиї мощі колись сховали, аби тільки вони не дісталися ворожому війську."
  relic_expedition_events.10.desc_baptist_head: "Спираючись на уривок хроніки, знайдений у монастирському архіві, вчений твердить, що релікварій, шанований як голова Івана Хрестителя, було заховано під долівкою каплиці під час давньої облоги, а сама каплиця згодом завалилася просто на нього."
  relic_expedition_events.10.desc_virgin_milk: "Вчений, посилаючись на щоденник прочанина, який до нього ніхто не завдав собі клопоту прочитати, вказує на замуровану нішу в занедбаній святині, де хранителі, за переказом, сховали посудину з молоком Богородиці, аби тільки не віддавати її грабіжникам."
  relic_expedition_events.10.desc_holy_thorn: "Вчений простудіював приватне листування згаслого роду і простежив шлях шипа із самого тернового вінця до їхнього родового склепу, запечатаного ще з часів чуми, яка спустошила цей дім."
  relic_expedition_events.10.desc_holy_chalice: "Тут побутує власна гілка легенди про Грааль, ніяк не пов’язана зі славетними домаганнями в [ShowLocationName('genoa')] та [ShowLocationName('valencia')]. Вчений, що йде її слідом, вважає, що проста кам’яна чаша спочиває під зруйнованою під час давньої облоги каплицею, чия паства розсіялася задовго до того, як хтось замислився про розкопки."
  relic_expedition_events.10.desc_titulus_crucis: "Місцевий переказ стверджує, що табличка з написом із Хреста зовсім не була вивезена на захід. Вчений, який серйозно ставиться до цього переказу, вважає, що її замурували в тутешній каплиці під час останнього відступу хрестоносців, і пропонує допомогти відшукати цю стіну."
  relic_expedition_events.10.a: "Сплатити всю названу ціну. Нехай кожен [ShowReligionAdjectiveWithNoTooltip('catholic')|l]ий двір почує про це надбання."
  relic_expedition_events.10.b: "Придбати її без зайвого розголосу. Запитана ціна зависока, а секретар єпископа відкритий до інших домовленостей."
  relic_expedition_events.10.c: "Відмовитися. Така ціна — святотатство; ми не торгуватимемося за Хрест."
  relic_expedition_events.11.title: "Терновий вінець"
  relic_expedition_events.11.desc: "Посольство прийняли в [target_country.GetGovernment.GetAdjective|l]ому палаці в [target_location.Custom('LR_PREP')] [target_location.GetName] та провели до великої каплиці реліквій. Там, за залізними ґратами та під світлом невгасимих лампад, спочиває вінець, який римські вояки поклали на чоло Христа в преторії. [target_country.GetAdjective|l]ий скарбник ладен обговорити передачу святині нам, хоча перемовини вимагатимуть і золота, і належних почестей. Подібне ставалося й раніше: свого часу [GetCountry('BYZ').GetLongName], коли скарбниця спорожніла, вже прода[GetCountry('BYZ').Custom('endlong_vlaloly')] цю саму реліквію."
  relic_expedition_events.11.a: "Сплатити відкрито, з усією поважністю, притаманною угоді між правителями. Для неї зведуть окрему каплицю."
  relic_expedition_events.11.b: "Тихо домовитися зі скарбницею. Реліквія, здобута без зайвого шуму, обійдеться дешевше."
  relic_expedition_events.clues_up_1_tt: "Слід теплішає (#G +1#! докази)"
  relic_expedition_events.clues_down_1_tt: "Слід холоне (#R -1#! Докази)"
  relic_expedition_events.retinue_up_10_tt: "Почет виправи поповнюється (#G +10#! почет)"
  relic_expedition_events.retinue_down_5_tt: "Почет виправи рідшає (#R -5#! Почет)"
  relic_expedition_events.retinue_down_8_tt: "Почет виправи рідшає (#R -8#! Почет)"
  relic_expedition_events.retinue_down_10_tt: "Почет виправи рідшає (#R -10#! до почту)"
  relic_expedition_events.retinue_down_15_tt: "Почет виправи рідшає (#R -15#! до почту)"
  relic_expedition_events.retinue_down_25_tt: "Почет виправи рідшає (#R -25#! Почет)"
  relic_expedition_events.relic_recovered_true_cross_tt: "Recovers $relic_true_cross_found$ and starts the journey home"
  relic_expedition_events.relic_recovered_holy_lance_tt: "Recovers $relic_holy_lance_found$ and starts the journey home"
  relic_expedition_events.relic_recovered_holy_shroud_tt: "Recovers $relic_holy_shroud_found$ and starts the journey home"
  relic_expedition_events.relic_recovered_holy_nail_tt: "Recovers $relic_holy_nail_found_1$ and starts the journey home"
  relic_expedition_events.relic_recovered_true_cross_fragment_tt: "Recovers $relic_true_cross_fragment_found_1$ and starts the journey home"
  relic_expedition_events.relic_recovered_saint_bones_tt: "Recovers $relic_regional_saint_bones_found_1$ and starts the journey home"
  relic_expedition_events.relic_recovered_baptist_head_tt: "Recovers $relic_baptist_head_found_1$ and starts the journey home"
  relic_expedition_events.relic_recovered_virgin_milk_tt: "Recovers $relic_virgin_milk_found_1$ and starts the journey home"
  relic_expedition_events.relic_recovered_holy_thorn_tt: "Recovers $relic_holy_thorn_found_1$ and starts the journey home"
  relic_expedition_events.relic_recovered_holy_chalice_tt: "Recovers $relic_holy_chalice_found_1$ and starts the journey home"
  relic_expedition_events.relic_recovered_titulus_crucis_tt: "Recovers $relic_titulus_crucis_found_1$ and starts the journey home"
  relic_expedition_announce_true_cross_tt: "Кожен католицький правитель дізнається, що $relic_true_cross_found$ знайдено"
  relic_expedition_announce_holy_lance_tt: "Кожен католицький правитель дізнається, що $relic_holy_lance_found$ знайдено"
  relic_expedition_announce_holy_shroud_tt: "Кожен католицький правитель дізнається, що $relic_holy_shroud_found$ знайдено"
  relic_expedition_events.12.title: "Святий Спис"
  relic_expedition_events.12.desc: "Посольство прибуло до [target_location.Custom('LR_GEN')] [target_location.GetName], де його провели до реліквії, що зберігається в соборі [target_location.Custom('LR_GEN')]. Цей спис, який вважають зброєю сотника Лонгина, що простромила бік Христа під час розп’яття, знайшли хрестоносці під час облоги 1098 року. Капітул згоден передати його; єпископ згоден; [target_country.Custom('GetRulerOrRegentTitle')|l] також не заперечує, якщо ціна буде слушною. Вони розлого розповідають про те, як цей спис у минулому підносив бойовий дух [ShowReligionGroupAdjective('christian')|l]их оборонців [target_location.Custom('LR_GEN')]."
  relic_expedition_events.12.a: "Щедро заплатити. Спис вирушить у похід разом із нашим військом."
  relic_expedition_events.12.b: "Здобути спис, таємно підкупивши капітул і єпископських писарів."
  relic_expedition_events.12.c: "Відмовитися. [target_location.GetNameWithNoTooltip] потребує цього списа дужче за нас."
  relic_expedition_events.13.title: "Майстерня фальшивомонетника"
  relic_expedition_events.13.desc: "Ремесника ловлять на продажу довірливому прочанину пальця святого, вирізаного того ж ранку з баранини й підфарбованого чаєм. Коли його притискають питанням, кого ще він ошукав, він замість відповіді клянеться, що знає про щось справжнє — натрапив на це, збираючи старе дерево та ще старіше залізо для майстерні. Він назве квартал, але не вулицю, доки не побачить монету. Слово фальшивомонетника варте рівно стільки, скільки варте слово фальшивомонетника."
  relic_expedition_events.13.a: "Заплатити йому за його слова, але тільки раз."
  relic_expedition_events.13.b: "Нехай почет на нього натисне. Страх дешевший за срібло."
  relic_expedition_events.13.forger_honest_tt: "Цього разу монета купує щось справжнє, і слова фальшивомонетника виявляються правдою"
  relic_expedition_events.13.forger_cheated_tt: "У названому ним кварталі немає нічого, крім пліток; фальшивомонетникові двічі заплатили за ту саму брехню"
  relic_expedition_events.13.threats_work_tt: "Страх розв’язує те, чого не змогло срібло, і фальшивомонетник видає щось справжнє"
  relic_expedition_events.13.threats_fail_tt: "Він лише голосніше скиглить із відмовками; погрози почту не принесли нічого, крім розбитих кісточок"
  relic_expedition_events.14.title: "Піщана буря на шляху"
  relic_expedition_events.14.desc: "Около полудня на обрії встає стіна охристого пилу, і за годину вона поглинає шлях. Верблюди підгинають ноги й відмовляються вставати, пісок забивається в кожну складку тканини й у кожен бурдюк із водою, а провідник зізнається, що більше не може розрізнити кам’яні піраміди, які позначають шлях. [target_leader.GetName] може рухатися далі наосліп або втратити дні, перечікуючи бурю."
  relic_expedition_events.14.a: "Іти напролом. Шлях не може бути далеко."
  relic_expedition_events.14.b: "Притиснути намети вантажем, розбити табір і перечекати, доки буря не вщухне."
  relic_expedition_events.15.title: "Спалах лихоманки"
  relic_expedition_events.15.desc_land: "Лихоманка прийшла разом із водоносами й забирає людей по двоє-троє майже без попередження: на світанку ломить голову, опівдні починаються дрижаки, а наступного ранку — свіжа могила. Обидва лікарі загону вже не встигають допомогти всім, хто до них звертається, а здорові намагаються триматися якомога далі від хворих. [target_leader.GetName] має вирішити, скільки скарбниця витратить на те, щоб зупинити цю напасть."
  relic_expedition_events.15.desc_sea: "Лихоманка проникла на борт разом з останньою партією води, набраної в порту, і забирає людей по двоє-троє майже без попередження: на світанку ломить голову, опівдні починаються дрижаки, а наступного ранку тіло вже спускають за борт. Обидва лікарі загону в тісному трюмі вже не встигають допомогти всім, хто до них звертається, а здорові намагаються триматися від хворих так далеко, як тільки дозволяє палуба. [target_leader.GetName] має вирішити, скільки скарбниця витратить на те, щоб зупинити цю напасть."
  relic_expedition_events.15.a: "Не шкодувати коштів на лікування хворих та їхнє відокремлення."
  relic_expedition_events.15.b: "Нехай хвороба йде своєю чередою. Лихоманка швидко згасає сама."
  relic_expedition_events.16.title: "Пустельні розбійники вимагають данину"
  relic_expedition_events.16.desc: "Озброєні люди перегородили дорогу там, де вона спускається між двома пасмами — їх забагато й тримаються вони надто злагоджено, як для звичайних розбійників із битого шляху. Їхній ватажок виїжджає верхи перед строєм, називає ціну за безпечний прохід і ясно дає зрозуміти, що вже розрахував, у що стане інший вислід."
  relic_expedition_events.16.a: "Сплатити мито й піти, поки він не передумав щодо ціни."
  relic_expedition_events.16.b: "Прорватися силою. Ми не для того подолали такий шлях, щоб нас грабували."
  relic_expedition_events.16.c: "Нехай говорить наша чисельність. Мало хто наважиться сперечатися з таким загоном."
  relic_expedition_events.17.title: "Поголос прочанина"
  relic_expedition_events.17.desc: "Караван прочан ділить із загоном заїзд на ніч, і розмова біля багаття, як заведено, звертає до реліквій. Один із них, син торгівця вовною родом здалеку, переповідає історію, яку непевно пам’ятає зі слів дядька, що помер двадцять років тому: ченці виносять пакунок із будівлі у вогні, ніч на прибережній дорозі й поховання, якого ніхто не мав бачити. Назви дому він назвати не може. Але напрочуд упевнений щодо дороги."
  relic_expedition_events.17.a: "Піднести йому ще кухоль і витягнути кожну дрібницю."
  relic_expedition_events.17.b: "Ще одна вигадка з тисячі. Вирушаємо з першим промінням сонця."
  relic_expedition_events.17.tale_confirmed_tt: "Монета розв’язує йому язика, і виривається подробиця, якою йому, мабуть, не варто було ділитися"
  relic_expedition_events.17.tale_fades_tt: "Ще одна чаша не допомагає — подробиці лише дедалі більше змазуються з кожним новим переказом"
  relic_expedition_events.18.title: "Гроші добігають кінця"
  relic_expedition_events.18.desc: "Невдалий місяць з обміном грошей і лихварі, які раптом стали обережними у справах із чужинцями, залишають скарбницю виправи значно скрутнішою, ніж очікувалося. Платню почту вже затримують на два тижні, погоничі мулів вимагають плати монетою, якій довіряють, а не нашою, а поголоски про неплатоспроможний загін ширяться цими містами швидше за будь-які наші розпитування."
  relic_expedition_events.18.a: "Покрити нестачу з королівської скарбниці, та якнайшвидше."
  relic_expedition_events.18.b: "Нехай зачекають на платню ще трохи. Іти їм однаково нікуди."
  relic_expedition_events.19.title: "Місцева влада виявляє зацікавленість"
  relic_expedition_events.19.desc_muslim: "Місцевий #italic каді#! прочув, що чужинці ставлять незручні питання про франкські скарби й про те, які родини що приховали собі, коли впали королівства. Його писар навідується до [target_leader.GetName] із чаєм, компліментами та посланням, чия суть за ввічливими словами цілком зрозуміла: подібні розпитування йдуть значно гладше, якщо про них відомо його панові і якщо знайдеться належна пожертва на потреби мечеті."
  relic_expedition_events.19.desc_christian: "Місцеві [relic_hunt_current_loc.GetOwner.GetGovernment.GetEstateName('clergy_estate')] помітили, що чужоземний загін надто вже пильно розпитує про реліквії, які вони вважають справою самої лише Церкви й нікого більше. Архідиякон приймає [target_leader.GetName] з усією ґречністю, доволі розлого розмірковує про гріх зажерливості й не залишає жодних сумнівів у тому, що його подальша прихильність вимагатиме дару на вівтар."
  relic_expedition_events.19.desc_fallback: "Поголос про розпитування виправи дійшов до вух, які ліпше було б не тривожити. Чоловік, якого ніхто не завдав собі клопоту відрекомендувати, приходить до заїзду після настання темряви, сідає без запрошення й докладно пояснює, скільки прикрощів може знайти собі чужоземний загін у такому місті, як це. Попередження лунає неквапливо, цілком ґречно й абсолютно ясно."
  relic_expedition_events.19.a: "Виявити належну шану на очах у потрібних людей."
  relic_expedition_events.19.b: "Не зважати на попередження та продовжувати працю. Часу й так обмаль."
  relic_expedition_events.20.title: "Прочанин із мапою"
  relic_expedition_events.20.desc: "Старий чоловік наздоганяє посольство в дорозі, тримаючи пошарпану торбу через плече та гладенько витертий у руці ціпок. Він уже бував у святині, до якої ми прямуємо; він бачив саму реліквію й може описати каплицю, варту, єпископа та навколишні землі на пів ліги довкола. Він просить лише місце біля вогнища, кухоль вина й змогу виговоритися. [target_leader.GetName] саджає його поруч і слухає дві години."
  relic_expedition_events.20.a: "Попрощатися з ним, давши монету та взявши благословення. Дорога щойно стала значно коротшою."
  relic_expedition_events.21.title: "[target_country.GetAdjectiveWithNoTooltip]а командорія"
  relic_expedition_events.21.desc: "Посольство прибуває до #TOOLTIP:BUILDING_TYPE,order_commandery,X #L командорії ордену#!#! [target_country.Custom('longname_ua_GEN')] на внутрішній дорозі в [target_location.Custom('LR_PREP')] [target_location.GetName], захищеної низьким кам’яним муром і над якою майорить стяг із хрестом. Комтур приймає очільника посольства з належною пошаною, розпоряджається розмістити гостей у палаті для приїжджих, напоїти коней і нагодувати людей, а також видає охоронну грамоту на наступну ділянку шляху через землі, за які сперечаються троє володарів. Брати не просять нічого натомість, окрім служби Божої в каплиці командорії."
  relic_expedition_events.21.a: "Вислухати службу, залишити щедрий дар на вівтарі та рушити далі, добре відпочивши."
  relic_expedition_events.22.title: "Благословення ігумена"
  relic_expedition_events.22.desc: "Дорога в [target_location.Custom('LR_PREP')] [target_location.GetName] в’ється повз сусідній #TOOLTIP:BUILDING_TYPE,orthodox_monastery,X #L православний монастир#!#!, зведений на схилі ущелини, і коли посольство минає його, дзвони саме кличуть на вечірню. Ігумен, довідавшись про мету виправи, спускається благословити очільника й наполягає, щоб посольство заночувало в монастирській гостиниці. Він довго веде бесіду до самої ночі про реліквію, яку ми шукаємо, про поважність її охоронців та про те, як належить до них звертатися. Очільник усе ретельно записує."
  relic_expedition_events.22.a: "Прийняти благословення, залишити милостиню для монастирських нужденних і рушити далі."