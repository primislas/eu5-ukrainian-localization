l_russian:
  cartographic_survey_events.1.title: "Картографічна комісія"
  cartographic_survey_events.1.desc: "Наказ віддано. Невелика флотилія з двох-трьох кораблів, із картографами, доглядачами приладдя й призначеним капітаном, пройде вздовж усього нашого узбережжя та повернеться з мапами, гідними служити наступне століття. Більша частина того, що нам відомо про власні береги, походить від місцевих лоцманів і купецьких чуток. Після цієї справи з’являться мапи, де чорнилом буде нанесено всі гавані [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')], небезпеки для мореплавців і бухти перемитників. Питання лише в тому, яким спорядженням забезпечити це плавання."
  cartographic_survey_events.1.a: "Commission the finest brass instruments and the best chart-makers in the land."
  cartographic_survey_events.1.b: "The standard chart-makers will serve. There is no need for extravagance."
  cartographic_survey_events.1.historical_info: "Систематичне знімання узбережжя по-справжньому почалося в шістнадцятому столітті, коли зростання морської торгівлі перетворило точні мапи на справу державної ваги. І #italic Каса-де-Контратасьйон#! у Севільї, і португальський #italic Армазен-да-Ґіне-і-Індія#! утримували офіційних картографів, чиїм завданням було складання й оновлення морських мап, а в сімнадцятому столітті їхній приклад наслідували голландські адміралтейства."
  cartographic_survey_events.10.title: "Рибні банки нанесено на мапу"
  cartographic_survey_events.10.desc: "Дослідницький корабель провів три тижні, працюючи з місцевими рибалками в околицях [target_location.GetName], вимірюючи глибини над великими рибними банками, позначаючи шляхи сезонного ходу риби й записуючи течії, які приводять човни додому до зміни погоди. Картографи склали робочий аркуш, де вказано глибини, характер дна та звичні рибальські пори. Один із місцевих лоцманів зауважує, що провів на цих промислах усе життя, але ніколи не бачив їх зображеними так виразно."
  cartographic_survey_events.10.a: "Distribute the chart to the fishing villages. Let the trade benefit from the work."
  cartographic_survey_events.10.historical_info: "Доіндустріальне рибальство спиралося на усні знання, що передавалися всередині рибальських родин і спілок. Перехід до нанесених на мапи промислових угідь — із позначеними банками, ізобатами й зафіксованими сезонними закономірностями — був повільним поступом, який пришвидшився у сімнадцятому та вісімнадцятому століттях із розвитком державної гідрографії."
  cartographic_survey_events.11.title: "Лісові угіддя на узбережжі"
  cartographic_survey_events.11.desc: "Землеміри об’їхали прибережні ліси [target_location.GetName] разом із лісниками та старшими корабельними майстрами, позначаючи найкращі гаї щоглової сосни та корабельного дуба, наносячи на мапу струмки, якими можна сплавляти колоди до берегів завантаження, та записуючи пори року, коли деревина найкраще піддається пилці. Корабельний будівничий, викликаний із корабельні для огляду найперспективнішої ділянки, визнає її придатною для кілевого лісу та шпангоутів найвищого ґатунку."
  cartographic_survey_events.11.a: "Set the better stands aside as [ROOT.GetCountry.GetGovernment.GetAdjective] timber for the naval yards."
  cartographic_survey_events.11.historical_info: "Корабельний ліс — особливо дуб, необхідний для шпангоутів лінійних кораблів, і висока сосна для щогл — був стратегічним товаром у добу вітрильного флоту. Англійська, французька та голландська корони вели облік прибережних лісів й оголошували найкращі ділянки маєтностями корони, встановлюючи суворі правила вирубування, сушіння та перевезення."
  cartographic_survey_events.12.title: "The Salt Pans Catalogued"
  cartographic_survey_events.12.desc: "The survey vessel has logged every [ShowGoodsName('salt')] pan, brine spring, and shoal flat along [target_location.GetName]'s stretch of coast. The boilers have been counted, the customary working seasons noted, the local salt-traders interviewed about price, demand, and the routes by which the [ShowGoodsNameWithNoTooltip('salt')] travels inland. The chart that emerges shows a coastal economy that the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] has barely understood until now, and that the #italic gabelle#!, if extended to cover it, would yield handsomely from."
  cartographic_survey_events.12.a: "Forward the chart to the [ShowGoodsNameWithNoTooltip('salt')] commissioners. The trade can be regularized."
  cartographic_survey_events.12.historical_info: "Прибережне добування солі сонячним випарюванням практикувалося з античних часів по всьому Середземномор’ю, а також на атлантичному узбережжі Франції, Португалії та Іберії. Бухта Бурньйоф, острів Ре та солончаки півострова Сетубал були найбільшими промисловими соляними осередками доіндустріальної Європи, що забезпечували сіллю промисел тріски Північної Атлантики й торгівлю солениною по всьому континенту."
  cartographic_survey_events.13.title: "Виявлено перлинні мілини"
  cartographic_survey_events.13.desc: "Зйомка виявила й нанесла на мапу місцеві мілини [ShowGoodsName('pearls')] у [target_location.GetName] за сприяння родин пірнальників, які видобувають перли в цих водах уже багато поколінь. На мапі позначено глибини, пори збору, звичні межі між суперницькими громадами пірнальників, а також шляхи, якими здобич потрапляє до міських гранильників. Золотар, запрошений оглянути зразок вилову цього сезону, визнав перлини надзвичайно чистого блиску."
  cartographic_survey_events.13.a: "[ShowGoodsNameWithNoTooltip('pearls')] такої якості мають перебувати під [ROOT.GetCountry.GetGovernment.GetAdjective] наглядом."
  cartographic_survey_events.13.historical_info: "Європейські перлинні промисли були скромними порівняно з величними мілинами Перської затоки та Шрі-Ланки, однак води Гебридських островів, Вісли, а також узбережжя Бретані й Уельсу давали прісноводні та морські перли товарної якості. Шотландська корона утримувала королівську монополію на видобуток перлів із деяких річкових систем починаючи із Середньовіччя, а венеційський Сенат регулював вилов в Адріатиці."
  cartographic_survey_events.14.title: "Складено мапу виноградного узбережжя"
  cartographic_survey_events.14.desc: "Дослідники об’їхали прибережні пагорби в [target_location.GetName] разом із виноробами, позначаючи найкращі схили для лози, переважальні вітри, від яких гроно дозріває чи гниє, а також завантажувальні пляжі, звідки бочки відправляють на вивіз. Торговці [ShowGoodsName('wine')], зазвичай люд потайний, виявилися напрочуд корисними, зрозумівши, що точніші мапи означають кращий час для вивезення краму."
  cartographic_survey_events.14.a: "Distribute the chart to the wine-shippers. The trade rests on better information."
  cartographic_survey_events.14.historical_info: "Морська торгівля вином була господарською основою таких країв, як долина Ґаронни, долина Дору, Егейські острови та далматинське узбережжя. Терміни збору врожаю, час виходу кораблів і якість гаваней визначали, чи дійде річний урожай до ринку в належному стані. Тому картографія виноробних узбереж становила неабиякий торговий інтерес, і великі виноторговці Бордо та Порту століттями зберігали власні приватні збірки мап."
  cartographic_survey_events.15.title: "Обстежено узбережжя барвників"
  cartographic_survey_events.15.desc: "The survey has charted the local dye-producing coast in [target_location.GetName]: the murex beds where the Tyrian purple is gathered, the kermes oaks above the cliffs, the indigo plantings on the inland flats, or whatever local plant or shell yields the color that the cloth-merchants pay for. The chart records the working seasons, the customary gathering grounds, and the routes by which the [ShowGoodsName('dyes')] reach the textile towns."
  cartographic_survey_events.15.a: "Distribute the chart to the cloth-merchants and the gathering villages."
  cartographic_survey_events.15.historical_info: "Барвники до доби синтетики були стратегічним товаром упродовж Середньовіччя та раннього Нового часу. Тірський пурпур із черепашок багрянок, кермесовий червоний із червеців, що живуть на дубах, індиго з індигофери та вайда з листя фарбівника — кожен мав власну географію виробництва, а торгівля тканинами залежала від надійності ланцюгів постачання від місць збору до ткацьких міст."
  cartographic_survey_events.16.title: "Нанесено на мапу узбережжя [ShowGoodsNameWithNoTooltip('amber')]"
  cartographic_survey_events.16.desc: "Зйомка нанесла на мапу береги в [target_location.GetName], куди після штормів прибиває [ShowGoodsName('amber')], визначивши прибережні смуги, варті розробки, пори, коли прибій виносить смолу на берег, а також місцеві звичаї розподілу здобичі. Міські різьбярі по [ShowGoodsNameWithNoTooltip('amber')], які здавна платили надбавку за каміння найкращої чистоти, заплатять ще більше, знаючи, які береги дають який ґатунок."
  cartographic_survey_events.16.a: "Взяти найкращі прибережні смуги під [ROOT.GetCountry.GetGovernment.Custom('CL_INST')] відання."
  cartographic_survey_events.16.historical_info: "Балтійське узбережжя бурштину, від Самбійського півострова до східного узбережжя Померанії, було головним джерелом бурштину для європейських ремесел з античних часів. Тевтонський орден, як відомо, суворо утримував монополію на видобуток бурштину, призначаючи жорстокі кари за несанкціонований збір. Бурштинові шляхи пов’язували балтійське узбережжя з майстернями Богемії, Італії та Константинополя понад тисячу років."
  cartographic_survey_events.20.title: "Захищена гавань"
  cartographic_survey_events.20.desc: "Корабель знімальної партії обігнув низький мис у [target_location.GetName] і став на якір у захищених водах, якими місцеві рибалки користуються вже багато поколінь, але які не значаться на жодній наявній мапі. Глибина тут тримається рівною — чотири сажні над піщаним дном, — панівні вітри безпечно розбиваються об зовнішній риф, а місцевий лоцман повідомляє, що кораблі будь-якої розумної осадки можуть стояти тут за будь-якої погоди. За належних промірів та створних знаків ця гавань стане придатною і для більших кораблів."
  cartographic_survey_events.20.a: "Set the proper transit lines and record the harbor on the official chart."
  cartographic_survey_events.20.historical_info: "Місцеві рибалки нерідко знали про затишні якірні стоянки, яких не було на жодній офіційній мапі: ці знання передавалися з покоління в покоління як практичне лоцманське вміння, а не як письмові записи. Державні гідрографічні зйомки навмисне опитували таких лоцманів, і внесення раніше непозначеної гавані до офіційних лоцій було звичним наслідком доіндустріальних прибережних досліджень."
  cartographic_survey_events.21.title: "Прохід крізь риф"
  cartographic_survey_events.21.desc: "Картографи провели два тижні, вимірюючи лотлінем прибережний риф у [target_location.GetName], який завжди вважався непрохідним. Вони знайшли прохід: тридцять футів у найвужчому місці, чотири сажні глибини під час малої води, прохідний за будь-якої погоди за правильно виставлених створних віх на мисі позаду. Місцевий лоцман, який, як з’ясувалося, знав про цей прохід уже тридцять років і нікому про нього не казав, бере невелику плату за його розмітку."
  cartographic_survey_events.21.a: "Set the transit poles. The channel goes on the official chart."
  cartographic_survey_events.21.historical_info: "Прибережні рифи, що приховували судноплавні проходи, були звичним явищем у доіндустріальному мореплавстві. Спосіб створних віх, за якого корабель підходить до проходу за пеленгом двох помітних берегових орієнтирів, розташованих один за одним, був звичайним способом розмітки такого проходу, а знання подібних створів часто-густо становило ретельно бережену таємницю місцевого лоцманського промислу."
  cartographic_survey_events.22.title: "Давно обжита бухта"
  cartographic_survey_events.22.desc: "Знімальна партія виявила затишну бухту в [target_location.GetName] за кілька ліг від найближчого офіційного порту. На дні видно свіжі сліди від якоря, на скелях над берегом — старі вибоїни від кочення діжок, а діти місцевих рибалок під час розпитувань ледве стримують усмішку. Ця бухта роками слугувала для неофіційної торгівлі. Тепер, коли відомості про неї внесено до офіційних записів, бухту можна звернути до законної справи — або принаймні поставити під митний нагляд, що приноситиме дохід."
  cartographic_survey_events.22.a: "Внести бухту до записів і розмістити там невеликий митний пост."
  cartographic_survey_events.22.historical_info: "Перемитні бухти були невіддільною рисою європейського узбережжя від античности до ранньої доби промисловости. Поява берегової охорони, митних катерів і систематичного картографування підозрілих місць висадки поступово витісняла неофіційну торгівлю в дедалі дрібніші та віддаленіші затоки, але по-справжньому ускладнити перемитництво в хоч трохи помітних обсягах змогли лише залізниця, телеграф та парові патрульні кораблі."
  cartographic_survey_events.30.title: "Буря розпорошує знімальну партію"
  cartographic_survey_events.30.desc: "A storm came up out of the southwest on the third day of the work, drove the survey vessel onto a lee shore for two cold nights of pounding surf, and scattered the boats sent to fetch the chart-makers off the working stations. By the time the wind dropped and the vessel was refloated, the season's working had been lost, the instruments soaked, and two of the boatswain's mates buried in the dunes above the beach. The chart for [target_location.GetName]'s stretch of coast remains as blank as it was before."
  cartographic_survey_events.30.a: "Move on to the next place. The season is too far gone to begin again here."
  cartographic_survey_events.30.historical_info: "Раптові шторми були постійною професійною небезпекою для малих прибережних кораблів, що проводили зйомку берега. Шкала Бофорта, стандартизоване штормове попередження та систематичне передбачення погоди з’явилися лише в дев’ятнадцятому столітті, а до того знімальний корабель, опинившись біля підвітряного берега, коли дужчав вітер, міг покладатися лише на лотлінь, якір та витримку капітана — більше між ним і загибеллю не стояло нічого."
  cartographic_survey_events.31.title: "Сідання на мілину, не позначену на мапі"
  cartographic_survey_events.31.desc: "Знімальний корабель сів на мілину в місцевості [target_location.GetName], якої жодна наявна мапа не позначала — дно стрімко піднялося просто під кілем майже тієї самої миті, коли лотлінь показав чотири сажні. Корпус пробито перед перебіркою, і тесля порається біля свинцевих латок та кесона, поки корабель лежить на боці на березі. Картографи встановили свої прилади на піску й працювали день у день, але зйомку цієї ділянки узбережжя на цьому закінчено."
  cartographic_survey_events.31.a: "Repair the vessel and move on. The shoal at least is now on our chart."
  cartographic_survey_events.31.historical_info: "Сідання на непозначену мілину було звичайним лихом доіндустріальної знімальної праці, і кораблі, що зазнали аварії, нерідко давали точніші гідрографічні відомості, ніж обачні промірники, які щасливо проходили повз той самий берег. Чимало лоцій позначали мілини за назвами кораблів, що їх виявили, а положення доти невідомого рифу часто наносили на мапу з лаконічною приміткою про те, що такий-то корабель сів на нього такого-то року."
  cartographic_survey_events.32.title: "Ворожий корабель"
  cartographic_survey_events.32.desc: "An unflagged vessel, lateen-rigged and clearly armed, came up out suddenly of the haze and sailed towards the survey vessel while it was anchored in [target_location.GetName]. Our crew, ashore on the beach with their instruments, were obliged to abandon the work, take to the boats, and return to the ship with their notebooks half-completed. The unknown vessel followed for half a day, peeled away on a bearing that suggests an unfriendly home port, and left the survey for this stretch of coast in tatters. The chart-makers will not be persuaded to return."
  cartographic_survey_events.32.a: "Move on. A coast surveyed under hostile watch is no chart at all."
  cartographic_survey_events.32.historical_info: "Прибережна зйомка була справою політично дражливою, позаяк точні мапи чужого узбережжя були необхідною умовою для воєнних дій проти нього. Знімальні кораблі, що працювали у спірних водах, повсякчас супроводжували озброєні кораблі місцевої країни — іноді їх затримували, іноді просто відлякували. Гідрографічні зйомки іспанського та егейського узбереж англійським Адміралтейством у сімнадцятому та вісімнадцятому століттях неодноразово уривалися через такий тиск, а знімальні команди були навчені за перших ознак огляду викидати за борт найважливіші записи."
  cartographic_survey_events.33.title: "Туман зупиняє працю"
  cartographic_survey_events.33.desc: "Туман ліг на другий ранок і не розсіювався три тижні. Картографи, не маючи змоги брати перехресні пеленги на берегові орієнтири, сховані за стіною хмар, коротали час за грою в кості та скаргами на холод. Запаси добігали кінця; [target_leader.GetName] вирішив, що подальше чекання — лише марнування харчів, і зйомку узбережжя [target_location.GetName] припинили, а мапа залишилася недокресленою, проміри — неперевіреними. Туман, певна річ, розсіявся наступного дня після того, як корабель знявся з якоря."
  cartographic_survey_events.33.a: "Змиритися з втратою сезону та рухатися далі."
  cartographic_survey_events.33.historical_info: "Прибережний туман був повсякчасним ворогом доіндустріальної знімальної праці. Звичайний гідрографічний спосіб вимагав чіткої видимості нерухомих берегових орієнтирів з морських робочих стоянок, і тривалий туман робив усю дію неможливою. Знімальні виправи в туманних краях, як-от Ньюфаундленд, Північне море та північний захід тихоокеанського узбережжя, нерідко проводили більше часу в очікуванні ясної погоди, ніж за власне знімальною працею."