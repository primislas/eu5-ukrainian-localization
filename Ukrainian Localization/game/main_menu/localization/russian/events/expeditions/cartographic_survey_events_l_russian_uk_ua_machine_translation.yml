l_russian:
  cartographic_survey_events.1.title: "Дослідницька виправа"
  cartographic_survey_events.1.desc: "Наказ віддано. Невеликий флот із кількох кораблів, до команди яких входять картографи та навігатори, досліджуватиме наше узбережжя, щоб скласти його докладні мапи. Майже всі наші знання про власні береги походять від місцевих лоцманів та чуток, які ширять купці. Завдяки цій виправі ми достеменно знатимемо, де розташовані зручні гавані, бухти перемитників, а також небезпечні для мореплавства місця. Питання лише в тому, як найкраще спорядити наші кораблі для прийдешньої мандрівки."
  cartographic_survey_events.1.a: "Закупити найкращі прилади та найняти найдосвідченіших картографів."
  cartographic_survey_events.1.b: "Зайві витрати тут ні до чого. Із цим завданням упорається навіть недосвідчена команда."
  cartographic_survey_events.1.historical_info: "Систематичне дослідження узбереж набуло значного розвитку в XVI столітті — обсяги морської торгівлі стрімко зростали, а точність мап перетворилася на питання державної ваги. #italic Каса-де-Контратасьон#! («Палата торгівлі») у Севільї, а також португальський #italic Арсенал Гвінеї та Індії#! утримували цілий штат офіційних картографів, до обов’язків яких належало укладання та постійне оновлення морських мап. У XVII столітті їхній приклад наслідували нідерландські адміралтейства."
  cartographic_survey_events.10.title: "Нанесення на мапу рибних промислів"
  cartographic_survey_events.10.desc: "Розвідувальний корабель провів три тижні з рибалками в околицях [target_location.Custom('LR_GEN')|l] [target_location.GetName], вимірюючи глибину на ділянках рибних промислів, позначаючи сезонний рух риби й записуючи течії, що можуть доправити кораблі до берега до зміни погоди. Завдяки цьому наші картографи склали докладну мапу, де вказано глибину й рельєф дна, а також найсприятливіші для вилову риби пори. Місцевий лоцман зазначив, що ніколи раніше не бачив такого докладного опису тутешніх вод."
  cartographic_survey_events.10.a: "Передамо ці мапи рибальським селам."
  cartographic_survey_events.10.historical_info: "У минулому рибалки покладалися лише на знання, що передавалися з покоління в покоління. Перехід до картування рибних угідь із зазначенням глибин та сезонних чинників відбувався дуже повільно й пришвидшився лише в XVII–XVIII століттях, коли держави почали активно споряджати гідрографічні дослідження."
  cartographic_survey_events.11.title: "Прибережні ліси"
  cartographic_survey_events.11.desc: "Наші дослідники за сприяння місцевих лісників і корабелів оглянули прибережні ліси в околицях [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Вони відзначили найкращі місця для вирубування щоглових сосен та корабельного дуба, нанесли на мапу річки, якими колоди найзручніше сплавляти до узбережжя, а також визначили найсприятливіші пори для заготівлі деревини. Запрошений з найближчої корабельні корабельник підтвердив, що ці лісові насадження годяться для виготовлення кілів та каркасів найвищої якості."
  cartographic_survey_events.11.a: "Залишимо найкращий ліс для потреб #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого#! флоту"
  cartographic_survey_events.11.historical_info: "Корабельна деревина — а надто дуб і сосна, необхідні для спорудження каркасів та щогл лінійних кораблів, — була стратегічно важливою сировиною в добу мореплавства. Англійська, французька та нідерландська корони регулярно проводили огляд своїх прибережних лісів і закріплювали за собою найкращі насадження, де встановлювалися суворі правила щодо вирубування, сушіння та перевезення."
  cartographic_survey_events.12.title: "Опис солончаків"
  cartographic_survey_events.12.desc: "Розвідники склали докладну мапу всіх солончаків, солоних джерел та мілин уздовж узбережжя поблизу [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Крім того, дослідники провели облік солеварів, уточнили робочі пори, а також опитали місцевих торговців щодо цін, попиту та шляхів, якими [ShowGoodsNameWithNoTooltip('salt')|l] надходить до країни. Отримані ними відомості проливають світло на прибережне господарство, про яке [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] досі майже нічого не зна[ROOT.GetCountry.Custom('crown_vlaloly')] і яке могло б принести до скарбниці величезний прибуток, якби його діячі разом з усіма сплачували соляний податок."
  cartographic_survey_events.12.a: "Ці мапи допоможуть нам узяти під контроль торгівлю сіллю."
  cartographic_survey_events.12.historical_info: "Прибережні соляні промисли через випаровування під сонцем були поширені в країнах Середземномор’я та на атлантичному узбережжі Франції й Іберійського півострова з античних часів. Затока Бурньйоф, острів Ре та солончаки Сетубальського півострова були великими осередками видобутку солі в середньовічній Європі, звідки цей цінний крам надходив на тріскові промисли Північної Атлантики та до солярень по всьому континенту."
  cartographic_survey_events.13.title: "Виявлення перлових мілин"
  cartographic_survey_events.13.desc: "Заручившись допомогою місцевих спадкових пірнальників, наші дослідники склали мапу скупчень #TOOLTIP:GOODS,pearls,X #L перлівниць#!#! поблизу [target_location.Custom('LR_GEN')|l] [target_location.Custom('LR_GEN')|l]. Окрім самих місць, на мапі також зазначено глибини, найсприятливіші пори для видобутку, усталені межі між промисловими угіддями різних громад, а також шляхи, якими їхній вилов надходить до міських ремісників. На наше прохання один із золотарів уже оглянув тутешні перли й високо оцінив їхній вигляд."
  cartographic_survey_events.13.a: "Збут таких якісних перлів має бути під контролем держави."
  cartographic_survey_events.13.historical_info: "Європейський видобуток перлів був відносно слабо розвинений порівняно з промислами Перської затоки та Шрі-Ланки. Утім, на річці Віслі, а також у прибережних водах Гебридських островів, Бретані та Вельсу все ж вівся промисловий видобуток прісноводних та морських перлів. При цьому в Середні віки шотландська корона володіла монополією на вилов перлів у деяких річках, а венеційський сенат суворо регулював їхній видобуток в Адріатичному морі."
  cartographic_survey_events.14.title: "Картування прибережних виноградників"
  cartographic_survey_events.14.desc: "Наші дослідники разом із місцевими виноробами ретельно оглянули прибережні пагорби поблизу [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Вони відзначили найкращі схили для вирощування винограду з огляду на вітри, а також знайшли зручні місця для завантаження винних діжок на кораблі. На наш подив, торговці #TOOLTIP:GOODS,wine,X #L вином#!#!, які зазвичай не розголошують таємниць своєї справи, охоче допомагали дослідникам, розуміючи, що нові мапи добре вплинуть на строки постачання."
  cartographic_survey_events.14.a: "Торговцям вином неодмінно стануть у пригоді ці мапи."
  cartographic_survey_events.14.historical_info: "Морська торгівля вином становила основу господарства країв, розташованих у долинах річок Гаронна та Дуеро, на Егейських островах та вздовж далматинського узбережжя. Вчасний збір урожаю, умови зберігання та швидкість доставки багато в чому визначали, чи збереже вино свої якості, чи зіпсується ще до того, як потрапить на прилавок. У зв’язку з цим картування прибережних виноградників мало величезне торгове значення. Так, великі торговці вином із Бордо та Порту сотні років зберігали й поповнювали власні збірки мап."
  cartographic_survey_events.15.title: "Дослідження прибережних місць добування барвників"
  cartographic_survey_events.15.desc: "Наші дослідники склали докладні мапи узбережжя поблизу [target_location.Custom('LR_GEN')|l] [target_location.GetName], де добувають #TOOLTIP:GOODS,dyes,X #L барвники#!#!. Тут вони виявили колонії мурексів, скельні гаї кермесового дуба, місця росту індиго та інші джерела природних барвників, за які купці, що торгують #TOOLTIP:GOODS,cloth,X #L тканинами#!#!, готові заплатити високу ціну. Серед іншого картографи позначили пори року й усталені місця добування барвників, а також шляхи, якими їх доправляють до осередків ткацьких промислів."
  cartographic_survey_events.15.a: "Відішлемо ці мапи до сіл і ткацьких майстерень."
  cartographic_survey_events.15.historical_info: "Природні барвники були надзвичайно цінним крамом у середні віки та в ранній новий час. При цьому вони мали вельми широку географію виробництва і створювалися за найрізноманітнішими способами. Так, пурпуровий барвник добували з молюсків, червоний — із кошенілі, індиго — з індигофери, а синій — із листя вайди. Торгівля тканинами дуже залежала від барвників, тому їхня вчасна доставка з місць добування до ткацьких осередків мала величезне значення."
  cartographic_survey_events.16.title: "Мапування бурштинового берега"
  cartographic_survey_events.16.desc: "Наші дослідники оглянули околиці [target_location.Custom('LR_GEN')|l] [target_location.GetName], де під час лютих бур море викидає на берег чимало #TOOLTIP:GOODS,amber,X #L бурштину#!#!. Це дало їм змогу скласти докладні мапи, де зазначено місця та пори його збирання, а також звичаї, за якими тутешні жителі ділять здобич. Міські бурштинярі, охочі до якісних скам’янілостей, напевно заплатять добрі гроші за ці відомості."
  cartographic_survey_events.16.a: "Найбагатші береги мають бути під державним наглядом."
  cartographic_survey_events.16.historical_info: "Бурштиновий берег, що простягався від Східної Померанії до Самбійського півострова, ще з часів античности слугував головним джерелом бурштину для європейських ремісників. У певний час Тевтонський орден навіть установив монополію на добування цього матеріалу та запровадив суворі покарання за його незаконне збирання. Бурштинові торгові шляхи понад тисячу років єднали Балтику з майстернями Богемії, Італії та Константинополя."
  cartographic_survey_events.20.title: "Укрита бухта"
  cartographic_survey_events.20.desc: "Наш розвідувальний корабель оминув невеликий мис поблизу [target_location.Custom('LR_GEN')|l] [target_location.GetName] і став на якір у тихій, захищеній від вітру бухті, яку місцеві рибалки використовують уже багато поколінь, але якої немає на жодній мапі. Від піщаного дна до поверхні тут цілих чотири морські сажні, і місцевий лоцман запевняє, що тут за будь-якої погоди можуть стояти навіть великі кораблі. Після точніших вимірювань і встановлення орієнтирів наш флот зможе вільно користуватися цією гаванню."
  cartographic_survey_events.20.a: "Нанесемо бухту на мапу і підготуємо її до використання."
  cartographic_survey_events.20.historical_info: "Рибалки часто-густо знали про затишні стоянки, яких не було на морських мапах. Водночас вони ніяк не зберігали і не записували свої знання, а лише усно передавали їх із покоління в покоління. Згодом держави почали споряджати гідрографічні дослідження, під час яких обов’язково опитували місцевих лоцманів. Унаслідок таких робіт багато гаваней, раніше невідомих морякам, зрештою потрапили на офіційні мапи флоту."
  cartographic_survey_events.21.title: "Прохід крізь рифи"
  cartographic_survey_events.21.desc: "Наші картографи протягом двох тижнів досліджували прибережні води поблизу [target_location.Custom('LR_GEN')|l] [target_location.GetName] та міряли глибину над тамтешніми рифами, які раніше вважалися непрохідними. Під час робіт вони виявили канал завширшки щонайменше тридцять футів і завглибшки чотири морські сажні, де з уміло розставленими орієнтирами легко зможе пройти будь-який корабель. Про це дослідникам розповів місцевий лоцман, який знав про канал уже тридцять років, але досі не спромігся нікому про це сказати. Він попросив невелику платню за те, щоб позначити цей шлях на їхніх мапах."
  cartographic_survey_events.21.a: "Нанесемо канал на мапу та позначимо орієнтири."
  cartographic_survey_events.21.historical_info: "У каботажному мореплавстві раннього нового часу нерідко траплялося, що серед прибережних рифів зненацька виявляли прохідні канали. Зазвичай їх позначали за допомогою створів — навігаційних орієнтирів, розміщених на березі певним чином один відносно одного. Місцеві лоцмани часто знали про такі шляхи, але берегли ці знання в таємниці з корисливих міркувань."
  cartographic_survey_events.22.title: "Обжита бухта"
  cartographic_survey_events.22.desc: "Під час дослідження берега наші вивідачі знайшли затишну бухту неподалік [target_location.Custom('LR_GEN')|l] [target_location.GetName]. На тутешньому дні лишилися сліди від нещодавньої стоянки, а на камінні біля берега видно сліди бочок, які хтось скочував до бухти. До того ж на запитання картографів діти місцевих рибалок відповідають ухильно й явно чогось недоговорюють. Вочевидь, у цій місцині багато років орудували перемитники. Тепер її буде нанесено на наші офіційні мапи, завдяки чому бухту можна буде використовувати як для потреб флоту, так і для законної торгівлі."
  cartographic_survey_events.22.a: "Позначимо бухту та збудуємо тут невеликий митний пост."
  cartographic_survey_events.22.historical_info: "Від часів античности й аж до ранньої доби промисловости європейське узбережжя було всіяне бухтами перемитників. Запровадження у флоті берегової охорони та митних катерів, а також нанесення на мапу найбільш підозрілих стоянок зрештою загнали перемитників у дрібніші та віддаленіші бухти. Проте лише з появою залізниці, телеграфу й парових патрульних кораблів незаконна торгівля стала по-справжньому небезпечною та ризикованою справою."
  cartographic_survey_events.30.title: "Буревій зриває виправу"
  cartographic_survey_events.30.desc: "На третій день праці з південного заходу налетів буревій. Розвідувальний корабель винесло на підвітряний берег, де об нього дві холодні ночі билися дужі хвилі. Рятувальні кораблі, виряджені на допомогу картографам, також не впоралися з вітром і розсіялися, навіть не діставшись мети. Коли буря нарешті вщухла і корабель зняли з мілини, розмір лиха став очевидним: усі прилади було зіпсовано, а двоє помічників боцмана загинули і були поховані на піщаному березі. Усі зусилля команди пішли нанівець, а узбережжя поблизу [target_location.Custom('LR_GEN')|l] [target_location.GetName] так і лишилося недослідженим."
  cartographic_survey_events.30.a: "Час уже згаяно. Доведеться поки що полишити цей задум."
  cartographic_survey_events.30.historical_info: "Раптові бурі становили повсякчасну загрозу для невеликих кораблів, що досліджували узбережжя. Регулярні прогнози погоди та шкала Бофорта, розроблена для попередження про урагани, з’явилися лише в XIX столітті. Доти розвідувальні кораблі, які опинялися на підвітряному березі перед штормом, задля порятунку могли покладатися лише на вагу якоря та досвід штурмана."
  cartographic_survey_events.31.title: "Удар об непозначену мілину"
  cartographic_survey_events.31.desc: "Неподалік від [target_location.Custom('LR_GEN')|l] [target_location.GetName] наш розвідувальний корабель натрапив на мілину, якої не було позначено на наших мапах. Дно змінилося надто різко: лотлінь щойно показував глибину в чотири морські сажні, а вже за мить у носовій частині корабля з’явилася пробоїна. Поки тесляр упродовж кількох днів латав кренгований на березі корабель, картографи встигли зробити всі необхідні заміри й укласти мапу узбережжя. Роботу завершено, нехай і не без утрат."
  cartographic_survey_events.31.a: "Корабель повернеться до строю. Головне, що тепер ця мілина є на наших мапах."
  cartographic_survey_events.31.historical_info: "У минулому розвідувальні кораблі мали вельми обмежений набір приладів, тому часто сідали на мілину. Водночас подібні кораблетрощі деколи давали набагато більше корисних відомостей про навколишні води, ніж обережні дослідники, які без усякої шкоди проходили вздовж тих самих берегів. Так численні мілини й рифи з’явилися на мапах саме завдяки аваріям і дістали назви на честь кораблів, які на них наразилися."
  cartographic_survey_events.32.title: "Ворожий корабель"
  cartographic_survey_events.32.desc: "Поки наш розвідувальний корабель стояв на якорі поблизу [target_location.Custom('LR_GEN')|l] [target_location.GetName], до нього з туману зненацька попрямував озброєний корабель із латинським вітрилом і без стяга. Дослідникам довелося покинути приладдя на березі та негайно повернутися на корабель, так і не завершивши роботу. Невідомий корабель переслідував їх ще пів дня, а потім повернув назад і, вочевидь, попрямував до порту наших ворогів. Зрештою ця ділянка узбережжя так і лишилася недослідженою, і наші картографи навряд чи захочуть туди повертатися."
  cartographic_survey_events.32.a: "Якщо ці береги стереже ворог, нам там нічого робити."
  cartographic_survey_events.32.historical_info: "Дослідження чужих берегів завжди несло в собі політичні ризики, оскільки країни могли використати докладні мапи узбережжя для морського нападу. Через це розвідувальні кораблі часто переслідували місцеві озброєні судна, які або затримували їх, або змушували покинути спірні води. Гідрографічні дослідження, які англійське адміралтейство проводило біля іспанського та егейського узбереж у XVII–XVIII століттях, раз у раз уривалися саме через такі ворожі дії. Картографи настільки до цього звикли, що за перших ознак небезпеки просто викидали свої нотатки за борт, аби уникнути підозр."
  cartographic_survey_events.33.title: "Туман зриває виправу"
  cartographic_survey_events.33.desc: "Уранці другого дня звівся туман, що врешті протримався цілих три тижні. Не маючи змоги розгледіти прибережні води крізь цю густу пелену, картографи провели весь цей час за грою в кості та наріканнями на погану погоду. Харчі добігали кінця, тож [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'вирішила', 'вирішив')] достроково припинити виправу, щоб не марнувати наші засоби. У підсумку мапи так і не завершили, а заміри глибин лишилися без перевірки. Звісно ж, як на зло, усього лише за день після відплиття туман розвіявся."
  cartographic_survey_events.33.a: "Нам доведеться змиритися з цією невдачею."
  cartographic_survey_events.33.historical_info: "До появи сучасних приладів прибережні тумани постійно перешкоджали роботі розвідувальних кораблів. Тогочасні гідрографічні методи вимагали ясної погоди, аби дослідники могли чітко бачити берегові орієнтири з борту корабля. Через це виправи в туманних краях, як-от Ньюфаундленд, Північне море чи північно-західна частина Тихого океану, часто-густо проводили більше часу в очікуванні кращої погоди, ніж за самими дослідженнями."