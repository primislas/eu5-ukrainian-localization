  grand_tour_events.opportunity_accept: "Приймемо цю пропозицію."
  grand_tour_events.opportunity_commit: "Цілком присвятимо себе цьому, відклавши всі інші справи."
  grand_tour_events.opportunity_decline: "Ґречно відмовимося та вирушимо далі нашим шляхом."
  grand_tour_events.reflect_and_continue: "Поміркуємо над тим, що ми вже дізналися, і вирушимо далі."
  grand_tour_events.worth_the_delay: "і вирішимо, чи варто було заради цього зупинятися в нашій мандрівці."
  grand_tour_events.seek_audience: "Попросимо авдієнції, якщо [court_host.GetNameWithNoTooltip] зможе нас прийняти."
  grand_tour_events.seek_castle_audience: "Попросимо авдієнції в замку, якщо [court_host.GetNameWithNoTooltip] зможе нас прийняти."
  grand_tour_events.attend_university_lectures: "Відвідаємо лекції в університеті."
  grand_tour_events.prodigy_knowledge: "Нехай [target_leader.GetNameWithNoTooltip] блисне своєю вченістю."
  grand_tour_events.prodigy_connections: "Нехай [target_leader.GetNameWithNoTooltip] блисне своїми зв’язками."
  grand_tour_events.prodigy_experience: "Нехай [target_leader.GetNameWithNoTooltip] блисне своїм досвідом."
  grand_tour_events.1.title: "Велика мандрівка"
  grand_tour_events.1.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] збирається, скрині пакуються, а почет уже готовий вирушати на південь. Нас чекає #TOOLTIP:REGION,italy_region,X #L Італія#!#! — край античних руїн, знань доби #TOOLTIP:INSTITUTION,renaissance,X #L Відродження#!#! та дворів, перед чиїм витонченим мистецтвом політики ми видаємося недосвідченими юнцями. Усе, чого там навчиться [ROOT.GetCountry.GetGovernment.GetHeirTitle|l], визначатиме долю нашої країни на ціле покоління вперед. Залишається лише вирішити, яку саме освіту ми маємо намір [Select_CString(target_leader.IsFemale, 'їй', 'йому')] дати."
  grand_tour_events.1.a: "При #TOOLTIP:REGION,italy_region,X #L італійських#!#! дворах [Select_CString(target_leader.IsFemale, 'вона', 'він')] дізнається те, чого не знайти в жодній книзі."
  grand_tour_events.1.party: "Улаштуйте наостанок бенкет, перш ніж вирушити в дорогу. І не шкодуйте грошей."
  grand_tour_events.2.desc.geography_intro: "[target_location.GetName] — це [target_location.GetRank.GetName|l], що немов усупереч самій географії здіймається посеред багна й живе завдяки торгівлі. Ним править рада купецьких родин, яка пережила всі #TOOLTIP:CONTINENT,europe,X #L європейські#!#! династії."
  grand_tour_events.2.desc.ducal_palace: "А над лагуною рожевіє розкішний палац дожів — наочне втілення вишуканости та багатства."
  grand_tour_events.2.desc.heir_arrival: "[ROOT.GetCountry.GetGovernment.GetHeirTitle] прибуває туди, де розкинулося, либонь, найкосмополітичніше [target_location.GetRank.GetNameWithNoTooltip|l] у #TOOLTIP:CONTINENT,europe,X #L Європі#!#!. На його ринках можна почути всі мови Середземномор’я, а за певну плату — добути будь-які відомості."
  grand_tour_events.2.title: "[target_location.GetNameWithNoTooltip] — Сереніссіма"
  grand_tour_events.2.desc: "$grand_tour_events.2.desc.geography_intro$ #TOOLTIP:BUILDING_TYPE,venetian_arsenal,X #L Арсенал#!#! займає весь східний квартал Венеції. Його майстри можуть закласти кіль військового корабля та завершити його спорудження за один робочий день. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
  grand_tour_events.2.desc.no_arsenal: "$grand_tour_events.2.desc.geography_intro$ Решта корабелень східного кварталу споруджують торгові кораблі та бойові галери у звичному для #TOOLTIP:CONTINENT,europe,X #L європейських#!#! портів неквапливому ритмі. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
  grand_tour_events.2.knowledge: "Вивчіть кораблебудування у Венеційському арсеналі."
  grand_tour_events.2.experience: "Огляньте корабельні, де споруджують бойові галери [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
  grand_tour_events.2.connections: "Відвідайте прийом, який влаштовує [court_host.GetNameWithNoTooltip]."
  grand_tour_events.2.party: "Відкладемо облікові книги та проведемо ніч у товаристві гультяїв на каналах."
  grand_tour_events.2.historical_info: "Під час тижня Вознесіння 1645 року англієць Джон Івлін, який подорожував Францією та Італією, відвідав оперу #italic «Ercole in Lidia»#!, або #italic «Геракл у Лідії»#!, в одному з громадських театрів Венеції. У щоденнику він захоплювався тим, що декорації змінювалися тринадцять разів, і особливо відзначив сопрано Анну Ренці. Проте співак-кастрат справив на нього ще більше враження, а генуезького баса Івлін назвав «незрівнянним». Розписні декорації, що створювали ілюзію перспективи, та механізми, які підіймали постаті над сценою, заворожили всіх, а вистава, за його словами, «тримала наші вуха й очі в полоні до другої години ночі». Наступної весни Івлін залишив Венецію та повіз із собою скрині з книгами, гравюрами й посудинами зі славетним венеційським теріаком."
  grand_tour_events.3.title: "[target_location.GetNameWithNoTooltip], [target_location.GetRank.GetNameWithNoTooltip] Відродження"
  grand_tour_events.3.desc: "[target_location.GetName] поступається своїй славі розмірами, проте перевершує її своєю незвичністю. [target_location.GetRank.GetName] дихає новими ідеями: філософи говорять про відродження античности, купці вбачають у ньому вигідне місце для торгівлі, а живописці захоплюються тим, як світло лягає на тиньковані стіни. [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибуває й дізнається, що сьогодні ввечері двір дає прийом для чужоземних гостей, якщо тільки [target_leader.GetSheHe|l] не надто [Select_CString(target_leader.IsFemale, 'втомилася', 'втомився')] дорогою.\n\nЄ й окреме запрошення — відвідати монастирську книгозбірню, де зберігається найдивовижніша в усьому західному християнському світі збірка #TOOLTIP:CULTURE,$greek_culture_tt$,X #L грецьких#!#! рукописів."
  grand_tour_events.3.knowledge: "Попросимо відрекомендувати нас ученим монастиря."
  grand_tour_events.3.experience: "Оглянемо майстерні, де обробляють вовну, та крамниці золотарів на Понте-Веккйо."
  grand_tour_events.3.connections: "Опануємо мистецтво опіки, яким славиться [court_host.GetNameWithNoTooltip|l]."
  grand_tour_events.3.party: "Забудемо на деякий час про рукописи та випробуємо долю за гральними столами [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
  grand_tour_events.3.historical_info: "Восени 1764 року занедужалий шотландський романіст Тобіас Смоллетт оглядав галерею Уффіці. Стоячи перед Венерою Медицейською, якою решта учасників Великої подорожі захоплювалася ніби за спільною домовленістю, він написав: «Не можу позбутися думки, що в рисах Венери немає жодної краси, а її поза незграбна й геть не відповідає її образу». Згодом Лоренс Стерн увічнив цей різкий вислів. У його книзі вигаданий персонаж Йорік докоряє Смельфунґусу перед Пантеоном у Римі й обурюється, що той «непристойно вилаяв богиню та повівся з нею гірше, ніж із вуличною дівкою, без найменшого на те приводу». Їхня суперечка через мармурову Венеру пережила обох."
  grand_tour_events.4.title: "[target_location.GetNameWithNoTooltip] — Вічне місто"
  grand_tour_events.4.desc: "[target_location.GetName] існує водночас у двох добах. Простягся просто неба серед зимової трави Форум: його колони стоять під химерними кутами посеред пасовищ, а мармур звідси століттями вивозили будівничі, яким був потрібен камінь. Над руїнами височіє церква, якій судилося стати престолом усього християнського світу. Вона підноситься над самісіньким серцем сучасного #L #TOOLTIP:LOCATIONRANK,[target_location.GetRank.Custom('LR_tt')],X [target_location.GetRank.Custom('LR_GEN')|l]#!#!.\n\n[target_leader.GetName] може провести час серед руїн або серед живих. Папський двір береже вікові звичаї, вирізняється суворим церемоніалом і підтримує зв’язки з усіма #TOOLTIP:RELIGION,$catholic_tt$,X #L католицькими#!#! країнами #TOOLTIP:CONTINENT,europe,X #L Європи#!#!."
  grand_tour_events.4.knowledge: "Дослідимо рукописи Ватиканської книгозбірні та поспілкуємося з місцевими гуманістами."
  grand_tour_events.4.experience: "Прогуляємося серед античних руїн і обміряємо стародавні пам’ятки."
  grand_tour_events.4.connections: "$grand_tour_events.seek_audience$"
  grand_tour_events.4.party: "Забудемо на одну ніч про руїни та проведемо час у винних крамницях [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
  grand_tour_events.4.historical_info: "15 жовтня 1764 року англієць Едвард Ґіббон, який завершував свою Велику подорож Італією, сидів у роздумах серед руїн на Капітолійському пагорбі. Босоногі ченці співали вечірню в будівлі, яку він сприйняв за стародавній храм Юпітера. Згодом у своїх спогадах Ґіббон писав, що саме там, серед уламків колон і вечірнього співу, що стихав, «мені вперше спало на думку написати про занепад і руйнування міста». Задум, що виник того єдиного вечора в Римі, за наступні двадцять років досліджень в Англії поступово виріс у працю під назвою #italic «Історія занепаду та падіння Римської імперії»#!."
  grand_tour_events.5.title: "[target_location.GetNameWithNoTooltip], [target_country.GetLongNameWithNoTooltip]"
  grand_tour_events.5.desc: "[target_location.GetName] — найпівденніша точка Великої подорожі та найстаріший серед #TOOLTIP:CULTUREGROUP,italian_group,X #L італійських#!#! великих дворів. Цей [target_location.GetRank.GetName|l] з мільйонним людом розкинувся в тіні Везувію. У його вигляді #TOOLTIP:CULTURE,$greek_culture_tt$,X #L грецька#!#! спадщина нашаровується на #TOOLTIP:CULTURE,$roman_culture_tt$,X #L римську#!#! та норманську, а також на спадщину тих, хто панував тут пізніше. Кожне завоювання залишило свій слід в архітектурі — треба лише вміти його розпізнати. [target_country.GetAdjective|l]ий двір зустрічає гостей настільки пишною церемонією, що двори Північної #TOOLTIP:CONTINENT,europe,X #L Європи#!#! на його тлі здаються тимчасовими прихистками.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] уже [Select_CString(target_leader.IsFemale, 'побувала', 'побував')] у #TOOLTIP:LOCATION,venice,X #L Венеції#!#!, #TOOLTIP:LOCATION,florence,X #L Флоренції#!#! та #TOOLTIP:LOCATION,rome,X #L Римі#!#!. Це останній урок."
  grand_tour_events.5.knowledge: "Присвятимо останні тижні відвідинам книгозбірень і стародавніх руїн."
  grand_tour_events.5.experience: "Візьмемо участь у розкопках похованого під попелом Геркуланума."
  grand_tour_events.5.connections: "Проведемо останні тижні при дворі. [court_host.GetNameWithNoTooltip] того варт[Select_CString(court_host.IsFemale, 'а', 'ий')]."
  grand_tour_events.5.party: "Забудемо про уроки заради останньої ночі в шинках [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
  grand_tour_events.5.historical_info: "У січні 1786 року Гестер Піоцці підіймалася на Везувій, тримаючись за мотузку поруч зі своїм провідником Бартоломео на прізвисько «Циклоп Везувію». На півдорозі вона вирішила перепочити біля келії місцевого самітника. Француз, що жив там, зненацька впізнав її та запитав: «Хіба я не зустрічав вас раніше, мадам? Так, точно зустрічав. Я ж навіть робив вам зачіску, коли працював перукарем у Лондоні». Довідавшись, що чотирирічний хлопчик із її супутників уже дістався краю кратера, присоромлена Піоцці продовжила сходження на вулкан, аби на власні очі побачити кратер Везувію, що димів. Згодом вона описала цю зустріч у своїх подорожніх нотатках."
  grand_tour_events.6.title: "[target_location.GetNameWithNoTooltip] — Місто стародавньої Арени"
  grand_tour_events.6.desc: "[target_location.GetName] височіє біля закруту річки. Цей [target_location.GetRank.GetName|l] розкинувся в довгій тіні амфітеатру, старішого за будь-який двір в #TOOLTIP:REGION,italy_region,X #L Італії#!#!. Римська арена збереглася майже цілком — її кам’яні яруси здіймаються над дахами будинків. Тепер тут влаштовують ринки та ярмарки, а в рідкісні святкові дні проходять видовища, які віддалено нагадують ігри, заради яких арену колись збудували.\n\nУ [target_location.Custom('LR_PREP')|l] [target_location.GetName] є не лише руїни, а й лекційні зали, а місцевий двір із нетерпінням чекає, коли [ROOT.GetCountry.GetGovernment.GetHeirTitle|l] знайде час відрекомендуватися."
  grand_tour_events.6.knowledge: "Оглянемо римські руїни й ознайомимося зі стародавніми інженерними рішеннями будівничих арени."
  grand_tour_events.6.experience: "Оглянемо мармурові кар’єри й ознайомимося з річковою торгівлею на Адідже."
  grand_tour_events.6.connections: "[court_host.GetNameWithNoTooltip] запрошує нас здійснити візит. Крім того, можна відвідати найвпливовіші родини [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
  grand_tour_events.6.party: "Залишимо огляд амфітеатру на потім і проведемо ніч у шинках унизу."
  grand_tour_events.6.historical_info: "Прибувши до Верони у квітні 1785 року, Гестер Піоцці відчула, як її серце «помітно розширилося» від захвату, коли вона побачила настільки добре збережений римський амфітеатр. Згодом вона назвала його «найжвавішим на вигляд містом, у якому мені доводилося жити». Провідник, який знайомив її зі старожитностями Філармонічної академії, запевняв її, що англійські мармури Арундела занапастила вугільна кіптява. Проте вона розпізнала в його словах дослівну цитату з путівника #italic «Ілюстрована Верона»#!, яку той просто вивчив напам’ять. У своїх оприлюднених подорожніх нотатках вона назвала цей обман «malafede і вельми безглуздим упередженням»."
  grand_tour_events.7.title: "[target_location.GetNameWithNoTooltip] — Ідеальне місто"
  grand_tour_events.7.desc: "[target_location.GetName] не здається витвором випадку — бо таким і не є. Широкі прямі проспекти перетинають [target_location.GetRank.GetName|l], утворюючи планування, яке ніколи не склалося б само собою в середньовічному місті. Місто продумане заздалегідь, щоб бути не лише зручним для життя, а й тішити око. Герцогський театр, друкарні та поети, що збираються при дворі, служать одній меті — перетворити цей невеликий [target_location.GetRank.GetNameWithNoTooltip|l] на зразок містобудування майбутнього.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] прибуває до двору, де поезією цікавляться не менше, ніж мистецтвом врядування."
  grand_tour_events.7.knowledge: "Погортаємо лицарські романи, що зберігаються в герцогській книгозбірні."
  grand_tour_events.7.experience: "Огляньте герцогську зброярню та шлюзи на каналах [target_location.GetRank.Custom('LR_GEN')|l]."
  grand_tour_events.7.connections: "[court_host.GetNameWithNoTooltip] влаштовує виставу, варто і її відвідати."
  grand_tour_events.7.party: "Забудьмо на якийсь час про герцогські вірші та пошукаймо гучніших розваг."
  grand_tour_events.7.historical_info: "У квітні 1817 року лорд Байрон, який подорожував Італією, відвідав лікарню Святої Анни у Феррарі. Там йому показали тісну камеру, де, за переказом, у 1580-х роках герцог Альфонсо II д’Есте ув’язнив поета Торквато Тассо, визнавши його божевільним. Ця пам’ятка минулого справила на Байрона значно сильніше враження, ніж пам’ятник Аріосто неподалік. Наступного дня він написав «Плач Тассо» — драматичний монолог, що передає розпач поета. Відвідини лікарні стали одним із найвідоміших паломництв Великої подорожі доби романтизму, закріпивши в уяві мандрівників образ занепалого двору д’Есте у Феррарі."
  grand_tour_events.8.title: "[target_location.GetNameWithNoTooltip] — Вчене місто"
  grand_tour_events.8.desc: "У [target_location.GetRank.Custom('LR_PREP')|l] [target_location.GetName] право та мистецтво диспуту викладають довше, ніж будь-де у християнському світі. [target_location.GetRank.GetName] відкрито виставляє напоказ свою вченість: його портики повні студентів із різних країн, а лекційні зали старіші за більшість довколишніх церков. [ROOT.GetCountry.GetGovernment.GetHeirTitle] може прожити тут усе життя і все одно не перечитати всіх праць, написаних видатними правознавцями.\n\nЄ тут і двір, вартий уваги, якщо політика цікавить нас більше, ніж право."
  grand_tour_events.8.knowledge: "Відвідаймо лекцію з цивільного права в університеті."
  grand_tour_events.8.experience: "Огляньмо шовкові мануфактури, завдяки яким тканини [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip] зажили слави."
  grand_tour_events.8.connections: "$grand_tour_events.seek_audience$"
  grand_tour_events.8.party: "Залишмо лекції на потім і згаймо час за вином зі студентами."
  grand_tour_events.8.historical_info: "У 1739 році французький правник Шарль де Бросс, який подорожував Італією, провів вечір у Болоньї в гостях у Лаури Бассі, яка на той час зажила слави першої жінки в Європі, що очолила університетську кафедру. У її домі збиралися місцеві вчені, щоб обговорити питання такої нової науки, як електрика. Згодом де Бросс згадував, як йому довелося освіжити призабуті шкільні знання латини, щоб разом із присутніми міркувати про магнетизм та «незвичайне притягання наелектризованих тіл». Він описав цей вечір у своїх #italic «Листах, написаних з Італії»#!, а салон Бассі став одним із найвідвідуваніших місць для учасників Великої подорожі, які приїздили до Болоньї."
  grand_tour_events.9.title: "[target_location.GetNameWithNoTooltip] — Місто Паліо"
  grand_tour_events.9.desc: "[target_location.GetName] розкинувся на трьох пагорбах довкола площі, що обрисами нагадує мушлю. Собор зі смугастим облицюванням видно з кожної вулиці, яка підіймається до нього. [target_location.GetRank.GetName] розбагатів завдяки торгівлі #TOOLTIP:GOODS,wool,X #L вовною#!#! та банківській справі, перш ніж #TOOLTIP:LOCATION,florence,X #L Флоренція#!#! зуміла затьмарити його славу. Сієна так і не змирилася з втратою колишнього становища, і це суперництво й досі відчувається в кожній розмові при дворі.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] прибуває саме до кінних перегонів, які двічі на рік проходять на площі, прикрашеній знаменами."
  grand_tour_events.9.knowledge: "Відвідаймо лекцію з канонічного права в університеті."
  grand_tour_events.9.experience: "Огляньмо фрески та погортаймо славетні банківські книги [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
  grand_tour_events.9.connections: "Поспостерігаймо за перегонами з лоджії, яку зазвичай займає [court_host.GetNameWithNoTooltip]."
  grand_tour_events.9.party: "Відкладімо огляд фресок заради гральних столів на Кампо."
  grand_tour_events.9.historical_info: "Восени 1764 року романіст Тобіас Смоллетт, який прямував із Флоренції до Рима, зупинився на ніч у Сієні. У своїй книзі #italic «Подорожі Францією та Італією»#! він роздратовано скаржився, що його «оселили в будинку, який просмердів виходком», а «за вечерею годували геть погано». Водночас Смоллетт визнавав, що місто «велике та добре розбудоване», і зазначав, що сієнці настільки «пишаються своєю ґречністю та чистотою свого діалекту», що іноземні мандрівники зупинялися в Сієні зумисне, аби навчитися правильної італійської вимови. Розповідь Смоллетта стала однією з найвідоміших англійських скарг на гостинність Тоскани в добу Великої подорожі."
  grand_tour_events.10.title: "[target_location.GetNameWithNoTooltip] — Місто Похилої вежі"
  grand_tour_events.10.desc: "[target_location.GetName] звів дзвіницю, яка почала хилитися, але замість того, щоб знести її, продовжив будівництво. Тепер [target_location.GetRank.GetName|l] пишається її нахилом, а не вважає його вадою. Колись Піза була морською державою, що нарівні змагалася з #TOOLTIP:LOCATION,genoa,X #L Генуєю#!#! та #TOOLTIP:LOCATION,venice,X #L Венецією#!#!. Проте від колишнього флоту не лишилося й сліду. Натомість місто розжилося університетом і соборною площею.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] може присвятити тут час навчанню або прогулятися гаванню, яка колись відігравала важливу роль."
  grand_tour_events.10.knowledge: "Відвідаймо лекції в університеті на соборній площі."
  grand_tour_events.10.experience: "Огляньмо старий арсенал і майстерні чинбарів на берегах Арно."
  grand_tour_events.10.connections: "[court_host.GetNameWithNoTooltip] влаштовує прийом, варто завітати та відрекомендуватися."
  grand_tour_events.10.party: "Втечемо з лекції заради ночі в шинках біля гавані."
  grand_tour_events.10.historical_info: "Наприкінці 1821 року Персі та Мері Шеллі оселилися в Пізі та переконали лорда Байрона приєднатися до них, поселивши його в Палаццо Ланфранкі на набережній Лунгарно. Разом з Едвардом і Джейн Вільямс, а згодом і Едвардом Трелоні, вони утворили спільноту, яка пізніше дістала назву «Пізанський гурток». Байрон привіз із собою коней, собак і мавп, а учасники гуртка провели зиму, обмірковуючи плани літературного часопису #italic «Ліберал»#!. Лі Гант дістався Італії лише наступного літа і зійшов на берег лише за кілька днів до того, як у липні Шеллі втопився біля узбережжя Тоскани. За кілька місяців створений Шеллі в Пізі гурток розпався, залишивши місту одне з найпам’ятніших місць в історії романтизму."
  grand_tour_events.11.title: "[target_location.GetNameWithNoTooltip] — Місто Святого Франциска"
  grand_tour_events.11.desc: "[target_location.GetName] розкинувся на зеленому схилі пагорба довкола базиліки, де спочивають мощі його славетного уродженця — ченця, який зрікся всього мирського й перетворив [target_location.GetRank.GetName|l] на одне з головних місць паломництва на Заході. Фрески, що вкривають стіни базиліки, приваблюють малярів не менше, ніж прочан.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] може присвятити час вивченню фресок або спілкуванню з ченцями, які й досі живуть за уставом свого ордену."
  grand_tour_events.11.knowledge: "Вивчимо фрески та житіє святого."
  grand_tour_events.11.experience: "Огляньмо майстерні, де виготовляють предмети шанування та пам’ятні знаки для прочан."
  grand_tour_events.11.connections: "[court_host.GetNameWithNoTooltip] та міські урядники не проти з нами познайомитися. Не будемо змушувати їх довго чекати."
  grand_tour_events.11.party: "Проміняємо товариство ченців на веселіший вечір у місті."
  grand_tour_events.11.historical_info: "Увечері 26 жовтня 1786 року Йоганн Вольфґанґ фон Ґете прибув до Ассізі. У своїй #italic «Італійській подорожі»#! він згадував, як відвернувся від «величезного нагромадження церков, поставлених одна на одну, немов Вавилонська вежа», де спочивали мощі святого Франциска, відкрито висловивши огиду до цього місця прощництва. Натомість він піднявся до римського храму Мінерви на майдані старого міста й назвав його «першою цілою пам’яткою античности, яку я будь-коли бачив». Те, що Ґете віддав перевагу язичницькому храму над найвідомішою святинею Ассізі, стало одним із найразючіших особистих суджень, що дійшли до нас із часів Великої подорожі."
  grand_tour_events.12.title: "[target_location.GetNameWithNoTooltip] — Етруське місто"
  grand_tour_events.12.desc: "[target_location.GetName] височіє на пагорбі за мурами, що їх звели етруски задовго до піднесення Рима. Жителі [target_location.GetRank.Custom('LR_GEN')|l] і досі проходять крізь стародавню браму, не замислюючись про її історію. Останнім часом тутешні живописці уславилися по всій #TOOLTIP:REGION,italy_region,X #L Італії#!#!, а в університеті, як і колись, повні лекційні зали.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] може присвятити час вивченню стародавніх мурів або знайомству з новими картинами відповідно до своїх зацікавлень."
  grand_tour_events.12.knowledge: "Відвідаємо університет і пройдемося давніми етруськими мурами."
  grand_tour_events.12.experience: "Оглянемо гончарні майстерні, що прославилися виробами з майоліки."
  grand_tour_events.12.connections: "[court_host.GetNameWithNoTooltip] влаштовує прийом — попросимо відрекомендувати нас при дворі."
  grand_tour_events.12.party: "Забудемо про стародавні мури заради ночі в шинках, де збираються студенти."
  grand_tour_events.12.historical_info: "На початку 1765 року романіст Тобіас Смоллетт повертався з Рима до Флоренції, коли його екіпаж розпочав крутий підйом до Перуджі. Знесилені коні не давали ради важкій кареті й почали сунутися назад, тягнучи її до краю урвища. В останню мить перехожий підклав великий камінь під одне з коліс і зупинив повіз, чим урятував усіх подорожніх від того, щоб, за словами самого Смоллетта, «розбитися на друзки». Оскільки того дня перекладних коней годі було знайти, Смоллеттові та його родині довелося заночувати в місті. Вони відвідали місцеві церкви й оглянули картини П’єтро Перуджино, славетного уродженця цих місць, а потім продовжили мандрівку до Флоренції."
  grand_tour_events.13.title: "[target_location.GetNameWithNoTooltip] — Місто на Дунаї"
  grand_tour_events.13.desc: "[target_location.GetName] тримає переправу через річку, біля якої сходяться шляхи з #TOOLTIP:REGION,italy_region,X #L Італії#!#!, з #TOOLTIP:REGION,balkan_region,X #L Балкан#!#! та з #TOOLTIP:LANGUAGE,german_language,X #L німецьких#!#! земель. Мита принесли [target_location.GetRank.Custom('LR_DAT')|l] [target_location.GetRank.GetName] чимале багатство. В самісінькій середині височіє герцогський палац Гофбург, де перебуває двір, що зазіхає на значно більше, ніж становище суто місцевого володаря.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] нарешті перетинає Альпи. Тепер дороги стануть рівнішими, а шлях — легшим."
  grand_tour_events.13.knowledge: "Відвідаємо соборні школи й познайомимося з міськими вченими."
  grand_tour_events.13.experience: "Оглянемо арсенал і човнові пристані вздовж Дунаю."
  grand_tour_events.13.connections: "[court_host.GetNameWithNoTooltip] влаштовує прийом у Гофбургу, варто відрекомендуватися."
  grand_tour_events.13.party: "Відкладемо навчання в соборних школах заради ночі на берегах Дунаю."
  grand_tour_events.13.historical_info: "У 1775 році лікар Джон Мур подорожував Віднем як супутник юного герцога Гамільтона. Спершу їх прийняв на приватній аудієнції імператор Йосиф II, а згодом вони удостоїлися прийому в самої імператриці Марії Терезії в Шенбруннському палаці. Мур зауважив, що легендарна манірність двору розвіялася, коли державний канцлер князь Кауніц помітив серед подорожніх чотирнадцятирічного сина Мура й наполіг, аби імператор та імператриця прийняли і хлопця. Мур записав і давню придворну оповідку про спалах віспи, що вразила родину Габсбургів вісьмома роками раніше. Дізнавшись про хворобу, одна з дочок імператриці зажадала дзеркало і, зберігаючи повну стриманість, попрощалася з красою, яку недуга невдовзі мала в неї забрати."
  grand_tour_events.14.title: "[target_location.GetNameWithNoTooltip] — Золоте місто"
  grand_tour_events.14.desc: "[target_location.GetName] розкинувся по обидва береги Влтави. Кам’яний міст сполучає Старе місто із замковим пагорбом, а [target_location.GetRank.GetName|l] тримається так, ніби є столицею імперії. Університет на пагорбі вабить спудеїв з усіх куточків #TOOLTIP:LANGUAGE,german_language,X #L німецьких#!#! земель та з-за їхніх меж.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] опиняється в місті, яке міряє власну вагу століттями, а не роками."
  grand_tour_events.14.knowledge: "Відвідаємо лекції в університеті на пагорбі."
  grand_tour_events.14.experience: "Оглянемо скловарні та майстерні золотарів на Золотій вуличці."
  grand_tour_events.14.connections: "$grand_tour_events.seek_castle_audience$"
  grand_tour_events.14.party: "Пропустимо заняття в університеті заради ночі в шинках на річці."
  grand_tour_events.14.historical_info: "У 1775 році лікар Джон Мур супроводжував юного герцога Гамільтона в подорожі Богемією. Коли вони стояли на одній із празьких вулиць, їхню розмову почув священник однієї з міських семінарій, що саме проходив повз. «Запевняю вас, я теж ірландець», — мовив він. Коли його спитали, як йому вдалося так швидко здогадатися про їхнє походження, панотець відповів, що зрозумів усе, щойно почув англійську мову. До кінця їхнього перебування в Празі він став для них провідником і, серед іншого, показав їм вікно канцелярії, з якого 1618 року викинули двох шляхтичів та їхнього писаря. Мур із сухою іронією зауважив, що цей звичай варто було б порадити державним діячам усюди."
  grand_tour_events.15.title: "[target_location.GetNameWithNoTooltip] — Місто ченців"
  grand_tour_events.15.desc: "[target_location.GetName] дістав свою назву від ченців, чия обитель стояла тут іще до того, як герцоги заснували поруч торг і карбівню. Відтоді [target_location.GetRank.GetName|l] значно розрісся. Герцогський двір Віттельсбахів підтримує в [target_location.GetRank.Custom('LR_PREP')|l] лад краще, ніж у багатьох інших містах, а місцеві броварі справно забезпечують містян своїм напоєм.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] знайде тут і вчених людей, і добре влаштований двір."
  grand_tour_events.15.knowledge: "Відвідаємо соборні школи й познайомимося з міськими літописцями."
  grand_tour_events.15.experience: "Оглянемо герцогський арсенал і соляні комори."
  grand_tour_events.15.connections: "[court_host.GetNameWithNoTooltip] влаштовує прийом при герцогському дворі, варто відрекомендуватися."
  grand_tour_events.15.party: "Відкладемо літописи заради ночі в товаристві броварів."
  grand_tour_events.15.historical_info: "У 1786 році письменниця Естер Лінч Пйоцці вирушила разом із чоловіком у тривалу весільну подорож Європою. На світанку, після нічного переходу через Альпи з Інсбрука, подружжя прибуло до Мюнхена й пішло оглядати картинну галерею курфюрста та його кабінет дивовиж. Серед див, які показав їй місцевий збирач старожитностей, було мініатюрне зображення Богоматері з Немовлям, зроблене з матеріалу, схожого на скручене павутиння. Воно було настільки тонким, що зображені постаті годі було розгледіти неозброєним оком — їх можна було побачити лише під мікроскопом. Пйоцці із захопленням описала побачене, дивуючись тому, скільки праці потребувало створення настільки витонченого й непрактичного витвору."
  grand_tour_events.16.title: "[target_location.GetNameWithNoTooltip] — Місто на Сені"
  grand_tour_events.16.desc: "[target_location.GetName] розкинувся обабіч річки навколо острова, на якому височіє величний собор. [target_location.GetRank.GetName] більший майже за всі міста, які [ROOT.GetCountry.GetGovernment.GetHeirTitle|l] і свита встигли побачити за час цієї мандрівки. В університетському кварталі на лівому березі богослов’я та право вивчає більше студентів, ніж мешканців налічує більшість міст.\n\nКоролівський двір приймає гостей із такою урочистістю, що його висока думка про себе не викликає жодних сумнівів."
  grand_tour_events.16.knowledge: "Відвідаємо вчені диспути в університеті на лівому березі."
  grand_tour_events.16.experience: "Завітаємо до палітурних майстерень і друкарень неподалік від університету. "
  grand_tour_events.16.connections: "$grand_tour_events.seek_audience$"
  grand_tour_events.16.party: "Відмовимося від диспутів заради посиденьок у шинках на лівому березі."
  grand_tour_events.16.historical_info: "У жовтні 1763 року, під час свого перебування в Парижі, романіст Тобіас Смоллетт побачив дорогою до Шуазі найману карету і те, як із неї вистрибнули п’ятеро чи шестеро озброєних чоловіків. Кожен зайняв позицію за окремим деревом. Вважаючи, що це розбійники з великої дороги чи вартові, які переслідують злочинця, Смоллетт запитав у слуги, хто вони такі. Виявилося, що це панове, які приїхали з міста на одноденне полювання на зайців: сховавшись за деревами, вони стріляли в будь-яку дичину, що пробігала повз них. Усе це видовище видалося Смоллетту гротескним, і він іронічно зауважив, що принаймні в такий спосіб можна напрочуд дієво очистити поле від зайців."
  grand_tour_events.17.title: "[target_location.GetNameWithNoTooltip] — Місто ярмарків"
  grand_tour_events.17.desc: "[target_location.GetName] стоїть біля злиття двох річок, і [target_location.GetRank.GetName|l] перетворив це вигідне розташування на джерело багатства. На королівські ярмарки сюди з’їжджаються купці з #TOOLTIP:REGION,italy_region,X #L Італії#!#!, #TOOLTIP:CULTUREGROUP,german_group,X #L німецьких#!#! земель та Фландрії. У ярмаркові дні вулиці заповнюються торговцями #TOOLTIP:GOODS,silk,X #L шовком#!#! та #TOOLTIP:GOODS,dyes,X #L барвниками#!#!. Краму прибуває більше, ніж здатні вмістити міські комори. Місцеві друкарні працюють майже так само швидко, як ткачі тчуть тканини.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] прибуває до міста, життя якого визначається торгівлею, а не придворними церемоніями."
  grand_tour_events.17.knowledge: "Розшукаємо поетів-гуманістів, які збираються в друкарнях."
  grand_tour_events.17.experience: "Відвідаємо друкарні та дослідимо купецькі книги обліку."
  grand_tour_events.17.connections: "[court_host.GetNameWithNoTooltip] запрошує нас завітати з візитом. Крім того, можна відвідати найбагатших купців [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
  grand_tour_events.17.party: "Відкладемо облікові книги та проведемо ніч у товаристві гуляк."
  grand_tour_events.17.historical_info: "У жовтні 1763 року романіст Тобіас Смоллетт прибув до Ліона дорогою на південь, до Італії. Свої враження він виклав у листах, згодом опублікованих у книзі #italic «Подорожі Францією та Італією»#!. Спершу його спрямували до мебльованих кімнат, де не виявилося вільних місць. В іншому заїзді з нього зажадали дванадцять ліврів на день за три вбогі кімнати і ще тридцять два ліври за харчі. Обурений відвертим здирництвом, він мовчки вийшов і поїхав до іншого готелю. Його розповідь про ліонські заїзди, які завищували ціни, стала одним із найбільш цитованих уривків книги та перетворилася на улюблений привід для нарікань англійських мандрівників, які прямували до Італії."
  grand_tour_events.18.title: "[target_location.GetNameWithNoTooltip] — Перехрестя доріг"
  grand_tour_events.18.desc: "[target_location.GetName] завдячує своєю назвою дорогам, які перетинаються тут. [target_location.GetRank.GetName] і донині слугує місцем їхнього перетину, розкинувшись обабіч річки, яка розділяє #TOOLTIP:LANGUAGE,french_language,X #L франкомовні#!#! та #TOOLTIP:LANGUAGE,german_language,X #L німецькомовні#!#! землі. Шпиль міського собору височіє над усім, що [ROOT.GetCountry.GetGovernment.GetHeirTitle|l] і свита бачили за час мандрівки. У собору лише одна вежа: другу, замислену їй до пари, так і не звели.\n\nВільне місто порядкує собою саме, а його друкарі останнім часом набули не меншої ваги, ніж купці."
  grand_tour_events.18.knowledge: "Відвідаємо лекцію в гімназії Йоганнеса Штурма."
  grand_tour_events.18.experience: "Піднімемося на соборну вежу та оглянемо друкарні."
  grand_tour_events.18.connections: "[court_host.GetNameWithNoTooltip] і міська рада влаштовують прийом, на який нас запрошено."
  grand_tour_events.18.party: "Відкладемо відвідини друкарень заради ночі в шинках під соборним шпилем."
  grand_tour_events.18.historical_info: "На початку 1770-х років шотландський лікар Джон Мур подорожував континентальною Європою як супутник герцога Гамільтона. У Страсбурзі він піднявся на шпиль собору заввишки 466 футів і згодом описав ці відвідини в книзі #italic «Погляд на суспільство та звичаї Франції, Швейцарії та Німеччини»#!. Мур згадував, як разом із натовпом роззяв очікував прибуття на месу позашлюбного сина Людовика XV. Проте полудень настав раніше, ніж з’явився вельможа, і люди розійшлися, так і не почувши служби. Згодом Мур почув палку проповідь про тиранію пристрастей. Він також згадав про величезний соборний ріг, у який щоночі сурмили на пам’ять про змову, з якою місцеві провідники й досі пов’язували різанину, що сталася чотириста років тому."
  grand_tour_events.19.title: "[target_location.GetNameWithNoTooltip] — Брама Середземномор’я"
  grand_tour_events.19.desc: "[target_location.GetRank.GetName] [target_location.GetName] був портом ще до заснування Рима. Його заснували #TOOLTIP:CULTURE,$greek_culture_tt$,X #L грецькі#!#! мореплавці, які побачили гавань і вирішили залишитися тут назавжди. І донині в кожному його куточку пахне сіллю та дьогтем. Біля набережних тісниться безліч галер з усього Середземномор’я, а на ринках продають товари, яким не судилося потрапити до внутрішніх земель #ONCLICK:COUNTRY,[GetCountry('FRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('FRA').GetKey],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#!.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] побачить, що справжнім господарем [target_location.GetRank.Custom('LR_GEN')|l] залишається море."
  grand_tour_events.19.knowledge: "Дослідимо написи, що нагадують про грецьких засновників [target_location.GetRank.Custom('LR_GEN')|l]."
  grand_tour_events.19.experience: "Відвідаємо гавань і поговоримо зі середземноморськими моряками."
  grand_tour_events.19.connections: "[court_host.GetNameWithNoTooltip] влаштовує прийом, на який варто завітати."
  grand_tour_events.19.party: "Проміняємо світські пересуди на ніч у шинках біля причалів."
  grand_tour_events.19.historical_info: "У травні 1765 року романіст Тобіас Смоллетт прибув до Марселя, повертаючись через Прованс. Свої враження від портового міста він виклав у листах, згодом опублікованих у книзі #italic «Подорожі Францією та Італією»#!. Прогулюючись набережною гавані, Смоллетт спостерігав за галерними невільниками, яких корона здавала внайми для роботи в невеличких орендованих крамницях. Вони працювали шевцями, сріблярами та книгарями і, попри те, що їх приковували ланцюгом за одну ногу, вони, за його спостереженнями, жили непогано та виглядали життєрадісними. Смоллетт визнав Марсель величним і квітучим містом, хоча й нарікав, що господарі заїздів брали з нього по чотири ліври з людини за кожну трапезу."
  grand_tour_events.20.title: "[target_location.GetNameWithNoTooltip] — Місто Августа"
  grand_tour_events.20.desc: "[target_location.GetName] носить ім’я імператора, який його заснував, і відтоді [target_location.GetRank.GetName|l] невпинно росте. Місцеві банкірські доми орудують сумами, на тлі яких скарбниці деяких королів видаються скромними. Імперський райхстаг збирається тут так часто, що [target_location.GetRank.GetNameWithNoTooltip|l] уже звик приймати князів.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] бачить, що тут про гроші говорять так само відверто, як і про родовитість."
  grand_tour_events.20.knowledge: "Оглянемо стародавні пам’ятки міста та дослідимо рукописи гуманістів."
  grand_tour_events.20.experience: "Ознайомимося з обліковими книгами найбільших банкірських домів."
  grand_tour_events.20.connections: "Відвідаємо прийом, який влаштовує [court_host.GetNameWithNoTooltip]."
  grand_tour_events.20.party: "Відкладемо облікові книги заради гральних столів."
  grand_tour_events.20.historical_info: "Уранці 15 липня 1772 року англійський історик музики Чарльз Берні прибув до Аугсбурга, провівши всю ніч у дорозі, і відразу попрямував до кафедрального собору. Там він почув проповідь німецькою мовою, а потім святкову месу у виконанні двох хорів. Спів йому сподобався, однак гармонії органіста здалися настільки грубими й химерними, що музика радше мучила слух, ніж приносила втіху. Берні також вразив різкий гуркіт барабанів і сурм під час піднесення Святих Дарів. Із таким він доти стикався лише в Антверпені. Довідавшись, що кантор, до якого він віз рекомендаційні листи, був у від’їзді, Берні не став затримуватися й продовжив подорож, збираючи матеріали для своєї історії музики."
  grand_tour_events.21.title: "[target_location.GetNameWithNoTooltip] — Катедральне місто"
  grand_tour_events.21.desc: "Будівництво кафедрального собору в [target_location.Custom('LR_PREP')|l] [target_location.GetName] триває так давно, що ніхто з нині живих не пам’ятає, коли воно розпочалося. Над #L #TOOLTIP:LOCATIONRANK,[target_location.GetRank.Custom('LR_tt')],X [target_location.GetRank.Custom('LR_INST')|l]#!#! височіє недобудована вежа, на верхівці якої все ще стоїть підіймальний кран, залишений мулярами. Рейном повз це [target_location.GetRank.Custom('LR_NOM')|l] проходить більше торгових кораблів, ніж майже будь-де в #TOOLTIP:LANGUAGE,german_language,X #L німецькомовних#!#! землях, а архієпископ має владу, порівнянну з владою будь-якого князя.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] прибуває до міста, де терпіння вимірюють століттями."
  grand_tour_events.21.knowledge: "Відвідаємо будівельний майданчик кафедрального собору та поспілкуємося з ученими університету."
  grand_tour_events.21.experience: "Оглянемо ливарні, де виливають дзвони для церков Рейнської області."
  grand_tour_events.21.connections: "$grand_tour_events.seek_audience$"
  grand_tour_events.21.party: "Відкладемо оглядини собору заради вечора на березі Рейну."
  grand_tour_events.21.historical_info: "У вересні 1794 року письменниця Анна Радкліфф прибула до Кельна під час подорожі Рейнською областю разом із чоловіком. Згодом вона описала цю поїздку в подорожніх нотатках #italic «Подорож, здійснена влітку 1794 року»#!. Місто було переповнене біженцями, які рятувалися від французьких армій, що наступали на Льєж та Маастрихт. Вулиці заполонили санітарні вози з пораненими й тими, хто вмирав. Усі заїзди були зайняті, і мандрівникам доводилося ночувати в екіпажах, на більярдних столах і шезлонгах — вільних кімнат не було. Згодом Радкліфф писала, що побачене дало їй глибше розуміння справжньої ціни війни, ніж будь-який опис битви, який їй доводилося читати."
  grand_tour_events.22.title: "[target_location.GetNameWithNoTooltip] — Місто Барсіно"
  grand_tour_events.22.desc: "[target_location.GetName] веде лік своїм мурам від римської колонії, що колись стояла на цьому місці, а [target_location.GetRank.GetName|l] перетворився на найжвавіший порт узбережжя. Його гавань заповнена галерами, що розвозять #TOOLTIP:GOODS,wool,X #L вовну#!#!, прянощі та #TOOLTIP:GOODS,dyes,X #L барвники#!#! усім західним Середземномор’ям. До власного морського кодексу міста звертаються навіть капітани, які ніколи в ньому не бували.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] уже майже вдома."
  grand_tour_events.22.knowledge: "Відвідаємо лекцію про закони каталонських #italic кортесів#!."
  grand_tour_events.22.experience: "Ознайомимося з морським кодексом, що зберігається на торговій біржі."
  grand_tour_events.22.connections: "[court_host.GetNameWithNoTooltip] влаштовує прийом, варто відрекомендуватися."
  grand_tour_events.22.party: "Відкладемо морський кодекс заради вечора в корчмах біля причалів."
  grand_tour_events.22.historical_info: "Наприкінці жовтня 1775 року англійський антиквар Генрі Свінберн прибув до Барселони незадовго до того, як міська брама зачинилася на ніч. Згодом він описав цей випадок у книзі #italic «Подорожі Іспанією у 1775 та 1776 рр.»#!. Зробивши візит ґречности губернаторові, Свінберн вирушив до театру й спочатку виніс суворий вирок побаченому: «На цій сцені запанувала нудьга». Але за кілька днів його думка змінилася завдяки жвавій виставі #italic «Ель Сід Кампеадор»#!, у якій актори були вбрані у старовинні іспанські строї. Оглянувши цитадель, він зауважив, що її розташували в сирій, повній комарів низині, а вибір місця, на його думку, пояснювався радше прагненням тримати місто в страху, ніж турботою про здоров’я."
  grand_tour_events.23.title: "[target_location.GetNameWithNoTooltip] — Місто королів"
  grand_tour_events.23.desc: "Замок на пагорбі [target_location.Custom('LR_GEN')|l] [target_location.GetName] слугує місцем коронації та поховання королів, а [target_location.GetRank.GetName|l] ставиться до обох церемоній з однаковою урочистістю. Його університет старіший за більшість вищих навчальних закладів #TOOLTIP:LANGUAGE,german_language,X #L німецькомовних#!#! земель. Тут студенти з усього регіону вивчають астрономію та право. Торгівля #TOOLTIP:GOODS,amber,X #L бурштином#!#! та #TOOLTIP:GOODS,salt,X сіллю#! забезпечує постійне пожвавлення на міських ринках.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] прибуває до останнього великого міста на шляху додому."
  grand_tour_events.23.knowledge: "$grand_tour_events.attend_university_lectures$"
  grand_tour_events.23.experience: "Оглянемо Суконні ряди, де купці пропонують свій крам."
  grand_tour_events.23.connections: "$grand_tour_events.seek_castle_audience$"
  grand_tour_events.23.party: "Відкладемо заняття в лекційній залі заради нічної прогулянки біля замку."
  grand_tour_events.23.historical_info: "25 липня 1778 року Вільям Кокс, наставник юного лорда Герберта, який супроводжував його в тривалій Великій подорожі Північною та Східною Європою, перетнув Віслу й прибув до Кракова. Колишня столиця Польщі все ще несла сліди нещодавніх облог: гарматні ядра й картеч залишили на місті свої мітки, а чудові маєтки лежали в руїнах. Кокс відвідав університет, заснований Казимиром Великим. Бібліотекар показав йому турецьку книгу, яка не мала великої самостійної цінности, але вважалася великою рідкістю. Її захопили як трофей у Хотинській битві, а згодом сам король Ян Собеський подарував її університету на згадку про перемогу, що врятувала Польщу та принесла йому польський престол."
  grand_tour_events.24.title: "Куди далі?"
  grand_tour_events.24.desc: "З [target_location.Custom('LR_GEN')|l] [target_location.GetName] веде кілька доріг. [target_leader.GetName] має вирішити, куди продовжити шлях: углиб #TOOLTIP:REGION,italy_region,X #L Італії#!#! чи вирушити додому."
  grand_tour_events.24.a: "Зробити гак через Верону."
  grand_tour_events.24.b: "Натомість рушити до Феррари."
  grand_tour_events.24.c: "Звернути до Болоньї."
  grand_tour_events.24.d: "Тримати путь до Флоренції."
  grand_tour_events.24.e: "Зробити зупинку в Сієні."
  grand_tour_events.24.f: "Спершу заїхати до Пізи."
  grand_tour_events.24.g: "Вирушити до Ассізі."
  grand_tour_events.24.h: "Натомість вирушити до Перуджі."
  grand_tour_events.24.i: "Тримати путь до Рима."
  grand_tour_events.24.j: "Продовжити свій шлях до Неаполя."
  grand_tour_events.24.k: "Велика подорож добігає кінця. Час повертатися додому."
  grand_tour_events.25.title: "Шлях додому"
  grand_tour_events.25.desc: "Нарешті кавалькада повертає в бік дому. Замість того щоб повторювати весь південний шлях у зворотному напрямку, [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] обрати місце для зупинки перед останнім етапом дороги — щоб дати коням перепочити і, можливо, відвідати ще один двір, перш ніж повернутися додому."
  grand_tour_events.25.desc.second: "Однієї зупинки замало, щоб вважати повернення додому довершеним. Перш ніж [target_leader.GetName] повернеться до [ROOT.GetCountry.GetCapital.Custom('LR_GEN')|l] [ROOT.GetCountry.GetCapital.GetName], [Select_CString(target_leader.IsFemale, 'їй', 'йому')] належить обрати ще одне місто для зупинки: останній двір, остання дивина — і лише після цього Велика подорож справді завершиться."
  grand_tour_events.25.a: "Зробити зупинку у Відні."
  grand_tour_events.25.b: "Дати коням перепочити в Празі."
  grand_tour_events.25.c: "Повернути додому через Мюнхен."
  grand_tour_events.25.d: "Зробити зупинку в Парижі перед останнім відтинком шляху."
  grand_tour_events.25.e: "На зворотному шляху додому проїхати через Ліон."
  grand_tour_events.25.f: "Спершу перетнути море та заїхати до Лондона, а потім рушити вглиб країни"
  grand_tour_events.25.g: "Спершу завернути до Страсбурга."
  grand_tour_events.25.h: "Проїхати через Марсель."
  grand_tour_events.25.i: "Перед останнім відтинком шляху заїхати до Аугсбурга."
  grand_tour_events.25.k: "Трохи перепочити в Кельні."
  grand_tour_events.25.l: "Повернутися додому морем через Барселону."
  grand_tour_events.25.n: "Зробити зупинку в Орлеані."
  grand_tour_events.25.o: "Перед останнім відтинком шляху додому проїхати через Краків."
  grand_tour_events.25.p: "Годі відкладати повернення. Негайно вирушаємо додому."
  grand_tour_events.26.title: "[target_location.GetNameWithNoTooltip] — місто на Темзі"
  grand_tour_events.26.desc: "[target_location.GetName] розкинулося вздовж річки за мурами, вперше зведеними римлянами, і відтоді далеко переросло їхні межі. Навіть міст забудований будинками та крамницями. Торгівля #TOOLTIP:GOODS,wool,X #L вовною#!#! наповнює міські склади, а парламент засідає тут настільки часто, що [target_location.GetRank.GetNameWithNoTooltip|l] звикло приймати тих, хто відає державними справами.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] переконується, що місцевий двір своїми домаганнями нічим не поступається будь-якому іншому на континенті."
  grand_tour_events.26.knowledge: "Послухаємо лекцію про загальне право в одному з іннів баристерських корпорацій."
  grand_tour_events.26.experience: "Завітаємо до торговців вовною та відвідаємо місця зібрань міських гільдій."
  grand_tour_events.26.connections: "$grand_tour_events.seek_audience$"
  grand_tour_events.26.party: "Відкладемо відвідини зібрань міських гільдій заради вечора в тавернах [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
  grand_tour_events.26.historical_info: "У 1765 році французький правник і письменник П’єр-Жан Гросле провів майже рік у Лондоні, збираючи матеріали для книги, згодом перекладеної під назвою #italic «Подорож до Лондона»#!. Серед інших спостережень він описав, як один державний міністр провів за гральним столом цілий день, підтримуючи сили винятково холодною яловичиною, покладеною між двома скибками підсмаженого хліба. «Ця нова страва, — писав Гросле, — стала вельми популярною за час мого перебування в Лондоні». Згодом вона отримала ім’я свого винахідника. Цей випадок, правдивий чи прикрашений, став найчастіше цитованим епізодом книги Гросле про його мандрівку."
  grand_tour_events.27.title: "[target_location.GetNameWithNoTooltip], місто на Луарі"
  grand_tour_events.27.desc: "[target_location.GetName] розташоване там, де Луара повертає на північ, перш ніж знову рушити до моря. [target_location.GetRank.GetName] здавна має зиск із торгівлі, що йде річкою. У місцевому університеті право викладають майже так само суворо, як у Болоньї, а міські мури витримували облоги, пережити які іншим містам не вдалося.\n\n[ROOT.GetCountry.GetGovernment.GetHeirTitle] зустрічає тут учених і вояків, яким є що розповісти."
  grand_tour_events.27.knowledge: "$grand_tour_events.attend_university_lectures$"
  grand_tour_events.27.experience: "Оглянемо винні льохи та відвідаємо спілку човнярів на Луарі."
  grand_tour_events.27.connections: "$grand_tour_events.seek_audience$"
  grand_tour_events.27.party: "Пропустимо лекції з права заради вечора в шинках біля річки."
  grand_tour_events.27.historical_info: "У квітні 1644 року молодий письменник Джон Івлін зупинився в Орлеані під час мандрівки вниз Луарою, яка стала однією з перших документально засвідчених Великих подорожей. Він відвідав старовинний університет, студенти якого, як і раніше, поділялися на чотири історичні «нації»: французьку, нормандську, пікардійську та верхньонімецьку. Кожна мала своїх власних виборних представників. Івлін також побував у двох публічних міських бібліотеках і з подивом зауважив, що вчений міг узяти книгу до себе додому, до свого житла, просто залишивши записку зі своїм підписом. Така свобода бібліотечних порядків видалася йому дивовижною. Крім того, він оглянув соборну церкву Святого Хреста, колись величну, яка проте все ще зберігала виразні сліди нещодавніх міжусобних воєн."
  grand_tour_events.28.title: "Нагода здобути освіту"
  grand_tour_events.28.desc.university: "До почту дійшли звістки, що [target_leader.GetName] може вступити до університету [target_location.Custom('LR_GEN')|l] [target_location.GetName], і це можна влаштувати. Там [Select_CString(target_leader.IsFemale, 'на неї', 'на нього')] чекають лекції, диспути та товариство вчених, чиї імена пам’ятатимуть ще довго після того, як ця Велика подорож забудеться."
  grand_tour_events.28.desc.scholar: "До почту дійшли звістки про вченого [target_location.Custom('LR_GEN')|l] [target_location.GetName], чия слава приваблює студентів з усього континенту. Якщо запропонувати йому гідну винагороду та якщо [target_leader.GetName] припаде йому до душі, він може погодитися на певний час стати [Select_CString(target_leader.IsFemale, 'її', 'його')] наставником."
  grand_tour_events.28.a: "$grand_tour_events.opportunity_accept$"
  grand_tour_events.28.b: "$grand_tour_events.opportunity_commit$"
  grand_tour_events.28.c: "$grand_tour_events.opportunity_decline$"
  grand_tour_events.29.title: "Навчання добігає кінця"
  grand_tour_events.29.desc: "Місяці навчання добігають кінця, і [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити, чого насправді вдалося навчитися у [target_location.Custom('LR_PREP')|l] [target_location.GetName], $grand_tour_events.worth_the_delay$"
  grand_tour_events.29.a: "$grand_tour_events.reflect_and_continue$"
  grand_tour_events.30.title: "Нагода здобути бойовий досвід"
  grand_tour_events.30.desc: "[ROOT.GetCountry.GetGovernment.GetHeirTitle] дізнається, що [target_country.GetLongName] перебува[target_country.Custom('endlong_yeyut')] у стані війни, а тамтешній офіцерський корпус готовий приймати добровольців, якщо їх відрекомендують потрібним людям. [target_leader.GetName] не отримає справжнього командування і не відповідатиме за те, що станеться з вояками, але матиме змогу їздити верхи поряд із досвідченими офіцерами, на власні очі спостерігати за воєнною кампанією та дізнатися те, чого не прочитати в жодній книзі з військової стратегії."
  grand_tour_events.30.a: "$grand_tour_events.opportunity_accept$"
  grand_tour_events.30.b: "$grand_tour_events.opportunity_commit$"
  grand_tour_events.30.c: "$grand_tour_events.opportunity_decline$"
  grand_tour_events.31.title: "Воєнна кампанія добігає кінця"
  grand_tour_events.31.desc: "Час воєнних походів добігає кінця, і [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити, чого насправді вдалося навчитися в офіцерів [target_location.Custom('LR_GEN')|l] [target_location.GetName], $grand_tour_events.worth_the_delay$"
  grand_tour_events.31.a: "$grand_tour_events.reflect_and_continue$"
  grand_tour_events.32.title: "Нагода завести знайомства"
  grand_tour_events.32.desc: "[target_leader.GetName] отримує запрошення провести сезон при дворі [target_country.Custom('longname_ua_GEN')] як почесн[Select_CString(target_leader.IsFemale, 'а гостя', 'ий гість')]. [Select_CString(target_leader.IsFemale, 'Їй', 'Йому')] нададуть покої в палаці, чекатимуть на кожному прийомі та відрекомендують усім придворним і приїжджим послам, з якими варто познайомитися."
  grand_tour_events.32.desc.no_owner: "[target_leader.GetName] отримує запрошення провести сезон у домі найвпливовішої родини [target_location.Custom('LR_GEN')|l] [target_location.GetName]. [Select_CString(target_leader.IsFemale, 'Її', 'Його')] відрекомендують усім гідним уваги людям і незмінно запрошуватимуть до родинного столу."
  grand_tour_events.32.a: "$grand_tour_events.opportunity_accept$"
  grand_tour_events.32.b: "$grand_tour_events.opportunity_commit$"
  grand_tour_events.32.c: "$grand_tour_events.opportunity_decline$"
  grand_tour_events.33.title: "Придворний сезон добігає кінця"
  grand_tour_events.33.desc: "Придворний сезон добігає кінця, і [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити, що насправді дали [Select_CString(target_leader.IsFemale, 'їй', 'йому')] знайомства, зав’язані у [target_location.Custom('LR_PREP')|l] [target_location.GetName], $grand_tour_events.worth_the_delay$."
  grand_tour_events.33.a: "Поміркуємо над тим, що нам вдалося здобути з нових знайомств, і продовжимо наш шлях."
  grand_tour_events.34.title: "Нагода опанувати мистецтво фехтування"
  grand_tour_events.34.desc: "[ROOT.GetCountry.GetGovernment.GetHeirTitle] дізнається, що в [target_location.Custom('LR_PREP')|l] [target_location.GetName] перебуває уславлений майстер фехтування, готовий на цілий сезон узяти в учні [Select_CString(target_leader.IsFemale, 'багатонадійну дівчину', 'багатонадійного юнака')]. [target_leader.GetName] не братиме участи в серйозних двобоях і не владнуватиме справжніх чвар, зате [Select_CString(target_leader.IsFemale, 'вона', 'він')] зможе опанувати роботу ніг, чуття слушної миті та ту особливу відвагу, якої не навчить жодна настанова щодо володіння зброєю."
  grand_tour_events.34.a: "$grand_tour_events.opportunity_accept$"
  grand_tour_events.34.b: "$grand_tour_events.opportunity_commit$"
  grand_tour_events.34.c: "$grand_tour_events.opportunity_decline$"
  grand_tour_events.35.title: "Навчання добігає кінця"
  grand_tour_events.35.desc: "Сезон занять добігає кінця, і [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'має', 'має')] вирішити, чого насправді вдалося навчитися на двобоях у [target_location.Custom('LR_PREP')|l] [target_location.GetName], $grand_tour_events.worth_the_delay$"
  grand_tour_events.35.a: "$grand_tour_events.reflect_and_continue$"
  grand_tour_events.36.title: "Лист із батьківщини"
  grand_tour_events.36.desc: "Нарешті до учасників Великої подорожі доходить лист із #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. У ньому [ROOT.GetCountry.GetGovernment.GetRuler.GetName] тепло пише про те, що [target_leader.GetName] має загальну повагу при дворі, а [Select_CString(target_leader.IsFemale, 'її', 'його')] оповіді про час, проведений за кордоном, незмінно вражають усіх придворних. На батьківщині ці подорожні нотатки вже не раз ставали темою застільних розмов."
  grand_tour_events.36.a: "Відзначимо отримання вістки невеликим святкуванням."
  grand_tour_events.36.b: "Нам ніколи повертатися до колишніх придворних справ."
  grand_tour_events.37.title: "[Select_CString(gt_admirer.IsFemale, 'Місцева шанувальниця', 'Місцевий шанувальник')]"
  grand_tour_events.37.desc: "[Select_CString(gt_admirer.IsFemale, 'Місцева молода шляхтянка', 'Місцевий молодий шляхтич')] на ім’я [gt_admirer.GetName] явно [Select_CString(gt_admirer.IsFemale, 'пройнялася', 'пройнявся')] повагою до [Select_CString(target_leader.IsFemale, 'її', 'його')] становища й виховання. [Select_CString(gt_admirer.IsFemale, 'Вона розшукала', 'Він розшукав')] [Select_CString(target_leader.IsFemale, 'її', 'його')], сподіваючись зробити [Select_CString(target_leader.IsFemale, 'їй', 'йому')] якусь послугу, поки [target_leader.GetName] перебуває в [target_location.Custom('LR_PREP')|l] [target_location.GetName]."
  grand_tour_events.37.a: "Нехай познайомить [Select_CString(target_leader.IsFemale, 'її', 'його')] з потрібними людьми."
  grand_tour_events.37.b: "Ми можемо прийняти в дарунок від [Select_CString(gt_admirer.IsFemale, 'неї', 'нього')] чудове вбрання, що пасує для Великої подорожі."
  grand_tour_events.37.c: "Ми можемо прийняти [Select_CString(gt_admirer.IsFemale, 'її', 'його')] запрошення зупинитися в [Select_CString(gt_admirer.IsFemale, 'її', 'його')] домі."
  grand_tour_events.38.title: "Корисне знайомство"
  grand_tour_events.38.desc: "На званій вечері [target_leader.GetName] сидить поруч зі скромним молодиком на ім’я [gt_secretary.GetName], який не схильний надто багато говорити про себе. Але випадкове зауваження виказує в ньому секретаря кардинала. Він побіжно дає зрозуміти, що може замовити слівце, аби [target_cardinal.GetName] прийняв наш почет, якщо [target_leader.GetNameWithNoTooltip] зуміє справити гарне враження цього вечора."
  grand_tour_events.38.a: "Попросимо влаштувати знайомство, ризикуючи поставити себе в незручне становище."
  grand_tour_events.38.b: "Наполегливо домагатимемося зустрічі, незважаючи на можливий конфуз."
  grand_tour_events.38.c: "Насолоджуймося вечором і залишмо все як є."
  grand_tour_events.39.title: "Мить осяяння"
  grand_tour_events.39.desc: "У розпал суперечки в [target_location.Custom('LR_PREP')|l] [target_location.GetName] один із доводів, який наводить [target_leader.GetName], несподівано вражає всіх глибиною думки. Присутні вчені замовкають, а потім схвально кивають."
  grand_tour_events.39.a: "Продовжимо розвивати свою думку, ризикуючи стати посміховиськом, якщо виявимося неправі."
  grand_tour_events.39.b: "Доведемо суперечку до краю, не боячись стати посміховиськом."
  grand_tour_events.39.c: "Сьогодні ми виступили цілком гідно. Годі й цього."
  grand_tour_events.40.title: "Показ майстерности"
  grand_tour_events.40.desc: "Під час двобою у школі фехтування в [target_location.Custom('LR_PREP')|l] [target_location.GetName] [target_leader.GetName] помічає вразливе місце в обороні супротивника, про яке не розповідав жоден учитель. На мить усі присутні завмирають — вони чекають, що ж [Select_CString(target_leader.IsFemale, 'вона', 'він')] зробить далі."
  grand_tour_events.40.a: "Продовжимо атаку, навіть якщо ми ризикуємо впасти найбезглуздішим чином."
  grand_tour_events.40.b: "Продовжимо обмінюватися випадами, нехай навіть це загрожує пораненням."
  grand_tour_events.40.c: "Покажемо себе гідно й на цьому зупинимося."
  grand_tour_events.40.injury_tt: "[target_leader.GetName] невдало падає і [Select_CString(target_leader.IsFemale, 'змушена', 'змушений')] деякий час провести у ліжку, гоячи забиття та вражену гордість."
  grand_tour_events.41.title: "Напад хвороби"
  grand_tour_events.41.desc: "[target_leader.GetName] нездужає на важкий кишковий розлад, який, за припущенням лікарів, спричинений вживанням місцевої води. Вони запевняють почет, що хвороба не смертельна, але настільки прикра, що [Select_CString(target_leader.IsFemale, 'їй', 'йому')] довелося провести кілька днів у ліжку. До того ж послуги лікарів коштують недешево."
  grand_tour_events.41.a: "Відрядимо по лікаря."
  grand_tour_events.41.b: "Запросимо найвправнішого з лікарів."
  grand_tour_events.41.c: "Нехай хвороба йде своєю чередою."
  grand_tour_events.42.title: "Туга за домом"
  grand_tour_events.42.desc: "Перебування далеко від дому вже не здається таким захопливим, як раніше, і [target_leader.GetName] все частіше згадує батьківщину, адже там [Select_CString(target_parent.IsFemale, 'залишилася', 'залишився')] [Select_CString(target_leader.IsFemale, 'її', 'його')] [Select_CString(target_parent.IsFemale, 'мати', 'батько')]. [target_leader.GetName] не може зосередитися на поточних справах."
  grand_tour_events.42.a: "Напишемо [Select_CString(target_parent.IsFemale,'їй', 'йому')] додому й додамо невеликий подарунок."
  grand_tour_events.42.b: "Замовимо портрет, щоб надіслати [Select_CString(target_parent.IsFemale,'їй', 'йому')]."
  grand_tour_events.42.c: "Покинемо мандрівку й повернемося додому до [Select_CString(target_parent.IsFemale,'неї', 'нього')]."
  grand_tour_events.43.title: "Дорога необачність"
  grand_tour_events.43.desc: "Лише згодом з’ясовується, що недоречно [target_leader.GetName] [Select_CString(target_leader.IsFemale,'привіталася', 'привітався')] з місцевим магістратом на вчорашньому прийомі — порушення старшинства, очевидне всім у залі, крім почту. Господар навряд чи забуде це без якогось жесту каяття, хоча незграбний жест цілком може лише погіршити справу."
  grand_tour_events.43.a: "Піднесемо невеликий подарунок на знак вибачення, ризикуючи, що він не справить враження."
  grand_tour_events.43.b: "Вибачимося з великим розмахом."
  grand_tour_events.43.c: "Залишимо все як є."
  grand_tour_events.44.title: "Продажна варта"
  grand_tour_events.44.desc: "Повертаючись затемна, [target_leader.GetName] зустрічає в провулку людей у ливреях міської варти, яких капшук чужинця хвилює значно більше, ніж закон, берегти який вони присягалися."
  grand_tour_events.44.a: "Вранці донесемо на вартових магістрату."
  grand_tour_events.44.b: "Битимемося з вартовими в провулку."
  grand_tour_events.44.c: "Кинемося бігти вулицею, волаючи про поміч."
  grand_tour_events.44.d: "Віддамо капшук і підемо."
  grand_tour_events.45.title: "Подорожній"
  grand_tour_events.45.desc: "У юрмі відвідувачів жвавого заїзду [ROOT.GetCountry.GetGovernment.GetHeirTitle] заводить розмову з людиною на ім’я [gt_friend.GetName] — [Select_CString(gt_friend.IsFemale, 'ще однією молодою представницею знаті з батьківщини, яка подорожує', 'ще одним молодим представником знаті з батьківщини, який подорожує')] майже тим самим шляхом з тих самих причин. Вони одразу знаходять спільну мову, діляться оповідками про рідну країну та про свої мандри, поки дорога знову не розводить їх — кожного до свого міста."
  grand_tour_events.45.a: "Так починається міцна дружба."
  grand_tour_events.45.b: "Побажаємо успіху та продовжимо шлях наодинці."
  grand_tour_events.friendship_up_1_tt: "Дружба з персонажем [gt_friend.GetName] міцнішає (#G +1#! до дружби)"
  grand_tour_events.friendship_up_2_tt: "Дружба з персонажем [gt_friend.GetName] значно міцнішає (#G +2#! до дружби)"
  grand_tour_events.friendship_down_1_tt: "Дружба з персонажем [gt_friend.GetName] слабшає (#R -1#! до дружби)"
  grand_tour_events.friend_joins_court_tt: "[gt_friend.GetName], [Select_CString(gt_friend.IsFemale, 'нова подруга', 'новий друг')] [Select_CString(heir.IsFemale, 'нашої спадкоємиці', 'нашого спадкоємця')], [Select_CString(gt_friend.IsFemale, 'готова', 'готовий')] піти слідом за [Select_CString(heir.IsFemale, 'нею', 'ним')] додому, до нашого двору."
  grand_tour_events.friend_reunion_intro: "Несподівано [gt_friend.GetName] теж [Select_CString(gt_friend.IsFemale, 'приїхала', 'приїхав')] у [target_location.Custom('LR_ACC')|l] [target_location.GetName]: шляхи двох друзів знову перетнулися після розлуки, і розмова точиться так, ніби й не уривалася."
  grand_tour_events.46.title: "Друг у біді"
  grand_tour_events.46.desc: "$grand_tour_events.friend_reunion_intro$ [Select_CString(gt_friend.IsFemale, 'Її', 'Його')] гаманець, [Select_CString(gt_friend.IsFemale, 'зізнається вона', 'зізнається він')], спорожнів через низку невдач за картярським столом, і [Select_CString(gt_friend.IsFemale, 'вона', 'він')], помітно зніяковівши, запитує, чи не можна якось зарадити, поки борг не призвів до скандалу."
  grand_tour_events.46.a: "Тихо покриємо [Select_CString(gt_friend.IsFemale, 'її', 'його')] борг із власних коштів."
  grand_tour_events.46.b: "Напишемо знайомим, аби вони надали [Select_CString(gt_friend.IsFemale, 'їй', 'йому')] позику."
  grand_tour_events.46.c: "Побажаємо [Select_CString(gt_friend.IsFemale, 'їй', 'йому')] успіху — нехай [Select_CString(gt_friend.IsFemale, 'сама', 'сам')] шукає вихід."
  grand_tour_events.47.title: "Спільне відкриття"
  grand_tour_events.47.desc: "$grand_tour_events.friend_reunion_intro$ Ділячись новинами про те, чого кожен навчився з миті розлуки, [gt_friend.GetNameWithNoTooltip] зізнається, що [Select_CString(gt_friend.IsFemale, 'заплуталася', 'заплутався')] в лекції — тексті, який наші власні заняття вже давно зробили для нас зрозумілим, — і просить допомогти розібратися."
  grand_tour_events.47.a: "Сядемо і все пояснимо, спираючись на те, що нам уже відомо."
  grand_tour_events.47.b: "Натомість наймемо вчителя, який допоможе [Select_CString(gt_friend.IsFemale, 'їй', 'йому')] розібратися."
  grand_tour_events.47.c: "Скажемо [Select_CString(gt_friend.IsFemale, 'їй', 'йому')], що все просто, і нехай [Select_CString(gt_friend.IsFemale, 'сама', 'сам')] розбирається."
  grand_tour_events.48.title: "Слово до потрібного вуха"
  grand_tour_events.48.desc: "$grand_tour_events.friend_reunion_intro$ [gt_friend.GetNameWithNoTooltip] [Select_CString(gt_friend.IsFemale, 'почула', 'почув')] про приватний салон у [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip], де збираються поважні місцеві родини, але в [Select_CString(gt_friend.IsFemale, 'неї', 'нього')] немає знайомих, які допомогли б туди потрапити. А от [target_leader.GetName] завдяки знайомствам, набутим під час мандрівки, перебуває в зовсім іншому становищі."
  grand_tour_events.48.a: "Надішлемо звістку нашому знайомому і поручимося за [Select_CString(gt_friend.IsFemale, 'неї', 'нього')]."
  grand_tour_events.48.b: "Натомість оплатимо [Select_CString(gt_friend.IsFemale, 'її', 'його')] вхід на менш важливе зібрання."
  grand_tour_events.48.c: "Скажемо [Select_CString(gt_friend.IsFemale, 'їй', 'йому')] [Select_CString(gt_friend.IsFemale, 'самій', 'самому')] шукати спосіб потрапити туди."
  grand_tour_events.49.title: "Загроза насильства"
  grand_tour_events.49.desc: "$grand_tour_events.friend_reunion_intro$ Зустріч швидко повертає на лихе: [gt_friend.GetNameWithNoTooltip] [Select_CString(gt_friend.IsFemale, 'перейшла дорогу', 'перейшов дорогу')] місцевому лихвареві, і той тепер стоїть біля їхнього столу на заїжджому дворі з двома найнятими шибайголовами й обіцяє потрощити не лише меблі, якщо борг не сплатять уже сьогодні."
  grand_tour_events.49.a: "Втрутимося самі: ми знаємо, як поводитися з такими типами."
  grand_tour_events.49.b: "Просто розрахуємося з позикодавцем і закінчимо на цьому."
  grand_tour_events.49.c: "Залишимо [Select_CString(gt_friend.IsFemale, 'її', 'його')] розбиратися з наслідками наодинці."
  grand_tour_events.50.title: "Невелика недуга"
  grand_tour_events.50.desc: "[target_leader.GetName] дізнається, що [gt_friend.GetName] теж [Select_CString(gt_friend.IsFemale, 'приїхала', 'приїхав')] у [target_location.Custom('LR_ACC')|l] [target_location.GetName] і лежить у ліжку на місцевому заїжджому дворі, підхопивши в дорозі застуду з лихоманкою. Корчмар бурмоче, що гаманець [Select_CString(gt_friend.IsFemale, 'молодої дівчини', 'молодика')] здавався худим під час оплати кімнати і що [Select_CString(gt_friend.IsFemale, 'вона', 'він')] уже двічі [Select_CString(gt_friend.IsFemale, 'відмахнулася', 'відмахнувся')] від місцевого лікаря, щоб заощадити на лікуванні."
  grand_tour_events.50.a: "Оплатимо послуги лікаря попри [Select_CString(gt_friend.IsFemale, 'її', 'його')] заперечення."
  grand_tour_events.50.b: "Самі доглядатимемо [Select_CString(gt_friend.IsFemale, 'її', 'його')], спираючись на власний досвід мандрівок."
