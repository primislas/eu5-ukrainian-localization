  grand_tour_events.friend_joins_court_tt: "[gt_friend.GetName], друг, якого наш спадкоємець знайшов у дорозі, готовий піти за [heir.GetHerHim] до нашого двору"
  grand_tour_events.friend_reunion_intro: "Випадково [gt_friend.GetName] також прибув до [target_location.GetName], і шляхи двох друзів знову перетинаються після розлуки — розмова триває так, ніби й не уривалася."
