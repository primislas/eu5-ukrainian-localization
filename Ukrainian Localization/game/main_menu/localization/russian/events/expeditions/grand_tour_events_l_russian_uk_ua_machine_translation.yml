  grand_tour_events.25.c: "Повернути додому через [ShowLocationNameWithNoTooltip('munich')]."
  grand_tour_events.25.d: "Зупинитися в [ShowLocationNameWithNoTooltip('paris')] перед останнім відтинком шляху."
  grand_tour_events.25.desc: "Турне врешті завертає додому. Замість того щоб знову долати весь шлях на південь, [target_leader.GetName] має обрати, де перервати подорож перед останнім відтинком шляху: зупинку, щоб дати перепочити коням і, можливо, бути прийнятим при ще одному дворі перед поверненням."
  grand_tour_events.25.desc.second: "Однієї зупинки замало, щоб назвати це поверненням додому. Перш ніж дорога остаточно приведе назад до [ROOT.GetCountry.GetCapital.GetName], [target_leader.GetName] обирає ще одне місто, щоб перервати подорож: останній двір, останню дивовижу, перш ніж турне справді завершиться."
  grand_tour_events.25.e: "Проїхати через [ShowLocationNameWithNoTooltip('lyon')] дорогою додому."
  grand_tour_events.25.f: "Переправитися до [ShowLocationNameWithNoTooltip('london')], перш ніж завернути вглиб материка."
  grand_tour_events.25.g: "Спершу заїхати до [ShowLocationNameWithNoTooltip('strasbourg')]."
  grand_tour_events.25.h: "Прокласти шлях через [ShowLocationNameWithNoTooltip('marseille')]."
  grand_tour_events.25.i: "Попрямувати до [ShowLocationNameWithNoTooltip('augsburg')] перед останнім переходом."
  grand_tour_events.25.k: "Трохи перепочити в [ShowLocationNameWithNoTooltip('cologne')]."
  grand_tour_events.25.l: "Вирушити додому морем через [ShowLocationNameWithNoTooltip('barcelona')]."
  grand_tour_events.25.n: "Перервати подорож у [ShowLocationNameWithNoTooltip('orleans')]."
  grand_tour_events.25.o: "Проїхати через [ShowLocationNameWithNoTooltip('krakow')] перед останнім відтинком шляху додому."
  grand_tour_events.25.p: "Годі зволікань. Рушати просто додому."
  grand_tour_events.25.title: "Шлях додому"
  grand_tour_events.26.connections: "$grand_tour_events.seek_audience$"
  grand_tour_events.26.experience: "Відвідати купців, що возять [ShowGoodsNameWithNoTooltip('wool')], та міські гільдійські палати."
  grand_tour_events.26.historical_info: "У 1765 році французький суддя та літератор П’єр-Жан Ґроле провів майже рік у Лондоні, збираючи матеріали для книги, згодом перекладеної як #italic«Подорож до Лондона»#!. Серед інших спостережень він описав міністра, який провів двадцять чотири години поспіль за гральним столом, харчуючись увесь цей час лише холодною яловичиною між двома скибками підсмаженого хліба. «Ця нова страва, — писав Ґроле, — стала вельми модною під час мого перебування в Лондоні», діставши згодом ім’я свого винахідника. Цей анекдот, прикрашений чи ні, став найбільш цитованим рядком його «Подорожі»."
  grand_tour_events.26.knowledge: "Відвідати читання про загальне право в судових інах."
  grand_tour_events.26.party: "Облишити гільдійські справи заради ночі в шинках [target_location.GetNameWithNoTooltip]."
  grand_tour_events.26.title: "[target_location.GetNameWithNoTooltip], місто на Темзі"
  grand_tour_events.27.connections: "$grand_tour_events.seek_audience$"
  grand_tour_events.27.experience: "Оглянути винні льохи та гільдію човникарів Луари."
  grand_tour_events.27.historical_info: "У квітні 1644 року молодий мемуарист Джон Івлін перервав свою подорож униз Луарою в Орлеані — це стало одним із перших задокументованих Ґранд-турів. Він відвідав стародавній університет, спудеї якого, як і колись, поділялися на чотири історичні «нації» — французьку, нормандську, пікардійську та верхньонімецьку, — кожна зі своїми посадовцями, і користувався двома міськими публічними книгозбірнями, зауважуючи, що вчений муж міг узяти книгу до себе на помешкання, лише залишивши розписку, — щедрість, яка здалася йому надзвичайною. Він також бачив колегіальну церкву Святого Хреста, колись величну, але яка все ще несла помітні сліди недавніх громадянських воєн."
  grand_tour_events.27.knowledge: "$grand_tour_events.attend_university_lectures$"
  grand_tour_events.27.party: "Пропускати читання права заради шинків біля річки."
  grand_tour_events.27.title: "[target_location.GetNameWithNoTooltip], місто на Луарі"
  grand_tour_events.28.a: "$grand_tour_events.opportunity_accept$"
  grand_tour_events.28.b: "$grand_tour_events.opportunity_commit$"
  grand_tour_events.28.c: "$grand_tour_events.opportunity_decline$"
  grand_tour_events.28.desc.scholar: "До почту доходить звістка про вченого мужа в [target_location.GetName], чия слава приваблює спудеїв з усього суходолу і якого за належну плату та заради підхожого учня можна було б умовити на певний час узяти до себе [target_leader.GetName]."
  grand_tour_events.28.desc.university: "До почту доходить звістка, що для [target_leader.GetName] можна знайти місце серед спудеїв університету [target_location.GetName]: лекції, диспути та товариство вчених мужів, чиї імена пам'ятатимуть ще довго по тому, як про цю подорож забудуть."
  grand_tour_events.28.title: "Змога для навчання"
  grand_tour_events.29.a: "$grand_tour_events.reflect_and_continue$"
  grand_tour_events.29.desc: "Місяці навчання добігають кінця, і [target_leader.GetName] має вирішити, чого насправді вдалося навчитися в [target_location.GetName], $grand_tour_events.worth_the_delay$"
  grand_tour_events.29.title: "Кінець лекціям"
  grand_tour_events.3.connections: "Вивчити мистецтво опіки при дворі [court_host.GetNameWithNoTooltip]."
  grand_tour_events.3.experience: "Оглянути майстерні, де обробляють [ShowGoodsNameWithNoTooltip('wool')], та крамниці золотарів Понте-Веккйо."
  grand_tour_events.3.knowledge: "Домогтися знайомства зі вченими мужами при монастирі."
  grand_tour_events.3.party: "Відкласти рукописи заради гри за столами [target_location.GetNameWithNoTooltip]."
  grand_tour_events.30.a: "$grand_tour_events.opportunity_accept$"
  grand_tour_events.30.b: "$grand_tour_events.opportunity_commit$"
  grand_tour_events.30.c: "$grand_tour_events.opportunity_decline$"
  grand_tour_events.30.desc: "Наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] дізнається, що [target_country.GetLongName] веде війну, а її офіцерський корпус ладен приймати гостей із належними листами. [target_leader.GetName] не матиме справжнього командування і не нестиме відповідальності за долю вояків, але зможе їхати поруч із досвідченими офіцерами, на власні очі спостерігати за воєнною кампанією та довідатися те, чого не навчить жодна книга з військового мистецтва."
  grand_tour_events.30.title: "Польова змога"
  grand_tour_events.31.a: "$grand_tour_events.reflect_and_continue$"
  grand_tour_events.31.desc: "Пора воєнної кампанії добігає кінця, і [target_leader.GetName] має вирішити, чого насправді вдалося навчитися в офіцерів [target_location.GetName], $grand_tour_events.worth_the_delay$"
  grand_tour_events.31.title: "Кінець кампанії"
  grand_tour_events.32.a: "$grand_tour_events.opportunity_accept$"
  grand_tour_events.32.b: "$grand_tour_events.opportunity_commit$"
  grand_tour_events.32.c: "$grand_tour_events.opportunity_decline$"
  grand_tour_events.32.desc: "До [target_leader.GetName] доходить звістка про запрошення провести пору року при дворі [target_country.GetLongName] як гість: покої в палаці, постійне запрошення на всі прийоми та знайомство з усіма придворними й заїжджими послами, з ким варто знатися."
  grand_tour_events.32.desc.no_owner: "До [target_leader.GetName] доходить звістка про запрошення провести пору року як гість у господі найзнатнішої родини [target_location.GetName]: знайомство з усіма, з ким варто знатися, і постійне місце за їхнім столом."
  grand_tour_events.32.title: "Нагода зав’язати знайомства"
  grand_tour_events.33.a: "Обміркувати набуте та продовжити подорож."
  grand_tour_events.33.desc: "Сезон при дворі добігає кінця, і [target_leader.GetName] має вирішити, що насправді вдалося здобути завдяки знайомствам, зав’язаним у [target_location.GetName], $grand_tour_events.worth_the_delay$"
  grand_tour_events.33.title: "Сезон при дворі добігає кінця"
  grand_tour_events.34.a: "$grand_tour_events.opportunity_accept$"
  grand_tour_events.34.b: "$grand_tour_events.opportunity_commit$"
  grand_tour_events.34.c: "$grand_tour_events.opportunity_decline$"
  grand_tour_events.34.desc: "Наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] дізнається, що в [target_location.GetName] мешкає справді славетний майстер фехтування, готовий на один сезон узяти здібного учня. [target_leader.GetName] не довелося б битися на справжньому двобої чи розв’язувати справжню сварку, проте можна було б опанувати роботу ніг, відчуття часу й ту особливу відвагу, яку не здатен передати жоден трактат про фехтування."
  grand_tour_events.34.title: "Нагода зайнятися фехтуванням"
  grand_tour_events.35.a: "$grand_tour_events.reflect_and_continue$"
  grand_tour_events.35.desc: "Сезон уроків добігає кінця, і [target_leader.GetName] має вирішити, чого насправді вдалося навчитися у двобоях, проведених у [target_location.GetName], $grand_tour_events.worth_the_delay$"
  grand_tour_events.35.title: "Кінець урокам"
  grand_tour_events.36.a: "Відзначити це скромним святкуванням."
  grand_tour_events.36.b: "Ми не маємо часу думати про рідний двір."
  grand_tour_events.36.desc: "Лист із [ROOT.GetCountry.GetName] нарешті знаходить мандрівників. У ньому — теплі слова від [ROOT.GetCountry.GetGovernment.GetRuler.GetName] про те, що при дворі добре відгукуються про [target_leader.GetName], а також розповідь про те, як змальовують [target_leader.GetHerHim] та [target_leader.GetHerHis] час за кордоном, що вже став темою не одного застілля на батьківщині."
  grand_tour_events.36.title: "Лист із дому"
  grand_tour_events.37.a: "Відрекомендувати [target_leader.GetHerHim] потрібним людям."
  grand_tour_events.37.b: "Прийняти від [gt_admirer.GetHerHis] дарунок — вишукане вбрання, що личить для мандрів."
  grand_tour_events.37.c: "Прийняти запрошення [gt_admirer.GetHerHis] зупинитися у [gt_admirer.GetHerHis] власному домі."
  grand_tour_events.37.desc: "[gt_admirer.GetName], молодий місцевий дворянин, вочевидь зачарований [target_leader.GetHerHis] становищем та походженням, розшукав [target_leader.GetHerHim], бажаючи бути бодай чимось корисним під час [target_leader.GetHerHis] відвідин [target_location.GetName]."
  grand_tour_events.37.title: "Місцевий шанувальник"
  grand_tour_events.38.a: "Наполягти на знайомстві, ризикуючи справити ніякове враження."
  grand_tour_events.38.b: "Наполягти на своєму, попри ніяковість."
  grand_tour_events.38.c: "Насолодитися вечором і на цьому зупинитися."
  grand_tour_events.38.desc: "На званій вечері [target_leader.GetName] саджають поруч із [gt_secretary.GetName], скромним молодиком, який мало говорить про себе, доки випадкове зауваження не виказує в ньому секретаря кардинала [target_cardinal.GetName]. Він натякає, що одне його слово може влаштувати прийом у самого кардинала для [target_leader.GetNameWithNoTooltip], якщо сьогоднішнє враження виявиться сприятливим."
  grand_tour_events.38.title: "Корисне знайомство"
  grand_tour_events.39.a: "Розвинути думку далі, ризикуючи виставити себе на посміховисько, якщо помилитися."
  grand_tour_events.39.b: "Довести до краю, незважаючи на глузування."
  grand_tour_events.39.c: "Сьогодні й так непогано вийшло. На цьому й зупинитися."
  grand_tour_events.39.desc: "Під час диспуту в [target_location.GetName] довід, наведений [target_leader.GetName], зненацька виявляється блискучим осяянням, тож присутні вчені замовкають, а потім схвально кивають."
  grand_tour_events.39.title: "Мить осяяння"
  grand_tour_events.4.connections: "$grand_tour_events.seek_audience$"
  grand_tour_events.4.experience: "Пройтися давніми руїнами та обміряти пам’ятки."
  grand_tour_events.4.knowledge: "Звернутися до рукописів та вчених-гуманістів Ватиканської бібліотеки."
  grand_tour_events.4.party: "Залишити руїни заради ночі у винних крамницях [target_location.GetNameWithNoTooltip]."
  grand_tour_events.40.a: "Продовжити атаку, ризикуючи невдало впасти."
  grand_tour_events.40.b: "Форсувати двобій, попри ризик зазнати травми."
  grand_tour_events.40.c: "Гідно завершити й на цьому зупинитися."
  grand_tour_events.40.desc: "Під час поєдинку у фехтувальній школі [target_location.GetName] [target_leader.GetName] знаходить шпарину, якої не навчав жоден наставник, і на мить уся зала завмирає, спостерігаючи, що [target_leader.GetSheHe] з цим зробить."
  grand_tour_events.40.injury_tt: "[target_leader.GetName] невдало падає та злягає, зализуючи рани й уражену гордість"
  grand_tour_events.40.title: "Вияв майстерності"
  grand_tour_events.41.a: "Послати по лікаря."
  grand_tour_events.41.b: "Послати по найкращого лікаря, якого тільки можна знайти."
  grand_tour_events.41.c: "Нехай хвороба йде своєю чередою."
  grand_tour_events.41.desc: "[target_leader.GetName] злягає через сильний розлад шлунка, спричинений, як підозрюють лікарі, місцевою водою: нічого загрозливого для життя, запевняють вони почет, але це достатньо неприємно, щоби протримати [target_leader.GetHerHim] у ліжку кілька днів, а послуги їхні аж ніяк не дешеві."
  grand_tour_events.41.title: "Напад недуги"
  grand_tour_events.42.a: "Написати листа додому, до [target_parent.GetHerHim], і додати невеликий подарунок."
  grand_tour_events.42.b: "Замовити портрет, щоби надіслати його [target_parent.GetHerHim]."
  grand_tour_events.42.c: "Перервати подорож і повернутися додому, до [target_parent.GetHerHim]."
  grand_tour_events.42.desc: "Новизна перебування вже згасла, і [target_leader.GetName] помічає, що [target_leader.GetHerHis] думки дедалі частіше линуть додому — насамперед до [target_parent.GetName]. Це аж ніяк не йде на користь [target_leader.GetHerHis] зосередженості."
  grand_tour_events.42.title: "Туга за домівкою"
  grand_tour_events.43.a: "Піднести невеликий подарунок на знак вибачення, ризикуючи, що він не справить враження."
  grand_tour_events.43.b: "Зробити пишний жест перепрошення."
  grand_tour_events.43.c: "Залишити справу без наслідків."
  grand_tour_events.43.desc: "Лише згодом з’ясовується, що [target_leader.GetName] привітав місцевого суддю не за старшинством на вчорашньому прийомі — порушення етикету, очевидне для всіх у залі, крім самого почту. Господар навряд чи забуде про це без бодай якогось жесту каяття, хоча незграбна спроба може лише погіршити справу."
  grand_tour_events.43.title: "Дорога необачність"
  grand_tour_events.44.a: "Вранці донести на вартових судді."
  grand_tour_events.44.b: "Викликати вартових на двобій просто в провулку."
  grand_tour_events.44.c: "Кинутися на вулицю, кличучи на допомогу."
  grand_tour_events.44.d: "Віддати гаманець і піти геть."
  grand_tour_events.44.desc: "Повертаючись затемна, [target_leader.GetName] зазнає нападу в провулку від людей у лівреях міської варти, яких куди більше цікавить гаманець чужинця, ніж закон, який вони присягалися берегти."
  grand_tour_events.44.title: "Продажна варта"
  grand_tour_events.45.a: "Чудовий початок для дружби."
  grand_tour_events.45.b: "Побажати йому успіху й триматися власного товариства."
  grand_tour_events.45.desc: "Серед натовпу галасливого шинку наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] заводить розмову з [gt_friend.GetName], ще одним молодим шляхтичем з батьківщини, що долає той самий шлях з тих самих причин. Вони відразу знаходять спільну мову, ділячись розповідями про свій край та мандри, перш ніж дорога знову розводить їх — кожного до свого міста."
  grand_tour_events.45.title: "Подорожній"
  grand_tour_events.46.a: "Тихо сплатити [gt_friend.GetHerHis] борг із власного гаманця."
  grand_tour_events.46.b: "Написати нашим знайомим, щоби вони надали [gt_friend.GetHerHim] позику."
  grand_tour_events.46.c: "Побажати [gt_friend.GetHerHim] успіху й дозволити [gt_friend.GetHerHim] самотужки знайти [gt_friend.GetHerHis] вихід із цієї скрути."
  grand_tour_events.46.desc: "$grand_tour_events.friend_reunion_intro$ [gt_friend.GetHerHis] гаманець, зізнається [gt_friend.GetSheHe], спорожнів через невдачу за картярським столом, і [gt_friend.GetSheHe] запитує з очевидним збентеженням, чи не могли б ми якось зарадити, перш ніж борг обернеться на безчестя."
  grand_tour_events.46.title: "Друг у біді"
  grand_tour_events.47.a: "Сісти й пояснити, спираючись на те, що ми вже знаємо."
  grand_tour_events.47.b: "Найняти вчителя, щоби той розтлумачив усе [gt_friend.GetHerHim]."
  grand_tour_events.47.c: "Сказати [gt_friend.GetHerHim], що все просто, і полишити [gt_friend.GetHerHim] розбиратися самотужки."
  grand_tour_events.47.desc: "$grand_tour_events.friend_reunion_intro$ Надолужуючи згаяне за час розлуки, [gt_friend.GetNameWithNoTooltip] зізнається, що не може второпати один виклад — текст, який нам самим уже давно зрозумілий, — і просить допомогти розібратися."
  grand_tour_events.47.title: "Спільне відкриття"
  grand_tour_events.48.a: "Надіслати звістку нашому знайомому з проханням поручитися за [gt_friend.GetHerHim]."
  grand_tour_events.48.b: "Натомість оплатити [gt_friend.GetHerHis] вхід на менш вишукану гостину."
  grand_tour_events.48.c: "Сказати [gt_friend.GetHerHim], нехай торує шлях [gt_friend.GetHerHis] власними силами."
  grand_tour_events.48.desc: "$grand_tour_events.friend_reunion_intro$ [gt_friend.GetNameWithNoTooltip] почув про приватний салон у [target_location.GetNameWithNoTooltip], де збирається найвище панство [target_location.GetRank.GetName], але там немає нікого, хто міг би відкрити [gt_friend.GetHerHim] туди двері. А от [target_leader.GetName] завдяки зв’язкам, набутим під час мандрівки, — зовсім інша річ."
  grand_tour_events.48.title: "Слово до потрібного вуха"
  grand_tour_events.49.a: "Втрутитися самим — ми знаємо, як поводитися з такими людьми."
  grand_tour_events.49.b: "Просто розплатитися з тим, кому належить борг, і на цьому закрити справу."
  grand_tour_events.49.c: "Залишити [gt_friend.GetHerHim] самотужки розсьорбувати наслідки."
  grand_tour_events.49.desc: "$grand_tour_events.friend_reunion_intro$ Зустріч швидко набирає лихого оберту: [gt_friend.GetNameWithNoTooltip] перейшов дорогу місцевому лихвареві, і тепер цей чоловік стоїть біля їхнього столика в корчмі з двома найнятими головорізами, обіцяючи потрощити не лише меблі, якщо борг не буде сплачено цієї ж ночі."
  grand_tour_events.49.title: "Загроза насильства"
  grand_tour_events.5.connections: "Провести останні тижні при дворі [court_host.GetNameWithNoTooltip]."
  grand_tour_events.5.experience: "Приєднатися до землекопів, які розкопують похований Геркуланум."
  grand_tour_events.5.knowledge: "Провести останні тижні серед бібліотек та руїн."
  grand_tour_events.5.party: "Обміняти уроки на останню ніч у корчмах [target_location.GetNameWithNoTooltip]."
  grand_tour_events.50.a: "Оплатити лікаря, попри заперечення [gt_friend.GetHerHis]."
  grand_tour_events.50.b: "Виходити [gt_friend.GetHerHim] самим, спираючись на власний дорожній досвід."
  grand_tour_events.50.c: "Відвідати [gt_friend.GetHerHim] і побажати [gt_friend.GetHerHim] якнайшвидшого одужання."
  grand_tour_events.50.d: "Краще тоді не наближатися."
  grand_tour_events.50.desc: "До [target_leader.GetName] доходить звістка, що [gt_friend.GetName] теж прибув до [target_location.GetName] і тепер лежить у ліжку в місцевій корчмі, злягши з гарячковим ознобом, підхопленим у дорозі. Корчмар бурмоче, що гаманець юнака видавався худим, коли той платив за кімнату, і що він уже двічі відмовлявся від місцевого лікаря, аби заощадити на платі."
  grand_tour_events.50.title: "Невелика недуга"
  grand_tour_events.6.connections: "Завітати до [court_host.GetNameWithNoTooltip] та найзнатніших домів [target_location.GetRank.GetNameWithNoTooltip]."
  grand_tour_events.6.experience: "Оглянути кар’єри [ShowGoodsNameWithNoTooltip('marble')] і річкову торгівлю на Адідже."
  grand_tour_events.6.knowledge: "Дослідити римські руїни та стародавнє інженерне мистецтво арени."
  grand_tour_events.6.party: "Пропустити амфітеатр заради ночі в корчмах унизу."
  grand_tour_events.7.connections: "Побувати на виставі при дворі [court_host.GetNameWithNoTooltip]."
  grand_tour_events.7.experience: "Оглянути герцогський арсенал і шлюзи каналу в [target_location.GetRank.GetNameWithNoTooltip]."
  grand_tour_events.7.knowledge: "Прочитати лицарські романи, які зберігаються в герцогській бібліотеці."
  grand_tour_events.7.party: "Відкласти герцогські вірші заради веселішого вечора."
  grand_tour_events.8.connections: "$grand_tour_events.seek_audience$"
  grand_tour_events.8.experience: "Оглянути мануфактури [ShowGoodsNameWithNoTooltip('silk')], що зробили нитку [target_location.GetNameWithNoTooltip] славетною."
  grand_tour_events.8.historical_info: "1739 року французький суддя Шарль де Бросс, мандруючи Італією, провів вечір у Болоньї в будинку Лаури Бассі — уже тоді першої жінки в Європі, що посіла університетську кафедру, — де місцеві вчені збиралися обговорювати нову науку про електрику. Пізніше де Бросс згадував, як йому довелося струсити пил зі своєї школярської латини, щоби сперечатися про магнетизм і «дивовижне притягання наелектризованих тіл» перед присутнім товариством. Він описав цей вечір у своїх #italic Lettres familières écrites d'Italie#!, і салон Бассі став однією з найвідвідуваніших зупинок для мандрівників «Гран-туру», які проїжджали містом."
  grand_tour_events.8.knowledge: "Відвідати лекцію з цивільного права в університеті."
  grand_tour_events.8.party: "Пропустити лекцію заради вина в компанії студентів."
  grand_tour_events.8.title: "[target_location.GetNameWithNoTooltip], місто вчености"
  grand_tour_events.9.connections: "Подивитися перегони з лоджії [court_host.GetNameWithNoTooltip]."
  grand_tour_events.9.experience: "Дослідити фрески та славетні банківські книги [target_location.GetRank.GetNameWithNoTooltip]."
  grand_tour_events.9.historical_info: "Восени 1764 року романіст Тобіас Смоллетт перервав свій шлях із Флоренції до Рима ночівлею в Сієні та побідкався у своїх опублікованих #italic «Подорожах Францією та Італією» #!, що був «погано розквартирований у будинку, який тхнув наче відхоже місце», і «жахливо повечеряв». Він визнавав, що місто було «великим і добре забудованим», та зазначав, що сієнці «пишаються своєю ґречністю та чистотою свого наріччя» — настільки, що чужоземні мандрівники оселялися тут винятково заради того, щоби вивчити правильну італійську вимову. Оповідь Смоллетта стала однією з найвідоміших англійських скарг на гостинність Тоскани часів Гранд-туру."
  grand_tour_events.9.knowledge: "Відвідати лекцію з канонічного права в університеті."
  grand_tour_events.9.party: "Проміняти фрески на гральні столи Кампо."
  grand_tour_events.9.title: "[target_location.GetNameWithNoTooltip], місто Паліо"
