  grand_tour_events.opportunity_accept: "Приймемо цю пропозицію."
  grand_tour_events.opportunity_commit: "Цілком присвятити себе цьому на шкоду іншим справам."
  grand_tour_events.opportunity_decline: "Ввічливо відмовитися й продовжити подорож."
  grand_tour_events.reflect_and_continue: "Поміркувати над вивченим і продовжити подорож."
  grand_tour_events.worth_the_delay: "і чи варта вона була затримки в подорожі."
  grand_tour_events.seek_audience: "Домогтися аудієнції в [court_host.GetNameWithNoTooltip]."
  grand_tour_events.seek_castle_audience: "Домогтися аудієнції в замку в [court_host.GetNameWithNoTooltip]."
  grand_tour_events.attend_university_lectures: "Відвідати лекції в університеті."
  grand_tour_events.prodigy_knowledge: "Продемонструвати, що [target_leader.GetNameWithNoTooltip] взірець вчености."
  grand_tour_events.prodigy_connections: "Продемонструвати, що [target_leader.GetNameWithNoTooltip] віртуоз у налагодженні зв’язків."
  grand_tour_events.prodigy_experience: "Продемонструвати, що [target_leader.GetNameWithNoTooltip] взірець досвідчености."
  grand_tour_events.1.title: "Марморина"
  grand_tour_events.1.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] зібрався, скрині спаковано, а супровід уже вирушив на дорогу на південь. На нас чекає #TOOLTIP:REGION,italy_region,X #L Італія#!#! — край стародавніх руїн, знань доби #TOOLTIP:INSTITUTION,renaissance,X #L Відродження#!#! та дворів, чиє політичне мистецтво змушує північ видаватися юною. Усе, чого навчиться там наш [ROOT.GetCountry.GetGovernment.GetHeirTitle], визначатиме долю країни на ціле покоління. Питання лише в тому, яку саме науку ми хочемо [target_leader.GetHerHim] дати."
  grand_tour_events.1.a: "Величні двори Італії навчать [target_leader.GetHerHis] того, чого не розкажуть книги."
  grand_tour_events.1.party: "Spend the coin on one last night of revelry before the road."
  grand_tour_events.2.desc.geography_intro: "[target_location.GetName] — це [target_location.GetRank.GetName], що існує всупереч самій географії, стоїть на мулі, тримається на торгівлі та керується радою купецьких родин, які пережили всі доми #TOOLTIP:CONTINENT,europe,X #L Європи#!#!."
  grand_tour_events.2.desc.ducal_palace: "While the opulent ducal palace gleams pink above the lagoon in a show of refinement and luxury for all to see."
  grand_tour_events.2.desc.heir_arrival: "Our [ROOT.GetCountry.GetGovernment.GetHeirTitle] has arrived in perhaps the most cosmopolitan [target_location.GetRank.GetNameWithNoTooltip] in [ShowContinentNameWithNoTooltip('europe')], where every language of the Mediterranean is spoken in the markets and every kind of intelligence can be purchased at the right price."
  grand_tour_events.2.title: "[target_location.GetNameWithNoTooltip] — Сереніссіма"
  grand_tour_events.2.desc: "$grand_tour_events.2.desc.geography_intro$ [ShowBuildingTypeName('venetian_arsenal')], що розкинувся на весь східний квартал, здатний закласти кіль військового корабля і спустити його на воду готовим за один робочий день. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
  grand_tour_events.2.desc.no_arsenal: "$grand_tour_events.2.desc.geography_intro$ Звичайні корабельні тягнуться вздовж східного кварталу, випускаючи торгові корпуси та військові галери в тому неспішному темпі, що притаманний будь-якому порту в Європі. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
  grand_tour_events.2.knowledge: "Study naval engineering in the [ShowBuildingTypeNameWithNoTooltip('venetian_arsenal')]."
  grand_tour_events.2.experience: "Tour the shipyards where [target_location.GetNameWithNoTooltip]'s war galleys are built."
  grand_tour_events.2.connections: "Побувати на прийомі, який влаштовує [court_host.GetNameWithNoTooltip]."
  grand_tour_events.2.party: "Покинути рахункові книги та провести ніч серед гульвіс на каналах."
  grand_tour_events.2.historical_info: "У XV столітті Венеція належала до наймогутніших країн Європи й була найбагатшим містом західного Середземномор’я. В Арсеналі працювало до шістнадцяти тисяч робітників, і він започаткував потокове виробництво за кілька століть до промислового перевороту: за потреби там могли повністю спорядити озброєну галеру лише за один день. Унікальний устрій Венеції, що впродовж восьмисот років протистояв як внутрішнім заколотам, так і зовнішнім завоюванням, із захопленням досліджували мислителі всієї Європи, вбачаючи в ньому взірець стабільного республіканського врядування."
  grand_tour_events.3.title: "[target_location.GetNameWithNoTooltip], [target_location.GetRank.GetNameWithNoTooltip] [ShowInstitutionNameWithNoTooltip('renaissance')]"
  grand_tour_events.3.desc: "[target_location.GetName] менше за свою славу й набагато химерніше. [target_location.GetRank.GetName] повниться новими ідеями: філософи називають його відродженням античности, купці — вигідною справою, художники — грою світла на тиньку. Наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибуває і дізнається, що цього вечора двір прийме чужоземних гостей, якщо [target_leader.GetSheHe] не надто [Select_CString(target_leader.IsFemale, 'стомлена', 'стомлений')] дорогою.\n\nОкремо надходить і запрошення до монастирської книгозбірні, де тихо зберігається найвизначніше зібрання [ShowCultureName('greek_culture')|l]их рукописів у всьому західному християнському світі."
  grand_tour_events.3.knowledge: "Seek an introduction to the scholars at the monastery."
  grand_tour_events.3.experience: "Tour the [ShowGoodsNameWithNoTooltip('wool')] workshops and the Ponte Vecchio goldsmiths."
  grand_tour_events.3.connections: "Learn the art of patronage at the court of [court_host.GetNameWithNoTooltip]."
  grand_tour_events.3.party: "Set the manuscripts aside for gaming at [target_location.GetNameWithNoTooltip]'s tables."
  grand_tour_events.3.historical_info: "In the autumn of 1764, the ailing Scottish novelist Tobias Smollett toured the Uffizi and, standing before the Venus de' Medici that every other Grand Tourist praised on faith, wrote, 'I cannot help thinking that there is no beauty in the features of Venus, and that the attitude is aukward and out of character.' Laurence Sterne later immortalized the outburst, having his fictional Yorick confront 'Smelfungus' over it before the Pantheon in Rome, complaining he had 'fallen foul upon the goddess, and used her worse than a common strumpet, without the least provocation in nature.' Their quarrel over one marble Venus outlived them both."
  grand_tour_events.4.title: "[target_location.GetNameWithNoTooltip] — Вічне місто"
  grand_tour_events.4.desc: "[target_location.GetName] існує водночас у двох епохах. Форум лежить відкритим під зимовою травою, його колони стоять під дивними кутами посеред пасовищ для худоби, а мармур розтягнуто на потреби кожного підрядника за минулу тисячу років. Над усім цим височіє храм, якому судилося стати престолом усього християнського світу, — він панує над серцем нинішнього [target_location.Custom('LR_GEN')].\n\n[target_leader.GetName] може провести [target_leader.GetHisHer] час як серед руїн, так і серед живих. Папський двір старий, церемонний і пов’язаний із кожним [ShowReligionAdjective('catholic')|l]им престолом у #TOOLTIP:CONTINENT,europe,X #L Європі#!#!."
  grand_tour_events.4.knowledge: "Consult the Vatican Library's manuscripts and humanists."
  grand_tour_events.4.experience: "Walk the ancient ruins and measure the monuments."
  grand_tour_events.4.connections: "$grand_tour_events.seek_audience$"
  grand_tour_events.4.party: "Leave the ruins for a night in [target_location.GetNameWithNoTooltip]'s wine shops."
  grand_tour_events.4.historical_info: "On 15 October 1764, the English gentleman Edward Gibbon, then completing his own Grand Tour of Italy, sat musing amid the ruins on the Capitoline Hill while barefoot friars sang vespers in what he took for the old Temple of Jupiter. He later wrote in his memoirs that it was there, amid broken columns and the fading evening chant, that 'the idea of writing the decline and fall of the city first started to my mind.' The notion he carried away from that single Roman evening grew, across the next twenty years of study back in England, into #italic The History of the Decline and Fall of the Roman Empire#!."
  grand_tour_events.5.title: "[target_location.GetNameWithNoTooltip], [target_country.GetLongNameWithNoTooltip]"
  grand_tour_events.5.desc: "[target_location.GetName] — найпівденніша точка подорожі та найдавніший із величних дворів #TOOLTIP:CULTUREGROUP,italian_group,X #L італійців#!#!, [target_location.GetRank.GetName], де мешкає мільйон душ, що розкинулося в затінку Везувію; його історія нашаровується одна на одну — [ShowCultureName('greek_culture')|l]і, [ShowCultureName('roman_culture')|l]і, [ShowCultureName('norman')|l]і та навіть пізніші володарі, і кожне завоювання помітне в архітектурі, якщо знати, куди дивитися. [target_country.GetGovernment.GetAdjective|l]ий [target_country.GetGovernment.GetCourtTitle|l] приймає гостей із церемоніалом, поруч із яким двори північної #TOOLTIP:CONTINENT,europe,X #L Європи#!#! здаються чимось тимчасовим.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] уже побачив такі видатні міста як [ShowLocationName('venice')], [ShowLocationName('florence')] та [ShowLocationName('rome')]. Це останній урок."
  grand_tour_events.5.knowledge: "Провести останні тижні серед бібліотек та руїн."
  grand_tour_events.5.experience: "Приєднатися до землекопів, які розкопують похований Геркуланум."
  grand_tour_events.5.connections: "Spend the last weeks at the court of [court_host.GetNameWithNoTooltip]."
  grand_tour_events.5.party: "Trade the lessons for a final night in [target_location.GetNameWithNoTooltip]'s taverns."
  grand_tour_events.5.historical_info: "Неаполь під владою свого правлячого дому в XV столітті був одним із найбільших і найлюдніших міст Європи, змагаючись із Парижем та Константинополем. Двір, заснований Альфонсо Великодушним після завоювання королівства в 1442 році, приваблював учених-гуманістів, поетів і митців з усієї Італії. Грецькі витоки міста виразно проглядалися в його найстаріших кварталах, а античні руїни перемежовувалися із середньовічними церквами по всій довколишній місцевості. Краєвиди Кампанії разом із похованими під попелом містами Помпеї та Геркуланум вабили шанувальників давнини щонайменше з XIV століття."
  grand_tour_events.6.title: "[target_location.GetNameWithNoTooltip] — Місто стародавньої Арени"
  grand_tour_events.6.desc: "[target_location.GetName] здіймається там, де згинається річка, а [target_location.GetRank.GetName|l] розбудований у довгій тіні амфітеатру, що старший за будь-який двір в #TOOLTIP:REGION,italy_region,X #L Італії#!#!. Римська арена вціліла майже непорушно, її кам’яні яруси височіють над дахами будинків, приймаючи ринки, ярмарки, а в рідкісні святкові дні — дещо схоже на ті самі ігри, заради яких її спорудили.\n\nТут є не лише руїни, але й навчальні зали, а двір охоче прийме такого гостя, як наш [ROOT.GetCountry.GetGovernment.GetHeirTitle]."
  grand_tour_events.6.knowledge: "Дослідити римські руїни та стародавнє інженерне мистецтво Колізею."
  grand_tour_events.6.experience: "Tour the [ShowGoodsNameWithNoTooltip('marble')] quarries and river trade along the Adige."
  grand_tour_events.6.connections: "Call upon [court_host.GetNameWithNoTooltip] and the [target_location.GetRank.GetNameWithNoTooltip]'s leading houses."
  grand_tour_events.6.party: "Skip the amphitheater for a night in the taverns below."
  grand_tour_events.6.historical_info: "Італійський півострів у XV столітті являв собою строкату мозаїку міст-держав, синьйорій та дрібних дворів, кожен з яких мав власну громадянську гордість і культурну самобутність. Міста, що за європейськими мірками губилися в тіні Флоренції чи Венеції, попри це були значними осередками мистецтва, науки й політичної думки. Верона за Скалігерів, Феррара під владою д'Есте, Болонья зі своїм прадавнім університетом, Сієна зі славетними банківськими звичаями, Піза з науковою спадщиною, Ассізі з францисканським надбанням та Перуджа з власною школою живопису — кожне з них відкривало щось неповторне мандрівникові, який мав достатньо часу та допитливости."
  grand_tour_events.7.title: "[target_location.GetNameWithNoTooltip] — Ідеальне місто"
  grand_tour_events.7.desc: "[target_location.GetName] не виглядає випадковістю, бо нею і не є. Широкі прямі проспекти розтинають цей [target_location.GetRank.GetName|l] за взірцем, до якого жодне середньовічне місто не доросло б саме по собі, — його розпланували зумисне, аби ним милувалися не менше, ніж у ньому жили. Герцогський театр, друкарні та поети, що не полишають двір, слугують одній меті: показати цей невеликий [target_location.GetRank.GetNameWithNoTooltip|l] майбутнім усього містобудування.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] знаходить тут двір, що цікавиться віршами не менше, ніж державними справами."
  grand_tour_events.7.knowledge: "Прочитати лицарські романи, які зберігаються в герцогській бібліотеці."
  grand_tour_events.7.experience: "Tour the ducal armory and the [target_location.GetRank.GetNameWithNoTooltip]'s canal locks."
  grand_tour_events.7.connections: "Attend a performance at the court of [court_host.GetNameWithNoTooltip]."
  grand_tour_events.7.party: "Відкласти герцогські вірші заради веселішого вечора."
  grand_tour_events.7.historical_info: "Зворотний шлях Ґранд-туру рідко повторював дорогу туди. Мандрівники, повертаючись через Альпи, спускалися в німецькі землі, швейцарські кантони або Францію, і молодий спадкоємець дорогою додому часто робив зупинку у великому північному місті — серед яких були Відень, Мюнхен, Ліон чи Париж, — щоб перепочити та з’явитися при дворі. Ця ввічливість на шляху додому була частиною дипломатичної мети подорожі: спадкоємець, якого гостинно прийняли за кордоном, повертався зі зв’язками та прихильністю, здатними впливати на союзи цілого покоління."
  grand_tour_events.8.title: "[target_location.GetNameWithNoTooltip] — Вчене місто"
  grand_tour_events.8.desc: "[target_location.GetName] навчає праву й красномовству довше, ніж будь-яке інше місце християнського світу, і цей [target_location.GetRank.GetName|l] відкрито пишається своєю вченістю: портики повні спудеїв з усіх земель, а лекційні зали старші за більшість довколишніх церков. Приїжджий [ROOT.GetCountry.GetGovernment.GetHeirTitle] міг би провести тут усе життя і все одно не вичерпати написаного правознавцями.\n\nЄ тут і двір, який варто побачити, якщо політика цікавить нас більше за правознавство."
  grand_tour_events.8.knowledge: "Відвідати лекцію з цивільного права в університеті."
  grand_tour_events.8.experience: "Tour the [ShowGoodsNameWithNoTooltip('silk')] mills that made [target_location.GetNameWithNoTooltip]'s thread famous."
  grand_tour_events.8.connections: "$grand_tour_events.seek_audience$"
  grand_tour_events.8.party: "Пропустити лекцію заради вина в компанії студентів."
  grand_tour_events.8.historical_info: "У 1739 році французький правник Шарль де Бросс, подорожуючи Італією, провів вечір у Болоньї в оселі Лаури Бассі — першої в Європі жінки, яка здобула університетську кафедру, — де місцеві вчені зібралися, щоб обговорити нові відкриття в науці про електрику. Пізніше де Бросс згадував, як йому довелося згадати свою заіржавілу шкільну латину, аби посперечатися перед зібраним товариством про магнетизм і «дивовижне притягання наелектризованих тіл». Він описав цей вечір у своїх #italic Lettres familières écrites d'Italie#!, а салон Бассі став одним із найвідвідуваніших місць для мандрівників Гранд-туру, які проїжджали крізь місто."
  grand_tour_events.9.title: "[target_location.GetNameWithNoTooltip] — Місто Паліо"
  grand_tour_events.9.desc: "[target_location.GetName] височіє на трьох пагорбах навколо площі у формі черепашки, а його смугастий собор видно з кожної вулиці, що підіймається до нього. Цей [target_location.GetRank.GetName|l] збудував свій добробут на #TOOLTIP:GOODS,wool,X #L вовні#!#! та банківській справі, перш ніж його затьмарила [ShowLocationName('florence')], і він так і не пробачив цього — суперництво й понині забарвлює кожну розмову при дворі.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибуває саме вчасно, аби побачити кінні перегони, що двічі на рік сповнюють площу знаменами та всім іншим."
  grand_tour_events.9.knowledge: "Відвідати лекцію з канонічного права в університеті."
  grand_tour_events.9.experience: "Study the frescoes and the [target_location.GetRank.GetNameWithNoTooltip]'s famous banking ledgers."
  grand_tour_events.9.connections: "Watch the race from the loggia of [court_host.GetNameWithNoTooltip]."
  grand_tour_events.9.party: "Проміняти фрески на гральні столи Кампо."
  grand_tour_events.9.historical_info: "Восени 1764 року романіст Тобіас Смоллетт перервав свій шлях із Флоренції до Рима ночівлею в Сієні та побідкався у своїх опублікованих #italic «Подорожах Францією та Італією» #!, що був «погано розквартирований у будинку, який тхнув наче відхоже місце», і «жахливо повечеряв». Він визнавав, що місто було «великим і добре забудованим», та зазначав, що сієнці «пишаються своєю ґречністю та чистотою свого наріччя» — настільки, що чужоземні мандрівники оселялися тут винятково заради того, щоби вивчити правильну італійську вимову. Оповідь Смоллетта стала однією з найвідоміших англійських скарг на гостинність Тоскани часів Гранд-туру."
  grand_tour_events.10.title: "[target_location.GetNameWithNoTooltip] — Місто Похилої вежі"
  grand_tour_events.10.desc: "[target_location.GetName] звів дзвіницю, яка ніяк не бажала стояти прямо, і замість того, щоб знести її, тут просто продовжили будівництво; цей [target_location.GetRank.GetName|l] сприймає цей нахил як привід для гордощів, а не сорому. Колись морська потуга, що змагалася з #TOOLTIP:LOCATION,genoa,X #L Генуєю#!#! та #TOOLTIP:LOCATION,venice,X #L Венецією#!#!, вона давно втратила свої галери, але університет та соборна площа залишилися.\n\nВідвідуючи місто, наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] може з однаковим успіхом вивчати науки тут або прогулятися гаванню, яка колись мала вагу."
  grand_tour_events.10.knowledge: "Відвідати лекції в університеті на соборній площі."
  grand_tour_events.10.experience: "Оглянути старий арсенал і майстерні чинбарів уздовж Арно."
  grand_tour_events.10.connections: "Present ourselves to [court_host.GetNameWithNoTooltip]."
  grand_tour_events.10.party: "Покинути лекцію заради ночі в портових корчмах."
  grand_tour_events.10.historical_info: "Наприкінці 1821 року Персі та Мері Шеллі осіли в Пізі й умовили лорда Байрона приєднатися до них, оселивши його в палаці Ланфранкі на набережній Лунґарно; разом з Едвардом і Джейн Вільямс, а пізніше Едвардом Трелоні, вони утворили гурток, згодом відомий як «Пізанський гурток». Байрон прибув із почтом із коней, собак і мавп, і всю зиму товариство плекало задуми літературного часопису #italic «Ліберал» #!. Лі Гант зрештою дістався до Італії наступного літа, висадившись лише за кілька днів до того, як Шеллі втопився біля берегів Тоскани в липні того ж року; гурток, заснований Шеллі в Пізі, розпався за кілька місяців, залишивши місто однією з найпам’ятніших зупинок доби романтизму."
  grand_tour_events.11.title: "[target_location.GetNameWithNoTooltip] — Місто Святого Франциска"
  grand_tour_events.11.desc: "[target_location.GetName] здіймається зеленим схилом пагорба довкола базиліки, зведеної, щоб берегти мощі народженої тут людини — ченця, який не володів нічим і залишив цей [target_location.GetRank.GetName|l] одним із найвидатніших місць паломництва на заході. Розписані фресками стіни всередині однаково приваблюють і художників, і прочан.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] може провести час відвідин серед фресок або серед ченців, які все ще дотримуються уставу ордену."
  grand_tour_events.11.knowledge: "Вивчити фрески та житіє святого."
  grand_tour_events.11.experience: "Оглянути майстерні, що виготовляють побожні реліквії та значки."
  grand_tour_events.11.connections: "Meet with [court_host.GetNameWithNoTooltip] and the town's officials."
  grand_tour_events.11.party: "Set the friars' company aside for a livelier night in town."
  grand_tour_events.11.historical_info: "Увечері 26 жовтня 1786 року Йоганн Вольфґанґ фон Ґете прибув до Ассізі і, за його власними словами в #italic«Італійській подорожі»#!, відвернувся від «величезної купи церков, навалених одна на одну, немов Вавилонська вежа», де спочивали мощі святого Франциска, відгукнувшись про місце паломництва з явною неприязню. Натомість він піднявся до римського храму Мінерви на майдані старого міста, назвавши його «першою цілісною пам’яткою античности, яку мені довелося побачити». Зневага Ґете до найвідомішої святині Ассізі на користь язичницького храму стала одним із найнесподіваніших особистих суджень, що дійшли до нас із доби Grand Tour."
  grand_tour_events.12.title: "[target_location.GetNameWithNoTooltip] — Етруське місто"
  grand_tour_events.12.desc: "[target_location.GetName] височіє на своєму пагорбі за мурами, які етруски звели задовго до того, як Рим здобув славу, і цей [target_location.GetRank.GetName|l] як і раніше щодня проходить крізь їхні брами, навіть не замислюючись про це. Місцеві художники останнім часом зажили слави по всій #TOOLTIP:REGION,italy_region,X #L Італії#!#!, а університетські лекційні зали залишаються повними вщерть.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] може досліджувати або стародавні мури, або нові картини — як підкаже власна вдача."
  grand_tour_events.12.knowledge: "Вчитися в університеті й пройтися вздовж давніх етруських мурів."
  grand_tour_events.12.experience: "Відвідати гончарні майстерні, що славляться майолікою."
  grand_tour_events.12.connections: "Seek an introduction at the court of [court_host.GetNameWithNoTooltip]."
  grand_tour_events.12.party: "Skip the old walls for a night among the students' taverns."
  grand_tour_events.12.historical_info: "На початку 1765 року письменник Тобіас Смоллетт повертався з Рима до Флоренції, коли його карета почала крутий підйом до Перуджі, а знесилені коні стали задкувати під вагою екіпажа, тягнучи його до краю урвища. Перехожий вчасно підсунув під одне з коліс великий камінь, зупинивши ковзання та врятувавши все товариство від того, щоб, за власними словами Смоллетта, розбитися на друзки. Оскільки перепряжних коней того дня не знайшлося, Смоллетту та його родині довелося заночувати в місті, оглядаючи його церкви й полотна уродженця цих місць, П’єтро Перуджино, перш ніж знову вирушити в дорогу до Флоренції."
  grand_tour_events.13.title: "[target_location.GetNameWithNoTooltip] — Місто на Дунаї"
  grand_tour_events.13.desc: "[target_location.GetName] охороняє річкову переправу, де сходяться шляхи з #TOOLTIP:REGION,italy_region,X #L Італії#!#!, #TOOLTIP:REGION,balkan_region,X #L Балкан#!#! та земель, де говорять [ShowLanguageName('german_language')|l]ою, і цей [target_location.GetRank.GetName|l] неабияк збагатився на митах. Герцогський Гофбург височіє в самій його середині — осідок двору, що вважає себе чимось більшим, ніж просто місцева влада.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] нарешті перетнув Альпи; звідси дороги стануть легшими."
  grand_tour_events.13.knowledge: "Відвідати соборні школи та міських учених."
  grand_tour_events.13.experience: "Оглянути арсенал і причали човнарів уздовж Дунаю."
  grand_tour_events.13.connections: "Present ourselves at the Hofburg to [court_host.GetNameWithNoTooltip]."
  grand_tour_events.13.party: "Проміняти соборні школи на ніч біля Дунаю."
  grand_tour_events.13.historical_info: "У 1775 році лікар Джон Мур відвідав Відень як супутник молодого герцога Гамільтона; імператор Йосиф II, а згодом і сама імператриця Марія Терезія прийняли їх на приватній аудієнції в Шенбрунні. Мур зауважив, що легендарна суворість двору розтанула, щойно державний канцлер князь Кауніц помітив чотирнадцятирічного сина самого Мура, який подорожував разом із ними, і наполіг, аби імператор з імператрицею прийняли й хлопця. Мур також записав давню придворну оповідку про спалах віспи, що вразив родину Габсбургів за вісім років до того: дізнавшись, що підхопила хворобу, одна з дочок імператриці негайно попросила люстерко й весело попрощалася зі своєю вродою, яку ця пошесть мала знівечити."
  grand_tour_events.14.title: "[target_location.GetNameWithNoTooltip] — Золоте місто"
  grand_tour_events.14.desc: "[target_location.GetName] розкинувся по обидва береги Влтави, кам’яний міст з’єднує старе місто із замковим пагорбом, і цей [target_location.GetRank.GetName|l] тримається так, ніби він столиця імперії. Університет на пагорбі приваблює студентів з усіх куточків земель, де говорять [ShowLanguageName('german_language')|l]ою, і не тільки.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] застає місто, що міряє власну велич віками, а не порами року."
  grand_tour_events.14.knowledge: "Відвідати лекції в університеті на пагорбі."
  grand_tour_events.14.experience: "Оглянути гути й майстерні золотарів Золотої вулички."
  grand_tour_events.14.connections: "$grand_tour_events.seek_castle_audience$"
  grand_tour_events.14.party: "Leave the university for a night among the river taverns."
  grand_tour_events.14.historical_info: "Подорожуючи Богемією в 1775 році як супутник молодого герцога Гамільтона, лікар Джон Мур стояв зі своїм підопічним на празькій вулиці, коли священник з однієї з міських семінарій, проходячи повз, почув їхню розмову і заявив: «Запевняю вас, я теж ірландець». На запитання, як він так швидко розпізнав їхнє походження, священник відповів, що зрозумів це, щойно зачув англійську мову. Він став їхнім провідником до кінця відвідин і в якусь мить показав їм вікно канцелярії, з якого в 1618 році викинули двох дворян та їхнього секретаря — приклад, який Мур з усмішкою радив усім державним мужам."
  grand_tour_events.15.title: "[target_location.GetNameWithNoTooltip] — Місто ченців"
  grand_tour_events.15.desc: "[target_location.GetName] бере саму свою назву від ченців, чиє поселення стояло тут ще до того, як герцоги облаштували поруч ринок і монетний двір, і відтоді цей [target_location.GetRank.GetName|l] помітно розрісся. Герцогський двір Віттельсбахів тримає [target_location.GetRank.GetNameWithNoTooltip|l] у значно більшому ладі, ніж більшість інших, а місцеві броварі дбають про те, аби не бракувало припасів.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] знайде тут і вчених мужів, і добре впорядкований двір."
  grand_tour_events.15.knowledge: "Відвідати соборні школи та міських літописців."
  grand_tour_events.15.experience: "Tour the ducal armory and the [ShowGoodsNameWithNoTooltip('salt')] trade warehouses."
  grand_tour_events.15.connections: "Present ourselves at the ducal court of [court_host.GetNameWithNoTooltip]."
  grand_tour_events.15.party: "Відкласти літописи заради ночі серед броварів."
  grand_tour_events.15.historical_info: "У 1786 році письменниця Естер Лінч Піоцці проїжджала через Мюнхен разом із чоловіком під час їхньої тривалої весільної подорожі континентом, прибувши на світанку після нічного переходу через Альпи з Інсбрука, і зупинилася, щоб оглянути картинну галерею та кабінет рідкостей курфюрста. Серед експонатів, показаних їй місцевим збирачем, було найтонше зображення Мадонни з Дитятком, виконане з чогось подібного до павутиння, настільки філігранної роботи, що постаті годі було розгледіти неозброєним оком — лише під мікроскопом. Піоцці з подивом описала цю дрібничку, дивуючись тому, скільки праці було покладено на такий витончений і геть непотрібний виріб."
  grand_tour_events.16.title: "[target_location.GetNameWithNoTooltip] — Місто на Сені"
  grand_tour_events.16.desc: "[target_location.GetName] розкинувся по обидва береги річки довкола острова, увінчаного величним собором, і цей [target_location.GetRank.GetName|l] більший майже за все, що наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] устиг побачити за цю подорож. Університетський квартал на лівому березі навчає богослов’ю та праву більше студентів, ніж деякі міста налічують жителів.\n\nКоролівський двір, приймаючи гостей, робить це з такою врочистістю, що не лишається сумнівів у його власній високій думці про себе."
  grand_tour_events.16.knowledge: "Відвідати диспути в університеті на лівому березі."
  grand_tour_events.16.experience: "Відвідати палітурні та друкарські майстерні поблизу університету."
  grand_tour_events.16.connections: "$grand_tour_events.seek_audience$"
  grand_tour_events.16.party: "Пропустити диспути заради шинків на лівому березі."
  grand_tour_events.16.historical_info: "Під час свого перебування в Парижі в жовтні 1763 року письменник Тобіас Смоллетт спостерігав, як наймана карета зупинилася на дорозі до Шуазі і з неї висипало п’ятеро чи шестеро озброєних чоловіків, кожен з яких зайняв позицію за окремим деревом. Очікуючи побачити розбійників або урядовців, що переслідують злочинця, Смоллетт запитав свого слугу, хто це такі, і дізнався, що це були пани, які виїхали з міста на одноденне полювання на зайців і стріляли зі схованки по будь-якій дичині, що пробігала повз. Смоллетт визнав усе це видовище безглуздим, сухо зауваживши, що принаймні це був дієвий спосіб очистити поле від зайців."
  grand_tour_events.17.title: "[target_location.GetNameWithNoTooltip] — Місто ярмарків"
  grand_tour_events.17.desc: "[target_location.GetName] стоїть на злитті двох річок, і [target_location.GetRank.GetName] обертає це злиття на справжнє багатство: купці з #TOOLTIP:REGION,italy_region,X #L Італії#!#!, земель, де говорять [ShowCultureGroupName('german_group')|l]ою, та Фландрії з’їжджаються сюди на королівські ярмарки, коли вулиці заповнюються такою силою #TOOLTIP:GOODS,silk,X #L шовку#!#! та #TOOLTIP:GOODS,dyes,X #L барвників#!#!, що бракує комор. Тутешні друкарські верстати працюють майже так само вправно, як ткацькі.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибуває і застає місто, що живе торгівлею, а не церемоніями."
  grand_tour_events.17.knowledge: "Знайти поетів-гуманістів, які збираються біля друкарських верстатів."
  grand_tour_events.17.experience: "Відвідати друкарні й погортати рахункові книги купців."
  grand_tour_events.17.connections: "Call upon [court_host.GetNameWithNoTooltip] and the [target_location.GetRank.GetNameWithNoTooltip]'s leading merchants."
  grand_tour_events.17.party: "Відкласти рахункові книги заради ночі серед гульвіс."
  grand_tour_events.17.historical_info: "У жовтні 1763 року письменник Тобіас Смоллетт, прямуючи на південь до Італії, прибув до Ліона й описав цей візит у листах, згодом виданих під назвою #italic Подорожі Францією та Італією#!. Його скерували до заїзду, який виявився переповненим, і поселили в шинку, де за три вбогі кімнати правили дванадцять ліврів на день, а за харчування — ще тридцять два; обурений таким здирством, він мовчки поїхав геть і подався просто до іншого заїзду. Розповідь Смоллетта про ліонських шинкарів, які деруть утридорога, стала одним із найчастіше цитованих уривків його книги та улюбленим наріканням англійських мандрівників на шляху до Італії."
  grand_tour_events.18.title: "[target_location.GetNameWithNoTooltip] — Перехрестя доріг"
  grand_tour_events.18.desc: "[target_location.GetName] бере своє ім’я від доріг, що сходяться тут, і [target_location.GetRank.GetName] донині служить тій самій меті, розкинувшись по обидва боки річки, що розділяє землі, де розмовляють [ShowLanguageName('french_language')|l]ою, від земель, де розмовляють [ShowLanguageName('german_language')|l]ою. Шпиль його собору здіймається вище за все, що наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] бачив за всю мандрівку, — єдина вежа, пару якій так і не збудували.\n\nВільне місто править собою саме, а його друкарі останнім часом важать не менше за його купців."
  grand_tour_events.18.knowledge: "Побувати на лекції в гімназії Йоганна Штурма."
  grand_tour_events.18.experience: "Піднятися на вежу собору та відвідати друкарні."
  grand_tour_events.18.connections: "Meet with [court_host.GetNameWithNoTooltip] and the city council."
  grand_tour_events.18.party: "Покинути друкарні та провести ніч під шпилем."
  grand_tour_events.18.historical_info: "На початку 1770-х років шотландський лікар Джон Мур, подорожуючи континентом як супутник герцога Гамільтона, видерся на 466-футовий шпиль Страсбурзького собору й описав свій візит у книзі #italic«Погляд на суспільство і звичаї у Франції, Швейцарії та Німеччині»#!. Він оповідає, як чекав разом із натовпом появи на службі позашлюбного сина Людовіка XV, але коли вибило полудень, а вельможа так і не з’явився, громада розійшлася, не дочекавшись його, після чого Мур вислухав палку проповідь про тиранію пристрастей. Мур також зазначив, що в соборі щоночі сурмить великий ріг — на згадку про змову, яку провідники досі вважали причиною різанини, що сталася чотири століття тому."
  grand_tour_events.19.title: "[target_location.GetNameWithNoTooltip] — Брама Середземномор’я"
  grand_tour_events.19.desc: "[target_location.GetName] лишається портом із часів, що передували самому існуванню Рима; заснований [ShowCultureName('greek_culture')|l]ими мореплавцями, що побачили гавань і залишилися тут назавжди, [target_location.GetRank.GetName] донині пахне сіллю та смолою в кожному кварталі. Галери чи не з усього Середземномор’я тісняться біля його причалів, а на ринках продають крам, що ніколи не бачив глибинних земель #ONCLICK:COUNTRY,[GetCountry('FRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('FRA').GetKey],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#!.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] доходить висновку, що справжнім володарем [target_location.Custom('LR_GEN')] є саме море."
  grand_tour_events.19.knowledge: "Study the inscriptions recalling the [target_location.GetRank.GetNameWithNoTooltip]'s [ShowCultureNameWithNoTooltip('greek_culture')] founders."
  grand_tour_events.19.experience: "Відвідати гавань і поговорити із середземноморськими моряками."
  grand_tour_events.19.connections: "Call upon [court_host.GetNameWithNoTooltip]."
  grand_tour_events.19.party: "Обміняти плітки на ніч у портових шинках."
  grand_tour_events.19.historical_info: "У травні 1765 року письменник Тобіас Смоллетт прибув до Марселя під час свого повернення крізь Прованс і описав це портове місто в листах, згодом виданих під назвою #italic«Подорожі Францією та Італією»#!. Прогулюючись набережною гавані, він спостерігав за галерними невільниками, яких Корона віддавала в найм для праці в невеликих орендованих крамницях: прикуті однією ногою, вони, за його словами, жили непогано й виглядали веселими, працюючи шевцями, сріблярами та книгопродавцями. Смоллетт назвав Марсель шляхетним і квітучим містом, хоч і побідкався, що місцеві шинкарі правили з нього по чотири ліври з особи за кожне частування."
  grand_tour_events.20.title: "[target_location.GetNameWithNoTooltip] — Місто Августа"
  grand_tour_events.20.desc: "[target_location.GetName] носить ім’я імператора, що його заснував, і відтоді [target_location.GetRank.GetName] не припиняє рости. Банківські доми тут орудують сумами, поруч із якими скарбниці деяких королів видаються скромними, а імперський райхстаг збирається досить часто, тож приймати князів для [target_location.Custom('LR_GEN')] стало звичною справою.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибуває і застає місто, де про гроші говорять так само відверто, як і про родовід."
  grand_tour_events.20.knowledge: "Дослідити міські старожитності та гуманістичні рукописи."
  grand_tour_events.20.experience: "Дослідити рахівничі книги великих банківських домів."
  grand_tour_events.20.connections: "Attend a reception hosted by [court_host.GetNameWithNoTooltip]."
  grand_tour_events.20.party: "Відкласти гросбухи заради гральних столів."
  grand_tour_events.20.historical_info: "Уранці 15 липня 1772 року англійський історик музики Чарльз Берні прибув до Аугсбурга після нічної подорожі й одразу попрямував до собору, де почув німецьку проповідь і месу, виконану двома хорами з нагоди свята. Співаки захопили його, але гармонії органіста здалися йому настільки грубими й вигадливими, що виконання радше різало слух, ніж тішило його, а раптовий гуркіт барабанів і сурем під час піднесення Святих Дарів і поготів вразив його — звичай, якого він більше ніде не зустрічав, крім Антверпена. Довідавшись, що кантор, якому він віз листи, відсутній у місті, Берні, який збирав відомості для своєї історії музики, не став затримуватися."
  grand_tour_events.21.title: "[target_location.GetNameWithNoTooltip] — Катедральне місто"
  grand_tour_events.21.desc: "[target_location.GetName] будує свій собор довше, ніж пам’ятає будь-хто з нині живих, — недобудована вежа височіє над [target_location.Custom('LR_INST')], і на самісінькій її верхівці досі стоїть кран, залишений мулярами. Рейн проносить повз [target_location.Custom('LR_ACC')] більше товарів, ніж майже будь-де в землях, де говорять [ShowLanguageName('german_language')|l]ою, а тамтешній архієпископ править не менш владно, ніж будь-який володар.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] застає місто, що міряє терпіння століттями."
  grand_tour_events.21.knowledge: "Відвідати соборне будівництво та вчених університету."
  grand_tour_events.21.experience: "Оглянути ливарні, що виливають дзвони для церков Рейнської області."
  grand_tour_events.21.connections: "$grand_tour_events.seek_audience$"
  grand_tour_events.21.party: "Пропустити соборне будівництво заради ночі на березі Рейну."
  grand_tour_events.21.historical_info: "У вересні 1794 року романістка Енн Редкліфф дісталася Кельна під час подорожі Рейнландом із чоловіком — ця мандрівка була описана в її опублікованому дорожньому нарисі #italic A Journey Made in the Summer of 1794#!. Вона застала місто, переповнене біженцями, що тікали від французьких військ, які наступали на Льєж і Маастрихт, а його вулиці були забиті лазаретними возами з пораненими й тими, хто вмирав. Усі заїзди були переповнені; подорожні спали в каретах, на більярдних столах і на канапах через брак кімнат. Згодом Редкліфф писала, що це видовище показало їй справжню ціну війни ліпше за будь-яку битву, про яку вона читала."
  grand_tour_events.22.title: "[target_location.GetNameWithNoTooltip] — Місто Барсіно"
  grand_tour_events.22.desc: "[target_location.GetName] веде свої мури від римської колонії, що стояла тут спочатку, і [target_location.GetRank.GetName] розрослося до найжвавішого порту на цьому узбережжі — його гавань повниться галерами, що везуть #TOOLTIP:GOODS,wool,X #L вовну#!#!, прянощі та #TOOLTIP:GOODS,dyes,X #L барвники#!#! через усе західне Середземномор’я. До його морського кодексу звертаються капітани, які зроду не бували в самому місті.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] майже завершив довгий шлях додому."
  grand_tour_events.22.knowledge: "Відвідати лекцію про закони каталонських #italic Кортесів#!."
  grand_tour_events.22.experience: "Дослідити морський кодекс, що зберігається в купецькій біржі."
  grand_tour_events.22.connections: "Present ourselves at the court of [court_host.GetNameWithNoTooltip]."
  grand_tour_events.22.party: "Проміняти морський кодекс на портові корчми."
  grand_tour_events.22.historical_info: "Наприкінці жовтня 1775 року англійський антиквар Генрі Свінберн прибув до Барселони саме перед тим, як міська брама зачинилася на ніч — цей випадок він описав у своїх #italic Подорожах Іспанією у 1775 та 1776 роках#!. Засвідчивши повагу наміснику, він відвідав театр, спочатку бурчучи, що «Нудьга запанувала на цій сцені», але за кілька днів був підкорений живою виставою #italic «Сіда Кампеадора»#!, зіграною в старовинних іспанських строях. Він також оглянув цитадель, зауваживши, що її низьку, вогку місцевість, де кишіли москіти, обрали не заради здоров’я, а щоб тримати місто внизу в страху."
  grand_tour_events.23.title: "[target_location.GetNameWithNoTooltip] — Місто королів"
  grand_tour_events.23.desc: "[target_location.GetName] вінчає свій пагорб замком, де коронують і ховають королів, і [target_location.GetRank.GetName] ставиться до обох обрядів з однаковою урочистістю. Його університет, старіший за більшість у землях, де говорять [ShowLanguageName('german_language')|l]ою, навчає астрономії та права студентів з усього краю, а торгівля #TOOLTIP:GOODS,amber,X #L бурштином#!#! та #TOOLTIP:GOODS,salt,X #L сіллю#!#! тримає його ринки жвавими круглий рік.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] знаходить тут останню величну зупинку перед поверненням додому."
  grand_tour_events.23.knowledge: "$grand_tour_events.attend_university_lectures$"
  grand_tour_events.23.experience: "Оглянути Суконні ряди, де торгують купці."
  grand_tour_events.23.connections: "$grand_tour_events.seek_castle_audience$"
  grand_tour_events.23.party: "Покинути лекційну залу заради вечора біля замку."
  grand_tour_events.23.historical_info: "25 липня 1778 року Вільям Кокс, наставник юного лорда Герберта під час тривалого гранд-туру північною та східною Європою, перетнув Віслу на шляху до Кракова й побачив давню польську столицю понівеченою ядрами та картеччю нещодавніх облог, з величними кам’яницями, оберненими на руїни. Він оглянув заснований Казимиром Великим університет, де бібліотекар показав йому турецьку книгу, саму по собі не надто цінну, але шановану як дивовижу: захоплену серед здобичі в битві під Хотином, її передав університету сам король Ян Собеський на згадку про звитягу, яка врятувала Польщу та принесла йому престол."
  grand_tour_events.24.title: "Where Next?"
  grand_tour_events.24.desc: "From [target_location.GetName], several roads lie open. [target_leader.GetName] must decide which way the tour continues: deeper into [ShowRegionName('italy_region')], or toward home."
  grand_tour_events.24.a: "Зробити гак через Верону."
  grand_tour_events.24.b: "Натомість рушити до Феррари."
  grand_tour_events.24.c: "Звернути до Болоньї."
  grand_tour_events.24.d: "Тримати путь до Флоренції."
  grand_tour_events.24.e: "Зробити зупинку в Сієні."
  grand_tour_events.24.f: "Спершу заїхати до Пізи."
  grand_tour_events.24.g: "Вирушити до Ассізі."
  grand_tour_events.24.h: "Натомість вирушити до Перуджі."
  grand_tour_events.24.i: "Тримати путь до Рима."
  grand_tour_events.24.j: "Продовжити свій шлях до Неаполя."
  grand_tour_events.24.k: "The tour has seen enough. Return home."
  grand_tour_events.25.title: "Шлях додому"
  grand_tour_events.25.desc: "Турне врешті завертає додому. Замість того щоб знову долати весь шлях на південь, [target_leader.GetName] має обрати, де перервати подорож перед останнім відтинком шляху: зупинку, щоб дати перепочити коням і, можливо, бути прийнятим при ще одному дворі перед поверненням."
  grand_tour_events.25.desc.second: "One stop is not enough to call it a homecoming. Before the road finally leads back to [ROOT.GetCountry.GetCapital.GetName], [target_leader.GetName] chooses one more city to break the journey: a last court, a last curiosity, before the tour is truly over."
  grand_tour_events.25.a: "Зробити зупинку у Відні."
  grand_tour_events.25.b: "Дати коням перепочити в Празі."
  grand_tour_events.25.c: "Повернути додому через Мюнхен."
  grand_tour_events.25.d: "Зробити зупинку в Парижі перед останнім відтинком шляху."
  grand_tour_events.25.e: "На зворотному шляху додому проїхати через Ліон."
  grand_tour_events.25.f: "Спершу перетнути море та заїхати до Лондона, а потім рушити вглиб країни"
  grand_tour_events.25.g: "Спершу завернути до Страсбурга."
  grand_tour_events.25.h: "Проїхати через Марсель."
  grand_tour_events.25.i: "Перед останнім відтинком шляху заїхати до Аугсбурга."
  grand_tour_events.25.k: "Трохи перепочити в Кельні."
  grand_tour_events.25.l: "Повернутися додому морем через Барселону."
  grand_tour_events.25.n: "Зробити зупинку в Орлеані."
  grand_tour_events.25.o: "Перед останнім відтинком шляху додому проїхати через Краків."
  grand_tour_events.25.p: "Годі зволікань. Рушати просто додому."
  grand_tour_events.26.title: "[target_location.GetNameWithNoTooltip] — місто на Темзі"
  grand_tour_events.26.desc: "[target_location.GetName] розкинулося вздовж річки за мурами, вперше зведеними римлянами, і відтоді [target_location.GetRank.GetName] значно переросло їхні межі — його міст щільно забудований власними будинками й крамницями. Комори ломляться від торгівлі #TOOLTIP:GOODS,wool,X #L вовною#!#!, а парламент засідає так часто, що [target_location.GetRank.GetNameWithNoTooltip] звикло приймати в себе державні справи королівства.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] натрапляє на двір, що анітрохи не менш честолюбний, ніж будь-який інший на материку."
  grand_tour_events.26.knowledge: "Відвідати читання про загальне право в судових інах."
  grand_tour_events.26.experience: "Visit the [ShowGoodsNameWithNoTooltip('wool')] merchants and the city's guildhalls."
  grand_tour_events.26.connections: "$grand_tour_events.seek_audience$"
  grand_tour_events.26.party: "Set the guildhalls aside for a night in [target_location.GetNameWithNoTooltip]'s taverns."
  grand_tour_events.26.historical_info: "У 1765 році французький суддя та літератор П’єр-Жан Ґроле провів майже рік у Лондоні, збираючи матеріали для книги, згодом перекладеної як #italic«Подорож до Лондона»#!. Серед інших спостережень він описав міністра, який провів двадцять чотири години поспіль за гральним столом, харчуючись увесь цей час лише холодною яловичиною між двома скибками підсмаженого хліба. «Ця нова страва, — писав Ґроле, — стала вельми модною під час мого перебування в Лондоні», діставши згодом ім’я свого винахідника. Цей анекдот, прикрашений чи ні, став найбільш цитованим рядком його «Подорожі»."
  grand_tour_events.27.title: "[target_location.GetNameWithNoTooltip], місто на Луарі"
  grand_tour_events.27.desc: "[target_location.GetName] стоїть там, де Луара вигинається на північ, перш ніж знову повернути до моря, і [target_location.GetRank.GetName] здавна мало зиск із руху річкою. Його університет викладає право майже так само суворо, як у #TOOLTIP:LOCATION,bologna,X #L Болоньї#!#!, а його мури витримували облоги, яких не пережили інші міста.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] знаходить тут і вчених, і вояків, яким є що розповісти."
  grand_tour_events.27.knowledge: "$grand_tour_events.attend_university_lectures$"
  grand_tour_events.27.experience: "Оглянути винні льохи та гільдію човникарів Луари."
  grand_tour_events.27.connections: "$grand_tour_events.seek_audience$"
  grand_tour_events.27.party: "Пропустити читання права заради шинків біля річки."
  grand_tour_events.27.historical_info: "У квітні 1644 року молодий мемуарист Джон Івлін перервав свою подорож униз Луарою в Орлеані під час мандрівки, що стала одним із найперших задокументованих ґранд-турів. Він відвідав старовинний університет, чиї спудеї все ще поділялися на чотири історичні «нації»: французьку, нормандську, пікардійську та верхньонімецьку, кожна з яких мала власних очільників, і користувався двома публічними бібліотеками міста, зауваживши, що вчений міг узяти книжку до власного помешкання, лише залишивши розписку, — свобода, яку він визнав дивовижною. Він також оглянув колегіальну церкву Сен-Круа, колись величну, але все ще з помітними шрамами від нещодавніх міжусобних воєн."
  grand_tour_events.28.title: "Нагода навчання"
  grand_tour_events.28.desc.university: "Word reaches the retinue that a place among the students of [target_location.GetName]'s university could be arranged for [target_leader.GetName]: lectures, disputations, and the company of scholars whose names will be remembered long after this tour is forgotten."
  grand_tour_events.28.desc.scholar: "Word reaches the retinue of a scholar in [target_location.GetName] whose reputation draws students from across the continent, and who might be persuaded, for a price, and for the right pupil, to take on [target_leader.GetName] for a time."
  grand_tour_events.28.a: "$grand_tour_events.opportunity_accept$"
  grand_tour_events.28.b: "$grand_tour_events.opportunity_commit$"
  grand_tour_events.28.c: "$grand_tour_events.opportunity_decline$"
  grand_tour_events.29.title: "Кінець лекціям"
  grand_tour_events.29.desc: "The months of study draw to a close, and [target_leader.GetName] must decide what has truly been learned in [target_location.GetName], $grand_tour_events.worth_the_delay$"
  grand_tour_events.29.a: "$grand_tour_events.reflect_and_continue$"
  grand_tour_events.30.title: "Військова нагода"
  grand_tour_events.30.desc: "Наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] дізнається, що [target_country.GetLongName] веде війну, а її офіцерський корпус ладен приймати гостей із належними листами. [target_leader.GetName] не матиме справжнього командування і не нестиме відповідальності за долю вояків, але зможе їхати поруч із досвідченими офіцерами, на власні очі спостерігати за воєнною кампанією та довідатися те, чого не навчить жодна книга з військового мистецтва."
  grand_tour_events.30.a: "$grand_tour_events.opportunity_accept$"
  grand_tour_events.30.b: "$grand_tour_events.opportunity_commit$"
  grand_tour_events.30.c: "$grand_tour_events.opportunity_decline$"
  grand_tour_events.31.title: "Кінець кампанії"
  grand_tour_events.31.desc: "The campaigning season draws to a close, and [target_leader.GetName] must decide what has truly been learned from the officers of [target_location.GetName], $grand_tour_events.worth_the_delay$"
  grand_tour_events.31.a: "$grand_tour_events.reflect_and_continue$"
  grand_tour_events.32.title: "Нагода зав’язати знайомства"
  grand_tour_events.32.desc: "Word reaches [target_leader.GetName] of an invitation to join the court of the [target_country.GetLongName] as a guest for a season: rooms at the palace, a standing invitation to every reception, and introductions to every courtier and visiting diplomat worth knowing."
  grand_tour_events.32.desc.no_owner: "Word reaches [target_leader.GetName] of an invitation to join the household of [target_location.GetName]'s leading family as a guest for a season: introductions to every notable worth knowing, and a standing invitation to their table."
  grand_tour_events.32.a: "$grand_tour_events.opportunity_accept$"
  grand_tour_events.32.b: "$grand_tour_events.opportunity_commit$"
  grand_tour_events.32.c: "$grand_tour_events.opportunity_decline$"
  grand_tour_events.33.title: "Сезон при дворі добігає кінця"
  grand_tour_events.33.desc: "The season at court draws to a close, and [target_leader.GetName] must decide what has truly been gained from the acquaintances made in [target_location.GetName], $grand_tour_events.worth_the_delay$"
  grand_tour_events.33.a: "Обміркувати набуте та продовжити подорож."
  grand_tour_events.34.title: "Нагода зайнятися фехтуванням"
  grand_tour_events.34.desc: "Our [ROOT.GetCountry.GetGovernment.GetHeirTitle] learns that [target_location.GetName] harbors a fencing master of real renown, willing to take on a promising pupil for the season. [target_leader.GetName] would fight no duel of real consequence and settle no true quarrel, but could learn the footwork, the timing, and the particular courage that no manual of arms has ever quite captured."
  grand_tour_events.34.a: "$grand_tour_events.opportunity_accept$"
  grand_tour_events.34.b: "$grand_tour_events.opportunity_commit$"
  grand_tour_events.34.c: "$grand_tour_events.opportunity_decline$"
  grand_tour_events.35.title: "Кінець урокам"
  grand_tour_events.35.desc: "The season of lessons draws to a close, and [target_leader.GetName] must decide what has truly been learned from the bouts fought in [target_location.GetName], $grand_tour_events.worth_the_delay$"
  grand_tour_events.35.a: "$grand_tour_events.reflect_and_continue$"
  grand_tour_events.36.title: "Лист із дому"
  grand_tour_events.36.desc: "A letter from [ROOT.GetCountry.GetName] catches up with the tour at last. It brings tender words from [ROOT.GetCountry.GetGovernment.GetRuler.GetName] that the court speaks well of [target_leader.GetName], and of the account [target_leader.GetHerHim] is making of [target_leader.GetHerHis] time abroad, already the subject of more than one supper table at home."
  grand_tour_events.36.a: "Відзначити це скромним святкуванням."
  grand_tour_events.36.b: "Ми не маємо часу думати про рідний двір."
  grand_tour_events.37.title: "Місцевий шанувальник"
  grand_tour_events.37.desc: "[gt_admirer.GetName], a young local noble plainly taken with [target_leader.GetHerHis] standing and breeding, has sought [target_leader.GetHerHim] out, eager to be of some use during [target_leader.GetHerHis] visit to [target_location.GetName]."
  grand_tour_events.37.a: "Let [target_leader.GetHerHim] be presented to the right people."
  grand_tour_events.37.b: "Accept [gt_admirer.GetHerHis] gift of fine clothes, fitting for the tour."
  grand_tour_events.37.c: "Accept [gt_admirer.GetHerHis] invitation to stay at [gt_admirer.GetHerHis] own home."
  grand_tour_events.38.title: "Корисне знайомство"
  grand_tour_events.38.desc: "At a supper party, [target_leader.GetName] is seated beside [gt_secretary.GetName], an unassuming young man who says little of himself, until a chance remark reveals him to be secretary to Cardinal [target_cardinal.GetName]. He lets slip that a word from him could see [target_leader.GetNameWithNoTooltip] received by the cardinal himself, if the impression made tonight is the right one."
  grand_tour_events.38.a: "Наполягти на знайомстві, ризикуючи справити ніякове враження."
  grand_tour_events.38.b: "Наполягти на своєму, попри ніяковість."
  grand_tour_events.38.c: "Насолодитися вечором і на цьому зупинитися."
  grand_tour_events.39.title: "Мить осяяння"
  grand_tour_events.39.desc: "In the middle of a disputation in [target_location.GetName], an argument from [target_leader.GetName] suddenly lands as an insightful stroke of genius, and the assembled scholars fall silent, then nod their approval."
  grand_tour_events.39.a: "Розвинути думку далі, ризикуючи виставити себе на посміховисько, якщо помилитися."
  grand_tour_events.39.b: "Довести до краю, незважаючи на глузування."
  grand_tour_events.39.c: "Сьогодні й так непогано вийшло. На цьому й зупинитися."
  grand_tour_events.40.title: "Вияв майстерності"
  grand_tour_events.40.desc: "During a bout at the fencing school in [target_location.GetName], [target_leader.GetName] finds an opening no instructor ever taught, and for a moment the whole room watches to see what [target_leader.GetSheHe] does with it."
  grand_tour_events.40.a: "Продовжити атаку, ризикуючи невдало впасти."
  grand_tour_events.40.b: "Форсувати двобій, попри ризик зазнати травми."
  grand_tour_events.40.c: "Гідно завершити й на цьому зупинитися."
  grand_tour_events.40.injury_tt: "[target_leader.GetName] takes a bad fall and is laid up, nursing bruises and pride"
  grand_tour_events.41.title: "A Bout of Illness"
  grand_tour_events.41.desc: "[target_leader.GetName] comes down with a bad case of the flux, brought on, the physicians suspect, by the local water: nothing life-threatening, they assure the retinue, but unpleasant enough to keep [target_leader.GetHerHim] abed for some days, and their fees are not cheap."
  grand_tour_events.41.a: "Послати по лікаря."
  grand_tour_events.41.b: "Послати по найкращого лікаря, якого тільки можна знайти."
  grand_tour_events.41.c: "Нехай хвороба йде своєю чередою."
  grand_tour_events.42.title: "Туга за домівкою"
  grand_tour_events.42.desc: "The novelty of the stay has worn thin, and [target_leader.GetName] finds [target_leader.GetHerHis] thoughts drifting home, to [target_parent.GetName] above all. It does nothing for [target_leader.GetHerHis] concentration."
  grand_tour_events.42.a: "Write home to [target_parent.GetHerHim], with a small gift."
  grand_tour_events.42.b: "Commission a portrait to send [target_parent.GetHerHim]."
  grand_tour_events.42.c: "Abandon the tour, and return home to [target_parent.GetHerHim]."
  grand_tour_events.43.title: "Дорога необачність"
  grand_tour_events.43.desc: "Лише згодом з’ясовується, що [target_leader.GetName] привітав місцевого суддю не за старшинством на вчорашньому прийомі — порушення етикету, очевидне для всіх у залі, крім самого почту. Господар навряд чи забуде про це без бодай якогось жесту каяття, хоча незграбна спроба може лише погіршити справу."
  grand_tour_events.43.a: "Піднести невеликий подарунок на знак вибачення, ризикуючи, що він не справить враження."
  grand_tour_events.43.b: "Зробити пишний жест перепрошення."
  grand_tour_events.43.c: "Залишити справу без наслідків."
  grand_tour_events.44.title: "Продажна варта"
  grand_tour_events.44.desc: "Повертаючись затемна, [target_leader.GetName] зазнає нападу в провулку від людей у лівреях міської варти, яких куди більше цікавить гаманець чужинця, ніж закон, який вони присягалися берегти."
  grand_tour_events.44.a: "Вранці донести на вартових судді."
  grand_tour_events.44.b: "Викликати вартових на двобій просто в провулку."
  grand_tour_events.44.c: "Кинутися на вулицю, кличучи на допомогу."
  grand_tour_events.44.d: "Віддати гаманець і піти геть."
  grand_tour_events.45.title: "Подорожній"
  grand_tour_events.45.desc: "У юрмі відвідувачів жвавого заїзду [ROOT.GetCountry.GetGovernment.GetHeirTitle] заводить розмову з людиною на ім’я [gt_friend.GetName] — [Select_CString(gt_friend.IsFemale, 'ще однією молодою представницею знаті з батьківщини, яка подорожує', 'ще одним молодим представником знаті з батьківщини, який подорожує')] майже тим самим шляхом з тих самих причин. Вони одразу знаходять спільну мову, діляться оповідками про рідну країну та про свої мандри, поки дорога знову не розводить їх — кожного до свого міста."
  grand_tour_events.45.a: "Так починається міцна дружба."
  grand_tour_events.45.b: "Побажаємо успіху та продовжимо шлях наодинці."
  grand_tour_events.friendship_up_1_tt: "Дружба з персонажем [gt_friend.GetName] міцнішає (#G +1#! до дружби)"
  grand_tour_events.friendship_up_2_tt: "Дружба з персонажем [gt_friend.GetName] значно міцнішає (#G +2#! до дружби)"
  grand_tour_events.friendship_down_1_tt: "Дружба з персонажем [gt_friend.GetName] слабшає (#R -1#! до дружби)"
  grand_tour_events.friend_joins_court_tt: "[gt_friend.GetName], [Select_CString(gt_friend.IsFemale, 'нова подруга', 'новий друг')] [Select_CString(heir.IsFemale, 'нашої спадкоємиці', 'нашого спадкоємця')], [Select_CString(gt_friend.IsFemale, 'готова', 'готовий')] піти слідом за [Select_CString(heir.IsFemale, 'нею', 'ним')] додому, до нашого двору."
  grand_tour_events.friend_reunion_intro: "Несподівано [gt_friend.GetName] теж [Select_CString(gt_friend.IsFemale, 'приїхала', 'приїхав')] у [target_location.Custom('LR_ACC')|l] [target_location.GetName]: шляхи двох друзів знову перетнулися після розлуки, і розмова точиться так, ніби й не уривалася."
  grand_tour_events.46.title: "Друг у біді"
  grand_tour_events.46.desc: "$grand_tour_events.friend_reunion_intro$ [Select_CString(gt_friend.IsFemale, 'Її', 'Його')] гаманець, [Select_CString(gt_friend.IsFemale, 'зізнається вона', 'зізнається він')], спорожнів через низку невдач за картярським столом, і [Select_CString(gt_friend.IsFemale, 'вона', 'він')], помітно зніяковівши, запитує, чи не можна якось зарадити, поки борг не призвів до скандалу."
  grand_tour_events.46.a: "Тихо покриємо [Select_CString(gt_friend.IsFemale, 'її', 'його')] борг із власних коштів."
  grand_tour_events.46.b: "Напишемо знайомим, аби вони надали [Select_CString(gt_friend.IsFemale, 'їй', 'йому')] позику."
  grand_tour_events.46.c: "Побажаємо [Select_CString(gt_friend.IsFemale, 'їй', 'йому')] успіху — нехай [Select_CString(gt_friend.IsFemale, 'сама', 'сам')] шукає вихід."
  grand_tour_events.47.title: "Спільне відкриття"
  grand_tour_events.47.desc: "$grand_tour_events.friend_reunion_intro$ Ділячись новинами про те, чого кожен навчився з миті розлуки, [gt_friend.GetNameWithNoTooltip] зізнається, що [Select_CString(gt_friend.IsFemale, 'заплуталася', 'заплутався')] в лекції — тексті, який наші власні заняття вже давно зробили для нас зрозумілим, — і просить допомогти розібратися."
  grand_tour_events.47.a: "Сядемо і все пояснимо, спираючись на те, що нам уже відомо."
  grand_tour_events.47.b: "Натомість наймемо вчителя, який допоможе [Select_CString(gt_friend.IsFemale, 'їй', 'йому')] розібратися."
  grand_tour_events.47.c: "Скажемо [Select_CString(gt_friend.IsFemale, 'їй', 'йому')], що все просто, і нехай [Select_CString(gt_friend.IsFemale, 'сама', 'сам')] розбирається."
  grand_tour_events.48.title: "Слово до потрібного вуха"
  grand_tour_events.48.desc: "$grand_tour_events.friend_reunion_intro$ [gt_friend.GetNameWithNoTooltip] [Select_CString(gt_friend.IsFemale, 'почула', 'почув')] про приватний салон у [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip], де збираються поважні місцеві родини, але в [Select_CString(gt_friend.IsFemale, 'неї', 'нього')] немає знайомих, які допомогли б туди потрапити. А от [target_leader.GetName] завдяки знайомствам, набутим під час мандрівки, перебуває в зовсім іншому становищі."
  grand_tour_events.48.a: "Надішлемо звістку нашому знайомому і поручимося за [Select_CString(gt_friend.IsFemale, 'неї', 'нього')]."
  grand_tour_events.48.b: "Натомість оплатимо [Select_CString(gt_friend.IsFemale, 'її', 'його')] вхід на менш важливе зібрання."
  grand_tour_events.48.c: "Скажемо [Select_CString(gt_friend.IsFemale, 'їй', 'йому')] [Select_CString(gt_friend.IsFemale, 'самій', 'самому')] шукати спосіб потрапити туди."
  grand_tour_events.49.title: "Загроза насильства"
  grand_tour_events.49.desc: "$grand_tour_events.friend_reunion_intro$ Зустріч швидко повертає на лихе: [gt_friend.GetNameWithNoTooltip] [Select_CString(gt_friend.IsFemale, 'перейшла дорогу', 'перейшов дорогу')] місцевому лихвареві, і той тепер стоїть біля їхнього столу на заїжджому дворі з двома найнятими шибайголовами й обіцяє потрощити не лише меблі, якщо борг не сплатять уже сьогодні."
  grand_tour_events.49.a: "Втрутимося самі: ми знаємо, як поводитися з такими типами."
  grand_tour_events.49.b: "Просто розрахуємося з позикодавцем і закінчимо на цьому."
  grand_tour_events.49.c: "Залишимо [Select_CString(gt_friend.IsFemale, 'її', 'його')] розбиратися з наслідками наодинці."
  grand_tour_events.50.title: "Невелика недуга"
  grand_tour_events.50.desc: "[target_leader.GetName] дізнається, що [gt_friend.GetName] теж [Select_CString(gt_friend.IsFemale, 'приїхала', 'приїхав')] у [target_location.Custom('LR_ACC')|l] [target_location.GetName] і лежить у ліжку на місцевому заїжджому дворі, підхопивши в дорозі застуду з лихоманкою. Корчмар бурмоче, що гаманець [Select_CString(gt_friend.IsFemale, 'молодої дівчини', 'молодика')] здавався худим під час оплати кімнати і що [Select_CString(gt_friend.IsFemale, 'вона', 'він')] уже двічі [Select_CString(gt_friend.IsFemale, 'відмахнулася', 'відмахнувся')] від місцевого лікаря, щоб заощадити на лікуванні."
  grand_tour_events.50.a: "Оплатимо послуги лікаря попри [Select_CString(gt_friend.IsFemale, 'її', 'його')] заперечення."
  grand_tour_events.50.b: "Самі доглядатимемо [Select_CString(gt_friend.IsFemale, 'її', 'його')], спираючись на власний досвід мандрівок."
  grand_tour_events.50.c: "Провідаємо [Select_CString(gt_friend.IsFemale, 'її', 'його')] і побажаємо якнайшвидшого одужання."
  grand_tour_events.50.d: "Тоді краще триматися подалі."