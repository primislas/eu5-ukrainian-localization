  grand_tour_events.worth_the_delay: "і чи варта вона була затримки в подорожі."
  grand_tour_events.2.desc.no_arsenal: "$grand_tour_events.2.desc.geography_intro$ Звичайні корабельні тягнуться вздовж східного кварталу, випускаючи купецькі остови та військові галери з неквапливістю, притаманною кожному порту Європи. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
  grand_tour_events.8.desc: "[target_location.GetName] навчає права та суперечок довше, ніж будь-яке інше місце в усьому християнському світі, і [target_location.GetRank.GetName|l] відкрито виставляє свою вченість: портики повні спудеїв з усіх країв, а лекційні зали старіші за більшість церков, що їх оточують. Наш [ROOT.GetCountry.GetGovernment.GetHeirTitle], завітавши сюди, міг би провести ціле життя і так і не вичерпати всього, що написали доктори права.\n\nТакож тут можна побачити й двір, якщо політика цікавить нас більше за правознавство."
  grand_tour_events.9.desc: "[target_location.GetName] височіє на трьох пагорбах довкола площі у формі черепашки, а його смугастий Дуомо видно з кожної вулиці, що веде вгору. [target_location.GetRank.GetName|l] збудувало своє багатство на #TOOLTIP:GOODS,wool,X #L вовні#!#! та лихварстві ще до того, як його затьмарила #TOOLTIP:LOCATION,florence,X #L Флоренція#!#!, і воно так і не змирилося з цим затьмаренням — суперництво й досі забарвлює кожну розмову при дворі.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибуває саме вчасно, щоб побачити кінні перегони зі знаменами, які двічі на рік заповнюють площу."
  grand_tour_events.10.desc: "[target_location.GetName] спорудило дзвіницю, яка не могла стояти прямо, і замість знести її, просто продовжувало будувати; [target_location.GetRank.GetName|l] вважає цей нахил приводом для гордощів, а не сорому. Колись морська потуга, що змагалася з #TOOLTIP:LOCATION,genoa,X #L Генуєю#!#! та #TOOLTIP:LOCATION,venice,X #L Венецією#!#!, нині втратила свої галери, проте її університет і соборна площа залишилися.\n\nПрибувши сюди, наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] може так само легко навчатися, як і прогулюватися гаванню, що колись мала велике значення."
  grand_tour_events.11.desc: "[target_location.GetName] підіймається зеленим схилом пагорба навколо базиліки, зведеної для мощей уродженця цих місць — ченця, який нічим не володів і залишив цьому [target_location.Custom('LR_DAT')] славу одного з найвеличніших осередків прощ на заході. Вкриті фресками стіни всередині приваблюють однаково багато як художників, так і прочан.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] може провести час серед фресок або серед ченців, які й досі дотримуються уставу ордену."
  grand_tour_events.12.desc: "[target_location.GetName] височіє на пагорбі за мурами, зведеними етрусками задовго до піднесення Рима, і [target_location.GetRank.GetName|l] досі щодня проходить крізь їхні брами, навіть не замислюючись про це. Місцеві художники останнім часом прославилися по всій #TOOLTIP:REGION,italy_region,X #L Італії#!#!, а зали університету завжди повні слухачів.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] може оглядати або стародавні мури, або нові картини — залежно від уподобань."
  grand_tour_events.13.desc: "[target_location.GetName] охороняє річкову переправу, де сходяться шляхи з #TOOLTIP:REGION,italy_region,X #L Італії#!#!, #TOOLTIP:REGION,balkan_region,X #L Балкан#!#! та [ShowLanguageName('german_language')|l]их земель, і [target_location.GetRank.GetName|l] розбагатіло на зборі мит. У його середині височіє герцогський Гофбург — осідок двору, що вважає себе чимось значно більшим, ніж просто регіональним володарем.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] нарешті перетнув Альпи; звідси дороги стають легшими."
  grand_tour_events.14.desc: "[target_location.GetName] розкинулося на обох берегах Влтави, кам’яний міст сполучає старе місто із замковим пагорбом, і [target_location.GetRank.GetName|l] тримається як столиця імперії. Університет на пагорбі приваблює спудеїв з усіх куточків [ShowLanguageName('german_language')|l]их земель і з-поза їхніх меж.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] бачить місто, яке вимірює власну велич століттями, а не порами року."
  grand_tour_events.15.desc: "[target_location.GetName] бере саму свою назву від ченців, чиє поселення стояло тут ще до того, як герцоги звели поруч ринок і монетний двір, і відтоді [target_location.GetRank.GetName|l] неабияк розрослося. Герцогський двір Віттельсбахів підтримує в [target_location.Custom('LR_PREP')] зразковий лад, а місцеві броварі дбають про щедре частування.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] знайде тут і вчених мужів, і зразковий двір."
  grand_tour_events.16.desc: "[target_location.GetName] розкинулося обабіч річки довкола острова, увінчаного величним собором, і [target_location.GetRank.GetName|l] величніше за все, що наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] бачив досі в цій мандрівці. Університетський квартал на лівому березі навчає богослов’я та права більше спудеїв, ніж налічує населення більшости міст.\n\nКоролівський двір, приймаючи гостей, робить це з такою пишністю, яка не залишає сумнівів у його високій думці про себе."
  grand_tour_events.17.desc: "[target_location.GetName] стоїть там, де зливаються дві річки, і [target_location.GetRank.GetName|l] перетворило це злиття на цілий статок: купці з #TOOLTIP:REGION,italy_region,X #L Італії#!#!, #TOOLTIP:CULTUREGROUP,german_group,X #L німецьких#!#! земель та Фландрії сходяться сюди на королівські ярмарки, коли вулиці заповнює стільки #TOOLTIP:GOODS,silk,X #L шовку#!#! та #TOOLTIP:GOODS,dyes,X #L барвників#!#!, скільки не вмістять жодні склади. Друкарські верстати тут працюють майже так само швидко, як тчуть ткацькі.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибуває сюди й бачить місто, яке тримається на торгівлі, а не на пишних церемоніях."
  grand_tour_events.18.desc: "[target_location.GetName] бере свою назву від доріг, що тут перетинаються, і [target_location.GetRank.GetName|l] досі слугує цій меті, розкинувшись обабіч річки, яка розділяє землі, де говорять [ShowLanguageName('french_language')|l]ою мовою, від [ShowLanguageName('german_language')|l]их. Шпиль його собору здіймається вище за все, що наш [ROOT.GetCountry.GetGovernment.GetHeirTitle] бачив за всю подорож — самотня вежа, парну до якої так і не збудували.\n\nВільне місто править собою саме, а його друкарі останнім часом важать не менше за купців."
  grand_tour_events.19.desc: "[target_location.GetName] слугувало портом ще до появи Рима — його заснували #TOOLTIP:CULTURE,$greek_culture_tt$,X #L грецькі#!#! моряки, які побачили цю гавань і залишилися тут назавжди, і в кожному кварталі [target_location.Custom('LR_GEN')] досі пахне сіллю та смолою. Галери з половини Середземномор’я скупчуються біля його набережної, а на ринках продають крам, якого ніколи не бачать у глибині #ONCLICK:COUNTRY,[GetCountry('FRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('FRA').GetKey],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#!.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] переконується, що справжнім володарем [target_location.Custom('LR_GEN')] є саме море."
  grand_tour_events.20.desc: "[target_location.GetName] носить ім’я імператора, який його заснував, і відтоді [target_location.GetRank.GetName|l] не припиняє рости. Місцеві банкірські доми оперують сумами, поряд з якими деякі королівські скарбниці видаються скромними, а райхстаг збирається тут досить часто, тож [target_location.GetRank.GetNameWithNoTooltip|l] звикло приймати князів.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] прибуває сюди й бачить, що про гроші тут говорять так само відкрито, як і про шляхетне походження."
  grand_tour_events.21.desc: "[target_location.GetName] будує свій собор довше, ніж пам’ятає будь-хто з живих: над [target_location.Custom('LR_INST')] височіє недобудована вежа з підіймальним краном нагорі, залишеним мулярами. Рейн несе повз [target_location.Custom('LR_ACC')] більше торгових вантажів, ніж майже будь-де в [ShowLanguageName('german_language')|l]их землях, а місцевий архієпископ править не гірше за будь-якого князя.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] бачить місто, яке вимірює терпіння століттями."
  grand_tour_events.22.desc: "[target_location.GetName] веде історію своїх мурів ще від римської колонії, що постала тут першою, і [target_location.GetRank.GetName|l] перетворилося на найжвавіший порт цього узбережжя; його гавань рясніє галерами, що торгують #TOOLTIP:GOODS,wool,X #L вовною#!#!, прянощами та #TOOLTIP:GOODS,dyes,X #L барвниками#!#! по всьому західному Середземномор’ю. З його морським кодексом звіряються капітани, які ніколи навіть не ступали в саме місто.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] уже майже здолав довгий шлях додому."
  grand_tour_events.23.desc: "[target_location.GetName] вінчає свій пагорб замком, де коронують і ховають королів, і [target_location.GetRank.GetName|l] ставиться до обох обрядів з однаковою врочистістю. Його університет, старіший за більшість у [ShowLanguageName('german_language')|l]их землях, навчає астрономії та права студентів з усього краю, а торгівля #TOOLTIP:GOODS,amber,X #L бурштином#!#! та #TOOLTIP:GOODS,salt,X #L сіллю#!#! забезпечує жвавий рух на його ринках цілий рік.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] дістається останньої великої зупинки перед поверненням додому."
  grand_tour_events.26.desc: "[target_location.GetName] розкинувся вздовж річки за мурами, зведеними ще римлянами, і відтоді [target_location.GetRank.GetName|l] розрослося далеко за їхні межі, а його міст забудований власними будинками та крамницями. Торгівля #TOOLTIP:GOODS,wool,X #L вовною#!#! наповнює тутешні склади, а парламент збирається досить часто, тож [target_location.GetRank.GetNameWithNoTooltip|l] звикло вирішувати справи всього королівства.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] бачить двір, настільки ж честолюбний, як і будь-який на континенті."
  grand_tour_events.27.desc: "[target_location.GetName] розташоване там, де Луара повертає на північ, перш ніж знову рушити до моря, і [target_location.GetRank.GetName|l] давно має добрий зиск із річкового руху. Його університет викладає право майже так само суворо, як і в #TOOLTIP:LOCATION,bologna,X #L Болоньї#!#!, а його мури витримували облоги, яких інші міста не пережили.\n\nНаш [ROOT.GetCountry.GetGovernment.GetHeirTitle] зустрічає тут і вчених, і воїнів, яким є про що розповісти."