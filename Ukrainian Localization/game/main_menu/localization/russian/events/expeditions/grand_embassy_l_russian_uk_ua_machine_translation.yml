l_russian:
  grand_embassy.1.title: "Велике посольство"
  grand_embassy.1.desc: "При дворі обговорюють чудову ідею — направити до Європи Велике посольство. [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'Сама', 'Сам')] [ROOT.GetCountry.GetGovernment.GetRuler.GetName] вирушить у подорож європейськими країнами, щоб налагодити відносини з їхніми правителями — особливо з тими, у кого з нами спільні вороги. Серед іншого ми зможемо вивчити останні технологічні досягнення #TOOLTIP:SUB_CONTINENT,western_europe,X #L Західної Європи#!#!."
  grand_embassy.1.a: "Вирушимо в подорож Європою."
  grand_embassy.1.a.tt: "Звичайні приготування, звичайна потайність (Обережність: 55)"
  grand_embassy.1.b: "У нашої країни й так є всі потрібні знання."
  grand_embassy.1.b.tt: "Додаткова обачність забезпечить справжню безіменність (Обережність: 75)"
  grand_embassy.1.c: "Вирядити облудні посольства."
  grand_embassy.1.c.tt: "Облудні посольства заплутають слід (Обережність: 95)"
  grand_embassy.2.title: "Місто [ROOT.GetCountry.GetCapital.GetName] приймає Велике посольство"
  grand_embassy.2.desc.port: "Посольство прибуло до [embassy_country.GetCapital.GetName]. Ми приїхали заради доступу: до сухих доків та арсеналів, де [embassy_country.GetName] споруджує флот, який зберігає за нею зверхність на морі. Те, як ми постанемо при дворі [embassy_country.GetGovernment.GetCourtTitle], вирішить, скільки з цього нам насправді покажуть."
  grand_embassy.2.desc.inland: "Посольство прибуло до [embassy_country.GetCapital.GetName]. Ми приїхали заради доступу: до майстерень і плаців, де ремісники та вчителі військової справи [embassy_country.GetName] уже перетворили її торгівлю та військо. Те, як ми постанемо при дворі [embassy_country.GetGovernment.GetCourtTitle], вирішить, скільки з цього нам насправді покажуть."
  grand_embassy.2.a: "Invite [target_ruler.GetHerHim] to stay."
  grand_embassy.2.a_no_figurehead: "Залишити [target_ruler.GetShortNameWithNoTooltip] серед почту."
  grand_embassy.2.b: "Politely turn [target_ruler.GetHerHim] away."
  grand_embassy.2.c: "Send [target_ruler.GetHerHim] packing!"
  grand_embassy.3.title: "Велике посольство в місті [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
  grand_embassy.3.desc.unaware: "Посольство з [from.GetName] прибуло до [ROOT.GetCountry.GetGovernment.GetCourtTitle] — за їхніми власними словами, нічим не примітні мандрівники, які бажають на власні очі побачити, як усе влаштовано в [ROOT.GetCountry.GetName]. Чи впустити їх до наших майстерень та установ, чи вирядити геть?"
  grand_embassy.3.desc.aware: "При дворі [ROOT.GetCountry.GetGovernment.GetCourtTitle] тихо з’ясували, хто насправді супроводжує це посольство. Викрити [target_ruler.GetName] відкрито було б ніяково для всіх сторін, але приймати правителя, готового вчитися в див [ROOT.GetCountry.GetName], нехай навіть інкогніто, — чимала честь. Як видно, обережність грає на руку обом сторонам."
  grand_embassy.3.a: "Invite [target_ruler.GetHerHim] to stay and study our governmental institutions."
  grand_embassy.3.b: "Invite [target_ruler.GetHerHim] to stay and study our army."
  grand_embassy.3.c: "Invite [target_ruler.GetHerHim] to stay and study our navy."
  grand_embassy.3.d: "[Select_CString(from.GetGovernment.GetRuler.IsFemale,'Їй', 'Йому')] давно час вирушати куди подалі…"
  grand_embassy.3.e: "Гості настільки високого становища мають право безперешкодно побачити наші дива."
  grand_embassy.3.f: "[target_ruler.GetShortNameWithNoTooltip], ми знаємо, хто ти, і тобі тут не раді."
  grand_embassy.4.title: "Дозвіл залишитися"
  grand_embassy.4.desc: "Hearing of [target_ruler.GetName]'s reforms to modernize the [ROOT.GetCountry.GetLongName], [embassy_country.GetName] has graciously invited us to extend our stay in [embassy_country.GetCapital.GetName] to take the opportunity to study their technological advancements."
  grand_embassy.4.a: "Let us stay and study [target_institution.GetNameWithNoTooltip]."
  grand_embassy.4.b: "Let us stay and study their army."
  grand_embassy.6.title: "Затяжний візит приніс свої плоди"
  grand_embassy.6.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'затрималася', 'затримався')] в місті [embassy_country.GetCapital.GetName], щоб особисто вивчити #L [embassy_country.GetAdjective|l]і#! технологічні новинки. Цей час було витрачено зовсім не даремно."
  grand_embassy.6.a: "Це піде на користь нашим державним інститутам!"
  grand_embassy.6.b: "Це піде на користь нашим збройним силам!"
  grand_embassy.7.title: "Успіх Великого посольства"
  grand_embassy.7.desc: "Візит до міста [embassy_country.GetCapital.GetCapitalName] був надзвичайно успішним, але тепер нам знову час у дорогу. Куди ми попрямуємо далі?"
  grand_embassy.7.a: "We still have other countries to visit."
  grand_embassy.7.b: "The time has come to return home."
  grand_embassy.7.c: "Вирушити натомість до [target_2.GetNameWithNoTooltip]."
  grand_embassy.7.d: "Звернути погляд на [target_3.GetNameWithNoTooltip]."
  grand_embassy.7.e: "Лишається ще відвідати [target_4.GetNameWithNoTooltip]."
  grand_embassy.7.f: "Спрямувати посольство в бік [target_5.GetNameWithNoTooltip]."
  grand_embassy.5.title: "У проханні залишитися відмовлено"
  grand_embassy.5.desc: "Запорукою швидкої модернізації #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! є вивчення технологічних новинок #TOOLTIP:SUB_CONTINENT,western_europe,X #L Західної Європи#!#!. На жаль, #L [embassy_country.GetAdjective|l]а#! влада відмовилася піти нам назустріч і дозволити затриматися в місті [embassy_country.GetCapital.GetName] для вивчення їхніх досягнень."
  grand_embassy.5.a: "Very well, we have other countries to visit."
  grand_embassy.5.b: "The time has come to return home."
  grand_embassy.5.c: "Пошукати теплішого прийому в [target_2.GetNameWithNoTooltip]."
  grand_embassy.5.d: "[target_3.GetNameWithNoTooltip] може виявитися гостиннішим."
  grand_embassy.5.e: "Спробувати щастя натомість у [target_4.GetNameWithNoTooltip]."
  grand_embassy.5.f: "Лишається ще відвідати [target_5.GetNameWithNoTooltip]."
  grand_embassy.discretion_down_4_tt: "A flicker of recognition (#R -4#! Discretion)"
  grand_embassy.discretion_down_5_tt: "Менше місць, де можна сховатися (#R -5 #! Обережність)"
  grand_embassy.discretion_down_10_tt: "Двір починає підозрювати (#R -10#! Обережність)"
  grand_embassy.discretion_down_20_tt: "Надмірна прихильність привертає зайві погляди (#R -20#! Обережність)"
  grand_embassy.discretion_down_30_tt: "Маскування розкрито (#R -30#! Обережність)"
  grand_embassy.discretion_up_10_tt: "Ми залишилися непоміченими (#G +10#! Обережність)"
  grand_embassy.discretion_set_0_tt: "Удаванню настав кінець (Обережність: 0)"
  grand_embassy.modernization_up_0to10_tt: "Урок засвоюється ліпше без зайвих очей (#G +0 до +10#! Осучаснення)"
  grand_embassy.opportunities_set_1_tt: "Чужинцеві мало що показують (Можливості: 1)"
  grand_embassy.opportunities_set_2_tt: "Деякі двері відчиняються й так (Можливості: 2)"
  grand_embassy.opportunities_set_3_tt: "Перед нами відчинені всі двері (Можливості: 3)"
  grand_embassy.opportunities_set_4_tt: "Від нас не приховують узагалі нічого (Можливості: 4)"
  grand_embassy.opportunities_up_1_tt: "Запрошення відчиняє ще одні двері (#G +1#! Можливості)"
  grand_embassy.opportunities_up_2_tt: "Наполегливість, хай і не найгідніша, відчиняє ще двоє (#G +2#! Можливості)"
  grand_embassy.opportunities_down_1_tt: "День змарновано (#R -1#! Можливості)"
  received_grand_embassy: "Велике посольство прийнято"
  rejected_grand_embassy: "Велике посольство відправлено геть"
  humiliated_grand_embassy: "Зганьблене Велике посольство"
  grand_embassy.8.title: "Неприємності вдома"
  grand_embassy.8.desc: "До посольства дійшли звістки про те, що вдома почалися неприємності. Поки [target_ruler.GetName] ще за кордоном, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] та [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] бажають знати, куди подівся їхній [ROOT.GetCountry.GetGovernment.GetRulerTitle]. Перервати мандрівку зараз означає повернутися додому ні з чим. Продовжити подорож означає ще деякий час правити за своєї відсутности."
  grand_embassy.8.a: "Ми мусимо негайно повернутися додому."
  grand_embassy.8.b: "Уроки, які ще належить засвоїти, варті цієї ціни."
  grand_embassy.modernization_up_5_tt: "Урок засвоєно добре (#G +5#! Осучаснення)"
  grand_embassy.modernization_up_15_tt: "Урок засвоєно повною мірою (#G +15#! Осучаснення)"
  grand_embassy.discretion_up_20_tt: "За монету можна багато чого забути (#G +20#! до обачности)"
  grand_embassy.9.title: "Лічильний дім"
  grand_embassy.9.desc: "У [embassy_country.GetName] хранитель лічильних книг знайомить нас із реєстрами та податковими відомостями, на яких тримається скарбниця. Замащені чорнилом пальці без вагань ковзають кожним стовпчиком, і підсумкові суми, здається, ніколи не брешуть. Хранитель заносить кожну суму двічі — спершу як належну до сплати, потім як сплачену, — аби жодна монета не вислизнула непоміченою, а наприкінці тижня звіряє записи з портовими маніфестами. Тим, хто готовий заплатити за час хранителя й має достатньо терпіння, щоб простежити цей спосіб до кінця, є чого ще повчитися."
  grand_embassy.9.a: "Взяти до уваги цей спосіб."
  grand_embassy.9.b: "Заплатити, щоб вивчити реєстри повністю."
  grand_embassy.9.c: "Заплатити, щоб побачити всі книги, і залишитися, аби опанувати їх досконало."
  grand_embassy.10.title: "Укладачі альманахів"
  grand_embassy.10.desc: "Громада писарів у [embassy_country.GetCapital.GetName] заходилася рахувати все поспіль: народження, врожаї, кораблі в порту й навіть ціну на хліб від тижня до тижня. Їхні книги заповнюють цілі полиці, кожен стовпчик датований і зіставлений із попереднім, аж поки самі цифри не починають оповідати історію, якої не розповів би жоден літописець. Їхні альманахи стверджують, що показують країну точніше за будь-яку хроніку, провіщаючи голод і достаток за закономірностями, що їх помічають лише вони самі. За плату вони готові пояснити свої методи будь-кому, хто має достатньо терпіння, аби висидіти всі обчислення."
  grand_embassy.10.a: "Взяти до уваги їхні методи."
  grand_embassy.10.b: "Заплатити за повний виклад їхнього ремесла."
  grand_embassy.10.c: "Оплатити повне дослідження й залишитися, щоб опанувати його досконало."
  grand_embassy.11.title: "The Embassy Has Been Turned Away"
  grand_embassy.11.desc: "Word has reached [ROOT.GetCountry.GetCapital.GetName] that the [embassy_country.GetGovernment.GetCourtTitle] at [embassy_country.GetCapital.GetName] has refused to receive [target_ruler.GetName] and the delegation. No reason has been given that the chronicler considers worth recording. The embassy's standing is reduced by the rebuff; the embassy itself, however, is not yet at an end."
  grand_embassy.11.a: "Try our luck at another court."
  grand_embassy.11.b: "Заплатити придворному за докладніший урок."
  grand_embassy.11.c: "Оплатити повний урок і залишитися, щоб опанувати його досконало."
  grand_embassy.12.title: "The Embassy Has Been Insulted"
  grand_embassy.12.desc: "Word has reached [ROOT.GetCountry.GetCapital.GetName] that the [embassy_country.GetGovernment.GetCourtTitle] at [embassy_country.GetCapital.GetName] has not merely refused to receive [target_ruler.GetName] but has done so in terms that no chronicler will repeat in print. The casus belli is registered. Whether to press it now, or to continue the journey and address the matter later, is for the [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] to decide."
  grand_embassy.12.a: "There are other courts. Press on."
  grand_embassy.12.b: "Заплатити за вхід до цього кола."
  grand_embassy.12.c: "Заплатити за повну участь у колі й залишитися, щоб опанувати все досконало."
  grand_embassy.13.title: "Ливарний двір"
  grand_embassy.13.desc: "У ливарнях [embassy_country.GetName] гармати відливають у спосіб, за знання якого наші зброярі дорого б заплатили: склад сплаву, обриси форми для лиття, час охолодження. Жар струмує з жерл печей, і робітники рухаються довкола розплавленого металу зі спокоєм, що свідчить радше про багаторічну звичку, ніж про просту майстерність. Майстер ливарного двору, увесь у поті й вочевидь гордий своєю справою, ладен розповісти більше — за плату, — і, схоже, немає для нього більшої втіхи, ніж глядач, який справді тямить, на що дивиться."
  grand_embassy.13.a: "Поспостерігати за литтям."
  grand_embassy.13.b: "Заплатити майстрові ливарного двору, щоб він пояснив ремесло."
  grand_embassy.13.c: "Заплатити майстрові сповна й залишитися, щоб опанувати ремесло досконало."
  grand_embassy.14.title: "Плац"
  grand_embassy.14.desc: "На плацу за межами [embassy_country.GetCapital.GetName] роти шикуються та заряджають зброю до ладу, швидше, ніж це вдалося б будь-якому нашому ополченню, і чоботи луплять по втоптаній землі в ритмі, який, здається, ніколи не збивається. Офіцери вигукують накази, а стрій відгукується на них перш, ніж слова встигають злетіти з уст, і весь стрій обертається мов єдине тіло, а не як сотня окремих людей. Сержант-інструктор, утішений нашою увагою, пропонує показати весь вишкіл цілком, від першого наказу до останнього залпу."
  grand_embassy.14.a: "Поспостерігати за вишколом."
  grand_embassy.14.b: "Заплатити сержантові, щоб розглянути все ближче."
  grand_embassy.14.c: "Заплатити сержантові сповна й залишитися, щоб опанувати вишкіл."
  grand_embassy.15.title: "Слово до потрібного вуха"
  grand_embassy.15.desc: "Камергер, що влаштовує наші прийоми, тихцем дає зрозуміти, що дарунок у потрібні руки здатен відчинити чимало дверей, а декотрі імена в декотрих списках мають властивість вислизати з пам’яті, щойно монета переходить з рук у руки. Він згадує про це майже мимохідь, буцімто говорить про погоду, і чекає, чи зрозуміємо ми натяк. Справа звична, що трапляється при будь-якому дворі, хоча ціна зазвичай зростає мірою запитів."
  grand_embassy.15.a: "Запропонувати звичайний дарунок."
  grand_embassy.15.b: "Запропонувати значно щедріший дарунок."
  grand_embassy.16.title: "Обережний посередник"
  grand_embassy.16.desc: "Посередник, що заробляє на прожиток тим, що полегшує шлях іноземним гостям, пропонує свої послуги, стверджуючи, ніби має зв’язки в кожній вартівні та на кожній митній заставі звідси й до самого кордону. Він промовляє обережними натяками, ніколи прямо не називаючи тих, хто перед ним у боргу, але даючи зрозуміти, що такі люди є. За плату він може подбати, аби про те, куди й чому прямує посольство, ставили якомога менше запитань, а відповіді, якщо їх усе ж вимагатимуть, виходили достатньо неясними."
  grand_embassy.16.a: "Найняти посередника."
  grand_embassy.16.b: "Найняти посередника й на додачу заплатити за його мовчання."
  grand_embassy.17.title: "Довгий язик"
  grand_embassy.17.desc: "Один із нашого почту, добряче хильнувши в шинку й бажаючи справити враження на гурт незнайомців, бовкнув значно більше, ніж належало, про те, хто насправді очолює це посольство. На ранок він і сам не пам’ятає своїх слів, але шинкар пам’ятає, як і всі, хто сидів за сусіднім столом. Поголос уже шириться челядними покоями, і його переказують із тією насолодою, яку бережуть для таємниць, занадто спокусливих, аби тримати їх при собі."
  grand_embassy.17.a: "Тепер уже нічого не вдієш."
  grand_embassy.17.b: "Заплатити, щоб заглушити чутки."
  grand_embassy.18.title: "Впізнали на вулиці"
  grand_embassy.18.desc: "Купець, який колись торгував у [ROOT.GetCountry.GetName] — давно, за щасливіших обставин, — проходить повз делегацію на вулиці й раптом завмирає на пів кроці, надто довго вдивляючись в обличчя [target_ruler.GetName], перш ніж поквапитися далі, не зронивши й слова. Помилитись у виразі його обличчя годі: це не пуста цікавість, а раптове, перелякане впізнавання. Він чудово знає, кого побачив, і чи триматиме він це знання при собі — вже не в нашій владі."
  grand_embassy.18.a: "Сподіватися, що він триматиме язика за зубами."
  grand_embassy.18.b: "Знайти його й заплатити за мовчання."
  grand_embassy.19.title: "Допитливий шинкар"
  grand_embassy.19.desc: "Шинкар, у якого зупинилася делегація, ставить надто багато запитань, і кожне з них лунає з удаваною недбалістю людини, яка вже підозрює, що відповіді мають значення: чому такий вишуканий почет подорожує так скромно, чому монета завжди напоготові і її ніколи не перелічують двічі, чому ніхто з супутників не дивиться йому у вічі, коли їх розпитують про справи. Він поки що не підозрює нічого напевне, лише цікавиться, обертаючи в думках ці дрібні дивацтва, як людина вертить монету, перевіряючи, чи не обрізано край. Утім, довго це може не тривати."
  grand_embassy.19.a: "Відповідати якомога менше."
  grand_embassy.19.b: "Заплатити йому достатньо, щоб він припинив розпитувати."
  grand_embassy.20.title: "Перехоплений лист"
  grand_embassy.20.desc: "Лист, призначений для відправлення додому, що прямо називає [target_ruler.GetName] та описує справжню мету делегації докладніше, ніж дозволяла б будь-яка обачність, зник між гінцем і кораблем. Ані вимоги викупу, ані звинувачень, ані найменшого натяку на те, куди він подівся, не надійшло — і це по-своєму непокоїть навіть дужче, ніж якби щось із цього сталося. Де він опинився, хто його прочитав і що має намір робити з дізнаним — ми сказати не можемо."
  grand_embassy.20.a: "Повернути його вже не можна."
  grand_embassy.20.b: "Не шкодуючи грошей, знайти його та спалити."
  grand_embassy.21.title: "Бенкет на нашу честь"
  grand_embassy.21.desc: "[embassy_country.GetGovernment.GetCourtTitle] влаштував бенкет на честь делегації — з тостами, дарами та промовами, яких вистачить на цілий день, і кожна страва подається вишуканішою за попередню, ніби кухні змагаються одна з одною. Кожні наїдки слід похвалити, кожен тост підтримати у відповідь, а кожного велемовного вельможу вислухати до кінця, скільки б марних слів той не наговорив. Відмовитися було б образою; залишитися ж — означає згаяти весь день на церемонії та повні тарілки."
  grand_embassy.21.a: "Стерпіти й висидіти до кінця."
  grand_embassy.21.b: "Улизнути, щоб зайнятися чимось кориснішим."
  grand_embassy.22.title: "Призначений супровідник"
  grand_embassy.22.desc: "[embassy_country.GetGovernment.GetCourtTitle] призначив чиновника, який супроводжує делегацію на кожному кроці: люб’язний, невтомний і твердо налаштований показати нам лише сади та галереї, хай як ввічливо ми просили б про більше. У нього напоготові відповідь на будь-яке запитання і відволікання на будь-яке мовчання — варто розмові бодай трохи наблизитися до чогось корисного, як він тут же повертає її назад до водограїв та фресок. Майстерні лишаються недосяжними, скільки б способів ми не випробували."
  grand_embassy.22.a: "Іти туди, куди ведуть."
  grand_embassy.22.b: "Наполягти на більшому, як личить гостям високого рангу."
  grand_embassy.23.title: "Тривала аудієнція"
  grand_embassy.23.desc: "Аудієнція в дрібного чиновника розтягується на години: обмін люб’язностями, захоплення подарунками, жодного слова по суті — одні й ті самі ввічливі фрази повторюються в дещо іншому порядку, поки не втрачають будь-якого глузду. Він, схоже, нікуди не поспішає, втішаючись увагою чужоземних гостей куди більше, ніж змістом того, про що можна було б говорити. На той час, коли все нарешті закінчується, день для чогось кориснішого вже давно згаяно."
  grand_embassy.23.a: "Стерпіти це ввічливо."
  grand_embassy.23.b: "Перервати аудієнцію, не зважаючи на чини."
  grand_embassy.24.title: "Співчутливий управитель"
  grand_embassy.24.desc: "Управитель, який веде щоденні записи господарства, натякає — з обережністю людини, якій це не вперше, — що деякі імена цілком можуть лишитися незаписаними за належну винагороду. Він не питає прямо; він дає мовчанню промовляти за себе і зі звичним терпінням чекає, коли ми його порушимо."
  grand_embassy.24.a: "Заплатити управителю за полегшений запис."
  grand_embassy.24.b: "Заплатити управителю, аби запис зник зовсім."
  grand_embassy.25.title: "Відволікальні чутки"
  grand_embassy.25.desc: "Делегація суперників із менш значущого двору, що прибула майже водночас із нашою, привертає значно більше пересудів — вона галаслива, безцеремонна і взагалі набагато цікавіша для розмов. Кілька монет, розданих потрібним слугам, могли б зберегти таке становище, скеровуючи кожен дозвільний язик до їхніх приходів і відходів, а не до наших."
  grand_embassy.25.a: "Роздати трохи монет."
  grand_embassy.25.b: "Роздати щедру кількість монет."
  grand_embassy.26.title: "мовчазний провідник"
  grand_embassy.26.desc: "Місцевий провідник, який знає, які вулиці та двері уникають зайвих очей, а також у які години варта дивиться в інший бік, пропонує провести делегацію туди й назад непоміченою. Він не ставить запитань, навіщо потрібна така обережність — лише про те, скільки це коштуватиме."
  grand_embassy.26.a: "Найняти провідника."
  grand_embassy.26.b: "Найняти провідника й доплатити зверху за додаткову обережність."