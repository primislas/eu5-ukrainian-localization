l_russian:
  grand_embassy.1.title: "Підготовка Великого посольства"
  grand_embassy.1.desc: "Перш ніж посольство вирушить у дорогу, слід визначити його склад. Правитель, оточений пошаною на бенкетах та охороною у своїх покоях, побачить лише те, що приймальна сторона захоче йому показати. Майстерні, сухі доки та навчальні плаци почесним гостям не покажуть. [figurehead.GetName] стане офіційним представником посольства, а [target_ruler.GetName] пересуватиметься серед почту, не привертаючи до себе уваги. На що ми готові піти задля збереження цієї таємниці?"
  grand_embassy.1.a: "Підготуйте звичайне посольство."
  grand_embassy.1.a.tt: "Звичайні приготування, звичайна таємність (Потайність: 55)"
  grand_embassy.1.b: "Зробіть усе можливе, щоб зберегти все в таємниці."
  grand_embassy.1.b.tt: "Особливі заходи забезпечують повну безіменність (Потайність: 75)"
  grand_embassy.1.c: "Відправте оманні посольства."
  grand_embassy.1.c.tt: "Оманні посольства допомагають заплутати сліди (Потайність: 95)"
  grand_embassy.2.title: "Місто [ROOT.GetCountry.GetCapital.GetName] приймає Велике посольство"
  grand_embassy.2.desc.port: "Посольство прибуло до [embassy_country.GetCapital.Custom('LR_GEN')|l] [embassy_country.GetCapital.GetName]. Головна мета візиту — оглянути сухі доки та арсенали, де [embassy_country.GetName] споруджу[embassy_country.Custom('end_yeyut')] флот, завдяки якому утриму[embassy_country.Custom('end_yeyut')] свою перевагу на морі. Від того, яке враження ми справимо при [embassy_country.GetAdjective|l]ому дворі, залежить, що саме нам покажуть."
  grand_embassy.2.desc.inland: "Посольство прибуло до [embassy_country.GetCapital.Custom('LR_GEN')|l] [embassy_country.GetCapital.GetName]. Головна мета візиту — оглянути майстерні та навчальні плаци, де ремісники та інструктори #ONCLICK:COUNTRY,[embassy_country.GetKey] #TOOLTIP:COUNTRY,[embassy_country.GetKey],X [embassy_country.Custom('CL_GEN')|L]#!#! вже досягли докорінних змін у торгівлі та військовій справі своєї країни. Від того, яке враження ми справимо при [embassy_country.GetAdjective|l]ому дворі, залежить, що саме нам покажуть."
  grand_embassy.2.a: "Нехай від імені посольства виступає [figurehead.GetShortNameWithNoTooltip], а [target_ruler.GetShortNameWithNoTooltip] залишиться серед почту."
  grand_embassy.2.a_no_figurehead: "Нехай [target_ruler.GetShortNameWithNoTooltip] залишається серед почту."
  grand_embassy.2.b: "[target_ruler.GetShortNameWithNoTooltip] буде [Select_CString(target_ruler.IsFemale, 'представлена', 'представлений')] в офіційному статусі."
  grand_embassy.2.c: "Варто триматися подалі від [embassy_country.GetAdjective|l]ого двору. Ми прибули сюди не для того, щоб привертати до себе увагу."
  grand_embassy.3.title: "Велике посольство в місті [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
  grand_embassy.3.desc.unaware: "Посольство #ONCLICK:COUNTRY,[from.GetKey] #TOOLTIP:COUNTRY,[from.GetKey],X [from.Custom('CL_GEN')|L]#!#! прибуло до [ROOT.GetCountry.GetAdjective|l]ого двору. За їхніми власними словами, вони лише звичайні мандрівники, які бажають ознайомитися з тим, як влаштовані справи [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. Чи дозволимо ми їм зазирнути до наших майстерень та установ, чи зволіємо якнайшвидше їх позбутися?"
  grand_embassy.3.desc.aware: "Наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] має на службі людей, яким вдалося непомітно з’ясувати, хто насправді входить до складу цього посольства. Якщо [target_ruler.GetName] буде [Select_CString(target_ruler.IsFemale, 'викрита', 'викритий')], це поставить обидві сторони у скрутне становище. Втім, прийняти в себе правителя, який побажав особисто ознайомитися з визначними досягненнями #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, хай навіть під виглядом звичайного мандрівника, — велика честь. Виходить, що потайність може бути взаємовигідною."
  grand_embassy.3.a: "Дозвольте їм оглянути наші майстерні та установи."
  grand_embassy.3.b: "Наші дива гідні загального захоплення."
  grand_embassy.3.c: "Нема чого розкривати наші таємниці всіляким чужинцям."
  grand_embassy.3.d: "Дозвольте їм оглянути наші майстерні та установи, але без зайвого розголосу."
  grand_embassy.3.e: "Настільки почесні гості мають право безперешкодно ознайомитися з нашими здобутками."
  grand_embassy.3.f: "[Select_CString(target_ruler.IsFemale, 'Шановна', 'Шановний')] [target_ruler.GetShortNameWithNoTooltip], ми вас упізнали, і тут вам не раді."
  grand_embassy.4.title: "Дозвіл залишитися"
  grand_embassy.4.desc: "Після того як стало відомо, хто прибув разом із посольством, [embassy_country.GetGovernment.GetCourtTitle|l] #ONCLICK:COUNTRY,[embassy_country.GetKey] #TOOLTIP:COUNTRY,[embassy_country.GetKey],X [embassy_country.Custom('CL_GEN')|L]#!#! пропонує нам затриматися та оглянути інші визначні місця країни."
  grand_embassy.4.a: "Ми приймемо це запрошення з вдячністю."
  grand_embassy.4.b: "Зверніться до приймальної сторони з проханням ще продовжити наше перебування."
  grand_embassy.6.title: "Затяжний візит приніс свої плоди"
  grand_embassy.6.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale,'затрималася', 'затримався')] в місті [embassy_country.GetCapital.GetName], щоб особисто вивчити #L [embassy_country.GetAdjective|l]і#! технологічні новинки. Цей час було витрачено зовсім не даремно."
  grand_embassy.6.a: "Це піде на користь нашим державним інститутам!"
  grand_embassy.6.b: "Це піде на користь нашим збройним силам!"
  grand_embassy.7.title: "Успіх Великого посольства"
  grand_embassy.7.desc: "Візит до міста [embassy_country.GetCapital.GetCapitalName] був надзвичайно успішним, але тепер нам знову час у дорогу. Куди ми попрямуємо далі?"
  grand_embassy.7.a: "Повернутися додому."
  grand_embassy.7.b: "Тримати путь до місцевості [target_1.GetNameWithNoTooltip]."
  grand_embassy.7.c: "Натомість попрямувати до місцевості [target_2.GetNameWithNoTooltip]."
  grand_embassy.7.d: "Обрати наступною зупинкою місцевість [target_3.GetNameWithNoTooltip]."
  grand_embassy.7.e: "Відвідати також місцевість [target_4.GetNameWithNoTooltip]."
  grand_embassy.7.f: "Спрямувати посольство до місцевості [target_5.GetNameWithNoTooltip]."
  grand_embassy.5.title: "У проханні залишитися відмовлено"
  grand_embassy.5.desc: "Запорукою швидкої модернізації #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! є вивчення технологічних новинок #TOOLTIP:SUB_CONTINENT,western_europe,X #L Західної Європи#!#!. На жаль, #L [embassy_country.GetAdjective|l]а#! влада відмовилася піти нам назустріч і дозволити затриматися в місті [embassy_country.GetCapital.GetName] для вивчення їхніх досягнень."
  grand_embassy.5.a: "Повернутися додому."
  grand_embassy.5.b: "Постараємося отримати користь із відвідин місцевості [target_1.GetNameWithNoTooltip]."
  grand_embassy.5.c: "Пошукаємо привітнішого прийому в місцевості [target_2.GetNameWithNoTooltip]."
  grand_embassy.5.d: "Можливо, місцевість [target_3.GetNameWithNoTooltip] виявиться гостиннішою"
  grand_embassy.5.e: "Краще випробуємо долю в місцевості [target_4.GetNameWithNoTooltip]."
  grand_embassy.5.f: "Зрештою, можна навідатися до місцевості [target_5.GetNameWithNoTooltip]."
  grand_embassy.discretion_down_4_tt: "Проблиск упізнання (#R -4#! обачности)"
  grand_embassy.discretion_down_5_tt: "Лишатися в тіні стає дедалі важче (#R −5#! до прихованости)"
  grand_embassy.discretion_down_10_tt: "Двір починає підозрювати недобре (#R −10#! до прихованости)"
  grand_embassy.discretion_down_20_tt: "Надмірна прихильність привертає зайву увагу (#R −20#! до прихованости)"
  grand_embassy.discretion_down_30_tt: "Наше прикриття викрито (#R −30#! до прихованости)"
  grand_embassy.discretion_up_10_tt: "Нам вдалося лишитися непоміченими (#G +10#! до прихованости)"
  grand_embassy.discretion_set_0_tt: "Більше немає сенсу прикидатися (Прихованість: 0)"
  grand_embassy.modernization_up_0to10_tt: "Ліпше переймати досвід, лишаючись у тіні (#G від +0 до +10#! до осучаснення)"
  grand_embassy.opportunities_set_1_tt: "Стороннім багато чого не показують (Можливості: 1)"
  grand_embassy.opportunities_set_2_tt: "Деякі двері відчинені навіть для сторонніх (Можливості: 2)"
  grand_embassy.opportunities_set_3_tt: "Перед нами відчинені будь-які двері (Можливості: 3)"
  grand_embassy.opportunities_set_4_tt: "Нам надали повний доступ (Можливості: 4)"
  grand_embassy.opportunities_up_1_tt: "Запрошення відчиняє ще одні двері (#G +1#! до можливостей)"
  grand_embassy.opportunities_up_2_tt: "Наполегливість, хоч якою принизливою вона була б, відчиняє ще двоє дверей (#G +2#! до можливостей)"
  grand_embassy.opportunities_down_1_tt: "День згаяно (#R −1#! до можливостей)"
  received_grand_embassy: "Велике посольство прийнято"
  rejected_grand_embassy: "Велике посольство відправлено геть"
  humiliated_grand_embassy: "Приниження Великого посольства"
  grand_embassy.8.title: "Прикрощі на батьківщині"
  grand_embassy.8.desc: "Посольство отримало тривожні звістки про заворушення на батьківщині. Доки [target_ruler.GetName] перебуває за кордоном, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] і [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] бажають знати, де перебуває [ROOT.GetCountry.GetGovernment.GetRulerTitle|l]. Якщо урвати подорож зараз, ми повернемося ні з чим. Якщо ж планів не змінювати, країні доведеться ще якийсь час обходитися без [Select_CString(target_ruler.IsFemale, 'правительки', 'правителя')]."
  grand_embassy.8.a: "Нам треба негайно повертатися додому."
  grand_embassy.8.b: "Знання, які ще можна здобути, виправдовують будь-які витрати."
  grand_embassy.modernization_up_5_tt: "Ми багато чого навчилися (#G +5#! до осучаснення)"
  grand_embassy.modernization_up_15_tt: "Урок засвоєно сповна (#G +15#! до осучаснення)"
  grand_embassy.discretion_up_20_tt: "Золото робить людей напрочуд забудькуватими (#G +20#! до таємности)"
  grand_embassy.9.title: "Контора"
  grand_embassy.9.desc: "Перебуваючи [embassy_country.Custom('preposition_uv')] #ONCLICK:COUNTRY,[embassy_country.GetKey] #TOOLTIP:COUNTRY,[embassy_country.GetKey],X [embassy_country.Custom('CL_PREP')|L]#!#!, ми зустріли скарбника. Він знайомить нас з обліковими книгами та податковими реєстрами, на яких тримається вся праця скарбниці. Його вимащені чорнилом пальці впевнено ковзають колонками цифр, а підсумкові суми незмінно сходяться. Кожну суму вносять до книг двічі: як борг і як сплату боргу, тож жодна монета не лишається неврахованою. Окрім того, під кінець тижня цифри додатково звіряють з паперами про вантаж, що прибув до порту. За певну плату та маючи належне терпіння, можна довідатися багато нового й простежити весь хід справи від початку до кінця."
  grand_embassy.9.a: "Варто взяти цей спосіб до уваги."
  grand_embassy.9.b: "Заплатіть їм за змогу повністю ознайомитися з реєстрами."
  grand_embassy.9.c: "Заплатіть їм за змогу ознайомитися з усіма обліковими книгами та лишіться, щоб достеменно опанувати лад обліку."
  grand_embassy.10.title: "Укладачі альманахів"
  grand_embassy.10.desc: "У [embassy_country.GetCapital.Custom('LR_PREP')|l] [embassy_country.GetCapital.GetName] діє товариство писарів, яке веде облік буквально всього: народжень, врожаїв, кораблів у порту і навіть щотижневих змін цін на хліб. Усі полиці в їхніх конторах заставлені обліковими книгами. Кожен запис датований і зіставляється з попередніми, завдяки чому цифри починають розповідати історію, якої не зміг би викласти жоден літописець. За словами укладачів, їхні альманахи відображають стан справ у країні точніше за будь-яку хроніку й дозволяють передбачати голод та достаток, виявляючи приховані закономірності. За певну плату вони ладні розповісти про свої прийоми кожному, хто достатньо терплячий, щоб розібратися в обрахунках."
  grand_embassy.10.a: "Варто взяти їхні прийоми до уваги."
  grand_embassy.10.b: "Заплатіть їм за змогу докладно ознайомитися з їхнім ремеслом."
  grand_embassy.10.c: "Заплатіть їм за змогу ознайомитися з усіма способами та лишіться, щоб достеменно їх опанувати."
  grand_embassy.11.title: "Придворні звичаї та мода"
  grand_embassy.11.desc: "Крій камзола, форма перуки, глибина поклону — придворні #ONCLICK:COUNTRY,[embassy_country.GetKey] #TOOLTIP:COUNTRY,[embassy_country.GetKey],X [embassy_country.Custom('CL_GEN')|L]#!#! вивчають ці тонкощі так само ретельно, як і умови угод. Невідповідна довжина подолу може занапастити добре ім’я, на відновлення якого підуть роки. Кожна складка вбрання і кожне перо щось та й означають, але неутаємниченим цього не розгадати. Посольство, яке не зважає на придворну моду, при дворі просто не помічають. Один із придворних ладен потай розповісти нам, що тут носять і чому, а також кому слід кланятися першим і наскільки глибоким має бути уклін."
  grand_embassy.11.a: "Дивимося й запам’ятовуємо."
  grand_embassy.11.b: "Заплатіть придворному за роз’яснення місцевих звичаїв і моди."
  grand_embassy.11.c: "Заплатіть придворному за докладне роз’яснення місцевих звичаїв і моди та лишіться, щоб достеменно їх вивчити."
  grand_embassy.12.title: "Гурток думок"
  grand_embassy.12.desc: "В одному з маєтків поблизу палацу майже щовечора збираються купці, вчені та знуджена шляхта, щоб за філіжанкою кави обговорити питання, які раніше не заведено було обговорювати відкрито: податки, віру та дозволені межі влади монарха. Бесіди тривають до пізньої ночі, а голоси лунають дедалі гучніше в міру того, як догорають свічки. Присутність незнайомців нікого не непокоїть, якщо ті здатні гідно підтримати розмову. Навіть чужинець може дістати запрошення на таку зустріч. Головне, щоб кава була добра, а думки відзначалися сміливістю."
  grand_embassy.12.a: "Просто посидимо осторонь і мовчки послухаємо."
  grand_embassy.12.b: "Заплатіть за запрошення на зустріч."
  grand_embassy.12.c: "Заплатіть за повноправну участь у гуртку та залишіться, щоб досконало опанувати мистецтво ведення подібних суперечок."
  grand_embassy.13.title: "Ливарня"
  grand_embassy.13.desc: "У ливарнях #ONCLICK:COUNTRY,[embassy_country.GetKey] #TOOLTIP:COUNTRY,[embassy_country.GetKey],X [embassy_country.Custom('CL_GEN')|L]#!#! гармати відливають способом, за таємницю якого наші зброярі дорого б заплатили: від складу стопу та будови форми до визначення часу вистигання. Від печей хвилями підіймається жар, але майстри працюють із розплавленим металом із незворушністю, в якій вгадується не просто вправність, а звичка, вироблена роками. Доглядач ливарні, упрілий від жару й не приховуючи гордості за плоди своєї праці, ладен за винагороду поділитися декількома таємницями. Особливо йому до вподоби ті, хто не просто слухає, а розуміє, що діється в них перед очима."
  grand_embassy.13.a: "Ну, що ж, подивимося, як вони виливають гармати."
  grand_embassy.13.b: "Заплатіть доглядачеві ливарні за таємниці його ремесла."
  grand_embassy.13.c: "Заплатіть доглядачеві ливарні за докладну розповідь про спосіб лиття металу та залишіться досконало його вивчити."
  grand_embassy.14.title: "Навчальний плац"
  grand_embassy.14.desc: "На навчальному плацу поблизу [embassy_country.GetCapital.Custom('LR_GEN')|l] [embassy_country.GetCapital.GetName] роти з дивовижною злагодженістю змінюють стрій і перезаряджають мушкети. Наше ополчення навряд чи змогло б дорівнятися до цих хвацьких вояків. Чоботи викарбовують кроки утрамбованою землею, ані на мить не збиваючись із ритму. Офіцери вигукують накази, а вояки їх виконують, щойно зачувши початок команди. Увесь підрозділ рухається як єдине ціле, а не як натовп ряджених ополченців. Втішений нашою увагою, сержант-наставник пропонує докладно ознайомити нас із усіма ступенями військового вишколу — від першої команди до останнього залпу."
  grand_embassy.14.a: "Ми просто поспостерігаємо за муштрою."
  grand_embassy.14.b: "Заплатіть сержантові за докладніший показ."
  grand_embassy.14.c: "Щедро заплатіть сержантові та залишіться досконало вивчити основи муштри."
  grand_embassy.15.title: "Слово в потрібне вухо"
  grand_embassy.15.desc: "Камергер, який відповідає за влаштування наших аудієнцій, обережно дає зрозуміти, що дарунок потрібній людині може відчинити чимало дверей. А деякі імена дивним чином зникають із певних списків, варто лише пообіцяти дзвінку монету. При цьому він говорить про це наче ненароком, приблизно як про погоду, і дивиться, чи зрозуміли ми натяк. При дворі це звична справа, хоча плата зазвичай тим вища, чим наполегливіше прохання."
  grand_embassy.15.a: "Піднесіть належний дарунок."
  grand_embassy.15.b: "Піднесіть значно щедріший дарунок."
  grand_embassy.16.title: "Обачний посередник"
  grand_embassy.16.desc: "Посередник, що заробляє на життя допомогою чужинцям у вирішенні всіляких справ у дорозі, пропонує нам свої послуги, запевняючи, що має знайомства на всіх вартових посадах і митницях аж до самого кордону. Говорить він обачно, натяками та недомовками — ніколи не уточнює, хто перед ним у боргу, але ясно дає зрозуміти, що таких людей чимало. За певну плату він подбає про те, щоб посольство не докучали зайвими розпитуваннями про те, куди воно прямує і навіщо, а в разі надмірної цікавості — щоб відповіді були доволі ухильними."
  grand_embassy.16.a: "Найміть посередника."
  grand_embassy.16.b: "Найміть посередника та щедро доплатіть йому за мовчання."
  grand_embassy.17.title: "Довгий язик"
  grand_embassy.17.desc: "Один із нашої почесті, добряче впившись у корчмі й намагаючись похизуватися перед незнайомцями, бовкнув зайвого про те, хто насправді очолює наше посольство. На ранок він навіть не зміг згадати, кому й що казав, а от корчмар нічого не забув, як і ті, хто пиячив за сусіднім столом. Чутка вже гуляє поміж слуг, і вони переказують її з тим особливим захватом, із яким патякають про найгостріші таємниці."
  grand_embassy.17.a: "Тепер уже нічого не вдієш."
  grand_embassy.17.b: "Заплатіть потрібним людям, щоб заглушити цю чутку."
  grand_embassy.18.title: "Несподівана зустріч зі старим знайомим"
  grand_embassy.18.desc: "На одній із вулиць посольство стикається з купцем, який давним-давно, у сприятливіші часи, торгував [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. Загледівши нас, він на мить завмирає та пильно вдивляється в обличчя очільника нашого посольства, а тоді квапливо йде геть, не сказавши ані слова. Помилитись неможливо: [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'викрита', 'викритий')], оскільки на обличчі купця відбилася не проста цікавість, а раптовий подив людини, яка впізнала когось, кого аж ніяк не сподівалася зустріти. А він достеменно знає, кого зустрів, і ми навряд чи зможемо вплинути на те, чи вирішить він зберегти це в таємниці."
  grand_embassy.18.a: "Лишається тільки сподіватися на те, що він мовчатиме."
  grand_embassy.18.b: "Розшукайте його та заплатіть за мовчання."
  grand_embassy.19.title: "Допитливий господар заїзду"
  grand_embassy.19.desc: "Господар заїжджого двору, де зупинилося посольство, ставить надто багато запитань, і кожне промовляє з удаваною невимушеністю людини, яка підозрює, що відповіді мають вагу. Наприклад, чому такий багатий почет поводиться настільки скромно? Чому подорожні ніколи не перераховують грошей? Чому ніхто з наших людей не дивиться йому у вічі, коли мова заходить про мету поїздки? Поки що він нас ні в чому не підозрює, а лише виказує допитливість, зважуючи кожну дивність у наших словах і поведінці, немов людина, що крутить у руках монету, перевіряючи, чи не обрізані в неї краї. Втім, це ненадовго."
  grand_embassy.19.a: "Не вдавайтеся в подробиці."
  grand_embassy.19.b: "Щедро заплатіть йому, щоб він припинив пхати свого носа до чужих справ."
  grand_embassy.20.title: "Перехоплений лист"
  grand_embassy.20.desc: "Лист, відправлений на батьківщину, у якому недвозначно [Select_CString(target_ruler.IsFemale, 'згадувалася', 'згадувався')] [target_ruler.GetName] та детальніше, ніж варто було б, розкривалася справжня мета посольства, зник десь дорогою між гінцем і кораблем. Не надійшло ні вимог викупу, ні звинувачень, ані найменшого натяку на те, куди він міг подітися, а це непокоїть значно дужче, ніж якби на нас вийшов викрадач. Ми не знаємо, у кого опинився наш лист, хто встиг його прочитати і як збирається з ним вчинити, дізнавшись про його зміст."
  grand_embassy.20.a: "Листа вже не повернути."
  grand_embassy.20.b: "Щедро оплатіть пошуки листа, а як знайдете — спаліть."
  grand_embassy.21.title: "Бенкет на нашу честь"
  grand_embassy.21.desc: "[embassy_country.GetGovernment.GetCourtTitle] влаштовує бенкет на честь посольства, де тостам, похвалам і промовам, здається, не буде краю, а все дійство затягнеться на цілий день. Кожна наступна страва вишуканіша за попередню, немов кухарі на кухні змагаються між собою. Кожну страву слід похвалити, на кожен тост — відповісти, а кожного балакучого вельможу — вислухати до кінця, навіть якщо в його промові немає нічого вартого уваги. Відхилити запрошення було б образою, а бути присутніми на бенкеті означає згаяти весь день на церемонії та частування."
  grand_embassy.21.a: "Ми залишимося до кінця урочистостей."
  grand_embassy.21.b: "Треба непомітно вислизнути й зайнятися чимось кориснішим."
  grand_embassy.22.title: "Призначення супровідника"
  grand_embassy.22.desc: "[embassy_country.GetGovernment.GetCourtTitle] вирішує надати нам супровідника, який пильнуватиме кожен крок нашого посольства. Чоловік він люб’язний, невтомний і сповнений рішучости показувати нам виключно сади та галереї, попри всі наші чемні прохання. На все в нього готова відповідь, а на будь-яку незручну мовчанку припасена тема для відволікання розмови, щоб звести все назад до водограїв та фресок, щойно ми опиняємося поблизу чогось справді вартого уваги. Майстерень нам не відвідати, хоч як би ми його благали."
  grand_embassy.22.a: "Що ж, ходімо туди, куди він показує."
  grand_embassy.22.b: "Можна нагадати йому про наше високе становище, щоб він показав нам щось, крім садів і галерей."
  grand_embassy.23.title: "Затяжна аудієнція"
  grand_embassy.23.desc: "Аудієнція в якогось геть незначного чиновника тягнеться вже не першу годину: компліменти сказано, подяки за вручені дари складено, а розмова йде колом — обмін усе тими самими люб’язностями, лише загорнутими в інші вислови, і так до нескінченности, поки вони остаточно не втрачають будь-якого глузду. Схоже, він нікуди не квапиться, а навпаки, втішається увагою чужоземних гостей, яка його цікавить значно більше, ніж предмет розмови. До миті, коли аудієнція добігає кінця, день уже безповоротно втрачено для чогось справді корисного."
  grand_embassy.23.a: "Щоб це витримати, нам знадобиться вся наша ґречність."
  grand_embassy.23.b: "Необхідно вкоротити час аудієнції, незважаючи на становище чиновника."
  grand_embassy.24.title: "Зговірливий розпорядник"
  grand_embassy.24.desc: "Розпорядник, до чиїх обов’язків входить ведення записів про господарські справи, натякає з обережністю людини, яка не вперше пропонує подібну послугу, що за слушну плату може «загубити» деякі імена. Він не просить про це навпростець, натомість питання зависає в тиші, поки він із терпінням бувалого пройдисвіта чекає, що ми вловимо натяк і заповнимо незручну павзу в розмові."
  grand_embassy.24.a: "Заплатіть розпорядникові, щоб він опустив деякі імена у своїх записах."
  grand_embassy.24.b: "Заплатіть розпорядникові, щоб він позбувся записів."
  grand_embassy.25.title: "Пересуди для відвернення уваги"
  grand_embassy.25.desc: "Майже одночасно з нашим прибуває посольство від менш впливового двору. Його представники галасують і поводяться безцеремонно, а тому стають значно зручнішою темою для пересудів. Варто лише заплатити не в міру балакучим слугам, і всі місцеві пліткарі та пліткарки обговорюватимуть чужих гостей — те, куди вони ходять і чим займаються. А нам нарешті всі дадуть спокій."
  grand_embassy.25.a: "Роздайте по парі монет кому слід."
  grand_embassy.25.b: "Щедро заплатіть потрібним слугам."
  grand_embassy.26.title: "Непомітний провідник"
  grand_embassy.26.desc: "Місцевий провідник знає всі вулиці та двері, де можна сховатися від сторонніх очей, і години, коли варта воліє не помічати того, що діється. Він пропонує допомогти посольству залишатися непоміченим під час пересувань. Причини таких пересторог його не цікавлять, він лише хоче знати, скільки ми ладні за це заплатити."
  grand_embassy.26.a: "Найміть провідника."
  grand_embassy.26.b: "Найміть провідника та додатково заплатіть за особливі заходи перестороги."