l_russian:
  circumnavigation_expedition_events.1.title: "Велике починання"
  circumnavigation_expedition_events.1.magellan: "Курс на Канарські острови. З Божою поміччю ми знайдемо Західне море."
  circumnavigation_expedition_events.1.a: "Set course for the Canaries. What lies beyond, we shall discover."
  circumnavigation_expedition_events.1.historical_info: "У вересні 1519 року Фернан Магеллан вирушив із Санлукар-де-Баррамеди, щоби відшукати західний шлях до Островів Прянощів для іспанської корони. До складу виправи входили п’ять кораблів: #italic «Тринідад»#!, #italic «Сан-Антоніо»#!, #italic «Консепсьйон»#!, #italic «Вікторія»#! та #italic «Сантьяго»#!. Магеллан був португальським мореплавцем, він ходив до Індії та Молуккських островів, але перейшов на службу до іспанської корони після того, як король Мануел I відмовився збільшити йому платню. Ця виправа увійшла в історію як перша навколосвітня подорож, хоча самому Магеллану не судилося побачити її завершення."
  circumnavigation_expedition_events.2.title: "Останній знайомий берег"
  circumnavigation_expedition_events.2.desc: "[location.GetProvince.GetName] rises from the sea in flat brown tiers — fortresses of rock against a sky that is still the same sky as in [departure_port.GetName]. The pilots take final soundings. The men drink fresh water from iron casks and repair rigging frayed by the Atlantic swell. Beyond the last headland, the charts end.\n\nSome of the men pray. A few write letters they have no way of sending. [target_leader.GetName] walks the deck as if measuring something that cannot be measured. What is loaded now must last across an ocean and beyond."
  circumnavigation_expedition_events.2.a: "Take on full provisions. We will need everything the islands can give us."
  circumnavigation_expedition_events.2.b: "Leave now. The men's courage is highest while land is still in sight."
  circumnavigation_expedition_events.2.c: "Шлях надто непевний. Повернутися до порту."
  circumnavigation_expedition_events.2.historical_info: "The Canary Islands — then under Castilian rule — served as the standard provisioning stop for Iberian Atlantic expeditions throughout the Age of Exploration. Magellan's fleet stopped at Tenerife to take on fresh provisions before beginning the long Atlantic crossing to the coast of South America. The islands had been colonized by Castile in the early 15th century and served as both a supply depot and a jumping-off point for voyages into unknown waters. How thoroughly a fleet victualled here could decide whether its crews survived the empty leagues to come."
  circumnavigation_expedition_events.3.title: "Край Нового Світу"
  circumnavigation_expedition_events.3.a: "Put ashore for wood, water, and fruit, and trade with the coastal folk."
  circumnavigation_expedition_events.3.b: "Берег зачекає. Тримати на південь, поки тримається погода."
  circumnavigation_expedition_events.3.historical_info: "Magellan's fleet reached the Brazilian coast late in 1519, making landfall in the vicinity of Cabo de Santo Agostinho before working south. Brazil fell within the Portuguese half of the world under the Treaty of Tordesillas, so a fleet in Spanish service could not linger openly on that shore; nonetheless the coastal Tupí traded eagerly, and the abundance of the land was a welcome relief after the Atlantic crossing."
  circumnavigation_expedition_events.4.title: "Велика затока"
  circumnavigation_expedition_events.4.a: "Rest the crews and revictual fully. We will not see such plenty again."
  circumnavigation_expedition_events.4.b: "Trade for what provisions we can and be gone within the week."
  circumnavigation_expedition_events.4.c: "Ми тут не для того, щоб бенкетувати. Пливти далі без торгівлі."
  circumnavigation_expedition_events.4.historical_info: "The great bay that would later cradle Rio de Janeiro gave Magellan's fleet its richest resupply of the whole voyage. Its sheltered waters teemed with fish, and the coastal Tupí traded provisions in astonishing quantity for trinkets and iron tools. A thorough revictualling here steeled the crews for the cold latitudes and the search for the strait; a fleet that hurried on paid for its haste in the south."
  circumnavigation_expedition_events.5.title: "Срібне гирло"
  circumnavigation_expedition_events.5.a: "Survey the estuary properly. Whatever is here is worth knowing."
  circumnavigation_expedition_events.5.b: "Ми не маємо часу на річки, що ведуть у нікуди. Пливіть на південь."
  circumnavigation_expedition_events.5.press_tt: "Флот без зволікань іде на південь у пошуках протоки, що має бути десь далі"
  circumnavigation_expedition_events.5.c: "Ці широти переходять усі розумні межі. Повертайтеся додому."
  circumnavigation_expedition_events.5.historical_info: "The Río de la Plata — the 'River of Silver' — was explored by the Spanish navigator Juan Díaz de Solís in 1516, who was killed by indigenous people shortly after making landfall. Magellan's expedition investigated the estuary in January 1520, incorrectly believing it might be the westward passage. The error cost them several weeks but produced the first detailed Spanish survey of the Río de la Plata region. The river was named for the silver traded there by the #italic Charrúa#! and #italic Guaraní#! peoples, though the rumored mountains of silver further inland proved elusive."
  circumnavigation_expedition_events.6.title: "Протока на краю світу"
  circumnavigation_expedition_events.6.a: "Drive the ships through. We did not come this far to be stopped by wind."
  circumnavigation_expedition_events.6.b: "Winter here. The passage will be kinder in season, the crews rested."
  circumnavigation_expedition_events.6.c: "Жоден шлях цього не вартий. Розвертайте флот."
  circumnavigation_expedition_events.6.historical_info: "Магелланова протока — пройдена в листопаді 1520 року — являє собою 570-кілометровий прохід крізь південний край Південної Америки, повз острів Вогняна Земля, названий так через сторожові багаття його тубільців. Перехід тривав 38 днів. Під час підходу до протоки Магеллан придушив бунт у Пуерто-Сан-Хуліані, стративши одного капітана й висадивши іншого на безлюдний берег. Третій корабель, #italic «Сан-Антоніо»#!, дезертирував і повернувся до Іспанії. Три решту — #italic «Тринідад»#!, #italic «Консепсьйон»#! і #italic «Вікторія»#! — вийшли у води, які Магеллан назвав #italic «Mar Pacífico»#!, 28 листопада 1520 року — так він нарік їх за оманливий спокій після страхіть протоки."
  circumnavigation_expedition_events.7.title: "Море, назване Тихим"
  circumnavigation_expedition_events.7.a: "Ощадити запаси й тримати рівний, обачний курс."
  circumnavigation_expedition_events.7.endured_tt: "Команда витримує перехід; флот дістається далекого берега, досі готовий до бою"
  circumnavigation_expedition_events.7.scurvy_tt: "Цинга й голод беруть своє; флот ледве повзе вперед зі знекровленими командами"
  circumnavigation_expedition_events.7.b: "Crowd on all sail. The sooner we raise land, the fewer we bury at sea."
  circumnavigation_expedition_events.7.fast_tt: "Стрімкий перехід позбавляє від найгірших втрат, і земля з’являється вчасно"
  circumnavigation_expedition_events.7.lost_tt: "Море виявляється ширшим, ніж будь-хто міг уявити. Останні припаси вичерпуються, і виправа гине в повному складі"
  circumnavigation_expedition_events.7.c: "Тримати курс на північ, до чуток про острови, і молитися про прісну воду."
  circumnavigation_expedition_events.7.islands_tt: "Розкидані острови дають воду та свіжі харчі; перехід витримують майже всі"
  circumnavigation_expedition_events.7.empty_sea_tt: "Північні води виявляються настільки ж безлюдними, як і решта; пошуки коштують дорогоцінного часу й нових життів"
  circumnavigation_expedition_events.7.historical_info: "Перехід Магеллана через Тихий океан тривав близько дев’яноста дев’яти днів без жодного поповнення запасів — флот блукав найбільш пустельною частиною найбільшого океану Землі, майже не зустрічаючи суходолу. Близько дев’ятнадцяти людей померли від цинги; вцілілі їли тирсу, шкіряну оснастку, розмочену в морській воді, а щури продавалися серед команди за шалені гроші. Першою землею став острів Гуам на Маріанських островах у березні 1521 року, який іспанці нарекли #italic Islas de los Ladrones#! — «Островами злодіїв» — після того як тубільці-чаморро викрали одну з корабельних шлюпок, що спричинило каральний напад. Плавання через Тихий океан на схід, додому, довго залишалося нездоланним для мореплавців, доки Андрес де Урданета не знайшов у 1565 році північний зворотний шлях, #italic tornaviaje#!, який започаткував багатовікову торгівлю манільських галеонів."
  circumnavigation_expedition_events.8.title: "Перша земля за два місяці"
  circumnavigation_expedition_events.8.a: "Lower the boats and search the reef — there may yet be water or food."
  circumnavigation_expedition_events.8.barren_tt: "Риф не дає нічого, крім глузування у вигляді суходолу, і дні згаяно"
  circumnavigation_expedition_events.8.relief_tt: "Зібрано трохи дощової води й кілька морських птахів — малий рятунок від голоду"
  circumnavigation_expedition_events.8.b: "Тут нічого немає, і глибини замало, аби ми стали на якір. Рушаймо далі."
  circumnavigation_expedition_events.8.historical_info: "24 січня 1521 року флот угледів свою першу землю в Тихому океані: невеликий безлюдний атол, названий Сан-Пабло — найімовірніше, Пука-Пука в архіпелазі Туамоту. Пігафетта записав, що обидва острови, виявлені під час переходу, «не мали місця для якоря, бо не було дна», і містили «тільки птахів і дерева». Не зумівши висадитися, голодуючі команди не змогли взяти з них геть нічого, і Магеллан назвав цю пару #italic Islas Infortunadas#! — Нещасливі острови."
  circumnavigation_expedition_events.9.title: "Острів акул"
  circumnavigation_expedition_events.9.desc: "A second island rises from the sea, and it is as barren as the first — coral and scrub, ringed with surf, offering no anchorage. The only life in its waters is sharks, gliding grey beneath the hulls in numbers that make the sailors cross themselves. There is no landing here, no water, no food — only the same empty ocean, and the men's hope wearing thinner by the day.\n\n[target_leader.GetName] must decide how the fleet bears its despair."
  circumnavigation_expedition_events.9.a: "Lower the boats one last time and try for the shore through the surf."
  circumnavigation_expedition_events.9.b: "Назвати його Островом акул і мовчки рушати далі."
  circumnavigation_expedition_events.9.historical_info: "Другий із Нещасливих островів, помічений 21 лютого 1521 року, був названий #italic Tiburones#! — «Акули» — через безліч акул, яких Пігафетта помітив у його водах. Імовірно, це острів Керолайн або Флінт; він також не мав ані дна для якоря, ані порятунку. Тижні між двома островами були найважчими за весь перехід: цинга невпинно косила людей, а команди їли шкіру, тирсу та щурів, аби вижити. Акул вони не ловили — вони навіть не могли дістатися берега."
  circumnavigation_expedition_events.10.title: "Острови злодіїв"
  circumnavigation_expedition_events.10.a: "Чесно вимінювати всі харчі й воду, які тільки зможемо забрати."
  circumnavigation_expedition_events.10.b: "Land an armed party, recover the boat, and take what we need by force."
  circumnavigation_expedition_events.10.c: "Seize what we can from the canoes and stand out to sea at once."
  circumnavigation_expedition_events.10.historical_info: "6 березня 1521 року флот дістався Гуаму на Маріанських островах — першої землі після протоки. Магеллан назвав острови #italic Islas de los Ladrones#! — Островами Злодіїв — після того, як чаморро, не маючи уявлення про приватну власність, поцупили корабельну шлюпку. У відповідь він висадив близько сорока озброєних вояків, спалив оселі й убив кількох остров’ян, аби повернути човен. Хоч як там було, ця стоянка дала вмираючим командам перші за три з гаком місяці свіжі харчі та воду — і стала їхнім порятунком."
  circumnavigation_expedition_events.11.title: "Blood and Baptism at Cebu"
  circumnavigation_expedition_events.11.desc: "The islands have saved the expedition. After the ordeal of the crossing, [target_leader.GetName]'s crews take on water, fruit, and fresh meat, and at Cebu the rajah receives them with feasting. A compact is sworn in blood: his people will take the cross, and in return the strangers' guns will serve his crown. Hundreds are baptized in a single day beneath the tropical sun.\n\nThen comes the price of alliance. Across a narrow channel, on the island of Mactan, a defiant chief refuses both the new god and the new overlord — and our ally looks to us to humble him. To make a friend among these islands is to inherit his enemies."
  circumnavigation_expedition_events.11.a: "Take up our ally's quarrel. Let Mactan see what our arms can do."
  circumnavigation_expedition_events.11.mactan_triumph_tt: "Показ сили лякає острови, і ворогів нашого союзника приборкано"
  circumnavigation_expedition_events.11.mactan_disaster_tt: "Приступ зривається на мілинах; гинуть добрі люди, і флот від цього слабшає"
  circumnavigation_expedition_events.11.b: "Take what the islands give and sail on. Their wars are not ours."
  circumnavigation_expedition_events.11.c: "Plant the royal standard. Let the crown record what we have found here."
  circumnavigation_expedition_events.11.historical_info: "Магеллан досяг Філіппінського архіпелагу в березні 1521 року, назвавши його архіпелагом Сан-Ласаро. Філіппіни стали місцем першого тривалого контакту з народами західної частини Тихого океану й надали харчі, що врятували виснажений голодом флот. Магеллан уклав кровний союз із раджею Хумабоном із Себу, навернувши його та кілька тисяч його підданих у християнство. Цей союз виявився фатальним: 27 квітня 1521 року Магеллан загинув у битві при Мактані, очоливши невдалий приступ через рифи проти вождя Лапу-Лапу заради свого нового союзника. Командування зрештою перейшло до Хуана Себастьяна Елькано, а вцілілі — їх було замало, аби керувати трьома кораблями, — спалили #italic«Консепсьйон»#! біля острова Бохоль."
  circumnavigation_expedition_events.12.title: "Острови прянощів"
  circumnavigation_expedition_events.12.a: "Fill the holds with [ShowGoodsName('cloves')]. We crossed the world for spices to carry home."
  circumnavigation_expedition_events.12.cloves_loaded_tt: "Вцілілі трюми вщерть забиті крамом [ShowGoodsName('cloves')], який буде продано в ринку [ROOT.GetCountry.GetCapital.GetMarket.GetName] після повернення флоту. Команда, що подолала Тихий океан неушкодженою, привозить додому значно багатший вантаж"
  circumnavigation_expedition_events.12.b: "Swear a treaty with the Sultan. An alliance is worth more than cargo."
  circumnavigation_expedition_events.12.treaty_cargo_tt: "Із султаном укладено договір, і на борт завантажено частину [ShowGoodsName('cloves')] — вантаж скромніший, зате дружба з Островами Прянощів переживе його"
  circumnavigation_expedition_events.12.historical_info: "Молуккські острови — споконвічні «острови прянощів» — були джерелом гвоздики, мускатного горіха та мацису, які робили східну торгівлю настільки цінною. Кораблі Елькано досягли Тідоре в листопаді 1521 року; його султан був суперником Тернате, який тоді перебував під впливом Португалії. #italic «Вікторія»#! і #italic «Трінідад»#! завантажили гвоздику; згодом #italic «Трінідад»#! спробував повернутися на схід через Тихий океан, але не здолав вітри й був захоплений португальцями. Лише #italic «Вікторія»#! під орудою Елькано продовжила шлях на захід. Коли вона нарешті дісталася Санлукар-де-Баррамеди у вересні 1522 року з вісімнадцятьма вцілілими та повним трюмом гвоздики, один цей вантаж прянощів окупив усю трирічну виправу й приніс прибуток."
  circumnavigation_expedition_events.13.title: "Огинаючи мис"
  circumnavigation_expedition_events.13.desc: "The cape is everything the Portuguese warned it would be — a wall of grey water and wind that treats the ships as if they are leaves. The crew, what remains of it, does not complain. They have already crossed a passage that should have been impossible, an ocean that had no name, and an archipelago where their captain died. The Cape of Good Hope is just another obstacle.\n\nWhen the flagship clears the headland and the winds ease, [target_leader.GetName] looks east, then west. They have now been in every ocean the world possesses."
  circumnavigation_expedition_events.13.a: "Подякуймо долі. Що б не сталося далі, про нас пам’ятатимуть."
  circumnavigation_expedition_events.13.b: "Жодних церемоній. Тримаємо курс на північ. Ми ще не вдома."
  circumnavigation_expedition_events.13.historical_info: "#italic «Вікторія»#! обігнула мис Доброї Надії в травні 1522 року під орудою Елькано, здолавши останню значну географічну перешкоду на шляху додому до Іспанії. Португальці тримали під наглядом шлях довкола мису та тамтешні порти постачання; Елькано уникав їх через непевне правове становище виправи, адже Іспанія та Португалія сперечалися за зверхність над Молуккськими островами згідно з Тордесільяським договором. Корабель був у жалюгідному стані, протікав, а екіпаж із 18 людей — від початкових 270 — був на межі виснаження. Вони досягли Санлукар-де-Баррамеди 6 вересня 1522 року, завершивши перше навколосвітнє плавання менш ніж за три роки."
  circumnavigation_expedition_events.14.title: "Дружні береги"
  circumnavigation_expedition_events.14.a: "Put her to rights — caulk the seams, fill the casks, feed the men."
  circumnavigation_expedition_events.14.b: "A brief stop only. The men can rest properly once they are home."
  circumnavigation_expedition_events.14.historical_info: "За часів Магеллана острови Кабо-Верде належали Португалії, і іспанська флотилія не сміла відкрито поповнювати там запаси. Однак корона, яка сама володіла б цими атлантичними островами, знайшла б у них безцінну останню стоянку перед поверненням додому — сховок, де можна викренувати корабель, набрати води та харчів для судна, виснаженого найдовшим із будь-коли здійснених плавань."
  circumnavigation_expedition_events.15.title: "Час розплати"
  circumnavigation_expedition_events.15.a: "Hold to the story. Buy what we can before they question the date."
  circumnavigation_expedition_events.15.ruse_ok_tt: "Вигадка витримує перевірку; харчі закуплено, і корабель вислизає перш, ніж розпитування стануть наполегливішими"
  circumnavigation_expedition_events.15.ruse_failed_tt: "Обман викрито через пропущений день, і частину берегового загону схоплено перш, ніж корабель устигає відплисти"
  circumnavigation_expedition_events.15.b: "Do not chance a rival's harbor. Press on for home, hungry as we are."
  circumnavigation_expedition_events.15.historical_info: "У липні 1522 року #italic «Вікторія»#! зайшла до португальського Сантьягу на островах Кабо-Верде, оголосивши, що повертається з Америки, аби приховати свій шлях через східні землі, на які зазіхала Португалія. Хитрість діяла, поки розбіжність в один день у судновому журналі — перший практичний доказ того, як навколосвітнє плавання збиває лік дням, — не викликала підозр, і португальці схопили тринадцятьох людей з команди. Решта обрубали якірний канат і втекли, діставшись Іспанії лише з вісімнадцятьма моряками на борту."
  circumnavigation_expedition_events.16.title: "Пустельна стоянка"
  circumnavigation_expedition_events.16.a: "Send hunting parties ashore for goats, and fill the casks at the springs."
  circumnavigation_expedition_events.16.b: "Наповнити бочки водою та йти далі. Дім уже зовсім близько."
  circumnavigation_expedition_events.16.historical_info: "Кораблі, що проходили повз, часто завозили на незаселені атлантичні острови кіз та свиней, які розплоджувалися у дикі стада й перетворювали голі скелі на мимовільні комори для майбутніх мореплавців. Неколонізований, але багатий на воду острів на зворотному шляху давав знесиленій виправі свіже м’ясо та чисту воду без жодної плати, окрім кількох днів затримки — мала ласка, але справжня, та ще й на підступах до рідних берегів."
  circumnavigation_expedition_events.17.title: "Жоден корабель не повернувся"
  circumnavigation_expedition_events.17.desc: "Season follows season at [ROOT.GetCapital.GetName] with no word from the fleet, until hope itself is spent. The expedition will not come home. Somewhere past the edge of the known world — swallowed by a sea too wide to cross, or ground down to too few ships and too few hands to sail on — the vessels and their crews are gone. Of the fleet that set out to circle the world, nothing returns but silence and the names of the dead.\n\nThe dream outlives the men who chased it. Another reign, another crew, may yet finish what this one began."
  circumnavigation_expedition_events.17.a: "Про них не забудуть."
  circumnavigation_expedition_events.17.end_tt: "Виправа згинула, і на цьому її шлях скінчився"
  circumnavigation_expedition_events.17.historical_info: "Із семи кораблів, що вийшли під проводом Ґарсії Хофре де Лоайси у 1525 році, щоб повторити шлях Магеллана, лише один пошарпаний корабель та купка вцілілих дісталися Молуккських островів, і ніхто не завершив зворотний шлях через східний прохід. Цілковита загибель виправи була повсякденною загрозою тієї доби: навколосвітнє плавання вимагало довгих років у морі без жодної надії на поповнення запасів, і флот, поглинутий Тихим океаном, деколи щезав без сліду."
  circumnavigation_expedition_events.18.title: "Бунт"
  circumnavigation_expedition_events.18.desc: "It begins the way these things always begin: a muttered word on the night watch, a knot of men who fall silent when an officer passes, a captain who will no longer meet [target_leader.GetName]'s eye. The provisions are short, the men are cold and afraid, and they signed on for a voyage to the Indies, not for the end of the world. Now the discontent has hardened into something with a shape — one of the captains has refused an order outright, and his crew stands at his back, demanding the fleet turn about for home.\n\n[target_leader.GetName] has perhaps a day before the rot spreads to the other ships. What is decided must be decided now."
  circumnavigation_expedition_events.18.a: "Нехай невдоволені повертають назад. Ми йдемо далі без них."
  circumnavigation_expedition_events.18.b: "Put the mutiny down by force. The ringleaders will answer for it."
  circumnavigation_expedition_events.18.fight_win_tt: "Заколот придушено, а його винуватців показово покарано. Порядок відновлено, хоча розправа коштувала флоту часу"
  circumnavigation_expedition_events.18.fight_lose_tt: "Придушення заколоту переростає у відкриту сутичку й закінчується лихом: у цьому безладі флот втратив корабель, перш ніж вдалося навести лад, та й час теж згаяно"
  circumnavigation_expedition_events.18.c: "Нагадати їм про те, що чекає за небокраєм."
  circumnavigation_expedition_events.18.rouse_tt: "[target_leader.GetName] обходить палуби й промовляє до команди так, як не зумів би жоден звичайний командир. Заколот згасає сам собою, а бойовий дух матросів злітає ще вище, ніж колись"
  circumnavigation_expedition_events.19.title: "Власний берег"
  circumnavigation_expedition_events.19.a: "Rest and revictual fully here. We will not see friendly soil for long."
  circumnavigation_expedition_events.19.b: "A brief and grateful stop, then south. The season will not wait."
  circumnavigation_expedition_events.19.historical_info: "The northeastern shoulder of Brazil — Pernambuco, Paraíba, Rio Grande — was among the earliest and richest zones of Iberian settlement in the New World, its coast fringed with brazilwood and, before long, sugar. A crown that held these harbours could water and revictual a fleet on its own soil before the long haul into the southern latitudes — a luxury Magellan, threading waters claimed by a rival, never enjoyed."
  circumnavigation_expedition_events.20.title: "Берег суперника"
  circumnavigation_expedition_events.20.a: "Put in and trade cautiously with [rival_crown.GetName]'s colony for what provisions we can."
  circumnavigation_expedition_events.20.b: "Оминути гавань суперника. Йти далі на південь."
  circumnavigation_expedition_events.20.historical_info: "За Тордесільяським договором бразильське узбережжя опинилося в португальській половині світу, і флот на кастильській службі не міг претендувати на права в його гаванях. На ділі зголодніла команда та поступливий колоніальний фактор усе ж могли нишком домовитися про припаси, але заходження до порту суперницької корони завжди загрожувало захопленням, поборами чи конфіскацією будь-якого корабля, не здатного довести своє право перебувати там."
  circumnavigation_expedition_events.21.title: "Цинга на борту"
  circumnavigation_expedition_events.21.desc: "The sickness that haunts every long voyage has come at last. Gums blacken and bleed, old scars split open of their own accord, teeth loosen in the jaw, and men who were hale a month ago can no longer rise from the deck. The surgeon has no remedy but rest and fresh food, and of both there is precious little of either.\n\n[target_leader.GetName] must weigh how hard a dying crew can be driven."
  circumnavigation_expedition_events.21.a: "Ration what fresh stores remain and lie easy until the worst has passed."
  circumnavigation_expedition_events.21.b: "No time to spare. Press on; the strong will outlast the sickness."
  circumnavigation_expedition_events.21.b.tt: "The crossing grinds on with the sick left to their fate. Many will not see the far shore, and the survivors will be too few to bring home all the fleet."
  circumnavigation_expedition_events.22.title: "Буря"
  circumnavigation_expedition_events.22.desc: "The sky turns the color of a bruise and the sea rises into grey mountains. The wind claws at the rigging, and the ships labor in troughs deep enough to swallow a steeple. Green water breaks clean over the decks, and the pilots can no longer see one ship from another.\n\n[target_leader.GetName] must choose whether to fight the storm head-on or run before it and pray the fleet holds together."
  circumnavigation_expedition_events.22.a: "Лягти в дрейф, прибрати вітрила й перечекати бурю."
  circumnavigation_expedition_events.22.b: "Йти за вітром і набрати всю можливу швидкість."
  circumnavigation_expedition_events.22.b.win_tt: "Флот долає найстрашніше і виходить розсіяним, пошарпаним, але цілим"
  circumnavigation_expedition_events.22.b.lose_tt: "The gamble fails: the fleet is flung apart in the dark, and a ship may not answer the next dawn"
  circumnavigation_expedition_events.23.title: "Шашіль у корпусі"
  circumnavigation_expedition_events.23.a: "Кренгувати й лагодити кораблі на якомусь безлюдному березі, як доведеться."
  circumnavigation_expedition_events.23.a.tt: "The fleet careens on an empty shore and does what it can; the work is slow and costly, but the hulls will hold a while longer."
  circumnavigation_expedition_events.23.b: "Покинути найгірший корпус, а його команду перевести на решту кораблів."
  circumnavigation_expedition_events.23.c: "Make for the friendly harbor close at hand and refit her properly."
  circumnavigation_expedition_events.23.c.tt: "The fleet puts in at a friendly harbor within reach and refits in safety — a far surer repair than any lonely beach could offer, and a welcome rest for the crews."
  circumnavigation_expedition_events.24.title: "Штиль"
  circumnavigation_expedition_events.24.a: "Чекати повернення вітру, хоч скільки часу це забере."
  circumnavigation_expedition_events.24.b: "Спустити шлюпки й тягти кораблі на буксирі силою рук."
  circumnavigation_expedition_events.25.title: "Замало рук"
  circumnavigation_expedition_events.25.desc: "Стільки людей загинуло або лежить безпорадними внизу, що дужих рук більше не вистачає для кермування всіма кораблями. Нічого не вдієш: один корабель позбавляють усього цінного, жменьку вцілілих здатних до служби моряків переходять на решту суден, а його порожній корпус залишають на волю хвиль. Флот пливне далі з меншою кількістю кораблів — зате решта тепер укомплектована як слід."
  circumnavigation_expedition_events.25.a: "Іншого вибору не було. Розподілити його команду між рештою кораблів."
  circumnavigation_expedition_events.26.title: "Загибель корабля"
  circumnavigation_expedition_events.26.desc: "Коли буря врешті вщухає і флот знову збирається разом, одного корабля бракує. Чи його викинуло на підвітряний берег, чи він розійшовся по швах і пішов на дно в пітьмі, чи просто був занесений за обрій і загубився — ніхто сказати не може. Він не повертається. Море забрало його — і всі душі на облавку."
  circumnavigation_expedition_events.26.a: "Прочитати молитви за упокій та плисти далі."
  circumnavigation_expedition_events.27.title: "Безлюдний берег"
  circumnavigation_expedition_events.27.a: "Висадитися на берег. Наповнити діжки водою і зібрати дрова, плоди та дичину."
  circumnavigation_expedition_events.27.b: "Немає часу на пошуки харчу. Йти далі, хоч би якими голодними ми були."
  circumnavigation_expedition_events.28.title: "Торгівля з берегом"
  circumnavigation_expedition_events.28.desc.christian: "The holds are running low, but there is a Christian settlement on the coast nearby — church bells carrying faintly across the water, a cross raised above the harbor. Their people put out in boats to look the strangers over, wary but willing, and where there is a common faith there is a common tongue for bargaining. Grain, salt meat, fruit, and fresh water are all to be had for coin and trade goods.\n\nA few days spent at anchor here would fill the holds again. [target_leader.GetName] weighs the delay against the dwindling stores."
  circumnavigation_expedition_events.28.desc.muslim: "The holds are running low, but there is a Muslim town on the coast nearby — the call to prayer drifting out over the water, dhows drawn up along the strand. Their traders come out to meet the fleet, shrewd and unafraid, for these are people who have bought and sold across every sea in the world. Rice, dates, salt fish, and sweet water are all to be had for good coin and the right goods.\n\nA few days spent at anchor here would fill the holds again. [target_leader.GetName] weighs the delay against the dwindling stores."
  circumnavigation_expedition_events.28.desc.pagan: "The holds are running low, but there is a village on the coast nearby, its people following gods the fleet's chaplains have never heard named. They come out cautiously in canoes, offering roots, fruit, fish, and gourds of fresh water, curious about the iron and cloth and trinkets the strangers hold up in return. Neither side has the other's language, but hunger and barter need none.\n\nA few days spent trading here would fill the holds again. [target_leader.GetName] weighs the delay against the dwindling stores."
  circumnavigation_expedition_events.28.a: "Пристати до берега й виміняти все, що можна, на стільки харчів, скільки подужає вмістити флот."
  circumnavigation_expedition_events.28.b: "Немає часу на торги. Йдемо далі, хоч би як голодно нам було."
  circumnavigation_expedition_events.provisioned_tt: "The fleet is fully provisioned, and its crews will better withstand the great crossing ahead"
  circumnavigation_expedition_events.supplies_up_tt: "The fleet's provisions are replenished"
  circumnavigation_expedition_events.supplies_down_tt: "The fleet's provisions run lower"
  circumnavigation_expedition_events.morale_up_tt: "Morale among the crews rises"
  circumnavigation_expedition_events.morale_down_tt: "Morale among the crews falls"
  circumnavigation_expedition_events.morale_crash_tt: "Morale collapses — the crews are pushed to the edge of mutiny"
  circumnavigation_expedition_events.ship_lost_tt: "A vessel is lost, and the expedition is reduced"
  circumnavigation_expedition_events.wintered_tt: "Wintering restores the ships and crew, who will face the great crossing in far better condition"
  circumnavigation_expedition_events.9.a.tt: "Шлюпки повертаються порожніми, але команди бачили, що спробу було зроблено, тож бойовий дух падає лише трохи (#R -3#! до бойового духу екіпажу)"
  circumnavigation_expedition_events.morale_crash_15_tt: "Бойовий дух занепадає — команда на межі бунту (#R -15#! до бойового духу екіпажу)"
  circumnavigation_expedition_events.morale_crash_20_tt: "Бойовий дух занепадає — команда на межі бунту (#R -20#! до бойового духу екіпажу)"
  circumnavigation_expedition_events.morale_crash_30_tt: "Бойовий дух занепадає — команда на межі бунту (#R -30#! до бойового духу екіпажу)"
  circumnavigation_expedition_events.morale_down_10_tt: "Бойовий дух команди падає (#R -10#! бойовий дух екіпажу)"
  circumnavigation_expedition_events.morale_down_15_tt: "Бойовий дух команди падає (#R -15#! бойовий дух екіпажу)"
  circumnavigation_expedition_events.morale_down_20_tt: "Бойовий дух команди падає (#R -20#! до бойового духу екіпажу)"
  circumnavigation_expedition_events.morale_down_3_tt: "Бойовий дух команди падає (#R -3#! бойовий дух екіпажу)"
  circumnavigation_expedition_events.morale_down_5_tt: "Бойовий дух команди падає (#R -5#! бойовий дух екіпажу)"
  circumnavigation_expedition_events.morale_down_6_tt: "Бойовий дух команди падає (#R -6#! бойовий дух екіпажу)"
  circumnavigation_expedition_events.morale_down_8_tt: "Бойовий дух команди падає (#R -8#! до бойового духу екіпажу)"
  circumnavigation_expedition_events.morale_up_10_tt: "Бойовий дух команд зростає (#G +10#! бойовий дух екіпажу)"
  circumnavigation_expedition_events.morale_up_12_tt: "Бойовий дух команд зростає (#G +12#! бойовий дух екіпажу)"
  circumnavigation_expedition_events.morale_up_15_tt: "Бойовий дух команд зростає (#G +15#! бойовий дух екіпажу)"
  circumnavigation_expedition_events.morale_up_30_tt: "Бойовий дух команди підіймається (#G +30#! Бойовий дух екіпажу)"
  circumnavigation_expedition_events.morale_up_5_tt: "Бойовий дух команд зростає (#G +5#! Бойовий дух екіпажу)"
  circumnavigation_expedition_events.morale_up_6_tt: "Бойовий дух команд зростає (#G +6#! Бойовий дух екіпажу)"
  circumnavigation_expedition_events.morale_up_8_tt: "Бойовий дух команд зростає (#G +8#! Бойовий дух екіпажу)"
  circumnavigation_expedition_events.supplies_down_10_tt: "Запаси харчів флоту вичерпуються (#R -10#! Харчі)"
  circumnavigation_expedition_events.supplies_down_5_tt: "Запаси харчів флоту вичерпуються (#R -5#! Харчі)"
  circumnavigation_expedition_events.supplies_up_10_tt: "Запаси харчів флоту поповнено (#G +10#! Харчі)"
  circumnavigation_expedition_events.supplies_up_15_tt: "Запаси харчів флоту поповнено (#G +15#! Харчі)"
  circumnavigation_expedition_events.supplies_up_20_tt: "Запаси харчів флоту поповнено (#G +20#! Харчі)"
  circumnavigation_expedition_events.supplies_up_25_tt: "Запаси харчів флоту поповнено (#G +25#! Харчі)"
  circumnavigation_expedition_events.supplies_up_30_tt: "Запаси харчів флоту поповнено (#G +30#! Харчі)"
  circumnavigation_expedition_events.supplies_up_5_tt: "Запаси харчів флоту поповнено (#G +5#! Харчі)"
  circumnavigation_expedition_events.1.desc: "Five ships. Two hundred and seventy men. A year's provisions and a route that no pilot has ever sailed. [target_leader.GetName] speaks calmly of islands thick with cloves and a westward passage to the Spice Islands. The harbormaster does not believe [target_leader.GetHimHer]. The pilots are uncertain. But the ships are provisioned, the wind is favorable, and the commission bears the royal seal.\n\nAhead lies everything that is not yet on any chart."
  circumnavigation_expedition_events.3.desc: "After weeks of open [ShowContinentName('atlantic_ocean_continent')], a low green line hardens on the western horizon — the coast of a New World. Parrots scream in the forest and the water runs sweet from a hundred rivers. Canoes put out from the shore, their paddlers curious and unafraid, offering wood, water, and strange fruit. Here is everything a tired fleet could want — but the season is turning, and the passage south is still unfound.\n\n[target_leader.GetName] weighs the comfort of the shore against the miles still to run."
  circumnavigation_expedition_events.4.desc: "The fleet stands into a bay so vast and sheltered it seems a gift — ringed by green mountains, its waters silver with fish. The people of the shore come out in throngs, trading fowl, fruit, and fish for fishhooks and knives, offering more than the holds can carry. After the long journey across the Atlantic it is a paradise, and the men would gladly never leave.\n\nBut paradise is a poor master of a voyage. [target_leader.GetName] must decide how long the fleet may linger."
  circumnavigation_expedition_events.5.desc: "The pilots knew there had to be a passage. No continent could go on forever. But the great estuary is so wide that the far bank cannot be seen from the mast, and the water, though brackish, runs brown with silt for forty leagues out to sea. Boats are sent up the river mouth for two weeks.\n\nThey return with news of catfish, shallow water, and no passage to any ocean. Somewhere further south, the real passage waits — if it exists at all."
  circumnavigation_expedition_events.6.desc: "The passage is cold, narrow, and murderous. Walls of black rock rise sheer on both sides, and the channel twists back on itself until the pilots can no longer say which way is west. The wind is the true enemy: it funnels down off the snowfields and changes direction without warning, screaming through the rigging in sudden white squalls that drive the ships back the way they came and pin them for days against the rock.\n\n[target_leader.GetName] stands at the prow of the flagship in silence as the walls close in. The pilots say the passage is navigable. The men are not certain the pilots are sane. Somewhere ahead, if the charts can be believed at all, is an ocean so vast it has no name yet."
  circumnavigation_expedition_events.7.desc: "The last black headland of the strait falls astern, and before the fleet opens an ocean without limit. [target_leader.GetName] names it the #italic Mar Pacífico#! for its calm — a calm that will become a curse. Week gives way to week and no island rises. The water in the casks turns yellow and foul; the biscuit is powder and weevils; the men gnaw ox-hide softened over the side and pay half a ducat for a rat.\n\nThe pilots cannot say how wide this sea is, for no one has ever crossed it. However [target_leader.GetName] chooses to face it, some who set out will not live to see the far shore."
  circumnavigation_expedition_events.8.desc: "For sixty days and more the fleet has seen nothing but water. Then a cry from the masthead: land! Hope runs through the ships like fire — until the boats draw near. The 'land' is a low ring of coral and palm, beaten by surf, with no bottom to hold an anchor and no sign of fresh water. Birds wheel overhead; the trees hold nothing a starving man can eat.\n\nThe island offers only the cruelty of hope. [target_leader.GetName] must decide whether to linger and search, or move on."
  circumnavigation_expedition_events.10.desc: "At the very edge of endurance, the lookouts spot green mountains — real land at last, with water, fruit, and fish. Outrigger canoes swarm out to meet the fleet, their sailors swift and fearless, coming aboard and carrying off everything not lashed down. To them, a thing unguarded is a thing freely taken; to the famished crews it is robbery.\n\nThese islands can save the expedition, if [target_leader.GetName] can wring provisions from them."
  circumnavigation_expedition_events.12.desc: "The Moluccas. The point on every map that no Iberian ship had ever reached from the west. The smell reaches the ships before the islands are visible — cloves, rich and dark, their scent carried on the same wind that has driven them across two oceans.\n\n[target_leader.GetName] stands on the deck as the pilots call depth readings, and says nothing for a long time. The holds are almost empty. The crew is a shadow of what it was. But they are here, and the Sultan's boats are already pulling out to meet them."
  circumnavigation_expedition_events.14.desc: "The islands ahead fly [ROOT.GetCountry.GetName]'s own colors. After years beyond every chart, the fleet has landed on friendly soil at last — a harbor where the ship may be caulked, the casks filled, and the skeleton crew fed without fear or falsehood. The governor's people come down to the quay to gape at the gaunt, ragged men who claim to have sailed around the world.\n\nHome waters are close now. [target_leader.GetName] need only decide how long to rest."
  circumnavigation_expedition_events.15.desc: "The last ship is leaking at every seam and the crew is starving, yet the only harbor within reach flies the colors of a rival crown. [target_leader.GetName] orders the ship in under a false story — that they are homeward from the Americas, not from the forbidden east. But when the men ask ashore what day it is, the answer is wrong by one: somewhere in circling the world, the fleet has lost a day from its reckoning, and the discrepancy could betray everything.\n\nProvisions are within reach, if the deception holds."
  circumnavigation_expedition_events.16.desc: "The islands are uninhabited — dry, wind-scoured heaps of rock and scrub — but they are land, with sheltered water and springs among the stones. Better still, goats run wild across the slopes, left by some earlier ship, and the sailors' mouths water at the thought of fresh meat after so long on rot and weevils.\n\nThe anchorage costs nothing but time, and time is the one thing a homeward ship can spare. [target_leader.GetName] gives the order."
  circumnavigation_expedition_events.19.desc: "After weeks of open [ShowContinentName('atlantic_ocean_continent')], a low green line hardens on the western horizon — and the banners above the little harbor town are our own. A colony of [ROOT.GetCountry.GetName], planted on this far shore, throws open its storehouses to the crown's ships. Fresh water, fruit, salt meat, and timber for repairs are all to be had, and freely, among countrymen.\n\n[target_leader.GetName] may take on everything the fleet can carry before turning south for the unknown."
  circumnavigation_expedition_events.20.desc: "After weeks of open [ShowContinentName('atlantic_ocean_continent')], a low green line hardens on the western horizon — but the banners above the harbor belong to [rival_crown.GetName]. Their colony holds this shore, and a fleet in our service has no lawful right to its wharves. Still, the storehouses are full, the factors willing enough to trade for good coin, and the men are hungry for anything that is not weevilly biscuits.\n\n[target_leader.GetName] must decide whether to put in beneath a rival's guns or hold course for the south."
  circumnavigation_expedition_events.23.desc: "In these warm waters the teredo worm bores into the planking faster than any carpenter can plug it, until the timbers are riddled like a honeycomb. The pumps are manned around the clock, and still the bilges rise. A hull this far gone cannot be trusted across an ocean without a proper careening — beaching the ship, burning the growth from her bottom, and paying her seams anew.\n\n[target_leader.GetName] must decide how to keep the fleet afloat."
  circumnavigation_expedition_events.24.desc: "The wind dies to nothing. The sails hang slack against the masts, the sea lies flat and glassy beneath a white and pitiless sky, and the ships sit motionless day upon day while the water in the casks turns foul and the food runs down. The men grow sullen and then afraid, muttering that the fleet has sailed off the edge of the world's winds and will never feel them again.\n\n[target_leader.GetName] can only wait — or set the boats to the oars."
  circumnavigation_expedition_events.27.desc: "The holds are running low, but a low green coast lies off the beam — untenanted, so far as the lookouts can tell, with no smoke of cooking fires and no canoes putting out. Fresh water tumbles from the rocks in a dozen streams, wildfowl crowd the shallows, and the woods promise fruit, timber, and game to any party willing to go ashore and take it.\n\nGathering enough to matter will cost the fleet days it can ill afford, but empty bellies cost more. [target_leader.GetName] gives the order."