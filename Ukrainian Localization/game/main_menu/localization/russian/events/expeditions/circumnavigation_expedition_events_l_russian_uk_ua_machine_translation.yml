l_russian:
  circumnavigation_expedition_events.1.title: "Велика подорож"
  circumnavigation_expedition_events.1.desc: "П’ять кораблів, двісті сімдесят людей та річний запас харчів проти шляху, яким іще не ходив жоден капітан. [target_leader.GetName] спокійно розповідає про землі, всіяні гвоздикою, та про західний шлях до Островів прянощів, утім, начальник порту не вірить [Select_CString(target_leader.IsFemale, 'її', 'його')] словам. Лоцмани також почуваються невпевнено, але зараз це вже не має значення: кораблі споряджені, вітер дме попутний, а виправа дістала королівську печатку.\n\nПопереду на нас чекають безкраї далі, яких іще немає на жодній мапі."
  circumnavigation_expedition_events.1.magellan: "Взяти курс на Канари. Якщо на те є воля Божа, ми знайдемо Західне море."
  circumnavigation_expedition_events.1.a: "Уперед, до Канарів. Що б не чекало на нас попереду, ми будемо там першими."
  circumnavigation_expedition_events.1.historical_info: "У вересні 1519 року Фернан Магеллан вирушив із Санлукар-де-Баррамеди, щоб відшукати західний шлях до Островів Прянощів для іспанської влади. До складу виправи входили п’ять кораблів: #italic Тринідад#!, #italic Сан-Антоніо#!, #italic Консепсьйон#!, #italic Вікторія#! та #italic Сантьяго#!. Магеллан був португальським мореплавцем, він подорожував до Індії та Молуккських островів, але перейшов на службу до іспанської корони після того, як король Мануел I відмовився збільшити йому платню. Ця виправа увійшла в історію як перша навколосвітня подорож, хоча самому Магеллану не судилося повернутися додому."
  circumnavigation_expedition_events.2.title: "Останній знайомий берег"
  circumnavigation_expedition_events.2.desc: "[current_location.GetProvince.GetName] виринає з-за обрію бурими скелястими ярусами. Над головами моряків поки що те саме знайоме небо, яке вони бачили перед відплиттям. Лоцмани роблять останні виміри глибини, а решта команди набирає прісну воду й лагодить такелаж, пошарпаний суворими водами та вітрами Атлантики. Попереду останній мис, за яким починаються незвідані води.\n\nДехто молиться, інші — пишуть листи, які вже не зможуть надіслати, а [target_leader.GetName] квапливо ходить палубою туди й назад, ніби щось вираховуючи. Хоч би що ми взяли з собою, цих припасів має вистачити для мандрівки через океан і тих несподіванок, які можуть спіткати нас за його межами."
  circumnavigation_expedition_events.2.a: "Запасімося харчами вщерть. Другої такої нагоди може й не бути."
  circumnavigation_expedition_events.2.b: "Відчалюємо негайно, поки команда не втратила відваги."
  circumnavigation_expedition_events.2.c: "Шлях надто непередбачуваний. Ліпше повернутися додому."
  circumnavigation_expedition_events.2.historical_info: "У добу Великих географічних відкриттів Канарські острови, які тоді належали Кастилії, слугували головною базою постачання та відправною точкою для іберійських виправ через Атлантичний океан. Так, на шляху до Південної Америки флот Магеллана зробив зупинку на Тенерифе, щоби поповнити запаси харчів перед тривалою мандрівкою через Атлантику. Від харчів, куплених на цих островах, значною мірою залежало те, чи переживе команда прийдешні місяці далеко від суходолу."
  circumnavigation_expedition_events.3.title: "Новий край світу"
  circumnavigation_expedition_events.3.desc: "Після кількох тижнів у безкраїх водах #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L Атлантики#!#! на видноколі нарешті з’явилася зелена смуга — жадане узбережжя Нового Світу. З далеких лісів уже долинають вигуки папуг, а численні річки розливаються прісною водою біля узбережжя. Невдовзі ми підходимо до берега, де нас зустрічають тубільці на каное, які пропонують нам деревину, питво та незвичні плоди. Тут є все, що потрібно втомленим морякам, проте пора року ось-ось зміниться, а шлях на південь і досі не знайдено.\n\n[target_leader.GetName], [Select_CString(target_leader.IsFemale, 'яка скучила', 'який скучив')] за суходолом і затишком, міркує, чи варто затриматися тут, чи ліпше пливти далі."
  circumnavigation_expedition_events.3.a: "Зупинимося, щоб поторгувати з місцевими та поповнити припаси."
  circumnavigation_expedition_events.3.b: "Перепочинок зачекає. Треба поспішати на південь, поки погода нам сприяє."
  circumnavigation_expedition_events.3.historical_info: "Флот Магеллана досяг узбережжя Бразилії наприкінці 1519 року. Підійшовши до суходолу в районі Кабу-ді-Санту-Агостінью, виправа негайно рушила далі на південь: за Тордесільяським договором, Бразилія потрапляла до сфери впливу Португалії, тож іспанський флот не міг довго затримуватися біля її берегів. Утім, тутешні індіанці тупі залюбки торгували зі своїми новими гостями, та й сама присутність суходолу поруч уже давала іспанцям змогу зітхнути з полегшенням після тривалого плавання через Атлантику."
  circumnavigation_expedition_events.4.title: "Величезна бухта"
  circumnavigation_expedition_events.4.desc: "Наш флот заходить у широку та добре захищену бухту, оточену зеленими горами, де кишить усяка риба. Нам назустріч виходять юрби тубільців, які пропонують м’ясо та плоди в обмін на наші ножі й рибальські гачки. Після довгого шляху через Атлантику це місце здається справжнім раєм, і моряки з радістю лишилися б тут назавжди.\n\nПроте ми вирушили в мандрівку не для того, щоб відпочивати. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити, скільки флот тут простоїть, перш ніж рушити далі."
  circumnavigation_expedition_events.4.a: "Людям треба як слід перепочити та набрати харчів, інакше їм не витримати дороги."
  circumnavigation_expedition_events.4.b: "Виторгуємо в місцевих більше їжі та відчалимо за тиждень."
  circumnavigation_expedition_events.4.c: "Ніколи набивати черево. Забудьмо про торгівлю та пливімо далі."
  circumnavigation_expedition_events.4.historical_info: "Величезна бухта Гуанабара, біля якої пізніше заснували Ріо-де-Жанейро, дозволила флоту Магеллана запастися харчами в небачених доти обсягах. Її тихі води повнилися рибою, а індіанці тупі, які жили на її берегах, удосталь віддавали іспанцям їжу в обмін на знаряддя та різне дрібниччя. Поповнення запасів у цій бухті дозволило команді ґрунтовно підготуватися до майбутнього пошуку протоки в холодних широтах Патагонії, який інакше неминуче обернувся б невдачею."
  circumnavigation_expedition_events.5.title: "Срібне гирло"
  circumnavigation_expedition_events.5.desc: "Наші лоцмани були певні, що ми знайдемо протоку: зрештою, жоден континент не може тягнутися вічно. Проте тутешнє гирло настільки широке, що його далекого берега не видно навіть із щогли, а його солонуваті й мулисті води сягають у море на сорок ліг. Ми виряджаємо кораблі на розвідку вгору річкою, щоби переконатися напевне.\n\nЗа кілька тижнів вони повертаються та повідомляють, що знайшли лише сомів і мілини, і жодного проходу до океану попереду немає. Це означає лише одне: треба пливти далі на південь. Якщо протока все-таки існує, ми її знайдемо."
  circumnavigation_expedition_events.5.a: "Дослідимо гирло як слід. Можливо, з нього все ж буде користь."
  circumnavigation_expedition_events.5.b: "Не будемо гаяти часу на глухі кути. Рушаймо на південь."
  circumnavigation_expedition_events.5.press_tt: "Флот негайно продовжує шлях на південь у пошуках омріяної протоки"
  circumnavigation_expedition_events.5.c: "Це згубна справа. Час повертатися додому."
  circumnavigation_expedition_events.5.historical_info: "Ріо-де-ла-Плата — «срібна річка» — була відкрита в 1516 році іспанським мореплавцем Хуаном Діасом де Солісом, якого тубільці вбили невдовзі після цієї події. Експедиція Магеллана дослідила гирло річки в січні 1520 року, помилково вважаючи, що це може бути протока на захід. Цей прорахунок коштував їм кількох тижнів, проте саме він дозволив іспанцям зібрати перші докладні відомості про цей край. Річка дістала назву на честь срібла, яким жваво торгували місцеві індіанці чарруа та гуарані. Втім, легендарні срібні гори, про які іспанці довідалися від тубільців, відшукали лише через багато десятиліть."
  circumnavigation_expedition_events.6.title: "Протока на краю світу"
  circumnavigation_expedition_events.6.desc: "Протока виявилася холодною, вузькою та вкрай небезпечною. По обидва боки від неї височіють велетенські чорні скелі, а сам канал сповнений розгалужень та крутих вигинів, через які лоцмани ледь не збиваються з курсу. Та наш найпідступніший ворог — це шквалистий вітер. Він дме з льодовиків і повсякчас змінює напрямок, зі скреготом відкидаючи наші кораблі назад і притискаючи їх до скель на довгі години чи навіть дні.\n\n[target_leader.GetName] стоїть на носі флагмана, мовчки спостерігаючи за тим, як звужуються стіни протоки. Лоцмани запевняють, що тут можна пройти, проте решта команди бачить у них безумців. Якщо мапи не брешуть, десь попереду на нас чекає неозорий океан, який іще тільки має дістати свою назву."
  circumnavigation_expedition_events.6.a: "Треба йти далі. Вітер нас не спинить."
  circumnavigation_expedition_events.6.b: "Перезимуємо тут. Набравшись сил, подолати протоку буде легше."
  circumnavigation_expedition_events.6.c: "Цей шлях того не вартий. Повернути кораблі назад!"
  circumnavigation_expedition_events.6.historical_info: "Магелланова протока, відкрита у 1520 році, є 570-кілометровим коридором, що пролягає крізь південний край Південної Америки. Вона відділяє материк від архіпелагу Вогняна Земля, що дістав свою назву від численних вогнищ, які тубільці розпалювали на узбережжі. Прохід Магеллана протокою тривав 38 днів. На шляху до неї виправа з п’яти кораблів зупинилася в бухті Сан-Хуан, де частина команди зчинила заколот. Унаслідок цього одного з бунтівних капітанів стратили, а іншого кинули помирати в бухті. Після цього один із кораблів, #italic «Сантьяго»#!, зазнав аварії під час розвідки, а #italic «Сан-Антоніо»#! самовільно залишив виправу й повернувся до Іспанії. Решта три кораблі — #italic «Консепсьйон»#!, #italic «Тринідад»#! та #italic «Вікторія»#! — успішно подолали протоку й досягли Тихого океану 28 листопада 1520 року."
  circumnavigation_expedition_events.7.title: "Океан, наречений тихим"
  circumnavigation_expedition_events.7.desc: "Останній чорний мис протоки лишається позаду, і перед нашим флотом відкривається безкраїй океан. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'назвала', 'назвав')] його #italic mar pacifico#! — «тихе море», позаяк за час перебування тут ми не зустріли жодної бурі. Проте на нас упало інше, значно страшніше лихо. Тижні минали один за одним, а на видноколі так і не з’явилося ані клаптика землі. За цей час вода в бочках протухла, а від сухарів зосталися лише крихти, перемішані з хробаками. Через таку скруту моряки заходилися здирати з оснащення волячу шкіру та вимочувати її в морській воді, щоб розм’якшити і з’їсти, а трюмні щури взагалі стали для них на вагу золота.\n\nЛоцмани не знають, скільки нам ще пливти, бо ніхто досі не вирушав у таку плавбу. Хоч би яке рішення [Select_CString(target_leader.IsFemale, 'ухвалила', 'ухвалив')] [target_leader.GetName] для подолання цієї скрути, частина команди, напевне, вже ніколи не побачить суходолу."
  circumnavigation_expedition_events.7.a: "Берегтимемо останні запаси і триматимемося курсу."
  circumnavigation_expedition_events.7.endured_tt: "Команда витримує плавання, і флот дістається далеких берегів у відносній цілості"
  circumnavigation_expedition_events.7.scurvy_tt: "Цинга та голод беруть своє, і флот утрачає значну частину команди"
  circumnavigation_expedition_events.7.b: "Підняти всі вітрила! Що швидше ми дістанемося суходолу, то менше людей загине."
  circumnavigation_expedition_events.7.fast_tt: "Швидкий хід дає змогу вчасно дістатися суходолу та врятувати знесилених моряків"
  circumnavigation_expedition_events.7.lost_tt: "Океан виявився значно більшим, ніж ми гадали. Флот вичерпує останні запаси і гине"
  circumnavigation_expedition_events.7.c: "На північ мають бути острови. Сподіватимемося, що там є прісна вода."
  circumnavigation_expedition_events.7.islands_tt: "Команда знаходить на архіпелазі їжу та прісну воду. Плавання обійшлося малими жертвами"
  circumnavigation_expedition_events.7.empty_sea_tt: "Острови виявилися порожніми, а їхні пошуки згаяли дорогоцінний час і забрали ще більше життів"
  circumnavigation_expedition_events.7.historical_info: "Подорож Магеллана Тихим океаном тривала 99 днів, і за цей час виправа жодного разу не поповнила своїх запасів. Флот тижнями наосліп блукав найбільшим у світі океаном, не натрапляючи бодай на п’ядь суходолу. 19 моряків померли від цинги, а ті, хто вижив, харчувалися тирсою, вимоченою в морській воді волячою шкірою та щурами, яких продавали за нечуваною ціною у пів дуката за штуку. Зрештою, в березні 1521 року кораблі досягли Маріанських островів, які іспанці прозвали #italic «островами злодіїв»#! через тубільців, що вкрали в них одну зі шлюпок. У ті часи зворотний шлях із Тихого океану на батьківщину через Південну Америку був для моряків непосильним, проте вже у 1565 році мореплавець Андрес де Урданета відкрив північний шлях із Філіппін до Мексики, який на довгі століття став головним шляхом для манільських торгових галеонів."
  circumnavigation_expedition_events.8.title: "Перший суходіл за два місяці"
  circumnavigation_expedition_events.8.desc: "Ось уже понад шістдесят днів команда не бачить за бортом нічого, крім води, аж раптом із верхівки щогли лунає вигук: «Земля!». Надія охоплює кораблі, немов дике полум’я, але коли ми підходимо ближче, радість змінюється розчаруванням. Суходіл — це невеликий атол, порослий пальмами й омиваний високими хвилями. Тут нема за що зачепити якір, ніде набрати води. На тутешніх деревах немає нічого їстівного для голодних моряків, а з усього живого довкола — лише птахи, що кружляють над головою.\n\nНа перший погляд цей острів геть непотрібний, проте виснажені моряки сподіваються, що тут усе ж є чим поживитися. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити, чи варто затриматися та пошукати припасів, чи ліпше одразу рушати далі."
  circumnavigation_expedition_events.8.a: "Спустимо шлюпки й пошукаємо воду та бодай щось їстівне."
  circumnavigation_expedition_events.8.barren_tt: "Марне згаяння часу: на острові не знайдеться нічого корисного"
  circumnavigation_expedition_events.8.relief_tt: "Команда добуде трохи дощової води та морських птахів. Голодна смерть ненадовго відступить"
  circumnavigation_expedition_events.8.b: "Тут нам робити нічого. Треба плисти далі."
  circumnavigation_expedition_events.8.historical_info: "24 січня 1521 року флот Магеллана натрапив на свій перший тихоокеанський острів — невеликий атол, який іспанці назвали Сан-Пабло (вважається, що це був атол Пука-Пука архіпелагу Туамоту). У своїх щоденниках Антоніо Пігафетта писав, що на двох островах, які їм трапилися, «ніде було кинути якір, бо там не було дна». Не маючи змоги висадитися, зголодніла команда так і не змогла зібрати на цих островах бодай якихось припасів, через що Магеллан зрештою назвав їх #italic Islas Infortunadas#! — «островами безталання»."
  circumnavigation_expedition_events.9.title: "Острів акул"
  circumnavigation_expedition_events.9.desc: "З-за обрію виринає другий острів, настільки ж порожній, як і перший: довкола лише корали та кущі, а кораблям ніде стати на якір. З риби в навколишніх водах лише незліченні акули, чиї сірі плавці час від часу виринають біля наших кораблів. Тут немає ані місця для стоянки, ані їжі, ані прісної води — лише океан, від виду якого команда поволі втрачає надію.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити, як флоту ліпше вчинити в такій скруті."
  circumnavigation_expedition_events.9.a: "Спробуймо дістатися берега на шлюпках."
  circumnavigation_expedition_events.9.a.tt: "Шлюпки повернуться ні з чим, але моряки раді бодай спробувати, тож невдача не надто їх засмутить (#R -3#! до духу)"
  circumnavigation_expedition_events.9.b: "Назвімо острів Акулячим і рушаймо далі."
  circumnavigation_expedition_events.9.historical_info: "Другий з «островів безталання» відкрили 21 лютого 1521 року, і він дістав назву #italic Тібуронес#! (ісп. tiburones — «акули») через безліч акул у тамтешніх водах. Заведено вважати, що це був атол Керолайн або Флінт. Як і перший тихоокеанський острів, що трапився Магеллану, він був геть порожнім і не мав придатного місця для стоянки. Ті тижні, які флот провів між цими двома островами, стали найважчими для команди за весь час мандрівки: виснажені голодом і цингою моряки мусили їсти тирсу, пацюків і волячу шкіру, якою обмотували оснащення. І хоч вони змогли виловити кількох акул, їхнє м’ясо виявилося твердим і смердючим, так що моряків вергло навиворіт."
  circumnavigation_expedition_events.10.title: "Острови злодіїв"
  circumnavigation_expedition_events.10.desc: "Коли сили наші вже добігали кінця, вартові помітили вдалині зелені гори. Нарешті суходіл, де буде прісна вода, риба та садовина. Коли ми підходимо до берега, нам назустріч вирушають катамарани. Невдовзі зухвалі тубільці вправно видираються на борти наших кораблів і беруться тягти все, що не прибито до палуби. Для них будь-яка полишена річ — чесна здобич, однак для зголоднілих моряків це грабунок.\n\nЗнайдені острови здатні забезпечити виправу вкрай потрібними харчами, але лише [target_leader.GetName] може вирішити, як ми їх здобудемо."
  circumnavigation_expedition_events.10.a: "Чесно виміняймо в місцевих якнайбільше харчів та води в дорогу."
  circumnavigation_expedition_events.10.b: "Спорядімо озброєний загін, щоб повернути награбоване та набрати харчів."
  circumnavigation_expedition_events.10.c: "Заберімо з катамаранів усе, що можна, і пливімо далі."
  circumnavigation_expedition_events.10.historical_info: "Флот Магеллана дістався Гуаму 6 березня 1521 року. Це був перший острів, на який виправа натрапила в Тихому океані після виходу з протоки. Мореплавець назвав Маріанські острови, до яких належить Гуам, «островами злодіїв» — #italic Islas de los Ladrones#!. Причиною стали чаморро — тубільці, які не мали уявлення про приватну власність, а тому забрали одну зі шлюпок з корабля експедиції. У відповідь Магеллан відрядив по човен зо сорок озброєних моряків, які вбили кількох остров’ян і спалили їхні хатини. Заразом зголодніла команда вперше за три місяці поповнила запаси їжі та прісної води, тож зупинка, попри сутичку, стала для виправи справжнім порятунком."
  circumnavigation_expedition_events.11.title: "Кров і віра на Себу"
  circumnavigation_expedition_events.11.desc: "Острови врятували нашу виправу. Після важкої мандрівки через океан моряки нарешті змогли набрати прісної води, садовини та м’яса в дорогу, а раджа острова Себу й поготів зустрів нас щедрим бенкетом. Під час перемовин [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'уклала', 'уклав')] з місцевим правителем кровну угоду: він та його народ приймуть #L [ROOT.GetCountry.GetReligion.GetAdjectuve|l]у#! віру, а натомість наші гармати послужать його короні. У підсумку за один день під променями тропічного сонця навернулися одразу сотні тубільців.\n\nНевдовзі наш новий союзник нагадав про обов’язок. За вузькою протокою лежить острів Мактан, і його гордий вождь відмовився коритися й заявив, що ані раджа, ані [ROOT.GetCountry.GetReligion.GetGodName] не мають над ним влади. Тепер раджа просить, щоб ми вгамували зухвальця. Схоже, аби здобути друзів на цих островах, слід виступити проти їхніх ворогів…"
  circumnavigation_expedition_events.11.a: "Ми допоможемо союзникові. Нехай Мактан побачить нашу міць."
  circumnavigation_expedition_events.11.mactan_triumph_tt: "Злякані показом сили, вороги нашого союзника визнають поразку"
  circumnavigation_expedition_events.11.mactan_disaster_tt: "Наступ захлинеться ще на мілководді. Загинуть люди, що послабить флотилію"
  circumnavigation_expedition_events.11.b: "Візьмімо на островах усе, що потрібно, і відчалюймо. Це не наша боротьба."
  circumnavigation_expedition_events.11.c: "Встановімо тут королівський стяг. Нехай усі знають, що ці острови — наша знахідка."
  circumnavigation_expedition_events.11.historical_info: "Фернан Магеллан дістався Філіппін у березні 1521 року й дав архіпелагу назву Сан-Ласаро. Тут виправа не лише змогла поповнити запаси харчів, а й уперше встановила міцний зв’язок із населенням західної частини Тихого океану. Так, Магеллан уклав кровну угоду з раджею Хумабоном, правителем острова Себу. За умовами угоди, раджа та кілька тисяч його підданих прийняли християнство в обмін на військову допомогу. Цей союз виявився фатальним для Магеллана: 27 квітня 1521 року мореплавець загинув у битві при Мактані, де він на чолі загону виступив на боці свого нового союзника й очолив необачний напад на вождя Лапу-Лапу. Після загибелі Магеллана командування флотом перейшло до Хуана Себастьяна Елькано, а через брак людей виправі довелося спалити біля острова Бохоль один із трьох уцілілих кораблів — #italic «Консепсьйон»#!."
  circumnavigation_expedition_events.12.title: "Острови прянощів"
  circumnavigation_expedition_events.12.desc: "Молуккські острови. Досі жоден іберійський корабель не діставався цих місць західним шляхом. Тепер же ті самі вітри, що гнали навантажені прянощами кораблі через океани, доносять до нас їхні пахощі просто з островів, які щойно забовваніли на обрії.\n\n[target_leader.GetName] мовчки стоїть на палубі, поки матроси вимірюють глибину. Трюми майже спорожніли, від виправи лишилася хіба бліда тінь. І все ж ми тут, на місці призначення, і кораблі місцевого султана вже пливуть нам назустріч."
  circumnavigation_expedition_events.12.a: "Заповнімо трюми гвоздикою. Задля цієї миті ми перетнули весь світ."
  circumnavigation_expedition_events.12.cloves_loaded_tt: "Уцілілі кораблі будуть завантажені #TOOLTIP:GOODS,cloves,X гвоздикою#!, яку після повернення флоту продадуть на ринку [ROOT.GetCountry.GetCapital.GetMarket.GetName]. Успішне подолання Тихого океану дасть змогу команді повернутися додому з багатим вантажем"
  circumnavigation_expedition_events.12.b: "Слід укласти із султаном союз. Це куди важливіше за будь-який крам."
  circumnavigation_expedition_events.12.treaty_cargo_tt: "Ми укладемо угоду із султаном і розділимо багатство. У трюмах буде менше #TOOLTIP:GOODS,cloves,X гвоздики#!, зате ми матимемо надійного союзника на Островах прянощів"
  circumnavigation_expedition_events.12.historical_info: "Молуккські острови, першими названі Островами прянощів, були головним джерелом гвоздики, мускатного горіха та мацису для східних торгових шляхів. У листопаді 1521 року флот Хуана Себастьяна Елькано досяг острова Тідоре, чий правитель тоді ворогував із сусіднім султанатом Тернате, що перебував у португальській сфері впливу. Кораблі #italic «Вікторія»#! та #italic «Тринідад»#! прийняли тут вантаж гвоздики, після чого другий спробував повернутися до Європи через Тихий океан, але зазнав невдачі й був захоплений португальцями. #italic «Вікторія»#! ж під орудою самого Елькано продовжила шлях на захід і прибула до Санлукар-де-Баррамеди у вересні 1522 року. На той час на борту лишилося лише 18 уцілілих. Однак дохід від привезеної гвоздики покрив усі витрати на трирічну виправу і навіть приніс чималий прибуток."
  circumnavigation_expedition_events.13.title: "Довкола мису"
  circumnavigation_expedition_events.13.desc: "Моряцькі байки не брехали: біля мису вирують величезні сірі хвилі, а буревій жене кораблі, наче тріски. Втім, команда — а точніше те, що від неї лишилося, — не сміє нарікати. Моряки вже подолали щонайважчу протоку, перетнули безіменний океан і залишили позаду архіпелаг, де дивом не загинули. Мис Доброї Надії для них не більше ніж чергова перепона.\n\nКоли флагман огинає мис, вітри врешті вщухають. [target_leader.GetName] дивиться на схід, потім на захід. Тепер флотилія за одну мандрівку побувала в усіх океанах світу."
  circumnavigation_expedition_events.13.a: "Подякувати команді. Хай що станеться далі, ми вже вписали свої імена в історію."
  circumnavigation_expedition_events.13.b: "Святкувати ще зарано. До домівки ще тисячі миль"
  circumnavigation_expedition_events.13.historical_info: "У травні 1522 року #italic «Вікторія»#! під орудою Хуана Себастьяна Елькано обігнула мис Доброї Надії, який був останньою значною перепоною на зворотному шляху до Іспанії. Португальці контролювали цей шлях і розташовані на ньому порти постачання, тому Елькано навмисно йшов далеко від берегів: за Тордесільяським договором статус Молуккських островів залишався спірним, і якби іспанський корабель, що йшов звідти, потрапив на очі суперникам, його б неодмінно захопили. На той час корабель уже дав течу й перебував у жалюгідному стані, а від початкових 270 людей команди лишилося тільки 18 виснажених моряків. Проте 6 вересня 1522 року вони дісталися Санлукар-де-Баррамеди, тим самим завершивши трохи менше ніж за три роки першу в історії навколосвітню мандрівку."
  circumnavigation_expedition_events.14.title: "Дружні береги"
  circumnavigation_expedition_events.14.desc: "Над островами, що постають перед нами, майорять #L [ROOT.GetCountry.GetAdjective|l]і#! стяги. Пробувши роки в незвіданих водах, ми нарешті дісталися дружніх берегів, де наш корабель підлатають, діжки наповнять свіжою водою, а виснажену команду як слід нагодують. Люди намісника сходять до причалу і з жахом дивляться на змарнілих та втомлених моряків, які розповідають про свою навколосвітню мандрівку.\n\nРідні води вже близько. [target_leader.GetName] лиш [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити, як довго ми тут відпочиватимемо перед останнім ривком додому."
  circumnavigation_expedition_events.14.a: "Приведемо корабель до ладу, нагодуємо команду й запасемося водою."
  circumnavigation_expedition_events.14.b: "Ми тут ненадовго. Команда зможе вволю відпочити вдома."
  circumnavigation_expedition_events.14.historical_info: "За життя Магеллана острови Кабо-Верде належали Португалії, тому іспанський флот не міг відкрито там зупинятися. Якби на той час іспанська корона володіла цими островами, вони стали б для виправи Магеллана найважливішим осередком постачання на шляху додому, де команда могла б полагодити корабель, запастися харчами й відпочити після щонайтяжчої мандрівки, якої доти не здійснював ніхто."
  circumnavigation_expedition_events.15.title: "Прорахунок"
  circumnavigation_expedition_events.15.desc: "Наш останній корабель буквально тріщить по швах, а команда потерпає від голоду. За іронією долі найближча гавань належить нашим недругам, але [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'вирішила', 'вирішив')] ризикнути й усе ж [Select_CString(target_leader.IsFemale, 'завела', 'завів')] корабель до гавані, збрехавши місцевим, що ми прибули з боку Америки, а не з закритих для нас східних островів. Однак коли наші моряки вирішили уточнити поточну дату, відповідь їх неприємно здивувала: у нашому вахтовому журналі бракувало цілого дня. Мабуть, під час мандрівки ми припустилися прорахунку, і тепер ця дрібна невідповідність загрожує нам викриттям.\n\nЛишається сподіватися, що ми встигнемо запастися харчами перш ніж наші вороги щось запідозрять."
  circumnavigation_expedition_events.15.a: "Триматимемося вигаданої оповідки, але поквапимося."
  circumnavigation_expedition_events.15.ruse_ok_tt: "Брехня спрацювала. Моряки закуповують припаси й відпливають раніше, ніж ворог устигає їх викрити"
  circumnavigation_expedition_events.15.ruse_failed_tt: "Втрачений день викликає у ворогів підозру, і частина команди потрапляє в полон"
  circumnavigation_expedition_events.15.b: "Якщо ми забаримося, нас викриють. Ліпше попливемо додому голодними."
  circumnavigation_expedition_events.15.historical_info: "У липні 1522 року іспанський корабель #italic «Вікторія»#! зупинився біля португальського острова Сантьягу, що належить до архіпелагу Кабо-Верде. Команда збрехала місцевим, що прибула з Америки, аби приховати своє плавання через підвладні Португалії тихоокеанські острови. Спочатку хитрість спрацювала, але невдовзі португальці помітили, що у вахтовому журналі «Вікторії» бракує одного дня: під час своєї навколосвітньої мандрівки іспанці не врахували лінію зміни дат, що проходить водами Тихого океану. Це відразу викликало підозри, через що португальці заарештували 13 членів команди, які зійшли на суходіл. Решта 18 моряків негайно відпливли й продовжили шлях назад до Іспанії."
  circumnavigation_expedition_events.16.title: "Стоянка на безлюдному острові"
  circumnavigation_expedition_events.16.desc: "Ми натрапили на безлюдні острови, які є лише обвітреними скелями з рідким чагарником. І все ж це суходіл, а серед тутешнього каміння навіть трапляються невеликі прісні водойми та струмки. Ба більше, на скелястих схилах можна зустріти здичавілих кіз, яких, певне, залишили моряки, що бували тут до нас. Годі й казати, що за однієї думки про свіже м’ясо в зголоднілої команди слинка тече.\n\nЗвісно, на поповнення запасів піде час, але на відміну від харчів, його в нас удосталь. Розуміючи це, [target_leader.GetName] наказує кинути якір."
  circumnavigation_expedition_events.16.a: "Вирядимо мисливців за дичиною й наповнимо діжки свіжою водою."
  circumnavigation_expedition_events.16.b: "Наберемо води й рушимо далі. Домівка вже неподалік."
  circumnavigation_expedition_events.16.historical_info: "Кораблі, що проходили повз, часто залишали на безлюдних островах Атлантики свиней та кіз, які поступово розмножувалися й збивалися у великі дикі отари. Завдяки цьому такі мертві клаптики суходолу перетворювалися на своєрідні стоянки постачання для наступних виправ, що могли задарма набрати тут м’яса та води на шляху додому."
  circumnavigation_expedition_events.17.title: "Жоден корабель не повернувся"
  circumnavigation_expedition_events.17.desc: "Пори року стрімко змінюють одна одну, а [capital_location.GetName] так і не отримує від флоту жодних звісток. Вочевидь, сподівань на повернення виправи вже немає. Десь за краєм відомого світу згинули наші кораблі й команди — чи то піддавшись нездоланній силі океану, чи то виснажившись настільки, що просто не знайшли в собі снаги повернутися додому. Від флоту, що вирушив у навколосвітню мандрівку, залишилися тільки імена загиблих.\n\nПроте одна невдача — ще не привід відмовлятися від мрії. Можливо, наступній виправі все ж вдасться завершити почате."
  circumnavigation_expedition_events.17.a: "Їхня жертва не буде забута."
  circumnavigation_expedition_events.17.end_tt: "Флот пропав, так і не завершивши своєї мандрівки"
  circumnavigation_expedition_events.17.historical_info: "У 1525 році мореплавець Ґарсія Хофре де Лоайса очолив нову виправу, яка мала пройти шляхом Магеллана і закріпити за Іспанією права на Молуккські острови. З 7 кораблів до островів дістався лише один пошарпаний корабель та купка вцілілих, які так і не змогли завершити подорож. У ті часи повна втрата флоту ні для кого не була несподіванкою: навколосвітні подорожі тривали не один рік, і моряки часто-густо навіть не мали змоги поповнити припаси на шляху до мети, тому багато хто з них зрештою гинув у безвісті на дні Тихого океану."
  circumnavigation_expedition_events.18.title: "Бунт"
  circumnavigation_expedition_events.18.desc: "Усе почалося з невдоволеного шепотіння на нічній варті. Згодом моряки під час розмов почали підозріло замовкати в присутності офіцерів, а дехто з капітанів почав цуратися командувача й уникати [target_leader.GetHerHis] погляду. Харчів лишилося обмаль, а команда виснажена й налякана: ці люди погодилися на подорож до Індій, а не до краю світу. Тепер їхнє невдоволення переросло у справжній бунт. Один із капітанів навідріз відмовився виконувати наказ, і частина команди підтримала його, вимагаючи розвернути флот і вирушити додому.\n\nЯкщо їх не заспокоїти, незабаром ця смута охопить і решту кораблів, тому [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] якомога швидше розв'язати цю проблему."
  circumnavigation_expedition_events.18.a: "Відпустити заколотників додому. Ми завершимо мандрівку без них."
  circumnavigation_expedition_events.18.b: "Силою придушити заколот і покарати його заводіїв."
  circumnavigation_expedition_events.18.fight_win_tt: "Заколот придушено, а його заводіїв покарано на науку іншим. Порядок відновлено, але флот втрачає дорогоцінний час"
  circumnavigation_expedition_events.18.fight_lose_tt: "Придушення заколоту переростає в різанину. Порядок відновлено, але флот втрачає час і один із кораблів"
  circumnavigation_expedition_events.18.c: "Нагадати заколотникам про славу й багатства, що чекають на нас за небокраєм."
  circumnavigation_expedition_events.18.rouse_tt: "[target_leader.GetName] обходить усі кораблі та звертається до команд із натхненною промовою. Моряки заспокоюються й підносяться духом"
  circumnavigation_expedition_events.19.title: "Наші береги"
  circumnavigation_expedition_events.19.desc: "Провівши тижні в безкраїх водах #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L Атлантики#!#!, ми нарешті помічаємо попереду зелені береги, над якими майорять стяги нашої країни. Заснована тут #L [ROOT.GetCountry.GetAdjective|l]а#! колонія негайно відкриває комори для королівських кораблів, задарма надаючи співвітчизникам свіжу воду, солонину, фрукти та деревину для лагодження.\n\n[target_leader.GetName] вирішує, як надовго флот затримається тут, перш ніж рушити далі на південь назустріч невідомому."
  circumnavigation_expedition_events.19.a: "Потрібно як слід перепочити й запастися харчами, поки є нагода."
  circumnavigation_expedition_events.19.b: "Погода не чекатиме. Побудемо тут трохи й вирушимо на південь."
  circumnavigation_expedition_events.19.historical_info: "Північно-східні землі Бразилії — Пернамбуку, Параїба та Ріу-Гранді — були серед перших іберійських колоній у Новому Світі. Тутешні береги рясніли фернамбуковими деревами й цукровою тростиною, яку сюди завезли європейці. Країна, що заволоділа цими гаванями, могла просто тут споряджати свої кораблі всім необхідним, перш ніж вони рушать далі до південних широт. Виправа Магеллана не мала такої змоги, оскільки на час його навколосвітньої подорожі бразильське узбережжя вже належало ворожій Португалії."
  circumnavigation_expedition_events.20.title: "Ворожий берег"
  circumnavigation_expedition_events.20.desc: "Провівши тижні в безкраїх водах #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L Атлантики#!#!, ми нарешті помічаємо попереду зелені береги, над якими майорять #L [rival_crown.GetAdjective|l]і#! стяги. Ці землі вже зайняті неприятелями, а тому наш флот не має права тут зупинятися. Проте сховища місцевої факторії вщерть заповнені харчами, і її робітники напевно поділяться з нами своїми запасами, якщо ми заплатимо. Коли наші моряки вже багато тижнів харчуються червивими сухарями, було б необачно проминути таку нагоду…\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити, чи варто заходити до ворожої гавані, чи ліпше без зупинки продовжити шлях на південь."
  circumnavigation_expedition_events.20.a: "Закупимо в [rival_crown.GetAdjectiveWithNoTooltip|l]их поселенців усе необхідне, дотримуючись обережності."
  circumnavigation_expedition_events.20.b: "Оминемо ворожу колонію стороною і попливемо далі на південь."
  circumnavigation_expedition_events.20.historical_info: "Згідно з Тордесільяським договором, узбережжя Бразилії потрапляло до португальської сфери впливу, тому формально флот під кастильським стягом не міг зупинятися в тутешніх гаванях. На практиці ж колоніальні факторії часто таємно торгували з іспанськими кораблями, які проходили повз, хоч такі зупинки й були вкрай ризикованими: у разі викриття португальці могли легко конфіскувати будь-який корабель, що не мав вагомих підстав перебувати в Бразилії."
  circumnavigation_expedition_events.21.title: "Спалах цинги"
  circumnavigation_expedition_events.21.desc: "Хвороба, від якої зазвичай потерпають моряки в далеких мандрах, не оминула й нас. У багатьох моряків чорніють і кровоточать ясна, їхні старі рубці розходяться, а зуби починають хитатися. Ті, хто ще місяць тому був здоровим і сповненим сил, сьогодні вже не можуть підвестися з ліжка. Корабельний лікар каже, що найкращий засіб проти цієї недуги — відпочинок і свіжі харчі, однак зараз моряки не можуть дозволити собі ані того, ані іншого.\n\n[target_leader.GetName] оглядає виснажену команду й роздумує, як ліпше вчинити."
  circumnavigation_expedition_events.21.a: "Роздамо хворим залишки свіжої їжі й сподіватимемося на краще."
  circumnavigation_expedition_events.21.b: "Відпочивати ніколи. Зараз кожен повинен працювати з останніх сил."
  circumnavigation_expedition_events.21.b.tt: "Виправа продовжує шлях, не зважаючи на хворих. Багато хто не доживе до кінця подорожі, і команді забракне робочих рук, щоб привести додому всі кораблі"
  circumnavigation_expedition_events.22.title: "Буря"
  circumnavigation_expedition_events.22.desc: "Небо затягують грозові хмари, і морські хвилі перетворюються на велетенські сірі гори, під гребенями яких умістилася б ціла дзвіниця. Вітер нещадно рве оснащення, а кораблі щосили хитає на всі боки, вони ледве тримаються на плаву. Палуби невпинно заливає водою, і стернові вже не бачать за стіною дощу сусідніх кораблів.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити, чи перечекати ураган, чи спробувати виплисти з нього за попутним вітром."
  circumnavigation_expedition_events.22.a: "Приберемо вітрила й перечекаємо бурю."
  circumnavigation_expedition_events.22.b: "Підемо за вітром і будемо сподіватися, що кораблі витримають."
  circumnavigation_expedition_events.22.b.win_tt: "Флот розпорошується, але все ж виходить з урагану й відбувається лише переляком"
  circumnavigation_expedition_events.22.b.lose_tt: "Ризик не виправдався. Буря розкидає кораблі врізнобіч, і один із них уже може не побачити світанку"
  circumnavigation_expedition_events.23.title: "Черви в корпусі"
  circumnavigation_expedition_events.23.desc: "У цих теплих водах шашіль прогризає обшивку швидше, ніж теслярі встигають її лагодити, через що корпус нашого корабля перетворюється на решето. Помпи працюють удень і вночі, але трюм однаково наповнюється водою. Без належного лагодження такий пошарпаний корпус просто не витримає подорожі через океан. Якщо по-хорошому, корабель слід кренувати, щоб очистити дно від паразитів і як слід підлатати.\n\n[target_leader.GetName] роздумує, як ліпше вчинити з ушкодженим кораблем."
  circumnavigation_expedition_events.23.a: "Зупинимося на якомусь березі й полагодимо корабель, як зможемо."
  circumnavigation_expedition_events.23.a.tt: "Команда кренгує корабель на безлюдному березі та лагодить його тими засобами, що є під рукою. Робота потребуватиме багато часу й зусиль, але зрештою корабель зможе протриматися на плаву трохи довше"
  circumnavigation_expedition_events.23.b: "Покиньмо напіврозвалений корабель, а його команду розмістімо на решті кораблів."
  circumnavigation_expedition_events.23.c: "Вирушимо до дружньої гавані. Там і полагодимо корабель."
  circumnavigation_expedition_events.23.c.tt: "Флот заходить до найближчої дружньої гавані, де команда може перепочити й провести належне лагодження корабля"
  circumnavigation_expedition_events.24.title: "Штиль"
  circumnavigation_expedition_events.24.desc: "Вітер сходить нанівець. Вітрила кволо звисають із щогл, і наші кораблі день у день лише нерухомо стоять на гладкому, наче дзеркало, морі, над яким тяжіє безжальне біле небо. Тим часом вода в бочках протухає, а запаси харчів потроху закінчуються. Моряків спершу охоплює зневіра, а потім і страх: що, як ми запливли на самий край світу, де більше ніколи не спіймаємо вітру?\n\nУ такій скруті [target_leader.GetName] може або чекати сприятливої погоди, або тягнути кораблі вперед за допомогою веслярських шлюпок."
  circumnavigation_expedition_events.24.a: "Ми стоятимемо й чекатимемо вітру стільки, скільки знадобиться."
  circumnavigation_expedition_events.24.b: "Спустимо шлюпки й буксируватимемо кораблі на веслах."
  circumnavigation_expedition_events.25.title: "Нестача команди"
  circumnavigation_expedition_events.25.desc: "Багато наших матросів загинуло або злягло від хвороб, і тепер нам просто бракує рук, щоб керувати всіма кораблями. Вихід лише один: зняти з одного з кораблів усе потрібне й покинути його, а команду пересадити на інші кораблі. Для флоту це буде відчутна втрата, але натомість ми зможемо належно укомплектувати решту кораблів."
  circumnavigation_expedition_events.25.a: "У нас немає іншого вибору. Покиньмо корабель і розділімо команду."
  circumnavigation_expedition_events.26.title: "Корабель зазнав лиха"
  circumnavigation_expedition_events.26.desc: "Коли буря врешті вщухає, флот знову збирається докупи й помічає, що одного корабля бракує. Чи він наразився на берег, чи пішов на дно в морській безодні, чи просто заблукав під час урагану — одному Богові відомо. Хай там як, він не повернувся, а отже, його команди вже майже напевно немає серед живих."
  circumnavigation_expedition_events.26.a: "Помолімося за загиблих і пливімо далі."
  circumnavigation_expedition_events.27.title: "Безлюдний берег"
  circumnavigation_expedition_events.27.desc: "Наші трюми вже майже спорожніли, коли раптом вартові угледіли збоку зелені береги. Не помітивши жодних човнів чи диму від багать, ми дійшли висновку, що ці острови безлюдні. На наше щастя, зі тутешніх скель стікають струмки прісної води, над мілиною кружляє морське птаство, а в лісі повно плодів, дичини та доброї деревини для наших кораблів.\n\nНа заготівлю харчів і матеріалів піде кілька днів, але зголодніла команда певна, що ця зупинка того варта. Зваживши всі «за» і «проти», [target_leader.GetName] віддає наказ…"
  circumnavigation_expedition_events.27.a: "Висадімося на берег. Наповнимо бочки, запасемося дровами, фруктами та дичиною."
  circumnavigation_expedition_events.27.b: "Ніколи добувати харчі. Рушаймо далі, нехай і на голодний шлунок."
  circumnavigation_expedition_events.28.title: "Торгівля із суходолом"
  circumnavigation_expedition_events.28.desc.christian: "Трюми порожніють, але неподалік на узбережжі видніється [trade_shore.GetRank.GetName] християн: над водою ледве долинає передзвін, а над гаванню височіє хрест. Жителі випливають на човнах придивитися до чужинців — обережно, але з цікавістю, а де віра спільна, там знайдеться і спільна мова для торгу. Збіжжя, солонину, фрукти та прісну воду тут можна виміняти на монети та крам.\n\nКілька днів на якорі — і трюми знову будуть повні. [target_leader.GetName] зважує втрату часу та запаси, що тануть."
  circumnavigation_expedition_events.28.desc.muslim: "Трюми порожніють, але неподалік на узбережжі видніється [trade_shore.GetRank.GetName] мусульман: над водою чути заклик до молитви, а вздовж берега витягнуті на пісок дау. Торговці випливають назустріч флоту — проникливі та безстрашні, адже ці люди торгували на всіх морях світу. Рис, фініки, солону рибу та прісну воду тут можна виміняти на дзвінку монету та підхожий крам.\n\nКілька днів на якорі — і трюми знову будуть повні. [target_leader.GetName] зважує втрату часу та запаси, що тануть."
  circumnavigation_expedition_events.28.desc.pagan: "Трюми порожніють, але неподалік на узбережжі є [trade_shore.GetRank.GetName], і місцеві жителі вшановують богів, чиїх імен не чули навіть корабельні капелани. Вони обережно підпливають на каное, пропонуючи коріння, фрукти, рибу та видовбані гарбузи з прісною водою, і з цікавістю розглядають залізо, тканину та дрібнички, які чужинці показують натомість. Спільної мови сторони не мають, але голоду й торгу мова не потрібна.\n\nКілька днів торгівлі — і трюми знову будуть повні. [target_leader.GetName] зважує втрату часу та запаси, що тануть."
  circumnavigation_expedition_events.28.a: "Зайдімо в гавань і виміняймо стільки харчів, скільки флот зможе взяти."
  circumnavigation_expedition_events.28.b: "Ніколи торгуватися. Рушаймо далі, нехай і на голодний шлунок."
  circumnavigation_expedition_events.provisioned_tt: "Флот повністю забезпечений харчами, і команди ліпше витримають майбутню переправу (#G +30#! до харчів)"
