  circumnavigation_expedition_events.supplies_up_5_tt: "Запаси харчів флоту поповнено (#G +5#! Харчі)"
  circumnavigation_expedition_events.1.desc: "П’ять кораблів. Двісті сімдесят людей. Річний запас харчів і шлях, яким не ходив ще жоден керманич. [target_leader.GetName] спокійно говорить про острови, багаті на гвоздику, та західний прохід до Островів прянощів. Доглядач гавані не вірить [target_leader.GetHerHim]. Керманичі вагаються. Але кораблі споряджені, вітер сприятливий, а грамота скріплена королівською печаткою.\n\nПопереду лежить усе те, чого ще немає на жодній мапі."
  circumnavigation_expedition_events.3.desc: "Після тижнів у відкритому #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L Атлантичному океані#!#! на західному обрії вимальовується низька зелена смуга — узбережжя Нового Світу. У лісі кричать папуги, а з сотні річок тече прісна вода. Від берега відчалюють човни, їхні веслярі, сповнені цікавости й безстрашні, пропонують деревину, воду та дивовижні плоди. Тут є все, чого тільки міг забажати втомлений флот — але пора року змінюється, а протока на південь досі не знайдена.\n\n[target_leader.GetName] зважує затишок берега проти миль, які ще належить подолати."
  circumnavigation_expedition_events.4.desc: "Флот заходить у бухту, настільки простору й захищену, що вона здається справжнім дарунком — оточена зеленими горами, з водами, що срібляться від риби. Місцевий люд сходиться юрбами, обмінюючи птицю, плоди та рибу на рибальські гачки й ножі, пропонуючи більше, ніж здатні вмістити трюми. Після довгої подорожі через води Атлантики це справжній рай, і люди з радістю ніколи б звідси не попливли.\n\nАле рай — поганий поводир у мандрах. [target_leader.GetName] має вирішити, як довго флот може зволікати."
  circumnavigation_expedition_events.5.desc: "Керманичі знали, що протока має бути. Жоден материк не міг тягнутися нескінченно. Але велетенський лиман настільки широкий, що з верхівки щогли не видно далекого берега, а вода, хоч і солонувата, несе бурий намул на сорок ліг у море. Човни відправляють угору гирлом річки на два тижні.\n\nВони повертаються зі звістками про сомів, мілину та відсутність виходу до будь-якого океану. Десь далі на південь чекає справжня протока — якщо вона взагалі існує."
  circumnavigation_expedition_events.6.desc: "Протока холодна, вузька й смертоносна. Стіни чорних скель стрімко здіймаються по обидва боки, а протока кружляє так, що керманичі вже не можуть сказати, де захід. Справжній ворог — вітер: він зривається зі снігових полів і змінює напрямок без попередження, завиваючи в такелажі раптовими шквалами, які відкидають кораблі назад і притискають їх на цілі дні до скель.\n\n[target_leader.GetName] мовчки стоїть на носі флагмана, коли скелі стискаються довкола. Керманичі кажуть, що протока прохідна. Люди не впевнені, чи керманичі при своєму розумі. Десь попереду, якщо вірити мапам, лежить океан настільки безкраїй, що він ще навіть не має назви."
  circumnavigation_expedition_events.7.desc: "Останній чорний мис протоки лишається за кормою, і перед флотом відкривається безкраїй океан. [target_leader.GetName] називає його #italic Mar Pacífico#! за його спокій — спокій, що обернеться прокляттям. Минають тижні за тижнями, та жодного острова не видно. Вода в бочках жовтіє і смердить; сухарі перетворилися на порох із довгоносиками; люди гризуть волові шкури, розмочені за бортом, і платять пів дуката за щура.\n\nКерманичі не можуть сказати, наскільки широке це море, бо ніхто ще його не перетинав. Хоч би яке рішення ухвалить [target_leader.GetName], дехто з тих, хто вирушив у путь, не доживе до далекого берега."
  circumnavigation_expedition_events.8.desc: "Уже понад шістдесят днів флот не бачить нічого, крім води. І ось вигук з верхівки щогли: земля! Надія полум’ям охоплює кораблі — доки човни не підпливають ближче. «Земля» виявляється низьким кільцем коралів і пальм, оббитих прибоєм, де немає дна, щоб кинути якір, і жодного сліду прісної води. Вгорі кружляють птахи; на деревах немає нічого, що могла б з’їсти зголодніла людина.\n\nОстрів дарує лише жорстоку надію. [target_leader.GetName] має вирішити, чи затриматися й шукати далі, чи рухатися вперед."
  circumnavigation_expedition_events.10.desc: "На самій межі виснаження вартові помічають зелені гори — нарешті справжня земля з водою, плодами та рибою. Назустріч флоту виринає безліч каное з балансирами, їхні мореплавці прудкі й безстрашні, підіймаються на борт і забирають усе, що не прив’язано. Для них річ без нагляду — це річ, яку можна вільно взяти; для виснажених голодом екіпажів це грабунок.\n\nЦі острови можуть урятувати виправу, якщо [target_leader.GetName] зуміє здобути з них припаси."
  circumnavigation_expedition_events.12.desc: "Молуккські острови. Точка на кожній мапі, якої жоден іберійський корабель ще не досягав із заходу. Запах долинає до кораблів ще до того, як з’являються острови — гвоздика, густа й темна, її пахощі несе той самий вітер, що гнав їх через два океани.\n\n[target_leader.GetName] стоїть на палубі, слухаючи, як керманичі вигукують глибину, і довго мовчить. Трюми майже порожні. Екіпаж — лише тінь колишнього. Але вони тут, і човни султана вже пливуть їм назустріч."
  circumnavigation_expedition_events.14.desc: "На островах попереду майорять стяги #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Після років блукань за межами будь-яких мап флот нарешті пристав до дружнього берега — у гавані, де можна проконопатити кораблі, наповнити бочки й нагодувати поріділий екіпаж без страху та обману. Люди намісника спускаються на набережну, роззявивши роти на виснажених обідранців, які запевняють, що обійшли весь світ.\n\nРідні води вже близько. [target_leader.GetName] має лише вирішити, скільки часу відпочивати."
  circumnavigation_expedition_events.15.desc: "Останній корабель протікає по всіх швах, а екіпаж потерпає від голоду, втім, єдина досяжна гавань майорить кольорами суперницької корони. [target_leader.GetName] наказує завести корабель під вигаданим приводом — нібито вони повертаються додому з Америки, а не із забороненого сходу. Але коли люди на березі запитують, який сьогодні день, відповідь розходиться на один: десь під час навколосвітньої подорожі флот утратив день у своїх розрахунках, і ця розбіжність може викрити все.\n\nПрипаси поруч, якщо обман не розкриється."
  circumnavigation_expedition_events.16.desc: "Острови безлюдні — сухі, обдуті вітрами купи скель та чагарників, — але це суходіл, із захищеною бухтою та джерелами серед каміння. Ба більше, схилами бігають здичавілі кози, залишені якимось попереднім кораблем, і в моряків слина котиться від думки про свіже м’ясо після стількох днів харчування гниллю та довгоносиками.\n\nСтоянка на якорі вартує лише часу, а час — це єдине, чим може поступитися корабель, що прямує додому. [target_leader.GetName] віддає наказ."
  circumnavigation_expedition_events.19.desc: "Після тижнів у відкритому #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L Атлантичному океані#!#! на західному обрії вимальовується низька зелена смуга — і знамена над невеликим портовим містечком наші власні. Поселення #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, засноване на цьому далекому березі, гостинно відчиняє свої комори для кораблів корони. Прісна вода, плоди, солонина та ліс для полагодження — усе це доступно задарма серед співвітчизників.\n\n[target_leader.GetName] може завантажити все, що здатний умістити флот, перш ніж рушити на південь у невідомість."
  circumnavigation_expedition_events.20.desc: "Після тижнів у відкритому #TOOLTIP:CONTINENT,atlantic_ocean_continent,X #L Атлантичному океані#!#! на західному обрії вимальовується низька зелена смуга — але знамена над гаванню належать #ONCLICK:COUNTRY,[rival_crown.GetKey] #TOOLTIP:COUNTRY,[rival_crown.GetKey],X [rival_crown.Custom('CL_DAT')|L]#!#!. Їхня колонія тримає цей берег, і флот на нашій службі не має законного права на її причали. Втім, комори повні, прикажчики охоче торгують за дзвінку монету, а люди зголодніли за будь-чим, крім сухарів із довгоносиками.\n\n[target_leader.GetName] має вирішити, чи заходити під гармати суперника, чи тримати курс на південь."
  circumnavigation_expedition_events.23.desc: "У цих теплих водах черв’як-шашень точить обшивку швидше, ніж тесля встигає її латати, доки дерево не стане схожим на бджолині стільники. Помпи працюють цілодобово, але вода в трюмі все одно прибуває. Настільки пошкодженому корпусу не можна довірити перехід через океан без належного кренування — витягування корабля на мілину, випалювання наростів з його днища та нового смоління швів.\n\n[target_leader.GetName] має вирішити, як утримати флот на плаву."
  circumnavigation_expedition_events.24.desc: "Вітер ущухає до повного штилю. Вітрила безсило виснуть уздовж щогл, море лежить рівне й дзеркальне під білим нещадним небом, а кораблі день за днем стоять непорушно, поки вода в бочках псується, а харчі вичерпуються. Люди похмурніють, а згодом лякаються, бурмочучи, що флот заплив за край усіх вітрів світу і більше ніколи їх не відчує.\n\n[target_leader.GetName] може лише чекати — або посадити людей на весла в шлюпках."
  circumnavigation_expedition_events.27.desc: "Трюми порожніють, але на траверзі видніється низький зелений берег — безлюдний, наскільки можуть розгледіти вартові, без диму багать і без жодного човна. Зі скель десятком струмків збігає прісна вода, на мілководді юрмиться дичина, а ліси обіцяють плоди, деревину та здобич будь-якому загону, що зійде на берег.\n\nЗбір усього необхідного коштуватиме флоту днів, якими він навряд чи може розкидатися, але порожні шлунки коштують іще дорожче. [target_leader.GetName] віддає наказ."