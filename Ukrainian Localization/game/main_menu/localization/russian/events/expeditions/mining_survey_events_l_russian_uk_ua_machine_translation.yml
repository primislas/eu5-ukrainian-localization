l_russian:
  mining_survey_events.1.title: "Комісія рудознавців"
  mining_survey_events.1.desc: "На подвір’ї напоготові стоїть загін рудознавців: в’ючні мули навантажені кайлами, бурами та просмоленою дерев’яною скринею, де лежать тиглі, ваги та кислоти пробірника. Цілий рік вони ходитимуть нашим нагір’ям, перевіряючи річища струмків на розсипне золото, обстукуючи молотками кварцові жили та розпитуючи пастухів, у яких долинах у лотку з’являються золоті крупинки. Ці пагорби й раніше віддавали свої багатства, часто народам, про які ми зовсім забули. Немає підстав думати, що в них нічого не лишилося."
  mining_survey_events.1.a: "Не пошкодуємо коштів. Відрядимо досвідчених пробірників по зразки золота."
  mining_survey_events.1.b: "Достатньо скромної платні. Старійшини нададуть провідників і прихисток."
  mining_survey_events.1.historical_info: "У Середні віки та в ранній Новий час активно велася розвідка рудних покладів Європи. Найширше ця діяльність розгорнулася в Рудних горах Саксонії та Богемії, де відкриття покладів срібла в XII столітті спричинило бурхливе зростання таких міст, як Фрайберг, Яхимов і Шнеберг. У 1556 році вийшла друком праця Георга Агріколи #italic «Про гірничу справу та металургію»#!, де було докладно описано способи лозоходства та випробування руди, а також наведено правові звичаї щодо прав на рудоносні ділянки. Ця праця майже 200 років слугувала одним із головних посібників із видобутку й обробки металів."
  mining_survey_events.10.title: "Пласт залізної руди"
  mining_survey_events.10.desc: "Рудознавці натрапили на пласт добірного заліза. Він сягає вглиб гори, а порода там, де її оголили кайла, помережана чорним і рудим. Староста найближчого села розповідає, що його дід згадував про старі виробки десь вище схилом: можливо, нові копальні знову відмикають те, що колись було втрачено. Якщо знахідка не підведе, кузні та ливарні в низинах будуть забезпечені роботою на ціле покоління."
  mining_survey_events.10.a: "Оголосимо про знахідку. Хай [ROOT.GetCountry.GetFlavorRank] дізна[ROOT.GetCountry.Custom('endrank_etsautsa')]ся, що ми маємо."
  mining_survey_events.10.b: "Вестимемо розробку таємно. Ливарням суперників поки що ні до чого знати про знахідку."
  mining_survey_events.10.historical_info: "Видобуток заліза в доіндустріальній Європі тримався на невеликих відкритих розробках і неглибоких копальнях, що йшли слідом за виходом руди на поверхню, а сиродутні печі перетворювали руду на коване залізо неподалік від рудні. Доменна піч, що з’явилася в пізньому Середньовіччі, дала змогу отримувати чавун у значно більших обсягах і стала джерелом процвітання найбільших залізорудних країв: Швеції, Штирії та Країни Басків."
  mining_survey_events.11.title: "Мідна жила"
  mining_survey_events.11.desc: "Рудознавці піднялися схилом пагорба слідом за прожилкою породи, що позеленіла від оксидів, і знайшли її витік: мідну жилу, яка протинає скелю, відкриту всім вітрам, і тільки й чекає на розкриття. Пробірник розколює зразок на похідному ковадлі, кидає його в тигель і сповіщає, що метал чистий і дає добрий вихід. З південних міст уже кличуть плавильників."
  mining_survey_events.11.a: "Вестимемо розробку відкрито. Хай [ROOT.GetCountry.GetFlavorRank] дізна[ROOT.GetCountry.Custom('endrank_yetsayutsa')] про нашу мідь."
  mining_survey_events.11.b: "Вестимемо розробку таємно. Ливарники латуні заплатять більше, поки чутки не розійшлися."
  mining_survey_events.11.historical_info: "У доіндустріальній Європі видобуток міді зосереджувався в кількох славетних округах: Фалуні у Швеції, на схилах Рудних гір, у краї Мансфельд у Саксонії та в Тірольських Альпах. Метал був потрібен для бронзових гармат, обшивки кораблів і латунних виробів, а багата мідна рудня могла збагатити як корону, якій належала, так і купецькі доми, що фінансували її розробку. Банкірський рід Фуггерів завдячував своєму успіху почасти контролю над тірольською міддю."
  mining_survey_events.12.title: "Олов’яна жила в пагорбах"
  mining_survey_events.12.desc: "Рудознавці піднялися схилом уздовж річища струмка, орієнтуючись за темною галькою каситериту, і знайшли жилу там, де вона виходить на поверхню: рудоносна порода з оловом тягнеться товстою чистою смугою вздовж кварцової жили. Біля підніжжя пагорба гірники вже споруджують штольні з дерев’яним кріпленням і товкарню. Ливарники бронзи, олов’яники та майстри посуду на ціле покоління будуть забезпечені сировиною."
  mining_survey_events.12.a: "Оголосимо про знахідку. Нова олов’яна жила — справа державної ваги."
  mining_survey_events.12.b: "Збережемо це в таємниці. Захопимо ринок бронзи раніше за суперників."
  mining_survey_events.12.historical_info: "У доіндустріальному світі олово було стратегічно важливим металом: воно було потрібне як для бронзових гармат, так і для вживаного олов’яного посуду. Його запаси зосереджувалися в небагатьох відомих краях: Корнволлі, Рудних горах та деяких землях Богемії. Корнвольські олов’яні рудні із Середньовіччя мали особливий правовий статус, власні суди й збори, а корнвольська торгівля оловом живила виробництво бронзи та латуні по всій атлантичній Європі."
  mining_survey_events.13.title: "Галеніт у вапняку"
  mining_survey_events.13.desc: "У горбистому краї розкрито пласт галеніту: його темні кристали помережані сріблястими виблисками, що обіцяють корисний супутній видобуток під час плавки. #TOOLTIP:GOODS,lead,X #L Свинець#!#! із цього пласта піде на покрівлі церков, труби та виливання шроту, а добуте #TOOLTIP:GOODS,silver,X #L срібло#!#! допоможе покрити витрати на розробку. Десятник доповідає, що вибій чистий, а новою штольнею йде рівна тяга повітря."
  mining_survey_events.13.a: "Зробимо знахідку надбанням загалу. Свинець — справа суспільної ваги."
  mining_survey_events.13.b: "Потай укладемо угоди з порохівнями та друкарнями."
  mining_survey_events.13.historical_info: "У доіндустріальній Європі свинець і срібло майже завжди добували разом: із галеніту отримували обидва метали шляхом купелювання — процесу, винайденого ще в давнину, який удосконалювався впродовж усього Середньовіччя. Пагорби Мендіп в Англії, гори Гарц у Саксонії та Сьєрра-Морена в Іспанії були важливими осередками видобутку свинцю та срібла, і добутий там свинець ішов на все: від покрівель соборів до друкарського шрифту та труб міського водогону."
  mining_survey_events.14.title: "Срібло в камені"
  mining_survey_events.14.desc: "Рудознавці знайшли велику жилу самородного срібла, добувати яке простіше простого — лишень кайлом махай. Тиглі пробірника ще гарячі після пробних плавлень. Копальня закріплена колодами, і рипливий коловорот уже підіймає на поверхню перші вози руди. Монетний двір буде забезпечений зливками на ціле покоління, і вже цього року про знахідку заговорять двори всієї #TOOLTIP:CONTINENT,europe,X #L Європи#!#!."
  mining_survey_events.14.a: "Нехай [ROOT.GetCountry.GetFlavorRank] дізна[ROOT.GetCountry.Custom('endrank_etsautsa')] про це. Срібний рудник — це тріумф."
  mining_survey_events.14.b: "Збережімо це в таємниці. Чужі погляди на наше срібло добра не принесуть."
  mining_survey_events.14.historical_info: "Видобуток срібла перетворив європейські господарства за пізнього Середньовіччя та раннього Нового часу. Відкриття великих срібних жил у Шваці в Тіролі та в Яхимові в Богемії наприкінці 1400-х років, а згодом знахідка в Потосі в Андах у 1545 році затопили Європу зливками і спричинили велику інфляцію XVI століття. Прибутковий срібний рудник був стратегічним надбанням рівня флоту чи фортеці."
  mining_survey_events.15.title: "Жовтий метал"
  mining_survey_events.15.desc: "Рудознавці натрапили на багате родовище #TOOLTIP:GOODS,goods_gold,X #L золота#!#! у кварцовій жилі — вкраплення коштовного металу в кристалах кварцу оголилися на скелі там, де зимовий обвал зніс ґрунтовий покрив. На світлі метал яскраво виблискує: його ніхто не торкався відтоді, як утворилася порода. Сільський староста пропонує: нехай [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] оренду[ROOT.GetCountry.Custom('crown_yeyut')] поклади за справедливу, на його думку, частку. Пробірник радить погодитися, але на певних умовах."
  mining_survey_events.15.a: "Оголосімо про знахідку. Нехай про неї дізнаються й наші вороги."
  mining_survey_events.15.b: "Працюватимемо тихо. Золото вабить непроханих гостей."
  mining_survey_events.15.historical_info: "Родовища самородного золота в доіндустріальній Європі були рідкістю і швидко вичерпалися. Середньовічні золоті рудники Кремниці у Словаччині та Вранчі у Волощині були значними місцевими джерелами, але більша частина європейського золота надходила з розсипів у таких річках, як Рейн і Тахо, або з очищення срібної фракції свинцево-срібних руд. Знахідка самородного золота в більш-менш помітній кількості ставала винятковою вдачею, і корона завжди поспішала заявити на неї свої права."
  mining_survey_events.16.title: "Чорний камінь горить палко"
  mining_survey_events.16.desc: "У тутешніх пагорбах залягає товстий пласт вугілля, що виходить на поверхню у двох місцях, тож розробляти його буде легше. Пласт легко простежити, а #TOOLTIP:GOODS,coal,X #L вугілля#!#! горить чисто. Місцеві ковалі вже почали замінювати ним дрова для гонів. Кузні, солеварні та гути відтепер надовго забезпечені цінним паливом, і нам не доведеться вирубувати більше лісу."
  mining_survey_events.16.a: "Почнімо розробку за #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]им#! дозволом. Нехай [ROOT.GetCountry.GetFlavorRank] дізна[ROOT.GetCountry.Custom('endrank_yetsayutsa')] про це."
  mining_survey_events.16.b: "Здаймо виробітки в оренду майстрам залізних справ за гідну частку."
  mining_survey_events.16.historical_info: "Видобуток вугілля в Європі вівся в невеликих обсягах із часів Середньовіччя, переважно в Уельсі, у вугільному родовищі Ньюкасла та в околицях Льєжа, проте справжнього розмаху він набув під час паливної скрути раннього Нового часу, коли ліси вирубували під ріллю. У XVII столітті «морське вугілля» з Ньюкасла відправляли до Лондона тисячами тонн, і без нього залізоробні промисли не витримали б нестачі деревного вугілля."
  mining_survey_events.17.title: "Добрий будівельний камінь"
  mining_survey_events.17.desc: "У пагорбах відкрилася нова каменоломня; добуваний у ній #TOOLTIP:GOODS,stone,X камінь#! легко обтісується і міцно тримається в муруванні. Головного муляра привезли з будівництва собору оглянути пробний блок, і він визнав його придатним для облицювання, тонкого різьблення та тримальних конструкцій. Усі собори та куртини на сотню миль довкола будуть забезпечені каменем на ціле покоління вперед."
  mining_survey_events.17.a: "Візьмімо виробітки під #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]ий#! нагляд. Камінь — стратегічна сировина."
  mining_survey_events.17.b: "Здаймо кар’єр в оренду спілці мулярів за сталу плату."
  mining_survey_events.17.historical_info: "Будівельний камінь у доіндустріальній Європі був цінним, проте важким для перевезення крамом, оскільки головну частку його вартості складали витрати на перевезення. Багатий кар’єр у межах одного дня шляху від великого міста чи будівельного майданчика ставав довговічним надбанням, а під час зведення величних середньовічних соборів у Реймсі, Солсбері та Кельні впродовж кількох поколінь використовували окремі кар’єри, що забезпечували потреби цих споруд."
  mining_survey_events.18.title: "Мармур у лощині"
  mining_survey_events.18.desc: "У затишній лощині знайдено прожилки #TOOLTIP:GOODS,marble,X #L мармуру#!#! найвищої якости, і головний муляр витесав пробний блок, який удалося відполірувати до глибокого напівпрозорого сяйва. Місцеві скульптори вже клопочуть про переважне право купівлі всього видобутку. Майстерні аж до самої столиці ціле покоління братимуть камінь із цього кар’єру, а різьбярі вівтарів та надгробків можуть уважати себе щасливцями."
  mining_survey_events.18.a: "Оголосімо про це. Великий мармуровий кар’єр — надбання країни."
  mining_survey_events.18.b: "Тихо збережімо мармур для #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]их#! потреб."
  mining_survey_events.18.historical_info: "Мармур для витончених скульптур та архітектури в Європі за доби Середньовіччя та Відродження видобували в кількох славетних кар’єрах: у Каррарі в Тоскані, на Паросі та Пентеліконі в Греції та в Сен-Беа в Піренеях. Відкриття нового пласта статуарного мармуру ставало подією для митців: вони замовляли зразки й особисто вирушали оглянути багатообіцяльну знахідку."
  mining_survey_events.19.title: "Камені, що ловлять світло"
  mining_survey_events.19.desc: "Рудознавці знайшли в річищі струмка гравій, що містить #TOOLTIP:GOODS,gems,X #L дорогоцінні камені#!#!, і простежили його до багатшого родовища вище схилом, де порода становить пегматит, пронизаний кристалами. Представник огранників, викликаний зі столиці, сортує купу необроблених каменів за кольором і чистотою та повідомляє, що частка придатного до огранювання каменю надзвичайно велика. Придворні золотарі ціле покоління не знатимуть браку каміння."
  mining_survey_events.19.a: "Оголосімо про знахідку. Копальня дорогоцінних каменів — диво, яким не гріх похвалитися."
  mining_survey_events.19.b: "Тихо приберемо коштовне каміння для #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]ої#! скарбниці."
  mining_survey_events.19.historical_info: "Видобуток коштовного каміння в Європі був справою скромною порівняно з величними індійськими та бірманськими копальнями, проте місцеві поклади гранату, берилу, аметисту й топазу розроблялися в Богемському нагір’ї, шотландських горах Кернґорм та деяких частинах Піренеїв. Гранувальні майстерні Ідар-Оберштайна в Рейнській області стали осередком обробки місцевого каміння, і багата знахідка могла забезпечити їхніх майстрів роботою на довгі роки."
  mining_survey_events.20.title: "Кіновар на пагорбах"
  mining_survey_events.20.desc: "У нагір’ях виявили поклади кіновару — цю яскраво-червону #TOOLTIP:GOODS,mercury,X #L ртутну#!#! руду ні з чим не сплутати. Реторту й конденсатор установлюють на безпечній відстані від копалень. Алхіміки, пробірники та золотарі тепер на покоління наперед забезпечені безцінним для свого ремесла рідким металом, а майстри, що очищають срібло в Новому Світі, можливо, заплатять будь-які гроші, аби лише отримати нашу ртуть для своїх монетних дворів."
  mining_survey_events.20.a: "Розроблятимемо рудник відкрито. Ртуть — стратегічний товар."
  mining_survey_events.20.b: "Розроблятимемо тихцем. Монополія на ртуть — добра підмога."
  mining_survey_events.20.historical_info: "Ртуть — єдиний метал, що лишається рідким за кімнатної температури, — була конче потрібна для амальгамації, процесу, що в XVI столітті став панівним під час очищення американського срібла. Рудник Альмаден у Кастилії та Ідрія в Крайні були двома головними європейськими джерелами, й іспанська корона тримала альмаденські копальні як сувору королівську монополію, відправляючи ртуть до Мексики та Перу на галеонах під охороною військових кораблів."
  mining_survey_events.21.title: "Солоне джерело"
  mining_survey_events.21.desc: "У нагір’ях виявили великі поклади кам’яної солі — їх знайшли за солонуватою водою струмків, на дні яких соляні пласти виходили на поверхню. Солевари вже взялися до справи, а місцеві землероби женуть худобу на водопій до солоних джерел. Це чудова новина для кухарів та торговців солониною, а податок габель, якщо ми вирішимо його запровадити, покриє лише з цієї знахідки річні побутові видатки #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого#! двору."
  mining_survey_events.21.a: "Розгорнемо соляний промисел за #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]им#! дозволом."
  mining_survey_events.21.b: "Здамо промисел в оренду торговцям сіллю за сталу частку."
  mining_survey_events.21.historical_info: "Сіль була стратегічним товаром у доіндустріальній Європі: вона була незамінною для збереження їжі та слугувала важливим джерелом державних прибутків завдяки різноманітним соляним податкам і монополіям, найвідомішим з яких був французький габель. Великі соляні копальні Велички в Польщі, Гальштата в Австрії та Кардони в Каталонії розроблялися століттями і стали джерелом багатства родин та корон, яким належали."
  mining_survey_events.22.title: "Знайдено галунові сланці"
  mining_survey_events.22.desc: "У горбистій місцевості рудознавці виявили пласти #TOOLTIP:GOODS,alum,X #L галунових#!#! сланців. Камінь давно вивітрився, і лишилася чиста сіль, за яку фарбарі готові будуть віддати будь-які гроші. Пробна реторта дала з перших зразків чистий білий галун, і представники торговців тканиною вже довідуються про довгострокові угоди. Торгівля тканинами давно чекала на джерело, ближче до дому, ніж папська монополія в Тольфі."
  mining_survey_events.22.a: "Оголосимо про знахідку. Галун — тріумф ремесла [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  mining_survey_events.22.b: "Вестимемо розробку потайки. Папській монополії на галун знати про це нема чого."
  mining_survey_events.22.historical_info: "Галун — незамінна протрава для закріплення барвників на тканині — протягом Середньовіччя та раннього Нового часу залишався стратегічним товаром ткацьких промислів. Відкриття великих родовищ галуну в Тольфі в Папській державі у 1462 році породило папську монополію, яка протрималася понад століття, доки не були освоєні інші джерела в Англії, Швеції та Нідерландах. Будь-яка країна, здатна забезпечити себе власним галуном, позбавляла свої ткацькі промисли принизливої залежності від чужинців."
  mining_survey_events.23.title: "Селітра в долині"
  mining_survey_events.23.desc: "У малопомітній долині після весняної повені рудознавці виявили на камінні характерні білі кристали селітри, цілий пласт якої залягав неглибоко під землею. Пороховий майстер, покликаний з арсеналу, оглядає сиру селітру і визнає її придатною для переробки на порох найвищої якості. Тепер [ROOT.GetCountry.GetFlavorRank] ще довго не знатиме браку пороху, а гарматний парк нарешті зможе відповідати задумам."
  mining_survey_events.23.a: "Почнемо розробку під #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]ою#! монополією. Селітра — це війна."
  mining_survey_events.23.b: "Нехай торговці порохом ведуть розробку в обмін на першочергове право на видобуте."
  mining_survey_events.23.historical_info: "Селітру, головний складник пороху, в доіндустріальній Європі добували з укритих від дощу ґрунтів, які тривалий час удобрювали гноєм і послідом, або ж привозили з величезними витратами з Індії та Леванту. Державний нагляд за виробництвом селітри був питанням стратегічної ваги: в Англії діяла система селітроварів, які мали законне право копати під стайнями та голуб’ятниками, а у Франції аж до XIX століття діяла #italic Régie des Poudres#! — королівська монополія."
  mining_survey_events.30.title: "Обвал у розвідувальному шурфі"
  mining_survey_events.30.desc: "Лихо на розвідувальній ділянці, де шукають #TOOLTIP:GOODS,iron,X #L залізо#!#!. Розвідувальний шурф завалився вночі: кріплення вирвало повільним осіданням пухкого сланцю над рудним пластом. Двоє рудознавців поховані під завалом; ще одного, учня пробірника, витягли зі зламаною ногою та твердим наміром ніколи більше не спускатися до копальні. Десятник каже, що залізо там є, але щоб дістатися до нього, доведеться пробивати нову штольню в твердішій породі, а це обійдеться недешево."
  mining_survey_events.30.a: "Відкличемо гірників. Є земля, заради якої не варто ховати людей."
  mining_survey_events.30.historical_info: "Обвали покрівлі та стовбурів копалень були хронічною фаховою небезпекою гірничих робіт доіндустріальної доби. Дерев’яне кріплення виробок гнило у вологому ґрунті; пухкі шари над рудним пластом осідали без попередження; а звичний камерно-стовповий спосіб видобутку в міру виймання руди залишав дедалі більше незакріплених порожнин. Гірничі каплиці, похоронні братства та скарбниці допомоги вдовам гірників були невіддільною частиною кожного гірничого округу Європи."
  mining_survey_events.31.title: "Отруйний дим із виробок"
  mining_survey_events.31.desc: "Руда, знайдена на розвідувальній ділянці, де шукають #TOOLTIP:GOODS,copper,X #L мідь#!#!, виявилася несподіваної якості. Перша випалювальна купа, складена, щоб випалити сульфіди перед плавленням, виділяє їдкий жовтий дим, який зігнав робітників зі схилу і губить траву на пів милі за вітром. Місцеві землероби заявили про кривду. Металург каже, що може збудувати справжні випалювальні печі, аби стримувати випари, але це коштуватиме грошей і часу, на які ми не розраховували."
  mining_survey_events.31.a: "Припинимо розвідку. Місцеві мають рацію щодо повітря."
  mining_survey_events.31.historical_info: "Виплавлення міді із сульфідних руд викидало велику кількість сірчистого газу, який губив посіви, худобу та легені людей у всій прилеглій сільській місцевості. Мідний округ Фалуна у Швеції мав лиху славу через свій дим, від якого, за чутками, навколишні поля на багато миль перетворювалися на безплідну землю, а велична мідноплавильна долина Нижнього Гарца була не менш руйнівною. Цивільні позови проти гірничих підприємств за шкоду від диму були звичною справою ще із Середньовіччя."
  mining_survey_events.32.title: "Збідніле русло"
  mining_survey_events.32.desc: "Розвідувальна ділянка, де шукають #TOOLTIP:GOODS,tin,X #L олово#!#!, спочатку обнадіювала: розсипний каситерит у значній кількості вимивали з русла цілими возами. Але джерело розсипу не знайдено, а русла тепер начисто очищені від важкої руди. Шурфи, пробиті в схилах пагорбів вище за виробки, натрапляли лише на пусту породу. Загін вичерпав усі очевидні місця для розкопок, а витрати на глибші копальні без жодних свідчень важко виправдати."
  mining_survey_events.32.a: "Припинимо розвідку. Розсип був лише недовгою вдачею."
  mining_survey_events.32.historical_info: "Промивання олов’яних розсипів — розробка олововмісної гальки в річищах струмків і річок — було споконвічним способом видобутку олова в Корнволлі й зберігалося аж до Нового часу. Коли легкі розсипи вичерпувалися, гірникам доводилося йти за слідом розсипу до його джерела, впорядковано обстежуючи навколишні пагорби. Багато обнадійливих струмків приводили лише до тонкої вкрапленої жили, яка не виправдовувала витрат на підземні роботи."
  mining_survey_events.33.title: "Робітники нездужають"
  mining_survey_events.33.desc: "Розвідувальна ділянка, де шукають #TOOLTIP:GOODS,lead,X #L свинець#!#!, дає руду. Робітники — нарікання. У тих, хто виходить зі зміни, сіруваті ясна, набряклі суглоби та сильна млявість, яку лікар табору називає свинцевою колікою. Двоє померли; ще четверо надто хворі, щоби спускатися в копальню. Десятник каже, що роботи можна продовжувати, якщо найняти заміну й змиритися з втратами, але староста села ставить неприємні запитання про те, хто буде наступним."
  mining_survey_events.33.a: "Закриємо ділянку. Ми прийшли сюди не для того, щоб ховати вільних людей [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  mining_survey_events.33.historical_info: "Свинцеве отруєння — #italic colica plumbica#! пращурів — було добре відомою фаховою недугою свинцевих рудокопів, плавильників, склярів і гончарів. Трактат Бернардіно Рамацціні #italic De morbis artificum diatriba#! («Роздуми про хвороби ремісників», 1700), засаднича праця з професійної медицини, присвятив цій недузі великий розділ. Звичні засоби — пускання крови, проносні ліки та молочна дієта — були марними, а єдиним справжнім заходом безпеки було обмеження контакту, до чого у власників рудників майже не було господарських спонук."
  mining_survey_events.34.title: "Жила виклинюється"
  mining_survey_events.34.desc: "#TOOLTIP:GOODS,silver,X #L Срібна#!#! жила була широкою там, де рудошукачі вперше її розкрили, і перші підводи показали під час проби понад тридцять марок срібла на центнер. Потім, за десять ярдів униз за падінням пласта, жила різко звузилася, руда збідніла, і вибій тепер ледве окупає витрати на підйом породи на поверхню. Геологічний термін — #italic виклинювання#!. Гірницький — значно грубший. Можливо, далі вздовж розлому срібла більше, але щоб знайти його, доведеться пробивати коштовні розвідувальні штольні навмання."
  mining_survey_events.34.a: "Відступимо. Виклинена жила — зачинені двері."
  mining_survey_events.34.historical_info: "Срібні жили, як відомо, дуже різнилися за протяжністю: на одних ділянках вони роздувалися в рудні тіла завтовшки в кілька футів, на інших звужувалися до пустих прожилків. Примхи геометрії жил перетворювали видобуток срібла на свого роду азартну гру, а розквіт і занепад середньовічних гірничих міст — Яхимова, Шваца та Їглави — з похмурою закономірністю повторювали відкриття та виснаження окремих жил."
  mining_survey_events.35.title: "Не все те золото, що блищить"
  mining_survey_events.35.desc: "Розчарування на розвідувальній ділянці, де шукають #TOOLTIP:GOODS,goods_gold,X #L золото#!#!. Яскраві металеві блискітки в кварці — не золото, а пірит, сірчисте залізо, яке ошукувало рудошукачів ще на світанку металургії. Перша спроба пробірника — відновлення в тиглі — дала не жовту краплю золота, а тонкий червоний сірчаний наліт і шматок чавуну. Староста місцевого села підкреслено не здивований: він чув старі дідові оповідки про #italic золото дурнів#! на цьому схилі й хотів побачити, чи зрозуміють наші вчені різницю."
  mining_survey_events.35.a: "Згорнемо табір і підемо. Золото дурнів — найстаріша пастка, у яку потрапляють рудошукачі."
  mining_survey_events.35.historical_info: "Пірит — сірчисте залізо, що відливає в породі латунною жовтизною й отримало в німецьких гірничих краях народну назву #italic золото дурнів#!, — вводило в оману рудошукачів відтоді, як люди почали шукати справжній метал. Розпізнавальні проби — ковкість під молотом (пірит кришиться, золото розплющується), питома вага (золото важче за воду в дев’ятнадцять разів, пірит — лише вп’ятеро) та поведінка під час пробірного плавлення (золото витримує, пірит вигоряє сіркою та оксидом заліза) — були звичною справою для будь-якого вмілого пробірника."
  mining_survey_events.36.title: "Рудниковий газ у пласті"
  mining_survey_events.36.desc: "Пласт, де залягає #TOOLTIP:GOODS,coal,X вугілля#!, грубий і чистий. Але він також повний рудникового газу. Болотяний газ, що накопичується в будь-якій глибокій вугільній виробці, спалахнув від лампи одного з вибійників, і вибух, що стався слідом, убив трьох людей на місці, а ще шістьох обпік так, що працювати вони більше не зможуть. Десятник каже, що пласт можна розробляти, але тільки за постійного провітрювання через повітропровід із піччю, а це вимагатиме значних витрат, перш ніж буде видобуто бодай шматок вугілля."
  mining_survey_events.36.a: "Закриємо виробку. Ми поки не готові боротися з рудниковим газом."
  mining_survey_events.36.historical_info: "Рудниковий газ — метан, що накопичується у вугільних виробках і вибухає від будь-якого вогню, — був постійною причиною загибелі гірників доіндустріальної доби. Звичним засобом боротьби слугувало постійне провітрювання парними стовбурами з піччю біля основи витяжного стовбура, що протягувала повітря крізь виробки; безпечна лампа Деві, яка давала змогу освітлювати копальню без ризику займання, була винайдена лише 1815 року. Доти кожен глибокий вугільний пласт розроблявся в умовах безупинної загрози."
  mining_survey_events.37.title: "Затоплений кар’єр"
  mining_survey_events.37.desc: "#TOOLTIP:GOODS,stone,X #L Камінь#!#! чудовий, але кар’єр не бажає залишатися сухим. Перша виробка, заглиблена на дванадцять футів в осадовий шар, за ніч наповнюється водою з джерела, якого каменярі не очікували, і нижній шар каменю тепер лежить під трьома футами холодної води. Головний муляр каже, що кар’єр можна розробляти, якщо прорити водовідвідну штольню до долини внизу, але ця штольня сама по собі потребуватиме року робіт, і коштів у скарбниці на неї не розраховано."
  mining_survey_events.37.a: "Залишимо кар’єр. Затоплена виробка — однаково що закрита."
  mining_survey_events.37.historical_info: "Осушення кар’єрів було постійною інженерною проблемою доіндустріального видобутку каменю, і чимало загалом продуктивних виробок занедбували, коли вибій опускався нижче місцевого рівня ґрунтових вод. Типовими рішеннями були водовідвідні штольні, прорубані горизонтально до низини (так звані #italic штольні#! німецького гірничого звичаю), водяні колеса, які приводили в рух ланцюгові помпи з черпаками, а починаючи з XVII століття — поступове впровадження парових насосних машин."
  mining_survey_events.38.title: "Блок розколюється"
  mining_survey_events.38.desc: "#TOOLTIP:GOODS,marble,X #L Мармур#!#! спочатку у вибої здавався добротним. Через два дні, коли перший величезний блок нарешті відокремили від скельної основи та опустили на дерев’яні котки, він розколовся через невидиму ваду, розпавшись на шість непридатних уламків під вагою власного спуску. Старший каменяр обходить забракований блок, постукує по ньому молотком і промовляє те, що артіль уже знає: мармур у цій улоговині пронизаний внутрішніми тріщинами, яких не виявив жоден огляд вибою."
  mining_survey_events.38.a: "Закриємо вибій. Тріснутий мармур годиться хіба що на щебінь для шляхів."
  mining_survey_events.38.historical_info: "Мармурові блоки для скульптури та витончених архітектурних робіт мусили бути без жодних внутрішніх вад, і виявлення прихованих тріщин (#italic peli#! говіркою італійських каменярів) було вічним жахіттям ремесла. Досвідчені скульптори особисто навідувалися до кар’єрів, щоб оглянути необроблені блоки до замовлення, а у вартість великого скульптурного замовлення закладали щедрий запас на блоки, які виявлялися з вадою вже після доправлення."
  mining_survey_events.39.title: "Страз замість кристала"
  mining_survey_events.39.desc: "Гравій, що містить #TOOLTIP:GOODS,gems,X #L дорогоцінне каміння#!#!, виявився надзвичайно багатим. Підозріло багатим. Королівський гранувальник, доправлений зі столиці під охороною, оглядає здобич під яскравою лампою, зважує кожен камінь на долоні, креслить одним по уламку корунду й виносить неминучий присуд: більшість знахідок — страз, свинцеве скло, майстерно ограноване та зістарене, щоб скидатися на необроблений кристал. Хтось «підсолив» русло струмка. Десятника цього ранку підозріло немає в таборі."
  mining_survey_events.39.a: "Згортаємося. Уся ця розвідка виявилася шахрайською витівкою."
  mining_survey_events.39.historical_info: "«Підсолювання» — підкидання справжньої руди чи оброблених самоцвітів на розвідувальній ділянці задля залучення вкладень — було прадавнім різновидом професійного шахрайства на гірничих теренах. Десятник, що підсолював власні виробки, місцевий провідник, що розсипав кілька схованих зразків уздовж обраного русла, та зниклий організатор, який улаштував ретельно підлаштовану знахідку, були незмінними постатями в історії європейського та американського гірництва. Нечесний пробірник, що засвідчував підробку, довершував звичну оборудку."
  mining_survey_events.40.title: "Ртутне безумство"
  mining_survey_events.40.desc: "На #TOOLTIP:GOODS,mercury,X #L ртутних#!#! копальнях видобувають метал. А ще там плодять безумців. Робітники біля реторти почали нестримно тремтіти; учень, якому доручили помішувати сконденсовану ртуть, утратив зуби та здатність рухати двома пальцями правої руки; а головний металург, який найкраще знав небезпеки, упав у дратівливу неуважність, яку табірний лікар називає #italic безумством капелюшника#! й оголошує невиліковною. Ртуть чекає, поки її добудуть. Але ось людей, здатних її добути, більше немає."
  mining_survey_events.40.a: "Закриємо виробки. Жоден метал не вартий таких жертв."
  mining_survey_events.40.historical_info: "Отруєння ртуттю, що проявлялося тремором, утратою зубів і дедалі гіршим психічним розладом, було добре відомою професійною хворобою видобувачів кіноварі, робітників біля реторт та амальгаматорів срібла. Рудник Альмаден у Кастилії, головне європейське джерело ртуті, саме з цієї причини частково розроблявся працею каторжників. Англійський вираз #italic «божевільний, як капелюшник»#! зберіг згадку про це ремесло: капелюшники, які виготовляли фетрові капелюхи, труїлися ртуттю, що застосовувалася в їхній справі."
  mining_survey_events.41.title: "Солоне джерело вичерпується"
  mining_survey_events.41.desc: "Пошуки #TOOLTIP:GOODS,salt,X #L солі#!#! розпочалися багатообіцяльно. Солоне джерело било потужно, солевари виробляли білу сіль найвищої якості, а купці вже вели перемовини про довгострокові угоди. Потім, після посушливого літа й незвично холодної зими, джерело змаліло до цівки й урешті-решт пересохло. Геолог, відряджений розібратися, доповідає, що підземне джерело було лише обмеженою кишенею замкненої ропи, а не відновлюваним потоком, і що родовище, по суті, вичерпане."
  mining_survey_events.41.a: "Відступимося. Пересохле джерело — кінець солеварному промислу."
  mining_survey_events.41.historical_info: "Солоні джерела та поклади кам’яної солі мали геть різний геологічний характер і господарські перспективи. Деякі джерела ропи, як-от у Галле в Саксонії чи Сален-ле-Бені в Юрі, били століттями й утримували значні міста; інші ж були, по суті, викопними кишенями, що виснажувалися за одне покоління ревної розробки. Кам’яна сіль, яку добували в таких місцях, як Величка та Кардона, була надійнішою, але й набагато дорожчою у видобутку."
  mining_survey_events.42.title: "Сланці безплідні"
  mining_survey_events.42.desc: "Вихід сланців на поверхню видавався багатообіцяльним: порода вивітрювалася в сіль, яка в пробі виходила чистою та білою. Але в глибині сланці безплідні: щільні, темні й геть позбавлені піритових жил із вмістом #TOOLTIP:GOODS,alum,X #L галуну#!#!, який обіцяли зразки з поверхні. Хімік пробує кислотне вилуговування, потім випалювання, далі тривале вивітрювання на відвалі, проте майже нічого не одержує. Робітники, привезені з чималими витратами з ткацьких міст, сидять без діла, поки інженер випробовує один спосіб за іншим."
  mining_survey_events.42.a: "Закриємо виробництво. Хімія тут галуну не дасть."
  mining_survey_events.42.historical_info: "Виробництво галуну з піритових сланців вимагало чітко визначеного мінерального складу: залізного колчедану, що дає сульфат-іон, глиноземистого сланцю, що дає алюміній, та тривалого вивітрювання, щоб поєднати їх у розчині. Зразки з поверхні могли легко ввести в оману, оскільки відслонення розташовувалося там, де природне вивітрювання вже зробило свою справу; глибинні ж породи часто виявлялися пустими. Йоркширські галунові копальні на узбережжі Північного моря десятиліттями й ціною великих витрат розробляли сланці, які зрештою так нічого й не дали."
  mining_survey_events.43.title: "Ґрунт нічого не дає"
  mining_survey_events.43.desc: "У ґрунті долини, як припускали, мало бути багато #TOOLTIP:GOODS,saltpeter,X #L селітри#!#!. Місцеві землероби казали, що їхні діди щовесни збирали білий наліт зі скель. До цього часу рудознавці провели розкопки, вилуговування та випарювання ґрунту в десятку місць уздовж дна долини, але майже нічого вартісного не знайшли. Пороховий майстер, якому показали вбогі знахідки, припускає, що старі поклади селітри могли вичерпати самі землероби, чиї діди й розповідали ці перекази. Тепер у долині селітри не залишилося."
  mining_survey_events.43.a: "Покинемо долину. Ґрунт мертвий: селітри тут немає."
  mining_survey_events.43.historical_info: "Селітроносні ґрунти не були невичерпними. Природне утворення селітри у вологому, угноєному ґрунті тривало роками, і невтомний видобуток швидко його виснажував. Тому звичай німецьких #italic селітроварів#! передбачав постійне облаштування штучних #italic селітряних плантацій#!, де гній, вапно й золу зсипали на купи та роками доглядали за ними, щоб отримувати сталий вихід селітри. Перехід від пошуку селітри до її виготовлення став важливим кроком у впорядкуванні доіндустріального виробництва пороху."