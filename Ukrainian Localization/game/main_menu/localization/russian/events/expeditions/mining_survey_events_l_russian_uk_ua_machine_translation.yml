l_russian:
  mining_survey_events.1.title: "Розвідувальна комісія"
  mining_survey_events.1.desc: "Загін рудознавців стоїть напоготові на подвір’ї, їхні в’ючні мули навантажені кайлами, бурами та просмоленою дерев’яною скринею з тиглями, терезами й кислотами пробірника. Рік вони ходитимуть нашим гірським краєм, промиваючи річища струмків на золотий пісок, вгризаючись у кварцові жили й розпитуючи пастухів про те, в яких долинах лоток дає колір. Ці пагорби вже віддавали свої багатства колись, часто народам, про які ми зовсім забули. Немає підстав думати, що їм більше нічого дати."
  mining_survey_events.1.a: "Не шкодувати коштів. Відрядити найкращих пробірників та виділити щедрий гаманець на зразки."
  mining_survey_events.1.b: "Досить і скромної винагороди. Старости нададуть провідників та прихисток."
  mining_survey_events.1.historical_info: "Систематична розвідка надр практикувалася по всій середньовічній і ранньомодерній Європі, найвідоміше — у Рудних горах Саксонії та Богемії, де відкриття срібних жил у дванадцятому столітті породило такі швидкорослі міста, як Фрайберг, Яхимов і Шнеєберг. #italic Про гірничу справу#! Ґеорґія Аґріколи (1556) стала головним підручником цього ремесла, докладно описуючи застосування лозоходських прутів, пробірний аналіз зразків руди в невеликих тиглях і правові звичаї, що регулювали заявлення прав на родовища."
  mining_survey_events.10.title: "Жила [ShowGoodsNameWithNoTooltip('iron')]"
  mining_survey_events.10.desc: "Рудознавці натрапили на жилу високосортної [ShowGoodsName('iron')] руди, що сягає глибоко в гору — камінь посічений чорним і червоним там, де його оголили кайла. Староста найближчого села каже, що його дід розповідав про старі виробітки десь вище схилом; нові копальні, можливо, просто заново відкривають те, що було втрачено. Кузні та ливарні нижче за течією матимуть достаток сировини на ціле покоління, якщо знахідка не підведе."
  mining_survey_events.10.a: "Оголосити про знахідку. Нехай [ROOT.GetCountry.GetFlavorRank] дізнається про те, що в нас є."
  mining_survey_events.10.b: "Розробляти потай. Ливарням суперників поки що ні до чого про це знати."
  mining_survey_events.10.historical_info: "Видобуток заліза в доіндустріальній Європі тримався на невеликих поверхневих виробітках і неглибоких копальнях, що йшли за видимим виходом руди на поверхню, а сиродутні горна перетворювали руду на коване залізо просто біля рудні. Доменна піч, що з’явилася в пізньому Середньовіччі, дозволила виробляти чавун у значно більших обсягах, і на цьому будували свій ранньомодерний добробут великі залізорудні краї Швеції, Штирії та Країни Басків."
  mining_survey_events.11.title: "Поклад [ShowGoodsNameWithNoTooltip('copper')]"
  mining_survey_events.11.desc: "Рудознавці піднялися схилом пагорба смугою каменю із зеленими патьоками й знайшли джерело: поклад [ShowGoodsName('copper')], що тягнеться кручею скелі, відкритий усім вітрам і чекає, коли його почнуть розробляти. Пробірник розбиває зразок на своєму переносному ковадлі, кидає його в тигель і повідомляє, що метал чистий та дає гарний вихід. Плавильників уже кличуть із південних міст."
  mining_survey_events.11.a: "Розробляти копальню відкрито. [ROOT.GetCountry.GetFlavorRank] ма[ROOT.GetCountry.Custom('endrank_yeyut')] знати, що ми натрапили на [ShowGoodsNameWithNoTooltip('copper')|l]."
  mining_survey_events.11.b: "Розробляти копальню потай. Ливарники латуні заплатять більше, якщо чутки не поповзуть."
  mining_survey_events.11.historical_info: "Видобуток міді в доіндустріальній Європі зосереджувався в кількох уславлених краях: Фалуні у Швеції, схилах Рудних гір, Мансфельдському краї в Саксонії та Тірольських Альпах. Цей метал був потрібен для бронзових гармат, обшивки кораблів і латунних виробів, і прибуткова мідна рудня могла збагатити як корону, якій належала, так і купецькі доми, що брали на себе витрати на її розробку. Банкірська династія Фуґґерів піднеслася почасти завдяки контролю над тірольською міддю."
  mining_survey_events.12.title: "Поклад [ShowGoodsNameWithNoTooltip('tin')] у пагорбах"
  mining_survey_events.12.desc: "Гірники пройшли слідом за темними олов’яними камінцями в річищі струмка вгору схилом і знайшли жилу там, де вона виходить на поверхню: порода із вмістом [ShowGoodsName('tin')] тягнеться товстим і чистим шаром уздовж кварцової жили. Рудокопи вже зводять кріплення в копальні й ставлять товкарню біля підніжжя пагорба. Бронзоливарники, майстри олов’яного посуду та начиння будуть забезпечені сировиною на ціле покоління."
  mining_survey_events.12.a: "Оголосити про знахідку. Нова жила олова — справа державної ваги."
  mining_survey_events.12.b: "Тримати знахідку в таємниці. Торгівля бронзою винагороджує тих, хто прибере до рук увесь видобуток."
  mining_survey_events.12.historical_info: "Олово було стратегічним металом у домодерному світі, потрібним як для бронзових гармат, так і для хатнього олов’яного посуду, а його запаси зосереджувалися в кількох відомих краях: Корнволі, Рудних горах та частині Богемії. Олов’яні округи Корнволу з доби Середньовіччя мали особливий правовий статус, власні суди й збори, а корнвольська торгівля оловом живила виробництво латуні та бронзи по всій Атлантичній Європі."
  mining_survey_events.13.title: "Галеніт у вапняку"
  mining_survey_events.13.desc: "У горбистій місцевості розкрито пласт галеніту: його темні кристали пронизані сріблястими виблисками, що обіцяють корисний побічний виріб плавлення. [ShowGoodsName('lead')] із цього пласта піде на покрівлі церков, обшивку труб і виливання шроту, а частка [ShowGoodsName('silver')] допоможе окупити розробку. Штейґер доповідає про чистий вибій і сталу тягу в новій копальні."
  mining_survey_events.13.a: "Оголосити про знахідку. [ShowGoodsNameWithNoTooltip('lead')] — справа суспільної ваги."
  mining_survey_events.13.b: "Потай законтрактувати видобуток для порохівень та друкарів."
  mining_survey_events.13.historical_info: "У домодерній Європі свинець і срібло майже завжди видобували разом, оскільки галенітова руда давала обидва метали завдяки купеляції, винайденій у давнину й удосконаленій у Середньовіччі. Мендіпські пагорби в Англії, Гарц у Саксонії та Сьєрра-Морена в Іспанії були найважливішими свинцево-срібними округами, а видобутий свинець ішов на все — від покрівель соборів до друкарських літер і свинцевих водогінних труб."
  mining_survey_events.14.title: "[ShowGoodsNameWithNoTooltip('silver')] у скелі"
  mining_survey_events.14.desc: "Гірники натрапили на [ShowGoodsName('silver')] — жилу, достатньо широку, щоб розмахнутися в ній кайлом, і достатньо чисту, щоб виблискувати просто в породі. Тиглі пробірника ще не охололи після випробувань. Штольня укріплена кріпленням, і перші візки руди вже підіймають на поверхню рипливим коловоротом. Монетний двір не знатиме потреби в дорогоцінному металі ще ціле покоління, а двори [ShowContinentName('europe')] дізнаються про цю знахідку впродовж року."
  mining_survey_events.14.a: "Сповістити про відкриття [ROOT.GetCountry.Custom('rank_ua_DAT')|l]. Срібна копальня — це справжній тріумф."
  mining_survey_events.14.b: "Тримати знахідку в таємниці. Чужоземна цікавість до нашого срібла може завдати клопоту."
  mining_survey_events.14.historical_info: "Видобуток срібла докорінно змінив європейські господарства наприкінці середньовіччя та на початку ранньомодерної доби. Відкриття великих срібних жил у Шваці в Тіролі та в Йоахімсталі в Богемії наприкінці 1400-х років, а згодом родовища в Потосі в Андах у 1545 році заполонило Європу дорогоцінним металом і підживило небачену інфляцію XVI століття. Багата срібна копальня була стратегічною цінністю, співмірною з цілим флотом або фортецею."
  mining_survey_events.15.title: "Жовтий метал"
  mining_survey_events.15.desc: "Гірники натрапили на [ShowGoodsName('goods_gold')]. Кварцова жила, пронизана грубими нитками металу, оголилася на скельній стіні там, де зимовий обвал зніс шар ґрунту. Метал яскраво виблискує у світлі ліхтаря і лишався недоторканим відколи залягла порода. Староста села пропонує здати розробки в оренду [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] за те, що він називає справедливою часткою. Пробірник радить прийняти пропозицію, але із застереженнями."
  mining_survey_events.15.a: "Оголосити про знахідку. Нехай вороги про неї дізнаються."
  mining_survey_events.15.b: "Розробляти копальню потай. [ShowGoodsNameWithNoTooltip('goods_gold')] приваблює небажаних гостей."
  mining_survey_events.15.historical_info: "Самородне золото в доіндустріальній Європі було рідкістю і швидко вичерпувалося. Середньовічні золоті копальні Кремниці в Словаччині та Вранчі у Валахії були помітними місцевими джерелами, але більша частина європейського золота намивалася з алювіальних розсипів річок, як-от Рейн і Тахо, або ж отримувалася під час переробки срібної частки свинцево-срібних руд. Виявлення самородного золота в хоч скількись значній кількості було рідкісним успіхом, і корона завжди поспішала заявити на нього свої права."
  mining_survey_events.16.title: "Чорний камінь горить палко"
  mining_survey_events.16.desc: "Крізь ці пагорби проходить потужний пласт [ShowGoodsName('coal')], що виходить на поверхню у двох місцях, де його розмила річкова вода. Пласт легко простежується, а [ShowGoodsNameWithNoTooltip('coal')] горить чисто. Місцеві ковалі вже замінюють ним дрова для своїх гонів. Кузні, солеварні та гути відтепер можна забезпечувати з цього пласта без подальшого винищення довколишніх лісів."
  mining_survey_events.16.a: "Розробляти пласт за [ROOT.GetCountry.GetGovernment.GetAdjective|l]им дозволом. [ROOT.GetCountry.GetFlavorRank] ма[ROOT.GetCountry.Custom('endrank_yeyut')] знати."
  mining_survey_events.16.b: "Здати виробітки в оренду майстрам-залізоробам в обмін на сталу частку видобутку."
  mining_survey_events.16.historical_info: "Видобуток вугілля у незначних обсягах тривав у Європі ще від доби Середньовіччя, переважно в Уельсі, Ньюкаслському вугільному басейні та в деяких землях Льєжа, однак справжній злет цього промислу стався у ранньомодерну добу, коли брак палива змусив вирубувати ліси під ріллю. У сімнадцятому столітті морське вугілля з Ньюкасла тисячами тонн везли до Лондона, і без нього залізоробні промисли не витримали б нестачі деревного вугілля."
  mining_survey_events.17.title: "Камінь, що добре колеться: [ShowGoodsNameWithNoTooltip('stone')]"
  mining_survey_events.17.desc: "У пагорбах відкрито нову каменоломню: [ShowGoodsName('stone')] легко розколюється за пластами залягання і після видобутку твердне на повітрі. Головний муляр прибув із соборного будівництва, щоб оглянути зразок брили, і визнав його придатним як для тесаної кладки, так і для тонкого різьблення та опорних лав. Кожен собор і фортечний мур на сотню миль довкола матимуть каміння звідси впродовж цілого покоління."
  mining_survey_events.17.a: "Взяти виробітки у [ROOT.GetCountry.GetGovernment.GetAdjective|l]і руки. [ShowGoodsNameWithNoTooltip('stone')] — це сировина державної важливости."
  mining_survey_events.17.b: "Здати каменярню в оренду спілці мулярів за сталу платню."
  mining_survey_events.17.historical_info: "Будівельний камінь був товаром повільним у перевезенні, але цінним у доіндустріальній Європі, бо вартість шляху була головним чинником його ціни. Багата каменоломня за день дороги від великого міста чи будови ставала тривалим надбанням, і великі середньовічні будівництва соборів у Реймсі, Солсбері та Кельні тримали власні каменоломні впродовж багатьох поколінь, аби забезпечувати потреби будівництва."
  mining_survey_events.18.title: "[ShowGoodsNameWithNoTooltip('marble')] у видолинку"
  mining_survey_events.18.desc: "У затишному видолинку знайдено вишуканий прожилкуватий [ShowGoodsName('marble')], і головний муляр витесав зразок брили, що після шліфування дає глибокий напівпрозорий полиск. Місцеві різьбярі вже б'ють чолом про право першими купувати цю здобич. Майстерні аж до самої столиці користуватимуться цією каменоломнею впродовж цілого покоління, а різьбярі вівтарів і гробниць вважатимуть себе ощасливленими такою ласкою."
  mining_survey_events.18.a: "Оголосити про знахідку. Велика мармурова каменярня — це скарб для всієї країни."
  mining_survey_events.18.b: "Залишити мармур для [ROOT.GetCountry.GetGovernment.GetAdjective|l]их майстерень. Стриманість принесе більше користі, ніж слава."
  mining_survey_events.18.historical_info: "Мармур для витонченої скульптури та архітектури середньовічної та ренесансної Європи видобували в небагатьох уславлених каменоломнях: Каррарі в Тоскані, Паросі й Пентеліконі в Греції, а також Сен-Бе в Піренеях. Відкриття нової багатої жили мармуру статуарної якості ставало подією для митців, які замовляли зразки та особисто вирушали оглянути багатообіцяльну знахідку."
  mining_survey_events.19.title: "Камені, що грають світлом"
  mining_survey_events.19.desc: "Вивідувачі знайшли в річищі струмка гравій з [ShowGoodsName('gems')] і простежили його до багатшого гнізда на схилі пагорба вище, де основою є пегматит, пронизаний кристалами. Посланець гранувальників, покликаний зі столиці, розбирає купу сирих каменів за барвою та чистотою й каже, що частка придатних для різьблення самоцвітів надзвичайно висока. Придворним золотарям не бракуватиме каменів упродовж цілого покоління."
  mining_survey_events.19.a: "Оголосити про відкриття. Копальня самоцвітів — це диво, яким варто пишатися."
  mining_survey_events.19.b: "Залишити видобуток для [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого двору. Самоцвіти — багатство, що не потребує розголосу."
  mining_survey_events.19.historical_info: "Видобуток коштовного каміння в Європі важив мало порівняно з величними індійськими та бірманськими родовищами, проте місцеві джерела гранатів, берилу, аметисту й топазу розроблялися в Богемському нагір'ї, шотландських Кернгормс та окремих куточках Піренеїв. Гранувальні майстерні Ідар-Оберштайна в Рейнській землі стали осередком обробки місцевих каменів, і щаслива знахідка могла забезпечити працею їхніх майстрів на довгі роки."
  mining_survey_events.20.title: "Кіновар у горах"
  mining_survey_events.20.desc: "У високогір’ї розробили поклади кіноварі — її яскраво-червона руда є безпомилковою ознакою #TOOLTIP:GOODS,mercury,X #L ртуті#!#! в породі. Реторту й конденсатор встановлюють на безпечній відстані від виробітку. Алхіміки, пробірники та позолотники ціле покоління братимуть сировину з цієї копальні, а очисники срібла з Нового Світу ще заплатять будь-яку ціну, аби доправити нашу ртуть до своїх монетних дворів."
  mining_survey_events.20.a: "Відкрито розбудовувати рудник. [ShowGoodsNameWithNoTooltip('mercury')] — товар державної значущости."
  mining_survey_events.20.b: "Розробляти копальню нишком. Монополія на ртуть — велика сила."
  mining_survey_events.20.historical_info: "Ртуть, єдиний рідкий за кімнатної температури метал, була незамінною для амальгамації, яка в шістнадцятому столітті стала провідною в добуванні американського срібла. Рудник Альмаден у Кастилії та Ідрія в Крайні були двома великими європейськими осередками видобутку, й іспанська корона тримала альмаденські виробітки під суворою королівською монополією, вивозячи ртуть до Мексики й Перу на галеонах під охороною флоту."
  mining_survey_events.21.title: "Соляне джерело"
  mining_survey_events.21.desc: "У нагір'ї відкрито нове родовище кам'яної [ShowGoodsName('salt')], із соляними джерелами, що вибиваються там, де пласти перетинають дно долини. Солевари вже стали до праці, а тутешній люд напуває худобу біля соляних виходів. Від цього виграють і торгівля солониною, і спільний стіл, а габель, якщо ми зважимося її запровадити, покриє рік видатків на потреби двору [ROOT.GetCountry.Custom('CL_GEN')] однією лише цією знахідкою."
  mining_survey_events.21.a: "Розвивати соляні промисли [ShowGoodsNameWithNoTooltip('salt')] за [ROOT.GetCountry.GetGovernment.GetAdjective]ою грамотою."
  mining_survey_events.21.b: "Здати промисел в оренду торговцям сіллю за постійну частку."
  mining_survey_events.21.historical_info: "Сіль була стратегічним товаром у доіндустріальній Європі — незамінним засобом збереження харчів і важливим джерелом державних прибутків через численні соляні мита й монополії, найвідомішою з яких була французька габель. Великі соляні копальні Велички в Польщі, Гальштата в Австрії та Кардони в Каталонії розроблялися віками й створили багатство родин і корон, що володіли ними."
  mining_survey_events.22.title: "Знайдено сланці з [ShowGoodsNameWithNoTooltip('alum')]"
  mining_survey_events.22.desc: "Шукачі виявили в передгір'ях сланці, які містять [ShowGoodsName('alum')]: порода природним чином вивітрюється на сіль, за яку фарбарі ладні платити будь-які гроші. Пробна випалювальна піч дала з перших зразків чистий білий [ShowGoodsNameWithNoTooltip('alum')], і представники суконних купців уже випитують про довгострокові угоди. Ткацькі промисли довго чекали на джерело ближче до дому, ніж папська монополія в Тольфі."
  mining_survey_events.22.a: "Оголосити про знахідку. [ShowGoodsNameWithNoTooltip('alum')] — це тріумф промислів [ROOT.GetCountry.Custom('rank_ua_GEN')]."
  mining_survey_events.22.b: "Розробляти копальню нишком. Папській монополії на [ShowGoodsNameWithNoTooltip('alum')|l] не обов’язково про це знати."
  mining_survey_events.22.historical_info: "Галун, незамінний закріплювач барвників на тканині, був стратегічним крамом для ткацтва впродовж Середньовіччя та ранньої нової доби. Відкриття великих покладів галуну в Тольфі в Папській державі 1462 року породило папську монополію, яка трималася понад століття, аж доки не відкрили інші джерела в Англії, Швеції та Нідерландах. Будь-яка країна, спроможна забезпечити себе власним галуном, рятувала своє суконне виробництво від прикрої залежності від чужоземного привозу."
  mining_survey_events.23.title: "[ShowGoodsNameWithNoTooltip('saltpeter')] у долині"
  mining_survey_events.23.desc: "[ShowGoodsName('saltpeter')] добуто із землі затишної долини — білі кристали проступили на скелях після весняного танення снігів. Пороховий майстер, що прибув з арсеналу, взяв пробу сирої селітри й оголосив її придатною для очищення на порох найвищого ґатунку. Пороховим млинам не бракуватиме селітри ще ціле покоління, а гарматний обоз [ROOT.GetCountry.GetFlavorRank] нарешті зможе зрівнятися з її задумами."
  mining_survey_events.23.a: "Вести розробку під [ROOT.GetCountry.GetGovernment.GetAdjective|l]ою монополією. [ShowGoodsNameWithNoTooltip('saltpeter')] — це справа війни."
  mining_survey_events.23.b: "Дозволити торговцям порохом вести розробку в обмін на першочергове право викупу видобутку."
  mining_survey_events.23.historical_info: "Селітра, головна складова пороху, в доіндустріальній Європі добувалася з укритих ґрунтів, які довго вгноювали гноєм і послідом, або привозилася за великі гроші з Індії та Леванту. Державний нагляд за видобутком селітри був справою першорядною: в Англії діяли «селітряники» із законним правом копати під стайнями та голубниками, а у Франції королівська монополія — #italic Régie des Poudres#! — зберігалася аж до XIX століття."
  mining_survey_events.30.title: "Обвал у розвідувальній копальні"
  mining_survey_events.30.desc: "Катастрофа на родовищі [ShowGoodsName('iron')]. Розвідувальний шурф завалився вночі — кріплення зірвало повільне осідання пухкого сланцю над рудною жилою. Двоє з розвідувального загону поховані під завалом; ще одного, учня пробірника, витягли зі зламаною ногою, і він рішуче відмовився будь-коли знову спускатися під землю. Штейгер каже, що [ShowGoodsNameWithNoTooltip('iron')] там є, але щоб дістатися до неї, доведеться прокладати нову штольню крізь твердішу породу, а видатки будуть чималими."
  mining_survey_events.30.a: "Відкликати загін. Жодні поклади не варті того, щоб ховати через них людей."
  mining_survey_events.30.historical_info: "Обвали покрівлі та руйнування копалень були повсякчасною виробничою небезпекою доіндустріального гірництва. Дерев’яне кріплення, що підтримувало виробки, гнило у вологому ґрунті; пухкі пласти над рудною жилою осідали без попередження; а узвичаєний спосіб камерно-стовпового видобутку залишав дедалі більше незакріплених порожнин у міру видобування руди. Гірничі каплиці, похоронні братства гірників та скарбниці для вдів гірників були невіддільною рисою кожного європейського гірничого краю."
  mining_survey_events.31.title: "Отруйний дим із виробок"
  mining_survey_events.31.desc: "Розробка [ShowGoodsName('copper')] приносить руду несподіваних властивостей. Перша випалювальна купа, облаштована для видалення сульфідів перед плавленням, випускає їдкий жовтий дим, який зігнав робітників зі схилу і нищить траву на пів милі за вітром. Місцеві селяни подали офіційну скаргу. Металург каже, що може збудувати справжні випалювальні печі для вловлювання диму, але це потребуватиме грошей і часу, яких ми не закладали в кошторис."
  mining_survey_events.31.a: "Полишити розвідку. Місцеві не помилялися щодо повітря."
  mining_survey_events.31.historical_info: "Плавлення міді з сульфідних руд вивільняло велику кількість сірчистого газу, який нищив посіви, худобу й легені людей у всій окрузі. Мідний округ Фалун у Швеції зажив лихої слави через свій дим, який, як казали, робив навколишні землі безплідними на багато миль навколо, а велика мідноплавильна долина Нижнього Гарцу завдавала не меншого спустошення. Цивільні позови проти копалень за шкоду від диму були звичною справою ще із Середньовіччя."
  mining_survey_events.32.title: "Річище пересохло"
  mining_survey_events.32.desc: "Розробка [ShowGoodsName('tin')] спочатку виглядала багатообіцяюче: алювіальний каситерит у достатній кількості, який вимивали з річища цілими возами. Проте джерело розсипу так і не знайшли, а річища нині вичерпані від важкої руди. Шурфи, викопані вище схилом, натрапили лише на порожню породу. В артілі закінчилися очевидні місця для копання, а видатки на глибші розвідувальні копальні без будь-яких свідчень важко виправдати."
  mining_survey_events.32.a: "Покинути розробку. Розсип виявився скороминущою удачею."
  mining_survey_events.32.historical_info: "Алювіальний видобуток олова, тобто розробка олововмісного гравію в річищах річок та струмків, був первісним способом корнуольського видобутку олова і зберігався аж до раннього Нового часу. Коли легкодоступний гравій вичерпувався, рудознавцям доводилося простежувати розсип до його джерела шляхом систематичної розвідки довколишніх пагорбів. Багато багатообіцяючих струмків вели лише до тонкої розсіяної жили, що не виправдовувала витрат на підземну розробку."
  mining_survey_events.33.title: "Робітники занедужали"
  mining_survey_events.33.desc: "Розробка [ShowGoodsName('lead')] дає руду. А робітники скаржаться. У людей, що повертаються зі зміни, сірувато-землясті ясна, розпухлі суглоби й важка загальмованість, яку табірний лікар називає колькою рудокопів. Двоє померли; ще четверо занадто хворі, щоб спускатися в копальню. Штейгер каже, що роботи можна продовжувати, якщо найняти нових людей і змиритися зі втратами, але місцевий старійшина ставить незручні запитання про те, хто буде наступним."
  mining_survey_events.33.a: "Закрити копальні. Ми прийшли сюди не для того, щоб ховати вільних людей [ROOT.GetCountry.Custom('rank_ua_GEN')]."
  mining_survey_events.33.historical_info: "Отруєння свинцем, що його стародавні називали #italic colic plumbica#!, було добре відомою фаховою хворобою свинцевих рудокопів, плавильників, склярів і гончарів. Праця Бернардіно Рамацціні #italic De morbis artificum diatriba#! (1700), що заклала підвалини медицини праці, присвятила цій недузі розлогий розділ. Звичні засоби, як-от пускання крові, проносне та вживання молока, були безсилими, а єдиним справжнім захистом було зменшення контакту з металом, до чого власники копалень мали обмаль господарських спонук."
  mining_survey_events.34.title: "Жила виклинюється"
  mining_survey_events.34.desc: "Жила [ShowGoodsName('silver')] була широкою там, де рудознавці вперше розкрили її, і перші вози руди за пробою давали понад тридцять марок [ShowGoodsNameWithNoTooltip('silver')] на центнер. Але потім, на десять ярдів углиб за падінням пласта, жила різко звузилася, руда збідніла, і вибій тепер ледве окупає витрати на підйом породи на поверхню. Дослідники називають це #italic виклинюванням#!. У рудокопів із цього приводу є вислів куди менш ґречний. Можливо, далі вздовж розлому знайдеться ще [ShowGoodsNameWithNoTooltip('silver')], але щоб це з’ясувати, знадобляться дорогі розвідувальні копальні без будь-яких певних свідчень."
  mining_survey_events.34.a: "Відступити. Виклинена жила — зачинені двері."
  mining_survey_events.34.historical_info: "Срібні жили вирізнялися горезвісною мінливістю за своєю довжиною: в одних місцях вони розросталися до пластів руди в кілька футів завтовшки, а в інших звужувалися до порожніх прожилків. Примхи залягання жил перетворювали видобуток срібла на азартну гру для тямущих, а злети й падіння середньовічних містечок гірників, як-от Йоахімсталь, Швац та Іглау, з похмурою регулярністю слідували за відкриттям та виснаженням окремих жил."
  mining_survey_events.35.title: "Не все те золото, що блищить"
  mining_survey_events.35.desc: "Розчарування на розробці [ShowGoodsName('goods_gold')]. Яскраві металеві вкраплення у кварці — зовсім не [ShowGoodsNameWithNoTooltip('goods_gold')], а пірит, сірчисте залізо, що ошукувало гірників від самого світанку металургії. Перша проба, проведена пробірником через відновлення в тиглі, дала не жовтий корольок [ShowGoodsNameWithNoTooltip('goods_gold')], а тонку червону сірчисту окалину та шматок чавуну. Старійшина місцевого села явно не здивований: він чув старі бабусині казки про #italic Narrengold#! на цьому схилі й чекав, чи помітять наші вчені мужі різницю."
  mining_survey_events.35.a: "Збиратися й рушати. Золото дурнів — вічний супутник рудошукача."
  mining_survey_events.35.historical_info: "Пірит, сульфід заліза, що вилискує латунно-жовтим блиском у породі й дістав у німецьких гірничих краях прізвисько #italic Narrengold#! («золото дурнів»), уводив гірників в оману відтоді, як люди почали шукати справжній метал. Визначальні проби — ковкість під молотом (пірит кришиться, золото розплющується), питома вага (золото в дев’ятнадцять разів щільніше за воду, пірит — лише в п’ять разів) та поведінка під час вогневого аналізу (золото не змінюється, пірит вигоряє, перетворюючись на сірку та оксид заліза) — були звичною справою для будь-якого досвідченого пробірника."
  mining_survey_events.36.title: "Рудниковий газ у пласті"
  mining_survey_events.36.desc: "Пласт [ShowGoodsName('coal')] залягає товстим і чистим шаром. Але він також сповнений рудникового газу. Болотяний газ, що накопичується в будь-якій глибокій виробці [ShowGoodsNameWithNoTooltip('coal')], зайнявся від лампи одного з вибійників, і подальший вибух убив трьох на місці та обпік ще шістьох так тяжко, що вони більше не зможуть працювати. Штейгер каже, що пласт можна розробляти, але тільки за постійного провітрювання крізь вентиляційний стовбур і піч, а це потребуватиме чималих коштів перш ніж удасться видобути бодай трохи [ShowGoodsNameWithNoTooltip('coal')]."
  mining_survey_events.36.a: "Закрити штольню. Ми ще не здатні боротися з рудниковим газом."
  mining_survey_events.36.historical_info: "Рудниковий газ, метан, що накопичується у вугільних виробках і вибухає від будь-якого відкритого вогню, був повсякчасним убивцею гірників доіндустріальної доби. Звичним заходом боротьби було систематичне провітрювання парними стовбурами з піччю біля підніжжя висхідного стовбура, яка витягала повітря крізь виробки; безпечна лампа Деві, що дозволяла освітлювати вибій без небезпеки займання, була винайдена лише 1815 року. До того часу кожен глибокий вугільний пласт розроблявся під невпинною загрозою катастрофи."
  mining_survey_events.37.title: "Затоплення каменоломні"
  mining_survey_events.37.desc: "[ShowGoodsName('stone')] тут чудовий, але каменоломню неможливо осушити. Перший кар’єр, заглиблений на дванадцять футів уздовж пласта, за ніч наповнюється водою з джерела, якого каменярі не передбачили, і нижній ряд [ShowGoodsNameWithNoTooltip('stone')] тепер прихований під трьома футами холодної води. Майстер-каменяр каже, що каменоломню можна розробляти, якщо прорити водовідвідну штольню в долину внизу, але сама штольня — це ще рік каменярських робіт, а скарбниця цього не передбачала."
  mining_survey_events.37.a: "Покинути каменоломню. Затоплений кар’єр — закритий кар’єр."
  mining_survey_events.37.historical_info: "Осушення каменоломень було повсякчасною інженерною морокою в доіндустріальному видобутку каменю, і багато в іншому прибуткових кар’єрів закидали, коли вибій опускався нижче місцевого рівня ґрунтових вод. Звичними рішеннями були водовідвідні штольні, що вирубувалися горизонтально до нижчої місцевості (так звані #italic Stollen#! у німецьких гірничих звичаях), водяні колеса, що рухали ланцюгові помпи з баддями, а із сімнадцятого століття — поступове впровадження парових помпових машин."
  mining_survey_events.38.title: "Брила розколюється"
  mining_survey_events.38.desc: "[ShowGoodsName('marble')] спершу здавався суцільним просто біля вибою. Два дні по тому, коли першу велетенську брилу нарешті відокремили від корінної породи й опустили на дерев’яні котки, вона тріснула вздовж невидимої розколини, розпавшись на шість нікчемних уламків під власною вагою під час спуску. Майстер-каменяр обходить знецінену брилу, постукує по ній молотком і промовляє те, що вся артіль уже й так знає: [ShowGoodsNameWithNoTooltip('marble')] у цій улоговині наскрізь пронизаний внутрішніми тріщинами, яких жоден огляд вибою не міг виявити."
  mining_survey_events.38.a: "Закрити каменоломню. Потрісканий мармур згодиться хіба що на щебінь для доріг."
  mining_survey_events.38.historical_info: "Мармурові брили для статуй та витонченого архітектурного оздоблення мали бути без внутрішніх вад, і виявлення прихованих тріщин (#italic peli#! говіркою італійських каменярів) було повсякчасним жахіттям ремесла. Майстри-скульптори особисто приїздили до каменоломень, щоб оглянути необроблені брили перед замовленням, а вартість великого замовлення на статую передбачала щедрий запас на випадок, якщо після доправляння брила виявиться з вадою."
  mining_survey_events.39.title: "Скло, а не кришталь"
  mining_survey_events.39.desc: "Гравійні наноси, що містять [ShowGoodsName('gems')], виявилися надзвичайно багатими. Підозріло багатими. Королівський золотар, доправлений зі столиці під охороною, оглядає здобич при яскравому світлі лампи, зважує кожен камінь на долоні, дряпає один уламком корунду та виносить неминучий вирок: більшість знахідок — підробка, свинцеве скло, хитромудро ограноване й зістарене так, щоб скидатися на необроблений кришталь. Хтось підсипав каміння в річище. Штейгер цього ранку помітно відсутній у таборі."
  mining_survey_events.39.a: "Згортаємося. Усе це родовище було шахрайством."
  mining_survey_events.39.historical_info: "«Засолювання» — звичай підкидати справжню руду або оброблені самоцвіти на ділянку для приваблення вкладників — було прадавнім промисловим обманом на гірничому фронтирі. Штейгер, який підсолював власні виробітки, місцевий провідник, що розкидав кілька прихованих зразків уздовж обраного струмка, та заїжджий ділок, який підлаштовував «щасливу» знахідку, — вічні постаті в історії як європейської, так і американської гірничої справи. Продажний оцінювач, який підтверджував підробку, завершував звичну оборудку."
  mining_survey_events.40.title: "Божевілля від [ShowGoodsNameWithNoTooltip('mercury')]"
  mining_survey_events.40.desc: "Виробітки [ShowGoodsName('mercury')] дають метал. А ще вони дають божевільних. Робітники біля ретортних печей почали нестримно тремтіти; челядник, якому доручили помішувати конденсовану [ShowGoodsNameWithNoTooltip('mercury')], позбувся зубів і не володіє двома пальцями на правій руці; а головний металург, який найкраще знав про небезпеки, впав у дратівливу неуважність, яку табірний лікар називає #italic капелюшним божевіллям#! і вважає невиліковною. [ShowGoodsNameWithNoTooltip('mercury')] тут є. А от людей, щоб її добути, — немає."
  mining_survey_events.40.a: "Закрити виробітки. Жоден метал цього не вартий."
  mining_survey_events.40.historical_info: "Ртутне отруєння, що виявлялося в тремтінні, випаданні зубів та поступовому психічному розладі, було добре знаною професійною хворобою рудокопів, які видобували кіновар, робітників біля реторт та срібних амальгаматорів. Рудник Альмаден у Кастилії, найбільше європейське джерело ртуті, розроблявся почасти каторжною працею саме з цієї причини. Англійський вислів #italic божевільний, як капелюшник#! зберіг згадку про це ремесло — з часів, коли майстрів із виготовлення фетрових капелюхів труїла ртуть, яку застосовували в їхній справі."
  mining_survey_events.41.title: "Ропне джерело вичерпалося"
  mining_survey_events.41.desc: "Ділянка з [ShowGoodsName('salt')] починалася добре. Джерело ропи було потужним, котли давали білу [ShowGoodsNameWithNoTooltip('salt')] найвищої якості, а торговці сіллю вже вели перемовини про довгострокові угоди. Але після посушливого літа та холоднішої, ніж зазвичай, зими джерело ослабло до тонкої цівки, а потім і геть вичерпалося. Надісланий геолог повідомляє, що підземне джерело було не відновлюваним потоком, а вичерпною кишенею замкненої ропи, і що родовище практично вичерпано."
  mining_survey_events.41.a: "Відступити. Пересохле джерело — це кінець ропного промислу з видобутку [ShowGoodsNameWithNoTooltip('salt')]."
  mining_survey_events.41.historical_info: "Джерела ропи та родовища кам’яної солі мали цілком різну геологічну природу та господарські перспективи. Деякі ропні джерела, як-от у Галле в Саксонії чи Сален-ле-Бен в Юрі, діяли століттями й годували цілі міста; інші ж були по суті викопними кишенями, що вичерпувалися за одне покоління невтомного видобутку. Кам’яна сіль, яку видобували в таких місцях, як Величка та Кардона, була надійнішим, але й значно капіталомісткішим багатством."
  mining_survey_events.42.title: "Сланці безплідні"
  mining_survey_events.42.desc: "Сланцевий вихід на поверхню виглядав багатообіцяюче: порода під час вивітрювання давала сіль, чисту й білу на пробу. Але під покривом сланці виявилися безплідними: товсті, темні й цілковито позбавлені піритових жил із [ShowGoodsName('alum')], які, здавалося, обіцяли поверхневі зразки. Хімік випробовує кислотне вилуговування, потім випалювання, потім тривале витримування на відвалі — і не отримує майже нічого. Робітники, привезені з чималими витратами з ткацьких міст, сидять без діла, поки інженер перебирає один засіб за іншим."
  mining_survey_events.42.a: "Закрити промисел. Ми не можемо виробляти [ShowGoodsNameWithNoTooltip('alum')|l] там, де хімія цьому опирається."
  mining_survey_events.42.historical_info: "Виробництво галуну з піритових сланців вимагало точно вивіреного мінерального складу: залізний пірит давав сульфат-іон, глинистий сланець — алюміній, а тривале вивітрювання зводило те й інше воєдино в розчині. Поверхневі зразки легко вводили в оману, адже саме на виходах природне вивітрювання вже зробило свою працю; підземна ж порода часто виявлялася безплідною. Йоркширські галунові промисли на узбережжі Північного моря змарнували десятиліття й чималий капітал на сланці, які зрештою не дали нічого."
  mining_survey_events.43.title: "Земля не дає нічого"
  mining_survey_events.43.desc: "Ґрунт у долині, за чутками, мав бути багатим на [ShowGoodsName('saltpeter')]. Місцеві селяни розповідали, що їхні діди щовесни збирали білий наліт зі скельної стіни. Рудокопи вже перекопали, вилугували та випарували ґрунт у десятку місць по всій долині — і не добули майже нічого цінного. Пороховий майстер, побачивши мізерний вихід, припускає, що старі поклади [ShowGoodsNameWithNoTooltip('saltpeter')] могли вичерпати ті самі селяни, чиї діди оповідали ці бувальщини. Тепер долина позбавлена [ShowGoodsNameWithNoTooltip('saltpeter')]."
  mining_survey_events.43.a: "Полишити долину. Ми не зможемо виробляти [ShowGoodsNameWithNoTooltip('saltpeter')] там, де мертвий ґрунт."
  mining_survey_events.43.historical_info: "Ґрунти, багаті на селітру, не були невичерпними. Природний перебіг утворення селітри у вогкій, угноєній землі тривав роками і легко виснажувався через невпинний видобуток. Тому німецький звичай #italic Salpetersieder#! передбачав систематичне впорядкування штучних #italic Salpeterplantagen#! — куп гною, вапна та попелу, які роками витримували й обробляли для отримання сталого виходу селітри. Перехід від пошуку селітри до її виробництва став важливим поступом у раціоналізації доіндустріального виготовлення пороху."