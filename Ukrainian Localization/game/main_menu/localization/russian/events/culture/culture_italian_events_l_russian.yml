l_russian:
 italian_renaissance_culture.1.title: "Борьба за шерсть с Флоренцией"
 italian_renaissance_culture.1.desc: "Господствующее положение торговых гильдий #TOOLTIP:LOCATION,florence,X #L Флоренции#!#! — главных торговцев #TOOLTIP:GOODS,wool,X #L шерстью#!#! в #TOOLTIP:REGION,italy_region,X #L Италии#!#! — вскоре будто вот-вот пошатнётся: [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] твёрдо верят, что наращивание производства #L [ROOT.GetCountry.GetAdjective|l]ой#! шерсти — первый шаг к неизбежному спасению мировых рынков из мёртвой хватки флорентийских купцов, и главную роль в этом непременно сыгра[ROOT.GetCountry.Custom('end_etyut')] [ROOT.GetCountry.GetNameWithNoTooltip].\n\nЕсли [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] предоставит достаточные средства, то некоторые [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] даже согласны учредить новые торговые гильдии, чтобы поддержать рост [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ой шерстяной промышленности. Впрочем, некоторые придворные считают иначе: по их мнению, [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] должны сохранить самоуправление во всём, что касается производства шерсти."
 italian_renaissance_culture.1.a: "Пусть [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] учреждают гильдии шерстяников."
 italian_renaissance_culture.1.b: "Пусть [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')|l] сохраняют самоуправление в вопросах производства шерсти."
 ita_culture_rival_wool_guild_locations.tt: "Все принадлежащие нам [Concept('locations', 'районы')|e] в #TOOLTIP:REGION,italy_region,X #L Италии#!#!, где производится шерсть, получат модификатор «[ShowModifier('italian_culture_rival_wool_trade')]» на 60 лет и получат #G +1,00#! к расширению (если уровень не максимален)"
 italian_renaissance_culture.2.title: "Вымирание сельской местности"
 italian_renaissance_culture.2.desc: "После того как по нашим краям прокатилась #TOOLTIP:SITUATION,black_death,X #L Чёрная смерть#!#!, сельские районы #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! резко обезлюдели. И хотя чума не пощадила и [target_location.Custom('LR_ACC')|l] [target_location.GetName], ей всё-таки не удалось сломить народ: многие стремятся перебраться сюда в надежде вновь разжиться местными богатствами, о которых на время пришлось позабыть из-за болезни.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] же считает, что сейчас нам представилась отличная возможность превратить [target_location.Custom('LR_ACC')|l] [target_location.GetNameWithNoTooltip] в город, а заодно — отстроить разрушенное, однако если [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] начнут поголовно покидать сельские районы, последствия для [ROOT.GetCountry.Custom('CL_GEN')] будут самыми неприятными."
 italian_renaissance_culture.2.a: "Поощрить переезд в [target_location.Custom('LR_ACC')|l] [target_location.GetNameWithNoTooltip]."
 italian_renaissance_culture.2.b: "Оказать помощь сельской местности, чтобы замедлить миграцию."
 italian_renaissance_culture.3.title: "Повторное открытие древнегреческой мысли"
 italian_renaissance_culture.3.desc: "На волне распространения в #TOOLTIP:REGION,italy_region,X #L Италии#!#! идеалов #TOOLTIP:AGE,age_2_renaissance,X #L Возрождения#!#! у #TOOLTIP:CULTUREGROUP,italian_group,X #L итальянских#!#! учёных мужей возник немалый интерес к трудам древних #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греков#!#!: добыть, а затем перевести какое-либо античное произведение считается весьма почётным делом. Это замечает и [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]; многие советники, искренне ратующие за превращение [ROOT.GetCountry.Custom('CL_GEN')] в одну из величайших держав Италии, считают, что [target_character.GetName] [Select_CString(target_character.IsFemale, 'должна', 'должен')] поддержать стремления учёных."
 italian_renaissance_culture.3.a: "Поощрить повторное открытие мудрости древних!"
 italian_renaissance_culture.3.b: "Предложить им покровительство со стороны государства."
 italian_renaissance_culture.3.c: "Мы останемся верны традициям."
 encourage_humanist_thought_for_rewards_tt: "Способствование переходу к #TOOLTIP:SOCIETAL_VALUE,spiritualist_vs_humanist,X #L гуманизму#!#! приведёт к тому, что [ROOT.GetCountry.GetCapital.GetName] станет важным средоточием гуманистической мысли"
 italian_renaissance_culture.4.title: "[target_location.GetNameWithNoTooltip] — средоточие гуманизма"
 italian_renaissance_culture.4.desc: "Вдохновлённые идеалами #TOOLTIP:AGE,age_2_renaissance,X #L Возрождения#!#! #TOOLTIP:REGION,italy_region,X #L итальянцы#!#! начали вновь открывать для себя литературу древних #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греков#!#!, переведённую с византийских рукописей. Многие мыслители Италии, впервые прикоснувшиеся к давно позабытым произведениям, настолько вдохновились прочитанным, что решили целиком посвятить себя делу гуманизма. Благодаря покровительству, которое им оказывает [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]$ #L [ROOT.GetCountry.GetAdjective|l]ой#! державы, [target_location.GetName] сегодня считается одним из важнейших мест Италии, где процветают идеи #TOOLTIP:SOCIETAL_VALUE,spiritualist_vs_humanist,X #L гуманизма#!#!; [target_location.GetRank.GetName|l] манит многих учёных и мыслителей. И поскольку #TOOLTIP:AGE,age_2_renaissance,X #L Возрождение#!#! лишь набирает размах, [target_location.GetNameWithNoTooltip], несомненно, ещё долго будет сохранять своё сегодняшнее положение."
 italian_renaissance_culture.4.a: "[target_location.GetNameWithNoTooltip] станет светочем гуманистической мысли в Италии."
 italian_renaissance_culture.4.b: "Ограничим распространение идей гуманизма."
 italian_renaissance_culture.5.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] обращает внимание на подающего надежды творца"
 italian_renaissance_culture.5.desc: "Эпоха #TOOLTIP:AGE,age_2_renaissance,X #L Возрождения#!#! стала подлинным благом для #TOOLTIP:REGION,italy_region,X #L Италии#!#!: выдающимся творцам, идущим сегодня к славе, уже давно нет счёта. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U], в частности, считает, что один из таких творцов — [target_artist.GetName], о [Select_CString(target_artist.IsFemale, 'которой', 'котором')] то и дело говорит [ROOT.GetCountry.GetCapital.GetName], — заслуживает покровительства со стороны государства. Советники считают, что [target_character.GetName] поступит правильно, если согласится на это, поскольку [target_artist.GetNameWithNoTooltip] подаёт большие надежды и со временем наверняка станет одним из главных достояний Италии."
 italian_renaissance_culture.5.a: "Наймём [Select_CString(target_artist.IsFemale, 'её', 'его')] — пусть служит при дворе!"
 italian_renaissance_culture.5.b: "Нам не нужны [Select_CString(target_artist.IsFemale, 'её', 'его')] услуги."
 italian_renaissance_culture.6.title: "[target_location.GetNameWithNoTooltip] — распространитель идей гуманизма"
 italian_renaissance_culture.6.desc: "[ROOT.GetCountry.GetCapital.GetName] сегодня — пристанище выдающихся мыслителей родом из [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip], проповедников идей #TOOLTIP:SOCIETAL_VALUE,spiritualist_vs_humanist,X #L гуманизма#!#! и распространителей выполненных недавно переводов литературы древних #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греков#!#! среди местного населения. И хотя [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] во многом также проявляет интерес к переведённым трудам, некоторые предостерегают нас от чрезмерного увлечения гуманизмом: он способен пошатнуть стабильность державы."
 italian_renaissance_culture.6.a: "Разрешить учёным распространять переведённую литературу."
 italian_renaissance_culture.6.b: "Ограничить распространение переводов."
 italian_renaissance_culture.7.title: "Покровительство новым искусствам"
 italian_renaissance_culture.7.desc: "Многие [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] пострадали от #TOOLTIP:SITUATION,black_death,X #L Чёрной смерти#!#! не только телесно: расходы для купцов значительно выросли, поскольку перевозить товары на далёкие расстояния оказалось сложнее, чем раньше; кроме того, подскочил спрос на предметы первой необходимости. С наступлением эпохи #TOOLTIP:AGE,age_2_renaissance,X #L Возрождения#!#! [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] частично стали отказываться от купеческого дела и начали оказывать покровительство новым искусствам.\n\nДля многих из них вложения уже отбились многократно, и поэтому некоторые считают, что и [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] напрасно не помогает новым искусствам развиваться. Возможно, нам тоже следует начать покровительствовать им?"
 italian_renaissance_culture.7.a: "Помочь новым искусствам развиваться."
 italian_renaissance_culture.7.b: "Лучше направить доход в казну государства."
 italian_renaissance_culture.8.title: "Выдающийся кондотьер из [ROOT.GetCountry.GetCapital.Custom('CL_GEN')]"
 italian_renaissance_culture.8.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] обсуждает последние новости: в #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_ACC')|L]#!#! [Select_CString(target_character_2.IsFemale, 'прибыла', 'прибыл')] известный кондотьер [target_character_2.GetNameWithNoTooltip] — человек, одержавший не одну славную победу, а потому, как считают при дворе, способный сослужить нам неплохую службу. Возможно, следует направить [Select_CString(target_character_2.IsFemale, 'ей', 'ему')] приглашение, пока [Select_CString(target_character_2.IsFemale, 'она', 'он')] ещё здесь: #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! пригодятся умелые воители, если вдруг завтра в двери постучится война."
 italian_renaissance_culture.8.a: "Нанять [Select_CString(target_character_2.IsFemale, 'её', 'его')]: пусть [target_character_2.GetNameWithNoTooltip] заботится о спокойствии [ROOT.GetCountry.Custom('CL_GEN')]."
 italian_renaissance_culture.8.b: "Нам не нужны [Select_CString(target_character_2.IsFemale, 'её', 'его')] познания в военном деле."
 italian_renaissance_culture.9.title: "[ROOT.GetCountry.GetNameWithNoTooltip] манит кондотьеров своим влиянием"
 italian_renaissance_culture.9.desc: "#L [ROOT.GetCountry.GetAdjective|U]ое#! влияние всё шире охватывает #TOOLTIP:REGION,italy_region,X #L Италию#!#!, и [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] всё чаще принимает у себя кондотьеров — командиров компаний наёмников, стремящихся поступить на службу к могущественной державе. Некоторые придворные считают, что не стоит отказывать этим людям, поскольку расширение границ [ROOT.GetCountry.Custom('CL_GEN')] привело к резкому росту расходов на сбор армии; другие же опасаются, что кондотьеров ведут жажда наживы и холодный расчёт: они хотят, чтобы мы стали зависимы от наёмных солдат, а значит, не могли отказаться от их услуг."
 italian_renaissance_culture.9.a: "Постараемся завоевать благосклонность кондотьеров и возьмём их на службу."
 italian_renaissance_culture.9.b: "Не стоит рисковать: мы можем оказаться у них в долгу."
 italian_renaissance_culture.10.title: "[condottieri_company.GetNameWithNoTooltip] требует больше жалования"
 italian_renaissance_culture.10.desc: "Известная компания — [condottieri_company.GetName] — обратилась к нам с официальным требованием: её кондотьер считает, что [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] #L [ROOT.GetCountry.GetAdjective|l]ой#! державы платит недостаточно и слишком недооценивает мастерство его солдат.\n\nМаловероятно, что [condottieri_company.GetNameWithNoTooltip] пойдёт против соглашения с [ROOT.GetCountry.Custom('CL_INST')], однако если мы не уступим, вряд ли в будущем эти люди будут служить нам так же охотно, как сегодня."
 italian_renaissance_culture.10.a: "Согласиться с требованиями, что выдвигает [condottieri_company.GetNameWithNoTooltip]."
 italian_renaissance_culture.10.b: "Отказаться выплачивать дополнительное жалование."
 italian_renaissance_culture.11.title: "Распространение флорентийской культуры"
 italian_renaissance_culture.11.desc: "[ROOT.GetCountry.GetCapital.GetName] пользуется значительным влиянием, однако даже [ROOT.GetCountry.GetCapital.GetRank.GetName|l] такого масштаба меркнет перед лицом знаменитой #TOOLTIP:LOCATION,florence,X #L Флоренции#!#! — одного из самых примечательных #TOOLTIP:LOCATIONRANK,city,X #L городов#!#! Италии.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle|U], ратуя за укрепление престижа [ROOT.GetCountry.GetCapital.Custom('CL_GEN')], предлагает перенять часть культурных особенностей Флоренции."
 italian_renaissance_culture.11.a: "Перенять часть флорентийской культуры."
 italian_renaissance_culture.11.b: "Встать на защиту родной культуры [ROOT.GetCountry.GetCapital.Custom('CL_GEN')]."
 italian_renaissance_culture.12.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')|U]: помочь или забыть?"
 italian_renaissance_culture.12.desc: "От #TOOLTIP:SITUATION,black_death,X #L Чёрной смерти#!#! так или иначе пострадали все общественные классы #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! без исключения, однако самый сильный удар приняли на себя [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l]. Пока вдохновлённые #TOOLTIP:AGE,age_2_renaissance,X #L Возрождением#!#! [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] вкладывают средства в развитие искусств, а [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ая элита стремится к новым культурным высотам, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')|l] продолжают страдать от последствий чумы.\n\nЧтобы помочь несчастным восстановиться, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] предлагает сократить государственные средства, выделяемые в поддержку искусств, и перенаправить их в пользу пострадавших от Чёрной смерти."
 italian_renaissance_culture.12.a: "Мы продолжим оказывать покровительство искусству."
 italian_renaissance_culture.12.b: "Перенаправить средства, чтобы [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')|l] смогли встать на ноги."
 italian_renaissance_culture.13.title: "[target_artist.GetNameWithNoTooltip] переводит древнегреческую рукопись"
 italian_renaissance_culture.13.desc: "Полный перевод старинной рукописи с языка древних #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греков#!#!, который [Select_CString(target_artist.IsFemale, 'выполнила', 'выполнил')] [target_artist.GetName], вызвал живейший интерес со стороны учёных #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, и теперь многие из них страстно желают завладеть этим трудом. Некоторые, впрочем, видят в сложившейся обстановке возможность укрепить престиж [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ой державы, а поэтому считают, что [target_character.GetName] [Select_CString(target_artist.IsFemale, 'должна', 'должен')] поспособствовать распространению переведённой рукописи в странах #TOOLTIP:CONTINENT,europe,X #L Европы#!#!."
 italian_renaissance_culture.13.a: "Да славится [target_artist.GetNameWithNoTooltip] и [Select_CString(target_artist.IsFemale, 'её', 'его')] перевод!"
 italian_renaissance_culture.13.b: "Распространим [Select_CString(target_artist.IsFemale, 'её', 'его')] труд как можно шире!"
 italian_renaissance_culture.13.c: "Пусть доступ к этой работе имеет только [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]."
 italian_renaissance_culture.14.title: "[target_artist.GetNameWithNoTooltip] и [Select_CString(target_artist.IsFemale, 'её', 'его')] таланты"
 italian_renaissance_culture.14.desc: "[target_character.GetName] считает, что [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] не зря покровительствует такому творцу, как [target_artist.GetName]: [Select_CString(target_artist.IsFemale, 'её', 'его')] творения неизменно пользуются одобрением верхушки общества. Высокопоставленные [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], влиятельные [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] — каждый из них так или иначе прикоснулся к трудам, которые создаёт [target_artist.GetNameWithNoTooltip], а [target_character.GetNameWithNoTooltip] сегодня пользуется ещё большим влиянием, чем прежде."
 italian_renaissance_culture.14.a: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] только выигрывает от [Select_CString(target_artist.IsFemale, 'её', 'его')] присутствия!"
 italian_renaissance_culture.15.title: "[ShowArtistTypeName('architect')|U]-знаменитость"
 italian_renaissance_culture.15.desc: "[target_artist.GetName] пользуется в #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! значительной славой: среди [Select_CString(target_artist.IsFemale, 'её', 'его')] достижений — несколько архитектурных проектов в #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_PREP')|L]#!#!. Многие влиятельные [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] целыми семействами оказывают покровительство этому человеку. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] считает, что нам следует нанять [Select_CString(target_artist.IsFemale, 'её', 'его')] на службу, поскольку именно [target_artist.GetName], безупречно [Select_CString(target_artist.IsFemale, 'разбирающаяся', 'разбирающийся')] в классической архитектуре, может сыграть важнейшую роль в архитектурном возрождении [ROOT.GetCountry.GetCapital.Custom('CL_GEN')]."
 italian_renaissance_culture.15.a: "Предложим [Select_CString(target_artist.IsFemale, 'ей', 'ему')] покровительство со стороны государства."
 italian_renaissance_culture.15.b: "Нас не интересуют архитектурные проекты."
 italian_renaissance_culture.16.title: "[target_artist.GetNameWithNoTooltip] просит у двора дополнительные ресурсы"
 italian_renaissance_culture.16.desc: "[target_artist.GetName] [Select_CString(target_artist.IsFemale, 'вынуждена', 'вынужден')] обратиться к нам за помощью: создание творения в классическом духе приостановилось из-за нехватки средств, а выделить их может только [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]. [target_artist.GetName] честно признаёт, что [Select_CString(target_artist.IsFemale, 'недооценила', 'недооценил')] размах и сложность своего начинания, и обещает, что [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] не пожалеет, если всё-таки пойдёт [Select_CString(target_artist.IsFemale, 'ей', 'ему')] навстречу, — хотя бы потому, что наша культура обретёт ещё большую славу."
 italian_renaissance_culture.16.a: "Предоставим [Select_CString(target_artist.IsFemale, 'ей', 'ему')] всё необходимое."
 italian_renaissance_culture.16.b: "Нам это не по карману."
 italian_renaissance_culture.17.title: "[target_rival_artist.GetArtistType.GetNameWithNoTooltip] в [target_rival.Custom('CL_PREP')] проявляет недовольство"
 italian_renaissance_culture.17.desc: "[target_rival_artist.GetName] пользуется в #TOOLTIP:REGION,italy_region,X #L Италии#!#! определённой творческой славой, пусть даже [Select_CString(target_rival_artist.IsFemale, 'она', 'он')] и трудится над своими творениями в державе, которую мы считаем соперником, — в #ONCLICK:COUNTRY,[target_rival.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_rival.Custom('CL_tt')],X [target_rival.Custom('CL_PREP')|L]#!#!. Недавно, впрочем, до нас дошли слухи, что [Select_CString(target_rival_artist.IsFemale, 'она недовольна', 'он недоволен')] покровительством со стороны [target_rival.Custom('CL_GEN')].\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] видит в этом удачную возможность, поэтому советники призывают нас заключить тайное соглашение — они надеются, что [target_rival_artist.GetNameWithNoTooltip] перейдёт к нашему двору. Тогда, во-первых, влияние [target_rival.Custom('CL_GEN')] будет подорвано, во-вторых, [target_rival_artist.GetArtistType.GetName|l] будет трудиться уже во благо нашей державы."
 italian_renaissance_culture.17.a: "Поскорее постараемся заключить соглашение: пусть [target_rival_artist.GetNameWithNoTooltip] работает на нас!"
 italian_renaissance_culture.17.b: "Не стоит нанимать творцов, как-либо связанных с [target_rival.Custom('CL_INST')]."
 italian_renaissance_culture.18.title: "[target_artist.GetNameWithNoTooltip] и искусство масляной живописи"
 italian_renaissance_culture.18.desc: "На протяжении многих лет неповторимая техника фламандских художников — мастеров масляной живописи оставалась достоянием исключительно Нидерландов. Однако [Select_CString(target_artist.IsFemale, 'вернувшаяся', 'вернувшийся')] недавно из Нидерландов в #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_ACC')|L]#!#! [target_artist.GetName] надеется на основе этих знаний создать новую, исключительно #TOOLTIP:REGION,italy_region,X #L итальянскую#!#! традицию написания картин маслом.\n\nМногие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], желающие видеть появление в #TOOLTIP:REGION,italy_region,X #L Италии#!#! новых традиций, заявляют, что [target_character.GetName] [Select_CString(target_character.IsFemale, 'должна', 'должен')] оказать этому творцу покровительство."
 italian_renaissance_culture.18.a: "[Select_CString(target_artist.IsFemale, 'Её', 'Его')] техника неповторима. Мы согласны поддержать [Select_CString(target_artist.IsFemale, 'её', 'его')]!"
 italian_renaissance_culture.18.b: "Подобный подход к живописи нас не интересует."
 italian_renaissance_culture.19.title: "[target_artist.GetNameWithNoTooltip] из Флоренции"
 italian_renaissance_culture.19.desc: "В #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_ACC')|L]#!#! [Select_CString(target_artist.IsFemale, 'прибыла', 'прибыл')] [target_artist.GetName] — творец, [Select_CString(target_artist.IsFemale, 'снискавшая', 'снискавший')] определённую славу во #TOOLTIP:LOCATION,florence,X #L Флоренции#!#! и теперь [Select_CString(target_artist.IsFemale, 'творящая', 'творящий')] на заказ, если об этом попросят [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]. Однако новость о присутствии [Select_CString(target_artist.IsFemale, 'её', 'его')] в [ROOT.GetCountry.GetCapital.Custom('CL_PREP')] услышали и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l]; они проявляют глубокий интерес к деятельности этого человека, а потому обратились к нам с просьбой: пусть [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] тоже поручит [Select_CString(target_artist.IsFemale, 'ей', 'ему')] сотворить что-нибудь для себя — в таком случае [target_artist.GetNameWithNoTooltip] ещё не скоро уедет из [ROOT.GetCountry.GetCapital.Custom('CL_GEN')].\n\nОднако следует учесть, что [ShowArtistTypeName('philosopher')|l] из Флоренции будет требовать на своё содержание больше, чем обычно предоставляет [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]."
 italian_renaissance_culture.19.a: "Расходы велики, однако мы с радостью примем [Select_CString(target_artist.IsFemale, 'её', 'его')] у себя."
 italian_renaissance_culture.19.b: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] не сможет себе это позволить."
 italian_renaissance_culture.20.title: "[target_artist.GetNameWithNoTooltip] для [target_country.Custom('longname_ua_wntt_GEN')]?"
 italian_renaissance_culture.20.desc: "Славное имя «[target_artist.GetName]» сегодня известно уже далеко за пределами #TOOLTIP:REGION,italy_region,X #L Италии#!#!, и поэтому в надежде, что [target_artist.GetNameWithNoTooltip] согласится оказать им свои услуги, [target_country.GetGovernment.GetCourtTitle|l] [target_country.Custom('longname_ua_GEN')] обращается к #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#!. [target_country.GetAdjectiveWithNoTooltip|U]ая держава готова заплатить немалые деньги, лишь бы власти [ROOT.GetCountry.Custom('CL_GEN')] не стали препятствовать отъезду творца, и [target_artist.GetNameWithNoTooltip] [Select_CString(target_artist.IsFemale, 'смогла', 'смог')] перебраться в [target_country.Custom('CL_ACC')]."
 italian_renaissance_culture.20.a: "Мы примем [target_country.GetAdjectiveWithNoTooltip|l]ие деньги — пусть [target_artist.GetShortNameWithNoTooltip] уезжает."
 italian_renaissance_culture.20.b: "[target_artist.GetShortNameWithNoTooltip] останется под нашим покровительством."
 italian_renaissance_culture.21.title: "Покровительство Ренессансного искусства обходится слишком дорого"
 italian_renaissance_culture.21.desc: "Со временем стало очевидно, что всестороннее покровительство искусствам #TOOLTIP:AGE,age_2_renaissance,X #L Возрождения#!#! обходится #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! слишком дорого. [ROOT.GetCountry.GetAdjectiveWithNoTooltip|U]ая казна пустеет день ото дня, и если мы не предпримем решительных действий, державе грозит катастрофа. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U], впрочем, считает (хотя с этим согласны не все), что со временем оказываемое творцам покровительство себя полностью оправдает."
 italian_renaissance_culture.21.a: "Сократить расходы на покровительство, чтобы спасти казну."
 italian_renaissance_culture.21.b: "Мы продолжим покровительствовать искусству!"
 italian_renaissance_culture.22.title: "[target_location.GetNameWithNoTooltip] — средоточие искусства и культуры эпохи Возрождения"
 italian_renaissance_culture.22.desc: "Благодаря значительным усилиям со стороны [ROOT.GetCountry.GetLongName], в первую очередь финансовым, [target_location.GetName] сегодня — один из важнейших очагов, где куётся искусство #TOOLTIP:AGE,age_2_renaissance,X #L Возрождения#!#!; возможно, во всей #TOOLTIP:REGION,italy_region,X #L Италии#!#!, а возможно — даже во всей #TOOLTIP:CONTINENT,europe,X #L Европе#!#!. В #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_ACC')|l]#!#! стремятся выдающиеся творцы и учёные со всего континента, и разговорам о том, как [target_location.GetNameWithNoTooltip] несёт в себе дух времени, нет конца."
 italian_renaissance_culture.22.a: "[target_location.GetNameWithNoTooltip] ещё много столетий будет культурной гордостью Европы!"
 italian_renaissance_culture.22.b: "Воспользоваться доброй славой [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip], чтобы укрепить свой престиж"
 italian_renaissance_culture.23.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_on_the_fates_of_famous_men')]"
 italian_renaissance_culture.23.desc: "[Select_CString(target_artist.IsFemale, 'Одна', 'Один')] из знаменитейших творцов эпохи #TOOLTIP:AGE,age_2_renaissance,X #L Возрождения#!#! — [target_artist.GetName] — только что [Select_CString(target_artist.IsFemale, 'закончила', 'закончил')] очередной впечатляющий труд, озаглавленный [ShowWorkOfArtName('boccaccio_on_the_fates_of_famous_men')]. В нём описываются многие выдающиеся люди библейской и классической эпох, а также важнейшие фигуры прошедшего столетия. Этот труд весьма объёмен и ценен: если [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] вдруг захочет расстаться с ним, покупателю наверняка придётся заплатить существенную сумму."
 italian_renaissance_culture.23.a: "Удивительное произведение об исторических деятелях."
 italian_renaissance_culture.23.b: "Возможно, [Select_CString(target_artist.IsFemale, 'её', 'его')] трудом заинтересуются [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l]?"
 italian_renaissance_culture.24.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_the_decameron')]"
 italian_renaissance_culture.24.desc: "[target_artist.GetName] своими глазами [Select_CString(target_artist.IsFemale, 'видела', 'видел')], как бушует #TOOLTIP:SITUATION,black_death,X #L Чёрная смерть#!#!. Это сподвигло [Select_CString(target_artist.IsFemale, 'её', 'его')] написать [ShowWorkOfArtName('boccaccio_the_decameron')] — произведение, которым в значительной мере заинтересовались [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Разворачивающаяся во #TOOLTIP:LOCATION,florence,X #L Флоренции#!#! история посвящена десяти юношам и дамам, уехавшим за город, чтобы спастись от чумы. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] считает, что труд, над которым так старательно [Select_CString(target_artist.IsFemale, 'работала', 'работал')] [target_artist.GetLastNameWithNoTooltip], следует всячески распространить."
 italian_renaissance_culture.24.a: "Какой увлекательный сборник! Займёмся распространением [Select_CString(target_artist.IsFemale, 'её', 'его')] работы."
 italian_renaissance_culture.24.b: "Пусть им лучше будут владеть [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l]."
 italian_renaissance_culture.25.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_concerning_famous_women')]"
 italian_renaissance_culture.25.desc: "Не удовлетворившись достигнутым — выпуском трактата [ShowWorkOfArtName('boccaccio_on_the_fates_of_famous_men')] — [target_artist.GetName] [Select_CString(target_artist.IsFemale, 'опубликовала', 'опубликовал')] ещё одно произведение, на сей раз посвящённое знаменитым историческим деятелям, а конкретно — женщинам. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] искренне удивляется: похоже, [target_artist.GetLastNameWithNoTooltip] действительно проявляет неподдельный интерес к этим личностям. Мы не сомневаемся, что [ShowWorkOfArtName('boccaccio_concerning_famous_women')], подобно предыдущим работам [Select_CString(target_artist.IsFemale, 'писательницы', 'писателя')], станет для нас спасительной соломинкой на случай, если государственная казна опустеет."
 italian_renaissance_culture.25.a: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] будет тщательно беречь это произведение."
 italian_renaissance_culture.25.b: "Пусть [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] продаст эту хронику на аукционе."
 italian_renaissance_culture.26.title: "[target_character_2.GetNameWithNoTooltip] рвётся к власти"
 italian_renaissance_culture.26.desc: "[target_character_2.GetName] пользуется во #TOOLTIP:LOCATION,florence,X #L Флоренции#!#! определённым влиянием: этот человек превосходно знает своё дело и всячески способствует распространению #TOOLTIP:SOCIETAL_VALUE,spiritualist_vs_humanist,X #L гуманистических#!#! идеалов #TOOLTIP:AGE,age_2_renaissance,X #L Возрождения#!#!. [Select_CString(target_character_2.IsFemale, 'Её', 'Его')] заслуги признаёт в том числе и [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]; некоторые даже считают, что [target_character_2.GetNameWithNoTooltip] [Select_CString(target_character_2.IsFemale, 'достойна', 'достоин')] заседать ни много ни мало в таком органе, как [ROOT.GetCountry.GetGovernment.GetCabinetTitle|l], — если, конечно, на это согласится [target_character.GetName]."
 italian_renaissance_culture.26.a: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] с радостью примет на службу такого человека."
 italian_renaissance_culture.26.b: "[ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle|U] такого рода нам пригодится — пусть [ROOT.GetCountry.GetGovernment.GetCabinetTitle|l] примет [Select_CString(target_character_2.IsFemale, 'её', 'его')] к себе."
 italian_renaissance_culture.26.c: "Мы не станем жаловать [Select_CString(target_character_2.IsFemale, 'ей', 'ему')] какие-либо особые привилегии."
 italian_renaissance_culture.27.title: "[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.27.desc: "Несмотря на многолетнее признание, которым [target_artist.GetName] пользуется среди жителей #TOOLTIP:REGION,italy_region,X #L Италии#!#!, [Select_CString(target_artist.IsFemale, 'её', 'его')] представления о светском образовании в полной мере нашли понимание только у богатых обитателей #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_GEN')|L]#!#!, где [target_artist.GetNameWithNoTooltip] сейчас проживает. Однако [ROOT.GetCountry.GetCapital.GetRank.GetName|l], как водится, не единого мнения: некоторые [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] недовольны [Select_CString(target_artist.IsFemale, 'её', 'его')] подходом к обучению, иные же просят, чтобы [target_character.GetName] предоставил [Select_CString(target_artist.IsFemale, 'ей', 'ему')] полноценное гражданство #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!."
 italian_renaissance_culture.27.a: "Наймём [Select_CString(target_artist.IsFemale, 'её', 'его')]!"
 italian_renaissance_culture.27.b: "[Select_CString(target_artist.IsFemale, 'Её', 'Его')] идеи чересчур радикальны."
 italian_renaissance_culture.28.title: "Основание Дома радости"
 italian_renaissance_culture.28.desc: "[target_artist.GetName], отныне [Select_CString(target_artist.IsFemale, 'полноправная гражданка', 'полноправный гражданин')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, распространяет своё учение среди многочисленных жителей [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Сейчас [Select_CString(target_artist.IsFemale, 'она', 'он')] пытается, надеясь на своё влиятельное положение, заручиться финансовой помощью, которую может предоставить только [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], и основать новую школу — #italic Casa Gioiosa#! («Дом радости»).\n\nХотя расходы будут велики, [ShowBuildingTypeNameWithNoTooltip('art_school')|l] в [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip] непременно повысит престиж [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ой державы во всей #TOOLTIP:REGION,italy_region,X #L Италии#!#!."
 italian_renaissance_culture.28.a: "Пусть будет им [ShowBuildingTypeNameWithNoTooltip('art_school')|l]!"
 italian_renaissance_culture.28.b: "Лучше основать университет с таким же названием."
 italian_renaissance_culture.28.c: "У нас нет денег на это начинание."
 italian_renaissance_culture.29.title: "[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.29.desc: "[target_artist.GetName], [Select_CString(target_artist.IsFemale, 'ученица', 'ученик')] такого известного мастера, как [target_artist_2.GetName], пользуется славой [Select_CString(target_artist.IsFemale, 'одной', 'одного')] из самых выдающихся учёных #TOOLTIP:REGION,italy_region,X #L Италии#!#!; [Select_CString(target_artist.IsFemale, 'ей', 'ему')], в частности, хорошо даются переводы рукописей с языка древних #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греков#!#!. Сегодня [target_artist.GetNameWithNoTooltip] пребывает в #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_PREP')|L]#!#! и строит далекоидущие планы: [Select_CString(target_artist.IsFemale, 'она', 'он')] надеется, что [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] #L [ROOT.GetCountry.GetAdjective|l]ой#! державы сможет оказать [Select_CString(target_artist.IsFemale, 'ей', 'ему')] покровительство, столь необходимое для работы с обнаруженными недавно греческими рукописями."
 italian_renaissance_culture.29.a: "Наймём [Select_CString(target_artist.IsFemale, 'её', 'его')]!"
 italian_renaissance_culture.29.b: "Мы не станем оказывать [Select_CString(target_artist.IsFemale, 'ей', 'ему')] покровительство!"
 italian_renaissance_culture.30.title: "[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.30.desc: "#TOOLTIP:REGION,italy_region,X #L Итальянская#!#! школа масляной живописи ещё не успела как следует установиться, однако уже сейчас нам известны имена некоторых выдающихся #TOOLTIP:ARTIST,painter,X #L художников#!#! — первопроходцев этого направления. Среди них — [target_artist.GetName], чьи картины неизменно пользуются большим спросом при #TOOLTIP:CULTUREGROUP,italian_group,X #L итальянских#!#! дворах.\n\nМногие [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] надеются, что [target_character.GetName] предложит [Select_CString(target_artist.IsFemale, 'ей', 'ему')] своё покровительство, и тогда [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] державы обретёт новую красоту."
 italian_renaissance_culture.30.a: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] не станет отказываться от [Select_CString(target_artist.IsFemale, 'её', 'его')] картин: это повысит наш престиж."
 italian_renaissance_culture.30.b: "Мы не можем себе это позволить."