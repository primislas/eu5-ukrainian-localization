  maghrebi_cultural_change_events.1004.title: "Нахабство андалуських переселенців"
  maghrebi_cultural_change_events.1004.desc: "Останніми роками наші брати за #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламською#!#! вірою — #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусці#!#! дедалі частіше тікають з #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!, рятуючись від жорстоких переслідувань. Однак у новому домі, що дарував їм [ROOT.GetCountry.GetReligion.GetGodName], вони поводяться вкрай обурливо: ці зухвалі переселенці насмілюються відкрито нарікати на умови життя в #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#!, вихваляючи при цьому тих, хто лишився на землях ненависних їм #TOOLTIP:RELIGIONGROUP,christian,X #L християнських#!#! країн!\n\nВисловлюється з цього приводу й [target_pop2.GetName]: деяк[ROOT.GetCountry.Custom('clergy_yiaei')] місцев[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] назива[ROOT.GetCountry.Custom('clergy_yeyut')] подібне ставлення майже відступництвом від віри."
  maghrebi_cultural_change_events.1004.a: "Якщо в Іберії так добре живеться, то що вони забули тут?"
  maghrebi_cultural_change_events.1004.b: "Постараємося втихомирити обидві сторони."