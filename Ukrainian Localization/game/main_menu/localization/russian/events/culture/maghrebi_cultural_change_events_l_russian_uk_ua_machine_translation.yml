  maghrebi_cultural_change_events.1004.title: "Нахабство поселенців-андалусців"
  maghrebi_cultural_change_events.1004.desc: "Останні роки відзначилися великим припливом представників [ShowCultureName('andalusi')]ої культури з краю [ShowRegionName('iberia_region')] через несамовиті переслідування, з якими там стикаються наші мусульманські брати. Попри нову домівку, яку [ROOT.GetCountry.GetReligion.GetGodName] дарував їм, ці зухвалі новоприбульці мають нахабство відкрито скаржитися на рівень життя в краю [ShowRegionName('maghreb_region')], водночас вихваляючи тих, хто залишився на землях підступних християнських держав!\n\nВідомий представник стану [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] з [target_pop2.GetName] порівняв таке ставлення з «майже відпадінням від віри»."
  maghrebi_cultural_change_events.1004.a: "Якщо в краю [ShowRegionNameWithNoTooltip('iberia_region')] так добре, чому б їм не повернутися?"
  maghrebi_cultural_change_events.1004.b: "Спробувати заспокоїти обидві сторони."
