l_russian:
  culture_greek.1.title: "[target_character.GetNameWithNoTooltip] висуває звинувачення"
  culture_greek.1.desc: "Наша репутація благочестивої #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ої#! країни добре відома сусідам, однак усередині патріархату, схоже, назрівають проблеми.\n\n[target_character.GetName] [Select_CString(target_character.IsFemale, 'заявила', 'заявив')], що [target_character2.GetName] відкрито нехтує своїми релігійними обов’язками. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|U] нерідко скарж[ROOT.GetCountry.Custom('clergy_ytat')]ся на погане поводження з [Select_CString(target_character2.IsFemale, 'її', 'його')] боку, [target_character2.GetSheHe] неналежно поводиться під час богослужінь, та й загалом не поважає [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip|l]і релігійні традиції нашої країни.\n\nБагато хто вважає ці звинувачення дещо перебільшеними, але ні для кого не є таємницею, що [target_character2.GetNameWithNoTooltip] ставить себе вище будь-яких церковних установ і демонструє до них крайню байдужість. Не дивно, що частина наших [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip|l]их підданих вважає, що [target_character2.GetSheHe] [Select_CString(target_character2.IsFemale, 'недостойна', 'недостойний')] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l]."
  culture_greek.1.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|U] не зна[ROOT.GetCountry.Custom('clergy_yeyut')], про що говор[ROOT.GetCountry.Custom('clergy_ytyat')]!"
  culture_greek.1.b: "Мабуть, [target_character2.GetNameWithNoTooltip] [Select_CString(target_character2.IsFemale, 'повинна', 'повинен')] поводитися стриманіше."
  culture_greek.1.c: "[target_character2.GetNameWithNoTooltip] — [Select_CString(target_character2.IsFemale, 'легітимна', 'легітимний')] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l], і це не обговорюється!"
  culture_greek.1.d: "Публічний виступ заспокоїть невдоволених."
  culture_greek.2.title: "[target_character2.GetNameWithNoTooltip] отримує благословення патріарха"
  culture_greek.2.desc: "[target_character2.GetName] [Select_CString(target_character2.IsFemale, 'перетворила', 'перетворив')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! на високорозвинену та чудово організовану країну, і [target_character.GetName] [Select_CString(target_character.IsFemale, 'виявила', 'виявив')] бажання більше дізнатися про [Select_CString(target_character2.IsFemale, 'її', 'його')] методи управління. Прибувши до [target_capital.Custom('LR_ACC')|l] [target_capital.GetName], [target_character.GetSheHe] [Select_CString(target_character.IsFemale, 'була вражена', 'був вражений')] тим, як багато уваги тут приділяється фундаментальним основам #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ої#! віри. Місцеві монастирі утримуються в чудовому стані, [ROOT.GetCountry.GetGovernment.GetGovernmentType.GetName|l] не шкодує коштів на їхнє оздоблення. Вздовж доріг вибудувані незліченні мармурові кандилакії, що нагадують про чудесний порятунок від лиха або про померлих близьких.\n\nПрибувши до двору, [target_character.GetNameWithNoTooltip] зазначає, що багато придворних напам’ять знають Святе Письмо і часто моляться перед іконами Спасителя, а в покоях, де [target_character2.GetNameWithNoTooltip] обговорює державні справи, витає запах ладану."
  culture_greek.2.a: "Патріарх точно дасть нам своє благословення."
  culture_greek.2.b: "Одного благословення мало. [target_location.GetRank.GetName] [target_capital.GetNameWithNoTooltip] має стати ще кращим!"
  culture_greek.3.title: "Реформація [target_country.Custom('preposition_uv')] [target_country.Custom('CL_PREP')]"
  culture_greek.3.desc: "#TOOLTIP:CONTINENT,europe,X #L Європу#!#! захлеснула хвиля Реформації, і [target_character.GetName] зі своїми прихильниками все частіше говорить про необхідність встановити дипломатичні відносини з протестантськими країнами — наприклад, [target_country.Custom('preposition_zzi')] #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_INST')|L]#!#!.\n\nОчевидно, що [papal_capital.GetName] — наш спільний ворог. Як і ми, [target_country.GetAdjectiveWithNoTooltip|l]і [target_country.GetGovernment.GetEstateName('crown_estate')|l] прагн[ROOT.GetCountry.Custom('crown_eut')] позбутися вад #TOOLTIP:RELIGION,$catholic_tt$,X #L католицтва#!#! і правити без огляду на папу. Проте між нашими доктринами залишаються серйозні розбіжності — наслідки вікового католицького панування, які наш [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] вважає неприйнятними."
  culture_greek.3.a: "Ворог мого ворога — мій друг."
  culture_greek.3.b: "Ми не потребуємо допомоги єретиків."
  culture_greek.3.c: "[target_character2.GetShortNameWithNoTooltip] [Select_CString(target_character2.IsFemale, 'виставила', 'виставив')] нас ідіотами!"
  culture_greek.4.title: "Хто ж такі «греки»?"
  culture_greek.4.desc: "Піднесення самовладдя, а також формування нових уявлень про країну та народ кардинально змінили наше мислення. Раніше ми майже не замислювалися про подібне, адже основою національної культури здавна вважалася віра. Але тепер, коли навіть серед простолюду з’явилися свої видатні мислителі, в освічених колах все частіше ставлять одне питання: хто ж такі «греки»?\n\nДеякі переконані, що характерна для мови #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! диглосія сприяє збереженню найглибшої прірви, що розділяє різні верстви нашого суспільства. Дійсно, чиновники та [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] з одного боку та [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] з іншого нічим не схожі один на одного, у них абсолютно різні звичаї, а розмовляють вони різними діалектами.\n\nПодібна ситуація викликає наростаюче невдоволення. Люди вимагають змін, вони прагнуть подолати цей розрив і прийти до справжньої національної єдності."
  culture_greek.4.a: "Повільно, але впевнено ми об’єднаємо всіх своїх підданих."
  culture_greek.4.b: "Подібні зміни дестабілізують існуючу соціальну ієрархію."
  culture_greek.4.c: "Немає жодних культурних відмінностей — все це лише варіації однієї культури."
  greek_culture_greek_peasants_will_gain_satisfaction: "Всі [Concept('pops', 'групи населення')|e] #TOOLTIP:CULTUREGROUP,greek_group,X #L еллінської#!#! [Concept('culture', 'культури')|e] поза [Concept('rural_locations', 'сільськими місцевостями')|e], які є #TOOLTIP:POPTYPE,peasants,X #L селянами#!#! або #TOOLTIP:POPTYPE,laborers,X #L робітниками#!#!, отримають [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  culture_greek.5.title: "[target_character.GetNameWithNoTooltip] та [Select_CString(target_character.IsFemale,'її', 'його')] кар’єрне зростання"
  culture_greek.5.desc: "[target_character.GetName] [Select_CString(target_character.IsFemale,'одержала', 'одержав')] безліч славних перемог — досить згадати такі місця битв, як [victory_location1.GetName] або [victory_location2.GetName]. В очах народу [target_character.GetSheHe] блискучий стратиг, вірний меч Господа, [Select_CString(target_character.IsFemale, 'переможниця', 'переможець')] ворогів #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, [Select_CString(target_character.IsFemale, 'яку', 'якого')] [Select_CString(target_character2.IsFemale, 'благословила сама', 'благословив сам')] [target_character2.GetName].\n\nБагато впливових членів двору також відчувають до [Select_CString(target_character.IsFemale,'неї', 'нього')] величезну повагу і захоплено слухають розповіді про [Select_CString(target_character.IsFemale,'її', 'його')] останню перемогу при [victory_location3.Custom('LR_PREP')|l] [victory_location3.GetName]. [target_character2.GetNameWithNoTooltip] неабияк [Select_CString(target_character2.IsFemale, 'стривожена', 'стривожений')] тим, яким впливом [target_character.GetNameWithNoTooltip] володіє при дворі. З іншого боку, можна звернути [Select_CString(target_character.IsFemale,'її', 'його')] популярність на користь династії [target_character2.GetDynasty.GetName] і зміцнити її владу над [ROOT.GetCountry.Custom('CL_INST')]."
  culture_greek.5.a: "Нам потрібно більше героїв, подібних до [Select_CString(target_character.IsFemale, 'неї', 'нього')]."
  culture_greek.5.b: "[target_character.GetShortNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'стала занадто впливова', 'став занадто впливовий')]. Треба б підрізати [Select_CString(target_character.IsFemale, 'їй', 'йому')] крила…"
  culture_greek.5.c: "Триматимемо [Select_CString(target_character.IsFemale, 'її', 'його')] #italic ближче#! до нас, але ні на крок не підпускатимемо до політики."
  greek_culture_strategos_will_never_be_able_to_influence_politics: "Втративши можливість впливати на [Concept('courtiers', 'придворних')|e], [target_character.GetName] ніколи не посміє повалити нашу владу"
  greek_culture_strategos_will_never_get_the_opportunity_to_coup: "Не маючи жодної можливості впливати на [Concept('courtiers', 'придворних')|e], [target_character.GetName] ніколи не зможе організувати переворот"
  culture_greek.6.title: "Народний стратиг"
  culture_greek.6.desc: "Коли прославлений стратиг [target_character.GetName] у супроводі особистої варти проходить вулицями [target_capital.Custom('LR_GEN')|l] [target_capital.GetName], навколо збираються цілі натовпи охочих побачити [Select_CString(target_character.IsFemale, 'її', 'його')] на власні очі.\n\n[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')], [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] та [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] хором скандують [Select_CString(target_character.IsFemale, 'її', 'його')] ім’я: «[target_character.GetShortNameWithNoTooltip]! [target_character.GetShortNameWithNoTooltip]! [target_character.GetShortNameWithNoTooltip]!». Але серед шуму натовпу чути й інші голоси — дехто шепочеться, що з [Select_CString(target_character.IsFemale, 'неї', 'нього')] міг би вийти видатний правитель, справедливіший і чуйніший до потреб підданих. Ці розмови вже відомі придворним, що зайвий раз свідчить, яким впливом володіє [target_character.GetNameWithNoTooltip]."
  culture_greek.6.a: "[target_character.GetNameWithNoTooltip] заслуговує на повагу, це визнають навіть [Select_CString(target_character.IsFemale, 'її', 'його')] суперники."
  culture_greek.6.b: "Треба змусити натовп замовкнути, поки все це не зайшло надто далеко."
  greek_culture_all_capital_pops_gain_pop_satisfaction: "Усі [Concept('pops', 'групи населення')|e] в [target_capital.Custom('LR_PREP')|l] [target_capital.GetName] отримають [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  greek_culture_prevent_coup_for_two_year: "Якщо [target_character.GetName] [Select_CString(target_character.IsFemale, 'задумувала', 'задумував')] переворот, [target_character.GerHerHis] плани буде відкладено на #y 2#! роки"
  culture_greek.7.title: "[target_character.GetNameWithNoTooltip] влаштовує переворот"
  culture_greek.7.desc: "Витративши кілька місяців на складання планів, залучення прихильників, підрив впливу супротивників та підготовку військ, [target_character.GetName] нарешті [Select_CString(target_character.IsFemale, 'готова', 'готовий')] зробити хід.\n\n[target_character.GetSheHe|U] [Select_CString(target_character.IsFemale, 'підійшла', 'підійшов')] до стін [ROOT.GetCountry.GetCapital.Custom('LR_GEN')|l] [ROOT.GetCountry.GetCapital.GetName] на чолі війська, вимагаючи, щоб [target_character2.GetName] [Select_CString(target_character2.IsFemale, 'зреклася', 'зрікся')] #L [ROOT.GetCountry.GetAdjective|l]ого#! престолу. [target_character.GetShortName] [Select_CString(target_character.IsFemale, 'впевнена', 'впевнений')] у своєму праві претендувати на владу над [ROOT.GetCountry.Custom('CL_INST')] і вважає себе більш здібним та справедливим государем, ніж [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'правляча', 'правлячий')] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l]."
  culture_greek.7.a: "Країна в занепаді, їй потрібні нові лідери."
  culture_greek.7.b: "[target_character2.GetShortNameWithNoTooltip] не зречеться без боротьби!"
  culture_greek.7.c: "[target_character.GetShortNameWithNoTooltip] нічого не знає про легітимність влади!"
  culture_greek.7.d: "[Select_CString(target_character.IsFemale, 'Її', 'Його')] доведеться вигнати за спробу перевороту."
  greek_culture_weaker_due_to_righteous_trait: "[Concept('rebels', 'Бунтівники')|e] будуть значно слабшими."
  culture_greek.8.title: "Шпигуни в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
  culture_greek.8.desc: "Вартові [target_location.Custom('LR_GEN')|l] [target_location.GetName] нещодавно викрили групу шпигунів, які намагалися дістатися до найпотаємніших таємниць #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, включно з технологією виготовлення грецького вогню та іншими нашими досягненнями, що становлять інтерес для інших країн.\n\nЛазутчики не сказали, на кого працюють, проте зізналися, що шпигували за нами вже кілька місяців, збираючи відомості в кожному трактирі та кожній церкві. Зараз вони гниють у темниці, молячись про те, щоб господарі витягли їх із ув’язнення. Можливо, буде корисніше завербувати їх до нас на службу…"
  culture_greek.8.a: "Ці шпигуни можуть бути корисні двору."
  culture_greek.8.b: "Нехай і далі нудяться в клітці. Виявіть усі шпигунські мережі в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]!"
  culture_greek.8.c: "Можливо, вони допоможуть нам розкрити інші шпигунські мережі в [target_location.Custom('LR_PREP')|l]…"
  every_country_with_spy_network_on_us_will_lose_25_network: "Кожна відома [Concept('country', 'країна')|e], у якої в [target_location.Custom('LR_PREP')|l] є [Concept('spy_network', 'шпигунська мережа')|e] розміром не менше #Y 15#! од., отримає #R −25#! до [Concept('spy_network', 'шпигунської мережі')|e]"
  culture_greek.9.title: "Хрисовул [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  culture_greek.9.desc: "Останнім часом на ринках #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#! [target_location.GetName] панують #TOOLTIP:CULTUREGROUP,italian_group,X #L італійські#!#! торгові інтереси. Гроші буквально випливають з наших рук — місцеві жителі згодні вести справи лише з купцями з #TOOLTIP:REGION,italy_region,X #L Італії#!#!. Звісно, в цьому є й деякі переваги: перед країною відкрилася непогана нагода для збуту товарів, хай і не на найвигідніших умовах. З іншого боку, надмірна залежність від італійських торговців може призвести до того, що [target_character.GetName] втратить чималу частку свого авторитету."
  culture_greek.9.a: "Вони можуть розраховувати на будь-які привілеї, доки їхня діяльність приносить нам золото."
  culture_greek.9.b: "Якщо вони хочуть викачати з [target_location.Custom('LR_GEN')|l] усі багатства, нехай платять додаткові мита."
  culture_greek.9.c: "Ми дамо їм привілеї — але тільки такі, від яких не буде реальної користі."
  culture_greek.9.d: "Якщо доведеться захищати їхні інтереси новими законами, потрібно скласти їх найефективніше."
  all_italian_pops_become_happier: "Усі [Concept('pops', 'групи населення')|e] з числа #TOOLTIP:CULTUREGROUP,italian_group,X #L італійських#!#! #TOOLTIP:POPTYPE,burghers,X #L містян#!#! отримають [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] до [Concept('pop_satisfaction', 'вдоволення')|e]"
  all_italian_pops_become_angrier: "Усі [Concept('pops', 'групи населення')|e] з числа #TOOLTIP:CULTUREGROUP,italian_group,X #L італійських#!#! #TOOLTIP:POPTYPE,burghers,X #L містян#!#! отримають [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] до [Concept('pop_satisfaction', 'вдоволення')|e]"
  culture_greek.10.title: "У [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip] підростає нове покоління"
  culture_greek.10.desc: "Нове покоління освіченої молоді все голосніше заявляє про себе на тлі вкоріненої бюрократії та повального хабарництва серед державних службовців. Вони прагнуть покінчити з хабарництвом, замінивши застарілі практики колишніх чиновників сучасними методами управління. [Select_CString(target_character.IsFemale, 'Однією', 'Одним')] з них є [target_character.GetName], причому [Select_CString(target_character.IsFemale, 'її', 'його')] родина — звичайні [target_estate.GetName|l] з [target_location2.Custom('LR_GEN')|l] [target_location2.GetName]. Однак саме [Select_CString(target_character.IsFemale, 'цій жінці', 'цій людині')] вдалося з роками вдосконалити наш бюрократичний механізм за допомогою досить радикальних нововведень. Ці нововведення здатні перетворити сформовані установи, поставивши їх на службу країні та народу.\n\nБез сумнівів, подібна реформа різко підвищить ефективність органів управління, проте наявний чиновницький апарат не готовий розлучитися з владою та впливом. Побоюючись за своє становище, старі бюрократи рішуче чинять опір реформам і навіть підкуповують окремих представників молоді, щоб змусити їх мовчати."
  culture_greek.10.a: "Ця молодь — майбутнє нашої країни."
  culture_greek.10.b: "У таких питаннях краще довіритися людям з досвідом."
  culture_greek.11.title: "Чужа мова"
  culture_greek.11.desc: "Мова Риму втратила значну частку свого впливу при східному дворі, адже ми вирішили дотримуватися наших славних #TOOLTIP:CULTUREGROUP,greek_group,X #L еллінських#!#! коренів. Проте деяк[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] достатньо освічен[ROOT.GetCountry.Custom('nobles_yiaei')], щоб вільно цитувати #TOOLTIP:LANGUAGE,latin_language,X #L латинські#!#! вислови.\n\n«Pro bono», — каже придворним [target_character.GetName]. Ті здивовано кліпають очима, і [Select_CString(target_character.IsFemale, 'їй', 'йому')] доводиться пояснювати значення та походження цих слів. Найбільш консервативні серед аристократів висміюють [Select_CString(target_character.IsFemale, 'її', 'його')] любов до чужоземних слів, інші ж явно заінтриговані — їм хочеться дізнатися про латину більше. Дехто при дворі навіть виступає за те, щоб прийняти латинську мову та популяризувати її застосування в адміністративному апараті країни, відродивши [ROOT.GetCountry.Custom('preposition_uv')] [ROOT.GetCountry.Custom('CL_PREP')] античні римські звичаї."
  culture_greek.11.a: "Навіщо відмовлятися від нашої грецької спадщини?"
  culture_greek.11.b: "Поширення #TOOLTIP:LANGUAGE,latin_language,X #L латини#!#! можна тільки вітати."
  culture_greek.11.c: "При дворі знайдеться місце для всіх мов."
  culture_greek.12.title: "Привид корупції"
  culture_greek.12.desc: "Більшість ключових посад [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! обіймають гідні та здібні люди, але окремі деталі державного апарату нерідко дають збій.\n\nПід час нещодавньої перевірки виявилися вельми цікаві факти: за чутками, [target_character.GetName] роздає адміністративні посади своїм родичам, знайомим і навіть тим, хто готовий [Select_CString(target_character.IsFemale, 'їй', 'йому')] заплатити. Коли про це [Select_CString(target_character2.IsFemale, 'дізналася', 'дізнався')] [target_character2.GetName], інформацію поспішили списати на упереджене ставлення перевіряльників, з якими [target_character.GetNameWithNoTooltip] давно ворогує.\n\nПроте є сенс втрутитися в скандал і нагадати тим, хто використовує свою посаду в корисливих інтересах, що подібні проступки не залишаться без наслідків."
  culture_greek.12.a: "Якщо вигнати корумпованих чиновників, у нас взагалі нікого не залишиться."
  culture_greek.12.b: "[target_character.GetShortNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'зробила', 'зробив')] свій вибір, нехай живе з його наслідками."
  culture_greek.12.c: "Ми випалимо корупцію розпеченим залізом!"
  culture_greek.12.d: "Гадаю, ми... зуміємо домовитися."
  culture_greek.13.title: "Проблемна кефалія"
  culture_greek.13.desc: "Кефалія [target_area.GetName] вже багато років переживає глибокий занепад. Її намісник, що перебуває в [target_location.Custom('LR_PREP')|l] [target_location.GetName], не справляється зі своїми обов’язками, а столична адміністрація дивиться на це крізь пальці. Місцеві жителі ухиляються від сплати податків, а деяк[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] самовільно захоплю[ROOT.GetCountry.Custom('nobles_yeyut')] землі та жорстоко підда[ROOT.GetCountry.Custom('nobles_yeyut')] здирству селянську працю. Щойно доповідь про важке становище кефалії дійшла до двору, багато вельмож одразу ж ухопилися за цю нагоду. Вони вимагають, щоб [target_character.GetName] [Select_CString(target_character.IsFemale, 'усунула', 'усунув')] неефективного намісника та пропонують на його місце себе або когось зі своїх родичів, запевняючи, що впораються з цим завданням набагато краще. Настільки радикальний захід справді може виправити становище, але не можна виключати, що частка відповідальності лежить і на нас. Якщо забезпечити намісника достатніми коштами, можливо, він зуміє приборкати непокірну знать і примусити простолюд до покори."
  culture_greek.13.a: "Мабуть, доведеться змінити намісника."
  culture_greek.13.b: "Область [target_area.GetNameWithNoTooltip] страждає без нашої уваги. Час надати допомогу її жителям."
  culture_greek.13.c: "Немає потреби змінювати владу — з часом усе прийде в норму."
  all_pops_in_kephale_area_lose_satisfaction: "Усі [Concept('pops', 'групи населення')|e] в області [target_area.GetName] отримають [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] до [Concept('pop_satisfaction', 'вдоволення')|e]"
  gain_extra_control_in_the_area: "Кожна належна нам [Concept('location', 'місцевість')|e] в області [target_area.GetName] отримає [ShowNamedValue('control_mild_bonus')|+=2%] до [Concept('control', 'контролю')|e] та [Concept('modifier', 'модифікатор')|e] «[ShowModifier('increased_kephale_support')]» на #Y 10#! років"
  lose_extra_control_in_the_area: "Кожна належна нам [Concept('location', 'місцевість')|e] в області [target_area.GetName] отримає [ShowNamedValue('control_mild_penalty')|+=2%] до [Concept('control', 'контролю')|e]"
  culture_greek.14.title: "[Select_CString(target_character.IsFemale, 'Народжена', 'Народжений')] не в пурпурі"
  culture_greek.14.desc: "[target_character.GetName] [Select_CString(target_character.IsFemale, 'зуміла', 'зумів')] заволодіти #L [ROOT.GetCountry.GetAdjective|l]им#! престолом, однак [Select_CString(target_character.IsFemale, 'їй', 'йому')] безперечно бракує легітимності. [Select_CString(target_character.IsFemale, 'Вона не була народжена', 'Він не був народжений')] в пурпурі, це ставить двір у незручне та вразливе становище. У народі кажуть, що в [Select_CString(target_character.IsFemale, 'цієї жінки', 'цієї людини')] немає царської гідності; в [Select_CString(target_character.IsFemale, 'ній', 'ньому')] бачать узурпатора, а не [Select_CString(target_character.IsFemale, 'законну правительку', 'законного правителя')]. Дехто навіть виношує плани щодо перетворення адміністративного апарату на користь найближчих наближених нового монарха."
  culture_greek.14.a: "Покращити [Select_CString(target_character.IsFemale, 'її', 'його')] репутацію нескладно — треба лише виділити достатньо коштів."
  culture_greek.14.b: "Відколи країни тримаються на одному лише престижі?"
  culture_greek.14.c: "Вони хочуть бачити царську гідність? Що ж, вони її побачать."
  culture_greek.15.title: "$STATIC_MODIFIER_NAME_despot_modifier$ та розбіжності"
  culture_greek.15.desc: "Династія [target_character.GetDynasty.GetName] завжди виявляла рідкісну одностайність у своєму прагненні до влади над #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#!, але коли справа доходить до тонкощів управління країною, у родині нерідко виникають розбіжності. Так, [target_character.GetName] та [target_character2.GetName] сперечаються про те, яку роль у державі слід відводити [ROOT.GetCountry.GetGovernment.GetAdjective|l]ому двору. [target_character.GetShortNameWithNoTooltip] стверджує, що вельмож слід тримати на короткому повідку, не даючи васалам занадто багато волі. [target_character2.GetShortNameWithNoTooltip], навпаки, вважає, що великій країні вигідніше мати відносно незалежних васалів, зберігаючи безпосередній контроль лише над окремими стратегічно важливими анклавами."
  culture_greek.15.a: "[target_character.GetShortNameWithNoTooltip] висловлює слушні думки."
  culture_greek.15.b: "Те, що пропонує [target_character2.GetShortNameWithNoTooltip], звучить вельми розумно…"
  culture_greek.15.c: "Настав час нагадати їм, хто править [ROOT.GetCountry.Custom('CL_INST')]."
  culture_greek.15.d: "[ROOT.GetCountry.GetGovernment.GetRuler.GetShortNameWithNoTooltip] знає краще. Нехай повчаться у [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'неї', 'нього')]."
  culture_greek.16.title: "[target_character.GetNameWithNoTooltip] виступає при дворі"
  culture_greek.16.desc: "[target_character.GetName] [Select_CString(target_character.IsFemale, 'здійснила', 'здійснив')] чимало подвигів — здається, [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! та в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName] не залишилося нікого, хто б не чув про [Select_CString(target_character.IsFemale, 'її', 'його')] діяння. Придворні прагнуть особисто познайомитися з живою легендою нашої країни — вони направили [Select_CString(target_character.IsFemale, 'їй', 'йому')] запрошення до двору, щоб представити [Select_CString(target_character.IsFemale, 'її', 'його')] найзнатнішим та найвпливовішим вельможам країни.\n\nЗвісно, [Select_CString(target_character.IsFemale, 'її', 'його')] численні суперники не надто раді цій звістці. [target_character.GetNameWithNoTooltip] і без того занадто багато про себе [Select_CString(target_character.IsFemale, 'уявила', 'уявив')], і дехто побоюється, що обожнювання придворних підштовхне [Select_CString(target_character.IsFemale, 'її', 'його')] до думки про узурпацію влади. Якщо [target_character.GetSheHe] вимагатиме, щоб [target_character2.GetName] [Select_CString(target_character2.IsFemale, 'зреклася', 'зрікся')] [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ого престолу, навряд чи ми зможемо [Select_CString(target_character.IsFemale, 'її', 'його')] зупинити…"
  culture_greek.16.a: "Хто ми такі, щоб забороняти [Select_CString(target_character.IsFemale, 'цій жінці', 'цій людині')] говорити перед двором?"
  culture_greek.16.b: "[Select_CString(target_character.IsFemale, 'Її', 'Його')] слід тримати подалі від придворних інтриг."
  culture_greek.17.title: "Розширення торгівлі в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
  culture_greek.17.desc: "Завдяки нашому досвіду мореплавства [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! були побудовані нові гавані та прокладені нові торгові шляхи. Одним із таких портів є [target_location.GetRank.GetName|l] [target_location.GetName]. Залучені численними привілеями, до цього молодого торгового поселення стіка[ROOT.GetCountry.Custom('burghers_yetsayutsa')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] з усієї країни.\n\nМісто, що стрімко розвивається, гостро потребує додаткових ринків, нових житлових місцевостей, масштабного кораблебудування. Дізнавшись про це, [target_character.GetName] [Select_CString(target_character.IsFemale, 'скликала', 'скликав')] придворних вельмож, щоб знайти оптимальне рішення."
  culture_greek.17.a: "Ми підтримаємо розвиток торгівлі в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]."
  culture_greek.17.b: "Вони отримають нашу допомогу, але будуть у нас в боргу."
  culture_greek.17.c: "Розділимо витрати по справедливості."
  culture_greek.18.title: "Недбалість акритів [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  culture_greek.18.desc: "[target_location.GetRank.GetName] [target_location.GetName] розташовується на самому кордоні, але останнім часом керівництво поселення відверто нехтує своїми обов’язками щодо захисту рубежів #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Залога втратила боєздатність, навколишні землі стали вразливими для харцизьких набігів та ворожих вторгнень.\n\nНедавня перевірка виявила, що командир акритів отримав свою посаду завдяки родинним зв’язкам, а не особистим заслугам. Його вояки спускають усе своє жалування на хмільне; вони люблять вихвалятися своїми подвигами, але в реальному бою від них не буде жодної користі. Ми не можемо ризикувати обороноздатністю області [target_area.GetName] — необхідно навести там лад та зміцнити дисципліну серед акритів. [target_character.GetName] [Select_CString(target_character.IsFemale, 'повинна', 'повинен')] діяти з усією рішучістю."
  culture_greek.18.a: "У нас немає на це коштів."
  culture_greek.18.b: "Їхній обов’язок — захищати кордони, і вони повинні це добре засвоїти."
  all_pop_in_location_lose_satisfaction: "Усі [Concept('pops', 'групи населення')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] отримають [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  culture_greek.19.title: "Легенди про акритів [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  culture_greek.19.desc: "Оповідачі численних історій про акритів нерідко прикрашають істину, прагнучи возвеличити славу #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Однак у легендах про хоробрих вояків з [target_location.Custom('LR_GEN')|l] [target_location.GetName] немає жодного слова брехні. Вони пильно стережуть кордони області [target_area.GetName], не підпускаючи ворогів до рубежів нашої країни, а [target_character.GetName] користується в тутешніх краях загальною повагою. І нехай дехто сумнівається у правдивості цих історій, вельможі двору перейнялися їхнім героїчним духом і бажають допомогти відважним акритам, розносячи легенди про їхні подвиги по всіх землях [ROOT.GetCountry.Custom('CL_GEN')]. [target_character.GetNameWithNoTooltip] також [Select_CString(target_character.IsFemale, 'могла', 'міг')] би зробити свій внесок, склавши нові історії про героїзм жителів [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
  culture_greek.19.a: "Ми посприяємо поширенню легенд про акритів, якщо це допоможе зміцнити наші кордони."
  culture_greek.19.b: "Вірна служба забезпечить їм місце в історії без жодних байок."
  culture_greek.20.title: "Акрити [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip] просять про допомогу"
  culture_greek.20.desc: "Така величезна країна, як [ROOT.GetCountry.GetName], неминуче стикається з окремими проявами недбалості. Навіть коли не йдеться про злий умисел, жителям [ROOT.GetCountry.Custom('rank_ua_GEN')|l] від цього не легше. Через таку байдужість кордони області [target_area.GetName] виявилися недостатньо захищеними, і перелякане населення звернулося по допомогу до залоги [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Жителі вимагають посилити запобіжні заходи, але для організації ефективної оборони від набігів і вторгнень необхідне втручання двору.\n\nГонці акритів прибули до [target_capital.Custom('LR_ACC')|l] [target_capital.GetName] і просять, щоб [target_character.GetName] [Select_CString(target_character.IsFemale, 'прийняла', 'прийняв')] їх якнайшвидше. [target_location.Custom('LR_DAT')] [target_location.GetNameWithNoTooltip] потрібні кошти на будівництво нових укріплень, вояки для посилення залоги та інструктори, які займуться навчанням новобранців."
  culture_greek.20.a: "Ми подбаємо про захист кожного куточка нашої країни."
  culture_greek.20.b: "На жаль, у нас немає зайвих ресурсів."
  culture_greek.21.title: "Спад середземноморської торгівлі в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
  culture_greek.21.desc: "З відкриттям Нового Світу у світі з’явилося безліч нових торгових шляхів, тоді як значення середземноморської торгівлі, такої важливої для господарства нашої країни, пішло на спад. Численн[ROOT.GetCountry.Custom('burghers_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l], що традиційно живуть морем, вперто тримаються своїх колишніх звичок і нічого не бажають змінювати. Замість того щоб пристосуватися до нової реальності, вони вимагають від влади субсидій та постійної підтримки традиційних ринків збуту.\n\n[target_location.GetName] — один із таких ринків. [target_location.GetRank.GetName] сильно постраждав від зміни торгових шляхів, і жителі просять виділити купцям кошти на закупівлю нових товарів. За їхніми словами, фінансова допомога пожвавить торгівлю і навіть дозволить повернути [target_location.Custom('LR_DAT')|l] колишнє господарське значення."
  culture_greek.21.a: "Надамо їм ці кошти."
  culture_greek.21.b: "Якщо вони хочуть досягти успіху в торгівлі, їм варто навчитися розумніше розпоряджатися тим, що вони мають."
  culture_greek.21.c: "За належної винахідливості можна владнати будь-яку проблему."
  burghers_in_location_lose_satisfaction: "Усі [Concept('pops', 'групи населення')|e] з-поміж #TOOLTIP:POPTYPE,burghers,X #L містян#!#! у [target_location.Custom('LR_PREP')|l] [target_location.GetName] отримають [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  burghers_in_location_gains_satisfaction: "Усі [Concept('pops', 'групи населення')|e] з-поміж #TOOLTIP:POPTYPE,burghers,X #L містян#!#! у [target_location.Custom('LR_PREP')|l] [target_location.GetName] отримають [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  culture_greek.22.title: "Святкування на честь Богородиці в [target_location.GetName.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
  culture_greek.22.desc: "Народження Ісуса вважається дуже важливою подією для істинно віруючих #TOOLTIP:RELIGION,$orthodox_tt$,X #L православних#!#! християн, тому багато хто влаштовує святкування на честь Його Матері Марії, яку часто іменують Богородицею, або грецькою #italic Теотокос#!.\n\nОсобливо старанно під час подібних урочистостей поводяться жителі [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Вони готують святкування в #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_PREP')|l]#!#! та його околицях, сподіваючись хоча б один день по-справжньому відпочити та поділитися своєю радістю з усіма охочими. Деякі представники #L [ROOT.GetCountry.GetAdjective|l]ого#! двору вже вирушили в дорогу, щоб на власні очі побачити це видовище, а найпобожніші з них бажають зробити цей святий день ще значущішим для людей."
  culture_greek.22.a: "Воістину прекрасна подія."
  culture_greek.22.b: "Відсвяткуємо його разом з ними."
  culture_greek.22.c: "Хоч ми й не поділяємо їхньої віри, ми, принаймні, можемо поставитися до неї з повагою."
  culture_greek.22.d: "У [target_location.GetName.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip] немає місця православним традиціям."
  all_pops_in_location_gain_satisfaction: "Усі [Concept('pops', 'групи населення')|e] отримають [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  all_orthodox_pops_in_location_lose_satisfaction: "Усі #TOOLTIP:RELIGION,$orthodox_tt$,X #L православні#!#! [Concept('pops', 'групи населення')|e] отримають [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  culture_greek.23.title: "Вплив [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  culture_greek.23.desc: "Вплив [target_location.GetName.Custom('LR_GEN')|l] [target_location.GetName.GetName] у #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! стає все більш відчутним для всіх, особливо для урядовців з [target_capital.Custom('LR_GEN')|l] [target_capital.GetName]. Їх вельми цікавить питання, яким чином цей [target_location.GetRank.GetName|l] з області [target_area.GetName] зміг піднестися, причому багато в чому йому покровительствували [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] та [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]. Дрібні урядовці та заможн[ROOT.GetCountry.Custom('burghers_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] користуються можливостями, які надає їм [target_location.GetRank.GetNameWithNoTooltip|l], а місцев[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] потопа[ROOT.GetCountry.Custom('nobles_yeyut')] у розкошах.\n\nАле якщо для одних це джерело задоволення, то для інших — привід для серйозних роздумів, оскільки зростаючий вплив регіону підриває становище наділених владою у [target_capital.Custom('LR_PREP')|l] [target_capital.GetName] та інших місцях, тим самим порушуючи політичну рівновагу в усій країні."
  culture_greek.23.a: "Чи варто карати місто за приваблення нових мешканців та приплив багатства?"
  culture_greek.23.b: "Інші міста мають причини турбуватися. Можливо, варто обмежити зростання [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
  all_pops_with_influential_polis_modifier_lose_satisfaction: "Усі [Concept('pops', 'групи населення')|e] в [Concept('locations', 'місцевостях')|e] з [Concept('modifier', 'модифікатором')|e] «[ShowModifier('greek_culture_influential_polis')]» отримають [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] до [Concept('pop_satisfaction', 'вдоволення')|e]"
  all_pops_in_location_lose_satisfaction: "Усі [Concept('pops', 'групи населення')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] отримають [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  culture_greek.24.title: "Зазіхання ромеїв"
  culture_greek.24.desc: "Вплив Римської імперії, як і раніше, відчувається [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!. Попри те, що титул візантійських імператорів нам не належить, народ продовжує вважати себе частиною колишньої імперії та вважає, що [target_character.GetName] [Select_CString(target_character.IsFemale, 'повинна', 'повинен')] проводити агресивнішу політику щодо повернення її земель. Деякі популісти при #L [ROOT.GetCountry.GetAdjective|l]ому#! дворі наполягають, що нам слід не тільки повернути землі, а й перейняти титул імператорів минулого. А щоб надати нам належної легітимності та престижу на обґрунтування наших зазіхань на втрачені землі, слід змінити стиль та естетику нашої столиці, [target_capital.Custom('LR_GEN')|l] [target_capital.GetName]."
  culture_greek.24.a: "Ці «ромеї» можуть розпрощатися зі своїми мріями."
  culture_greek.24.b: "Подібні дії можуть бути корисними. Можливо, нам слід їх перейняти."
  culture_greek.25.title: "Містрійська освіта"
  culture_greek.25.desc: "Знаменитий містрійський філософський напрям поширює свій вплив на #TOOLTIP:REGION,balkan_region,X #L Балканах#!#!, у #TOOLTIP:AREA,west_anatolia_area,X #L Західній Анатолії#!#! та в #TOOLTIP:REGION,italy_region,X #L Італії#!#!.\n\nВчені відвідують багато земель, як бідних, так і багатих. Серед них — [target_location.GetName] в області [target_area.GetName]. Деякі безвісні вчені, що вирушили досліджувати далекі землі, зупинилися тут і поділилися з місцевим населенням своїми філософськими, культурними та риторичними ідеями. Багато мешканців, особливо більш освічені, які бажають розширити своє розуміння світу, виявили інтерес до цих ідей. Містрійські вчення також привернули увагу #L [ROOT.GetCountry.GetAdjective|l]ого#! двору, де погляди з цього питання розділилися: одні виступають за заборону будь-яких потенційно небезпечних ідей та вчень, особливо тих, що можуть становити загрозу для самобутності [ROOT.GetCountry.Custom('CL_GEN')], а інші, менш знатні, вважають, що їх поширення дасть нашому народу чудові можливості для навчання."
  culture_greek.25.a: "Їхні вчення не становлять небезпеки. Нехай поширюють свої знання."
  culture_greek.25.b: "Чи варто наражати [target_location.GetRank.GetNameWithNoTooltip|l] [target_location.GetNameWithNoTooltip] на ризик виникнення радикальних ідей?"
  event_will_only_fire_for_locations_within_mystras_scholarship_geography: "[ShowScriptedGeographyName('mystras_scholarship_geography')] — [Concept('event', 'подія')|e] спрацює тільки щодо місцевих [Concept('locations', 'місцевостей')|e]"
  culture_greek.26.title: "Нова [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]а риторика"
  culture_greek.26.desc: "За часів Стародавнього Риму #TOOLTIP:LANGUAGE,latin_language,X #L латиною#!#! — яку частина населення #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! не бажає вивчати — було написано незліченну кількість творів. Це спонукало наших найрозсудливіших вчених взятися за їхній переклад на загальноприйняту #L [ROOT.GetCountry.GetCommonLanguage.GetName|l]у#! мову.\n\nПредставники еліти не могли залишити цю справу без уваги, вбачаючи загрозу в тому, що нижчі стани зможуть отримати доступ до текстів, на вивчення та освоєння яких [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] витратили цілі роки. При #L [ROOT.GetCountry.GetAdjective|l]ому#! дворі пролунали заклики заборонити подібні переклади [ROOT.GetCountry.Custom('preposition_uv')] [ROOT.GetCountry.Custom('rank_ua_PREP')|l] заради збереження становища та престижу еліти."
  culture_greek.26.a: "Простий люд також має право здобувати освіту."
  culture_greek.26.b: "Потрібно за будь-яку ціну зберегти верховенство [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ої еліти."
  culture_greek.27.title: "[target_character.GetNameWithNoTooltip] вимагає проведення тріумфу"
  culture_greek.27.desc: "[target_character.GetName] [Select_CString(target_character.IsFemale, 'повернулася', 'повернувся')] з черговою славною перемогою та [Select_CString(target_character.IsFemale, 'пройшлася', 'пройшовся')] вулицями [target_capital.Custom('LR_GEN')|l] [target_capital.GetName] під радість натовпу в оточенні численної охорони з найвідданіших [Select_CString(target_character.IsFemale, 'їй', 'йому')] вояків, що оберігають [Select_CString(target_character.IsFemale, 'її', 'його')] від будь-якої небезпеки.\n\nПрибувши до #L [ROOT.GetCountry.GetAdjective|l]ого#! двору, [Select_CString(target_character.IsFemale, 'вона зажадала', 'він зажадав')] аудієнції, на яку дали згоду з явною неохотою. Не звертаючи уваги ні на друзів, ні на недругів при дворі, [Select_CString(target_character.IsFemale, 'вона', 'він')] одразу [Select_CString(target_character.IsFemale, 'наказала', 'наказав')], щоб [target_character2.GetName] [Select_CString(target_character2.IsFemale, 'організувала', 'організував')] на [Select_CString(target_character.IsFemale, 'її', 'його')] честь урочистість за давнім звичаєм. [Select_CString(target_character.IsFemale, 'Вона', 'Він')] наполягає, що [Select_CString(target_character.IsFemale, 'її', 'його')] звершення мають бути відомі всім, щоб зміцнити бойовий дух та вселити страх будь-кому, хто наважиться виступити проти #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! зі зброєю в руках."
  culture_greek.27.a: "Урочистість? Забагато галасу. Ми відкидаємо ці вимоги."
  culture_greek.27.b: "Якщо урочистість на славу [ROOT.GetCountry.Custom('CL_GEN')], ми її охоче влаштуємо."
  greek_culture_strategos_will_not_use_triumph_for_popularity: "Якщо [target_character.GetName] не отримає бажаної урочистості, [Select_CString(target_character.IsFemale, 'вона', 'він')] не досягне успіху в жодній із запланованих спроб перевороту"
  greek_culture_progress_coup_attempt_if_strategos_is_disloyal: "Якщо [target_character.GetName] отримає тріумф, [Select_CString(target_character.IsFemale, 'вона', 'він')] зможе скористатися своєю популярністю, щоб прискорити реалізацію своїх планів щодо проведення перевороту"
  culture_greek.28.title: "Вихід вчених"
  culture_greek.28.desc_common: "Нестабільність [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! змусила багатьох освічених людей шукати кращої долі подалі від [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  culture_greek.28.desc.a: "$culture_greek.28.desc_common$\n\n Вони хочуть займатися філософією, правом і богослов’ям, тому прагнуть спокійнішого життя, яке в одночас не відніме ні війна, ні голод, ні смерть. Ось чому багато хто з тугою згадує #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_ACC')|L]#!#! — більш престижну та стабільну країну. [target_country.GetFlavorRank] [target_country.GetName] може забезпечити їм бажаний комфорт. Багато хто вже почав переселятися до [target_destination.Custom('LR_ACC')|l] [target_destination.GetName], і це викликає занепокоєння серед найбільш проникливих членів #L [ROOT.GetCountry.GetAdjective|l]ого#! двору. Вони вважають, що подібна міграція завдає шкоди престижу [ROOT.GetCountry.Custom('CL_GEN')], оскільки демонструє нездатність захистити тих, хто не в силах пережити нинішнє скрутне становище справ у нашій країні, але все ж становить цінність для суспільства."
  culture_greek.28.desc.b: "$culture_greek.28.desc_common$\n\nІ хоча тікати їм, по суті, нікуди, вони продовжують розповідати про красу далеких країн, побачених у книгах: про те, як простий люд #ONCLICK:COUNTRY,[scholar_country.1.GetKey] #TOOLTIP:COUNTRY,[scholar_country.1.GetKey],X [scholar_country.1.Custom('CL_GEN')|L]#!#! живе в розкоші, про справедливих правителів #ONCLICK:COUNTRY,[scholar_country2.GetKey] #TOOLTIP:COUNTRY,[scholar_country2.GetKey],X [scholar_country2.Custom('CL_GEN')|L]#!#!, які не гноблять своїх підданих, а, навпаки, поважають їхні права, і про те, як [scholar_country3.GetName] покладається на новації, а не на звичаї.\n\nСпочатку ці промови були нешкідливими, але вони вже поширюються по [ROOT.GetCountry.Custom('rank_ua_DAT')|l], сіючи смуту та хвилювання, що викликає серйозне занепокоєння #L [ROOT.GetCountry.GetAdjective|l]ого#! двору."
  culture_greek.28.a: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
  culture_greek.28.b: "Потрібно припинити це, поки інші не наслідували їхній приклад."
  culture_greek.28.c: "Їхні промови лише посилюють нестабільність."
  culture_greek.28.d: "Можливо, варто спрямувати частину коштів на запобігання подальшим заворушенням."
  greek_culture_migration_largely_prevented: "Основна частина [Concept('migration', 'міграції')|e] скоротиться"
  culture_greek.29.title: "[ShowBuildingTypeNameWithNoTooltip('orthodox_monastery')] потребує допомоги"
  culture_greek.29.desc: "Жителі [target_location.Custom('LR_GEN')|l] [target_location.GetName] — ревні послідовники #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ої#! віри. [ROOT.GetCountry.GetReligion.GetGodName] — основа їхнього повсякденного життя. Однак через брак підтримки з боку #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! та уряду нашої славної країни місцевий #TOOLTIP:BUILDING_TYPE,orthodox_monastery,X #L православний монастир#!#!, розташований у #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_PREP')|l]#!#!, гостро потребує оновлення оздоблення, щоб відповідати своєму статусу святого місця. Духовенство направило прохання до #L [ROOT.GetCountry.GetAdjective|l]ого#! двору в надії, що [target_character.GetName] виділить кошти на гідне оновлення як зовнішнього вигляду, так і внутрішнього оздоблення цієї святині. Це благодіяння не залишиться непоміченим і покаже всім [ROOT.GetCountry.Custom('preposition_uv')] [ROOT.GetCountry.Custom('rank_ua_PREP')|l] нашу відданість [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip|l]ій вірі."
  culture_greek.29.a: "Вони отримають золото на оздоблення монастиря."
  culture_greek.29.b: "[target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'має', 'має')] бути ощадливішим. На всі святині золота не вистачить."
  culture_greek.29.c: "В ім’я православної віри ми не пошкодуємо жодних коштів."
  all_orthodox_pops_gain_satisfaction_in_location: "Усі #TOOLTIP:RELIGION,$orthodox_tt$,X #L православні#!#! [Concept('pops', 'групи населення')|e] отримають [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  culture_greek.30.title: "Спадщина імперії"
  culture_greek.30.desc: "Світ Східної Римської імперії згас. Але попри все, багато наших підданих називають себе ромеями, а [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] прославився звичаями, запозиченими у попередників. Це, своєю чергою, дає нам підстави заявляти про себе як про законних спадкоємців імперії та вимагати повернення її земель. Багато хто в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetName] знає про наш кордон у провінції [target_province.GetName] і все частіше вимагає її повернення. [target_country.GetName] не ма[target_country.Custom('end_yeyut')] жодних прав на неї і тим паче не мож[target_country.Custom('end_eut')] претендувати на роль спадкоємців Риму. Військо, очевидно, поділяє ці настрої: військові та [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] закликають народ до війни за повернення того, що по праву належить #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#!."
  culture_greek.30.a: "Рим буде відновлено в колишніх кордонах!"
  culture_greek.30.b: "Воювати немає потреби."