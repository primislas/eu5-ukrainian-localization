l_russian:
  iberian_culture.1.title: "Пісні Реконкісти"
  iberian_culture.1.desc: "Наші сутички з невірними надихнули як менестрелів, так і простий люд складати пісні, що славлять хоробрість наших вояків, які б’ються за торжество [ShowReligionGroupAdjective('christian')|U]ої справи. Поки ці наспіви ширяться [ROOT.GetCountry.Custom('rank_ua_INST')], вони можуть стати нам корисним засобом — надихати наших вояків у бою та, либонь, заохотити більше чоловіків стати до наших лав."
  iberian_culture.1.a: "Нехай вони лунають на полі бою!"
  iberian_culture.1.b: "Вони мають надихати наш набір!"
  iberian_culture.2.title: "Герой Реконкісти"
  iberian_culture.2.desc: "Серед багатьох хоробрих сердець, які билися у війні проти [GetCountry('GRA').Custom('CL_GEN')], вирізняється [new_general.GetName], що зажив слави мужністю та хистом у бою. [new_general.GetHerHim] слава тепер лине всім [ROOT.GetCountry.Custom('rank_ua_INST')], і багато хто переконує, що такий хист має бути винагороджений проводом, гідним [new_general.GetHerHis] звершень."
  iberian_culture.2.a: "[new_general.GetSheHe|U] командуватиме нашими військами."
  iberian_culture.2.b: "Ми застосуємо [new_general.GetHerHis] хист деінде."
  iberian_culture.3.title: "Заселення півдня"
  iberian_culture.3.desc: "Коли #TOOLTIP:AREA,granada_area,X #L Гранаду#!#! нарешті було звільнено з-під [ShowReligionGroupAdjective('muslim')]ого панування, чимало родин почали придивлятися до цих земель у пошуках кращої долі. Нещодавно до нас дійшли звістки про людей із провінції [origin_province.GetName], яких привабили обіцянки покинутих земель та нагода почати нове життя у провінції [target_province.GetName]."
  iberian_culture.3.a: "Дозволити їхнє переселення."
  iberian_culture.3.b: "Спробувати обмежити число поселенців."
  iberian_culture.4.title: "Диво Діви Марії"
  iberian_culture.4.desc: "Поширилися чутки про диво, яке нібито сталося в [target_location.Custom('LR_PREP')] [target_location.GetName]. За розповідями місцевих жителів, преблагословенна Діва Марія явилася на пагорбі над поселенням. Хоча дехто сумнівається в цьому диві, воно все одно привабило прочан зблизька й здалеку. Вулиці тепер переповнені подорожніми, на яких місцеві залюбки наживаються. До місцевої скарбниці надійшло чимало пожертв, і те, як слід використати ці новознайдені багатства, викликає палкі суперечки."
  iberian_culture.4.a: "Вкласти ці гроші на місці."
  iberian_culture.4.b: "Віддати пожертви стану [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]."
  iberian_culture.4.c: "Роздати милостиню бідним."
  iberian_culture.4.d: "Нехай [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] розпоряджається цими пожертвами."
  iberian_culture.5.title: "Повернення з північних морів"
  iberian_culture.5.desc: "[ShowCultureName('basque')]і китобої повернулися з чергової виправи до далеких північних морів. Подолавши підступні бурі та води, невідомі більшості мореплавців, вони привезли додому як цінний вантаж, так і багаті практичні знання. [ROOT.GetCountry.GetGovernment.GetCourtTitle] тепер сперечається, як слід застосувати цей досвід."
  iberian_culture.5.a: "Кожне плавання має спиратися на досвід попереднього."
  iberian_culture.5.b: "Океан відкриває незліченні можливості."
  iberian_culture.6.title: "Вправний мудехарський митець"
  iberian_culture.6.desc: "До нашого відома дійшло, що [target_character.GetName], вправний [ShowReligionGroupAdjective('muslim')]ий митець, здобуває визнання по всьому [ROOT.GetCountry.Custom('rank_ua_INST')]. [ROOT.GetCountry.GetGovernment.GetCourtTitle] радять покликати [target_character.GetHimHer] на нашу службу, хоча багато хто серед [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] заперечує проти надання такої пошани мудехару."
  iberian_culture.6.a: "Хист не визначається вірою."
  iberian_culture.6.b: "Така шана належить [ShowReligionGroupAdjective('christian')|U]им підданим."
  iberian_culture.7.title: "Суперечка на ринку"
  iberian_culture.7.desc: "Спалахнула напруга в [target_location.Custom('LR_PREP')] [target_location], де [ShowReligionAdjective('sunni')]і та [ShowReligionAdjective('catholic')]і купці звинувачують одні одних у несправедливому ставленні з боку місцевих урядовців та гільдій. [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] попросили втрутитися та владнати цю суперечку."
  iberian_culture.7.a: "Справедливість має перемогти."
  iberian_culture.7.a.tt1: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх #TOOLTIP:RELIGION,$sunni_tt$,X #L сунітських#!#! [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] підвищується на [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"
  iberian_culture.7.a.tt2: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх #TOOLTIP:RELIGION,$catholic_tt$,X #L католицьких#!#! [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] знижується на [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]"
  iberian_culture.7.b: "Ми маємо захистити своїх."
  iberian_culture.7.b.tt1: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх #TOOLTIP:RELIGION,$sunni_tt$,X #L сунітських#!#! [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] знижується на [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]"
  iberian_culture.7.b.tt2: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх #TOOLTIP:RELIGION,$catholic_tt$,X #L католицьких#!#! [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] підвищується на [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"
  iberian_culture.7.c: "Нехай самі розбираються."
  iberian_culture.8.title: "Суперечка щодо мудехарських звичаїв"
  iberian_culture.8.desc: "У [target_location.Custom('LR_PREP')|l] [target_location.GetName] місцеві #TOOLTIP:RELIGION,$sunni_tt$,X #L суніти#!#! знову зібралися, щоб відсвяткувати одне зі своїх давніх свят, як робили їхні пращури впродовж багатьох поколінь. Хоча багато хто вважає ці святкування невинною частиною повсякденного життя, [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] вимага[ROOT.GetCountry.Custom('clergy_yeyut')] від нас їх заборонити, оскільки [ROOT.GetCountry.GetFlavorRank|l] є #TOOLTIP:RELIGION,$catholic_tt$,X #L католицькою#!#! країною, а такі свята суперечать її засадам."
  iberian_culture.8.a: "Не перешкоджатимемо святкуванням."
  iberian_culture.8.a.tt: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх #TOOLTIP:RELIGION,$sunni_tt$,X #L сунітських#!#! [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] підвищується на [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"
  iberian_culture.8.b: "Заборонити проведення святкувань."
  iberian_culture.8.b.tt: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх #TOOLTIP:RELIGION,$sunni_tt$,X #L сунітських#!#! [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] знижується на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
  iberian_culture.9.title: "Заможне мудехарське подвір’я"
  iberian_culture.9.desc: "Мудехарське подвір’я у [target_location.Custom('LR_PREP')|l] [target_location.GetName] переживає розквіт: сюди линуть численні ремісники та купці, чия працьовитість забезпечує зростання добробуту місцевої громади. Дедалі більше багатство мудехарів сприятливо позначається на господарстві [target_location.Custom('LR_GEN')|l], однак дехто з місцевої знаті починає побоюватися, що одного дня вплив громади зрівняється з їхнім власним."
  iberian_culture.9.a: "Добробут іде на благо усім."
  iberian_culture.9.b: "Вилучити частину багатств мудехарів, щоб обмежити їхній вплив."
  iberian_culture.9.b.tt: "Усі [ShowReligionAdjective('sunni')]і [Concept('pops', 'громади')|e] у [target_location.Custom('LR_PREP')] [target_location.GetName] втрачають [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'задоволення громад')|e]"
  iberian_culture.10.title: "Прославлені мудехарські лікарі"
  iberian_culture.10.desc: "Останнім часом мудехарські лікарі здобувають широке визнання по всьому [ROOT.GetCountry.Custom('rank_ua_INST')], і багато хто зі стану [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] дедалі більше покладається на їхній хист. Дехто з наших радників тепер пропонує офіційно призначити їх лікарями при [ROOT.GetCountry.GetGovernment.GetCourtTitle], проте впливові представники стану [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] рішуче виступають проти цього задуму."
  iberian_culture.10.a: "Хист важливіший за віру."
  iberian_culture.10.b: "Натомість призначити [ShowReligionGroupAdjectiveWithNoTooltip('christian')|U]ого лікаря."
  iberian_culture.11.title: "Конверсо під підозрою"
  iberian_culture.11.desc: "До [ROOT.GetCountry.GetGovernment.GetCourtTitle] дійшли звістки, що [target_character.GetName], вправний купець, чия родина свого часу навернулася з віри [ShowReligionName('judaism')], звинувачений у тому, що й надалі потай дотримується обрядів колишньої віри. Хоча в донесенні стверджується про промовляння заборонених молитов і таємні зібрання, інші доводять, що ці звинувачення виникли через заздрощі та боргові суперечки."
  iberian_culture.11.a: "Наші духовні суди мають розслідувати ці єресі."
  iberian_culture.11.b: "Це наклепницькі звинувачення!"
  iberian_culture.12.title: "Звинувачено [ShowCultureNameWithNoTooltip('sephardi')]их купців"
  iberian_culture.12.desc: "Кілька визначних [ShowCultureName('sephardi')]их купців із [target_location.Custom('LR_GEN')] [target_location.GetName] звинувачено в накопиченні багатства незаконними способами: використанні шпарин в оподаткуванні, лихварстві чи маніпулюванні цінами задля власної вигоди. Хоча ці звинувачення лунають від їхніх торгових суперників і ми не знаємо напевно, чи вони правдиві, ми мусимо діяти, перш ніж суперечка розгориться дужче."
  iberian_culture.12.a: "Конфіскувати їхні статки."
  iberian_culture.12.a.tt: "Усі [ShowCultureName('sephardi')]і [Concept('pops', 'громади')|e] [ShowPopTypeName('burghers')] у [target_location.Custom('LR_PREP')] [target_location.GetName] втрачають [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'задоволення')|e]"
  iberian_culture.12.b: "Ми не можемо діяти без доказів."
  iberian_culture.12.b.tt: "Усі не-[ShowCultureName('sephardi')]і [Concept('pops', 'громади')|e] [ShowPopTypeName('burghers')] у [target_location.Custom('LR_PREP')] [target_location.GetName] втрачають [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'задоволення')|e]"
  iberian_culture.13.title: "Боротьба зі спекою та пошестю"
  iberian_culture.13.desc: "У південних регіонах нашого [ROOT.GetCountry.Custom('rank_ua_GEN')] люди завели звичай білити оселі гашеним вапном, аби берегти в них прохолоду під палючим сонцем. Також вважається, що це допомагає стримувати поширення пошестей. Мешканці [target_location.Custom('LR_GEN')] [target_location.GetName] останнім часом потерпають від нестачі гашеного вапна й звернулися до [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] з проханням про допомогу для захисту своїх домівок."
  iberian_culture.13.a: "Подбати, щоб вони отримали достатньо гашеного вапна."
  iberian_culture.13.a.tt: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] підвищується на [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"
  iberian_culture.13.b: "У нас немає зайвих грошей."
  iberian_culture.13.b.tt: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] знижується на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
  iberian_culture.14.title: "Суперечка через Каньядас-Реалес"
  iberian_culture.14.desc: "Зі зміною пір року мільйони овець переганяють через Каньядас-Реалес — старовинні королівські скотопрогінні шляхи, що пролягають нашими землями. Однак мешканці [target_location.Custom('LR_GEN')] [target_location.GetName] відмовляються пропускати пастухів через своє поселення, боячись, що худоба витопче їхні поля."
  iberian_culture.14.a: "Підтвердити прадавнє право пастухів на прохід."
  iberian_culture.14.a.tt: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх [Concept('pops', 'громад')|e] #TOOLTIP:POPTYPE,peasants,X #L селян#!#! у [target_location.Custom('LR_PREP')|l] [target_location.GetName] знижується на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
  iberian_culture.15.title: "Суперечка у Водяному трибуналі"
  iberian_culture.15.desc: "Старовинний Водяний трибунал нещодавно розглядав суперечку між [target_location1.Custom('LR_INST')] [target_location1.GetName] та [target_location2.Custom('LR_INST')] [target_location2.GetName]. Під палючим літнім сонцем у краю бракує води, щоб сповна забезпечити поля обох поселень, тож їхні мешканці сперечаються за права на її розподіл."
  iberian_culture.15.a: "Перевагу слід віддати [target_location1.Custom('LR_DAT')] [target_location1.GetNameWithNoTooltip]."
  iberian_culture.15.b: "Поля в [target_location2.Custom('LR_PREP')] [target_location2.GetNameWithNoTooltip] важливіші."
  iberian_culture.15.c: "Воду слід розподілити порівну."
  iberian_culture.16.title: "Захист фуерос"
  iberian_culture.16.desc: "Нашого збирача податків, відрядженого до [target_location.Custom('LR_GEN')] [target_location.GetName], місцеві управи силою не пустили до міста. Місцева знать посилається на свої давні #italic фуерос#! — правові привілеї, які дають їм повний захист від податків [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], якщо їх явно не схвалять їхні власні збори."
  iberian_culture.16.a: "Шанувати хартії."
  iberian_culture.16.b: "Потреби держави понад усе!"
  iberian_culture.17.title: "Розбійники сьєрри"
  iberian_culture.17.desc: "До [ROOT.GetCountry.GetGovernment.GetCourtTitle] дійшли звістки, що озброєні до зубів розбійники захопили важкопрохідні гірські перевали довкола [target_location.Custom('LR_GEN')] [target_location.GetName]. Вони невпинно грабують валки та обози, що завдає важкого удару торгівлі в усьому краї. Якщо не дати їм відсічі, це може заохотити ще більше людей стати на шлях розбою."
  iberian_culture.17.a: "У нас немає зайвих людей."
  iberian_culture.17.b: "Спорядити виправу, щоб розігнати їх."
  iberian_culture.18.title: "Мистецтво мудехар"
  iberian_culture.18.desc: "Упродовж століть люди в #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! захоплювалися [ShowReligionGroupAdjective('muslim')]им архітектурним стилем, що переважав за часів аль-Андалусу. Чимало зодчих почали переймати різноманітні прийоми мистецтва мудехар у романських та готичних спорудах, від геометричних візерунків до ліпнини. Нещодавно [target_artist.GetName], що служить [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], попросив у престолу дозволу використовувати цей стиль у королівських замовленнях."
  iberian_culture.18.a: "Схвалити його роботу."
  iberian_culture.18.b: "[ShowReligionGroupAdjectiveWithNoTooltip('muslim')]е мистецтво не має асоціюватися з престолом."
  iberian_culture.19.title: "Іспанська готика"
  iberian_culture.19.desc: "Зодчі з усього [ROOT.GetCountry.Custom('rank_ua_GEN')] почали розвивати архітектурний стиль, несхожий на жоден інший у християнському світі. Натхненні величними соборами західних країн та міцними будівельними традиціями наших власних земель, вони звели пам’ятки, що прославляють як славу Божу, так і велич [ROOT.GetCountry.Custom('CL_GEN')]. Цей стиль, відомий як іспанська готика, може на століття лишити свій слід у краї, якщо ми вирішимо плекати його."
  iberian_culture.19.a: "Хай камінь прославляє нашу велич!"
  iberian_culture.19.b: "Краще витратимо засоби на щось інше."
  iberian_culture.20.title: "Проторенесанс"
  iberian_culture.20.desc: "Нові мистецькі віяння, відомі як [ShowInstitutionNameWithNoTooltip('renaissance')], почали доходити до [ROOT.GetCountry.Custom('rank_ua_GEN')] з #TOOLTIP:REGION,italy_region,X #L Італії#!#!, і чимало наших зодчих та художників поєднали цей вплив із нашими звичаями. Багато хто нині замовляє твори під впливом цього нового стилю, і якщо його плекати, цей новий мистецький рух міг би започаткувати добу розквіту та новацій."
  iberian_culture.20.a: "Прийняти цей новий стиль."
  iberian_culture.20.b: "Берегти наші стародавні звичаї."
  iberian_culture.21.title: "Навернення нових християн"
  iberian_culture.21.desc: "Чимало [ShowReligionAdjective('judaism')]ого люду [target_location.Custom('LR_GEN')] [target_location.GetName] вирішили добровільно прийняти хрещення й навернутися до [ShowReligionAdjective('catholic')]ої віри. Багато хто радіє цим наверненим як свідченню успіху Церкви, та дехто сумнівається в їхній щирості, називаючи їх новими християнами, щоб відрізняти від тих, чиї родини сповідують цю віру споконвіку."
  iberian_culture.21.a: "Радо привітати їх у вірі."
  iberian_culture.21.b: "Змусити решту також навернутися."
  iberian_culture.21.b.tt: "Усі [ShowReligionAdjective('judaism')]і [Concept('pops', 'громади')|e] у [target_location.Custom('LR_PREP')] [target_location.GetName] втрачають [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction', 'задоволення')|e]"
  iberian_culture.22.title: "Біг биків (Енсьєрро)"
  iberian_culture.22.desc: "Мешканці #TOOLTIP:LOCATION,cuellar,X #L Куельяра#!#!, поселення, де, як вважають, проводиться найдавніше свято бігу биків в #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!, насилу знаходять кошти на своє щорічне святкування. Вони звернулися до [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] по грошову поміч, обіцяючи: якщо ми підтримаємо їх, свято пройде на честь правителя [target_ruler.GetName] замість Діви Марії Вервиці, їхньої святої покровительки, якій зазвичай присвячені ці урочистості."
  iberian_culture.22.a: "Ми мусимо їм допомогти!"
  iberian_culture.22.b: "Ми не можемо підтримувати це варварське свято!"
  iberian_culture.22.b.tt: "Усі [Concept('pops', 'громади')|e] в #TOOLTIP:LOCATION,cuellar,X #L Куельярі#!#! втрачають [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'задоволення')|e]"
  iberian_culture.23.title: "Культ алумбрадос"
  iberian_culture.23.desc: "До [ROOT.GetCountry.GetGovernment.GetCourtTitle] та церковної ієрархії почали надходити тривожні звістки про дивне містичне братство, яке потай знаходить нових послідовників по [ROOT.GetCountry.Custom('rank_ua_INST')]. Називаючи себе «просвітленими», вони стверджують, що щирі віряни можуть отримати божественне осяяння безпосередньо від Святого Духа, тому священники, таїнства, паломництва і навіть свята меса буцімто непотрібні. Представники стану «[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]» стурбовані тим, що їхнє вчення нагадує протестантські єресі, та закликають розпочати розслідування."
  iberian_culture.23.a: "Приборкати «просвітлених»."
  iberian_culture.23.b: "Не за кожною чуткою криється єретик."
  iberian_culture.23.b.tt: "Якщо залишити це без уваги, вплив культу може поширитися ще дужче"
  iberian_culture.24.title: "Маска спадає"
  iberian_culture.24.desc: "Наше небажання розслідувати чутки довкола «просвітлених» виявилося помилкою. Вплив культу значно зріс у провінції [target_province.GetName], і вони відкрито визнали прихильність до [ShowReligionAdjective('lutheran')]их єресей. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] нині звинувачує [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] у нехтуванні застереженнями та проханнями про розслідування, переконуючи, що рішучі дії відвернули б цей спалах єресі."
  iberian_culture.24.a: "Ми не можемо переслідувати кожного інакодумця."
  iberian_culture.24.a.tt: "15% усіх [ShowReligionAdjective('catholic')]их [Concept('pops', 'громад')|e] у провінції [target_province.GetName] навернуться у [ShowReligionName('lutheran')]"
  iberian_culture.24.a.tt2: "Усі [ShowReligionAdjective('catholic')]і [Concept('pops', 'громади')|e] у провінції [target_province.GetName] втрачають [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] [Concept('pop_satisfaction', 'задоволення')|e]"
  iberian_culture.24.b: "Вони мали рацію, і нам слід діяти обачно."
  iberian_culture.24.b.tt: "5% усіх [ShowReligionAdjective('catholic')]их [Concept('pops', 'громад')|e] у провінції [target_province.GetName] навернуться у [ShowReligionName('lutheran')]"
  iberian_culture.24.b.tt2: "Усі [Concept('pops', 'громади')|e] у провінції [target_province.GetName] втрачають [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] [Concept('pop_satisfaction', 'задоволення')|e]"
  iberian_culture.25.title: "Збереження зрошувальної мережі"
  iberian_culture.25.desc: "За [ShowReligionGroupAdjective('muslim')]ого панування в #TOOLTIP:AREA,granada_area,X #L Гранаді#!#! було споруджено вигадливу [ShowBuildingTypeName('irrigation_systems')], яка несе дорогоцінну воду зі Сьєрра-Невади до нив і садів родючих долин. Бої за цей край завдали значної шкоди цим мережам, від яких місцевий люд здавна залежав заради прожитку."
  iberian_culture.25.a: "Взяти їхню відбудову на власний кошт."
  iberian_culture.25.b: "Ми не можемо дозволити собі такі видатки."
  iberian_culture.26.title: "Шлях до Сантьяго"
  iberian_culture.26.desc: "Щороку тисячі прочан вирушають у далеку путь до #TOOLTIP:LOCATION,santiago_compostela,X #L Сантьяго-де-Компостели#!#!. Їхній рух приніс процвітання незліченним поселенням, однак подорож залишається нелегкою, позаяк багато доріг і мостів на їхньому шляху занепали. Мешканці [target_location.Custom('LR_GEN')] [target_location.GetName] звернулися до [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] із проханням упорядкувати дороги, що ведуть до Компостели, переконуючи, що це водночас зміцнить побожність і пожвавить торгівлю по всьому [ROOT.GetCountry.Custom('rank_ua_INST')]."
  iberian_culture.26.a: "Не шкодувати коштів для прочан."
  iberian_culture.26.b: "Нині у нас є нагальніші справи."
  iberian_culture.27.title: "Згасання звичаю"
  iberian_culture.27.desc: "Поколіннями трубадури #TOOLTIP:AREA,galicia_area,X #L Галісії#! співали свої узвичаєні #italic кантиги#!, послуговуючись діалектом [ShowDialectName('galician_dialect')] — шанованою літературною мовою, чий вплив сягав далеко за межі #TOOLTIP:AREA,galicia_area,X #L галісійської#! землі. Однак оскільки [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.Custom('CL_GEN')] не вживає цю мову, звичай поволі згасає."
  iberian_culture.27.a: "Опікуватися збереженням цього звичаю."
  iberian_culture.27.b: "Посилити вжиток нашої мови."
  iberian_culture.28.title: "Рибальські братства"
  iberian_culture.28.desc: "Рибалки з [target_location.Custom('LR_GEN')] [target_location.GetName] об’єдналися в спілку, яку називають Рибальським братством. Як повідомляють, її мета полягає в регулюванні рибальства, збереженні морських знань та захисті інтересів тих, хто кидає виклик морській стихії. Вона також є опорою місцевої громади, що забезпечує стійкість у скрутні часи, надаючи допомогу своїм членам та їхнім сім’ям."
  iberian_culture.28.a: "Зміцнити їхню спілку."
  iberian_culture.28.b: "Нам потрібен їхній досвід для флоту."
  iberian_culture.29.title: "Розквіт товару [ShowGoodsNameWithNoTooltip('silk')] у Валенсії"
  iberian_culture.29.desc: "Ткачі #TOOLTIP:LOCATION,valencia,X #L Валенсії#! уславилися вишуканими тканинами з #TOOLTIP:GOODS,silk,X #L шовку#!#!, якими захоплюються по всій #TOOLTIP:CONTINENT,europe,X #L Європі#!#!. Багатство, принесене цими квітучими промислами, наповнило скарбниці як купців, так і [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], хоча [ROOT.GetCountry.GetGovernment.GetCourtTitle] не має єдиної думки щодо того, як слід використати це багатство."
  iberian_culture.29.a: "Вкласти кошти в місцеві промисли."
  iberian_culture.29.b: "Ці багатства мають служити [ROOT.GetCountry.Custom('rank_ua_DAT')]."
  iberian_culture.30.title: "Лози Ріохи"
  iberian_culture.30.desc: "У родючих долинах Ебро виноградники Ріохи процвітали поколіннями. Ці землі дають вина виняткової якості, що привернуло увагу наших [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], які тепер бачать нагоду започаткувати великий промисел, розширивши виноградники по [ROOT.GetCountry.Custom('rank_ua_INST')] від межі до межі. Проте [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] ремствують, що це може порушити місцеві звичаї, якими століттями керувалися у виноробстві."
  iberian_culture.30.a: "Розширмо наші виноградники."
  iberian_culture.30.b: "Захистимо наші звичаї виноробства."