l_russian:
  iberian_culture.1.title: "Пісні Реконкісти"
  iberian_culture.1.desc: "Наші сутички з нехристями надихнули менестрелів та простий люд складати пісні про звитягу воїнів, що б’ються за торжество #TOOLTIP:RELIGIONGROUP,christian,X #L християнської#!#! справи. Слава про нас шириться по [ROOT.GetCountry.Custom('rank_ua_DAT')|l] — і її можна обернути собі на користь: нехай пісні наснажують наших вояків у бою, і тоді, можливо, під наші знамена стане ще більше сміливців."
  iberian_culture.1.a: "Нехай вони лунають на полі бою!"
  iberian_culture.1.b: "Ці пісні спонукають інших ставати під наші знамена!"
  iberian_culture.2.title: "Герой Реконкісти"
  iberian_culture.2.desc: "Проти #ONCLICK:COUNTRY,[GetCountry('GRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GRA').GetKey],X [GetCountry('GRA').Custom('CL_GEN')|L]#!#! билося чимало відважних вояків, але надто [Select_CString(new_general.IsFemale, 'відзначилася', 'відзначився')] [new_general.GetName], [Select_CString(new_general.IsFemale, 'яка виявила', 'який виявив')] у бою мужність і хист. Слава про [Select_CString(new_general.IsFemale, 'неї', 'нього')] розійшлася по [ROOT.GetCountry.Custom('rank_ua_DAT')|l], і багато хто при дворі каже, що такому звитяжному воїну слід довірити командування за [Select_CString(new_general.IsFemale, 'її', 'його')] заслугами."
  iberian_culture.2.a: "[Select_CString(new_general.IsFemale, 'Вона', 'Він')] поведе наші війська."
  iberian_culture.2.b: "[Select_CString(new_general.IsFemale, 'Її', 'Його')] здібностям знайдеться інше застосування."
  iberian_culture.3.title: "Заселення півдня"
  iberian_culture.3.desc: "Після того як #TOOLTIP:AREA,granada_area,X #L Гранада#!#! нарешті була звільнена з-під #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманського#!#! панування, чимало родин звернули погляди до цих земель у сподіванні знайти нові можливості. Останнім часом до нас доходять звістки про переселенців із провінції [origin_province.GetName]: для багатьох провінція [target_province.GetName] — місце, де можна оселитися на покинутій землі та почати нове життя."
  iberian_culture.3.a: "Нехай прибувають."
  iberian_culture.3.b: "Спробуємо обмежити кількість переселенців."
  iberian_culture.4.title: "Чудесне явлення Діви Марії"
  iberian_culture.4.desc: "До нас дійшла звістка, що в [target_location.Custom('LR_PREP')|l] [target_location.GetName] нібито сталося диво: на схилі пагорба, що височіє над поселенням, з’явилася сама пресвята Діва Марія. Хоча багато хто ставиться до цієї оповідки з недовірою, новина вже розійшлася далеко за межі околиць, і тепер сюди звідусіль стікаються прочани. Місцеві спритники вже заробляють на приїжджих, що переповнили вулиці, а до скарбниці потекли щедрі пожертви, тож тепер усе частіше лунає питання, як розпорядитися цим несподівано набутим багатством."
  iberian_culture.4.a: "Вкладемо ці гроші в місцеві потреби."
  iberian_culture.4.b: "Ці пожертви отрима[ROOT.GetCountry.Custom('clergy_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l]."
  iberian_culture.4.c: "Роздамо біднякам милостиню."
  iberian_culture.4.d: "Нехай [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] займ[ROOT.GetCountry.Custom('crown_etsautsa')] цими пожертвами."
  iberian_culture.5.title: "Повернення з північних морів"
  iberian_culture.5.desc: "#TOOLTIP:CULTURE,$basque_tt$,X #L Баскські#!#! китобої повернулися з чергової виправи в далекі північні моря. Їх не зламали жорстокі бурі й не згубили незвідані для більшости мореплавців води; вони привезли додому не лише коштовний вантаж, а й справжнє багатство — безцінні знання. Тепер наш [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] сперечається, як якнайкраще застосувати ці уроки з найбільшою користю для країни."
  iberian_culture.5.a: "Нехай кожна нова виправа буде уроком."
  iberian_culture.5.b: "Океан безмежний; безмежні й можливості, які він відкриває."
  iberian_culture.6.title: "Вправний митець-мудехар"
  iberian_culture.6.desc: "По [ROOT.GetCountry.Custom('rank_ua_DAT')|l] шириться слава про майстерного митця-#TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманина#!#! на ім’я [target_character.GetName]. Не лишається осторонь і наш [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]: придворні радять запросити [Select_CString(target_character.IsFemale, 'її', 'його')] до двору, щоби [Select_CString(target_character.IsFemale, 'її', 'його')] хист служив нам, однак численн[ROOT.GetCountry.Custom('clergy_yiaei')|l] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] заперечу[ROOT.GetCountry.Custom('clergy_yeyut')] проти того, щоби виявляти таку шану мудехару."
  iberian_culture.6.a: "Хист не залежить від віри."
  iberian_culture.6.b: "Такої шани заслуговують лише #TOOLTIP:RELIGIONGROUP,christian,X #L християни#!#!."
  iberian_culture.7.title: "Суперечка на ринку"
  iberian_culture.7.desc: "У [target_location.Custom('LR_PREP')|l] [target_location.GetName] почалися чвари: #TOOLTIP:RELIGION,$sunni_tt$,X #L сунітські#!#! та #TOOLTIP:RELIGION,$catholic_tt$,X #L католицькі#!#! купці звинувачують одне одного в тому, що місцеві чиновники та гільдії несправедливо опікуються лише однією стороною. Вони просять, щоб [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] втрути[ROOT.GetCountry.Custom('crown_vlaloly')]ся та розв’яза[ROOT.GetCountry.Custom('crown_vlaloly')] цю суперечку."
  iberian_culture.7.a: "Справедливість має перемогти."
  iberian_culture.7.a.tt1: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх #TOOLTIP:RELIGION,$sunni_tt$,X #L сунітських#!#! [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] підвищується на [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"
  iberian_culture.7.a.tt2: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх #TOOLTIP:RELIGION,$catholic_tt$,X #L католицьких#!#! [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] знижується на [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]"
  iberian_culture.7.b: "Ми маємо захистити своїх."
  iberian_culture.7.b.tt1: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх #TOOLTIP:RELIGION,$sunni_tt$,X #L сунітських#!#! [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] знижується на [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]"
  iberian_culture.7.b.tt2: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх #TOOLTIP:RELIGION,$catholic_tt$,X #L католицьких#!#! [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] підвищується на [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"
  iberian_culture.7.c: "Нехай самі розбираються."
  iberian_culture.8.title: "Суперечка через звичаї мудехарів"
  iberian_culture.8.desc: "У [target_location.Custom('LR_PREP')|l] [target_location.GetName] місцеві #TOOLTIP:RELIGION,$sunni_tt$,X #L суніти#!#! знову зібралися, щоб відсвяткувати одне зі своїх звичаєвих свят, як робили їхні пращури впродовж багатьох поколінь. Хоча багато хто вважає ці святкування невинною частиною повсякденного життя, [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] вимага[ROOT.GetCountry.Custom('clergy_yeyut')] від нас їх заборонити, оскільки [ROOT.GetCountry.GetFlavorRank|l] — #TOOLTIP:RELIGION,$catholic_tt$,X #L католицька#!#! країна, а подібні свята суперечать її засадам."
  iberian_culture.8.a: "Не будемо перешкоджати святкуванням."
  iberian_culture.8.a.tt: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх #TOOLTIP:RELIGION,$sunni_tt$,X #L сунітських#!#! [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] підвищується на [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"
  iberian_culture.8.b: "Заборонити святкування."
  iberian_culture.8.b.tt: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх #TOOLTIP:RELIGION,$sunni_tt$,X #L сунітських#!#! [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] знижується на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
  iberian_culture.9.title: "Розквіт мудехарського подвір’я"
  iberian_culture.9.desc: "Мудехарське подвір’я у [target_location.Custom('LR_PREP')|l] [target_location.GetName] переживає розквіт: сюди стікаються численні ремісники та торговці, чия працьовитість забезпечує зростання добробуту місцевої громади. Зростання багатства мудехарів життєдайно впливає на господарство [target_location.Custom('LR_GEN')|l], проте дехто з місцевої знаті починає побоюватися, що одного дня її вплив зрівняється з їхнім власним."
  iberian_culture.9.a: "Процвітання обернеться добром для всіх."
  iberian_culture.9.b: "Вилучити частину багатств мудехарів, щоб обмежити їхній вплив."
  iberian_culture.9.b.tt: "[Concept('pop_satisfaction', 'Задоволення')|e] всіх #TOOLTIP:RELIGION,$sunni_tt$,X #L сунітських#!#! [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] знижується на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
  iberian_culture.10.title: "Славетні мудехарські лікарі"
  iberian_culture.10.desc: "Мудехарські лікарі останнім часом здобули широке визнання у [ROOT.GetCountry.Custom('rank_ua_PREP')|l], і численн[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] дедалі частіше зверта[ROOT.GetCountry.Custom('nobles_yetsayutsa')] до них по допомогу. Деякі наші радники пропонують офіційно призначити їх лікарями [ROOT.GetCountry.GetAdjective|l]ого двору, проте впливов[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] рішуче виступа[ROOT.GetCountry.Custom('clergy_yeyut')] проти цього."
  iberian_culture.10.a: "Лікарське мистецтво важливіше за віру."
  iberian_culture.10.b: "Краще призначити християнського лікаря."
  iberian_culture.11.title: "Конверсо під підозрою"
  iberian_culture.11.desc: "До [ROOT.GetCountry.GetAdjective|l]ого двору дійшли вісті про те, що [target_character.GetName], вправний купець із родини, що раніше сповідувала #TOOLTIP:RELIGION,$judaism_tt$,X #L юдаїзм#!#!, звинувачений у тому, що він і надалі таємно справляє обряди своєї колишньої віри. Згідно з отриманим листом, він читав заборонені молитви та брав участь у таємних зібраннях, проте дехто стверджує, що ці звинувачення викликані заздрістю та суперечками через борги."
  iberian_culture.11.a: "Нехай наші церковні суди розслідують ці єретичні діяння."
  iberian_culture.11.b: "Це мерзенний наклеп!"
  iberian_culture.12.title: "Звинувачення проти сефардських купців"
  iberian_culture.12.desc: "Кількох видатних #TOOLTIP:CULTURE,$sephardi_tt$,X #L сефардських#!#! купців із [target_location.Custom('LR_GEN')|l] [target_location.GetName] звинувачують у тому, що вони нажили багатство в незаконний спосіб: користалися шпаринами в оподаткуванні, займалися лихварством або змінювали ціни заради власного зиску. Попри те, що ці звинувачення йдуть від їхніх суперників, і ми не можемо знати достеменно, правдиві вони чи ні, необхідно вжити заходів, доки розбрат не переріс у дещо більше."
  iberian_culture.12.a: "Конфіскувати їхні статки."
  iberian_culture.12.a.tt: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх [Concept('pops', 'громад')|e] #TOOLTIP:CULTURE,$sephardi_tt$,X #L сефардських#!#! #TOOLTIP:POPTYPE,burghers,X #L містян#!#! знижується на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
  iberian_culture.12.b: "Не можна діяти, спираючись лише на голослівні звинувачення."
  iberian_culture.12.b.tt: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName], які не належать до #TOOLTIP:CULTURE,$sephardi_tt$,X #L сефардських#!#! #TOOLTIP:POPTYPE,burghers,X #L містян#!#!, знижується на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
  iberian_culture.13.title: "Боротьба зі спекою та пошестю"
  iberian_culture.13.desc: "У південних землях [ROOT.GetCountry.Custom('rank_ua_GEN')|l] існує звичай білити будівлі гашеним вапном, завдяки чому в них легше втримати прохолоду під пекучим сонцем. Крім того, вважається, що вапно стає на заваді поширенню хвороб. Жителі [target_location.Custom('LR_GEN')|l] [target_location.GetName] нещодавно зіткнулися з браком гашеного вапна, і [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] отрима[ROOT.GetCountry.Custom('crown_vlaloly')] їхнє прохання допомогти їм захистити свої домівки."
  iberian_culture.13.a: "Виділити їм потрібну кількість гашеного вапна."
  iberian_culture.13.a.tt: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] зростає на [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"
  iberian_culture.13.b: "У нас немає зайвих грошей."
  iberian_culture.13.b.tt: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] знижується на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
  iberian_culture.14.title: "Суперечка через королівські перегінні шляхи"
  iberian_culture.14.desc: "Зміна пір року знаменує початок сезонного перегону мільйонів овець шляхами Каньядас-Реалес — старовинними королівськими перегінними дорогами, що перетинають наші землі. Проте жителі [target_location.Custom('LR_GEN')|l] [target_location.GetName] відмовляються пропускати пастухів через своє поселення, побоюючись, що худоба витопче їхні ниви."
  iberian_culture.14.a: "Зберегти за пастухами їхнє давнє право проходу."
  iberian_culture.14.a.tt: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх [Concept('pops', 'громад')|e] #TOOLTIP:POPTYPE,peasants,X #L селян#!#! у [target_location.Custom('LR_PREP')|l] [target_location.GetName] знижується на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
  iberian_culture.14.b: "Залагодимо суперечку на користь місцевого люду."
  iberian_culture.15.title: "Суперечка у Водному суді"
  iberian_culture.15.desc: "Звичаєвий Водний суд нещодавно взявся до розгляду позову між [target_location_1.Custom('LR_INST')|l] [target_location_1.GetName] та [target_location_2.Custom('LR_INST')|l] [target_location_2.GetName]. Під пекучим літнім сонцем у краї бракує води, щоб сповна забезпечити ниви обох поселень, тому їхні жителі затіяли позов щодо прав на її розподіл."
  iberian_culture.15.a: "Насамперед слід забезпечити [target_location_1.Custom('LR_ACC')|l] [target_location_1.GetName]."
  iberian_culture.15.b: "Ниви [target_location_2.Custom('LR_GEN')|l] [target_location_2.GetNameWithNoTooltip] важливіші."
  iberian_culture.15.c: "Воду слід розподілити порівну."
  iberian_culture.16.title: "Захист фуерос"
  iberian_culture.16.desc: "Нашому збирачеві податків, відрядженому у [target_location.Custom('LR_ACC')|l] [target_location.GetName], місцеві магістрати не дозволили ввійти до міста. Місцева знать посилається на свої прадавні #italic фуерос#! — привілеї, закріплені законами, що цілковито звільняють її від податків, які збира[ROOT.GetCountry.Custom('crown_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l], крім випадків, коли місцеві збори прямо дозволяють їхній збір."
  iberian_culture.16.a: "Закони слід поважати."
  iberian_culture.16.b: "Потреби держави понад усе!"
  iberian_culture.17.title: "Розбійники Сьєрри"
  iberian_culture.17.desc: "До [ROOT.GetCountry.GetAdjective|l]ого двору дійшли звістки про те, що добре озброєні розбійники зайняли гірські перевали довкола [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Вони грабують каравани й обози, що проходять повз, паралізуючи торгівлю в усьому регіоні. Якщо їх не спинити, це може спонукати й інших стати на шлях розбою."
  iberian_culture.17.a: "Нам самим бракує сил."
  iberian_culture.17.b: "Спорядити виправу, щоб прочесати гори."
  iberian_culture.18.title: "Мудехарське мистецтво"
  iberian_culture.18.desc: "Упродовж століть жителі #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! захоплювалися #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламською#!#! архітектурою, яка панувала в часи Аль-Андалусу. Чимало архітекторів почали додавати різні елементи мудехарського мистецтва до романських і готичних споруд — чи то геометричні орнаменти, чи декоративне ліплення. Нещодавно [target_artist.GetName], [Select_CString(target_artist.IsFemale, 'яку', 'якого')] найня[ROOT.GetCountry.Custom('crown_vlaloly')] [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l], [Select_CString(target_artist.IsFemale, 'звернулася', 'звернувся')] по дозвіл використовувати цей стиль у королівських замовленнях."
  iberian_culture.18.a: "Дати свою згоду."
  iberian_culture.18.b: "Престол не повинен асоціюватися з ісламським мистецтвом."
  iberian_culture.19.title: "Іспанська готика"
  iberian_culture.19.desc: "Будівничі в усіх куточках [ROOT.GetCountry.Custom('rank_ua_GEN')|l] почали розвивати архітектурний стиль, що не має собі рівних у християнському світі. Узявши за основу спрямовані у височінь собори західних країн і давні будівничі звичаї наших земель, вони зводять пам’ятки, що прославляють Господа та велич #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Цей стиль, знаний як «іспанська готика», може на віки змінити вигляд нашої країни, якщо ми візьмемо його під опіку."
  iberian_culture.19.a: "Нехай камінь сповістить про нашу славу!"
  iberian_culture.19.b: "Краще витратимо засоби на щось інше."
  iberian_culture.20.title: "Проторенесанс"
  iberian_culture.20.desc: "З #TOOLTIP:REGION,italy_region,X #L Італії#!#! до наших земель почали доходити нові мистецькі ідеї під назвою [ShowInstitutionNameWithNoTooltip('renaissance')]. Чимало наших архітекторів і художників почали поєднувати ці віяння з місцевими звичаями. Усе частіше жителі [ROOT.GetCountry.Custom('rank_ua_GEN')|l] замовляють витвори, створені під впливом цього нового стилю, і якщо ми будемо його заохочувати, цей новий мистецький рух може відкрити шлях до доби розквіту та новаторства."
  iberian_culture.20.a: "Привітати цей новий звичай."
  iberian_culture.20.b: "Збережемо наші прадавні звичаї."
  iberian_culture.21.title: "Навернення нових християн"
  iberian_culture.21.desc: "Чимало #TOOLTIP:RELIGION,$judaism_tt$,X #L юдеїв#!#! [target_location.Custom('LR_GEN')|l] [target_location.GetName] вирішило добровільно прийняти хрещення та перейти до #TOOLTIP:RELIGION,$catholic_tt$,X #L католицької#!#! віри. Для одних ці новонавернені стали свідченням торжества Церкви, а інші сумніваються в щирості їхнього навернення та називають їх новими християнами, відокремлюючи від тих, чиї родини тримаються католицтва протягом багатьох поколінь."
  iberian_culture.21.a: "Прийняти їх до лона Церкви."
  iberian_culture.21.b: "Примножити лави новонавернених силою."
  iberian_culture.21.b.tt: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейських#!#! [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] знижується на [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]"
  iberian_culture.22.title: "Енсьєрро"
  iberian_culture.22.desc: "Жителі міста [ShowLocationName('cuellar')], де, за переказами, відбувається найстаріше в #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! енсьєрро, або свято з бігом биків, зіткнулися з браком коштів на проведення щорічних урочистостей. [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|U] отрима[ROOT.GetCountry.Custom('crown_vlaloly')] прохання надати необхідні кошти, натомість же містяни обіцяють, що [Select_CString(target_ruler.IsFemale, 'покровителькою', 'покровителем')] свята буде [Select_CString(target_ruler.IsFemale, 'названа', 'названий')] [target_ruler.GetName], а не Пресвята Діва Марія, Цариця Святого Розарію, на честь якої його зазвичай проводять."
  iberian_culture.22.a: "Ми мусимо їм допомогти!"
  iberian_culture.22.b: "Ми не можемо заохочувати це варварське видовище!"
  iberian_culture.22.b.tt: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх [Concept('pops', 'громад')|e] у місті [ShowLocationName('cuellar')] знижується на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
  iberian_culture.23.title: "Культ алумбрадос"
  iberian_culture.23.desc: "До [ROOT.GetCountry.GetAdjective|l]ого двору та церковної влади дійшли тривожні звістки про дивне містичне братство, яке потай набирає до своїх лав нових членів у всіх куточках [ROOT.GetCountry.Custom('rank_ua_GEN')|l]. Його послідовники називають себе ілюмінатами, або просвіченими, і стверджують, що істинна віра дає змогу знайти божественне просвітлення від Святого Духа, а тому священники, таїнства, паломництва і навіть свята меса їм не потрібні. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|U] побою[ROOT.GetCountry.Custom('clergy_yetsayutsa')] схожости цих учень із протестантськими єресями та вимага[ROOT.GetCountry.Custom('clergy_yeyut')] розпочати розслідування."
  iberian_culture.23.a: "Покласти край ілюмінатам."
  iberian_culture.23.b: "Не кожна чутка вказує на єретика."
  iberian_culture.23.b.tt: "Якщо не вжити заходів, вплив культу ширитиметься й надалі."
  iberian_culture.24.title: "Маски скинуто"
  iberian_culture.24.desc: "Наше небажання розслідувати чутки про ілюмінатів було помилкою. Вплив культу значно посилився у провінції [target_province.GetName], тож його послідовники тепер відкрито визнають прихильність до #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранських#!#! єресей. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|U] докоря[ROOT.GetCountry.Custom('clergy_yeyut')] владі за те, що та знехтувала застереженнями та проханнями про розслідування, і стверджу[ROOT.GetCountry.Custom('clergy_yeyut')], що якби [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] вжи[ROOT.GetCountry.Custom('crown_vlaloly')] рішучих заходів, це дало б змогу запобігти поширенню цієї єресі."
  iberian_culture.24.a: "Ми не можемо переслідувати всіх незгодних."
  iberian_culture.24.a.tt: "15% #TOOLTIP:RELIGION,$catholic_tt$,X #L католицьких#!#! [Concept('pops', 'громад')|e] навернеться до іншої віри — #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранства#!#!"
  iberian_culture.24.a.tt2: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх #TOOLTIP:RELIGION,$catholic_tt$,X #L католицьких#!#! [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] знижується на [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%]"
  iberian_culture.24.b: "Вони мали рацію. Нам слід виявити обачність."
  iberian_culture.24.b.tt: "5% #TOOLTIP:RELIGION,$catholic_tt$,X #L католицьких#!#! [Concept('pops', 'громад')|e] навернеться до іншої віри — #TOOLTIP:RELIGION,$lutheran_tt$,X #L лютеранства#!#!"
  iberian_culture.24.b.tt2: "[Concept('pop_satisfaction', 'Задоволення')|e] усіх [Concept('pops', 'громад')|e] у провінції [target_province.GetName] знижується на [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%]"
  iberian_culture.25.title: "Збереження зрошення"
  iberian_culture.25.desc: "За #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламського#!#! правління в #TOOLTIP:AREA,granada_area,X #L Гранаді#!#! було зведено складні #TOOLTIP:BUILDING_TYPE,irrigation_systems,X #L зрошувальні споруди#!#!, якими дорогоцінна вода зі Сьєрра-Невади надходить на поля та до садів родючих долин. Боротьба за цей край завдала величезної шкоди зрошувальній мережі, від якої споконвіку залежало життя місцевих жителів."
  iberian_culture.25.a: "Виділити кошти на їх відбудову."
  iberian_culture.25.b: "Це нам не по кишені."
  iberian_culture.26.title: "Шлях до Сантьяго"
  iberian_culture.26.desc: "Щороку тисячі паломників вирушають у далеку дорогу до #TOOLTIP:LOCATION,santiago_compostela,X #L Сантьяго-де-Компостели#!#!. Їхня проща приносить розквіт багатьом поселенням, однак сама подорож лишається нелегкою, бо чимало доріг та мостів занепало. Жителі [target_location.Custom('LR_GEN')|l] [target_location.GetName] звернулися з проханням до [ROOT.GetCountry.GetAdjective|l]ого двору, щоб [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] повелі[ROOT.GetCountry.Custom('crown_vlaloly')] полагодити дороги, що ведуть до Компостели. Вони вважають, що таке рішення зміцнить як віру, так і торгівлю в усіх куточках [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  iberian_culture.26.a: "На паломників жодних грошей не шкода."
  iberian_culture.26.b: "Зараз у нас є важливіші справи."
  iberian_culture.27.title: "Звичай, що згасає"
  iberian_culture.27.desc: "Століттями #TOOLTIP:AREA,galicia_area,X #L галісійські#!#! трубадури складали свої старовинні #italic кантиги#! на #TOOLTIP:DIALECT,galician_dialect,X #L галісійському#!#! діалекті — шанованій літературній мові, чий вплив давно сягнув далеко за межі самої #TOOLTIP:AREA,galicia_area,X #L Галісії#!#!. Однак оскільки ця говірка не є офіційною мовою [ROOT.GetCountry.GetAdjective|l]ого двору #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, цей пісенний звичай поступово згасає."
  iberian_culture.27.a: "Варто підтримати збереження цього звичаю."
  iberian_culture.27.b: "Поширимо вжиток нашої мови."
  iberian_culture.28.title: "Рибальські братства"
  iberian_culture.28.desc: "Рибалки [target_location.Custom('LR_GEN')|l] [target_location.GetName] об’єдналися у спілку, яку назвали Рибальським братством. Подейкують, воно впорядковуватиме рибний промисел, берегтиме знання про морську справу та захищатиме інтереси тих, хто наважується виходити в море. У скрутні часи братство слугує опорою місцевій громаді, допомагаючи своїм учасникам та їхнім родинам."
  iberian_culture.28.a: "Підтримати їхню спілку."
  iberian_culture.28.b: "Їхні знання стануть у пригоді нашому флоту."
  iberian_culture.29.title: "Розквіт валенсійського шовку"
  iberian_culture.29.desc: "#TOOLTIP:LOCATION,valencia,X #L Валенсійські#!#! ткачі прославилися своїми чудовими тканинами з #TOOLTIP:GOODS,silk,X #L шовку#!#!, якими захоплюються по всій #TOOLTIP:CONTINENT,europe,X #L Європі#!#!. Купці та [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] нечувано збагатилися завдяки цьому успішному промислу. Втім, при [ROOT.GetCountry.GetAdjective|l]ому дворі немає єдиної думки про те, як слід розпорядитися цим багатством."
  iberian_culture.29.a: "Вкласти ці кошти в розвиток місцевих промислів."
  iberian_culture.29.b: "Ці багатства послужать [ROOT.GetCountry.Custom('rank_ua_DAT')|l]."
  iberian_culture.30.title: "Виноградники Ріохи"
  iberian_culture.30.desc: "Родючі долини Ебро здавна славляться виноградниками Ріохи. Тут виробляють вина відмінної якості, і наш[ROOT.GetCountry.Custom('burghers_aei')|l] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] побачи[ROOT.GetCountry.Custom('burghers_vlaloly')] в цьому нагоду перетворити винарство на велику галузь, заклавши нові виноградники по всіх провінціях [ROOT.GetCountry.Custom('rank_ua_GEN')|l]. Однак [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] виступа[ROOT.GetCountry.Custom('peasants_yeyut')] проти, побоюючись, що подібні зміни поставлять під загрозу місцеві звичаї, якими віками керувалися під час виробництва вина."
  iberian_culture.30.a: "Розширимо наші виноградники."
  iberian_culture.30.b: "Захистити наші звичаї винарства."