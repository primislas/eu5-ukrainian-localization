l_russian:
  maghrebi_culture_masters_of_sahara_country_bonus: "Наступний бонус можна отримати завдяки [Concept('decision', 'рішенню')|e]\n$maghreb_masters_of_the_sahara.title$:"
  maghrebi_culture_masters_of_sahara_desert_location_bonus: "Наступний бонус можна отримати завдяки [Concept('decision', 'рішенню')|e]\n$maghreb_masters_of_the_sahara.title$, і він впливатиме на #TOOLTIP:VEGETATION,desert,X #L пустельні#!#! [Concept('locations', 'місцевості')|e]:"
  maghrebi_culture_masters_of_sahara_arid_location_bonus: "Наступний бонус можна отримати завдяки [Concept('decision', 'рішенню')|e]\n$maghreb_masters_of_the_sahara.title$, і він впливатиме на #TOOLTIP:CLIMATE,arid,X #L посушливі#!#! [Concept('locations', 'місцевості')|e]:"
  maghrebi_culture.1.title: "[ShowReligionAdjectiveWithNoTooltip('judaism')]а громада [target_location.Custom('LR_GEN')] [target_location.GetNameWithNoTooltip]"
  maghrebi_culture.1.desc: "Хоча значна частина [ShowCultureName('mustaarabi')|l]ого люду #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! була вигнана за панування Альмохадів, [target_location.GetName] знову став осередком, де знайшли прихисток численні мустараби. Тоді як [ROOT.GetCountry.GetAdjective|l]ий [ROOT.GetCountry.GetGovernment.GetCourtTitle] дотримується терпимішої політики щодо [ShowReligionAdjective('judaism')|l]ої віри, деяк[ROOT.GetCountry.Custom('clergy_yiaei')] радикальніш[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] вислови[ROOT.GetCountry.Custom('clergy_vlaloly')] бажання повернутися до відкинутих догматів Альмохадів."
  maghrebi_culture.1.a: "[target_location.GetNameWithNoTooltip] залишиться прихистком для [ShowCultureNameWithNoTooltip('mustaarabi')|l]ого люду."
  maghrebi_culture.1.b: "Прислухатися до радикального духовенства і змусити їх прийняти [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]."
  maghrebi_culture.2.title: "[ReligionAdjectiveWithNoTooltip('ibadi')]і землі Магрибу"
  maghrebi_culture.2.desc: "Хоча минуло чимало часу відтоді, як могутня [ReligionAdjectiveWithNoTooltip('ibadi')]а країна мала вплив у #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#!, [our_ruler.GetName] докладає значних зусиль, щоб об'єднати решту князівств, які все ще бережуть [ShowReligionAdjective('ibadi')|l]у віру. Хоча землі #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! не такі багаті, як у деяких розвиненіших країнах Магрибу, успіхи, яких досягає [our_ruler.GetShortNameWithNoTooltip], ще можуть привести до постання нової [ShowReligionAdjectiveWithNoTooltip('ibadi')]ої держави."
  maghrebi_culture.2.a: "Ми прокладемо шлях до сильної [ReligionAdjectiveWithNoTooltip('ibadi')]ої держави в Магрибі!"
  maghrebi_culture.2.b: "Натомість краще зосередитися на власному шляху."
  maghrebi_culture.3.title: "Відродження [ReligionAdjectiveWithNoTooltip('ibadi')]ого панування в #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#!"
  maghrebi_culture.3.desc: "Правителю [our_ruler.GetName] вдалося здійснити неможливе й створити нове [ShowReligionAdjective('ibadi')|l]е володіння в #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#!. Тепер, коли [ROOT.GetCountry.GetName] є однією з провідних сил у Магрибі, деякі сановники, що складають [ROOT.GetCountry.GetGovernment.GetCourtTitle], закликають правителя [our_ruler.GetName] запровадити нову політику щодо інших течій #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламу#!#!. Хоча нова [ShowReligionAdjectiveWithNoTooltip('ibadi')]а країна привабила нових вірян, багато людей у Магрибі й далі сповідують [ShowReligionAdjective('sunni')|l]у віру."
  maghrebi_culture.3.a: "Ми запровадимо політику терпимости до всіх течій ісламу."
  maghrebi_culture.3.b: "Послідовники інших течій мусять прийняти ібадизм."
  maghrebi_culture.4.title: "Молоді [ReligionAdjectiveWithNoTooltip('ibadi')]і князівства #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#!"
  maghrebi_culture.4.desc: "Хоча колись визначний [ShowReligionAdjective('ibadi')|l]ий султанат мав великий вплив у #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#!, століття після падіння Рустамідів призвели до того, що численні ревні [ShowReligionAdjectiveWithNoTooltip('ibadi')]і віряни переселилися до області [ShowAreaName('desert_area')]. Тепер, коли володіння #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! простягаються до цих країв, деякі сановники, що складають [ROOT.GetCountry.GetGovernment.GetCourtTitle], радять правителю [our_ruler.GetName] розпочати походи проти #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_GEN')|L]#!#! — одного зі слабших уламкових князівств."
  maghrebi_culture.4.a: "Скористатися слабкістю [target_country.Custom('CL_GEN')]!"
  maghrebi_culture.4.b: "Вони надто роздроблені й далекі, щоб становити загрозу."
  maghrebi_culture.5.title: "Підкорення магрибського [ShowReligionAdjectiveWithNoTooltip('ibadi')]ого люду"
  maghrebi_culture.5.desc: "Хоча область [ShowAreaName('desert_area')] уже деякий час була домівкою для чималого [ShowReligionAdjectiveWithNoTooltip('ibadi')]ого люду, більшість її населення опинилася під владою #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Тепер, коли в [ROOT.GetCountry.Custom('CL_PREP')] живе значна кількість послідовників ібадизму, [ROOT.GetCountry.GetGovernment.GetCourtTitle] закликає правителя [our_ruler.GetName] запровадити політику терпимости до [ShowReligionAdjectiveWithNoTooltip('ibadi')]их вірян, аби країна не зазнала смути через віру."
  maghrebi_culture.5.a: "Вони мусять прийняти [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]."
  maghrebi_culture.5.b: "Натомість прагнути мирно підпорядкувати [ShowReligionAdjectiveWithNoTooltip('ibadi')]ий люд."
  maghrebi_culture.6.title: "Зростання впливу [ROOT.GetCountry.Custom('CL_GEN')]"
  maghrebi_culture.6.desc: "Хоча впродовж десятиліть після падіння Альмохадів [target_country_1.GetName] та [target_country.GetName] мали значний вплив у #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#!, під проводом правителя [our_ruler.GetName] [target_country.GetNameWithNoTooltip] зумі[target_country.Custom('end_vlaloly')] створити могутнє володіння в цьому краї. Хоча знать [target_country_1.Custom('CL_GEN')] та [target_country_1.Custom('CL_GEN')] з осторогою сприймає [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ий вплив, чимало магрибських народів прихильніше ставляться до нашої влади."
  maghrebi_culture.6.a: "Ми підкоримо Магриб [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ій владі!"
  maghrebi_culture.7.title: "Зрошення пальм у [target_location.Custom('LR_PREP')] [target_location.GetNameWithNoTooltip]"
  maghrebi_culture.7.desc: "Хоча багато земель [ShowRegionName('maghreb_region')|l]у родючі, тут вистачає й суворих країв через сусідство з #TOOLTIP:AREA,desert_area,X #L пустелею#!#!.\n\n[target_location.GetName] просить виділити кошти на спорудження нової #TOOLTIP:BUILDING_TYPE,maghreb_palm_irrigation,X #L мережі зрошення пальм#!#! у межах [target_location.Custom('LR_GEN')] [target_location.GetName], сподіваючись полегшити тяжке життя в поселенні."
  maghrebi_culture.7.a: "Виділити засоби місцевим #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L містянам#!#! на розбудову мережі зрошення."
  maghrebi_culture.7.b: "У нас немає зайвих засобів."
  maghrebi_culture.8.title: "Вишукана архітектура в [target_location.Custom('LR_PREP')] [target_location.GetNameWithNoTooltip]"
  maghrebi_culture.8.desc: "Хоча мешканці [target_location.Custom('LR_GEN')] [target_location.GetName] давно відомі вмінням пристосовувати будівлі до суворих умов #TOOLTIP:VEGETATION,desert,X #L пустелі#!#!, зодчі, яких відрядив наш [ROOT.GetCountry.GetGovernment.GetCourtTitle], повернулися враженими побаченим. Дарма що земля, де розташована столиця [ROOT.GetCountry.GetCapital.GetName], відрізняється від земель [target_location.Custom('LR_GEN')] [target_location.GetNameWithNoTooltip], наші будівничі вважають, що за підтримки правителя [our_ruler.GetName] подібні поліпшення можна втілити і у [ROOT.GetCountry.GetCapital.Custom('LR_GEN')] [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]."
  maghrebi_culture.8.a: "Запозичити будівельний стиль [target_location.Custom('LR_GEN')] [target_location.GetNameWithNoTooltip]."
  maghrebi_culture.8.b: "Натомість варто надати додаткову допомогу [target_location.Custom('LR_DAT')] [target_location.GetNameWithNoTooltip]."
  maghrebi_culture.9.title: "[ShowCultureGroupNameWithNoTooltip('amazigh_group')|l]і звичаї"
  maghrebi_culture.9.desc: "Відколи в XI столітті за підтримки Фатімідів до [ShowRegionName('maghreb_region')|l]у переселилося багато [ShowCultureName('bedouin_culture')]их племен, численні місцеві #TOOLTIP:CULTUREGROUP,amazigh_group,X #L амазиги#!#! мусили визнати владу нової [ShowCultureGroupName('arabic_group')|l]ої верхівки. Хоча під рукою [ROOT.GetCountry.Custom('CL_GEN')] численні амазиги зберегли свої вольності, дехто з тих, хто складає [ROOT.GetCountry.GetGovernment.GetCourtTitle], радить залучити частину цієї [ShowCultureGroupNameWithNoTooltip('arabic_group')|l]ої #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#! до [ROOT.GetCountry.Custom('CL_GEN')], щоб зміцнити наше право на владу. Втім, це запрошення напевне розлютить #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племена#!#!
."
  maghrebi_culture.9.a: "Нам слід шукати порозуміння з [ShowCultureGroupNameWithNoTooltip('arabic_group')|l]ою верхівкою."
  maghrebi_culture.9.b: "Натомість ми повинні берегти [ShowCultureGroupNameWithNoTooltip('amazigh_group')|l]і звичаї."
  maghrebi_culture.10.title: "Зростання ваги [target_location.Custom('LR_GEN')] [target_location.GetNameWithNoTooltip] для сахарської торгівлі"
  maghrebi_culture.10.desc: "Розташоване обабіч одного з численних торгових шляхів #TOOLTIP:AREA,desert_area,X #L сахарських оаз#!#!, [target_location.GetName] вже давно є важливою зупинкою для купців, яких представля[ROOT.GetCountry.Custom('peasants_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l]. Проте останніми роками під захистом [ROOT.GetCountry.Custom('CL_GEN')] цей [target_location.GetRank.GetName] набув ще більшого значення: багато торговців обирають його для перепочинку, знаючи, що [ROOT.GetCountry.GetAdjective|l]і землі безпечні для мандрів. Хоча слава [target_location.Custom('LR_GEN')] [target_location.GetNameWithNoTooltip] шириться всією Сахарою, це створило надмірний тягар для [target_location.Custom('LR_GEN')] [target_location.GetNameWithNoTooltip].\n\nПрагнучи зберегти поселення як впливовий торговий осередок, наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] просить, щоби правитель [our_ruler.GetName] виділив [target_location.Custom('LR_DAT')] [target_location.GetName] необхідні засоби, аби впоратися з напливом купців."
  maghrebi_culture.10.a: "[target_location.GetNameWithNoTooltip] має зберегти свою вагу для торгівлі через Сахару!"
  maghrebi_culture.10.b: "Наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] не може виділити засоби для [target_location.Custom('LR_GEN')] [target_location.GetNameWithNoTooltip]."
  maghrebi_culture.11.title: "Розквіт землеробства в [target_location.Custom('LR_PREP')] [target_location.GetNameWithNoTooltip]"
  maghrebi_culture.11.desc: "Попри розташування в одному з найсуворіших куточків #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#!, мешканці [target_location.Custom('LR_GEN')] [target_location.GetName] змогли покращити життя завдяки нещодавньому розширенню #TOOLTIP:BUILDING_TYPE,maghreb_palm_irrigation,X #L мережі зрошення пальм#!#!, яке виявилося справжнім благом для #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L селян#!#! [target_location.Custom('LR_GEN')] [target_location.GetNameWithNoTooltip]."
  maghrebi_culture.11.a: "$common_string_good$"
  maghrebi_culture.12.title: "Під владою дому [ShowDynastyNameWithNoTooltip('hafsid_dynasty')]"
  maghrebi_culture.12.desc: "Після падіння Альмохадів [ShowCultureName('tunisian')]і [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] зберегли значний вплив на східний [ShowRegionName('maghreb_region')]. Хоча [ROOT.GetCountry.GetName] зберіга[ROOT.GetCountry.Custom('end_yeyut')] певну самостійність від #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_GEN')|L]#!#!, правителі дому [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] довели, що вони є вправними сюзеренами, здатними захистити [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]і землі. Втім, Альмохади відходять у небуття, і деякі придворні ставлять під сумнів право володарів дому [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] на владу, вважаючи, що настав час для [ROOT.GetCountry.Custom('CL_GEN')] скинути [ShowCultureNameWithNoTooltip('tunisian')|l]е ярмо."
  maghrebi_culture.12.a: "Дім [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] надавав надійний захист [ROOT.GetCountry.Custom('CL_DAT')]."
  maghrebi_culture.12.b: "Настав час розірвати кайдани влади, яку встановив дім [ShowDynastyNameWithNoTooltip('hafsid_dynasty')]."
  maghrebi_culture.13.title: "[ShowCultureNameWithNoTooltip('tunisian')][ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] втруча[ROOT.GetCountry.Custom('nobles_yetsayutsa')] у внутрішні справи"
  maghrebi_culture.13.desc: "Хоча [ROOT.GetCountry.GetLongName] уже певний час визна[ROOT.GetCountry.Custom('endlong_yeyut')] зверхність #TOOLTIP:CULTURE,$tunisian_tt$,X #L тунісців#!#!, наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] здебільшого зберігав свою самоврядність. Однак нещодавні зазіхання, які вчини[target_character.IsFemale('ла', 'в')] [target_character.GetName] на споконвічні [ROOT.GetCountry.GetCulture.GetName]і землі, посіяли смуту по всій [ROOT.GetCountry.Custom('rank_ua_PREP')]. Численн[ROOT.GetCountry.Custom(tribes_yiaei)] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')|l], вимагають негайно вигнати діяча [target_character.GetNameWithNoTooltip] із [ROOT.GetCountry.Custom('CL_GEN')], хоч таке вигнання, ймовірно, розлютить #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_ACC')|L]#!#!."
  maghrebi_culture.13.a: "Вигнати діяча [target_character.GetNameWithNoTooltip] із [ROOT.GetCountry.Custom('CL_GEN')]!"
  maghrebi_culture.13.b: "Наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] прихистить [target_character.GetHerHim]."
  maghrebi_culture.14.title: "Свавільн[ROOT.GetCountry.Custom(tribes_yiaei)] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] грабу[ROOT.GetCountry.Custom(tribes_yeyut)] [target_location.GetNameWithNoTooltip]"
  maghrebi_culture.14.desc: "Наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] гуде від тривоги після звісток про набіги на каравани, які в [target_location.Custom('LR_PREP')] [target_location.GetName] вчинили вояки, вірні #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племенам#!#!. Місцевість [target_location.GetNameWithNoTooltip], що лежить на одному з найважливіших сахарських торгових шляхів, є важливою зупинкою для багатьох купців. Прагнучи відшкодування за шкоду, заподіяну свавільними харцизами, численн[ROOT.GetCountry.Custom('burghers_yiaei')] потерпіл[ROOT.GetCountry.Custom('burghers_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] зажада[ROOT.GetCountry.Custom('burghers_vlaloly')], щоб [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] покри[ROOT.GetCountry.Custom('tribes_vlaloly')] збитки."
  maghrebi_culture.14.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] мус[ROOT.GetCountry.Custom('tribes_ytyat')] відшкодувати збитки від набігів."
  maghrebi_culture.14.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] отрима[ROOT.GetCountry.Custom('tribes_yeyut')] догану, але збитки покриє держава."
  maghrebi_culture.14.c: "Підтримати їх: [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] мож[ROOT.GetCountry.Custom('tribes_eut')] й надалі чинити набіги."
  maghrebi_culture.15.title: "Зростання підтримки серед [target_culture.GetNameWithNoTooltip|l]их #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племен#!#!"
  maghrebi_culture.15.desc: "Зі зростанням [ROOT.GetCountry.GetAdjective|l]ого впливу в #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#! кілька місцевих спільнот присягнули на вірність [ROOT.GetCountry.Custom('CL_DAT')]. Серед них [target_culture.GetName][ROOT.GetCountry.Custom('tribes_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] виявили найбільшу прихильність до [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ої влади, а численні [target_culture.GetNameWithNoTooltip]і ватажки запропонували цілковиту підтримку своїх племен. Здивований такою палкою підтримкою від [target_culture.GetNameWithNoTooltip]ого люду, наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] розділився в думках: дехто пропонує, щоб [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'надала', 'надав')] повне сприяння держави та [Select_CString(our_ruler.IsFemale, 'захищала', 'захищав')] [target_culture.GetNameWithNoTooltip]і інтереси по всьому Магрибу, тоді як інші радять скористатися цією відданістю."
  maghrebi_culture.15.a: "Ми раді такій підтримці!"
  maghrebi_culture.15.b: "Скористатися їхньою підтримкою, щоб зміцнити наш вплив у всьому Магрибі."
  maghrebi_culture.16.title: "Видатний [target_culture.GetNameWithNoTooltip]ий полководець"
  maghrebi_culture.16.desc: "Зближення [target_culture.GetName|l]ого люду та [ROOT.GetCountry.GetCulture.GetName|l]ої верхівки принесло добрі плоди, коли [ROOT.GetCountry.GetAdjective|l]а влада в #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#! стабілізувалася. Прагнучи довести свою вірність, якої вимагає [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ий [ROOT.GetCountry.GetGovernment.GetCourtTitle], [target_culture.GetNameWithNoTooltip][ROOT.GetCountry.Custom('tribes_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] запропонували одного зі своїх обдарованих ватажків на службу [ROOT.GetCountry.Custom('CL_DAT')]. Втім, деяк[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] заклика[ROOT.GetCountry.Custom('nobles_ytyat')], щоб правитель [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'відкинула', 'відкинув')] цю пропозицію, побоюючись, що надання вольностей, яких прагнуть [target_culture.GetNameWithNoTooltip][ROOT.GetCountry.Custom('tribes_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')], може зрештою зашкодити нашому пануванню в Магрибі."
  maghrebi_culture.16.a: "Нехай полководець [target_character.GetShortNameWithNoTooltip] приєднається до нас, а наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] прийме його!"
  maghrebi_culture.16.b: "Відмовитися призначити [target_character.GetHimHer] полководцем."
  maghrebi_culture.17.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] пропону[ROOT.GetCountry.Custom('tribes_yeyut')] здібного полководця"
  maghrebi_culture.17.desc: "Хоч [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! і завдава[ROOT.GetCountry.Custom('tribes_vlaloly')] клопоту, на який нарікав наш [ROOT.GetCountry.GetGovernment.GetCourtTitle], в останні роки колись непокірн[ROOT.GetCountry.Custom('tribes_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] поча[ROOT.GetCountry.Custom('tribes_vlaloly')] визнавати [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]у владу по всьому #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#!. Прагнучи довести цю новознайдену вірність, яку сподівається бачити наш [ROOT.GetCountry.GetGovernment.GetCourtTitle], [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] запропонува[ROOT.GetCountry.Custom('tribes_vlaloly')], щоб на службу [ROOT.GetCountry.Custom('CL_DAT')] став вельми обдарований полководець [target_character.GetName]. Втім, наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] не має одностайности: дехто побоюється, що це хитрощі, якими [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] намага[ROOT.GetCountry.Custom('tribes_yetsayutsa')] втертися в довіру до правителя [our_ruler.GetName]."
  maghrebi_culture.17.a: "Прийняти пропозицію, яку пода[ROOT.GetCountry.Custom('tribes_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]."
  maghrebi_culture.17.b: "Ми не можемо ризикувати: [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] не повин[ROOT.GetCountry.Custom('tribes_ennanoni')] отримати більше впливу."
  maghrebi_culture.18.title: "Піднесення дому [our_ruler.GetDynasty.GetNameWithNoTooltip]"
  maghrebi_culture.18.desc: "Після падіння Альмохадів [ShowDynastyName('marinid_dynasty')] та [ShowDynastyName('hafsid_dynasty')] зосередили у своїх руках значну владу в #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#!. Однак нещодавні воєнні кампанії, які провели [our_ruler.GetDynasty.GetName], проклали шлях до піднесення нової сили в Магрибі. Хоч влада, яку встановили [our_ruler.GetDynasty.GetNameWithNoTooltip] у Магрибі, і здобула підтримку серед корінних амазигів, наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] радить звернути погляд за межі краю, якщо ми хочемо перевершити інших визначних суперників у Магрибі."
  maghrebi_culture.18.a: "Нам слід шукати союзників, щоб зміцнити своє становище."
  maghrebi_culture.18.b: "Натомість зосередитися на внутрішніх справах."
  maghrebi_culture.19.title: "Спільна єдність із [target_culture.GetNameWithNoTooltip]им людом"
  maghrebi_culture.19.desc: "Хоч переселення #TOOLTIP:CULTURE,$bedouin_culture_tt$,X #L бедуїнів#!#! до #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! в XI столітті змінило політичний уклад краю, [ROOT.GetCountry.GetCulture.GetName|l]ий та [target_culture.GetName|l]ий люд під владою [ROOT.GetCountry.Custom('CL_GEN')] відчувають оновлену єдність. [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]е панування в їхньому рідному Магрибі великою мірою поклало край давнім племінним чварам між цими людьми, згуртувавши їх у новій спільній єдності."
  maghrebi_culture.19.a: "Міцна єдність зробить нас нездоланними!"
  maghrebi_culture.19.b: "Слід скористатися нашою міцною єдністю з [target_culture.GetName|l]им людом, щоб посилити свій вплив у Магрибі."
  maghrebi_culture.19.c: "Культурний зв’язок між [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]им та [target_culture.GetNameWithNoTooltip|l]им людом непорушний."
  maghrebi_culture.20.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]е панування над Магрибом"
  maghrebi_culture.20.desc: "Хоча [ROOT.GetCountry.GetCulture.GetName|l]а верхівка значною мірою перейняла окремі #TOOLTIP:CULTUREGROUP,arabic_group,X #L арабські#!#! звичаї та уклад, це часом призводило до суперечок із відданішими прадавнім звичаям народами #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#!. Для #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#! [target_culture.GetName|l]ий люд став головним осередком невдоволення, яке відчуває [ROOT.GetCountry.GetGovernment.GetCourtTitle], оскільки численні представники [target_culture.GetNameWithNoTooltip|l]ої верхівки цураються вести спільні справи зі знаттю.\n\nПрагнучи використати свій вплив у межах #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] зверну[ROOT.GetCountry.Custom('nobles_vlaloly')]ся до правителя [our_ruler.GetName] із проханням запровадити рішучішу політику асиміляції щодо [target_culture.GetNameWithNoTooltip|l]ого люду. Утім, придворні радники закликають правителя [our_ruler.GetShortNameWithNoTooltip] відхилити ці прохання через острах можливої нестабільности."
  maghrebi_culture.20.a: "Прагнути асимілювати їх у [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]е суспільство."
  maghrebi_culture.20.b: "Натомість слід спробувати інтегрувати [target_culture.GetNameWithNoTooltip|l]ий люд."
  maghrebi_culture.21.title: "Лихоліття Магрибу"
  maghrebi_culture.21.desc: "Падіння останньої [ShowReligionGroupAdjective('muslim')|l]ої країни в #TOOLTIP:REGION,iberia,X #L Іберії#!#! принесло із собою нову хвилю паніки в #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#!, адже багато хто боїться, що [ShowReligionGroupAdjectiveWithNoTooltip('christian')|l]і країни Іберії незабаром звернуть свій погляд на Магриб. Чимало [ShowCultureName('andalusi')|l]ого люду вже подалися до [ROOT.GetCountry.Custom('CL_GEN')], сподіваючись уникнути люті #TOOLTIP:CULTUREGROUP,iberian_group,X #L іберійців#!#!."
  maghrebi_culture.21.a: "Ми не поступимося іберійським загарбникам!"
  maghrebi_culture.21.b: "Слід остерігатися будь-якої загрози вторгнення."
  maghrebi_culture.22.title: "Присутність у Середземному морі"
  maghrebi_culture.22.desc: "Хоча люд #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! більше звик до торгівлі через Сахару, походи, які здійснив правитель [our_ruler.GetName], допомогли [ROOT.GetCountry.Custom('CL_DAT')] закріпитися на узбережжі та здобути вихід до #TOOLTIP:SCRIPTED_GEOGRAPHY,mediterranean_sea_geography #L Середземного моря#!#!. Бачачи нові можливості для торгівлі, численн[ROOT.GetCountry.Custom('burghers_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] заклика[ROOT.GetCountry.Custom('burghers_yeyut')] [ROOT.GetCountry.GetGovernment.GetCourtTitle] виділити кошти на розбудову нового флоту, хоча дехто побоюється, що це зашкодить звичаєвій торгівлі через Сахару, яка довго приносила користь [ROOT.GetCountry.Custom('CL_DAT')]."
  maghrebi_culture.22.a: "Ми мусимо діяти швидко, аби закріпитися на морі."
  maghrebi_culture.22.b: "Не можна занедбувати наші сахарські торгові шляхи."
  maghrebi_culture.23.title: "Порахунок з арабізованою верхівкою"
  maghrebi_culture.23.desc: "[target_culture.GetName]ий люд тривалий час мав значну владу у #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#!. Вони також були джерелом розбрату для багатьох #TOOLTIP:CULTUREGROUP,amazigh_group,X #L амазигів#!#!, оскільки виступали за рішучу політику асиміляції та закликали переймати #TOOLTIP:CULTUREGROUP,arabic_group,X #L арабські#!#! звичаї. З піднесенням #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! — [ROOT.GetCountry.Custom('rank_ua_GEN')], де [ROOT.GetCountry.GetCulture.GetName]ий люд утримує владу як панівна верхівка, деяк[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] попроси[ROOT.GetCountry.Custom('nobles_vlaloly')] правителя [our_ruler.GetName] обмежити [target_culture.GetNameWithNoTooltip]ий вплив. Утім, інші придворні вважають, що [target_culture.GetNameWithNoTooltip|l]а знать є безцінними союзниками у зміцненні нашої щораз більшої влади над Магрибом."
  maghrebi_culture.23.a: "Прагнути порозуміння між [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]ою та [target_culture.GetNameWithNoTooltip|l]ою верхівкою."
  maghrebi_culture.23.b: "[target_culture.GetNameWithNoTooltip]ому впливу в Магрибі настав кінець."
  maghrebi_culture.24.title: "Нові [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]і килими"
  maghrebi_culture.24.desc: "[ROOT.GetCountry.GetCulture.GetName]і килими вже давно стали ходовим товаром у #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#!, а також важливим крамом для багатьох [ROOT.GetCountry.GetAdjective|l]их купців. Проте останніми роками отримання надійнішого джерела барвників зумовило появу нового покоління [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]их килимів і спричинило зростання зацікавленості цими виробами як у #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#!, так і за кордоном."
  maghrebi_culture.24.a: "Скористатися вигодою від нових килимів."
  maghrebi_culture.24.b: "Ми мусимо й надалі вкладати кошти в нові килими!"
  maghrebi_culture.25.title: "Закріплення земель, якими володіють [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')|l]"
  maghrebi_culture.25.desc: "Хоча міць, яку уособлюють [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')|l], раніше допомагала #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! відбивати ворожі загрози, чиновництво [ROOT.GetCountry.Custom('rank_ua_GEN')], що розростається, спонукало [ROOT.GetCountry.GetGovernment.GetCourtTitle] до численних суперечок щодо їхньої справности. Хоча [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] у минулому захища[ROOT.GetCountry.Custom('tribes_vlaloly')] [ROOT.GetCountry.Custom('CL_ACC')], вони водночас ставали джерелом клопоту, коли опиралися рішенням, які ухвалював [ROOT.GetCountry.GetGovernment.GetCourtTitle].\n\nТепер [ROOT.GetCountry.GetGovernment.GetCourtTitle] схиляється до думки, що наша країна зміцніла достатньо і більше не мусить покладатися на захист, який забезпечують [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]. Ба більше, тепер [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] мають бути остаточно впокорені, аби посилити розбудову [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ої країни."
  maghrebi_culture.25.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] мус[ROOT.GetCountry.Custom('tribes_ytyat')] затямити своє місце в цьому світі."
  maghrebi_culture.25.b: "Зберегти самоврядність, яку ма[ROOT.GetCountry.Custom('tribes_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')], щоб уникнути внутрішніх чвар."
  maghrebi_culture.26.title: "Панування над Магрибом"
  maghrebi_culture.26.desc: "Падіння Альмохадів привело #TOOLTIP:REGION,maghreb_region,X #L Магриб#!#! до доби нестабільности, а також послабило вплив на #TOOLTIP:REGION,iberia_region,X #L Іберію#!#!, проте [ROOT.GetCountry.GetName], де править [our_ruler.GetName], утверди[ROOT.GetCountry.Custom('end_vlaloly')]ся як головна сила в регіоні. Хоча деякі інші землі Магрибу все ще лишаються поза [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]им впливом, #TOOLTIP:CULTUREGROUP,iberian_group,X #L іберійські#!#! королівства радше визнають [ROOT.GetCountry.Custom('CL_ACC')] регіональним суперником, якого не можна недооцінювати, якщо вони забажають підкорити Магриб."
  maghrebi_culture.26.a: "Ми станемо на захист Магрибу!"
  maghrebi_culture.27.title: "Золота доба дому [our_ruler.GetDynasty.GetNameWithNoTooltip] у Магрибі"
  maghrebi_culture.27.desc: "Коли значна частина #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! опинилася під [ROOT.GetCountry.GetAdjective|l]им владарюванням, дім [our_ruler.GetDynasty.GetName] заходився оновлювати визначні культурні пам’ятки в краї, а також узяв на власний кошт спорудження нових осередків освіти. Хоча колись цей регіон ледь не опинився під владою чужоземців, за правління дому [our_ruler.GetDynasty.GetNameWithNoTooltip] він перетворився на потужну силу, яку шанує все [ShowScriptedGeographyName('mediterranean_sea_geography')]."
  maghrebi_culture.27.a: "Нехай правління дому [our_ruler.GetDynasty.GetNameWithNoTooltip] і надалі приносить процвітання!"
  maghrebi_culture.28.title: "Вплив на піратів"
  maghrebi_culture.28.desc: "Хоча корсари #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! зажили слави по всій #TOOLTIP:CONTINENT,europe,X #L Європі#!#! як грізні нападники, що наводять страх на все [ShowScriptedGeographyName('mediterranean_sea_geography')], їхня підтримка досі різнилася від країни до країни.\n\nВтім, зі зростанням [ROOT.GetCountry.GetAdjective|l]ого впливу на узбережжі численні розбійники звернулися до [ROOT.GetCountry.Custom('CL_GEN')], сподіваючись на нашу підтримку, аби посилити набіги Середземним морем. Проте [ROOT.GetCountry.GetGovernment.GetCourtTitle] почасти вважає, що це також нагода послабити корсарів задля відновлення взаємин із європейськими державами, які ворогували з ними століттями."
  maghrebi_culture.28.a: "Надати всебічну підтримку від влади."
  maghrebi_culture.28.b: "Дозволити піратам діяти й надалі."
  maghrebi_culture.28.c: "Покласти край набігам морських розбійників."
  maghreb_ibadi_nation_establish_majlis_ammi_said.title: "Централізувати маджліс «Аммі Саїд»"
  maghreb_ibadi_nation_establish_majlis_ammi_said.desc: "Відколи впали Рустаміди, багато [ShowReligionAdjective('ibadi')|l]ого люду в #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#! були змушені тікати до долини Мзаб. Тоді як чимало цих [ShowReligionAdjectiveWithNoTooltip('ibadi')|l]их князівств вирішили брати участь у маджлісі «Аммі Саїд», де на чолі стоя[ROOT.GetCountry.Custom('clergy_vlaloly')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], інші зберегли свою незалежність.\n\nКоли багато найбільш заселених [ShowReligionAdjectiveWithNoTooltip('ibadi')|l]их земель опинилися під владою #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, правитель [our_ruler.GetName] вирішив зосередити маджліс «Аммі Саїд» у [ROOT.GetCountry.GetCapital.Custom('LR_PREP')] [ROOT.GetCountry.GetCapital.GetName], сподіваючись створити сильну та впливову [ShowReligionAdjectiveWithNoTooltip('ibadi')|l]у країну в Магрибі."
  maghreb_ibadi_nation_establish_majlis_ammi_said.a: "Вірність #TOOLTIP:ESTATE_TYPE,crown_estate,X #L корони#!#! допоможе зміцнити нашу владу!"
  maghreb_masters_of_the_sahara.title: "Володарі Сахари"
  maghreb_masters_of_the_sahara.desc: "Поколіннями народи #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! брали участь у сахарській торгівлі, долаючи суворі пустелі заради перевезення коштовного краму. Хоча це нелегке завдання, якщо нам вдасться здобути значний вплив в області [ShowAreaName('desert_area')] та водночас розбудувати інфраструктуру ключових караванних стоянок, наш люд зуміє приборкати ці нещадні піски."
  maghreb_masters_of_the_sahara.a: "Ми досягли неможливого!"
  empower_the_desert_power_privilege_tt: "Привілей [ShowEstatePrivilegeName('desert_power')] значно посилиться, отримавши додаткові переваги, які усувають штрафи для [Concept('locations', 'місцевостей')|e], що мають #TOOLTIP:VEGETATION,desert,X #L пустельний#!#! тип рослинності або [ShowClimateName('arid')|l] клімат."
  empower_the_desert_power_privilege_tt_default_bonus: "Привілей [ShowEstatePrivilegeName('desert_power')] також отримає #G +0.0020#! [ShowModifierTypeName('global_monthly_development')] та #G +2.50%#! [ShowModifierTypeName('global_max_control')]"
  maghreb_ibadi_nation_establish_majlis_ammi_said.a.entry: "Вірність $crown_estate$ допоможе зміцнити нашу владу!"
  maghreb_ibadi_nation_establish_majlis_ammi_said.desc.entry: "Рада, розпорошена серед гордо незалежних [ShowReligionAdjective('ibadi')|l]их країн, здатна радити, але не здатна правити. Тепер, коли найлюдніші з цих земель підкоряються нам, Маджліс ’Аммі Саїд можна зібрати під одним дахом і єдиною владою. Те, що починалося як притулок у долині Мзаб, стане повноправною державою по всьому #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#!."