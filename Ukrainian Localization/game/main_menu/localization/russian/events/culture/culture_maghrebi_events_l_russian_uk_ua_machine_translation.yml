l_russian:
  maghrebi_culture_masters_of_sahara_country_bonus: "Завдяки [Concept('decision', 'рішенню')|e] «$maghreb_masters_of_the_sahara.title$»\nможна отримати такий бонус:"
  maghrebi_culture_masters_of_sahara_desert_location_bonus: "Завдяки [Concept('decision', 'рішенню')|e] «$maghreb_masters_of_the_sahara.title$»\nможна отримати такий бонус (він діє на #TOOLTIP:VEGETATION,desert,X #L пустельні#!#! [Concept('locations', 'місцевості')|e]):"
  maghrebi_culture_masters_of_sahara_arid_location_bonus: "Завдяки [Concept('decision', 'рішенню')|e] «$maghreb_masters_of_the_sahara.title$»\nможна отримати такий бонус (він діє на #TOOLTIP:CLIMATE,arid,X #L посушливі#!#! [Concept('locations', 'місцевості')|e]):"
  maghrebi_culture.1.title: "Юдейська громада [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  maghrebi_culture.1.desc: "Значна частина вигнаного за Альмохадів #TOOLTIP:CULTURE,$mustaarabi_tt$,X #L мустарабського#!#! люду #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! нещодавно знайшла собі новий дім у [target_location.Custom('LR_PREP')|l] [target_location.GetName]. І хоча [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] #L [ROOT.GetCountry.GetAdjective|l]ої#! країни останнім часом терпиміше ставиться до юдеїв, деяк[ROOT.GetCountry.Custom('clergy_yiaei')] надміру завзят[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] уже заговори[ROOT.GetCountry.Custom('clergy_vlaloly')] про повернення колись відкинутих альмохадських порядків."
  maghrebi_culture.1.a: "[target_location.GetNameWithNoTooltip] залишиться прихистком для мустарабів."
  maghrebi_culture.1.b: "Хай радикальн[ROOT.GetCountry.Custom('clergy_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] допомож[ROOT.GetCountry.Custom('clergy_eut')] нам змусити їх прийняти нову віру — нею стане [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip|l]."
  maghrebi_culture.2.title: "Ібадитські володіння Магрибу"
  maghrebi_culture.2.desc: "Уже давно в #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#! немає сильної ібадитської країни, здатної впливати на весь регіон. Але [our_ruler.GetName], схоже, прагне відродити старий лад: [Select_CString(our_ruler.IsFemale, 'їй', 'йому')] вдалося об’єднати землі, де #TOOLTIP:RELIGION,$ibadi_tt$,X #L ібадитська#!#! віра й досі міцна. Хоча [ROOT.GetCountry.GetName] не настільки багат[ROOT.GetCountry.Custom('end_yiaei')], як розвинені країни Магрибу, усе ж не варто відкидати таких успіхів: можливо, [our_ruler.GetShortNameWithNoTooltip] ще зуміє розбудувати нову країну для ібадитів."
  maghrebi_culture.2.a: "Ми подбаємо про те, щоб у Магрибі постала сильна ібадитська країна!"
  maghrebi_culture.2.b: "Ми підемо власним шляхом."
  maghrebi_culture.3.title: "Відновлення влади ібадитів у Магрибі"
  maghrebi_culture.3.desc: "[our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'зробила', 'зробив')] майже неможливе: [Select_CString(our_ruler.IsFemale, 'вона створила', 'він створив')] у #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#! нову #TOOLTIP:RELIGION,$ibadi_tt$,X #L ібадитську#!#! країну. Тепер [ROOT.GetCountry.GetName] — одна з найсильніших країн регіону, а дехто при дворі вже наполягає, що [our_ruler.GetNameWithNoTooltip] [Select_CString(our_ruler.IsFemale, 'повинна', 'повинен')] переглянути ставлення до інших течій #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламу#!#!. Але хоч такий лад і привабив до нас нових послідовників, більшість люду в Магрибі й надалі сповідує #TOOLTIP:RELIGION,$sunni_tt$,X #L сунізм#!#!."
  maghrebi_culture.3.a: "Ми терпимо ставитимемося до всіх течій ісламу."
  maghrebi_culture.3.b: "Послідовники інших течій мають навернутися в ібадизм."
  maghrebi_culture.4.title: "Молоді ібадитські країни Магрибу"
  maghrebi_culture.4.desc: "Після падіння держави Рустамідів — могутнього #TOOLTIP:RELIGION,$ibadi_tt$,X #L ібадитського#!#! султанату, що мав великий вплив у #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#!, — чимало послідовників ібадизму з часом переселилися до #TOOLTIP:AREA,desert_area,X #L сахарських оаз#!#!. Тепер володіння #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! впритул наблизилися до цих земель, і дехто при дворі вважає, що [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'повинна', 'повинен')] розпочати похід проти #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_GEN')|L]#!#! — одного з небагатьох уцілілих і водночас порівняно слабких пережитків полеглого султанату."
  maghrebi_culture.4.a: "Скористаймося слабкістю [target_country.Custom('CL_GEN')]!"
  maghrebi_culture.4.b: "Вони надто далекі й роздроблені, щоб становити загрозу."
  maghrebi_culture.5.title: "Підкорення магрибських ібадитів"
  maghrebi_culture.5.desc: "Значна частина ібадитів — жителів #TOOLTIP:AREA,desert_area,X #L сахарських оаз#!#! — нині під владою #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. І оскільки число вірян-ібадитів у нашій країні справді вражає, радники застерігають: якщо [our_ruler.GetName] не проводитиме щодо них політики терпимости, в країні можуть спалахнути заворушення за віру."
  maghrebi_culture.5.a: "Хай їх веде [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip|l]."
  maghrebi_culture.5.b: "Спробуймо натомість приєднати їх мирно."
  maghrebi_culture.6.title: "Зростання впливу [ROOT.GetCountry.Custom('CL_GEN')]"
  maghrebi_culture.6.desc: "Після падіння Альмохадів значний вплив у #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#! здобули [target_country_1.GetName] та [target_country.GetName], однак лише одна з цих країн — [target_country.GetNameWithNoTooltip] — насправді сильна: про це [Select_CString(our_ruler.IsFemale, 'подбала', 'подбав')] [our_ruler.GetName]. Хоча знать [target_country_1.Custom('CL_GEN')] та [target_country.Custom('CL_GEN')] побоюється [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ого впливу, чимало магрибських народів прихильно ставляться до нашої влади."
  maghrebi_culture.6.a: "Ми утвердимо в Магрибі [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]у владу!"
  maghrebi_culture.7.title: "Зрошення пальм у [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
  maghrebi_culture.7.desc: "Чимало земель #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! родючі, але умови тут бувають направду суворими: дається взнаки близькість #TOOLTIP:AREA,desert_area,X #L сахарських оазисів#!#!.\n\n[target_location.GetName] просить виділити кошти на втілення сміливого задуму: якщо у #L #TOOLTIP:LOCATIONRANK,[target_location.GetRank.Custom('LR_tt')],X [target_location.GetRank.Custom('LR_PREP')|l]#!#! з’явиться [ShowBuildingTypeName('maghreb_palm_irrigation')|l], то, можливо, життя в цьому краї пощастить полегшити."
  maghrebi_culture.7.a: "Хай [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] зроб[ROOT.GetCountry.Custom('burghers_ytlyat')] зрошувальну мережу — ми виділимо кошти."
  maghrebi_culture.7.b: "У нас немає зайвих засобів."
  maghrebi_culture.8.title: "Витончена архітектура [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  maghrebi_culture.8.desc: "Жителі [target_location.Custom('LR_GEN')|l] [target_location.GetName] споконвіку славляться своєю архітектурною майстерністю: навіть [ShowVegetationName('desert')|l] не заважає їм зводити споруди, здатні вразити й наших придворних зодчих. Нехай навіть землі довкола [ROOT.GetCountry.GetCapital.Custom('LR_GEN')|l] [ROOT.GetCountry.GetCapital.GetName] різняться від умов [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip], зодчі вважають, що побачене можна застосувати й тут — за умови, що їх підтримає [our_ruler.GetName]."
  maghrebi_culture.8.a: "Впровадимо деякі архітектурні особливості у [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]."
  maghrebi_culture.8.b: "Натомість краще забезпечимо [target_location.Custom('LR_ACC')|l] [target_location.GetNameWithNoTooltip] додатковими засобами."
  maghrebi_culture.9.title: "Звичаї амазигів"
  maghrebi_culture.9.desc: "Після того як в XI столітті чимало #TOOLTIP:CULTURE,$bedouin_culture_tt$,X #L бедуїнських#!#! племен за підтримки Фатимідів переселилися до #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#!, місцевим #TOOLTIP:CULTUREGROUP,amazigh_group,X #L амазизьким#!#! народам довелося зважати на стрімке зростання чисельності #TOOLTIP:CULTUREGROUP,arabic_group,X #L арабської#!#! знаті. За влади #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! багато амазигів зберігають самостійність, хоча дехто при дворі вважає, що деяк[ROOT.GetCountry.Custom('nobles_yiaei')] арабськ[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] заслугову[ROOT.GetCountry.Custom('nobles_yeyut')], щоб їх запросили до [ROOT.GetCountry.GetNameWithNoTooltip]: так зміцніє наше право на владу. Однак [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')|l] напевно буд[ROOT.GetCountry.Custom('tribes_eut')] невдоволен[ROOT.GetCountry.Custom('tribes_yiaei')] цим рішенням."
  maghrebi_culture.9.a: "Ми маємо прагнути взаємодії з арабською знаттю."
  maghrebi_culture.9.b: "Краще постараймося зберегти амазизькі звичаї."
  maghrebi_culture.10.title: "[target_location.GetNameWithNoTooltip] — важливий осередок торгівлі через Сахару"
  maghrebi_culture.10.desc: "Купці-[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] вже багато десятиліть поспіль зупиняються у [target_location.Custom('LR_PREP')|l] [target_location.GetName] — важливому осередку на одному з численних торгових шляхів через #TOOLTIP:AREA,desert_area,X #L сахарські оазиси#!#!. В останні роки цей [target_location.GetRank.GetName|l], перебуваючи під захистом #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, набув ще важливішого значення: купці знають, що #L [ROOT.GetCountry.GetAdjective|l]ими#! землями можна мандрувати в безпеці, і тому почали зупинятися тут частіше. Сьогодні [target_location.GetNameWithNoTooltip] має добре ім’я чи не в усій Сахарі, але ця медаль має й зворотний бік: така слава — важкий тягар.\n\nЩоб [target_location.GetRank.GetNameWithNoTooltip|l] і надалі зберігав своє значення для торгівлі, дехто при дворі вважає, що [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'повинна', 'повинен')] надати [target_location.GetRank.Custom('LR_DAT')|l] необхідні кошти для прийому дедалі більшого потоку купців."
  maghrebi_culture.10.a: "[target_location.GetNameWithNoTooltip|U] має зберегти своє значення для купців!"
  maghrebi_culture.10.b: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] не може виділити [target_location.Custom('LR_DAT')|l] [target_location.GetNameWithNoTooltip] зайвих засобів."
  maghrebi_culture.11.title: "Квітуче землеробство у [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
  maghrebi_culture.11.desc: "[target_location.GetName] лежить в одному з найсуворіших регіонів #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! — і тим дивовижніше, що тутешні жителі змогли поліпшити своє становище: [ShowBuildingTypeName('maghreb_palm_irrigation')|l] — це велика поміч для кожного, що з особливою охотою підтверд[ROOT.GetCountry.Custom('peasants_ytyat')] [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
  maghrebi_culture.11.a: "$common_string_good$"
  maghrebi_culture.12.title: "Під владою Хафсідів"
  maghrebi_culture.12.desc: "Після падіння Альмохадів #TOOLTIP:CULTURE,$tunisian_tt$,X #L туніські#!#! Хафсіди зберегли значний вплив у східній частині #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#!. І хоча #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! пощастило відстояти певну частку незалежности від #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_GEN')|L]#!#!, хафсідські правителі все ж показали себе гідними захисниками [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]их земель. Але пам’ять про владу Альмохадів поволі згасає, і наш [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] дедалі частіше запитує себе, наскільки ще виправдана покора Хафсідам. Дехто вже вважає, що настав час для [ROOT.GetCountry.Custom('CL_GEN')] звільнитися від туніського ярма."
  maghrebi_culture.12.a: "Хафсіди — надійні захисники [ROOT.GetCountry.Custom('CL_GEN')]."
  maghrebi_culture.12.b: "Час звільнитися з-під хафсідської влади."
  maghrebi_culture.13.title: "Туніськ[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] втруча[ROOT.GetCountry.Custom('nobles_yetsayutsa')] у внутрішні справи"
  maghrebi_culture.13.desc: "Хоча [ROOT.GetCountry.GetLongName] уже досить давно визна[ROOT.GetCountry.Custom('endlong_yeyut')] зверхність влади #TOOLTIP:CULTURE,$tunisian_tt$,X #L Тунісу#!#!, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] [ROOT.GetCountry.Custom('CL_GEN')] значною мірою зберігає самостійність. Проте нещодавні вилазки, які [target_character.GetName] чинить на землі, що здавна вважаються #L [ROOT.GetCountry.GetCulture.GetName|l]ими#!, викликали збурення серед народу. Численн[ROOT.GetCountry.Custom('tribes_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] вимага[ROOT.GetCountry.Custom('tribes_yeyut')] негайно вигнати цю людину з країни, але такий вчинок напевно викличе невдоволення #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_GEN')|L]#!#!."
  maghrebi_culture.13.a: "[target_character.GetNameWithNoTooltip] буде [Select_CString(target_character.IsFemale, 'вигнана', 'вигнаний')] з [ROOT.GetCountry.Custom('CL_GEN')]!"
  maghrebi_culture.13.b: "Нехай залишається при дворі."
  maghrebi_culture.14.title: "Дик[ROOT.GetCountry.Custom('tribes_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] вчиня[ROOT.GetCountry.Custom('tribes_yeyut')] набіг на [target_location.Custom('LR_ACC')|l] [target_location.GetNameWithNoTooltip]"
  maghrebi_culture.14.desc: "Наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] збентежений: [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] вчини[ROOT.GetCountry.Custom('tribes_vlaloly')] набіг на [target_location.Custom('LR_ACC')|l] [target_location.GetName], спорядивши для цього вірних вояків. [target_location.GetNameWithNoTooltip] — одна з головних зупинок для купців, які долають Сахару важливим торговим шляхом. Потерпіл[ROOT.GetCountry.Custom('burghers_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] вимага[ROOT.GetCountry.Custom('burghers_yeyut')] відшкодування, і виплатити його повин[ROOT.GetCountry.Custom('tribes_ennanoni')], звісно, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]."
  maghrebi_culture.14.a: "Нехай [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] виплат[ROOT.GetCountry.Custom('tribes_ytyat')] відшкодування потерпілим купцям."
  maghrebi_culture.14.b: "Ми дорікнемо призвідникам, але відшкодування виплатить держава."
  maghrebi_culture.14.c: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')|U] вчини[ROOT.GetCountry.Custom('tribes_vlaloly')] правильно. Ми дозволимо продовжувати набіги."
  maghrebi_culture.15.title: "#L [target_culture.GetNameWithNoTooltip|U][ROOT.GetCountry.Custom('tribes_yiaei')]#! [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] дедалі частіше висловлю[ROOT.GetCountry.Custom('tribes_yeyut')] підтримку"
  maghrebi_culture.15.desc: "У міру того як #TOOLTIP:REGION,maghreb_region,X #L Магриб#!#! дедалі більше кориться #L [ROOT.GetCountry.GetAdjective|l]ій#! владі, все більше місцевих народів присягає на вірність [ROOT.GetCountry.Custom('CL_DAT')]. Серед них особливо прихильно до [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ої влади став[ROOT.GetCountry.Custom('tribes_ytlyat')]ся #L [target_culture.GetName|l][ROOT.GetCountry.Custom('tribes_yiaei')]#! [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')|l]: чимало [target_culture.GetNameWithNoTooltip|l]их вождів уже пропонують нам повну підтримку. Наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] щиро дивується такому завзяттю. Дехто вважає, що [our_ruler.GetName] вчинить правильно, якщо відкрито підтримає [target_culture.GetNameWithNoTooltip|l]і інтереси та опікуватиметься цим людом у Магрибі; інші радять скористатися їхньою відданістю, поки вона ще приносить користь."
  maghrebi_culture.15.a: "Ми раді їхній підтримці."
  maghrebi_culture.15.b: "Скористаймося їхньою підтримкою, щоб зміцнити свій вплив у Магрибі."
  maghrebi_culture.16.title: "Видатний [target_culture.GetNameWithNoTooltip|l]ий полководець"
  maghrebi_culture.16.desc: "У міру зміцнення в #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#! #L [ROOT.GetCountry.GetAdjective|l]ої#! влади міцнішають і взаємні зв’язки між #L [target_culture.GetName|l]им#! людом та #L [ROOT.GetCountry.GetCulture.GetName|l]ою#! знаттю, що йде країні лише на користь. [target_culture.GetNameWithNoTooltip|U][ROOT.GetCountry.Custom('tribes_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')], прагнучи запевнити [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ий двір у своїй відданості, запропонува[ROOT.GetCountry.Custom('tribes_vlaloly')] одного зі своїх найобдарованіших ватажків на службу [ROOT.GetCountry.Custom('CL_DAT')]. Втім, деяк[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] вважа[ROOT.GetCountry.Custom('nobles_yeyut')], що [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'повинна', 'повинен')] відхилити цю пропозицію: вони бояться, що якщо [target_culture.GetNameWithNoTooltip|l][ROOT.GetCountry.Custom('tribes_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] здобудуть більше самостійности, наша влада в Магрибі зрештою може ослабнути."
  maghrebi_culture.16.a: "Вітаємо тебе, [target_character.GetShortNameWithNoTooltip]! Наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] стане тобі домівкою."
  maghrebi_culture.16.b: "Не найматимемо [Select_CString(target_character.IsFemale, 'її', 'його')] полководцем."
  maghrebi_culture.17.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')|U] пропону[ROOT.GetCountry.Custom('tribes_yeyut')] багатонадійного полководця"
  maghrebi_culture.17.desc: "Хоча [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! тривалий час завдава[ROOT.GetCountry.Custom('tribes_vlaloly')] клопоту двору країни, в останні роки вони неохоче, але все ж почали визнавати [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]у владу над #TOOLTIP:REGION,maghreb_region,X #L Магрибом#!#!. Нині ж вони, прагнучи підтвердити свою вірність, заявляють, що [target_character.GetName] може стати в добрій пригоді [ROOT.GetCountry.Custom('CL_DAT')], оскільки має непересічний хист. Втім, наш [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] не має одностайности: дехто вважає, що це хитрощі, а [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] лише розрахову[ROOT.GetCountry.Custom('tribes_yeyut')] на те, що [our_ruler.GetName] поставиться до них прихильніше."
  maghrebi_culture.17.a: "Пристаньмо на їхню пропозицію."
  maghrebi_culture.17.b: "Не можна допустити, щоб [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] здобу[ROOT.GetCountry.Custom('tribes_vlaloly')] ще більше впливу."
  maghrebi_culture.18.title: "Дім [our_ruler.GetDynasty.GetNameWithNoTooltip] набирає впливу"
  maghrebi_culture.18.desc: "Після падіння Альмохадів влада в #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#! значною мірою зосередилася в руках двох домів — #TOOLTIP:DYNASTY,$marinid_dynasty_tt$,X #L Маринідів#!#! та #TOOLTIP:DYNASTY,$hafsid_dynasty_tt$,X #L Хафсідів#!#!. Проте нещодавні воєнні походи, які проводять [our_ruler.GetDynasty.GetName], довели: в краю міцніє нова сила. Хоча дім [our_ruler.GetDynasty.GetNameWithNoTooltip] уже здобув підтримку серед корінних жителів Магрибу — амазигів, наш [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] наполегливо радить пошукати опертя для суперництва з іншими великими державами десь за межами цих країв."
  maghrebi_culture.18.a: "Слід знайти союзників, щоб зміцнити своє становище."
  maghrebi_culture.18.b: "Краще займімося внутрішньою політикою."
  maghrebi_culture.19.title: "Почуття спільности з [target_culture.GetNameWithNoTooltip|l]им людом"
  maghrebi_culture.19.desc: "Переселення #TOOLTIP:CULTURE,$bedouin_culture_tt$,X #L бедуїнів#!#! до #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! в XI столітті дуже змінило політичне становище в краї, проте за [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ої влади між #L [ROOT.GetCountry.GetCulture.GetName|l]им#! та #L [target_culture.GetName|l]им#! людом знову виникло почуття єдности. [ROOT.GetCountry.GetAdjectiveWithNoTooltip]е панування над рідним Магрибом багато в чому поклало край колишнім племінним чварам, і на зміну ворожнечі приходить відчуття спільности."
  maghrebi_culture.19.a: "Єдність — запорука непереможности!"
  maghrebi_culture.19.b: "Ми спробуємо посилити вплив на Магриб завдяки єдності з [target_culture.GetNameWithNoTooltip|l]им людом."
  maghrebi_culture.19.c: "[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|U]о-[target_culture.GetNameWithNoTooltip|l]і культурні зв’язки непорушні."
  maghrebi_culture.20.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip|U]а влада над Магрибом"
  maghrebi_culture.20.desc: "Чимало представників #L [ROOT.GetCountry.GetCulture.GetName|l]ої#! знаті поступово переймають окремі #TOOLTIP:CULTUREGROUP,arabic_group,X #L арабські#!#! звичаї, що іноді призводить до сутичок із вірними давньому укладу народами #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#!. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] зазначає: численн[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] скарж[ROOT.GetCountry.Custom('nobles_ytat')]ся, що #L [target_culture.GetName|l]і#! народи, зокрема [target_culture.GetNameWithNoTooltip|l]а знать, відмовляються вести з ними будь-які справи.\n\nПрагнучи зміцнити свій вплив у володіннях #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] виступи[ROOT.GetCountry.Custom('nobles_vlaloly')] зі зверненням: вони сподіваються, що [our_ruler.GetName] рішучіше асимілюватиме [target_culture.GetNameWithNoTooltip|l]ий люд. Втім, дехто при дворі побоюється, що коли ми погодимося на таку пропозицію, нестабільність лише посилиться."
  maghrebi_culture.20.a: "Постараємося, щоб вони асимілювалися в [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]е суспільство."
  maghrebi_culture.20.b: "Натомість спробуємо інтегрувати [target_culture.GetNameWithNoTooltip|l]і народи."
  maghrebi_culture.21.title: "Тяжка доля Магрибу"
  maghrebi_culture.21.desc: "Падіння останньої #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламської#!#! держави #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! викликало непідробну паніку серед жителів #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#!: багато хто побоюється, що християнські королівства півострова незабаром звернуть свій погляд на них. Вже зараз численні #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусці#!#! покладають усі свої сподівання на [ROOT.GetCountry.Custom('CL_ACC')] — останнього в їхніх очах захисника від люті #TOOLTIP:CULTUREGROUP,iberian_group,X #L іберійців#!#!."
  maghrebi_culture.21.a: "Ми не схилятимемося перед іберійськими загарбниками!"
  maghrebi_culture.21.b: "Розважливо буде побоюватися прибуття завойовників."
  maghrebi_culture.22.title: "Присутність у Середземномор’ї"
  maghrebi_culture.22.desc: "Народи #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! здавна покладалися передусім на торгівлю через Сахару, однак походи, які [Select_CString(our_ruler.IsFemale, 'здійснювала', 'здійснював')] [our_ruler.GetName], дали змогу [ROOT.GetCountry.Custom('CL_DAT')] закріпитися на узбережжі. Сьогодні вихід до такої важливої артерії, як [ShowScriptedGeographyName('mediterranean_sea_geography')], — не мрія, а дійсність. Численн[ROOT.GetCountry.Custom('burghers_yiaei')|l] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l], що відчу[ROOT.GetCountry.Custom('burghers_vlaloly')] змогу примножити своє багатство, заклика[ROOT.GetCountry.Custom('burghers_yeyut')] до одного: нехай [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] вкладе кошти в спорудження нового флоту! Інші, втім, побоюються, що розвиток морської торгівлі призведе до поступового занепаду старих караванних шляхів, які вже багато років приносять [ROOT.GetCountry.Custom('CL_DAT')] прибуток."
  maghrebi_culture.22.a: "Треба якнайшвидше заявити про себе і на морі."
  maghrebi_culture.22.b: "Не можна допустити, щоб торгові шляхи через Сахару занепали."
  maghrebi_culture.23.title: "Невдоволення арабізованої знаті"
  maghrebi_culture.23.desc: "#L [target_culture.GetName|U]ий#! вплив на #TOOLTIP:REGION,maghreb_region,X #L Магриб#!#! великий і настільки міцний, що не згасає з роками. При цьому їхні стосунки з #TOOLTIP:CULTUREGROUP,amazigh_group,X #L амазизьким#!#! людом залишаються напруженими: [target_culture.GetNameWithNoTooltip|l]і діячі виступають за рішучу асиміляцію амазигів і закликають тих переймати #TOOLTIP:CULTUREGROUP,arabic_group,X #L арабські#!#! звичаї. З піднесенням #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! — [ROOT.GetCountry.Custom('rank_ua_GEN')|l], де #L [ROOT.GetCountry.GetCulture.GetName|l]і#! діячі становлять панівну верхівку, — деяк[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] дедалі частіше прос[ROOT.GetCountry.Custom('nobles_ytyat')], щоб [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'обмежила', 'обмежив')] [target_culture.GetNameWithNoTooltip|l]ий вплив. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U], втім, не поспішає з цим погоджуватися: дехто вважає, що [target_culture.GetNameWithNoTooltip|l]а знать — безцінний союзник, який допоможе зміцнити нашу владу над Магрибом."
  maghrebi_culture.23.a: "Спробуємо досягти порозуміння між [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]ою та [target_culture.GetNameWithNoTooltip|l]ою знаттю."
  maghrebi_culture.23.b: "[target_culture.GetNameWithNoTooltip|U]ому впливу на Магриб настав кінець."
  maghrebi_culture.24.title: "Нові [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]і килими"
  maghrebi_culture.24.desc: "#L [ROOT.GetCountry.GetCulture.GetName|U]і#! гобелени давно мають попит по всьому #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#!; вони — важливий крам для багатьох #L [ROOT.GetCountry.GetAdjective|l]их#! купців. Проте останніми роками надійніші постачання барвників дали змогу налагодити виробництво абсолютно нових [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip|l]их килимів, і цікавість до цих виробів зросла як у самому #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#!, так і за його межами."
  maghrebi_culture.24.a: "Пожнемо плоди того, що відбувається."
  maghrebi_culture.24.b: "Продовжуймо вкладати кошти в нові гобелени!"
  maghrebi_culture.25.title: "Згуртування земель, якими володі[ROOT.GetCountry.Custom('tribes_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]"
  maghrebi_culture.25.desc: "У минулому [ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] неодноразово допомага[ROOT.GetCountry.Custom('tribes_vlaloly')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! відбивати зовнішні загрози, однак у міру зміцнення та розвитку у [ROOT.GetCountry.Custom('rank_ua_PREP')|l] чиновництва [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] дедалі частіше запитує себе, наскільки такий лад себе виправдовує. [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')|U] справді неодноразово захища[ROOT.GetCountry.Custom('tribes_vlaloly')] [ROOT.GetCountry.Custom('CL_ACC')], але водночас завдава[ROOT.GetCountry.Custom('tribes_vlaloly')] чимало клопоту, коли не погоджува[ROOT.GetCountry.Custom('tribes_vlaloly')]ся з рішеннями двору.\n\nСьогодні дедалі частіше лунає думка, що країна вже достатньо зміцніла, і [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] як опора та головна оборонна сила їй більше не потріб[ROOT.GetCountry.Custom('tribes_ennanoni')]. Щобільше, аби міць [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ої держави й надалі зростала, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] повин[ROOT.GetCountry.Custom('tribes_ennanoni')] бути остаточно обмежен[ROOT.GetCountry.Custom('tribes_yiaei')] у впливі та підпорядкован[ROOT.GetCountry.Custom('tribes_yiaei')]."
  maghrebi_culture.25.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')|U] забу[ROOT.GetCountry.Custom('tribes_vlaloly')], яке місце їм відведено в цьому світі, і ми про це нагадаємо."
  maghrebi_culture.25.b: "Нехай [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')|l] зберіга[ROOT.GetCountry.Custom('tribes_yeyut')] самостійність — нам не потрібні міжусобиці."
  maghrebi_culture.26.title: "Панування над Магрибом"
  maghrebi_culture.26.desc: "Падіння держави Альмохадів занурило #TOOLTIP:REGION,maghreb_region,X #L Магриб#!#! у хаос та призвело до послаблення впливу на #TOOLTIP:REGION,iberia_region,X #L Іберію#!#!. Фактично провідною силою в регіоні ста[ROOT.GetCountry.Custom('end_vlaloly')] [ROOT.GetCountry.GetName], і [our_ruler.GetName] [Select_CString(our_ruler.IsFemale, 'доклала чимало зусиль', 'доклав чимало зусиль')], щоб досягти таких висот. Хоча частина Магрибу й досі перебуває поза [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]им впливом, #TOOLTIP:CULTUREGROUP,iberian_group,X #L іберійським#!#! королівствам тепер доведеться рахуватися з [ROOT.GetCountry.Custom('CL_INST')] як із серйозним суперником, якого не варто недооцінювати будь-кому, хто бажає завоювати Магриб."
  maghrebi_culture.26.a: "Ми — захисники Магрибу!"
  maghrebi_culture.27.title: "Золота доба дому [our_ruler.GetDynasty.GetNameWithNoTooltip] у Магрибі"
  maghrebi_culture.27.desc: "Значна частина #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! перебуває під #L [ROOT.GetCountry.GetAdjective|l]ою#! владою — і дім [our_ruler.GetDynasty.GetName] не збирається сидіти склавши руки: він береться за оновлення найважливіших культурних споруд краю, а заразом опікується будівництвом нових осередків вченості. Ще недавно Магриб був близький до того, щоб опинитися під владою чужоземних країн, однак за правління дому [our_ruler.GetDynasty.GetNameWithNoTooltip] він перетворився на могутню силу, повагу до якої має чи не все [ShowScriptedGeographyName('mediterranean_sea_geography')]."
  maghrebi_culture.27.a: "Хай правління дому [our_ruler.GetDynasty.GetNameWithNoTooltip] буде довгим та успішним!"
  maghrebi_culture.28.title: "Вплив на корсарів"
  maghrebi_culture.28.desc: "#TOOLTIP:REGION,maghreb_region,X #L Магрибські#!#! капери давно зажили в #TOOLTIP:CONTINENT,europe,X #L Європі#!#! слави грізних морських розбійників, яких боїться все [ShowScriptedGeographyName('mediterranean_sea_geography')], проте вони ніколи не мали постійного покровителя — ті змінювалися від країни до країни.\n\nТепер, у міру того як на узбережжі дедалі дужче міцніє #L [ROOT.GetCountry.GetAdjective|l]ий#! вплив, капери все частіше звертаються до [ROOT.GetCountry.Custom('CL_GEN')] в надії здобути нашу підтримку та посилити набіги по всьому Середземномор’ю. Утім, наш [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] має власний погляд на це питання: дехто бачить можливість, навпаки, послабити каперів і тим самим спробувати відновити відносини з європейськими країнами, значно затьмарені століттями ворожнечі."
  maghrebi_culture.28.a: "Запропонуємо повну опіку з боку держави."
  maghrebi_culture.28.b: "Дозволимо піратам і надалі займатися розбоєм."
  maghrebi_culture.28.c: "Вживемо найсуворіших заходів проти піратів."
  maghreb_ibadi_nation_establish_majlis_ammi_said.title: "Підпорядкування меджлісу Аммі Саїд"
  maghreb_ibadi_nation_establish_majlis_ammi_said.desc: "Після падіння держави Рустамідів чимало #TOOLTIP:RELIGION,$ibadi_tt$,X #L ібадитів#!#! #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! мусили тікати до долини Мзаб. Частина їхніх країн увійшла до складу меджлісу Аммі Саїд, де порядку[ROOT.GetCountry.Custom('clergy_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]; інші ж зволіли зберегти самостійність.\n\nОскільки майже всі густонаселені ібадитські землі нині належать #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#!, [our_ruler.GetName] бажає перенести меджліс Аммі Саїд до [ROOT.GetCountry.GetCapital.Custom('LR_GEN')|l] [ROOT.GetCountry.GetCapital.GetName], — так [Select_CString(our_ruler.IsFemale, 'вона', 'він')] сподівається створити в Магрибі сильну та впливову ібадитську країну."
  maghreb_ibadi_nation_establish_majlis_ammi_said.desc.entry: "Розпорошена рада, яка діє одразу в кількох незалежних #TOOLTIP:RELIGION,$ibadi_tt$,X #L ібадитських#!#! країнах, здатна лише радити — але не правити. Утім, такий лад не вічний: оскільки найбільш густонаселені з цих земель нині підпорядковані нам, меджліс Аммі Саїд можна зібрати в одному місці та під єдиною владою. У долині Мзаб може зародитися самостійна країна, що охопить увесь #TOOLTIP:REGION,maghreb_region,X #L Магриб#!#!."
  maghreb_ibadi_nation_establish_majlis_ammi_said.a: "Вірн[ROOT.GetCountry.Custom('crown_yiaei')] нам [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] допомож[ROOT.GetCountry.Custom('crown_eut')] зміцнити владу!"
  maghreb_ibadi_nation_establish_majlis_ammi_said.a.entry: "$crown_estate$, вірна нам, допоможе зміцнити владу!"
  maghreb_masters_of_the_sahara.title: "Господарі Сахари"
  maghreb_masters_of_the_sahara.desc: "Минають роки й змінюються покоління, але життя народів #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! залишається так само нерозривно пов’язаним із торгівлею через Сахару. Пустеля нещадна, і перевезення коштовного краму — нелегка справа, але якщо нам вдасться зміцнити свій вплив у #TOOLTIP:AREA,desert_area,X #L сахарських оазах#!#! і заразом розбудувати інфраструктуру головних караванних стоянок, то наші народи зможуть підкорити собі навіть ці суворі піски."
  maghreb_masters_of_the_sahara.a: "Ми домоглися неможливого!"
  empower_the_desert_power_privilege_tt: "Привілей «[ShowEstatePrivilegeName('desert_power')]» буде значно розширено, і він почне надавати додаткові переваги, які усувають штрафи для [Concept('locations', 'місцевостей')|e], що мають #TOOLTIP:VEGETATION,desert,X #L пустельний#!#! тип рослинности або #TOOLTIP:CLIMATE,arid,X #L посушливий#!#! клімат."
  empower_the_desert_power_privilege_tt_default_bonus: "Привілей «[ShowEstatePrivilegeName('desert_power')]» також отримає #G +0,0020#! до модифікатора «[ShowModifierTypeName('global_monthly_development')]» та #G +2,50%#! до модифікатора «[ShowModifierTypeName('global_max_control')]»"