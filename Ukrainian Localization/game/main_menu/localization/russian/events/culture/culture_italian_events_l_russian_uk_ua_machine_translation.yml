l_russian:
  italian_renaissance_culture.1.title: "Боротьба за вовну з Флоренцією"
  italian_renaissance_culture.1.desc: "Панівне становище торговельних гільдій #TOOLTIP:LOCATION,florence,X #L Флоренції#!#! — головних торговців #TOOLTIP:GOODS,wool,X #L вовною#!#! в #TOOLTIP:REGION,italy_region,X #L Італії#!#! — невдовзі ніби ось-ось похитнеться: [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] твердо вір[ROOT.GetCountry.Custom('burghers_ytyat')], що нарощування виробництва #L [ROOT.GetCountry.GetAdjective|l]ої#! вовни — перший крок до неминучого порятунку світових ринків з мертвої хватки флорентійських купців, і головну роль у цьому неодмінно зіграє [ROOT.GetCountry.GetNameWithNoTooltip].\n\nЯкщо [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] надасть достатні кошти, то деяк[ROOT.GetCountry.Custom('burghers_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] навіть згодн[ROOT.GetCountry.Custom('burghers_yiaei')] заснувати нові торговельні гільдії, щоб підтримати зростання [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ої вовняних промислів. Втім, деякі придворні вважають інакше: на їхню думку, [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] повин[ROOT.GetCountry.Custom('peasants_ennanonі')] зберегти самоврядування у всьому, що стосується виробництва вовни."
  italian_renaissance_culture.1.a: "Нехай [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] заснову[ROOT.GetCountry.Custom('burghers_yeyut')] цехи вовнярів."
  italian_renaissance_culture.1.b: "Нехай [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')|l] зберіга[ROOT.GetCountry.Custom('peasants_yeyut')] самоврядування в питаннях виробництва вовни."
  ita_culture_rival_wool_guild_locations.tt: "Усі [Concept('locations', 'місцевості')|e], що належать нам в #TOOLTIP:REGION,italy_region,X #L Італії#!#!, де виробляється вовна, отримають модифікатор «[ShowModifier('italian_culture_rival_wool_trade')]» на 60 років і отримають #G +1,00#! до розширення (якщо рівень не максимальний)"
  italian_renaissance_culture.2.title: "Вимирання сільської місцевості"
  italian_renaissance_culture.2.desc: "Після того, як нашими краями прокотилася #TOOLTIP:SITUATION,black_death,X #L Чорна смерть#!#!, сільські місцевості #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! стрімко знелюдніли. І хоча мор не пощадив й [target_location.Custom('LR_ACC')|l] [target_location.GetName], йому усе-таки не вдалося зламати народ: багато хто прагне перебратися сюди в надії знову розжитися місцевими багатствами, про які на певний час довелося забути через пошесть.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] ж вважає, що зараз нам випала чудова нагода перетворити [target_location.Custom('LR_ACC')|l] [target_location.GetNameWithNoTooltip] на місто, а заодно — відбудувати зруйноване, однак якщо [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] почн[ROOT.GetCountry.Custom('peasants_eut')] поголовно покидати сільські місцевості, наслідки для [ROOT.GetCountry.Custom('CL_GEN')] будуть найнеприємнішими."
  italian_renaissance_culture.2.a: "Заохотити переїзд до [target_location.Custom('LR_ACC')|l] [target_location.GetNameWithNoTooltip]."
  italian_renaissance_culture.2.b: "Надати допомогу сільській місцевості, щоб уповільнити переселення."
  italian_renaissance_culture.3.title: "Повторне відкриття давньогрецької думки"
  italian_renaissance_culture.3.desc: "На хвилі поширення #TOOLTIP:REGION,italy_region,X #L Італією#!#! ідеалів #TOOLTIP:AGE,age_2_renaissance,X #L Відродження#!#! в #TOOLTIP:CULTUREGROUP,italian_group,X #L італійських#!#! учених мужів виник чималий інтерес до праць давніх #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греків#!#!: здобути, а потім перекласти якийсь античний твір вважається вельми почесною справою. Це помічає й [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]; численні радники, які щиро ратують за перетворення [ROOT.GetCountry.Custom('CL_GEN')] на одну з найвеличніших країн Італії, вважають, що [target_character.GetName] [Select_CString(target_character.IsFemale, 'мусить', 'мусить')] підтримати прагнення вчених."
  italian_renaissance_culture.3.a: "Заохотити вивчення мудрості давніх!"
  italian_renaissance_culture.3.b: "Запропонувати їм заступництво з боку держави."
  italian_renaissance_culture.3.c: "Ми залишимося вірні звичаям."
  encourage_humanist_thought_for_rewards_tt: "Сприяння переходу до #TOOLTIP:SOCIETAL_VALUE,spiritualist_vs_humanist,X #L гуманізму#!#! призведе до того, що [ROOT.GetCountry.GetCapital.GetName] стане важливим осередком гуманістичної думки"
  italian_renaissance_culture.4.title: "[target_location.GetNameWithNoTooltip] — осередок гуманізму"
  italian_renaissance_culture.4.desc: "Натхненні ідеалами #TOOLTIP:AGE,age_2_renaissance,X #L Відродження#!#! #TOOLTIP:REGION,italy_region,X #L італійці#!#! почали знову відкривати для себе літературу давніх #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греків#!#!, перекладену з візантійських рукописів. Численні мислителі Італії, які вперше доторкнулися до давно забутих творів, настільки надихнулися прочитаним, що вирішили цілком присвятити себе справі гуманізму. Завдяки заступництву, яке їм надає [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]$ #L [ROOT.GetCountry.GetAdjective|l]ої#! держави, [target_location.GetName] сьогодні вважається одним з найважливіших місць Італії, де процвітають ідеї #TOOLTIP:SOCIETAL_VALUE,spiritualist_vs_humanist,X #L гуманізму#!#!; [target_location.GetRank.GetName|l] вабить численних вчених і мислителів. І оскільки #TOOLTIP:AGE,age_2_renaissance,X #L Відродження#!#! лише набирає розмаху, [target_location.GetNameWithNoTooltip], безсумнівно, ще довго зберігатиме своє сьогоднішнє становище."
  italian_renaissance_culture.4.a: "[target_location.GetNameWithNoTooltip] стане світочем гуманістичної думки в Італії."
  italian_renaissance_culture.4.b: "Обмежимо поширення ідей гуманізму."
  italian_renaissance_culture.5.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] звертає увагу на митця, який подає надії"
  italian_renaissance_culture.5.desc: "Доба #TOOLTIP:AGE,age_2_renaissance,X #L Відродження#!#! стала справжнім благом для #TOOLTIP:REGION,italy_region,X #L Італії#!#!: видатним митцям, які сьогодні йдуть до слави, вже давно немає ліку. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U], зокрема, вважає, що один з таких митців — [target_artist.GetName], про [Select_CString(target_artist.IsFemale, 'яку', 'якого')] раз у раз говорить [ROOT.GetCountry.GetCapital.GetName], — заслуговує на заступництво з боку держави. Радники вважають, що [target_character.GetName] вчинить правильно, якщо погодиться на це, оскільки [target_artist.GetNameWithNoTooltip] подає великі надії і з часом напевно стане одним з головних надбань Італії."
  italian_renaissance_culture.5.a: "Наймімо [Select_CString(target_artist.IsFemale, 'її', 'його')] — нехай служить при дворі!"
  italian_renaissance_culture.5.b: "Нам не потрібні [Select_CString(target_artist.IsFemale, 'її', 'його')] послуги."
  italian_renaissance_culture.6.title: "[target_location.GetNameWithNoTooltip] — проповідник ідей гуманізму"
  italian_renaissance_culture.6.desc: "[ROOT.GetCountry.GetCapital.GetName] сьогодні — прихисток видатних мислителів родом з [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip], проповідників ідей #TOOLTIP:SOCIETAL_VALUE,spiritualist_vs_humanist,X #L гуманізму#!#! і поширювачів нещодавно виконаних перекладів літератури давніх #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греків#!#! серед місцевого населення. І хоча [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] багато в чому також виявляє інтерес до перекладених праць, деякі застерігають нас від надмірного захоплення гуманізмом: він здатний похитнути стабільність держави."
  italian_renaissance_culture.6.a: "Дозволити вченим поширювати перекладену літературу."
  italian_renaissance_culture.6.b: "Обмежити поширення перекладів."
  italian_renaissance_culture.7.title: "Опіка над новими мистецтвами"
  italian_renaissance_culture.7.desc: "Численн[ROOT.GetCountry.Custom('burghers_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] постражда[ROOT.GetCountry.Custom('burghers_vlaloly')] від #TOOLTIP:SITUATION,black_death,X #L Чорної смерти#!#! не тільки тілесно: витрати купців значно зросли, оскільки перевозити товари на далекі відстані виявилося складніше, ніж раніше; крім того, підскочив попит на предмети першої потреби. З настанням доби #TOOLTIP:AGE,age_2_renaissance,X #L Відродження#!#! [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] частково ста[ROOT.GetCountry.Custom('burghers_vlaloly')] відмовлятися від купецької справи та поча[ROOT.GetCountry.Custom('burghers_vlaloly')] плекати нові мистецтва.\n\nДля багатьох із них вкладення вже повернулися сторицею, і тому дехто вважає, що й [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] марно не допомагає новим мистецтвам розвиватися. Можливо, нам також слід почати опікуватися ними?"
  italian_renaissance_culture.7.a: "Допомогти новим мистецтвам розвиватися."
  italian_renaissance_culture.7.b: "Ліпше спрямувати дохід до скарбниці країни."
  italian_renaissance_culture.8.title: "Видатний кондотьєр із [ROOT.GetCountry.GetCapital.Custom('CL_GEN')]"
  italian_renaissance_culture.8.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] обговорює останні новини: до #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_ACC')|L]#!#! [Select_CString(target_character_2.IsFemale, 'прибула відома кондотьєрка', 'прибув відомий кондотьєр')] [target_character_2.GetNameWithNoTooltip] — людина, що здобула не одну славну перемогу, а тому, як вважають при дворі, здатна послужити нам непогану службу. Можливо, слід надіслати [Select_CString(target_character_2.IsFemale, 'їй', 'йому')] запрошення, поки [Select_CString(target_character_2.IsFemale, 'вона', 'він')] ще тут: #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! знадобляться вмілі вояки, якщо раптом завтра у двері постукає війна."
  italian_renaissance_culture.8.a: "Найняти [Select_CString(target_character_2.IsFemale, 'її', 'його')]: нехай [target_character_2.GetNameWithNoTooltip] дбає про спокій [ROOT.GetCountry.Custom('CL_GEN')]."
  italian_renaissance_culture.8.b: "Нам не потрібні [Select_CString(target_character_2.IsFemale, 'її', 'його')] знання у військовій справі."
  italian_renaissance_culture.9.title: "[ROOT.GetCountry.GetNameWithNoTooltip] вабить кондотьєрів своїм впливом"
  italian_renaissance_culture.9.desc: "#L [ROOT.GetCountry.GetAdjective|U]ий#! вплив дедалі ширше охоплює #TOOLTIP:REGION,italy_region,X #L Італію#!#!, і [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] дедалі частіше приймає у себе кондотьєрів — ватажків компаній найманців, що прагнуть вступити на службу до могутньої країни. Деякі придворні вважають, що не варто відмовляти цим людям, оскільки розширення кордонів [ROOT.GetCountry.Custom('CL_GEN')] призвело до різкого зростання видатків на збір війська; інші ж побоюються, що кондотьєрів веде жага наживи та холодний розрахунок: вони хочуть, щоб ми стали залежні від найманих вояків, а отже, не могли відмовитися від їхніх послуг."
  italian_renaissance_culture.9.a: "Постараємося завоювати прихильність кондотьєрів і візьмемо їх на службу."
  italian_renaissance_culture.9.b: "Не варто ризикувати: ми можемо опинитися у них в боргу."
  italian_renaissance_culture.10.title: "[condottieri_company.GetNameWithNoTooltip] вимагає більше платні"
  italian_renaissance_culture.10.desc: "Відома компанія — [condottieri_company.GetName] — звернулася до нас з офіційною вимогою: її кондотьєр вважає, що [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] #L [ROOT.GetCountry.GetAdjective|l]ої#! країни платить недостатньо і надто недооцінює майстерність його вояків.\n\nМалоймовірно, що [condottieri_company.GetNameWithNoTooltip] піде проти угоди з [ROOT.GetCountry.Custom('CL_INST')], однак якщо ми не поступимося, навряд чи в майбутньому ці люди служитимуть нам так само охоче, як сьогодні."
  italian_renaissance_culture.10.a: "Погодитися з вимогами, що висуває [condottieri_company.GetNameWithNoTooltip]."
  italian_renaissance_culture.10.b: "Відмовитися виплачувати додаткову платню."
  italian_renaissance_culture.11.title: "Поширення флорентійської культури"
  italian_renaissance_culture.11.desc: "[ROOT.GetCountry.GetCapital.GetName] користується значним впливом, однак навіть [ROOT.GetCountry.GetCapital.GetRank.GetName|l] такого масштабу меркне перед лицем знаменитої #TOOLTIP:LOCATION,florence,X #L Флоренції#!#! — одного з найвизначніших #TOOLTIP:LOCATIONRANK,city,X #L міст#!#! Італії.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle|U], ратуючи за зміцнення престижу [ROOT.GetCountry.GetCapital.Custom('CL_GEN')], пропонує перейняти частину культурних особливостей Флоренції."
  italian_renaissance_culture.11.a: "Перейняти частину флорентійської культури."
  italian_renaissance_culture.11.b: "Стати на захист рідної культури [ROOT.GetCountry.GetCapital.Custom('CL_GEN')]."
  italian_renaissance_culture.12.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')|U]: допомогти чи забути?"
  italian_renaissance_culture.12.desc: "Від #TOOLTIP:SITUATION,black_death,X #L Чорної смерти#!#! так чи інакше постраждали всі суспільні класи #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! без винятку, однак найсильнішого удару зазна[ROOT.GetCountry.Custom('peasants_vlaloly')] [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l]. Поки натхненн[ROOT.GetCountry.Custom('burghers_yiaei')] #TOOLTIP:AGE,age_2_renaissance,X #L Відродженням#!#! [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] вклада[ROOT.GetCountry.Custom('burghers_yeyut')] кошти в розвиток мистецтв, а [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]а еліта прагне нових культурних висот, [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')|l] продовжу[ROOT.GetCountry.Custom('peasants_yeyut')] страждати від наслідків чуми.\n\nЩоб допомогти нещасним відновитися, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] пропонує скоротити державні кошти, що виділяються на підтримку мистецтв, і перенаправити їх на користь постраждалих від Чорної смерти."
  italian_renaissance_culture.12.a: "Ми продовжимо плекати мистецтво."
  italian_renaissance_culture.12.b: "Спрямувати кошти, щоб [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')|l] зм[ROOT.GetCountry.Custom('peasants_ihohlaloly')] стати на ноги."
  italian_renaissance_culture.13.title: "[target_artist.GetNameWithNoTooltip] перекладає давньогрецький рукопис"
  italian_renaissance_culture.13.desc: "Повний переклад старовинного рукопису з мови давніх #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греків#!#!, який [Select_CString(target_artist.IsFemale, 'виконала', 'виконав')] [target_artist.GetName], викликав жвавий інтерес з боку вчених #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, і тепер багато хто з них пристрасно бажає заволодіти цим трудом. Деякі, втім, бачать у сформованих обставинах можливість зміцнити престиж [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ої країни, а тому вважають, що [target_character.GetName] [Select_CString(target_artist.IsFemale, 'повинна', 'повинен')] посприяти поширенню перекладеного рукопису в країнах #TOOLTIP:CONTINENT,europe,X #L Європи#!#!."
  italian_renaissance_culture.13.a: "Хай славиться [target_artist.GetNameWithNoTooltip] і [Select_CString(target_artist.IsFemale, 'її', 'його')] переклад!"
  italian_renaissance_culture.13.b: "Поширимо [Select_CString(target_artist.IsFemale, 'її', 'його')] працю якомога ширше!"
  italian_renaissance_culture.13.c: "Нехай доступ до цієї роботи має тільки [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]."
  italian_renaissance_culture.14.title: "[target_artist.GetNameWithNoTooltip] і [Select_CString(target_artist.IsFemale, 'її', 'його')] дар"
  italian_renaissance_culture.14.desc: "[target_character.GetName] вважає, що [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] не дарма опікується таким митцем, як [target_artist.GetName]: [Select_CString(target_artist.IsFemale, 'її', 'його')] витвори незмінно користуються схваленням верхівки суспільства. Високопоставлен[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], впливов[ROOT.GetCountry.Custom('burghers_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] — кожен з них так чи інакше доторкнувся до праць, які створює [target_artist.GetNameWithNoTooltip], а [target_character.GetNameWithNoTooltip] сьогодні користується ще більшим впливом, ніж раніше."
  italian_renaissance_culture.14.a: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] тільки виграє від [Select_CString(target_artist.IsFemale, 'її', 'його')] присутності!"
  italian_renaissance_culture.15.title: "[ShowArtistTypeName('architect')|U]-знаменитість"
  italian_renaissance_culture.15.desc: "[target_artist.GetName] користується в #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! значною славою: серед [Select_CString(target_artist.IsFemale, 'її', 'його')] досягнень — кілька архітектурних проєктів у #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_PREP')|L]#!#!. Численн[ROOT.GetCountry.Custom('burghers_yiaei')] впливов[ROOT.GetCountry.Custom('burghers_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] цілими родинами опікуються цією людиною. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] вважає, що нам слід найняти [Select_CString(target_artist.IsFemale, 'її', 'його')] на службу, оскільки саме [target_artist.GetName], бездоганно [Select_CString(target_artist.IsFemale, 'розбирається', 'розбирається')] в класичній архітектурі, може відіграти найважливішу роль в архітектурному відродженні [ROOT.GetCountry.GetCapital.Custom('CL_GEN')]."
  italian_renaissance_culture.15.a: "Запропонуємо [Select_CString(target_artist.IsFemale, 'їй', 'йому')] опіку з боку країни."
  italian_renaissance_culture.15.b: "Нас не цікавлять архітектурні проєкти."
  italian_renaissance_culture.16.title: "[target_artist.GetNameWithNoTooltip] просить у двору додаткові ресурси"
  italian_renaissance_culture.16.desc: "[target_artist.GetName] [Select_CString(target_artist.IsFemale, 'змушена', 'змушений')] звернутися до нас по допомогу: створення витвору в класичному дусі призупинилося через нестачу коштів, а виділити їх може тільки [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]. [target_artist.GetName] чесно визнає, що [Select_CString(target_artist.IsFemale, 'недооцінила', 'недооцінив')] розмах і складність свого починання, і обіцяє, що [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] не пошкодує, якщо все-таки піде [Select_CString(target_artist.IsFemale, 'їй', 'йому')] назустріч, — хоча б тому, що наша культура здобуде ще більшу славу."
  italian_renaissance_culture.16.a: "Надамо [Select_CString(target_artist.IsFemale, 'їй', 'йому')] все необхідне."
  italian_renaissance_culture.16.b: "Нам це не по кишені."
  italian_renaissance_culture.17.title: "[target_rival_artist.GetArtistType.GetNameWithNoTooltip] у [target_rival.Custom('CL_PREP')] виявляє невдоволення"
  italian_renaissance_culture.17.desc: "[target_rival_artist.GetName] користується в #TOOLTIP:REGION,italy_region,X #L Італії#!#! певною творчою славою, нехай навіть [Select_CString(target_rival_artist.IsFemale, 'вона', 'він')] і працює над своїми витворами в країні, яку ми вважаємо суперником, — у #ONCLICK:COUNTRY,[target_rival.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_rival.Custom('CL_tt')],X [target_rival.Custom('CL_PREP')|L]#!#!. Нещодавно, втім, до нас дійшли чутки, що [Select_CString(target_rival_artist.IsFemale, 'вона невдоволена', 'він невдоволений')] опікою з боку [target_rival.Custom('CL_GEN')].\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] бачить у цьому вдалу нагоду, тому радники закликають нас укласти таємну угоду — вони сподіваються, що [target_rival_artist.GetNameWithNoTooltip] перейде до нашого двору. Тоді, по-перше, вплив [target_rival.Custom('CL_GEN')] буде підірвано, по-друге, [target_rival_artist.GetArtistType.GetName|l] працюватиме вже на благо нашої країни."
  italian_renaissance_culture.17.a: "Якнайшвидше спробуємо укласти угоду: нехай [target_rival_artist.GetNameWithNoTooltip] працює на нас!"
  italian_renaissance_culture.17.b: "Не варто наймати митців, будь-як пов’язаних з [target_rival.Custom('CL_INST')]."
  italian_renaissance_culture.18.title: "[target_artist.GetNameWithNoTooltip] та мистецтво олійного живопису"
  italian_renaissance_culture.18.desc: "Протягом багатьох років неповторна техніка фламандських художників — майстрів олійного живопису залишалася надбанням виключно Нідерландів. Однак [Select_CString(target_artist.IsFemale, 'яка повернулася', 'який повернувся')] нещодавно з Нідерландів до #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_ACC')|L]#!#! [target_artist.GetName] сподівається на основі цих знань створити нову, виключно #TOOLTIP:REGION,italy_region,X #L італійську#!#! традицію написання картин олією.\n\nЧисленн[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], що бажа[ROOT.GetCountry.Custom('nobles_yeyut')] бачити появу в #TOOLTIP:REGION,italy_region,X #L Італії#!#! нових традицій, заявля[ROOT.GetCountry.Custom('nobles_yeyut')], що [target_character.GetName] [Select_CString(target_character.IsFemale, 'повинна', 'повинен')] надати цьому митцю опіку."
  italian_renaissance_culture.18.a: "[Select_CString(target_artist.IsFemale, 'Її', 'Його')] техніка неповторна. Ми згодні підтримати [Select_CString(target_artist.IsFemale, 'її', 'його')]!"
  italian_renaissance_culture.18.b: "Подібний підхід до живопису нас не цікавить."
  italian_renaissance_culture.19.title: "[target_artist.GetNameWithNoTooltip] із Флоренції"
  italian_renaissance_culture.19.desc: "До #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_ACC')|L]#!#! [Select_CString(target_artist.IsFemale, 'прибула', 'прибув')] [target_artist.GetName] — митець, [Select_CString(target_artist.IsFemale, 'яка здобула', 'який здобув')] певну славу у #TOOLTIP:LOCATION,florence,X #L Флоренції#!#! і тепер [Select_CString(target_artist.IsFemale, 'творить', 'творить')] на замовлення, якщо про це попрос[ROOT.GetCountry.Custom('nobles_ytyat')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l]. Однак новину про [Select_CString(target_artist.IsFemale, 'її', 'його')] присутність у [ROOT.GetCountry.GetCapital.Custom('CL_PREP')] почули і [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l]; вони виявляють глибокий інтерес до діяльності цієї людини, а тому звернулися до нас із проханням: нехай [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] також доручить [Select_CString(target_artist.IsFemale, 'їй', 'йому')] створити щось для себе — у такому разі [target_artist.GetNameWithNoTooltip] ще не скоро поїде з [ROOT.GetCountry.GetCapital.Custom('CL_GEN')].\n\nОднак слід врахувати, що [ShowArtistTypeName('philosopher')|l] із Флоренції вимагатиме на своє утримання більше, ніж зазвичай надає [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]."
  italian_renaissance_culture.19.a: "Видатки великі, однак ми з радістю приймемо [Select_CString(target_artist.IsFemale, 'її', 'його')] у себе."
  italian_renaissance_culture.19.b: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] не зможе собі це дозволити."
  italian_renaissance_culture.20.title: "[target_artist.GetNameWithNoTooltip] для [target_country.Custom('longname_ua_wntt_GEN')]?"
  italian_renaissance_culture.20.desc: "Славне ім’я «[target_artist.GetName]» сьогодні відоме вже далеко за межами #TOOLTIP:REGION,italy_region,X #L Італії#!#!, і тому в надії, що [target_artist.GetNameWithNoTooltip] погодиться надати їм свої послуги, [target_country.GetGovernment.GetCourtTitle|l] [target_country.Custom('longname_ua_GEN')] звертається до #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#!. [target_country.GetAdjectiveWithNoTooltip|U]а країна готова заплатити чималі гроші, аби влада [ROOT.GetCountry.Custom('CL_GEN')] не стала перешкоджати від’їзду митця, і [target_artist.GetNameWithNoTooltip] [Select_CString(target_artist.IsFemale, 'змогла', 'зміг')] перебратися до [target_country.Custom('CL_ACC')]."
  italian_renaissance_culture.20.a: "Ми приймемо [target_country.GetAdjectiveWithNoTooltip|l]і гроші — нехай [target_artist.GetShortNameWithNoTooltip] їде."
  italian_renaissance_culture.20.b: "[target_artist.GetShortNameWithNoTooltip] залишиться під нашою опікою."
  italian_renaissance_culture.21.title: "Опіка над мистецтвом Відродження обходиться надто дорого"
  italian_renaissance_culture.21.desc: "З часом стало очевидно, що всебічна опіка над мистецтвами #TOOLTIP:AGE,age_2_renaissance,X #L Відродження#!#! обходиться #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! надто дорого. [ROOT.GetCountry.GetAdjectiveWithNoTooltip|U]а скарбниця порожніє день у день, і якщо ми не вживемо рішучих дій, країні загрожує катастрофа. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U], втім, вважає (хоча з цим згодні не всі), що з часом опіка, що надається митцям, себе повністю виправдає."
  italian_renaissance_culture.21.a: "Скоротити видатки на мистецтво, щоб врятувати скарбницю."
  italian_renaissance_culture.21.b: "Ми продовжимо опікуватися мистецтвом!"
  italian_renaissance_culture.22.title: "[target_location.GetNameWithNoTooltip] — осередок мистецтва та культури доби Відродження"
  italian_renaissance_culture.22.desc: "Завдяки значним зусиллям з боку [ROOT.GetCountry.GetLongName], насамперед грошовим, [target_location.GetName] сьогодні — один із найважливіших осередків, де кується мистецтво #TOOLTIP:AGE,age_2_renaissance,X #L Відродження#!#!; можливо, у всій #TOOLTIP:REGION,italy_region,X #L Італії#!#!, а можливо — навіть у всій #TOOLTIP:CONTINENT,europe,X #L Європі#!#!. До #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_ACC')|l]#!#! прагнуть видатні митці та вчені з усього континенту, і розмовам про те, як [target_location.GetNameWithNoTooltip] несе в собі дух часу, немає кінця."
  italian_renaissance_culture.22.a: "[target_location.GetNameWithNoTooltip] ще багато століть буде культурною гордістю Європи!"
  italian_renaissance_culture.22.b: "Скористатися доброю славою [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip], щоб зміцнити свій престиж"
  italian_renaissance_culture.23.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_on_the_fates_of_famous_men')]"
  italian_renaissance_culture.23.desc: "[Select_CString(target_artist.IsFemale, 'Одна', 'Один')] із найзнаменитіших митців доби #TOOLTIP:AGE,age_2_renaissance,X #L Відродження#!#! — [target_artist.GetName] — щойно [Select_CString(target_artist.IsFemale, 'закінчила', 'закінчив')] черговий вражаючий твір під назвою [ShowWorkOfArtName('boccaccio_on_the_fates_of_famous_men')]. У ньому описуються численні видатні люди біблійної та класичної епох, а також найважливіші постаті минулого століття. Цей твір вельми об’ємний і цінний: якщо [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] раптом захоче розлучитися з ним, покупцеві напевно доведеться заплатити істотну суму."
  italian_renaissance_culture.23.a: "Дивовижний твір про історичних діячів."
  italian_renaissance_culture.23.b: "Можливо, [Select_CString(target_artist.IsFemale, 'її', 'його')] працею зацікавляться [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l]?"
  italian_renaissance_culture.24.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_the_decameron')]"
  italian_renaissance_culture.24.desc: "[target_artist.GetName] на власні очі [Select_CString(target_artist.IsFemale, 'бачила', 'бачив')], як бушує #TOOLTIP:SITUATION,black_death,X #L Чорна смерть#!#!. Це спонукало [Select_CString(target_artist.IsFemale, 'її', 'його')] написати [ShowWorkOfArtName('boccaccio_the_decameron')] — твір, яким значною мірою зацікави[ROOT.GetCountry.Custom('nobles_vlaloly')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Історія, що розгортається у #TOOLTIP:LOCATION,florence,X #L Флоренції#!#!, присвячена десятьом юнакам і дамам, які поїхали за місто, щоб врятуватися від чуми. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] вважає, що твір, над яким так старанно [Select_CString(target_artist.IsFemale, 'працювала', 'працював')] [target_artist.GetLastNameWithNoTooltip], слід всіляко поширити."
  italian_renaissance_culture.24.a: "Який захопливий збірник! Займемося поширенням [Select_CString(target_artist.IsFemale, 'її', 'його')] роботи."
  italian_renaissance_culture.24.b: "Нехай ним краще володі[ROOT.GetCountry.Custom('nobles_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l]."
  italian_renaissance_culture.25.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_concerning_famous_women')]"
  italian_renaissance_culture.25.desc: "Не задовольнившись досягнутим — випуском трактату [ShowWorkOfArtName('boccaccio_on_the_fates_of_famous_men')] — [target_artist.GetName] [Select_CString(target_artist.IsFemale, 'опублікувала', 'опублікував')] ще один твір, цього разу присвячений знаменитим історичним діячам, а саме — жінкам. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] щиро дивується: схоже, [target_artist.GetLastNameWithNoTooltip] справді виявляє непідробний інтерес до цих особистостей. Ми не сумніваємося, що [ShowWorkOfArtName('boccaccio_concerning_famous_women')], подібно до попередніх робіт [Select_CString(target_artist.IsFemale, 'письменниці', 'письменника')], стане для нас рятівною соломинкою на випадок, якщо державна скарбниця спорожніє."
  italian_renaissance_culture.25.a: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] ретельно берегтиме цей твір."
  italian_renaissance_culture.25.b: "Нехай [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] продасть цю хроніку на аукціоні."
  italian_renaissance_culture.26.title: "[target_character_2.GetNameWithNoTooltip] рветься до влади"
  italian_renaissance_culture.26.desc: "[target_character_2.GetName] користується у #TOOLTIP:LOCATION,florence,X #L Флоренції#!#! певним впливом: ця людина чудово знає свою справу та всіляко сприяє поширенню #TOOLTIP:SOCIETAL_VALUE,spiritualist_vs_humanist,X #L гуманістичних#!#! ідеалів #TOOLTIP:AGE,age_2_renaissance,X #L Відродження#!#!. [Select_CString(target_character_2.IsFemale, 'Її', 'Його')] заслуги визнає зокрема й [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]; дехто навіть вважає, що [target_character_2.GetNameWithNoTooltip] [Select_CString(target_character_2.IsFemale, 'достойна', 'достойний')] засідати ні багато ні мало в такому органі, як [ROOT.GetCountry.GetGovernment.GetCabinetTitle|l], — якщо, звісно, на це погодиться [target_character.GetName]."
  italian_renaissance_culture.26.a: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] з радістю прийме на службу таку людину."
  italian_renaissance_culture.26.b: "[ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle|U] такого роду нам пригодиться — нехай [ROOT.GetCountry.GetGovernment.GetCabinetTitle|l] прийме [Select_CString(target_character_2.IsFemale, 'її', 'його')] до себе."
  italian_renaissance_culture.26.c: "Ми не жалуватимемо [Select_CString(target_character_2.IsFemale, 'їй', 'йому')] жодних особливих привілеїв."
  italian_renaissance_culture.27.title: "[target_artist.GetNameWithNoTooltip]"
  italian_renaissance_culture.27.desc: "Попри багаторічне визнання, яким [target_artist.GetName] користується серед жителів #TOOLTIP:REGION,italy_region,X #L Італії#!#!, [Select_CString(target_artist.IsFemale, 'її', 'його')] уявлення про мирську освіту повною мірою знайшли розуміння тільки в багатих мешканців #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_GEN')|L]#!#!, де [target_artist.GetNameWithNoTooltip] зараз проживає. Однак [ROOT.GetCountry.GetCapital.GetRank.GetName|l], як водиться, не єдиної думки: дехто з [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] невдоволен[ROOT.GetCountry.Custom('clergy_yiaei')] [Select_CString(target_artist.IsFemale, 'її', 'його')] підходом до навчання, інші ж просять, щоб [target_character.GetName] надав [Select_CString(target_artist.IsFemale, 'їй', 'йому')] повноцінне громадянство #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!."
  italian_renaissance_culture.27.a: "Наймімо [Select_CString(target_artist.IsFemale, 'її', 'його')]!"
  italian_renaissance_culture.27.b: "[Select_CString(target_artist.IsFemale, 'Її', 'Його')] ідеї надто радикальні."
  italian_renaissance_culture.28.title: "Заснування Дому радости"
  italian_renaissance_culture.28.desc: "[target_artist.GetName], відтепер [Select_CString(target_artist.IsFemale, 'повноправна громадянка', 'повноправний громадянин')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, поширює своє вчення серед численних жителів [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Зараз [Select_CString(target_artist.IsFemale, 'вона', 'він')] намагається, сподіваючись на своє впливове становище, заручитися фінансовою допомогою, яку може надати тільки [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], і заснувати нову школу — #italic Casa Gioiosa#! («Дім радості»).\n\nХоча видатки будуть великі, [ShowBuildingTypeNameWithNoTooltip('art_school')|l] у [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip] неодмінно підвищить престиж [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ої країни в усій #TOOLTIP:REGION,italy_region,X #L Італії#!#!."
  italian_renaissance_culture.28.a: "Нехай буде їм [ShowBuildingTypeNameWithNoTooltip('art_school')|l]!"
  italian_renaissance_culture.28.b: "Краще заснувати університет із такою ж назвою."
  italian_renaissance_culture.28.c: "Ми не маємо грошей на це починання."
  italian_renaissance_culture.29.title: "[target_artist.GetNameWithNoTooltip]"
  italian_renaissance_culture.29.desc: "[target_artist.GetName], [Select_CString(target_artist.IsFemale, 'учениця', 'учень')] такого відомого майстра, як [target_artist_2.GetName], користується славою [Select_CString(target_artist.IsFemale, 'однієї', 'одного')] з найвидатніших учених #TOOLTIP:REGION,italy_region,X #L Італії#!#!; [Select_CString(target_artist.IsFemale, 'їй', 'йому')], зокрема, добре даються переклади рукописів із мови давніх #TOOLTIP:CULTURE,$greek_culture_tt$,X #L греків#!#!. Сьогодні [target_artist.GetNameWithNoTooltip] перебуває у #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.Custom('CL_tt')],X [ROOT.GetCountry.GetCapital.Custom('CL_PREP')|L]#!#! і будує далекосяжні плани: [Select_CString(target_artist.IsFemale, 'вона', 'він')] сподівається, що [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] #L [ROOT.GetCountry.GetAdjective|l]ої#! країни зможе надати [Select_CString(target_artist.IsFemale, 'їй', 'йому')] опіку, таку необхідну для роботи з виявленими нещодавно грецькими рукописами."
  italian_renaissance_culture.29.a: "Наймімо [Select_CString(target_artist.IsFemale, 'її', 'його')]!"
  italian_renaissance_culture.29.b: "Ми не надаватимемо [Select_CString(target_artist.IsFemale, 'їй', 'йому')] опіку!"
  italian_renaissance_culture.30.title: "[target_artist.GetNameWithNoTooltip]"
  italian_renaissance_culture.30.desc: "#TOOLTIP:REGION,italy_region,X #L Італійська#!#! школа олійного живопису ще не встигла як слід усталитися, однак уже зараз нам відомі імена деяких видатних #TOOLTIP:ARTIST,painter,X #L художників#!#! — першопрохідців цього напряму. Серед них — [target_artist.GetName], чиї картини незмінно користуються великим попитом при #TOOLTIP:CULTUREGROUP,italian_group,X #L італійських#!#! дворах.\n\nЧисленн[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] та численн[ROOT.GetCountry.Custom('burghers_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] сподіваються, що [target_character.GetName] запропонує [Select_CString(target_artist.IsFemale, 'їй', 'йому')] свою опіку, і тоді [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] країни набуде нової краси."
  italian_renaissance_culture.30.a: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] не відмовлятиметься від [Select_CString(target_artist.IsFemale, 'її', 'його')] картин: це підвищить наш престиж."
  italian_renaissance_culture.30.b: "Ми не можемо собі цього дозволити."