l_russian:
  town_rights_events.1.title: "Складове право [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  town_rights_events.1.desc: "Завдяки нашим зусиллям з розвитку #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#! [target_location.GetName] ми користуємося вигідними торговими перевагами. Урядовці з провінції [target_province.GetName] звернулися до уряду з питанням про те, як краще розпорядитися вирученими коштами."
  town_rights_events.1.a: "Ці гроші мають піти на благо всієї провінції."
  town_rights_events.1.b: "Вкладімо кошти в подальший розвиток порту."
  town_rights_events.1.c: "Спрямуймо кошти на потреби місцевості."
  every_location_in_province_dev_and_prosperity_tt: "Кожна [Concept('location', 'місцевість')|e] у провінції [target_province.GetName] отримає [ShowNamedValue('development_weak_bonus')|+=2%] до [Concept('development', 'розвитку')|e] та [ShowNamedValue('prosperity_mild_bonus')|+=2%] до [Concept('prosperity', 'процвітання')|e]"
  town_rights_events.2.title: "Господарчий застій у [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
  town_rights_events.2.desc: "Попри всі наші зусилля з розвитку #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#! [target_location.GetName], торгові судна практично не заходять до тутешнього порту, і купці не бажають тут торгувати. Нам залишається сподіватися, що це лише тимчасовий застій, який не призведе до повного занепаду."
  town_rights_events.2.a: "[target_character.GetShortNameWithNoTooltip] легко впорається з цією проблемою."
  town_rights_events.2.b: "На жаль, такі ризики будь-якого підприємства."
  town_rights_events.2.c: "Це питання явно не варте нашої уваги."
  administrative_expertise_of_ruler_mitigates_situation_tt: "Адміністративний [Concept('abilities', 'хист')|e] персонажа [target_character.GetName] дозволяє без зусиль вирішити цю проблему"
  town_rights_events.3.title: "Переповнені комори [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  town_rights_events.3.desc: "Селяни та робітники з провінції [target_province.GetName] повідомляють, що останнім часом [target_location.GetRank.GetName|l] [target_location.GetName] почав виробляти набагато більше продуктів, а їхня якість стала помітно кращою. Тепер нам необхідно якнайшвидше вирішити, як вчинити із надлишками харчів."
  town_rights_events.3.a: "Ці продукти мають піти на благо всієї провінції."
  town_rights_events.3.b: "Потрібно продати їх, поки вони не зіпсувалися."
  town_rights_events.3.c: "Розподілімо продукти між жителями [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
  every_location_gains_mild_prosperity: "Кожна [Concept('location', 'місцевість')|e] у провінції [target_province.GetName] отримає [ShowNamedValue('prosperity_mild_bonus')|+=2%] до [Concept('prosperity', 'процвітання')|e]"
  every_pop_in_target_location_mild_satisfaction_tt: "Наші [Concept('pops', 'групи населення')|e] у [target_location.Custom('LR_PREP')|l] [target_location.GetName] отримають [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] до [Concept('pop_satisfaction', 'вдоволення')|e]"
  income_gained_depends_on_crown_estate_power_tt: "Кількість виручених [Concept('gold', 'грошей')|e] сильно залежить від [Concept('crown_power', 'влади правителів')|e]"
  town_rights_events.4.title: "Порожні комори [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  town_rights_events.4.desc: "Селяни з #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#! [target_location.GetName] бідують: чи то через сувору погоду, чи то через чиюсь недбалість, люди не змогли запасти достатньо харчів, і тепер місцеві комори порожні. Жителі провінції [target_province.GetName] просять уряд про допомогу, щоб запобігти там голоду."
  town_rights_events.4.a: "Роздамо люду харч з владних засіків."
  town_rights_events.4.b: "Людям доведеться потерпіти, доки ми не здолаємо нестачу."
  town_rights_events.4.c: "Ми повинні докласти всіх зусиль, щоб запобігти масовому голоду."
  every_pop_in_target_location_mild_satisfaction_malus_tt: "Усі [Concept('pop', 'групи населення')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] отримають [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  relief_effort_tt: "Роздача харчів скорочує масштаби голоду"
  town_rights_events.5.title: "Нові методи виготовлення знаряддя у [target_location.Custom('LR_PREP')|l] [target_location.GetName]"
  town_rights_events.5.desc: "Завдяки майстерням [target_location.GetRank.GetNameWithNoTooltip|l] [target_location.GetName] став справжнім осередком розвитку технологій. Багато ремісників повідомляють, що тутешнє приладдя та методи обробки дозволяють помітно збільшити кількість і підвищити якість вироблених товарів. Тепер нам лише потрібно вирішити, як краще застосувати ці новації. Ми можемо використати їх для подальшого розвитку, спрямувати на благо місцевих жителів або просто випустити на широкий ринок."
  town_rights_events.5.a: "Заохотимо створення та впровадження нових технологій."
  town_rights_events.5.b: "Нехай ці новації підуть на розвиток [target_location.Custom('LR_GEN')|l]."
  town_rights_events.5.c: "Наповнимо ринок новими знаряддям."
  town_rights_events.6.title: "Ненадійне знаряддя з [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  town_rights_events.6.desc: "Знаряддя з #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#! [target_location.GetName] зажило вельми погану славу: їхні руків’я раз у раз тріскаються, леза швидко затуплюються, а з’єднання просто не витримують навантаження. Незрозуміло, з чим пов’язана така низька якість — із жадібністю ремісників чи з їхньою буденною недбалістю. Хай там як, покупці незадоволені, а колись добра репутація [target_location.Custom('LR_GEN')|l] руйнується просто на очах."
  town_rights_events.6.a: "Заспокоїмо людей і спробуємо виправити ситуацію."
  town_rights_events.6.b: "Нехай майстри самі відповідають за свою недбалу роботу."
  town_rights_events.6.c: "Це ганьба для [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  our_innovative_nature_finds_compromise_tt: "Наша [Concept('societal_values', 'схильність')|e] до #TOOLTIP:SOCIETAL_VALUE,traditionalist_vs_innovative,X #L новацій#!#! або наявність у персонажа [target_character.GetName] відповідної [Concept('trait', 'риси')|e] народжують новаторський підхід, який дозволяє нам знайти розумний компроміс і вирішити проблему"
  town_rights_events.7.title: "Ювеліри [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip] досягають успіху у своєму ремеслі"
  town_rights_events.7.desc: "Завдяки отриманим привілеям [ROOT.GetCountry.GetGovernment.GetAdjective|l]і ювеліри [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip] продовжують невпинно вдосконалювати своє ремесло. Вони освоїли нові методи обробки та навчилися створювати ще більш майстерні візерунки, заслуживши визнання не лише місцевих жителів, а й мандрівних купців. Творчі досягнення цих майстрів крок за кроком ведуть нашу країну до величі."
  town_rights_events.7.a: "Їхня праця принесе відомість і процвітання всій провінції."
  town_rights_events.7.b: "Прославимо ремісників [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
  town_rights_events.7.c: "Виставка виробів місцевих ювелірів прославить [ROOT.GetCountry.Custom('rank_ua_ACC')|l]."
  nobles_appreciate_jewellery_displays: "#italic [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] обожню[ROOT.GetCountry.Custom('nobles_yeyut')] ці чудові ювелірні вироби#!"
  jewellery_display_reinforces_authority: "#italic Нехай ці коштовності слугують символом нашої могутності та багатства#!"
  town_rights_events.8.title: "Велика пожежа в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
  town_rights_events.8.desc: "[target_location.GetRank.GetName] [target_location.GetName] спіткало страшне лихо: випадково спалахнуле полум’я швидко перекинулося на сусідні будинки й переросло в буйну пожежу. Квартал ювелірів уже почорнів від густого диму та серйозно постраждав під час метушні, що здійнялася. Якщо терміново нічого не вжити, пожежа може поширитися за межі [target_location.Custom('LR_GEN')|l]."
  town_rights_events.8.a: "[target_character.GetShortNameWithNoTooltip] особисто займеться допомогою постраждалим."
  town_rights_events.8.b: "Полум’я не зупинити!"
  town_rights_events.8.c: "Відправимо туди допомогу та спробуємо запобігти поширенню вогню."
  nature_of_target_character_assists_the_locals: "Завдяки своїй чуйності [target_character.GetName] заспокоює місцевих жителів і допомагає їм упоратися з наслідками пожежі"
  chance_the_fire_spreads_neighboring_locations_tt: "Пожежа з високою ймовірністю зачепить сусідні [Concept('locations', 'місцевості')|e]"
  relief_effort_prevents_spread_of_fire_tt: "Вчасно вжиті заходи завадили пожежі поширитися"
  town_rights_events.9.title: "Піднесення кораблебудування в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
  town_rights_events.9.desc: "На верфях і складах лісоматеріалів #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#! [target_location.GetName] вдень і вночі кипить робота. Робітники невпинно палять деревину для виробництва дьогтю, а купці та моряки раз у раз говорять про розширення своїх торгових підприємств — іншими словами, справи безперечно йдуть вгору. Подібне господарче зростання не тільки приносить користь [target_location.Custom('LR_DAT')|l], а й відкриває перед [ROOT.GetCountry.Custom('rank_ua_INST')|l] нові перспективи."
  town_rights_events.9.a: "Це зростання допоможе нам розширити свою присутність на морі."
  town_rights_events.9.b: "Необхідно розвивати морську торгівлю в цій місцевості."
  town_rights_events.9.c: "Очевидно, що майбутнє нашої країни тісно пов’язане з морем."
  town_rights_events.10.title: "Брак деревини і заворушення в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
  town_rights_events.10.desc: "Зростаючі потреби корабелів з #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#! [target_location.GetName] призвели до того, що в околицях практично не залишилося дерев. Зрозуміло, це викликає невдоволення у місцевих жителів, які роками жили за рахунок прилеглих лісів. Місцева кораблебудівна промисловість колись процвітала, але тепер стала об’єктом нападок і протестів, і якщо ми не вживемо заходів, то незабаром народне обурення може вилитися в масові заворушення."
  town_rights_events.10.a: "Відкличемо у місцевості особливі права, щоб заспокоїти народ."
  town_rights_events.10.b: "Відшкодуємо збитки та продовжимо будівництво кораблів."
  town_rights_events.10.c: "Місцевим жителям доведеться змиритися з цими обставинами."
  cooldown_10_years: "Ці [Concept('town_rights', 'міські права')|e] не можна буде знову відкликати протягом #v 10 років#!"
  laborers_and_peasants_happy_tt: "[Concept('laborers', 'Робітники')|e] та [Concept('peasants', 'селяни')|e] [target_location.Custom('LR_GEN')|l] [target_location.GetName] отримають [ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%] до [Concept('pop_satisfaction', 'вдоволення')|e]"
  town_rights_events.11.title: "Мода [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  town_rights_events.11.desc: "Кравці, фарбувальники та торговці тканинами в #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_PREP')|l]#!#! [target_location.GetName] стали справжніми законодавцями мод. Костюми, майстерно пошиті тут, не обговорює тільки ледачий, кожна випущена колекція одягу одразу стає зразком стилю для всієї країни. Матеріали та види крою, з якими працюють місцеві ремісники, набувають популярності далеко за межами провінції [target_province.GetName], а назву цієї [target_location.Custom('LR_GEN')|l] все частіше із захопленням вимовляють у світських колах. Філософія тутешніх майстрів проста: люди завжди будуть один на одного дивитися — то нехай же їхнє око порадується!"
  town_rights_events.11.a: "[target_character.GetShortNameWithNoTooltip] виглядає приголомшливо в новому вбранні!"
  town_rights_events.11.b: "Місцеві ремісники принесуть нашій країні престиж."
  town_rights_events.11.c: "Нехай ці витончені костюми прикрасять [ROOT.GetCountry.GetGovernment.GetAdjective|l]у знать."
  town_rights_events.12.title: "Ткацькі монополії [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  town_rights_events.12.desc: "За рахунок отриманих привілеїв невелика група підприємців [target_location.Custom('LR_GEN')|l] [target_location.GetName] підім’яла під себе місцеві ткацькі промисли. Дрібніші виробники скаржаться на те, що монополісти маніпулюють цінами та просто витісняють їх з ринку. Як наслідок, все багатство місцевості зосереджується в руках кількох магнатів, а невдоволення місцевих жителів зростає..."
  town_rights_events.12.a: "[target_character.GetShortNameWithNoTooltip] — світило нашого ткацтва!"
  town_rights_events.12.b: "Монополія має свої плюси."
  town_rights_events.12.c: "Нехай місцеві підприємці розбираються самі."
  ruler_regent_finds_good_middle_ground_tt: "Завдяки своєму величезному впливу [target_character.GetName] [Select_CString(target_character.IsFemale, 'зуміла', 'зумів')] знайти компроміс із місцевими виробниками"
  local_textile_barons_are_unhappy_tt: "#italic [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], зайнят[ROOT.GetCountry.Custom('nobles_yiaei')] виробництвом текстилю, мож[ROOT.GetCountry.Custom('nobles_eut')] обуритися подібними змінами#!"
  destabilization_spreads_across_the_country: "#italic Розбіжності між підприємцями лише поглиблюються, що призводить до зростання нестабільності [ROOT.GetCountry.Custom('preposition_uv')] [ROOT.GetCountry.Custom('rank_ua_PREP')|l]#!"
  town_rights_events.13.title: "Майстерна зброя з [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  town_rights_events.13.desc: "Завдяки [ROOT.GetCountry.GetGovernment.GetAdjective|l]им привілеям майстри [target_location.Custom('LR_GEN')|l] [target_location.GetName] почали випускати високоякісну #TOOLTIP:GOODS,weaponry,X #L зброю#!#!, яка швидко здобула славу серед місцевого вояцтва. Надійність та бойові характеристики цих клинків перевершують усі стандарти, тому багато піхотинців буквально мріють ними обзавестися. Безсумнівно, такі добротні вироби — результат наших давніх ремісничих традицій та сумлінного ставлення до роботи."
  town_rights_events.13.a: "Така якість має стати стандартом для нашого війська."
  town_rights_events.13.b: "Ця зброя допоможе нам розширити набір вояків у провінції."
  town_rights_events.13.c: "Наші офіцери могли б повчитися старанності у цих майстрів."
  town_rights_events.14.title: "Зброя з [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip] створює проблеми"
  town_rights_events.14.desc: "Різке збільшення кількості #TOOLTIP:GOODS,weaponry,X #L зброї#!#! в околицях [target_location.Custom('LR_GEN')|l] [target_location.GetName] призвело до поганих наслідків. Тепер місцеві лиходії та злочинці поголовно озброюються і все частіше чинять безчинства. Привілеї, які колись були даровані [target_location.Custom('LR_DAT')|l] задля зміцнення [ROOT.GetCountry.Custom('rank_ua_GEN')|l], зрештою лише примножують беззаконня. Воістину, це вельми прикре видовище..."
  town_rights_events.14.a: "[target_character.GetShortNameWithNoTooltip] відновить тут порядок."
  town_rights_events.14.b: "Спробуємо придушити осередки заворушень."
  town_rights_events.14.c: "Грубою силою можна вирішити будь-яку проблему."
  kind_martial_nature_of_ruler_helps_tt: "Завдяки своїй військовій виучці та суворому норову [target_character.GetName] допомагає розібратися зі смутьянами"
  town_rights_events.15.title: "Оплот знань у [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
  town_rights_events.15.desc: "Вчені та торговці книгами перетворили #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_ACC')|l]#!#! [target_location.GetName] на центр знань та науки. Тутешні майстерні одна за одною публікують тексти, які потім поширюються по всій країні. Подібний обмін знаннями не лише приносить провінції значний дохід, а й підвищує освіченість місцевих жителів."
  town_rights_events.15.a: "Поширення знань допоможе прискорити розвиток нашої країни."
  town_rights_events.15.b: "Нехай усі знають, що тут зосереджені наші знання."
  town_rights_events.15.c: "[target_character.GetShortNameWithNoTooltip] може багато чого почерпнути з цих книг."
  town_rights_events.16.title: "Скандальні книги з [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  town_rights_events.16.desc: "Книги служать нам важливим джерелом мудрості та знань, але далеко не всі з них нешкідливі. Так, деякі тексти, що поширюються в [target_location.Custom('LR_PREP')|l] [target_location.GetName], викликають палкі суперечки серед вчених та простих читачів. Одні хвалять авторів за сміливі погляди, інші засуджують їх і вважають подібні роботи вкрай неприємними та навіть небезпечними. В результаті навіть найбезневинніші на перший погляд книги створюють проблеми для нашого уряду."
  town_rights_events.16.a: "Нас не цікавлять ці порожні суперечки."
  town_rights_events.16.b: "Грамотна людина і не повинна бути байдужою до такого роду текстів."
  town_rights_events.16.c: "Перешкодимо поширенню цих книг за будь-яку ціну."
  pops_in_target_province_mild_penalty_according_to_literacy_tt: "[Concept('pops', 'Групи населення')|e] у провінції [target_province.GetName] втратять частину [Concept('pop_satisfaction', 'вдоволення')|e] залежно від свого рівня [Concept('literacy', 'грамотності')|e]"
  town_rights_events.17.title: "Вправні ремісники [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  town_rights_events.17.desc: "Ремісники з [target_location.Custom('LR_GEN')|l] [target_location.GetName] здобули велику відомість як серед місцевих жителів, так і за межами провінції. Їхні високоякісні вироби не лише несуть практичну користь, а й тішать око своїм привабливим виглядом. Така старанна праця безперечно заслуговує на увагу з боку уряду [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  town_rights_events.17.a: "Ми повинні заохочувати таку якість в усьому."
  town_rights_events.17.b: "Їхній рівень має стати взірцем для інших."
  town_rights_events.17.c: "Слава цих майстрів підносить нашу країну."
  town_rights_events.18.title: "Майстри [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip] старіють"
  town_rights_events.18.desc: "Багато досвідчених ремісників з #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#! [target_location.GetName] вже постаріли й відійшли від справ, а учні, що приходять їм на зміну, поки не можуть похвалитися такими ж сильними навичками та бездоганною репутацією. Якщо ми найближчим часом не залучимо до країни талановитих ремісників, дохід від наших майстерень помітно знизиться."
  town_rights_events.18.a: "Виділимо кошти на залучення мігрантів."
  town_rights_events.18.b: "Наша скарбниця витримає ці втрати."
  town_rights_events.18.c: "Жителям провінції доведеться змиритися зі спадом."
  town_rights_events.19.title: "Створення броварних стандартів у [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
  town_rights_events.19.desc: "Броварі #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#! [target_location.GetName] узгодили та затвердили суворі правила виробництва, зберігання та продажу місцевого пива. Тепер відвідувачі шинків вкрай схвально відгукуються про якість пінного напою, а купці задовольняються його справними поставками. Завдяки грамотному підходу ремісники не лише принесли відомість [target_location.Custom('LR_ACC')|l], а й зробили свій внесок у порядок та процвітання навколишніх земель."
  town_rights_events.19.a: "Впровадимо ці стандарти на всіх броварнях [target_location.Custom('LR_GEN')|l]."
  town_rights_events.19.b: "Ці успіхи безсумнівно посприяють розвитку [ROOT.GetCountry.Custom('rank_ua_ACC')|l]"
  town_rights_events.19.c: "Наші [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] високо оцінять ці досягнення."
  town_rights_events.20.title: "Броварні [target_location.Custom('LR_GEN)|l] [target_location.GetNameWithNoTooltip] виснажують запаси збіжжя"
  town_rights_events.20.desc: "Нам стало відомо, що броварні [target_location.Custom('LR_GEN)|l] [target_location.GetNameWithNoTooltip] споживають занадто багато збіжжя. Місцеві жителі скаржаться на порожні комори та побоюються, що запаси харчів просто розтрачуються на догоду підприємцям. При цьому людей хвилює не стільки торгівля, скільки неправильна розстановка пріоритетів з боку уряду."
  town_rights_events.20.a: "Спробуємо заповнити нестачу, доки вона не призвела до голоду."
  town_rights_events.20.b: "Нехай скаржаться. Торгові інтереси важливіші."
  town_rights_events.20.c: "Таким невмілим керівництвом [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')|l] накликають ганьбу і на себе, і на всю нашу країну."
  town_rights_events.21.title: "Нові методи мурування в [target_location.Custom('LR_PREP)|l] [target_location.GetNameWithNoTooltip]"
  town_rights_events.21.desc: "Будівельники та каменярі з [target_location.Custom('LR_GEN)|l] [target_location.GetName] представили покращену техніку #TOOLTIP:GOODS,masonry,X #L кам’яної кладки#!#!. Завдяки їхнім напрацюванням наші споруди стануть помітно міцнішими, терміни будівництва скоротяться, а провінція [target_province.GetName] незабаром перетвориться за рахунок нових кам’яних будівель. Можливо, саме із застосування цих технологій почнеться нова доба для нашої архітектури."
  town_rights_events.21.a: "Впровадимо ці методи на всіх будівництвах [ROOT.GetCountry.Custom('rank_ua_GEN')|l]."
  town_rights_events.21.b: "Нехай провінція [target_province.GetNameWithNoTooltip] стане центром нашого зодчества."
  town_rights_events.21.c: "Вкладемо кошти в подальший розвиток #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#!."
  town_rights_events.22.title: "Складнощі з видобутком каменю в [target_location.Custom('LR_PREP)|l] [target_location.GetNameWithNoTooltip]"
  town_rights_events.22.desc: "Видобуток #TOOLTIP:GOODS,stone,X каменю#!, яким вимощені наші міста, — найважча праця. Це викликає складнощі з роботою на кам’яних кар’єрах поблизу [target_location.Custom('LR_GEN)|l] [target_location.GetName]: гірники часто працюють до знемоги, і такі важкі умови праці очікувано викликають у них невдоволення. Видобуток поки триває, проте скарги працівників вже складно ігнорувати. Якщо нічого не вжити, незабаром каменоломні можуть просто припинити роботу."
  town_rights_events.22.a: "Полегшимо умови праці та дозволимо гірникам працювати позмінно."
  town_rights_events.22.b: "Не звертатимемо уваги на скарги."
  town_rights_events.22.c: "Всі жителі провінції повинні розділити цей тягар."
  relief_effort_reduces_strain_on_the_workforce_tt: "Виділені [Concept('gold', 'кошти')|e] дозволять тимчасово знизити навантаження на робітників"