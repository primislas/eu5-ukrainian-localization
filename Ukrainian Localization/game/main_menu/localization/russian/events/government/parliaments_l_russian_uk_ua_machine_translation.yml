l_russian:
  parliaments.1.title: "[target_city.GetRank.GetNameWithNoTooltip] вимагає представництва у [ROOT.GetCountry.Custom('parliament_ua_PREP')|l]"
  parliaments.1.desc: "[target_city.GetName] неухильно зростає та процвітає, і місцеві жителі відчувають розчарування у зв'язку з тим, що [ROOT.GetCountry.GetGovernment.GetParliament.GetName|l] засідає не тут. Представники [target_city.Custom('LR_GEN')|l] вимагають відшкодування та гарантій, що в майбутньому їхніми інтересами не нехтуватимуть. Вони пригрозили виходом у разі невиконання їхніх вимог."
  parliaments.1.a: "Підемо їм назустріч!"
  parliaments.1.b: "Відмовити їм."
  parliaments.2.title: "Гнилі містечка"
  parliaments.2.desc: "Оскільки [ROOT.GetCountry.GetGovernment.GetParliament.GetName|l] і [target_location.GetName] тісно пов'язані між собою, це місце має особливий вплив на політику нашої країни. Це викликає заздрість у жителів [envious.Custom('LR_GEN')|l] [envious.GetName], які вважають, що [ShowBuildingTypeName('urban_parliament_seat')|l] і всі супутні привілеї повинні дістатися їхнім [envious.Custom('LR_DAT')|l]. У цьому є певний сенс, але якщо [target_location.GetNameWithNoTooltip] втратить столичне положення, наш[ROOT.GetCountry.Custom('nobles_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] вважатим[ROOT.GetCountry.Custom('nobles_eut')] це жахливою образою."
  parliaments.2.a: "Це можна розцінювати як завгодно, але [target_location.GetNameWithNoTooltip] має право це вимагати!"
  parliaments.2.b: "Нам потрібно перерозподілити місця."
  parliaments.3.desc_generic: "[target_location.GetRank.GetName] [target_location.GetName] відіграє важливу роль у діяльності [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. Крім того, тут розташовано кілька впливових компаній, зацікавлених у торгівлі з чужоземцями."
  parliaments.3.title: "Економічна міць [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  parliaments.3.desc: "$parliaments.3.desc_generic$ Схоже, багато хто з них вважає, що схвалення обговорюваного питання не принесе їм жодної вигоди, тому вони вирішили чинити тиск на членів [ROOT.GetCountry.Custom('parliament_ua_GEN')|l], щоб ті проголосували потрібним чином."
  parliaments.3.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
  parliaments.3.b: "Якщо їм потрібні гроші, вони їх отримають."
  parliaments.4.title: "Підкуп при голосуванні"
  parliaments.4.desc: "Члени [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] починають засідання, але представники гнилих містечок у [target_location.Custom('LR_PREP')|l] [target_location.GetName] вирішили проголосувати проти нашої ініціативи. Схоже, землевласник, який контролює цю область, переконав представників виступити проти невигідного йому рішення."
  parliaments.4.a: "Не пощастило!"
  parliaments.4.b: "Тоді підкупимо землевласника."
  parliaments.5.title: "[target_location.GetRank.GetNameWithNoTooltip] [target_location.GetNameWithNoTooltip] виграє дебати"
  parliaments.5.desc: "Впливовий #TOOLTIP:BUILDING_TYPE,university,X #L університет#!#! [target_location.Custom('LR_GEN')|l] [target_location.GetName] домігся того, що на засіданні [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! було вирішено збільшити університетське фінансування."
  parliaments.5.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  parliaments.5.b: "Нехай не відволікаються від своїх досліджень."
  parliaments.6.desc: "$parliaments.3.desc_generic$ Схоже, багато хто з них вважає, що схвалення обговорюваного питання буде вельми вигідним для них, тому вони вирішили чинити тиск на членів [ROOT.GetCountry.Custom('parliament_ua_GEN')|l], щоб ті проголосували потрібним чином."
  parliaments.6.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  parliaments.7.title: "Військова підтримка в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
  parliaments.7.desc: "Багато в чому військо — найвпливовіша сила в [target_location.Custom('LR_PREP')|l] [target_location.GetName]. Члени [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] — як вихідці з війська, так і ті, що просто зберігають їй вірність — піддалися переконанню і вирішили проголосувати на користь обговорюваної пропозиції."
  parliaments.7.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  parliaments.7.b: "Нам достатньо їхньої підтримки."
  parliaments.8.title: "Вплив [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  parliaments.8.desc: "Члени [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] обговорюють, як краще захистити місцевих виробників. Суперечка привернула увагу багатьох жителів [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Представники цього поселення вирішили стати на наш бік, сподіваючись отримати вигоду від пропонованого рішення."
  parliaments.8.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  parliaments.8.b: "Ми вкладемо кошти в [target_location.Custom('LR_ACC')|l] [target_location.GetNameWithNoTooltip] незалежно від результату."
  parliaments.9.title: "Влада [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  parliaments.9.desc: "Наше столичне місто [target_location.GetName] отримає велику вигоду від пропонованих реформ. На щастя, багато хто зрозумів це, і тепер його представники проголосують на нашу користь."
  parliaments.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  parliaments.10.title: "[target_location.GetRank.GetNameWithNoTooltip] [target_location.GetNameWithNoTooltip] змінює позицію на дебатах!"
  parliaments.10.desc: "Схоже, представники [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] з [target_location.Custom('LR_GEN')|l] [target_location.GetName] зрозуміли, що в разі прийняття обговорювана ініціатива принесе їм велику вигоду. Ми будемо тільки раді, якщо вони підтримають нашу ідею."
  parliaments.10.desc_b: "Схоже, представники [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] з [target_location.Custom('LR_GEN')|l] [target_location.GetName] зрозуміли, що в разі прийняття обговорювана ініціатива створить їм великі проблеми. Їхня підтримка дасть велику перевагу нашим противникам."
  parliaments.10.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  parliaments.11.desc: "Схоже, представники [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] з [target_location.Custom('LR_GEN')|l] [target_location.GetName], які зовсім недавно гаряче підтримували нашу ідею, кардинально змінили свою думку щодо обговорюваного питання. Нам невідомо, чому вони передумали, але ясно одне: ми більше не можемо розраховувати на їхній голос."
  parliaments.11.a: "Можливо, їх охопила жадібність…"
  parliaments.12.title: "Відмова від підтримки простолюду"
  parliaments.12.desc: "Хоча наш[ROOT.GetCountry.Custom('peasants_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] ма[ROOT.GetCountry.Custom('peasants_yeyut')] право подавати прохання до [ROOT.GetCountry.Custom('parliament_ua_GEN')|l], це не дає їм такої влади над цією установою, яка є в інших станів. У ході недавніх дискусій стало ясно, що простолюд #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! фактично безправний порівняно з представниками вищих станів. Ті ж, своєю чергою, виступають проти пропозиції, яку висуну[ROOT.GetCountry.Custom('peasants_vlaloly')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')|l]."
  parliaments.12.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
  parliaments.12.b: "Жахлива несправедливість!"
  parliaments.13.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] вигра[ROOT.GetCountry.Custom('peasants_yeyut')] дебати"
  parliaments.13.desc: "У ході поточних дебатів рішуче налаштован[ROOT.GetCountry.Custom('peasants_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] зумі[ROOT.GetCountry.Custom('peasants_vlaloly')] схилити [ROOT.GetCountry.Custom('parliament_ua_ACC')|l] на свій бік. Хоч вони й не шляхетного походження, країна готова вислухати їх як рівних."
  parliaments.13.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  parliaments.13.b: "Вимоги народу будуть почуті."
  parliaments.14.desc_common: "Делегати з [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip] мають особливу вагу в [ROOT.GetCountry.Custom('parliament_ua_PREP')|l], оскільки представляють інтереси одного з найважливіших економічних центрів."
  parliaments.14.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] з [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  parliaments.14.desc: "$parliaments.14.desc_common$ За рахунок своїх капіталів вони можуть відчутно впливати на рішення [ROOT.GetCountry.Custom('parliament_ua_GEN')|l], але, на щастя, прийняття обговорюваної ініціативи вельми вигідне для них, тому в цьому випадку їхні гроші виступають на нашому боці."
  parliaments.14.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  parliaments.15.title: "[target_location.GetNameWithNoTooltip]: важкий тягар"
  parliaments.15.desc: "Багато жителів [target_location.Custom('LR_GEN')|l] [target_location.GetName] засмучені пропозицією збільшити фінансування флоту. Передавши значні кошти на утримання війська, вони сподівалися, що [ROOT.GetCountry.GetGovernment.GetParliament.GetName|l] почне виділяти більше грошей на їхні власні потреби замість того, щоб влаштовувати нові побори."
  parliaments.15.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
  parliaments.15.a.tt: "Наші [Concept('pops', 'громади')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] отримують [ShowNamedValue('pop_satisfaction_weak_penalty')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  parliaments.16.title: "Панування на морі в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
  parliaments.16.desc: "Члени [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] пропонують збільшити витрати на військо, але в [target_location.Custom('LR_PREP')|l] [target_location.GetName] вельми великий вплив флоту, тому жителі досить холодно сприйняли цю ідею. Місцеві представники [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] спочатку підтримали пропозицію, але тепер у них немає іншого вибору, окрім як проголосувати проти."
  parliaments.16.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
  parliaments.17.desc_common: "Оскільки жителі [target_location.Custom('LR_GEN')|l] [target_location.GetName] дотримуються іншої віри, у [ROOT.GetCountry.Custom('parliament_ua_PREP')|l] їх часто звинувачують у тому, що вони переслідують інтереси своєї віри на шкоду нашій."
  parliaments.17.title: "Віра [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  parliaments.17.desc_tolerance: "$parliaments.17.desc_common$ Втім, зазвичай подібні звинувачення викликають лише сміх: більшість членів [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] цінують вірних слуг країни, навіть якщо ті є іновірцями."
  parliaments.17.desc_intolerance: "$parliaments.17.desc_common$ Ці жахливі звинувачення завдають шкоди репутації [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip] та підтримці питання, яке зараз обговорюють у [ROOT.GetCountry.Custom('parliament_ua_PREP')|l]."
  parliaments.17.a: "Так вирішив [ROOT.GetCountry.GetReligion.GetGodName]."
  parliaments.18.title: "Очікування [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  parliaments.18.desc: "На наше здивування, представники [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] з [target_location.Custom('LR_GEN')|l] [target_location.GetName] підтримали нашу пропозицію під час обговорень на зборах. Ідея передбачає проведення певних розрахунків та вимірювань, і університет у [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip] планує взяти в них участь. Вчені раді можливості збирати та досліджувати нові дані, що стосуються нашої країни."
  parliaments.18.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
  parliaments.19.title: "[target_character.GetNameWithNoTooltip] втрачає довіру"
  parliaments.19.desc: "Коли дебати в [ROOT.GetCountry.Custom('parliament_ua_PREP')|l] торкнулися такої теми, як [ROOT.GetCountry.GetGovernment.GetCabinetTitle|l], нам стало відомо про серйозну помилку, яку [Select_CString(target_character.IsFemale, 'допустила', 'допустив' )] [target_character.GetName]. Останнім часом [Select_CString(target_character.IsFemale, 'вона стала', 'він став' )] погано справлятися зі своїми обов'язками, тому нам варто задуматися про те, щоб знайти [Select_CString(target_character.IsFemale, 'їй', 'йому' )] гідну заміну."
  parliaments.19.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
  parliaments.20.title: "Життя в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
  parliaments.20.desc: "Більшість членів [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] живуть далеко від міста [ROOT.GetCountry.GetCapital.GetName]. Відвідуючи столицю, багато хто з них усвідомлює, що життя тут сильно відрізняється від звичного їм укладу. Деякі тільки раді повернутися додому, вважаючи столичний побут досить дивним і неприємним.\n\nЦей рік приніс ще важчі випробування для зніжених натур: тепла пора видалася вкрай спекотною, сезон дощів приніс занадто багато опадів, а холоди виявилися набагато сильнішими, ніж зазвичай. Деякі представники з регіонів вирішили, що з них досить, і звернулися до нас з проханням покращити умови їхнього життя в столиці."
  parliaments.20.a: "Ми зробимо все, що можемо."
  parliaments.20.b: "Нехай терплять, як і всі інші."
  parliaments.21.title: "Члени [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] замішані в скандалі"
  parliaments.21.desc: "Під час останнього обговорення нових законів у місті [ROOT.GetCountry.GetCapital.GetName] стався невеликий скандал. Виявляється, що окремі члени [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] замість участі в засіданнях воліють порушувати громадський порядок і задирати містян. Їхні вчинки обурили як інших делегатів, так і простий люд. Швидше за все, цей випадок на довгі роки підірве авторитет зборів."
  parliaments.21.a: "$common_string_let_it_slide$"
  parliaments.21.b: "Заарештувати недбайливих учасників [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]."
  parliaments.22.title: "Абсентеїзм"
  parliaments.22.desc: "Рішення, що приймаються членами [ROOT.GetCountry.Custom('parliament_ua_GEN')|l], сильно впливають на політику нашої країни, тому всі представники повинні справно відвідувати засідання, намагаючись використовувати довірені їм повноваження на благо країни. Однак на практиці ситуація далека від ідеалу: деякі з них нехтують засіданнями, воліючи залишатися у своїх заміських маєтках або віддаватися столичним розвагам. Останнім часом таких стає все більше, і ми турбуємося, що іноземні сановники потай сміються над нами. Ми можемо підвищити відвідуваність, штрафуючи відсутніх членів [ROOT.GetCountry.Custom('parliament_ua_GEN')|l], хоча це однозначно викличе їхнє невдоволення."
  parliaments.22.a: "Покараємо найзлісніших прогульників."
  parliaments.22.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
  parliaments.23.title: "Вимога про представництво"
  parliaments.23.desc: "У містах #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! починають поширюватися ворожі публікації, в яких якісь анонімні автори кидаються необґрунтованими звинуваченнями на адресу нашої країни. Зокрема, вони принизливо називають наш уряд автократією і заявляють, що ми зовсім не дбаємо про [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ий народ. Вони вимагають прийняти конституцію і запровадити представницькі збори, в яких будуть представлені інтереси різних верств населення нашої країни."
  parliaments.23.a: "Заборонимо публікації."
  parliaments.23.b: "Дамо розпливчасті обіцянки про реформи."
  parliaments.24.title: "Фінансова допомога"
  parliaments.24.desc: "Схоже, фінансові проблеми нашого уряду та його відчайдушні спроби знайти кошти стали надбанням громадськості. Незважаючи на втрату репутації [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! та за кордоном, це принесло нам певну вигоду, оскільки кілька членів [ROOT.GetCountry.GetGovernment.Custom('parliament_ua_GEN')|l], що представляють [target_location.Custom('LR_ACC')|l] [target_location.GetName], звернулися до нас з пропозицією про допомогу. Взамін вони просять надати їм можливість більш активно брати участь в управлінні країною, а також створити офіційні механізми, які дозволять країні звертатися до них за допомогою в майбутньому."
  parliaments.24.a: "Дамо містам більш помітне представництво."
  parliaments.24.b: "Відмовимося від грошей."
  parliaments.24.c: "Пообіцяємо розглянути їхню пропозицію."
  parliaments.25.desc: "$parliaments.14.desc_common$ Їхні капітали можуть відчутно впливати на рішення [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. На жаль, цього разу вони діятимуть проти нас."
  parliaments.25.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
  parliaments.27.title: "Парламентські традиції"
  parliaments.27.desc: "Одне з найважчих завдань парламентарія — зовсім не столичні дебати, а вміння вигідно піднести нові рішення та компроміси жителям своїх регіонів. Проте переконати людей у необхідності введення нового податку набагато простіше, якщо це робить місцевий депутат, а не збирач податей, присланий зі столиці.\n\nСхоже, наші члени [ROOT.GetCountry.Custom('parliament_ua_GEN')|l], особливо з [target_location.Custom('LR_GEN')|l] [target_location.GetName], вельми досягли успіху у виправданні політики країни, оскільки останнім часом народна підтримка центрального уряду помітно зросла."
  parliaments.27.a: "Нарешті мене розуміють!"
  parliaments.26.title: "Зговірливість [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]"
  parliaments.26.desc: "Останнім часом учасники [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] особливо зговірливі. Ми можемо скористатися цим, щоб змінити їхні думки на свою користь або вилучити частину регіональних ресурсів для власних цілей."
  parliaments.26.a: "Їхні думки становлять для нас особливу важливість."
  parliaments.26.b: "Нам потрібна тверда валюта!"
  parliaments.28.title: "Зібрання незгодних"
  parliaments.28.desc: "Сьогодні в місті [ROOT.GetCountry.GetCapital.GetName] було рідкісне та незвичайне видовище: місцеві [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l], [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] та представники інших нижчих і середніх верств суспільства влаштували власну подобу [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. Об'єднані спільним невдоволенням, вони обговорювали питання «[target_debate.GetName]», вимагаючи змін, на які [target_character.GetName] не піде за жодних умов. Багато «делегатів», розлючені панівна верствою, відмовляються миритися з поточним станом справ і відкрито виступають проти рішень, які [Select_CString(target_character.IsFemale, 'ухвалила', 'ухвалив' )] [target_character.GetShortNameWithNoTooltip]."
  parliaments.28.a: "Наші батоги вже не справляються!"
  parliaments.29.title: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] та їхні привілеї"
  parliaments.29.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] пода[ROOT.GetCountry.Custom('burghers_vlaloly')] членам [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] офіційну скаргу, і їхнє невдоволення легко зрозуміти. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] ма[ROOT.GetCountry.Custom('nobles_yeyut')] виняткову владу, а купці, що приносять #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! левову частку прибутку, можуть лише мріяти про такий вплив. Якщо пустити ситуацію на самоплив, купці можуть збунтуватися. Як ми вчинимо? Підтримаємо старих союзників чи тих, хто поповнює нашу скарбницю?"
  parliaments.29.a: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] завжди служи[ROOT.GetCountry.Custom('nobles_vlaloly')] нам вірою і правдою."
  parliaments.29.b: "Вислухаємо претензії купців."
  parliaments.30.title: "Питання віри в [ROOT.GetCountry.Custom('parliament_ua_PREP')|l]"
  parliaments.30.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] пропону[ROOT.GetCountry.Custom('clergy_yeyut')] нам відволіктися від мирських проблем і звернути погляд на іновірців, що населяють #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#!. Вони щиро не розуміють, як представники [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] можуть обговорювати лише збори та дороги, поки стільки душ блукає в темряві. Аргументи духовенства важко спростувати. Як нам вчинити? Дозволимо священникам очолити засідання чи натякнемо, що їм не завадило б стримати свої амбіції?"
  parliaments.30.a: "Немає нічого важливішого за віру."
  parliaments.30.b: "Відкладемо духовні питання на потім."
  parliaments.31.title: "Голоси знедолених"
  parliaments.31.desc: "Депутати [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] отримали товсту пачку петицій зі скаргами від найбільш пригнобленого стану #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] майже позбавлен[ROOT.GetCountry.Custom('peasants_yiaei')] впливу, але це не означає, що їхнє невдоволення можна проігнорувати. Якщо ми пустимо ситуацію на самоплив, вони можуть підняти бунт, і тоді буде нам непереливки. Якщо ж ми відповімо на їхні благання, то підживимо політичні сили, які використовують селян як зброю для боротьби."
  parliaments.31.a: "Їхні скарги заслуговують нашої уваги."
  parliaments.31.b: "Потрібно підтримувати лад."
  parliaments.32.title: "Монастирська торгівля"
  parliaments.32.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] у люті. Монастирські майстерні та церковні торгові доми раз у раз знижують ціни. Чесні купці не можуть дозволити собі такої розкоші, адже їм потрібно платити податки. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], зрозуміло, задоволен[ROOT.GetCountry.Custom('clergy_yiaei')] нинішнім станом справ. І ті, й інші хочуть, щоб ми їх вислухали, але догодити всім не вийде. Щоб вирішити цю суперечку, доведеться стати на чийсь бік."
  parliaments.32.a: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] кажуть слушне."
  parliaments.32.b: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] служ[ROOT.GetCountry.Custom('clergy_yeyut')] високій меті."
  parliaments.32.c: "У нас не буде улюбленців."
  parliaments.33.title: "Куди поділися всі гроші?"
  parliaments.33.desc: "На засіданні [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] та [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] поставили питання, на яке нам зовсім не хочеться відповідати. Вони цікавляться, як ми примудрилися накопичити стільки боргів. Ми й справді знатно витратилися, і позикодавці вже втрачають терпіння. Як нам вчинити? Збрехати, щоб виправдати себе, або ж дати обіцянки, які важко виконати? Простих рішень тут немає."
  parliaments.33.a: "Усі гроші йшли на потреби #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!."
  parliaments.33.b: "Доведеться тугіше затягнути паски."
  parliaments.34.title: "Право на представника"
  parliaments.34.desc: "Не всі учасники [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] можуть бути присутніми на засіданнях особисто. Війни, пошесті та великі відстані між #L [ROOT.GetCountry.GetAdjective|l]ими#! маєтками ніхто не скасовував. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] попроси[ROOT.GetCountry.Custom('nobles_vlaloly')] дозволу відправляти замість себе представників із повним правом голосу. Їм це рішення здається розумним, але ми бачимо все інакше. Збори, що складаються з довірених осіб, складніше схилити до своєї точки зору, ніж справжніх депутатів. Зараз нам належить вирішити долю [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]."
  parliaments.34.a: "Дозволимо дворянам надсилати представників."
  parliaments.34.b: "Депутати повинні голосувати особисто."
  parliaments.35.title: "Рідкісна одностайність"
  parliaments.35.desc: "На недавніх засіданнях [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] сталася небувала річ: [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] та [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] нарешті знайшли спільну мову і висунули спільну пропозицію. Така одностайність не може не тішити. Не скористатися ситуацією було б нерозумно, але спершу краще дізнатися, які мотиви ними керують і що вони хочуть отримати натомість."
  parliaments.35.a: "Єдність — це благо для #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!."
  parliaments.35.b: "Тут є якийсь підступ."
  parliaments.36.title: "Ціна війни"
  parliaments.36.desc: "Представники [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] працюють на знос. Їхні столи завалені петиціями від родин вояків та збанкрутілих купців, а також духовенства, якому доводиться освячувати надто багато могил. Народу полягло безліч, а перемоги не видно. Навіть ті, хто найгучніше радів війні, бліднуть разом з усіма, коли беруться рахувати видатки. Як нам вчинити? Обіцяти швидку перемогу чи визнати, що ціна цієї війни надто висока? У будь-якому разі ми більше не можемо ігнорувати подібні настрої на зборах."
  parliaments.36.a: "Перемога виправдає всі жертви."
  parliaments.36.b: "Настав час припинити страждання народу."
  parliaments.37.title: "Втручання [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] у війну"
  parliaments.37.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] чітко окресли[ROOT.GetCountry.Custom('nobles_vlaloly')] свою позицію: ворог не дрімає, а військо #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! не може довше чекати. Вони вимагають, щоб депутати [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] оголосили терміновий збір ополчення. Можливо, вони й піддалися паніці, але правда в тому, що війна вимагає негайних рішень. Нам треба визначитися, як далеко ми готові зайти і чиї сини відгукнуться на заклик до зброї."
  parliaments.37.a: "Проведемо терміновий збір."
  parliaments.37.b: "Ми не будемо примушувати людей до служби."
  parliaments.38.title: "Забуті герої"
  parliaments.38.desc: "Вони билися під нашим стягом, проливали кров за батьківщину, а тепер, коли вони повернулися додому, країна їх фактично кинула напризволяще. Ветерани останньої кампанії звернулися до [ROOT.GetCountry.Custom('parliament_ua_DAT')|l] з проханням визнати їхні заслуги та дарувати їм землю або гроші. Та що там, вони зрадіють навіть простій подяці. Ці почесті не розорять скарбницю, а ось мовчання з нашого боку може спричинити чимало проблем."
  parliaments.38.a: "Дамо їм землі."
  parliaments.38.b: "Виплатимо їм винагороду."
  parliaments.38.c: "Служба батьківщині — і так найбільший дар."
  parliaments.39.title: "Вовки на кордоні"
  parliaments.39.desc: "Наші сусіди не приховують своїх намірів. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] повідоми[ROOT.GetCountry.Custom('nobles_vlaloly')] [ROOT.GetCountry.Custom('parliament_ua_ACC')|l] про провокації на кордоні: пересування військ та пропущені дипломатичні знаки. Ми знаємо, що такі вистави нічим добрим не закінчуються. Як нам вчинити? Вкласти кошти в оборону, поки ще є час, або спробувати розв’язати конфлікт мирним шляхом?"
  parliaments.39.a: "Укріпимо кордони."
  parliaments.39.b: "Спершу відрядимо послів."
  parliaments.40.title: "Голодні не можуть чекати"
  parliaments.40.desc: "Ми отримали купу звернень, написаних без будь-яких натяків. Так зазвичай чинять люди, чиї ввічливі прохання залишилися без відповіді. Комори порожні. Діти голодують. [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] винос[ROOT.GetCountry.Custom('peasants_ytyat')] це питання на розгляд [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] не тому, що вони вірять гарним промовам, а тому що їм більше нікуди йти. Ми не можемо обговорювати цю тему вічно. Потрібно щось зробити, і якомога швидше."
  parliaments.40.a: "Негайно закупимо запаси хліба."
  parliaments.40.b: "Дозволимо чужоземцям продавати харчі на наших ринках."
  parliaments.40.c: "Ситуація на ринках виправиться сама собою."
  parliaments.41.title: "Стрімке знецінення грошей"
  parliaments.41.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] б’[ROOT.GetCountry.Custom('burghers_yeyut')] на сполох і, схоже, не дарма. Ціни зростають шаленими темпами, вміст нашої скарбниці знецінюється щодня. Треба щось робити, інакше купецьку верству, яка забезпечує платоспроможність #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, чекає сумна доля. На жаль, одразу всім не догодиш. Доведеться обирати з двох лих."
  parliaments.41.a: "Введемо заходи жорсткої економії."
  parliaments.41.b: "Нехай усі дізнаються, хто винен у цьому."
  parliaments.41.c: "Спершу ми повинні погасити борги."
  parliaments.42.title: "Два міста, один ринок"
  parliaments.42.desc: "До членів [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] звернулися жителі двох міст. Суперечка про те, яке з них отримає широкі торгові привілеї [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!, загрожує затягнутися і перерости в скандал. У нас два варіанти: або надати одному з міст виняткові права, або відкрити ринок і дозволити конкуренції зробити те, що так рідко вдається зборам, — вирішити проблему остаточно."
  parliaments.42.a: "Дамо привілеї одному місту."
  parliaments.42.b: "Нехай змагаються одне з одним."
  parliaments.43.title: "Боргове навантаження #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!"
  parliaments.43.desc: "Бухгалтерська книга — не найприємніший документ для читання. Ми заборгували більше, ніж очікували, і позикодавці вже втрачають терпіння. Щоб розглянути це питання, ми скликали екстрене засідання [ROOT.GetCountry.Custom('parliament_ua_GEN')|l], але депутати не змогли дійти згоди. Вони висловили три пропозиції, які суперечать одна одній. Потрібно обрати одну з них."
  parliaments.43.a: "Реструктуруємо борги."
  parliaments.43.b: "Покриємо борги, підвищивши податки."
  parliaments.43.c: "Продамо щось цінне."
  parliaments.44.title: "Нарешті добрі новини"
  parliaments.44.desc: "Це засідання [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] виявилося напрочуд приємним. У королівстві панує стабільність, скарбниця повна, а наш народ на якийсь час втихомирився. Депутати висунули кілька пропозицій, як краще скористатися таким везінням. Цього разу дебати проходять цілком спокійно. Не можна проминути такої нагоди."
  parliaments.44.a: "Треба подумати про майбутнє."
  parliaments.44.b: "Віддамо частину багатств підданим."
  parliaments.44.c: "Почнемо готуватися до прийдешньої війни."
  parliaments.45.title: "Єретики у палацових залах"
  parliaments.45.desc: "Нові релігійні ідеї, схоже, проникли в будівлю [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] у сказі. Хтось поширює серед населення реформістські брошури, люди на взводі, а минулого тижня представники взагалі ледь не побилися. Скоро богословська суперечка переросте у відкрите протистояння. Поки цього не сталося, ми повинні чітко позначити свою позицію."
  parliaments.45.a: "Представники — захисники істинної віри."
  parliaments.45.b: "У зборах усі голоси мають значення."
  parliaments.46.title: "Хто на світі найщедріший?"
  parliaments.46.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] і [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] змагаються за звання головних покровителів мистецтва. Їхня суперечка про те, хто більше зробив для #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, здається кумедною, доки не згадаєш, що вона триває вже два засідання [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. Настав час оголосити переможця."
  parliaments.46.a: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] — головна рушійна сила культурного відродження."
  parliaments.46.b: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] да[ROOT.GetCountry.Custom('clergy_vlaloly')] поштовх культурному відродженню."
  parliaments.46.c: "І ті, й інші постаралися на славу."
  parliaments.47.title: "Слова небезпечніші за ніж"
  parliaments.47.desc: "Відтоді, як книгодрукування набуло широкого поширення [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!, [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] скарж[ROOT.GetCountry.Custom('clergy_ytat')]ся на брошури, які поширю[ROOT.GetCountry.Custom('burghers_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l]. На засіданні [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] обидві сторони підкріпили свою правоту серйозними доводами. Одна називає свою діяльність просвітництвом, а інша — підбурюванням до заколоту. Чия думка нам ближча?"
  parliaments.47.a: "Завадимо поширенню шкідливих брошур."
  parliaments.47.b: "Нехай друкують що завгодно."
  parliaments.48.title: "Божі землі та селянський плуг"
  parliaments.48.desc: "В одному з сіл з новою силою розгорілися колишні розбіжності. Нещодавно про них стало відомо депутатам [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. Річ у тім, що у цьому поселенні монастирські землі прилягають до селянських полів, і люди ніяк не можуть домовитися, хто повинен їх обробляти. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] посила[ROOT.GetCountry.Custom('clergy_yetsayutsa')] на божественне право, а [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] — на звичаї. Кожна сторона наводить вагомі доводи. Кого ми підтримаємо?"
  parliaments.48.a: "Права духовенства священні."
  parliaments.48.b: "Повернемо спірні землі селянам."
  parliaments.49.title: "Голоси нових підданих"
  parliaments.49.desc: "Люди зі щойно завойованих земель подали петиції членам [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. Вони вимагають прав і політичного представництва. Тримаються вони спокійно та впевнено, але без зарозумілості, що саме собою заслуговує на повагу. Нам потрібно вирішити, чи братимуть вони участь в управлінні країною. Від нашої відповіді залежить, як нові піддані ставитимуться до правлячої верхівки в майбутньому."
  parliaments.49.a: "Надамо їм право голосу на засіданнях [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]."
  parliaments.49.b: "Вони — наші підлеглі. Нехай знають своє місце."
  parliaments.50.title: "Королівство в королівстві"
  parliaments.50.desc: "Великі феодали з провінцій висунули [ROOT.GetCountry.Custom('parliament_ua_DAT')|l] старі вимоги, втілені в нову форму. Вони просять нас запровадити «місцеве самоврядування», тобто по суті перестати втручатися в їхні справи та втратити частину контролю над країною. Ця пропозиція може здатися навіть привабливою, якщо не думати про наслідки, до яких вона може призвести."
  parliaments.50.a: "Нехай правлять своїми землями."
  parliaments.50.b: "Влада [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! належить короні."
  parliaments.51.title: "Заворушення на околицях"
  parliaments.51.desc: "На засіданні [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] зачитали доповідь, яка викликала велику тривогу. Подекуди [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! закони фактично перестали діяти. Урядовці або недолугі, або їх не вистачає, або їх зовсім немає. Найгучніше скарж[ROOT.GetCountry.Custom('peasants_ytat')]ся [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l], що зазвичай вказує на те, що проблема справді існує. Потрібно терміново виправляти ситуацію."
  parliaments.51.a: "Відправимо управителів для наведення ладу."
  parliaments.51.b: "Краще відправимо вояків."
  parliaments.52.title: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName] одразу для двох народів"
  parliaments.52.desc: "Включення нових володінь до складу #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! призвело до того, що членами [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] стали представники інших народів. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] пропону[ROOT.GetCountry.Custom('nobles_yeyut')] асимілювати місцеве населення, а [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] — дозволити йому зберегти свою ідентичність та розвивати торгові зв’язки. Обидва стани переслідують корисливі цілі, але їхні пропозиції не позбавлені здорового глузду. Майбутнє #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! в наших руках."
  parliaments.52.a: "У [ROOT.GetCountry.Custom('CL_GEN')] має бути єдина культура."
  parliaments.52.b: "Відмінності роблять нас сильнішими."
  parliaments.53.title: "[target_character.GetNameWithNoTooltip] під підозрою"
  parliaments.53.desc: "Зазвичай членів [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] рідко тішать звіти, але [target_character.GetName] [Select_CString(target_character.IsFemale, 'надала', 'надав')] документ, до якого неможливо причепитися. Усі цифри там сходяться, розрахунки виглядають правдоподібно. Це саме й насторожує. Подібна ефективність радника може свідчити про його недобропорядність. Чиї інтереси були поставлені на чільне місце, а чиї — ущемлені? Представники [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] вимагають надати повну звітність, і ми повинні вирішити, наскільки серйозною буде перевірка."
  parliaments.53.a: "[Select_CString(target_character.IsFemale, 'Її', 'Його')] заслуги незаперечні."
  parliaments.53.b: "Нехай збори вивчать звітність."
  parliaments.54.title: "Два радники на порядку денному"
  parliaments.54.desc: "Рада перетворилася на поле битви, і це негативно позначилося на роботі [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. [target_character.GetName] та [rival_character.GetName] сперечаються все засідання, намагаючись спихнути один на одного провину за невдачу. Їхні сварки нікого не розважають, окрім них самих та любителів робити ставки. Потрібно якось вирішити цю проблему."
  parliaments.54.a: "[target_character.GetName] отримає нашу підтримку."
  parliaments.54.b: "[rival_character.GetName] отримає нашу підтримку."
  parliaments.54.c: "Звільнимо обох."
  parliaments.55.title: "Хабарництво в обителі закону"
  parliaments.55.desc: "[target_character.GetName] [Select_CString(target_character.IsFemale, 'була викрита', 'був викритий')] в корупції одним із депутатів [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. Звинувачення виглядають правдоподібними, і від них не можна просто так відмахнутися. З іншого боку, вони запросто можуть бути підставними. Обговорювати це питання не має сенсу, адже відповідь залежить від позицій співрозмовників. Ми повинні вирішити, чи варто продовжити розслідування, чи краще відкласти його та висловити несхвалення такому негідному вчинку."
  parliaments.55.a: "Проведемо розслідування."
  parliaments.55.b: "Це просто політична вистава."
  parliaments.56.title: "Суперечка, доведена до абсурду"
  parliaments.56.desc: "Робота [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] застопорилася. Депутати ніяк не можуть вирішити низку процедурних питань: що надійніше — голосування чи поіменний клич, чи можуть представники утримуватися від участі, чи правильно був визначений порядок виступів тощо. Їхній розгляд зайняв три повні засідання, які можна було присвятити справжнім справам. Нам потрібно зібратися з думками й нарешті дати однозначну відповідь."
  parliaments.56.a: "Винесемо рішення самостійно."
  parliaments.56.b: "Нехай самі розсьорбують, що наварили."
  parliaments.57.title: "Порожні лави незадоволених"
  parliaments.57.desc: "Представники одного з найвпливовіших станів вкрай втратили терпіння. Нинішнє становище [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] їх абсолютно не влаштовує. Вони погрожують покинути зал засідань, якщо ситуація не виправиться. Ми не знаємо, чи справді вони так вчинять, чи це просто спосіб домогтися свого, але перевіряти не хочеться: рішення, ухвалені спорожнілими зборами, мало хто сприйме всерйоз."
  parliaments.57.a: "Погодимося на поступки, поки представники не пішли."
  parliaments.57.b: "Нехай тільки насміляться!"
  parliaments.58.title: "Представники [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] сповнені ентузіазму"
  parliaments.58.desc: "Конституційні збори повинні виконувати свою роботу, інакше в них просто немає сенсу. І наші представники не сидять склавши руки. Вони вирішили законодавчо оформити поняття, досі не вписані в конституцію, і зафіксувати прецеденти, з якими надалі доведеться рахуватися. Загалом вони, звісно, праві: такий документ внесе ясність у систему управління #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#!. Проблема в тому, що він також обмежить владу корони. Потрібно вирішити, яким обсягом влади ми готові пожертвувати. Як то кажуть, що написано пером, не вирубаєш сокирою."
  parliaments.58.a: "Випустимо указ."
  parliaments.58.b: "Не можна заганяти в рамки королівську владу."