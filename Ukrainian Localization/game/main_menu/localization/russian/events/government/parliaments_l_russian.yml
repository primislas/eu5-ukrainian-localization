l_russian:
 parliaments.1.title: "[target_city.GetRank.GetNameWithNoTooltip] требует представительства в [ROOT.GetCountry.Custom('parliament_ua_PREP')|l]"
 parliaments.1.desc: "[target_city.GetName] неуклонно растёт и процветает, и местные жители испытывают разочарование в связи с тем, что [ROOT.GetCountry.GetGovernment.GetParliament.GetName|l] заседает не здесь. Представители [target_city.Custom('LR_GEN')|l] требуют возмещения и гарантий, что в будущем их интересами пренебрегать не будут. Они пригрозили выходом в случае невыполнения их требований."
 parliaments.1.a: "Пойдём им навстречу!"
 parliaments.1.b: "Отказать им."
 parliaments.2.title: "Гнилые местечки"
 parliaments.2.desc: "Поскольку [ROOT.GetCountry.GetGovernment.GetParliament.GetName|l] и [target_location.GetName] тесно связаны между собой, это место имеет особое влияние на политику нашей страны. Это вызывает зависть у жителей [envious.Custom('LR_GEN')|l] [envious.GetName], которые считают, что [ShowBuildingTypeName('urban_parliament_seat')|l] и все сопутствующие привилегии должны достаться их [envious.Custom('LR_DAT')|l]. В этом есть определённый смысл, но если [target_location.GetNameWithNoTooltip] утратит столичное положение, наши [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] сочтут это чудовищным оскорблением."
 parliaments.2.a: "Это можно расценивать как угодно, но [target_location.GetNameWithNoTooltip] вправе это требовать!"
 parliaments.2.b: "Нам нужно перераспределить места."
 parliaments.3.desc_generic: "[target_location.GetRank.GetName] [target_location.GetName] играет важную роль в деятельности [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. Кроме того, здесь расположено несколько влиятельных компаний, заинтересованных в торговле с чужеземцами."
 parliaments.3.title: "Экономическая мощь [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
 parliaments.3.desc: "$parliaments.3.desc_generic$ Похоже, многие из них считают, что одобрение обсуждаемого вопроса не принесёт им никакой выгоды, поэтому они решили оказать давление на членов [ROOT.GetCountry.Custom('parliament_ua_GEN')|l], чтобы те проголосовали нужным образом."
 parliaments.3.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.3.b: "Если им нужны деньги, они их получат."
 parliaments.4.title: "Подкуп при голосовании"
 parliaments.4.desc: "Члены [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] начинают заседание, но представители гнилых местечек в [target_location.Custom('LR_PREP')|l] [target_location.GetName] решили проголосовать против нашей инициативы. Похоже, землевладелец, контролирующий эту область, убедил представителей выступить против невыгодного ему решения."
 parliaments.4.a: "Не повезло!"
 parliaments.4.b: "Тогда подкупим землевладельца."
 parliaments.5.title: "[target_location.GetRank.GetNameWithNoTooltip] [target_location.GetNameWithNoTooltip] выигрывает дебаты"
 parliaments.5.desc: "Влиятельный #TOOLTIP:BUILDING_TYPE,university,X #L университет#!#! [target_location.Custom('LR_GEN')|l] [target_location.GetName] добился того, что на заседании [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! было решено увеличить университетское финансирование."
 parliaments.5.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.5.b: "Пусть не отвлекаются от своих исследований."
 parliaments.6.desc: "$parliaments.3.desc_generic$ Похоже, многие из них считают, что одобрение обсуждаемого вопроса будет весьма выгодно для них, поэтому они решили оказать давление на членов [ROOT.GetCountry.Custom('parliament_ua_GEN')|l], чтобы те проголосовали нужным образом."
 parliaments.6.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.7.title: "Военная поддержка в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
 parliaments.7.desc: "Во многих отношениях армия — самая влиятельная сила в [target_location.Custom('LR_PREP')|l] [target_location.GetName]. Члены [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] — как выходцы из армии, так и просто сохраняющие ей верность — поддались убеждению и решили проголосовать в пользу обсуждаемого предложения."
 parliaments.7.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.7.b: "Нам достаточно их поддержки."
 parliaments.8.title: "Влияние [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
 parliaments.8.desc: "Члены [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] обсуждают, как лучше защитить местных производителей. Спор привлёк внимание многих жителей [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Представители этого поселения решили встать на нашу сторону, надеясь получить выгоду от предлагаемого решения."
 parliaments.8.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.8.b: "Мы вложим средства в [target_location.Custom('LR_ACC')|l] [target_location.GetNameWithNoTooltip] независимо от результата."
 parliaments.9.title: "Власть [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
 parliaments.9.desc: "Наш столичный город [target_location.GetName] получит большую выгоду от предлагаемых реформ. К счастью, многие поняли это, и теперь его представители проголосуют в нашу пользу."
 parliaments.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.10.title: "[target_location.GetRank.GetNameWithNoTooltip] [target_location.GetNameWithNoTooltip] меняет позицию на дебатах!"
 parliaments.10.desc: "Похоже, представители [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] из [target_location.Custom('LR_GEN')|l] [target_location.GetName] поняли, что в случае принятия обсуждаемая инициатива принесёт им большую выгоду. Мы будем только рады, если они поддержат нашу идею."
 parliaments.10.desc_b: "Похоже, представители [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] из [target_location.Custom('LR_GEN')|l] [target_location.GetName] поняли, что в случае принятия обсуждаемая инициатива создаст им большие проблемы. Их поддержка даст большое преимущество нашим противникам."
 parliaments.10.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.11.desc: "Похоже, представители [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] из [target_location.Custom('LR_GEN')|l] [target_location.GetName], которые совсем недавно горячо поддерживали нашу идею, кардинально изменили своё мнение по обсуждаемому вопросу. Нам неизвестно, почему они передумали, но ясно одно: мы больше не можем рассчитывать на их голос."
 parliaments.11.a: "Возможно, их охватила жадность..."
 parliaments.12.title: "Отказ от поддержки крестьян"
 parliaments.12.desc: "Хотя наши [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] имеют право подавать прошения в [ROOT.GetCountry.GetGovernment.GetParliament.GetName], это не даёт им такой власти над данным учреждением, какая есть у других сословий. В ходе недавних дискуссий стало ясно, что простолюдины #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! фактически бесправны по сравнению с представителями высших сословий. Те же, в свою очередь, выступают против предложения, которое выдвинули [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')|l]."
 parliaments.12.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.12.b: "Чудовищная несправедливость!"
 parliaments.13.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] выигрывают дебаты"
 parliaments.13.desc: "В ходе текущих дебатов решительно настроенные [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] сумели склонить [ROOT.GetCountry.Custom('parliament_ua_ACC')|l] на свою сторону. Хоть они и не благородного происхождения, государство готово выслушать их как равных."
 parliaments.13.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.13.b: "Требования народа будут услышаны."
 parliaments.14.desc_common: "Делегаты из [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip] обладают особым весом в [ROOT.GetCountry.Custom('parliament_ua_PREP')|l], поскольку представляют интересы одного из важнейших экономических центров."
 parliaments.14.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] из [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
 parliaments.14.desc: "$parliaments.14.desc_common$ За счёт своих капиталов они могут ощутимо влиять на решения [ROOT.GetCountry.Custom('parliament_ua_GEN')|l], но, к счастью, принятие обсуждаемой инициативы весьма выгодно для них, поэтому в данном случае их деньги выступают на нашей стороне."
 parliaments.14.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 parliaments.15.title: "[target_location.GetNameWithNoTooltip]: тяжёлое бремя"
 parliaments.15.desc: "Многие жители [target_location.Custom('LR_GEN')|l] [target_location.GetName] расстроены предложением увеличить финансирование флота. Передав значительные средства на содержание армии, они надеялись, что [ROOT.GetCountry.GetGovernment.GetParliament.GetName|l] начнёт выделять больше денег на их собственные нужды вместо того, чтобы устраивать новые поборы."
 parliaments.15.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.15.a.tt: "Наши [Concept('pops', 'группы населения')|e] в [target_location.Custom('LR_PREP')|l] [target_location.GetName] получают [ShowNamedValue('pop_satisfaction_weak_penalty')|+=2%] к [Concept('pop_satisfaction', 'довольству')|e]"
 parliaments.16.title: "Владычество на море в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip]"
 parliaments.16.desc: "Члены [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] предлагают увеличить расходы на армию, но в [target_location.Custom('LR_PREP')|l] [target_location.GetName] весьма велико влияние флота, поэтому жители довольно холодно восприняли эту идею. Местные представители [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] сначала поддержали предложение, но теперь у них нет другого выбора, кроме как проголосовать против."
 parliaments.16.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.17.desc_common: "Поскольку жители [target_location.Custom('LR_GEN')|l] [target_location.GetName] придерживаются иной веры, в [ROOT.GetCountry.Custom('parliament_ua_PREP')|l] их часто обвиняют в том, что они преследуют интересы своей религии в ущерб нашей."
 parliaments.17.title: "Вера [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
 parliaments.17.desc_tolerance: "$parliaments.17.desc_common$ Впрочем, обычно подобные обвинения вызывают лишь смех: большинство членов [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] ценят верных слуг государства, даже если те являются иноверцами."
 parliaments.17.desc_intolerance: "$parliaments.17.desc_common$ Эти чудовищные обвинения наносят ущерб репутации [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip] и поддержке вопроса, который сейчас обсуждают в [ROOT.GetCountry.Custom('parliament_ua_PREP')|l]."
 parliaments.17.a: "Так решил [ROOT.GetCountry.GetReligion.GetGodName]."
 parliaments.18.title: "Ожидания [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
 parliaments.18.desc: "К нашему удивлению, представители [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] из [target_location.Custom('LR_GEN')|l] [target_location.GetName] поддержали наше предложение во время парламентских обсуждений. Идея подразумевает проведение определённых расчётов и измерений, и университет в [target_location.Custom('LR_PREP')|l] [target_location.GetNameWithNoTooltip] планирует принять в них участие. Учёные рады возможности собирать и исследовать новые данные, касающиеся нашей державы."
 parliaments.18.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 parliaments.19.title: "[target_character.GetNameWithNoTooltip] теряет доверие"
 parliaments.19.desc: "Когда дебаты в [ROOT.GetCountry.Custom('parliament_ua_PREP')|l] затронули такую тему, как [ROOT.GetCountry.GetGovernment.GetCabinetTitle|l], нам стало известно о серьёзной ошибке, которую [Select_CString(target_character.IsFemale, 'допустила', 'допустил')] [target_character.GetName]. В последнее время [Select_CString(target_character.IsFemale, 'она стала', 'он стал')] плохо справляться со своими обязанностями, поэтому нам стоит задуматься о том, чтобы найти [Select_CString(target_character.IsFemale, 'ей', 'ему')] достойную замену."
 parliaments.19.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.20.title: "Жизнь в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')|l] [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
 parliaments.20.desc: "Большинство членов [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] живут вдали от города [ROOT.GetCountry.GetCapital.GetName]. Посещая столицу, многие из них осознают, что жизнь здесь сильно отличается от привычного им уклада. Некоторые только рады вернуться домой, сочтя столичный быт довольно странным и неприятным.\n\nЭтот год принёс ещё более тяжёлые испытания для изнеженных натур: тёплая пора выдалась крайне жаркой, сезон дождей принёс слишком много осадков, а холода оказались гораздо сильнее обычного. Некоторые представители из регионов решили, что с них достаточно, и обратились к нам с просьбой улучшить условия их жизни в столице."
 parliaments.20.a: "Мы сделаем всё, что можем."
 parliaments.20.b: "Пусть терпят, как и все остальные."
 parliaments.21.title: "Члены [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] замешаны в скандале"
 parliaments.21.desc: "Во время последнего обсуждения новых законов в городе [ROOT.GetCountry.GetCapital.GetName] произошёл небольшой скандал. Оказывается, что отдельные члены [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] вместо участия в заседаниях предпочитают нарушать общественный порядок и задирать горожан. Их поступки возмутили как остальных делегатов, так и простой народ. Скорее всего, этот случай на долгие годы подорвёт авторитет парламента."
 parliaments.21.a: "$common_string_let_it_slide$"
 parliaments.21.b: "Арестовать нерадивых участников [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]."
 parliaments.22.title: "Абсентеизм"
 parliaments.22.desc: "Решения, принимаемые членами [ROOT.GetCountry.Custom('parliament_ua_GEN')|l], сильно влияют на политику нашей державы, поэтому все представители должны исправно посещать заседания, стараясь использовать вверенные им полномочия во благо страны. Однако на практике ситуация далека от идеала: некоторые из них пренебрегают заседаниями, предпочитая оставаться в своих загородных поместьях или предаваться столичным развлечениям. В последнее время таких становится всё больше, и мы беспокоимся, что иностранные сановники втайне смеются над нами. Мы можем повысить посещаемость, штрафуя отсутствующих членов [ROOT.GetCountry.Custom('parliament_ua_GEN')|l], хотя это однозначно вызовет их недовольство."
 parliaments.22.a: "Накажем самых злостных прогульщиков."
 parliaments.22.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 parliaments.23.title: "Требование о представительстве"
 parliaments.23.desc: "В городах #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! начинают распространяться враждебные публикации, в которых некие анонимные авторы бросаются необоснованными обвинениями в адрес нашей державы. В частности, они уничижительно называют наше правительство автократией и заявляют, что мы совсем не заботимся о [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ом народе. Они требуют принять конституцию и создать парламент, в котором будут представлены интересы разных слоёв населения нашей страны."
 parliaments.23.a: "Запретим публикации."
 parliaments.23.b: "Дадим расплывчатые обещания о реформах."
 parliaments.24.title: "Финансовая помощь"
 parliaments.24.desc: "Похоже, финансовые проблемы нашего правительства и его отчаянные попытки найти средства стали достоянием общественности. Несмотря на потерю репутации [ROOT.GetCountry.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! и за границей, это принесло нам определённую выгоду, поскольку несколько членов [ROOT.GetCountry.GetGovernment.Custom('parliament_ua_GEN')|l], представляющих [target_location.Custom('LR_ACC')|l] [target_location.GetName], обратились к нам с предложением о помощи. Взамен они просят предоставить им возможность более активно участвовать в управлении страной, а также создать официальные механизмы, которые позволят государству обращаться к ним за помощью в будущем."
 parliaments.24.a: "Дадим городам более заметное представительство."
 parliaments.24.b: "Откажемся от денег."
 parliaments.24.c: "Пообещаем рассмотреть их предложение."
 parliaments.25.desc: "$parliaments.14.desc_common$ Их капиталы могут ощутимо влиять на решения [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. К сожалению, в этот раз они будут действовать против нас."
 parliaments.25.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 parliaments.27.title: "Парламентские традиции"
 parliaments.27.desc: "Одна из самых трудных задач парламентария — вовсе не столичные дебаты, а умение выгодно преподнести новые решения и компромиссы жителям своих регионов. Тем не менее убедить людей в необходимости введения нового налога гораздо проще, если это делает местный депутат, а не сборщик податей, присланный из столицы.\n\nПохоже, наши члены [ROOT.GetCountry.Custom('parliament_ua_GEN')|l], особенно из [target_location.Custom('LR_GEN')|l] [target_location.GetName], весьма преуспели в оправдании политики государства, поскольку в последнее время народная поддержка центрального правительства заметно возросла."
 parliaments.27.a: "Наконец-то меня понимают!"
 parliaments.26.title: "Сговорчивость [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]"
 parliaments.26.desc: "В последнее время участники [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] особенно сговорчивы. Мы можем воспользоваться этим, чтобы изменить их мнения в свою пользу или изъять часть региональных ресурсов для собственных целей."
 parliaments.26.a: "Их мнения представляют для нас особую важность."
 parliaments.26.b: "Нам нужна твёрдая валюта!"
 parliaments.28.title: "Собрание несогласных"
 parliaments.28.desc: "Сегодня в городе [ROOT.GetCountry.GetCapital.GetName] было редкое и необычное зрелище: местные [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l], [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] и представители других низших и средних слоёв общества устроили собственное подобие [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. Объединённые общим недовольством, они обсуждали вопрос «[target_debate.GetName]», требуя перемен, на которые [target_character.GetName] не пойдёт ни при каких условиях. Многие «делегаты», разъярённые правящим классом, отказываются мириться с текущим положением дел и открыто выступают против решений, которые [Select_CString(target_character.IsFemale, 'приняла', 'принял')] [target_character.GetShortNameWithNoTooltip]."
 parliaments.28.a: "Наши кнуты уже не справляются!"
 parliaments.29.title: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] и их привилегии"
 parliaments.29.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] подали членам [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] официальную жалобу, и их недовольство легко понять. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] обладают исключительной властью, а купцы, приносящие #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! львиную долю прибыли, могут лишь мечтать о таком влиянии. Если пустить ситуацию на самотёк, купцы могут взбунтоваться. Как мы поступим? Поддержим старых союзников или тех, кто пополняет нашу казну?"
 parliaments.29.a: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] всегда служили нам верой и правдой."
 parliaments.29.b: "Выслушаем претензии купцов."
 parliaments.30.title: "Вопрос веры в [ROOT.GetCountry.Custom('parliament_ua_PREP')|l]"
 parliaments.30.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] предлагают нам отвлечься от мирских проблем и обратить взор на иноверцев, населяющих #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#!. Они искренне не понимают, как депутаты [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] могут обсуждать лишь сборы и дороги, пока столько душ блуждает в потёмках. Аргументы духовенства трудно опровергнуть. Как нам поступить? Позволим священникам возглавить заседание или намекнём, что им не мешало бы поумерить свои амбиции?"
 parliaments.30.a: "Нет ничего важнее веры."
 parliaments.30.b: "Отложим духовные вопросы на потом."
 parliaments.31.title: "Голоса обездоленных"
 parliaments.31.desc: "Депутаты [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] получили толстую пачку петиций с жалобами от самого угнетённого сословия #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] почти лишены влияния, но это не значит, что их недовольство можно проигнорировать. Если мы пустим ситуацию на самотёк, они могут поднять бунт, и тогда мало нам не покажется. Если же мы ответим на их мольбы, то обнадёжим политические силы, которые используют крестьян как оружие для борьбы."
 parliaments.31.a: "Их жалобы заслуживают нашего внимания."
 parliaments.31.b: "Нужно поддерживать порядок."
 parliaments.32.title: "Монастырская торговля"
 parliaments.32.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] в ярости. Монастырские мастерские и церковные торговые дома то и дело снижают цены. Честные купцы не могут позволить себе такой роскоши, ведь им нужно платить налоги. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], разумеется, довольны нынешним положением дел. И те, и другие хотят, чтобы мы их выслушали, но угодить всем не получится. Чтобы разрешить этот спор, придётся занять чью-то сторону."
 parliaments.32.a: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] говорят дело."
 parliaments.32.b: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] служат высокой цели."
 parliaments.32.c: "У нас не будет любимчиков."
 parliaments.33.title: "Куда подевались все деньги?"
 parliaments.33.desc: "На заседании [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] задали вопрос, на который нам совсем не хочется отвечать. Они интересуются, как мы умудрились накопить столько долгов. Мы и правда знатно потратились, и кредиторы уже теряют терпение. Как нам поступить? Солгать, чтобы обелить себя, или же дать обещания, которые трудно выполнить? Простых решений тут нет."
 parliaments.33.a: "Все деньги шли на нужды #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!."
 parliaments.33.b: "Придётся потуже затянуть пояса."
 parliaments.34.title: "Право на представителя"
 parliaments.34.desc: "Не все участники [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] могут присутствовать на заседаниях лично. Войны, болезни и большие расстояния между #L [ROOT.GetCountry.GetAdjective|l]ими#! поместьями никто не отменял. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] попросили разрешения отправлять вместо себя представителей с полным правом голоса. Им это решение кажется разумным, но мы видим всё иначе. Парламент, состоящий из доверенных лиц, сложнее склонить к своей точке зрения, чем настоящих депутатов. Сейчас нам предстоит решить судьбу [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]."
 parliaments.34.a: "Разрешим дворянам присылать представителей."
 parliaments.34.b: "Депутаты должны голосовать лично."
 parliaments.35.title: "Редкое единодушие"
 parliaments.35.desc: "На недавних заседаниях [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] случилось небывалое дело: [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] и [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] наконец-то нашли точки соприкосновения и выдвинули общее предложение. Такое единодушие не может не радовать. Не воспользоваться ситуацией было бы глупо, но сперва лучше узнать, какие мотивы ими движут и что они хотят получить взамен."
 parliaments.35.a: "Единство — это благо для #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!."
 parliaments.35.b: "Здесь есть какой-то подвох."
 parliaments.36.title: "Цена войны"
 parliaments.36.desc: "Депутаты [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] работают на износ. Их столы завалены петициями от семей солдат и разорившихся купцов, а также священников, которым приходится освящать слишком много могил. Народу положили уйму, а победы не видно. Даже те, кто громче всех радовался войне, бледнеют вместе со всеми, когда берутся считать расходы. Как нам поступить? Обещать скорую победу или же признать, что цена этой войны слишком высока? В любом случае мы больше не можем игнорировать подобные настроения в парламенте."
 parliaments.36.a: "Победа оправдает все жертвы."
 parliaments.36.b: "Пора прекратить страдания народа."
 parliaments.37.title: "Вмешательство [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] в войну"
 parliaments.37.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] ясно обозначили свою позицию: враг не дремлет, а армия #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! не может дольше ждать. Они требуют, чтобы депутаты [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] объявили срочный сбор ополчения. Может, они и поддались панике, но правда в том, что война требует незамедлительных решений. Нам надо определиться, как далеко мы готовы зайти и чьи сыновья откликнутся на призыв к оружию."
 parliaments.37.a: "Проведём срочный сбор."
 parliaments.37.b: "Мы не будем принуждать людей к службе."
 parliaments.38.title: "Забытые герои"
 parliaments.38.desc: "Они сражались под нашим флагом, проливали кровь за родину, а теперь, когда они вернулись домой, государство их фактически бросило. Ветераны последней кампании обратились к [ROOT.GetCountry.Custom('parliament_ua_DAT')|l] с просьбой признать их заслуги и даровать им землю или деньги. Да что там, они обрадуются даже простой благодарности. Эти почести не разорят казну, а вот молчание с нашей стороны может вызвать немало проблем."
 parliaments.38.a: "Дадим им земли."
 parliaments.38.b: "Выплатим им вознаграждение."
 parliaments.38.c: "Служба родине — и так величайший дар."
 parliaments.39.title: "Волки на границе"
 parliaments.39.desc: "Наши соседи не скрывают своих намерений. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] уведомили [ROOT.GetCountry.Custom('parliament_ua_ACC')|l] о провокациях на границе: передвижении войск и пропущенных дипломатических знаках. Мы знаем, что такие представления ничем хорошим не заканчиваются. Как нам поступить? Вложить средства в оборону, пока ещё есть время, или попробовать разрешить конфликт мирным путём?"
 parliaments.39.a: "Укрепим границы."
 parliaments.39.b: "Сперва отправим дипломатов."
 parliaments.40.title: "Голодные не могут ждать"
 parliaments.40.desc: "Мы получили ворох обращений, написанных без каких-либо обиняков. Так обычно поступают люди, чьи вежливые просьбы остались без ответа. Зернохранилища пусты. Дети голодают. [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] вынесли этот вопрос на рассмотрение [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] не потому, что они верят красивым речам, а потому что им больше некуда пойти. Мы не можем обсуждать эту тему вечно. Нужно что-то предпринять, и как можно скорее."
 parliaments.40.a: "Немедленно закупим запасы зерна."
 parliaments.40.b: "Позволим иностранцам продавать зерно на наших рынках."
 parliaments.40.c: "Ситуация на рынках исправится сама собой."
 parliaments.41.title: "Стремительное обесценивание денег"
 parliaments.41.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] бьют тревогу и, похоже, не зря. Цены растут чудовищными темпами, содержимое нашей казны обесценивается с каждым днём. Надо что-то делать, иначе коммерческий класс, который обеспечивает платёжеспособность #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, ждёт печальная участь. Увы, сразу всем не угодишь. Придётся выбирать из двух зол."
 parliaments.41.a: "Введём меры жёсткой экономии."
 parliaments.41.b: "Пусть все узнают, кто виноват в этом."
 parliaments.41.c: "Сперва мы должны погасить долги."
 parliaments.42.title: "Два города, один рынок"
 parliaments.42.desc: "К членам [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] обратились жители двух городов. Спор о том, какой из них получит широкие торговые привилегии [ROOT.GetCountry.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!, грозит затянуться и перерасти в скандал. У нас два варианта: либо предоставить одному из городов исключительные права, либо открыть рынок и позволить конкуренции сделать то, что так редко удаётся парламенту, — решить проблему окончательно."
 parliaments.42.a: "Дадим привилегии одному городу."
 parliaments.42.b: "Пусть соревнуются друг с другом."
 parliaments.43.title: "Долговая нагрузка #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!"
 parliaments.43.desc: "Бухгалтерская книга — не самый приятный документ для чтения. Мы задолжали больше, чем ожидали, и кредиторы уже теряют терпение. Чтобы рассмотреть этот вопрос, мы созвали экстренное заседание [ROOT.GetCountry.Custom('parliament_ua_GEN')|l], но депутаты не смогли прийти к согласию. Они высказали три предложения, которые противоречат друг другу. Нужно выбрать одно из них."
 parliaments.43.a: "Реструктурируем долги."
 parliaments.43.b: "Покроем долги, повысив налоги."
 parliaments.43.c: "Продадим что-нибудь ценное."
 parliaments.44.title: "Наконец-то хорошие новости"
 parliaments.44.desc: "Это заседание [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] оказалось на удивление приятным. В королевстве царит стабильность, казна полна, а наш народ на какое-то время утихомирился. Депутаты выдвинули несколько предложений, как лучше воспользоваться таким везением. На этот раз дебаты проходят вполне спокойно. Нельзя упускать такой шанс."
 parliaments.44.a: "Надо подумать о будущем."
 parliaments.44.b: "Отдадим часть богатств подданным."
 parliaments.44.c: "Начнём готовиться к грядущей войне."
 parliaments.45.title: "Еретики в дворцовых залах"
 parliaments.45.desc: "Новые религиозные идеи, похоже, проникли в здание [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] в бешенстве. Кто-то распространяет среди населения реформистские брошюры, люди на взводе, а на прошлой неделе депутаты вообще чуть не подрались. Скоро теологический спор перерастёт в открытое противостояние. Пока этого не произошло, мы должны чётко обозначить свою позицию."
 parliaments.45.a: "Депутаты — защитники истинной веры."
 parliaments.45.b: "В парламенте все голоса имеют значение."
 parliaments.46.title: "Кто на свете всех щедрее?"
 parliaments.46.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] и [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] борются за звание главных покровителей искусства. Их спор о том, кто больше сделал для #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, кажется забавным, пока не вспомнишь, что он длится уже два заседания [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. Пришла пора объявить победителя."
 parliaments.46.a: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] — главная движущая сила культурного ренессанса."
 parliaments.46.b: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] дали толчок культурному возрождению."
 parliaments.46.c: "И те, и другие постарались на славу."
 parliaments.47.title: "Слова опаснее кинжала"
 parliaments.47.desc: "С тех пор, как книгопечатание получило широкое распространение [ROOT.GetCountry.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#!, [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] жалуются на брошюры, которые распространяют [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l]. На заседании [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] обе стороны подкрепили свою правоту серьёзными аргументами. Одна называет свою деятельность просвещением, а другая — подстрекательством к мятежу. Чьё мнение нам ближе?"
 parliaments.47.a: "Помешаем распространению вредных брошюр."
 parliaments.47.b: "Пусть печатают что угодно."
 parliaments.48.title: "Божьи земли и крестьянский плуг"
 parliaments.48.desc: "В одной из деревень с новой силой разгорелись прежние разногласия. Недавно о них стало известно депутатам [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. Дело в том, что в этом селении монастырские земли примыкают к крестьянским полям, и люди никак не могут договориться, кто должен их возделывать. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] ссылаются на божественное право, а [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l] — на традиции. Каждая сторона приводит весомые аргументы. Кого мы поддержим?"
 parliaments.48.a: "Права духовенства священны."
 parliaments.48.b: "Вернём спорные земли крестьянам."
 parliaments.49.title: "Голоса новых подданных"
 parliaments.49.desc: "Люди с только что завоёванных территорий подали петиции членам [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. Они требуют прав и политического представительства. Держатся они спокойно и уверенно, но без высокомерия, что само по себе заслуживает уважения. Нам нужно решить, будут ли они принимать участие в управлении державой. От нашего ответа зависит, как новые подданные будут относиться к правящей верхушке в будущем."
 parliaments.49.a: "Предоставим им право голоса на заседаниях [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]."
 parliaments.49.b: "Они — наши подчинённые. Пусть знают своё место."
 parliaments.50.title: "Королевство в королевстве"
 parliaments.50.desc: "Крупные феодалы из провинций выдвинули [ROOT.GetCountry.Custom('parliament_ua_DAT')|l] старые требования, облечённые в новую форму. Они просят нас ввести «местное самоуправление», то есть по сути перестать вмешиваться в их дела и потерять часть контроля над страной. Это предложение может показаться даже заманчивым, если не думать о последствиях, к которым оно может привести."
 parliaments.50.a: "Пусть правят своими землями."
 parliaments.50.b: "Власть [ROOT.GetCountry.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! принадлежит короне."
 parliaments.51.title: "Беспорядки на окраинах"
 parliaments.51.desc: "На заседании [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] зачитали доклад, который вызвал большую тревогу. Кое-где [ROOT.GetCountry.Custom('end_predlog_vvo')] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! законы фактически перестали работать. Чиновники либо некомпетентны, либо их не хватает, либо их вовсе нет. Громче всех жалуются [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')|l], что обычно указывает на то, что проблема действительно существует. Нужно срочно исправлять ситуацию."
 parliaments.51.a: "Отправим управляющих для наведения порядка."
 parliaments.51.b: "Лучше отправим солдат."
 parliaments.52.title: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName] сразу для двух народов"
 parliaments.52.desc: "Включение новых территорий в состав #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! привело к тому, что членами [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] стали представители других народов. [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] предлагают ассимилировать местное население, а [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] — позволить ему сохранить свою идентичность и развивать торговые связи. Оба сословия преследуют корыстные цели, но их предложения не лишены здравого смысла. Будущее #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! в наших руках."
 parliaments.52.a: "У [ROOT.GetCountry.Custom('CL_GEN')] должна быть единая культура."
 parliaments.52.b: "Различия делают нас сильнее."
 parliaments.53.title: "[target_character.GetNameWithNoTooltip] под подозрением"
 parliaments.53.desc: "Обычно членов [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] редко радуют отчёты, но [target_character.GetName] [Select_CString(target_character.IsFemale, 'предоставила', 'предоставил')] документ, к которому невозможно придраться. Все цифры там сходятся, расчёты выглядят правдоподобно. Это как раз и настораживает. Подобная эффективность министра может говорить о его нечистоплотности. Чьи интересы были поставлены во главу угла, а чьи — ущемлены? Депутаты [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] требуют предоставить полную отчётность, и мы должны решить, насколько серьёзной будет проверка."
 parliaments.53.a: "[Select_CString(target_character.IsFemale, 'Её', 'Его')] заслуги неоспоримы."
 parliaments.53.b: "Пусть парламент изучит отчётность."
 parliaments.54.title: "Два министра на повестке дня"
 parliaments.54.desc: "Совет превратился в поле битвы, и это отрицательно сказалось на работе [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. [target_character.GetName] и [rival_character.GetName] препирались всё заседание, пытаясь спихнуть друг на друга вину за неудачу. Их ссоры никого не развлекают, кроме них самих и любителей делать ставки. Нужно как-то решить эту проблему."
 parliaments.54.a: "[target_character.GetName] получит нашу поддержку."
 parliaments.54.b: "[rival_character.GetName] получит нашу поддержку."
 parliaments.54.c: "Уволим обоих."
 parliaments.55.title: "Мздоимство в обители закона"
 parliaments.55.desc: "[target_character.GetName] [Select_CString(target_character.IsFemale, 'была уличена', 'был уличён')] в коррупции одним из депутатов [ROOT.GetCountry.Custom('parliament_ua_GEN')|l]. Обвинения выглядят правдоподобными, и от них нельзя просто так отмахнуться. С другой стороны, они запросто могут быть подставными. Обсуждать этот вопрос не имеет смысла, ведь ответ зависит от позиций собеседников. Мы должны решить, стоит ли продолжить расследование или лучше отложить его и выказать неодобрение столь недостойному поступку."
 parliaments.55.a: "Проведём расследование."
 parliaments.55.b: "Это просто политическое представление."
 parliaments.56.title: "Спор, доведённый до абсурда"
 parliaments.56.desc: "Работа [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] застопорилась. Депутаты никак не могут решить ряд процедурных вопросов: что надёжнее — голосование или перекличка, могут ли представители воздерживаться от участия, правильно ли был определён порядок выступающих и тому подобные. Их рассмотрение заняло три полных заседания, которые можно было посвятить настоящим делам. Нам нужно собраться с мыслями и наконец дать однозначный ответ."
 parliaments.56.a: "Вынесем решение самостоятельно."
 parliaments.56.b: "Пусть сами расхлёбывают эту кашу."
 parliaments.57.title: "Пустые скамьи недовольных"
 parliaments.57.desc: "Представители одного из влиятельнейших сословий вконец потеряли терпение. Нынешнее положение [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] их совершенно не устраивает. Они грозятся покинуть зал заседаний, если ситуация не исправится. Мы не знаем, действительно ли они так поступят, или это просто способ добиться своего, но проверять не хочется: решения, принятые опустевшим парламентом, мало кто примет всерьёз."
 parliaments.57.a: "Согласимся на уступки, пока депутаты не ушли."
 parliaments.57.b: "Пусть только посмеют!"
 parliaments.58.title: "Депутаты [ROOT.GetCountry.Custom('parliament_ua_GEN')|l] полны энтузиазма"
 parliaments.58.desc: "Конституционное собрание должно выполнять свою работу, иначе в нём попросту нет смысла. И наши депутаты не сидят сложа руки. Они решили законодательно оформить понятия, до сих пор не вписанные в конституцию, и зафиксировать прецеденты, с которыми в дальнейшем придётся считаться. В целом они, конечно, правы: такой документ внесёт ясность в систему управления #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#!. Проблема в том, что он также ограничит власть короны. Нужно решить, каким объёмом власти мы готовы пожертвовать. Как говорится, что написано пером, не вырубишь топором."
 parliaments.58.a: "Выпустим указ."
 parliaments.58.b: "Нельзя загонять в рамки королевскую власть."