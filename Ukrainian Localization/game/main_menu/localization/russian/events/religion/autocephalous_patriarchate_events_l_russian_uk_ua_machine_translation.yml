l_russian:
  ap_falls_desc_key: "Після складної облоги оборона відважного гарнізону була зламана, і [target_location.GetRank.GetNameWithNoTooltip|l] [target_location.GetName] пав перед нашими могутніми військами. Всередині стін міста знаходиться впливова релігійна організація: раніше тут засідали верховні #TOOLTIP:RELIGION,$orthodox_tt$,X #L православні#!#! служителі. Чи варто нам скасувати цей братський інститут або прийняти його під своє покровительство?"
  ap_diplomatic_desc_key: "Після того, як [scope:winner.GetFlavorRank|l] [scope:winner.GetName] включ[scope:winner.Custom('end_yeyut')] до свого складу [target_location.Custom('LR_ACC')|l] [target_location.GetName],"
  ap_falls_desc_key_2: "У межах стін [target_location.Custom('LR_GEN')|l] розташована впливова релігійна організація, а раніше тут засідали верховні #TOOLTIP:RELIGION,$orthodox_tt$,X #L православні#!#! служителі. Нам слід скасувати цей братський інститут чи взяти його під своє покровительство?"
  autocephalous_patriarchates.1.title: "Автокефальний патріархат пав!"
  autocephalous_patriarchates.1.desc: "$ap_falls_desc_key$"
  autocephalous_patriarchates.1.desc_diplomatic: "$ap_diplomatic_desc_key$ [target_ap.GetName] зі своєю катедрою потрапляють під нашу юрисдикцію. Тепер нам належить вирішити, як вчинити з цією патріаршою інституцією."
  autocephalous_patriarchates.1.a: "Розпустимо патріархат."
  autocephalous_patriarchates.1.b: "Збережемо патріархат."
  autocephalous_patriarchates.1.c: "Тепер ми самі вестимемо справи з патріархом."
  every_member_of_scopeloser_ap_loses_opinion_of_scopewinner_tt: "Всі учасники патріархату «[target_ap.GetName]» отримають [ShowBiasValue('destroyed_my_autocephalous_patriarchate')|+=0] до думки про нас"
  every_member_of_winner_ap_gains_opinion_of_scopewinner_tt: "Кожен учасник патріархату «[target_winner_ap.GetName]» отримає [ShowBiasValue('destroyed_another_autocephalous_patriarchate')|+=0] до думки про нас"
  autocephalous_patriarchates.2.title: "Автокефальний патріархат пав!"
  autocephalous_patriarchates.2.desc: "$ap_falls_desc_key$"
  autocephalous_patriarchates.2.desc_diplomatic: "$ap_diplomatic_desc_key$ $ap_falls_desc_key_2$"
  autocephalous_patriarchates.2.a: "Розпустимо патріархат."
  autocephalous_patriarchates.2.b: "Збережемо патріархат."
  autocephalous_patriarchates.3.title: "Відновлення патріархату [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  autocephalous_patriarchates.3.desc: "[recipient.GetName] знову розташовується в [target_location.Custom('LR_PREP')|l] [target_location.GetName], і тепер [target.GetType.GetName|l] засяє яскравіше, ніж раніше. Дуже скоро патріархат знову здобуде належну велич і поверне собі авторитет у питаннях віри."
  autocephalous_patriarchates.3.a: "На славу [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip|l]ої віри!"