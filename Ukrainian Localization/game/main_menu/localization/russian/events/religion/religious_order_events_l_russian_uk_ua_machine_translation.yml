l_russian:
  religious_orders.1.desc: "Помер заможний доброчинець, і за його заповітом невеликий спадок переходить до [target_order.GetName]. Браття вже заговорили про нові покрівлі для своїх обителей і хліб для злидарів біля своїх воріт. За звичаєм такі дари залишаються за ними, хоча сума подібного розміру рідко вислизає з-під уваги [target_character.GetName]."
  religious_orders.1.a: "Нехай браття залишать його собі."
  religious_orders.1.b: "Забрати його до скарбниці."
  religious_orders.2.title: "[target_order.GetNameWithNoTooltip] шукає прихистку"
  religious_orders.2.desc: "[target_order.GetName] розрісся настільки, що його нечисленні обителі вже не вміщають усіх, і браття просять у нас землі для розширення. Вони звернули погляд на [target_location.GetName], де хотіли б звести нову обитель і збирати послушників із навколишніх земель. Земля ця в нашій владі — надати її чи відмовити, і вони чекають на наше рішення."
  religious_orders.2.a: "Надати землю."
  religious_orders.2.b: "Наділити замість цього місцеве [GetEstateNameWithNoTooltip('clergy_estate')]."
  religious_orders.2.c: "Відмовити їм."
  locals_embrace_the_order_desc: "Народ одразу полюбив братів, і вже за сезон нова обитель здається такою, ніби стояла серед них завжди"
  order_works_to_bolster_local_wealth_desc: "Брати взялися осушувати поля та лагодити дороги, і округа багатіє від їхньої праці"
  order_projects_central_authority_desc: "З облаштуванням ордену в [target_location.GetName] влада [target_character.GetName] тепер сягає трохи далі, ніж колись"
  order_appreciates_new_holding_desc: "Брати зі вдячністю приймають дар, і в обителях ордену з теплотою згадують ласку [target_character.GetName]"
  religious_orders.3.title: "[target_order.GetNameWithNoTooltip] пробуджує вірян"
  religious_orders.3.desc: "[target_order.GetName] пробудив у країні небувалу побожність, і браття пишаються тим завзяттям, яке самі ж і розпалили. Дехто хотів би спрямувати це старання до тих міст, куди наша віра ще не проникла, аби навернути душі, недосяжні парафіяльним священникам. Інші лише бурчать, що подібні настрої рідко лишаються поблажливими до грошовитих гільдійців."
  religious_orders.3.a: "Благословити завзяття."
  religious_orders.3.b: "Вимагати пожертву від [GetEstateNameWithNoTooltip('burghers_estate')]."
  religious_orders.3.c: "Відправити братів проповідувати там, де віра найслабша."
  religious_orders.4.title: "Скандал в обителі"
  religious_orders.4.desc: "До нас дійшли чутки, що дехто з братів із [target_order.GetName] живе далеко від своїх обітниць, і поголоска про це вже розходиться за стіни обителі. Капітул дивиться на нас із надією, що ми втрутимося перш ніж скандал завдасть справжньої шкоди."
  religious_orders.4.a: "Покарати винних."
  religious_orders.4.b: "Залагодити справу без галасу."
  scandal_kept_quiet_desc: "Справу вдалося зам’яти, хоча на імені ордену залишається легка пляма"
  scandal_breaks_open_desc: "Мовчанка не допомагає, і браття звинувачують у скандалі, що вибухнув, [target_character.GetName]"
  religious_orders.5.title: "Покровитель відступається"
  religious_orders.5.desc: "Один зі шляхетних домів стану [GetEstateName('nobles_estate')] тривалий час утримував [target_order.GetName], але тепер цей гаманець закрився. Браття відразу відчули скруту й звернулися до [target_character.GetName] в надії, що [target_character.GetSheHe] не дозволить їхній справі змарніти."
  religious_orders.5.a: "Покрити нестачу зі скарбниці."
  religious_orders.5.b: "Нехай вдовольняються меншим."
  religious_orders.5.c: "Вимагати, щоб [GetEstateNameWithNoTooltip('nobles_estate')] знайшло нового опікуна."
  new_patron_steps_forward_desc: "Суперницький дім бере на себе опіку, і скарбниця ордену знову повниться"
  no_patron_steps_forward_desc: "Новий опікун не знаходиться, і брати сприймають наше втручання з ворожістю"
  treasury_gift_entrenches_order_desc: "Орден доладно розпоряджається дарунком, і його влада над нашими землями від цього лише міцнішає"
  treasury_gift_earns_gratitude_desc: "Брати приймають монети як знак ласки, і їхня прихильність до [target_character.GetName] стає глибшою"
  religious_orders.6.title: "Спустіле послушництво"
  religious_orders.6.desc_martial: "Мало юнаків іде взяти меч і хрест разом із [target_order.GetName]. Його командорства стоять напівпорожніми, і брати-ветерани вголос питають, хто триматиме кордон, коли їх не стане."
  religious_orders.6.desc_monastic: "Рік у рік усе менше послушників стукає у браму [target_order.GetName]. Хори стоять порожніми на утрені, і старі брати тривожаться, хто правитиме служби, коли їх не стане."
  religious_orders.6.a: "Відчинити браму всім, хто бажає служити."
  religious_orders.6.b: "Триматися суворих обітниць."
  religious_orders.6.c: "Оплатити набір новобранців."
  order_abandons_a_house_desc: "Не маючи послушників, щоби заповнити його, орден тихо полишає один зі своїх домів"
  order_withers_for_want_of_novices_desc: "Орден тримається своїх устоїв, але його сили та ревність тануть через брак свіжої крови"
  religious_orders.101.title: "Лицар ордену"
  religious_orders.101.desc: "Серед братів [target_order.GetName] є лицар, про якого прикордонні села вже складають пісні. Його зверхники, пам’ятаючи, звідки береться їхній хліб, ладні надати меч [target_character.GetName] нашим знаменам на весь час наших воєн."
  religious_orders.101.a: "Дати йому доручення, гідне пісень."
  religious_orders.101.b: "Його місце на кордоні."
  religious_orders.102.title: "Мечі через кордон"
  religious_orders.102.desc: "Брати [target_order.GetName] без дозволу вдерлися до [target_country.GetName] і повернулися додому, женучи поперед себе крадену худобу. Ми не перебуваємо в стані війни. Посли нашого сусіда вже в дорозі, і прибудуть вони не з молитвами."
  religious_orders.102.a: "Відшкодувати збитки та дорікнути ордену."
  religious_orders.102.b: "Що взято в нехристів, те взято по праву."
  religious_orders.103.title: "Камінь на камінь"
  religious_orders.103.desc: "Надійшов лист від охоронців [target_order.GetName], написаний так, як пишуть воїни: мури їхнього дому в [target_location.GetName] старіші за сам кордон, який вони стережуть, а вапно дешевше за скорботу. Просять вони небагато й просять навпростець."
  religious_orders.103.a: "Сплатити за міцний камінь."
  religious_orders.103.b: "Зі стінами можна зачекати; нехай краще посилять дозори."
  religious_orders.104.title: "Маяки лишилися темними"
  religious_orders.104.desc_captives: "На той час, як у [target_location.GetName] зчинили тривогу, нападники вже відходили — і відходили не з порожніми руками. Селян зв’язали й повели, щоби продати на торгах, яких ми ніколи не побачимо. Сторожові вогні [target_order.GetName] палали всю ніч і нікого не попередили, хоча вартові давали обітницю запобігати саме такому."
  religious_orders.104.desc_herds: "Пасовища довкола [target_location.GetName] спорожніли за одну ніч — у всій окрузі не лишилося ні ратиці, ні рога. Комори відчують цю втрату задовго до кінця року. Вартові [target_order.GetName] усе питають один одного, чому маяки лишилися темними."
  religious_orders.104.desc_plate: "Нападники вночі прослизнули повз сторожові вогні [target_order.GetName], і на ранок церква в [target_location.GetName] стояла обібрана до голого каменю — срібло та реліквії понесли в саквах. Брати не можуть дивитися нам у вічі."
  religious_orders.104.a: "Стерпіти втрату."
  religious_orders.104.b: "Вирядити братів у погоню за нападниками."
  wardens_spoils_recovered_desc: "Брати мчать без спочинку й наздоганяють нападників біля броду. Вони повертаються з усім, крім вибачень, а оповідка вже обростає подробицями в переказах"
  wardens_trail_cold_desc: "Брати вирушають у погоню, але знаходять лише сліди копит та охололий попіл. Втрата зостається з нами, як і сором"
  religious_orders.105.title: "Чорнило й пергамент"
  religious_orders.105.desc: "Брати ордену [target_order.GetName] ведуть найретельніші книги обліку в наших землях, і вони про це знають. Їхні настоятелі запропонували нам писарів, чиє володіння [ROOT.GetCountry.GetLiturgicalLanguage.GetName] бездоганне, а лік нещадний, просячи натомість лише затишну келію та скромне утримання."
  religious_orders.105.a: "Приставити їх до податкових книг."
  religious_orders.105.b: "Приставити їх до державного листування."
  religious_orders.106.title: "Зламана печатка"
  religious_orders.106.desc: "Лист під нашою особистою печаткою зачитали в капітулі ордену [target_order.GetName] за три дні до того, як одержувач зламав віск. Брати, які служать у нашій канцелярії, нічого не забувають. Тепер з’ясовується, що й берегти таємниці вони також не вміють."
  religious_orders.106.a: "Усунути їх від канцелярії."
  religious_orders.106.b: "Підсунути їм підроблені записи."
  religious_orders.106.c: "Стерпіти це мовчки."
  confidants_ruse_swallowed_desc: "Підроблені числа розходяться саме так, як ми й сподівалися, і ми помічаємо кожного, через чиї руки вони проходять"
  confidants_ruse_discovered_desc: "Зіркий брат помічає вигадані числа вже за тиждень, а орден не вибачає, коли з нього роблять дурня"
  religious_orders.107.title: "Додому з моря"
  religious_orders.107.desc_crews: "З палубами, повними моряків, урятованих з корабля, що розбився на далеких мілинах, галера [target_order.GetName] насилу дісталася гавані, глибоко осівши у воді. Врятовані клянуться, що брати веслували крізь таку бурю, в яку не вирушив би жоден найманий капітан, і клянуться в цьому на повен голос у кожній корчмі на пристані."
  religious_orders.107.desc_charts: "Галера [target_order.GetName] повернулася додому після тривалого супроводу, і її капітан сходить на берег із лоціями, виправленими власною рукою: виміри глибин та якірні стоянки, про які наші лоцмани й гадки не мали, позначені ясно для всякої грамотної людини."
  religious_orders.107.desc_relic: "Пів узбережжя вийшло подивитися, як галера [target_order.GetName] заходить у порт під усіма своїми вимпелами. Брати несуть на берег реліквію, куплену в далекій гавані, і натовп на пристані товпиться, щоби глянути на неї."
  religious_orders.107.a: "Прийняти їх із почестями."
  religious_orders.107.b: "Орден сам розбереться зі своїми."
  religious_orders.108.title: "Загинули разом із командою"
  religious_orders.108.desc: "Найкраща галера [target_order.GetName] розбилася об мілину під час зимового шторму, на очах у всієї гавані й без жодної надії на порятунок. Браття на її борту потонули поруч із лоцманами, яких самі роками навчали. Уздовж узбережжя калатають дзвони ордену, а ховати нема кого."
  religious_orders.108.a: "Переоснастити їхню флотилію нашим коштом."
  religious_orders.108.b: "Море дає, море й забирає."
  religious_orders.109.title: "Неухильні години"
  religious_orders.109.desc: "Довше, ніж пам’ятає більшість нині сущих, браття [target_order.GetName] неухильно дотримуються годин молитви, не пропустивши жодної ночі. Заутреня в холоднечу й вечірня в часи мору — молитва за молитвою, мов ряди мурування в стіні. У народі вже відкрито кажуть, що [ROOT.GetCountry.GetFlavorRank] стоїть лише тому, що браття моляться навколішках."
  religious_orders.109.a: "Оголосити день подяки."
  religious_orders.109.b: "Послати по благословення абата."
  religious_orders.110.title: "Голос із келії"
  religious_orders.110.desc: "Самітник [target_order.GetName], замурований у своїй келії ось уже двадцять років, заходився кричати крізь віконну щілину, що над нами нависли вогонь і мор, немов занесений меч. Прочани розносять його слова з парафії до парафії швидше за будь-якого гінця, і з кожним переказом вони стають дедалі страшнішими."
  religious_orders.110.a: "Наказати абатові змусити його замовкнути."
  religious_orders.110.b: "Нехай вигукне своє застереження."
  doom_talk_fades_desc: "Цілий сезон країна затамовує подих. Потім урожай збирають успішно, небо не бажає падати, і пророцтво тихо згасає від ніяковости"
  dread_takes_hold_desc: "Страх пускає коріння. Поля стоять напівпокинуті, поки покутники бродять дорогами, а каплиці ордену зроду не бачили стільки люду"
  religious_orders.111.title: "Кодекс із темряви"
  religious_orders.111.desc: "Браття [target_order.GetName] у [target_location.GetName], заново переплітаючи поточений червою псалтир, виявили під дошками оправи давніший текст: список, зроблений століття тому й оплаканий як утрачений усіма вченими, хто будь-коли його шукав. Бібліотекар відтоді не спить, і його лист до нас натякає, що й не збирається."
  religious_orders.111.a: "Наказати зробити списки для нашого люду."
  religious_orders.111.b: "Нехай залишається в їхній книгозбірні."
  religious_orders.112.title: "Пожежа в писарні"
  religious_orders.112.desc_chronicles: "Недогарок свічки та протяг — і до заутрені писарня [target_order.GetName] у [target_location.GetName] зникла. Літописи, які браття вели про наші діяння рік у рік із незапам’ятних часів, згоріли разом із полицями, на яких стояли. Хоч би що ми звершили, свідчень цьому тепер значно менше."
  religious_orders.112.desc_psalters: "Писарня [target_order.GetName] у [target_location.GetName] згоріла до самих одвірків ще до світанку, і разом із нею згоріли великі хорові книги. Псалтирі й антифонарії були гордістю обителі, оздоблені мініатюрами, плодом праці багатьох поколінь. Тепер служби співатимуть із пам’яті, а пам’ять підводить."
  religious_orders.112.desc_charters: "Вогонь уночі пожер писарню [target_order.GetName] у [target_location.GetName], а разом із нею — грамоти й купчі на половину округи. Будь-яка межа, яку браття коли-небудь закріплювали на пергаменті, тепер стала справою думки, а думки в таких справах рідко бувають скромними."
  religious_orders.112.a: "Відбудувати наново, полиця за полицею."
  religious_orders.112.b: "Попіл вчить смиренню."
  religious_orders.113.title: "Поля з пустища"
  religious_orders.113.desc: "Брати [target_order.GetName] три зими осушували болото біля своєї гранжі в [target_location.GetName], і цієї весни вода нарешті відступила. Там, де гніздилися чаплі, тепер чорна земля, і її виявилося більше, ніж будь-хто очікував, а питання про те, чий плуг виоре її першим, постало з першим же сухим тижнем."
  religious_orders.113.a: "Нехай гранжі розширюються."
  religious_orders.113.b: "Оселити наш люд на новій землі."
  religious_orders.114.title: "Мор у хлівах"
  religious_orders.114.desc: "У хлівах [target_order.GetName] поблизу [target_location.GetName] спалахнув мор. Худоба стоїть тремтячи, похнюпивши голови, поки лікарі для худоби сперечаються між собою, а брати прямо запитують нас, чи братися за ніж, чи за молитву."
  religious_orders.114.a: "Забити й спалити."
  religious_orders.114.b: "Довіритися молитві та чистій соломі."
  murrain_passes_over_desc: "Хвороба згасає впродовж місяця. Брати, які ніколи в цьому не сумнівалися, з делікатності не поспішають голосно про це заявляти"
  murrain_spreads_desc: "Мор перекидається з хлівів обителі на всі стада в околицях, і молебні ніяк не сповільнюють його ходу"
  religious_orders.115.title: "Грім над торговою площею"
  religious_orders.115.desc: "Чернець ордену [target_order.GetName] узяв за звичку проповідувати на ринку в [target_location.GetName] саме в той час, коли міняйли відчиняють свої ятки. Він не називає імен, та це й не потрібно. Бідняки заповнюють площу, щоб його послухати, а міняйли останнім часом почали приходити пізніше та йти раніше."
  religious_orders.115.a: "Нехай гримить."
  religious_orders.115.b: "Порадити м’якшу проповідь."
  religious_orders.116.title: "Кафедра повертається"
  religious_orders.116.desc: "Той самий хист, що збирає юрбу на площі, з тією ж легкістю може зруйнувати й добре ім’я. Чернець ордену [target_order.GetName] скерував свої проповіді проти нас у [target_location.GetName]: наші податки й наші гріхи він перелічує один за одним із кафедри, поки юрба лічить уголос разом із ним."
  religious_orders.116.a: "Відповісти йому милосердям."
  religious_orders.116.b: "Стягнути його з кафедри."
  friar_recants_desc: "У заточенні запал його згасає, і він зрікається своїх слів перед свідками. Ганьба лягає на весь орден"
  martyr_of_the_square_desc: "Він іде до своєї келії з піснею на вустах, і площа цього не забуває. Брати вже називають його мучеником, а місто вторить братам"
  religious_orders.117.title: "Колесо підкидьків"
  religious_orders.117.desc: "Брати [target_order.GetName] влаштували в стіні своєї обителі в [target_location.GetName] поворотне колесо, куди можна покласти немовля без імені й без жодного запитання. Колесо обертається значно частіше, ніж місто ладне визнати, і колиски ордену не порожніють."
  religious_orders.117.a: "Уславити їхнє милосердя."
  religious_orders.117.b: "Нехай дітей забирають парафії."
  religious_orders.118.title: "Переповнений притулок"
  religious_orders.118.desc: "Разом із подорожнім людом до міста прийшла гарячка, і притулок [target_order.GetName] у [target_location.GetName] розчинив двері, як того вимагає статут ордену. Хворі лежать по двоє на ліжку та вздовж стін монастирської галереї між ними. Міські лікарі називають це місце лампою, запаленою для метеликів."
  religious_orders.118.a: "Замкнути двері притулку."
  religious_orders.118.b: "Милосердя не відступає."
  hospice_spared_desc: "Гарячка вщухає біля стін притулку, ніби за домовленістю. Брати ховають небагатьох померлих і зауважують, що статут довів свою правоту"
  hospice_fever_spreads_desc: "Те, що зібралося в притулку, не лишається в притулку. Гарячка виходить назовні разом зі зціленими та скорботними, і квартал за кварталом затоплює недуга"
  religious_orders.119.title: "Відпущення гріхів для Марок"
  religious_orders.119.desc: "Війна скінчилася, але рахунок за неї ще не сплачено. Духівники [target_order.GetName] попросили дозволу обійти найбільш потерпілі квартали, щоб почути те, чого люди не розкажуть сусідам, і відпустити те, чого вони не можуть забути."
  religious_orders.119.a: "Відправити їх до люду."
  religious_orders.119.b: "Їхня перша справа — із сильними цього світу."
  religious_orders.120.title: "Відпущення гріхів на продаж"
  religious_orders.120.desc_noble: "Один із братів [target_order.GetName] завів тихий торг: відпускає гріхи знатному дому зі [GetEstateName('nobles_estate')], який ще не закінчив їх чинити, а потік дарів плине нарівні з відпущеннями. Капітул збентежений. Дім, про який ідеться, — ні."
  religious_orders.120.desc_merchant: "Брат [target_order.Custom('CL_GEN')] продавав чисте сумління купецьким домам — відпущення гріхів, оцінене в облікових книгах не гірше за інший крам. Для [GetEstateName('burghers_estate')] чесно сплачена ціна справедлива — зовсім не гріх, у чому, власне, і полягає суть проблеми."
  religious_orders.120.desc_prelate: "Серед духівників [target_order.GetName] є один, чиї покути стають помітно легшими в міру того, як зростає знатність грішників, і кожен із тих, хто в нього сповідається, — такий самий церковник, якому відпущено гріхи, відомі у всій парафії. [GetEstateName('clergy_estate')] воліло б, аби ми не придивлялися надто пильно."
  religious_orders.120.a: "Вимагати, щоб орден видав його."
  religious_orders.120.b: "Висповідане належить Богові."
  religious_orders.201.title: "Після кабальгади"
  religious_orders.201.desc: "Брати повертаються з набігу зі здобиччю та бранцями, і в командорстві немає єдиної думки, як відзначити цю подію."
  religious_orders.201.a: "Виставити здобич напоказ і розпалити завзяття ордену до кордонів ще дужче."
  religious_orders.201.b: "Тихо спрямувати здобич на зміцнення оборони рубежів."