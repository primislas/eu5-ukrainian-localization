l_russian:
  religious_orders.1.title: "Побожний заповіт"
  religious_orders.1.desc: "Вмираючи, багатий благодійник заповів братам-ченцям чималі статки. [target_order.GetName] уже сподівається на нові дахи над спорудами капітулу та вози хліба для роздачі голодним, адже заповідане багатство належить йому за правом. Втім, [target_character.GetName] напевне має власну думку щодо цього…"
  religious_orders.1.a: "Нехай брати залишать гроші собі."
  religious_orders.1.b: "Гроші підуть до скарбниці."
  religious_orders.2.title: "[target_order.GetNameWithNoTooltip] шукає нагоди для розширення"
  religious_orders.2.desc: "[target_order.GetName] давно переріс власні споруди, і його брати просять нас про розширення орденських володінь. Вони надумали звести новий капітул у [target_location.Custom('LR_PREP')|l] [target_location.GetName], розраховуючи залучити нових послушників з-поміж жителів довколишніх земель. Ця земля належить нам, і лише нам вирішувати, віддати її ордену чи ні."
  religious_orders.2.a: "Вони отримають свою землю."
  religious_orders.2.b: "Нехай краще цією землею розпорядяться місцеві [GetEstateNameWithNoTooltip('clergy_estate')|l]."
  religious_orders.2.c: "Відхилимо прохання."
  locals_embrace_the_order_desc: "Місцевий люд приязно зустрічає братів, і за кілька місяців годі й сказати, що капітул звели зовсім нещодавно"
  order_works_to_bolster_local_wealth_desc: "Брати беруться осушувати поля та лагодити дороги, і завдяки їхній праці край починає швидко багатіти"
  order_projects_central_authority_desc: "З появою ордену у [target_location.Custom('LR_PREP')|l] [target_location.GetName] [target_character.GetName] зміцнює свою владу над довколишніми землями"
  order_appreciates_new_holding_desc: "Брати з вдячністю приймають дар. [target_character.GetName] користується великою повагою в орденських капітулах"
  religious_orders.3.title: "[target_order.GetNameWithNoTooltip] розпалює запал вірян"
  religious_orders.3.desc: "[target_order.GetName] пробудив у країні нечувану ревність у вірі, що стало предметом особливої гордости серед братів. Дехто пропонує спрямувати цей запал до міст, де наша віра поки що недостатньо міцна, і навернути душі, до яких так і не спромоглися достукатися місцеві священники. Інші ж застерігають, що заможні містяни та спілки нерідко потерпають від подібного шаленства."
  religious_orders.3.a: "Нехай будуть благословенні палкі серця."
  religious_orders.3.b: "[GetEstateNameWithNoTooltip('burghers_estate')|U] мають зробити свій внесок."
  religious_orders.3.c: "Братам слід проповідувати там, де віра найслабша."
  religious_orders.4.title: "Скандал у монастирі"
  religious_orders.4.desc: "[target_order.GetName] укрився гучною ганьбою. До нас дійшли відомості, що деякі брати давно забули про свої обітниці, і чутки про це вже просочилися за мури монастиря. Капітул сподівається, що ми зуміємо загасити скандал, поки він не завдав відчутної шкоди."
  religious_orders.4.a: "Покараємо винних."
  religious_orders.4.b: "Розв’яжемо справу без зайвого розголосу."
  scandal_kept_quiet_desc: "Скандал вдається зам’яти, хоча добре ім’я ордену дещо підірване"
  scandal_breaks_open_desc: "Замовчати біду не вдається, і тепер брати вважають, що у скандалі, який спалахнув, [Select_CString(target_character.IsFemale, 'винна', 'винен')] [target_character.GetName]"
  religious_orders.5.title: "Втрата благодійника"
  religious_orders.5.desc: "[target_order.GetName] здавна втішається опікою одного славетного шляхетного роду, але нині #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#! довелося затягнути паски. Не звиклі до нестатків брати просять, щоб [target_character.GetName] [Select_CString(target_character.IsFemale, 'знайшла', 'знайшов')] вихід зі скрутного становища."
  religious_orders.5.a: "Ми покриємо нестачу зі скарбниці."
  religious_orders.5.b: "Нехай навчаться заощаджувати."
  religious_orders.5.c: "[GetEstateNameWithNoTooltip('nobles_estate')] повин[ROOT.GetCountry.Custom('nobles_ennanoni')] знайти ордену нового опікуна."
  new_patron_steps_forward_desc: "Інший шляхетний дім користається нагодою втерти носа суперникам, і скрині ордену знову наповнюються золотом"
  no_patron_steps_forward_desc: "Охочих стати опікуном ордену не знаходиться, і брати в усьому звинувачують нас"
  treasury_gift_entrenches_order_desc: "Орден уміло розпоряджається даром, і його хватка на наших землях міцнішає"
  treasury_gift_earns_gratitude_desc: "Брати прихильно приймають гроші, і [target_character.GetName] здобуває чималий авторитет в очах ордену"
  religious_orders.6.title: "Порожні келії"
  religious_orders.6.desc_martial: "[target_order.GetName] марніє, останніми роками дедалі менше молодих воїнів прагнуть прийняти хрест і меч та вступити до його лав. Командорства стоять напівпорожніми, а літні брати повсякчас гадають, хто ж боронитиме рубежі, коли їх не стане."
  religious_orders.6.desc_monastic: "[target_order.GetName] марніє, з кожним роком дедалі менше молодих послушників стукають у його браму. Вранці майже ніколи немає півчих, а літні брати не перестають гадати, хто ж служитиме, коли їх не стане."
  religious_orders.6.a: "Розчинимо браму для всіх охочих."
  religious_orders.6.b: "Ми повинні дотримуватися суворих обітниць."
  religious_orders.6.c: "Знайдемо кошти на те, щоб розповідати про орден."
  order_abandons_a_house_desc: "Залишившись без нових послушників, орден змушений закрити один зі своїх капітулів"
  order_withers_for_want_of_novices_desc: "Орден уперто тримається за свої високі стандарти, однак без притоку свіжої крови його колишня міць і запал згасають"
  religious_orders.101.title: "Герой ордену"
  religious_orders.101.desc: "Серед братів ордену служить уславлений лицар, чиє ім’я оспівують жителі прикордонних сіл. [target_order.GetName] не забуває про те, кому завдячує своїм високим становищем, і його провід пропонує, щоб [target_character.GetName] [Select_CString(target_character.IsFemale, 'билася', 'бився')] під нашим стягом, поки ми потребуємо [Select_CString(target_character.IsFemale, 'її', 'його')] послуг."
  religious_orders.101.a: "Дамо [Select_CString(target_character.IsFemale, 'їй', 'йому')] посаду, гідну [Select_CString(target_character.IsFemale, 'її', 'його')] слави."
  religious_orders.101.b: "[Select_CString(target_character.IsFemale, 'Її', 'Його')] місце на кордоні."
  religious_orders.102.title: "Набіг через кордон"
  religious_orders.102.desc: "[target_order.GetName] без дозволу перейшов кордон #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_GEN')|L]#!#! і викрав звідти череду худоби. Тепер нам загрожує війна, посланці сусідів уже в дорозі, і скачуть вони зовсім не для того, щоб помолитися."
  religious_orders.102.a: "Виплатимо сусідам відшкодування і привселюдно покараємо орден."
  religious_orders.102.b: "Те, що відібрано в невірних, украденим не вважається."
  religious_orders.103.title: "Камінь за каменем"
  religious_orders.103.desc: "Орденські брати з [target_location.Custom('LR_GEN')|l] [target_location.GetName] нарікають, що стіни їхнього капітулу старші за сам [target_order.GetName|l], а розчин буквально кришиться в руках. Лицарі просять небагато, але роблять це з солдатською прямотою і висловів не добирають."
  religious_orders.103.a: "Ми заплатимо за міцний камінь."
  religious_orders.103.b: "Стіни можуть зачекати, нехай висилають більше сторожі."
  religious_orders.104.title: "Ніхто не запалив сигнальні вогні"
  religious_orders.104.desc_captives: "На той час, як у [target_location.Custom('LR_PREP')|l] [target_location.GetName] забили на сполох, нападники вже втікали — до того ж не з порожніми руками. Вони захопили в полон безліч селян, тепер на нещасних чекає неволя в далеких і незнаних країнах. Багаття на кордоні горіли всю ніч, однак [target_order.GetName|l] так нікого й не попередив про небезпеку — а лицарі ж присягалися бути нашим щитом."
  religious_orders.104.desc_herds: "За одну ніч пасовища довкола [target_location.Custom('LR_GEN')|l] [target_location.GetName] геть спорожніли, в околицях не лишилося жодної голови худоби. Комори відчують цю втрату задовго до кінця року. Ніхто не тямить, чому [target_order.GetName|l] не запалив сигнальні вогні."
  religious_orders.104.desc_plate: "Скориставшись темрявою, нападники прослизнули повз багаття дозорців, яких виставив [target_order.GetName|l]. На ранок у церкві [target_location.Custom('LR_GEN')|l] [target_location.GetName] зосталися лише голі стіни — все її срібло та священні реліквії опинилися в переметах у розбійників. Брати ордену ніяково відводять погляд."
  religious_orders.104.a: "Доведеться змиритися з втратою."
  religious_orders.104.b: "Брати мусять наздогнати грабіжників!"
  wardens_spoils_recovered_desc: "Брати ордену скачуть без перепочинку й наздоганяють нападників на переправі. Їм удається відбити в розбійників здобич, і слава про їхній подвиг розходиться округою"
  wardens_trail_cold_desc: "Брати знаходять лише згаслі кострища та сліди копит. Утраченого не повернути, а сором не змиється ще довго"
  religious_orders.105.title: "Перо й чорнило"
  religious_orders.105.desc: "Ніхто в наших землях не зрівняється з орденськими братами у веденні облікових книг, і їм це чудово відомо. [target_order.GetName] пропонує нам послуги своїх писарів, які бездоганно володіють лічбою та #L [ROOT.GetCountry.GetLiturgicalLanguage.GetName|l]ою#! мовою. Усе, що їм потрібно, — це скромна платня й тихе приміщення для праці."
  religious_orders.105.a: "Нехай працюють над податковими записами."
  religious_orders.105.b: "Нехай візьмуться за державне листування."
  religious_orders.106.title: "Зламана печатка"
  religious_orders.106.desc: "Скріплений нашою печаткою лист ще не дійшов до адресата, а [target_order.GetName|l] уже кілька днів обговорює його зміст. Схоже, брати, що працюють у нашій канцелярії, мають гарну пам’ять… і звичку патякати без упину."
  religious_orders.106.a: "Звільнимо їх із канцелярії."
  religious_orders.106.b: "Підкинемо їм підроблені папери."
  religious_orders.106.c: "Доведеться змиритися."
  confidants_ruse_swallowed_desc: "Підроблені відомості потрапляють куди слід, а ми пильно занотовуємо, через чиї руки вони пройшли"
  confidants_ruse_discovered_desc: "Один уважний брат менше ніж за тиждень помічає, що числа не збігаються. Орден не забуде цього обману"
  religious_orders.107.title: "Повернення до рідної гавані"
  religious_orders.107.desc_crews: "Галера орденських братів, завантажена майже вщерть, заходить у гавань. Її палуби переповнені моряками, яких зняли з корабля, що сів на мілину. Урятовані навперебій розповідають, як брати відважно вели корабель крізь бурю, куди інший капітан не поткнувся б за жодні скарби. За [target_order.GetName|l] піднімають чарки в усіх портових шинках."
  religious_orders.107.desc_charts: "Галера орденських братів повернулася додому після довгого плавання. [target_order.GetName] доправив до порту виправлені морехідні мапи, де рукою капітана позначено протоки й природні гавані, про які навіть не здогадувалися наші штурмани."
  religious_orders.107.desc_relic: "Пів міста збіглося подивитися, як до порту під усіма знаменами заходить галера орденських братів. [target_order.GetName] привіз додому реліквію, куплену в далеких краях, і містяни прагнуть побачити її бодай здалеку."
  religious_orders.107.a: "Ми зустрінемо їх як героїв."
  religious_orders.107.b: "Справи ордену нас не обходять."
  religious_orders.108.title: "Зниклі в морі"
  religious_orders.108.desc: "Найкраща галера, якою міг похвалитися [target_order.GetName|l], затонула поблизу гавані, розбившись об піщану косу під час зимової бурі. Усі брати на її борту потонули, як і керманичі, що навчалися в них роками. В орденських церквах на березі б’ють дзвони, однак ховати нікого."
  religious_orders.108.a: "Оплатимо зі скарбниці лагодження їхньої ескадри."
  religious_orders.108.b: "Море як дає, так і забирає."
  religious_orders.109.title: "Літургія годин"
  religious_orders.109.desc: "[target_order.GetName] славиться своєю дисципліною, його брати вдень і вночі правлять служби з незапам’ятних часів. Вони не пропускають жодного дня, утрені й вечірні відбуваються у призначений час як у спеку, так і в мороз. Люди кажуть, що доки брати моляться, [ROOT.GetCountry.GetFlavorRank|l] буд[ROOT.GetCountry.Custom('endrank_eut')] жити."
  religious_orders.109.a: "Оголосимо день подяки."
  religious_orders.109.b: "Нехай настоятель благословить нас."
  religious_orders.110.title: "Голос із келії"
  religious_orders.110.desc: "[target_order.GetName] повідомляє, що анахорет, останні двадцять років замурований у власній келії, раптом заволав крізь віконну щілину, нібито вогонь і мор нависли над нами, мов меч. Прочани розносять його слова з однієї парафії до іншої швидше за будь-якого гінця, і з кожним переказом картина стає дедалі моторошнішою."
  religious_orders.110.a: "Нехай настоятель змусить його замовкнути."
  religious_orders.110.b: "Нехай волає скільки заманеться."
  doom_talk_fades_desc: "Наступні кілька місяців уся країна живе затамувавши подих. Проте врожай видається багатим, небо на землю не падає, і про пророцтво всі швидко забувають"
  dread_takes_hold_desc: "Людей охоплює жах. Поля стоять запустілими, дорогами бредуть покутники, а каплиці ордену повні як ніколи"
  religious_orders.111.title: "Віднайдений список"
  religious_orders.111.desc: "[target_order.GetName] здобув справжній скарб. Відновлюючи поточений шашелем псалтир, брати-ченці з [target_location.Custom('LR_GEN')|l] [target_location.GetName] виявили давніший текст, схований у дошках старої оправи, — це список, зроблений століття тому і вважаний давно втраченим. Орденський бібліотекар провів над рукописом уже кілька безсонних ночей і явно не збирається зупинятися."
  religious_orders.111.a: "Нехай зроблять копію для наших вчених мужів."
  religious_orders.111.b: "Рукопис має зберігатися в орденській бібліотеці."
  religious_orders.112.title: "Пожежа в писарні"
  religious_orders.112.desc_chronicles: "Непогашена свічка, раптовий порив вітру — і до утрені від орденської писарні у [target_location.Custom('LR_PREP')|l] [target_location.GetName] лишилися самі жарини. [target_order.GetName] утратив усю свою історію — у полум’ї згинули десятиліття хронік, які брати дбайливо записували з перших днів існування ордену, а разом із хроніками згоріли й свідчення про наші діяння…"
  religious_orders.112.desc_psalters: "Перед світанком орденська писарня у [target_location.Custom('LR_PREP')|l] [target_location.GetName] згоріла вщент. [target_order.GetName] позбувся безцінних псалтирів та антифонаріїв, які оздоблювало кілька поколінь митців. Тепер хору доведеться співати з пам’яті, а пам’ять, як відомо, ненадійний наставник…"
  religious_orders.112.desc_charters: "Орденська писарня у [target_location.Custom('LR_PREP')|l] [target_location.GetName] згоріла цієї ночі, разом із нею загинули розписки й грамоти на землі та титули половини округи. Усі межі, зафіксовані братами, тепер стануть предметом суперечки, а думки зацікавлених сторін рідко бувають безсторонніми…"
  religious_orders.112.a: "Ми відбудуємо все наново, полиця за полицею."
  religious_orders.112.b: "Попіл нагадує нам про потребу в покорі."
  religious_orders.113.title: "Рілля на місці боліт"
  religious_orders.113.desc: "Протягом трьох зим [target_order.GetName|l] осушував болота поблизу своєї мизи біля [target_location.Custom('LR_GEN')|l] [target_location.GetName], і цієї весни вода нарешті зійшла. Там, де колись гніздилися лелеки, розкинулися безкраї поля чорнозему. Лишається вирішити, кому випаде честь обробляти ці землі…"
  religious_orders.113.a: "Орден може розширити свою мизу."
  religious_orders.113.b: "Віддамо нові ниви нашим селянам."
  religious_orders.114.title: "Падіж худоби в корівниках"
  religious_orders.114.desc: "[target_order.GetName] сповіщає, що в корівниках поблизу [target_location.Custom('LR_GEN')|l] [target_location.GetName] стався падіж худоби. Тварини тремтять, опустивши голови, поки коновали сперечаються між собою. Брати хочуть знати, що зараз допоможе більше — ніж чи молитва?"
  religious_orders.114.a: "Заб’ємо та спалимо хворих тварин."
  religious_orders.114.b: "Довіримося молитві та чистій соломі."
  murrain_passes_over_desc: "Спалах хвороби минає за місяць. Брати не сумнівалися, що так і буде, але з ґречности не кажуть про це вголос"
  murrain_spreads_desc: "Хвороба з орденських корівників поширюється на всі череди в околицях. Богослужіння безсилі спинити пошесть"
  religious_orders.115.title: "Грім на ринковому майдані"
  religious_orders.115.desc: "Важко сказати, причетний до цього [target_order.GetName|l] чи ні, але один з його святих отців узяв собі за звичай проповідувати на ринку [target_location.Custom('LR_GEN')|l] [target_location.GetName] саме в ті години, коли міняйли відчиняють свої ятки. Він ні на кого відкрито не вказує, але це й не потрібно. Юрми бідноти сходяться на майдані, аби послухати його промови, а лихварі тепер намагаються відкриватися пізніше й зачинятися раніше."
  religious_orders.115.a: "Нехай задасть їм перцю."
  religious_orders.115.b: "Йому варто бути обачнішим у своїх проповідях."
  religious_orders.116.title: "Проповідник знайшов нову ціль"
  religious_orders.116.desc: "Дар, здатний збирати майдани, так само легко руйнує добре ім’я. Проповідник ордену з [target_location.Custom('LR_GEN')|l] [target_location.GetName] звернув свій погляд на нас. Він старанно перелічує всі наші провини та несправедливі податки, а зібраний натовп хором веде їм лік."
  religious_orders.116.a: "Ми відповімо на звинувачення милосердям."
  religious_orders.116.b: "Схопити його просто під час проповіді!"
  friar_recants_desc: "У темниці проповідник швидко втрачає запал і кається перед свідками. [target_order.GetName] зазнає ганьби"
  martyr_of_the_square_desc: "Проповідник іде до темниці, виспівуючи псалми. Його самовідданість не лишається непоміченою: брати ордену вже називають його мучеником, а містяни залюбки дослухаються до їхніх слів"
  religious_orders.117.title: "Колесо підкидьків"
  religious_orders.117.desc: "[target_order.GetName] наказав улаштувати у стіні свого капітулу в [target_location.Custom('LR_PREP')|l] [target_location.GetName] особливе поворотне колесо, де матері можуть потай лишати небажаних дітей. Цим «колесом для підкидьків» користуються частіше, ніж містянам хотілося б знати, і ясла при ордені вже переповнені."
  religious_orders.117.a: "Їхня доброчинність гідна захоплення."
  religious_orders.117.b: "Нехай немовлят розберуть парафіяльні церкви."
  religious_orders.118.title: "Переповнена лічниця"
  religious_orders.118.desc: "Безперервний потік подорожніх приніс у [target_location.Custom('LR_ACC')|l] [target_location.GetName] лихоманку, і, як велить звичай, [target_order.GetName|l] звелів відчинити двері лічниці для всіх стражденних. Хворі лежать по двоє на ліжку, а тих, кому забракло місця, кладуть просто в проходах. Міські лікарі вважають, що це місце перетворилося на розсадник зарази."
  religious_orders.118.a: "Заб’ємо двері лічниці."
  religious_orders.118.b: "Благодійність хвороб не боїться."
  hospice_spared_desc: "Спалах лихоманки скоро минає, не вийшовши за межі шпиталю. Ченці ордену довели дієвість своїх правил, хоч і ціною життя кількох братів."
  hospice_fever_spreads_desc: "Немов із луснулого гнійника, зараза, що накопичилася в шпиталі, проривається назовні. Лихоманка шириться вулицями разом зі зціленими та тими, хто прийшов оплакати померлих, уражаючи квартал за кварталом"
  religious_orders.119.title: "Відпущення для проклятих"
  religious_orders.119.desc: "Війна скінчилася, але її рахунки лишаються неоплаченими. [target_order.GetName] просить дозволу відрядити сповідників до найбільш потерпілих земель, щоби люди могли розповісти їм те, в чому ніколи не зізнаються сусідам, та отримали відпущення гріхів за вчинки, які ніколи не зможуть забути."
  religious_orders.119.a: "Нехай ідуть до народу."
  religious_orders.119.b: "Спершу їм слід подбати про потреби знаті."
  religious_orders.120.title: "Індульгенції на продаж"
  religious_orders.120.desc_noble: "[target_order.GetName] знову укрився гучною ганьбою: один із братів потайки перетворив відпущення гріхів на прибуткову справу. [GetEstateName('nobles_estate')] з одного великого дому може отримати в нього прощення навіть тих гріхів, які ще тільки збирається вчинити, — і за цим щоразу йдуть щедрі дари. Капітул ладен крізь землю провалитися від сорому, а от знать анітрохи не бентежить такий перебіг подій."
  religious_orders.120.desc_merchant: "[target_order.GetName] знову укрився гучною ганьбою: один із братів продає відпущення гріхів купцям, до того ж платять вони за розцінками, як за будь-який інший крам. [GetEstateName('burghers_estate')] вважають, що в добровільно укладеній угоді за справедливою ціною немає нічого поганого, — і це, либонь, найгірше."
  religious_orders.120.desc_prelate: "[target_order.GetName] знову укрився гучною ганьбою: один із його сповідників схильний накладати легкі покути за найтяжчі гріхи, причому сповідаються йому винятково служителі церкви, чиї численні провини відомі кожному їхньому парафіянину. [GetEstateName('clergy_estate')] дає зрозуміти, що нам ліпше заплющити на це очі."
  religious_orders.120.a: "Орден має негайно видати сповідника."
  religious_orders.120.b: "Зміст сповіді може судити лише Господь."
  religious_orders.201.title: "Після кабальгади"
  religious_orders.201.desc: "Брати повернулися з набігу зі здобиччю та безліччю бранців. Командорство має вирішити, як розпорядитися цим багатством."
  religious_orders.201.a: "Виставимо здобич напоказ, щоби дужче розпалити ревність вояків ордену."
  religious_orders.201.b: "Тихо спрямувати здобич на зміцнення оборони рубежів."
  religious_orders.202.title: "A Foothold Among the Infidel"
  religious_orders.202.desc: "Our soldiers have wrested [ro_conquest_location.GetName] from unbelieving hands, and the brothers of [ro_conquest_order.GetName] look upon it with purpose. Where the faith does not yet hold, they would plant a commandery, a house of prayer and the sword upon the new frontier, and ask our leave to raise it."
  religious_orders.202.a: "Let them build their commandery."
  religious_orders.202.b: "The frontier is no place for them yet."