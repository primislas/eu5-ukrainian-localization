l_russian:
  holy_war.1.title: "Заклик до священної війни"
  holy_war.1.desc: "До двору прибули проповідники. Охриплими від шалу віри голосами вони закликають усіх правовірних узятися до зброї та виступити проти #ONCLICK:COUNTRY,[preach_io.GetTarget.GetKey] #TOOLTIP:COUNTRY,[preach_io.GetTarget.GetKey],X [preach_io.GetTarget.Custom('CL_GEN')|L]#!#!. Усі погляди звернені на нас. Чи відповімо ми на заклик?"
  holy_war.1.a: "Ми станемо до боротьби!"
  holy_war.1.b: "Не цього разу."
  holy_war.2.title: "Збір на священну війну"
  holy_war.2.desc: "До нас із проханням прибули посланці [levy_leader.Custom('longname_ua_GEN')]. Об’єднання «[levy_io.GetName]» веде священну війну проти #ONCLICK:COUNTRY,[levy_io.GetTarget.GetKey] #TOOLTIP:COUNTRY,[levy_io.GetTarget.GetKey],X [levy_io.GetTarget.Custom('CL_GEN')|L]#!#!, і війна ця коштує недешево. Ми їхні брати у вірі, тому нас просять наповнити їхню спустілу скарбницю. Чи готові ми відчинити свою скарбницю заради святої справи?"
  holy_war.2.a: "Сплатимо невелику суму."
  holy_war.2.b: "Ми щедро підтримаємо їх коштами."
  holy_war.2.c: "Краще самі приєднаймося до війни."
  holy_war.2.d: "Наша країна не стане оплачувати чужі війни!"
  holy_war.2.d.tt: "Кожен учасник об’єднання «[levy_io.GetName]» отримає модифікатор #R «Ухилилися від священної війни»#! до думки про нас"
  holy_war.3.title: "Наш люд навертають!"
  holy_war.3.desc: "На землях, які відібрав у нас ворог, селами ходять чужі священники й погрозами змушують наших одновірців зріктися віри батьків. Звістки про кожен випадок навернення доходять до нашого двору, і ми не скоро забудемо ці злочини."
  holy_war.3.a: "Вони поплатяться за це!"
  holy_war.3.a.tt: "Ми ніяк не протидіємо примусовому наверненню"
  holy_war.4.title: "Осуд від вірян"
  holy_war.4.desc: "Провідник священної війни звинувачує нас в ухилянні від священного обов’язку та погрожує тяжкими наслідками, якщо ми не доведемо своєї вірності. Що ми відповімо?"
  holy_war.4.a: "Присягаємо подвоїти свої зусилля."
  holy_war.4.a.tt: "Провідник священної війни дає нам #G 2 роки#!, щоб проявити себе. Якщо до того часу наша участь у священній війні зросте, віряни будуть задоволені; якщо ні — ми однаково зазнаємо їхнього осуду."
  holy_war.4.b: "Ми ні перед ким не звітуємо."
  holy_war.6.title: "Віряни вдоволені"
  holy_war.6.desc: "Звістка про наше нове завзяття у священній війні рознеслася далеко, і провідники вірян тепер з теплотою згадують наше ім’я. Де колись панував сумнів, тепер запанувала прихильність."
  holy_war.6.a: "#italic Deus vult#!."
  holy_war.6.a.muslim: "#italic Allāhu akbar#!."
  holy_war.20.title: "Віряни невдоволені"
  holy_war.20.desc: "Час, відведений нам на виконання обітниць, сплив, а ми нічого не зробили, щоб їх дотриматися. Провідники священної війни не забули ані наших обіцянок, ані того, що ми їх не виконали, і осуд, про який вони попереджали, тепер спадає на нас."
  holy_war.20.a: "Ми мусимо знести їхній суд."
  holy_war.7.title: "Відповідь на наш заклик"
  holy_war.7.desc: "[preach_target.GetName] прислуха[preach_target.Custom('end_vlaloly')]ся до наших проповідей і приєдна[preach_target.Custom('end_vlaloly')]ся до священної війни, присягнувши справі мечем і скарбом. Ще один меч оголено за віру, і наше військо зростає."
  holy_war.7.a: "Віряни збираються."
  holy_war.8.title: "Наш заклик відкинуто"
  holy_war.8.desc: "[preach_target.GetName] залиши[preach_target.Custom('end_vlaloly')]ся глух[preach_target.Custom('end_yiaei')] до наших проповідей, зустрівши нас холодними словами й зачиненими брамами, і не приєдна[preach_target.Custom('end_yetsayutsa')] до священної війни. Віряни запам’ятають цю кривду."
  holy_war.8.a: "Ну що ж, нехай."
  holy_war.8.a.tt: "Вони відкинули нашу пропозицію"
  holy_war.9.title: "Пропозиція кардинальського осідку"
  holy_war.9.desc: "[cardinal_offerer.GetName] як очільник [Concept('crusade', 'хрестового походу')|e] пропону[cardinal_offerer.Custom('end_yeyut')] піднести одного з наших прелатів до кардинальського сану, якщо ми візьмемо хрест, — а осідок для нього буде зведено в нашій власній столиці. Така опіка пов’яже нас зі священною справою. Чи приймемо ми цю пропозицію?"
  holy_war.9.a: "Ми приймаємо цю честь і приєднуємося до Хрестового походу."
  holy_war.9.a.no_seat_tt: "Наша країна вже має кардинальський осідок у кожному поселенні, тож натомість ми вшановані більшою славою"
  holy_war.9.b: "Ми відхиляємо цю пропозицію."
  holy_war.10.title: "Пропозиція визнання"
  holy_war.10.desc: "[recognition_offerer.GetName] як очільник [Concept('jihad', 'джихаду')|e] пропону[recognition_offerer.Custom('end_yeyut')] визнати наше становище серед вірян, дарувати духовний авторитет і право на владу, якщо ми долучимося до священної війни проти невірних. Чи приймемо ми цю пропозицію?"
  holy_war.10.a: "Ми приймаємо пропозицію і приєднуємося до джихаду."
  holy_war.10.b: "Ми відхиляємо цю пропозицію."
  holy_war.17.title: "Чудесне зцілення"
  holy_war.17.desc: "Простий вояк, якого табірні лікарі вже списали на той світ, звівся з недужого ложа цілим і здоровим, і багато хто вже називає це діянням Небес. Утім, у пазурах гарячки його навідували дивні й тривожні сновидіння — видіння, які, як він присягається, провіщають майбутнє, і військо тривожно перешіптується про них. Як нам поставитися до цієї справи?"
  holy_war.17.a: "Оголосити його зцілення дивом і згуртувати військо!"
  holy_war.17.a.muslim: "$holy_war.17.a$"
  holy_war.17.a.tt: "Підвищує ревність у вірі священної війни на #G 5#!"
  holy_war.17.b: "Замовчати цю справу, перш ніж нею заволодіє страх."
  holy_war.18.title: "Завзяття в таборі згасає"
  holy_war.18.desc: "Довге очікування нещадно виснажує військо. Молитви, що колись лунали з палким завзяттям, нині бурмочуть за звичкою, суперечки спалахують через найменші дрібниці, а довкола табірних багать щоночі знову тліють старі чвари. Палкість, що спершу привела вірян до святої справи, охолола до сірого попелу, і якщо незабаром щось не розпалить їхній дух наново, увесь задум може зійти нанівець ще до першого удару. Що ж нам робити?"
  holy_war.18.a: "Влаштувати велику проповідь і бенкет для війська."
  holy_war.18.a.tt: "Підвищує ревність у вірі священної війни на #G 8#!"
  holy_war.18.b: "Віряни мусять самі знайти свій вогонь."
  holy_war.18.b.tt: "Знижує ревність у вірі священної війни на #R 5#! та затримує її підготовку на #R 5#!"
  holy_war.19.title: "Полум’яний проповідник"
  holy_war.19.desc: "Біля краю табору з’явився проповідник із шаленим поглядом; його одяг пошарпаний мандрами, а голос захрип від невпинних повчань. Його палкі слова приваблюють дедалі більший натовп бідняків і побожних людей, робітників та безземельних бідарів, і всі вони вимагають виступити за віру цієї ж миті. Він ревний понад будь-яку міру і геть свавільний, і жоден вельможа з-поміж нас не має над ним влади. Як нам вчинити з цим баламутом?"
  holy_war.19.a: "Дати йому повну волю збирати вірян."
  holy_war.19.a.tt: "Підвищує ревність у вірі священної війни на #G 5#!"
  holy_war.19.b: "Вгамувати його, перш ніж він зчинить безлад."
  holy_war.21.title: "Чвари через здобич"
  holy_war.21.desc: "Ледве містечко впало, як наші вояки та люди союзного війська зчепилися через поділ здобичі. У вузьких вуличках оголили ножі, намети перекинуто, а старі образи між двома таборами переросли у відкриту бійку. Якщо не владнати цю чвару швидко, вона може занапастити всю воєнну кампанію і звернути брата проти брата, доки ворог іще стоїть. Як нам це вирішити?"
  holy_war.21.a: "Нехай наші люди візьмуть те, що заслужили."
  holy_war.21.a.tt: "Знижує ревність у вірі священної війни на #R 5#!"
  holy_war.21.b: "Стримати їх заради спільної справи."
  holy_war.21.b.tt: "Підвищує ревність у вірі священної війни на #G 5#!"
  holy_war.22.title: "Пошесть у війську"
  holy_war.22.desc: "Виснажлива гарячка прокралася крізь тісні облогові порядки, і кожного тьмяного ранку дедалі більше непритомних вояків виносять із їхніх наметів. Табірні лікарі пускають їм кров, очищують шлунки й моляться над ними, та ніщо не зупиняє хворобу, а сморід умираючих важко висить над усім табором. З кожним днем військо втрачає сили, якими ніяк не може розкидатися так далеко від дому, перед досі незламними мурами. Як нам протистояти цій навалі?"
  holy_war.22.a: "Продовжувати похід за будь-яку ціну."
  holy_war.22.b: "Дати війську перепочити, доки пошесть не мине."
  holy_war.22.b.tt: "Зменшує ревність священної війни у вірі на #R 5#!"
  holy_war.23.title: "Загибель поборника"
  holy_war.23.desc: "Під час облоги [sieged_location.Custom('LR_GEN')] [sieged_location.GetName] у розпалі бою [Select_CString(fallen_champion.IsFemale, 'загинула', 'загинув')] [fallen_champion.GetName], [Select_CString(fallen_champion.IsFemale, 'посічена', 'посічений')] на мурах після подвигів звитяги, про які співатимуть ще цілі покоління. Військо оплакує [Select_CString(fallen_champion.IsFemale, 'поборницю, любу', 'поборника, любого')] як простому воякові, так і гордовитому пану. Та навіть у горі серця людей сповнюються вогнем, і багато хто благає про честь помститися ворогові за полеглу душу. Як ми вшануємо цю смерть?"
  holy_war.23.a: "Проголосити [Select_CString(fallen_champion.IsFemale, 'її мученицею', 'його мучеником')] за віру!"
  holy_war.23.a.tt: "Збільшує ревність священної війни у вірі на #G 10#!"
  holy_war.23.b: "Вшанувати з тихою гідністю."
  holy_war.23.b.tt: "Збільшує ревність священної війни у вірі на #G 3#!"
  holy_war.24.title: "Удавані віряни в лавах"
  holy_war.24.desc: "Табором повзуть лихі чутки, що серед вірних затесалися єретики та удавані віряни, чиї молитви — лише блюзнірська насмішка, а вірність під великим сумнівом. Найпобожніші у війську вимагають викорінити їх, перш ніж вони отруять усе військо, тоді як розважливіші радять зважити на те, що меч у руці вояка лишається мечем, хоч би яка віра таїлася в його серці. Як ми відповімо на це звинувачення?"
  holy_war.24.a: "Очистити військо від удаваних вірян."
  holy_war.24.a.tt: "Збільшує ревність священної війни у вірі на #G 8#!"
  holy_war.24.b: "Заплющити очі. Нам потрібен кожен меч."
  holy_war.24.b.tt: "Зменшує ревність священної війни у вірі на #R 5#!"
  holy_war.25.title: "Побожний заповіт"
  holy_war.25.desc: "Один заможний вельможа нашої країни, що нещодавно відійшов у вічність, у своєму останньому заповіті відписав велику суму на священну війну. Його душоприказники передали скарб нам на збереження — запечатані скрині з грошима, які ми можемо використати на святу справу на власний розсуд. І вже духовенство, ватажки та вбогі заявляють свої домагання на нього. Куди ж спрямувати це багатство?"
  holy_war.25.a: "Забрати багатство на потреби нашої власної війни."
  holy_war.25.b: "Передати його до військової скарбниці священної війни."
  holy_war.25.b.tt: "Збільшує ревність священної війни у вірі на #G 3#!"
  holy_war.25.c: "Роздати його як милостиню вірним."
  holy_war.25.c.tt: "Збільшує ревність священної війни у вірі на #G 3#!"
  holy_war.27.title: "Здобутий перебіжчик"
  holy_war.27.desc: "Наше срібло зробило свою тиху справу. [desertion_member.GetName] взя[desertion_member.Custom('end_vlaloly')] хабар і полиши[desertion_member.Custom('end_vlaloly')] спільну справу, згорнувши знамена й тихцем подавшись додому під прикриттям виправдань, у які ніхто по-справжньому не вірить. Їхній відхід послабив наших ворогів. Знову золото купило нам те, чого не спромоглися здобути ані криця, ані проповідь, і одного докучливого ворога тихо прибрано з дошки. Можливо, це наука про справжню ціну вірности."
  holy_war.27.a: "Зажерливість бере гору там, де хибить меч."
  holy_war.27.a.tt: "Вони взяли хабар і відступилися"
  holy_war.28.title: "Відкинуте срібло"
  holy_war.28.desc: "[desertion_member.GetName] навідріз відкину[desertion_member.Custom('end_vlaloly')] нашу таємну пропозицію та вистави[desertion_member.Custom('end_vlaloly')] нашого посланця зі свого двору, присягнувшись непохитно триматися у війні, не піддавшись спокусі наших грошей. Гірше того, чутки про цю спробу можуть розійтися, і якщо про неї дізнається люд, наше добре ім’я буде заплямоване славою підкупників та ошуканців. Цей задум не приніс нічого, крім небезпеки."
  holy_war.28.a: "Ну що ж, нехай."
  holy_war.28.a.tt: "Вони відмовилися від хабаря"
  holy_war.29.title: "Папський легат"
  holy_war.29.desc: "Його Святість прислав духовного діяча на ім’я [papal_legate.GetName] — прелата-воїна, що знається на військовій справі так само добре, як і на церковній службі, — щоб той їхав на чолі нашого війська та надав нашому [Concept('crusade', 'хрестовому походу')|e] повне благословення Рима. Такий муж міг би загартувати наше військо та ще дужче наблизити нас до Святого Престолу, хоча підпорядковується він насамперед Папі, а вже потім нам. Чи приймемо ми його до себе на службу?"
  holy_war.29.a: "Привітати легата під нашими знаменами."
  holy_war.29.a.tt: "Збільшує ревність у вірі [Concept('crusade', 'хрестового походу')|e] на #G 5#!"
  holy_war.29.b: "Відіслати його назад до Рима з нашою подякою."
  holy_war.30.title: "Торговці індульгенціями в таборі"
  holy_war.30.desc: "Ватага торговців індульгенціями злетілася до нашого табору, немов стерв’ятники на свіжу падлину, вигукуючи та збуваючи прощення й священні дрібнички кожному воякові, що ладен розлучитися з грошима. Їхні прибутки зростають так само швидко, як і ремство набожних, що кленуть усю цю торгівлю як ганьбу для нашої справи. Проте гроші є гроші, і жодна священна війна не вигравалася одними лише молитвами. Що ж нам із ними робити?"
  holy_war.30.a: "Нехай їхній заробіток поповнить військову скарбницю."
  holy_war.30.a.tt: "Знижує ревність у вірі [Concept('crusade', 'хрестового походу')|e] на #R 3#!"
  holy_war.30.b: "Тишком спрямувати ці гроші до нашої скарбниці."
  holy_war.30.b.tt: "Знижує ревність у вірі [Concept('crusade', 'хрестового походу')|e] на #R 5#!"
  holy_war.30.c: "Прогнати гендлярів із табору."
  holy_war.30.c.tt: "Збільшує ревність у вірі [Concept('crusade', 'хрестового походу')|e] на #G 5#!"
  holy_war.31.title: "Мощі святого"
  holy_war.31.desc: "До нас потрапили кістки шанованого святого, принесені до нашого двору гуртом вдячних ченців, які оберігали їх крізь численні небезпечні версти. Такі мощі — скарб, дорожчий за будь-яке золото, бо там, де вони врешті знайдуть спокій, віряни збиратимуться тисячами, щоб молитися й благоговіти перед ними. Де ж зберігатимуться ці святі останки?"
  holy_war.31.a: "Упокоїти їх у нашій столиці."
  holy_war.31.b: "Нести їх перед військом у битву."
  holy_war.31.b.tt: "Підвищує ревність у вірі [Concept('crusade', 'хрестового походу')|e] на #G 8#!"
  holy_war.32.title: "Обітниця хрестоносця"
  holy_war.32.desc: "Перед усім зібраним двором наш правитель став навколішки біля вівтаря та склав урочисту обітницю особисто прийняти хрест, повести вірян у саме серце священної війни й розділити всі тяготи та небезпеки виправи пліч-о-пліч із найпростішим пішим вояком. Це смілива й небезпечна клятва, і вся країна нині чекає на наше слово. Чи залишимо ми цю обітницю в силі?"
  holy_war.32.a: "Нехай наш правитель особисто очолить військо."
  holy_war.32.a.tt: "Підвищує ревність у вірі [Concept('crusade', 'хрестового походу')|e] на #G 5#!"
  holy_war.32.b: "Країні ліпше служити з трону."
  holy_war.33.title: "Християнський світ приймає хрест"
  holy_war.33.desc: "Могутня хвиля несамовитості у вірі захлиснула країну. Люди всякого стану рвуться нашити на свій одяг хрести й виступити на захист віри. Знатні лицарі та землевласники змагаються за честь іти в авангарді воїнства, а простий сільський люд береться за будь-яку зброю, яку тільки може знайти. Чия ревність послужить нам насамперед?"
  holy_war.33.a: "Скличемо під знамена лицарів і шляхту."
  holy_war.33.b: "Ми зберемо велике військо з простолюду."
  holy_war.34.title: "Суфійський шейх"
  holy_war.34.desc: "Шанований суфійський шейх [sufi_shaykh.GetName], чиї побожність і вченість відомі всьому мусульманському світові, прибув до нашого табору із загоном вірних послідовників. Його вечірні проповіді біля багаття розпалюють вогонь у серцях газі. Воїни, які ще вчора ледве переставляли ноги, сьогодні з палаючими очима міркують про мученицьку смерть. Як нам зустріти цю святу людину?"
  holy_war.34.a: "Наблизимо шейха до двору."
  holy_war.34.a.tt: "Збільшує ревність [Concept('jihad', 'джихаду')|e] на #G 5#!"
  holy_war.34.b: "Мандрівних містиків ліпше тримати подалі від двору."
  holy_war.34.b.tt: "Зменшує ревність [Concept('jihad', 'джихаду')|e] на #R 3#!"
  holy_war.35.title: "Газі вимагають свою частку"
  holy_war.35.desc: "Охочі, що поспішили відгукнутися на наш заклик, наполегливо вимагають обіцяної їм здобичі. Невдоволені воїни з юрмилися перед нашим наметом, викрикуючи свої вимоги, їхній терпець уривається. Вони кажуть, що билися за віру, але також за своїх дружин і дітей — а якщо вони так і залишаться з порожніми руками, то до наступного тяжкого бою наші лави можуть помітно порідшати. Як ми відповімо на їхні вимоги?"
  holy_war.35.a: "Поділимося з газі часткою здобичі."
  holy_war.35.a.tt: "Збільшує ревність [Concept('jihad', 'джихаду')|e] на #G 5#!"
  holy_war.35.b: "Здобич піде до військової скарбниці, а не до чиїхось кишень."
  holy_war.35.b.tt: "Зменшує ревність [Concept('jihad', 'джихаду')|e] на #R 3#!"
  holy_war.36.title: "Фетва правознавця"
  holy_war.36.desc: "Впливовий правознавець, чию думку поважають в усій #italic уммі#!, оприлюднив #italic фетву#!, у якій оголосив священну війну священним обов'язком кожного вірянина, здатного тримати зброю. Якщо доручити писарям зробити сотні списків і розіслати їх по мечетях, то вся умма сповниться ревності й забажає підтримати нашу справу. Чи поширюватимемо ми цю фетву?"
  holy_war.36.a: "Нехай увесь світ дізнається про це рішення."
  holy_war.36.a.tt: "Збільшує ревність [Concept('jihad', 'джихаду')|e] на #G 8#!"
  holy_war.36.b: "Приймемо фетву з вдячністю, але без зайвого галасу."
  holy_war.36.b.tt: "Збільшує ревність [Concept('jihad', 'джихаду')|e] на #G 3#!"
  holy_war.37.title: "Добровольці з усієї умми"
  holy_war.37.desc: "Звістка про священну війну рознеслася далеко за межі наших земель, і тепер до місця збору прибувають загони охочих-газі з далеких мусульманських країв. Вони стомлені після довгої дороги, вкриті порохом, але сповнені рішучості. Вони просять лише про одне: дозволити їм стати до лав і битися з ворогом. Звісно, нам доведеться годувати чимало зайвих ротів, але разом із ними ми отримаємо безліч клинків, що рвуться до бою. Чи приймемо ми їх до свого війська?"
  holy_war.37.a: "Приймемо добровольців з відкритими обіймами."
  holy_war.37.a.tt: "Збільшує ревність [Concept('jihad', 'джихаду')|e] на #G 3#!"
  holy_war.37.b: "Ми не зможемо прогодувати всіх мандрівних шаленців віри."
  holy_war.38.title: "Священне знамено"
  holy_war.38.desc: "До наших рук передали давнє військове знамено. За переказами, воно майоріло над лавами воїнів істинної віри за днів її перших перемог над невірними. І хай тканина його вицвіла й зотліла від часу, сам його вигляд будить у серцях вірян праведний гнів, а вояки клянуться без вагань рушити вслід за ним назустріч будь-якій небезпеці. Як ми розпорядимося цією безцінною реліквією?"
  holy_war.38.a: "Хай це знамено поведе наше військо в бій."
  holy_war.38.a.tt: "Збільшує ревність [Concept('jihad', 'джихаду')|e] на #G 5#!"
  holy_war.38.b: "Такий скарб слід ретельно оберігати."
  sacred_war_banner: "Священне знамено"
  sacred_war_banner_desc: "Це вицвіле та зотліле від часу військове знамено, під яким віряни, за переказами, здобули свої перші перемоги. Віднині воно вважається найвеличнішою святинею країни та виноситься лише на найурочистіші свята, щоб пробудити у вірних праведний запал."
  holy_war.39.title: "Пропозицію кафедри прийнято"
  holy_war.39.desc: "[cardinal_candidate.GetName] погоди[cardinal_candidate.Custom('end_vlaloly')]ся на нашу пропозицію щодо кардинальської кафедри та прийня[cardinal_candidate.Custom('end_vlaloly')] хрест, пообіцявши, що об’єднання «[cardinal_io.GetName]» отримає їхню допомогу. Будемо сподіватися, що серед духовенства цієї країни знайдеться хтось, гідний високого звання князя Церкви."
  holy_war.39.a: "Deo gratias! («Подяка Богові!»)"
  holy_war.40.title: "Пропозицію кафедри відкинуто"
  holy_war.40.desc: "[cardinal_candidate.GetName] не прийня[cardinal_candidate.Custom('end_vlaloly')] нашої пропозиції щодо кардинальської кафедри. Отже, об’єднання «[cardinal_io.GetName]» обійдеться без їхньої участи, а цю честь буде запропоновано іншій країні."
  holy_war.40.a: "Ну що ж, нехай."
  holy_war.41.title: "Наше визнання прийнято"
  holy_war.41.desc: "[recognition_candidate.GetName] прийня[recognition_candidate.Custom('end_vlaloly')] нашу обіцянку визнання та пообіця[recognition_candidate.Custom('end_vlaloly')] приєднатися до боротьби проти невірних. Об’єднання «[recognition_io.GetName]» отримає їхню допомогу."
  holy_war.41.a: "Аллах великий!"
  holy_war.42.title: "Наше визнання відкинуто"
  holy_war.42.desc: "[recognition_candidate.GetName] знехтува[recognition_candidate.Custom('end_vlaloly')] нашою обіцянкою визнання. Отже, об’єднання «[recognition_io.GetName]» обійдеться без їхньої участи, але щирі віряни запам’ятають, хто відвернувся від них у скрутну годину."
  holy_war.42.a: "Ну що ж, нехай."