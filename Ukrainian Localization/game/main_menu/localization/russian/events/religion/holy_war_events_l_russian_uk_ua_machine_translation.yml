l_russian:
  holy_war.1.title: "Заклик до священної війни"
  holy_war.1.desc: "До двору прибули проповідники. Охриплими від шалу віри голосами вони закликають усіх правовірних узятися до зброї та виступити проти #ONCLICK:COUNTRY,[preach_io.GetTarget.GetKey] #TOOLTIP:COUNTRY,[preach_io.GetTarget.GetKey],X [preach_io.GetTarget.Custom('CL_GEN')|L]#!#!. Усі погляди звернені на нас. Чи відповімо ми на заклик?"
  holy_war.1.a: "Ми станемо до боротьби!"
  holy_war.1.b: "Не цього разу."
  holy_war.2.title: "Збір на священну війну"
  holy_war.2.desc: "До нас із проханням прибули посланці [levy_leader.Custom('longname_ua_GEN')]. Об’єднання «[levy_io.GetName]» веде священну війну проти #ONCLICK:COUNTRY,[levy_io.GetTarget.GetKey] #TOOLTIP:COUNTRY,[levy_io.GetTarget.GetKey],X [levy_io.GetTarget.Custom('CL_GEN')|L]#!#!, і війна ця коштує недешево. Ми їхні брати у вірі, тому нас просять наповнити їхню спустілу скарбницю. Чи готові ми відчинити свою скарбницю заради святої справи?"
  holy_war.2.a: "Сплатимо невелику суму."
  holy_war.2.b: "Ми щедро підтримаємо їх коштами."
  holy_war.2.c: "Краще самі приєднаймося до війни."
  holy_war.2.d: "Наша країна не стане оплачувати чужі війни!"
  holy_war.2.d.tt: "Кожен учасник об’єднання «[levy_io.GetName]» отримає модифікатор #R «Ухилилися від священної війни»#! до думки про нас"
  holy_war.3.title: "Наш люд навертають!"
  holy_war.3.desc: "На землях, які відібрав у нас ворог, селами ходять чужі священники й погрозами змушують наших одновірців зріктися віри батьків. Звістки про кожен випадок навернення доходять до нашого двору, і ми не скоро забудемо ці злочини."
  holy_war.3.a: "Вони поплатяться за це!"
  holy_war.3.a.tt: "Ми не станемо боротися з примусовим наверненням"
  holy_war.4.title: "Докір від вірян"
  holy_war.4.desc: "Провідник священної війни заявляє, що ми ухиляємося від виконання священного обов’язку. Якщо не довести свою відданість справі віри, це може мати важкі наслідки. Що ми відповімо?"
  holy_war.4.a: "Подвоїмо наші зусилля."
  holy_war.4.a.tt: "Провідник священної війни дає нам #G 2 роки#! на те, щоб показати себе. Якщо до цього часу ступінь нашої участи у війні збільшиться, віряни будуть задоволені — а якщо ні, доведеться за це відповісти."
  holy_war.4.b: "Ми нікому не підкоряємося!"
  holy_war.6.title: "Віряни втішені"
  holy_war.6.desc: "Звістки про нашу ревність на полях священної війни розійшлися світом, і тепер духовні провідники вірян із вдячністю згадують нас у молитвах. Їхні сумніви змінилися прихильністю."
  holy_war.6.a: "#italic Deus vult#!."
  holy_war.6.a.muslim: "#italic Allāhu akbar#!."
  holy_war.20.title: "Віряни невдоволені"
  holy_war.20.desc: "Час, відведений на виконання клятви, минув, а ми так і не зробили нічого, щоб виконати її. Провідники священної війни не забули про дані їм обіцянки, і тепер на нас чекає суворий осуд."
  holy_war.20.a: "Доведеться прийняти їхній суворий суд."
  holy_war.7.title: "Відповідь на заклик"
  holy_war.7.desc: "[preach_target.GetName] прислуха[preach_target.Custom('end_vlaloly')]ся до наших проповідей і приєдна[preach_target.Custom('end_vlaloly')]ся до священної війни, пообіцявши виділити вояків і пожертвувати кошти заради святої справи. Ще один меч покидає піхви в ім’я віри. Наше військо росте на очах."
  holy_war.7.a: "Вірні збираються на війну."
  holy_war.8.title: "Заклик відкинуто"
  holy_war.8.desc: "[preach_target.GetName] залиши[preach_target.Custom('end_vlaloly')]ся глух[preach_target.Custom('end_yiaei')] до наших проповідей і відмови[preach_target.Custom('end_vlaloly')]ся приєднуватися до священної війни. Віряни запам’ятають холодний прийом, з яким зіткнулися наші посланці."
  holy_war.8.a: "Нехай буде так."
  holy_war.8.a.tt: "Нашу пропозицію знехтувано"
  holy_war.9.title: "Пропозиція кардинальської кафедри"
  holy_war.9.desc: "Якщо ми погодимося прийняти хрест, [cardinal_offerer.GetName], провідник об’єднання «[cardinal_io.GetName]», обіця[cardinal_offerer.Custom('end_yeyut')] висвятити одного з наших прелатів на кардинала й заснувати для нього нову єпархію в нашій країні. Чи готові ми присвятити себе цій священній місії?"
  holy_war.9.a: "Ми приймаємо цю честь і приєднаємося до хрестового походу."
  holy_war.9.a.no_seat_tt: "У нас і так у кожному поселенні є по кардинальській кафедрі, слава країни для нас значно важливіша"
  holy_war.9.b: "Ми відмовляємося."
  holy_war.10.title: "Обіцянка визнання"
  holy_war.10.desc: "Якщо ми приєднаємося до священної війни проти невірних, [recognition_offerer.GetName], провідник об’єднання «[recognition_io.GetName]», обіця[recognition_offerer.Custom('end_yeyut')] визнати наш високий статус серед істинних вірян. Це не лише піднесе духовний авторитет країни, а й утвердить наше право на владу. Чи приймемо ми цю пропозицію?"
  holy_war.10.a: "Ми готові приєднатися до джихаду."
  holy_war.10.b: "Ми відмовляємося."
  holy_war.17.title: "Чудесне зцілення"
  holy_war.17.desc: "Охоплений гарячкою вояк, якого табірні лікарі вважали за крок до могили, несподівано підвівся з постелі цілком здоровим. Багато хто називає його одужання небесним втручанням, проте в маренні бідолаху мучили дивні й моторошні видіння, і тепер він переконаний, що то були віщування прийдешнього. У таборі з тривогою обговорюють його пророцтва. Як нам ліпше вчинити?"
  holy_war.17.a: "Оголосимо його одужання дивом, щоб підняти бойовий дух війська!"
  holy_war.17.a.muslim: "$holy_war.17.a$"
  holy_war.17.a.tt: "Збільшує ревність у вірі священної війни на #G 5#!"
  holy_war.17.b: "Зам’яти справу, доки він не посіяв паніку в таборі."
  holy_war.18.title: "Пал згасає"
  holy_war.18.desc: "Затяжне очікування важким тягарем лягає на військо. Палкі та щирі молитви змінилися звичним повторенням давно заучених слів, через найменші дрібниці в таборі спалахують сварки, а ночами біля багать знову розпалюються забуті чвари. Полум’я ревнощів, що спонукало вірян стати до святої справи, згасло й обернулося на холодний попіл. Якщо не розпалити його знову, військо розтане, навіть не ставши до бою. Як ми вчинимо?"
  holy_war.18.a: "Влаштуємо урочисту проповідь та учту для всього війська."
  holy_war.18.a.tt: "Збільшує ревність у вірі священної війни на #G 8#!"
  holy_war.18.b: "Віряни мусять знайти вогонь усередині себе."
  holy_war.18.b.tt: "Зменшує ревність у вірі священної війни на #R 5#! і відсуває підготовку назад на #R 5#!"
  holy_war.19.title: "Несамовитий проповідник"
  holy_war.19.desc: "До табору прибився мандрівний проповідник. В його очах жевріє безумство, вбрання зносилося від довгих блукань, а голос захрип від невпинних напучувань. Його палкі промови збирають цілі юрмища робітників, безземельних селян та іншого незаможного, але набожного люду, і всі вони рвуться негайно стати до бою в ім’я віри. Шаленство проповідника не знає меж, він геть некерований і не визнає влади знаті, яка командує походом. Що нам робити з цим баламутом?"
  holy_war.19.a: "Нехай розпалює вогонь у серцях вірян."
  holy_war.19.a.tt: "Збільшує ревність у вірі священної війни на #G 5#!"
  holy_war.19.b: "Вгамувати його, доки справа не дійшла до заворушень."
  holy_war.21.title: "Суперечка за здобич"
  holy_war.21.desc: "Місто ледве встигло впасти, а наші вояки та ратники союзного війська вже зчепилися за здобич. У вузьких провулках уже блищать ножі, намети перекинуті, а давні чвари між двома арміями от-от переростуть у справжнє побоїще. Якщо негайно не залагодити цю сварку, вчорашні побратими на радість ворогові обернуться на недругів, і тоді весь похід опиниться під загрозою. Що ж нам робити?"
  holy_war.21.a: "Наші люди заслужили цю здобич потом і кров’ю."
  holy_war.21.a.tt: "Зменшує ревність у вірі священної війни на #R 5#!"
  holy_war.21.b: "Ради всього святого, їх треба зупинити!"
  holy_war.21.b.tt: "Збільшує ревність у вірі священної війни на #G 5#!"
  holy_war.22.title: "Пошесть вражає військо"
  holy_war.22.desc: "Переповнений табір обложників охоплений згубною гарячкою, похмурими ранками з наметів виносять усе більше хворих, які впали в забуття. Військові лікарі намагаються лікувати їх кровопусканням, очищенням та молитвами, але недуга не відступає. Весь табір просякнув важким смородом тих, хто помирає, наше військо слабшає день у день, а ворожі мури й далі міцні. Як протистояти цій напасті?"
  holy_war.22.a: "Продовжуємо облогу, хоч би чого це коштувало."
  holy_war.22.b: "Дати війську перепочинок, доки хвороба не відступить."
  holy_war.22.b.tt: "Зменшує ревність священної війни на #R 5#!"
  holy_war.23.title: "Смерть героя"
  holy_war.23.desc: "[fallen_champion.GetName] [Select_CString(fallen_champion.IsFemale, 'загинула', 'загинув')] смертю хоробрих під час облоги [sieged_location.Custom('LR_GEN')|l] [sieged_location.GetName]. Звершивши безліч подвигів, які неодмінно оспівають у піснях, [Select_CString(fallen_champion.IsFemale, 'вона полягла', 'він поліг')] у запеклій сутичці на фортечному мурі. Загибель героя оплакують і гордовиті вельможі, і прості вояки. [Select_CString(fallen_champion.IsFemale, 'Її', 'Його')] кров кличе до помсти, і вояки рвуться до бою, щоб жорстоко відплатити супротивнику. Як ми вшануємо [Select_CString(fallen_champion.IsFemale, 'її', 'його')] смерть?"
  holy_war.23.a: "Ми шануватимемо [Select_CString(fallen_champion.IsFemale, 'її як мученицю, що загинула', 'його як мученика, що загинув')] за віру!"
  holy_war.23.a.tt: "Збільшує ревність священної війни на #G 10#!"
  holy_war.23.b: "Проведемо скромний обряд прощання."
  holy_war.23.b.tt: "Збільшує ревність священної війни на #G 3#!"
  holy_war.24.title: "Лицеміри в наших лавах"
  holy_war.24.desc: "Табором ширяться зловісні чутки. Подейкують, ніби серед вірян затесалися єретики та лицеміри: їхні молитви — порожнє вдавання, а відданість справі викликає неабиякі сумніви. Найпобожніші вимагають очистити від них лави святого вояцтва, доки їхньою отрутою не заразилося все військо. Інші закликають до поміркованости: клинок зостається клинком, хоч би якої віри тримався вояк у глибині душі. Як нам ліпше вчинити?"
  holy_war.24.a: "Лицемірам не місце в наших лавах!"
  holy_war.24.a.tt: "Збільшує ревність священної війни на #G 8#!"
  holy_war.24.b: "Ми заплющимо на це очі. І так кожен меч на ліку."
  holy_war.24.b.tt: "Зменшує ревність священної війни на #R 5#!"
  holy_war.25.title: "Побожний заповіт"
  holy_war.25.desc: "Один із найбагатших вельмож нашої країни нещодавно відійшов у засвіти, у своїй останній волі заповівши значну суму на справу священної війни. Виконавці його заповіту доправили до табору запечатані скрині із золотом, і ми можемо розпорядитися цими грошима на власний розсуд. Проте на золото претендують і командири, і духовенство, і біднота. Що ж нам робити з цим несподіваним багатством?"
  holy_war.25.a: "Ці гроші знадобляться в наших власних війнах."
  holy_war.25.b: "Передамо його до скарбниці священної війни."
  holy_war.25.b.tt: "Збільшує ревність священної війни на #G 3#!"
  holy_war.25.c: "Золото слід роздати як милостиню вірянам."
  holy_war.25.c.tt: "Збільшує ревність священної війни на #G 3#!"
  holy_war.27.title: "Підкуп вдався"
  holy_war.27.desc: "Срібло зробило свою справу — [desertion_member.GetName] прийня[desertion_member.Custom('end_vlaloly')] гроші та відмови[desertion_member.Custom('end_vlaloly')]ся від дальшої участи у виправі. Без зайвих фанфар [desertion_member.GetAdjectiveWithNoTooltip|l]і вояки згорнули знамена й під надуманим приводом поквапилися додому. Вкотре гроші зуміли купити те, чого годі було досягти як проповіддю, так і сталлю — одного з ворогів усунуто, а ворожі сили підірвано цим відходом. Це має нагадати нам про справжню ціну вірности."
  holy_war.27.a: "Зажерливість перемагає там, де меч безсилий."
  holy_war.27.a.tt: "[desertion_member.GetName] бер[desertion_member.Custom('end_eut')] гроші та поверта[desertion_member.Custom('end_yeyu')]ться додому. Об’єднання «[desertion_io.GetName]» втрачає важливого учасника"
  holy_war.28.title: "Наше срібло знехтувано"
  holy_war.28.desc: "[desertion_member.GetName] жен[desertion_member.Custom('end_eut')] з двору посланця, який доправив таємну пропозицію. Не спокусившись нашими грошима, неприятель заприсягся з подвоєними зусиллями вести війну далі. Гірше того, чутки про нашу спробу підкупу можуть сягнути чужих вух, і тоді ми вславимося безчесними шахраями в очах усього світу. Ця витівка принесла лише клопіт."
  holy_war.28.a: "Нехай буде так."
  holy_war.28.a.tt: "Вони відкинули хабар"
  holy_war.29.title: "Папський легат"
  holy_war.29.desc: "За наказом Його Святості до нас [Select_CString(papal_legate..IsFemale, 'прибула', 'прибув')] [papal_legate.GetName] — прелат і воїн, однаково [Select_CString(papal_legate..IsFemale, 'вправна', 'вправний')] як у військовій справі, так і в духовному служінні. [Select_CString(papal_legate..IsFemale, 'Їй', 'Йому')] велено очолити наше військо та показати всьому світові, що [holy_war.GetName] має повне сприяння з боку Рима. Легат стане цінним надбанням для нашого війська й допоможе зміцнити зв’язок зі Святим престолом, але не слід забувати, що відповіда[Select_CString(papal_legate..IsFemale, 'є вона', 'є він')] спершу перед папою, а вже потім перед нами. Чи потрібна нам [Select_CString(papal_legate..IsFemale, 'її', 'його')] поміч?"
  holy_war.29.a: "Ми раді прийняти легата під наші знамена."
  holy_war.29.a.tt: "Збільшує [Concept('zeal', 'ревність')|e] [Concept('crusade', 'хрестового походу')|e] на #G 5#!"
  holy_war.29.b: "Подякуємо [Select_CString(papal_legate..IsFemale, 'їй', 'йому')] та відправимо назад до Рима."
  holy_war.30.title: "Торговці індульгенціями"
  holy_war.30.desc: "Зачувши нагоду поживитися, табір заполонили торговці індульгенціями. Вони накидаються на вояків немов стерв’ятники на падло, переконуючи їх віддати останні гроші в обмін на відпущення гріхів та освячені дрібнички. Що більше прибутку приносить цей промисел, то дужче ремствують найпобожніші з воїнів — їм здається, що продаж індульгенцій паплюжить нашу священну справу. Проте без грошей нам не обійтися, бо жодна священна війна не вигравалася однією лише молитвою. Як нам учинити?"
  holy_war.30.a: "Їхнє срібло поповнить військову скарбницю."
  holy_war.30.a.tt: "Зменшує [Concept('zeal', 'ревність')|e] [Concept('crusade', 'хрестового походу')|e] на #R 3#!"
  holy_war.30.b: "Таємно переправимо гроші до нашої власної скарбниці."
  holy_war.30.b.tt: "Зменшує [Concept('zeal', 'ревність')|e] [Concept('crusade', 'хрестового походу')|e] на #R 5#!"
  holy_war.30.c: "Вигнати шахраїв із табору!"
  holy_war.30.c.tt: "Збільшує [Concept('zeal', 'ревність')|e] [Concept('crusade', 'хрестового походу')|e] на #G 5#!"
  holy_war.31.title: "Мощі святого"
  holy_war.31.desc: "Вдячні ченці подолали довгий і небезпечний шлях, щоб привезти до нашого двору кістки шанованого святого. Подібні реліквії коштовніші за будь-які гроші — коли вони врешті знайдуть прихисток, тисячі вірян потягнуться до місця їхнього спочинку, щоб знести молитви та вклонитися святині. Що ми зробимо з мощами?"
  holy_war.31.a: "Упокоїти їх у нашій столиці."
  holy_war.31.b: "Нести їх перед військом у битву."
  holy_war.31.b.tt: "Підвищує ревність у вірі [Concept('crusade', 'хрестового походу')|e] на #G 8#!"
  holy_war.32.title: "Обітниця хрестоносця"
  holy_war.32.desc: "Перед усім зібраним двором наш правитель став навколішки біля вівтаря та склав урочисту обітницю особисто прийняти хрест, повести вірян у саме серце священної війни й розділити всі тяготи та небезпеки виправи пліч-о-пліч із найпростішим пішим вояком. Це смілива й небезпечна клятва, і вся країна нині чекає на наше слово. Чи залишимо ми цю обітницю в силі?"
  holy_war.32.a: "Нехай наш правитель особисто очолить військо."
  holy_war.32.a.tt: "Підвищує ревність у вірі [Concept('crusade', 'хрестового походу')|e] на #G 5#!"
  holy_war.32.b: "Країні ліпше служити з трону."
  holy_war.33.title: "Християнський світ приймає хрест"
  holy_war.33.desc: "Могутня хвиля несамовитості у вірі захлиснула країну. Люди всякого стану рвуться нашити на свій одяг хрести й виступити на захист віри. Знатні лицарі та землевласники змагаються за честь іти в авангарді воїнства, а простий сільський люд береться за будь-яку зброю, яку тільки може знайти. Чия ревність послужить нам насамперед?"
  holy_war.33.a: "Скличемо під знамена лицарів і шляхту."
  holy_war.33.b: "Ми зберемо велике військо з простолюду."
  holy_war.34.title: "Суфійський шейх"
  holy_war.34.desc: "Шанований суфійський шейх [sufi_shaykh.GetName], чиї побожність і вченість відомі всьому мусульманському світові, прибув до нашого табору із загоном вірних послідовників. Його вечірні проповіді біля багаття розпалюють вогонь у серцях газі. Воїни, які ще вчора ледве переставляли ноги, сьогодні з палаючими очима міркують про мученицьку смерть. Як нам зустріти цю святу людину?"
  holy_war.34.a: "Наблизимо шейха до двору."
  holy_war.34.a.tt: "Збільшує ревність [Concept('jihad', 'джихаду')|e] на #G 5#!"
  holy_war.34.b: "Мандрівних містиків ліпше тримати подалі від двору."
  holy_war.34.b.tt: "Зменшує ревність [Concept('jihad', 'джихаду')|e] на #R 3#!"
  holy_war.35.title: "Газі вимагають свою частку"
  holy_war.35.desc: "Охочі, що поспішили відгукнутися на наш заклик, наполегливо вимагають обіцяної їм здобичі. Невдоволені воїни з юрмилися перед нашим наметом, викрикуючи свої вимоги, їхній терпець уривається. Вони кажуть, що билися за віру, але також за своїх дружин і дітей — а якщо вони так і залишаться з порожніми руками, то до наступного тяжкого бою наші лави можуть помітно порідшати. Як ми відповімо на їхні вимоги?"
  holy_war.35.a: "Поділимося з газі часткою здобичі."
  holy_war.35.a.tt: "Збільшує ревність [Concept('jihad', 'джихаду')|e] на #G 5#!"
  holy_war.35.b: "Здобич піде до військової скарбниці, а не до чиїхось кишень."
  holy_war.35.b.tt: "Зменшує ревність [Concept('jihad', 'джихаду')|e] на #R 3#!"
  holy_war.36.title: "Фетва правознавця"
  holy_war.36.desc: "Впливовий правознавець, чию думку поважають в усій #italic уммі#!, оприлюднив #italic фетву#!, у якій оголосив священну війну священним обов'язком кожного вірянина, здатного тримати зброю. Якщо доручити писарям зробити сотні списків і розіслати їх по мечетях, то вся умма сповниться ревності й забажає підтримати нашу справу. Чи поширюватимемо ми цю фетву?"
  holy_war.36.a: "Нехай увесь світ дізнається про це рішення."
  holy_war.36.a.tt: "Збільшує ревність [Concept('jihad', 'джихаду')|e] на #G 8#!"
  holy_war.36.b: "Приймемо фетву з вдячністю, але без зайвого галасу."
  holy_war.36.b.tt: "Збільшує ревність [Concept('jihad', 'джихаду')|e] на #G 3#!"
  holy_war.37.title: "Добровольці з усієї умми"
  holy_war.37.desc: "Звістка про священну війну рознеслася далеко за межі наших земель, і тепер до місця збору прибувають загони охочих-газі з далеких мусульманських країв. Вони стомлені після довгої дороги, вкриті порохом, але сповнені рішучості. Вони просять лише про одне: дозволити їм стати до лав і битися з ворогом. Звісно, нам доведеться годувати чимало зайвих ротів, але разом із ними ми отримаємо безліч клинків, що рвуться до бою. Чи приймемо ми їх до свого війська?"
  holy_war.37.a: "Приймемо добровольців з відкритими обіймами."
  holy_war.37.a.tt: "Збільшує ревність [Concept('jihad', 'джихаду')|e] на #G 3#!"
  holy_war.37.b: "Ми не зможемо прогодувати всіх мандрівних шаленців віри."
  holy_war.38.title: "Священне знамено"
  holy_war.38.desc: "До наших рук передали давнє військове знамено. За переказами, воно майоріло над лавами воїнів істинної віри за днів її перших перемог над невірними. І хай тканина його вицвіла й зотліла від часу, сам його вигляд будить у серцях вірян праведний гнів, а вояки клянуться без вагань рушити вслід за ним назустріч будь-якій небезпеці. Як ми розпорядимося цією безцінною реліквією?"
  holy_war.38.a: "Хай це знамено поведе наше військо в бій."
  holy_war.38.a.tt: "Збільшує ревність [Concept('jihad', 'джихаду')|e] на #G 5#!"
  holy_war.38.b: "Такий скарб слід ретельно оберігати."
  sacred_war_banner: "Священне знамено"
  sacred_war_banner_desc: "Це вицвіле та зотліле від часу військове знамено, під яким віряни, за переказами, здобули свої перші перемоги. Віднині воно вважається найвеличнішою святинею країни та виноситься лише на найурочистіші свята, щоб пробудити у вірних праведний запал."
  holy_war.39.title: "Пропозицію кафедри прийнято"
  holy_war.39.desc: "[cardinal_candidate.GetName] погоди[cardinal_candidate.Custom('end_vlaloly')]ся на нашу пропозицію щодо кардинальської кафедри та прийня[cardinal_candidate.Custom('end_vlaloly')] хрест, пообіцявши, що об’єднання «[cardinal_io.GetName]» отримає їхню допомогу. Будемо сподіватися, що серед духовенства цієї країни знайдеться хтось, гідний високого звання князя Церкви."
  holy_war.39.a: "Deo gratias! («Подяка Богові!»)"
  holy_war.40.title: "Пропозицію кафедри відкинуто"
  holy_war.40.desc: "[cardinal_candidate.GetName] не прийня[cardinal_candidate.Custom('end_vlaloly')] нашої пропозиції щодо кардинальської кафедри. Отже, об’єднання «[cardinal_io.GetName]» обійдеться без їхньої участи, а цю честь буде запропоновано іншій країні."
  holy_war.40.a: "Най буде так."
  holy_war.41.title: "Наше визнання прийнято"
  holy_war.41.desc: "[recognition_candidate.GetName] прийня[recognition_candidate.Custom('end_vlaloly')] нашу обіцянку визнання та пообіця[recognition_candidate.Custom('end_vlaloly')] приєднатися до боротьби проти невірних. Об’єднання «[recognition_io.GetName]» отримає їхню допомогу."
  holy_war.41.a: "Аллах великий."
  holy_war.42.title: "Наше визнання відкинуто"
  holy_war.42.desc: "[recognition_candidate.GetName] знехтува[recognition_candidate.Custom('end_vlaloly')] нашою обіцянкою визнання. Отже, об’єднання «[recognition_io.GetName]» обійдеться без їхньої участи, але щирі віряни запам’ятають, хто відвернувся від них у скрутну годину."
  holy_war.42.a: "Най буде так."