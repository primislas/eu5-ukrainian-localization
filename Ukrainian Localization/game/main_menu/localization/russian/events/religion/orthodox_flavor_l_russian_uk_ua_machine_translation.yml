l_russian:
  orthodox_flavor.1.title: "Рух нестяжателів"
  orthodox_flavor.1.desc: "Бувши великим землевласником, церква накопичила чималі багатства. Нестяжателі кажуть, що це вводить її у гріх, а їхні опоненти стверджують, що майно потрібне їй для служіння Богу. Але найголовніше, що церква практично не платить податей, а якщо її землі перейдуть у приватні руки, ми зможемо обкласти їх податками та поповнити скарбницю. З іншого боку, в такому разі церква матиме менше коштів на звершення богоугодних справ."
  orthodox_flavor.1.a: "Підтримаємо церковну владу."
  orthodox_flavor.1.b: "Підтримаємо нестяжателів."
  orthodox_flavor.2.title: "Великий синод"
  orthodox_flavor.2.desc: "Церква зібрала великий синод, щоб просити нас про підтримку та привілеї в обмін на допомогу в боротьбі з антифеодальними єресями, що спалахнули в наших землях. Що буде краще для нас: дозволити їй і далі тримати народ у вузді чи, навпаки, підтримати нові віяння, щоб зламати старий феодальний порядок?"
  orthodox_flavor.2.a: "Надамо привілеї."
  orthodox_flavor.2.b: "Церква не залежить від країни."
  orthodox_flavor.3.title: "Літургійна реформа"
  orthodox_flavor.3.desc: "Східна православна церква є єдиною, святою, соборною та апостольською церквою, заснованою Господом Ісусом Христом та Його апостолами. Однак її родина численна та різноманітна. Патріарх запропонував реформувати нашу літургію, щоб формально наблизити її до інших церков. Ця смілива ідея могла б посилити нашу церкву, але ми розуміємо, що забобонні ретрогради не приймуть її."
  orthodox_flavor.3.a: "Підтримаємо реформу."
  orthodox_flavor.3.b: "Продовжимо дотримуватися старих звичаїв"
  orthodox_flavor.4.title: "Зменшення незалежності церкви"
  orthodox_flavor.4.desc: "Церква є могутнім і насамперед багатим інститутом. Обмеживши її незалежність і більшою мірою включивши її до складу країни, ми зможемо збільшити податкові надходження. З іншого боку, таке рішення знизить авторитет церкви в очах народу."
  orthodox_flavor.4.a: "Захистимо незалежність церкви."
  orthodox_flavor.4.b: "Утихомиримо їх."
  orthodox_flavor.5.title: "Нерукоположені церковні чиновники?"
  orthodox_flavor.5.desc: "Призначаючи нерукоположених членів церковної адміністрації та розширюючи їхні повноваження, ми зможемо домогтися певного контролю над церквою. З іншого боку, це може підірвати моральний авторитет церкви в очах народу."
  orthodox_flavor.5.a: "Не будемо втручатися у справи церкви."
  orthodox_flavor.5.b: "Призначимо церковних чиновників."
  orthodox_flavor.6.title: "Синод про державні справи"
  orthodox_flavor.6.desc: "$orthodox_flavor_synod_prev_string$ Цей синод обговорюватиме державні справи."
  orthodox_flavor.6.a: "Його рішення будуть корисні центральній владі."
  orthodox_flavor.6.b: "Нам потрібно стабілізувати внутрішню політику."
  orthodox_flavor.6.c: "Нам слід підвищити свою міжнародну славу."
  orthodox_flavor_synod_prev_string: "Дотримуючись заповітів наших праотців та вищих ієрархів православної церкви, ми скликаємо синод для розгляду питань, що стосуються вдосконалення нашого законодавства. Багато видатних #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L священників#!#! нашої країни прибудуть на нього, щоб вислухати та затвердити винесений на ньому вердикт."
  orthodox_flavor.7.title: "Синод про церковні справи"
  orthodox_flavor.7.desc: "$orthodox_flavor_synod_prev_string$ Цей синод обговорюватиме справи церкви."
  orthodox_flavor.7.a: "Нам слід подбати про те, щоб [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] отрима[ROOT.GetCountry.Custom('clergy_vlaloly')] більше привілеїв."
  orthodox_flavor.7.b: "Нам слід організувати справедливе оподаткування духовних осіб."
  orthodox_flavor.8.title: "Синод про місцеві справи"
  orthodox_flavor.8.desc: "$orthodox_flavor_synod_prev_string$ Цей синод обговорюватиме місцеві справи наших регіонів."
  orthodox_flavor.8.a: "Ми повинні дбати про всіх людей."
  orthodox_flavor.8.b: "Ми повинні приділяти більше сил наверненню іновірців."
  orthodox_flavor.8.c: "Дозволивши вивчення чужоземних книг, ми розширимо свої обрії пізнання…"
  orthodox_flavor.9.title: "Синод про справи ради"
  orthodox_flavor.9.desc: "$orthodox_flavor_synod_prev_string$ Цей синод обговорюватиме питання, що стосуються нашої ради."
  orthodox_flavor.9.a: "Забезпечити дієву роботу ради."
  orthodox_flavor.9.b: "Посилимо дослідницький потенціал."
  orthodox_flavor.9.c: "Розширимо адміністративний апарат."
  orthodox_flavor.10.title: "Синод про зовнішню політику"
  orthodox_flavor.10.desc: "$orthodox_flavor_synod_prev_string$ Цей синод обговорюватиме нашу зовнішню політику."
  orthodox_flavor.10.a: "Підготуємо закони про посольства."
  orthodox_flavor.10.b: "Узаконимо війни проти невірних."
  orthodox_flavor.11.title: "Пентархія"
  orthodox_flavor.11.desc: "Повернувши всі п'ять патріархатів у лоно православного християнства, ми відродили давню Пентархію і фактично покінчили з Великою схизмою. Хоча в деяких країнах, як і раніше, зберігається #TOOLTIP:RELIGION,$catholic_tt$,X #L католицтво#!#!, [GetCountry('PAP').GetFlavorRank|l] втратив свій статус єдиного законного наступника Святого Петра та Єпископа Римського."
  orthodox_flavor.11.a: "Рана загоїлася!"
  orthodox_flavor.100.title: "Синод [GetCurrentYear] року"
  orthodox_flavor.100.desc: "Якщо ми хочемо зберегти свої православні традиції, нашій країні слід приділяти особливу увагу справам церкви. Для вирішення нагальних питань та визначення спільних духовних пріоритетів ми негайно скличемо святійший #TOOLTIP:GENERIC_ACTION,orthodox_synod,X #L православний синод#!#!."
  orthodox_flavor.100.a: "Обговоримо внутрішні справи."
  orthodox_flavor.100.b: "Вирішимо питання, що стосуються церкви."
  orthodox_flavor.100.c: "Вивчимо книги місцевої адміністрації."
  orthodox_flavor.100.d: "Переглянемо організацію нашої ради."
  orthodox_flavor.100.e: "Настав час знову оцінити нашу зовнішню політику."
  orthodox_flavor.101.title: "Прибуття делегації патріарха"
  orthodox_flavor.101.desc: "Делегація патріарха прибула до #L #TOOLTIP:LOCATIONRANK,[target_location.Custom('LR_tt')],X [target_location.Custom('LR_GEN')|l]#!#! [target_capital.GetName], мандрує його вулицями і куштує місцеві харчі. Людей змушує юрмитися навколо цієї процесії не лише звичайна цікавість, а й надія виклопотати щось для себе.\n\nПісля прогулянки делегацію нарешті провели до двору, де ми збираємося влаштувати її представникам розкішний бенкет, а також обговоримо різні питання віри та державного управління. Можливо, нам вдасться спрямувати розмову в бік своїх конкретних інтересів і тим самим схилити делегатів до наших поглядів."
  orthodox_flavor.101.a: "Нам потрібно масово хрестити людей, щоб поширювати славу Божу."
  orthodox_flavor.101.b: "Нам потрібно більше церковних установ."
  orthodox_flavor.101.c: "Давайте просто покажемо їм, яка в нас чудова країна."
  orthodox_flavor.101.d: "Віра також може привести більше людей до лав нашого війська."
  orthodox_flavor.101.e: "Зараз час для миру, спокою та роздумів."