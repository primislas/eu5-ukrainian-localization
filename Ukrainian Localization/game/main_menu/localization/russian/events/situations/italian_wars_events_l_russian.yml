l_russian:
 italian_wars.1.title: "Итальянские войны"
 italian_wars.1.desc.a: "#TOOLTIP:REGION,italy_region,X #L Италия#!#! в опасности. Закулисные игры и бесконечные интриги других крупных держав привели к беспрецедентным дипломатическим последствиям. Вражеские силы хотят отобрать нашу власть и влияние на полуострове. В это опасное время мы должны действовать без колебаний. Победа над Италией обеспечит нам место среди великих держав."
 italian_wars.1.desc.b: "В #TOOLTIP:REGION,italy_region,X #L Италию#!#! пришла война. Иностранные завоеватели вторглись на нашу землю, желая прибрать к рукам наши несметные богатства. Великие державы кружат над полуостровом, словно стая голодных стервятников. Такого не было никогда в истории нашего региона. Нашим людям пора взять в руки мечи и щиты, чтобы защитить нашу свободу и положить конец экспансии чужаков..."
 italian_wars.1.a: "Жребий брошен."
 italian_wars.1.b: "Объединимся [GetUniqueInternationalOrganization('foreign_league_hre').GetLeaderCountry.Custom('end_predlog_sso')] [GetUniqueInternationalOrganization('foreign_league_hre').GetLeaderCountry.Custom('CL_INST')]!"
 italian_wars_explanation_tooltip1: "В эти времена государства Италии смогут получить защиту, присоединившись к #italic  итальянской лиге#!.\n"
 italian_wars_explanation_tooltip2: "Другие державы могут создавать #italic  иностранные лиги#!, чтобы расширить своё влияние в регионе.\n"
 italian_wars_explanation_tooltip3: "[Concept('rivals', 'Соперники')|e] и [Concept('enemies', 'враги')|e] лидеров #italic  иностранных лиг#! могут помочь #italic  итальянской лиге#!, вступив в войну или предоставив нужные средства и людей\n"
 italian_wars_explanation_tooltip4: "Лидеры всех лиг получают доступ к [Concept('peace_treaty', 'мирному договору')|e] «[ShowPeaceTreatyTypeName('dissolve_league_peace_deal')]»"
 iw_italian_league_merc_efficiency_tt: "Мы участвуем в #italic итальянской лиге#!, поэтому наша #TOOLTIP:MODIFIER_TYPE,mercenary_maintenance_efficiency,X #P #V эффективность содержания наёмников#!#!#! зависит от количества итальянских районов под контролем этой лиги. При максимальном значении (#Y 301#! район) прибавка может достигать #G 33%#!."
 italian_wars.1.historical_info: "Итальянские войны (1494–1559) — это серия военных конфликтов между Францией и Испанией за обладание Италией, в которых так или иначе участвовала значительная часть европейских стран. Всё началось, когда французский король Карл VIII вторгся в Италию в 1494 году и захватил Неаполь. Однако католические короли Испании Максимилиан I Габсбург, Изабелла Кастильская и Фердинанд Арагонский пришли на помощь папе и изгнали французов. В 1499 году французский король снова взял Милан, Геную и Неаполь, но Испания прогнала его из Неаполя в 1503 году, утвердив свою власть над Южной Италией, а папа Юлий II создал альянс, чтобы изгнать французов из Северной Италии. Несколько лет спустя французский король Франциск I заявил свои претензии на Милан, и город был взят в 1515 году, но в 1525 году Франциск проиграл решающую битву при Павии императору Карлу V, также известному как король Испании Карлос I, и был взят в плен. После формального отказа от всех притязаний на итальянские территории Франциск I был освобождён, но затем заключил союз с Англией, папой, Венецией и Флоренцией, что привело разграблению Рима немецкими ландскнехтами Карла V в 1527 году, заключению мира с папой и коронации Карла V в Болонье в 1529 году. Итальянские войны завершились подписанием Като-Камбрезийского мира в 1559 году, после чего испанские Габсбурги оставались доминирующей силой в Италии на протяжении 150 лет."
 italian_wars.20.title: "Выплаты кондотьеру"
 italian_wars.20.desc.a: "[target_character.GetName], капитан отряда «[target_merc.GetName]», приостанавливает своё продвижение и отправляет нам послание с требованием пересмотреть условия [Select_CString(target_character.IsFemale, 'её', 'его')] контракта. Кампания вышла далеко за рамки оговорённого, и без дополнительного вознаграждения [target_character.GetShortNameWithNoTooltip] не сдвинется с места.\n\nЕсли мы выполним это требование, наёмники останутся у нас в услужении. Если мы ответим отказом, возможно, [target_character.GetShortNameWithNoTooltip] уведёт своих бойцов прочь прямо в разгар кампании."
 italian_wars.20.desc.b: "В отряде «[target_merc.GetName]» растёт беспокойство. Представители наёмников прибыли в наш лагерь и потребовали пересмотреть изначальные условия договора. Капитана на роль переговорщика не нашлось, поэтому требование выдвигается от лица всей группы. Будущее кампании пока что туманно, и эти воины важны для нас.\n\nМы должны определиться с ответом, пока у членов отряда «[target_merc.GetNameWithNoTooltip]» не кончилось терпение."
 italian_wars.20.desc.c: "Воины из отряда «[target_merc.GetName]» отправляют послание с требованием пересмотреть условия контракта. Кампания длится дольше, чем они рассчитывали, и без дополнительного вознаграждения они, скорее всего, просто откажутся от службы.\n\nНам нужно определиться, что хуже: непредвиденные расходы или риск потерять солдат."
 italian_wars.20.a: "Мы выполним их требования."
 italian_wars.20.b: "Мы не станем менять условия."
 italian_wars.20.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] лично проведёт эти переговоры."
 mercs_among_the_ranks_of_target_merc_are_reigned_in_tt: "Отряд принимает новые условия, такого больше не повторится"
 mercs_extract_coin_and_supplies_from_the_land_tt: "Наёмники собирают деньги и припасы в наших районах"
 target_province_loses_prosperity_extreme_penalty_tt: "Каждый [Concept('location', 'район')|e] в провинции [target_province.GetName] получает [ShowNamedValue('prosperity_extreme_penalty')|+=2%] к [Concept('prosperity', 'процветанию')|e]"
 italian_wars.21.title: "Закалённые воины"
 italian_wars.21.desc: "Бойцы из армии «[target_army.GetName]», закалённые в жестоких боях итальянского конфликта, возвращаются домой. Сейчас они расположились в [target_location.Custom('LR_PREP')|l] [target_location.GetName]. Офицеры рассказывают, что их люди прошли через настоящее горнило войны, отточив реакцию и добившись слаженности, которую невозможно достичь одними тренировками.\n\nКак мы воспользуемся их опытом? Это решение определит судьбу нашей армии на годы вперёд."
 italian_wars.21.a: "Не будем их разлучать. Их сила — в сплочённости."
 italian_wars.21.b: "Их доблесть олицетворяет дух всего нашего народа."
 italian_wars.21.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] будет курировать учения ветеранов."
 italian_wars.22.title: "Проблема дезертирства"
 italian_wars.22.desc: "Затяжной конфликт в #TOOLTIP:REGION,italy_region,X #L Италии#!#! изнурил наших воинов. [ROOT.GetCountry.GetGovernment.GetCourtTitle] получает сообщения о том, что они всё чаще оставляют свои посты: одни просто устали, другие пали духом и разуверились в целях борьбы. Представители сословий тоже начали открыто выражать недовольство, нам может грозить бунт.\n\nНужно как-то повлиять на эту опасную ситуацию, пока она не вышла из-под контроля. Мы можем наказать дезертиров и таким образом напомнить всем, кто сомневается, что бойцам не положено отступать. Либо мы можем положиться на свой авторитет и самоотверженно продемонстрировать пример настоящей преданности, требуя того же самого от других."
 italian_wars.22.a: "Все они — трусы и предатели."
 italian_wars.22.b: "Ни шагу назад! Мы выстоим."
 italian_wars.23.title: "Генерал-перебежчик"
 italian_wars.23.desc: "Нас беспокоит, что командир из армии «[target_army.GetName]» по имени [target_character2.GetName] проявляет излишний пиетет к иностранным силам. Ходят слухи, будто [target_character2.GetShortNameWithNoTooltip] всерьёз обдумывает предложения наших врагов, и [Select_CString(target_character2.IsFemale, 'её', 'его')] действия в ходе кампании это лишь подтверждают.\n\n[target_character1.GetName] [Select_CString(target_character1.IsFemale, 'должна', 'должен')] что-то предпринять, пока тихое недовольство не переросло в открытое неповиновение."
 italian_wars.23.a: "Вон из наших рядов, [Select_CString(target_character2.IsFemale, 'предательница', 'предатель')]!"
 italian_wars.23.b: "За лояльность нужно платить. И мы это сделаем."
 italian_wars.23.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] поставит [Select_CString(target_character2.IsFemale, 'негодяйку', 'негодяя')] на место."
 target_character2_wont_attempt_to_flee_for_10_years_tt: "[target_character2.GetShortNameWithNoTooltip] не предпримет попыток переметнуться ещё #Y 10#! лет"
 italian_wars.24.title: "Раскол среди союзников"
 italian_wars.24.desc: "В объединении «[target_io.GetNameWithNoTooltip]» полыхают страсти: [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! и [target_country.GetName] откровенно не ладят. Всё началось с мелких разногласий, а закончилось открытым конфликтом, и теперь [target_country.GetName] став[target_country.Custom('end_ityat')] под сомнение нашу приверженность общему делу.\n\nЭта грызня выгодна лишь иностранцам, которые следят за каждым нашим движением. Мы можем залатать образовавшуюся брешь при помощи дипломатии или же настоять на своём, несмотря на последствия. Как бы то ни было, нельзя позволить этой вражде разрастись."
 italian_wars.24.a: "Мы пойдём на примирение."
 italian_wars.24.b: "Нас такие глупости не волнуют."
 ruler_or_regent_skillful_diplomacy_saves_the_day: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortName] проявляет настоящий талант в дипломатии и умудряется разрядить ситуацию"
 italian_wars.25.title: "Братья по оружию"
 italian_wars.25.desc: "Посреди острого кризиса в объединении «[target_io.GetName]» [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! и [target_country.GetName] неожиданно приходят к взаимопониманию. Общий враг и совместно пережитые трудности объединяют страны лучше любой дипломатии, и между нашими народами образовалась связь, выходящая далеко за пределы формальностей.\n\nВо время войны такая симпатия — это редкая возможность, которую нельзя упускать. Мы можем официально укрепить дружбу между нашими дворами или же оставить подобные затеи и заняться более насущными вопросами. Этот выбор определит отношение [target_country.Custom('CL_GEN')] к нам на годы вперёд."
 italian_wars.25.a: "Мы укрепим эту связь."
 italian_wars.25.b: "У нас есть дела поважнее."
 good_relations_will_help_keep_em_in_league_tt: "Крепкие связи между [Concept('countries', 'державами')|e] помогают удержать их в лиге"
 italian_wars.26.title: "Оскорбление без ответа"
 italian_wars.26.desc: "[target_character.GetName] из #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! [Select_CString(target_character.IsFemale, 'оскорбила', 'оскорбил')] нас перед представителями обеих лиг. [Select_CString(target_character.IsFemale, 'Она усомнилась', 'Он усомнился')] в нашем праве на лидерство в объединении «[our_io.GetName]» и в уровне нашего влияния на Италию. Это нельзя оставить без ответа.\n\nЕсли мы промолчим, [target_character.GetShortNameWithNoTooltip] совсем распоясается, а другие участники объединения могут последовать [Select_CString(target_character.IsFemale, 'её', 'его')] примеру. Мы можем хорошенько надавить и потребовать возмездия, но есть риск вызвать эскалацию, к которой лиги могут быть не готовы. Либо мы можем проглотить обиду и дождаться подходящего момента."
 italian_wars.26.a: "Мы не потерпим такого оскорбления."
 italian_wars.26.b: "Час расплаты наступит, но не сегодня."
 italian_wars.27.title: "Уроки войны"
 italian_wars.27.desc: "Жестокие бои по всей #TOOLTIP:REGION,italy_region,X #L Италии#!#! несут не только смерть и разрушения. Наши офицеры и учёные приносят на родину выстраданные знания, позаимствованные у наших противников и прошедшие проверку боем. [ROOT.GetCountry.GetGovernment.GetCourtTitle] благодарно принимает новые идеи. Вопрос лишь в том, как извлечь из них наибольшую пользу.\n\nМы можем заняться углублённым изучением уроков войны и сосредоточиться на развитии наших принципов и мастерства. Либо мы можем сразу же применить накопленный опыт там, где он может пригодиться людям в наших армиях и на наших землях."
 italian_wars.27.a: "Мы углубим свои знания."
 italian_wars.27.b: "Нам нужны не теории, а результаты."
 italian_wars.28.title: "Инженер из [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
 italian_wars.28.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] встречает знаменитого инженера, который привёз рекомендательные письма и кипу подробных чертежей новых осадных сооружений. [new_character.GetName] из [target_location.Custom('LR_GEN')|l] [target_location.GetName] — один из талантливых инженеров, которые отправились в самое пекло итальянских конфликтов, чтобы разрабатывать передовые военные технологии. Если мы воспользуемся [Select_CString(new_character.IsFemale, 'её', 'его')] знаниями, то сможем эффективнее пробивать стены вражеских укреплений.\n\n[Select_CString(new_character.IsFemale, 'Её', 'Его')] услуги стоят недёшево, и [Select_CString(new_character.IsFemale, 'она', 'он')] этого не скрывает. Однако в ходе кампаний такая удача выпадает нечасто."
 italian_wars.28.a: "Мы [Select_CString(new_character.IsFemale, 'ей', 'ему')] заплатим. На хорошего инженера денег не жалко."
 italian_wars.28.b: "Нам это пока не по карману. Пусть уходит."
 iw28_no_engineer_for_years_tt: "Инженеры узнают, что мы отослали [Select_CString(new_character.IsFemale, 'её', 'его')] прочь, так что может пройти немало времени, прежде чем нас посетит учёный столь же высокого уровня"
 engineer_boosts_short_term_research_tt: "[Select_CString(new_character.IsFemale, 'Её', 'Его')] разработки открывают новые горизонты для наших учёных, и мы стремительно продвигаемся в исследованиях"
 engineer_boosts_literacy_efforts_tt: "Техническая документация и диаграммы, предоставленные [Select_CString(new_character.IsFemale, 'ей', 'им')], вызывают у образованных людей больше интереса к просвещению"
 italian_wars.4.title: "Приглашение в лигу"
 italian_wars.4.desc: "Ситуация в нашем регионе усугубляется. Наш народ испытал на себе все ужасы войны. В ответ на агрессию иностранных захватчиков власти #ONCLICK:COUNTRY,[actor.Custom('CL_tt')] #TOOLTIP:COUNTRY,[actor.Custom('CL_tt')],X [actor.Custom('CL_GEN')|L]#!#! создают объединение «[target_io.GetName]». Они направили нам приглашение. Это вопрос исключительной дипломатической важности. Мы должны принять взвешенное решение."
 italian_wars.4.a: "Мы принимаем приглашение!"
 italian_wars.4.b: "Мы должны сохранить нейтралитет."
 italian_wars.4.c: "Мы верны [target_country.Custom('CL_DAT')]!"
 italian_wars.9.title: "Помощь [actor.Custom('CL_GEN')]"
 italian_wars.9.desc: "Гонец приносит благую весть: похоже, [actor.GetName] не против помочь нам в оборонительной войне, чтобы баланс сил не сместился в пользу врагов."
 italian_wars.9.a: "Мы объединим силы против общего врага..."
 italian_wars.10.title: "Две чаши весов"
 italian_wars.10.desc: "Война, опустошающая земли #ONCLICK:COUNTRY,[target.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target.Custom('CL_tt')],X [target.Custom('CL_GEN')|L]#!#!, ставит под угрозу баланс сил в #TOOLTIP:REGION,italy_region,X #L Италии#!#!. Мы не можем позволит очередной лиге укрепиться на полуострове. [target.GetLongNameWithNoTooltip] — мы решили отправить помощь этой державе, чтобы поддержать её народ, защищающий свои земли от наших врагов."
 italian_wars.10.a: "Отправим на помощь солдат."
 italian_wars.10.b: "Отправим денежные средства."
 italian_wars.11.title: "Точка кипения"
 italian_wars.11.desc: "Напряжённость в #TOOLTIP:REGION,italy_region,X #L Италии#!#! достигла предела. Последние договорённости, которые сдерживали враждующих участников лиг, были нарушены под влиянием мимолётного порыва. [target_character.GetName] и лидеры противников оставили все попытки достичь мира. Скоро начнётся полноценная война."
 italian_wars.11.a: "Компромиссов не будет, сдаваться нельзя."
 all_leaders_of_leagues_annul_all_truces_tt: "[Concept('international_organization_leader', 'Лидеры')|e] всех лиг отказались от перемирия как между собой, так и с другими #TOOLTIP:REGION,italy_region,X #L итальянскими#!#! странами"
 as_long_as_90_tension_foreign_leaders_can_call_in_league_members_offensively_tt: "Пока уровень [Concept('situation_tension', 'напряжённости')|e] не упадёт ниже #Y 90#!, лидеры иностранных лиг могут привлекать страны-[Concept('members', 'участницы')|e] к нападениям на любые [Concept('country', 'державы')|e] #TOOLTIP:REGION,italy_region,X #L Италии#!#!"
 italian_wars.100.title: "Окончание Итальянских войн"
 italian_wars.100.desc: "Десятилетиями мы боролись за свободу нашего региона, и усилия нашей могущественной лиги не прошли даром. Иностранные захватчики отступили от границ, и наш народ уверенно смотрит в будущее. Эпоха войн завершилась. Впереди нас ждёт процветание!"
 italian_wars.100.a: "Сила в верности!"
 italian_wars.100.b: "Наш суверенитет неоспорим!"
 demand_vassalization_from_members_tt: "Наша страна — лидер победившей лиги, и мы потребуем от держав-участниц подчиниться нам"
 league_locations_owned_desc: "Районы под контролем нашей лиги"
 iw_send_aid_tt: "Мы поможем выбранной [Concept('country', 'державе')|e] некоторым [Concept('manpower', 'числом рекрутов')|e] или [Concept('gold', 'дукатами')|e]"
 italian_wars.200.desc: "Наконец-то Итальянские войны завершились. Все иностранные лиги, желающие захватить наши земли, распались, и на наш полуостров вернулись мир и процветание. Мы доказали, что являемся истинными хозяевами #TOOLTIP:REGION,italy_region,X #L Италии#!#!. Впереди нас ждут великие дела!"
 italian_wars.200.a: "Началась эпоха [target_country.Custom('CL_GEN')]!"
 italian_wars.200.desc_foreign: "Хотя нам удалось продвинуться вглубь #TOOLTIP:REGION,italy_region,X #L Италии#!#!, местные лиги выстояли и отбили наше нападение. Наши планы по завоеванию полуострова потерпели крах, и нам придётся с этим смириться."
 italian_wars.200.b: "Мы не забудем этого унижения."
 italian_wars.300.title: "Объединение «[target_io.GetNameWithNoTooltip]» побеждает в Италии"
 italian_wars.300.desc: "Несмотря на длительное и ожесточённое сопротивление, теперь #TOOLTIP:REGION,italy_region,X #L Италия#!#! почти полностью в нашей власти. Те, кто пытался помешать нашим планам, ныне спасаются от нашей великой армии за высокими стенами. Мы утвердили своё право на регион, и с этого дня начинается новая эпоха!"
 italian_wars.300.a: "Да здравствует [target_character.GetNameWithNoTooltip]!"
 italian_wars.301.desc: "$italian_group$ие войны завершились для нас поражением: #TOOLTIP:REGION,italy_region,X #L Италией#!#! завладели иностранные захватчики. Несмотря на все старания, мы не смогли избежать такого печального исхода. Остаётся лишь приспосабливаться к новым порядкам, которые теперь царят на полуострове."
 italian_wars.301.a: "Нам придётся смириться с поражением."
 italian_wars.400.title: "Итальянский тупик"
 italian_wars.400.desc: "Как мы ни пытались, нам не удалось сдвинуть ситуацию с мёртвой точки. Похоже, #TOOLTIP:SITUATION,italian_wars,X #L Итальянские войны#!#! зашли в тупик. Как страны полуострова, так и иностранные захватчики не смогли объединить земли региона и значительно расширить своё влияние."
 italian_wars.400.a: "Какой смысл продолжать войну?"
 end_the_italian_wars_stalemate_tt: "Итальянские войны зайдут в тупик..."
 non_princes_become_princes_tt: "[Concept('countries', 'Державы')|e] со статусом «[ShowSpecialStatusName('hre_foreign_league_member')]» станут [Concept('members', 'участниками')|e] #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священной Римской Империи#!#!"