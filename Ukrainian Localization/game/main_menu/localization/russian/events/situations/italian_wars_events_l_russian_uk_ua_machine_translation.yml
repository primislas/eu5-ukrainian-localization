l_russian:
  italian_wars.1.title: "Італійські війни"
  italian_wars.1.desc.a: "#TOOLTIP:REGION,italy_region,X #L Італія#!#! в небезпеці. Закулісні ігри та нескінченні інтриги інших великих держав призвели до безпрецедентних дипломатичних наслідків. Ворожі сили хочуть відібрати нашу владу та вплив на півострові. У цей небезпечний час ми повинні діяти без вагань. Перемога над Італією забезпечить нам місце серед великих держав."
  italian_wars.1.desc.b: "До #TOOLTIP:REGION,italy_region,X #L Італії#!#! прийшла війна. Іноземні завойовники вторглися на нашу землю, бажаючи прибрати до рук наші незліченні багатства. Великі держави кружляють над півостровом, немов зграя голодних стерв'ятників. Такого не було ніколи в історії нашого регіону. Нашим людям час взяти в руки мечі та щити, щоб захистити нашу свободу та покласти край експансії чужинців…"
  italian_wars.1.a: "Жереб кинуто."
  italian_wars.1.b: "Об’єднаймося [GetUniqueInternationalOrganization('foreign_league_hre').GetLeaderCountry.Custom('preposition_zzi')] [GetUniqueInternationalOrganization('foreign_league_hre').GetLeaderCountry.Custom('CL_INST')]!"
  italian_wars_explanation_tooltip1: "У ці часи країни Італії зможуть отримати захист, приєднавшись до #italic  італійської ліги#!.\n"
  italian_wars_explanation_tooltip2: "Інші країни можуть створювати #italic  іноземні ліги#!, щоб розширити свій вплив у регіоні.\n"
  italian_wars_explanation_tooltip3: "[Concept('rivals', 'Суперники')|e] та [Concept('enemies', 'вороги')|e] лідерів #italic  іноземних ліг#! можуть допомогти #italic  італійській лізі#!, вступивши у війну або надавши потрібні засоби та людей\n"
  italian_wars_explanation_tooltip4: "Лідери всіх ліг отримують доступ до [Concept('peace_treaty', 'мирного договору')|e] «[ShowPeaceTreatyTypeName('dissolve_league_peace_deal')]»"
  iw_italian_league_merc_efficiency_tt: "Ми беремо участь у #italic італійській лізі#!, тому наша #TOOLTIP:MODIFIER_TYPE,mercenary_maintenance_efficiency,X #P #V ефективність утримання найманців#!#!#! залежить від кількості італійських місцевостей під контролем цієї ліги. За максимального значення (#Y 301#! місцевість) прибавка може сягати #G 33%#!."
  italian_wars.1.historical_info: "Італійські війни (1494–1559) — це серія військових конфліктів між Францією та Іспанією за володіння Італією, в яких так чи інакше брала участь значна частина європейських країн. Усе почалося, коли французький король Карл VIII вторгся до Італії в 1494 році та захопив Неаполь. Однак католицькі королі Іспанії Максиміліан I Габсбург, Ізабелла Кастильська та Фердинанд Арагонський прийшли на допомогу папі та вигнали французів. У 1499 році французький король знову взяв Мілан, Геную та Неаполь, але Іспанія прогнала його з Неаполя в 1503 році, утвердивши свою владу над Південною Італією, а папа Юлій II створив альянс, щоб вигнати французів із Північної Італії. Кілька років потому французький король Франциск I заявив свої претензії на Мілан, і місто було взято в 1515 році, але в 1525 році Франциск програв вирішальну битву при Павії імператору Карлу V, також відомому як король Іспанії Карлос I, і був узятий у полон. Після формальної відмови від усіх домагань на італійські території Франциск I був звільнений, але потім уклав союз з Англією, папою, Венецією та Флоренцією, що призвело до розграбування Риму німецькими ландскнехтами Карла V у 1527 році, укладення миру з папою та коронації Карла V у Болоньї в 1529 році. Італійські війни завершилися підписанням Като-Камбрезького миру в 1559 році, після чого іспанські Габсбурги залишалися панівною силою в Італії протягом 150 років."
  italian_wars.20.title: "Виплати кондотьєру"
  italian_wars.20.desc.a: "[target_character.GetName], капітан загону «[target_merc.GetName]», призупиняє своє просування та відправляє нам послання з вимогою переглянути умови [Select_CString(target_character.IsFemale, 'її', 'його')] контракту. Кампанія вийшла далеко за рамки обумовленого, і без додаткової винагороди [target_character.GetShortNameWithNoTooltip] не зрушить з місця.\n\nЯкщо ми виконаємо цю вимогу, найманці залишаться в нас на службі. Якщо ми відповімо відмовою, можливо, [target_character.GetShortNameWithNoTooltip] поведе своїх бійців геть просто в розпал кампанії."
  italian_wars.20.desc.b: "У загоні «[target_merc.GetName]» зростає занепокоєння. Представники найманців прибули до нашого табору й зажадали переглянути початкові умови договору. Капітана на роль перемовника не знайшлося, тому вимога висувається від імені всієї групи. Майбутнє кампанії поки що примарне, і ці вояки важливі для нас.\n\nМи повинні визначитися з відповіддю, поки в членів загону «[target_merc.GetNameWithNoTooltip]» не скінчилося терпіння."
  italian_wars.20.desc.c: "Вояки із загону «[target_merc.GetName]» відправляють послання з вимогою переглянути умови контракту. Кампанія триває довше, ніж вони розраховували, і без додаткової винагороди вони, найімовірніше, просто відмовляться від служби.\n\nНам потрібно визначитися, що гірше: непередбачені витрати чи ризик втратити вояків."
  italian_wars.20.a: "Ми виконаємо їхні вимоги."
  italian_wars.20.b: "Ми не станемо змінювати умови."
  italian_wars.20.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] особисто проведе ці перемовини."
  mercs_among_the_ranks_of_target_merc_are_reigned_in_tt: "Загін приймає нові умови, такого більше не повториться"
  mercs_extract_coin_and_supplies_from_the_land_tt: "Найманці збирають гроші та припаси в наших місцевостях"
  target_province_loses_prosperity_extreme_penalty_tt: "Кожен [Concept('location', 'район')|e] у провінції [target_province.GetName] отримує [ShowNamedValue('prosperity_extreme_penalty')|+=2%] до [Concept('prosperity', 'процвітання')|e]"
  italian_wars.21.title: "Загартовані вояки"
  italian_wars.21.desc: "Бійці з війська «[target_army.GetName]», загартовані в жорстоких боях італійських воєн, повертаються додому. Зараз вони розташувалися в [target_location.Custom('LR_PREP')|l] [target_location.GetName]. Офіцери розповідають, що їхні люди пройшли через справжнє горнило війни, відточивши реакцію та добившись злагодженості, яку неможливо досягти самими тренуваннями.\n\nЯк ми скористаємося їхнім досвідом? Це рішення визначить долю нашого війська на роки вперед."
  italian_wars.21.a: "Не будемо їх розлучати. Їхня сила — у згуртованості."
  italian_wars.21.b: "Їхня доблесть уособлює дух усього нашого народу."
  italian_wars.21.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] куруватиме навчання ветеранів."
  italian_wars.22.title: "Проблема дезертирства"
  italian_wars.22.desc: "Затяжний конфлікт у #TOOLTIP:REGION,italy_region,X #L Італії#!#! виснажив наших вояків. [ROOT.GetCountry.GetGovernment.GetCourtTitle] отримує повідомлення про те, що вони все частіше залишають свої пости: одні просто втомилися, інші занепали духом і зневірилися в цілях боротьби. Представники станів також почали відкрито висловлювати невдоволення, нам може загрожувати бунт.\n\nПотрібно якось вплинути на цю небезпечну ситуацію, поки вона не вийшла з-під контролю. Ми можемо покарати дезертирів і таким чином нагадати всім, хто сумнівається, що бійцям не належить відступати. Або ми можемо покластися на свій авторитет і самовіддано продемонструвати приклад справжньої відданості, вимагаючи того ж самого від інших."
  italian_wars.22.a: "Усі вони — боягузи та зрадники."
  italian_wars.22.b: "Ні кроку назад! Ми вистоїмо."
  italian_wars.23.title: "Генерал-перебіжчик"
  italian_wars.23.desc: "Нас турбує, що командир з війська «[target_army.GetName]» на ім’я [target_character2.GetName] виявляє надмірний пієтет до чужоземних сил. Ходять чутки, ніби [target_character2.GetShortNameWithNoTooltip] всерйоз обмірковує пропозиції наших ворогів, і [Select_CString(target_character2.IsFemale, 'її', 'його')] дії під час кампанії це лише підтверджують.\n\n[target_character1.GetName] [Select_CString(target_character1.IsFemale, 'повинна', 'повинен')] щось зробити, поки тихе невдоволення не переросло у відкриту непокору."
  italian_wars.23.a: "Геть з наших лав, [Select_CString(target_character2.IsFemale, 'зраднице', 'зраднику')]!"
  italian_wars.23.b: "За лояльність потрібно платити. І ми це зробимо."
  italian_wars.23.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] поставить [Select_CString(target_character2.IsFemale, 'негідницю', 'негідника')] на місце."
  target_character2_wont_attempt_to_flee_for_10_years_tt: "[target_character2.GetShortNameWithNoTooltip] не зробить спроб перекинутися ще #Y 10#! років"
  italian_wars.24.title: "Розкол серед союзників"
  italian_wars.24.desc: "В об’єднанні «[target_io.GetNameWithNoTooltip]» палають пристрасті: [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! та [target_country.GetName] відверто не ладнають. Усе почалося з дрібних розбіжностей, а закінчилося відкритим конфліктом, і тепер [target_country.GetName] став[target_country.Custom('end_ytlyat')] під сумнів нашу прихильність спільній справі.\n\nЦя гризня вигідна лише чужоземцям, які стежать за кожним нашим рухом. Ми можемо залатати пролом, що утворився, за допомогою дипломатії або ж наполягти на своєму, попри наслідки. Хай там як, не можна дозволити цій ворожнечі розростися."
  italian_wars.24.a: "Ми підемо на примирення."
  italian_wars.24.b: "Нас такі дурниці не хвилюють."
  ruler_or_regent_skillful_diplomacy_saves_the_day: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortName] виявляє справжній хист у дипломатії та примудряється знизити напругу"
  italian_wars.25.title: "Брати по зброї"
  italian_wars.25.desc: "Посеред гострої кризи в об’єднанні «[target_io.GetName]» [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] #ONCLICK:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')] #TOOLTIP:COUNTRY,[ROOT.GetCountry.Custom('CL_tt')],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! та [target_country.GetName] несподівано доходять взаєморозуміння. Спільний ворог і спільно пережиті труднощі об’єднують країни краще за будь-яку дипломатію, і між нашими народами утворився зв’язок, що виходить далеко за межі формальностей.\n\nПід час війни така симпатія — це рідкісна нагода, яку не можна проминути. Ми можемо офіційно зміцнити дружбу між нашими дворами або ж залишити подібні затії та зайнятися нагальнішими питаннями. Цей вибір визначить ставлення [target_country.Custom('CL_GEN')] до нас на роки вперед."
  italian_wars.25.a: "Ми зміцнимо цей зв’язок."
  italian_wars.25.b: "У нас є важливіші справи."
  good_relations_will_help_keep_em_in_league_tt: "Міцні зв’язки між [Concept('countries', 'країнами')|e] допомагають утримати їх у лізі"
  italian_wars.26.title: "Образа без відповіді"
  italian_wars.26.desc: "[target_character.GetName] з #ONCLICK:COUNTRY,[target_country.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target_country.Custom('CL_tt')],X [target_country.Custom('CL_GEN')|L]#!#! [Select_CString(target_character.IsFemale, 'образила', 'образив')] нас перед представниками обох ліг. [Select_CString(target_character.IsFemale, 'Вона засумнівалася', 'Він засумнівався')] в нашому праві на лідерство в об’єднанні «[our_io.GetName]» та в рівні нашого впливу на Італію. Це не можна залишити без відповіді.\n\nЯкщо ми промовчимо, [target_character.GetShortNameWithNoTooltip] зовсім розперезається, а інші учасники об’єднання можуть наслідувати [Select_CString(target_character.IsFemale, 'її', 'його')] приклад. Ми можемо добряче натиснути та вимагати відплати, але є ризик спричинити збурення, до якої ліги можуть бути не готові. Або ми можемо проковтнути образу й дочекатися слушного моменту."
  italian_wars.26.a: "Ми не потерпимо такої образи."
  italian_wars.26.b: "Час розплати настане, але не сьогодні."
  italian_wars.27.title: "Уроки війни"
  italian_wars.27.desc: "Жорстокі бої по всій #TOOLTIP:REGION,italy_region,X #L Італії#!#! несуть не тільки смерть і руйнування. Наші офіцери та вчені приносять на батьківщину вистраждані знання, запозичені в наших супротивників і перевірені боєм. [ROOT.GetCountry.GetGovernment.GetCourtTitle] вдячно приймає нові ідеї. Питання лише в тому, як отримати з них найбільшу користь.\n\nМи можемо зайнятися поглибленим вивченням уроків війни та зосередитися на розвитку наших принципів і майстерності. Або ми можемо відразу ж застосувати накопичений досвід там, де він може стати в пригоді людям у наших військах і на наших землях."
  italian_wars.27.a: "Ми поглибимо свої знання."
  italian_wars.27.b: "Нам потрібні не теорії, а результати."
  italian_wars.28.title: "Інженер з [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  italian_wars.28.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle] зустрічає знаменитого інженера, який привіз рекомендаційні листи та стос докладних креслень нових облогових споруд. [new_character.GetName] з [target_location.Custom('LR_GEN')|l] [target_location.GetName] — один із талановитих інженерів, які вирушили в саме пекло італійських конфліктів, щоб розробляти передові військові технології. Якщо ми скористаємося [Select_CString(new_character.IsFemale, 'її', 'його')] знаннями, то зможемо ефективніше пробивати стіни ворожих укріплень.\n\n[Select_CString(new_character.IsFemale, 'Її', 'Його')] послуги коштують недешево, і [Select_CString(new_character.IsFemale, 'вона', 'він')] цього не приховує. Однак під час кампаній така удача випадає нечасто."
  italian_wars.28.a: "Ми [Select_CString(new_character.IsFemale, 'їй', 'йому')] заплатимо. На хорошого інженера грошей не шкода."
  italian_wars.28.b: "Нам це поки не по кишені. Нехай іде."
  iw28_no_engineer_for_years_tt: "Інженери дізнаються, що ми відіслали [Select_CString(new_character.IsFemale, 'її', 'його')] геть, тож може минути чимало часу, перш ніж нас відвідає вчений такого ж високого рівня"
  engineer_boosts_short_term_research_tt: "[Select_CString(new_character.IsFemale, 'Її', 'Його')] розробки відкривають нові обрії для наших вчених, і ми стрімко просуваємося в дослідженнях"
  engineer_boosts_literacy_efforts_tt: "Технічна документація та діаграми, надані [Select_CString(new_character.IsFemale, 'нею', 'ним')], викликають в освічених людей більше цікавості до просвіти"
  italian_wars.4.title: "Запрошення до ліги"
  italian_wars.4.desc: "Ситуація в нашому регіоні погіршується. Наш народ відчув на собі всі жахи війни. У відповідь на агресію іноземних загарбників влада #ONCLICK:COUNTRY,[actor.Custom('CL_tt')] #TOOLTIP:COUNTRY,[actor.Custom('CL_tt')],X [actor.Custom('CL_GEN')|L]#!#! створює об'єднання «[target_io.GetName]». Вони надіслали нам запрошення. Це питання виняткової дипломатичної важливості. Ми повинні прийняти виважене рішення."
  italian_wars.4.a: "Ми приймаємо запрошення!"
  italian_wars.4.b: "Ми повинні зберегти нейтралітет."
  italian_wars.4.c: "Ми вірні [target_country.Custom('CL_DAT')]!"
  italian_wars.9.title: "Допомога [actor.Custom('CL_GEN')]"
  italian_wars.9.desc: "Гонець приносить благу звістку: схоже, [actor.GetName] не проти допомогти нам в оборонній війні, щоб баланс сил не змістився на користь ворогів."
  italian_wars.9.a: "Ми об'єднаємо сили проти спільного ворога…"
  italian_wars.10.title: "Дві шальки терезів"
  italian_wars.10.desc: "Війна, що спустошує землі #ONCLICK:COUNTRY,[target.Custom('CL_tt')] #TOOLTIP:COUNTRY,[target.Custom('CL_tt')],X [target.Custom('CL_GEN')|L]#!#!, ставить під загрозу баланс сил в #TOOLTIP:REGION,italy_region,X #L Італії#!#!. Ми не можемо дозволити черговій лізі зміцнитися на півострові. [target.GetLongNameWithNoTooltip] — ми вирішили відправити допомогу цій країні, щоб підтримати її народ, що захищає свої землі від наших ворогів."
  italian_wars.10.a: "Відправимо на допомогу вояків."
  italian_wars.10.b: "Відправимо грошові кошти."
  italian_wars.11.title: "Точка кипіння"
  italian_wars.11.desc: "Напруженість в #TOOLTIP:REGION,italy_region,X #L Італії#!#! досягла межі. Останні домовленості, які стримували ворожих учасників ліг, були порушені під впливом швидкоплинного пориву. [target_character.GetName] та очільники супротивників облишили всі спроби досягти миру. Скоро почнеться повноцінна війна."
  italian_wars.11.a: "Компромісів не буде, здаватися не можна."
  all_leaders_of_leagues_annul_all_truces_tt: "[Concept('international_organization_leader', 'Лідери')|e] всіх ліг відмовилися від перемир’я як між собою, так і з іншими #TOOLTIP:REGION,italy_region,X #L італійськими#!#! країнами"
  as_long_as_90_tension_foreign_leaders_can_call_in_league_members_offensively_tt: "Поки рівень [Concept('situation_tension', 'напруженості')|e] не впаде нижче #Y 90#!, лідери іноземних ліг можуть залучати країни-[Concept('members', 'учасниці')|e] до нападів на будь-які [Concept('country', 'країни')|e] #TOOLTIP:REGION,italy_region,X #L Італії#!#!"
  italian_wars.100.title: "Закінчення Італійських війн"
  italian_wars.100.desc: "Десятиліттями ми боролися за свободу нашого регіону, і зусилля нашої могутньої ліги не пройшли дарма. Іноземні загарбники відступили від кордонів, і наш народ впевнено дивиться в майбутнє. Доба війн завершилася. Попереду нас чекає процвітання!"
  italian_wars.100.a: "Сила у вірності!"
  italian_wars.100.b: "Наш суверенітет незаперечний!"
  demand_vassalization_from_members_tt: "Наша країна — лідер переможної ліги, і ми вимагатимемо від країн-учасниць підкоритися нам"
  league_locations_owned_desc: "Місцевості під контролем нашої ліги"
  iw_send_aid_tt: "Ми допоможемо обраній [Concept('country', 'країні')|e] [Concept('manpower', 'рекрутами')|e] або [Concept('gold', 'грошима')|e]"
  italian_wars.200.desc: "Нарешті Італійські війни завершилися. Всі іноземні ліги, що бажали захопити наші землі, розпалися, і на наш півострів повернулися мир та процвітання. Ми довели, що є істинними господарями #TOOLTIP:REGION,italy_region,X #L Італії#!#!. Попереду нас чекають великі справи!"
  italian_wars.200.a: "Розпочалася доба [target_country.Custom('CL_GEN')]!"
  italian_wars.200.desc_foreign: "Хоча нам вдалося просунутися вглиб #TOOLTIP:REGION,italy_region,X #L Італії#!#!, місцеві ліги вистояли та відбили наш напад. Наші плани із завоювання півострова зазнали краху, і нам доведеться з цим змиритися."
  italian_wars.200.b: "Ми не забудемо цього приниження."
  italian_wars.300.title: "Об'єднання «[target_io.GetNameWithNoTooltip]» перемагає в Італії"
  italian_wars.300.desc: "Попри тривалий та запеклий опір, тепер #TOOLTIP:REGION,italy_region,X #L Італія#!#! майже повністю в нашій владі. Ті, хто намагався завадити нашим планам, нині рятуються від нашого великого війська за високими стінами. Ми утвердили своє право на регіон, і з цього дня починається нова доба!"
  italian_wars.300.a: "Хай живе [target_character.GetNameWithNoTooltip]!"
  italian_wars.301.desc: "$italian_group$і війни завершилися для нас поразкою: #TOOLTIP:REGION,italy_region,X #L Італією#!#! заволоділи іноземні загарбники. Попри всі старання, ми не змогли уникнути такого сумного результату. Залишається лише пристосовуватися до нових порядків, які тепер панують на півострові."
  italian_wars.301.a: "Нам доведеться змиритися з поразкою."
  italian_wars.400.title: "Італійський глухий кут"
  italian_wars.400.desc: "Як ми не намагалися, нам не вдалося зрушити ситуацію з мертвої точки. Схоже, #TOOLTIP:SITUATION,italian_wars,X #L Італійські війни#!#! зайшли в глухий кут. Як країни півострова, так і іноземні загарбники не змогли об'єднати землі регіону та значно розширити свій вплив."
  italian_wars.400.a: "Який сенс продовжувати війну?"
  end_the_italian_wars_stalemate_tt: "Італійські війни зайдуть у глухий кут…"
  non_princes_become_princes_tt: "[Concept('countries', 'Країни')|e] зі статусом «[ShowSpecialStatusName('hre_foreign_league_member')]» стануть [Concept('members', 'учасниками')|e] #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священної Римської Імперії#!#!"