l_russian:
  western_schism.1.title: "Розкол у католицькій церкві"
  western_schism.1.desc: "#TOOLTIP:RELIGION,$catholic_tt$,X #L Католицтво#!#! переживає розкол, і в курії вибухнула фракційна боротьба.\n\nНам не звикати до протиріч у церкві, але цього разу їхні причини інші. Коли помер останній [GetInternationalOrganization('catholic_church').GetLeaderTitle], #TOOLTIP:CULTUREGROUP,italian_group,X #L італійські#!#! кардинали вирішили втілити мрію, яку плекали з тих самих пір, як інститут папства перейшов під контроль #TOOLTIP:CULTUREGROUP,french_group,X #L французів#!#!, і виступили за повернення Святого Престолу в розпорядження Італії. Кардиналам протистоять французькі священнослужителі: вони наполягають на тому, щоб [GetInternationalOrganization('catholic_church').GetLeaderTitle] залишався під їхнім контролем. Через несумісність позицій цих двох груп католицький світ швидко занурюється в стан внутрішньої ворожнечі, і благочестиві #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католики#!#! залишаються без духовних пастирів. До тих пір, поки конфлікт не вщухне, їм доведеться жити без опори на звичні авторитети й самостійно вирішувати, хто є істинним провідником божественної волі."
  western_schism.1.a: "Справи кепські."
  western_schism.3.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] незадоволен[ROOT.GetCountry.Custom('clergy_yiaei')] розколом"
  western_schism.3.desc: "Ми досі не обрали, хто нам більше імпонує: [target_schism_pope_cardinal.GetName] чи [target_schism_opponent_cardinal.GetName]. Наші кардинали наполегливо просять нас поквапитися з ухваленням рішення."
  western_schism.3.a: "З цим рішенням можна почекати…"
  western_schism.4.title: "[jan_hus.GetNameWithNoTooltip]"
  western_schism.4.desc: "У самому серці області [ROOT.GetCountry.GetCapital.GetArea.GetName] розгорається полум’я інакомислення у вірі, роздмухане сильними вітрами змін. [jan_hus.GetName] — харизматичний #TOOLTIP:CULTURE,$czech_tt$,X #L чеський#!#! священник і вчений — виступає проти лихоїмства, в якому нібито загрузла #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католицька церква#!#!. Його слова знаходять відгук у серцях простого люду, і прихильників #TOOLTIP:RELIGION,$hussite_tt$,X #L гуситської#!#! віри стає дедалі більше.\n\n[jan_hus.GetNameWithNoTooltip] засуджує розкіш і надмірності, притаманні католицтву, і закликає повернутися до простоти й чистоти раннього християнства. Його послідовники, відомі як гусити, приймають його вчення, і їхня ревність зростає з кожним днем. Своїми проповідями [jan_hus.GetLastNameWithNoTooltip] підриває авторитет, яким користується католицька церква та #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священна Римська імперія#!#!, змінюючи тим самим усталений порядок."
  western_schism.4.historical_info: "Ян Гус, також відомий як Йоганн Гус, — знаменитий богослов, філософ і один із перших реформаторів католицизму. Він стояв біля витоків гуситської віри, що передувала лютеранству. Гус ріс у бідній родині, і батьки відправили його до монастиря, щоб відкрити синові шлях до кращого майбутнього. Під час служби він виступав проти пороків католицької церкви в Богемії. Коли папою був обраний Олександр V, він видав буллу про відлучення від церкви непокірного священника. Вже після Великого західного розколу Гус був викликаний на собор у Констанці, щоб захищати свої погляди, але був негайно заарештований і кинутий до в’язниці. Він не відрікся від своїх ідей і 6 липня 1415 року був спалений на вогнищі за єресь. Його послідовники заснували нову віру і кілька десятків років запекло воювали з католиками, які організували проти них п’ять хрестових походів. Гуситська віра проіснувала в Богемії майже два століття."
  western_schism.4.a: "У його вченні щось є…"
  western_schism.5.title: "Втрата віри"
  western_schism.5.desc: "[target_schism_pope_cardinal.GetName] і [target_schism_opponent_cardinal.GetName] розв’язали гостру суперечку, яка підриває спокій низки країн, включно з нашою. Майбутнє Святого престолу стоїть під питанням, що викликає сумніви щодо правильного порядку проведення церковної служби та хитає народну віру."
  western_schism.5.a: "Ми молитимемося про якнайшвидше припинення цих чвар."
  western_schism.5.b: "Можливо, нашому народу варто пошукати альтернативу."
  western_schism.6.title: "[opponent_support_location.GetNameWithNoTooltip] і [pope_support_location.GetNameWithNoTooltip] у стані ворожнечі"
  western_schism.6.desc: "[target_schism_opponent_cardinal.GetName] користується підтримкою [opponent_support_location.Custom('LR_GEN')|l] [opponent_support_location.GetName], тоді як [target_schism_pope_cardinal.GetName] [Select_CString(target_schism_pope_cardinal.IsFemale,'заручилася', 'заручився')] довірою [pope_support_location.Custom('LR_GEN')|l] [pope_support_location.GetName]. Нещодавно між жителями цих міст вибухнув скандал, і тепер вони вимагають, щоб [target_ruler.GetName] [Select_CString(target_schism_pope_cardinal.IsFemale,'зайняла', 'зайняв')] свою сторону в цій суперечці."
  western_schism.6.a: "Жителі [opponent_support_location.Custom('LR_GEN')|l] [opponent_support_location.GetName] однозначно праві."
  western_schism.6.b: "Підтримаємо населення [pope_support_location.Custom('LR_GEN')|l] [pope_support_location.GetName]."
  western_schism.6.c: "Нехай самі залагоджують свої дурні розбіжності."
  western_schism_resolution_impact_positive.tt: "Обрана сторона отримає частку підтримки у Великому західному розколі."
  western_schism_resolution_impact_negative.tt: "Обрана сторона втратить частку підтримки у Великому західному розколі."
  western_schism.7.title: "Розвиток торгівлі в Італії"
  western_schism.7.desc: "Своїми зусиллями [target_schism_pope_cardinal.GetName] [Select_CString(target_schism_pope_cardinal.IsFemale,'змогла', 'зміг')] забезпечити розвиток і процвітання торгівлі в #TOOLTIP:REGION,italy_region,X #L Італії#!#!. Наші [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] вельми раді таким змінам, оскільки вони повністю відповідають їхнім інтересам."
  western_schism.7.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  italian_trade: "Зв’язки з Італією"
  western_schism_8_10_common_string: "Наша позиція щодо #TOOLTIP:SITUATION,western_schism,X #L Великого західного розколу#!#! призвела до заворушень у деяких частинах нашої країни. Жителі [target_location.Custom('LR_GEN')|l] [target_location.GetName] почали озброюватися і вимагати, щоб ми визнали, що"
  western_schism.8.title: "[target_schism_opponent_cardinal.GetNameWithNoTooltip] користується народною підтримкою"
  western_schism.8.desc: "$western_schism_8_10_common_string$ саме [target_schism_opponent_cardinal.GetName] — єдиний законний папа."
  western_schism.8.a: "Ми не піддамося таким нахабним вимогам."
  western_schism.8.b: "Можливо, [target_schism_opponent_cardinal.GetNameWithNoTooltip] справді краще підходить на цю роль."
  western_schism.9.title: "[target_schism_opponent_cardinal.GetNameWithNoTooltip] цінує вірність"
  western_schism.9.desc: "Істинний [GetInternationalOrganization('catholic_church').GetLeaderTitle|l] [target_schism_opponent_cardinal.GetName], якому підкоряється #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католицька церква#!#!, надав нашим священникам особливі права в нагороду за нашу відданість."
  western_schism.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  western_schism.10.title: "[target_schism_pope_cardinal.GetNameWithNoTooltip] користується народною підтримкою"
  western_schism.10.desc: "$western_schism_8_10_common_string$ саме [target_schism_pope_cardinal.GetName] — єдиний законний папа."
  western_schism.10.a: "Якщо вони хочуть бунтувати — нехай спробують."
  western_schism.10.b: "Їхні доводи звучать переконливо."
  western_schism_11_12_common_string: "користується великою підтримкою #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_GEN')|L]#!#!. [target_country.GetAdjectiveWithNoTooltip]і влада публічно висловлює своє захоплення нашою стійкістю та непохитною вірою, такою рідкісною в ці смутні часи.\n\nЗвісно, ці солодкі промови мають лише одну мету — заручитися подальшою підтримкою #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Проте ми зможемо отримати користь з їхньої похвали — особливо якщо"
  western_schism_11_12_common_string_2: "з нашою допомогою вийде з протистояння переможцем. Крім того, вона стане сильним козирем, щоб просунути наші власні інтереси в католицькій церкві…"
  western_schism.11.title: "[target_country.GetAdjectiveWithNoTooltip]а влада дякує нам за підтримку"
  western_schism.11.desc: "У боротьбі за верховенство над #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католицькою церквою#!#! [target_schism_pope_cardinal.GetName] $western_schism_11_12_common_string$ [target_schism_pope_cardinal.GetNameWithNoTooltip] $western_schism_11_12_common_string_2$"
  western_schism.11.a: "[target_schism_pope_cardinal.GetNameWithNoTooltip] — ось істинний [GetInternationalOrganization('catholic_church').GetLeaderTitle|l]!"
  western_schism.11.b: "Ми використаємо похвалу [target_country.Custom('CL_GEN')], щоб вплинути на церкву."
  western_schism.12.desc: "У боротьбі за верховенство над #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католицькою церквою#!#! [target_schism_opponent_cardinal.GetName] $western_schism_11_12_common_string$ [target_schism_opponent_cardinal.GetNameWithNoTooltip] $western_schism_11_12_common_string_2$"
  western_schism.12.a: "[target_schism_opponent_cardinal.GetNameWithNoTooltip] — ось істинний [GetInternationalOrganization('catholic_church').GetLeaderTitle|l]!"
  western_schism_13_14_common_string: "найбільш гідна кандидатура на посаду предстоятеля #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католицької церкви#!#!. На жаль, інші стани з ними рішуче не згодні. Розкол, що вразив церкву, загрожує розділити й нашу країну, і ми повинні діяти гранично обережно, щоб не посилити становий конфлікт."
  western_schism.13.title: "Всупереч усьому"
  western_schism.13.desc: "Богобоязні [target_estate.GetName|l] нашої країни переконані, що [target_schism_pope_cardinal.GetName] — $western_schism_13_14_common_string$"
  western_schism.13.a: "[target_estate.GetNameWithNoTooltip] мають рацію."
  western_schism.13.b: "Ми згодні з більшістю."
  western_schism.14.desc: "Богобоязні [target_estate.GetName|l] нашої країни переконані, що [target_schism_opponent_cardinal.GetName] — $western_schism_13_14_common_string$"
  western_schism.15.title: "[Select_CString(target_character.IsFemale, 'Мандрівна проповідниця', 'Мандрівний проповідник')]"
  western_schism.15.desc: "#TOOLTIP:SITUATION,western_schism,X #L Великий західний розкол#!#! підірвав авторитет церкви і серйозно похитнув віру наших підданих. [unrest_location_scope.GetName] — тут це проявляється особливо яскраво. [Select_CString(target_character.IsFemale, 'Нова проповідниця', 'Новий проповідник')] на ім'я [target_character.GetName] розбурхує і без того заблудлий народ, вселяючи публіці єретичні погляди та звинувачуючи церкву у всіх гріхах. [target_character.GetShortNameWithNoTooltip] стверджує, що [Select_CString(target_character.IsFemale, 'вона істинна поборниця', 'він істинний поборник')] #L [ROOT.GetCountry.GetReligion.GetAdjective|l]ої#! віри, проте [Select_CString(target_character.IsFemale, 'її', 'його')] проповіді наводять деяких місцевих жителів на небезпечні думки. Ми повинні діяти швидко, щоб зупинити цю єресь."
  western_schism.15.a: "[Select_CString(target_character.IsFemale, 'Вона', 'Він')] не так вже [Select_CString(target_character.IsFemale, 'далека', 'далекий')] від істини."
  western_schism.15.b: "Ми не можемо дозволити [Select_CString(target_character.IsFemale, 'їй', 'йому')] будоражити людей."
  western_schism.1000.title: "Ціна покірності"
  western_schism_action_event_tt: "Ми попросимо одного з кандидатів надати нам грошову допомогу."
  western_schism.1001.desc: "[target.GetGovernment.GetRuler.GetName] гідно [Select_CString(target.GetGovernment.GetRuler.IsFemale, 'віддячила', 'віддячив')] нам за вірність — як того й заслуговує така могутня та впливова країна, як [ROOT.GetCountry.GetName]. Отримавши нашу підтримку, [target.GetName] поза всяким сумнівом зможе очолити #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католицьку церкву#!#!."
  western_schism.1001.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  western_schism.1002.desc: "[target.GetGovernment.GetRuler.GetName] [Select_CString(target.GetGovernment.GetRuler.IsFemale, 'знехтувала', 'знехтував')] простягнутою нами рукою і [Select_CString(target.GetGovernment.GetRuler.IsFemale, 'відмовила', 'відмовив')] нам у належній повазі. Звісно, [ROOT.GetCountry.GetName] не терпітиме такого ставлення і переосмислить свої пріоритети."
  western_schism.1002.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
  western_schism.1100.title: "Оманлива підтримка [target_country.Custom('CL_GEN')]"
  western_schism.1100.desc: "Наші відносини з #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_INST')|L]#!#! і без того були досить напруженими, а через #TOOLTIP:SITUATION,western_schism,X #L Великий західний розкол#!#! вони зіпсувалися остаточно. І хоча наш вплив на #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католицьку церкву#!#! далеко не безмежний, ми можемо скористатися ним, щоб схилити шальки терезів на свою користь."
  western_schism.1100.a: "Нам потрібно більше впливу!"
  western_schism.1100.b: "Не варто обзаводитися новими ворогами."
  western_schism.1101.title: "Тяжка образа"
  western_schism.1101.desc: "Брехливі та безпринципні посланці #ONCLICK:COUNTRY,[origin_country.GetKey] #TOOLTIP:COUNTRY,[origin_country.GetKey],X [origin_country.Custom('CL_GEN')|L]#!#! намагаються зменшити наш вплив на #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католицьку церкву#!#!! Ми не потерпимо такого ставлення. Час нагадати негідникам їхнє місце!"
  western_schism.1101.a: "[ROOT.GetCountry.Custom('common_string_we_must_do_something')]"
  western_schism.1200.title: "Сумнівні дії [target_country.Custom('CL_GEN')]"
  western_schism.1200.desc: "#TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L Католицький#!#! світ охоплений хаосом через безперервний #TOOLTIP:SITUATION,western_schism,X #L Великий західний розкол#!#!. Справді, коли до Святого Престолу рветься хибний [GetInternationalOrganization('catholic_church').GetLeaderTitle|l], це може похитнути навіть найревнішу віру. Нещодавно [target_ruler.GetName], [target_country.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_GEN')|L]#!#!, [Select_CString(target_ruler.IsFemale, 'виявилася замішана', 'виявився замішаний')] в одному дипломатичному інциденті, з якого можна припустити, що [Select_CString(target_ruler.IsFemale, 'вона', 'він')] таємно підтримує хибного претендента. Нам слід відправити до [target_country.Custom('CL_GEN')] посольство, щоб з'ясувати [Select_CString(target_ruler.IsFemale, 'її', 'його')] справжні наміри та переконатися, що [target_country.GetGovernment.GetRulerTitle|l] не [Select_CString(target_ruler.IsFemale, 'збилася', 'збився')] з істинного шляху."
  western_schism.1200.a: "Посольство вирушить до [target_country.Custom('CL_GEN')]."
  western_schism.1200.b: "У нас повно інших турбот."
  western_schism.1201.title: "Папська делегація"
  western_schism.1201.desc: "[target_schism_pope_cardinal.GetName] [Select_CString(target_schism_pope_cardinal.IsFemale, 'прислала', 'прислав')] до нашого двору свого посланця. Ми поки не знаємо, в чому полягає мета цього візиту, але [GetInternationalOrganization('catholic_church').GetLeaderTitle|l] напевно розраховує, що легата приймуть як офіційного представника #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католицької церкви#!#! — і йому напевно доручено дізнатися, яку позицію ми займаємо щодо #TOOLTIP:SITUATION,western_schism,X #L Великого західного розколу#!#!. І нехай ми не маємо права вказати легату на двері, принаймні ми можемо відкрито заявити про те, на чиєму ми боці."
  western_schism.1201.a: "Звісно, [target_schism_pope_cardinal.GetNameWithNoTooltip] — істинний [GetInternationalOrganization('catholic_church').GetLeaderTitle|l]."
  western_schism.1201.b: "Наш кандидат — [target_schism_opponent_cardinal.GetNameWithNoTooltip]."
  western_schism.1300.title: "Скликання собору"
  western_schism.1300.desc: "Наше становище в курії зараз вельми сприятливе: у нас достатньо прихильників, щоб можна було скликати собор у [target_location.Custom('LR_PREP')|l] [target_location.GetName]. І хоча #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L католицька церква#!#! напевно сумніватиметься в законності подібного собору, головне — з його заявами погодяться наші послідовники, тим самим продемонструвавши кардиналам наш вплив. Ми не в силах покласти край #TOOLTIP:SITUATION,western_schism,X #L Великому західному розколу#!#!, але собор, на якому [GetInternationalOrganization('catholic_church').GetLeaderTitle|l] явить іншим свій авторитет, стане важливим кроком до вирішення конфлікту на нашу користь."
  western_schism.1300.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  western_schism.1300.a.tt: "Кожна країна, що сповідує #L [THIS.GetReligion.GetAdjective|l]у#! віру, отримує [ShowBiasValue('schism_called_council')|+=0] до думки про #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#!"
  western_schism.1301.title: "Собор [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  western_schism.1301.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] нашої країни приймає у себе послів з #ONCLICK:COUNTRY,[council_country.GetKey] #TOOLTIP:COUNTRY,[council_country.GetKey],X [council_country.Custom('CL_GEN')|L]#!#!. Вони прибули до нашої країни із закликом: в[ROOT.GetCountry.Custom('clergy_essyasesi')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] повин[ROOT.GetCountry.Custom('clergy_ennanoni')] вирушити на собор у [target_location.Custom('LR_PREP')|l] [target_location.GetName]. І хоча противники цього заходу вже сумніваються в законності нового собору, не можна виключати, що на ньому буде зроблено великий крок до закінчення #TOOLTIP:SITUATION,western_schism,X #L Великого західного розколу#!#!."
  western_schism.1301.a: "Висловимо підтримку та відправимося на собор."
  western_schism.1301.b: "Потрібно буде визнати авторитет собору."
  western_schism.1301.c: "Яка зухвалість! Ми відмовляємося слухати цих самозванців."
  western_schism.2000.title: "Католицька церква знову єдина!"
  western_schism.2000.desc: "Завдяки зусиллям #ONCLICK:COUNTRY,[winner_country.GetKey] #TOOLTIP:COUNTRY,[winner_country.GetKey],X [winner_country.Custom('CL_GEN')|L]#!#! собор нарешті покінчив із Великим західним розколом. На престол святого Петра сходить [GetInternationalOrganization('catholic_church').GetLeaderTitle|l] нової доби. #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L Католицька церква#!#! зуміла відновити єдність, хоча авторитет папської влади був ґрунтовно підірваний. Залишається сподіватися, що шкода, завдана нашій вірі, не виявиться непоправною, а [target_character.GetName] проявить себе [Select_CString(target_character.IsFemale, 'гідною', 'гідним')] титулу «[GetInternationalOrganization('catholic_church').GetLeaderTitle|l]»."
  western_schism.2000.title.unresolved: "Розкол сходить нанівець"
  western_schism.2000.desc.unresolved: "Не вдалося скликати Собор для вирішення цього питання, і зазіхання суперників згасли через брак підтримки. [ShowSituationName('western_schism')] завершується, і жоден із претендентів не визнаний як законний [GetInternationalOrganization('catholic_church').GetLeaderTitle], а [GetInternationalOrganization('catholic_church').GetName] залишається із сильно підірваною повагою до цієї посади. Будемо сподіватися, що це не завдало непоправної шкоди нашій вірі."
  western_schism.2000.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  western_schism.2100.title: "Новий [GetInternationalOrganization('catholic_church').GetLeaderTitle] для церкви"
  western_schism.2100.desc.common: "Після наполегливих спроб покласти на соборі край #TOOLTIP:SITUATION,western_schism,X #L Великому західному розколу#!#! нам остаточно стало зрозуміло, що наш кандидат — єдина людина, яка безумовно має право носити титул «[GetInternationalOrganization('catholic_church').GetLeaderTitle|l]». І хоча деякі до сіх пір займають сторону єретика та самозванця, нас все-таки підтримує достатньо прихильників, щоб #TOOLTIP:SITUATION,western_schism,X #L Великий західний розкол#!#! можна було сміливо оголосити пережитком минулого."
  western_schism.2100.desc.a: "$western_schism.2100.desc.common$\n\nЗ тією підтримкою, якою ми зуміли заручитися, ми без труднощів знайдемо відповідного кандидата з наших власних лав і повернемо папський авторитет вічному місту #TOOLTIP:LOCATION,rome,X #L Риму#!#!."
  western_schism.2100.desc.b: "$western_schism.2100.desc.common$\n\nЗавдяки нашому впливу в курії, ми зможемо зберегти усталену традицію папства в #TOOLTIP:LOCATION,avignon,X #L Авіньйоні#!#!."
  western_schism.2100.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  western_schism.20.title: "Два єпископи — один престол"
  western_schism.20.desc: "У нашій країні точиться неабияка боротьба за єпископство. Спорожнілий престол ледь устиг охолонути, як права на нього заявили одразу двоє претендентів: один із них — з римською печаткою, інший — з печаткою від іншого папи. Кожен із них погрожує іншому #R відлученням#! від церкви, і кожен вимагає від нас визнати його. Тим часом єпархія й досі не має очільника; священники не знають, що робити, і всі чекають, коли [ROOT.GetCountry.GetGovernment.GetRuler.GetName] нарешті вкаже їм на істинного пастиря."
  western_schism.20.a: "Престол належить посланцеві Рима."
  western_schism.20.b: "Престол належить другому посланцеві."
  western_schism.20.c: "Нехай сперечаються; гроші підуть нам."
  western_schism.21.title: "Відмова від покори"
  western_schism.21.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'отримала', 'отримав')] від правознавців та наставників духовних шкіл зухвалу пораду: не визнавати #Y жодного#! із претендентів доти, доки тіара остаточно не відійде комусь одному з них, а християнський світ не возз'єднається. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|U] нажахан[ROOT.GetCountry.Custom('clergy_yiaei')] такою пропозицією; королівські ж скарбники нишком радіють: це означає, що їм не доведеться сплачувати зайві побори."
  western_schism.21.a: "Ми не визнаватимемо папу, доки церква не возз'єднається."
  western_schism.21.b: "Ми залишимося вірними церкві."
  western_schism.22.title: "Суперництво збирачів аннатів"
  western_schism.22.desc: "З різницею в кілька днів до нас прибули збирачі податків від обох пап, кожен зі своїм вірчим листом із господарською печаткою. Обидва стали вимагати від нас сплатити з кожного бенефіція в країні належні їм — а точніше, істинному папі — #Y аннати#!, тобто прибутки церковників за перший рік служби. Вони кидають один на одного презирливі погляди: кожен ладен поживитися з нашої скарбниці."
  western_schism.22.a: "Рим отримає належне."
  western_schism.22.b: "Заплатимо представникові іншого претендента."
  western_schism.22.c: "Виженемо обох геть. Гроші залишаться в нас."
  western_schism.23.title: "Проголошення Ювілею"
  western_schism.23.desc: "Один із пап проголосив #Y Ювілейний рік#!, пообіцявши повний відпуст гріхів кожному паломникові, який прийде поклонитися мощам апостолів. Інший папа оголосив, що це — не більше ніж спроба обдурити вірян і змусити їх розлучитися зі сріблом. Утім, люд уже збирається в дорогу і просить у нас благословення."
  western_schism.23.a: "Ідіть, віряни. Нехай небо буде ласкавим до вас."
  western_schism.23.b: "Це не благо, а обман. Ніхто нікуди не піде."
  western_schism.24.title: "Торговці індульгенціями"
  western_schism.24.desc: "На наших ринках юрмляться продавці індульгенцій — грамот із печатками того чи іншого папи. Кожен із них гучно запевняє, що саме його індульгенція і ніяка інша дозволить вільно ввійти до раю. Простий люд слухняно скуповує в них грамоти, однак у кожного на серці лежить важкий тягар: невже спасіння можна продавати, немов на торгах, і хіба церква з двома головами може розібратися, який саме ключ відімкне браму?"
  western_schism.24.a: "Видати їм дозволи на торгівлю в обмін на частку від продажу."
  western_schism.24.b: "Прогнати цих шахраїв із вулиць."
  western_schism.25.title: "Проповідник останніх днів"
  western_schism.25.desc: "Містами й селами нашої країни мандрує сухорлява постать у волосяниці — [apocalyptic_preacher.GetName]. Ця людина повсякчас збирає довкола себе юрби, що жадібно ловлять кожне [Select_CString(apocalyptic_preacher.IsFemale, 'її', 'його')] слово. Двоголова церква, стверджує [Select_CString(apocalyptic_preacher.IsFemale, 'вона', 'він')], — це вірний знак кінця світу, і лише #Y кара небесна#! може врятувати країну від заблудлих церковників. Заплакані селяни, поскидавши взуття, йдуть за [Select_CString(apocalyptic_preacher.IsFemale, 'проповідницею', 'проповідником')], а наш[ROOT.GetCountry.Custom('clergy_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] спогляда[ROOT.GetCountry.Custom('clergy_yeyut')] це з тривогою."
  western_schism.25.a: "Нехай проповідує. Людям потрібна надія."
  western_schism.25.a.tt: "#Y [apocalyptic_preacher.GetName]#! проповідуватиме далі. З часом ми можемо втратити контроль над подіями."
  western_schism.25.b: "Негайно покласти край цим блюзнірським промовам!"
  western_schism.26.title: "Радикальні флагеланти"
  western_schism.26.desc: "Рух каяття перетворився на бунт: послідовники, яких веде за собою [apocalyptic_preacher.GetName], шмагають себе до крови на очах у народу й привселюдно волають, що кожен священник — слуга Антихриста, а кожен папа — шахрай. Бичівники більше не слухають наших наказів; на дорогах — юрмища шаленців із дикими очима та батогами."
  western_schism.26.a: "Знищити їх, хоч би чого це коштувало."
  western_schism.26.b: "Спрямувати їхню лють проти антипапи."
  western_schism.27.title: "Кардинал, що похитнувся"
  western_schism.27.desc: "Курія-суперниця потай намагається переманити на свій бік одного з наших кардиналів: престол, який йому обіцяють, набагато цінніший за будь-які наші дарунки. Сам кардинал поки що не оголосив про своє рішення, проте, судячи з ухильного тону в листуванні, його вірність усе ж можна купити. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'повинна', 'повинен')] вирішити, чи варта вона цих витрат."
  western_schism.27.a: "Викупити його сумління, доки він не розпрощався з ним остаточно."
  western_schism.27.b: "Нехай іде. Людина, яку можна купити, нічого не варта."
  western_schism.28.title: "Лист від святої"
  western_schism.28.desc: "Наш двір отримав листа від святої, яку народ глибоко шанує за видіння, що сходять на неї. У листі вона щонайпереконливіше закликає нас стати на бік єдиного гідного римського понтифіка й заразом схилити до цього кардиналів. Переписаний багаторазово лист стрімко шириться серед вірян, і [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] знемага[ROOT.GetCountry.Custom('clergy_yeyut')] в очікуванні рішення, яке ухвалить [ROOT.GetCountry.GetGovernment.GetRuler.GetName]."
  western_schism.28.a: "Свята промовляє істину. Нехай до нас прислухається весь християнський світ!"
  western_schism.28.b: "Ми не підемо на повідку в якихось видінь."
  western_schism.29.title: "Щедрість курії"
  western_schism.29.desc: "Обраний нами папа прагне зберегти вірність своїх кардиналів, а тому щедро осипає наш двір дарунками: мощами в позолочених релікваріях, численними диспенсаціями та золотом — настільки щедро, що питання виникли б у будь-кого. У листах до нас він розсипається в подяках, але водночас натякає на певні очікування щодо нас. Якщо ми погодимося їх виправдати, влада папи над нами зміцниться. Відмова ж дорівнюватиме відкритому звинуваченню папи у #R святокупстві#!."
  western_schism.29.a: "Прийняти його дарунки — і зміцнити узи, що єднають нас."
  western_schism.29.b: "Симонія — це гріх. Ми відмовляємося."
  western_schism.30.title: "Диспути докторів"
  western_schism.30.desc: "Між очільниками кафедри богослов’я в нашому університеті пролягла прірва. Причиною розбіжностей стало непросте — і небезпечне — питання: чи може #Y вселенський собор#! засудити папу й скинути його заради блага церкви? Молодші доктори твердять, що іншого способу подолати розкол немає; старші ж наставники переконані, що такий вчинок стане прокляттям для всіх. Обидві сторони чекають, коли [ROOT.GetCountry.GetGovernment.GetRuler.GetName] розв’яже цю суперечку."
  western_schism.30.a: "Собор може засудити кого завгодно — навіть папу. Нехай так і буде."
  western_schism.30.b: "Це єресь! Її слід одностайно засудити."
  western_schism.31.title: "За ким підуть кардинали?"
  western_schism.31.desc: "Кардинали сідлають мулів, збираючись на консисторію. Перед від’їздом зостається з’ясувати лише одне: які вказівки дасть їм [ROOT.GetCountry.GetGovernment.GetRuler.GetName], оскільки й досі незрозуміло, на чий бік мають стати наші церковні мужі. День у день розкол між церквами лише поглиблюється, напруга зростає, а спокуса просто змовчати стає тільки дужчою."
  western_schism.31.a: "Підкоріться Риму — місту апостола."
  western_schism.31.b: "Підкоріться іншому претендентові — церкві потрібна реформа."
  western_schism.31.c: "Нехай кожен чинить так, як йому велить сумління."
  western_schism.32.title: "Порожня скарбниця Риму"
  western_schism.32.desc: "Скрині міста Святого Петра порожні. Кардинали, що залишилися без платні, міряють кроками коридори, бурмочучи собі під ніс, тоді як інша курія в Авіньйоні влаштовує на десятини з половини християнського світу щедрі учти й убирається в шовк. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] побоюється, що слуги Риму, невдоволені своєю бідністю, можуть назавжди покинути місто."
  western_schism.32.a: "Продавайте посади. Рим не жебракуватиме."
  western_schism.32.b: "Попросимо допомоги у вірних князів."
  western_schism.33.title: "Римський натовп"
  western_schism.33.desc: "Народ Риму заполонив вулиці, від гамору здригаються всі вікна в палаці: люди кричать, що папство #Y має залишатися італійським#! і горе тому кардиналові, який надумає знову перенести його до Франції. Натовп загрозливо поглядає на курію, і [ROOT.GetCountry.GetGovernment.GetRuler.GetName|l] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'повинна', 'повинен')] обрати між люттю натовпу та гідністю церкви."
  western_schism.33.a: "Схилімося перед волею народу Риму."
  western_schism.33.b: "Очистьмо вулиці й відновімо лад."
  western_schism.34.title: "Взаємне відлучення"
  western_schism.34.desc: "До нас надійшли вісті одразу з обох курій: кожен папа врочисто #R відлучив#! іншого, а також кожного князя, священника й селянина, що насмілився піти не за тим пастирем. Наш люд у жаху хреститься, шепочучи, що вони приречені незалежно від свого вибору, і що в цілій половині християнського світу церковні таїнства втратили зміст."
  western_schism.34.a: "Заспокоймо їх величним священним обрядом."
  western_schism.34.b: "Страх — це важіль. Скористаймося ним, щоби відібрати гроші в церкви."
  western_schism.35.title: "Реліквія сумнівної справжності"
  western_schism.35.desc: "Монастир на наших землях виявив якусь реліквію й запевняє, що вона благословить того папу, який є законним вікарієм Христа. Прочани вже юрмляться біля воріт. Суперницькі священники кричать про #R підробку#! і вимагають спалити реліквію. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'повинна', 'повинен')] вирішити, чи зробити це диво стягом нашої віри, чи дозволити богословам холоднокровно дослідити цей артефакт."
  western_schism.35.a: "Це дар небес, і його слід шанувати."
  western_schism.35.b: "Нехай учені мужі пильніше дослідять це «диво»."
  western_schism.36.title: "Найманці для курії"
  western_schism.36.desc: "Ми отримали сповнений розпачу лист, скріплений печаткою обраного нами папи: він благає надіслати зброю, людей і гроші, щоби силою вирвати Папську Державу з рук самозванця, оскільки слова й голоси виявилися безсилими. Загін загартованих списоносців готовий вирушити, якщо [ROOT.GetCountry.GetGovernment.GetRuler.GetName|l] заплатить їм зі своєї скарбниці."
  western_schism.36.a: "Відрядімо загін. Наш папа отримає вояків."
  western_schism.36.b: "Він зачекає, у нас вистачає власних воєн."
  western_schism.37.title: "Нейтральний князь"
  western_schism.37.desc: "Наші найхитромудріші радники, присунувшись ближче, дають розважливу пораду: можна не підтримати жодного з пап, але запропонувати їм обом нашу вірність, аби вони спробували переманити нас золотом і привілеями. Таке рішення озолотить нас, але віряни недарма всюди кажуть, що без довіри не варто чекати любови."
  western_schism.37.a: "Пообіцяймо всім, не підтримаймо нікого та наживімося на обох."
  western_schism.37.b: "Ми не дворушники. Оберімо папу."
  western_schism.38.title: "Чутки про великий собор"
  western_schism.38.desc: "Сміливі чутки ширяться всім християнським світом: кардинали #Y обох#! сторін, втомившись від безчестя, можуть скликати великий собор, щоб засудити пап-суперників та одним махом скинути обох. Для декого це єдине мирне рішення, інші бачать у цьому єресь, бо хіба хтось може бути вищим за вікарія Христа? [ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'повинна', 'повинен')] обрати сторону ще до початку собору."
  western_schism.38.a: "Собор може бути нашою єдиною надією на мир. Підтримаймо його."
  western_schism.38.b: "Жоден собор не може бути вищим за вікарія Христа. Засудімо його."
  western_schism.39.title: "Третій претендент"
  western_schism.39.desc: "Сталося немислиме. Рада кардиналів оголосила про усунення обох пап та #Y обрала третього#!, щоб здолати розкол. Тепер християнство має аж трьох батьків і жодного глави. Жоден зі старих пап не бажає поступатися своїм престолом, і кожен європейський двір знову має замислитися над тим, де ж перебуває істинна церква Христа."
  western_schism.39.a: "Собор ухвалив рішення. Ми визнаємо обраного папу."
  western_schism.39.b: "Ми залишимося з тим папою, якого вже знаємо."
  western_schism.2200.desc: "Ще один крок, і ми прийдемо до простого, але вишуканого вирішення труднощів, викликаних #TOOLTIP:SITUATION,western_schism,X #L Великим західним розколом#!#!. Якщо ми примусимо обидві сторони відмовитися від претензій на Святий Престол та оголосимо нові вибори, ми доб'ємося того, що на чолі церкви знову стоятиме правочинний носій титулу «[GetInternationalOrganization('catholic_church').GetLeaderTitle|l]», і зможемо нарешті зайнятися відновленням руйнувань, зазнаних у ці часи розбрату. [GetInternationalOrganization('catholic_church').GetLeaderTitle|U], безсумнівно, гідно впорається із завданням об'єднання роз'єднаних священників та закріплення істинної віри."