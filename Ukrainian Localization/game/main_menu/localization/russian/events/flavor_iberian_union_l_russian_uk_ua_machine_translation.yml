l_russian:
  flavor_iberian_union.1.title: "Іберійське весілля"
  flavor_iberian_union.1.desc: "Шлюб, що об’єднав корони #ONCLICK:COUNTRY,[iu_member_a.GetKey] #TOOLTIP:COUNTRY,[iu_member_a.GetKey],X [iu_member_a.Custom('CL_GEN')|L]#!#! та #ONCLICK:COUNTRY,[iu_member_b.GetKey] #TOOLTIP:COUNTRY,[iu_member_b.GetKey],X [iu_member_b.Custom('CL_GEN')|L]#!#!, дає змогу викувати міцний союз між нашими країнами. Хоча цей союз народився з політичної необхідности, [ROOT.GetCountry.GetGovernment.GetAdjective|l]е подружжя, судячи з усього, цілком щасливе у шлюбі, і разом вони зміцнюють унію, творячи міцне об’єднання, яке можна вважати великою державою в #TOOLTIP:CONTINENT,europe,X #L Європі#!#!."
  flavor_iberian_union.1.historical_info: "Найвідоміший з іберійських родових союзів було укладено в 1469 році шлюбом Ізабелли I Кастильської та Фердинанда II Арагонського, католицьких королів. Їхній союз об’єднав дві найвеличніші корони півострова, зберігши при цьому окремі установи кожної, а їхній онук Карл успадкував обидві як єдине королівство. Століття потому, в 1580 році, Філіп II висунув права на спорожнілий португальський трон і об’єднав Кастилію, Арагон та Португалію під владою іспанських Габсбургів аж до Португальської реставрації 1640 року."
  flavor_iberian_union.1.a: "Нехай ніщо не порушить єднання двох наших країн!"
  flavor_iberian_union.2.title: "Іберійська унія"
  flavor_iberian_union.2.desc: "Корони #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! перейшли до одного правителя. Те, що починалося як шлюб двох домів, стало особистою унією: трони наших країн тепер спочивають на одному чолі. Кожне королівство зберігає свої закони, свої суди та свою гордість, але в питаннях права на владу та спадковости роду вони говорять одним голосом. Народжується Іберійська унія — а разом із нею й надія на державу, здатну змагатися з будь-якою у християнському світі."
  flavor_iberian_union.2.historical_info: "Коли спадкоємець двох корон успадкував обидві, утворилося не єдине королівство, а складена монархія: окремі країни зі спільним правителем. Такою була конституційна дійсність Іспанської монархії, де Кастилія, Арагон, а згодом і Португалія зберігали кожна свої #italic кортеси#!, закони та врядування за спільного короля. Такі унії тривали лише доти, доки існував спільний рід, а брак спадкоємця міг розділити те, що з’єднав шлюб."
  flavor_iberian_union.2.a: "Нехай наші країни процвітають як одна."
  flavor_iberian_union.3.title: "Іберійське весілля"
  flavor_iberian_union.3.desc: "Питання престолонаслідування тяжким тягарем лежить над нашою країною, доки [initiator_candidate.GetName] [Select_CString(initiator_candidate.IsFemale,'неодружена', 'неодружений')]. [ROOT.GetCountry.GetGovernment.GetCourtTitle] підштовхує #TOOLTIP:ESTATE_TYPE,crown_estate,X #L корону#!#! до пошуків шлюбу задля забезпечення престолонаслідування, і лунають пропозиції пов’язати нашу долю з однією з решти #TOOLTIP:RELIGIONGROUP,christian,X #L християнських#!#! корон #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!. Без сильного спадкоємця [ROOT.GetCountry.GetFlavorRank] мож[ROOT.GetCountry.Custom('endrank_eut')] зіткнутися зі смутою, суперницькими претендентами і навіть чужоземним втручанням."
  flavor_iberian_union.3.historical_info: "Так зване Іберійське весілля відіграло провідну роль у родовій кризі, що охопила Кастилію після смерти короля Енріке IV. На трон зазіхали двоє претендентів: Ізабелла Кастильська, яку підтримав її чоловік Фердинанд Арагонський, та її племінниця Хуана, за якою стояла Португалія. Протистояння завершилося перемогою Ізабелли та Фердинанда, що започаткувала добу так званих католицьких монархів. Укладена ними унія між Кастилією та Арагоном призвела до утворення єдиної іспанської держави."
  flavor_iberian_union.3.a: "Надішлемо пропозицію про шлюб [iu_partner_a.Custom('CL_DAT')]."
  flavor_iberian_union.3.b: "Звернімося натомість до [iu_partner_b.Custom('CL_GEN')]."
  flavor_iberian_union.3.c: "Знайдемо інший спосіб."
  flavor_iberian_union.4.title: "Іберійське весілля"
  flavor_iberian_union.4.desc: "Посланець #ONCLICK:COUNTRY,[iu_initiator.GetKey] #TOOLTIP:COUNTRY,[iu_initiator.GetKey],X [iu_initiator.Custom('CL_GEN')|L]#!#! прибув до нас і пропонує шлюбний союз: [initiator_candidate.GetName] та [iu_chosen_candidate.GetName] з нашого дому поберуться, щоби об’єднати наші країни. Ця пропозиція обіцяє взаємне процвітання та стабільність, проте частина радників ставиться до неї скептично. Такий союз міг би скріпити союзництво проти спільних ворогів і згодом привести до об’єднання корон, але інші попереджають, що з часом він може загрожувати нашій незалежності."
  flavor_iberian_union.4.a: "Ми нічого не втратимо."
  flavor_iberian_union.4.b: "Розважливіше буде їм відмовити."
  flavor_iberian_union.5.title: "Згода на династичний шлюб"
  flavor_iberian_union.5.desc: "[ROOT.GetCountry.GetFlavorRank] та [iu_chosen.GetName] б’ють у дзвони: [initiator_candidate.GetName] та [iu_chosen_candidate.GetName] беруть шлюб, започатковуючи єдиний [ROOT.GetCountry.GetGovernment.GetAdjective|l]ий рід. Люд заповнює вулиці, й обидва двори підносять келихи за союз, над яким працювали посли та єпископи. Те, що було холодним політичним розрахунком, тепер скріплено обітницями та торжеством.\n\nЦей шлюб дає значно більше, ніж пору святкувань. Наші династії з’єднані, доми пов’язані кров’ю, і якщо шлюб буде благословенний дитиною, що успадкує обидві корони, настане день, коли нашими країнами правитимуть як однією. А поки що наше престолонаслідування стало міцнішим, а наше становище серед дворів християнського світу зростає разом із пишнотою свята."
  flavor_iberian_union.5.a: "Чудова звістка!"
  flavor_iberian_union.6.title: "Відмова від династичного шлюбу"
  flavor_iberian_union.6.desc: "[iu_chosen.GetName] відхиляє нашу пропозицію про шлюб. Це рішення на довгі роки затьмарить відносини між нашими країнами. Гірше того, питання нашого престолонаслідування й надалі лишається невирішеним."
  flavor_iberian_union.6.a: "Ми знайдемо інше рішення."
  flavor_iberian_union.7.title: "Вибір на чужу користь"
  flavor_iberian_union.7.desc: "[iu_initiator.GetName] пов’язує свій рід із родиною [iu_chosen.GetName], а не з нашою, хоча ми були не менш гідним вибором. Образа пече, але в ній є й нагода: такої зневаги достатньо, щоб силою взяти те, що мало дістатися нам через шлюб."
  flavor_iberian_union.7.a: "Ця зневага не лишиться без відповіді."
  iu_marriage_may_form_union_tt: "Це може призвести до утворення [Concept('union', 'унії')|e]."
  iu_spurned_will_be_displeased_tt: "Рід [iu_spurned.GetName] може погано сприйняти те, що для цього шлюбу обрали не їх."