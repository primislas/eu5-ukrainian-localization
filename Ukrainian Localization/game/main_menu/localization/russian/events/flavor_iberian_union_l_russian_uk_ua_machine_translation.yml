l_russian:
  flavor_iberian_union.1.title: "Іберійське весілля — Кастилія — привід для війни заради встановлення особистої унії (опущений варіант)"
  flavor_iberian_union.1.desc: "Шлюб, що об’єднав корони #ONCLICK:COUNTRY,[iu_member_a.GetKey] #TOOLTIP:COUNTRY,[iu_member_a.GetKey],X [iu_member_a.Custom('CL_GEN')|L]#!#! та #ONCLICK:COUNTRY,[iu_member_b.GetKey] #TOOLTIP:COUNTRY,[iu_member_b.GetKey],X [iu_member_b.Custom('CL_GEN')|L]#!#!, — це нагода викувати тривкий зв’язок між нашими землями. Хоча цей союз і народився з політичної потреби, [ROOT.GetCountry.GetGovernment.GetAdjective|l]е подружжя здається цілком щасливим у шлюбі, і вони разом працюють над тим, щоб зміцнити унію та розбудувати стійкий політичний устрій, що вважатиметься великою потугою в #TOOLTIP:CONTINENT,europe,X #L Європі#!#!."
  flavor_iberian_union.1.historical_info: "Найвідоміший з іберійських родових союзів був укладений 1469 року завдяки шлюбу Ізабели I Кастильської та Фердинанда II Арагонського, Католицьких королів. Їхній союз об’єднав дві найбільші корони півострова, зберігши при цьому окремі установи кожної з них, а їхній онук Карл успадкував обидві як єдиний край. Століття потому, у 1580 році, Філіп II Іспанський заявив права на вільний португальський престол, об’єднавши Кастилію, Арагон та Португалію під владою іспанських Габсбургів аж до відновлення незалежности Португалії 1640 року."
  flavor_iberian_union.1.a: "Нехай ніщо не порушить єднання двох наших країн!"
  flavor_iberian_union.2.title: "Іберійська унія"
  flavor_iberian_union.2.desc: "Корони #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! перейшли до єдиного володаря. Те, що починалося як шлюб між двома домами, стало особистою унією, і тепер престоли наших земель спочивають на одному чолі. Кожне королівство зберігає власні закони, власні суди та власну гордість, але в питаннях права на владу та роду вони промовляють єдиним голосом. Іберійська унія народилася, а з нею — і сподівання на міць, що не поступиться жодній потузі християнського світу."
  flavor_iberian_union.2.historical_info: "Коли спадкоємець двох корон успадковував обидві, наслідком стало не єдине королівство, а складена монархія: окремі краї зі спільним володарем. Такою була конституційна дійсність Іспанської монархії, у якій Кастилія, Арагон, а згодом і Португалія зберігали власні #italic кортеси#! (збори), закони та врядування під рукою спільного короля. Такі союзи тривали лише доти, доки тривав спільний правлячий дім, а відсутність спадкоємця могла розділити те, що поєднав шлюб."
  flavor_iberian_union.2.a: "Нехай наші краї процвітають у єдності."
  flavor_iberian_union.3.title: "Іберійське весілля — Кастилія — привід для війни заради встановлення особистої унії (опущений варіант)"
  flavor_iberian_union.3.desc: "Питання спадкоємства тяжко нависло над #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_INST')|L]#!#!, поки [initiator_candidate.GetName] залишається [Select_CString(initiator_candidate.IsFemale, 'незаміжньою', 'неодруженим')]. Наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] підштовхує #TOOLTIP:ESTATE_TYPE,crown_estate,X #L Корону#!#! до укладення шлюбу задля забезпечення спадкоємства, і лунають пропозиції поєднати нашу долю з однією з інших [ShowReligionGroupAdjective('christian')|l]их корон #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!. Без сильного спадкоємця [ROOT.GetCountry.GetFlavorRank|l] мож[ROOT.GetCountry.Custom('endrank_eut')] зіткнутися зі смутою, появою претендентів чи навіть чужоземним втручанням."
  flavor_iberian_union.3.historical_info: "Подія під назвою «Іберійське весілля» відображає кризу престолонаслідування по смерті Енріке IV Кастильського. Після його смерті за трон боролися дві претендентки: Ізабела Кастильська, підтримувана своїм чоловіком Фердинандом Арагонським, та її небога Хуана, за якою стояла Португалія. Війна завершилася перемогою Ізабели та Фердинанда, що закріпило владу Ізабели та поклало початок славетному правлінню Католицьких королів. Ця унія Кастилії та Арагону згодом привела до утворення єдиної Іспанії."
  flavor_iberian_union.3.a: "Надіслати шлюбну пропозицію до [iu_partner_a.Custom('CL_GEN')]."
  flavor_iberian_union.3.b: "Натомість звернутися до [iu_partner_b.Custom('CL_GEN')]."
  flavor_iberian_union.3.c: "Знайдемо інший спосіб."
  flavor_iberian_union.4.title: "Іберійське весілля — Кастилія — привід для війни заради встановлення особистої унії (опущений варіант)"
  flavor_iberian_union.4.desc: "До нашого двору прибув посланець із #ONCLICK:COUNTRY,[iu_initiator.GetKey] #TOOLTIP:COUNTRY,[iu_initiator.GetKey],X [iu_initiator.Custom('CL_GEN')|L]#!#!. Він пропонує міжродовий шлюб між [initiator_candidate.GetName] та [Select_CString(iu_chosen_candidate.IsFemale, 'представницею', 'представником')] нашого дому [iu_chosen_candidate.GetName], аби поєднати наші краї. Ця пропозиція несе обіцянку взаємного процвітання та стабільности, проте дехто з наших радників ставиться до неї зі скептицизмом. Хоча такий союз міг би зміцнити союз проти спільних ворогів і потенційно привести до об’єднання корон, інші застерігають, що в далекоглядній перспективі це може загрожувати нашій незалежности."
  flavor_iberian_union.4.a: "Ми нічого не втратимо."
  flavor_iberian_union.4.b: "Розважливіше буде їм відмовити."
  flavor_iberian_union.5.title: "Згода на династичний шлюб"
  flavor_iberian_union.5.desc: "Дзвони лунають [ROOT.GetCountry.Custom('rank_ua_INST')] так само, як і в #ONCLICK:COUNTRY,[iu_chosen.GetKey] #TOOLTIP:COUNTRY,[iu_chosen.GetKey],X [iu_chosen.Custom('CL_PREP')|L]#!#!, коли [initiator_candidate.GetName] та [iu_chosen_candidate.GetName] поєднуються шлюбом в єдиний [ROOT.GetCountry.GetGovernment.GetAdjective|l]ий дім. Люди заповнили вулиці, а при обох дворах виголошують заздоровниці за союз, над укладенням якого старанно працювали посли та єпископи. Те, що колись було питанням сухого державного розрахунку, нині скріплено обітницями та святкуванням.\n\nЦей союз приносить набагато більше, ніж просто низку святкувань. Наші роди поєднані, наші доми скріплені кров’ю, і якщо цей шлюб буде благословенний дитиною, що успадкує обидві корони, може настати день, коли обидва наші краї перебуватимуть під єдиною владою. Поки що наше спадкоємство стало значно надійнішим, а наша вага серед дворів християнського світу зростає разом із пишнотою цієї події."
  flavor_iberian_union.5.a: "Чудова звістка!"
  flavor_iberian_union.6.title: "Відмова від династичного шлюбу"
  flavor_iberian_union.6.desc: "[iu_chosen.GetName] відхили[iu_chosen.Custom('end_vlaloly')] нашу шлюбну пропозицію. Хоча це рішення безперечно затьмарить наші відносини на довгі роки, найгірше те, що питання нашого престолонаслідування так і залишилося нерозв’язаним."
  flavor_iberian_union.6.a: "Ми знайдемо інше рішення."
  flavor_iberian_union.7.title: "Знехтувані"
  flavor_iberian_union.7.desc: "[iu_initiator.GetName] виріши[iu_initiator.Custom('end_vlaloly')] пов’язати свій дім із #ONCLICK:COUNTRY,[iu_chosen.GetKey] #TOOLTIP:COUNTRY,[iu_chosen.GetKey],X [iu_chosen.Custom('CL_INST')|L]#!#!, а не з нами, хоча ми були не менш гідним вибором. Ця образа пече, але вона відкриває і нові можливості: така зневага є достатнім виправданням, щоби взяти силою те, що мало стати нашим завдяки шлюбу."
  flavor_iberian_union.7.a: "Їхня образа не залишиться без відповіді."
  iu_marriage_may_form_union_tt: "Це може привести до утворення [Concept('union', 'унії')|e]"
  iu_spurned_will_be_displeased_tt: "[iu_spurned.GetName] мож[iu_spurned.Custom('end_eut')] обуритися тим, що перевагу в цьому шлюбі віддали іншій стороні"