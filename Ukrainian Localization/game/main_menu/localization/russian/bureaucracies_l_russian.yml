 positive_modifier_effects_TT: "Положительные эффекты:"
 neutral_modifier_effects_TT: "Постоянные эффекты:"
 negative_modifier_effects_TT: "Отрицательные эффекты:"
 board_of_revenue_bureaucracy: "Казначейство"
 board_of_revenue_bureaucracy_desc: "Эта централизованная служба отвечает за сбор и оценку доходов государства, а также распоряжение ими. На примере британского Казначейского совета и французского #italic Генерального контроля финансов#! мы видим, как при должном финансировании казначейство способно радикально увеличить доходы короны. С другой стороны, если за такой организацией не следить, её могут поразить мздоимство и лень, заставляя тратить те средства, которые она призвана защищать."
 privy_council_bureaucracy: "Тайный совет"
 privy_council_bureaucracy_desc: "Это внутренний совет особо доверенных чиновников, который служит ключевым проводником королевской власти. Такие организации, как британский Тайный совет или испанский #italic Королевский совет#!, позволяют главе государства эффективно управлять многочисленными службами единой слаженной организации. С другой стороны, без должной поддержки тот же Тайный совет легко превращается в арену для вражды между сословиями, от единства которых зависит благополучие короны."
 audit_bureau_bureaucracy: "Счётная палата"
 audit_bureau_bureaucracy_desc: "Эта специализированная служба контролирует государственные счета и выявляет коррупцию среди чиновников и сборщиков налогов. Институты, созданные по образцу французской #italic Счётной палаты#! и нидерландской #italic Ревизионной палаты#!, становились для монархов мощным инструментом для возврата упущенных доходов и привлечения чиновников к ответственности. С другой стороны, при недостатке финансирования счётная палата быстро утрачивает свою независимость — её начинают контролировать те самые стороны, за которыми она призвана надзирать."
 colonial_office_bureaucracy: "Управление по делам колоний"
 colonial_office_bureaucracy_desc: "Это министерство отвечает за проведение государственной политики на заморских территориях, управляет колониальной администрацией и контролирует там правовой режим империи. Британское Управление по делам колоний — это наглядный пример того, как организованный контроль метрополии ускоряет освоение отдалённых территорий. С другой стороны, без должного снабжения колониальные вербовщики побуждают людей покидать страну, не предлагая им лучших вариантов в пределах империи."
 admiralty_board_bureaucracy: "Адмиралтейство"
 admiralty_board_bureaucracy_desc: "Эта специальная комиссия отвечает за администрирование и снабжение военно-морских сил, а также стратегическое командование ими. Британское Адмиралтейство и морской отдел испанского #italic Военного совета#! наглядно показывают, что профессиональная администрация не менее важна для флота, чем корабли. Грамотно организованное адмиралтейство способно создать внушительный резерв хорошо обученных матросов, однако при недостаточном финансировании набор проходит без должного обучения, что разрушает традиции флота даже при росте его численности."
 foreign_ministry_bureaucracy: "Министерство иностранных дел"
 foreign_ministry_bureaucracy_desc: "Эта постоянно действующая организация отвечает за внешние связи государства. В частности, она занимается поддержанием штатного дипломатического корпуса, а также координирует внешнюю разведку. Первой профессиональной службой такого рода стало французское #italic Министерство иностранных дел#!, которое впоследствии взяли за образец другие страны. При должном финансировании такое министерство повышает престиж государства, проводя успешные переговоры. Чрезмерная экономия на нём, напротив, может привести к досадным последствиям — например, послам окажутся не по карману собственные резиденции или важные документы останутся без ответа. Очевидно, что все это вредит репутации державы."
 trade_commission_bureaucracy: "Торговая комиссия"
 trade_commission_bureaucracy_desc: "Этот государственный орган выдаёт лицензии купцам, разрешает коммерческие споры, регулирует пошлины и борется с контрабандой. На примере таких учреждений, как британская Торговая палата и контрольные советы #italic Голландской Ост-Индской компании#!, мы видим, как организованное участие государства в торговле идёт на пользу национальному благосостоянию. С другой стороны, без должных полномочий торговая комиссия превращается в беззубое пугало — монополии уклоняются от лицензий, доходы от пошлин уходят в частные руки, а торговый климат в целом ухудшается."
 war_council_bureaucracy: "Военный совет"
 war_council_bureaucracy_desc: "Этот высший орган военного командования отвечает за планирование, координацию и контроль в области сухопутных сил. Габсбургский #italic гофкригсрат#! и британское Военное министерство являют собой два разных решения одной и той же задачи командования армией, огромная численность которой не позволяет подчинить её одному человеку. Должное финансирование военного совета обеспечивает бесперебойную подготовку способных офицеров, однако при нехватке средств система поиска и поощрения талантливых бойцов даёт сбой, что приводит к распаду армейских традиций."
 ordnance_board_bureaucracy: "Артиллерийский комитет"
 ordnance_board_bureaucracy_desc: "Это специализированное ведомство отвечает за производство, хранение и поставку артиллерийских орудий, боеприпасов и сапёрного инструмента. Британское Управление боеприпасов и французский #italic Королевский артиллерийский корпус#! показывают, что профессиональный подход к осадному делу требует штатных бюрократических институтов, а не работы со случайными подрядчиками. Должное финансирование артиллерийского комитета значительно повышает боеспособность осадных частей, а при нехватке средств ситуация меняется в худшую сторону: заводы простаивают, ревизии на складах не проводятся, а укрепления приходят в негодность без должного ремонта."
 commissariat_bureaucracy: "Комиссариат"
 commissariat_bureaucracy_desc: "Это тыловое ведомство отвечает за снабжение развёрнутых армий продовольствием, припасами, формой и снаряжением. Подобная система, разработанная Лувуа для армий Людовика XIV и позднее развившаяся до #italic Интендантского корпуса#!, показывает, что благодаря централизованному снабжению армия способна вести кампании таких масштабов и сроков, которые были бы совершенно не возможны при самостоятельной добыче пропитания. При должном финансировании комиссариат обеспечивает войска достаточным количеством живой силы, а при нехватке средств вынуждает полагаться на разорительные частные контракты, расходы на которые многократно превышают выгоду от увеличения личного состава."
 central_secretariat_bureaucracy: "Центральный секретариат"
 central_secretariat_bureaucracy_desc: "В правление династии Юань #italic $zhongshu_sheng$#! был высшим органом гражданской власти, который сосредоточил в столице управление всей территорией империи. При должном финансировании секретариат легитимизирует власть династии путём твёрдого и слаженного управления, но если его не контролировать, стоимость каждого политического решения короны многократно возрастает из-за административного хаоса."
 imperial_censorate_bureaucracy: "Имперский цензорат"
 imperial_censorate_bureaucracy_desc: "Цензорат, который при династии Юань назывался #italic юшитай#!, а при династии Мин — #italic дучаюань#!, боролся с мздоимством в среде чиновников и контролировал соблюдение законов как в столице, так и в провинциях. При должном финансировании инспекторы цензурного управления способны предотвращать кражу налоговых поступлений, но при нехватке денег полномочия такого органа сокращаются, а сословия быстро начинают злоупотреблять отсутствием контроля."
 six_boards_bureaucracy: "Шесть министерств"
 six_boards_bureaucracy_desc: "Название #italic любу#! носили шесть министерств династии Мин — кадров, доходов, обрядов, войны, наказаний и общественных работ. Эти министерства сообща управляли всем государственным аппаратом и представляли собой самую распределённую бюрократическую структуру в мире. Должное их финансирование позволяет значительно увеличить налоговые поступления, однако при недостатке средств министерства превращаются в личные вотчины чиновников, и ставят собственные интересы выше государственных."
 six_boards_deactivate_disables_oversight_law_tt: "Ликвидация этого [Concept('bureaucracy', 'бюрократического механизма')|e] лишит вас доступа к правилу #TOOLTIP:LAW,six_ministries_overseer_law,X #L «Надзор за шестью министерствами»#!#!"
 grand_secretariat_bureaucracy: "Внутридворцовый секретариат"
 grand_secretariat_bureaucracy_desc: "#italic Нэйгэ#! — это внутренний совет, который фактически правил империей Мин. Его члены составляли черновики указов, служили посредниками между императором и внешними чиновниками, а также координировали работу системы любу. Грамотно организованный внутридворцовый секретариат повышает престиж империи посредством решительного и единообразного правления, но при нехватке средств он утрачивает связь с императором и начинает подрывать его легитимность, вместо того чтобы укреплять её."