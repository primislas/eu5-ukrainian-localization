l_russian:
  COLONY_FORECAST_ETA_LINE: "#T Орієнтовний час#! Близько $MONTHS|v0$ міс. до наступного поселення.\nЦя оцінка ґрунтується на поточному потоці [Concept('migration', 'поселенців')|e] до цієї колонії. Вона зміниться, якщо цей потік пришвидшиться чи сповільниться."
  COLONY_FORECAST_ETA_LINE_SHORT: "~$MONTHS|v0$ міс."
  COLONY_FORECAST_ETA_UNKNOWN: "#T Орієнтовний час#! Очікується.\nЦя колонія ще не має джерела [Concept('migration', 'поселенців')|e]. Оцінка з’явиться, щойно поселенці почнуть прибувати."
  COLONY_FORECAST_ETA_UNKNOWN_SHORT: "Очікується"
  BOTTLENECK_SOURCE_DEPLETED: "@warning_icon! @peasants!"
  BOTTLENECK_SOURCE_DEPLETED_TT: "#T Сповільнено: джерело вичерпано#!\nНаше джерело поселенців вичерпалося. У місцевості, яка відряджає #TOOLTIP:POPTYPE,peasants,X #L селян#!#! до цієї колонії, більше немає зайвих рук, тому [Concept('migration', 'міграція')|e] лишатиметься повільною, доки не знайдеться нове джерело."
  BOTTLENECK_GOODS: "@warning_icon! @goods!"
  BOTTLENECK_GOODS_TT: "#T Сповільнено: брак товарів#!\nКолонії бракує припасів. Вона отримує менше як 75% потрібних їй [Concept('goods', 'товарів')|e], тому спроможна прийняти менше нових поселенців."
  BOTTLENECK_MARITIME: "@warning_icon! @maritime_presence!"
  BOTTLENECK_MARITIME_TT: "#T Сповільнено: слабка морська присутність#!\nПоселенці мусять перетнути море, щоб дістатися цієї колонії, а наша [Concept('maritime_presence', 'морська присутність')|e] в цьому краї заслабка, щоб перевозити їх на повну силу."
  BOTTLENECK_LOW_MIGRATION: "@warning_icon! @migration!"
  BOTTLENECK_LOW_MIGRATION_TT: "#T Сповільнено: низька міграція#!\nМало хто з наших людей бажає переселятися до колоній. Наша [Concept('migration', 'міграція')|e] надто низька, щоб забезпечити сталий приплив поселенців."
  COLONIAL_CHARTER_FIRST_FLIP_SETUP: "Коли першу місцевість у колоніальній провінції заселять наші колоністи."
  COLONIAL_CHARTER_FIRST_FLIP_HEADER: "$MESSENGER$"
  COLONIAL_CHARTER_FIRST_FLIP_TITLE: "Перше поселення в місцевості $LOCATION$"
  COLONIAL_CHARTER_FIRST_FLIP_DESC: "Наші поселенці у провінції $PROVINCE$ закріпилися в місцевості $LOCATION$ — це перша частка [Concept('colonial_charter', 'колоніальної хартії')|e] $CHARTER$, що підпала під нашу корону."
  COLONIAL_CHARTER_FIRST_FLIP_FLAVOR: "З цього плацдарму розпочнеться підкорення решти."
  COLONIAL_CHARTER_FIRST_FLIP_LOG: "Перше поселення за хартією $CHARTER$: $LOCATION$"
  COLONIAL_CHARTER_FIRST_FLIP_BTN1: "Уперед!"
  COLONIAL_CHARTER_FIRST_FLIP_BTN2: "Гаразд"
  COLONIAL_CHARTER_FIRST_FLIP_BTN3: "$common_string_go_to$"
  COLONIAL_CHARTER_FIRST_FLIP_MAP: ""
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_SETUP: "Коли буде заселено першу місцевість у колоніальній провінції іншої країни."
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_HEADER: "$MESSENGER$"
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_TITLE: "Перше поселення в місцевості $LOCATION$"
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_DESC: "$COUNTRY$ закріплюється в місцевості $LOCATION$ у провінції $PROVINCE$ — це перша частка [Concept('colonial_charter', 'колоніальної хартії')|e] $CHARTER$, що підпала під їхню корону."
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_FLAVOR: "З цього плацдарму може підкоритися і решта."
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_LOG: "Перше поселення за хартією $CHARTER$ ($COUNTRY$): $LOCATION$"
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN1: "Зрозуміло."
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN2: "Гаразд"
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN3: "$common_string_go_to$"
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_MAP: ""
  COLONIAL_CHARTER_SOURCE_DEPLETED_SETUP: "Коли в джерелі міграції для колоніальної хартії вичерпуються селяни і воно обирається наново."
  COLONIAL_CHARTER_SOURCE_DEPLETED_HEADER: "$MESSENGER$"
  COLONIAL_CHARTER_SOURCE_DEPLETED_TITLE: "Джерело для «$CHARTER$» вичерпано"
  COLONIAL_CHARTER_SOURCE_DEPLETED_DESC: "Джерело переселення, що живить [Concept('colonial_charter', 'колоніальну хартію')|e] $CHARTER$ у провінції $PROVINCE$, вичерпало #TOOLTIP:POPTYPE,peasants,X #L селян#!#!. Обрано нове джерело, проте поступ може сповільнитися, доки воно не відновиться."
  COLONIAL_CHARTER_SOURCE_DEPLETED_FLAVOR: "Навіть найглибші криниці пересихають."
  COLONIAL_CHARTER_SOURCE_DEPLETED_LOG: "$CHARTER$: джерело переселення вичерпано"
  COLONIAL_CHARTER_SOURCE_DEPLETED_BTN1: "Прикро."
  COLONIAL_CHARTER_SOURCE_DEPLETED_BTN2: "Гаразд"
  COLONIAL_CHARTER_SOURCE_DEPLETED_BTN3: "$common_string_go_to$"
  COLONIAL_CHARTER_SOURCE_DEPLETED_MAP: ""
  COLONIAL_CHARTER_HALFWAY_SETUP: "Коли поступ колоніальної хартії долає 50%."
  COLONIAL_CHARTER_HALFWAY_HEADER: "$MESSENGER$"
  COLONIAL_CHARTER_HALFWAY_TITLE: "$PROVINCE$ колонізовано наполовину"
  COLONIAL_CHARTER_HALFWAY_DESC: "Наша колонізація $PROVINCE$ за [Concept('colonial_charter', 'колоніальною хартією')|e] $CHARTER$ завершена наполовину."
  COLONIAL_CHARTER_HALFWAY_FLAVOR: "Попереду важча половина шляху, але дорога назад тепер довша за дорогу вперед."
  COLONIAL_CHARTER_HALFWAY_LOG: "$CHARTER$: виконано наполовину"
  COLONIAL_CHARTER_HALFWAY_BTN1: "Рушаймо далі."
  COLONIAL_CHARTER_HALFWAY_BTN2: "Гаразд"
  COLONIAL_CHARTER_HALFWAY_BTN3: "$common_string_go_to$"
  COLONIAL_CHARTER_HALFWAY_MAP: ""
  COLONIAL_CHARTER_HALFWAY_OTHER_SETUP: "Коли поступ колоніальної хартії іншої країни долає 50%."
  COLONIAL_CHARTER_HALFWAY_OTHER_HEADER: "$MESSENGER$"
  COLONIAL_CHARTER_HALFWAY_OTHER_TITLE: "$PROVINCE$ колонізовано наполовину"
  COLONIAL_CHARTER_HALFWAY_OTHER_DESC: "Колонізація $PROVINCE$, яку здійснює $COUNTRY$ за [Concept('colonial_charter', 'колоніальною хартією')|e] $CHARTER$, завершена наполовину."
  COLONIAL_CHARTER_HALFWAY_OTHER_FLAVOR: "Попереду в них важча половина шляху."
  COLONIAL_CHARTER_HALFWAY_OTHER_LOG: "$CHARTER$: виконано наполовину ($COUNTRY$)"
  COLONIAL_CHARTER_HALFWAY_OTHER_BTN1: "Зрозуміло."
  COLONIAL_CHARTER_HALFWAY_OTHER_BTN2: "Гаразд"
  COLONIAL_CHARTER_HALFWAY_OTHER_BTN3: "$common_string_go_to$"
  COLONIAL_CHARTER_HALFWAY_OTHER_MAP: ""
  COLONY_PILL_SELF_SUSTAINING: "#G Self-sustaining#!"
  COLONY_PILL_OPERATING_AT_LOSS: "#R At a loss#!"
  COLONY_SELF_SUSTAINING_HEADER: "Самоокупна"
  COLONY_OPERATING_AT_LOSS_HEADER: "Збиткова"
  COLONY_SELF_SUSTAINING_INCOME: "Щомісячний дохід: $VAL|+=$@gold!"
  COLONY_SELF_SUSTAINING_EXPENSE: "Щомісячні видатки: #R -$VAL|2$@gold!#!"
  COLONY_SELF_SUSTAINING_RESULT: "#italic Колонія є самоокупною, оскільки її щомісячний баланс у $BALANCE|+=2$@gold! досягає необхідного порогу в #TOOLTIP:$BREAKDOWN_TAG$ $THRESHOLD|2L$@gold!#!.#!"
  COLONY_OPERATING_AT_LOSS_RESULT: "#italic Колонія є збитковою, оскільки її щомісячний баланс у $BALANCE|+=2$@gold! нижчий за необхідний поріг у #TOOLTIP:$BREAKDOWN_TAG$ $THRESHOLD|2L$@gold!#!.#!"
  COLONY_SELF_SUSTAINING_THRESHOLD_BREAKDOWN: "Щомісячні видатки × запас: $EXPENSE|2$@gold! × $BUFFER|%$ = $THRESHOLD|2$@gold!"
  COLONY_HELPFUL_ACTIONS_TITLE: "Корисні [Concept('cabinet_actions', 'доручення')|e]"
  COLONY_HELPFUL_ACTIONS_CHARTER_DESC: "Три [Concept('cabinet_actions', 'доручення')|e], що зазвичай пришвидшують колоніальну хартію:\n - Заохочувати переселення\n - Скерувати людей до колоніальної хартії\n - Заселяти порубіжжя\n\n#weak Клацніть, щоб відкрити вікно ради.#!"
  COLONY_HELPFUL_ACTIONS_LOCATION_DESC: "Три [Concept('cabinet_actions', 'доручення')|e], що зазвичай розвивають щойно колонізовану місцевість:\n - Посилити контроль\n - Розвивати провінцію\n - Заохочувати переселення\n\n#weak Клацніть, щоб відкрити вікно ради.#!"
  COLONY_HELPFUL_ACTIONS_SUBJECT_DESC: "Два [Concept('cabinet_actions', 'доручення')|e], що зазвичай допомагають зростанню колоніального намісництва:\n - Скерувати людей до колоній\n - Розвивати провінцію\n\n#weak Клацніть, щоб відкрити вікно ради.#!"