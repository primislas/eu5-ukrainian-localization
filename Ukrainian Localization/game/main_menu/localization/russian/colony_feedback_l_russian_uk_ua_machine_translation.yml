l_russian:
  COLONY_FORECAST_ETA_LINE: "#T Очікування#! Близько $MONTHS|v0$ міс. до наступного поселення.\nОцінка залежить від поточного потоку [Concept('migration', 'поселенців')|e] до цієї колонії та зміниться, якщо приплив поселенців прискориться чи сповільниться."
  COLONY_FORECAST_ETA_LINE_SHORT: "~$MONTHS|v0$ міс."
  COLONY_FORECAST_ETA_UNKNOWN: "#T Очікування#!\nДля цієї колонії поки немає джерела [Concept('migration', 'поселенців')|e]. Оцінка з’явиться, коли почнуть прибувати поселенці."
  COLONY_FORECAST_ETA_UNKNOWN_SHORT: "Очікування"
  BOTTLENECK_SOURCE_DEPLETED: "@warning_icon! @peasants!"
  BOTTLENECK_SOURCE_DEPLETED_TT: "#T Сповільнення: вичерпано джерело#!\nМи вичерпали джерело переселенців. У місцевостях, звідки до цієї колонії прибували #TOOLTIP:POPTYPE,peasants,X #L селяни#!#!, закінчився вільний люд, тож [Concept('migration', 'міграція')|e] сповільниться, доки не знайдеться нове джерело."
  BOTTLENECK_GOODS: "@warning_icon! @goods!"
  BOTTLENECK_GOODS_TT: "#T Сповільнення: брак товарів#!\nЦій колонії бракує припасів. Вона отримує менш як 75% потрібних [Concept('goods', 'товарів')|e], через що може забезпечити менше нових поселенців."
  BOTTLENECK_MARITIME: "@warning_icon! @maritime_presence!"
  BOTTLENECK_MARITIME_TT: "#T Сповільнення: обмежена морська присутність#!\nПереселенці мають подолати море, щоб дістатися цієї колонії, а наша [Concept('maritime_presence', 'морська присутність')|e] в регіоні надто слабка, щоб перевозити їх сповна."
  BOTTLENECK_LOW_MIGRATION: "@warning_icon! @migration!"
  BOTTLENECK_LOW_MIGRATION_TT: "#T Сповільнення: слабка міграція#!\nМало хто з-поміж нас готовий переселятися до колоній. Наша [Concept('migration', 'міграція')|e] надто низька, щоб забезпечити сталий приплив переселенців."
  COLONIAL_CHARTER_FIRST_FLIP_SETUP: "Коли першу місцевість колоніальної провінції заселяють наші поселенці."
  COLONIAL_CHARTER_FIRST_FLIP_HEADER: "$MESSENGER$"
  COLONIAL_CHARTER_FIRST_FLIP_TITLE: "Перше поселення в місцевості $LOCATION$"
  COLONIAL_CHARTER_FIRST_FLIP_DESC: "Наші поселенці у провінції $PROVINCE$ заснували осаду у місцевості $LOCATION$, і перша частка [Concept('colonial_charter', 'колоніального поселення')|e] $CHARTER$ перейшла під владу нашої корони."
  COLONIAL_CHARTER_FIRST_FLIP_FLAVOR: "За цим першим кроком підуть інші."
  COLONIAL_CHARTER_FIRST_FLIP_LOG: "Перше поселення на землі $CHARTER$: $LOCATION$"
  COLONIAL_CHARTER_FIRST_FLIP_BTN1: "Уперед!"
  COLONIAL_CHARTER_FIRST_FLIP_BTN2: "Гаразд"
  COLONIAL_CHARTER_FIRST_FLIP_BTN3: "$common_string_go_to$"
  COLONIAL_CHARTER_FIRST_FLIP_MAP: ""
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_SETUP: "Коли заселяється перша місцевість колоніальної провінції іншої країни."
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_HEADER: "$MESSENGER$"
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_TITLE: "Перше поселення в місцевості $LOCATION$"
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_DESC: "Країна $COUNTRY$ заснувала осаду у місцевості $LOCATION$ провінції $PROVINCE$, і перша частка [Concept('colonial_charter', 'колоніального поселення')|e] $CHARTER$ перейшла під владу її корони."
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_FLAVOR: "За цим першим кроком можуть піти інші."
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_LOG: "Перше поселення країни $COUNTRY$ на землі $CHARTER$: $LOCATION$"
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN1: "Зрозуміло."
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN2: "Гаразд"
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_BTN3: "$common_string_go_to$"
  COLONIAL_CHARTER_FIRST_FLIP_OTHER_MAP: ""
  COLONIAL_CHARTER_SOURCE_DEPLETED_SETUP: "Коли в джерелі переселенців колоніального поселення закінчуються селяни й воно обирається наново."
  COLONIAL_CHARTER_SOURCE_DEPLETED_HEADER: "$MESSENGER$"
  COLONIAL_CHARTER_SOURCE_DEPLETED_TITLE: "Джерело поселення $CHARTER$ вичерпано"
  COLONIAL_CHARTER_SOURCE_DEPLETED_DESC: "У джерелі міграції до [Concept('colonial_charter', 'колоніального поселення')|e] $CHARTER$ провінції $PROVINCE$ закінчилися #TOOLTIP:POPTYPE,peasants,X #L селяни#!#!. Нове джерело знайдено, але може знадобитися час, аби відновити поступ."
  COLONIAL_CHARTER_SOURCE_DEPLETED_FLAVOR: "Навіть найглибша криниця може пересохнути."
  COLONIAL_CHARTER_SOURCE_DEPLETED_LOG: "Джерело міграції до поселення $CHARTER$ вичерпано"
  COLONIAL_CHARTER_SOURCE_DEPLETED_BTN1: "Прикро."
  COLONIAL_CHARTER_SOURCE_DEPLETED_BTN2: "Гаразд"
  COLONIAL_CHARTER_SOURCE_DEPLETED_BTN3: "$common_string_go_to$"
  COLONIAL_CHARTER_SOURCE_DEPLETED_MAP: ""
  COLONIAL_CHARTER_HALFWAY_SETUP: "Коли поступ колоніального поселення долає 50%."
  COLONIAL_CHARTER_HALFWAY_HEADER: "$MESSENGER$"
  COLONIAL_CHARTER_HALFWAY_TITLE: "Провінція $PROVINCE$ наполовину колонізована"
  COLONIAL_CHARTER_HALFWAY_DESC: "Наша колонізація провінції $PROVINCE$ через [Concept('colonial_charter', 'колоніальне поселення')|e] $CHARTER$ наполовину завершена."
  COLONIAL_CHARTER_HALFWAY_FLAVOR: "Половину шляху пройдено, починається найскладніше, але дорога назад уже довша за дорогу вперед."
  COLONIAL_CHARTER_HALFWAY_LOG: "$CHARTER$ на півдорозі"
  COLONIAL_CHARTER_HALFWAY_BTN1: "Продовжуйте."
  COLONIAL_CHARTER_HALFWAY_BTN2: "Гаразд"
  COLONIAL_CHARTER_HALFWAY_BTN3: "$common_string_go_to$"
  COLONIAL_CHARTER_HALFWAY_MAP: ""
  COLONIAL_CHARTER_HALFWAY_OTHER_SETUP: "Коли поступ колоніального поселення іншої країни перевищує 50%."
  COLONIAL_CHARTER_HALFWAY_OTHER_HEADER: "$MESSENGER$"
  COLONIAL_CHARTER_HALFWAY_OTHER_TITLE: "Провінція $PROVINCE$ наполовину колонізована"
  COLONIAL_CHARTER_HALFWAY_OTHER_DESC: "Колонізація провінції $PROVINCE$ країною $COUNTRY$ через [Concept('colonial_charter', 'колоніальне поселення')|e] $CHARTER$ наполовину завершена."
  COLONIAL_CHARTER_HALFWAY_OTHER_FLAVOR: "Половину шляху пройдено, але найскладніше тільки починається."
  COLONIAL_CHARTER_HALFWAY_OTHER_LOG: "$CHARTER$ на півдорозі ($COUNTRY$)"
  COLONIAL_CHARTER_HALFWAY_OTHER_BTN1: "Зрозуміло."
  COLONIAL_CHARTER_HALFWAY_OTHER_BTN2: "Гаразд"
  COLONIAL_CHARTER_HALFWAY_OTHER_BTN3: "$common_string_go_to$"
  COLONIAL_CHARTER_HALFWAY_OTHER_MAP: ""
  COLONY_PILL_SELF_SUSTAINING: "#G Самозабезпечення#!"
  COLONY_PILL_OPERATING_AT_LOSS: "#R У збиток#!"
  COLONY_SELF_SUSTAINING_HEADER: "Самозабезпечення"
  COLONY_OPERATING_AT_LOSS_HEADER: "Працює у збиток"
  COLONY_SELF_SUSTAINING_INCOME: "Щомісячний дохід: $VAL|+=$@gold!"
  COLONY_SELF_SUSTAINING_EXPENSE: "Щомісячні видатки: #R -$VAL|2$@gold!#!"
  COLONY_SELF_SUSTAINING_RESULT: "#italic Колонія вийшла на самозабезпечення, оскільки щомісячний баланс у розмірі $BALANCE|+=2$@gold! не нижчий за порогове значення в #TOOLTIP:$BREAKDOWN_TAG$ $THRESHOLD|2L$@gold!#!.#!"
  COLONY_OPERATING_AT_LOSS_RESULT: "#italic Колонія приносить збитки, оскільки щомісячний баланс у розмірі $BALANCE|+=2$@gold! нижчий за порогове значення в #TOOLTIP:$BREAKDOWN_TAG$ $THRESHOLD|2L$@gold!#!.#!"
  COLONY_SELF_SUSTAINING_THRESHOLD_BREAKDOWN: "Щомісячні видатки × запас: $EXPENSE|2$@gold! × $BUFFER|%$ = $THRESHOLD|2$@gold!"
  COLONY_HELPFUL_ACTIONS_TITLE: "Корисні [Concept('cabinet_actions', 'доручення ради')|e]"
  COLONY_HELPFUL_ACTIONS_CHARTER_DESC: "Три [Concept('cabinet_actions', 'доручення ради')|e] пришвидшують зростання колоніального поселення:\n - Підтримка переселення\n - Відправлення людей до колоній\n - Заселення порубіжжя\n\n#weak Натисніть, щоб перейти до цих доручень.#!"
  COLONY_HELPFUL_ACTIONS_LOCATION_DESC: "Три [Concept('cabinet_actions', 'доручення ради')|e] сприяють розвитку нещодавно колонізованої місцевості:\n - Посилення контролю\n - Розвиток провінції\n - Підтримка міграції\n\n#weak Натисніть, щоб перейти до цих доручень.#!"
  COLONY_HELPFUL_ACTIONS_SUBJECT_DESC: "Два [Concept('cabinet_actions', 'доручення ради')|e] сприяють зростанню колоніального намісництва:\n - Відправлення людей до колоній\n - Розвиток провінції\n\n#weak Натисніть, щоб перейти до цих доручень.#!"