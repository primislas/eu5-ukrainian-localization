  formal_guilds: "Упорядковані гільдії"
  formal_guilds_desc: "Різноманітні купецькі спілки вільно існували в нашій країні протягом усієї її історії. При цьому ми можемо задобрити найвпливовіших купців, законодавчо затвердивши їхнє місце в підпорядкованій та організованій державній структурі. Такий привілей безперечно вплине як на наші внутрішні справи, так і на зовнішню політику."
  trade_monopolies: "Торгові монополії"
  trade_monopolies_desc: "Передавши монопольні права на торгівлю деякими товарами найвпливовішим купцям наших країн, ми значно посилимо вплив могутніх торговців. Своєю чергою, така політика вплине на наші відносини з іноземними купцями."
  control_over_monetary_policy: "Відання скарбницею"
  control_over_monetary_policy_desc: "Від стану скарбниці залежить доля країни, і ми прагнемо навести лад з реєстрами та звітністю. Можливо, заможні піддані впораються з цим завданням ще краще. Ми можемо доручити їм відання скарбницею, а натомість зменшити податки на їхні промисли та майно."
  building_rights: "Будівельні права"
  building_rights_desc: "Розбудова міських та сільських поселень вимагає чималих коштів. Якщо дарувати місцевим жителям право зводити споруди, витрати на будівництво суттєво знизяться. Однак слід враховувати, що вплив простолюду при цьому відчутно зросте."
  burghers_royal_burgh_commissioners: "Комісари королівських бургів"
  burghers_royal_burgh_commissioners_desc: "Комісари представляють інтереси бургів #ONCLICK:COUNTRY,[GetCountry('SCO').GetKey] #TOOLTIP:COUNTRY,[GetCountry('SCO').GetKey],X [GetCountry('SCO').Custom('CL_GEN')|L]#!#!, які отримали хартію від #TOOLTIP:ESTATE_TYPE,crown_estate,X #L правителів#!#!. До їхніх обов'язків входять захист привілеїв таких міст, нагляд за торгівлею та консультування правителя. Конвент королівських бургів [GetCountry('SCO').Custom('CL_GEN')], куди входять комісари, забезпечує збереження політичного, господарського та правового статусу бургів, а також виступає як противага владі знаті та #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L духовенства#!#!."
  burghers_land_rights: "Земельні права містян"
  burghers_land_rights_desc: "Закони про землеволодіння завжди були предметом запеклих суперечок у судах нашої країни. Якщо #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L містяни#!#! отримають розширені привілеї в цьому питанні, різні гільдії стануть набагато поступливішими, але, з іншого боку, здобудуть більше влади."
  commercial_advisory_council: "Радники з купців"
  commercial_advisory_council_desc: "Торгівля — рушій нашого господарства, тому ми повинні оточувати главу країни лише найобдарованішими та найобізнанішими людьми, досвідченими в торгівлі і морем, і суходолом. Це розширить наші торгові можливості на батьківщині та в чужих землях."
  building_roads_rights: "Право на будівництво доріг"
  building_roads_rights_desc: "Потрібно дозволити багатим #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L міщанам#!#! будувати [Concept('roads', 'дороги')|e]. Таке рішення принесе користь не лише купецтву, а й усій країні. Воно пожвавить торгівлю з промислами і посилить сполучення між нашими землями."
  clergy_literacy_rights: "Доступ священників до освіти"
  clergy_literacy_rights_desc: "Наше віровчення породило силу-силенну літературних творів, які описують його принципи, моральні основи та закони. #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L Духовенство#!#! мусить отримати нічим не обмежений доступ до письмового слова, щоб вільно вивчати священні тексти."
  clergy_strengthen_faith: "Зміцнення віри"
  clergy_strengthen_faith_desc: "Віра об'єднує народ навіть у найважчі часи. Стараннями нашого #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L духовенства#!#! віра наших підданих тільки зміцніє перед лицем зовнішніх загроз."
  clergy_lecture_oaths: "Клятва вірности університету"
  clergy_lecture_oaths_desc: "Наші стародавні університети славляться своїми випускниками — це найсвітліші уми країни. Саме тому за ними потрібен особливий нагляд. Кожен випускник зобов'язується принести клятву не викладати ніде, крім цих осередків просвіти."
  clergy_enforced_unity: "Встановлення духовної єдности"
  clergy_enforced_unity_desc: "У нашій країні живуть представники різних конфесій, і забезпечувати їхнє мирне співіснування все важче. Це послаблює нас, тому ми повинні змусити підданих слідувати тільки панівній вірі. Так ми покінчимо з розбратом і зміцнимо свою владу."
  clergy_military_orders: "Військові ордени"
  clergy_military_orders_desc: "Військові ордени з'явилися з початком хрестових походів як спосіб об'єднати дисципліну та ревну віру ченців з майстерністю та досвідом лицарів. Вони поширилися всім християнським світом, але й представники інших вір стали створювати подібні ордени, щоб брати участь у священних війнах."
  clergy_land_rights: "Земельні права священників"
  clergy_land_rights_desc: "Ми ухвалили рішення: віряни отримають право самостійно володіти землею. Це дасть їм більше влади та впливу, натомість ми завжди зможемо розраховувати на сприяння праведних людей."
  clerical_advisory_council: "Радники зі священників"
  clerical_advisory_council_desc: "#TOOLTIP:ESTATE_TYPE,nobles_estate,X #L Знать#!#! сформує раду зі своїх представників у нашій країні. Таким чином, вони отримають більше влади, але будуть задоволені можливістю безпосередньо доносити до нас побоювання та відстоювати свої інтереси."
  clergy_powerful_dioceses: "Більше влади єпархіям"
  clergy_powerful_dioceses_desc: "Врядування нашими землями перебуває в світських руках. Однак церковний поділ не завжди збігається з урядовими межами. Великі єпархії надають духовенству міцну опору, через яку воно отримує значний вплив на лад у державі."
  nobles_offensive_military_doctrine: "Наступальна військова доктрина"
  nobles_offensive_military_doctrine_desc: "#TOOLTIP:ESTATE_TYPE,nobles_estate,X #L Знать#!#! схиляється до агресивної військової тактики: вони вважають, що найкращий захист — це напад. Воєначальники та їхні підлеглі воліють діяти сміливо й рішуче, прагнучи знищити ворогів якомога швидше."
  nobles_land_rights: "Земельні права"
  nobles_land_rights_desc: "#TOOLTIP:ESTATE_TYPE,nobles_estate,X #L Знать#!#! має значні права щодо землі та жителів під їхньою владою. Крім іншого, знать зазвичай може стягувати з підлеглих #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L селян#!#! податки, призивати їх до ополчення та самостійно чинити правосуддя на власній землі. До того ж вони мають право передавати цю землю спадкоємцям."
  auxilium_et_consilium: "Auxilium et consilium"
  auxilium_et_consilium_desc: "#TOOLTIP:ESTATE_TYPE,nobles_estate,X #L Знать#!#! користується привілеями, але у них є й обов'язки. Так вони зобов'язані утримувати війська (лат. #italic auxilium#!), опікуватися укріпленнями, військовими коморами та шляхами у своїх уділах. А також за потреби радити уряду та правителю (лат. #italic consilium#!)."
  noble_serfdom_rights: "Кріпосне право під контролем знаті"
  noble_serfdom_rights_desc: "У #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#! є безліч прав щодо підвладних їм #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L селян#!#!. Наприклад, право вводити податки, скликати ополчення та чинити правосуддя. У цих умовах селяни стають кріпаками, а часто ще й виявляються прикріплені до землі, на якій працюють."
  noble_fortification_licenses: "Право на зведення укріплень"
  noble_fortification_licenses_desc: "Право #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#! зводити укріплення та замки для захисту своїх земель суттєво змінює устрій у краї. Отримавши цю вольність, місцева верхівка може перетворити власні спадкові уділи на непідвладні правителю фортеці."
  noble_marriage_rights: "Право на династичний шлюб"
  noble_marriage_rights_desc: "У нашій країні #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знать#!#! стоїть на одному щаблі з правителями, тому може вступати в шлюб з представниками правлячої родини, що збільшує їхню роль при дворі та в уряді."
  noble_leaders_only: "Тільки родовиті воєначальники"
  noble_leaders_only_desc: "#TOOLTIP:ESTATE_TYPE,nobles_estate,X #L Знать#!#! переконана, що тільки вони здатні командувати військами та флотами нашої країни, виправдовуючи це колишніми заслугами. Проте інші стани бачать у цьому кривду і вважають паничів зарозумілими дурнями."
  banal_lordship: "Баналітет"
  banal_lordship_desc: "Це один із різновидів маноріалізму, що розвинувся в межах феодального ладу. Його основа — «бан», тобто право землевласника розпоряджатися своїми васалами, віддавати їм накази та карати за непокору. Це призвело до того, що #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знать#!#! має величезну владу у своїх володіннях, оскільки чинить там правосуддя та стягує з #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L селян#!#! податки майже за все."
  primacy_of_nobility: "Верховенство знаті"
  primacy_of_nobility_desc: "Знать є головним станом у нашій країні — їхніми силами втілюється більшість наших планів, до того ж вони становлять основу нашого війська. Як наслідок вони вважають себе рівнею нам, а уряд змушений радитися з ними з усіх важливих питань."
  elaborate_court_ceremonies: "Складне придворне життя"
  elaborate_court_ceremonies_desc: "Ми вирішили перетворити придворне життя на низку неймовірно ускладнених формальностей. Усі, хто хоч щось із себе представляє, повинні з'являтися на столичних прийомах у правителя. Це сильно обмежує можливості знаті плести інтриги, проте дуже дорого нам обходиться."
  tysiatskii_privilege: "Тисяцький"
  tysiatskii_privilege_desc: "Тисяцькі — це військові керівники, що обираються з числа бояр. У більшости інших країн повноваження подібних чиновників обмежуються військовим командуванням, але у нас тисяцькі ще й представляють інтереси #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L селян#!#!, ухвалюють судові рішення з торгових питань, а також стежать за станом укріплень."
  the_ryad_privilege: "Ряд"
  the_ryad_privilege_desc: "$the_ryad_privilege$ — це договір між країною та боярами. Він захищає інтереси та владу бояр, одночасно закріплюючи права та обов'язки князя."
  bashtinas_and_pronijas_grants: "Баштини"
  bashtinas_and_pronijas_grants_desc: "Ця система, за якою представники панівного стану отримують землю, бере за основу візантійські #italic пронії#!. Вона передбачає цілу низку прав та обов'язків, які феодали, обдаровані землею, отримують в області врядування своїми новими територіями."
  zupa_districts: "Жупи"
  zupa_districts_desc: "Склад і поділ нашого суспільства описані та закріплені у великій кількості чинних законів. Одним із найважливіших елементів нашого краю та його врядування є поділ провінцій на жупи — це дрібні підзвітні округи, які самостійно займаються власними справами."
  vlastele_krayishnik: "Країшка властела"
  vlastele_krayishnik_desc: "Наші прикордонні землі потребують постійного захисту. Це завдання виконує система #italic країн#!, згідно з якою такі землі діляться на кілька добре керованих місцевостей. Кожною місцевістю командує #italic країшка властела#! — один із місцевих землевласників, якому доручено захищати люд і підтримувати добробут своєї території."
  feudal_mercenary_contracts: "Феодальні контракти з найманцями"
  feudal_mercenary_contracts_desc: "Зібрані нами ополчення часто незадовільні. Щоб захистити своїх підданих і перевершити суперників, ми змушені покладатися на іноземних найманців. Контракти з ними укладатимуть представники вищого суспільства."
  tax_exemption: "Звільнення від податків"
  tax_exemption_desc: "Наша віра тримається на доброчесних людях, які все життя присвятили турботі про духовний добробут народу. Було б правильно звільнити їх від будь-якого мита та податків."
  peasants_represented_in_parliament: "Право на представництво"
  peasants_represented_in_parliament_desc: "Якщо представники нижчого стану отримають місце в головних представницьких зборах нашої країни, це дозволить #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L селянам#!#! озвучувати свої кривди та потреби, а також закріпить за ними ширші права."
  peasants_free_peasantry: "Селянський вихід"
  peasants_free_peasantry_desc: "Простолюд — найбільше багатство будь-якого краю, без якого не уникнути голоду та безладу. Однак пани довгий час бачили в ньому лише безправну власність, прикріплену до землі.\nЯкщо повернути селянам волю й право виходу, вони зможуть покинути колишніх господарів та рушити на нові ниви в пошуках ліпшої долі."
  peasant_owns_their_food: "Засоби виробництва"
  peasant_owns_their_food_desc: "Вищі стани — справжні паразити, які, не повертаючи нічого взамін, привласнюють собі все, що простолюд створює важкою працею. Якщо ми віднімемо у гнобителів засоби виробництва, трудовий люд нарешті поверне собі владу над власною долею."
  peasants_fewer_levies: "Урізане ополчення"
  peasants_fewer_levies_desc: "#TOOLTIP:ESTATE_TYPE,peasants_estate,X #L Селяни#!#! — це плоть і кров нашої країни. Вони годують населення, заготовляють будівельні матеріали та виробляють товари, які потім продають купці.\nВійна — це завжди важкий час для країни, але не можна дозволити, щоб простолюд величезними натовпами потрапляв в жорна конфлікту, інакше після війни нас чекатимуть голод і руїна."
  peasants_yeomanry: "Йомени"
  peasants_yeomanry_desc: "Дрібні землевласники отримують більше прав в обмін на те, що переймають на себе частину обов'язків дрібної знаті — зокрема від них очікують більшої участи в захисті країни."
  creaghts_privilege: "Крейти"
  creaghts_privilege_desc: "Багато представників нижчого суспільства в нашій країні належать до числа #italic крейтів#! — кочівників-скотарів, які вирушають на свіжі пасовища при зміні сезонів. Вони отримали своє ім'я на честь тимчасових жител, які облаштовують, переміщаючись з місця на місце. Крейти не прив'язані до певної землі, тому існують поза звичною феодальною структурою."
  coign_and_livery_privilege: "Утримання та постій"
  coign_and_livery_privilege_desc: "Ця система, також відома під назвою #italic боннахт#!, приписує молодшим вождям надавати за свій рахунок постій та утримання нашим воякам, коли ті розташовані на їхніх землях."
  peasants_allowed_weapons_privilege: "Ополчення селян"
  peasants_allowed_weapons_privilege_desc: "Селянам дозволяється брати свою зброю при призові на службу в ополчення і потім користуватися нею. Це збільшує ринковий попит на зброю."
  gradozadanje_and_gradobljudenlje_rights: "Градозадання та градоблюдення"
  gradozadanje_and_gradobljudenlje_rights_desc: "У наших володіннях багато фортець і могутніх замків. Обов'язки щодо утримання цих укріплень та поповнення їхніх залог покладаються на місцеве населення та міщан."
  peasants_autonomous_villages: "Самоврядні села"
  peasants_autonomous_villages_desc: "У сільській місцевості ходить така приказка: «Країна закінчується там, де починається село». Селяни будують своє життя самостійно, незважаючи на уряд нашої країни."
  clergy_protected_faith: "Свобода віросповідання духовенства"
  clergy_protected_faith_desc: "Святі мужі та жінки отримали свободу віросповідання і тому захищені від будь-яких спроб навернення в іншу віру з боку країни."
  burghers_protected_faith: "Свобода віросповідання міщан"
  burghers_protected_faith_desc: "Багаті піддані отримали свободу віросповідання і тому захищені від будь-яких спроб навернення в іншу віру з боку країни."
  nobles_protected_faith: "Свобода віросповідання знаті"
  nobles_protected_faith_desc: "Знать отримали свободу віросповідання і тому захищені від будь-яких спроб навернення в іншу віру з боку країни."
  peasants_protected_faith: "Свобода віросповідання селян"
  peasants_protected_faith_desc: "Селяни отримали свободу віросповідання і тому захищені від будь-яких спроб навернення в іншу віру з боку країни."
  reduced_from_military_obligations: "Урізані військові зобов'язання"
  reduced_from_military_obligations_desc: "В обмін на вірність нашій владі ми можемо урізати або скасувати військову повинність для тих, хто обере праведне життя на службі вищим силам."
  office_of_the_sankar_zouma_privilege: "Санкар-зума"
  office_of_the_sankar_zouma_privilege_desc: "Санкар-зума — це поважна посада, яку [GetCountry('MAL').GetGovernment.GetEstateName('nobles_estate')|l] мож[GetCountry('MAL').Custom('nobles_eut')] отримати від верховної влади. Повноваженнями вона схожа на фарима-суру — люди на цій посаді контролюють усі торгові шляхи, що проходять через південний кордон."
  office_of_the_farima_soura_privilege: "Фарима-сура"
  office_of_the_farima_soura_privilege_desc: "Фарима-сура захищає північний кордон країни, контролює переміщення через Сахару, а також забезпечує безпеку та легкість проходження торгового потоку в нашу країну та за її межі."
  liberum_veto: "Liberum veto"
  liberum_veto_desc: "Відтепер голосування в сеймі має бути одноголосним. Кожен шляхтич може зупинити голосування або обговорення закону, вставши та прокричавши #italic sisto activitatem!#! («Я припиняю діяльність!») латиною або #italic nie pozwalam!#! («Я не схвалюю це!») польською мовою."
  visconti_city_states: "Міста-держави Вісконті"
  visconti_city_states_desc: "[GetCountry('MLO').GetLongName] під владою дому Вісконті є розосередженою та роздробленою країною. [GetCountry('MLO').GetFlavorRank] постійно перебува[GetCountry('MLO').Custom('endlong_yeyut')] у стані боротьби за владу між усіма значущими членами роду, що призвело до ряду міжусобиць. Багато хто, включно з Аццоне, Джан Галеаццо та Бернабо, прагнуть одноосібної влади, формуючи альянси, плануючи зради та проводячи воєнні кампанії один проти одного. Через безперервні чвари [GetCountry('MLO').GetLongNameWithNoTooltip] втрача[GetCountry('MLO').Custom('endlong_yeyut')] будь-яку подобу надійного врядування, що лише сприяє розколу та безладу в усьому краї."
  milanese_cloth_guilds_privileges: "Міланські гільдії ткачів"
  milanese_cloth_guilds_privileges_desc: "Наші прибуткові ткацькі промисли тримаються на плечах найкращих ремісників у всій #TOOLTIP:REGION,italy_region,X #L Італії#!#!. Довіривши купцям відання виробництвом, ми досягнемо небаченого випуску тканин та отримаємо величезний прибуток. Додаткова влада, якої набудуть купецькі гільдії, — невелика платня за це."
  novgorod_ivans_hundred: "Іванівське сто"
  novgorod_ivans_hundred_desc: "Іванівське сто — це купецька спілка, голови якої є постійними членами торгового суду та #TOOLTIP:LOCATION,novgorod,X #L новгородської#!#! Ради панів. Їхня присутність у політиці, а також угоди між ними та #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L боярами#!#! забезпечують подальший успіх нашої країни в торгових справах."
  ordinance_of_laborers: "Закони про робітників"
  ordinance_of_laborers_desc: "На превелике невдоволення селян, ці закони покликані обмежити постійно зростаючий оброк селян, фактично закріпивши їх на рівні до пошести чуми. Господарям також заборонено наймати зайві руки, а всі #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L селяни#!#! віком до 60 років зобов'язуються працювати."
  masaniellos_fight: "Боротьба Мазаньєлло"
  masaniellos_fight_desc: "Цей привілей покликаний відображати вимоги рибалки Мазаньєлло — захистити простий люд від звірячих поборів і врятувати його від розорення."
  peasants_no_poll_tax_privilege: "Звільнення від подушного податку"
  peasants_no_poll_tax_privilege_desc: "Після повстання Вота Тайлера влада скасувала подушну подать і гарантувала, що вона ніколи не буде введена знову."
  land_owning_farmers: "Селяни-землевласники"
  land_owning_farmers_desc: "Сильна позиція #L [GetCountry('SWE').GetAdjective|l]их#! селян відрізняла їх від більшої частини феодальної #TOOLTIP:CONTINENT,europe,X #L Європи#!#!. Вони особисто володіли землями, платили податки безпосередньо правителям і часто мали право голосу на місцевих зборах, що давало їм певну самостійність та юридичний захист. Ці фермери не були кріпаками. Багато з них володіли зброєю і служили в ополченні. Їхні права закріплені в давньому законі, і їхня відносна незалежність стала основоположним елементом раннього шведського сільського суспільства."
  lat_compromise_with_greek_populace: "Компроміс із греками"
  lat_compromise_with_greek_populace_desc: "Правлячі хрестоносці мають великий вплив, але й деякі #TOOLTIP:CULTURE,$greek_culture_tt$,X #L грецькі#!#! родини не менш впливові. Щоб [ShowScriptedGeographyName('greece_geography')] була стабільною країною з міцною владою, ми повинні знайти компроміс між потребами нової та старої еліти."
  lat_latin_crusader_elite: "Еліта хрестоносців"
  lat_latin_crusader_elite_desc: "Хоча розпад Латинської імперії й породив розкол у лавах титулованих хрестоносців, вони, як і раніше, залишаються грізною силою, з якою [ShowScriptedGeographyName('greece_geography')] змушена рахуватися."
  general_privilege: "Генеральний привілей [GetCountry('ARA').Custom('CL_GEN')]"
  general_privilege_desc: "Генеральний привілей — це список законів і компромісів, який зобов'язує монарха гарантувати звичаєві права знаті і не оголошувати війни без санкції зборів."
  union_privilege: "Привілей унії"
  union_privilege_desc: "Попри спротив #TOOLTIP:ESTATE_TYPE,crown_estate,X #L корони#!#!, #italic Арагонська унія#! змусила короля прийняти набір досягнутих угод як закон. Відповідно до нього, арагонські #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знать#!#! та містяни отримують широкі права на шкоду звичаєвим повноваженням правителя."
  justicia_de_aragon: "Арагонська юстиція"
  justicia_de_aragon_desc: "Арагонська юстиція — впливовий юридичний і судовий орган. [GetCountry('ARA').GetLongName] створи[GetCountry('ARA').Custom('endlong_vlaloly')] його задля дотримання місцевих законів, вирішення суперечок та захисту прав підданих від надмірного втручання корони."
  formalized_oath: "Офіційна клятва вірності"
  formalized_oath_desc: "Монархія пов'язана офіційною угодою, яка гарантує визнання та дотримання прав і свобод станів перед принесенням клятви вірности."
  double_sabbath: "Дводенний шабат"
  double_sabbath_desc: "Наперекір загальноприйнятим нормам, наш народ здавна святкував і сьомий день Шабат у суботу, і день Господній у неділю. Цей привілей перетворює звичай на закон і захищає селян від гонінь за його дотримання."
  signoria_council: "Синьйорія"
  signoria_council_desc: "[GetCountry('FLO').GetName] сформува[GetCountry('FLO').Custom('end_vlaloly')] синьйорію — раду з дев'яти осіб, яка керує містом. Там засідають представники різних міських гільдій, і кожні два місяці проходить лотерея, за результатами якої рада переобирається. Постійна заміна членів гарантує, що інтереси республіки в рішеннях ради переважатимуть над особистими. Проте той факт, що радники висуваються від гільдій, означає, що влада постійно перебуває в руках одних і тих самих сімей."
  florence_guilds: "Гільдії [GetCountry('FLO').Custom('CL_GEN')]"
  florence_guilds_desc: "#L [GetCountry('FLO').GetAdjective]і#! ремісники та купці зазвичай належать до певних гільдій. Це дозволяє не тільки витримувати стандарт якості продукції, а й уникати нечесної конкуренції. Проте в результаті ці гільдії мають незаперечний вплив.\n\nВідкриває доступ до [Concept('law', 'закону')|e] #TOOLTIP:LAW,guilds_of_florence,X #L «Панування флорентійських гільдій»#!#!."
  arte_della_lana: "Арте делла Лана"
  arte_della_lana_desc: "Спілка сукнарів, звана #italic Арте делла Лана#!, є однією із найвпливовіших серед семи найбільших ремісничих спілок #ONCLICK:COUNTRY,[GetCountry('FLO').GetKey] #TOOLTIP:COUNTRY,[GetCountry('FLO').GetKey],X [GetCountry('FLO').Custom('CL_GEN')|L]#!#!. Вона контролює всі етапи переробки вовни від закупівлі сировини до продажу готового одягу. Купці, фарбарі, ткачі та кравці, що входять до спілки, зобов’язані дотримуватися суворих стандартів якости, які регулярно перевіряють наглядачі. Формально визнавши Арте, ми зможемо дужче впливати на купецтво й забезпечимо [GetCountry('FLO').Custom('CL_DAT')] славу найкращого постачальника сукна на континенті."
  scholar_officials: "Вчені-чиновники"
  scholar_officials_desc: "Наші можновладці — мудрі державні службовці та політики, які заслужили завидне становище, продемонструвавши багаті пізнання на державному іспиті.\nСім'ї цих чиновників збережуть привілеї, якщо такий вчений з'являтиметься там хоча б раз на три покоління."
  petty_bureaucracy: "Дрібне чиновництво"
  petty_bureaucracy_desc: "Чиновницький кістяк нашої країни складається з навчених фахівців та управів, які вирішують повсякденні питання та підтримують структуру уряду."
  powerful_italian_families: "Впливові італійські родини"
  powerful_italian_families.tt: "Наша столиця не в Італії"
  powerful_italian_families_desc: "#TOOLTIP:LOCATION,rome,X #L Рим#!#! та #TOOLTIP:CULTUREGROUP,italian_group,X #L італійські#!#! стани ще глибше занурюються в безодню безвладдя та безладу, коли [GetCountry('PAP').GetGovernment.GetRulerTitle|l] переносить свій двір до #TOOLTIP:LOCATION,avignon,X #L Авіньйона#!#!. Тепер ці землі перебувають під контролем впливових італійських родин, таких як Колонна та [ShowDynastyName('orsini_dynasty')], і [GetCountry('PAP').GetGovernment.GetRulerTitle|l] майже не має над ними влади."
  french_cardinals: "Французькі кардинали"
  french_cardinals_desc: "З того моменту, як помер [GetCharacter('pap_boniface_viii').GetName] і новим місцем перебування двору стало місто [ShowLocationName('avignon')], кардинали #L [ShowCultureGroupName('french_group')|l]ого#! походження отримали більшість у конклаві. [GetCountry('FRA').GetGovernment.GetRulerTitle] країни [GetCountry('FRA').GetName] має на них величезний вплив і не дозволить, щоб країна [GetCountry('PAP').GetName] знову повернулася до своєї колишньої столиці — [ShowLocationName('rome')]."
  cardinal_lead_guilds: "Кардинал на чолі гільдій"
  cardinal_lead_guilds_desc: "Гільдії та інші купецькі об'єднання — неминуче зло. Але якщо їх очолить благочестивий кардинал, ми будемо впевнені, що гільдійці не сходять з Божого шляху, а гріх жадібности не затуманює розум наших #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L містян#!#!."
  kbo_kaigama: "Кайгама"
  kbo_kaigama_desc: "Кайгама — це намісник наших південних територій і командувач війська. #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L Знатні#!#! мужі з цим титулом, як правило, володіли силою, енергією та колосальною владою, а часом навіть впливали на корону, вирішуючи, хто в підсумку виявиться правителем країни."
  kbo_yerima: "Єріма"
  kbo_yerima_desc: "Єріма — це намісник наших північних територій. На його плечах лежить відповідальність за набір міцних воїнів із нижчих каст. Єріма не користується таким впливом, як кайгама, але, можливо, нам незабаром доведеться рахуватися з ним, оскільки саме він завідує зростанням нашого війська, що веде боротьбу з ворогами — як зовнішніми, так і внутрішніми."
  kbo_lake_chad_trade_privilege: "Вплив над озером Чад"
  kbo_lake_chad_trade_privilege_desc: "По всьому узбережжю озера Чад наші #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L міщани#!#! зустрічають людей із далеких країв та обмінюються з ними товарами. Обсяги торгівлі під нашим контролем — плоть і кров нашого господарства, що гарантує країні стійкість."
  kbo_serfdom_economy: "Невільницьке господарство"
  kbo_serfdom_economy_desc: "Наша велика держава гордо стоїть на спинах підкорених ворогів. Безперервний потік невільників, що йде до країни, є підмурівком її господарства. Часті набіги та завоювання роблять нас ще сильнішими."
  amenokal_salt_traders: "Соляники аменокаля"
  amenokal_salt_traders_desc: "Ці випробувані ветерани транссахарської торгівлі стежать за караванами, що перевозять #TOOLTIP:GOODS,salt,X #L сіль#!#! та направляють їх під час переходів по негостинній пустелі."
  kbo_cima: "Земельні посібники для кіма"
  kbo_cima_desc: "В нагороду за бойові перемоги ми можемо дарувати успішним командирам землі на прикордонні. Так ми отримаємо їхню вірність, а в довгостроковій перспективі збільшимо вплив столиці на околицях країни."
  clergy_religious_state: "Панування церкви"
  clergy_religious_state_desc: "Зробивши віру основним пріоритетом країни, ми зможемо згуртувати люд в єдине ціле."
  clergy_papal_emissary: "Папські посланники"
  clergy_papal_emissary_desc: "Легати та інші представники, яких присилає [GetCountry('PAP').GetGovernment.GetRulerTitle|l], зазвичай знаходять у наших землях не просто теплий прийом — ми завжди намагаємося слідувати їхнім рішенням та не втручатися у відносини, які встановили місцеві #TOOLTIP:ESTATE_TYPE,clergy_estate,X священники#!#! та [GetCountry('PAP').GetGovernment.GetRulerTitle|l]."
  freedom_of_interpretation: "Свобода тлумачень"
  freedom_of_interpretation_desc: "Численні вчення нашої віри — не що інше, як тінь, під якою ми можемо відпочити та насолодитися розсудливим і праведним життям. Вона надихає людей та спонукає шукати істини, розширюючи та уточнюючи догмати. Така свобода інтерпретації дозволить нашій вірі адаптуватися до найрізноманітніших спільнот без шкоди для її фундаментальних основ."
  expansionist_zealotry: "Загарбницька ревність"
  expansionist_zealotry_desc: "Битися на священній війні — це головне покликання будь-якого щирого вірянина."
  religious_diplomats: "Посли з духовенства"
  religious_diplomats_desc: "Посольська справа — складне ремесло. Іноді вистачає найменшого непорозуміння, щоб відносини між країнами безнадійно зіпсувалися. Відправляючи до наших побратимів по вірі виключно послів з духовенства, ми сподіваємось, що однодумність стане підґрунтям для довгих та плідних політичних відносин."
  promote_cultural_unity: "Плекання культурної єдности"
  promote_cultural_unity_desc: "Основа сильного та стійкого суспільства — плекання єдиної культури, яка об'єднає весь народ та захистить його від іноземного впливу."
  embellish_great_works_of_faith: "Зведення величних храмів"
  embellish_great_works_of_faith_desc: "Немає кращого способу продемонструвати великодушність та прихильність вірі, ніж зведення грандіозних храмів. Вишукана архітектура збуджує в людях ні з чим не зрівнянне благоговіння перед вищими силами."
  dhimmi_land_rights: "Гарантія місцевих прав на землю"
  dhimmi_land_rights_desc: "Дім людини — її фортеця. Гарантувавши земельні права нашим підданим, які не дотримуються істинної віри, ми створимо узи довіри між ними та нашою владою."
  dhimmi_lighter_taxes: "Зниження податків"
  dhimmi_lighter_taxes_desc: "Щоб побудувати стійке суспільство, в якому зможуть мирно співіснувати прихильники різних віровчень, потрібне справедливе та добре ставлення і, що особливо важливо, податкові пільги. Знизивши податки, які сплачують наші піддані-іновірці, ми зможемо забезпечити їхню покірність."
  dhimmi_military_service: "Допуск до військової служби"
  dhimmi_military_service_desc: "Багато іновірців, що мирно живуть на нашій землі, будуть готові захистити свій дім та сім'ю, якщо ми дозволимо їм вступити до лав війська."
  dhimmi_promote_tolerance: "Заохочення терпимости"
  dhimmi_promote_tolerance_desc: "Наш народ досить часто виявляє схильність до створення більш різноманітного та терпимого співтовариства. Діючи в повній відповідності з волею іновірців та наслідуючи їхній приклад, ми виявимо до них доброту та забезпечимо країні лад і процвітання."
  dhimmi_administrative_posts: "Посади в уряді"
  dhimmi_administrative_posts_desc: "Багато людей, що живуть усередині наших кордонів, дотримуються іншої віри, і їхні місцеві ватажки вельми зацікавлені в тому, щоб зберегти свій статус. Для будь-якої далекоглядної влади буде корисно співпрацювати з ними та переймати їхні знання."
  dhimmi_traditions: "Збереження місцевих звичаїв"
  dhimmi_traditions_desc: "Наші васали-іновірці мають найрізноманітніше походження, а отже — інші вірування та спосіб життя. Це і прості трударі в полях, і колишня знать з багатим минулим, історією, звичаями. Повага до їхнього укладу та дозвіл йому слідувати — ознака гармонійного та самодостатнього суспільства."
  dhimmi_legal_autonomy: "Судове самоврядування"
  dhimmi_legal_autonomy_desc: "Багато гідних жителів наших земель дотримуються іншої віри, проте включені в нашу судову систему на рівних правах. Якщо ми не будемо слухати незадоволених і дозволимо іновірцям бути юристами, свідками, опікунами та навіть законними представниками своїх спільнот, підтримка нашої влади серед іновірців помітно зросте."
  dhimmi_promote_dhimmi_hierarchy: "Підтримка місцевої ієрархії"
  dhimmi_promote_dhimmi_hierarchy_desc: "Ми прагнемо підтримувати порядок у суспільстві, тому наші радники вважали за необхідне, щоб представники місцевих громад, які дотримуються іншої віри, також взяли участь у цій справі."
  dhimmi_pact_of_umar: "Договір Умара"
  dhimmi_pact_of_umar_desc: "Цей договір чітко регламентує статус, права та обов'язки «підзахисних осіб» нашої країни, зокрема християн, юдеїв, зороастрійців та представників інших визнаних віровчень."
  dhimmi_mazalim_court: "Суди мазалім"
  dhimmi_mazalim_court_desc: "Світські суди мазалім, де розглядаються справи невірних, існують паралельно з духовно-судовим врядуванням та судами шаріату. Засідання таких судів відбуваються у Палаці правосуддя #italic (Дар аль-Адле)#! або в церемоніальній залі цитаделі #italic (Іван-Кабіре)#!."
  local_tribal_strongholds: "Фортеці племен"
  local_tribal_strongholds_desc: "Численні осілі племена, розкидані по всьому Магрибу, мають великий вплив на місцеве населення. Якщо ми будемо ставитися до цих племен з повагою, то керувати володіннями стане значно простіше."
  jaysh_armies: "Джейш аль-Іслам"
  jaysh_armies_desc: "Місцева влада найняла цих людей для виконання різних військових завдань. Рекрути займаються придушенням заколотів як у цій області, так і на своїй батьківщині, а також забезпечують регулярне поповнення нашого війська."
  tribes_in_administration: "Племінна рада"
  tribes_in_administration_desc: "Племінні громади є невід'ємною частиною нашого суспільства. Буде справедливо, якщо ми дозволимо їхнім представникам обіймати посади в уряді."
  tribes_land_rights: "Земельні права племен"
  tribes_land_rights_desc: "Наша земля є домом для багатьох племінних громад. Розширення населених ними територій та повага до їхніх земельних прав — чудовий спосіб продовжувати з ними плідну співпрацю."
  tribes_fosterage: "Передача на виховання"
  tribes_fosterage_desc: "Представники племінних громад, а точніше — їхнього молодого покоління, проводитимуть кілька років, виховуючись у сусідів, щоб діти перейняли унікальні знання, а ми змогли зміцнити узи спорідненості та взаєморозуміння між спільнотами."
  tribes_manrent: "Манрент"
  tribes_manrent_desc: "Згідно з законами військової повинності за контрактом, багато представників племен вступають на службу до найвпливовіших місцевих сімей."
  tribes_allow_gatherings: "Дозвіл на зібрання"
  tribes_allow_gatherings_desc: "Регулярні зібрання наших племінних спільнот — чудове місце для обговорення політики, обміну новинами та налагодження ділових зв'язків з громадами по всій країні. Тому ми маємо їх дозволити."
  tribes_creach: "Крех"
  tribes_creach_desc: "#TOOLTIP:GOODS,livestock,X #L Худоба#!#! часто дістається нам як здобич на війні та в набігах. Її розведення може забезпечити нашим племінним народам процвітання та добробут."
  tribes_pasture_access: "Допуск до пасовищ"
  tribes_pasture_access_desc: "Якщо племінні громади отримають від нас доступ до пасовищ, ми зможемо скористатися з їхнього хисту до розведення #TOOLTIP:GOODS,livestock,X худоби#!."
  tribes_tribal_levies: "Право на племінні ополчення"
  tribes_tribal_levies_desc: "Воїни племінних народів знамениті своїм бойовим досвідом. Прийнявши цих загартованих бійців до лав війська, ми посилимо його та зміцнимо владу над землями, які контролюємо."
  tribes_tribal_registry: "Розширений облік"
  tribes_tribal_registry_desc: "Хоча племена найчастіше живуть окремо від нашого суспільства, ми все ж маємо налагодити їхній ретельний облік."
  tribes_protected_faith: "Недоторканність віри племен"
  tribes_protected_faith_desc: "У жителів диких земель зустрічаються вірування, відмінні від загальноприйнятих. Втім, поки вони залишаються нашими вірними підданими, нам слід виявляти повагу до їхніх духовних відмінностей."
  tribes_respect_tribal_traditions: "Повага до звичаїв племен"
  tribes_respect_tribal_traditions_desc: "У наших племінних громад зустрічаються найдивовижніші звичаї. Країна повинна виявляти до них повагу та підтримку."
  cossacks_land_rights: "Земельні права козаків"
  cossacks_land_rights_desc: "Козаки живуть громадами, де діють свої закони. Якщо ми гарантуємо незалежність їхніх територій, вони збережуть вірність нам."
  cossacks_sanctioned_atamans: "Визнання влади отаманів"
  cossacks_sanctioned_atamans_desc: "Козаки називають вождів своїх громад #italic отаманами#!. Якщо ми офіційно визнаємо право отаманів на владу, то їхній вплив зросте, однак вони потраплять у залежність від нас."
  cossacks_allowed_free_roaming: "Право на кочівництво"
  cossacks_allowed_free_roaming_desc: "Козаки здавна ведуть напівкочовий спосіб життя і ніде подовгу не затримуються. Дозволивши їм вільно пересуватися країною, ми не тільки зробимо великий внесок у збереження їхньої культури, а й зміцнимо їхнє бажання з нами співпрацювати."
  cossacks_government_positions: "Козаки в уряді"
  cossacks_government_positions_desc: "Суворе життя козаків виховує в них мужність та стійкість. Можливо, найталановитіші з них повинні не кочувати нашими землями, а допомагати нам з державними справами."
  cossacks_military_service: "Військова служба для козаків"
  cossacks_military_service_desc: "Козаки живуть за військовими законами. Замість того, щоб просто блукати нашими землями, вони могли б стати частиною нашої військової системи та перевагою на полі бою."
  cossacks_protected_faith: "Недоторканність віри козаків"
  cossacks_protected_faith_desc: "Козаки зазвичай дотримуються найрізноманітніших духовних переконань, проте більшість з них все ж сповідують одну віру. Якщо ми будемо з повагою ставитися до їхніх вірувань, це послабить напруженість в їхніх власних лавах, і нам теж буде простіше з ними домовитися."
  cossacks_respected_traditions: "Повага до козацьких звичаїв"
  cossacks_respected_traditions_desc: "Козаки мають свої звичаї та суспільний уклад. Щоб ці люди по-справжньому відчували свою приналежність до країни, ми повинні поважати їхні порядки."
  cossacks_rada_autonomy: "Незалежність ради"
  cossacks_rada_autonomy_desc: "Козаки називають свій головний орган самоврядування #italic радою#!. Це зібрання, на якому вирішуються всі цивільні та військові питання. Визнавши незалежність таких рад від нашої влади та дозволивши козакам самостійно керувати своїми територіями, ми безперечно заслужимо їхню прихильність."
  cossacks_register: "Реєстрові козаки"
  cossacks_register_desc: "Козаки не просто увійдуть до складу нашого війська. Ми об’єднаємо їх в особливий реєстр і дозволимо мати власні офіцерські звання, щоб вони краще билися за нашу країну."
  cossacks_explorers: "Козаки-першопрохідці"
  cossacks_explorers_desc: "Козаки звикли до кочового життя і почуваються як риба у воді практично скрізь. Ми можемо отримати з цього вигоду, відправляючи козаків в експедиції для дослідження земель, які в подальшому будуть приєднані до нашої країни."
  cossacks_colonization: "Козаки-колоністи"
  cossacks_colonization_desc: "Завдяки кочовому способу життя козаки ідеально підходять для освоєння безхазяйних земель і підготовки їх до будівництва постійних поселень."
  plc_cossack_treaty_of_hadiach: "Гадяцький договір"
  plc_cossack_treaty_of_hadiach_desc: "Згідно з Гадяцьким договором, козаки отримують нові права та повноваження. Найважливішою поступкою стало входження країни до складу Речі Посполитої під назвою «Великого Князівства Руського» як третього рівноправного члена двосторонньої унії Польщі та Литви."
  cossack_identity: "Козацька самобутність"
  cossack_identity_desc: "Козаки пишаються своєю унікальною самобутністю, власними звичаями та укладом. І вони навряд чи відмовляться від них під чужим впливом, воліючи зберегти свій спосіб життя."
  reduced_trade_regulations: "Послаблення нагляду за торгівлею"
  reduced_trade_regulations_desc: "Утискати купецтво — згубний замір. Ми маємо дати заморським гостям вільний хід на наших ринках. Тоді приплив товарів до наших міст буде невпинним."
  increased_trade_regulations: "Посилення нагляду за торгівлею"
  increased_trade_regulations_desc: "Чужоземні #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L міщани#!#! не мають захопити наші ринки! Посиливши нагляд за торгівлею, ми знесилимо чужоземний вплив і забезпечимо перевагу нашим купцям."
  land_of_commerce: "Земля торгівлі"
  land_of_commerce_desc: "Ми пишаємося тим, що #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L міщани#!#! можуть розраховувати на заступництво з боку країни. Вони мають право на судовий захист і вільне переміщення, а також можливість розпоряджатися своїми товарами так, як вони вважатимуть за потрібне."
  treasury_rights: "Право нагляду за скарбницею"
  treasury_rights_desc: "Отримавши право наглядати за нашою скарбницею, багаті та впливові піддані зможуть дієвіше відстоювати свої інтереси та стануть прихильнішими до влади. Натомість нам доведеться пожертвувати частиною податкових прибутків."
  urban_development_grants: "Допомога на розвиток міст"
  urban_development_grants_desc: "Очевидно, що майбутнє — за містами. Щоб наблизити настання доби урбанізації, міщани отримають від нас грошову поміч на  розвиток міст."
  sponsor_maritime_contracts: "Підтримка морських угод"
  sponsor_maritime_contracts_desc: "Морська торгівля щедро наповнює скарбницю. Уклавши виключні угоди з #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L міщанами#!#!, ми зможемо регулювати комерцію, отримуючи при цьому стабільний дохід від морських перевезень і торгівлі."
  control_over_the_coinage: "Відання карбуванням"
  control_over_the_coinage_desc: "Карбування та випуск в обіг нових монет належної якости — складна, але вкрай важлива справа для розвитку самостійної країни. Взявши під нагляд карбування, ми зміцнимо не тільки господарчі підвалини, а й свою владу."
  shipwright_contracts: "Угоди на кораблебудування"
  shipwright_contracts_desc: "Отримавши вигідні замовлення з державною опікою, багаті піддані допоможуть нам дієвіше наглядати за кораблебудуванням та прибрати зайві чиновницькі перепони."
  allow_trade_center_sponsorship: "Плекання осередків торгівлі"
  allow_trade_center_sponsorship_desc: "Підтримавши торговища по всій країні, ми забезпечимо #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L міщанам#!#! та іншому люду, чиє ремесло пов'язане з грошима, можливості для обміну крамом, а також заохотимо жвавий плин торгівлі."
  market_fairs: "Ринкові ярмарки"
  market_fairs_desc: "Грошова підтримка та розвиток купецьких осередків привабить торгові потоки і дозволить нам накопичити величезні багатства та отримати доступ до широкого вибору екзотичного краму. До того ж ці торговища славляться своєю безпекою."
  nobility_council: "Рада вельмож"
  nobility_council_desc: "Коли представники вищих станів настільки впливові, що можуть зміцнювати або знищувати цілі династії, вельми розумно віддати їм на відкуп деякі ключові посади в уряді."
  manorial_courts: "Маноріальні суди"
  manorial_courts_desc: "Право чинити правосуддя, не будучи правителями, — один із найважливіших привілеїв #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#!. Наслідуючи володаря, васали судять суперечки, стягують податки та вводять закони, накопичуючи величезні багатства та користуючись чималою владою у своїх володіннях — на користь чи на згубу."
  increased_civic_engagement: "Плекання громадянської залучености"
  increased_civic_engagement_desc: "Заохочення громадян до спільної державної справи утверджує наш лад. Залучені до врядування міщани старанніше дбатимуть про суспільне благо і працюватимуть задля піднесення свого краю."
  inherited_offices: "Спадкові посади"
  inherited_offices_desc: "У більшости країн із ладом, подібним до нашого, керівні посади зазвичай обіймають обрані кандидати, проте ми дійшли висновку, що представники вищого стану стануть до нас прихильнішими, якщо дозволити їм передавати посади у спадок."
  recognized_communes: "Визнання комун"
  recognized_communes_desc: "Багато наших поселень — як міста, так і села — під владою магнатів-землевласників набули суттєвої самостійности. Визнавши їх повноцінними суб'єктами права, ми втратимо частину управи над їхніми внутрішніми справами, але #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знать#!#!, безсумнівно, оцінить наш жест."
  maintain_clerical_proceedings: "Збереження впливу віри"
  maintain_clerical_proceedings_desc: "Попри те, що ми дотримуємося республіканських ідеалів, #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L духовенство#!#! збереже свої звичні привілеї, а також владу над питаннями віри, моралі та церковного права."
  state_official_oaths: "Клятви чиновників"
  state_official_oaths_desc: "Перш ніж обійняти посаду, всі урядовці повинні висловити прихильність єдино істинній вірі, щоб #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L духовенство#!#! дало їм своє благословення."
  mandatory_clerical_donations: "Обов'язкові пожертви храмам"
  mandatory_clerical_donations_desc: "Піддані повинні виплачувати десятину духовним інститутам. Такі пожертви — священний обов'язок, що підкреслює благочестя та силу нашої віри."
  toll_and_tariff_exemptions: "Звільнення від сплати мит"
  toll_and_tariff_exemptions_desc: "Звільнивши торгові кораблі від сплати мит за перевезення краму, ми напевно доб'ємося того, що #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L міщани#!#! стануть набагато відданішими нашій владі."
  dedicated_merchant_courts: "Особливі торгові суди"
  dedicated_merchant_courts_desc: "Особливі суди, де #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L міщани#!#! можуть вирішувати суперечки, — одна з найвпливовіших гілок нашого уряду. Вони мають величезний вплив на грошові та купецькі справи."
  noble_patronage: "Заступництво знаті"
  noble_patronage_desc: "Наша торгова спроможність у жодному разі не повинна слабшати. Щоб #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L міщани#!#! могли безперешкодно вести торгівлю, #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знать#!#! мусить надавати їм заступництво та забезпечувати їх засобами для перевезення краму."
  appoint_ecclesiastical_offices: "Призначення на духовні посади"
  appoint_ecclesiastical_offices_desc: "Поняття знатности та божественности тісно переплетені в нашому побожному суспільстві. Корона зберігає за собою право призначати високопоставлених служителів церкви, забезпечуючи їхню відданість країні, і водночас дозволяє їм зміцнювати власний вплив."
  control_of_the_borderlands: "Захист порубіжжя"
  control_of_the_borderlands_desc: "Захист вірян далеко від столиці — нелегка справа. Доручивши її місцевій #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#!, ми убезпечимо свій народ від єретиків та чужовірців."
  sponsor_printing_of_religious_texts: "Опіка над друком духовних текстів"
  sponsor_printing_of_religious_texts_desc: "Друк священних книг не лише сприяє поширенню грамотности, а й допомагає закріпити догмати нашої віри в серцях людей. Широке розповсюдження духовної літератури зробить підданих більш освіченими та нагадає їм про їхні священні обов'язки."
  printing_of_religious_texts: "Друк духовних текстів"
  printing_of_religious_texts_desc: "Винахід друку, поширення та вільний продаж духовних текстів — усе це важливі явища, які допоможуть навчити наш народ грамоті та прищепити йому благочестя!\n\nВідкриває доступ до #TOOLTIP:ESTATE_PRIVILEGE,sponsor_printing_of_religious_texts,X #L опіки над друком духовних текстів#!#!."
  liturgical_mural_art: "Фрески"
  liturgical_mural_art_desc: "Стіни нашого палацу будуть прикрашені вражаючими духовними сценами. Найталановитіші художники країни створили ці витвори, щоб продемонструвати красу віри та висловити нашу любов до божественного."
  golden_liberty: "Золота вольність"
  golden_liberty_desc: "Золота вольність (відома польською як #italic złota wolność#!) уособлює величезний вплив та привілеї, якими зараз володіє #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знать#!#!, — включно з можливістю обирати правителя та визначати політику країни. Також передбачається, що вся #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L шляхта#!#! незалежно від рангу, багатства та етнічної приналежности рівна між собою."
  nieszawa_privileges: "Нешавські статути"
  nieszawa_privileges_desc: "Статути, за якими #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знать#!#! отримує суттєві привілеї. Ухвалення законів, набір військ, запровадження нових податків — усе це стає можливим лише за схвалення шляхти. Статути також накладають обмеження на можливості найбагатших родин на користь ширших верств знаті."
  pacta_conventa: "Pacta conventa"
  pacta_conventa_desc: "Ці статути, спочатку задумані як угоди між знаттю та країною, регламентують обов'язки корони в таких галузях, як зовнішня політика, військове керівництво, податки та багато інших."
  polish_merchant_seal: "[GetCountry('POL').GetAdjectiveWithNoTooltip]а торгова печатка"
  polish_merchant_seal_desc: "Це печатка з гербом нашої верховної влади. З таким документом #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L міщани#!#! отримують право вільно переміщатися без жодних перешкод, що дозволить купцям швидше розвозити крам містами. Натомість вони сплачують невеликий додатковий податок."
  privateer_contracts: "Каперські патенти"
  privateer_contracts_desc: "Щоб розширити нашу військово-морську спроможність, не вкладаючись у дорогий флот, ми регламентуємо та візьмемо під нагляд акти піратства, що йдуть на користь країні. Капери отримають державні грамоти, віддаючи частку здобичі в обмін на заступництво корони. Втім, грань між каперством і піратством досить тонка: доведеться дотримуватися обережности, щоб не нашкодити доброму імені країни…"
  noble_armies: "Війська знаті"
  noble_armies_desc: "Якщо дозволити #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L магнатам#!#! утримувати особисті війська, вони охочіше споряджатимуться на війну, але водночас отримають більше впливу."
  chancellor_nobles: "Радники зі знаті"
  chancellor_nobles_desc: "Перший радник — це одна з посад, яку в нашому уряді обіймає #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знать#!#! (особливо представники побічних гілок). Їхнє завдання — оформляти рішення країни у вигляді документів, тому вони становлять основу всієї нашої структури врядування."
  ayuntamientos: "Аюнтам'єнто"
  ayuntamientos_desc: "Це одна з найпомітніших і засадничих особливостей нашої країни: #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L селяни#!#! мають право створювати міські ради з чітко регламентованими законодавчими та виконавчими функціями."
  right_to_inherit: "Право успадкування"
  right_to_inherit_desc: "У #TOOLTIP:CULTUREGROUP,german_group,X #L німецької#!#! знаті є давній звичай розділяти землі батька між усіма його синами. Це дозволяє підтримувати мир між братами та уникати зайвих чвар."
  fund_karimi: "Опіка над купцями-карімі"
  fund_karimi_desc: "Впливові #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L міщани#!#!, відомі як карімі, торгують прянощами та іншим коштовним крамом. Опіка та грошова підтримка їхньої діяльности вкрай важливі для добробуту країни."
  waqf_payments: "Призначення вакфів"
  waqf_payments_desc: "Щоб показати наше благочестя та правовірність, ми будемо жертвувати #italic вакфи#! на будівництво медресе, лікарень та мечетей, допомогу незаможним та іншу благодійну діяльність."
  allow_hunting: "Дозволи на полювання"
  allow_hunting_desc: "#TOOLTIP:ESTATE_TYPE,peasants_estate,X #L Селяни#!#! отримають право полювати та добувати дичину в межах володінь свого пана або поселення."
  no_labor_sunday: "Вихідний у неділю"
  no_labor_sunday_desc: "З нашого боку буде розважливо наслідувати вчення #TOOLTIP:RELIGIONGROUP,christian,X #L християнської#!#! церкви та закріпити неділю як вихідний день для селян. Так ми продемонструємо не лише наше благочестя, а й співчуття."
  communal_lands: "Громадські землі"
  communal_lands_desc: "Незважаючи на те, що #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L селяни#!#! за визначенням перебувають у підпорядкованому становищі, ми все ж повинні однозначно затвердити, що всі представники нижчих верств мають право заводити громадські стада та вирощувати врожай на спільних полях."
  partial_yield: "Право на частину врожаю"
  partial_yield_desc: "Землі знаті та багатіїв обробляються селянами, невільниками або кріпаками. Ми можемо постановити, щоб #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L селяни#!#! щороку отримували хоча б частину врожаю з тієї землі, яку обробляють."
  access_to_royal_and_ecclesiastical_courts: "Доступ до монарших і церковних судів"
  access_to_royal_and_ecclesiastical_courts_desc: "Право на заступництво в суді захищає знедолених від свавілля можновладців. Тому світські та духовні суди повинні якомога сумлінніше розглядати позови, в яких #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L селяни#!#! виступають проти вельмож."
  peasants_in_administration: "Селяни у врядуванні"
  peasants_in_administration_desc: "Найбільш діяльні та обдаровані #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L селяни#!#! отримають право ставати до врядування. Довіривши їм деякі важливі посади, ми підвищимо справність уряду у навіть у найвіддаленіших закутках країни."
  ius_teutonicum: "Ius Teutonicum"
  ius_teutonicum_desc: "З часів східних марок Каролінзької імперії #TOOLTIP:CULTUREGROUP,german_group,X #L германські#!#!! народи постійно розселялися на схід, займаючи все більше земель. Німецькою цей процес називається #italic Ostsiedlung#! і часто заохочується місцевою владою, яка розраховує відправити більше людей на свої малонаселені території. Ці поселенці є суб'єктами особливого права, #italic $ius_teutonicum$#!, яке надає їм деякі привілеї, наприклад звільнення від податків або право створювати самоврядні міста."
  kormlenije: "Кормління"
  kormlenije_desc: "Кормління забезпечує пожиток руської #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#! коштом місцевого люду, міцно прив'язуючи бояр до волі правителя. Ця залежність від ласки двору є головною запорукою вірности боярства."
  haudenosaunee_labor_division: "Розподіл праці у гауденосауні"
  haudenosaunee_labor_division_desc: "Простолюд знає, що від нього вимагається, і між одноплеменцями заняття розподіляються так, щоб кожен працював заради спільного блага. Ті, кому дісталася одна й та сама справа, виконують її разом. Жінки та чоловіки допомагають одне одному, роблячи кожен своє. Таким чином виникає природний розподіл праці."
  manifesto_of_freedom: "Маніфест про вольності"
  manifesto_of_freedom_desc: "За підсумками періоду політичної нестабільности представники вищого стану отримали великі громадянські свободи в обмін на гарантії вірности.\n\nЦей маніфест діятиме протягом усього нинішнього правління, і відкликати його може бути вельми непросто."
  inaugural_diplomas: "Інавгураційні дипломи"
  inaugural_diplomas_desc: "Прагнучи налагодити міцні зв'язки, представники #TOOLTIP:ESTATE_TYPE,crown_estate,X #L корони#!#! отримали набір пільг за угодами, які мають назву «$inaugural_diplomas$». Серед цих посібників — зменшення зобов'язань щодо ополчення та право платити урізані податки."
  district_paving_privilege: "Порайонний податок"
  district_paving_privilege_desc: "Утримання доріг між безліччю різних частин #TOOLTIP:LOCATION,prague,X #L Праги#!#! є каменем спотикання для міських вельмож. Отримавши право стягувати податок з мощення нових доріг, вони допоможуть нам з'єднати одне з одним ще більше районів."
  joint_assembly_decrees: "Укази загальних зборів"
  joint_assembly_decrees_desc: "Знать нашої країни отримає низку прав, які дозволять їм зміцнювати єдність між ними та їхніми побратимами, якими повниться #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священна Римська Імперія#!#!."
  commons_petition: "Петиція громад"
  commons_petition_desc: "Це список кривд, складений учасниками повстання, що отримало назву «Паломництво благодаті»."
  austere_monastic_life: "Суворе чернече життя"
  austere_monastic_life_desc: "Життя в наших чернечих орденах нарешті повертається до ідеалів суворости та усамітнення. Накопичення багатств забороняється, і цілями монастирів знову стають споглядання та молитва.\n\nМи зможемо заснувати нові монастирі."
  warrior_tribunal: "Воїнський трибунал"
  warrior_tribunal_desc: "Це правова система, яка визначає юридичні повноваження військових виносити рішення щодо деяких видів злочинів."
  ceremonial_tax_exemptions: "Звільнення від податків за підтримку церемоній"
  ceremonial_tax_exemptions_desc: "Участь у приготуваннях до дарів, жертвоприношень та святкувань — величезна честь для наших #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L містян#!#!. В обмін на виконання цієї відповідальної ролі вони звільняються від сплати рядових податків."
  mita_system: "Міта"
  mita_system_desc: "З виникненням системи #italic міта#! всі чоловіки віком від 15 до 50 років зобов’язані протягом року безкоштовно працювати на благо країни. При цьому трудова повинність влаштована так, щоб не заважати людям забезпечувати свої сім’ї."
  kulm_law: "Кульмське право"
  kulm_law_desc: "Кульмське право, дещо змінена версія Магдебурзького права, — це привілей, який був дарований усім #TOOLTIP:AREA,prussia_area,X #L прусським#!#! містам, що захищають інтереси міських купецьких гільдій. Кульмське право дає їм чималу свободу у відносинах із володарями."
  invite_german_settlers: "Запрошення [ShowCultureGroupNameWithNoTooltip('german_group')|l]их поселенців"
  invite_german_settlers_desc: "Переселенці зроблять нашу країну сильнішою, забезпечивши приріст населення та змінивши на нашу користь баланс сил у регіоні."
  invite_german_settlers.tt: "Хвилі німецьких переселенців почнуть регулярно прибувати до нашої країни"
  autonomous_local_commanders: "Самостійна удільна старшина"
  autonomous_local_commanders_desc: "Місцева старшина, яка набирає війська для залог нашого ордену, вже давно просить нас розширити її самостійність задля дієвого врядування та посилення відданости нашій справі."
  apostolic_tax_privilege: "Апостольський податок"
  apostolic_tax_privilege_desc: "Наша вірність вищому ієрарху #L [ShowReligionAdjective('catholic')|l]ої#! віри повинна проявлятися не тільки на словах, а й у справах. Взявши на себе зобов’язання, за яким [GetCountry('PAP').GetGovernment.GetRulerTitle|l] завжди користуватиметься нашою повною підтримкою, ми однозначно доб’ємося його прихильности."
  golden_bull_of_1222: "Золота булла 1222 року"
  golden_bull_of_1222_desc: "Цей основоположний для Угорщини документ закріплює права та привілеї угорських вельмож. Згідно з цим договором #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знать#!#! звільняється від прямого оподаткування, що гарантує недоторканність їхніх прибутків з боку державної скарбниці. Ба більше, цей привілей обмежує їхні військові зобов’язання, захищаючи їхні свободи та водночас посилюючи їхній вплив у королівстві."
  monetary_fiefs: "Грошові феоди"
  monetary_fiefs_desc: "Більша частина землі в нашій країні належить короні. Замість того щоб передавати її у спадкове володіння #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#!, уряд призначає тимчасових намісників. Вони керують землями та отримують пожиток лише до тих пір, поки залишаються на посаді: після їхньої смерти або звільнення земля повертається короні. Це перешкоджає появі могутньої родової знаті та зміцнює вірність чиновників."
  ghazi_privilege: "Воєводи-газі"
  ghazi_privilege_desc: "Ці воїни б’ються на наших далеких рубежах в ім’я здобичі, слави та віри. Загони ревних вірян і розбійників із кочових племен охороняють наші межі, постійно здійснюють набіги, захоплюють чужі землі, розширюють наш вплив і сіють страх."
  autonomous_kadiluks: "Самостійні кадилики"
  autonomous_kadiluks_desc: "Слід розширити повноваження #italic каді#! в межах призначених їм #italic кадиликів#!. Так вони плідніше застосовуватимуть свої знання на благо країни."
  ayans_privilege: "Знать-аяни"
  ayans_privilege_desc: "Ніхто не відає про справи у віддалених краях краще, ніж знать, що там мешкає. Отримавши статус аянів, вони самостійно врядують землями, і країна нечасто втручається в їхні справи."
  bra_kreditwerk: "Кредитверк"
  bra_kreditwerk_desc: "Істотною частиною наших коштів керує #italic Кредитверк#!, що істотно шкодить нашим скарбовим спроможностям."
  bra_kreditwerk_reformed: "Реформований Кредитверк"
  bra_kreditwerk_reformed_desc: "#italic Кредитверк#!, реформований і поставлений під прямий нагляд #TOOLTIP:ESTATE_TYPE,crown_estate,X #L корони#!#!, дозволить успішніше знаходити гроші на наші задуми."
  share_of_the_spoils: "Частка здобичі"
  share_of_the_spoils_desc: "Смак перемоги стає ще солодшим, коли вся військова здобич іде в засіки нашого великого клану. Однак, ділячись частиною трофеїв, ми доб'ємося прихильности інших могутніх кланів, і в майбутньому це принесе нам чималу користь."
  tribal_host: "Племінне військо"
  tribal_host_desc: "Розведення найсильніших коней стане запорукою могутности нашого війська. Якщо цим займуться представники #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#!, ми ніколи не зіткнемося з нестачею скакунів для наших славних воїнів."
  tribal_autonomy: "Племінне самоврядування"
  tribal_autonomy_desc: "Наші праотці, як і їхні пращури, завжди цінували вільне життя за межами поселень, оточених стінами. Нам варто наслідувати їхній приклад, відійшовши подалі від чужинців, які хочуть збити нас з істинного шляху."
  libro_d_oro: "Золота книга"
  libro_d_oro_desc: "Щоб отримати право обиратися до Великої ради #ONCLICK:COUNTRY,[GetCountry('VEN').GetKey] #TOOLTIP:COUNTRY,[GetCountry('VEN').GetKey],X [GetCountry('VEN').Custom('CL_GEN')|L]#!#!, кандидат повинен задовольнити цілий ряд вимог. У #italic Золотій книзі#! наведено список сімей, які відповідають цим вимогам і можуть вважатися справжньою #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L аристократією#!#! [GetCountry('VEN').Custom('CL_GEN')]. Внести зміни до цієї книги може лише той, хто має величезний вплив і готовий витратити безліч золота."
  libro_d_argento: "Срібна книга"
  libro_d_argento_desc: "У той час як #italic Золота книга#! перелічує всі шляхетні родини [GetCountry('VEN').Custom('longname_ua_GEN')], #italic Срібна книга#! містить прізвища всіх уроджених (італійською #italic originarii#!) родин, що ведуть своє походження від початкових мешканців лагуни. Вони мають право торгувати як [GetCountry('VEN').GetAdjectiveWithNoTooltip|l]і громадяни та займати урядові посади, які їм надає [GetCountry('VEN').GetGovernment.GetGovernmentType.GetName|l]."
  zontas: "Зонта"
  zontas_desc: "Чинні радники, що керують #ONCLICK:COUNTRY,[GetCountry('VEN').GetKey] #TOOLTIP:COUNTRY,[GetCountry('VEN').GetKey],X [GetCountry('VEN').Custom('CL_INST')|L]#!#!, обрали людей шляхетного походження. Ці #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L аристократи#!#! формують так звані #italic зонти#! і наділені деякими привілеями, а також зобов'язані захищати [GetCountry('VEN').Custom('rank_ua_ACC')] від зосередження влади в руках однієї особи."
  avogadoria_de_comun: "Авогадори"
  avogadoria_de_comun_desc: "Врядування країною зосереджено в руках знаті і заможних родин, що займають ключові пости в #L [GetCountry('VEN').GetAdjective|l]ому#! уряді. Заради захисту інтересів країни і, отже, інтересів цих родин Рада створила інститут #italic авогадорів#! — це #italic державні прокурори#!, які стежать за діяльністю вищих посадових осіб, розслідують звинувачення в корупції та карають за порушення закону.\nНавіть самі дожі не можуть ухилитися від їхнього пильного ока."
  scottish_clans: "Шотландські клани"
  scottish_clans_desc: "Народ #ONCLICK:COUNTRY,[GetCountry('SCO').GetKey] #TOOLTIP:COUNTRY,[GetCountry('SCO').GetKey],X [GetCountry('SCO').Custom('CL_GEN')|L]#!#!, особливо на сільській півночі, історично розділений на безліч кланів, які пов'язані узами споріднености та близькістю проживання, а також підкоряються єдиному вождю. Кланові збори та міжкланові відносини — одна з рушійних сил #L [GetCountry('SCO').GetAdjective|l]ої#! політики."
  autonomous_scottish_clans: "Незалежні шотландські клани"
  autonomous_scottish_clans_desc: "$scottish_clans_desc$"
  gaelic_clans_pop_assignment_tt: "#TOOLTIP:LANGUAGE,gaelic_language,X #L Гельськомовні#!#! громади #TOOLTIP:CULTUREGROUP,celtic_group,X #L кельтської#!#! культурної групи будуть зараховані до #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племен#!#!"
  tribes_scotland_gaelic_heritage: "Спільна шотландська спадщина"
  tribes_scotland_gaelic_heritage_desc: "Протягом сотень років гірські клани зберігали свої #TOOLTIP:LANGUAGE,gaelic_language,X #L гельські#!#! звичаї, тоді як клани низин поступово формували власну #L [ShowCultureName('scottish')|l]у#! культуру. Проте всі вони готові забути про відмінності, щоб разом дати відсіч ворогам, що зазіхають на #ONCLICK:COUNTRY,[GetCountry('SCO').GetKey] #TOOLTIP:COUNTRY,[GetCountry('SCO').GetKey],X [GetCountry('SCO').Custom('CL_ACC')|L]#!#!."
  autonomous_tribes_scotland_gaelic_heritage: "Спільна гельська спадщина незалежних кланів"
  autonomous_tribes_scotland_gaelic_heritage_desc: "$tribes_scotland_gaelic_heritage_desc$"
  sco_statutes_of_iona: "Статут Айоні"
  sco_statutes_of_iona_desc: "Згідно з цим статутом, гірські клани повинні відправляти своїх спадкоємців для навчання в низинну частину країни. Завдяки цьому майбутня #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знать#!#! стане більш грамотною та освіченою, проте така практика може призвести до руйнування багатовікової гельської культури."
  salt_tax_exemption: "Податкові пільги на сіль"
  salt_tax_exemption_desc: "Нестача солі та її висока ціна завдають селянським господарствам чимало труднощів. Тому #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L селяни#!#! будуть звільнені від будь-якого податку, яким зазвичай обкладається #TOOLTIP:GOODS,salt,X #L сіль#!#!, щоб швидше подолати занепад та припинити заворушення."
  charter_of_the_nobility: "Жалувана грамота дворянству"
  charter_of_the_nobility_desc: "Грамота, складена після повстання Омеляна Пугачова. Вона розширює привілеї #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L дворян#!#! та підкреслює їхню роль у збереженні порядку."
  villes_franches: "Вільфранші"
  villes_franches_desc: "Кілька наших торгових міст значно зросли в останні десятиліття. У результаті вони стали символами зміцнення влади корони на противагу феодалам, які володіють селами."
  residence_in_versailles: "Резиденція у Версалі"
  residence_in_versailles_desc: "[GetCountry('FRA').GetGovernment.GetAdjective|l]а родина пропонує представникам найвидатніших дворянських династій переселитися до Версальського палацу."
  permanent_residence_in_versailles: "Постійна резиденція у Версалі"
  permanent_residence_in_versailles_desc: "Після реконструкції Версаля [GetCountry('FRA').GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')|l] зм[GetCountry('FRA').Custom('nobles_ihlaloly')] жити в палаці на постійній основі разом з [GetCountry('FRA').GetGovernment.GetAdjective|l]ою родиною. Тих, хто не входить до [GetCountry('FRA').GetGovernment.GetAdjective|l]ої династії, безумовно, захоплює місцева розкіш, проте їхній політичний вплив суттєво ослаб, адже [GetCountry('FRA').GetGovernment.GetRulerTitle|l] тепер може в будь-який момент втратити до них прихильність. Крім того, покинувши свої маєтки та потрапивши в пряму залежність від Версаля, дворяни залишили собі менше простору для змов та інтриг."
  great_offices_of_the_crown_of_france: "Вищі коронні чини [GetCountry('FRA').Custom('preposition_uv')] [GetCountry('FRA').Custom('CL_PREP')]"
  great_offices_of_the_crown_of_france_desc: "Це найважливіші пости в державному врядуванні, доступні лише #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L аристократам#!#! нашої країни."
  fra_marcel_great_ordinance: "Великий ордонанс"
  fra_marcel_great_ordinance_desc: "Внаслідок зусиль Етьєна Марселя [GetCountry('FRA').GetName] нині існу[GetCountry('FRA').Custom('end_yeyut')] за статтями Великого ордонансу. В обмін на розширення власного впливу Генеральні штати надали країні право збирати більше податків."
  fra_leadership_of_marcel: "Провід Етьєна Марселя"
  fra_leadership_of_marcel_desc: "Внаслідок зусиль Етьєна Марселя #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L міщани#!#! стали серйозною силою в Генеральних штатах."
  fra_marcel_compromise_ordinance: "Компромісний Великий ордонанс"
  fra_marcel_compromise_ordinance_desc: "Між короною та Етьєном Марселем було досягнуто угоди, згідно якої #TOOLTIP:ESTATE_TYPE,crown_estate,X #L правителі#!#! дають Марселю більше влади, а натомість Генеральні штати дозволяють короні збирати більше податків."
  fra_papacy_pragmatic_sanctions: "Бурзька Прагматична санкція"
  fra_papacy_pragmatic_sanctions_desc: "Відповідно до неї #TOOLTIP:RELIGION,$catholic_tt$,X #L католицька#!#! церква #ONCLICK:COUNTRY,[GetCountry('FRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('FRA').GetKey],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#! отримує ширшу незалежність від папства. Зокрема, функція виборного призначення на церковні посади переходить до церковної ради. [ShowEstateTypeName('clergy_estate')] задоволен[GetCountry('FRA').Custom('clergy_yiaei')], проте ці зміни призведуть до зниження впливу на Святий Престол та погіршать наші відносини з папами."
  vij_tamil_trading_rights: "Торгові права тамілів"
  vij_tamil_trading_rights_desc: "[ShowAreaName('tamil_land_area')] — це земля з безліччю торгових міст, де живуть люди, що розмовляють #TOOLTIP:CULTURE,$tamil_tt$,X #L тамільською#!#! мовою. Надавши їм привілеї самоврядування та вільної торгівлі, ми здобудемо їхню вірність та збільшимо прибутки країни."
  jain_banking_rights: "[ShowReligionAdjectiveWithNoTooltip('jain')]е право на лихварство"
  jain_banking_rights_desc: "#TOOLTIP:RELIGION,$jain_tt$,X #L Джайнізм#!#! вже не є панівним віровченням в Індії ані за кількістю вірян, ані за впливом на політику, але самі прихильники цієї віри все ще залишаються досить помітною частиною суспільства. Вони зробили своїм ремеслом лихварство та чиновництво, ставши цінними підданими для будь-якої країни, готової надати їм заступництво."
  jain_scholars: "[ShowReligionAdjectiveWithNoTooltip('jain')]і вчені"
  jain_scholars_desc: "Хоча #TOOLTIP:RELIGION,$jain_tt$,X #L джайнізм#!#! втратив свою колишню значущість, він все ще залишається вірою вельми діяльної меншини. Її сповідують мудрі та освічені вчені, які можуть надати нашій країні чималі послуги, якщо ми надамо їм таку можливість."
  dhimmi_abrahamic_communities: "Авраамічні громади"
  dhimmi_abrahamic_communities_desc: "У #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламських#!#! країнах прихильники #TOOLTIP:RELIGIONGROUP,christian,X #L християнської#!#! та #TOOLTIP:RELIGIONGROUP,israelite_group,X #L юдейської#!#! віри вважаються так званими #italic зіммі#!. За звичаєм передбачається, що правитель повинен захищати цих людей і при цьому тримати їх окремо від #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманської#!#! більшости. Громади #italic зімміїв#! можуть зберігати вірність країні, не загрожуючи при цьому #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманським#!#! звичаям."
  dhimmi_in_administration: "Зіммії-чиновники"
  dhimmi_in_administration_desc: "Деякі з наших найкращих чиновників не розділяють нашу віру, але при цьому є зразковими підданими, всім серцем відданими державі. Не допускати до влади тих, хто щиро хоче нам служити, — велика помилка, і ми мусимо негайно її виправити."
  dharmic_dhimmi_communities: "Дгармічні громади зімміїв"
  dharmic_dhimmi_communities_desc: "Спочатку саме поняття #italic «зіммі»#! в #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламських#!#! країнах позначало прихильників #TOOLTIP:RELIGIONGROUP,christian,X #L християнської#!#! та #TOOLTIP:RELIGIONGROUP,israelite_group,X #L юдейської#!#! віри, однак у цьому випадку йдеться про послідовників #TOOLTIP:RELIGION,$hindu_tt$,X #L індуїзму#!#! та інших #TOOLTIP:RELIGIONGROUP,dharmic,X #L дгармічних#!#! вір. За звичаєм вважається, що правитель повинен захищати їх, проте це може бути непросто, враховуючи, що в нашій країні вони становлять більшість населення. Завдяки підтримці істинної віри спільноти #italic зімміїв#! можуть зберігати вірність країні, не загрожуючи при цьому #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманським#!#! звичаям."
  clergy_in_administration: "Священники-чиновники"
  clergy_in_administration_desc: "У служителів віри вже є багато навичок, які потрібні чиновникам. Вони добре освічені, чудово володіють письмом, і в них є вища мета. Співпраця з ними забезпечить нам приплив дієвих і вправних урядовців."
  rajput_society: "Громада раджпутів"
  rajput_society_desc: "Раджпути — це давня каста благородних воїнів і гонорової #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#!. Серце їхніх володінь — сувора #TOOLTIP:AREA,rajputana_area,X #L Раджпутана#!#!, але вони зустрічаються по всій Північній Індії, і багато великих раджів претендують на раджпутське походження.\n\n#italic Значення модифікатора збільшується пропорційно долі представників #TOOLTIP:CULTURE,$mewari_tt$,X #L меварської#!#!, #TOOLTIP:CULTURE,$harauti_tt$,X #L хараутської#!#!, #TOOLTIP:CULTURE,$dhundhari_tt$,X #L дхундхарської#!#!, #TOOLTIP:CULTURE,$shekhawati_tt$,X #L шекхаватської#!#! та #TOOLTIP:CULTURE,$mewati_tt$,X #L меватської#!#! народностей, до якої додається 100%.#!"
  zamindar_tax_privilege: "Податкові привілеї для заміндарів"
  zamindar_tax_privilege_desc: "$mug_zamindar_system_desc$ Під час війни заміндари мають право збирати з населення податки на утримання війська. Цей привілей сильно збільшить наші доходи, але надасть більше влади #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#!."
  corruption_desc: "встромили свої пазурі до скарбниці та у справи двору, забезпечуючи себе необтяжливими посадами та розкладаючи суспільство своєю продажністю."
  consolidated_corruption_of_the_burghers: "Загальне розкладання багатіїв"
  consolidated_corruption_of_the_burghers_desc: "Укорінені середня та вища верстви $corruption_desc$"
  consolidated_corruption_of_the_peasants: "Загальне розкладання селян"
  consolidated_corruption_of_the_peasants_desc: "Наші піддані геть припинили поважати владу. Дуже часто, коли їх змушують платити податки, вони погрожують взятися за зброю…"
  consolidated_corruption_of_the_nobles: "Загальне розкладання знаті"
  consolidated_corruption_of_the_nobles_desc: "Укорінені представники знаті $corruption_desc$"
  consolidated_corruption_of_the_clergy: "Загальне розкладання вірян"
  consolidated_corruption_of_the_clergy_desc: "Правда в тому, що духовні пастирі здатні впливати на внутрішню політику лише на тій підставі, що отримали несправедливі переваги, погрожуючи нам відлученням від церкви."
  noble_sponsored_navy: "Флот знаті"
  noble_sponsored_navy_desc: "#TOOLTIP:ESTATE_TYPE,nobles_estate,X #L Знать#!#! утримує наше морське військо та командує кораблями. Завдяки їхній опіці ми можемо створити могутній флот, однак натомість вони отримають більше впливу на морську політику країни."
  magdeburg_rights: "Магдебурзьке право"
  magdeburg_rights_desc: "Це набір привілеїв, спочатку складений на основі фламандського права та поширений по Центральній #TOOLTIP:CONTINENT,europe,X #L Європі#!#! з потоками #TOOLTIP:CULTUREGROUP,german_group,X #L німецьких#!#! переселенців. Цей звід законів, зосереджений навколо свобод окремо взятого громадянина, гарантує та регламентує удільне самоврядування."
  novi_fori: "Сродське право"
  novi_fori_desc: "Ця юридична норма вийшла з набору привілеїв, колись дарованих #TOOLTIP:LOCATION,magdeburg,X #L Магдебургу#!#!. У міру поширення цього права за межі корінних #TOOLTIP:CULTUREGROUP,german_group,X #L германських#!#! земель до нього увійшли західні уявлення про містобудування, а також деякі кримінальні та цивільні закони."
  shooting_societies: "Стрілецькі товариства"
  shooting_societies_desc: "Це організовані ополчення #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L містян#!#! та ремісників, метою яких є військовий вишкіл та захист рідного міста від зовнішніх загроз. З дозволу #TOOLTIP:ESTATE_TYPE,crown_estate,X #L корони#!#! цим товариствам даровано право носити особливі обладунки та знаки, які раніше були дозволені лише #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#!."
  reduced_responsibilities_for_the_nobles: "Скорочення зобов'язань знаті"
  reduced_responsibilities_for_the_nobles_desc: "Щоб зберегти вірність вищих верств суспільства, ми вирішили дарувати їм цей привілей, звільнивши від багатьох звичних зобов'язань."
  reduced_taxation_for_the_nobles: "Скорочення податків на знать"
  reduced_taxation_for_the_nobles_desc: "Вищі верстви суспільства володіють значними владою та впливом, їхні примхи та забаганки мають реальну вагу. Якщо ми не хочемо, щоб баланс сил змістився на користь шляхетного стану, доведеться дати їм податкові послаблення."
  habshi_advisors_privilege: "Хабші-радники"
  habshi_advisors_privilege_desc: "Ці невільники, привезені колись зі #TOOLTIP:SUB_CONTINENT,east_africa,X #L Східної Африки#!#!, активно беруть участь у житті країни. Здобувши освіту у сфері врядування або військової справи, вони можуть принести країні велику користь. За вірну службу ми навіть можемо дарувати їм свободу — за умови, що вони приймуть нашу віру."
  bavarian_share_of_land: "[GetCountry('BAV').GetAdjectiveWithNoTooltip]і земельні розділи"
  bavarian_share_of_land_desc: "За законом і принципом справедливості ми розділили наші землі між членами правлячої династії. Це призвело до ще більшої роздроблености та свавілля. Щоб вважатися гідним суперником серед князів, з володінь яких складається #TOOLTIP:INTERNATIONAL_ORGANIZATION,$hre_tt$,X #L Священна Римська Імперія#!#!, ми повинні знову повернути собі владу та посилити уряд."
  mch_tribal_favor: "Прихильність племені"
  mch_tribal_favor_desc: "Чжурчженська знать має пріоритетне право на участь у державних справах, і її представники вдячні нам за відмову переймати іноземні звичаї."
  nihil_novi: "Nihil novi"
  nihil_novi_desc: "Знать домоглася привілею, який обмежує видання законів без їхньої згоди. Крім того, ця ініціатива обмежує свободу пересування кріпаків і звужує права міського населення."
  privilege_of_koszyce: "Кошицький привілей"
  privilege_of_koszyce_desc: "Знать отримала широкі права в обмін на дозвіл зійти на трон іноземному спадкоємцю. Тепер вони не можуть бути обтяжені податками без їхньої на те згоди."
  plc_empower_orthodox_nobility: "Зміцнення влади православної знаті"
  plc_empower_orthodox_nobility_desc: "Завдяки цьому рішенню #TOOLTIP:RELIGION,$orthodox_tt$,X #L православна#!#! знать отримає низку привілеїв та гарантій, які раніше надавалися виключно католицькій шляхті."
  cas_fuero_viejo: "Звід старих законів Кастилії"
  cas_fuero_viejo_desc: "Прагнучи систематизувати привілеї #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#! та гарантувати їм високе становище в нашій країні, ми зібрали воєдино розрізнені порядки та закони цього стану."
  cas_caballeros_villanos: "Лицарі-лиходії"
  cas_caballeros_villanos_desc: "Порубіжжя #TOOLTIP:AREA,castile_area,X #L Кастилії#!#! та #TOOLTIP:AREA,leon_area,X #L Леона#!#! останні кілька століть населяли своєрідні лицарі-скотарі. Вони звикли проводити зими, оберігаючи стада у своїх фортецях, а влітку влаштовувати набіги або вести війни проти  #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманських#!#! ворогів."
  cas_regimiento: "Рехім'єнто"
  cas_regimiento_desc: "Рехім'єнто — це система місцевого самоврядування [GetCountry('CAS').Custom('preposition_uv')] #ONCLICK:COUNTRY,[GetCountry('CAS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('CAS').GetKey],X [GetCountry('CAS').Custom('CL_PREP')|L]#!#!, за якої рішення приймає особлива рада, що складається з членів найбагатших та найвпливовіших сімей."
  royal_factories_privilege: "Королівські фабрики"
  royal_factories_privilege_desc: "Королівські фабрики — це приватні підприємства, які отримують підтримку країни, монарші привілеї та нагляд. Вони мають офіційне розпорядження зміцнювати домашню промисловість зі збереженням комерційної автономії."
  austrian_monastery_reform_melk: "Мелькська монастирська реформа"
  austrian_monastery_reform_melk_desc: "Дотримуючись настанов найкращих радників від церкви, ми реформували монастирі, щоб вони повністю відповідали #L [ShowReligionAdjective('catholic')|l]им#! принципам."
  vienna_concordat_privilege: "Віденський конкордат"
  vienna_concordat_privilege_desc: "[GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle] укладає з нами угоду, покликану врегулювати наші відносини. Ми змушені надати #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L духовенству#!#! більше влади заради прихильности папства."
  hab_tractatus_incorporalibus: "Tractatus de Iuribus Incorporalibus"
  hab_tractatus_incorporalibus_desc: "Регулювання відносин між землевласниками та #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L селянами#!#! забезпечить останнім певний юридичний захист, однак ускладнить розвиток сільського господарства."
  kannada_literature_aid: "Підтримка каннадської літератури"
  kannada_literature_aid_desc: "Якщо багаті піддані отримають права на #TOOLTIP:LANGUAGE,kannada_language,X #L каннадські#!#! тексти, ми врятуємо нашу літературу від занепаду."
  vij_patronization_of_local_gods: "Турбота про шанувальників дрібних божеств"
  vij_patronization_of_local_gods_desc: "#TOOLTIP:RELIGION,$hindu_tt$,X #L Індуїстським#!#! божествам немає числа. Краще дозволити нашим підданим молитися богам, які їм подобаються."
  vij_allowance_of_religious_practices: "Узаконення духовних практик"
  vij_allowance_of_religious_practices_desc: "Можливо, нам варто змістити увагу з індуїстів у нашій країні, щоб дозволити й громадам іновірців публічно практикувати свою віру."
  promotion_of_muslim_scholars: "Сприяння ісламським богословам"
  promotion_of_muslim_scholars_desc: "[ROOT.GetCountry.GetName] вважа[ROOT.GetCountry.Custom('end_yeyu')]ться осередком #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламської#!#! освіти. Щоб зміцнити цей статус, треба залучати до наших справ більше вчених, незалежно від того, кому вони вірні."
  ira_iranian_art_patronage: "Плекання іранських мистецтв"
  ira_iranian_art_patronage_desc: "Плекання мистецтв з боку #TOOLTIP:CULTUREGROUP,iranian_group,X #L іранських#!#! вельмож забезпечило появу та розвиток у країні розкішних мистецьких напрямків."
  ira_clerical_aristocracy: "Духовна знать"
  ira_clerical_aristocracy_desc: "Це союз багатих землевласників та #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L духовенства#!#!, у межах якого наділи передаються в дар духовенству, тому країна не може їх конфіскувати."
  lat_protector_of_the_constantinople_patriarchate: "Захисник Константинопольського патріархату"
  lat_protector_of_the_constantinople_patriarchate_desc: "Повернення хрестоносців до #TOOLTIP:LOCATION,constantinople,X #L Константинополя#!#! призвело до відновлення патріархату. Затвердивши #TOOLTIP:RELIGION,$catholic_tt$,X #L католицтво#!#! в Константинополі, патріархат знову стане символом католицького правління, яким повинна володіти [ShowScriptedGeographyName('greece_geography')]."
  mam_muhtasibs: "Мухтасіби"
  mam_muhtasibs_desc: "#italic Мухтасіб#! забезпечує чесну торгівлю на базарі, перевіряє #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L містян#!#!, публічно карає шахраїв та використовує посібники з поширених хитрощів для запобігання обману."
  heritable_iqta: "Спадкова ікта"
  heritable_iqta_desc: "Позиція власника #TOOLTIP:LAW,iqta_law,X #L ікти#!#! зазвичай не передається у спадок. Перетворення її на успадковану стане нечуваною справою та збільшить вірність #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знаті#!#!."
  trunk_road_to_erzurum_privilege: "Колісний шлях до $erzurum$"
  trunk_road_to_erzurum_privilege_desc: "Анатолія з'єднана з Табризом і Персією надійною мережею колісних доріг. Оскільки ми безпосередньо контролюємо важливий вузол цих доріг, наші #TOOLTIP:ESTATE_TYPE,burghers_estate,X #L купці#!#! отримують велику вигоду."
  lit_integrated_ruthenian_laws: "Впровадження руських законів"
  lit_integrated_ruthenian_laws_desc: "Впроваджуючи закони наших #TOOLTIP:CULTURE,$ruthenian_tt$,X #L руських#!#! народів, ми зможемо плідніше працювати над упорядкуванням єдиного зводу законів."
  lit_equal_status_of_orthodox_nobility: "Захист православної знаті"
  lit_equal_status_of_orthodox_nobility_desc: "Численна #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знать#!#!, що сповідує #TOOLTIP:RELIGION,$orthodox_tt$,X #L православ'я#!#!, заслуговує однакових прав з тими, хто не дотримується цієї віри. Якщо гарантувати їм рівність, ми здобудемо їхню прихильність."
  ukr_kholop_protection: "Захист прав холопів"
  ukr_kholop_protection_desc: "#TOOLTIP:ESTATE_TYPE,peasants_estate,X #L Селянам#!#! в нашій країні даровані та гарантовані основні права для захисту від свавілля багатіїв."
  tur_banned_weaponry_for_peasants: "[GetEstateNameWithNoTooltip('peasants_estate')] не мож[ROOT.GetCountry.Custom('peasants_eut')] володіти зброєю"
  tur_banned_weaponry_for_peasants_desc: "Нашу країну населяють найрізноманітніші народи, і часом це призводить до чвар. Якщо ми залишимо підданим право на носіння зброї, дрібні сварки можуть перерости в справжню війну. З цієї причини #TOOLTIP:ESTATE_TYPE,peasants_estate,X #L селянам#!#! більше не можна мати при собі зброю."
  noble_patronage_of_the_arts: "Шляхетне плекання мистецтв"
  noble_patronage_of_the_arts_desc: "Кілька видатних #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знатних#!#! родин вирішили надати опіку поетам, художникам і вченим при своїх дворах. Хоча дехто може вважати це марнославством, подібне плекання часто сприяє появі нових філософських шкіл в обмін на зростання придворного впливу."
  guild_investments: "Опіка гільдій"
  guild_investments_desc: "Гільдії погодилися виділяти частку своїх коштів на розвиток вторинних промислів. І хоча багато подібних починань зазнають невдачі, якісь призведуть до поступу, що докорінно змінить господарство."
  statutes_of_piotrkow: "Пйотркувський статут"
  statutes_of_piotrkow_desc: "Цей статут символізує спроби шляхти зміцнити свої привілеї та утримати кріпаків і владу в країні. Послабивши нижчі верстви та міста, #TOOLTIP:ESTATE_TYPE,nobles_estate,X #L знать#!#! сподівається закріпити власне верховенство."