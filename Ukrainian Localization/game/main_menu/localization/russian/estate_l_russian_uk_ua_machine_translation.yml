l_russian:
  nobles_estate: "Знать"
  nobles_estate_desc: "До цього стану належать знатні землевласники. Їхні привілеї, більшість з яких були даровані за виняткову службу правителю, закріплені давніми звичаями. Історично на них лежить відповідальність захищати країну від зовнішніх загроз і допомагати престолу врядувати, чинити суд та підтримувати мир.\n\n$estate_common_crown_ending$"
  clergy_estate: "Духовенство"
  clergy_estate_desc: "До цього стану належать освічені служителі нашої панівної віри. Їхній священний обов'язок — дбати про духовне благополуччя країни та народу, але вони також здавна стоять на службі держави та тримають в руках і світські справи. Протягом століть благочестиві піддані та колишні правителі дарували їм цінні володіння та привілеї.\n\n$estate_common_crown_ending$"
  burghers_estate: "Міщани"
  burghers_estate_desc: "До цього стану належать підприємці нашої країни, включно з ремісниками, купцями та лихварями. Їхня звична роль — плекати промисли та заробляти гроші. Тому вони зазвичай отримують особливі права та привілеї, що полегшують ремісничу справу та торгівлю.\n\n$estate_common_crown_ending$"
  peasants_estate: "Простолюд"
  peasants_estate_desc: "До цього стану належить населення, що перебуває на найнижчому суспільному щаблі. Зазвичай вони не мають ані визнання, ані впливу. Проте простолюд є підмурівком будь-якої країни та може перетворюватися на напрочуд могутню силу, коли гуртується.\n\n$estate_common_crown_ending$"
  crown_estate: "Корона"
  crown_estate_desc: "Правителі стоять над іншими станами та володарюють над країною.\n\nЯк правило, для них влади ніколи не буває забагато."
  dhimmi_estate: "Зіммії"
  dhimmi_estate_desc: "До цього стану належать піддані, які сповідують іншу віру і вважаються в #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламі#!#! «людьми Писання». Зазвичай цей статус стосується #TOOLTIP:RELIGIONGROUP,christian,X #L християн#!#! та #TOOLTIP:RELIGION,$judaism_tt$,X #L юдеїв#!#!, але іноді поширюється і на вірян інших [Concept('religions', 'віросповідань')|e]. Положення та привілеї зімміїв, їхня чисельність та устрій громад можуть значно відрізнятися залежно від країни.\n\n$estate_common_crown_ending$"
  tribes_estate: "Племена"
  tribes_estate_desc: "До цього стану належать різні племена та клани, що живуть у нашій [Concept('country', 'країні')|e]. Зазвичай вони поділяються на родові та сімейні громади, розташовані найчастіше в сільській місцевості. Їхній спосіб життя та заняття можуть сильно відрізнятися від однієї спільноти до іншої. Віддаленість та відносна незалежність від основних осередків влади не дозволяє встановити над ними надійну управу, а питомі звичаї роблять їх лютими та непередбачуваними воїнами.\n\n$estate_common_crown_ending$"
  cossacks_estate: "Козаки"
  cossacks_estate_desc: "До цього стану належить #TOOLTIP:CULTURE,$cossack_culture_tt$,X #L козацтво#!#!, що осіло у нашій [Concept('country', 'країні')|e]. Козаки об'єднуються у збройні ватаги та тримаються степового трибу життя подалі від можновладців та урядовців. Однак, якщо здобути їхню прихильність, ці вправні воїни понесуть нам вірну й справну службу.\n\n$estate_common_crown_ending$"
  estate_common_crown_ending: "Загалом краще, якщо правителі мають більше влади, ніж інші стани."
