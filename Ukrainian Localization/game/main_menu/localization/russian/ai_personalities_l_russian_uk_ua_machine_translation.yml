  ai_balanced_desc: "У цієї країни немає чітко виражених уподобань. Її дії залежать від темпераменту правителів, суспільних цінностей та поточних обставин."
  ai_aggressive_desc: "Ця країна прагне влади, покладаючись на силові методи. Вона охоче починає війни, висуває жорсткі умови миру і вважає сусідні країни перешкодами на шляху до мети, а не партнерами для вигідної співпраці."
  ai_expansionist_desc: "Ця країна прагне розширювати свої кордони та вплив. Вона віддає перевагу територіальній експансії, активно висуває претензії на ті чи інші землі та за можливости намагається підкоряти, а не приєднувати сусідів."
  ai_defensive_desc: "Ця країна насамперед прагне збереження наявного. Вона вважає за краще уникати непотрібних конфліктів, зміцнювати свої землі та швидше відповідати на загрози, ніж створювати нові."
  ai_cautious_desc: "Ця країна відрізняється терпінням та уникає ризиків. Вона насамперед прагне дипломатичних рішень, уникає затяжних воєн і надає перевагу стабільності замість авантюр."
  ai_opportunistic_desc: "Ця країна відрізняється розважливістю та прагматизмом. Вона прагне знайти слабке місце у свого опонента і вміє скористатися нагодою, але уникає участі в конфліктах з невизначеним результатом."
  ai_isolationist_desc: "Ця країна зосереджена на собі, віддає перевагу внутрішньому розвитку та уникає участі у справах сусідів. Вона дотримується нейтралітету і з підозрою ставиться до дипломатичних зобов’язань."
  ai_friendly_desc: "Ця країна цінує союзників, доброзичливість та чесні угоди. Вона витрачає багато сил на зносини, приймає розважливі умови миру та зазвичай з часом вибудовує надійні партнерські стосунки."
  CUSTOM_SEARCH_FILTER_AI_PERSONALITY_CATEGORY_NAME: "Мислення країни"
