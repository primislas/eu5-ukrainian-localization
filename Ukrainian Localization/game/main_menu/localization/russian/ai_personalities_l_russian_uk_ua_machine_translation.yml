  AI_DISPOSITION_RIVALS: "Суперництво"
  AI_DISPOSITION_INDIFFERENT: "Байдужість"
  AI_DISPOSITION_ALARMED_DESC: "Цей [Concept('country_disposition', 'настрій')|e] означає, що країна бачить у вас екзистенційну загрозу і намагатиметься обзавестися оборонними союзами або завдати по вам превентивного удару."
  AI_DISPOSITION_WARY_DESC: "Цей [Concept('country_disposition', 'настрій')|e] означає, що країна ставиться до вас насторожено, неохоче піде на поступки і навряд чи послабить пильність."
  AI_DISPOSITION_PLANNING_WAR_DESC: "Цей [Concept('country_disposition', 'настрій')|e] означає, що країна має претензії або образи, і вона готується силою нав’язати їх вам."
  AI_DISPOSITION_COVETS_DESC: "Цей [Concept('country_disposition', 'настрій')|e] означає, що країна вважає ваші землі привабливою ціллю і може спробувати завоювати або підкорити вас, якщо трапиться така нагода."
  AI_DISPOSITION_RIVALS_DESC: "Цей [Concept('country_disposition', 'настрій')|e] означає, що країна вважає вас суперником і буде за можливості протидіяти вашим інтересам, зокрема підтримуючи ваших ворогів."
  AI_DISPOSITION_INDIFFERENT_DESC: "Цей [Concept('country_disposition', 'настрій')|e] означає, що країна в даний момент байдужа до вас."
