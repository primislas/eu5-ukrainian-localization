  AI_DISPOSITION_SELF: "Ваша країна"
  AI_DISPOSITION_ALARMED_DESC: "Цей [Concept('country_disposition', 'настрій')|e] означає, що країна вважає вас загрозою своєму існуванню і намагатиметься обзавестися оборонними союзами або завдати по вас превентивного удару."
  AI_DISPOSITION_WARY_DESC: "Цей [Concept('country_disposition', 'настрій')|e] означає, що країна ставиться до вас насторожено, неохоче піде на поступки і навряд чи послабить пильність."
  AI_DISPOSITION_PLANNING_WAR_DESC: "Цей [Concept('country_disposition', 'настрій')|e] означає, що у країни є претензії або образи, і вона готується силою нав’язати свою волю."
  AI_DISPOSITION_COVETS_DESC: "Цей [Concept('country_disposition', 'настрій')|e] означає, що країна вважає ваші землі привабливою ціллю і може спробувати завоювати або підкорити вас, якщо трапиться така нагода."
  AI_DISPOSITION_DOMINEERING_DESC: "[Concept('country_disposition', 'Настрій країни')|e] означає, що вона могутніша за вашу, і її влада прагне підпорядкувати вас або зробити васалами, навіть якщо вона не претендує на конкретну провінцію."
  AI_DISPOSITION_RIVALS_DESC: "Цей [Concept('country_disposition', 'настрій')|e] означає, що країна вважає вас суперником і буде за можливості протидіяти вашим інтересам, зокрема підтримуючи ваших ворогів."
  AI_DISPOSITION_INDIFFERENT_DESC: "Цей [Concept('country_disposition', 'настрій')|e] означає, що країна зараз байдужа до вас."
  AI_DISPOSITION_FRIENDLY_DESC: "[Concept('country_disposition', 'Настрій країни')|e] означає, що її влада ставиться до вас по-дружньому і схильна до співпраці. Можливо, між вами склалися добрі відносини або ви разом перебуваєте в оборонному союзі."
