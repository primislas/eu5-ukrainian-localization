  ai_aggressive_desc: "Ця країна прагне влади силовими методами. Вона охоче починає війни, висуває жорсткі умови миру та вважає сусідні країни перешкодами на шляху до мети, а не партнерами для вигідної співпраці."
  ai_expansionist_desc: "Ця країна прагне розширення своїх кордонів та впливу. Вона віддає перевагу територіальній експансії, активно створює претензії та за можливости намагається підкоряти, а не приєднувати сусідів."
  ai_defensive_desc: "Ця країна насамперед стурбована збереженням вже наявного. Вона вважає за краще уникати непотрібних конфліктів, зміцнювати свої землі та швидше відповідати на загрози, ніж створювати нові."
  ai_cautious_desc: "Ця країна терпляча та уникає ризиків. Вона насамперед шукає дипломатичні рішення, уникає затяжних воєн і віддає перевагу стабільності авантюрам."
  ai_opportunistic_desc: "Ця країна розважлива та прагматична. Вона шукає слабкість і вміє скористатися нагодою, але уникає участи в конфліктах з невизначеним результатом."
  ai_isolationist_desc: "Ця країна замкнулася в собі, віддає перевагу внутрішньому розвитку та уникає участі у справах сусідів. Вона дотримується нейтралітету і з підозрою ставиться до дипломатичних зобов’язань."
  ai_friendly_desc: "Ця країна цінує союзників, доброзичливість та чесні угоди. Вона витрачає багато сил на зносини, приймає розумні умови миру та зазвичай з часом вибудовує надійні партнерські стосунки."
  CUSTOM_SEARCH_FILTER_AI_PERSONALITY_CATEGORY_NAME: "Мислення країни"
  AI_PERSONALITY_MODIFIERS: "Модифікатори поведінки"
  AI_DISPOSITION_ALARMED: "Тривога"
