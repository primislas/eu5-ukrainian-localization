  board_of_revenue_bureaucracy: "Скарбниця"
  board_of_revenue_bureaucracy_desc: "Ця впорядкована служба відповідає за збір та оцінку доходів країни, а також розпоряджання ними. На прикладі британської Скарбничої ради та французького #italic Генерального контролю фінансів#! ми бачимо, як за належного утримання скарбниця здатна радикально збільшити доходи корони. З іншого боку, якщо за такою установою не стежити, її можуть уразити хабарництво та лінощі, змушуючи витрачати ті кошти, які вона покликана захищати."
  privy_council_bureaucracy: "Таємна рада"
  privy_council_bureaucracy_desc: "Це внутрішня рада особливо довірених урядовців, яка слугує ключовим провідником королівської влади. Такі установи, як британська Таємна рада чи іспанська #italic Королівська рада#!, дають змогу главі країни ефективно керувати численними службами єдиної злагодженої установи. З іншого боку, без належної підтримки та сама Таємна рада легко перетворюється на арену для ворожнечі між станами, від єдности яких залежить добробут корони."
  audit_bureau_bureaucracy: "Рахункова палата"
  audit_bureau_bureaucracy_desc: "Ця спеціалізована служба контролює державні рахунки та виявляє хабарництво серед урядовців і збирачів податків. Установи, створені за зразком французької #italic Рахункової палати#! та нідерландської #italic Ревізійної палати#!, ставали для монархів потужним засобом для повернення втрачених доходів і притягнення урядовців до відповідальности. З іншого боку, за браку фінансування рахункова палата швидко втрачає свою незалежність — її починають контролювати ті самі сторони, за якими вона покликана наглядати."
  colonial_office_bureaucracy: "Відомство у справах колоній"
  colonial_office_bureaucracy_desc: "Це відомство відповідає за впровадження державних порядків на заморських землях, керує колоніальним врядуванням та слугує імперською управою. Британське Відомство у справах колоній — це наочний приклад того, как налагоджений контроль метрополії прискорює освоєння віддалених земель. З іншого боку, без належного постачання колоніальні вербувальники спонукають людей залишати країну, не пропонуючи їм кращої долі в межах імперії."
  admiralty_board_bureaucracy: "Адміралтейство"
  admiralty_board_bureaucracy_desc: "Ця особлива установа відповідає за відання та постачання військово-морських сил, а також стратегічне командування ними. Британське Адміралтейство та морський відділ іспанської #italic Військової ради#! наочно показують, що фахова оруда не менш важливе для флоту, ніж кораблі. Грамотно впорядковане адміралтейство здатне створити значний запас добре навчених моряків, однак за недостатнього фінансування набір проходить без належного навчання, що руйнує звичаї флоту навіть за зростання його чисельности."
  foreign_ministry_bureaucracy: "Міністерство закордонних справ"
  foreign_ministry_bureaucracy_desc: "Ця постійно діюча установа відповідає за зовнішні зв’язки країни. Зокрема, вона опікується утриманням штатного дипломатичного корпусу, а також координує зовнішню розвідку. Першою професійною службою такого штибу стало французьке #italic Міністерство закордонних справ#!, яке згодом взяли за зразок інші країни. За належного фінансування таке міністерство підвищує славу країни, проводячи успішні перемовини. Надмірна ощадливість на ньому, навпаки, може призвести до прикрих наслідків — наприклад, послам виявляться не по кишені власні резиденції або важливі документи залишаться без відповіді. Очевидно, що все це шкодить репутації країни."
  trade_commission_bureaucracy: "Торгова комісія"
  trade_commission_bureaucracy_desc: "Цей державний орган видає ліцензії купцям, розв’язує комерційні суперечки, регулює мита й борется з перемитництвом. На прикладі таких установ, як британська Торгова палата та контрольні ради #italic Голландської Ост-Індської компанії#!, ми бачимо, як організована участь країни в торгівлі йде на користь національному добробуту. З іншого боку, без належних повноважень торгова комісія перетворюється на беззубе опудало — монополії ухиляються від ліцензій, доходи від мит ідуть у приватні руки, а торговий клімат загалом погіршується."
  war_council_bureaucracy: "Військова рада"
  war_council_bureaucracy_desc: "Цей вищий орган військового командування відповідає за планування, координацію та контроль у царині сухопутних сил. Габсбурзький #italic гофкригсрат#! та британське Військове міністерство являють собою два різні рішення одного й того самого завдання командування військом, величезна чисельність якого не дає змоги підпорядкувати його одній людині. Належне фінансування військової ради забезпечує безперебійну підготовку здібних офіцерів, однак за браку коштів система пошуку та заохочення обдарованих бійців дає збій, що призводить до занепаду військових звичаїв."
  ordnance_board_bureaucracy: "Гарматне відомство"
  ordnance_board_bureaucracy_desc: "Це фахове відомство відповідає за виробництво, зберігання та постачання гармат, боєприпасів і саперного знаряддя. Британське Відомство боєприпасів та французький #italic Королівський гарматний корпус#! показують, що фаховий підхід до облогової справи потребує постійних чиновницьких установ, а не роботи з випадковими підрядниками. Належне утримання гарматного комітету значно підвищує боєздатність облогових частин, а за браку коштів становище погіршується: виробництва простоюють, облік на складах не ведеться, а укріплення занепадають без належного лагодження."
  commissariat_bureaucracy: "Комісаріат"
  commissariat_bureaucracy_desc: "Це тилове відомство відповідає за постачання розгорнутих військ харчами, припасами, одностроями та спорядженням. Подібна система, розроблена Лувуа для військ Людовика XIV і згодом розвинена до #italic Інтендантського корпусу#!, показує, що завдяки впорядкованому постачанню військо здатне вести воєнні кампанії таких обсягів і строків, які були б абсолютно неможливі за самостійного здобування харчу. За належного утримання комісаріат забезпечує війська достатньою кількістю живої сили, а за браку коштів змушує покладатися на розориві приватні угоди, витрати на які багаторазово перевищують вигоду від збільшення особового складу."
  central_secretariat_bureaucracy: "Головний секретаріат"
  central_secretariat_bureaucracy_desc: "За правління династії Юань #italic $zhongshu_sheng$#! був вищим органом цивільної влади, який зосередив у столиці врядування всіма землями імперії. За належного утримання секретаріат утверджує владу династії шляхом твердого та злагодженого врядування, але якщо його не контролювати, вартість кожного політичного рішення корони багаторазово зростає через чиновничий безлад."
  imperial_censorate_bureaucracy: "Вища наглядова управа"
  imperial_censorate_bureaucracy_desc: "Наглядова управа (Цензорат), яка за дому Юань називалася #italic юшитай#!, а за дому Мін — #italic дучаюань#!, боролася з хабарництвом серед урядовців і контролювала дотримання законів як у столиці, так і в провінціях. За належного утримання наглядачі цензурного відомства здатні запобігати крадіжкам податкових надходжень, але за браку грошей повноваження такої установи скорочуються, а стани швидко починають зловживати відсутністю контролю."
  six_boards_bureaucracy: "Шість міністерств"
  six_boards_bureaucracy_desc: "Назву #italic любу#! мали шість міністерств династії Мін — посадовців, доходів, обрядів, війни, покарань та громадських робіт. Ці міністерства спільно керували всім державним апаратом і являли собою найбільш розгалужену чиновницьку мережу у світі. Належне їхнє забезпечення дає змогу значно збільшити податкові надходження, однак за браку коштів міністерства перетворюються на особисті вотчини урядовців і ставлять власні інтереси вище за державні."
  six_boards_deactivate_disables_oversight_law_tt: "Ліквідація цієї [Concept('bureaucracy', 'установи')|e] позбавить вас доступу до закону #TOOLTIP:LAW,six_ministries_overseer_law,X #L «Нагляд за шістьма міністерствами»#!#!"
  grand_secretariat_bureaucracy: "Внутрішньопалацовий секретаріат"
  grand_secretariat_bureaucracy_desc: "#italic Нейге#! — це внутрішня рада, яка фактично правила імперією Мін. Її члени складали чернетки указів, слугували посередниками між імператором та зовнішніми урядовцями, а також координували роботу системи любу. Грамотно організований внутрішньопалацовий секретаріат підвищує славу імперії завдяки рішучому та одностайному правлінню, але за браку коштів він втрачає зв’язок з імператором і починає підривати його право на владу, замість того щоб зміцнювати його."
  bayt_al_mal_bureaucracy: "Байт аль-мал"
  bayt_al_mal_bureaucracy_desc: "#italic $bayt_al_mal_bureaucracy$#! — державна скарбниця ісламської країни. Вона збирає закят, харадж і джизью, а потім розподіляє ці кошти у вигляді виплат воякам, вченим і нужденним. Справна скарбниця збирає доходи з найменшими втратами і виконує свої обов'язки перед країною. На жаль, якщо залишити скарбницю без нагляду, вона хутко перетворюється на годівницю, з якої чиновники та землевласники крадькома тягнуть гроші, а милостиня для народу опиняється в чужих руках."
  hisba_bureaucracy: "Хісба"
  hisba_bureaucracy_desc: "#italic $hisba_bureaucracy$#! наглядає за ринками та громадською благочестивістю в ісламському місті під суворим оком мухтасиба. Вона перевіряє міри й ваги, припиняє шахрайство та дбає про чесну торгівлю. Дієві перевірки роблять торгівлю справедливою та впорядкованою, а також підносять авторитет влади в очах вірян. Натомість продажний нагляд лише заважає людям, і купці, знесилені його утисками, починають вести справи в обхід дозволених шляхів."
  mazalim_court_bureaucracy: "Суд мазалім"
  mazalim_court_bureaucracy_desc: "#italic $mazalim_court_bureaucracy$#! — це власний суд правителя, куди піддані можуть скаржитися на кривди, сваволю чиновників і рішення каді. Належно впорядкований суд дозволяє володарю тримати під наглядом провінції та притягати місцевих можновладців до відповідальности. Але занедбаний суд утрачає свій вплив, і знатні урядовці, не боячись правосуддя володаря, безкарно чинять свавілля."
  diwan_al_insha_bureaucracy: "Диван аль-Інша"
  diwan_al_insha_bureaucracy_desc: "#italic $diwan_al_insha_bureaucracy$#! — це відомство, що укладає державні едикти, угоди та посольське листування в урочистому стилі придворного звичаю. Добре споряджена служба записів знаходить друзів своїми красномовними та вчасними листами, а занедбана — не дає ради з листуванням, через що повага до нашого двору серед інших володарів підупадає."
  barid_bureaucracy: "Барід"
  barid_bureaucracy_desc: "#italic $barid_bureaucracy$#! — це поштове та розвідувальне відомство ісламської країни. Його вершники та вивідачі дивовижно швидко доправляють звістки зі столиці на кордон і назад. Така служба дає правителю змогу знати про все, що діється, та невідкладно надсилати накази на великі відстані. Водночас вона потребує повсякчасного утримання та пильного нагляду, аби гінці переповідали правду, а не поголоски, та вірно несли свою службу."
  diwan_al_hajj_bureaucracy: "Диван аль-Хадж"
  diwan_al_hajj_bureaucracy_desc: "#italic $diwan_al_hajj_bureaucracy$#! — відомство, яке споряджає щорічний караван прочан до Мекки всім необхідним. Цей обов'язок приносить велику славу володарям, які супроводжують махмаль і боронять священні шляхи. Щедро забезпечене відомство перетворює хадж на щорічний доказ непохитної віри країни. Недолуге відомство вкриває володаря неславою на весь мусульманський світ, після чого законники заходилися посилювати суворі приписи віри, щоби заповнити цю порожнечу."
  diwan_al_jund_bureaucracy: "Диван аль-Джунд"
  diwan_al_jund_bureaucracy_desc: "#italic $diwan_al_jund_bureaucracy$#!, заснований халіфом Умаром, є військовим реєстром, де зазначено, які вояки отримують платню зі скарбниці, а які — земельні наділи. Ведення такого обліку дає певність під час набору й виплати платні, збільшує чисельність війська, готового стати до зброї, та підносить бойовий дух наших воїнів."
  shurat_bureaucracy: "Шурат"
  shurat_bureaucracy_desc: "Правовірні мученики, $shurat$, збираються в загони по 40 чи більше воїнів під проводом імама аш-Шарі. Щойно мусульманин-#TOOLTIP:RELIGION,$ibadi_tt$,X #L ібадит#!#! оголошує про намір здійснити шира, йому належить відмовитися від шлюбу, сплатити всі борги та зректися всього мирського добра. Приписи віри вимагають, щоб загін шурат бився доти, доки в ньому не лишиться тільки троє."
  shurta_bureaucracy: "Шурта"
  shurta_bureaucracy_desc: "#italic $shurta_bureaucracy$#! — це міська варта ісламського міста. Від польового війська вона відрізняється тим, що відповідає за підтримання ладу, ув'язнення та дотримання комендантської години. Добре забезпечена варта дбає про безпеку міст і швидко гасить заворушення, оберігаючи наш люд і наш край."