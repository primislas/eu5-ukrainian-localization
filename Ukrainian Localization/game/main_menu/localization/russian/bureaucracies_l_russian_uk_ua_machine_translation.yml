  board_of_revenue_bureaucracy: "Скарбниця"
  board_of_revenue_bureaucracy_desc: "Ця централізована служба відповідає за збір та оцінку доходів країни, а також розпоряджання ними. На прикладі британської Скарбничої ради та французького #italic Генерального контролю фінансів#! ми бачимо, як за належного фінансування скарбниця здатна радикально збільшити доходи корони. З іншого боку, якщо за такою установою не стежити, її можуть уразити хабарництво та лінощі, змушуючи витрачати ті кошти, які вона покликана захищати."
  privy_council_bureaucracy: "Таємна рада"
  privy_council_bureaucracy_desc: "Це внутрішня рада особливо довірених урядовців, яка слугує ключовим провідником королівської влади. Такі установи, як британська Таємна рада чи іспанська #italic Королівська рада#!, дають змогу главі країни ефективно керувати численними службами єдиної злагодженої установи. З іншого боку, без належної підтримки та сама Таємна рада легко перетворюється на арену для ворожнечі між станами, від єдности яких залежить добробут корони."
  audit_bureau_bureaucracy: "Рахункова палата"
  audit_bureau_bureaucracy_desc: "Ця спеціалізована служба контролює державні рахунки та виявляє хабарництво серед урядовців і збирачів податків. Установи, створені за зразком французької #italic Рахункової палати#! та нідерландської #italic Ревізійної палати#!, ставали для монархів потужним засобом для повернення втрачених доходів і притягнення урядовців до відповідальности. З іншого боку, за браку фінансування рахункова палата швидко втрачає свою незалежність — її починають контролювати ті самі сторони, за якими вона покликана наглядати."
  colonial_office_bureaucracy: "Управління у справах колоний"
  colonial_office_bureaucracy_desc: "Це відомство відповідає за впровадження державної політики на заморських землях, керує колоніальною адміністрацією та контролює там правовий режим імперії. Британське Управління у справах колоній — це наочний приклад того, как організований контроль метрополії прискорює освоєння віддалених земель. З іншого боку, без належного постачання колоніальні вербувальники спонукають людей залишати країну, не пропонуючи їм кращої долі в межах імперії."
  admiralty_board_bureaucracy: "Адміралтейство"
  admiralty_board_bureaucracy_desc: "Ця спеціальна комісія відповідає за адміністрування та постачання військово-морських сил, а також стратегічне командування ними. Британське Адміралтейство та морський відділ іспанської #italic Військової ради#! наочно показують, що професійна адміністрація не менш важлива для флоту, ніж кораблі. Грамотно організоване адміралтейство здатне створити значний резерв добре навчених моряків, однак за недостатнього фінансування набір проходить без належного навчання, що руйнує звичаї флоту навіть за зростання його чисельности."
  foreign_ministry_bureaucracy: "Міністерство закордонних справ"
  foreign_ministry_bureaucracy_desc: "Ця постійно діюча установа відповідає за зовнішні зв’язки країни. Зокрема, вона опікується утриманням штатного дипломатичного корпусу, а також координує зовнішню розвідку. Першою професійною службою такого штибу стало французьке #italic Міністерство закордонних справ#!, яке згодом взяли за зразок інші країни. За належного фінансування таке міністерство підвищує славу країни, проводячи успішні перемовини. Надмірна ощадливість на ньому, навпаки, може призвести до прикрих наслідків — наприклад, послам виявляться не по кишені власні резиденції або важливі документи залишаться без відповіді. Очевидно, що все це шкодить репутації країни."
  trade_commission_bureaucracy: "Торгова комісія"
  trade_commission_bureaucracy_desc: "Цей державний орган видає ліцензії купцям, розв’язує комерційні суперечки, регулює мита й борется з перемитництвом. На прикладі таких установ, як британська Торгова палата та контрольні ради #italic Голландської Ост-Індської компанії#!, ми бачимо, як організована участь країни в торгівлі йде на користь національному добробуту. З іншого боку, без належних повноважень торгова комісія перетворюється на беззубе опудало — монополії ухиляються від ліцензій, доходи від мит ідуть у приватні руки, а торговий клімат загалом погіршується."
  war_council_bureaucracy: "Військова рада"
  war_council_bureaucracy_desc: "Цей вищий орган військового командування відповідає за планування, координацію та контроль у царині сухопутних сил. Габсбурзький #italic гофкригсрат#! та британське Військове міністерство являють собою два різні рішення одного й того самого завдання командування військом, величезна чисельність якого не дає змоги підпорядкувати його одній людині. Належне фінансування військової ради забезпечує безперебійну підготовку здібних офіцерів, однак за браку коштів система пошуку та заохочення талановитих бійців дає збій, що призводить до занепаду військових звичаїв."
  ordnance_board_bureaucracy: "Гарматний комітет"
  ordnance_board_bureaucracy_desc: "Це спеціалізоване відомство відповідає за виробництво, зберігання та постачання гармат, боєприпасів і саперного знаряддя. Британське Управління боєприпасів та французький #italic Королівський гарматний корпус#! показують, що професійний підхід до обложної справи потребує штатних бюрократичних установ, а не роботи з випадковими підрядниками. Належне фінансування гарматного комітету значно підвищує боєздатність обложних частин, а за браку коштів ситуація змінюється на гірше: виробництва простоюють, ревізії на складах не проводяться, а укріплення занепадають без належного ремонту."
  commissariat_bureaucracy: "Комісаріат"
  commissariat_bureaucracy_desc: "Це тилове відомство відповідає за постачання розгорнутих військ харчами, припасами, одностроями та спорядженням. Подібна система, розроблена Лувуа для військ Людовика XIV і згодом розвинена до #italic Інтендантського корпусу#!, показує, що завдяки централізованому постачанню військо здатне вести воєнні кампанії таких обсягів і строків, які були б абсолютно неможливі за самостійного здобування харчу. За належного фінансування комісаріат забезпечує війська достатньою кількістю живої сили, а за браку коштів змушує покладатися на розориві приватні угоди, витрати на які багаторазово перевищують вигоду від збільшення особового складу."
  central_secretariat_bureaucracy: "Центральний секретаріат"
  central_secretariat_bureaucracy_desc: "За правління династії Юань #italic $zhongshu_sheng$#! був вищим органом цивільної влади, який зосередив у столиці управління всіма землями імперії. За належного фінансування секретаріат утверджує владу династії шляхом твердого та злагодженого управління, але якщо його не контролювати, вартість кожного політичного рішення корони багаторазово зростає через адміністративний безлад."
  imperial_censorate_bureaucracy: "Імперський цензорат"
  imperial_censorate_bureaucracy_desc: "Цензорат, який за династії Юань називався #italic юшитай#!, а за династії Мін — #italic дучаюань#!, боровся з хабарництвом серед урядовців і контролював дотримання законів як у столиці, так і в провінціях. За належного фінансування інспектори цензурного управління здатні запобігати крадіжкам податкових надходжень, но за браку грошей повноваження такого органа скорочуються, а стани швидко починають зловживати відсутністю контролю."
  six_boards_bureaucracy: "Шість міністерств"
  six_boards_bureaucracy_desc: "Назву #italic любу#! мали шість міністерств династії Мін — кадрів, доходів, обрядів, війни, покарань та суспільних робіт. Ці міністерства спільно керували всім державним апаратом і являли собою найбільш розгалужену бюрократичну структуру у світі. Належне їхнє фінансування дає змогу значно збільшити податкові надходження, однак за браку коштів міністерства перетворюються на особисті вотчини урядовців і ставлять власні інтереси вище за державні."
  six_boards_deactivate_disables_oversight_law_tt: "Ліквідація цієї [Concept('bureaucracy', 'установи')|e] позбавить вас доступу до закону #TOOLTIP:LAW,six_ministries_overseer_law,X #L «Нагляд за шістьма міністерствами»#!#!"
  grand_secretariat_bureaucracy: "Внутрішньопалацовий секретаріат"
  grand_secretariat_bureaucracy_desc: "#italic Нейге#! — це внутрішня рада, яка фактично правила імперією Мін. Її члени складали чернетки указів, слугували посередниками між імператором та зовнішніми урядовцями, а також координували роботу системи любу. Грамотно організований внутрішньопалацовий секретаріат підвищує славу імперії завдяки рішучому та одностайному правлінню, але за браку коштів він втрачає зв’язок з імператором і починає підривати його право на владу, замість того щоб зміцнювати його."