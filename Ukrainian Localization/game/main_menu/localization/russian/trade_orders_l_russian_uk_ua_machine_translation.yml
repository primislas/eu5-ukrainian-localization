  TRADE_ORDER_NO_PROFITABLE_ROUTE: "@trigger_fail! Не вдалося знайти вигідні [Concept('trade', 'угоди')|e]. Країна під керуванням комп’ютера продовжить щодня шукати можливі угоди."
  TRADE_ORDER_BELOW_PROFIT_CUTOFF: "@trigger_fail! Не вдалося знайти прибутковий [Concept('trade', 'торговий')|e] шлях.\nНайкращий шлях веде на ринок [MARKET.GetNameWithNoTooltip] з доходом $PROFIT_RATIO|+=2$@gold! на одиницю [Concept('merchant_capacity', 'засобів')|e] (потрібно не нижче $CUTOFF|=2$@gold!).\nШІ щодня повторюватиме спроби."
  TRADE_ORDER_QUICK_IMPORT_TT: "Дозволяє створити замовлення на [Concept('import', 'привіз')|e], залучаючи 1 од. [Concept('merchant_capacity', 'купецьких засобів')|e]. Країна під керуванням комп’ютера щодня шукатиме найвигідніше джерело товару."
  TRADE_ORDER_QUICK_EXPORT_TT: "Дозволяє створити замовлення на [Concept('export', 'вивіз')|e], залучаючи 1 од. [Concept('merchant_capacity', 'купецьких засобів')|e]. Країна під керуванням комп’ютера щодня шукатиме найвигідніший пункт призначення."
