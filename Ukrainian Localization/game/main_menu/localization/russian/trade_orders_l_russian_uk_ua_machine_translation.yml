  TRADE_ORDER_TRADES_TOOLTIP_SUMMARY: "Дійсні [Concept('trade', 'торгові')|e] шляхи: [TradeOrderItem.GetTradeCount]. Прибуток: [TradeOrderItem.GetProfitPerCapacity|+=2]@gold! на [Concept('merchant_capacity', 'купецькі засоби')|e]."
  TRADE_ORDER_TRADES_TOOLTIP_SUMMARY_MIN: "[TradeOrderItem.GetTradeCount] шт. активних [Concept('trade', 'торгових')|e] шляхів мають [Concept('trade_profit', 'прибутковість')|e] понад мінімум у [TradeOrderItem.GetMinProfit|+=2]@profit_trade! на одиницю [Concept('merchant_capacity', 'купецьких засобів')|e], приносячи нам [TradeOrderItem.GetProfitPerCapacity|+=2]@profit_trade! за одиницю [Concept('merchant_capacity', 'купецьких засобів')|e], що сукупно дає нам [TradeOrderItem.GetTotalProfit|+=2]@gold!."
  TRADE_ORDER_TRADES_TOOLTIP_NONE_MIN: "Немає [Concept('trade', 'торгових')|e] шляхів із [Concept('trade_profit', 'прибутковістю')|e] понад мінімум у [TradeOrderItem.GetMinProfit|+=2]@profit_trade! на одиницю [Concept('merchant_capacity', 'купецьких засобів')|e]. Країна під керуванням комп’ютера щодня повторюватиме спроби."
  TRADE_ORDER_TRADES_TOOLTIP_NONE: "Поки немає активних [Concept('trade', 'торгових')|e] шляхів. Країна під керуванням комп’ютера щодня намагатиметься укласти угоду."
  TRADE_ORDER_SKIPPED_NO_CAPACITY: "Ця [Concept('trade_order', 'торгова угода')|e] не оцінюється, оскільки [Concept('trade_orders', 'торгові угоди')|e] з вищим пріоритетом або ручна торгівля вже залучають усі доступні [Concept('merchant_capacity', 'купецькі засоби')|e] на цьому [Concept('market', 'ринку')|e]."
  TRADE_ORDER_GOOD_TRADES_TOOLTIP_SUMMARY: "[TradeOrderGoodsEntryItem.GetTradeCount] шт. активних [Concept('trade', 'торгових')|e] шляхів для цього товару приносять нам [TradeOrderGoodsEntryItem.GetProfitPerTC|+=2]@profit_trade! за одиницю [Concept('merchant_capacity', 'купецьких засобів')|e]."
  TRADE_ORDERS_SCROLL_LIST_EMPTY: "На цьому ринку немає [Concept('trade_order', 'торгових замовлень')|e]."
  TRADE_ORDER_TRADES_SCROLL_LIST_EMPTY: "На цьому ринку немає [Concept('trade', 'торгівлі')|e] цим товаром. Почніть її власноруч або ж укладіть [Concept('trade_order', 'торгову угоду')|e]."
  TRADE_ORDER_MODE_PROFIT: "Зосередження на прибутку"
  TRADE_ORDER_MODE_FOOD: "Зосередження на харчах"
  TRADE_ORDER_MODE_NEEDS: "Зосередження на нестачах"
  TRADE_ORDER_MODE_PROFIT_WITH_ICON: "@gold! $TRADE_ORDER_MODE_PROFIT$"
  TRADE_ORDER_MODE_FOOD_WITH_ICON: "@food! $TRADE_ORDER_MODE_FOOD$"
  TRADE_ORDER_MODE_NEEDS_WITH_ICON: "@shortage! $TRADE_ORDER_MODE_NEEDS$"
  TRADE_ORDER_MODE_PROFIT_TT: "Угода витрачатиме свої [Concept('merchant_capacity', 'купецькі засоби')|e] на найприбутковіші [Concept('trades', 'угоди')|e], пов’язані з обраними товарами та ринками."
  TRADE_ORDER_MODE_FOOD_TT: "Угода витрачатиме свої [Concept('merchant_capacity', 'купецькі засоби')|e] на [Concept('trades', 'угоди')|e], що переміщують найбільшу кількість [Concept('food', 'харчів')|e] на ринки, які втрачають харчі та мають [Concept('food_stockpile', 'запаси')|e], менші за [GetDefine('NAI', 'TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%]."
  TRADE_ORDER_MODE_NEEDS_TT: "Угода витрачатиме свої [Concept('merchant_capacity', 'купецькі засоби')|e] на покриття нестачі [Concept('goods', 'товарів')|e] на цільових ринках, пункт за пунктом, по черзі. Постачаються тільки товари, [Concept('stockpile', 'запаси')|e] яких нижчі за [GetDefine('NAI', 'TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%]."
  TRADE_ORDER_MODE_PROFIT_INFO: "Ця угода зосереджується на #italic прибутку#!: вона витрачає свої [Concept('merchant_capacity', 'купецькі засоби')|e] на найприбутковіші [Concept('trades', 'угоди')|e], пов’язані з обраними товарами та ринками."
  TRADE_ORDER_MODE_FOOD_INFO: "Ця угода зосереджується на #italic харчах#!: вона витрачає свої [Concept('merchant_capacity', 'купецькі засоби')|e] на [Concept('trades', 'угоди')|e], що переміщують найбільшу кількість [Concept('food', 'харчів')|e] на ринки, які мають у цьому потребу.\n\nРинок отримує допомогу лише в разі, якщо він втрачатиме харчі без цієї угоди, і його [Concept('food_stockpile', 'запас харчів')|e] нижчий за [GetDefine('NAI', 'TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%]. Нижче за [GetDefine('NAI', 'TRADE_ORDER_FOOD_GROWTH_STOCKPILE_FRACTION')|V0%] угода також поповнює запаси на [GetDefine('NAI', 'TRADE_ORDER_FOOD_MONTHLY_STOCKPILE_GAIN')|V0%] від максимуму на місяць. Вище за [GetDefine('NAI', 'TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%] ринок вважається забезпеченим і не отримує нічого.\n\nВивіз призупиняється, якщо [Concept('food_stockpile', 'запас харчів')] на ринку власника нижчий за [GetDefine('NAI', 'TRADE_ORDER_FOOD_EXPORT_SELF_STOP_FRACTION')|V0%], і скасовується, якщо нижчий за [GetDefine('NAI', 'TRADE_ORDER_FOOD_EXPORT_SELF_CANCEL_FRACTION')|V0%]."
  TRADE_ORDER_MODE_NEEDS_INFO: "Ця угода зосереджується на #italic потребах#!: вона витрачає свої [Concept('merchant_capacity', 'купецькі засоби')|e] на покриття споживання кожного товару в переліку за спаданням.\n\nТовар постачається лише в разі, якщо цільовий ринок споживає більше, ніж виробляє на місці, а його [Concept('stockpile', 'запаси')|e] нижчі за [GetDefine('NAI', 'TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%]. Угода перевозить рівно стільки, скільки потрібно для зведення балансу до нуля, враховує допомогу, що вже надходить з інших місць, та ігнорує нестачу, спричинену самим лише вивозом.\n\nПоки [Concept('stockpile', 'запаси')|e] товару нижчі за [GetDefine('NAI', 'TRADE_ORDER_NEEDS_GROWTH_STOCKPILE_FRACTION')|V0%], угода також поповнює його до [GetDefine('NAI', 'TRADE_ORDER_NEEDS_MONTHLY_STOCKPILE_GAIN')|V1%] від максимуму на місяць. Між цим значенням та [GetDefine('NAI', 'TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%] вона покриває лише баланс."
  TRADE_ORDER_NEW_TOOLTIP_SUMMARY: "Нова [Concept('trade_order', 'торгова угода')|e] залучить [TradeOrderLateralView.GetEffectiveTC|2]@trade_capacity!. Комп’ютер укладе [Concept('trades', 'торгові угоди')|e] після того, як ви підтвердите угоду."
