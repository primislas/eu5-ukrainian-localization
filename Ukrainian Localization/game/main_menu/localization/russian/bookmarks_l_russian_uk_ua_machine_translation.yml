  bookmark_1658_desc: "Тестова закладка для перевірки семантики include + override. Більшість файлів налаштування повторно використовують дані 1337 року через include; SWE (Швеція) перезаписана своїми кордонами 1658 року (Сконе, Галланд, Естонія, Лівонія). У журналі очікується поява помилок ERRORLOG щодо областей, які вже перебувають у власності, як задокументовано в agent_docs/bookmark_overrides.md."