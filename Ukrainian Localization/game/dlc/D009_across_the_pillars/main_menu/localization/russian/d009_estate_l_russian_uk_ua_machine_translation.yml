l_russian:
  alg_taifa_rais: "Країна алжирських піратів"
  alg_taifa_rais_desc: "Піратські капітани Алжира об’єдналися у спілку, яка повністю контролює військову та торгову інфраструктуру порту: вони ведуть перемовини про викуп бранців, розподіляють частки здобичі та підтримують флот у цілковитій бойовій готовності, забезпечуючи процвітання всього міста. Ми визнаємо їхнє об’єднання керівним осередком морського господарства Алжира й наділяємо його славою та законним правом укладати угоди з чужоземними купцями й набирати команди по всьому Магрибу. Така співпраця між короною та піратською верхівкою дає нашій країні боєздатні військово-морські сили без утримання королівського флоту."
  anr_consell_de_la_terra: "Рада землі"
  anr_consell_de_la_terra_desc: "Рада землі — це станово-представницькі збори шести громад Андорри. Її створено для відання справами нашої країни та захисту прадавніх прав її люду від зазіхань з боку будь-кого з двох князів-співправителів."
  anr_quartos: "Квартони"
  anr_quartos_desc: "Шість громад Андорри врядуються через виборні ради — квартони. Вони відають місцевими справами та скеровують представників до Ради землі. Цей стародавній устрій громадського самоврядування обмежує пряме втручання князів-співправителів у повсякденне життя нашого люду."
  anr_sindic_general: "Старший синдик"
  anr_sindic_general_desc: "Старший синдик — це виборний представник андоррського суспільства. Йому доручено боронити спільні інтереси громад перед обома князями-співправителями й очолювати всю нашу громадську управу."
  basque_cofradias_marineras: "Морські братства"
  basque_cofradias_marineras_desc: "Морські братства баскського узбережжя — це прадавні спілки моряків та рибалок, створені задля об’єднання засобів, взаємовиручки та збереження звичаїв нашого мореплавного народу. Їхня злагоджена спільна праця пришвидшує спорудження кораблів і забезпечує постійний приплив досвідчених моряків."
  basque_pase_foral: "Пасе форал"
  basque_pase_foral_desc: "Пасе форал (Pase Foral) — це право баскських установ вивчати та призупиняти дію будь-яких королівських указів, що суперечать місцевим законам-фуерос, до їхнього офіційного набуття чинності на наших землях. Ми коримося королю, але лише тією мірою, якою це дозволяють прадавні звичаї нашого краю."
  basque_universidad_mercaderes_bilbao: "Універсідад-де-Меркадерес-де-Більбао"
  basque_universidad_mercaderes_bilbao_desc: "Купецька гільдія Більбао — офіційно заснована під назвою «Універсідад-де-Меркадерес» — наділена правом розв’язувати торгові суперечки, встановлювати торгові норми та регулювати торгівлю вовною і залізними виробами, що йде через порт. Її торгові суди знижують урядовий тягар на корону й водночас забезпечують сталі податкові надходження."
  bula_de_la_santa_cruzada: "Хрестоносна булла"
  bula_de_la_santa_cruzada_desc: "Папа Римський дарував нашій країні безстрокову хрестоносну буллу. Це дозволяє нам збирати кошти з вірян на війну з іновірцями, а також дарує особливі індульгенції нашим воїнам, які стали зі зброєю на захист віри."
  cas_letrados: "Летрадос"
  cas_letrados_desc: "Летрадос — це судові правники та урядовці з університетською освітою, яких корона призначає до державних рад. Їхнє залучення позбавляє королівське врядування від засилля спадкової знаті, замінюючи її фаховим станом чиновників, вірних виключно монаршій владі. Летрадос привносять у правову сферу глибокі правничі знання та культуру урядової справності, докорінно змінюючи весь устрій уряду."
  cas_patronato_real: "Королівська опіка"
  cas_patronato_real_desc: "Королівський патронат — це виключне право корони висувати кандидатів на посади єпископів та абатів у всіх наших заморських володіннях, що підпорядковує церкву в колоніях королівській владі. Цей патронат перетворює духовенство на засіб колоніального врядування та важливе джерело слави для корони."
  cat_capitols_de_cort: "Капітули кортесів"
  cat_capitols_de_cort_desc: "Капітули кортесів — це законодавчі угоди, укладені між короною та каталонськими кортесами. Вони зобов’язують усіх наступних правителів свято шанувати права та вольності станів. Жоден королівський указ не може скасувати їхніх положень без виразної згоди всього королівства."
  eastern_amazigh_oasis_charter: "Оазисна хартія"
  eastern_amazigh_oasis_charter_desc: "Життя громад оаз у передсахарських землях східного Марокко та Алжиру впорядковується устроєм спільних прав на воду та звичаєвим землекористуванням, на яких століттями трималося осіле землеробство в цьому безплідному краю. Офіційно визнаючи хартії цих оазисних громад, а також їхні спадкові права на зрошувальні канали й пальмові гаї, ми ґарантуємо процвітання цих поселень і міцно прив’язуємо їхніх жителів до нашої країни через права на землю. Ця хартія перетворить суворі пустельні рубежі на квітучі сільськогосподарські угіддя та поширить наш вплив на всю мережу торгових шляхів через Сахару."
  glc_archbishopric_compostela: "Архієпархія Компостели"
  glc_archbishopric_compostela_desc: "Як опікуни архієпархії Сантьяго-де-Компостела ми отримуємо славу та дохід від нескінченного потоку прочан, які мандрують Шляхом святого Якова, щоб уклонитися мощам апостола. Це закріплює за нашою країною статус твердині християнської віри."
  glc_foros_de_galicia: "Галісійські форо"
  glc_foros_de_galicia_desc: "#italic Форо#! — це спадкові договори довгострокової оренди, на підставі яких селяни Галісії володіють оброблюваною землею на вічні часи. За це вони сплачують визначені внески і не зазнають свавільних поборів з боку землевласників. Таке стале землекористування заохочує селянські родини вкладатися в землю та міцно прив’язує їх до своїх громад із покоління в покоління."
  gra_ulema_council: "Рада улемів"
  gra_ulema_council_desc: "Книжники ісламського права складають найвищу дорадчу установу нашої країни: вони тлумачать доктрини віри та наділяють владу султана священним правом на владу. Їхній беззаперечний авторитет у правових питаннях гарантує, що все судочинство залишається міцно вкоріненим у божественному законі"
  gra_visirate: "Візират"
  gra_visirate_desc: "Візират — це вища державна рада, через яку знатні чиновники правлять країною від імені султана, наводячи лад у державних справах і гарантуючи, що кермо влади перебуває в надійних руках."
  gra_volunteers_of_faith: "Побожні добровольці"
  gra_volunteers_of_faith_desc: "#italic Мутатавві#! — це побожні добровольці, які вступають до війська султана в часи війни з невірними, спонукувані переконаннями віри, а не феодальними обов’язками. Вони підсилюють собою наші війська, а їхня лють у бою з лишком надолужує брак формального військового вишколу."
  gra_volunteers_of_faith_unlocks_mutatawwia_tt: "Можна набирати #TOOLTIP:UNITTYPE,a_mutatawwia,X #L мутатавві#!#!"
  kabyle_tajmaat_pact: "Договір із таджмаатом"
  kabyle_tajmaat_pact_desc: "Сільські збори #italic таджмаат#! — це громадська рада, що діє на Кабільському нагір’ї, де дорослі чоловіки збираються задля обговорення питань місцевого судочинства, розподілу спільних засобів та відповіді громади на зовнішні виклики. Офіційно визнаючи #italic таджмаат#! законним представницьким органом кабільського простолюду в становій системі, ми погоджуємося вести справи з гірськими громадами на їхніх умовах, замість того щоб нав’язувати чужі їм владні установи, які викличуть лише затятий опір. Цей договір забезпечує нам стале врядування нагір’ям без утримання постійних залог і міцно прив’язує кабільські громади до нашої країни через взаємне визнання."
  lon_concejos_asturianos: "Астурійські консехо"
  lon_concejos_asturianos_desc: "Міські ради Астурії — це давня установа, що сягає корінням у звичаї вольностей-#italic фуерос#! гірських перевалів, де вільні люди гуртували громадську оборону й чинили суд задовго до того, як тут утвердився бодай якийсь королівський двір. Незгасна сила цих звичаїв прив’язує селянство до нашої країни узами місцевої відданости, а не примусом."
  lon_san_isidoro_patronage: "Опіка над Св. Ісидором"
  lon_san_isidoro_patronage_desc: "Наша корона жалує землі та кошти Королівській соборній церкві Св. Ісидора в Леоні, що слугує духовним осердям країни. Цей королівський мавзолей та осередок науки, чиє романське книгосховище-писарня віками берегло вчену спадщину Ісидора Севільського, уособлює велич нашого престолу."
  maghrebi_zawiya_endowment: "Підтримка завій"
  maghrebi_zawiya_endowment_desc: "Суфійська обитель #italic завія#! слугує водночас місцем поклоніння, школою ісламського права, прихистком для подорожніх та осередком місцевого третейського суду в усіх сільських областях Магрибу. Надавши цим обителям законного статусу та пожертв від вірян, ми поширимо вплив нашої духовної влади на землі, де не мають сили жодні укази намісників і де шейх #italic завії#! користується більшою повагою, ніж далекий султан. Ці вкладення у далекі духовні терени нашої країни забезпечують нам відданість народу за малу частку від вартості прямого врядування."
  masmuda_atlas_pact: "Договір із масмуда"
  masmuda_atlas_pact_desc: "Клани масмуда населяють високогір’я Високого та Антиатласу. Вони ладнають спільну оборону та місцеве врядування на основі спадкових племінних договорів із часів Альмохадського халіфату, біля витоків якого колись стояли. Ми визнаємо авторитет цих гірських рад та їхнє право тримати перевали, а вони натомість затято чинитимуть опір будь-якому ворожому війську, що спробує прорватися гірськими шляхами. Цей договір зв’яже громади масмуда зі столичною владою гнучкими союзницькими узами, водночас вони збережуть свою широку самоврядність і віковий звичай громадського носіння зброї."
  mellah_charter: "Хартія для мелл"
  mellah_charter_desc: "#italic Мелли#! — це самоврядні юдейські подвір’я в містах Магрибу. Ці відокремлені громади були створені султаном як запорука внутрішньої самоврядності юдейського люду. До того ж вони сплачували щедрі податки з ремісничої та торгової справи, в яких юдейські громади споконвіку мали успіх. Видавши офіційну хартію для таких громад, ми впорядковуємо правовий стан наших юдейських підданих і приваблюємо вправних майстрів, фінансистів та купців, чиї торгові зв’язки охоплюють усе Середземномор’я та Сахару. Залучення #italic мелл#! до нашого міського господарства забезпечує приплив ремісничих виробів, позик та рідкісного краму, що йде на користь усьому місту."
  mll_consolat_de_mar: "Консолат-де-Мар"
  mll_consolat_de_mar_desc: "#italic Консолат-де-Мар#! — це наш морський трибунал, наділений повноваженнями розв’язувати суперечки щодо фрахту, страхування та торгових товариств на основі укладеного морського права, обов’язкового як для купців, так і для капітанів кораблів. Його консули, яких обирають з-поміж представників самого купецького стану, зміцнюють становище наших #Y містян#!, приваблюють переселенців до наших #Y портових міст#! та збільшують наші #Y прибутки від торгівлі#!."
  mor_abid_al_bukhari: "Гвардія абід аль-Бухарі"
  mor_abid_al_bukhari_desc: "Гвардійці-#italic абід#! — це корпус воїнів-невільників, створений султаном і названий на честь імама аль-Бухарі. Цей псевдоюридичний зв’язок робить їх відповідальними перед короною, а не перед окремими господарями. Ми перетворили цей корпус на постійне фахове військо, що підпорядковується винятково престолу, зменшуючи нашу залежність у питаннях скликання ополчення від вічно ворожих союзів племен. Подібне зосередження військової сили в руках монарха знаменує собою вирішальний крок до створення суверенного війська, незалежного від ополчення величних родів."
  mor_andalusian_refugees: "Андалуські біженці"
  mor_andalusian_refugees_desc: "Андалуські та морискські біженці, що оселилися в наших містах — насамперед у Фесі, Рабаті й Тетуані, — принесли з собою багату ремісничу спадщину Аль-Андалусу: кахлі-#italic зілідж#!, вишукану кераміку, шовкове ткацтво й архітектурні орнаменти, що вирізняють міську культуру північно-західного Марокко. Офіційно визнаючи громади цих біженців і надаючи їм привілеї міського стану, ми спрямуємо їхню творчу силу на розбудову господарства марокканських міст і міцно прив’яжемо їх до престолу узами вдячности й законного захисту. Їхні ремісничі звичаї та купецькі зв’язки забезпечать нашим містам такий рівень виробництва, якого самі лише місцеві майстри не змогли б досягти за такий короткий строк."
  mor_gharb_war_tribes: "Войовничі племена Гарбу"
  mor_gharb_war_tribes_desc: "Союзи племен хлут, суфійян, тлік і рійя далі живуть на рівнинах Гарб, Азгар і Хабт на тих самих умовах, на яких колись оселилися їхні пращури: земля для обробітку та звільнення від податків в обмін на готовність іти на війну за покликом султана. Ми купуємо їхню службу, але не покірність, і про це пам’ятають обидві сторони. Ми не правимо цими племенами, а домовляємося з ними. Але ця угода надзвичайно вигідна: намети чотирьох союзів здатні дати нам більше вершників, ніж будь-які міста."
  mor_guich_tribes: "Племена гіш"
  mor_guich_tribes_desc: "Племінні роди #italic гіш#! отримують від влади землі в обмін на відбування постійної кінної служби на користь султана. Вони цілковито звільнені від податкового тягаря, що лягає на осіле населення. Їхній спадковий обов’язок військової служби забезпечує марокканському султанату постійний запас кінноти, що набирається на придатних для конярства плоскогір’ях Гарбу та Дуккали. Ми офіційно закріпимо такий обмін земель на службу і перетворимо ці військові роди на збройне продовження влади монарха на всіх рівнинах краю."
  mor_guich_tribes_makhzan_requirement_tt: "Ми заснували установу «[ShowBureaucracyTypeName('makhzan_bureaucracy')]»"
  mor_guich_tribes_unlocks_guich_cavalry_tt: "Можна набирати #TOOLTIP:UNITTYPE,a_guich_cavalry,X #L гішську кінноту#!#!"
  mor_makhzen_caids: "Каїди махзена"
  mor_makhzen_caids_desc: "#italic Каїди#! — це призначувані короною намісники, яких султан посилає для зміцнення столичної влади на підконтрольних землях — #italic біляд аль-махзен#!. Від імені престолу вони збирають податки, чинять правосуддя та підтримують лад. Офіційне призначення цих каїдів і нагляд за ними дасть нам змогу поширювати вплив махзена по всій нашій країні й обмежувати вольності великих союзів племен, які інакше жили б суто за власними звичаями. Залучення призначуваних короною урядовців із місцевим впливом становить урядову основу марокканського краю."
  mor_marabout_patronage: "Опіка над мурабітами"
  mor_marabout_patronage_desc: "Мурабіти — це святі праведники, чий духовний спадок визнаний народом. Їхні святині розкидані по всьому Марокко, а простий люд шукає їхнього заступництва заради зцілення, третейського суду та захисту від біди. Опікуючись цими заступниками та їхніми обителями-#italic завіями#!, ми пов’язуємо мережу духовної влади з махзеном і перетворюємо султана на визнаного оборонця народного марокканського ісламу. Цей союз відкриває нам доступ до духовних посередників, здатних замирювати громади, до яких нелегко дістатися як намісникам, так і постійному війську."
  mozabite_communal_pact: "Мзабська громадська угода"
  mozabite_communal_pact_desc: "П’ять міст Мзабського п’ятиграддя підтримують своє господарське процвітання завдяки суворій громадській дисципліні. За її дотриманням стежить рада #italic аззаба#! — ібадитська духовна установа, що поєднує релігійну владу, торгове суддівство та впорядкування торгівлі на караванних шляхах через Сахару. Офіційно визнавши це громадське самоврядування законним виявом влади міського стану в Мзабі, ми долучимо торговельну мережу п’ятиграддя до господарства нашої країни. При цьому нам не доведеться нав’язувати чужі для них урядові порядки, які викликали б лише запеклий опір. Відомі своєю непохитною чесністю мзабські купці мають довіру серед торговців по всій Сахарі."
  mudejar_aljamas: "Альхами мудехарів"
  mudejar_aljamas_desc: "Ми визнаємо право мусульманських громад зберігати власні самоврядні #italic альхами#! і дозволяємо їм сповідувати свою віру, розв’язувати внутрішні суперечки за власними законами та продовжувати займатися своїми ремеслами й торгівлею. Їхній внесок у господарство незамінний для нашої країни, а їхньої вірности найліпше досягати поступками, а не примусом."
  nav_buenas_villas: "Буенас-вільяс"
  nav_buenas_villas_desc: "Привілейованим містам нашої країни — #italic буенас-вільяс#! — даровано королівські вольності, що забезпечують їм свободу торгівлі та самоврядування в обмін на пряму вірність короні. Місцеві ради містян слугують противагою владі знаті та надійним джерелом прибутків для королівської скарбниці."
  nav_mesnadero: "Меснадерос"
  nav_mesnadero_desc: "#italic Меснадерос#! — це королівська кінна варта, знатні воїни, пов’язані з короною обов’язком особистої служби та уславлені своїм нищівним навалом. Їхнє привілейоване становище як особистого почту монарха гарантує непохитну вірність і найвищу боєздатність."
  nav_mesnadero_unlocks_mesnaderos_tt: "Можна набирати #TOOLTIP:UNITTYPE,a_mesnaderos,X #L меснадерос#!#!"
  nav_palacio_cabo_armeria: "Маєтки кабо-де-армерія"
  nav_palacio_cabo_armeria_desc: "#italic Маєтки кабо-де-армерія#! — це спадкові володіння в Наваррі. Родові герби їхніх володарів внесені до королівських книг, що дає їм змогу посідати високе становище при дворі та брати участь у королівських радах."
  spa_grandes_de_espana: "Гранди Іспанії"
  spa_grandes_de_espana_desc: "Гранди Іспанії — найвища знать королівства, представники якої мають право перебувати в присутності монарха з покритою головою, а також посідати високі становища на державних зборах. Їхній авторитет та вірність — підвалини королівської влади."
  tle_mashwar_court: "Двір Машвар"
  tle_mashwar_court_desc: "#italic Машвар#! — внутрішній двір султанату Тлемсен, у якому султан в урочистих обставинах радиться зі знаттю та правознавцями, визнаючи цим їхнє високе становище в країні Заянідів. Правитель у такому устрої не виглядає деспотом, а його рішення, підтримані згуртованою знаттю, мають більшу вагу та правочинність. Ми узаконимо повноваження цієї ради. Нехай вона стане місцем політичних розмов, де шляхетний стан зможе брати участь у житті країни та підтримувати правовий лад."
  tuareg_caravan_guild: "Туарезька гільдія караванів"
  tuareg_caravan_guild_desc: "Конфедерація туарегів тримає під контролем торгові шляхи через Сахару, якими від Сахелю до портів Магрибу вони перевозять золото, сіль та невільників. Їхні провідники, погоничі верблюдів та воїни підтримують місцеве господарство. Офіційне визнання туарезьких караванів та введення їхніх господарів до міщанського стану надасть нам доступ до безцінних відомостей про торгові шляхи, а також забезпечить запорукою безпеки, без якої торгувати в Сахарі неможливо. Угода з пустельними купцями заполонить султанат сахарським крамом та зміцнить наше господарство."
  tuareg_imghad_vassalage: "Імгади-васали"
  tuareg_imghad_vassalage_desc: "#italic Імгади#! — васальні роди конфедерації туарегів, які за звичаєм зобов’язані служити знатним #italic імаджеґенам#! в обмін на захист і доступ до пасовищ Сахари. Надавши васальним зносинам між родами офіційного статусу, султан візьме під непрямий нагляд цю дику пустелю. #italic Васальна#! угода дозволить нам набирати дисциплінованих вершників із найменшими для скарбниці витратами."
  tun_hafsid_caliphal_claim: "Зазіхання хафсідського халіфату"
  tun_hafsid_caliphal_claim_desc: "У мусульманському світі султани з дому Хафсідів вважають себе наступниками альмохадського халіфату й законними спадкоємцями верховної влади «Повелителя правовірних». Ми плекаємо велич халіфату: проводимо священні обряди, тримаємо зв’язок із правителями далеких мусульманських країн та опікуємося вірними вченню богословами. Такий духовний авторитет вирізняє нас з-поміж інших султанатів і забезпечує вірність наших мусульманських союзників."
  tun_taifa_of_rais: "Тайфа реїсів"
  tun_taifa_of_rais_desc: "Туніська #italic тайфа#! реїсів — це об’єднання капітанів-корсарів. У її уставі закріплено порядок корсарських нападів, розподілу здобичі та викупу бранців на невільничих ринках. Ми офіційно визнаємо цю тайфу й залучаємо до наших справ найздібніших її морських підприємців, а натомість надаємо їм формальні права на гавань. Завдяки цій угоді Туніс тепер має одну з найкращих корсарських спільнот у західному Середземномор’ї, яка в разі війни відправить своїх моряків на королівську службу."
  unlocks_proclaim_pase_foral_tt: "Стає доступним [Concept('cabinet_action', 'доручення')|e] «[ShowCabinetActionName('proclaim_pase_foral')]»"
  val_tribunal_de_les_aigues: "Водний трибунал"
  val_tribunal_de_les_aigues_desc: "Водний трибунал Валенсії — це найстаріший чинний трибунал у Європі. Він збирається щочетверга перед брамою собору, щоби справедливо розподіляти воду між землеробами. Неписані повноваження трибуналу визнають усі, адже від його рішень залежить суспільний лад та добробут сільського господарства Валенсії."
  zenati_mounted_levy: "Зенетське кінне ополчення"
  zenati_mounted_levy_desc: "Конфедерація зената — це берберські племена, добре знані своєю легкою кіннотою. У бою вони послуговуються короткими стременами та списами за звичаями #italic зенетської фурусії#!, що вплинула на вершників на всьому узбережжі Середземномор’я. Ці моторні вершники можуть прикривати наше військо, нападати на ворожі шляхи постачання й майже без підтримки долати великі відстані високогір’ям. Вони шанують давні звичаї й тому вірні султанові, а військовий лад для них не такий важливий, як виконання зобов’язань перед ним."