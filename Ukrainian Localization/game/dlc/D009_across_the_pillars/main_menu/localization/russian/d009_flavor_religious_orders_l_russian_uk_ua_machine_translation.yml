l_russian:
  d009_flavor_religious_orders.1.title: "Зміна проводу"
  d009_flavor_religious_orders.1.entry: "$d009_flavor_religious_orders.1.title$"
  d009_flavor_religious_orders.1.desc: "[old_head_of_order.GetName], що вірою та правдою [Select_CString(old_head_of_order.IsFemale, 'служила', 'служив')] нашій країні на чолі #ONCLICK:COUNTRY,[target_order.GetKey] #TOOLTIP:COUNTRY,[target_order.GetKey],X [target_order.Custom('CL_GEN')|L]#!#!, зненацька [Select_CString(old_head_of_order.IsFemale, 'занедужала й була змушена', 'занедужав і був змушений')] піти на спочинок.\n\nХоча на [Select_CString(old_head_of_order.IsFemale, 'її', 'його')] місце претендують численні гідні лицарі та вельможі, [target_ruler.target_ruler.GetShortName] вже [Select_CString(target_ruler.IsFemale, 'знайшла', 'знайшов')] для цієї справи підхожу людину з-поміж своїх улюбленців. Великим магістром [target_order.Custom('CL_GEN')] стане [target_character.GetShortName] — якщо, звісно, ми не дозволимо братам обрати його самим."
  d009_flavor_religious_orders.1.a: "Новим Великим магістром стане [target_character.GetShortName]."
  d009_flavor_religious_orders.1.a.entry: "Новим Великим магістром стане наш фаворит."
  d009_flavor_religious_orders.1.b: "[target_order.GetNameWithNoTooltip] сам обере свого Великого магістра."
  d009_flavor_religious_orders.1.b.entry: "Брати самі оберуть свого Великого магістра."
  d009_flavor_religious_orders.2.title: "[target_character.GetNameWithNoTooltip] рветься до влади"
  d009_flavor_religious_orders.2.entry: "Великий магістр рветься до влади"
  d009_flavor_religious_orders.2.desc: "За останні роки [target_character.GetName] помітно [Select_CString(target_character.IsFemale, 'примножила', 'примножив')] свій вплив і багатство. Для очільни[Select_CString(target_character.IsFemale, 'ці', 'ка')] #ONCLICK:COUNTRY,[target_order.GetKey] #TOOLTIP:COUNTRY,[target_order.GetKey],X [target_order.Custom('CL_GEN')|L]#!#! таке збагачення анітрохи не дивне, втім, занепокоєння викликає те, що [Select_CString(target_character.IsFemale, 'вона також почала', 'він також почав')] виявляти цікавість до столичної політики. Хоча [target_character.GetNameWithNoTooltip] ще зовсім недавно [Select_CString(target_character.IsFemale, 'була фавориткою', 'був фаворитом')], тепер [Select_CString(target_character.IsFemale, 'вона', 'він')] раз у раз картає уряд, і навіть [Select_CString(target_ruler.IsFemale, 'сама', 'сам')] [target_ruler.GetNameWithNoTooltip] не уникає [Select_CString(target_character.IsFemale, 'її', 'його')] гострих зауваг. Через це численн[ROOT.GetCountry.Custom('nobles_yiaei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l] заклика[ROOT.GetCountry.Custom('nobles_yeyut')] позбавити [Select_CString(target_character.IsFemale, 'її', 'його')] титулу великого магістра."
  d009_flavor_religious_orders.2.a: "[Select_CString(target_character.IsFemale, 'Вона', 'Він')] просто дбає про [ROOT.GetCountry.Custom('CL_ACC')]."
  d009_flavor_religious_orders.2.a.entry: "Він просто дбає про нашу країну."
  d009_flavor_religious_orders.2.b: "[Select_CString(target_character.IsFemale, 'Вона', 'Він')] явно [Select_CString(target_character.IsFemale, 'переступила', 'переступив')] межу."
  d009_flavor_religious_orders.2.b.entry: "Він явно переступив межу."
  d009_flavor_religious_orders.3.title: "Опальний магістр"
  d009_flavor_religious_orders.3.entry: "$d009_flavor_religious_orders.3.title$"
  d009_flavor_religious_orders.3.desc: "Через свої політичні зазіхання [target_character.GetName] [Select_CString(target_character.IsFemale, 'накликала', 'накликав')] на себе гнів усього #L [ROOT.GetCountry.GetAdjective|l]ого#! двору. Останньою краплею стала [Select_CString(target_character.IsFemale, 'її', 'його')] відкрита критика [Select_CString(target_ruler.IsFemale, 'нашої правительки', 'нашого правителя')], через яку [Select_CString(target_character.IsFemale, 'вона не лише втратила становище фаворитки', 'він не лише втратив становище фаворита')], а й [Select_CString(target_character.IsFemale, 'позбулася', 'позбувся')] підтримки своїх прибічників. Тепер і [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], і [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], і навіть [Select_CString(target_ruler.IsFemale, 'сама', 'сам')] [ROOT.GetCountry.GetGovernment.GetRulerTitle] [target_ruler.GetName] вважають [Select_CString(target_character.IsFemale, 'її', 'его')] своїм особистим ворогом. За таких умов [Select_CString(target_character.IsFemale, 'вона', 'він')] більше не може обіймати посаду великого магістра #ONCLICK:COUNTRY,[target_order.GetKey] #TOOLTIP:COUNTRY,[target_order.GetKey],X [target_order.Custom('CL_GEN')|L]#!#!."
  d009_flavor_religious_orders.3.a: "Стратити [Select_CString(target_character.IsFemale, 'її', 'його')] за зраду!"
  d009_flavor_religious_orders.3.a.entry: "Стратити його за зраду!"
  d009_flavor_religious_orders.3.b: "Вигнати [Select_CString(target_character.IsFemale, 'її', 'його')] та призначити нового очільника ордену."
  d009_flavor_religious_orders.3.b.entry: "Вигнати його та призначити нового очільника ордену."