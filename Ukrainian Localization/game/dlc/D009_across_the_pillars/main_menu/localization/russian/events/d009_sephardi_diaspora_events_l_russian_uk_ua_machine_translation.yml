l_russian:
  d009_crypto_jewish_exodus_tt: "Навернені в #TOOLTIP:RELIGION,$catholic_tt$,X #L католицтво#!#! вихідці з криптоюдейських громад потай навертаються до колишньої віри та залишають країну; їхнє місце призначення — [d009_exodus_destination.GetName]"
  d009_sephardi_diaspora.1.title: "Прибуття вигнанців"
  d009_sephardi_diaspora.1.entry: "$d009_sephardi_diaspora.1.title$"
  d009_sephardi_diaspora.1.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle|U] нашої країни дізнається, що [origin_country.GetNameWithNoTooltip] вигна[origin_country.Custom('end_vlaloly')] своїх #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейських#!#! підданих, і тепер чимало з них чекають у наших портах, маючи при собі лише вбогі пожитки. Наш[ROOT.GetCountry.Custom('burghers_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] вважа[ROOT.GetCountry.Custom('burghers_yeyut')] такий перебіг подій вельми вдалим: серед вигнанців є вправні майстри та люди зі статками. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|U] ж бач[ROOT.GetCountry.Custom('clergy_ytat')] лише натовп чужинців, чию вірність та побожність іще належить перевірити. Важливо пам’ятати: вигнанці ніколи не забудуть, як ми вирішимо вчинити з ними."
  d009_sephardi_diaspora.1.a: "Офіційно приймемо їх."
  d009_sephardi_diaspora.1.b: "Дозволимо їм оселитися лише в певних містах."
  d009_sephardi_diaspora.1.historical_info: "Подейкують, султан Баязид II зазначив, що, вигнавши юдеїв, Фердинанд Арагонський знедолив власну країну та збагатив Османську імперію. Він наказав намісникам у провінціях приймати вигнанців і не відмовляти їм у прихистку. У наступні десятиліття на османських Балканах та в Анатолії оселилися десятки тисяч утікачів. Вони привезли з собою друкарські верстати та знаряддя ткацьких промислів й налагодили нові торгові зв’язки, що помітно посприяло процвітанню османських міст, передусім Фессалонік та Константинополя."
  d009_sephardi_diaspora.2.title: "Юдаїзм у Фессалоніках"
  d009_sephardi_diaspora.2.entry: "$d009_sephardi_diaspora.2.title$"
  d009_sephardi_diaspora.2.desc: "За роки, що минули від прибуття перших вигнанців, #TOOLTIP:LOCATION,thessaloniki,X #L Фессалоніки#!#! вельми змінилися. Життя міських портів, майстерень і ринків підлаштувалося під юдейський календар: тут немає нічого важливішого за Шабат, а #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейська#!#! громада чисельністю перевершила все інше населення міста. Навіть наші чиновники почали звикати до нового порядку — від нього надто багато залежить у міській торгівлі."
  d009_sephardi_diaspora.2.a: "Нехай місто зберігає свій уклад."
  d009_sephardi_diaspora.2.historical_info: "До середини XVI століття юдеї-сефарди складали більшість населення Фессалонік. Серед юдейських громад Європи та Середземномор’я місто зажило слави як осередок сефардської вченості, книгодрукування та суконних промислів, зокрема вовняних тканин для османського військового однострою. Юдейсько-іспанська мова (ладіно) лишалася однією з основних мов на вулицях і ринках міста аж до XX століття."
  d009_thessaloniki_has_sephardi_pops_tt: "[ShowLocationNameWithNoTooltip('thessaloniki')] — місце проживання сефардських [Concept('pops', 'громад')|e]"
  d009_sephardi_diaspora.3.title: "Гетто [ROOT.GetCountry.Custom('preposition_uv')] [ROOT.GetCountry.Custom('CL_PREP')]"
  d009_sephardi_diaspora.3.entry: "Гетто"
  d009_sephardi_diaspora.3.desc: "Наш сенат пропонує переселити #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейську#!#! громаду міста [ROOT.GetCapital.GetName] на обнесений мурами острів. Уночі його браму замикатимуть, удень — охоронятимуть, а жителям дозволять залишати острів лише за суворих умов. Прибічники такого підходу вважають його розумним компромісом між вигнанням і дозволом для юдеїв селитися так, як їм заманеться. Юдейські ж купці та лихварі, на чиї позики здавна покладається [ROOT.GetCapital.GetNameWithNoTooltip], відгукуються про цей захід у зовсім інших висловах."
  d009_sephardi_diaspora.3.a: "Заснуємо гетто."
  d009_sephardi_diaspora.3.b: "Не піддаватимемося тиску і не обмежуватимемо громаду."
  d009_sephardi_diaspora.3.historical_info: "Венеція заснувала юдейське гетто в 1516 році, обмеживши місце проживання громади кварталом Ghetto Nuovo в районі Каннареджо, який замикали й охороняли ночами. Саме слово #italic гетто#! походить від назви цього кварталу, що, як припускають, сходить до венеційського слова #italic geto#!, яким називали міделиварню, розташовану тут раніше. Протягом наступного століття звичай створювати відгороджені за розпорядженням влади юдейські квартали поширився і на інші міста Італії."
  d009_venice_has_jewish_pops_tt: "[ShowLocationNameWithNoTooltip('venice')] — місце проживання юдейських [Concept('pops', 'громад')|e]"
  d009_sephardi_diaspora.4.title: "[target_character.GetNameWithNoTooltip] та Біблія Феррари"
  d009_sephardi_diaspora.4.entry: "Донья Грасія Мендес та Біблія Феррари"
  d009_sephardi_diaspora.4.desc: "У Феррарі оселилася заможна #L [GetCountry('POR').GetAdjective|l]а#! вдова [target_character.GetName], відома не тільки своїми статками, а й неабиякою хоробрістю. Тут вона вперше змогла відкрито жити так, як жила раніше потайки, — як заможна юдейка, вірна своїй вірі. Вона з власних заощаджень оплачує переклади Святого Письма на ладіно для конверсо, які не знають івриту, і таємно підтримує мережу зв’язкових та сховищ, що охоплює навіть [GetCountry('POR').Custom('CL_ACC')]. Вона готова допомогти втекти кожному, хто забажає наслідувати її приклад."
  d009_sephardi_diaspora.4.a: "Підтримаємо її працю."
  d009_sephardi_diaspora.4.b: "Обмежимо її діяльність."
  d009_sephardi_diaspora.4.historical_info: "Донья Грасія Мендес Насі (уроджена Беатріс де Луна, народилася в Лісабоні близько 1510 року) вважається власницею одних із найбільших статків серед купців-конверсо XVI століття. Переїхавши до Антверпена, а згодом до Феррари, Грасія почала відкрито сповідувати юдаїзм. Завдяки своєму багатству та зв’язкам вона профінансувала видання Феррарської Біблії 1553 року — перекладу Біблії на ладіно для охрещених юдеїв, які втратили вільне володіння івритом. Окрім того, Грасія грошима підтримувала облаштування шляхів утечі для португальських нових християн, які рятувалися від інквізиції."
  d009_sephardi_diaspora.5.title: "[target_character.GetNameWithNoTooltip] та переселення до Цфата"
  d009_sephardi_diaspora.5.entry: "Дон Йосиф Насі та заселення Цфата"
  d009_sephardi_diaspora.5.desc: "Фінансист #L [GetCountry('POR').GetAdjective|l]ого#! походження [target_character.GetName], до [Select_CString(target_character.IsFemale, 'якої', 'якого')] вельми прихильний наш [ROOT.GetCountry.GetGovernment.GetRulerTitle|l], просить передати [Select_CString(target_character.IsFemale, 'їй', 'йому')] [ShowLocationName('safed')] та навколишні землі. [Select_CString(target_character.IsFemale, 'Вона має намір', 'Він має намір')] заселити їх своїми земляками-вигнанцями й заснувати там не лише навчальний заклад для вивчення #TOOLTIP:RELIGION,$judaism_tt$,X #L юдаїзму#!#!, а й шовкове виробництво, підпорядковане виключно нашій короні. Задуми [Select_CString(target_character.IsFemale, 'у неї', 'в нього')] вочевидь величні, а статки, як зазначає скарбник, під стать бажанням."
  d009_sephardi_diaspora.5.a: "Надамо [Select_CString(target_character.IsFemale, 'їй', 'йому')] дозвіл."
  d009_sephardi_diaspora.5.a.entry: "Дозволимо дону Йосифу Насі влаштувати переселення."
  d009_sephardi_diaspora.5.b: "Відмовимося."
  d009_sephardi_diaspora.5.historical_info: "Дон Йосиф Насі, племінник і зять доньї Грасії, став одним із найдовіреніших радників султана Сулеймана Пишного. У 1560-х роках йому передали у володіння Тиверіаду та навколишні села, маючи на меті відродити місто як осередок розселення юдеїв та виробництва шовку. І хоча за життя дон Йосиф Насі досяг доволі скромних успіхів на цій ниві, його задум часто розглядають як одну з найраніших спроб переселити юдеїв до цього краю."
  d009_sephardi_diaspora.6.title: "«Ліворніна»"
  d009_sephardi_diaspora.6.entry: "$d009_sephardi_diaspora.6.title$"
  d009_sephardi_diaspora.6.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle|U] нашої країни укладає грамоту — так звану «Ліворніну», яка відкриє Ліворно для купців з-поміж #TOOLTIP:RELIGION,$judaism_tt$,X #L юдеїв#!#! та конверсо. Їм обіцяють чи не найщедріші умови в усіх християнських країнах: свободу віросповідання, звільнення від обов’язку носити розпізнавальний знак, а також право торгувати нарівні з нашими підданими. Старі купецькі родини Ліворно не надто раді такій щедрості: їм доведеться зважати на суперництво."
  d009_sephardi_diaspora.6.a: "Видамо «Ліворніну»."
  d009_sephardi_diaspora.6.b: "Обмежимо права юдеїв на оселення."
  d009_sephardi_diaspora.6.historical_info: "У 1593 році Фердинандо I Медічі видав «Ліворніну», запропонувавши юдейським і наверненим до християнства купцям украй вигідні умови: звільнення від обов’язку носити розпізнавальний знак, свободу віросповідання та рівні з християнськими купцями права — і все це задля того, щоб перетворити Ліворно на великий торговий порт. Хартія виявилася напрочуд дієвою, і згодом юдейська громада Ліворно стала однією з найбільш процвітаючих та найменш гноблених громад Італії раннього Нового часу."
  variable_d009_sephardi_diaspora_6_fired_tt: "Видано «Ліворніну»"
  d009_country_has_sephardi_pops_tt: "Наші землі — місце проживання сефардських [Concept('pops', 'громад')|e]"
  d009_sephardi_diaspora.7.title: "[GetCountry('POR').GetAdjectiveWithNoTooltip]а нація Амстердама"
  d009_sephardi_diaspora.7.entry: "$d009_sephardi_diaspora.7.title$"
  d009_sephardi_diaspora.7.desc: "Уже кілька років поспіль купці з [GetCountry('POR').Custom('CL_GEN')], які називають себе просто португальською нацією, оселяються в #TOOLTIP:LOCATION,amsterdam,X #L Амстердамі#!#!. Тут вони тримаються осібно і свої обряди справляють за зачиненими дверима. Наш[ROOT.GetCountry.Custom('burghers_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] чудово розумі[ROOT.GetCountry.Custom('burghers_yeyut')] те, про що не заведено говорити вголос: багато хто з цих купців — юдеї, і, схоже, ніколи не переставали сповідувати свою віру. А статки, які вони привозять із собою, вельми значні."
  d009_sephardi_diaspora.7.a: "Надамо їм свободу віросповідання."
  d009_sephardi_diaspora.7.b: "І надалі дотримуватимемося старих обмежень."
  d009_sephardi_diaspora.7.historical_info: "Португальські хрещені юдеї, які називали себе португальською нацією, почали оселятися в Амстердамі в 1590-х роках. Вони відкрито поверталися до сповідування юдаїзму після того, як влада Нідерландів стала терпиміше ставитися до їхньої віри, хоча повне правове визнання прийшло лише з часом. До середини XVII століття сефардська громада Амстердама стала однією з найбагатших і найвпливовіших юдейських громад Європи. Тут діяла Португальська синагога і розвивалися друкарські промисли, завдяки чому місто перетворилося на значний осередок видання книг на івриті та ладіно."
  variable_d009_amsterdam_jewish_nation_tt: "Юдейська португальська нація домоглася визнання в #TOOLTIP:LOCATION,amsterdam,X #L Амстердамі#!#!"
  d009_sephardi_diaspora.8.title: "Бразильці-сефарди тікають до Нового Амстердама"
  d009_sephardi_diaspora.8.entry: "$d009_sephardi_diaspora.8.title$"
  d009_sephardi_diaspora.8.desc: "Завоювання #L [GetCountry('POR').GetAdjective|l]им#! військом наших заокеанських колоній ось-ось завершиться, і #TOOLTIP:CULTURE,$sephardi_tt$,X #L сефардським#!#! купецьким родинам, які довгі роки жили там під нашим стягом, залишиться одне: шукати кращої долі в інших наших колоніях. Дехто вже вирушив і збирається оселитися довкола гирла Північної річки в надії, що свободи, якими вони втішалися в #TOOLTIP:LOCATION,amsterdam,X #L Амстердамі#!#!, збережуться й у нових краях."
  d009_sephardi_diaspora.8.a: "Приймемо їх до колонії."
  d009_sephardi_diaspora.8.b: "Дозволимо їм селитися лише в Європі."
  d009_sephardi_diaspora.8.historical_info: "Після того як у 1654 році Португалія силою повернула собі голландську Бразилію, група з 23 юдеїв-сефардів утекла морем на північ і оселилася в Новому Амстердамі. Вони стали першими юдейськими поселенцями в місті, яке згодом дістало назву Нью-Йорк. Генерал-губернатор Пітер Стейвесант спочатку наказав їх вигнати, але його розпорядження скасувала Голландська Вест-Індійська компанія, у раді директорів якої були юдейські пайовики. Завдяки їхньому рішенню ця крихітна громада з часом зросла в одну з найбільших юдейських спільнот у світі."