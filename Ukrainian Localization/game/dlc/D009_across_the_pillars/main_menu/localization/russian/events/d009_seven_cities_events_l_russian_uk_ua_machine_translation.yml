l_russian:
  seven_cities.10.title: "Сяйливий град удалині"
  seven_cities.10.desc: "Коли на столі з’являються вино та крам, місцеві провідники стають говіркішими. Так, про країну, про яку розпитує [target_leader.GetName], вони щось чули. Так, за наступним хребтом є місто — до нього, кажуть, ще десь зо два тижні ходи. Один клянеться, що здалеку бачив, як сонце сходить над його стінами, що виблискують золотом. Інший запевняє, що його дядько торгував там цілий сезон і повернувся з неабияким багатством. Третій пирхає: це все казки, а перші двоє готові наговорити будь-чого за кухоль бренді. Хроніст занотовує кожне слово."
  seven_cities.10.a: "Наллємо бренді тим, чиї розповіді будуть найцікавішими."
  seven_cities.10.b: "Попрощаймося й рушаймо далі."
  seven_cities.10.b.tt: "#italic Ми прощаємося з оповідачами й вирушаємо в путь. Ногам ми довіряємо більше, ніж побрехенькам#!"
  seven_cities.10.historical_info: "Перші іспанські, французькі та англійські #italic ентрадас#! (виправи) в Америці майже цілком покладалися на географічні відомості, отримані від місцевих жителів. Але ті нерідко казали лише те, що, на їхню думку, хотіли почути чужинці, а часом і зовсім намагалися змусити непроханих гостей піти геть. При цьому самі європейці прибували до Нового Світу, сподіваючись знайти тут незліченні багатства. Так виникало зачароване коло: учасники виправ шукали підтвердження легендам про золоті міста, а місцеві жителі, підлаштовуючись під їхні очікування, підтримували ці міфи."
  natives_provide_crudely_drawn_map_tt: "#Y Місцеві жителі дають нам примітивну мапу навколишніх земель#!"
  expedition_learns_of_potential_dangers: "#Y Учасники [Concept('expedition', 'виправи')|e] дізнаються про можливі небезпеки#!"
  bonding_over_alcohol_locals_migrate_tt: "#Y Завдяки спільній пристрасті до хмільного та щирій розмові виникли братерські узи#!"
  improve_root_culture_view_of_location_dominant_culture_tt: "Наше [Concept('cultural_opinion', 'ставлення')|e] до #L [target_location.GetDominantCulture.GetName|l]ої#! культури поліпшиться"
  expedition_observes_local_innovations: "#Y Ми спостерігаємо й описуємо місцеві новації#!"
  expedition_receives_artifacts_as_gifts: "#Y Після повернення до #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.GetKey],X [ROOT.GetCountry.GetCapital.Custom('CL_ACC')|L]#!#! ми піднесемо дари — культурні артефакти#!"
  should_calamity_occur_chance_to_avoid_tt: "Місцеві розбійники та дикі звірі будуть менш небезпечними"
  may_bring_us_closer_to_uncovering_goal_tt: "Ми можемо опинитися на крок ближче до шуканого"
  expedition_brought_back_riches_tt: "Учасники [Concept('expedition', 'виправи')|e] повернулися з багатствами:"
  expedition_brought_back_exotic_goods_tt: "Носії [Concept('expedition', 'виправи')|e] повернулися з дивовижним крамом:"
  expedition_brought_back_artifacts_tt: "Учасники [Concept('expedition', 'виправи')|e] повернулися з дарунками й артефактами:"
  expedition_healer_joins_court_tt: "Після повернення учасників [Concept('expedition', 'виправи')|e] до нашого двору приєднується цілитель-туземець"
  porters_guides_prevent_stalling: "Носії та провідники, які супроводжують учасників [Concept('expedition', 'виправи')|e], не дають їй затриматися"
  warned_expedition_avoids_calamity_tt: "Попереджені про місцеві небезпеки учасники [Concept('expedition', 'виправи')|e] уникають лиха"
  seven_cities.11.title: "Вітальний бенкет"
  seven_cities.11.desc: "[target_location.GetRank.GetName|U] виявилося готовим зустрічати нас ще до того, як ми встигли розбити табір: лунає барабанний бій, майдан виметений начисто, а на розстеленій рогожі — стільки харчів, скільки ми не бачили за цілий місяць походу. Вождь вітає нас урочисто та чемно, немовби [target_leader.GetName] — рівня йому; перш ніж хтось устигає поставити бодай одне запитання, бенкет уже вирує на повну. Наші перекладачі стиха попереджають: такий теплий прийом навряд чи буде безкорисливим. Щедре частування сьогодні можуть пригадати вже завтра й зажадати якоїсь послуги натомість. Проте гостинність і стіл, що вгинається від наїдків, нерідко розв’язують язики краще за будь-які погрози."
  seven_cities.11.a: "Наші обійми — і гаманці — завжди відкриті для щедрих господарів."
  seven_cities.11.b: "Ми не для того перетнули океан, щоб набивати тут черево."
  seven_cities.11.b.tt: "#italic Ми приймаємо частування, але тримаємо гаманці закритими й вирушаємо в дорогу, доки гостинність не обернулася боргом#!"
  seven_cities.11.historical_info: "Відносини корінних жителів Америки з європейцями багато в чому трималися на церемоніальній гостинності: прибулих нерідко зустрічали бенкетами, дарунками й урочистим прийомом ще до початку будь-яких перемовин. Пуебло надавали людям Коронадо прихисток і стіл у своїх поселеннях уздовж Ріо-Гранде, а загін де Сото зупинявся у вождів міссісіпських народів на південному сході. В обох випадках така гостинність аж ніяк не означала покору, а допомагала тримати небезпечних чужинців у шорах. Європейці брали із собою скляне намисто, соколині бубонці, тканини та ножі, щоби мінятися ними з тубільцями під час таких зустрічей. Подарунки допомагали прихилити до себе співрозмовників і здобути потрібні відомості, але зміст того, що відбувалося, кожна сторона розуміла по-своєму."
  expedition_receives_guides_and_porters: "#Y У виправі братимуть участь провідники та носії#!"
  expedition_less_likely_to_stall_tt: "Ймовірність затримки [Concept('expedition', 'виправи')|e] знижується"
  expedition_receives_exotic_goods: "#Y Учасники [Concept('expedition', 'виправи')|e] вимінюють у місцевих екзотичний крам, який привезуть додому#!"
  seven_cities.12.title: "Завзятий провідник"
  seven_cities.12.desc: "Він знаходить нас першим — худорлявий усміхнений чоловік, який трохи говорить, здається, усіма мовами, поширеними в цих краях. Притиснувши руку до серця, він клянеться, що на власні очі бачив браму золотого міста. Він ладен провести нас туди і просить лише плату за послуги провідника та дещицю пошани. [target_leader.GetName] слухає його насторожено: ми вже чули подібні запевнення — нехай в інших місцях і від інших людей, але слова були ті самі. Проте загін, схоже, уже все вирішив, і очі в людей горять анітрохи не менш палко, ніж у самого провідника."
  seven_cities.12.a: "Уперед, до багатства та слави!"
  seven_cities.12.b: "Геть звідси, жебраку!"
  seven_cities.12.b.tt: "#italic Ми проганяємо усміхненого провідника та продовжуємо йти стежкою, яку поки розбираємо самі#!"
  seven_cities.12.historical_info: "Найсумновідоміший провідник з-поміж усіх, кого наймали #italic ентради#! до Північної Америки, — індіанський бранець, якого іспанці прозвали Ель Турко. Він розповів виправі Коронадо про Ківіру — царство далеко на північному сході, де буцімто все зроблено із золота. Кілька тижнів він вів загін усе далі вглиб Великих рівнин, а згодом на допиті зізнався, що зумисне заводив іспанців у степ, сподіваючись, що там загинуть і люди, і коні. Коли виправа нарешті дісталася Ківіри, замість золотого царства вона побачила лише кілька поселень вічита із земляними хатинами — і жодного сліду золота. Ель Турко стратили. Цей випадок був далеко не єдиним: у місцевих провідників були власні причини заводити озброєних чужинців якнайдалі, і ці причини далеко не завжди збігалися з цілями виправи."
  expedition_uncovers_riches_in_new_waypoint: "#Y Вказана провідником стежка приводить до справжніх багатств#!"
  expedition_led_to_deathly_trap: "#Y Провідник заводить нас у засідку, і учасники [Concept('expedition', 'виправи')|e] гинуть#!"
  guide_lied_waste_of_time: "#Y Провідник водить нас колами: золоте місто — це вигадка#!"
  target_character_flogged_tt: "Провідника, який збрехав, висічено за обман"
  seven_cities.13.title: "Знайома мова"
  seven_cities.13.desc: "У цьому поході [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'змінилася', 'змінився')] майже до невпізнання. Якщо раніше [Select_CString(target_leader.IsFemale, 'її', 'його')] думки були зайняті лише містом, що чекає попереду, то тепер у них знайшлося місце й місцевим жителям: їхній мові, уже почасти вивченій; їхній гостинності; їхньому осілому укладу, настільки спокусливому — аби лише скінчилися мандри… Цього ранку [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'заявила', 'заявив')]: нехай решта йде вперед, якщо бажає; [Select_CString(target_leader.IsFemale, 'вона', 'він')] же залишається тут. Інших дика природа губить по-своєму: вона стає неймовірно привабливою."
  seven_cities.13.a: "Тоді нехай залишається, а разом із [Select_CString(target_leader.IsFemale, 'нею', 'ним')] помре мрія."
  seven_cities.13.historical_info: "Європейці, які пережили кораблетрощу чи полон і прожили довгі роки серед місцевих народів, особливо цінувалися наступними виправами як перекладачі та провідники. Така доля, наприклад, спіткала Хуана Ортіса — одного з небагатьох уцілілих учасників виправи Нарваеса: він прожив у полоні флоридського племені узіта близько 11 років, а потім служив перекладачем при де Сото й залишався з ним до самої його смерти. Інша доля чекала на Гонсало Ґерреро: 1511 року він зазнав кораблетрощі біля берегів Юкатану, одружився з жінкою з народу мая, відмовився повертатися на батьківщину і, згідно зі свідченнями, загинув у бою з іспанцями. Такі люди ставали живими ланками між двома світами — Старим і Новим, але не завжди вони зберігали вірність своєму рідному світові."
  seven_cities.14.title: "Джерело вічної молодости?"
  seven_cities.14.desc: "З третіх вуст до нас доходить звістка, яка з кожним переказом стає дедалі дивовижнішою. Подейкують, десь на пагорбах далі за шляхом є джерело, вода з якого гоїть старі рани, випростує згорблені спини та навіть повертає людині літа, забрані походом. Місцеві розповідають про цю чудодійну воду з такою шаною, з якою в нас зазвичай говорять про святі місця. Чи це й справді диво, чи вони просто намагаються нас ошукати. Лікар закочує очі та бурмоче щось про болотяну лихоманку, а половина табору вже наповнює бурдюки."
  seven_cities.14.a: "Оглянемо джерело."
  seven_cities.14.b: "Нам ніколи хлюпатися!"
  seven_cities.14.b.tt: "#italic Ми проходимо повз «чудодійне» джерело: нехай його води зцілюють довірливих#!"
  seven_cities.14.historical_info: "Легенда про джерело вічної молодости — один із численних міфів, які європейці привезли із собою до Америки. З часом її поширення почали пов’язувати з виправою Хуана Понсе де Леона до Флориди в 1513 році. Проте розповіді про те, буцімто він навмисне вирушив туди на пошуки чудодійної води, ймовірно, розпускали політичні супротивники де Леона. Сама легенда сягає прадавніх європейських міфів про цілющі джерела, здатні повертати сили та продовжувати життя, — і чимало людей вірили в їхнє існування. Корінні жителі Карибського басейну та південного сходу Америки справді показували європейцям священні та цілющі джерела, важливі для їхніх обрядів і вірувань, але їхні оповіді геть не відповідали сподіванням прибульців."
  spend_some_time_recovering: "#Y Люди відпочивають і ненадовго занурюються у воду#!"
  retrieve_some_rejuvenating_water: "#Y Загін наповнює бурдюки дивовижною водою#!"
  just_water_hole: "#Y Дивовижне джерело виявилося цілком звичайним…#!"
  seven_cities.15.title: "Блиск у річці"
  seven_cities.15.desc: "На заході сонця хтось із загону, присівши на березі струмка, промиває ґрунт через лоток, як учили бувалі гірники. Кілька хвилин праці — і він вибухає сміхом упереміш із лайкою: в намулі виблискує [target_material.GetName|l]! Нехай усього одна крупинка, але це все ж означає, що вище за течією цінної здобичі може виявитися більше. Однак чи справді це той самий скарб, заради якого ми перетнули материк, чи то просто блиск піску засліпив очі захланному дурневі, нині ніхто сказати не може, та й не хоче."
  seven_cities.15.a: "Кожному до рук по лотку — і до річки!"
  seven_cities.15.b: "Та це ж просто ошуканське золото!"
  seven_cities.15.historical_info: "З 20-х років XVI століття переказ про #italic Сьєрра-де-ла-Плата#! — Срібну гору — дедалі частіше вабив іспанські та португальські виправи вглиб басейну Ріо-де-ла-Плата. Саме від назви міфічної гори отримала своє ім’я річка, а згодом — і країна. Переказ цей виник не на порожньому місці: в Андах, насамперед у Потосі, справді таїлися величезні поклади срібла. Відкриття тут у 1545 році срібного рудника перевернуло все світове господарство. Утім, учасники перших виправ, що просувалися вгору річкою, знаходили що завгодно, тільки не срібло: злигодні, біди, пошесті й навіть смерть. Легендарна гора, здавалося, була недосяжною, і часто єдиним свідченням її існування ставала лишень жменька металу, намитого з річкового річища."
  expedition_brings_back_valuable_materials: "#Y Цінну руду видобуто та відправлено на ринок #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.GetKey],X [ROOT.GetCountry.GetCapital.Custom('CL_GEN')|L]#!#!#!"
  study_their_technique: "#Y Ми опановуємо нові способи видобутку; розбудова копалень стає дешевшою, а наші найкращі поклади багатіють#!"
  men_are_met_by_hunger_and_false_legends: "#Y Річки живлять нас лише марними сподіваннями#!"
  expedition_outcome_severely_hindered_tt: "Ми втрачаємо одну із зачіпок, за яку так боролися"
  hunt_for_precious_metals_target_mining_location_goes_cold_tt: "#italic Ми припиняємо пошуки металу та йдемо далі#!"
  seven_cities.16.title: "Гостинний вождь"
  seven_cities.16.desc: "[target_location.GetRank.GetName|U] вражає нас своїми розмірами та охайністю. Місцевий вождь приймає нас насторожено, проте чемно, причому ця чемність явно дається йому нелегко. Його комори вгинаються від припасів, а тутешня молодь знає стежки, що ведуть углиб суходолу, як свої п’ять пальців. Але найголовніше: вождь напевно спробує випровадити нас до ранку. Наші офіцери оглядають комори та міцних юнаків — можливих майбутніх провідників і носіїв. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити, чи варто спробувати порозумітися, чи краще забрати все потрібне силою, а за наслідки нехай відповідає той, хто прийде сюди після нас."
  seven_cities.16.a: "Схопимо вождя і поженемо його людей перед собою, погрожуючи їм списами."
  seven_cities.16.b: "Домовимося, щоб до нас приєдналися носії-добровольці, та розійдемося по-дружньому."
  seven_cities.16.c: "Не будемо їм дошкуляти. Згорнемо табір і рушимо далі."
  seven_cities.16.c.tt: "#italic Ми даємо вождю спокій і йдемо далі, не взявши з собою ні заручників, ні носіїв#!"
  the_captive_chief_yields_guides: "#Y Полонений вождь дає нам провідників, які знають стежки вглиб суходолу#!"
  the_chiefs_hall_is_plundered: "#Y Перш ніж вирушити далі, ми виносимо всі розкоші з покоїв вождя#!"
  the_village_empties_before_us: "#Y За ніч [target_location.GetRank.GetName] немов розчиняється в лісі — разом із провідниками та рештою жителів#!"
  coerced_locals_resent_us_tt: "Наше [Concept('cultural_opinion', 'ставлення')|e] до #L [target_location.GetDominantCulture.GetName|l]ої#! культури погіршиться"
  seven_cities.16.historical_info: "Мандрувати південним сходом континенту Ернандо де Сото вважав за краще так: увійшовши до нового володіння, його загін брав місцевого #italic касика#! — верховного вождя — в заручники, аби на подальшому переході забезпечити себе харчами, носіями та провідниками. На межі його земель бранця відпускали або обмінювали на сусіднього вождя, після чого все повторювалося. Певний час цей спосіб давав плоди, однак незабаром тубільці зненавиділи де Сото: його люди розоряли громади та руйнували союзи. До того ж ці засоби швидко втрачали дієвість там, де влада була не зосереджена в руках окремих міссісіпських вождів, а розподілена рівномірніше."
  seven_cities.17.title: "Звістка з узбережжя"
  seven_cities.17.desc: "Місцеві жителі, мешканці узбережжя, підпливають до нас на човні ще до того, як якір нашого корабля торкається дна. До полудня вже повним ходом іде обмін: вони охоче вимінюють наш крам на рибу та свіжі плоди. Судячи з того, як у них розв’язалися язики, такі зустрічі для них не дивина. За ніж чи відріз тканини вони ладні розповісти, що криється за узліссям, і навіть показати рукою: вам — туди, вглиб. Проте просто зараз неможливо збагнути, скільки правди в їхніх словах і чи не хочуть вони просто здати нас сусідам."
  seven_cities.17.a: "Влаштуймо обмін, щоб з’ясувати, що криється в глибині материка."
  seven_cities.17.b: "Запишімо цю стоянку до журналу та рушаймо далі."
  seven_cities.17.b.tt: "#italic Ми позначаємо стоянку на мапах і продовжуємо похід, оминаючи плітки.#!"
  the_shore_folk_point_the_way: "#Y Прибережний люд допомагає нам знайти шлях до шуканого!#!"
  the_shore_market_yields_goods: "#Y Після торгів на березі наші трюми наповнюються місцевим крамом!#!"
  the_shore_folk_send_us_at_their_rivals: "#Y Послухавши їх, ми блукаємо колами і зрештою виходимо до селища їхніх ворогів!#!"
  may_bring_us_closer_and_fill_our_holds_tt: "Ми можемо опинитися на крок ближче до шуканого, а водночас наповнити трюми місцевим крамом"
  seven_cities.17.historical_info: "Прибережні народи зазвичай першими зустрічали європейські виправи і ставали для них головним джерелом відомостей про землі в глибині суходолу. Зустрічі Верраццано та Картьє з мешканцями узбережжя Північної Атлантики, перші висадки іспанців у Карибському морі та зносини португальців із жителями Бразилії відбувалися приблизно однаково: обережний обмін, пильне вивчення одне одного, розпитування про те, що лежить далі від берега. Нерідко тубільці радили прибульцям іти вглиб материка — так вони могли позбутися непроханих гостей, а заразом завдати прикрощів своїм суперникам, до яких і спрямовували учасників виправ. Розповідям прибережного люду годі було йняти віри: мало хто щиро прагнув допомагати європейцям."
  seven_cities.18.title: "Сховок у гавані"
  seven_cities.18.desc: "Ця гавань — справжній рай для стомленого та виснаженого моряка: глибока, надійно захищена від негоди й багата на прісну воду, яка збирається біля берега, достатньо широкого, щоб витягти кораблі на суходіл і очистити корпуси від гнилі. Команді потрібен перепочинок не менше, ніж кораблям — лагодження. Втім, не варто надто довго затримуватися на березі: у цих краях ми — чужинці, і тому ризикуємо накликати лихо. [target_leader.GetName] зважує всі «за» і «проти»: чи лишитися на кілька днів, щоб належно полагодити кораблі, чи сподіватися, що корпуси витримають, і вирушити далі, поки знуджена команда не вчинила якоїсь дурниці?"
  seven_cities.18.a: "Витягнемо кораблі на берег і поповнимо запаси харчів."
  seven_cities.18.b: "Перепочинемо одну ніч і рушимо далі."
  seven_cities.18.b.tt: "#italic Ми даємо команді одну ніч відпочинку й виходимо в море, поки кораблі не затягнуло піском.#!"
  the_refit_goes_smoothly: "#Y Лагодження проходить гладко, і кораблі стають повороткішими!#!"
  a_wreck_yields_salvage: "#Y Команди розбирають затонулий на мілководді корабель, забираючи все, що може згодитися!#!"
  the_crew_falls_to_brawling: "#Y Знуджена на березі команда зчиняє бійки, і на наведення ладу йде кілька днів!#!"
  seven_cities.18.historical_info: "Для будь-якої виправи, яка бодай частково йшла морем, мало що мало таку ж вагу, як добра й захищена гавань: тут можна було витягти кораблі на берег, оглянути й полагодити корпуси, набрати прісної води та дров і дати командам перепочити після важкого переходу. Так, флот Магеллана провів п’ять місяців на зимівлі в Пуерто-Сан-Хуліані біля берегів Патагонії. Вимушена стоянка спричинила бунт, який Магеллан придушив із неабиякою жорстокістю. У таких місцях мореплавці нерідко проводили за лагодженням та підготовкою до подальшого походу більше часу, ніж у відкритому морі. Вдало обрана гавань і стосунки з місцевими жителями могли вирішити долю всієї виправи — чи продовжить вона шлях, чи зазнає катастрофи. Тому обрати місце для зупинки часом було не менш важливо, ніж вирішити, куди пливти далі."
  seven_cities.20.title: "Тут нам не прогодуватися"
  seven_cities.20.desc: "Відомості виявилися хибними: ці краї куди посушливіші й безплідніші, ніж нам обіцяли. В’ючні тварини вже не витримують переходу, а люди одинадцятий день животіють на урізаних харчах. Місцеві жителі ховають або спалюють запаси їжі, аби лише не ділитися з нами. Навіть прісна вода тут — велика рідкість: вона є лише в третині долин, які ми перетинаємо. [target_leader.GetName] збирає старшин біля колючого чагарника, що сяк-так захищає від вітру, і питає, скільки ще загін зможе протриматися без поповнення запасів харчів."
  seven_cities.20.a: "Купимо припаси, хоч би скільки вони коштували."
  seven_cities.20.b: "Зупинимося і дамо людям перепочити."
  seven_cities.20.historical_info: "Головною турботою виправ углиб Америки завжди було постачання. Військо Кортеса багато в чому трималося завдяки розпаду ацтекської держави: тлашкальтеки та інші союзники взяли на себе утримання конкістадора. У загону Коронадо на південному заході таких союзників не було, і з просуванням на північ голодна смерть ставала дедалі звичнішим явищем. Така доля спіткала багатьох від Флориди до Патагонії: будь-яка #italic ентрада#!, нездатна здобувати чи купувати харчі по дорозі, рано чи пізно починала втрачати людей просто під час маршу, хоч би скільки золота чекало попереду."
  seven_cities.21.title: "Засідка в каньйоні"
  seven_cities.21.desc: "Загін опинився у вузькій ущелині між двома вапняковими кручами. Дорогу вперед перетято, згори сиплеться злива стріл, попереду чекають воїни з кам’яними палицями, а в’ючні тварини нажахано розбігаються. Наші вояки миттю туляться до схилу і замикають стрій, наїжившись піками. [target_leader.GetName] радиться із сержантами. Слід вирішити: пробиватися крізь ворогів, ризикуючи зазнати втрат, чи спробувати відступити тією самою дорогою, якою ми сюди прийшли, і знайти обхід?"
  seven_cities.21.a: "Пробиватимемося крицею та порохом."
  seven_cities.21.b: "Відступімо й знайдімо інший шлях."
  seven_cities.21.historical_info: "Найдієвішим для корінних народів способом протистояти першим колоніальним #italic ентрадам#! виявилися засідки у зручній для оборони місцевості: вузьких ущелинах, гірських проходах, лісових стежках. Обладунки, вогнепальна зброя та коні робили іспанців непереможними на відкритій місцевості, але зблизька їхні переваги швидко сходили нанівець. Європейці мусили шукати обхідних шляхів — так, близько половини походів Коронадо на південний захід материка пролягало в обхід земель, де його загін наражався б на небезпеку. З тієї ж причини до XVIII століття одна за одною зазнавали невдачі спроби французів та англійців проникнути вглиб Північної Америки."
  seven_cities.22.title: "Стародавні руїни"
  seven_cities.22.desc: "Стежка виводить на вершину хребта, і перед нами відкривається краєвид на покинуте місто. Кам’яні мури ще стоять, але дахи майже повсюди завалилися, а вулиці поросли столітніми деревами. Тут нікого немає — судячи з усього, вже багато років. Дозорці обережно обходять місто довкола, не наважуючись наблизитися. Літописець береться робити замальовки, а священник поринає в роздуми, чи варто ступати на вулиці мертвого міста: кажуть, що ті, хто споганить таке місце, можуть накликати на себе хворобу. [target_leader.GetName] дає малювальникові годину на працю."
  seven_cities.22.a: "Опишімо руїни, перш ніж рушити в дорогу."
  seven_cities.22.historical_info: "Доколумбова Америка була всіяна покинутими поселеннями: на південному сході — міссісіпські кургани, на південному заході — великі споруди пуебло, Чако, басейн Тіуанако в Андах, на півдні — міста мая. Європейські першопрохідці XVI століття, досліджуючи континент, нерідко натрапляли на кам’яні споруди, землеробські тераси та місця для священнодійств, покинуті за багато років (подекуди — більш ніж за століття) до їхнього прибуття. Уже до сорокових років XVI століття в Європі набула поширення думка, що подібні руїни могли бути спадщиною зниклого народу європейського чи середземноморського походження — валлійців, фінікійців або загублених колін Ізраїля. У деяких колах ці уявлення побутували аж до XX століття."
  seven_cities.30.title: "Стежка веде в нікуди"
  seven_cities.30.desc: "Загін дістався місця, де, якщо вірити провідникам, перед нами мала постати омріяна країна… Проте тут нічого немає. Провідники або збрехали, або самі повірили власним вигадкам: огляд довколишніх пагорбів не виявив жодних ознак життя — ані міст, ані диму з димарів, ані доріг, ані найменших людських слідів. [target_leader.GetName] пише короні листа з проханням надати подальші розпорядження, але згодом жмакає і викидає його: коли лист досягне найближчого порту, загін уже сам вирішить, як діяти. Вибір невеликий: або йти далі з надією, що місто вже близько, або розвернутися й вертатися додому з тією дрібкою, що вдалося знайти."
  seven_cities.30.a: "Ми вперто підемо вперед."
  seven_cities.30.b: "Ми розвернемося й надамо чесний звіт."
  seven_cities.30.historical_info: "Невдалі #italic ентради#! рідко завершувалися загибеллю загону в бою. Причини невдач були менш романтичними: запаси вичерпувалися, вивідувачі занедужували або дезертирували, а орієнтири виявлялися або хибно витлумаченими, або просто вигаданими. Зрештою вцілілим ватажкам не залишалося нічого іншого, як розвернутися й вести людей назад безлюдними, як вони тепер уже знали, теренами. Саме так (тією чи іншою мірою) скінчилися виправи Коронадо, Кабрільйо, де Сото та Агірре, який сплавлявся вниз за течією Амазонки. Успішні #italic ентради#!, очільники яких мали настільки ж величні задуми, були настільки рідкісними, що про них згадували ще багато століть поспіль."