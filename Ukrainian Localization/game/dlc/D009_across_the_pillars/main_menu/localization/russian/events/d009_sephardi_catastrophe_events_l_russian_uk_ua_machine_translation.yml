l_russian:
  d009_sephardi_catastrophe.1.title: "Проповідь Фернандо Мартінеса"
  d009_sephardi_catastrophe.1.entry: "$d009_sephardi_catastrophe.1.title$"
  d009_sephardi_catastrophe.1.desc: "Архідиякон [target_character.GetName] уже не перший рік об’їжджає міста #TOOLTIP:AREA,andalusia_area,X #L Андалусії#!#! з проповідями, і щоразу [Select_CString(target_character.IsFemale, 'її', 'його')] промови лунають дедалі підбурливіше. Цьогоріч зібраний [Select_CString(target_character.IsFemale, 'нею', 'ним')] натовп уже не бажає просто слухати: біля #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейських#!#! подвір’їв наших міст збираються озброєні люди, а [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] відкрито ста[ROOT.GetCountry.Custom('clergy_yeyut')] на їхній бік. Безлади на вулицях навряд ли обмежаться самими лише міськими вулицями."
  d009_sephardi_catastrophe.1.a: "Вирядимо варту придушити заворушення."
  d009_sephardi_catastrophe.1.b: "Дозволимо людям виявляти свою волю, але тільки в межах розумного."
  d009_sephardi_catastrophe.1.c: "Підтримаємо людей від імені корони."
  d009_sephardi_catastrophe.1.historical_info: "Фернандо Мартінес, архідиякон Есіхи, довгі роки виголошував проповіді проти юдейської громади Севільї, попри неодноразові накази влади припинити їх. Коли в червні 1391 року йому нарешті вдалося підбурити натовп до насильства, безлади, що забрали тисячі життів, упродовж кількох тижнів перекинулися на Кордову, Толедо, Валенсію, Барселону та інші міста. Це була найбільш руйнівна хвиля насильства проти юдеїв у середньовічній Іберії: вона поклала початок масовому наверненню до християнства, внаслідок якого постала громада нових християн, що через століття зазнала переслідувань з боку інквізиції."
  d009_sephardi_catastrophe.2.title: "Поширення безладдя"
  d009_sephardi_catastrophe.2.entry: "$d009_sephardi_catastrophe.2.title$"
  d009_sephardi_catastrophe.2.desc: "Звістка про насильство, що спалахнуло в #TOOLTIP:AREA,andalusia_area,X #L Андалусії#!#!, швидко рознеслася всією країною. Від міста до міста ширяться одні й ті самі чутки та заклики, і біля #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейських#!#! подвір’їв збираються юрби людей, які ще рік тому й подумати не могли про таке. Старий уклад руйнується на очах. Наші гінці просто не встигнуть рознести накази двору в усі охоплені безумством землі."
  d009_sephardi_catastrophe.2.a: "Нам нічого не залишається, окрім як спостерігати за тим, що діється."
  d009_sephardi_catastrophe.2.historical_info: "Погроми, що почалися влітку 1391 року в Севільї, з разючою швидкістю перекинулися на Кордову, Толедо, Валенсію, Пальму та Барселону всього за кілька тижнів. Багато в чому це сталося тому, що місцеві проповідники й юрби містян сприйняли заворушення в Севільї не як застереження, а як дозвіл діяти. За оцінками сучасників, лише за той рік було вбито або силоміць навернено до християнства десятки тисяч юдеїв. Ця подія назавжди змінила людність і карту віросповідань в Іберії."
  d009_sephardi_catastrophe.3.title: "Богословський диспут у Тортосі"
  d009_sephardi_catastrophe.3.entry: "$d009_sephardi_catastrophe.3.title$"
  d009_sephardi_catastrophe.3.desc: "Рабини #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! уже кілька місяців змушені на заклик самого папи брати участь у прилюдних диспутах у місті [ShowLocationName('tortosa')]. Їм доводиться щодо кожного спірного питання боронити свою віру перед #TOOLTIP:RELIGIONGROUP,christian,X #L християнськими#!#! богословами та колишніми одновірцями, які зреклися #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейства#!#!. Чимало хто не витримує цього випробування, і рабини вже кількох альхам також зреклися своєї віри."
  d009_sephardi_catastrophe.3.a: "Не будемо перешкоджати диспуту."
  d009_sephardi_catastrophe.3.b: "Захистимо наших рабинів від надмірного тиску."
  d009_sephardi_catastrophe.3.b.tt: "#TOOLTIP:RELIGION,$judaism_tt$,X #L Юдейська#!#! громада Тортоси дещо втішена цим кроком"
  d009_sephardi_catastrophe.3.historical_info: "Під час диспуту в Тортосі (1413–1414 роки), скликаного антипапою Бенедиктом XIII, відбулося понад 60 засідань. Рабинів з усього Арагону змушували брати участь у богословських диспутах із Херонімо де Санта-Фе — колишнім юдейським лікарем, який навернувся до християнства й стверджував, ніби сам Талмуд доводить месіанство Ісуса. По завершенні диспуту землями Арагонської корони прокотилася хвиля навернень до християнства та антиюдейських законів."
  d009_sephardi_catastrophe.4.title: "Нова мета інквізиції"
  d009_sephardi_catastrophe.4.entry: "$d009_sephardi_catastrophe.4.title$"
  d009_sephardi_catastrophe.4.desc: "Створений для викорінення єресі трибунал досі не втручався у справи альхам, але тепер усе змінилося. Щодня [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] разом із радою чують чутки про родини нових #TOOLTIP:RELIGIONGROUP,christian,X #L християн#!#!, які відкрито хрестяться, а за зачиненими віконницями запалюють свічки. Інквізитори трибуналу вже чекають на дозвіл перевірити, чим займаються ці сім’ї, коли на вулицях стихає денний гомін."
  d009_sephardi_catastrophe.4.a: "Привернемо увагу трибуналу до охрещених юдеїв."
  d009_sephardi_catastrophe.4.b: "Нехай трибунал займається лише боротьбою з єрессю."
  d009_sephardi_catastrophe.4.historical_info: "Іспанська інквізиція була заснована папською буллою в 1478 році саме для розслідування дій охрещених юдеїв, підозрюваних у таємному сповідуванні юдаїзму. На відміну від давніших середньовічних інквізицій, її початковим завданням був радше нагляд за новонаверненими, аніж боротьба з єрессю серед християн за народженням. Томас де Торквемада, найсумнозвісніший із перших великих інквізиторів, значно розширив розмах таких розслідувань у 1480-х роках."
  variable_iberian_union_active_tt: "Укладено Іберійську унію"
  d009_sephardi_catastrophe.5.title: "Вигнання з [ROOT.GetCountry.Custom('CL_GEN')]"
  d009_sephardi_catastrophe.5.entry: "Вигнання"
  d009_sephardi_catastrophe.5.desc: "Усі сусідні країни, які ще нещодавно терпіли в себе #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейські#!#! громади, за останні роки вирішили покласти край цій терпимості. Тепер на нас тиснуть із вимогами вчинити так само, і заплющувати очі на те, що коїться, більше несила. Хоч яким корисним був для нас старий уклад, годі й надалі залишатися єдиною країною Іберії, про яку юдеї з гордістю кажуть: «[ROOT.GetCountry.GetName] — наш дім»."
  d009_sephardi_catastrophe.5.a: "Видамо указ про вигнання."
  d009_sephardi_catastrophe.5.historical_info: "Наваррська влада вигнала юдеїв з країни в 1498 році, наслідуючи приклад Кастилії та Арагону (1492 рік) лише через рік після Португалії (1497 рік). Багато в чому це відбулося під тиском Фердинанда й Ізабелли після того, як Наварра опинилася під їхнім впливом. Це було одне з останніх окремих вигнань в Іберії. Воно практично позбавило вигнані з Іспанії та Португалії юдейські громади змоги просто переселитися в інші частини Піренейського півострова замість того, щоб назавжди покинути його."
  d009_sephardi_catastrophe.6.title: "Лісабонський погром"
  d009_sephardi_catastrophe.6.entry: "$d009_sephardi_catastrophe.6.title$"
  d009_sephardi_catastrophe.6.desc: "Зібраний у столиці натовп довели до нестями мандрівні ченці — проповідники думки, ніби чумний мор, що вразив #TOOLTIP:LOCATION,lisbon,X #L Лісабон#!#!, є Божою карою за нових християн. Лють натовпу вилилася в кровопролиття. Сотні конверсо — чоловіків, жінок і дітей, що прийняли християнство, — були вбиті. Головні площі та подвір’я вкриті тілами, а [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] спереча[ROOT.GetCountry.Custom('clergy_yetsayutsa')], засудити цю бійню чи благословити її."
  d009_sephardi_catastrophe.6.a: "Накажемо варті придушити заворушення."
  d009_sephardi_catastrophe.6.b: "Не заважатимемо люті юрби."
  d009_sephardi_catastrophe.6.historical_info: "У квітні 1506 року, після того як домініканські ченці звинуватили нових християн у посусі та морі, що вразили місто, стався Лісабонський погром. Він тривав три дні, поки нарешті не втрутилися королівські війська. За різними оцінками, загинуло від двох до понад трьох тисяч душ. Ця різанина настільки стурбувала короля Мануела I, що згодом він видав укази, які формально захищали нових християн від нападів розлюченого люду, хоча підозра до них так і не зникла."
  d009_sephardi_catastrophe.7.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]а інквізиція починає переслідувати конверсо"
  d009_sephardi_catastrophe.7.entry: "Інквізиція починає переслідувати хрещених юдеїв"
  d009_sephardi_catastrophe.7.desc: "[ShowPolicyName('local_courts')|U] нашої країни та трибунал перші кілька років свого існування відали звичайними питаннями віри. Проте інквізитори дедалі більше невдоволені тим, що родини нових #TOOLTIP:RELIGIONGROUP,christian,X #L християн#!#! у таких містах, як [ShowLocationName('lisbon')], [ShowLocationName('porto')] та [ShowLocationName('evora')], лишаються поза їхньою увагою. Від нас у вельми недвозначних виразах вимагають дозволу перевіряти, які саме обряди ці родини справляють у себе вдома."
  d009_sephardi_catastrophe.7.a: "Доручимо трибуналу нагляд за хрещеними юдеями."
  d009_sephardi_catastrophe.7.b: "Обмежимо повноваження трибуналу справами про явну єресь."
  d009_sephardi_catastrophe.7.historical_info: "Португальська інквізиція була офіційно заснована в 1536 році, через кілька десятиліть після іспанської. Спочатку вона діяла обережно щодо хрещених юдеїв, остерігаючись господарських збитків, які могли спричинити переслідування. Проте це тривало недовго: вже до середини XVI століття трибунали в Лісабоні, Коїмбрі та Еворі вели масштабні суди проти нових християн, підозрюваних у таємному сповідуванні юдаїзму, що викликало нову хвилю втеч до Амстердама, Італії та Османської імперії."
  d009_sephardi_catastrophe.8.title: "Аутодафе"
  d009_sephardi_catastrophe.8.entry: "$d009_sephardi_catastrophe.8.title$"
  d009_sephardi_catastrophe.8.desc: "На міській площі знову відбулося аутодафе (auto-da-fé — «акт віри»): грішників, що каються, у жовтих санбеніто провели перед юрбою, яка чекала на це видовище не менше, ніж на будь-яке інше свято. Чи справді це священнодійство викорінює єресь, чи лише тримає в страху родини, які полишили колишню віру кілька поколінь тому, — мало хто з присутніх замислювався над цим."
  d009_sephardi_catastrophe.8.a: "Не перешкоджатимемо праці трибуналу."
  d009_sephardi_catastrophe.8.historical_info: "Аутодафе (порт. і ісп. auto-da-fé — «акт віри») було прилюдним обрядом оголошення вироків інквізиції. Засуджених, часто вбраних у спеціальний жовтий одяг (санбеніто), проводили перед зібраним людом, після чого піддавали покаранню: від каяття до спалення на вогнищі. Ці обряди збирали величезні натовпи глядачів і століттями залишалися невіддільною частиною суспільного життя Іберії, поєднуючи священний ритуал із прилюдним видовищем."
  d009_sephardi_catastrophe.9.title: "Шляхи втечі марранів"
  d009_sephardi_catastrophe.9.entry: "$d009_sephardi_catastrophe.9.title$"
  d009_sephardi_catastrophe.9.desc: "Трибуналу стало відомо про існування цілої мережі купців і моряків з-поміж нових #TOOLTIP:RELIGIONGROUP,christian,X #L християн#!#! — ці люди потай допомагають родинам, що втомилися жити під вічною підозрою, тікати за кордон. Їхні кораблі виходять із гаваней під виглядом звичайних торгових суден. Місця вистачає не всім, однак декому все ж вдається втекти. І [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] не завжди встигає віддати наказ затримати корабель, що рушає у море."
  d009_sephardi_catastrophe.9.a: "Неможливо спиняти кожен корабель, що виходить із гавані."
  d009_sephardi_catastrophe.9.historical_info: "Після примусового навернення у християнство впродовж кількох поколінь діяли таємні шляхи втечі. Зазвичай вони переправляли сім’ї хрещених юдеїв через Бордо, Антверпен або Феррару до безпечніших земель, таких як Османська імперія та, згодом, Амстердам. Ця справа трималася здебільшого на родинних і ділових зв’язках раніше виїхалих купців. Португальська корона неодноразово намагалася покласти край їхній діяльності, але марно, оскільки ті самі купецькі зв'язки часто були необхідні країні для зовнішньої торгівлі."