l_russian:
  d009_late_minorities.1.title: "Месіанський рух саббатіанців"
  d009_late_minorities.1.entry: "$d009_late_minorities.1.title$"
  d009_late_minorities.1.desc: "У місті [ShowLocationName('smyrna')] містик на ім’я [target_character.GetName] [Select_CString(target_character.IsFemale, 'оголосила', 'оголосив')] себе довгоочікуваним месією, і ця звістка розпалила в серцях наших #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейських#!#! підданих надію, згасити яку не здатні жодні застереження рабинів. Цілі #TOOLTIP:CULTURE,$sephardi_tt$,X #L сефардські#!#! громади кидають свої справи й лагодяться повернутися на Сіон, а наші урядовці не знають, як учинити: спростувати ці чутки чи не чинити їм перепон. Досі незрозуміло, чи стане цей спалах завзяття у вірі скороминущим, чи назавжди змінить життя громади. [ROOT.GetCountry.GetGovernment.GetCourtTitle|U] розмірковує: чи маємо ми взагалі право втручатися в те, що відбувається?"
  d009_late_minorities.1.a: "Не будемо обмежувати цей рух."
  d009_late_minorities.1.b: "Вгамуємо їхній запал."
  d009_late_minorities.1.b.tt: "Наші юдейські піддані обурені через розпочаті переслідування"
  d009_late_minorities.1.historical_info: "Шабтай Цві, який народився в Смірні 1626 року, проголосив себе єврейським Месією в 1665 році. Після цього хвиля месіанського піднесення охопила єврейські громади від Амстердама до Ємену, зокрема й чималу частину сефардської діаспори. У 1666 році османська влада заарештувала Шабтая і поставила перед вибором: прийняти іслам або померти."
  variable_d009_sabbatean_movement_allowed_tt: "Рух саббатіанців не заборонили, і Шабтай Цві досі живий"
  d009_late_minorities.2.title: "Вознесіння Шабтая"
  d009_late_minorities.2.entry: "$d009_late_minorities.2.title$"
  d009_late_minorities.2.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] обговорює свіжу звістку: [target_character.GetName], якого [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] тримає під вартою, [Select_CString(target_character.IsFemale, 'прийняла', 'прийняв')] #TOOLTIP:RELIGIONGROUP,muslim,X #L іслам#!#!, обравши навернення замість страти. Для найревніших [Select_CString(target_character.IsFemale, 'її', 'його')] послідовників такий вчинок став зрадою, однак дехто з них запевняє, що за позірним зреченням криється істина, збагнути яку здатні лише щирі віряни. Тепер залишки руху занепадають: одні впадають у відчай, інші потай зрікаються колишньої віри, а треті вперто твердять, що шлях месії виявився значно складнішим, ніж можна було уявити."
  d009_late_minorities.2.a: "Закличемо вірних піти за [Select_CString(target_character.IsFemale, 'її', 'його')] прикладом."
  d009_late_minorities.2.a.entry: "Закличемо вірних піти за прикладом Шабтая Цві."
  d009_late_minorities.2.a.tt: "Наші побожні юдейські піддані занепокоєні примусовими наверненнями"
  d009_late_minorities.2.b: "Дозволимо руху тихо згаснути."
  d009_late_minorities.2.historical_info: "Османська влада заарештувала Шабтая Цві та запропонувала йому вибір: страта або прийняття ісламу. Так у 1666 році Шабтай Цві став мусульманином на ім’я Мехмед Ефенді. Невелике коло послідовників у Салоніках і не лише там про людське око наслідувало його приклад, водночас таємно дотримуючись синкретичного варіанту єврейських обрядів, відомого як дьонме. Більшість же послідовників Цві просто повернулася до звичайного єврейського життя. Вони розчарувалися, але приймати іслам не стали."
  d009_late_minorities.3.title: "#italic Гаскала#! — юдейське Просвітництво"
  d009_late_minorities.3.entry: "$d009_late_minorities.3.title$"
  d009_late_minorities.3.desc: "До #TOOLTIP:LOCATION,amsterdam,X #L Амстердама#!#! доходять звістки про новий рух, що зародився серед #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейських#!#! громад німецьких земель. Його прибічники закликають євреїв полишати замкнені гетто й вливатися в суспільство довкола — переймати його мову та звичай одягатися, долучатися до його знань і вчень. Серед наших єврейських купців і вчених уже точаться палкі суперечки: чи піде така відкритість на користь громаді, чи лише прискорить її розчинення в #TOOLTIP:RELIGIONGROUP,christian,X #L християнському#!#! світі."
  d009_late_minorities.3.a: "Запровадимо світську освіту та міську інтеграцію."
  d009_late_minorities.3.b: "Будемо дотримуватися звичаєвих громадських обмежень."
  d009_late_minorities.3.historical_info: "Рух #italic Гаскала#!, знаний також як єврейське Просвітництво, почався з філософських праць Мойсея Мендельсона, написаних у Берліні. Починаючи з 1770-х років вони спонукали єврейські громади по всій Європі до вивчення релігії, а також до занять світською філософією, літературою та суспільним життям. Громади сефардів та ашкеназів Амстердама були одними з перших за межами Німеччини, хто всерйоз обговорював ідеї Мендельсона. Це пояснювалося вже сформованою в місті надзвичайно відкритою єврейською інтелектуальною культурою."
  d009_late_minorities.4.title: "#italic Синедріон#! Наполеона"
  d009_late_minorities.4.entry: "$d009_late_minorities.4.title$"
  d009_late_minorities.4.desc: "[target_character.GetName] [Select_CString(target_character.IsFemale, 'скликала', 'скликав')] рабинів та найвпливовіших світських діячів із земель #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! на Великий #italic Синедріон#!, де раз і назавжди належить вирішити, чи сумісний #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейський#!#! закон з обов’язками громадянина республіки. Наш[ROOT.GetCountry.Custom('burghers_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] бач[ROOT.GetCountry.Custom('burghers_ytat')] у цьому нагоду нарешті долучити єврейські громади до повноцінного громадянського життя; [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] ж, навпаки, вважа[ROOT.GetCountry.Custom('clergy_yeyut')] те, що відбувається, небезпечним втручанням держави у справи, які її не обходять."
  d009_late_minorities.4.a: "Надамо повну громадянську емансипацію."
  d009_late_minorities.4.b: "Надалі триматимемося старих обмежень."
  d009_late_minorities.4.historical_info: "Щоб з’ясувати, чи сумісне єврейське право із французьким громадянством, у 1806 році Наполеон скликав Асамблею видатних євреїв, а в 1807 році — #italic Великий Синедріон#!. Зрештою делегати дійшли висновку про сумісність, але за умови, що єврейські громади визнають владу держави в громадянських питаннях, таких як шлюб і лихварство. Це рішення стало важливим кроком на шляху до правової емансипації євреїв у Європі доби Наполеона. Втім, питання про повну рівність насправді залишалося спірним і нерозв’язаним ще впродовж кількох десятиліть."
  variable_our_napoleon_tt: "З’явився полководець-завойовник, подібний до самого Наполеона"
  variable_d009_jewish_emancipation_tt: "#L [GetCountry('FRA').GetCulture.GetName|U]і#! юдеї зрівняні в правах перед законом"
  d009_late_minorities.5.title: "[GetCountry('MOR').Custom('GetRulerOrRegentTitle')|U] [GetCountry('MOR').GetAdjectiveWithNoTooltip]ої країни та зрівняні в правах юдеї"
  d009_late_minorities.5.entry: "$d009_late_minorities.5.title$"
  d009_late_minorities.5.desc: "#L [ROOT.GetCountry.GetAdjective|U]і#! купці, які повертаються з #ONCLICK:COUNTRY,[GetCountry('FRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('FRA').GetKey],X [GetCountry('FRA').Custom('CL_GEN')|L]#!#!, розповідають про новий лад, що там поволі утверджується: #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейським#!#! підданим дозволено постати перед законом нарівні з усіма іншими громадянами. Цю звістку обговорює навіть [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], і багато урядовців уголос міркують, чи зробить [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] так, щоб і мели [ROOT.GetCountry.Custom('rank_ua_GEN')|l] мали подібні привілеї, чи такі думки доречні лише в Європі та й годі."
  d009_late_minorities.5.a: "Визнаємо їхнє рівноправ’я."
  d009_late_minorities.5.b: "Збережемо колишні обмеження для зімміїв."
  d009_late_minorities.5.historical_info: "Звістки про зрівняння в правах французьких юдеїв дійшли до Марокко європейськими дипломатичними й торговими шляхами вже після 1807 року і викликали при марокканському дворі марні суперечки про правове становище підданих-юдеїв. Жодних офіційних змін тоді не відбулося, і звичаєвий устрій зімміїв, що визначав життя юдейських громад Марокко, зберігся майже незмінним аж до встановлення французького протекторату в XX столітті."
  d009_late_minorities.6.title: "Пам’ять про Аль-Андалус"
  d009_late_minorities.6.entry: "$d009_late_minorities.6.title$"
  d009_late_minorities.6.desc: "Серед вигнанців з #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!, які осіли на наших землях, досі жива пам’ять про Аль-Андалус — рай, який їхні пращури колись знайшли, а згодом утратили. Вірші й пісні про цей край цитує наш [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], їх співають у дружніх колах — поезія зберегла дух Аль-Андалуса ліпше, ніж людська пам’ять. Дехто вважає, що цю спадщину слід плекати на знак гостинности нашого краю. Інші ж воліли б, аби старі образи на Іберію пішли в небуття, перш ніж вони спричинять небезпечніші лиха."
  d009_late_minorities.6.a: "Замовимо витвір мистецтва на згадку про це."
  d009_late_minorities.6.b: "Поставимося до цього як до нешкідливого нападу туги за минулим."
  d009_late_minorities.6.historical_info: "Уявлення про Аль-Андалус як про втрачений рай глибоко вкоренилося в пам’яті сефардських та андалуських мусульман по всьому Магрибу. Задовго до того, як згасла будь-яка надія на повернення, цей образ знайшов надзвичайно романтичне втілення в поезії, музиці, а згодом і в зодчестві. До XVIII та XIX століть ця туга за минулим перетворилася на справжню політичну пам’ять, а також постала як самобутній літературний та мистецький стиль. Надалі до цієї спадщини з різною метою зверталися найрізноманітніші рухи."