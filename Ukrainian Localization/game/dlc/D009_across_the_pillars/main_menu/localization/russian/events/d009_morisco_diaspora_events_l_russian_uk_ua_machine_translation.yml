l_russian:
  d009_morisco_diaspora.1.title: "До нас прибули мориски"
  d009_morisco_diaspora.1.entry: "$d009_morisco_diaspora.1.title$"
  d009_morisco_diaspora.1.desc: "У [target_location.Custom('LR_PREP')|l] [target_location.GetName] почали оселятися біженці, які називають себе морисками, — #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманські#!#! родини, вигнані із земель, які їхні пращури віками вважали своєю домівкою. З собою вони приносять звичаї, ремесла й говірку, притаманні тій #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!, про яку більшість із нас знає лише з чуток. Дехто з наших урядовців радіє припливу майстерних людей та скарбу, здатних прислужитися країні; інші ж бачать у морисках чужинців і сумніваються в їхній вірності: не так вже й давно ті полишили рідні краї, де правлять християни."
  d009_morisco_diaspora.1.a: "Приймемо їх без жодних обмежень."
  d009_morisco_diaspora.1.b: "Обмежимо їх лише цим подвір’ям."
  d009_morisco_diaspora.1.historical_info: "Після видання декрету про вигнання 1609–1614 років близько 300 000 морисків полишили Іспанію, вирушили до Магрибу й знайшли прихисток у Тетуані, Сале, Тунісі та Алжирі. Багато хто поколіннями зберігав андалуську мову, звичаєву кухню та одяг, тоді як інші стали частиною ширших мусульманських спільнот, що прихистили їх."
  variable_d009_morisco_community_ever_tt: "Громада морисків існувала в країні"
  d009_morisco_diaspora.2.title: "Республіка Рабат-Сале"
  d009_morisco_diaspora.2.entry: "$d009_morisco_diaspora.2.title$"
  d009_morisco_diaspora.2.desc: "Громада морисків у #TOOLTIP:LOCATION,sale,X #L Сале#!#! фактично перебрала владу до своїх рук — ватажки корсарів звітують виключно перед власною радою, яку самі ж і обирають, а не перед призначеним нами намісником. Заплющувати очі на те, що коїться, вже не можна: час вирішити, чи узаконити новий лад, чи повернути Сале під пильніший нагляд."
  d009_morisco_diaspora.2.a: "Дамо їм самоврядність."
  d009_morisco_diaspora.2.b: "Залучимо їх до складу королівського флоту."
  d009_morisco_diaspora.2.historical_info: "Республіка Сале (вона ж республіка Бу-Регрег) виникла близько 1627 року як напівнезалежна піратська республіка. Нею правили біженці-мориски та їхні нащадки, а влада місцевих султанів до неї майже не сягала. Пірати чинили напади в околицях Іберії, проте не лишали поза увагою і торгові шляхи в Атлантиці. Згодом у XVII столітті вона зрештою підкорилася марокканському дому Алавітів, однак піратський дух цього краю зберігався ще протягом кількох поколінь."
  d009_morisco_diaspora.3.title: "Андалуське подвір’я в Тунісі"
  d009_morisco_diaspora.3.entry: "$d009_morisco_diaspora.3.title$"
  d009_morisco_diaspora.3.desc: "Осілі в #TOOLTIP:LOCATION,tunis,X #L Тунісі#!#! мориски збудували собі окреме подвір’я, де в усьому — в зодчестві, садах, навіть у ремеслах — збереглися впізнавані риси Іберії, хоча самих морисків від батьківщини відділяють десятиліття вигнання. Ми маємо вирішити, чи заохочувати таку самобутність, аби підкреслити розмаїття нашого міста, чи дозволити морискам з часом розчинитися в культурі Тунісу."
  d009_morisco_diaspora.3.a: "Підтримаймо збереження культури."
  d009_morisco_diaspora.3.b: "Підтримаймо асиміляцію."
  d009_morisco_diaspora.3.historical_info: "Вигнані з Іспанії мориски, які осіли в Тунісі, влаштувалися в кварталі, знаному нині як #italic Андалуський провулок#! та під іншими подібними назвами. Вони століттями зберігали андалуську архітектуру, кухню та музичну спадщину #italic малуф#!."
  d009_morisco_diaspora.4.title: "Збережена андалуська музика"
  d009_morisco_diaspora.4.entry: "$d009_morisco_diaspora.4.title$"
  d009_morisco_diaspora.4.desc: "Музики-мориски й досі виконують витончену придворну музику, яку їхні пращури колись грали в палацах #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!, і передають ці знання своїм учням. З покоління в покоління один музика переймає її основи від іншого, і цей звичай неперервно триває ще з тих часів, що передували вигнанню. Придворні поети та мандрівники все частіше зауважують, що музика морисків — одне з найвеличніших культурних надбань нашого краю."
  d009_morisco_diaspora.4.a: "Визнаємо цей звичай."
  d009_morisco_diaspora.4.historical_info: "Музична традиція #italic нуба#!, що постала при дворах Аль-Андалуса та була принесена до Північної Африки поколіннями вигнанців, збереглася й розвинулася в самобутній місцевий доробок. І донині ці наспіви звучать по всьому Магрибу, зокрема в Тетуані, Тунісі та Алжирі. Кожне з цих міст зберегло власну самобутню музичну школу цього спрямування."
  d009_morisco_diaspora.5.title: "Мориски — алжирські корсари"
  d009_morisco_diaspora.5.entry: "$d009_morisco_diaspora.5.title$"
  d009_morisco_diaspora.5.desc: "Біженці-мориски, що колись займалися рибальством і землеробством на узбережжі #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!, нині можуть прислужитися нашій країні в геть інший, набагато корисніший спосіб: вони знають тамтешні гавані, течії та берегові укріплення як свої п’ять пальців; наші корсари не можуть похвалитися тим самим. Належить вирішити, чи скористаємося ми цими знаннями на морі, чи дозволимо родинам морисків займатися спокійнішими ремеслами."
  d009_morisco_diaspora.5.a: "Наймемо їх лоцманами."
  d009_morisco_diaspora.5.b: "Залишимо їх займатися ремеслами."
  d009_morisco_diaspora.5.historical_info: "Мориски, які чудово знали географію узбережжя Іберії, протягом усього XVII століття високо цінувалися алжирськими піратами. Вони служили лоцманами та нападниками, а їхнє знання іспанських гаваней і морських течій давало місцевим корсарським флотам значну бойову перевагу перед християнськими супротивниками."
  d009_morisco_diaspora.6.title: "Через два покоління після вигнання"
  d009_morisco_diaspora.6.entry: "$d009_morisco_diaspora.6.title$"
  d009_morisco_diaspora.6.desc: "Діти та онуки перших вигнаних з #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! морисків виросли тут і вже не знають іншої батьківщини. Для одних Іберія живе лише в розповідях предків, що з часом перетворилися радше на легенди, ніж на спогади. Інші ж досі згадують роковини вигнання своїх дідів і прадідів так, ніби воно сталося лише вчора. Наше завдання — вирішити, чи допомогти цьому поколінню остаточно знайти себе як наших підданих, чи зберегти його особливу самобутність. Від цього залежить, який слід громада морисків залишить у нашій історії."
  d009_morisco_diaspora.6.a: "Заохотимо повне пристосування."
  d009_morisco_diaspora.6.b: "Допоможемо їм берегти пам’ять."
  d009_morisco_diaspora.6.historical_info: "До середини–кінця XVII століття діти й онуки вигнаних морисків дедалі більше зливалися з людом Магрибу. Втім, у таких містах, як Тетуан і Туніс, самобутні звичаї, прізвища та тривала андалуська самосвідомість зберігалися аж до XVIII століття і навіть пізніше."
  d009_morisco_diaspora.7.title: "Ключі від Гранади"
  d009_morisco_diaspora.7.entry: "$d009_morisco_diaspora.7.title$"
  d009_morisco_diaspora.7.desc: "Деякі родини морисків і досі бережуть ключі та папери на будинки, які колись належали їхнім предкам у #TOOLTIP:LOCATION,granada,X #L Гранаді#!#! та інших краях #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!. Нині вони не мають жодного практичного значення, але передаються у спадок із покоління в покоління як символ надії (хай навіть марної) на повернення; втім, з кожним роком воно здається дедалі примарнішим."
  d009_morisco_diaspora.7.a: "Згадаймо про те, що було втрачено."
  d009_morisco_diaspora.7.historical_info: "Родини морисків і сефардів зберігають ключі від своїх родових домівок, залишених на Піренейському півострові. Цей добре засвідчений звичай громад діаспори Магрибу та Османської імперії уособлює невгасиме, хоча й переважно символічне право на батьківщину, яка з кожним поколінням ставала дедалі віддаленішою."
  d009_morisco_diaspora.8.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]ий Алжир і андалуська спадщина"
  d009_morisco_diaspora.8.entry: "Алжир і андалуська спадщина"
  d009_morisco_diaspora.8.desc: "Наші будівничі та урядовці дедалі частіше звертають увагу на #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалуські#!#! квартали й споруди, якими так багатий [ShowLocationName('algiers')], — спадщину кількох поколінь морисків. Дехто вважає, що її слід дбайливо оберігати, інші ж пропонують розчистити місце задля сучаснішого міста, розбудованого на #L [ROOT.GetCountry.GetAdjective|l]ий#! лад."
  d009_morisco_diaspora.8.a: "Збережемо спадщину."
  d009_morisco_diaspora.8.b: "Замінимо її сучасним плануванням."
  d009_morisco_diaspora.8.historical_info: "Французькі колоніальні чиновники, які прийшли до влади в Алжирі після 1830 року, по-різному ставилися до спадщини міста доби морисків та Османської імперії. Одні урядовці й вчені описували та захищали споруди в андалуському стилі. Інші опікувалися їх знесенням задля потреб французької міської забудови, особливо в Касбі, давньому осідку османської цитаделі."
  d009_morisco_diaspora.9.title: "Дві громади, один шлях до [ROOT.GetCountry.Custom('CL_GEN')]"
  d009_morisco_diaspora.9.entry: "Дві громади, один шлях"
  d009_morisco_diaspora.9.desc: "Лише за одне покоління наші землі прихистили два народи, що їх вигнала з одних і тих же берегів одна й та сама біда: #TOOLTIP:CULTURE,$sephardi_tt$,X #L сефардів#!#!, котрі втекли після Альгамбрського едикту, та морисків, які рятувалися від примусового навернення у християнство чи навіть страшнішої долі. Дехто при дворі пропонує оселити кожну громаду у власному дворі, дарувати кожному двору окрему грамоту й дозволити їхнім жителям триматися власних звичаїв. Інші ж вважають, що вигнанців варто прихистити під одним дахом і не розділяти знедолених."
  d009_morisco_diaspora.9.a: "Створимо окремі квартали."
  d009_morisco_diaspora.9.b: "Дозволимо змішане поселення."
  d009_morisco_diaspora.9.historical_info: "Упродовж XV–XVII століть до Марокко тікали вигнані з Піренейського півострова юдеї та мусульмани. У таких містах, як Тетуан і Фес, їхні громади нерідко селилися поруч, поділяючи спільну піренейську спадщину. Водночас вони зберігали власні священні й правові порядки."
  d009_morisco_diaspora_9_sephardi_population_tt: "У країні є сефардське населення"
  d009_morisco_diaspora_9_morisco_community_tt: "У країні є міцна громада морисків"
  d009_morisco_diaspora.10.title: "Місто, яке пам’ятає"
  d009_morisco_diaspora.10.entry: "$d009_morisco_diaspora.10.title$"
  d009_morisco_diaspora.10.desc: "Тетуан несе в собі відбиток звичаїв одразу двох тутешніх народів-вигнанців: #TOOLTIP:CULTURE,$sephardi_tt$,X #L сефардських#!#! родин та біженців-морисків. І ті, й інші донині розмовляють говірками іспанської, принесеної сюди їхніми предками. І ті, й інші називають дітей на честь міст тієї #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!, яку їм уже не судилося побачити знову. Мало знайдеться міст, де пам’ять про втрачену батьківщину так міцно вплетена у щоденне життя: її сліди бережуть вулиці, суди, родинні вогнища."
  d009_morisco_diaspora.10.a: "Пишаймося живою пам’яттю міста."
  d009_morisco_diaspora.10.historical_info: "Тетуан відбудували та наново заселили здебільшого сефарди й андалуські мусульмани, вигнані з Піренейського півострова. Тому місто зберегло свою неповторну іберійську вдачу, зокрема говірки #italic хакетія#! та дарижа, в яких аж до XX століття зберігалися сліди іспанської мови."