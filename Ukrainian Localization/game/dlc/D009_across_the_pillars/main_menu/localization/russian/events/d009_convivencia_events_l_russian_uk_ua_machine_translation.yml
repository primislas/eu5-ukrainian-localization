l_russian:
  d009_convivencia.1.title: "Три громади"
  d009_convivencia.1.entry: "$d009_convivencia.1.title$"
  d009_convivencia.1.desc: "У наших містах церковні дзвони, співи муедзинів та суботні свічки століттями на одних і тих самих вулицях служать одній справі: відлічують ті самі години. Мудехарські ремісники, #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейські#!#! лихварі та лікарі, #TOOLTIP:RELIGIONGROUP,christian,X #L християнські#!#! містяни ділять між собою ринки, майстерні та двори й нерідко сперечаються; від сутичок їх утримує лише крихка #italic конвівенсія#!, що склалася ще багато поколінь тому і пережила війни, мор та кількох королів. Радники день у день вимагають від нас тримати громади в залізних шорах; альхами так само непохитно вимагають протилежного. Наскільки пильно короні слід наглядати за тим, на яких умовах цим трьом громадам вільно жити пліч-о-пліч?"
  d009_convivencia.1.a: "Нехай альхами самі собою врядують."
  d009_convivencia.1.a.tt: "#TOOLTIP:RELIGIONGROUP,muslim,X #L Ісламські#!#! та юдейські громади [target_location.Custom('LR_GEN')|l] [target_location.GetName] успішніше облаштовуються під нашою владою"
  d009_convivencia.1.b: "Віддаймо перевагу християнським підданим."
  d009_convivencia.1.b.tt: "#TOOLTIP:RELIGIONGROUP,muslim,X #L Ісламські#!#! та юдейські громади [target_location.Custom('LR_GEN')|l] [target_location.GetName] стурбовані нашою владою"
  d009_convivencia.1.historical_info: "Словом #italic конвівенсія#!, що означає «співіснування», історики позначають ті століття, коли християни, мусульмани та юдеї жили на теренах середньовічної Іберії пліч-о-пліч в умовах різного ступеня терпимости, особливо в таких містах, як Толедо, Севілья та Сарагоса. Про цілковиту рівність не йшлося: нехристияни сплачували особливі податки і стикалися зі значними обмеженнями, але це уможливлювало культурний та інтелектуальний обмін, який, зокрема, призвів до появи славетних толедських шкіл перекладачів."
  d009_convivencia.2.title: "Синагога дель Трансіто"
  d009_convivencia.2.entry: "$d009_convivencia.2.title$"
  d009_convivencia.2.desc: "[target_character.GetName] — наш скарбник і довірена особа в місцевій альхамі — бажає звести нову синагогу в #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейському#!#! подвір’ї в самісінькій середині #TOOLTIP:LOCATION,toledo,X #L Толедо#!#!. Її стіни прикрашатиме різьблення із псалмами Давида та гербами #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, а стеля буде позолоченою, та так, що, за [Select_CString(target_character.IsFemale, 'її', 'його')] словами, синагога перевершить найкращі витвори з усіх, які капітул собору замовляв за останні десятиліття. На наших землях постане один із найвеличніших молитовних домів, коли-небудь збудованих руками юдеїв, — пам’ятник [Select_CString(target_character.IsFemale, 'її', 'його')] набожности та піднесенню над простими смертними. Для тих же, хто вміє читати між рядків, синагога стане водночас і незаперечним свідченням впливу, з яким не наважиться сперечатися [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]."
  d009_convivencia.2.a: "Дозволимо будівництво. До того ж, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] радо прийме в себе цю людину."
  d009_convivencia.2.a.entry: "Дозволимо Самуелю Га-Леві Абулафії будівництво і запросимо його до нашого двору."
  d009_convivencia.2.b: "Відмовимо, бо така розкіш викличе заздрість і підозри."
  d009_convivencia.2.b.tt: "Юдейська громада Толедо відчуває немилість корони"
  d009_convivencia.2.historical_info: "Синагога дель Трансіто в Толедо була зведена близько 1356 року Самуелем Га-Леві Абулафією, скарбником короля Кастилії Педро I. Донині вона лишається однією з найкраще збережених синагог, збудованих у стилі мудехар. На її стінах викарбувано псалми на івриті та королівський герб Кастилії. Вражаючий злет Га-Леві при дворі завершився трагічно: його звинуватили в розкраданні, ув'язнили й закатували на смерть. Ця історія нагадує про те, наскільки хитким могло бути становище навіть найбільш наближених юдеїв-придворних."
  d009_convivencia_2_judaism_population_tt: "У Толедо є юдейське населення"
  d009_convivencia.3.title: "Хасдай Крескас і питання віри"
  d009_convivencia.3.entry: "$d009_convivencia.3.title$"
  d009_convivencia.3.desc: "[target_character.GetName], рабин і #TOOLTIP:ARTIST,philosopher,X #L філософ#!#!, вельми [Select_CString(target_character.IsFemale, 'шанована', 'шанований')] у своїй громаді й [Select_CString(target_character.IsFemale, 'визнана', 'визнаний')] серед нашого люду, просить про аудієнцію, на що [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] відповідає згодою. [Select_CString(target_character.IsFemale, 'Вона має намір', 'Він має намір')] довести нам, що розум та одкровення не ворогують між собою; що філософи, якими так захоплюються наші вчені, ніколи не ставилися до #TOOLTIP:RELIGIONGROUP,christian,X #L християнського#!#! вчення так прихильно, як це намагаються змалювати; і що розбіжності, які так часто нав’язують [Select_CString(target_character.IsFemale, 'її', 'його')] народу, спираються на вигадану Арістотелем логіку, мало придатну для вирішення питань віри. Що б не думали про це [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] — а думки в них дуже різні — вченість, яку виявляє [target_character.GetShortNameWithNoTooltip], безсумнівна, а доводи, як кажуть, вкрай важко спростувати."
  d009_convivencia.3.a: "Приймемо [Select_CString(target_character.IsFemale, 'її', 'його')] та вислухаємо [Select_CString(target_character.IsFemale, 'її', 'його')] доводи."
  d009_convivencia.3.a.entry: "Приймемо Хасдая Крескаса та вислухаємо його доводи."
  d009_convivencia.3.a.tt: "#TOOLTIP:RELIGION,$judaism_tt$,X #L Юдейські#!#! громади нашої країни натхненні цим вчинком"
  d009_convivencia.3.b: "Відішлемо [Select_CString(target_character.IsFemale, 'її', 'його')] геть."
  d009_convivencia.3.b.entry: "Відішлемо Хасдая Крескаса геть."
  d009_convivencia.3.historical_info: "Хасдай Крескас був видатним рабином і філософом арагонського юдейства, який жив переважно в Барселоні та Сарагосі. У своїй головній праці #italic Ор Адонай#! («Світло Господа») він послідовно критикував вищість філософії Арістотеля над юдейським богослов'ям. Крескас стверджував, що віра і божественна воля не можуть цілковито підпорядковуватися арістотелівській логіці. Він пережив спустошливі погроми 1391 року, під час яких загинув його власний син. Більша частина пізніх творів Крескаса є безпосередньою відповіддю мислителя на цю катастрофу."
  d009_convivencia_3_judaism_population_tt: "У країні є юдейське населення"
  d009_convivencia.4.title: "Майстри-мудехари"
  d009_convivencia.4.entry: "$d009_convivencia.4.title$"
  d009_convivencia.4.desc: "Відколи наші піддані-мудехари дістали право порядкувати у своїй альхамі — громаді, якій королівська грамота та привілеї дозволяють самостійно відати своїми ринками, судами та торгівлею, — їхні зодчі, кахлярі та штукатури сміливіше виявляють свою майстерність. У їхніх працях підковоподібні арки й майстерне ліплення поєднуються з формами, звичними нашим власним мулярам. Доручити їм звести крило палацу чи садовий павільйон — означає втілити в камені та вапні свідчення того, що дарована нами грамота не була порожньою обіцянкою. Втім, не кожен єпископ чи барон поставиться до цього прихильно, а наш[ROOT.GetCountry.Custom('clergy_aei')|l] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] не промина[ROOT.GetCountry.Custom('clergy_yeyut')] нагоди побурчати про перебіг подій."
  d009_convivencia.4.a: "Дозволимо спорудження крила палацу в мудехарському стилі."
  d009_convivencia.4.b: "Звертатимемося із замовленнями лише до християнських ремісників."
  d009_convivencia.4.historical_info: "Мусульманські майстри, що працювали за християнського панування, утворили стиль мудехар, який знайшов своє застосування в мистецтві та зодчестві. Він вирізняється підковоподібними арками, геометричними візерунками кахлів і різьбленим ліпним оздобленням, що поєднуються з готичними та романськими формами. Християнські володарі завзято замовляли праці в стилі мудехар, тож він процвітав по всій Кастилії та по всьому Арагону. Алькасар у Севільї, збудований для короля Педро I у 1360-х роках переважно майстрами стилю мудехар із Гранади й Толедо, і досі лишається найславетнішим свідченням цієї королівської опіки."
  d009_convivencia.5.title: "Юдейські фінансисти та корона"
  d009_convivencia.5.entry: "$d009_convivencia.5.title$"
  d009_convivencia.5.desc: "Скарбниця #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! тане швидше, ніж хотілося б визнавати. Війни, будівництво, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] — усе це вимагає чималих видатків, яких не встигають покривати податки. Лихварі та митарі з альхам готові надати нам позику — ту саму, в якій наш[ROOT.GetCountry.Custom('nobles_aei')|l] власн[ROOT.GetCountry.Custom('nobles_yiaei')|l] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')|l], зв’язан[ROOT.GetCountry.Custom('nobles_yiaei')|l] по руках і ногах канонічним правом та власною пихою, майже завжди нам відмовля[ROOT.GetCountry.Custom('nobles_yeyut')]. І як би не ганили з церковних кафедр їхні умови, вигідніших пропозицій у всіх володіннях [ROOT.GetCountry.Custom('CL_GEN')] годі й знайти. Наш[ROOT.GetCountry.Custom('clergy_aei')|l] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] без кінця ремству[ROOT.GetCountry.Custom('clergy_yeyut')] на лихварство та надмірний вплив, якого зазнає [ROOT.GetCountry.GetGovernment.GetCourtTitle|l], — і, слід зауважити, небезпідставно. Але гроші, взяті в альхами, пахнуть точнісінько так само, як і гроші, що дісталися нам від #TOOLTIP:RELIGIONGROUP,christian,X #L християн#!#!."
  d009_convivencia.5.a: "Покластися на юдейських фінансистів у справі наповнення скарбниці."
  d009_convivencia.5.b: "Обмежити лихварство, щоб [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')|l] заспокої[ROOT.GetCountry.Custom('clergy_vlaloly')|l]ся."
  d009_convivencia.5.b.entry: "Обмежимо їхніх лихварів, потішимо священників."
  d009_convivencia.5.historical_info: "Юдейські фінансисти, митарі та придворні лікарі були невіддільною частиною християнських дворів Іберії в добу Середньовіччя. Церковний канон забороняв лихварство християнам, залишаючи тим самим більшу частину позичкової справи в руках юдейських позикодавців. Такі діячі, як Єгуда де ла Кавальєрія, що відав скарбницею Арагону в XIII столітті, здобували справжній вплив на найвищому щаблі. Втім, поважне становище також робило їх мішенню для невдоволення щоразу, коли зростали податки або невдало велися війни."
  d009_convivencia.6.title: "Справа в судах альхам"
  d009_convivencia.6.entry: "$d009_convivencia.6.title$"
  d009_convivencia.6.desc: "Минуло кілька років відтоді, як ми визначили, наскільки ретельно короні слід наглядати за судами альхами, і ось перед нами постала справа, яка покаже, чи діє цей лад. #TOOLTIP:RELIGIONGROUP,christian,X #L Християнський#!#! купець, що торгує вовною, сперечається з чинбарем-#TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманином#!#! через оборудку, що обернулася збитками. Суддя альхами вже виніс рішення, керуючись правом, якого тут дотримуються вже багато поколінь. Тепер купець звертається безпосередньо до нас і вимагає, щоб королівський суд скасував вирок. Адже, за його словами, він не погоджувався підкорятися цій ухвалі."
  d009_convivencia.6.a: "Приймемо ухвалу суду громади."
  d009_convivencia.6.a.tt: "Ісламські та #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейські#!#! громади сприймають це рішення як доказ того, що короні можна вірити"
  d009_convivencia.6.b: "Скасуємо ухвалу та розглянемо справу в королівському суді."
  d009_convivencia.6.b.tt: "Ісламські та #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейські#!#! громади бачать, як суди альхами поступово позбавляють повноважень"
  d009_convivencia.6.historical_info: "Альхами, самоврядні мусульманські та юдейські громади християнської Іберії, зазвичай мали ще й судову самоврядність. Надані короною хартії дозволяли їхнім судам спиратися на мусульманське чи юдейське право під час розгляду внутрішніх суперечок. Саме ця справа вигадана, але показана в ній напруга була повсякчасною. Рішення судів корони та громад часто різнилися, а те, наскільки корона була готова визнати за общинними судами право останнього слова, значно залежало від королівства та століття."
  d009_convivencia.7.title: "Юдей-візир для [ROOT.GetCountry.Custom('CL_GEN')]"
  d009_convivencia.7.entry: "Юдей-візир"
  d009_convivencia.7.desc: "[target_character.GetName], виходець із #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейського#!#! роду, одного з багатьох, що оселилися за мурами #TOOLTIP:LOCATION,granada,X #L Гранади#!#!, [Select_CString(target_character.IsFemale, 'зажила', 'зажив')] слави вправного управителя: [Select_CString(target_character.IsFemale, 'вона тямить', 'він тямить')] у збиранні данини й податків, уміє укладати угоди і з однаковою легкістю веде справи як із #TOOLTIP:RELIGIONGROUP,christian,X #L християнськими#!#!, так і з #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманськими#!#! посланцями. [ROOT.GetCountry.GetGovernment.GetRulerTitle|U] вже неодноразово звертає на [Select_CString(target_character.IsFemale, 'неї', 'нього')] свій погляд.\n\nПіднести цю людину на високу посаду — означає забезпечити юдейському посадовцю значний вплив за умов, що наш [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] складається переважно з мусульман. Втім, для Аль-Андалусу в цьому немає нічого нечуваного: подібний звичай відомий з давніх-давен і сходить ще до омеядських халіфів. Але наш[ROOT.GetCountry.Custom('clergy_aei')|l] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l], та й простий люд, навряд чи зустрінуть таке призначення без нарікань, якою б корисною не була [Select_CString(target_character.IsFemale, 'її', 'його')] служба для нашої скарбниці."
  d009_convivencia.7.a: "Призначимо [Select_CString(target_character.IsFemale, 'її', 'його')] візиром."
  d009_convivencia.7.a.entry: "Призначимо його візиром."
  d009_convivencia.7.b: "Призначити замість [Select_CString(target_character.IsFemale, 'неї', 'нього')] мусульманина."
  d009_convivencia.7.b.entry: "Призначимо замість нього мусульманина."
  d009_convivencia.7.historical_info: "Юдеї-візири в мусульманській Іберії справді бували, і найвідомішим серед них є Шмуель га-Нагід. В XI столітті він посів посаду візира тайфського королівства Гранади. Єгосеф, син Шмуеля, успадкував посаду і обіймав її, доки в 1066 році його не вбили під час погрому юдейської громади Гранади. Емірат Насрідів, що правив у Гранаді з XIII століття, успадкував придворну культуру, в якій такі призначення, хоч і не обходилися без суперечок, мали історичне підґрунтя."
  d009_convivencia_7_judaism_population_tt: "У країні є юдейське населення"