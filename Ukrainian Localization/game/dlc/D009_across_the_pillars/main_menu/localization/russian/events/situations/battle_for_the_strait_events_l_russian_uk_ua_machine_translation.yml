l_russian:
  battle_for_the_strait_events.1.title: "Битва за протоку"
  battle_for_the_strait_events.1.desc_cas: "Сплачувана #ONCLICK:COUNTRY,[target_gra_country.GetKey] #TOOLTIP:COUNTRY,[target_gra_country.GetKey],X [target_gra_country.Custom('CL_INST')|L]#!#! данина справно надходить на північ. Слідом за нею прибувають посли, озброєні настільки довгим переліком кривд, що наш [target_cas_country.GetGovernment.GetCourtTitle|l], а точніше, камердинер неодмінно збожеволіє, якщо візьметься розглядати кожну з них. Але на південь від Сьєрра-Морени й досі сидять наші супротивники, а розпочата під Ковадонгою Реконкіста ще далека від завершення: вона закінчиться лише тоді, коли впаде [ShowBuildingTypeName('alhambra')] та [Select_CString(target_gra_ruler.IsFemale, 'правляча', 'правлячий')] там [target_gra_ruler.GetName].\n\nЩоб здійснити цей останній ривок, знадобиться не один похід. Єпископи впродовж кількох поколінь закликають до хрестового походу. Великі роди дивляться на справу практичніше: їм важливіша змога отримати нові землі. Наше завдання — підтримувати ці зусилля так, щоб престол [target_gra_country.Custom('CL_GEN')] нарешті захитався."
  bfts_intro_tt: "У цій ситуації стають доступними механіки, пов’язані з #L [target_cas_country.GetAdjective|l]им#! та #L [target_mor_country.GetAdjective|l]им#! впливом на #ONCLICK:COUNTRY,[target_gra_country.GetKey] #TOOLTIP:COUNTRY,[target_gra_country.GetKey],X [target_gra_country.Custom('CL_ACC')|L]#!#!. На цій шкалі є #Y 4#! порогові значення, кожне з яких надає відповідний бонус"
  battle_for_the_strait_events.1.desc_mor: "По той бік протоки [target_cas_country.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[target_cas_country.GetKey] #TOOLTIP:COUNTRY,[target_cas_country.GetKey],X [target_cas_country.Custom('CL_GEN')|L]#!#! поступово посилює тиск на #ONCLICK:COUNTRY,[target_gra_country.GetKey] #TOOLTIP:COUNTRY,[target_gra_country.GetKey],X [target_gra_country.Custom('CL_ACC')|L]#!#! — місяць за місяцем, виплата за виплатою. [target_gra_country.GetGovernment.GetCourtTitle|U] надсилає листи щомісяця, іноді — щотижня. Вони просять грошей, але насправді сподіваються, що [target_mor_country.GetGovernment.GetRulerTitle|l] нашої країни завдасть удару в самісіньке серце, яке живить цю війну.\n\nЦю справу не завершити за один строк. [target_mor_country.GetGovernment.GetEstateName('clergy_estate')|U] наших міст ще від часів падіння останнього альмохадського халіфа заклика[target_mor_country.Custom('clergy_yeyut')] до #italic джихаду#!. Якщо ми залишимо цю війну спадкоємцям, закінчувати її доведеться їхнім правнукам."
  battle_for_the_strait_events.1.desc_gra: "Ми опинилися між двома молотами, і кожен із них тримає усміхнений велетень. На півночі править [target_cas_country.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[target_cas_country.GetKey] #TOOLTIP:COUNTRY,[target_cas_country.GetKey],X [target_cas_country.Custom('CL_GEN')|L]#!#! — ця людина рік за роком стягує данину й терпляче чекає, поки похитнуться духовні підвалини #ONCLICK:COUNTRY,[target_gra_country.GetKey] #TOOLTIP:COUNTRY,[target_gra_country.GetKey],X [target_gra_country.Custom('CL_GEN')|L]#!#!. Через протоку нам надсилає пропозиції та дари [target_mor_country.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[target_mor_country.GetKey] #TOOLTIP:COUNTRY,[target_mor_country.GetKey],X [target_mor_country.Custom('CL_GEN')|L]#!#!, що по-справжньому добре знає лише одну мову — мову #italic джихаду#!, і ціну цим дарункам ми знаємо добре: цілковите підпорядкування нашого престолу.\n\nОсь так і помирає #italic тайфа#!. Не вмить, не під навалою окремого війська, а повільно, в міру того, як наш [target_gra_country.GetGovernment.GetCourtTitle|l] забуває, як відповідати відмовою. Ми протрималися довше за багатьох; тепер наше завдання на прийдешні роки — пережити одного терплячого та одного честолюбного сусіда, а заразом подбати про те, щоб літописи [target_gra_country.Custom('CL_GEN')] були довшими, ніж літописи інших #italic тайф#!, що не змогли витримати натиску."
  bfts_explain_granadan_sovereignty_tt: "Відкриває доступ до [Concept('granadan_sovereignty', 'гранадського суверенітету')|e] на панелі [Concept('situation', 'ситуації')|e]"
  battle_for_the_strait_events.1.desc_christian: "До нас доходять звістки: [target_cas_country.GetName] готу[target_cas_country.Custom('end_yetsayutsa')] обрушити всю міць [target_cas_country.Custom('rank_ua_GEN')|l] на #ONCLICK:COUNTRY,[target_gra_country.GetKey] #TOOLTIP:COUNTRY,[target_gra_country.GetKey],X [target_gra_country.Custom('CL_ACC')|L]#!#! — останню #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламську#!#! країну півострова. Південь Іберії не знав подібних збурень із часів походів Фернандо III.\n\nНаслідки цього протистояння вийдуть далеко за межі наших кордонів. Перемога [target_cas_country.GetAdjectiveWithNoTooltip|l]их військ завершить Реконкісту на умовах, узгоджених у #TOOLTIP:LOCATION,toledo,X #L Толедо#!#!: південні провінції перейдуть під владу однієї корони. Якщо [target_mor_country.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[target_mor_country.GetKey] #TOOLTIP:COUNTRY,[target_mor_country.GetKey],X [target_mor_country.Custom('CL_GEN')|L]#!#! по той бік протоки вирішить втрутитися всерйоз, на наших морських шляхах уперше за сто років можуть знову з’явитися мусульманські галери. Хоч як закінчиться ця боротьба, мапа #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! вже ніколи не буде такою, як раніше."
  battle_for_the_strait_events.1.desc_muslim: "[target_mor_country.GetGovernment.GetRulerTitle|U] #ONCLICK:COUNTRY,[target_mor_country.GetKey] #TOOLTIP:COUNTRY,[target_mor_country.GetKey],X [target_mor_country.Custom('CL_GEN')|L]#!#! [Select_CString(target_mor_ruler.IsFemale, 'спрямувала', 'спрямував')] погляд на північ. [target_gra_country.GetName] — остання #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламська#!#! країна на землях [ShowFormableCountryName('ADU_f')] — зазнає нещадного тиску: [target_cas_country.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[target_cas_country.GetKey] #TOOLTIP:COUNTRY,[target_cas_country.GetKey],X [target_cas_country.Custom('CL_GEN')|L]#!#! витискає з неї всі соки, виплата за виплатою, і щоп’ятниці в #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#! простому люду нагадують, заради чого це коїться.\n\nНам залишається стежити за боротьбою, хоч як далеко від наших кордонів вона вирішуватиметься. Якщо [target_mor_country.GetNameWithNoTooltip] виступ[target_mor_country.Custom('end_ytlyat')] на захист престолу [target_gra_country.Custom('CL_GEN')], [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'наша', 'наш')] [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] буде оспівуватися в #italic хутбах#! до самої Кордови, — і це станеться ще за нашого віку. Якщо ж [target_cas_country.GetGovernment.GetRulerTitle|l] [target_cas_country.Custom('CL_GEN')] зуміє силою охрестити [target_gra_country.Custom('rank_ua_ACC')|l], тоді [ShowFormableCountryNameWithNoTooltip('ADU_f')] втратить останній оплот, а разом із цим добіжить кінця й історія, що бере свій початок від Таріка ібн Зіяда."
  battle_for_the_strait_events.1.option_cas: "Іберія коритиметься християнській короні."
  battle_for_the_strait_events.1.option_mor: "[ShowFormableCountryNameWithNoTooltip('ADU_f')] повернеться до складу халіфату."
  battle_for_the_strait_events.1.option_gra: "Ми переживемо зазіхання обох."
  battle_for_the_strait_events.1.option_christian: "Від наслідку цієї боротьби залежить доля Іберії."
  battle_for_the_strait_events.1.option_muslim: "Від наслідку цієї боротьби залежить те, якою буде [ShowFormableCountryNameWithNoTooltip('ADU_f')]."
  battle_for_the_strait_events.2.title: "Перемога в Реконкісті"
  battle_for_the_strait_events.2.desc: "У #TOOLTIP:LOCATION,granada,X #L Гранаді#!#! лунає остання п’ятнична молитва, але передзвону у відповідь уже не чути. Не минає й години, як східну стіну будівлі починають обміряти: тут буде апсида. [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'довела', 'довів')] до кінця справу, розпочату колись королями Астурії. Реконкіста завершена.\n\nІберійські літописці відтепер відлічуватимуть час за новою межею, між добами #italic «до Гранади»#! та #italic «після Гранади»#!. Цю межу провела саме наша корона — і цій великій честі не потрібні жодні пояснення."
  battle_for_the_strait_events.2.a: "Над протокою засяяв хрест."
  battle_for_the_strait_events.3.title: "[ShowFormableCountryNameWithNoTooltip('ADU_f')] повертається до рук вірян"
  battle_for_the_strait_events.3.desc: "[ShowFormableCountryName('ADU_f')] може зітхнути спокійно: ми відповіли на заклик. Ми зламали #ONCLICK:COUNTRY,[target_cas_country.GetKey] #TOOLTIP:COUNTRY,[target_cas_country.GetKey],X [target_cas_country.Custom('CL_ACC')|L]#!#!, звільнивши [GetCountry('GRA').Custom('rank_ua_ACC')|l] від гніту та поклавши край багаторічній сплаті данини. [target_ruler.GetName] тепер загальновизнано вважається [Select_CString(target_ruler.IsFemale, 'покровителькою', 'покровителем')] останньої #TOOLTIP:RELIGIONGROUP,muslim,X #L ісламської#!#! країни півострова, а [Select_CString(target_ruler.IsFemale, 'її', 'його')] ім’я віднині лунає в п’ятничних молитвах по всьому #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! аж до самої #TOOLTIP:LOCATION,granada,X #L Гранади#!#!.\n\nМи знову проголосили Маринідський халіфат. #italic Баят#!, який принесли наші [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l], — повноцінне визнання того, що [ShowFormableCountryNameWithNoTooltip('ADU_f')] перебуває під нашою опекою. Ми поклали на себе обов’язок піклуватися про кожного жителя нашої країни, навіть про тих, хто не сповідує іслам. Про наше правління судитимуть за тим, як ми поставимося до цих людей. Ми продовжуємо справу, яку колись розпочали великі Альмохади."
  battle_for_the_strait_events.3.a: "Наші знамена майорять по обидва боки протоки."
  bfts_andalus_formation_eased_tt: "Тепер для створення країни [ShowFormableCountryNameWithNoTooltip('ADU_f')] нам знадобиться контролювати #G менше#! іберійських земель"
  battle_for_the_strait_events.4.title: "Вічний престол [GetCountry('GRA').Custom('CL_GEN')]"
  battle_for_the_strait_events.4.desc: "#L [target_cas_country.GetAdjective]а#! корона більше не висуває нових вимог. Після того як минулого літа флот так і не вийшов із #L [target_mor_country.GetAdjective|l]их#! портів, нової спроби зібрати сили вже не було. [target_gra_country.GetCapital.GetName] залишається собою; трон і далі належить своєму законному володарю. [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'здійснила', 'здійснив')] те, про що при дворі мріяли майже пів століття: [Select_CString(target_ruler.IsFemale, 'пережила', 'пережив')] боротьбу та [Select_CString(target_ruler.IsFemale, 'дочекалася', 'дочекався')], доки протистояння зійде нанівець.\n\nПопереду чекає ще багато труднощів. Завоювання поставило крапку в цій історії, але закривати книгу ще зарано: доки ми зберігаємо стійкість, у ній з’являтимуться нові сторінки. Нашим наступникам ми залишаємо приклад не того, як треба перемагати, а того, як треба вміти чекати. Літописці напишуть про нас: «[target_gra_country.GetName] — емірат, що відмовився впасти у відведений йому строк»."
  battle_for_the_strait_events.4.a: "Гранада вільна."
  bfts_reconquest_cb_unlocked_tt: "Тепер ми можемо знайти привід для війни «[ShowCasusBelliName('cb_reconquer_iberia')]», який зменшує витрати воєнного рахунку на відвоювання #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!"
  bfts_iberia_fully_integrated_tt: "Кожна утримувана нами [Concept('location', 'місцевість')|e] #TOOLTIP:AREA,granada_area,X #L Гранади#!#!, #TOOLTIP:AREA,andalusia_area,X #L Андалусії#!#! та #TOOLTIP:AREA,murcia_area,X #L Мурсії#!#! отримує новий рівень [Concept('integration', 'інтеграції')|e] і вважається [Concept('core', 'корінною')|e]"
  bfts_taifa_annexation_boosted_tt: "Кожна [ShowSubjectTypeName('taifa')|l], яку ми зараз поглинаємо, отримує #G +25%#! до поступу [Concept('annexation', 'поглинання')|e]"
  battle_for_the_strait_events.5.title: "$battle_for_the_strait$ добігає кінця"
  battle_for_the_strait_events.5.desc_cas: "Минули роки. [target_cas_country.GetGovernment.GetCourtTitle|U] нашої країни більше не веде ліку послам, що прибувають і відбувають, — настільки вони численні. Уже двічі валки з даниною прибули із запізненням і не сповна; вибачення, що надійшли після цього, майже дослівно повторюють почуте нами двадцять років тому. [target_ruler.GetName] не діждеться піднесення хреста над #TOOLTIP:LOCATION,granada,X #L Гранадою#!#!.\n\nМи довго й ретельно готувалися до війни, яку так і не спромоглися довести до кінця. Порубіжні фортеці стоять пусткою й занепадають. Багато хто з #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалусців#!#!, яких ми колись покликали на службу до канцелярії, обзавівся родинами, і тепер за канцелярськими столами сидять їхні правнуки. Ані єпископи, ані вельможні роди за ці роки не зреклися своїх зазіхань. Одні й далі вимагають хрестового походу, інші мріють про нові земельні маєтності. А більшість — будьмо щирими — прагне і того, й іншого. Час для рішучого кроку минув без вороття. Своїм спадкоємцям ми залишимо незакінчену суперечку — і так само розколотий півострів."
  battle_for_the_strait_events.5.desc_mor: "Настає нова доба, але по той бік протоки так само лунає заклик, який колись чули наші діди. Флоти нашої країни вже не раз поверталися додому, так і не ставши до бою. [target_mor_country.GetGovernment.GetEstateName('clergy_estate')|U], що щоп’ятниці заклика[target_mor_country.Custom('clergy_vlaloly')] до #italic джихаду#! упродовж двох поколінь, сьогодні занадто старезн[target_mor_country.Custom('clergy_yiaei')], щоб вести боротьбу далі. [target_ruler.GetName] уже не здійме нашого стяга на тому березі.\n\nТа здолала нас зовсім не #L [target_cas_country.GetAdjective|l]а#! корона. Реконкіста не наблизилася до завершення — як, утім, і відродження держави Альмохадів. Ми випробували все, що колись приносило нам успіх, — і часом нам справді сприяло щастя. Змінювалося співвідношення сил, змінювалося становище, але перелому так і не сталося. Справу, яку наші пращури розпочали за величних Альмохадів, продовжить нове покоління. І краю цій історії й досі не видно."
  battle_for_the_strait_events.5.desc_gra: "Минуло два століття. На престолі #ONCLICK:COUNTRY,[target_gra_country.GetKey] #TOOLTIP:COUNTRY,[target_gra_country.GetKey],X [target_gra_country.Custom('CL_GEN')|L]#!#! і далі сидить [target_gra_country.GetGovernment.GetRulerTitle|l]. Хроністи розійшлися в думках: для когось такий порядок — лише незначна перемога, для інших же — справжнє диво. Побоювання правителів #ONCLICK:COUNTRY,[target_cas_country.GetKey] #TOOLTIP:COUNTRY,[target_cas_country.GetKey],X [target_cas_country.Custom('CL_GEN')|L]#!#! і сподівання володарів #ONCLICK:COUNTRY,[target_mor_country.GetKey] #TOOLTIP:COUNTRY,[target_mor_country.GetKey],X [target_mor_country.Custom('CL_GEN')|L]#!#! не справдилися: [target_ruler.GetName] не [Select_CString(target_ruler.IsFemale, 'вчинила', 'вчинив')] нічого, окрім украй необхідного.\n\nУсе збудоване нашими руками слугувало одній меті: виживанню. Ми мусили дочекатися, поки вітер історії розвіє прах наших ворогів. [ShowBuildingTypeName('alhambra')|U] і далі росте увись та вшир, а #italic хінети#! так само міцно тримаються в сідлі. Два опікуни, що тягли нас кожен у свій бік, виснажилися перш, ніж спромоглися зламати нас. Ми не перемогли в цьому протистоянні й не поклали йому край — ми перечекали його. Тепер нова доба покаже, чого варте було наше терпіння."
  battle_for_the_strait_events.5.option_cas: "Цю працю візьмуть на себе наші нащадки."
  battle_for_the_strait_events.5.option_mor: "Коли настане час, заклик пролунає знову."
  battle_for_the_strait_events.5.option_gra: "Ми стійко терпимо примхи долі."
  battle_for_the_strait_concludes_tt: "[ShowSituationName('battle_for_the_strait')] добігає кінця"
  enable_extra_modifier_crown_castile_reform_tt: "Наша [Concept('government_reform', 'державна реформа')|e] «[ShowGovernmentReformName('crown_castile_reform')]» стане дієвішою"
  bfts_dominate_iberia_golden_century_tt: "Стає доступним [Concept('decision', 'рішення')|e] «$gc_decision.title$», що розпочинає [Concept('situation', 'ситуацію')|e] «[ShowSituationName('golden_century')]»"
  battle_for_the_strait_events.21.title: "Андалусці повертаються додому"
  battle_for_the_strait_events.21.desc: "Торговими шляхами та через рідних до мудехарів #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! доходить звістка: ми готові прийняти в [ROOT.GetCountry.Custom('rank_ua_PREP')|l] тих, хто згоден жити за нашими законами, і надати їм захист. З провінції [target_province_origin.GetName], де вже двадцять років #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалуські#!#! родини терплять владу #TOOLTIP:RELIGIONGROUP,christian,X #L християн#!#!, до кордону починають стікатися численні валки.\n\nЗ собою ці люди везуть молитовники, ключі від домівок, які, можливо, більше ніколи не побачать, і рекомендаційні листи до наших купців. За кілька місяців [target_province_destination.GetName] стане їм домівкою, і вони наново облаштовуватимуть зруйноване Реконкістою життя."
  battle_for_the_strait_events.21.a: "Ми приймемо вчених."
  battle_for_the_strait_events.21.historical_info: "Від арабського слова #italic «мудаджан»#! («ті, кому дозволено залишитися») походить арагонське та кастильське «мудехар» — так називали мусульман, яким дозволили залишитися на своїх землях після великих завоювань XIII століття. Землероби, ремісники та вчені — жителі міст, що простягалися від Тахо до Ебро, — продовжували жити, працювати й молитися там, де жили, працювали й молилися їхні пращури, нехай навіть над міськими соборами вже височіли хрести.\n\nАле становище мудехарів було хитким: їх повсякчас виганяли, обкладали непосильними податками й змушували приймати християнство, приневолюючи покидати рідні краї. Хвилі переселенців сунули на південь, до останньої мусульманської держави колишнього Аль-Андалусу. Насрідські еміри поводилися щедро: вони роздавали біженцям землю та обіцяли змогу жити за ісламським законом. Кожна нова така хвиля не лише нагадувала жителям Гранади про загиблі #italic тайфи#!, а й підживлювала зазіхання емірату на спадщину Аль-Андалусу."
  battle_for_the_strait_events.22.title: "Прибуття шазилійського ордену"
  battle_for_the_strait_events.22.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] зустрічає шазилійських шейхів, які прибули сюди з величних #italic завій#!, що звуться [ShowLocationName('sale')] та [ShowLocationName('tetouan')]. З собою вони привезли рекомендаційні листи; судячи з них, за цими людьми стоїть [GetCountry('MOR').GetGovernment.GetRulerTitle|l] із дому [GetCountry('MOR').GetGovernment.GetRulerOrRegent.GetDynasty.GetName]. Наші гості — освічені люди, звичні до міського життя, а зовсім не містики з пустелі. Вони знаються на законі й пам'ятають #italic «Книгу мудростей»#! Ібн Ата Аллаха, вільно почуваючись як за столом у купців, так і при дворі.\n\nВони прийшли до нас із пропозицією. За нашого сприяння шейхи готові заснувати нову #italic завию#! безпосередньо в [ROOT.GetCountry.Custom('rank_ua_PREP')|l] та використати свої зв’язки по обидва боки протоки на користь нашої країни. Їхня присутність при дворі посилить вплив прибічників #TOOLTIP:SOCIETAL_VALUE,mysticism_vs_jurisprudence,X #L ісламського права#!#! [ROOT.GetCountry.GetReligiousSchool.GetName]. Разом із цим ми заручимося авторитетом святих; цей цінний засіб — один із небагатьох, якому нічого не можуть протиставити #TOOLTIP:RELIGIONGROUP,christian,X #L християнські#!#! країни. Нам належить вирішити, чи виділити їм гроші, і якщо так, то коли та в якому обсязі."
  battle_for_the_strait_events.22.a: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] радо їх прийме."
  battle_for_the_strait_events.22.a.entry: "Двір радо їх прийме."
  battle_for_the_strait_events.22.entry: "$battle_for_the_strait_events.22.title$"
  dmc_arrival_intro: "[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] нашої країни зустрічає людину на ім’я [converted_character.GetName] — [Select_CString(converted_character.IsFemale, 'її', 'його')] на нашу вимогу вида[GetCountry('GRA').Custom('end_vlaloly')] нам [GetCountry('GRA').GetName]. Перед капітулом собору над [Select_CString(converted_character.IsFemale, 'нею', 'ним')] здійснюють обряд хрещення, після чого нове #TOOLTIP:RELIGIONGROUP,christian,X #L християнське#!#! ім’я вносять до церковних книг."
  battle_for_the_strait_events.30.title: "Новонавернений при дворі"
  battle_for_the_strait_events.30.desc_centralization: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] виявляється вельми здібним канцеляристом. Від [Select_CString(converted_character.IsFemale, 'неї', 'нього')] ми дізнаємося, як [GetCountry('GRA').GetAdjectiveWithNoTooltip|l]а влада збирає податки та данину, і ці знання допомагають короні посилювати тиск на вельможні роди, які самі ніколи б не погодилися на подібні заходи."
  battle_for_the_strait_events.30.desc_innovative: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] возить у переметах листи, трактати й розрахункові таблиці — скарбницю #TOOLTIP:LOCATION,cordoba,X #L кордовських#!#! бібліотек. Завдяки цій досі недоступній мові перед нашими вченими відкриваються нові знання."
  battle_for_the_strait_events.30.desc_estate_nobles: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] завдяки своєму знатному походженню посідає в нашій країні високе становище: [actor.GetGovernment.GetEstateName('nobles_estate')] вважа[actor.Custom('nobles_yeyut')] [Select_CString(converted_character.IsFemale, 'її своєю', 'його своїм')]. Старійшини задоволені: новий дім після навернення до іншої віри стає пов’язаним із ними спільними інтересами."
  battle_for_the_strait_events.30.desc_estate_clergy: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] — людина вчена, чому неабияк раді[actor.Custom('clergy_yeyut')] [actor.GetGovernment.GetEstateName('clergy_estate')], до яких [Select_CString(converted_character.IsFemale, 'вона долучилася', 'він долучився')]. [Select_CString(converted_character.IsFemale, 'Її', 'Його')] знання #italic шаріату#! стають украй цінними щоразу, як у стінах собору спалахують суперечки."
  battle_for_the_strait_events.30.desc_estate_burghers: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] воліє жити в торгових містах, серед стану, який гордо зветься «[actor.GetGovernment.GetEstateName('burghers_estate')]». Знання торгових шляхів, які ведуть на південь, до #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#!, відкриває перед [Select_CString(converted_character.IsFemale, 'нею', 'ним')] що завгодно: будь-яку купецьку книгу, будь-який склад."
  battle_for_the_strait_events.30.desc_estate_peasants: "$dmc_arrival_intro$\n\nПри нашому дворі [Select_CString(converted_character.IsFemale, 'їй', 'йому')] вже не здобути того ж становища, яке [Select_CString(converted_character.IsFemale, 'вона посідала', 'він посідав')] по той бік кордону, тож тепер [converted_character.GetNameWithNoTooltip] живе в самісінькому серці нашої країни, там само, де працю[actor.Custom('peasants_yeyut')] пересічн[actor.Custom('peasants_yiaei')] [actor.GetGovernment.GetEstateName('peasants_estate')]."
  battle_for_the_strait_events.30.desc_child_tutor: "$dmc_arrival_intro$\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle|U] призначає [Select_CString(converted_character.IsFemale, 'її наставницею', 'його наставником')] для [Select_CString(actor.GetGovernment.GetHeir.IsFemale, 'нашої спадкоємиці', 'нашого спадкоємця')] на ім’я [actor.GetGovernment.GetHeir.GetName]. Знання, почерпнуті колись у [GetCountry('GRA').Custom('CL_PREP')], [converted_character.GetNameWithNoTooltip] передає дитині-#TOOLTIP:RELIGIONGROUP,christian,X #L християнину#!#!. [Select_CString(actor.GetGovernment.GetHeir.IsFemale, 'Та виявляється здібною ученицею', 'Той виявляється здібним учнем')]: астрономія, рахівництво, мистецтво врядування — усе це засвоюється без зусиль."
  battle_for_the_strait_events.30.desc_administrators: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] одержує посаду при нашій канцелярії, і [Select_CString(converted_character.IsFemale, 'її', 'його')] знання #TOOLTIP:CULTUREGROUP,arabic_group,X #L арабських#!#! торгових книг і торгових шляхів #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! виявляються корисними для наших купців. Шляхетні роди наших міст знаходять по той бік протоки нових торгових партнерів — і нових боржників."
  battle_for_the_strait_events.30.a: "Ця душа принесе чимало користі нашій вірі."
  battle_for_the_strait_events.31.title: "[actor.GetNameWithNoTooltip] нав’язу[actor.Custom('end_yeyut')] [GetCountry('GRA').Custom('CL_DAT')] васалітет"
  battle_for_the_strait_events.31.desc: "Усе вирішено. Віднині [GetCountry('GRA').GetName] — наш васал, і ніякі протести нічого не змінять: угоду надійно скріплено печаткою.\n\nПо той бік протоки все розуміють без зайвих слів: [GetCountry('GRA').GetFlavorRank|l] більше не в змозі самостійно розпоряджатися своєю долею, а номінальним правителям [GetCountry('GRA').Custom('CL_GEN')] тепер доводиться хилити голову там, де нещодавно вони самі віддавали накази. Одні проковтнуть образу і будуть вірно нам служити, інші ж плекатимуть надію колись скинути ярмо. Та хоч як би там було, боротьба за протоку нині складається на нашу користь, і ми маємо намір скористатися цією перевагою."
  battle_for_the_strait_events.31.a: "Проти печатки не піти."
  battle_for_the_strait_events.32.title: "[GetCountry('MOR').GetNameWithNoTooltip] нав’язу[GetCountry('MOR').Custom('end_yeyut')] [GetCountry('GRA').Custom('CL_DAT')] данину"
  battle_for_the_strait_events.32.desc: "Ми домоглися свого: [GetCountry('GRA').GetName] віднині буд[GetCountry('GRA').Custom('end_eut')] сплачувати нам данину. Умови погодили ще до того, як посли іншої сторони встигли висловити протест. Скарбниця [GetCountry('GRA').Custom('rank_ua_GEN')|l] тепер відкрита для наших перевірників, і по той бік протоки вже встигли відчути весь тягар нового становища.\n\n[GetCountry('GRA').GetGovernment.GetEstateName('nobles_estate')|U] [GetCountry('GRA').Custom('CL_GEN')] мовчки підрахову[GetCountry('GRA').Custom('nobles_yeyut')], скільки золота щосезону йтиме на південь. Сьогодні вже не так важливо, чи залишиться [GetCountry('GRA').GetFlavorRank|l] під нашим впливом, чи колись спробує скинути ярмо, — головне, що тривала боротьба за протоку наближається до розв’язки."
  battle_for_the_strait_events.32.a: "Полічимо вміст скарбниці."
  battle_for_the_strait_events.61.title: "[GetCountry('CAS').GetNameWithNoTooltip] відновлю[GetCountry('CAS').Custom('end_yeyut')] парії [GetCountry('GRA').Custom('CL_GEN')]"
  battle_for_the_strait_events.61.desc: "Данину відновлено без жодного удару меча. Наші посли наполягали на своєму в #ONCLICK:COUNTRY,[GetCountry('GRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GRA').GetKey],X [GetCountry('GRA').Custom('CL_PREP')|L]#!#!, доки умови не було підписано, а старі парії знову занесено до сувоїв [GetCountry('GRA').Custom('rank_ua_GEN')].\n\nЩосезону золото йтиме на північ, до нашої скарбниці, а разом із ним — мовчазне розуміння того, що [GetCountry('GRA').GetFlavorRank] утримує престол лише з нашої ласки. [GetCountry('GRA').GetGovernment.GetEstateName('nobles_estate')] [GetCountry('GRA').Custom('CL_GEN')] перерахову[GetCountry('GRA').Custom('nobles_yeyut')] суму і мовч[GetCountry('GRA').Custom('nobles_ytat')]. Нестимуть вони цей тягар чи скинуть його — боротьба за протоку наближається до кінця."
  battle_for_the_strait_events.61.a: "Нехай сувої будуть укладені."
  battle_for_the_strait_events.40.title: "Немов у кайданах"
  battle_for_the_strait_events.40.desc_cas: "Така наша гірка доля: ми живемо під стягом #ONCLICK:COUNTRY,[target_cas_country.GetKey] #TOOLTIP:COUNTRY,[target_cas_country.GetKey],X [target_cas_country.Custom('CL_GEN')|L]#!#!, і долю нашу визначає [target_cas_ruler_regent.GetName]. Останні події та порубіжні сутички спонукали [target_cas_country.Custom('rank_ua_ACC')|l] вимагати від нас нових запевнень у покорі — таких, щоб вони були очевидними для всіх. Їхні посли говорять про дружбу, але хіба можна назвати дружбою вимогу грошей та поступок? Піддатися — означає ще трохи поступитися своїм становищем. Відмовитися — знову накликати на себе гнів їхніх вершників."
  battle_for_the_strait_events.40.desc_mor: "Така наша гірка доля: в очах [target_mor_country.Custom('rank_ua_GEN')|l] ми — не більше ніж молодший партнер. У листах [target_mor_ruler_regent.GetName] з #ONCLICK:COUNTRY,[target_mor_country.GetKey] #TOOLTIP:COUNTRY,[target_mor_country.GetKey],X [target_mor_country.Custom('CL_GEN')|L]#!#! називає нас братами у вірі, але насправді вимагає того ж, що й інший наш сусід: підтвердження нашої покори. Це подається як природний порядок, у якому слабший поступається сильнішому. Їхній флот і золото вже не раз виручали нас, і нам не дадуть забути про це. Прийняти їхні умови — означає ще дужче потрапити під їхній вплив. Відмовити — означає гадати, чи прийде наступний флот на поміч."
  battle_for_the_strait_events.40.a: "Поступимося суверенітетом і дамо запевнення."
  battle_for_the_strait_events.40.b: "Сплатимо гроші їхнім послам."
  battle_for_the_strait_events.40.c: "Ми не слухатимемо їхніх порожніх погроз!"
  battle_for_the_strait_events.41.title: "[Select_CString(target_character_1.IsFemale, 'Честолюбна', 'Честолюбний')] [target_character_1.GetNameWithNoTooltip]"
  battle_for_the_strait_events.41.desc: "[target_character_1.GetName] вже досить довго користується нечуваним авторитетом при нашому дворі. Останні події лише зміцнили [Select_CString(target_character_1.IsFemale, 'її', 'його')] становище: у руках цієї людини сьогодні зосереджено стільки влади, що навіть [target_character_2.GetName] починає побоюватися за свій вплив. Подібні честолюбні прагнення можуть зародитися навіть у найяснішому та найдостойнішому з розумів, а [Select_CString(target_character_1.IsFemale, 'слугу, яка встигла', 'слугу, який встиг')] здобути таку владу, вже не так просто усунути від справ. Якщо нічого не вдіяти, [target_character_1.GetShortNameWithNoTooltip] невдовзі підпорядкує собі всю країну. Але якщо занадто обмежити [Select_CString(target_character_1.IsFemale, 'її', 'його')] у правах, здібн[Select_CString(target_character_1.IsFemale, 'а радниця перетвориться на найлютішого ворога', 'ий радник перетвориться на найлютішого ворога')]."
  battle_for_the_strait_events.41.a: "[target_character_1.GetSheHe|U] чудово справляється!"
  battle_for_the_strait_events.41.b: "[target_character_1.GetShortNameWithNoTooltip], ти [Select_CString(target_character_1.IsFemale, 'звільнена', 'звільнений')]!"
  battle_for_the_strait_events.42.title: "Вантажні потоки"
  battle_for_the_strait_events.42.desc: "За останні кілька століть [target_country.GetName] ста[target_country.Custom('end_vlaloly')] однією з найулюбленіших зупинок для купців, які прибувають з узбережжя #TOOLTIP:REGION,italy_region,X #L Італії#!#! та далекого #TOOLTIP:REGION,sahel_region,X #L Сахелю#!#!. Останнім часом торгівля особливо процвітає, про що свідчать і наші книги: приплив грошей помітно зріс. #TOOLTIP:GOODS,silk,X #L Шовк#!#!, #TOOLTIP:GOODS,sugar,X цукор#! та #TOOLTIP:GOODS,fruit,X #L фрукти#!#! зникають зі складів швидше, ніж писарі встигають вести облік, а [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] не має одностайної думки щодо того, куди краще спрямувати додатковий прибуток. Рішення залишається за нами."
  battle_for_the_strait_events.42.a: "Вкладемо гроші в розбудову."
  battle_for_the_strait_events.42.b: "Підтримуватимемо митців і вчених."
  battle_for_the_strait_events.42.c: "Роздамо гроші люду."
  battle_for_the_strait_events.42.d: "Покладемо гроші до скарбниці."
  battle_for_the_strait_events.42.e: "Покажемо всім, наскільки ми величні та незалежні!"
  battle_for_the_strait_events.43.title: "Наш вплив на [target_gra_country.Custom('CL_ACC')]"
  battle_for_the_strait_events.43.desc: "Боротьба за протоку не вщухає, і [target_gra_country.GetName] — у самісінькому вирі жорстоких та кровопролитних битв. Багатство країни й освіченість її жителів тут скоріше тягар, ніж розрада: [target_gra_country.GetFlavorRank|l] — бажана здобич саме з цих причин. Поки війська ведуть війну, [target_gra_country.GetGovernment.GetRulerTitle|l] приймає дари й послів від обох сторін — кожен намагається задобрити цю людину, щоб заручитися її прихильністю. Якщо комусь із них це вдасться, протока може закритися для нас на ціле покоління. Наш власний вплив необхідно зміцнювати вже зараз, хай навіть ціною добрих стосунків, інакше ми опинимося в руках ворогів."
  battle_for_the_strait_events.43.a: "Потрібно проявити силу."
  battle_for_the_strait_events.43.b: "Не поспішаймо."
  battle_for_the_strait_events.44.title: "Поява ерудита"
  battle_for_the_strait_events.44.desc: "Ні для кого не є таємницею, що [target_gra_country.GetLongName] — країна, славетна своїми великими вченими та мислителями. Яскравий приклад тому — [target_polymath.GetName], неймовірний розум, [Select_CString(target_polymath.IsFemale, 'що походить із', 'виходець із')] #TOOLTIP:ESTATE_TYPE,clergy_estate,X #L духовенства#!#!. [target_polymath.GetHerHis|U] ім’я відоме всюди; про цю людину чули навіть у [target_location.Custom('LR_PREP')|l] [target_location.GetName]. Знає про [Select_CString(target_polymath.IsFemale, 'неї', 'нього')], певна річ, і [ROOT.GetCountry.GetGovernment.GetCourtTitle|l]. Така людина дорожча за будь-яку, навіть найнадійнішу фортецю. Але [Select_CString(target_polymath.IsFemale, 'вона згодна', 'він згоден')] служити [target_root_country.Custom('rank_ua_DAT')|l] лише за однієї умови: ми маємо визнати [target_gra_country.Custom('CL_ACC')] рівною нам суверенною державою…"
  battle_for_the_strait_events.44.a: "[target_polymath.GetSheHe|U] варт[Select_CString(target_polymath.IsFemale, 'а', 'ий')] таких посольських зусиль!"
  battle_for_the_strait_events.44.b: "Покладатимемося на просвітлені [target_root_country.GetAdjectiveWithNoTooltip|l]і уми!"
  battle_for_the_strait_events.44.c: "Ми покладемося на вищість [target_root_country.GetAdjectiveWithNoTooltip|l]их умів!"
  target_polymath_resides_in_target_gra_country: "[target_polymath.GetName] і надалі житиме у [target_location.Custom('LR_PREP')|l] [target_location.GetName]"
  battle_for_the_strait_events.45.title: "Цікавість до віри"
  battle_for_the_strait_events.45.desc: "Які ж прекрасні #TOOLTIP:RELIGIONGROUP,christian,X #L християнські#!#! обряди, ікони та яскраві вбрання священників! Але що означають їхні піснеспіви, їхні священні писання? Як саме вони розуміють божественне?\n\n[target_root_ruler.GetName] останнім часом усе частіше замислюється над цими питаннями. [Select_CString(target_root_ruler.IsFemale, 'Вона почала', 'Він почав')] приймати чужоземних священнослужителів наодинці й допізна зачитуватися їхніми книгами. У [target_root_country.Custom('rank_ua_PREP')|l] до такого ставляться несхвально, і [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] вже напівпошепки вед[ROOT.GetCountry.Custom('clergy_eut')] розмови про те, куди може завести подібна допитливість."
  battle_for_the_strait_events.45.a: "Людині властива допитливість!"
  battle_for_the_strait_events.45.b: "Краще змусимо [Select_CString(target_root_ruler.IsFemale, 'її', 'його')] згадати про інші турботи!"
  battle_for_the_strait_events.46.title: "Наукові прагнення"
  battle_for_the_strait_events.46.desc: "З самого дитинства [target_character.GetName] виявляє глибоку зацікавленість природничими науками. [Select_CString(target_character.IsFemale, 'Її', 'Його')] цікавить геть усе: будова квітів, поведінка бджіл, природа кольору, різні явища — немає такого питання, яке не викликало б у [Select_CString(target_character.IsFemale, 'неї', 'нього')] допитливости. Певна річ, [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] всіляко опікується #italic медресе#! та книгозбірнями — скарбницями знань. Звіздарі й лікарі навряд чи могли мріяти про завзятішого покровителя. Проте кожна година, присвячена їхній праці, — це година, яку можна було б віддати державним справам."
  battle_for_the_strait_events.46.a: "[target_university_location.GetNameWithNoTooltip] — понад усе!"
  battle_for_the_strait_events.46.b: "Священні тексти!"
  battle_for_the_strait_events.46.c: "[target_character.GetShortNameWithNoTooltip] уже не дитина!"
  ruler_will_study_tt: "[target_character.GetShortName] вивчатиме науку…"
  target_character_studies_admin: "…врядування"
  target_character_studies_diplomacy: "…дипломатії"
  target_character_studies_war: "…війни"
  battle_for_the_strait_events.47.title: "[Select_CString(target_character_1.IsFemale, 'Впливова', 'Впливовий')] [target_character_1.GetNameWithNoTooltip]"
  battle_for_the_strait_events.47.desc_a: "Попри хитке й неспокійне становище [ROOT.GetCountry.Custom('rank_ua_GEN')|l], [target_character_1.GetName] врядує розважливо та вміло; завдяки [Select_CString(target_character_1.IsFemale, 'її', 'його')] старанням ми й надалі зберігаємо незалежність. Правити країною, затиснутою з двох боків зажерливими ворогами, нелегко, але [target_character_1.GetShortNameWithNoTooltip] зберігає твердість духу на заздрість і друзям, і недругам. Ми не станемо коритися чужій волі, і наша державність — головне тому свідчення."
  battle_for_the_strait_events.47.desc_b: "Розважливо припускати, що державна служба — доля людей чесних і сумлінних, а служіння народові має бути головним покликанням особи, що обіймає настільки високу посаду, як [target_character_1.GetName].\nАле насправді все зовсім інакше. Для таких людей, як [target_character_2.GetName], [target_character_1.GetShortNameWithNoTooltip] — гірше скалки: [Select_CString(target_character_1.IsFemale, 'вона', 'він')] ніколи не проминає нагоди набити собі кишеню нашим коштом, охоче продаючи посади та надаючи послуги за гроші. Прохачі, яким нема чим заплатити, змушені йти ні з чим. Ми не можемо дозволити собі чиновника, який передусім дбає про власну кишеню."
  battle_for_the_strait_events.47.a: "Блискучий приклад!"
  battle_for_the_strait_events.47.b: "Як хробак у компостній ямі…"
  battle_for_the_strait_events.50.entry: "Повчальна історія Абу Абдалли ібн аль-Хакіма аль-Рунді"
  battle_for_the_strait_events.50.title: "[target_dead_guy.GetShortNameWithNoTooltip]: повчальна історія"
  battle_for_the_strait_events.50.desc: "[ROOT.GetCountry.Custom('GetHeadOfCabinetName')|U] [target_dead_guy.GetName] уже давно [Select_CString(target_dead_guy.IsFemale, 'померла', 'помер')], але літописці й досі не проминають нагоди навести за приклад історію цієї людини. Колись [Select_CString(target_dead_guy.IsFemale, 'вона володіла', 'він володів')] обома державними печатками і [Select_CString(target_dead_guy.IsFemale, 'правила', 'правив')] країною замість наших пращурів. Усе закінчилося, коли місто повстало проти [Select_CString(target_dead_guy.IsFemale, 'неї', 'нього')]: розлючений натовп удерся до палацу, убив [Select_CString(target_dead_guy.IsFemale, 'її', 'його')] і поглумився над тілом, щоб нічого було ховати. Схоже, [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] незабаром побачить повторення цієї історії: [target_character.GetName] [Select_CString(target_character.IsFemale, 'зосередила', 'зосередив')] у своїх руках усю державну владу, і [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] почина[ROOT.GetCountry.Custom('nobles_yeyut')] перешіптуватися: не можна, щоб слуги опинялися так близько до престолу. Ми можемо або нічого не чинити, і тоді [target_character.GetShortNameWithNoTooltip] і надалі підтримуватиме усталений лад, або розпустити раду, доки та не увійшла в смак і не почала правити країною без нас."
  battle_for_the_strait_events.50.a: "Нам потрібно більше таких людей, як [target_character.GetShortNameWithNoTooltip]."
  battle_for_the_strait_events.50.a.entry: "Нам потрібно більше таких людей, як він."
  battle_for_the_strait_events.50.b: "Розлючений натовп? Краще не треба."
  battle_for_the_strait_events.50.c: "Не втручатимемося в події."
  status_quo_preserved_tt: "#italic Усе залишиться як є#!"
  battle_for_the_strait_events.50.historical_info: "Абу Абдалла ібн аль-Хакім аль-Рунді, що народився в Ронді у 1261 році, зробив кар’єру при насрідській канцелярії та згодом став найвпливовішим візиром султана Мухаммада III. З 1303 року він мав рідкісний титул #italic «дху аль-візаратайн»#! — «володар двох візиратів». Він вів перемовини під час укладання Кордовського договору, керував взяттям Сеути у 1306 році, а під кінець правління багато хто вже вважав його фактичним володарем емірату.\n\nАле така могутність виявилася недовговічною. Під час палацового перевороту в березні 1309 року воєначальник Атік ібн аль-Мауль убив його й наказав викинути тіло, яке згодом так і не знайшли. Історія стрімкого злету та падіння аль-Рунді стала пересторогою для інших: чиновник, що став впливовішим за володаря, рано чи пізно перетворюється на загрозу."
  battle_for_the_strait_events.51.entry: "$battle_for_the_strait_events.51.title$"
  battle_for_the_strait_events.51.title: "Дім наук"
  battle_for_the_strait_events.51.desc: "Наші вчені давно домагаються заснування у [target_location.Custom('LR_PREP')|l] [target_location.GetName] #TOOLTIP:BUILDING_TYPE,great_madrasa,X #L великого медресе#!#! — закладу, де, подібно до величних міст Сходу, сотні учнів старанно вивчатимуть право. [target_character.GetName] має засоби, достатні, щоб звести медресе поруч із головною мечеттю, куди сходяться юрми вірян. Такий навчальний заклад допоможе залучити до країни нових учнів та правознавців, що живуть по той бік протоки, а [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] пожинатиме плоди їхньої праці."
  battle_for_the_strait_events.51.a: "Зведемо велике медресе поруч із головною мечеттю."
  battle_for_the_strait_events.51.b: "Для нашої скарбниці це завеликий тягар."
  battle_for_the_strait_events.51.historical_info: "У 1349 році поруч із головною мечеттю Гранади, там, де нині стоїть собор, за наказом султана Юсуфа I збудували гранадське медресе — #italic «мадраса юсуфія»#!. Тут викладали #italic малікітське#! право, а саме медресе стало головним навчальним закладом емірату, що не поступався славетним школам Феса та Каїра.\n\nЙого численні випускники поповнювали лави правознавців і писарів насрідської канцелярії. До наших днів від медресе — колись інтелектуального осередку емірату — збереглася лише молитовна кімната."
  wont_have_another_chance_to_build_tt: "#italic Нам більше не випаде нагоди здобути такі переваги#!"
  battle_for_the_strait_events.52.entry: "$battle_for_the_strait_events.52.title$"
  battle_for_the_strait_events.52.title: "Зала послів"
  battle_for_the_strait_events.52.desc: "[target_character.GetName] збирається звести у величній #italic калахуррі#! нашого палацу тронну залу для гідного прийому закордонних послів. Кедрова стеля зали буде прикрашена неймовірно майстерним різьбленням із зображенням семи небес, розташованим просто над престолом: так кожен посол на власні очі побачить, якому ладу він підкоряється. Проте цей задум стане скарбниці в чималу копійку, хай навіть така пишність і промовить про [target_location.Custom('LR_ACC')|l] [target_location.GetName] яскравіше за будь-який лист."
  battle_for_the_strait_events.52.a: "Збудуємо цю залу та розмістимо в ній наш престол."
  battle_for_the_strait_events.52.b: "Наші посли й без цього зможуть вести перемовини."
  battle_for_the_strait_events.52.historical_info: "У середині XIV століття за наказом Юсуфа I в замку Комарес звели тронну залу — Залу послів, яка й понині є найбільшим покоєм Альгамбри. Саме в цих величних стінах насрідські султани приймали чужоземних послів.\n\nНа купольній кедровій стелі, зібраній із тисяч з’єднаних між собою частин, зображено сім небес — так в ісламі за звичаєм уявляли будову світу. Престол стоїть просто під божественною вершиною. У дереві та ліпнині втілилися невимовлені слова: емір править на землі з волі самих небес."
  battle_for_the_strait_events.53.entry: "$battle_for_the_strait_events.53.title$"
  battle_for_the_strait_events.53.title: "Новий караван-сарай"
  battle_for_the_strait_events.53.desc: "Купці, що прибувають на наші ринки, давно потребують справжнього #TOOLTIP:BUILDING_TYPE,funduq,X #L фундука#!#! — укріпленого гостинного двору, де торгівці могли б зупинитися на ніч і не побоюватися за свій крам, замкнений під надійною охороною. [target_character.GetName] уже [Select_CString(target_character.IsFemale, 'відвела', 'відвів')] під нього місце поруч із #TOOLTIP:GOODS,silk,X #L шовковим#!#! ринком [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Особливо наполегливі в цьому #TOOLTIP:CULTUREGROUP,italian_group,X #L італійські#!#! купці: на їхню частку припадає значна частина нашої торгівлі, тож убезпечивши їхній крам, ми водночас забезпечимо й приплив митних зборів."
  battle_for_the_strait_events.53.a: "Збудуємо фундук — нехай торгівля йде крізь нього."
  battle_for_the_strait_events.53.historical_info: "#italic Аль-фундук аль-Джадіда#! (кастильською «Корраль-дель-Карбон») — єдиний насрідський караван-сарай, що зберігся в Іберії; перші писемні згадки про нього датуються XIV століттям. Ця споруда, що належала дружинам насрідських султанів, стояла поруч із #italic алькайсерією#! — критими шовковими рядами Гранади. Тут зберігали збіжжя та зупинялися на нічліг купці.\n\nЗначна частка торгівлі зосереджувалася в руках чужинців, здебільшого генуезьких купців та лихварів: їх вабили сюди шовк і золото, що надходили із Сахари. Один із міських ринків у народі звали просто: «генуезька альондіґа»."
  battle_for_the_strait_events.54.entry: "$battle_for_the_strait_events.54.title$"
  battle_for_the_strait_events.54.title: "Трактат про заразну недугу"
  battle_for_the_strait_events.54.desc: "Один із найясніших умів на службі нашої країни — [target_character.GetName] — подає нам трактат, що викликав щире здивування у лікарів. Усупереч панівним у нашу добу поглядам [target_character.GetShortNameWithNoTooltip] твердить, що мор переходить від недужих до здорових через одяг і посуд, а також у тісноті, як-от на палубі корабля. Ба більше, місто буцімто можна вберегти від зарази, якщо відокремити хворих і вжити пересторог. Духовенство вважає такі роздуми зухвалим зазіханням на божественну волю, але, можливо, ця порада допоможе нам відвернути новий спалах."
  battle_for_the_strait_events.54.a: "Застосуємо цю пораду на ділі й виділимо кошти на працю."
  battle_for_the_strait_events.54.b: "Нічого страшного, це звичайний кашель!"
  hospitals_benefit_tt: "Якщо в нас є [Concept('buildings', 'споруди')|e] виду «[ShowBuildingTypeName('hospital')]», [Concept('locations', 'місцевості')|e], де вони розташовані, отримають користь від [Concept('modifier', 'модифікатора')|e] «[ShowModifier('contagion_practices_modifier')]»"
  battle_for_the_strait_events.54.historical_info: "Близько 1362 року гранадський візир і вчений Ібн аль-Хатіб написав #italic «Мукні’ат аль-Са’іль»#! — трактат про велику чуму, яка спустошила Середземномор’я десятьма роками раніше. Він доводив, що недуга переходить від людини до людини через одяг, посуд і вогнища зарази, як-от гавані, а відокремлення недужих допомагає стримувати її поширення.\n\nЦі погляди суперечили тогочасному панівному вченню, яке стверджувало, що будь-яка моровиця приходить із волі Бога. Рукопис аль-Хатіба — рідкісне свідчення середньовічних думок про те, що згодом назвуть карантином, — зберігся у книгозбірні Ескоріала."
  battle_for_the_strait_events.55.entry: "Посольство до Каїра"
  battle_for_the_strait_events.55.title: "Посольство до [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]"
  battle_for_the_strait_events.55.desc: "Не маючи сил терпіти тиск на рубежах, [target_gra_ruler.GetName] звертає погляд на схід, до єдиного володаря, здатного зібрати ціле військо в ім’я віри. У [target_location.Custom('LR_PREP')|l] [target_location.GetName] править [target_mam_country.GetGovernment.GetRulerTitle|l] #ONCLICK:COUNTRY,[target_mam_country.GetKey] #TOOLTIP:COUNTRY,[target_mam_country.GetKey],X [target_mam_country.Custom('CL_GEN')|L]#!#!. Цей правитель — охоронець святих міст, покровитель халіфа, наймогутніший володар #TOOLTIP:RELIGION,$sunni_tt$,X #L сунітського#!#! світу. Спорядження посольства морем — крок небезпечний і коштовний, і годі знати, що дістанемо у відповідь: вояків, золото чи лише слова розради. Проте ліпше благати про поміч і не знайти її, ніж сидіти склавши руки."
  battle_for_the_strait_events.55.a: "Відрядимо заморське посольство до [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip]."
  battle_for_the_strait_events.55.a.entry: "Відрядимо заморське посольство до Каїра."
  battle_for_the_strait_events.55.b: "Ми самі згуртуємо вірян і самотужки дамо відсіч."
  battle_for_the_strait_events.55.historical_info: "Коли в середині XIV століття Кастилія посилила натиск на Гранаду, насрідський двір спорядив посольство до Каїра — столиці Мамлюцького султанату, володарів Мекки та Медини й опікунів номінальних аббасидських халіфів. У мамлюках гранадські посли сподівалися знайти союзників за сунітською вірою.\n\nУтім ті, зв’язані захистом власних рубежів і відділені від Гранади морем, війська так і не вислали, обмежившись молитвою за перемогу та запевненнями у підтримці одновірців. Листування між Гранадою та Каїром дійшло до нас у збірці листів Ібн аль-Хатіба — #italic «Райханат аль-Куттаб»#!."
  battle_for_the_strait_events.56.title: "Благання із заходу"
  battle_for_the_strait_events.56.desc: "Наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] приймає виснажених далекою дорогою послів із #ONCLICK:COUNTRY,[target_gra_country.GetKey] #TOOLTIP:COUNTRY,[target_gra_country.GetKey],X [target_gra_country.Custom('CL_GEN')|L]#!#! — останньої #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманської#!#! країни Заходу, яку нині безжально тіснять християнські королі. Вони запитують, яку поміч здатен надати охоронець святих міст. Але від знедолених братів у вірі нас відділяє море, та й на наших власних кордонах зараз неспокійно. І все ж на нашу відповідь чекають усі правовірні без винятку. Свідчення, яке почує [target_gra_ruler.GetName], надовго збережуть нащадки."
  battle_for_the_strait_events.56.a: "Ми — одновірці. Приєднаймося до їхньої справи."
  battle_for_the_strait_events.56.b: "Надішлемо їм стільки вояків і золота, скільки подужаємо, але не більше."
  battle_for_the_strait_events.56.c: "Ми не станемо давати їм вояків, але можемо помолитися за них."
  gra_gets_nothing_tt: "Посли #ONCLICK:COUNTRY,[target_gra_country.GetKey] #TOOLTIP:COUNTRY,[target_gra_country.GetKey],X [target_gra_country.Custom('CL_GEN')|L]#!#! повертаються додому, отримавши найкращі побажання"
  may_give_alliance_military_eco_or_no_help: "Влада [target_mam_country.Custom('longname_ua_GEN')] може надіслати або не надіслати нам поміч"
  alliance_better_chance_at_good_results_tt: "Оскільки ми уклали [Concept('alliance', 'союз')|e], ймовірність того, що нас вислухають, вища"
  battle_for_the_strait_events.60.title: "Меч і хрест"
  battle_for_the_strait_events.60.entry: "$battle_for_the_strait_events.60.title$"
  battle_for_the_strait_events.60.desc: "Війна за протоку надто затягнулася. [target_ruler.GetName] збирається звернутися по поміч до братів духовно-лицарських орденів — їхні командорства простяглися вздовж кордону саме на такий випадок. Можна покликати їх у повному складі, але тоді ми ризикуємо накликати на себе невдоволення братів: вони будуть змушені витрачати сили й власні кошти на війну, яку розв’яза[ROOT.GetCountry.Custom('crown_vlaloly')] [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], хоча, безперечно, битимуться із запалом та завзяттям. Можна попросити про обмежену поміч, щоб частково зберегти їхню прихильність, або ж і зовсім продовжити воювати власними силами."
  battle_for_the_strait_events.60.a: "Повністю закличемо ордени."
  battle_for_the_strait_events.60.b: "Достатньо буде мінімальної їхньої участи."
  battle_for_the_strait_events.60.c: "Не звертатимемося до орденів — у них і так вистачає турбот."
  battle_for_the_strait_events.6.title: "Кордону більше немає"
  battle_for_the_strait_events.6.entry: "$battle_for_the_strait_events.6.title$"
  battle_for_the_strait_events.6.desc: "Війна скінчилася, і в #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! не залишилося жодного мавра, з яким можна було б битися.\n\nЦе скрута, якої ніхто не передбачав. Наші військові ордени утримують замки вздовж кордону, якого більше не існує, охороняють перевали в землях, що нині належать нам, і збирають податки з провінцій, які ми віддали їм для захисту. Це найкращі вояки, яких ми маємо, і цього року вони вперше залишилися без війни.\n\nМагістри розуміють це раніше за нас. Вони вже пишуть, питаючи, якими є наші наміри."
  battle_for_the_strait_events.6.a: "Поставити їх на службу #TOOLTIP:ESTATE_TYPE,crown_estate,X #L короні#!#!."
  battle_for_the_strait_events.6.b: "Відрядити їх за море."
  battle_for_the_strait_events.6.c: "Дозволити їм самим знайти своє призначення."
  bfts_orders_sent_overseas_tt: "У подальших подіях буде враховано, що ми відрядили наші [Concept('religious_orders', 'духовні ордени')|e] за море"
  bfts_orders_given_new_purpose_tt: "Кожен $iberian_military_order_type$ у нашій країні назавжди стає $zeal_imperial_purpose$, підвищуючи цільове значення [Concept('zeal', 'ревности')|e]"
  battle_for_the_strait_events.8.title: "Брати, що не повернулися"
  battle_for_the_strait_events.8.entry: "$battle_for_the_strait_events.8.title$"
  battle_for_the_strait_events.8.desc: "Колона [target_order.GetName] потрапила в засідку на перетятій місцевості — ворог мав перевагу і за становищем, і за числом бійців, і загін тримався доти, доки тримати оборону стало вже нікому.\n\nУцілілі опинилися в руках ворога, і за них призначено викуп. Сума чимала: супротивник чудово знає, кого захопив — не ополченців, а повноправних братів ордену, який ще ніколи не кидав своїх людей гнити в неволі.\n\nМагістр не просив у нас грошей. Він старанно уникав цього прохання. У цьому й полягає прохання."
  battle_for_the_strait_events.8.a: "Сплатити викуп. Їх не кинуть."
  battle_for_the_strait_events.8.b: "Вони склали обітниці, знаючи про ризик."
  battle_for_the_strait_events.8.c: "Викупу не буде, але вони можуть набирати людей з нашого ополчення."
  bfts_orders_left_to_decline_tt: "Кожен $iberian_military_order_type$ у нашій країні утримує цільове значення [Concept('zeal', 'ревности')|e] зниженим на $zeal_no_heathen_threat$"
  cas_retaliate_with_raids_tt: "[target_cas_country.GetName] мож[target_cas_country.Custom('end_eut')] здійснювати набіги у відповідь на належні нам [target_cas_country.GetAdjectiveWithNoTooltip|l]і [Concept('locations', 'місцевості')|e], тим самим зменшуючи наше [Concept('prosperity', 'процвітання')|e]"
  mor_retaliate_with_raids_tt: "[target_mor_country.GetName] мож[target_mor_country.Custom('end_eut')] здійснювати набіги у відповідь на належні нам [target_mor_country.GetAdjectiveWithNoTooltip|l]і [Concept('locations', 'місцевості')|e], тим самим зменшуючи наше [Concept('prosperity', 'процвітання')|e]"