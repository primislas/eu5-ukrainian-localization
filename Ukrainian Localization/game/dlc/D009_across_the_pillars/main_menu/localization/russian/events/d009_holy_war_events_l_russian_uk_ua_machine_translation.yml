l_russian:
  holy_war.11.title: "Нападники в порубіжжі"
  holy_war.11.desc: "[cabalgada_raider.GetName] — ось яке ймення згадуватимуть зі страхом! Звідси розбійницька кіннота вчинила #italic кабальгаду#! на наше порубіжжя. Вершники спалили села, забрали все, що змогли захопити, і, перш ніж ми встигли відповісти, відійшли назад за кордон. Наші беззахисні землі розграбовано, і тепер треба вирішити, що робити: скликати ополчення, щоб зміцнити оборону, чи залишити цю ганьбу без відповіді?"
  holy_war.11.a: "Скличемо ополчення на кордоні!"
  holy_war.11.b: "Нам лишається тільки терпіти."
  holy_war.12.title: "Вимога данини"
  holy_war.12.desc: "До нашого двору прибувають посли з #ONCLICK:COUNTRY,[parias_demander.GetKey] #TOOLTIP:COUNTRY,[parias_demander.GetKey],X [parias_demander.Custom('CL_GEN')|L]#!#!. Вони везуть недвозначну звістку: проти нас збирається [threatening_crusade.GetName], і, якщо ми не сплатимо данину, на наших землях опиниться вороже військо. Радники застерігають: золото лише відтермінує неминуче. Воно може ненадовго остудити їхній запал, але не вгамує жаги війни. Заплатити й відтягнути розплату чи кинути їм виклик і готуватися до удару?"
  holy_war.12.a: "Сплатимо данину і виграємо трохи часу."
  holy_war.12.a.tt: "Підготовка [Concept('crusade', 'хрестового походу')|e] відсувається назад на #G 30#!, а його ревність у вірі зменшується на #G 10#!"
  holy_war.12.b: "Нас не залякати. Нехай ідуть."
  holy_war.12.b.tt: "Збільшує ревність у вірі [Concept('crusade', 'хрестового походу')|e] на #R 10#!"
  holy_war.13.title: "Невірні платять"
  holy_war.13.desc: "Наша вимога принесла плоди. [parias_payer.GetName] виплати[parias_payer.Custom('end_vlaloly')] данину, аби лише не зустріти [threatening_crusade.GetName] непідготовленими. Їхнє золото наповнює нашу скарбницю, але їхнє відтермінування — лише відстрочка, не більше. Священну війну лише відкладено."
  holy_war.13.a: "Їхнє золото послужить святій справі."
  holy_war.13.a.tt: "Вони сплатили данину"
  holy_war.14.title: "Невірні кидають нам виклик"
  holy_war.14.desc: "[parias_payer.GetName] відкинули нашу вимогу про данину й обрали непокору. Їхнє зухвальство лише зміцнило рішучість вірних, і завзяття [threatening_crusade.GetName] розгоряється від цього ще палкіше."
  holy_war.14.a: "Тоді відповість меч."
  holy_war.14.a.tt: "Вони відмовилися платити данину"
  holy_war.15.title: "Південні нападники"
  holy_war.15.desc: "[ghazw_raider.GetName] — ось яке ймення згадуватимуть зі страхом! Звідси розбійницька кіннота вчинила #italic газават#! на наше порубіжжя. Вершники спалили села, забрали все, що змогли захопити, і, перш ніж ми встигли відповісти, відійшли назад за кордон. Наші беззахисні землі розграбовано, і тепер треба вирішити, що робити: скликати ополчення, щоб зміцнити оборону, чи залишити цю ганьбу без відповіді?"
  holy_war.15.a: "Скличемо ополчення на кордоні!"
  holy_war.15.b: "Нам лишається тільки терпіти."
  holy_war.16.title: "Морські нападники"
  holy_war.16.desc: "Пірати з #ONCLICK:COUNTRY,[shore_raider.GetKey] #TOOLTIP:COUNTRY,[shore_raider.GetKey],X [shore_raider.Custom('CL_GEN')|L]#!#! вчинили напад на наше узбережжя. Вони розграбували гавані, закували місцевий люд у кайдани і стрімко зникли за небокраєм, забравши невільників із собою. Наші беззахисні береги розорено, і тепер треба вирішити, що робити: скликати ополчення, щоб зміцнити оборону, чи залишити цю ганьбу без відповіді?"
  holy_war.16.a: "Скличемо ополчення на узбережжі!"
  holy_war.16.b: "Нам лишається тільки терпіти."
  d009_holy_war.1.title: "Відповідь орденів"
  d009_holy_war.1.desc: "Заклик розіслано військовим орденам, і брати збирають військо."
  d009_holy_war.1.desc_santiago: "[summoned_order.GetName] дав відповідь, і дав її на повну силу. Його брати йшли дорогою колоною — вісімсот списів під знаменом із черепашкою — і стали табором, не чекаючи вказівок, де саме. [summoned_order.GetNameWithNoTooltip] веде цю війну вже двісті років, і магістру не треба пояснювати перебіг походу.\n\nВін має лише одне питання, ґречно поставлене лиш один-єдиний раз: де орден стане в строю?"
  d009_holy_war.1.desc_calatrava: "[summoned_order.GetName] дав відповідь. Його брати прибули в повному порядку й мовчанні, у білих плащах із червоним хрестом — цистерціанська дисципліна, перенесена на поле бою. Вони стали табором трохи осторонь [ROOT.GetCountry.GetGovernment.GetAdjective|l]ого війська, як велить їхній звичай.\n\nМагістр присутній на наших радах, говорить мало й незмінно має рацію в питаннях місцевости. Він питає, де орден стане в строю."
  d009_holy_war.1.desc_alcantara: "[summoned_order.GetName] дав відповідь, і разом із ним прийшло саме порубіжжя. Це не турнірні лицарі: це люди, які у звичайний рік утримують переправи через Тахо, і вони прибули зі своїми вивідачами, своїми провідниками та власною думкою про ворога.\n\nМагістр питає, де орден стане в строю, тоном людини, яка вже все вирішила."
  d009_holy_war.1.desc_montesa: "[summoned_order.GetName] дав відповідь, хоча це й повело його далі від дому, ніж зазвичай. Його брати залишили свої прибережні вежі під охороною малої залоги та прискакали, щоб приєднатися до нас, і вони розуміють, яку честь нам виявляють.\n\nМагістр питає, де орден стане в строю та як довго, за нашими розрахунками, він нам знадобиться."
  d009_holy_war.1.desc_avis: "[summoned_order.GetName] дав відповідь. Його брати — такою ж мірою політична сила, як і військова, і їхнє прибуття — заява про те, чия це війна.\n\nМагістр питає, де орден стане в строю. Він пильно стежить, чи виявлять їм належну шану у відповіді."
  d009_holy_war.1.desc_christ: "[summoned_order.GetName] дав відповідь, і в цьому є щось невідповідне. Це ті самі брати, що споряджають каравели та сперечаються про широти, а тепер вони з’явилися вглиб суходолу в обладунках, щоб вести облогову війну.\n\nМагістр питає, де орден стане в строю, з виглядом людини, яка нагадує нам, що його орден було засновано саме для цього."
  d009_holy_war.1.a: "Дати їм авангард."
  d009_holy_war.1.b: "Нехай утримають фланг."
  d009_holy_war.2.title: "Буллу даровано"
  d009_holy_war.2.desc: "Булла прибула — скріплена печаткою, вона не лишає сумнівів. #italic Bula de Cruzada#! дарує відпущення гріхів тим, хто жертвує на війну проти невірних, і називає [ROOT.GetCountry.Custom('rank_ua_ACC')|l] знаряддям цієї війни.\n\nНа ділі це дозвіл збирати гроші з усіх наших вірян, парафія за парафією, коли за спиною збирачів стоїть уся влада, яку має [GetUniqueInternationalOrganization('catholic_church').GetName]. Наш[ROOT.GetCountry.Custom('clergy_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] вже делікатно довіду[ROOT.GetCountry.Custom('clergy_yetsayutsa')], хто збиратиме, а хто — лічитиме."
  d009_holy_war.2.a: "Проповідувати її в кожній парафії, а скарбницю тримати нашим людям."
  d009_holy_war.2.b: "Брати лише те, що дано добровільно, і нехай рахує [GetUniqueInternationalOrganization('catholic_church').GetNameWithNoTooltip]."
  d009_holy_war.3.title: "Добровольці віри"
  d009_holy_war.3.desc: "Вони прибувають уже кілька тижнів: газії з гір, студенти #italic медресе#!, братства з міст, які ми ніколи не мали приводу обкладати податком. Одні привели коней. Багато хто не приніс нічого, крім переконаности.\n\nВони не вояки, і командувати ними як вояками не вийде. Але якщо спрямувати їх проти ворога досить швидко, вони варті значно більшого, ніж можна судити з їхнього спорядження."
  d009_holy_war.3.a: "Негайно відрядити їх на північ."
  d009_holy_war.3.b: "Притримати їх і спершу зробити з них вояків."
  d009_holy_war.4.title: "Переправа"
  d009_holy_war.4.desc: "Флот переправив військо, і знамена вже на північному березі.\n\nКожен полководець, який пройшов крізь це, знає просту арифметику: [ShowLocationName('strait_of_gibraltar')] у нас за спиною, флот не може лишатися тут довго, і те, що ми втримаємо за місяць, і буде нашим. Перші дні вирішують долю походу."
  d009_holy_war.4.a: "Вдарити вглиб земель, поки вони ще збирають сили."
  d009_holy_war.4.b: "Спершу закріпитися на узбережжі та в портах."
  d009_holy_war.5.title: "Після ḡазва"
  d009_holy_war.5.desc: "Нападники повернулися за кордон, женучи перед собою худобу та бранців, і вся округа висипала подивитися на їхнє повернення.\n\nТе, що було здобуто, тепер належить розділити, і за поділом стежать куди пильніше, ніж за самим набігом. Ḡазі йшли заради бога [ROOT.GetCountry.GetReligion.GetGodName] і заради здобичі — у тому порядку, який вони воліли б не уточнювати."
  d009_holy_war.5.a: "Здобич належить тим, хто її взяв."
  d009_holy_war.5.b: "Скарбниця бере належну їй п’яту частину."
  d009_holy_war.6.title: "Здобич піратів"
  d009_holy_war.6.desc: "Ескадра повернулася додому з багатим вантажем. [ShowGoodsName('cloth')], монети, церковне начиння та дві сотні бранців з узбережжя, яке вважало себе надто далеким на півночі, щоб туди варто було пливти.\n\nКапітани зійшли на берег і вже витрачають здобуте. #italic Каді#! цікавиться долею бранців, а скарбниця — усім іншим."
  d009_holy_war.6.a: "Взяти за бранців викуп і мати зиск."
  d009_holy_war.6.b: "Оселити їх тут і дати узбережжю дізнатися, куди ми можемо дотягнутися."