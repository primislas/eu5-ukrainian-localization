l_russian:
  d009_mudejar.1.title: "Грамота альхами"
  d009_mudejar.1.entry: "$d009_mudejar.1.title$"
  d009_mudejar.1.desc: "У наших містах #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманські#!#! громади й надалі живуть за давніми порядками, що склалися до Реконкісти: звертаються по правосуддя до каді, дотримуються родових звичаїв, а коли [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] вимага[ROOT.GetCountry.Custom('crown_yeyut')] відповіді, — дають її гуртом замість того, щоб поодинці відповідати перед сеньйором, який вважає їх своїми підданими. Наш[ROOT.GetCountry.Custom('burghers_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] вимага[ROOT.GetCountry.Custom('burghers_yeyut')] закріпити таке самоврядування особливою грамотою, яка перетворить терпимий нині звичай на невіддільне право. Їхній довід простий: альхама, певна у завтрашньому дні, сплачує податки охочіше, ніж та, що нас ненавидить. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|U] ж бач[ROOT.GetCountry.Custom('clergy_ytat')] у таких порядках прикрий виняток і чека[ROOT.GetCountry.Custom('clergy_yeyut')], що [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|l] скасу[ROOT.GetCountry.Custom('crown_eut')] його, а не закріплюватимуть у законі. Ми маємо ухвалити важливе рішення — від нього залежатиме, чи збережеться мусульманське самоврядування на правовій основі, чи воно існуватиме лише доти, доки його терп[ROOT.GetCountry.Custom('crown_ytlyat')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
  d009_mudejar.1.a: "Видамо указ."
  d009_mudejar.1.b: "Відмовимо в праві на самоврядування."
  d009_mudejar.1.b.tt: "Наші мусульманські піддані страждають від того, що [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] пильно нагляда[ROOT.GetCountry.Custom('crown_yeyut')] за ними"
  d009_mudejar.1.historical_info: "Мудехарські громади по всій християнській Іберії зазвичай жили згідно з грамотами, які іноді називали #italic привілеями альхам#!. В обмін на сплату податків і вірність короні вони гарантували громадам можливість більш-менш незалежно вести власні внутрішні справи, зокрема духовні та судові. У різних королівствах ці грамоти значно відрізнялися щедрістю. Протягом XV та XVI століть, коли терпимість корони до ісламу на християнських землях почала слабшати, грамоти поступово втрачали свою силу."
  d009_mudejar.2.title: "Розширення мудехарського подвір’я"
  d009_mudejar.2.entry: "$d009_mudejar.2.title$"
  d009_mudejar.2.desc: "#TOOLTIP:RELIGIONGROUP,muslim,X #L Мусульманське#!#! подвір’я [target_location.Custom('LR_GEN')|l] [target_location.GetName] давно переросло межі, відведені йому кілька поколінь тому. Старі провулки повняться новими майстернями, і дедалі більше родин звертається до влади з проханням дозволити їм селитися й працювати за встановленими межами двору. Вони стверджують, що ремесло, якому не дають розвиватися, приречене на згасання. Наші чиновники розділилися в думках: одні вважають, що з розширенням подвір’я збільшаться й податкові надходження; інші ж застерігають, що якщо один раз піти на поступки, згодом буде важче скасувати це рішення."
  d009_mudejar.2.a: "Підтримаємо розширення подвір’я."
  d009_mudejar.2.b: "Збережемо наявні межі."
  d009_mudejar.3.title: "Капітуляція Гранади"
  d009_mudejar.3.entry: "$d009_mudejar.3.title$"
  d009_mudejar.3.desc: "#TOOLTIP:LOCATION,granada,X #L Гранада#!#! впала. Умови, які [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] нашої країни пропонує її #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманському#!#! люду, надзвичайно щедрі як на будь-якого завойовника: свобода віросповідання, власні суди, право жити за своїми звичаями — і все це закріплено на письмі. Тепер десятки тисяч мусульман, що склали перед нами зброю, непокоїть лише одне питання: чи залишимося ми вірними своєму слову й чи збережемо гарантії, не пішовши на повідку у войовничого двору?"
  d009_mudejar.3.a: "Дотримаємося умов капітуляції."
  d009_mudejar.3.b: "Негайно розпочнемо насадження віри."
  d009_mudejar.3.b.tt: "Мусульманський люд Гранади приголомшений недотриманням обіцянки"
  d009_mudejar.3.historical_info: "Документ про капітуляцію Гранади, підписаний у листопаді 1491 року під час здачі емірату, гарантував гранадським мусульманам свободу віросповідання, право послуговуватися рідною мовою та дотримуватися усталених звичаїв, а також збереження дії мусульманського права під юрисдикцією їхніх власних суддів. На практиці ці гарантії почали поступово втрачати силу майже одразу після завоювання Гранади в 1492 році. Протягом наступного десятиліття вони майже повністю перестали діяти, що зрештою призвело до примусового навернення мусульман до християнства у 1499–1502 роках."
  variable_d009_gra_capitulations_honored_tt: "Дотримання умов капітуляції Гранади"
  d009_mudejar.4.title: "Сіснерос у Гранаді"
  d009_mudejar.4.entry: "$d009_mudejar.4.title$"
  d009_mudejar.4.desc: "До Гранади [Select_CString(target_character.IsFemale, 'прибула', 'прибув')] кардинал [target_character.GetName] — людина, яка з крайньою зневагою ставиться до умов капітуляції, яких заприсяглася дотримуватися наша корона. Попередній архієпископ закликав навертати мусульман поступово, переконанням і проповіддю. [target_character.GetName] натомість надає перевагу іншому засобу — поголовному хрещенню. До купелі ведуть цілі подвір’я, не зважаючи на волю їхніх мешканців. Наш[ROOT.GetCountry.Custom('clergy_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] зустріча[ROOT.GetCountry.Custom('clergy_yeyut')] таке завзяття з великим схваленням. [Select_CString(target_character.IsFemale, 'Сама', 'Сам')] кардинал стверджує, що умови капітуляції були не більше ніж тимчасовою поступкою, продиктованою воєнними обставинами."
  d009_mudejar.4.a: "Схвалимо дії Сіснероса."
  d009_mudejar.4.b: "Стримаємо Сіснероса."
  d009_mudejar.4.historical_info: "Кардинал Франсіско Хіменес де Сіснерос, архієпископ Толедо й духівник королеви Ізабелли, прибув до Гранади в 1499 році. Бувши незадоволеним повільними темпами добровільного навернення до християнства за його попередника Ернандо де Талавери, він розпочав масові примусові хрещення. Ці дії безпосередньо спровокували перше Альпухарське повстання. Історики зазвичай розглядають його вчинки як рішучий розрив з обіцянками, даними під час капітуляції Гранади."
  d009_mudejar.5.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]і мудехари"
  d009_mudejar.5.entry: "Мудехари"
  d009_mudejar.5.desc: "Наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] заслуховує вісті про те, як сусідні #TOOLTIP:RELIGIONGROUP,christian,X #L християнські#!#! країни завершують примусове навернення своїх #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманських#!#! підданих. Дедалі дужче лунають голоси тих, хто вимагає того самого й від нас — навернути до християнства мудехарів [ROOT.GetCountry.Custom('CL_GEN')], які й надалі відкрито сповідують свою віру в #TOOLTIP:AREA,aragon_area,X #L Арагоні#!#! та #TOOLTIP:AREA,valencia_area,X #L Валенсії#!#!. [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|U] заклика[ROOT.GetCountry.Custom('clergy_yeyut')] провести тут такі самі поголовні хрещення, що вже відбулися в інших країнах. Мусульмани у відповідь посилаються на грамоти, даровані їм ще кілька століть тому, які гарантують збереження їхньої віри та звичаїв. [ROOT.GetCountry.GetGovernment.GetRulerTitle|U] не може більше стояти осторонь — треба щось вирішувати."
  d009_mudejar.5.a: "Проведемо масове хрещення."
  d009_mudejar.5.a.tt: "Наші мусульманські громади в #TOOLTIP:AREA,aragon_area,X #L Арагоні#!#! та #TOOLTIP:AREA,valencia_area,X #L Валенсії#!#! примусово навертаються в іншу віру"
  d009_mudejar.5.b: "Звільнимо їх від дії указу."
  d009_mudejar.5.historical_info: "У 1526 році, через кілька десятиліть після примусових хрещень у Кастилії, що тривали у 1500–1502 роках, Карл V наказав примусово навернути в християнство мудехарів, які ще залишалися в Арагоні. На той час повстання херманій у Валенсії вже призвело до масових насильницьких хрещень мусульман із волі повстанців. Арагонська знать, яка значною мірою залежала від праці мусульманських землеробів, багато років опиралася указу, перш ніж усі його приписи почали втілюватися."
  d009_mudejar.6.title: "Мориски та [GetCountry('TUR').GetAdjectiveWithNoTooltip|l]і підступи"
  d009_mudejar.6.entry: "$d009_mudejar.6.title$"
  d009_mudejar.6.desc: "До нашого двору дійшли звістки про таємне листування морисків із людьми [GetCountry('TUR').GetAdjectiveWithNoTooltip|l]ого султана, який зовсім не приховує своєї прихильности до #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульман#!#! #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!, змушених сповідувати свою віру потай. Що стоїть за цим листуванням — змова проти корони чи лише обережні зв’язки людей, які намагаються зберегти віру, якої їм не дозволено триматися відкрито, — достеменно невідомо. Але й самих підозр достатньо, щоб наша рада розділилася в думках."
  d009_mudejar.6.a: "Перервемо їхнє спілкування."
  d009_mudejar.6.a.tt: "Стеження за таємними громадами мусульман відновлюється з новою силою"
  d009_mudejar.6.b: "Нічого не робитимемо."
  d009_mudejar.6.historical_info: "Упродовж XVI століття іспанська влада всерйоз побоювалася зв’язків морисків з османами та берберськими піратами, і не без підстав: перехоплені листи та кілька задокументованих змов, особливо в 1560-х роках, свідчать про те, що принаймні частина громад морисків сподівалася на виступ Османської імперії проти Іспанії. Ці підозри призвели до посилення утисків і, як наслідок, до Альпухарського повстання 1568 року, а згодом — і до видання указу про вигнання морисків у 1609 році."
  d009_mudejar.7.title: "Таємне життя мусульман за інквізиції"
  d009_mudejar.7.entry: "$d009_mudejar.7.title$"
  d009_mudejar.7.desc: "[ShowPolicyName('local_courts')|U] знову розпочинають розслідування проти родин нових #TOOLTIP:RELIGIONGROUP,christian,X #L християн#!#! [target_location.Custom('LR_GEN')|l] [target_location.GetName]. Сусіди, які прагнуть перевершити один одного в доказах своєї благочестивості, звинувачують їх у відправленні таємних обрядів. Чи дійсно цей процес можна назвати викоріненням єресі, або ж це лише спроба посіяти страх серед людей, чиї предки ціле покоління тому полишили #TOOLTIP:RELIGIONGROUP,muslim,X #L іслам#!#!, — питання, що, схоже, не турбує жодного із суддів."
  d009_mudejar.7.a: "Не перешкоджатимемо роботі трибуналу."
  d009_mudejar.7.a.tt: "Населення [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip] виснажене постійними переслідуваннями з боку трибуналу"
  d009_mudejar.7.b: "Обережно попередимо громаду."
  d009_mudejar.7.b.tt: "Населення [target_location.Custom('LR_GEN')|l] [target_location.GetNameWithNoTooltip] раде попередженню"
  d009_mudejar.7.historical_info: "Громади морисків, які формально прийняли християнство, нерідко продовжували потай сповідувати іслам упродовж кількох поколінь. Це явище докладно засвідчене в матеріалах інквізиційних процесів, де описуються найрізноманітніші порушення: від таємних молитов і дотримання релігійних харчових заборон до збереження та передання навичок читання й письма арабською мовою. Переслідування цих громад із боку інквізиції поступово посилювалося протягом XVI століття і стало одним з офіційно оголошених обґрунтувань для ухвалення указу про вигнання морисків у 1609 році."
  d009_mudejar.8.title: "Вирішальне питання: вигнання чи асиміляція?"
  d009_mudejar.8.entry: "$d009_mudejar.8.title$"
  d009_mudejar.8.desc: "Наш[ROOT.GetCountry.Custom('clergy_aei')|l] [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')|l] наполяга[ROOT.GetCountry.Custom('clergy_yeyut')], що #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманські#!#! громади #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! через кілька десятиліть примусового навернення в іншу віру прийняли #TOOLTIP:RELIGIONGROUP,christian,X #L християнство#!#! лише про людське око, а в усьому іншому й надалі сповідують іслам. Сусідні християнські країни вже визначилися з долею цих людей у своїх краях, і наш [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] більше не може відкладати рішення, як вчинити. Необхідно вирішити, чи будуть громади нових християн вигнані під приводом того, що вони — постійна загроза, чи ж із часом поглинуті. Цілком можливо, що є й проміжний шлях."
  d009_mudejar.8.a: "Видамо указ про вигнання."
  d009_mudejar.8.a.tt: "Громади наших таємних мусульман вигнано до портів Магрибу"
  d009_mudejar.8.b: "Започаткуємо програму інтеграції."
  d009_mudejar.8.c: "Проведемо вибіркове вигнання."
  d009_mudejar.8.historical_info: "Указ Філіпа III про вигнання, виданий у 1609 році, що поетапно виконувався аж до 1614 року, зрештою змусив близько 300 000 морисків покинути Іспанію та переселитися до Марокко, Тунісу, Алжиру та інших куточків османського світу. Ця подія стала одним із найбільших випадків примусового переселення населення в історії Європи раннього Нового часу, а її господарські наслідки, особливо втрата вправних хліборобів у Валенсії та Арагоні, відчувалися в окремих краях Іспанії ще протягом кількох поколінь."
  d009_mudejar.9.title: "Останні мориски"
  d009_mudejar.9.entry: "$d009_mudejar.9.title$"
  d009_mudejar.9.desc: "Відійшло покоління, що колись іще нашіптувало молитви #TOOLTIP:LANGUAGE,arabic_language,X #L арабською#!#! мовою за наглухо зачиненими віконницями. Разом із ними пішла в небуття і громада, яка півтора століття залишалася для своїх сусідів ані цілком #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманською#!#!, ані цілком #TOOLTIP:RELIGIONGROUP,christian,X #L християнською#!#!. Від неї збереглася лише жменька прізвищ та кілька старих приписів. Так перегорнулася одна зі сторінок історії #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Мало хто за нею сумуватиме, і ще менше знайдеться тих, хто зможе згадати все так, як воно було насправді."
  d009_mudejar.9.a: "Визнаймо кінець доби."
  d009_mudejar.9.historical_info: "Історики й досі сперечаються про міру втрати морискської самобутности після навернення в християнство чи вигнання. Походження родин, які залишилися й асимілювалися в Іспанії, століттями простежувалося в прізвищах, місцевих назвах та звичаях, тоді як вигнанці, що оселилися в Північній Африці, протягом багатьох поколінь зберігали андалуську самобутність, риси якої і нині простежуються в архітектурі, кухні та музиці таких міст, як Тетуан, Рабат і Туніс."