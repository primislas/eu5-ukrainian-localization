l_russian:
  d009_sephardi_morocco.1.title: "Прибуття #italic мегорашим#!"
  d009_sephardi_morocco.1.entry: "$d009_sephardi_morocco.1.title$"
  d009_sephardi_morocco.1.desc: "Ось уже кілька місяців до наших атлантичних портів прибувають біженці з #ONCLICK:COUNTRY,[origin_country.GetKey] #TOOLTIP:COUNTRY,[origin_country.GetKey],X [origin_country.Custom('CL_GEN')|L]#!#!, які називають себе #italic мегорашим#!, тобто вигнанцями. Вони просять виділити їм подвір’я та надати синагогу для молитов. У #TOOLTIP:LOCATION,fez,X #L Фесі#!#! вже є давня, укорінена #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейська#!#! громада, тошавім, чиї представники не зовсім певні, чи хочуть ділити місто, суди та звичаї з новоприбулими, які говорять іншою мовою та тримаються інших звичаїв."
  d009_sephardi_morocco.1.a: "Привітаємо їх у Фесі."
  d009_sephardi_morocco.1.b: "Нехай не залишають меж Тетуана."
  d009_sephardi_morocco.1.historical_info: "Альгамбрський едикт та його португальський відповідник призвели до вигнання десятків тисяч юдеїв до Магрибу. Ті з них, хто осів у Марокко, назвали себе #italic мегорашим#!, вигнанцями, щоб відмежуватися від #italic тошавім#!, корінних марокканських юдейських громад, які мешкали тут задовго до 1492 року. Ці дві групи здебільшого проживали у Фесі та Тетуані й упродовж багатьох поколінь зберігали окрему самобутність, а подекуди й різні закони."
  d009_sephardi_morocco.2.title: "#italic Мегорашим#! проти #italic тошавім#!"
  d009_sephardi_morocco.2.entry: "$d009_sephardi_morocco.2.title$"
  d009_sephardi_morocco.2.desc: "Два #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейських#!#! суди у #TOOLTIP:LOCATION,fez,X #L Фесі#!#! нарешті зіткнулися між собою. Рабин #italic мегорашим#! наполягає, що їхні [GetCountry('CAS').GetAdjectiveWithNoTooltip|l]і звичаї, перевірені століттями життя в #ONCLICK:COUNTRY,[GetCountry('CAS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('CAS').GetKey],X [GetCountry('CAS').Custom('CL_PREP')|L]#!#!, значно краще пасують для торгівлі та угод, ніж давні обряди #italic тошавім#!. Певна річ, #italic тошавім#! не згодні, і обидві громади звернулися до нас, щоби розв'язати суперечку або бодай перестати вдавати, ніби вона владнається сама собою."
  d009_sephardi_morocco.2.a: "Накинути #italic такканот#! Феса."
  d009_sephardi_morocco.2.b: "Дотримуватися обрядів #italic тошавім#!."
  d009_sephardi_morocco.2.c: "Наполягати на співіснуванні."
  d009_sephardi_morocco.2.historical_info: "Справжні #italic такканот де Фес#! становили збірку громадських постанов, які ухвалювали рабини #italic мегорашим#! з 1494 року. Поступово на їхній основі склався панівний звід законів Феса, натхненних кастильськими нормами. #italic Тошавім#! при цьому нікуди не зникли, і обидві громади впродовж поколінь мали різні синагоги, суди й цвинтарі. Знадобилося понад століття, аби відмінності між ними стерлися, поступившись місцем єдиній феській юдейській громаді."
  d009_sephardi_morocco.3.title: "Місто вигнанців"
  d009_sephardi_morocco.3.entry: "$d009_sephardi_morocco.3.title$"
  d009_sephardi_morocco.3.desc: "Місто [ShowLocationName('tetouan')] десятиліттями лежало в руїнах, доки #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалуські#!#! та #TOOLTIP:CULTURE,$sephardi_tt$,X #L сефардські#!#! вигнанці з #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! не відбудували його спільними силами. Залишена ними спадщина анітрохи не згасла. Вулиці, ремесла та говірка, що лунає в місті, несуть у собі впізнаваний відгомін Іберії, який рідко надибаєш в інших містах цього узбережжя. Ми можемо докласти зусиль до зміцнення цього укладу або сприймати Тетуан просто як чергову гавань."
  d009_sephardi_morocco.3.a: "Підтримаємо сефардський стиль Тетуана."
  d009_sephardi_morocco.3.b: "Це просто ще одне місто."
  d009_sephardi_morocco.3.historical_info: "У XV столітті кастильські війська зруйнували Тетуан. Відбудова міста почалася значно пізніше, водночас із заселенням його вигнаними в 1492 році андалуськими мусульманами та юдеями-сефардами. Тетуан, у якому виник новий юдейсько-іспанський діалект — #italic хакетія#!, упродовж багатьох століть лишався одним із тих марокканських міст, що зберегли виразний відбиток іберійської культури. Юдейський люд Тетуана й досі ревно плекає цей дух."
  d009_sephardi_morocco.4.title: "Придворні юдеї-Саадити"
  d009_sephardi_morocco.4.entry: "$d009_sephardi_morocco.4.title$"
  d009_sephardi_morocco.4.desc: "Сьогодні [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] у #TOOLTIP:LOCATION,marrakesh,X #L Марракеші#!#! приймає в себе гостя на ім'я [target_character.GetName]; [Select_CString(target_character.IsFemale, 'вона', 'він')] — лікар та вчений #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейської#!#! віри. [ROOT.GetCountry.GetGovernment.GetRulerTitle|U] нашої династії походить із роду, що поколіннями користувався послугами юдейських ділків і посередників для укладання угод із #TOOLTIP:RELIGIONGROUP,christian,X #L християнськими#!#! країнами Атлантики, і немає підстав ламати цей звичай; утім, із цим погодиться далеко не кожен придворний урядовець."
  d009_sephardi_morocco.4.a: "Призначимо [target_character.GetHerHim] на придворну посаду."
  d009_sephardi_morocco.4.a.entry: "Призначимо його на придворну посаду."
  d009_sephardi_morocco.4.b: "Будемо покладатися лише на мусульманських купців."
  d009_sephardi_morocco.4.historical_info: "Султани дому Саадитів, серед них і славетний Ахмад аль-Мансур, нерідко зверталися до юдеїв по допомогу у придворних, грошових та посольських справах, зокрема для наведення торгівлі та ведення перемовин з Англією, Голландією та іншими країнами, чиї інтереси сягали Атлантики. Спонукою для цих зв'язків почасти були товари — цукор і селітра, торгівля якими неабияк збагачувала саадитську скарбницю. Ця подія відображає радше загальний уклад двору, аніж життєпис певної історичної постаті."
  d009_sephardi_morocco.5.title: "Викуп бранців"
  d009_sephardi_morocco.5.entry: "$d009_sephardi_morocco.5.title$"
  d009_sephardi_morocco.5.desc: "Після підписання миру з #ONCLICK:COUNTRY,[GetCountry('POR').GetKey] #TOOLTIP:COUNTRY,[GetCountry('POR').GetKey],X [GetCountry('POR').Custom('CL_INST')|L]#!#! у в'язницях #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! лишилося чимало [GetCountry('POR').GetAdjectiveWithNoTooltip|l]их бранців. Наші #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейські#!#! купці — широті чиїх торгових зв'язків по обидва боки протоки позаздрить будь-який урядовець — запропонували своє посередництво під час викупу. Така справа обіцяє великий здобуток, тож чи варто довіряти її людям, на яких [ROOT.GetCountry.GetGovernment.GetCourtTitle|l] і досі поглядає з певною засторогою?"
  d009_sephardi_morocco.5.a: "Здійснити викуп через юдейських посередників."
  d009_sephardi_morocco.5.b: "Викупити бранців лише через ісламських посередників."
  d009_sephardi_morocco.5.historical_info: "У 1578 році Саадити здобули перемогу над португальськими військами при Ель-Ксар-ель-Кебірі (Алькасарквівірі). Добре задокументована роль юдейських купців, що мешкали в Марокко та посприяли викупу полонених португальських шляхтичів і вояків. Для посередників ця угода виявилася вкрай прибутковою, хоч і делікатною з погляду дипломатії: їхні торгові зв’язки охоплювали обидва береги протоки. Ця подія загалом відображає їхню роль у мароккансько-португальських війнах загалом, а не лише після битви 1578 року."
  d009_morocco_has_jewish_pops_tt: "Наші землі — місце проживання юдейських [Concept('pops', 'громад')|e]"
  d009_sephardi_morocco.6.title: "Мелла в Мекнесі"
  d009_sephardi_morocco.6.entry: "$d009_sephardi_morocco.6.title$"
  d009_sephardi_morocco.6.desc: "[Select_CString(target_character.IsFemale, 'Відома', 'Відомий')] у певних колах фінансист[Select_CString(target_character.IsFemale, 'ка', '')] [target_character.GetName] виступає з пропозицією: нехай [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] своїм указом заснує #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейський#!#! квартал безпосередньо в межах #TOOLTIP:LOCATION,meknes,X #L Мекнеса#!#! — із власною хартією, торговими правами та судами. За [Select_CString(target_character.IsFemale, 'її', 'його')] словами, таке рішення повернеться сторицею, адже тоді в новій столиці почнуть оселятися юдейські купці, які сплачуватимуть податки та мита."
  d009_sephardi_morocco.6.a: "Видамо указ."
  d009_sephardi_morocco.6.b: "Столиця — не для юдеїв."
  d009_sephardi_morocco.6.historical_info: "За султана Мулая Ісмаїла місто Мекнес було проголошено столицею імперії. Сам султан — виходець із дому Алауїтів — у справах наповнення скарбниці та ведення торгівлі в Атлантиці покладався на послуги фінансистів-юдеїв, найвідоміший з яких, Йосип Маймаран, серед марокканських юдеїв вважається одним із найважливіших діячів, що будь-коли мали доступ до фінансів Мекнеса. Під час перетворення міста на столицю імперії в ньому було засновано юдейський квартал — меллу."
  d009_sephardi_morocco.7.title: "Пірат-дипломат Шмуель Палаче"
  d009_sephardi_morocco.7.entry: "$d009_sephardi_morocco.7.title$"
  d009_sephardi_morocco.7.desc: "[target_character.GetName] веде подвійне життя: сьогодні ця людина за нашим дорученням обговорює з [GetCountry('HOL').Custom('CL_INST')] торгові привілеї, а завтра на чолі ескадри піратів вчиняє напад на іспанські та [GetCountry('POR').GetAdjectiveWithNoTooltip|l]і кораблі, не маючи на те нашого наказу. [Select_CString(target_character.IsFemale, 'Вона', 'Він')] стверджує, що обидві справи служать одній меті, і з цим годі сперечатися, адже наша скарбниця стрімко повниться."
  d009_sephardi_morocco.7.a: "Наймемо його офіційно."
  d009_sephardi_morocco.7.b: "Нехай і надалі діє з мовчазної згоди."
  d009_sephardi_morocco.7.historical_info: "Шмуель Палаче — марокканський юдей, дипломат, який на початку XVII століття служив послом у Голландії за правління Саадитів. За його посередництва було укладено одну з перших в історії Марокко угод із європейською країною, що мала вихід до Атлантики. До того ж Палаче мав каперські свідоцтва, які давали йому дозвіл грабувати іспанські кораблі. Пірат-дипломат незмінно викликав при європейських дворах збурення самим своїм з’явленням."
  d009_sephardi_morocco.8.title: "[ShowLocationNameWithNoTooltip('tangier')] під [ROOT.GetCountry.GetAdjectiveWithNoTooltip|l]ою владою"
  d009_sephardi_morocco.8.entry: "Танжер під новою владою"
  d009_sephardi_morocco.8.desc: "Нашій короні нині належить не лише #TOOLTIP:LOCATION,tangier,X #L Танжер#!#!: разом із ним ми, несподівано для себе, здобули владу над #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейською#!#! громадою — єдиною в усіх наших володіннях. Ми опинилися у скрутному становищі, оскільки наше королівство вже багато десятиліть не впускає до себе юдейських переселенців. Наша рада розділилася в думках щодо того, як тепер діяти."
  d009_sephardi_morocco.8.a: "Терпітимемо цю громаду."
  d009_sephardi_morocco.8.b: "Вигнати їх!"
  d009_sephardi_morocco.8.b.tt: "Юдейську громаду вигнано з Танжера"
  d009_sephardi_morocco.8.historical_info: "У 1661 році Катерина Браганська вийшла заміж за англійського короля Карла II. Як посаг англійська корона отримала Танжер — місто з невеликою юдейською громадою, на той час єдиною з усіх, що будь-коли перебували під владою англійців: у 1290 році юдеїв вигнали з Англії, і повернутися до країни вони змогли лише в 1656 році."
  d009_sephardi_morocco.9.title: "[ShowLocationNameWithNoTooltip('mogador')]: купці султана"
  d009_sephardi_morocco.9.entry: "$d009_sephardi_morocco.9.title$"
  d009_sephardi_morocco.9.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle|U] нашої країни збирається спорудити новий порт у місцині під назвою [ShowLocationName('mogador')]. Указ уже підписано, і невдовзі на порожньому березі виросте грандіозна споруда, яка, втім, уже викликала осуд: [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] прагне зробити торгівлю в Атлантиці виключним правом дрібки впливових #TOOLTIP:RELIGION,$judaism_tt$,X #L юдейських#!#! родин; натомість вони заприсягнуть на вірність і відкриють доступ до своїх грошей. Купці, які залишилися осторонь, висловили своє ставлення до цього задуму голосно й однозначно."
  d009_sephardi_morocco.9.a: "Надати [Select_CString(CHARACTER.IsFemale, 'їй', 'йому')] монополію!"
  d009_sephardi_morocco.9.b: "Надати всім купцям рівні права на торгівлю."
  d009_sephardi_morocco.9.historical_info: "У 60-х роках XVIII століття султан Мухаммед III заснував портове місто Могадор, що слугувало єдиній меті — торгівлі з Європою та іншими країнами, які мали вихід до Атлантики. За його указом деякі купецькі родини юдеїв, так звані #italic туджар ас-султан#! — «купці султана», здобули виключне право на ведення такої торгівлі та були звільнені від податків. Завдяки цій угоді громада могадорських купців-юдеїв стала однією з найквітучіших у Марокко."
  d009_sephardi_morocco.10.title: "Мелла у Фесі"
  d009_sephardi_morocco.10.entry: "$d009_sephardi_morocco.10.title$"
  d009_sephardi_morocco.10.desc: "#TOOLTIP:RELIGION,$judaism_tt$,X #L Юдейська#!#! громада міста #TOOLTIP:LOCATION,fez,X #L Фес#!#! вже багато десятиліть поспіль, як і будь-яка інша громада, живе розпорошено, не знаючи єдности. Наші урядовці пропонують таке: нехай [ROOT.GetCountry.GetGovernment.GetRulerTitle|l] підпише указ про виділення цим людям окремого обнесеного муром кварталу з власною хартією, ринком і брамою. Прихильники такого підходу стверджують, що діють заради захисту юдеїв, тоді як супротивники добирають значно різкіших слів."
  d009_sephardi_morocco.10.a: "Створити меллу."
  d009_sephardi_morocco.10.a.tt: "Юдейську громаду Феса зібрано в одному обнесеному мурами кварталі"
  d009_sephardi_morocco.10.b: "Нехай живуть вільно."
  d009_sephardi_morocco.10.historical_info: "У 1438 році в місті Фес було збудовано меллу — перший юдейський квартал у Марокко, який послужив зразком для розбудови інших, менших юдейських кварталів по всій країні в наступні століття. Відомості про появу мелли різняться: за одними даними, її зводили задля захисту юдейського люду від надто завзятої фортечної залоги, за іншими — це був перший крок до сегрегації. Насправді вельми ймовірно, що поєдналися обидва чинники."