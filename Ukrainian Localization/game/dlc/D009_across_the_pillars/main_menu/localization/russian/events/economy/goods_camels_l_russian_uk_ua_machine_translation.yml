l_russian:
  goods_camels.1.title: "Великий пустельний караван"
  goods_camels.1.desc: "Купецьке товариство, яке діє в #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.GetKey],X [ROOT.GetCountry.GetCapital.Custom('CL_PREP')|L]#!#!, запропонувало спорядити великий караван, що з’єднав би наші ринки з іншими, розташованими по той бік посушливих земель.\n\nЦя справа обіцяє чималий прибуток, якщо вдасться налагодити торгівлю #TOOLTIP:GOODS,camels,X #L верблюдами#!#! та супутнім крамом, але для охорони шляхів і супроводу знадобиться значна #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]а#! грошова підтримка. Купці налаштовані рішуче — вони лише чекають нашої відповіді."
  goods_camels.1.a: "Підтримаємо цю справу."
  goods_camels.1.b: "Нехай споряджають — але не задарма."
  goods_camels.2.title: "Видатні породи"
  goods_camels.2.desc: "Верблюдоводи у [target_location.Custom('LR_PREP')|l] [target_location.GetName] сповіщають, що після кількох років ретельного добору зуміли вивести породу, яка вирізняється силою, витривалістю та здатністю нести важчі вантажі, залишаючись водночас невибагливою до води.\n\nВ обмін на #L [ROOT.GetCountry.GetGovernment.GetAdjective|l]у#! опіку вони обіцяють подвоїти зусилля й облаштувати особливі пасовища. Проте очільники кінноти пропонують інший підхід: передати найкращих тварин у їхнє відання."
  goods_camels.2.a: "Вкладемо гроші в розведення верблюдів."
  goods_camels.2.b: "Передамо найкращих верблюдів нашим вершникам."
  goods_camels.3.title: "Коли пересихають колодязі"
  goods_camels.3.desc: "Нашу пустелю охопила небувала посуха. Колодязі пересихають, посіви гинуть, а люд тяжко страждає.\n\nУ таких суворих умовах верблюди — єдиний надійний засіб перевезення пустками вантажів, води й людей. Правитель [ROOT.GetCountry.GetGovernment.GetRuler.GetName] роздумує, як ліпше вчинити: залишити стада собі, щоб допомогти люду, чи скористатися слушною нагодою й продати їх зневіреним чужоземним покупцям за завищеними цінами."
  goods_camels.3.a: "Наш люд понад усе."
  goods_camels.3.b: "Продамо стада втридорога, доки є попит."
  goods_camels.4.title: "Шлях прочан"
  goods_camels.4.desc: "Через #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#! прямує безліч прочан до далеких святинь. У пустелі їм конче потрібні верблюди, без яких неможливо перевозити припаси.\n\nПрочани кажуть, що тим, хто допомагає їм у дорозі, воздасться небесне благословення. Наші купці натомість бачать у цьому нагоду добряче заробити на перевезеннях."
  goods_camels.4.a: "Допомагатимемо прочанам задарма."
  goods_camels.4.b: "Стягуватимемо з них плату."
  goods_camels.5.title: "Нападники на каравани"
  goods_camels.5.desc: "На верблюжі каравани, що проходять нашими землями, почали нападати кочові харцизи. Вони вбивають купців, викрадають тварин і зривають торгівлю.\n\nПогоничі караванів вимагають навести лад — інакше вони пустять свої обози в обхід, і їхнє срібло дістанеться іншим. Нам належить вирішити, що робити: взяти на себе значні витрати й залучити військо чи спробувати порозумітися з розбійниками."
  goods_camels.5.a: "Виставимо вздовж шляхів збройну охорону."
  goods_camels.5.b: "Домовимося з розбійниками, щоб ті пропускали каравани."
  goods_camels.6.title: "Пропозиція полководця"
  goods_camels.6.desc: "Найдосвідченіший полководець з-поміж усіх, якими володіє [ROOT.GetCountry.GetGovernment.GetRuler.GetName], пропонує створити в лавах нашого війська верблюжу кінноту.\n\nВін стверджує, що в пустелях верблюди набагато кращі за коней: вони ліпше пристосовані до піску, можуть перевозити більше вантажу і з легкістю витримують умови, де бойові коні гинуть. У цій пропозиції є глузд, але не кожен воєначальник готовий зректися звичної кінноти — адже вона надзвичайно шанована."
  goods_camels.6.a: "Створимо верблюжу кінноту."
  goods_camels.6.b: "Коні нас іще не підводили. Не станемо від них відмовлятися."
  goods_camels.7.title: "Чужоземний попит"
  goods_camels.7.desc: "На наші ринки прибули чужоземні купці, привізши з собою значні суми срібла. Вони хочуть закупити велику партію верблюдів, щоб споряджати воєнні походи та торгові виправи, і готові щедро заплатити.\n\nОднак масовий вивіз верблюдів неминуче вдарить по наших власних заводчиках. До того ж, дехто з радників побоюється, що коли-небудь чужинці можуть кинути верблюжих вершників проти нас."
  goods_camels.7.a: "Торгуватимемо з ними — нам потрібне срібло."
  goods_camels.7.b: "Обмежимо вивіз верблюдів."
  goods_camels.8.title: "Надлишок отар"
  goods_camels.8.desc: "Роки розведення верблюдів призвели до несподіваних труднощів: тварин стало забагато.\n\nРинок перенасичений, ціни обвалилися, а отари виїдають пасовища швидше, ніж пустеля встигає їх відновити. Час діяти. Можна скоротити надлишкове поголів’я та відновити рівновагу або спробувати знайти покупців за кордоном і збути їм надлишок. Але другий шлях вимагатиме чималих витрат і дипломатичних зусиль."
  goods_camels.8.a: "Скоротимо поголів’я. Краще нехай худоби буде менше."
  goods_camels.8.b: "Відрядимо послів на пошуки покупців за кордоном."
  goods_camels.9.title: "Дипломатичний випадок"
  goods_camels.9.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] опиняється у вкрай ніяковому становищі: під час урочистого прийому при дворі [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'її', 'його')] улюблений верблюд, виведений до зали, щоби справити враження на гостей, виявився вельми перебірливим до людей і визнав, що [target_character.GetTitledName|l] із [offended_country.Custom('longname_ua_GEN')] — його особистий ворог. Без жодного попередження тварина вивергла вміст свого шлунка просто на [Select_CString(target_character.IsFemale, 'її', 'його')] церемоніальне вбрання.\n\n[Select_CString(target_character.IsFemale, 'Постраждала', 'Постраждалий')] кипить від люті, а [Select_CString(target_character.IsFemale, 'її', 'його')] почет уже складає листа, в якому має намір заявити протест."
  goods_camels.9.a: "Ми висловлюємо найглибший жаль і підкріплюємо його дарунком зі скарбниці."
  goods_camels.9.b: "Верблюд і справді добре знається на людях."
  goods_camels.10.title: "Змагання верблюжої вроди"
  goods_camels.10.desc: "Знать із #ONCLICK:COUNTRY,[ROOT.GetCountry.GetCapital.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetCapital.GetKey],X [ROOT.GetCountry.GetCapital.Custom('CL_GEN')|L]#!#! влаштувала незвичне, але, за її словами, цілком законне, а головне — таке, що підкреслює красу нашої культури змагання: між собою у вроді змагаються… верблюди. На перемогу тієї чи іншої тварини вже поставлено чималі суми.\n\nТепер дві впливові родини готові посваритися не на жарт: одні вважають, що для породистого верблюда важливіша довга шия, інші віддають перевагу красивому правильному горбу. Правитель [ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'повинна', 'повинен')] розсудити суперечку та винести остаточний вирок. Учасники та їхні верблюди вже зібралися й чекають на рішення."
  goods_camels.10.a: "Правитель зобов’язаний у всьому служити своєму народові."
  goods_camels.10.b: "У мене є важливіші справи."