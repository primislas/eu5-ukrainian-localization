l_russian:
  tali_a_watchtower: "Вартова вежа талаї"
  tali_a_watchtower_desc: "Мурована вежа андалуської берегової сторожі, що слугує водночас спостережним постом і невеликим укріпленням. Такі вежі ланцюгом тягнуться вздовж південного узбережжя; їхні залоги помічають нападників задовго до висадки й утримують берег, доки сигнальні вогнища скликають ополчення з внутрішніх країв."
  thagr_fort: "Фортеця сагр"
  thagr_fort_desc: "Порубіжна фортеця #italic сагр#! — стоїть на рубежах, де наш емірат межує із землями християнських королів. Зведена на вершині пагорба або при дорозі, ця твердиня та її вартові пости збирають мито з усіх караванів, які перетинають наш кордон. Вона стримує наступ християн, позбавляє їхні війська фуражу та води, а також слугує місцем збору та поповнення запасів для наших вершників під час набігів на ворожі терени."
  saqaliba_barracks: "Казарми сакаліба"
  saqaliba_barracks_desc: "Арсенал і плац для #italic сакаліба#!, воїнів-невільників правлячого дому. Тут вони отримують зброю, зберігають порох і клинки, а також збираються на військовий вишкіл. Від цих воріт військо вирушає до кордону, і сюди ж повертаються вербувальники зі свіжим поповненням."
  saqaliba_barracks_maintenance: "Утримання казарм сакаліба"
  EFFECTIVE_SAQALIBA_BARRACKS: "Казарми сакаліба"
  EFFECTIVE_ROYAL_COURT_BUILDINGS: "Діючі споруди «[ShowBuildingTypeName('royal_court')]»"
  qadi_office: "Палата каді"
  qadi_office_desc: "#italic Каді#! — це суддя шаріатського права, чия оселя слугує опертям правосуддя в будь-якому місті правовірних. Призначений зі столиць наших васальних країн, #italic каді#! розв'язує суперечки, посвідчує угоди та розглядає кожну кривду за нормами #italic шаріату#!. Його влада пильнує порядок нашого дому, втихомирює непокірних і зміцнює вірність підданих своєму володарю."
  qadi_office_maintenance: "Утримання каді"
  can_only_be_built_via_qadi_gc_action_tt: "Цю [Concept('building', 'споруду')|e] не можна звести звичним способом. Її можна тільки заснувати в [Concept('capital', 'столиці')|e] [Concept('subject', 'васала')|e] за допомогою [Concept('action', 'доручення')|e] «[ShowGenericActionName('adu_build_qadi_office')]», доступного в [Concept('situation', 'ситуації')|e] «[GetSituationByKey('golden_century').GetName]», коли ми досягнемо #Y 75#! од. [Concept('gc_colonial_dominance', 'колоніального панування')|e]"
  madinat_al_zahra: "Мадінат аз-Захра"
  madinat_al_zahra_desc: "Відома як «Сяйне місто», $madinat_al_zahra$ дасть нам змогу примножити нашу славу в #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!."
  palazzo_ajutamicristo: "Палаццо Аютамікрісто"
  palazzo_ajutamicristo_desc: "Щоб прикрасити другорядний двір в #TOOLTIP:REGION,italy_region,X #L Італії#!#!, спорудження $palazzo_ajutamicristo$ було замовлено як державою, так і купецькими родинами, ставши виявом поваги та багатства."
  italian_court_building: "[ShowCultureGroupNameWithNoTooltip('italian_group')] двір"
  italian_court_building_desc: "Утримуючи двори як у нашій головній країні, так і в #TOOLTIP:REGION,italy_region,X #L Італії#!#!, ми зможемо дієвіше врядувати обома верствами знаті."