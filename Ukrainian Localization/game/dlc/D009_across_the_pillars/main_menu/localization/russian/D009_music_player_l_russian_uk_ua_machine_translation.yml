l_russian:
  musicplayer_sol_moroccan_berma_lalla: "Марокко — Berma Lalla"
  musicplayer_sol_moroccan_berma_lalla_flavour: "Пісня-закликання Лали, однієї з жіночих млюків — духів із пантеону гнауа. Композицію виконує Асмаа Хамзауї та її гурт Bnat Timbouktou — перший жіночий колектив виконавців музики гнауа в Марокко."
  musicplayer_sol_moroccan_boulila: "Марокко — Boulila"
  musicplayer_sol_moroccan_boulila_flavour: "Одна з провідних композицій репертуару гнауа. Її виконують під час ліли — нічного цілющого ритуалу, в якому пісні закликають духів-млюків, нерозривно пов’язаних із певними барвами, пахощами та обрядами."
  musicplayer_sol_moroccan_soyo_soyo: "Марокко — Soyo Soyo"
  musicplayer_sol_moroccan_soyo_soyo_flavour: "Ця композиція передається з покоління в покоління серед майстрів гнауа — від Махмуда Ґінії до гурту Bnat Timbouktou. Її коріння сягає культури західноафриканської діаспори, яка творила музичну спадщину Марокко починаючи з XVI століття."
  musicplayer_sol_castilian_ay_triste_que_vengo: "Кастилія — Ay triste que vengo"
  musicplayer_sol_castilian_ay_triste_que_vengo_flavour: "Ця композиція на вірші з «Cancionero» (1496 р.), пісенної збірки Хуана дель Енсіни, є вільянсіко. Твір наочно показує примарність меж між поезією та піснею при ренесансному дворі герцога Альби."
  musicplayer_sol_castilian_con_amores_la_mi_madre: "Кастилія — Con amores la mi madre"
  musicplayer_sol_castilian_con_amores_la_mi_madre_flavour: "Це вільянсіко було створене при дворі Католицьких королів Іспанії. Воно тримається на межі між любовною піснею доньки та містичною розмовою душі з Дівою Марією."
  musicplayer_sol_castilian_conde_claros: "Кастилія — Conde Claros"
  musicplayer_sol_castilian_conde_claros_flavour: "Оповідь про графа Клароса та принцесу Кларанінью — одна з найвідоміших балад в Іспанії XVI століття. До наших днів цей твір дійшов у вигляді діференсіас (варіацій) для віуели, створених Луїсом де Нарваесом. Колись саме їх співали мандрівні співці сьєґос."
  musicplayer_sol_castilian_falai_minha_amor: "Кастилія — Falai minha amor"
  musicplayer_sol_castilian_falai_minha_amor_flavour: "Ця пісня з першої в історії друкованої збірки для віуели «El Maestro» (1536) написана португальською мовою. Її текст відображає родові зв’язки між Валенсією та Лісабоном і віддає шану королю Португалії Жуану III, який був опікуном композитора."
  musicplayer_sol_castilian_recercada_i_sopra_i_tenori_italiani: "Кастилія — Recercada I sopra i tenori italiani"
  musicplayer_sol_castilian_recercada_i_sopra_i_tenori_italiani_flavour: "Узята з першого в історії посібника з мистецтва орнаментації для альта, ця ресеркада демонструє техніку глосування під час виконання пасамецо антіко — однієї з канонічних італійських гармонічних послідовностей тієї доби."
  musicplayer_sol_castilian_recercada_ii_sobre_l_espagna: "Кастилія — Recercada II sobre l'Espagna"
  musicplayer_sol_castilian_recercada_ii_sobre_l_espagna_flavour: "Ця ресеркада Ортіса з його трактату «Trattato de Glosas» (Рим, 1553 р.) ґрунтується на темі «Ла Спанья» — одній із найвідоміших мелодій доби Відродження. Твір наочно показує мистецтво глосування, себто імпровізованих варіацій на канонічні мелодії."
