l_russian:
  seven_cities_fountain.1.title: "Джерело — це просто джерело"
  seven_cities_fountain.1.desc: "Після двох тижнів у дорозі загін дістався місця, яке провідники-таїно називають водограєм Біміні. На галявині дійсно є джерело: вода в ньому холодна, чиста і трохи пахне сіркою. Люди роблять кілька ковтків — і наступного дня залишаються такими ж, якими були напередодні. Дивовижного омолодження не сталося. Провідника розпитують ще раз, уже ретельніше. Він зізнається, що сам ніколи не пив із джерела, але почув про нього ще дитиною від своєї бабусі, а та, своєю чергою, — від своєї бабусі, коли та була ще дівчинкою. [target_leader.GetName] пише про все це в донесенні й наказує загону повертатися додому."
  seven_cities_fountain.1.a: "Повертаємося назад. Вічної молодости тут не знайти."
  seven_cities_fountain.1.historical_info: "Подорож Хуана Понсе де Леона до Флориди в 1513 році зазвичай пов’язують із пошуками джерела вічної молодости. Утім, цей зв’язок з’явився в іспанських літописах лише після смерти конкістадора. Пізніші історики, які визнали цю захопливу історію вигідною, популяризували її. Насправді ж ця подорож була звичайною розвідувальною виправою. Її спорядили коштом приватного вкладника, який збирався заснувати укріплення для торгівлі невільниками у Флориді, яку тоді вважали островом. Ім’я Понсе де Леона почали пов’язувати з джерелом молодости через те, що він помер не надто старим — на шостому десятку — від рани стрілою, отриманої у Флориді. Іспанські літописці наступного покоління просто не змогли втриматися від кпинів щодо такого збігу обставин."
  seven_cities_fountain.2.title: "Освіжне джерело"
  seven_cities_fountain.2.desc: "Легендарне джерело дійсно існує — щоправда, нічого надприродного в ньому немає. У гаю б’є ключ із надзвичайно чистою водою, температура якої майже не змінюється протягом року. Ковток води з такого джерела наповнює тіло новою силою, що помічає навіть священник, однак ані про омолодження, ані про будь-яке інше диво годі й казати. Місцевий вождь тимукуа розповідає, що це джерело вважають цілющим — вода з нього допомагає від пропасниці та болю в суглобах. Літописець занотовує його розповідь — іспанським лікарям вона напевно стане в пригоді. Ні, джерело виявилося зовсім не таким, як його змальовували перекази, але головне, що воно існує. [target_leader.GetName] наказує звести на цьому місці каплицю."
  seven_cities_fountain.2.a: "Оголосимо джерело власністю Іспанії. Торгівля цілющою водою може бути прибутковою."
  seven_cities_fountain.2.historical_info: "Флорида надзвичайно багата на артезіанські джерела. Тимукуа та інші корінні народи півострова шанували багато з них як священні місця з чудодійною цілющою водою. З XVIII століття європейці почали облаштовувати тут лікувальні курорти, а довкола найбільших джерел із часом виросли цілі курортні міста. Уявлення про цілющі властивості флоридської води з роками змінювалися, однак мало хто всерйоз стверджував, що вона здатна повертати молодість: це вірування було суто європейським."
  seven_cities_fountain.3.title: "Справжній водограй"
  seven_cities_fountain.3.desc: "Джерело в самісінькому серці земель тимукуа дивовижно схоже на опис із переказів — настільки, що літописець тричі перечитує своє донесення, перш ніж наважується переписати його начисто. Вода в джерелі прозора, холодна, з легким мінеральним присмаком. За тиждень стає помітною її дія: у тих, хто щодня купався в джерелі, трохи меншає сивина, трохи менше болить спина, не так скуті суглоби. Навіть рани починають гоїтися швидше. Священник, якому стукнув шістдесят один рік, вигукує: «[target_leader.GetName], я почуваюся так, ніби мені двадцять п’ять!». До заходу сонця донесення підписують і скріплюють печаткою."
  seven_cities_fountain.3.a: "Сповістимо корону: ми знайшли легендарне джерело."
  seven_cities_fountain.3.historical_info: "Легенди про воду, що повертає молодість, відомі в Європі з сивої давнини. Ще Геродот писав про джерело в землях ефіопів, вода якого пахла фіалками і, як вважалося, дарувала надзвичайне довголіття тим, хто в ній купався. На початку XVI століття іспанці принесли цю легенду із собою до Флориди. Незвичайною була не сама поява подібної оповіді, а те, якого значення (хай і ненадовго) надавали їй королі. В європейській історії таке джерело зазвичай залишалося літературним образом, а не ставало приводом витрачати державні гроші на виправу."