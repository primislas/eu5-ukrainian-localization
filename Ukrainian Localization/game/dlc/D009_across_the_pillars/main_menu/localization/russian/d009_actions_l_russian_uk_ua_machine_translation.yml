l_russian:
  proclaim_pase_foral: "Проголошення pase foral"
  proclaim_pase_foral_desc: "Ми скористаємося баскським правом #italic pase foral#! — прадавнім привілеєм, який дозволяє баскським феодам вивчати й призупиняти дію королівських указів, якщо вони суперечать місцевим законам (фуерос). Це проголошення задовольняє очікування знаті й зміцнює стабільність, але тимчасово обмежує можливості правителів."
  summon_santa_hermandad: "Скликання Святої Ермандади"
  summon_santa_hermandad_desc: "Ми скличемо Святу Ермандаду — підтримуване владою братство сільських констеблів та ополченців. За допомогою таких братств Кастилія боролася з розбійниками й зміцнювала королівські порядки в країні. Закликавши їх на службу, ми збільшимо #Y запас новобранців#! і підвищимо #Y бойовий дух#! наших вояків."
  proclaim_pase_foral_action: "$proclaim_pase_foral$"
  proclaim_pase_foral_active: "Проголошення pase foral"
  proclaim_pase_foral_action_progress: "Діє pase foral"
  proclaim_pase_foral_action_progress_wordier: "$proclaim_pase_foral_action_progress$"
  proclaim_pase_foral_action_progress_tooltip: "$proclaim_pase_foral_action_progress$"
  summon_santa_hermandad_action: "$summon_santa_hermandad$"
  summon_santa_hermandad_active: "Скликання Святої Ермандади"
  summon_santa_hermandad_action_progress: "Кількість новобранців і бойовий дух війська"
  summon_santa_hermandad_action_progress_wordier: "$summon_santa_hermandad_action_progress$"
  summon_santa_hermandad_action_progress_long_wordier: "@manpower! $summon_santa_hermandad_action_progress$"
  summon_santa_hermandad_action_progress_tooltip: "Збільште щомісячне поповнення кількости новобранців і підвищте бойовий дух війська."