  STATIC_MODIFIER_NAME_searching_for_cibola: "Пошуки Сиболи"
  STATIC_MODIFIER_DESC_searching_for_cibola: "Виправа, споряджена на пошуки семи міст Сиболи, перебуває десь між узбережжям Сонори та землями пуебло. Слава нашої влади — у їхніх руках."
  STATIC_MODIFIER_NAME_searching_for_quivira: "Пошуки Ківіри"
  STATIC_MODIFIER_DESC_searching_for_quivira: "Виправа, споряджена на пошуки королівства Ківіра, перебуває десь у трав’яному морі Нью-Мексико."
  STATIC_MODIFIER_NAME_searching_for_sierra_de_la_plata: "Пошуки Сьєрра-де-ла-Плати"
  STATIC_MODIFIER_DESC_searching_for_sierra_de_la_plata: "Виправа, споряджена на пошуки описаної людом гуарані срібної гори, перебуває в передгір’ях Анд на захід від Ла-Плати."
  STATIC_MODIFIER_NAME_searching_for_norumbega: "Пошуки Норумбеги"
  STATIC_MODIFIER_DESC_searching_for_norumbega: "Виправа, споряджена на пошуки оточеного муром міста, про яке повідомили французькі рибалки та лоцмани мореплавця Верраццано, перебуває в Новій Англії біля річки Пенобскот."
  STATIC_MODIFIER_NAME_searching_for_saguenay: "Пошуки Сагенею"
  STATIC_MODIFIER_DESC_searching_for_saguenay: "Виправа, споряджена на пошуки королівства, про яке Доннакона розповів Жаку Картьє в Стадаконі, нині перебуває в північних лісах на північ від річки Святого Лаврентія."
  STATIC_MODIFIER_NAME_searching_for_city_of_caesars: "Пошуки Міста Цезарів"
  STATIC_MODIFIER_DESC_searching_for_city_of_caesars: "Споряджена до Патагонії виправа шукає загублене місто, яке за переказами лежить десь серед тамтешніх гір."
  STATIC_MODIFIER_NAME_cibola_discovered: "Сиболу знайдено"
  STATIC_MODIFIER_DESC_cibola_discovered: "Ми знайшли сім міст Сиболи й почали вести з ними торгівлю. Звідти до нас надходять бірюза, бавовняна тканина та виготовлений у майстернях пуебло гагат. Крім того, ця країна оточена кукурудзяними полями. Вона долучена до нашого імперського торгового устрою на більш-менш рівноправних засадах."
  STATIC_MODIFIER_NAME_quivira_discovered: "Ківіру знайдено"
  STATIC_MODIFIER_DESC_quivira_discovered: "Королівство Ківіра було знайдене на трав’яному морі на схід від земель пуебло. Це родюча країна, де пасуться великі стада бізонів. Землероби та купці з племені вічита ведуть тут жваву торгівлю, до якої тепер долучилася й наша влада."
  STATIC_MODIFIER_NAME_sierra_plata_discovered: "Сьєрра-де-ла-Плату знайдено"
  STATIC_MODIFIER_DESC_sierra_plata_discovered: "Легендарну срібну гору знайдено й відкрито світові. Запаси тутешньої руди вражають уяву. Чичські лорди, які володіють передгір’ями, готові торгувати з нами, а кількість одержуваних звідти зливків можна порівняти з багатствами старих кордильєрських копалень."
  STATIC_MODIFIER_NAME_norumbega_discovered: "Норумбегу знайдено"
  STATIC_MODIFIER_DESC_norumbega_discovered: "У верхів’ях річки Пенобскот виявлено Норумбегу — оточене муром кам’яне місто, де жили абенаки та (як наполягає наш латиніст) давні скандинави. Вище за течією діє золотий рудник. Унаслідок цього відкриття рух поселенців і напрямки торгових шляхів змінилися."
  STATIC_MODIFIER_NAME_saguenay_discovered: "Сагеней знайдено"
  STATIC_MODIFIER_DESC_saguenay_discovered: "Північне королівство, про яке Доннакона розповідав Картьє, було знайдене на холодних просторах за межами другого великого озера в басейні річки Святого Лаврентія. Поселення там квітне, у його жителів світла шкіра, а розмовляють вони скандинавською мовою. Торгівля хутром та золотом приносить звідти стільки прибутку, скільки французька корона не бачила ще в жодній країні Нового Світу."
  STATIC_MODIFIER_NAME_city_of_caesars_discovered: "Місто Цезарів відкрито"
  STATIC_MODIFIER_DESC_city_of_caesars_discovered: "Загублене Місто Цезарів виявили в потаємній долині в Патагонських Андах; його жителі — нащадки переселенців, які зазнали кораблетрощі ще в XVI столітті. Піддані нашої країни повернулися під владу корони, а з ними й величезні запаси срібла, які вони встигли видобути за кілька поколінь життя в ізоляції від решти світу."
  STATIC_MODIFIER_NAME_searching_for_el_dorado: "Пошуки Ельдорадо"
  STATIC_MODIFIER_DESC_searching_for_el_dorado: "Виправа, відряджена до басейну річки Оріноко, намагається відшукати легендарного «золотого короля» муїсків."
  STATIC_MODIFIER_NAME_searching_for_fountain_of_youth: "Пошуки джерела вічної молодости"
  STATIC_MODIFIER_DESC_searching_for_fountain_of_youth: "До Флориди, на землі народу тімукуа, було споряджено виправу, перед якою постало завдання відшукати «Фонтан Біміні» — джерело, що за переказами дарує вічну молодість."
  STATIC_MODIFIER_NAME_el_dorado_discovered: "Ельдорадо відкрито"
  STATIC_MODIFIER_DESC_el_dorado_discovered: "Золоте царство муїсків тепер відкрите для іспанської торгівлі. З величних і справді велетенських гірських майстерень, з якими не зрівняється жодна в Європі, золото буквально тече рікою до нашої нової факторії біля священного озера інків."
  STATIC_MODIFIER_NAME_fountain_of_youth_discovered: "Джерело вічної молодости знайдено"
  STATIC_MODIFIER_DESC_fountain_of_youth_discovered: "Ми знайшли джерело в самісінькому серці земель народу тімукуа й переконалися в його цілющих властивостях точнісінько так, як мовилося в переказах. Біля джерела ми звели каплицю, і до нього вже почалося паломництво."
  STATIC_MODIFIER_NAME_camelry_doctrine_modifier: "Доктрина верблюжої кінноти"
  STATIC_MODIFIER_DESC_camelry_doctrine_modifier: "Пропозицію полководця було схвалено. Поряд із кіннотою формуються верблюжі ескадрони, уздовж караванних шляхів закладаються перевалкові вузли для переміни в’ючних тварин, а стройові статути переписуються з урахуванням особливостей походів пустелею. Військо тепер долає більший шлях, витрачаючи менше води, ніж колись, а старшини поступово миряться із запахом."
  STATIC_MODIFIER_NAME_gra_old_capital_of_the_caliphate: "Столиця старого халіфату"