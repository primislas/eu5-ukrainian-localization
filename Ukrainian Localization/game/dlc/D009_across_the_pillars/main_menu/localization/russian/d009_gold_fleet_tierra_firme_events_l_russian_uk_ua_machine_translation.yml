l_russian:
  gold_fleet_tierra_firme_events.1.title: "Курс на Тьєрра-Фірме"
  gold_fleet_tierra_firme_events.1.desc_prefix: "Флот споряджений і готовий до відплиття. Вихідною точкою стане [departure_port.GetName]. Кораблі забезпечені запасами води та харчів, а також залізом і ртуттю, якими колонії не можуть забезпечити себе самі. [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|U] да[ROOT.GetCountry.Custom('crown_yeyut')] настанови. Стежити за виконанням наказів буде [target_leader.GetName].\n\nПора сприятлива, а вітер обіцяє бути попутним. Десь за багато морських миль звідси #TOOLTIP:GOODS,silver,X #L срібло#!#!"
  gold_fleet_tierra_firme_events.1.desc_suffix: "безперервним потоком спускається з гір на узбережжя, звідки флот повезе його на батьківщину. Не можна гаяти ані хвилини: щоб повернутися додому, до порту [departure_port.GetName], підіймати вітрила на галеонах треба вже зараз."
  gold_fleet_tierra_firme_events.1.desc: "$gold_fleet_tierra_firme_events.1.desc_prefix$ Індій $gold_fleet_tierra_firme_events.1.desc_suffix$"
  gold_fleet_tierra_firme_events.1.desc.rich: "$gold_fleet_tierra_firme_events.1.desc_prefix$ з копалень у місцевості [silver_source.GetName], $gold_fleet_tierra_firme_events.1.desc_suffix$"
  gold_fleet_tierra_firme_events.1.a: "Відчалюємо. Галеони мають рушити з ранковим відпливом."
  gold_fleet_tierra_firme_events.1.historical_info: "#italic Галеони Тьєрра-Фірме#! були одним із двох конвоїв іспанського #italic Срібного флоту#!. На флот Тьєрра-Фірме було покладено завдання забезпечувати торгівлю з віцекоролівствами Південної Америки. Його кораблі вивозили срібло, видобуте на рудниках Потосі у Верхньому Перу, а також інший колоніальний крам через порти Портобело та Картахени. Срібло доставляли Панамським перешийком суходолом із тихоокеанського узбережжя і лише потім вантажили на галеони. Філіп II закріпив систему конвоїв у 1566 році, звелівши перевозити всі вантажі у складі озброєних ескадр. Колоніальний крам завозили через Севілью, при цьому #italic Каса-де-Контратасьйон#! стягувала на користь держави #italic quinto real#! — п’яту частину всіх дорогоцінних металів, видобутих у Новому Світі."
  gold_fleet_tierra_firme_events.2.title: "Срібло Нової Гранади"
  gold_fleet_tierra_firme_events.2.desc_prefix: "Ми кинули якір. [loot_port.GetName|U] — надійний прихисток: ми сховалися в бухті, і за тутешніми мурами нам ніщо не загрожує. У коморах уздовж набережної — плоди цілого року праці на рудниках: зливки #TOOLTIP:GOODS,silver,X #L срібла#!#!"
  gold_fleet_tierra_firme_events.2.desc_middle: "скрині з монетами, тюки шкіри, бочки з індиго та подекуди — ретельно охоронювані скриньки з #TOOLTIP:GOODS,gems,X #L коштовним камінням#!#!"
  gold_fleet_tierra_firme_events.2.desc_suffix: "У трюмах ще є вільне місце, а з глибин материка далі надходить срібло. Можна дочекатися всього каравану та завантажити кораблі вщерть або ж забрати вже наявне і відплисти до настання пори буревіїв."
  gold_fleet_tierra_firme_events.2.desc: "$gold_fleet_tierra_firme_events.2.desc_prefix$, $gold_fleet_tierra_firme_events.2.desc_middle$.\n\n$gold_fleet_tierra_firme_events.2.desc_suffix$"
  gold_fleet_tierra_firme_events.2.desc.rich: "$gold_fleet_tierra_firme_events.2.desc_prefix$ з копалень у місцевості [silver_source.GetName], $gold_fleet_tierra_firme_events.2.desc_middle$, якими славиться [gem_source.GetName].\n\n$gold_fleet_tierra_firme_events.2.desc_suffix$"
  gold_fleet_tierra_firme_events.2.a: "Дочекаємося всього каравану і заповнимо кожен трюм."
  gold_fleet_tierra_firme_events.2.b: "Візьмемо лише те, що вже зібрано."
  gold_fleet_tierra_firme_events.2.c: "Ризик надто великий. Повернімося додому з тим, що вже є."
  gold_fleet_tierra_firme_events.2.historical_info: "Заснована в 1533 році Картахена-де-Індіас стала головним карибським портом, куди звозили срібло з Південної Америки. Срібло з рудників Потосі у Верхньому Перу — найбільшого у світі родовища срібла в добу його розквіту — доставляли до тихоокеанського порту Кальяо. Звідти його морем везли на північ, до Панами, а потім на мулах переправляли через перешийок до Портобело. Там, під час величного ярмарку, срібло вантажили на галеони Тьєрра-Фірме. Завдяки такому потоку багатств Картахена стала одним із найбільш укріплених міст Америки, але водночас — жаданою здобиччю для каперів, зокрема для славетного сера Френсіса Дрейка: в 1586 році він пограбував місто."
  gold_fleet_tierra_firme_events.3.title: "$gold_fleet_nueva_espana_events.3.title$"
  gold_fleet_tierra_firme_events.3.desc.together: "Флот прибув до порту [rendezvous_port.GetName], де на якорі під захистом фортечних гармат уже стоїть #italic flota#! з Нової Іспанії. Її трюми такі ж повні #TOOLTIP:GOODS,silver,X #L срібла#!#!, як і наші. Звідси всі кораблі разом підуть через Атлантику: спершу — на північ за Гольфстримом, а потім повернуть на схід, уздовж узбережжя Флориди.\n\nНам повідомили, що на шляху до Іспанії вже підстерігають ворожі кораблі, проте такий величезний караван — непроста здобич. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'має', 'має')] вирішити, як саме об’єднаному флоту краще зустріти загрозу."
  gold_fleet_tierra_firme_events.3.desc.alone: "Флот прибув до порту [rendezvous_port.GetName] і став на стоянку під захистом фортечних гармат. #italic Flota#! з Нової Іспанії не супроводжуватиме нас — перетинати Атлантику доведеться наодинці. Спершу ми підемо на північ за Гольфстримом, а потім повернемо на схід, уздовж узбережжя Флориди.\n\nНам повідомили, що на шляху до Іспанії вже чатують ворожі кораблі, й самотній караван — ласий кусень. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'має', 'має')] вирішити, як саме краще зустріти загрозу."
  gold_fleet_tierra_firme_events.3.a: "$gold_fleet_nueva_espana_events.3.a$"
  gold_fleet_tierra_firme_events.3.b: "$gold_fleet_nueva_espana_events.3.b$"
  gold_fleet_tierra_firme_events.3.c: "$gold_fleet_nueva_espana_events.3.c$"
  gold_fleet_tierra_firme_events.3.historical_info: "Після того як Філіп II в 1566 році офіційно закріпив систему конвоїв, Гавана стала обов’язковим пунктом збору флотів, що поверталися зі скарбами. Глибока природна гавань і вигідне розташування біля Флоридської протоки зробили місто зручним місцем зустрічі для галеонів Тьєрра-Фірме та Флоту Нової Іспанії. У 1589 році в Гавані розпочалося будівництво фортеці Кастильйо-де-лос-Трес-Реєс-дель-Морро — бастіону для захисту від каперів. Срібний флот виходив із порту з огляду на погоду: занадто пізній вихід загрожував потраплянням у сезон буревіїв, занадто ранній — зустріччю з несприятливими вітрами."
  gold_fleet_tierra_firme_events.8.title: "Очікування флоту з Нової Іспанії"
  gold_fleet_tierra_firme_events.8.desc: "Кораблі прибули до порту [rendezvous_port.GetName], проте #italic flota#! з Нової Іспанії ще в дорозі. [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|U] відда[ROOT.GetCountry.Custom('crown_vlaloly')] гранично ясний наказ: флоти зі скарбами мають перетнути Атлантику єдиним строєм, щоб бортовим залпом охолодити запал будь-якого капера, який шукає легкої здобичі у Флоридській протоці.\n\nТому ми залишимося на якорі під захистом фортеці й чекатимемо на товаришів, сподіваючись, що довго чекати не доведеться."
  gold_fleet_tierra_firme_events.8.a: "$gold_fleet_nueva_espana_events.8.a$"
  gold_fleet_tierra_firme_events.8.historical_info: "$gold_fleet_nueva_espana_events.8.historical_info$"
  gold_fleet_tierra_firme_events.awaiting_fleet_tt: "Флот залишатиметься на якорі до прибуття Флоту Нової Іспанії, скільки б часу це не забрало"
  gold_fleet_tierra_firme_events.9.title: "$gold_fleet_nueva_espana_events.9.title$"
  gold_fleet_tierra_firme_events.9.desc: "Відколи ми кинули якір у порту [rendezvous_port.GetName], минуло кілька тижнів, а #italic flota#! з Нової Іспанії все ще затримується. Харчі добігають кінця, команди починають ремствувати, а кожен день, проведений на якорі, — це день, що наближає пору примхливої погоди.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'має', 'має')] вирішити: чи далі чекати на флот із Нової Іспанії, чи ризикнути вийти в Атлантику без нього."
  gold_fleet_tierra_firme_events.9.a: "$gold_fleet_nueva_espana_events.9.a$"
  gold_fleet_tierra_firme_events.9.b: "$gold_fleet_nueva_espana_events.9.b$"
  gold_fleet_tierra_firme_events.9.historical_info: "$gold_fleet_nueva_espana_events.9.historical_info$"
  gold_fleet_tierra_firme_events.10.title: "$gold_fleet_nueva_espana_events.10.title$"
  gold_fleet_tierra_firme_events.10.desc: "[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'дізналася', 'дізнався')], що певну частку скарбів можна забрати й у порту [secondary_port.GetName]: через його комори проходить #TOOLTIP:GOODS,goods_gold,X #L золото#!#!, яке згодом доставляють через перешийок. Можна відрядити туди ескадру, проте розділяти флот у цих водах — неабиякий ризик.\n\nМи можемо затриматися в порту [loot_port.GetNameWithNoTooltip], поки ескадра не повернеться, або ж продовжити рух; тоді місцем нашої зустрічі стане [rendezvous_port.GetNameWithNoTooltip]."
  gold_fleet_tierra_firme_events.10.a: "$gold_fleet_nueva_espana_events.10.a$"
  gold_fleet_tierra_firme_events.10.b: "$gold_fleet_nueva_espana_events.10.b$"
  gold_fleet_tierra_firme_events.10.c: "$gold_fleet_nueva_espana_events.10.c$"
  gold_fleet_tierra_firme_events.10.historical_info: "$gold_fleet_nueva_espana_events.10.historical_info$"
  gold_fleet_tierra_firme_events.10.danger_tt: "$gold_fleet_nueva_espana_events.10.danger_tt$"
  gold_fleet_tierra_firme_events.havana_together_danger_tt: "Об’єднання з флотом Нової Іспанії $gold_fleet_nueva_espana_events.together_danger_suffix$"
  gold_fleet_tierra_firme_events.11.title: "Повернення ескадри"
  gold_fleet_tierra_firme_events.11.desc: "[loot_port.GetName] зустрічає ескадру, відряджену до порту [secondary_port.GetName]. Трюми кораблів забиті скарбами: #TOOLTIP:GOODS,goods_gold,X #L золотом#!#!, #TOOLTIP:GOODS,gems,X #L коштовним камінням#!#! та шкурами. Розрізнені кораблі знову разом, і тепер плавання буде менш небезпечним."
  gold_fleet_tierra_firme_events.11.a: "$gold_fleet_nueva_espana_events.11.a$"
  gold_fleet_tierra_firme_events.11.historical_info: "$gold_fleet_nueva_espana_events.11.historical_info$"
  gold_fleet_tierra_firme_events.12.title: "Возз’єднання поблизу Куби"
  gold_fleet_tierra_firme_events.12.desc: "[rendezvous_port.GetNameWithNoTooltip] готується зустрічати об’єднаний флот: ескадра, що вийшла з порту [secondary_port.GetName], наздогнала решту кораблів. У її трюмах — здобич цього сезону: #TOOLTIP:GOODS,goods_gold,X #L золото#!#!, #TOOLTIP:GOODS,gems,X #L коштовне каміння#!#! та шкури."
  gold_fleet_tierra_firme_events.12.a: "$gold_fleet_nueva_espana_events.12.a$"
  gold_fleet_tierra_firme_events.12.historical_info: "$gold_fleet_nueva_espana_events.12.historical_info$"
  gold_fleet_tierra_firme_events.14.title: "Партія смарагдів"
  gold_fleet_tierra_firme_events.14.desc: "Біля причалу кинув якір охоронюваний караван, що прибув сюди з порту [gem_source.GetName]. Під захистом десятків гармат він доправив сюди справжній статок — #TOOLTIP:GOODS,gems,X #L коштовне каміння#!#!, необроблені смарагди найвищої якості, які коштують більше, ніж будь-який інший вантаж у наших трюмах. Торгові представники пропонують нам узяти їх із собою на батьківщину: прибуток обіцяє бути величезним.\n\nУтім, саме такий вантаж надзвичайно приваблює каперів, а швидкості, з якою ширяться звістки про нього, позаздрить найшвидший корабель. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити, чи варті ці багатства тієї небезпеки, яку вони можуть накликати."
  gold_fleet_tierra_firme_events.14.a: "Завантажимо смарагди в трюм. Таке багатство випадає рідко."
  gold_fleet_tierra_firme_events.14.b: "Залишимо їх тут. Наші трюми й так забиті вщерть."
  gold_fleet_tierra_firme_events.14.decline_tt: "Смарагди залишаються на березі до прибуття наступного флоту, а наш не привертає до себе зайвої уваги"
  gold_fleet_tierra_firme_events.14.historical_info: "Смарагдові копальні Мусо та Сомондоко в Новій Гранаді вважалися найбагатшими у світі, а колумбійські смарагди — одними з найжаданіших предметів розкоші свого часу: їх однаково цінували європейські монархи, індійські Моголи та перські Сефевіди. Невеликі, але напрочуд гарні камені коштували цілий статок: охорона однієї партії вантажу могла обійтися в ціну кількох тонн срібла. Така висока цінність робила їх ласою здобиччю для злодіїв і каперів, тому корона стежила за перевезенням смарагдів не менш ретельно, ніж за перевезенням золота та срібла."
  gold_fleet_tierra_firme_events.15.title: "Мули на перешийку"
  gold_fleet_tierra_firme_events.15.desc: "Останній у цьому сезоні #italic рекуа#! — довгий караван мулів, які везуть #TOOLTIP:GOODS,silver,X #L срібло#!#! із Тихоокеанського узбережжя, — досі в дорозі. В’ючні тварини сумирно несуть цінний вантаж через Панамський перешийок, де лютує лихоманка, до берега. До нас дійшли чутки, що слідом за караваном ідуть #italic сімаррони#! — збіглі невільники, які переховуються в джунглях і мають намір розграбувати срібло перш ніж воно дістанеться нас.\n\nВантаж ще може дійти цілим і неушкодженим — якщо ми подбаємо про те, щоб караван щасливо дістався води."
  gold_fleet_tierra_firme_events.15.a: "Вирядимо озброєну охорону, щоб вона захистила вантаж."
  gold_fleet_tierra_firme_events.15.b: "Нам ніколи чекати. Заберемо те, що зуміють привезти."
  gold_fleet_tierra_firme_events.15.historical_info: "Срібло з Перу потрапляло на Кариби довгим і важким шляхом: його перевозили суходолом, через Панамський перешийок. Срібні зливки везли на #italic рекуас#! — караванах мулів, які доправляли вантаж із Панами, що на Тихоокеанському узбережжі, до Номбре-де-Діос, а згодом — до Портобело на березі Атлантики. На стежках і в джунглях промишляли #italic сімаррони#! — збіглі невільники, які ховалися в затишних місцях перешийка й жили громадами. У 1573 році Френсіс Дрейк уклав із ними союз, улаштував засідку на караван зі сріблом і захопив величезну здобич. Охорона шляху через перешийок була для іспанської корони повсякчасною і витратною турботою."
  gold_fleet_tierra_firme_events.16.title: "Перловий берег"
  gold_fleet_tierra_firme_events.16.desc: "До борту корабля пристає човен. [pearl_source.GetName] везе нам новини: сезонний вилов #TOOLTIP:GOODS,pearls,X #L перлів#!#! уже готовий. Перлини — жадана здобич: вони майже не займають місця в трюмі, але коштують цілий статок. Варто лише ненадовго звернути на схід і пройти вздовж узбережжя, щоб забрати їх.\n\nУтім, шлях буде небезпечним: прибережні води вузькі, мілкі, й у них орудують капери. Варто флоту відхилитися від курсу — і біда не забариться. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити, чи варта здобич такого ризику."
  gold_fleet_tierra_firme_events.16.a: "Візьмемо курс на поселення [pearl_source.GetNameWithNoTooltip] і приймемо перли на борт."
  gold_fleet_tierra_firme_events.16.b: "Підемо попереднім курсом. Нехай перли забере інший флот."
  gold_fleet_tierra_firme_events.16.decline_tt: "Флот не відхиляється від курсу та проходить повз Перловий берег, не привертаючи до себе зайвої уваги"
  gold_fleet_tierra_firme_events.16.historical_info: "Перлові промисли в південній частині Карибського моря — біля островів Кубаґуа та Маргарита, а також в околицях Ріо-де-ла-Ача — стали одними з перших джерел багатства, освоєних Іспанією в Новому Світі. Перли добували невільники-пірнальники, які працювали в нестерпних умовах, доки поклади не виснажувалися. Невеликі й легкі перлини приносили іспанській короні величезний дохід: лише кілька скринь коштували цілий статок. Партії перлів регулярно відправляли додому на кораблях, які перевозили золото та срібло."
  gold_fleet_tierra_firme_events.17.title: "Переправа для слуг корони"
  gold_fleet_tierra_firme_events.17.desc: "На флот передали листа з колонії [colony_source.GetName]: королівські урядовці та їхні родини не можуть виїхати й чекають на будь-яку нагоду повернутися до Іспанії. Безперечно, [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] належно оцін[ROOT.GetCountry.Custom('crown_ytyat')] наші заслуги, якщо ми доправимо цих людей додому цілими й неушкодженими, однак заради цього флоту доведеться якийсь час простояти на якорі, доки самі урядовці не зійдуть на борт, а їхні речі не завантажать у трюми.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити, чи можемо ми дозволити собі таку затримку."
  gold_fleet_tierra_firme_events.17.a: "Ми зачекаємо на урядовців. Прихильність корони варта цього."
  gold_fleet_tierra_firme_events.17.b: "Кожен день дорогий. Нехай чекають іншого корабля."
  gold_fleet_tierra_firme_events.17.decline_tt: "Урядовцям доводиться чекати на інший корабель, і флот вирушає точно за розкладом"
  gold_fleet_tierra_firme_events.17.historical_info: "Колоніальні урядовці, духовенство та члени їхніх родин, які бажали повернутися з Нового Світу до Іспанії, могли попросити про місце на будь-якому кораблі Срібного флоту — Каса-де-Контратасьйон вважала, що капітани зобов’язані не лише перевозити срібло, а й сприяти поверненню слуг корони на батьківщину. Капітан, який відмовляв таким пасажирам, сильно ризикував: на нього могли поскаржитися до Ради Індій. Але кожен день, згаяний на посадку пасажирів і завантаження багажу, забирав дорогоцінний час: флоти поспішали покинути Карибське море до настання сезону буревіїв."