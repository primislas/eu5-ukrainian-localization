l_russian:
  cb_partition: "Поділ"
  cb_partition_desc: "Наша зверхність над #TOOLTIP:CONTINENT,europe,X #L Європою#!#! безсумнівна, а розжирілі на своїх землях країни, що наважуються протистояти нам, не мають жодного права на свої володіння. Ми розгромимо ворогів і повернемо кожній пригнобленій країні право самостійно врядувати на своїх землях."
  cb_restore_ummayad_caliphate: "Відновити кордони Омеядського халіфату"
  cb_restore_ummayad_caliphate_desc: "Колись із Куртуби дім Омеядів правив усім Аль-Андалусом, а пишноті й ученості його двору заздрив увесь світ. Сьогодні від цієї слави лишилися самі уламки, а землі Омеядів роздроблені та поділені між дрібними емірами, негідними такої величної спадщини. Ми знову об’єднаємо правовірних під владою одного халіфа й здіймемо стяг Омеядів над Куртубою."
  war_goal_restore_ummayad_caliphate: "$cb_restore_ummayad_caliphate$"
  war_goal_restore_ummayad_caliphate_desc: "$cb_restore_ummayad_caliphate_desc$"
  RESTORE_UMMAYAD_CALIPHATE_WAR_NAME: "$NUM$-а війна за відновлення Омеядського халіфату проти країни $SECONDNAME$"
  cb_reconquer_iberia: "Відвоювання Іберії"
  cb_reconquer_iberia_desc: "Країна, яка колись панувала над усією #TOOLTIP:REGION,iberia_region,X #L Іберією#!#!, упала. Її хватка розтиснулася, а землі стали легкою здобиччю. Ті, хто виступав проти неї в коаліції, тепер можуть розділити півострів між собою та захопити землі, які повалений велет більше не здатен утримати, витративши на це менше засобів."
  war_goal_reconquer_iberia: "$generic_war_goal_superiority$"
  war_goal_reconquer_iberia_desc: "$generic_war_goal_superiority_desc$"
  PARTITION_WAR_NAME: "$NUM$-й поділ країни $SECONDNAME$"
  war_goal_partition_superiority: "$generic_war_goal_superiority$"
  war_goal_partition_superiority_desc: "$generic_war_goal_superiority_desc$"
  peace_partition: "Поділ"
  peace_partition_desc: "Ми піддамо нашого переможеного ворога поділу та відновимо незалежність усіх країн, які претендують на землі в межах його кордонів."
  peace_partition_entry: "Поділити @[TARGET_COUNTRY.GetFlag]! #ONCLICK:COUNTRY,[TARGET_COUNTRY.GetKey] #TOOLTIP:COUNTRY,[TARGET_COUNTRY.GetKey],X [TARGET_COUNTRY.Custom('CL_ACC')|L]#!#!"
  peace_partition_entry_short: "Поділити @[TARGET_COUNTRY.GetFlag]! [TARGET_COUNTRY.Custom('CL_ACC')]"
  peace_partition_tt: "Звільнити всі країни, чиї корінні місцевості розташовані на землях переможеної країни."
  cb_grand_alliance: "Великий союз"
  cb_grand_alliance_desc: "Побоюючись безконтрольного піднесення однієї держави, країни світу укладають союз, щоб вгамувати зухвальця та відновити рівновагу сил."
  war_goal_grand_alliance_superiority: "$generic_war_goal_superiority$"
  war_goal_grand_alliance_superiority_desc: "$generic_war_goal_superiority_desc$"
  GRAND_ALLIANCE_WAR_NAME: "Великий союз проти країни $SECONDNAME$"
  AI_CURB_DOMINANCE: "Могутність велетня треба обмежити"
  pt_curb_european_dominance: "Обмежити європейське панування"
  pt_curb_european_dominance_desc: "З пануванням нашого ворога в #TOOLTIP:CONTINENT,europe,X #L Європі#!#! буде покінчено. За умовами цього миру він втратить увесь накопичений вплив, і на континенті знову запанує рівновага."
  pt_curb_european_dominance_entry: "Обмежити європейське панування"
  pt_curb_european_dominance_entry_short: "Обмежити європейське панування"
  pt_curb_european_dominance_tt: "[Concept('gc_european_dominance', 'Європейське панування')|e] переможеного велетня зменшується на #Y 25#! од."
  pt_curb_colonial_dominance: "Обмежити колоніальне панування"
  pt_curb_colonial_dominance_desc: "Багатства, які наш ворог награбував за океаном, а також його величезний вплив будуть обмежені. За умовами цього миру його буде позбавлено колоніального панування, а його влада в Новому Світі послабшає."
  pt_curb_colonial_dominance_entry: "Обмежити колоніальне панування"
  pt_curb_colonial_dominance_entry_short: "Обмежити колоніальне домінування"
  pt_curb_colonial_dominance_tt: "[Concept('gc_colonial_dominance', 'Колоніальне домінування')|e] переможеного колоса зменшується на #Y 25#! од."
  cb_free_the_mudejar: "Визволити мудехарів"
  cb_free_the_mudejar_desc: "Наші [ShowReligionAdjective('sunni')|l]і брати в #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! змушені дотримуватися #italic такії #!. Ми більше не можемо дозволяти [ShowReligionGroupAdjective('christian')|l]ому дияволу знущатися з нашого люду."
  cb_claim_throne_of_naples: "Претензія на трон $naples$"
  cb_claim_throne_of_naples_desc: "Ми не допустимо, щоб королівство $naples$ лишалося розділеним."
  claim_throne_of_naples: "Об’єднання з [GetCountry('NAP').Custom('CL_INST')]"
  claim_throne_of_naples_entry: "Претендувати на трон [GetCountry('NAP').GetNameWithNoTooltip]"
  claim_throne_of_naples_entry_short: "$claim_throne_of_naples_entry$"
  claim_throne_of_naples_desc: "Наш контроль над частиною [GetCountry('NAP').Custom('longname_ua_GEN')] дає нам достатню підставу для війни та претензій на решту земель."
  war_goal_take_province_free_the_mudejar: "$generic_war_goal_take_province$"
  war_goal_take_province_free_the_mudejar_desc: "$generic_war_goal_take_province_desc$"
  cb_demand_andalusi_submission: "Вимагати покори від [GetCountry('GRA').Custom('CL_GEN')]"
  cb_demand_andalusi_submission_desc: "Правителі #ONCLICK:COUNTRY,[GetCountry('GRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GRA').GetKey],X [GetCountry('GRA').Custom('CL_GEN')|L]#!#! купили собі незалежність, нацькувавши нас на нашого суперника, і звикли до цієї вигоди. Їхнє військо вже не рівня нашому. Нехай визнають, хто панує в #TOOLTIP:LOCATION,strait_of_gibraltar,X #L Гібралтарській протоці#!#!, і заплатять за мир, яким вони втішаються."
  war_goal_demand_andalusi_submission: "$generic_war_goal_superiority$"
  war_goal_demand_andalusi_submission_desc: "$generic_war_goal_superiority_desc$\n\nПри укладенні миру захоплення [Concept('locations', 'місцевостей')|e] обходиться в #R удвічі #! дорожче, ніж зазвичай, за [Concept('war_score', 'воєнним рахунком')|e], тоді як примушення #ONCLICK:COUNTRY,[GetCountry('GRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GRA').GetKey],X [GetCountry('GRA').Custom('CL_GEN')|L]#!#! до покори коштує лише #G чверть #! цієї вартости. Ця війна ведеться заради того, щоб підпорядкувати їхніх правителів нашій владі, а не заради поділу їхніх земель."
  DEMAND_ANDALUSI_SUBMISSION_WAR_NAME: "$NUM$$ORDER$ війна за підкорення $SECONDNAME$"
  peace_andalusi_submission: "Примусити [GetCountry('GRA').Custom('CL_ACC')] до покори"
  peace_andalusi_submission_desc: "Правителі #ONCLICK:COUNTRY,[GetCountry('GRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GRA').GetKey],X [GetCountry('GRA').Custom('CL_GEN')|L]#!#! зречуться незалежности й стануть під наш стяг у статусі [ShowSubjectTypeName('taifa')], якщо ми сповідуємо спільну з ними віру, або [ShowSubjectTypeName('tributary')], якщо ні."
  peace_andalusi_submission_entry: "$peace_andalusi_submission$"
  peace_andalusi_submission_entry_short: "$peace_andalusi_submission$"