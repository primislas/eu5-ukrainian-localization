l_russian:
  ahl_al_hall_wal_aqd_parliament: "Ахль аль-халль ва-ль-акд"
  ahl_al_hall_wal_aqd_parliament_desc: "#italic Ахль аль-халль ва-ль-акд#! («люди, які зв’язують і розв’язують») — це поважне коло правознавців, вчених і старійшин, чия спільна згода за звичаєм утверджує право ісламських правителів на владу, свідчачи про те, що передачу влади схвалює вся громада. Ми засновуємо цю раду як офіційну дорадчу установу нашої країни, забезпечуючи #italic улемам#! та старшим домам сталу участь у врядуванні. Надавши їй належного впливу та засобів, ми зможемо зміцнити наше право на владу, спираючись на авторитет вчених. Якщо ж у нас забракне засобів на утримання ради, її рішення втратять колишню силу, а досягти згоди, на якій тримається наша влада, стане значно важче."
  tribal_jamaa_parliament: "Джамаа"
  tribal_jamaa_parliament_desc: "#italic Джамаа#! — це прадавня установа спільного врядування в амазигів, за якої вільні одноплеменці та вожді, які їх представляють, обговорюють на відкритих зібраннях питання війни, правосуддя та розподілу засобів. Визнаючи #italic джамаа#! офіційними зборами нашої країни, ми тим самим пов’язуємо нашу владу зі згодою племінних громад, які становлять основу краю. Діяльність цих зборів залучить громади до політичного життя країни й дозволить залагоджувати їхні кривди мирним шляхом. Якщо ж у країни забракне засобів на утримання джамаа, рада втратить свій авторитет, а племена знову повернуться до відокремленого життя."