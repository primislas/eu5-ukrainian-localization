l_russian:
  catholic_monarchs_law: "Католицькі монархи"
  catholic_monarchs_law_desc: "Шлюб, що пов’язує наші країни, є підвалиною нашого спільного майбутнього. Від того, як наші заручені правителі володарюватимуть — чи на рівних, чи з виразною першістю одного з домів, — залежить подальша доля всієї унії."
  iu_establish_iberian_wedding_succession_tt: "Країни укладають [ShowRelationTypeName('iberian_wedding_pact')] та змінюють свій [Concept('heir_selection', 'порядок престолонаслідування')|e] на «[ShowHeirSelectionName('iberian_union_succession')]», згідно з яким один із правителів може успадкувати обидва престоли та утворити унію двох країн"
  composite_monarchy_law: "Складена монархія"
  composite_monarchy_law_desc: "Наші країни об’єднані під владою одного суверена, але водночас кожна з них зберігає власні закони та привілеї, звані #italic фуерос#!. Нам слід вирішити, чи варто й надалі поважати ці #italic фуерос#!, чи ліпше запровадити єдині закони для всіх."
  asientos_law: "Асьєнто"
  asientos_law_desc: "Уряд надає купцям #italic асьєнто#! — монопольне право постачати до наших заморських володінь увесь необхідний крам. Власник цього права має прибуток з кожного вантажу та забезпечує працею майстерні своєї країни. Тому унія має вирішити, чи даруватиме влада асьєнто лише своїм підданим, чи все ж дозволить купцям з інших країн користуватися цим почесним правом."
  religious_authority_law: "Духовна влада"
  religious_authority_law_desc: "Наші об’єднані країни мають вирішити, як ліпше скористатися духовною владою. Корона може надати церкві #italic королівську опіку#! і взяти її під свій нагляд, зосередивши її зусилля всередині унії; з іншого боку, можна звернути погляд церкви назовні, щоб вона поширювала християнську віру та захищала вірян в інших країнах."
  legislative_authority_law: "Законодавча влада"
  legislative_authority_law_desc: "Чиїй волі підкорятимуться країни унії? Корона може накидати власні порядки ухваленням #italic прагматичних санкцій#!, або ж покладатися на рішення місцевих #italic кортесів#! у кожному королівстві."
  crown_settlement_law: "Угода корон"
  crown_settlement_law_desc: "Нам необхідно вирішити, якої подоби зрештою набуде наша унія. Наші країни можуть і надалі існувати як рівні партнери, але за бажання ми також можемо об’єднатися в єдину велику неподільну державу зі спільними законами та порядками."
  union_of_arms_law: "Союз військ"
  union_of_arms_law_desc: "Оборона унії — це обов’язок кожної країни, що входить до неї. Усі королівства мають робити свій внесок у наш спільний захист: добровільно або згідно з обов’язковими частками."
  iu_tanto_monta_policy: "Tanto Monta"
  iu_tanto_monta_policy_desc: "#italic Tanto monta, monta tanto#! означає «одне й те саме». Цей девіз вказує на рівність двох суверенів, які спільно правлять державою. Саме засади взаємної поваги та визнання лежать в основі унії, що скріплює наші країни."
  iu_tanto_monta_no_seniority_tt: "Для цієї [Concept('union', 'унії')|e] не призначено #TOOLTIP:SPECIAL_STATUS,senior_partner,X #L старшого партнера#!#! та не діють політики «[ShowPolicyName('union_establish_seniority_policy')]» і «[ShowPolicyName('union_senior_succession_law')]»"
  iu_dynastic_primacy_policy: "Родова першість"
  iu_dynastic_primacy_policy_desc: "Одна з корон визнається старшою в унії, а її дім — чільним з-поміж інших. Водночас старший дім користується особливою пошаною, тоді як решта країн вдовольняється правом перебувати в одній унії з могутнім і впливовим монархом."
  iu_dynastic_primacy_senior_only_tt: "Якщо ми — [Concept('senior_partner', 'старший партнер')|e]:"
  iu_dynastic_primacy_seniority_tt: "Коли ця [Concept('union', 'унія')|e] створювалася, її учасника з найбільшою [Concept('economical_base', 'господарською базою')|e] було призначено #TOOLTIP:SPECIAL_STATUS,senior_partner,X #L старшим партнером#!#!, внаслідок чого для всієї унії набули чинності політики «[ShowPolicyName('union_establish_seniority_policy')]» та «[ShowPolicyName('union_senior_succession_law')]»"
  iu_respect_fueros_policy: "Визнання фуерос"
  iu_respect_fueros_policy_desc: "Унія визнає та захищає прадавні привілеї кожного королівства. Так молодші країни зберігають значні вольності, а старший партнер має їхню повагу завдяки тому, що дотримує слова та шанує чужі звичаї."
  iu_centralized_administration_policy: "Підпорядковане врядування"
  iu_centralized_administration_policy_desc: "Усі учасники унії підпорядковуються єдиному уряду. Завдяки цьому старший партнер здобуває більшу владу, а молодші країни зміцнюють своє право на владу завдяки ладу й спокою в унії."
  iu_crown_asientos_policy: "Асьєнто корони"
  iu_crown_asientos_policy_desc: "Корона самостійно відає постачанням колоній, зосереджуючи прибуток від торгівлі у своїх руках. Водночас молодші партнери також мають із цього зиск, виробляючи потрібні для постачання товари."
  iu_shared_asientos_policy: "Спільні асьєнто"
  iu_shared_asientos_policy_desc: "Асьєнто розподіляються між купцями всіх країн в унії. Завдяки цьому молодші партнери вільно заробляють на постачанні колоній, а старша країна отримує доступ до дешевих товарів, які проходять через спільну торгову мережу унії."
  iu_patronato_real_policy: "Королівська опіка"
  iu_patronato_real_policy_desc: "Завдяки #italic королівській опіці#! корона наглядає за діяльністю церкви на теренах унії, призначаючи прелатів і розпоряджаючись її прибутками. Отже, духовна влада в унії цілком перебуває в руках корони."
  iu_catholic_champion_policy: "Ревнителі віри"
  iu_catholic_champion_policy_desc: "Наші об’єднані країни самовіддано несуть свій хрест, захищаючи християнську віру при всіх дворах Європи. Нехай увесь світ знає, що ми — несамовиті ревнителі церкви, готові служити їй мечем і щитом."
  iu_pragmaticas_policy: "Королівські санкції"
  iu_pragmaticas_policy_desc: "Закон — це насамперед прояв волі монарха. Ухвалюючи #italic прагматичні санкції#!, суверен одноосібно встановлює порядки для всіх країн в унії, не чекаючи на схвалення з боку будь-яких рад чи зборів."
  iu_regional_cortes_policy: "Регіональні кортеси"
  iu_regional_cortes_policy_desc: "Кожен учасник унії править лише за згодою своїх #italic кортесів#!. Спираючись на ці звичаєві станові збори, правителі зміцнюють своє право на владу та скріплюють унію завдяки її визнанню з боку народу."
  iu_una_ley_una_moneda_policy: "Один закон, одна валюта"
  iu_una_ley_una_moneda_policy_desc: "Закони та валюта мають бути спільними для всіх учасників унії. Це сприятиме зміцненню зв’язку між країнами та прискорить їхнє злиття в єдину державу, а також дозволить слабшим країнам працювати й торгувати так само вільно, як удома."
  iu_perpetual_crown_policy: "Постійна федеративна монархія"
  iu_perpetual_crown_policy_desc: "Нашу унію скріплює непорушна угода між країнами. Довгостроковий характер цього союзу забезпечує правителям право на владу, а їхнім країнам — стабільність і лад. Завдяки цьому зв’язок між учасниками унії стає міцним як ніколи."
  iu_proportional_levy_policy: "Пропорційний набір ополчення"
  iu_proportional_levy_policy_desc: "Усі країни зобов’язані надавати свою частку новобранців для спільного війська. Це дозволяє унії мати більше та сильніше військо, командування яким бере на себе старший партнер."
  iu_negotiated_contribution_policy: "Узгоджений внесок"
  iu_negotiated_contribution_policy_desc: "Країни беруть участь в обороні унії на засадах добровільної угоди, а не з примусу. Завдяки цьому їм стає легше виконувати свої союзницькі зобов’язання, а почуття спільного обов’язку лише єднає вояків і підвищує їхню дисципліну."
  proclaim_spanish_monarchy: "Проголошення іспанської монархії"
  proclaim_spanish_monarchy_desc: "Оголосити про злиття численних країн нашої унії в єдину монархію та прийняти славетний титул Іспанії."
  proclaim_spanish_monarchy_integration_tt: "Наша унія має досягти щонайменше 5-го рівня інтеграції"
  diplomatic_status_iberian_wedding_pact_name: "Іберійський шлюбний союз"
  iberian_wedding_pact_relation: "$diplomatic_status_iberian_wedding_pact_name$"
  iberian_wedding_pact_effect_text: "[SCOPE.sCountry('actor').GetName] уклада[SCOPE.sCountry('actor').Custom('end_yeyut')] іберійський шлюбний союз з #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').GetKey] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').GetKey],X [SCOPE.sCountry('recipient').Custom('CL_INST')|L]#!#!, тим самим скріплюючи престолонаслідування двох країн."
  iberian_wedding_pact_effect_text_past: "[SCOPE.sCountry('actor').GetName] укла[SCOPE.sCountry('actor').Custom('end_vlaloly')] іберійський шлюбний союз з #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').GetKey] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').GetKey],X [SCOPE.sCountry('recipient').Custom('CL_INST')|L]#!#!, скріпивши престолонаслідування обох країн."
  diplomatic_status_iberian_wedding_pact_tooltip: "#T $diplomatic_status_iberian_wedding_pact_name$#!\nЦі країни уклали іберійський шлюбний союз. Якщо один із правителів помре, не залишивши спадкоємців, інший успадкує обидва престоли та утворить [Concept('union', 'унію')|e]."
  iberian_wedding_pact_list_who_tt: "$LIST$ та $WHO$ уклали [ShowRelationTypeName('iberian_wedding_pact')]"
  iberian_wedding_pact_relation_desc: "Ці дві [Concept('countries', 'країни')|e] пов’язує іберійський шлюбний союз, за умовами якого вони колись можуть утворити [Concept('union', 'унію')|e]."
  offer_iberian_wedding_pact: "Погодитися укласти іберійський шлюбний союз"
  offer_iberian_wedding_pact_CATEGORY: "CATEGORY_FRIENDLY_ACTIONS"
