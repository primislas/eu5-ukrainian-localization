  break_iberian_wedding_pact_desc_to_unknown: "$cancel_iberian_wedding_pact_desc_to_unknown$"
  break_iberian_wedding_pact_happened_title: "Розірвати іберійський шлюбний союз"
  break_iberian_wedding_pact_happened_desc: "Іберійський шлюбний союз з #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').GetKey] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').GetKey],X [SCOPE.sCountry('recipient').Custom('CL_INST')|L]#!#! розірвано. Наші країни більше не матимуть спільного престолонаслідування."
  break_iberian_wedding_pact_proposal_question: "Ми розірвемо іберійський шлюбний союз з #ONCLICK:COUNTRY,[TARGET_COUNTRY.GetKey] #TOOLTIP:COUNTRY,[TARGET_COUNTRY.GetKey],X [TARGET_COUNTRY.Custom('CL_INST')|L]#!#!."
  giving_iberian_wedding_pact_trigger: "Перебуває в іберійському шлюбному союзі з цією країною"
  diplomatic_status_giving_iberian_wedding_pact_name: "Партнер за пактом"
  diplomatic_status_giving_iberian_wedding_pact_tooltip: "Ця країна уклала іберійський шлюбний союз з іншою країною."
  diplomatic_status_receiving_iberian_wedding_pact_name: "Партнер за пактом"
  diplomatic_status_receiving_iberian_wedding_pact_tooltip: "$diplomatic_status_giving_iberian_wedding_pact_tooltip$"
  giving_iberian_wedding_pact_list_who_tt: "$LIST$ та $WHO$ уклали [ShowRelationTypeName('iberian_wedding_pact')|l]"
  receiving_iberian_wedding_pact_list_who_tt: "$LIST$ та $WHO$ уклали [ShowRelationTypeName('iberian_wedding_pact')|l]"
  iberian_union_succession: "Спадкування Іберійської унії"
  iberian_union_succession_desc: "Цей [Concept('heir_selection', 'порядок престолонаслідування')|e] притаманний християнським монархіям #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!, які уклали [ShowRelationTypeName('iberian_wedding_pact')]. Якщо один із правителів помре, не залишивши спадкоємців, інший успадкує обидва престоли та утворить [Concept('union', 'унію')|e] двох країн."
  iberian_union_succession_tt: "Утворити [Concept('union', 'унію')|e], якщо наш наступник не є спадкоємцем попереднього правителя"