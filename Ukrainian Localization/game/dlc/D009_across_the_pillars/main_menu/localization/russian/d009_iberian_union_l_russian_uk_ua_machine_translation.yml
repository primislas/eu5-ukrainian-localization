  offer_iberian_wedding_pact_desc: "Ця дія гарантує спільне спадкоємство влади в наших країнах."
  offer_iberian_wedding_pact_cta_to_unknown: "Запропонувати [Concept('country', 'країні')|e] укласти іберійський шлюбний союз"
  offer_iberian_wedding_pact_desc_to_unknown: "$offer_iberian_wedding_pact_desc$"
  offer_iberian_wedding_pact_happened_title: "$diplomatic_status_iberian_wedding_pact_name$ укладено"
  offer_iberian_wedding_pact_happened_desc: "Відтепер нас із #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').GetKey] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').GetKey],X [SCOPE.sCountry('recipient').Custom('CL_INST')|L]#!#! пов’язує іберійський шлюбний союз. Якщо один із правителів двох країн помре, не залишивши спадкоємців, інший успадкує обидва престоли та утворить [Concept('union', 'унію')|e]."
  offer_iberian_wedding_pact_proposal_question: "Запропонувати #ONCLICK:COUNTRY,[COUNTRY.GetKey] #TOOLTIP:COUNTRY,[COUNTRY.GetKey],X [COUNTRY.Custom('CL_DAT')|L]#!#! укласти іберійський шлюбний союз?\n$INFO$"
