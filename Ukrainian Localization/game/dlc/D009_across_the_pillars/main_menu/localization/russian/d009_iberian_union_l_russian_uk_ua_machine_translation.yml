  cancel_iberian_wedding_pact_desc: "Наші країни більше не матимуть спільного престолонаслідування і не зможуть утворити [Concept('union', 'унію')|e]."
  cancel_iberian_wedding_pact_cta_to_unknown: "Розірвати іберійський шлюбний союз із [Concept('country', 'країною')|e]"
  cancel_iberian_wedding_pact_desc_to_unknown: "$cancel_iberian_wedding_pact_desc$"
  cancel_iberian_wedding_pact_happened_title: "Розірвати іберійський шлюбний союз"
  cancel_iberian_wedding_pact_happened_desc: "Ми розірвали іберійський шлюбний союз з #ONCLICK:COUNTRY,[SCOPE.sCountry('recipient').GetKey] #TOOLTIP:COUNTRY,[SCOPE.sCountry('recipient').GetKey],X [SCOPE.sCountry('recipient').Custom('CL_INST')|L]#!#!. Наші країни більше не матимуть спільного престолонаслідування."
  cancel_iberian_wedding_pact_proposal_question: "Розірвати іберійський шлюбний союз з #ONCLICK:COUNTRY,[COUNTRY.GetKey] #TOOLTIP:COUNTRY,[COUNTRY.GetKey],X [COUNTRY.Custom('CL_INST')|L]#!#!?\n$INFO$"
