  cas_pressure_andalusi_court: "Тиснути на андалуський двір"
  cas_pressure_andalusi_court_desc: "[GetCountry('GRA').GetGovernment.GetCourtTitle|U] #ONCLICK:COUNTRY,[GetCountry('GRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GRA').GetKey],X [GetCountry('GRA').Custom('CL_GEN')|L]#!#! поступово поступається нашому тиску, який ми чинимо всіма засобами — від угод про плату за захист до погрози набігів кабальгади на порубіжжі. З кожним місяцем наш вплив на [GetCountry('GRA').Custom('rank_ua_ACC')|l] посилюється, а #L [GetCountry('MOR').GetAdjective|l]ий#! — слабшає."
