  BFTS_THRESHOLD_CAS_25_TITLE: "Кастильський вплив у Гранаді"
  BFTS_THRESHOLD_CAS_25_DESC: "#ONCLICK:COUNTRY,[GetCountry('CAS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('CAS').GetKey],X [GetCountry('CAS').Custom('CL_INST')|L]#!#! може бути призначений [ShowCharacterInteractionName('cas_appoint_adelantado_mayor')], що зміцнює залоги провінцій на кордоні з #ONCLICK:COUNTRY,[GetCountry('GRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GRA').GetKey],X [GetCountry('GRA').Custom('CL_INST')|L]#!#!. Якщо вплив країни слабшає, ця посада звільняється."
  BFTS_THRESHOLD_MOR_25_TITLE: "Марокканський вплив у Гранаді"
  BFTS_THRESHOLD_MOR_25_DESC: "[GetCountry('MOR').GetName] мож[GetCountry('MOR').Custom('end_eut')] виконувати дію «[ShowGenericActionName('mor_force_tribute')]» щодо #ONCLICK:COUNTRY,[GetCountry('GRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GRA').GetKey],X [GetCountry('GRA').Custom('CL_GEN')|L]#!#!, якщо між цими країнами немає васальних відносин і жодна з них не веде війни."
  BFTS_THRESHOLD_CAS_50_TITLE: "Кастильське панування в Гранаді"
  BFTS_THRESHOLD_CAS_50_DESC: "[GetCountry('CAS').GetName] мож[GetCountry('CAS').Custom('end_eut')] виконувати дію «[ShowCountryInteractionName('cas_demand_war_entry')]», закликаючи #ONCLICK:COUNTRY,[GetCountry('GRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GRA').GetKey],X [GetCountry('GRA').Custom('CL_ACC')|L]#!#! брати участь у своїх війнах з #ONCLICK:COUNTRY,[GetCountry('MOR').GetKey] #TOOLTIP:COUNTRY,[GetCountry('MOR').GetKey],X [GetCountry('MOR').Custom('CL_INST')|L]#!#!. Доки вплив перебуває на цьому рівні, [GetCountry('GRA').GetNameWithNoTooltip] не мож[GetCountry('GRA').Custom('end_eut')] завершити [Concept('situation', 'ситуацію')|e] у статусі незалежної країни."
  BFTS_THRESHOLD_MOR_50_TITLE: "Марокканське панування в Гранаді"
  BFTS_THRESHOLD_MOR_50_DESC: "[GetCountry('MOR').GetName] мож[GetCountry('MOR').Custom('end_eut')] виконувати дію «[ShowCountryInteractionName('cas_demand_war_entry')]», закликаючи #ONCLICK:COUNTRY,[GetCountry('GRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GRA').GetKey],X [GetCountry('GRA').Custom('CL_ACC')|L]#!#! брати участь у своїх війнах з #ONCLICK:COUNTRY,[GetCountry('CAS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('CAS').GetKey],X [GetCountry('CAS').Custom('CL_INST')|L]#!#!. Доки вплив перебуває на цьому рівні, [GetCountry('GRA').GetNameWithNoTooltip] не мож[GetCountry('GRA').Custom('end_eut')] завершити [Concept('situation', 'ситуацію')|e] у статусі незалежної країни."
  BFTS_THRESHOLD_CAS_75_TITLE: "Кастильські права на Гранаду"
  BFTS_THRESHOLD_CAS_75_DESC: "[GetCountry('CAS').GetName] мож[GetCountry('CAS').Custom('end_eut')] виконувати дію «[ShowGenericActionName('cas_reduce_granadan_sovereignty')]», що підриває суверенітет Гранади."
  BFTS_THRESHOLD_MOR_75_TITLE: "Марокканські права на Гранаду"
  BFTS_THRESHOLD_MOR_75_DESC: "[GetCountry('MOR').GetName] мож[GetCountry('MOR').Custom('end_eut')] виконувати дію «[ShowGenericActionName('cas_reduce_granadan_sovereignty')]», що підриває суверенітет Гранади."
  BFTS_THRESHOLD_CAS_100_TITLE: "Кастильська влада над Гранадою"
  BFTS_THRESHOLD_CAS_100_DESC: "[GetCountry('CAS').GetName] відкрито пану[GetCountry('CAS').Custom('end_yeyut')] над протокою і мож[GetCountry('CAS').Custom('end_eut')] виконати дію «[ShowGenericActionName('vassalize_granada')]» або «[ShowDecisionName('demand_conversion_of_granada')]». Щойно Іберія визнає християнську чи кастильську владу, [Concept('situation', 'ситуація')|e] вирішиться на користь Кастилії."
  BFTS_THRESHOLD_MOR_100_TITLE: "Марокканська влада над Гранадою"
  BFTS_THRESHOLD_MOR_100_DESC: "[GetCountry('CAS').GetName] відкрито пану[GetCountry('CAS').Custom('end_yeyut')] над протокою і мож[GetCountry('CAS').Custom('end_eut')] виконати дію «[ShowGenericActionName('vassalize_granada')]». Якщо щонайменше одна п’ята Іберії опиниться під владою Марокко, [Concept('situation', 'ситуація')|e] вирішиться на користь цієї країни."