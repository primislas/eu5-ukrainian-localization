l_russian:
  battle_for_the_strait: "Битва за протоку"
  battle_for_the_strait_info: "Боротьба за #TOOLTIP:LOCATION,strait_of_gibraltar,X #L Гібралтарську протоку#!#! між #ONCLICK:COUNTRY,[GetCountry('CAS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('CAS').GetKey],X [GetCountry('CAS').Custom('CL_INST')|L]#!#!, #ONCLICK:COUNTRY,[GetCountry('MOR').GetKey] #TOOLTIP:COUNTRY,[GetCountry('MOR').GetKey],X [GetCountry('MOR').Custom('CL_INST')|L]#!#! та #ONCLICK:COUNTRY,[GetCountry('GRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GRA').GetKey],X [GetCountry('GRA').Custom('CL_INST')|L]#!#!. Той, хто володіє протокою, володіє брамою, що сполучає Атлантичний океан і Середземне море."
  owner_christian_or_castile_tt: "Власником є або #TOOLTIP:RELIGIONGROUP,christian,X #L християнська#!#! країна, або [GetCountry('CAS').GetName]"
  cas_integrated_granada_lands_tt: "[GetCountry('CAS').GetName] напряму володі[GetCountry('CAS').Custom('end_yeyut')] і вважа[GetCountry('CAS').Custom('end_yeyut')] корінними всі місцевості, якими початково володі[GetCountry('GRA').Custom('end_vlaloly')] [GetCountry('GRA').GetName]"
  battle_for_the_strait_desc: "Вузька смуга води між #TOOLTIP:REGION,iberia_region,X $tt_op_L$Іберією$tt_cl_2$ та #TOOLTIP:CONTINENT,africa,X #L Африкою#!#! утворює одну з найважливіших стратегічних точок у світі. [GetCountry('CAS').GetLongName] прагн[GetCountry('CAS').Custom('endlong_eut')] на південь, щоб завершити об’єднання Іберії під #TOOLTIP:RELIGIONGROUP,christian,X #L християнськими#!#! знаменами. [GetCountry('MOR').GetLongName] дивл[GetCountry('MOR').Custom('endlong_ytyat')]ся на північ, прагнучи захистити землі краю [ShowFormableCountryName('ADU_f')] і не допустити блокади переправи для правовірних. [GetCountry('GRA').GetLongName], перебуваючи в оточенні з усіх боків, б’[GetCountry('GRA').Custom('endlong_yeyut')]ся за збереження влади над власним узбережжям. Переможцю дістануться ключі від двох морів."
  battle_for_the_strait_castilian_supremacy: "[GetCountry('CAS').GetAdjectiveWithNoTooltip]а вищість"
  battle_for_the_strait_castilian_supremacy_desc: "$BULLET$Столітній #Y (100 років)#! [ShowModifier('crown_of_the_reconquista_modifier')] [Concept('modifier', 'модифікатор')|e]\n$BULLET$Додатковий модифікатор на [ShowGovernmentReformName('crown_castile_reform')] [Concept('government_reform', 'державну реформу')|e]\n$BULLET$Доступ до [ShowDecisionName('gc_decision')] [Concept('decision', 'рішення')|e], з якого починається [ShowSituationName('golden_century')] [Concept('situation', 'ситуація')|e]"
  battle_for_the_strait_moroccan_supremacy: "[GetCountry('MOR').GetAdjectiveWithNoTooltip]а вищість"
  battle_for_the_strait_moroccan_supremacy_desc: "$BULLET$#Y 100#!-літній [ShowModifier('protector_of_andalus_modifier')] [Concept('modifier', 'модифікатор')|e]\n$BULLET$Піднесення до рангу [ShowCountryRankName('rank_empire')], якщо ще не досягнуто\n$BULLET$Повне [Concept('core', 'укорінення')|e] та [Concept('integration', 'приєднання')|e] кожної [Concept('location', 'місцевості')|e], утримуваної в межах #TOOLTIP:AREA,granada_area,X #L Гранади#!#!, #TOOLTIP:AREA,andalusia_area,X #L Андалусії#!#! та #TOOLTIP:AREA,murcia_area,X #L Мурсії#!#!\n$BULLET$#G 25%#! поступу [Concept('annexation', 'поглинання')|e] для кожної підлеглої [ShowSubjectTypeName('taifa')]\n$BULLET$Спрощене проголошення [ShowFormableCountryName('ADU_f')]\n$BULLET$Доступ до [ShowDecisionName('gc_decision')] [Concept('decision', 'рішення')|e], з якого починається [ShowSituationName('golden_century')] [Concept('situation', 'ситуація')|e]"
  battle_for_the_strait_granadan_sovereignty_preserved: "Суверенітет Гранади збережено"
  battle_for_the_strait_granadan_sovereignty_preserved_desc: "$BULLET$Столітній #Y (100 років)#! [ShowModifier('gra_consolidated_governance_modifier')] [Concept('modifier', 'модифікатор')|e]\n$BULLET$[ShowCasusBelliName('cb_reconquer_iberia')] на відвоювання регіону [ShowRegionName('iberia_region')] зі зниженою вартістю\n$BULLET$Повне [Concept('core', 'укорінення')|e] та [Concept('integration', 'приєднання')|e] кожної [Concept('location', 'місцевості')|e], утримуваної в межах #TOOLTIP:AREA,granada_area,X #L Гранади#!#!, #TOOLTIP:AREA,andalusia_area,X #L Андалусії#!#! та #TOOLTIP:AREA,murcia_area,X #L Мурсії#!#!\n$BULLET$#G 25%#! [Concept('annexation', 'поглинання')|e] до поступу кожної підлеглої [ShowSubjectTypeName('taifa')], що поглинається\n$BULLET$Легше проголошення [ShowFormableCountryName('ADU_f')]\n$BULLET$Доступ до [ShowDecisionName('gc_decision')] [Concept('decision', 'рішення')|e], яке розпочинає [ShowSituationName('golden_century')] [Concept('situation', 'ситуацію')|e]"
  battle_for_the_strait_neutral_outcome: "Нейтральний наслідок"
  BFTS_NEUTRAL_OUTCOMES_HEADER: "Нейтральні наслідки"
  BFTS_OUTCOME_CONDITIONS_TITLE: "Умови перемоги"
  BFTS_OUTCOME_REWARD_TITLE: "Винагорода"
  this_is_castile_tt: "Це [GetCountry('CAS').GetLongName]"
  this_is_morocco_tt: "Це [GetCountry('MOR').GetLongName]"
  this_is_granada_tt: "Це [GetCountry('GRA').GetLongName]"
  this_is_a_subject_of_castile_tt: "Це [Concept('subject', 'васал')|e] країни [GetCountry('CAS').GetName]"
  this_is_a_subject_of_morocco_tt: "Це [Concept('subject', 'васал')|e] країни [GetCountry('MOR').GetName]"
  this_is_a_subject_of_granada_tt: "Це [Concept('subject', 'васал')|e] країни [GetCountry('GRA').GetName]"
  BFTS_CASTILIAN_INFLUENCE_LABEL: "Іберійський вплив"
  BFTS_MOROCCAN_INFLUENCE_LABEL: "Магрибський вплив"
  BFTS_GRA_SOVEREIGNTY_LABEL: "Гранадський суверенітет"
  BFTS_GRA_SOVEREIGNTY_TITLE: "$game_concept_granadan_sovereignty$ [Country.Custom('preposition_uv')] [Country.Custom('CL_PREP')|L]"
  BFTS_INFLUENCE_BAR_TITLE: "$influence_over_granada$"
  BFTS_INFLUENCE_BAR_TOOLTIP_TT: "#L [GetCountry('GRA').GetAdjective]ий#! двір коливається на осі між $bfts_axis_min$ ([GetCountry('CAS').GetNameWithNoTooltip]) та $bfts_axis_max$ ([GetCountry('MOR').GetNameWithNoTooltip])"
  BFTS_INFLUENCE_MONTHLY_DRIFT_LABEL: "Щомісячний рух за віссю «$influence_over_granada$»"
  cas_appoint_adelantado_mayor: "Призначити старшого аделантадо порубіжжя"
  cas_appoint_adelantado_mayor_desc: "Вперше призначений у 1253 р. для врядування порубіжними землями, відвойованими в маврів, старший аделантадо порубіжжя поєднує одразу три посади: апеляційного судді південних земель, виконавця указів, які видає [GetCountry('CAS').GetGovernment.GetRulerTitle], та командувача всіх загонів кабальгади, що ввійшли до #ONCLICK:COUNTRY,[GetCountry('GRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GRA').GetKey],X [GetCountry('GRA').Custom('CL_ACC')|L]#!#!. Від того, до якого стану він належить, залежить, яке з угруповань, з яких складається [GetCountry('CAS').GetGovernment.GetCourtTitle|l], здобуде перевагу. Крім того, за наявности старшого аделантадо всі #L [GetCountry('CAS').GetAdjective|l]і#! провінції, що межують із [GetCountry('GRA').Custom('CL_INST')] чи [GetCountry('GRA').Custom('CL_INST')], отримують посилення постійних залог."
  cas_appoint_adelantado_mayor_act: "$cas_appoint_adelantado_mayor$"
  cas_appoint_adelantado_mayor_concept: "[Concept('character_interaction', 'Взаємодія з персонажем')|e]"
  cas_appoint_adelantado_mayor_past: "[SCOPE.sCharacter('recipient').GetName] — новий старший аделантадо!"
  cas_appoint_adelantado_mayor_act_past: "[SCOPE.sCountry('actor').GetName] [Select_CString(SCOPE.sCountry('actor').IsFemale, 'призначила', 'призначив')] персонажа [SCOPE.sCharacter('recipient').GetName] на посаду старшого аделантадо порубіжжя."
  cas_appoint_adelantado_mayor_desc_specific: "[SCOPE.sCharacter('recipient').GetName] стане новим старшим аделантадо порубіжжя."
  cas_appoint_adelantado_mayor_price: "Вартість призначення старшого аделантадо"
  every_province_murcia_granada_andalusia_adelantado_mayor_tt: "Усі належні нам [Concept('province', 'провінції')|e] #TOOLTIP:AREA,granada_area,X #L Мурсії#!#!, #TOOLTIP:AREA,granada_area,X #L Гранади#!#! та #TOOLTIP:AREA,andalusia_area,X #L Андалусії#!#! отримають користь від [Concept('modifier', 'модифікатора')|e] «[ShowModifier('guarded_by_adelantado_mayor')]», що масштабується з урахуванням [Concept('abilities', 'навичок')|e] персонажа [recipient.GetName], строком на #G 10#! років"
  choose_adelantado_candidate: "Оберіть кандидата"
  scales_with_character_tt: "[Concept('abilities', 'Навички')|e] персонажа [GetCountry('CAS').MakeScope.GetVariable('cas_adelantado_mayor_character').GetCharacter.GetName]"
  gra_reduce_castilian_influence: "Зменшити кастильський вплив"
  gra_reduce_castilian_influence_desc: "Ми закличемо каді, мудреців та знать порубіжжя боротися з #L [GetCountry('CAS').GetAdjective|l]им#! впливом при дворі та на ринках. Їхній повсякчасний тиск послабить хватку #ONCLICK:COUNTRY,[GetCountry('CAS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('CAS').GetKey],X [GetCountry('CAS').Custom('CL_GEN')|L]#!#! на горлі [GetCountry('GRA').Custom('rank_ua_GEN')|l]."
  gra_reduce_moroccan_influence: "Зменшити марокканський вплив"
  gra_reduce_moroccan_influence_desc: "Ми відправимо через протоку посланців зі щедрими дарами й тихими пересторогами, щоб відвернути від #ONCLICK:COUNTRY,[GetCountry('MOR').GetKey] #TOOLTIP:COUNTRY,[GetCountry('MOR').GetKey],X [GetCountry('MOR').Custom('CL_GEN')|L]#!#! племена й порти, що підтримують двір цієї країни. Без них #L [GetCountry('MOR').GetAdjective|l]ий#! нашийник на горлі [GetCountry('GRA').Custom('rank_ua_GEN')|l] поступово послабне."
  gra_construct_alhambra: "Розпочати розширення Альгамбри"
  gra_construct_alhambra_desc: "[GetCountry('GRA').GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] та [Select_CString(GetCountry('GRA').GetGovernment.GetRulerOrRegent.IsFemale, 'її', 'його')] [GetCountry('GRA').GetGovernment.GetCourtTitle] скликають насрідських мулярів, каліграфів і різьбярів #italic мукарнасів#!, щоб закласти підвалини нового крила королівської цитаделі. Кожне таке розширення тісніше пов’язує дім з його столицею, а також примножує пишність палацу на пагорбі Сабіка та чисельність його залоги."
  gra_construct_alhambra_max_tt: "[ShowBuildingTypeName('alhambra')] ще не досягла четвертого рівня"
  gra_construct_alhambra_increment_tt: "Додає #G +1#! до максимального рівня споруди «[ShowBuildingTypeName('alhambra')]»"
  gra_alhambra_extension_desc: "У ситуації «[ShowSituationName('battle_for_the_strait')]» віддано розпорядження про розширення споруди «[ShowBuildingTypeName('alhambra')]»"
  unlock_upgrade_alhambra_decision_tt: "Відкриває [Concept('decision', 'рішення')|e] «[ShowDecisionName('expand_the_alhambra')]»"
  until_we_cease_our_projection_efforts_tt: "Доки ми підтримуємо дію цього [Concept('modifier', 'модифікатора')|e]"
  adu_proclaim_crown_al_andalus: "Проголосити Корону Аль-Андалусу"
  adu_proclaim_crown_al_andalus_desc: "Утвердивши свою владу над #TOOLTIP:CONTINENT,europe,X #L Європою#!#!, ми проголошуємо Корону Аль-Андалусу, яка об’єднає всі тайфи #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!, відродивши велич #TOOLTIP:LOCATION,cordoba,X #L Кордови#!#! і на словах, і на ділі."
  gra_enforce_sovereignty: "Оголошення суверенітету"
  gra_enforce_sovereignty_desc: "[GetCountry('GRA').GetFlavorRank], чиїми землями ми правимо, відмовля[GetCountry('GRA').Custom('endrank_yetsayutsa')]ся коритися як #ONCLICK:COUNTRY,[GetCountry('CAS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('CAS').GetKey],X [GetCountry('CAS').Custom('CL_GEN')|L]#!#!, так і #ONCLICK:COUNTRY,[GetCountry('MOR').GetKey] #TOOLTIP:COUNTRY,[GetCountry('MOR').GetKey],X [GetCountry('MOR').Custom('CL_GEN')|L]#!#!. Це зміцнює нашу владу всередині країни, але ускладнює перемовини з іншими країнами. За потреби ми можемо підіймати стяг власного суверенітету або ж, навпаки, опускати його."
  attract_andalusi_refugees: "Запросити мудехарів"
  attract_andalusi_refugees_desc: "Арабське слово #italic мудаххан#! означає «ті, кому дозволено залишитися». Християни переінакшили його на «мудехар», називаючи так мусульманських жителів своїх завойованих земель. Ми відрядимо до цих земель посланців з обіцянкою прихистити тих, хто надасть перевагу нашому закону перед владою іновірців. Кожен такий вияв гостинности викличе хвилю переселенців з обраного християнського королівства до однієї з наших провінцій."
  bfts_attract_andalusi_refugees_tt: "Ми запропонуємо біженцям-мудехарам з #TOOLTIP:REGION,iberia_region,X #L іберійської#!#! [Concept('province', 'провінції')|e] переселитися до наших земель"
  attract_refugees_choose_source: "Оберіть початкову провінцію"
  attract_refugees_choose_destination: "Оберіть цільову провінцію"
  gra_invite_shadhili_order_effect_tt: "Відкриває доступ до дії «[ShowGenericActionName('gra_patronize_shadhili_order')]», яка прискорює рух до #TOOLTIP:SOCIETAL_VALUE,mysticism_vs_jurisprudence,X #L ісламського права#!#!, збільшує щомісячний приріст [Concept('legitimacy', 'права на владу')|e] та підвищує [Concept('cabinet_efficiency', 'справність ради')|e] ціною [Concept('tax_efficiency', 'податкової справности')|e]"
  gra_patronize_shadhili_order: "Опіка над шазілійським орденом"
  gra_patronize_shadhili_order_desc: "Шазілійський #italic тарикат#!, заснований при нашому дворі, залежить від ласки корони. Втім, опіка над його #italic завіями#! та мудрецями подібна до двосічного меча: даючи голосам праведників лунати в нашій раді, вона водночас забирає кошти, які могли б наповнити нашу скарбницю. Ми можемо припиняти й відновлювати цю підтримку на власний розсуд."
  start_patronizing_shadhili_order_tt: "Ми й надалі опікуватимемося шазілійським тарикатом, що надасть такі ефекти:\n [ShowModifierEffect('patronizing_shadhili_order_modifier')]"
  stop_patronizing_shadhili_order_tt: "Ми припинимо опікуватися шазілійським тарикатом, що призведе до втрати таких ефектів: [ShowModifierEffect('patronizing_shadhili_order_modifier')]"
  until_we_cease_our_patronship_tt: "$until_we_cease_our_projection_efforts_tt$"
  action_active: "[Concept('action', 'Дія')|e] виконується"
  unlock_patronize_shadhili_order_tt: "Відкриває доступ до [Concept('action', 'дії')|e] «[ShowGenericActionName('gra_patronize_shadhili_order')]» у [Concept('situation', 'ситуації')|e] «[ShowSituationName('battle_for_the_strait')]»"
  hire_granadan_jinetes: "Найняти гранадських хінетів"
  hire_granadan_jinetes_desc: "#TOOLTIP:CULTURE,$andalusi_tt$,X #L Андалуські#!#! шляхтичі, мешканці порубіжних #italic кампо#!, чиї короткі мечі й гострі дротики сформували подобу кінноти всіх сусідніх країн, непокояться, бачачи, що наближається [ShowSituationName('battle_for_the_strait')]. Приготувавши калитки зі сріблом, ми зможемо залучити до столиці цих вершників, які знають кожен рів і кожну вартову вежу від #TOOLTIP:LOCATION,cordoba,X #L Кордови#!#! до #TOOLTIP:LOCATION,almeria,X #L Альмерії#!#!."
  hire_granadan_jinetes_traditional_tt: "Ми зберемо у [Concept('capital', 'столиці')|e] 2 загони таких вояків: [ShowUnitDefinitionName('a_granadan_jinetes')]"
  hire_granadan_jinetes_modern_tt: "Ми зберемо у [Concept('capital', 'столиці')|e] 2 загони таких вояків: [ShowUnitDefinitionName('a_granadan_jinetes_2')]"
  cas_demand_muslim_converts: "Вимагати навернення мусульман"
  cas_demand_muslim_converts_desc: "Вимога до влади [GetCountry('GRA').Custom('CL_GEN')] видати васала #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманської#!#! віри, який після прибуття до нашого двору прийме хрещення та отримає нове #L [GetCountry('CAS').GetReligion.GetGroup.GetAdjective|l]е#! ім’я. Звісно, він матиме власний хист і власні вади, тож ми не зможемо завчасно сказати, для якої посади він підійде."
  cas_demand_muslim_converts_select_title: "Оберіть мусульманського васала"
  cas_demand_muslim_converts_no_characters: "@trigger_no! При гранадському дворі немає відповідних мусульманських васалів"
  cas_demand_muslim_converts_price_abilities: "Здібності персонажа"
  cas_demand_muslim_converts_effect_tt: "Обраний [Concept('character', 'персонаж')|e] прибуде до нашого двору, навернеться в християнство і вступить до нас на службу під час [Concept('event', 'події')|e], наслідки якої залежать від [Concept('abilities', 'здібностей')|e] цього персонажа"
  cas_dismantle_fortifications: "Знесення укріплень"
  cas_dismantle_fortifications_desc: "Наказ нашому #L [GetCountry('GRA').GetAdjective|l]ому#! #TOOLTIP:SUBJECT_TYPE,vassal,X #L васалу#!#! розібрати укріплення у зазначеній місцевості. Отриманий камінь, лісоматеріали та оброблена кам’яна кладка будуть вивезені на північ і надійдуть на іберійські ринки, а [GetCountry('GRA').GetFlavorRank|l] стане ще трохи більше залежати від наших залог."
  cas_dismantle_fortifications_select_title: "Оберіть місцевість Гранади для розбирання укріплень"
  cas_dismantle_fortifications_no_locations: "@trigger_no! У Гранаді немає укріплених місцевостей"
