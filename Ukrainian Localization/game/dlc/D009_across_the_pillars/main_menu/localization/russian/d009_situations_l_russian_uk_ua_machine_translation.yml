  vassalize_granada: "Зробити Гранаду васалом"
  vassalize_granada_desc: "[GetCountry('GRA').GetGovernment.GetCourtTitle] повністю підкоряється нам. Йдеться вже не про сплату данини: [GetCountry('GRA').GetFlavorRank] — відданий #TOOLTIP:SUBJECT_TYPE,vassal,X #L васал#!#! нашого престолу. [GetCountry('GRA').GetGovernment.GetRulerTitle] править лише номінально, а закони, податки та грошовий устрій перебувають у наших руках."
  mor_vassalize_granada: "$vassalize_granada$"
  mor_vassalize_granada_desc: "$vassalize_granada_desc$"
  claim_andalusi_inheritance: "Заявити права на андалуську спадщину"
  claim_andalusi_inheritance_desc: "[ShowFormableCountryName('ADU_f')] — це земля, де колись правили халіфи, а правовірні йшли на молитву до величних мечетей #TOOLTIP:LOCATION,cordoba,X #L Кордови#!#!. Відколи ці береги захопили #TOOLTIP:RELIGIONGROUP,christian,X #L християнські#!#! монархи, ми не знаємо спокою.\n\nМи заявляємо про свої права на вибрані іберійські землі, а наші війська готові підкріпити цю заяву силою. Якщо ми вдаримо зараз, #TOOLTIP:REGION,iberia_region,X #L Іберія#!#! визнає нас законними претендентами на втрачену спадщину, а наша слава прогримить на весь [ShowReligionGroupAdjectiveWithNoTooltip('muslim')|l]ий світ."
  claim_andalusi_inheritance_no_target_tt: "Ми отримаємо [Concept('casus_belli', 'привід для війни')|e] з ціллю відібрати землі [ShowFormableCountryName('ADU_f')] в обраного нами #TOOLTIP:RELIGIONGROUP,christian,X #L християнського#!#! монарха Іберії строком на 5 років"
  has_won_bfts_situation_tt: "Ми маємо перемогти в [Concept('situation', 'ситуації')|e] «[ShowSituationName('battle_for_the_strait')]»"
  as_long_as_the_situation_is_active_desc: "доки [Concept('situation', 'ситуація')|e] «$battle_for_the_strait$» лишається активною"
  demand_conversion_of_granada.title: "Віра Гранади"
  demand_conversion_of_granada.desc: "Народ #ONCLICK:COUNTRY,[GetCountry('GRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GRA').GetKey],X [GetCountry('GRA').Custom('CL_GEN')|L]#!#! схилив перед нами коліна, але місцеві мечеті, як і раніше, скликають правовірних на молитву. Перед короною відкриті два шляхи. Ми можемо завершити те, що розпочала реконкіста, і силою навернути [GetCountry('GRA').Custom('rank_ua_ACC')|l] у нашу віру, або ж дозволити #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалуському#!#! люду зберегти свої звичаї, здобувши натомість його майстерність, ученість та хист до верхової їзди."
  demand_conversion_of_granada.a: "Навернути їх у нашу віру. Монарх і його підданці мають служити одному володарю."
  demand_conversion_of_granada.b: "Дозволити їм зберегти віру."
  cas_found_the_santa_hermandad_decision.title: "Запровадити [ShowGovernmentReformNameWithNoTooltip('cas_santa_hermandad_reform')]"
  cas_found_the_santa_hermandad_decision.desc: "Братства наших міст здавна охороняють шляхи, проте кожне з них підпорядковується лише власній раді та власним алькальдам. Спільне [ShowGovernmentReformName('cas_santa_hermandad_reform')], що набиратиметься містами, але підпорядковуватиметься короні, принесе королівський мир у кожне село й покладе край розбою, з яким знать ніколи не бажала боротися."
  cas_found_the_santa_hermandad_decision.a: "Запровадимо [ShowGovernmentReformNameWithNoTooltip('cas_santa_hermandad_reform')]."
  gra_pops_becomes_root_religion_tt: "Багато [Concept('pops', 'громад')|e], що не належать до [Concept('religion_group', 'віровчення')|e] «[ROOT.GetCountry.GetReligion.GetGroup.GetName]», приймуть таку віру: [ROOT.GetCountry.GetReligion.GetName]"
  unlock_jinetes_variable_tt: "Відкриває доступ до [Concept('advances', 'поступів')|e] «[ShowAdvanceName('gra_jinetes')]» та «[ShowAdvanceName('gra_mailed_jinetes')]»"
  mor_cultivate_andalusi_influence: "Зміцнювати андалуський вплив"
  mor_cultivate_andalusi_influence_desc: "Наші посланці та вчені знову і знову перетинають протоку, дбаючи про те, щоб [GetCountry('GRA').GetGovernment.GetRulerTitle|l] та [GetCountry('GRA').GetGovernment.GetCourtTitle|l] і надалі цінували нашу дружбу. З кожним місяцем опіка, шлюбні пропозиції та порубіжні залоги дедалі тісніше пов’язують із нами верхівку [GetCountry('GRA').Custom('rank_ua_GEN')|l]."
  mor_cultivate_andalusi_influence_action: "Зміцнювати андалуський вплив"
  mor_cultivate_andalusi_influence_active: "Зміцнення андалуського впливу"
