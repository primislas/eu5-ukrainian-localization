l_russian:
  seven_cities_caesars.1.title: "Пірит і кварц"
  seven_cities_caesars.1.desc: "Після п’яти місяців мандрів Патагонією загін знайшов долину, про яку розповідали доправлені до Буенос-Айреса моряки, що врятувалися із затонулого галеона. Ніякого міста тут немає. Є лише кілька покинутих хатин — судячи з усього, пастуших або мисливських, зведених кілька десятиліть тому. Русло струмка й справді виблискує, але оцінювач швидко розвіює наші сподівання: у ґрунті лише «золото дурнів», себто пірит, та білий кварц. Єдине, чого тут удосталь, — це гуанако. [target_leader.GetName] пише донесення на батьківщину, сховавшись від вітру за базальтовою скелею. Вітер не вщухає вже четвертий день."
  seven_cities_caesars.1.a: "Нас ошукали — можливо, давно. Згорнемо стяг і рушимо назад."
  seven_cities_caesars.1.historical_info: "Аж до XVIII століття іспанські монархи вірили в існування Міста Цезарів — нібито прихованого в глибині краю іспаномовного поселення, заснованого моряками, які вижили після кораблетрощі біля узбережжя Патагонії в XVI столітті. У період з 1530 по 1750 рік на його пошуки вирушило щонайменше сім виправ, але жодна з них так нічого й не знайшла. В основі цієї легенди лежав збіг одразу кількох обставин. По-перше, Патагонію в ті часи було вкрай важко досліджувати. По-друге, вцілілі після кораблетрощ часом розповідали безліч історій, які виправдовували їхню тривалу відсутність. По-третє, колоніальні чиновники не відкидали правдоподібні чутки, а завжди сприймали їх на віру."
  seven_cities_caesars.2.title: "Срібний струмочок у холодному краю"
  seven_cities_caesars.2.desc: "Землі, що відкрилися нам, значно суворіші й набагато бідніші, ніж розповідали вцілілі, — і все ж надія ще жевріє: у двох долинах нам трапилися струмки зі слідами срібла у воді. А купці-мапуче, зустрінуті нами тиждень тому, показували невеликі вироби з цього дорогоцінного металу — за їхніми словами, його добувають у передгір’ях на захід звідси. Міста тут немає, але самі землі насправді існують, а отже, можна налагодити торгівлю. Мріяти про другий Потосі було б наївно, проте певний успіх нам усе ж усміхнувся. [target_leader.GetName] наказує збудувати на місці стоянки укріплену факторію."
  seven_cities_caesars.2.a: "Збудуємо факторію й покриємо витрати патагонським сріблом, хай його й небагато."
  seven_cities_caesars.2.historical_info: "Ближче до завершення доби колонізації в Патагонії відкрили кілька невеликих срібних рудників, де видобували метал у кількості, достатній для прибуткової (хай і скромної) торгівлі. Здебільшого вони були розташовані на землях сучасної аргентинської провінції Ріо-Неґро та вздовж східних схилів Анд. Порівняно з величезними срібними родовищами Анд далі на північ ці копальні мали невелику вагу для господарства. Проте й цього вистачило, щоб навколо них виникли іспанські, а згодом — аргентинські факторії. Поступово вони витіснили з регіону місцевих торговців-мапуче."
  seven_cities_caesars.3.title: "Знайдені Цезарі"
  seven_cities_caesars.3.desc: "Землі, про які розповідали вцілілі, існують — і місто, про яке вони казали, теж. У затишній долині між двома горами розташоване поселення приблизно на дві тисячі душ. Місцеві жителі вдягаються на іспанський зразок і розмовляють іспанською мовою, хоча за два покоління їхня говірка помітно змінилася. Навіть віросповідання в них іспанське, хоч тутешній священник уже старий і замінити його нікому. Ось уже шістдесят років вони живуть тим, що вирощують маїс у долині та добувають срібло в струмках. Ніхто з них не сподівався, що їх коли-небудь знайдуть. Літописець цілу ніч не стуляє очей, записуючи все побачене. [target_leader.GetName] на світанку шле по підмогу."
  seven_cities_caesars.3.a: "Ми відшукали загублених підданих корони. Ця долина належить нам."
  seven_cities_caesars.3.historical_info: "В іспанських літописах часом згадуються нащадки мореплавців, які вціліли після кораблетрощ і змішалися з місцевим людом. Найвідоміший історичний приклад — Ґонсало Ґерреро, який осів серед мая. Утім, подібні громади завжди були нечисленними й аж ніяк не нагадували загублені міста з місцевих переказів. Патагонська легенда про Місто Цезарів також не знайшла підтвердження: долину, де нібито лежало це сховане від чужих очей місто, починаючи з кінця XIX століття неодноразово досліджували, однак ані картографи, ані гірники так і не виявили жодних слідів поселення."