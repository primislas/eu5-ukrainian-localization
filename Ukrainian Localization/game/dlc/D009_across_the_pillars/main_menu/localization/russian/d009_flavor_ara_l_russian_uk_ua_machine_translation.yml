l_russian:
  flavor_ara.31.entry: "$flavor_ara.31.title$"
  flavor_ara.31.title: "Слабкість у #TOOLTIP:LOCATION,athens,X #L Афінах#!#!"
  flavor_ara.31.desc: "Попри наш колишній вплив у провінції #TOOLTIP:PROVINCE_DEFINITION,attica_province,X #L Аттіка#!#!, колись велика компанія, яка боронила #TOOLTIP:REGION,balkan_region,X #L Балкани#!#!, нині стала лише тінню своєї давньої величі й усе більше вислизає з-під нашої руки. Замість того щоб дозволити їй слабшати та ставати дедалі непокірнішою, чи не час нам втрутитися й усунути її від влади в [ShowLocationName('athens')], відновивши на цих землях [ROOT.GetCountry.GetAdjective|l]ий лад?"
  flavor_ara.31.a: "Нагадаємо їм про їхній обов’язок."
  flavor_ara.31.b: "Політика в регіоні Балкани нас не обходить."
  flavor_ara.32.entry: "$flavor_ara.32.title$"
  flavor_ara.32.title: "Трон #TOOLTIP:LOCATION,naples,X #L Неаполя#!#!"
  flavor_ara.32.desc: "Ми прагнемо поширити свій вплив на #TOOLTIP:REGION,italy_region,X #L Італію#!#! та зміцнити торгівлю по всьому Середземномор’ю, однак [GetCountry('NAP').GetLongName] стоїть у нас на шляху, утримуючи чимало цінних гаваней, життєво необхідних для наших задумів. Уже заявивши права на #TOOLTIP:AREA,sicily_area,X #L Сицилію#!#!, ми отримуємо додаткову підставу об’єднати її з північними землями навколо [ShowLocationName('naples')]. Можливо, це навіть стане початком піднесення, яке переживе новий [ROOT.GetCountry.GetGovernment.GetCourtTitle] в Італії…"
  flavor_ara.32.a: "Корони мають бути об’єднані."
  flavor_ara.32.b: "Не варто загострювати становище в Італії."
  ara_allows_naples_fiefdom_regardless_of_warscore_cost: "Ми зможемо зробити #ONCLICK:COUNTRY,[GetCountry('NAP').GetKey] #TOOLTIP:COUNTRY,[GetCountry('NAP').GetKey],X [GetCountry('NAP').Custom('CL_ACC')|L]#!#! нашим #TOOLTIP:SUBJECT_TYPE,fiefdom,X #L феодом#!#!, застосувавши [ShowCasusBelliName('cb_claim_throne_of_naples')] [Concept('casus_belli', 'привід для війни')|e]"
  flavor_ara.33.title: "Перемога в #TOOLTIP:LOCATION,naples,X #L Неаполі#!#!"
  flavor_ara.33.desc: "Наші війська здобули тріумфальну перемогу в недавній війні проти володарів [ShowLocationName('naples')]!\n\nЙого колись величні мури перетворено на руїни, а колишній осередок влади тепер слугує нам для зміцнення нашого права на владу над цими землями. Хоча на півдні #TOOLTIP:REGION,italy_region,X #L Італії#!#! ще лишаються вогнища опору, ніхто не наважується оскаржувати наше недавнє завоювання.\n\nМабуть, тепер варто звернути увагу на внутрішні справи, залучаючи #TOOLTIP:CULTUREGROUP,italian_group,X #L італійців#!#! до наших звичаїв, законів та культури."
  flavor_ara.33.a: "Цей тріумф слід відсвяткувати!"
  flavor_ara.35.entry: "$flavor_ara.35.title$"
  flavor_ara.35.title: "Наші родичі в межах області Сицилія"
  flavor_ara.35.desc: "Після того як #TOOLTIP:CULTURE,$sicilian_tt$,X #L Сицилійська#!#! вечірня закріпила престол за домом [target_character.GetDynasty.GetName], наш вплив у #TOOLTIP:REGION,italy_region,X #L Італії#!#! зріс. Попри це, область #TOOLTIP:AREA,sicily_area,X #L Сицилія#!#! і надалі зберігає незалежність, тримаючись осторонь нашої родової політики. Замість того щоб марнувати таку нагоду, чи не варто нам порозумітися з нашими тамтешніми родичами, уклавши міцніший союз домів і, можливо, поклавши початок нашим зазіханням в Італії?"
  flavor_ara.35.a: "Ми об’єднаємо обидві гілки роду."
  flavor_ara.35.b: "Мабуть, ми можемо скористатися цією нагодою, щоб зберегти обличчя [ROOT.GetCountry.Custom('rank_ua_GEN')]."
  ara_unlock_decision_to_unite_sicily_and_aragon_crowns_tt: "Ми відкриємо [Concept('decision', 'рішення')|e] «[ShowDecisionName('ara_unite_barcelona_dynasty')]», що дозволить нам встановити [Concept('union', 'унію')|e] над #ONCLICK:COUNTRY,[GetCountry('SIC').GetKey] #TOOLTIP:COUNTRY,[GetCountry('SIC').GetKey],X [GetCountry('SIC').Custom('CL_INST')|L]#!#!, якщо наша [Concept('opinion', 'думка')|e] про них буде достатньо високою"
  flavor_ara.36.entry: "Другий двір"
  flavor_ara.36.title: "Другий [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
  flavor_ara.36.desc: "Честь і слава регіону #TOOLTIP:REGION,italy_region,X #L Італія#!#! — це те, чим не може нехтувати жоден правитель у межах частини світу #TOOLTIP:CONTINENT,europe,X #L Європа#!#!. Завдяки нашому пануванню над землями #TOOLTIP:AREA,sicily_area,X #L Сицилії#!#! та містом [ShowLocationName('naples')], [target_character.GetName] починає замислюватися про створення другої столиці для [ROOT.GetCountry.Custom('longname_ua_GEN')], спираючись на багаті міста Італії. Це дозволить нам також тримати під наглядом місцеву знать, а заодно дасть молодшим представникам роду [target_character.GetDynasty.GetName] змогу набратися досвіду."
  flavor_ara.36.a: "Цей новий [ROOT.GetCountry.GetGovernment.GetCourtTitle], без сумніву, принесе розквіт."
  flavor_ara.36.b: "Немає потреби приділяти надмірну увагу землям Італії."
  ara_all_italian_pops_become_satisfied_tt: "Кожна #TOOLTIP:CULTUREGROUP,italian_group,X #L італійська#!#! [Concept('pop', 'громада')|e] отримає [ShowNamedValue('pop_satisfaction_severe_bonus')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e]"
  flavor_ara.37.entry: "$flavor_ara.37.title$"
  flavor_ara.37.title: "Укріплення земель регіону Італія"
  flavor_ara.37.desc: "Щоб зберегти воєнний контроль над регіоном #TOOLTIP:REGION,italy_region,X #L Італія#!#!, належить зробити ще чимало.\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle] у [italian_court.Custom('LR_PREP')] [italian_court.GetName] помітив слабке місце на рубежах, а саме [target_location.Custom('LR_ACC')] [target_location.GetName], якому [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] не приділя[ROOT.GetCountry.Custom('crown_vlaloly')] належної уваги. З цієї причини дехто вважає, що нам слід посилити оборону та гарантувати безпеку в Італії, відкривши нову добу спокою."
  flavor_ara.37.a: "Зміцнімо наш кордон."
  flavor_ara.37.b: "Усі зусилля слід спрямувати на нашу столицю."
  flavor_ara.38.entry: "Палац для італійського двору"
  flavor_ara.38.title: "Палац для [ShowCultureGroupNameWithNoTooltip('italian_group')|l]ого двору"
  flavor_ara.38.desc: "Наша присутність у #TOOLTIP:REGION,italy_region,X #L Італії#!#! дозволила нам встановити значно пряміший контроль над цим краєм. Однак поки жителі столиці [ROOT.GetCountry.GetCapital.GetName] розкошують, другий за важливістю [ROOT.GetCountry.GetGovernment.GetCourtTitle] вважає, що заслуговує на таку ж увагу. Не бажаючи зрадити довіру, яку виявля[ROOT.GetCountry.Custom('nobles_yeyut')] #TOOLTIP:CULTUREGROUP,italian_group,X #L італійськ[ROOT.GetCountry.Custom('nobles_yiaei')]#!#! [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], [target_character.GetName] [Select_CString(target_character.IsFemale, 'вирішила', 'вирішив')] замовити зведення чудового палацу, який буде частково профінансований заможними купецькими родинами, а частково — коштом, який виділи[ROOT.GetCountry.Custom('crown_vlaloly')] [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], щоб зміцнити нашу владу над багатими містами півострова."
  flavor_ara.38.a: "Величний палац для величного [italian_court.Custom('LR_GEN')] [italian_court.GetNameWithNoTooltip]."
  flavor_ara.38.a.entry: "Величний палац для величного міста."
  flavor_ara.38.b: "Нам слід відкласти цей задум."
  flavor_ara.39.entry: "$flavor_ara.39.title$"
  flavor_ara.39.title: "Втручання в Магриб"
  flavor_ara.39.desc: "Для захисту нашої торгівлі деколи потрібно щось більше, ніж перо.\n\nЗ плином часу наші торгові партнери, якими є [GetCountry('TUN').GetName], стають дедалі віддаленішими, і ми не забули про їхню підтримку повстання в #TOOLTIP:LOCATION,ajim,X #L Аджимі#!#!. Замість сидіти склавши руки й дозволити нашим домаганням згаснути з роками, нам слід спорядити воєнну виправу, щоб повернути цей колись важливий порт для [ROOT.GetCountry.Custom('rank_ua_GEN')]."
  flavor_ara.39.a: "Вирушити до Аджима."
  flavor_ara.42.common_desc: "Наші зв’язки з #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_INST')|L]#!#! переплели наші володіння, дозволивши їм впливати на нашу політику. Скориставшись своїм становищем як країни роду [target_character.GetDynasty.GetName], а також великої держави в межах #TOOLTIP:CONTINENT,europe,X #L Європи#!#!,"
  flavor_ara.42.title: "Наша рідня"
  flavor_ara.42.desc: "$flavor_ara.42.common_desc$ тепер вони бажають претендувати на наш престол, вимагаючи, щоб [target_character2.GetName] [Select_CString(target_character2.IsFemale, 'стала', 'став')] не більше ніж намісником [ROOT.GetCountry.Custom('longname_ua_GEN')]."
  flavor_ara.42.a: "Ми підкоримося їхній волі."
  flavor_ara.42.b: "Навіщо нам віддавати престол тим, хто нічим не заслужив його?"
  flavor_ara.43.title: "$flavor_ara.42.title$"
  flavor_ara.43.desc: "$flavor_ara.42.common_desc$ тепер вони бажають перетворити нас на васалів, позбавляючи діяча на ім'я [target_character2.GetName] будь-якої влади над [ROOT.GetCountry.Custom('longname_ua_INST')]."
  flavor_ara.43.a: "$flavor_ara.42.a$"
  flavor_ara.43.b: "$flavor_ara.42.b$"
  flavor_ara.1100.entry: "$flavor_ara.1100.title$"
  flavor_ara.1100.title: "Слова з Боснії"
  flavor_ara.1100.desc: "Великий правитель [target_character.GetName], що очолює #ONCLICK:COUNTRY,[GetCountry('BOS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('BOS').GetKey],X [GetCountry('BOS').Custom('CL_GEN')|L]#!#!, вже давно бореться за збереження своєї незалежности від зажерливих сусідів. Не маючи сил захиститися самотужки, деяк[GetCountry('BOS').Custom('nobles_yiaei')] [GetCountry('BOS').GetGovernment.GetEstateName('nobles_estate')] зверну[GetCountry('BOS').Custom('nobles_vlaloly')]ся до правителя [target_character2.GetName] та нашого двору з проханням захистити їх від будь-якого вторгнення. Вони воліли б стати нашими підданими, ніж потрапити до рук іновірців, і цим ми можемо скористатися у власних інтересах."
  flavor_ara.1100.a: "Подивимося, що ми можемо вдіяти."
  ara_unlock_decision_to_demand_vassalization_of_bosnia_tt: "Ми відкриємо [Concept('decision', 'рішення')|e] «[ShowDecisionName('ara_vassalize_bosnia')]»"
  flavor_ara.1101.title: "Посли з [from_country.Custom('CL_GEN')]"
  flavor_ara.1101.desc: "Прагнучи захистити нас від зовнішніх загроз, наш[ROOT.GetCountry.Custom('nobles_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] зверну[ROOT.GetCountry.Custom('nobles_vlaloly')]ся по допомогу до #ONCLICK:COUNTRY,[from_country.GetKey] #TOOLTIP:COUNTRY,[from_country.GetKey],X [from_country.Custom('CL_GEN')|L]#!#!, і у відповідь звідти прибуло посольство для обговорення цієї справи. Знаючи, що ми віддамо перевагу безчестю перед смертю, вони зажадали, щоб ми стали їхніми підданими. У такому разі їхні війська та їхн[from_country.Custom('nobles_aei')] [from_country.GetGovernment.GetEstateName('nobles_estate')] зможуть захищати нас дієвіше, замість покладатися на хисткий союз між нашими країнами."
  flavor_ara.1101.a: "Ми підкоримося їм."
  flavor_ara.1101.b: "Нехай тоді нас спіткає смерть, але нехай знають: ми помремо вільними!"