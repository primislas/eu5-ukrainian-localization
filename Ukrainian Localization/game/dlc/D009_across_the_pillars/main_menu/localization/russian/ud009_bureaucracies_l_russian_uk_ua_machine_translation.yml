l_russian:
  dar_al_tiraz_bureaucracy: "Дар аль-Тіраз"
  dar_al_tiraz_bureaucracy_desc: "Розкішні тканини з Персії споконвіку використовують у країнах ісламського світу для виготовлення почесних мантій, які правителі дарують своїм васалам на знак прихильности. Завдяки державній підтримці ткацькі майстерні #italic $dar_al_tiraz_bureaucracy$#! зможуть не лише вдягати наш двір у вишукані гаптовані шати, а й постачати коштовні тканини на інші ринки."
  diwan_al_mustakhlas_bureaucracy: "Диван аль-Мустахлас"
  diwan_al_mustakhlas_bureaucracy_desc: "#italic $diwan_al_mustakhlas_bureaucracy$#! відповідає за особисте майно султана: маєтки, майстерні та недержавну частку доходів, яка йде на утримання двору й Альгамбри. Вправне відання цими коштами дає змогу короні зберігати фінансову незалежність від станів, однак за відсутности належного нагляду відповідальні чиновники можуть скористатися своїм становищем задля власного збагачення."
  diwan_al_qawafil_bureaucracy: "Диван аль-Кавафіль"
  diwan_al_qawafil_bureaucracy_desc: "#italic $diwan_al_qawafil_bureaucracy$#! пильнує торгові шляхи через Сиджильмасу та споряджає сахарські каравани, що везуть золото й невільників на північ, а тканини та сіль — на південь. Завдяки цьому купці можуть спокійно займатися своїми справами, не побоюючись розбійників. Однак якщо диван раптом послабить хватку, торгові шляхи вмить заполонять харцизи, а місцеві племена неодмінно затаять образу на тих, хто допустив це безладдя."
  ghuzat_mujahidin_bureaucracy: "Аль-Гузат аль-Муджахідін"
  ghuzat_mujahidin_bureaucracy_desc: "#italic $ghuzat_mujahidin_bureaucracy$#! — це північноафриканські вершники-добровольці, які вважають своїм священним обов’язком захист мусульман по той бік Гібралтарської протоки. Під проводом свого шейха ці ревні та хоробрі воїни ведуть запеклу боротьбу проти християн, чим лише дужче розпалюють у серцях нашого люду завзяття у вірі."
  makhzan_bureaucracy: "Аль-Махзан"
  makhzan_bureaucracy_desc: "#italic $makhzan_bureaucracy$#! слугує головною установою влади султана, яка збирає податки та забезпечує виконання указів. Сильний #italic махзан#! дає змогу тримати під наглядом навіть ті племена й міста, що розташовані далеко від столиці. Втім, якщо чиновники не даватимуть ради зі своєю працею, уся країна перетвориться на #italic білад ас-сіба#! — «непокірну землю», — і тоді віддалені провінції почнуть бунтувати й домагатися вольностей."
  marinid_madaris_bureaucracy: "Ріаят аль-Мадаріс"
  marinid_madaris_bureaucracy_desc: "#italic $marinid_madaris_bureaucracy$#! становить собою мережу державної підтримки медресе — навчальних закладів, де готують правників, писарів та урядовців. За належного утримання ця установа не лише зміцнює наш правовий устрій, а й забезпечує уряд здібними людьми."
  qadi_al_jamaa_bureaucracy: "Кади аль-Джамаа"
  qadi_al_jamaa_bureaucracy_desc: "#italic $qadi_al_jamaa_bureaucracy$#! — це головний суддя громади, який очолює малікітські суди та призначає місцевих кади по всій країні. Коли судочинство в країні діє справно й керується загальноприйнятими законами, воно зміцнює право уряду на владу та посилює віру народу в справедливий суд."
  wulat_al_thughur_bureaucracy: "Вулат ас-Сугур"
  wulat_al_thughur_bureaucracy_desc: "#italic $wulat_al_thughur_bureaucracy$#! відповідають за оборону порубіжних земель. Вони набирають залоги для фортець, стережуть шляхи та час від часу ведуть перемовини з великими християнськими королівствами, щоб уникати війн. По суті, ці намісники слугують щитом усієї країни, бо якщо наші кордони ослабнуть, сусіди неодмінно спробують розширити свої володіння нашим коштом."
  diwan_al_gharb_bureaucracy: "Диван аль-Гарб"
  diwan_al_gharb_bureaucracy_desc: "#italic $diwan_al_gharb_bureaucracy$#! — «західне відомство» — відає тією частиною наших андалуських володінь, де мешкають мосараби і де християнських церков і досі більше, ніж мечетей. Службовці цього дивану збирають подать на користь султана, призначають кади у змішані суди, а також сприяють подальшій асиміляції місцевого люду в нашу культуру. Якщо належно налагодити роботу цієї установи, нам буде набагато легше встановити владу над цими землями, інакше їх швидко приберуть до рук рішучіші володарі."
  dawa_bureaucracy: "Диван ад-Дава"
  dawa_bureaucracy_desc: "Назву #italic $dawa_bureaucracy$#! має відомство, за допомогою якого монарх відає справами віри в заморських землях, виряджаючи кади та проповідників до віддалених провінцій. Його #italic давати#! несуть світло ісламу прибережним народам, а судді підпорядковують нові колонії законам умми. За належного утримання воно перетворює підкорені землі на сумирні провінції, вірні монарху, але якщо занедбати цю установу, далекі отари зрічуться свого пастиря, а слово віри стихне."
  mozabite_azzaba_bureaucracy: "Рада аззаба"
  mozabite_azzaba_bureaucracy_desc: "#italic Аззаба#! — це таємна рада ібадитських богословів, яка слугує головним осередком врядування у мзабських громадах. Вона ухвалює рішення в справах віри, розв’язує суперечки та наглядає за дотриманням суворих норм моралі, які ібадити зуміли зберегти попри століття тиску ззовні. Ми вважаємо раду найвищою владою в громаді, а тому всіляко підтримуємо її богословів та їхні постанови щодо божественного закону. Завдяки цьому аззаба має велику пошану серед вірян та успішно впроваджує між ними ібадитське право. Втім, якщо раді бракуватиме коштів, вона неминуче втратить свій вплив, а її місце посядуть інші звичаї та течії."
  nav_diputacion_navarra_bureaucracy: "Депутація Наварри"
  nav_diputacion_navarra_bureaucracy_desc: "$nav_diputacion_navarra_bureaucracy$ впорядковує правове життя краю в період між засіданнями кортесів, збираючи #italic донатіво#! та пильнуючи дотримання #italic фуерос#!, що лежать в основі наваррської незалежности. До складу цієї установи входять знать, духовенство та містяни, які обстоюють інтереси своїх станів і цілорічно беруть участь у врядуванні. Отже, депутація насправді є запорукою стабільности країни, однак без належного утримання вона не зможе протистояти агресивному підпорядкуванню, яке завзято втілюють великі монархії."
  por_desembargo_do_paco_bureaucracy: "Верховний королівський суд"
  por_desembargo_do_paco_bureaucracy_desc: "$por_desembargo_do_paco_bureaucracy$ — це найвища судова установа, яка оцінює нові й чинні закони, оголошує помилування та призначає суддів, тим самим зміцнюючи владу корони в усіх куточках країни. На відміну від звичайних судів, де працюють випускники правничих факультетів, верховний суд висуває вищі вимоги до службовців: вони мають бути не лише знавцями права, а й користуватися цілковитою довірою монарха. За належної підтримки з боку держави верховний суд не лише забезпечує точне виконання королівських указів, а й підвищує справність усього урядового устрою."
  por_mesa_da_consciencia_e_ordens_bureaucracy: "Палата сумління й орденів"
  por_mesa_da_consciencia_e_ordens_bureaucracy_desc: "$por_mesa_da_consciencia_e_ordens_bureaucracy$ була заснована задля нагляду за військовими орденами Португалії — орденом Христа, орденом Сантьяго та Авіським орденом, чиї землі, прибутки й духовна влада цілком перейшли у відання корони. Крім того, ця установа розглядає прохання про послаблення приписів віри, розподіляє командорства поміж королівських підданців і розв’язує суперечки між церквою та монархом. Завдяки заснуванню палати військові ордени перетворилися з незалежних духовних об’єднань на знаряддя королівської влади, змушені втілювати волю монарха у справах віри."
  spa_council_of_aragon_bureaucracy: "Рада Арагона"
  spa_council_of_aragon_bureaucracy_desc: "Східні #TOOLTIP:REGION,iberia_region,X #L іберійські#!#! землі, якими володіє [ShowScriptedGeographyName('aragon_geography')], підпорядковуватимуться #italic Раді Арагона#!. Головне завдання цієї установи — підтримка наших торгових зв’язків у Середземномор’ї та узгодження королівських указів із місцевими законами."
  spa_council_of_castile_bureaucracy: "Consejo de Castilla («Рада Кастилії»)"
  spa_council_of_castile_bureaucracy_desc: "#italic $spa_council_of_castile_bureaucracy$#! відає просторими землями, якими володіє [ShowScriptedGeographyName('castile_geography')], і стежить за тим, щоб там неухильно виконувалася воля монарха."
  spa_council_of_flanders_bureaucracy: "Рада Фландрії"
  spa_council_of_flanders_bureaucracy_desc: "[ShowScriptedGeographyName('spanish_netherlands_geography')] лежать далеко від наших кордонів, а тому за цими землями потрібен особливий нагляд. #italic $spa_council_of_flanders_bureaucracy$#! підтримуватиме там лад і пильнуватиме, щоб цей край справно діяв на благо корони."
  spa_council_of_italy_bureaucracy: "Рада Італії"
  spa_council_of_italy_bureaucracy_desc: "Зі зростанням нашої присутности в #TOOLTIP:REGION,italy_region,X #L Італії#!#! у нас постала гостра потреба в особливій установі, яка підтримуватиме лад на нещодавно завойованих землях. Завдяки їй ми зможемо значно вправніше врядувати віддаленими володіннями прямісінько з #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!."
  spa_council_of_portugal_bureaucracy: "Рада Португалії"
  spa_council_of_portugal_bureaucracy_desc: "[ShowScriptedGeographyName('portugal_geography')] поступово переходить під наш контроль, тому нам варто створити особливу раду, яка керуватиме нашими новими володіннями в цьому краї. Серед іншого ця установа пильнуватиме нашу торгівлю в Атлантиці та опікуватиметься справами флоту."
  spa_viceroy_bureaucracy: "Палата віцекороля"
  spa_viceroy_bureaucracy_desc: "$spa_council_of_indies_bureaucracy_desc$"
  spa_council_of_crusade_bureaucracy: "Рада хрестового походу"
  spa_council_of_crusade_bureaucracy_desc: "Заснована за згодою #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L Католицької церкви#!#! і самого [Concept('pope', 'папи')|e], #italic Рада хрестового походу#! опікуватиметься розширенням наших кордонів і повсюдним поширенням #L [ShowReligionAdjective('catholic')|l]ої#! віри."
  spa_council_of_finance_bureaucracy: "Рада фінансів"
  spa_council_of_finance_bureaucracy_desc: "#italic $spa_council_of_finance_bureaucracy$#! замінює дві колишні лічильні палати й тим самим усуває розбіжності між ними, утворюючи єдину установу, яка опікується всіма скарбовими справами країни."
  spa_council_of_indies_bureaucracy: "Рада у справах Індій"
  spa_council_of_indies_bureaucracy_desc: "Усі наші володіння, що лежать за морями, перебуватимуть під віданням #italic Ради у справах Індій#!. Ця установа наглядатиме за нашими заморськими васалами, а також відатиме торгівлею між колоніями та метрополією, щоби до нашої скарбниці справно надходило золото. Забезпечення ладу й добробуту на наших новонабутих землях та їхній подальший розподіл між землевласниками — усе це належатиме до прямих обов’язків ради."
  spa_council_of_inquisition_bureaucracy: "Рада верховної інквізиції"
  spa_council_of_inquisition_bureaucracy_desc: "#italic $spa_council_of_inquisition_bureaucracy$#! складається з кількох папських інквізиторів під проводом великого інквізитора. Рада береже чистоту віри й розглядає справи єретиків та відступників, слугуючи вищою апеляційною установою в духовних справах."
  spa_council_of_military_orders_bureaucracy: "Рада орденів"
  spa_council_of_military_orders_bureaucracy_desc: "#italic $spa_council_of_military_orders_bureaucracy$#! відає великими володіннями, які колись належали духовним орденам. Завдяки цьому ми можемо використовувати їх для потреб нашого війська, набираючи вояків з-поміж місцевих жителів і проводячи там вишкіл майбутніх офіцерів."
  spa_council_of_state_bureaucracy: "Державна рада"
  spa_council_of_state_bureaucracy_desc: "#italic Державна рада#!, на чолі якої стоїть наш правитель, усіляко сприяє уряду у вирішенні посольських питань. До ради входять найвизначніші представники знаті та духовенства, обізнані в міжнародних справах. Ці люди не лише керують нашими посольствами за кордоном, а й радять монарху під час найскладніших перемовин з іншими країнами."