  saharan_trade_house_desc: "Комори цього величного торгового дому завжди повні золота, солі й тканин, які караванами везуть через Сахару. Заснований в одному з торгових осередків, він дозволяє повністю контролювати караванні шляхи й мати постійний дохід від торгівлі в пустелі."
  can_only_be_built_via_saharan_trade_house_action_tt: "Можна заснувати лише за допомогою [Concept('action', 'дії')|e] «[ShowGenericActionName('adu_charter_saharan_trade_house')]» під час [Concept('situation', 'ситуації')|e] «[GetSituationByKey('golden_century').GetName]»"
  RECONQUER_IBERIA_WAR_NAME: "Повернення Іберії"
  golden_century_events.30.title: "Втрачене століття"
  golden_century_events.30.desc: "Золота доба, якої ми так прагнули, раптово добігла кінця. Зрештою чверть земель, які ми утримували на початку доби, відійшли тим силам, що кинули виклик нашій гегемонії. [target_ruler.GetName] не [Select_CString(target_ruler.IsFemale, 'впоралася', 'впорався')] зі своїм завданням, а тому наша країна більше не може претендувати на світове панування.\n\nЛегенду про наш величний розквіт затьмарить хіба що історія нашого гучного падіння. Усе, що нам лишається, — зібратися із силами та спробувати пережити прийдешні роки."
  golden_century_events.30.a: "Ось і добігла кінця наша золота доба."
  golden_century_events.31.title: "Падіння колоса"
  golden_century_events.31.desc: "Гегемон нашої доби в особі #ONCLICK:COUNTRY,[gc_hegemon.GetKey] #TOOLTIP:COUNTRY,[gc_hegemon.GetKey],X [gc_hegemon.Custom('CL_GEN')|L]#!#! зазнав приниження та втратив чверть своїх земель. Колос, що колись підкорив собі всю #TOOLTIP:CONTINENT,europe,X #L Європу#!#! й далекі моря, нарешті повалений, і тепер маятник влади неминуче хитнеться в інший бік…"
  golden_century_events.31.desc.destroyed: "Колос, що колись височів над добою, повністю стертий з мапи. Країна, яка затьмарювала #TOOLTIP:CONTINENT,europe,X #L Європу#!#! та моря за її межами, зруйнована, а її землі розділені між тими, кого вона колись підкорювала. Рівновага доби знову змінюється."
  golden_century_events.31.a: "Коаліція виконала свій обов’язок."
  golden_century_events.31.b: "Настає нова доба."
  gc_ending_defeat_member_tt: "Оскільки ми виступили в коаліції проти #ONCLICK:COUNTRY,[gc_hegemon.GetKey] #TOOLTIP:COUNTRY,[gc_hegemon.GetKey],X [gc_hegemon.Custom('CL_GEN')|L]#!#!, тепер нам доступний привід для війни «[ShowCasusBelliName('cb_reconquer_iberia')]», що знижує витрати воєнного рахунку на захоплення #TOOLTIP:REGION,iberia_region,X $tt_op_L$Іберії$tt_cl_2$. Найсильніший із нас заслужить титул руйнівника Іберії"
  golden_century_events.33.title: "Золота доба"
  golden_century_events.33.desc: "Від початку нашого розквіту минула сотня років, але наша велич усе так само незаперечна. Усі, хто об’єднувався в коаліції та кидав нам виклик, так чи інакше зазнали поразки й розпорошилися. [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'привела', 'привів')] нашу країну в золоту добу, про яку згадуватимуть ще численні покоління наших нащадків.\n\nУсі наші надбання в #TOOLTIP:CONTINENT,europe,X #L Європі#!#! та за межами океану вже стали невіддільною частиною [ROOT.GetCountry.Custom('rank_ua_GEN')|l], і жодна сила не зможе цього змінити."
  golden_century_events.33.a: "Цей вік лишився за нами."
  golden_century_events.34.title: "Тріумф колоса"
  golden_century_events.34.desc: "[gc_hegemon.GetName] пережи[gc_hegemon.Custom('endrank_vlaloly')] всі випробування минулої доби, зберігши при цьому свою гегемонію. Золота доба цієї країни безсумнівно увійде в історію, а її вплив у #TOOLTIP:CONTINENT,europe,X $tt_op_L$Європі$tt_cl_2$ та інших частинах світу залишить свій слід на багато поколінь."
  golden_century_events.34.a: "Нам не вдалося їх зламати."
  golden_century_events.34.b: "Історія запам’ятає їхній тріумф."
  golden_century_events.54.title: "Великий союз осоромлено"
  golden_century_events.54.desc: "Коаліція, створена проти нас, розгромлена у відкритій війні, а її учасники дорого заплатили за свою зухвалість. Наші колишні суперники розривають свої великі союзи, воліючи рятуватися поодинці, аніж разом зазнати поразки.\n\nМи довели свою спроможність перед усіма дворами #TOOLTIP:CONTINENT,europe,X #L Європи#!#!. Принци, які шепотілися, що нашому піднесенню час покласти край, тепер говорять про нас геть в іншому тоні."
  golden_century_events.54.a: "Нехай розбігаються."
  gc_ga_humbled_tt: "Воєнна перемога над Великим союзом збільшує наше [Concept('gc_european_dominance', 'європейське панування')|e] на #Y 10#!, а його переможені учасники залишають [Concept('international_organization', 'міжнародне об’єднання')|e]"
  gc_salamanca_embrace_tt: "Численні [Concept('pops', 'громади')|e] наших осередків просвітництва, які не поділяють нашої [Concept('religion', 'віри')|e] чи [Concept('culture', 'культури')|e], приймуть їх"