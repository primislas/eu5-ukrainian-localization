  gc_develop_target_province_tt: "Підвищує [Concept('prosperity', 'процвітання')|e] усіх [Concept('location', 'місцевостей')|e] провінції [target_province.GetName], а також [Concept('development', 'розвиток')|e] [target_location.Custom('LR_GEN')] [target_location.GetName]"
  gc_decision_iberian_union_leader_tt: "Ми є старшим партнером у глибоко інтегрованій Іберійській унії"
  gc_decision_muslim_branch_tt: "Ми правимо як [ShowFormableCountryName('MOR_f')] або відновили [ShowFormableCountryName('ADU_f')]"
  gc_colonial_dominance: "Панування в колоніях"
  gc_colonial_dominance_desc: "Наш вплив у Новому Світі щомісяця зростає завдяки колоніям, кораблям зі скарбами, морському хисту та вірі, яку ми принесли з собою. Тут починається наша золота доба, де кожне нове досягнення обертається тривалим здобутком."
  GC_COLONIAL_DOMINANCE_DISPLAY: "$VAL$"
  gc_european_dominance: "Панування в Європі"
  gc_european_dominance_desc: "Щомісяця наша влада над Європою міцнішає. І причини тому: розміри країни, її стабільність, наш військовий хист та непохитне право на владу в рідному регіоні. Наш успіх високо цінують на батьківщині, а кожне нове досягнення обертається тривалим здобутком."
  GC_EUROPEAN_DOMINANCE_DISPLAY: "$VAL$"
  GC_CURRENT_DOMINANCE: "Поточне значення [MonthlySavedVariable.GetName]: [FixedPointToFloat(SituationView.GetActiveSituation.GetVariable(MonthlySavedVariable.GetTag))|2G]"
  GC_DOMINANCE_MONTHLY_CHANGE_TITLE: "Щомісяця змінюється на [MonthlySavedVariable.GetMonthlyChangeValue(SituationView.GetActiveSituation.GetBaseClass)|+=2]. Причини:"
  GC_EUROPEAN_DOMINANCE_SOURCES_TITLE: "Одноразові зміни [Concept('gc_european_dominance', 'європейського панування')|e]:"
  GC_EUROPEAN_DOMINANCE_SOURCES: "$GC_EUROPEAN_DOMINANCE_SOURCES_TITLE$\n$GC_DOMINANCE_SOURCE_HUMBLE_GRAND_ALLIANCE$: [ShowSimpleCustomTooltipLocalized('GC_DOMINANCE_VALUE_HUMBLE_GRAND_ALLIANCE', 'GC_DOMINANCE_SOURCE_HUMBLE_GRAND_ALLIANCE', '', '', '', '', 'GC_DOMINANCE_HUMBLE_GRAND_ALLIANCE_TT')]\n$GC_DOMINANCE_SOURCE_GREAT_BATTLE$: #G +0,10#!\n$GC_DOMINANCE_SOURCE_EUROPEAN_EVENTS$: #G +2,50#! або #R -2,50#!\n$GC_DOMINANCE_SOURCE_CURB_EUROPEAN$: #R -25#!"
  GC_COLONIAL_DOMINANCE_SOURCES_TITLE: "Одноразові зміни [Concept('gc_colonial_dominance', 'колоніального панування')|e]:"
  GC_COLONIAL_DOMINANCE_SOURCES: "$GC_COLONIAL_DOMINANCE_SOURCES_TITLE$\n$GC_DOMINANCE_SOURCE_COLONIAL_CHARTER$: #G +0,05#!\n$GC_DOMINANCE_SOURCE_CURB_COLONIAL$: #R -25#!"
  GC_DOMINANCE_SOURCE_HUMBLE_GRAND_ALLIANCE: "Виграно війну з Великим союзом"
  GC_DOMINANCE_VALUE_HUMBLE_GRAND_ALLIANCE: "#G +10#!"
