  golden_century_events.40.title: "Заколот станів"
  golden_century_events.40.desc.desc_spa: "Привілейовані стани [ROOT.GetCountry.Custom('rank_ua_GEN')|l] виступили проти нас єдиним фронтом у відповідь на наші недавні спроби зміцнити владу за їхній же кошт. Тепер гранди, прелати та купці з привілейованих міст в один голос заявляють, що ми перетворюємося на тиранів. Вони розгортають знамена й збирають загони, аби змусити нас поступитися своїми домаганнями."
  golden_century_events.40.desc.desc_adu: "Великі роди [ROOT.GetCountry.Custom('rank_ua_GEN')|l] об’єдналися й виступили проти нас. Настільки обурливої непокори тих, хто завдячує нам своїми привілеями, ми не бачили вже багато століть! Подібне зухвальство й непомірну пиху слід покарати. Кожен дрібний сеньйор, купець і клірик зажадав влади, яка по праву належить нам, і ми цього не стерпимо!"
  golden_century_events.40.desc.historical_info_spa: "Спроби іспанської корони зосередити владу викликали запеклий опір із боку привілейованих станів. Під час повстання комунерос у 1520–1521 роках міста Кастилії повстали проти Карла V. А гранди та кортеси ще довго відстоювали свої вольності проти зазіхань корони."
  golden_century_events.40.desc.historical_info_adu: "Впливові та знатні роди постійно кидали виклик столичній владі в Аль-Андалусі. Після 1009 року міжусобні війни ( #italic фітни#!) спричинили розпад Кордовського халіфату, а честолюбні намісники, бажаючи правити на власний розсуд, раз у раз повставали проти володаря."
  golden_century_events.40.a: "Вони забули, кому служать!"
  X_provinces_may_rise_in_revolt_tt: "[Concept('provinces', 'Провінції')|e] (#Y [ROOT.GetVariable('golden_century_events_40_display_prov_rebel_variable').GetValue|V0]#!) приєднаються до заколотників ([target_rebel.GetName]). Усі тамтешні жителі вищих верств повстануть проти нас"
