  golden_century_events.41.title: "Зіткнення старого й нового"
  golden_century_events.41.desc: "Стани вимагають обмеження нашої влади. Вони вважають, що, позбавивши їх привілеїв, ми послабили їхній вплив, а тому вимагають повернути все, як було.\n\nСтарий лад опирається новому. Стародавні роди, чиї особливі права передаються у спадок, виступають проти збудованої нами зосередженої влади. І кожен новий указ вони сприймають як зазіхання на те, що належить їм по праву. Якщо ми поступимося, перевага буде на їхньому боці, і минула ієрархія повернеться."
  golden_century_events.41.desc.historical_info_spa: "Католицька монархія, володіння якої розкинулися від Кастилії до Арагону, постійно зазнавала нападів привілейованих станів. Кортеси відстоювали своє право на збір податків, арагонські та каталонські #italic фуерос#! зв’язували королівські руки, а гранди й незалежні міста трималися за свої особливі права, які не могла обмежити жодна реформа."
  golden_century_events.41.desc.historical_info_adu: "Провінції постійно опиралися столичній владі в Аль-Андалусі. Влада Омеядів Кордови трималася коштом найманого чиновництва, однак впливові родини, порубіжні правителі та міста виступали проти них. Після 1031 року країна розпалася на князівства (#italic тайфи#!), у яких кожен правив так, як хотів."
  golden_century_events.41.a: "Ми поступаємося їхнім вимогам."
  golden_century_events.41.b: "Криза — це завжди час можливостей."
  estates_protest_our_rejection_tt: "Стани обурені нашою відмовою"
  golden_century_events.42.title: "Зосередження влади"
  golden_century_events.42.desc: "Настав час узяти кермо влади у свої руки. Пора приборкати старі стани та місцевих волелюбців, які вже давно сковують столичну владу, щоби весь державний устрій почав служити єдиній меті.\n\nТака нагода випадає лише раз. Якщо ми зараз виявимо рішучість, то підпорядкуємо собі всі ради, суди та джерела прибутків. Наша держава стане єдиною."
  golden_century_events.42.desc.historical_info_spa: "Союз Кастилії та Арагону під проводом Ізабели й Фердинанда став однією з перших сучасних держав Європи. У XVI столітті корона правила за допомогою королівських рад, відряджала #italic корехідорів#! керувати містами, змогла втихомирити кортеси та духовно-лицарські ордени й тим самим поступово зосередила всю владу у своїх руках."
  golden_century_events.42.desc.historical_info_adu: "У добу свого розквіту Кордовський халіфат, створений після 929 року Абд ар-Рахманом III, був однією з найбільш упорядкованих держав свого часу. Халіф утримував #italic диван#! та постійне військо, а також призначав у містах намісників, що дозволяло йому правити об’єднаним Аль-Андалусом просто зі столиці на заздрість роздробленим сусідам."
  golden_century_events.42.a: "Вся влада столиці."
  golden_century_events.42.b: "Посилення правлячої ради."
  golden_century_events.42.c: "Збір великого війська."
  golden_century_events.43.title: "Золота доба мистецтв"
  golden_century_events.43.desc.desc_spa: "Багатство та впевненість у завтрашньому дні часом здатні породити диво: [ROOT.GetCountry.GetCapital.GetName] переживає справжній розквіт хисту. Театри переповнені, друкарні заледве встигають друкувати нові вірші та поеми, а художники, рівних яким, можливо, в історії нашої держави ніколи вже не буде, пишуть шедеври для корони та церкви.\n\nНаш двір приковує погляди найкращих умів #TOOLTIP:CONTINENT,europe,X #L Європи#!#!, і кожен чекає, що [ROOT.GetCountry.GetGovernment.GetRuler.GetName|l] стане головним опікуном мистецтва нашого часу. Срібло принесло нам землі — тепер воно може принести й славу. Адже будь-яку добу пам’ятають не лише за те, що вона подарувала людству, а й за ту ціну, яку вона за це зажадала. Тож відчинімо скарбницю [ROOT.GetCountry.Custom('rank_ua_GEN')|l], і нехай митці черпають із неї досхочу."
  golden_century_events.43.desc.desc_adu: "У стінах міста [ROOT.GetCapital.GetName] знову пробуджується прадавній потяг до знань. Поети обмінюються віршами до глибокої ночі, при дворі збираються лікарі й астрономи, а пісні Аль-Андалуса знову лунають у подвір’ях, де досі панувала тиша.\n\nУпродовж багатьох століть наші міста були маяком для західних країн, що освітлював їм шлях до знань, і тепер нам знову належить розпалити це вогнище. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] чує безліч порад зібрати при дворі найобдарованіших людей з усіх усюд, поповнити книгозбірні, підтримати школи й знову довести всьому світові: [ROOT.GetCountry.GetName] як і раніше зоста[ROOT.GetCountry.Custom('end_yeyu')]ться осередком мудрості та просвіти. Настав час нашій країні стати опікункою талантів."
  golden_century_events.43.desc.historical_info_spa: "Золота доба Іспанської імперії (#italic Siglo de Oro#!) супроводжувалася небувалим розквітом культури, який живило срібло з Нового Світу. Цей час подарував світові #italic Дон Кіхота#! Сервантеса, театр Лопе де Веги й Кальдерона, а також твори Ель Ґреко, Веласкеса та Мурільйо."
  golden_century_events.43.desc.historical_info_adu: "Кордова X століття була найосвіченішим містом у Західній Європі, а її книгозбірня — найбільшою на континенті. Знання в медицині, філософії та астрономії вчених Кордови (серед них філософ Ібн Рушд і хірург Аз-Захраві) поширилися далеко за межі мусульманського світу. Велич цього міста відбилася в насрідській Альгамбрі в Гранаді."
  golden_century_events.43.a: "Нехай ця доба стане золотою."
  golden_century_events.44.title: "[target_character.GetNameWithNoTooltip] стає нам на службу"
  golden_century_events.44.desc.desc_spa: "[ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'отримала', 'отримав')] звістку про людину на ім’я [target_character.GetName], і ті, кому довелося бачити [Select_CString(target_character.IsFemale, 'її', 'його')] у ділі, тільки про [Select_CString(target_character.IsFemale, 'неї', 'нього')] й говорять. Чи то командування військами, чи то виступ перед радою, [Select_CString(target_character.IsFemale, 'вона', 'він')] незмінно показує дивовижний хист. Залучити таку людину — рідкісна вдача для корони, яка деколи випадає лиш раз у житті.\n\nТакий хист не залишиться непоміченим надовго. Якщо ми хочемо, щоби [target_character.GetNameWithNoTooltip] [Select_CString(target_character.IsFemale, 'служила', 'служив')] нашій державі, а не комусь іншому, [Select_CString(target_character.IsFemale, 'її', 'його')] необхідно схилити на наш бік уже зараз — надати [Select_CString(target_character.IsFemale, 'їй', 'йому')] достатньо почестей і повноважень, щоби [Select_CString(target_character.IsFemale, 'вона залишилася', 'він залишився')] з нами."
  golden_century_events.44.desc.desc_adu: "[target_character.GetName] [Select_CString(target_character.IsFemale, 'постала', 'постав')] перед [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'правителькою', 'правителем')], і [ROOT.GetCountry.GetGovernment.GetRuler.GetName] одразу [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'зрозуміла', 'зрозумів')], що похвали, які всі придворні виголошують цій людині, — аж ніяк не порожні слова. І в залі ради, і у воєнному поході [Select_CString(target_character.IsFemale, 'вона', 'він')] виявляє дивовижні здібності, від яких не раз залежала доля цілих домів.\n\nТакий розум — велика цінність для будь-якого двору. Якщо [target_character.GetNameWithNoTooltip] отримає від нас належну посаду та почесті вже зараз, ми зможемо втримати [Select_CString(target_character.IsFemale, 'її', 'його')] на службі нашій країні. Але якщо зволікатимемо — хтось інший неодмінно скористається цією нагодою."
  golden_century_events.44.desc.historical_info_spa: "Гонсало Фернандес де Кордова, прозваний #italic «Великим капітаном»#!, був найкращим вояком свого часу. У часи Італійських воєн він розбив численніші французькі війська біля Черіньйоли та Гарільяно, захопив для іспанської корони Неаполь і став його першим віцекоролем. Його озброєна піками, мечами та вогнепальною зброєю піхота стала основою іспанських #italic терцій#!, які понад століття залишалися провідною військовою силою на полях європейських битв."
  golden_century_events.44.desc.historical_info_adu: "Доля Аль-Андалусу часто залежала від одного видатного радника. Таким був #italic хаджиб#! аль-Мансур. Прозваний християнами Альмансором, він очолював успішні походи проти північних королівств і фактично став правителем усього халіфату."
  golden_century_events.44.a: "Нехай [target_character.GetNameWithNoTooltip] стане до нас на службу."
  golden_century_events.45.title: "Державний перепис"
  golden_century_events.45.desc.desc_spa: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'отримала', 'отримав')] від наших писарів пропозицію провести загальний перепис: перелічити кожне вогнище, оцінити кожне поле й занести справжнє багатство [ROOT.GetCountry.Custom('rank_ua_GEN')|l] до реєстрів, яким корона зможе довіряти. Праця ця повільна й невдячна, а ті, хто ухиляється від сплати податків, клястимуть землемірів на чому світ стоїть.\n\nАле країною, яка знає себе, значно легше врядувати. Справедливо збирати податки, набирати війська відповідно до наших спроможностей і витрачати кошти, спираючись на точний облік, а не на самі лише здогадки — ось та сила, на якій тримається влада, здатна встояти під натиском часу. Хто володіє знанням, той володіє становищем. Настав час розпочати перепис."
  golden_century_events.45.desc.desc_adu: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'отримала', 'отримав')] від наших писарів наполегливу пораду знову впорядкувати реєстри: перелічити люд і хто чим володіє, як колись робив #italic диван#! — від Кордови до Багдада. Вони нагадують: облікова книга, яку ведуть чесно й ретельно, — це підвалина, на якій тримається будь-яка міцна влада.\n\nСаме завдяки такому копіткому обліку наші пращури мали змогу платити чиновникам і війську та водночас мати таку скарбницю, якій жителі півночі могли лише заздрити. Відродження цього звичаю дасть змогу замінити здогадки правителя на точні записи, і тоді вся наша країна коритиметься єдиному знанню. Настав час розпочати перепис."
  golden_century_events.45.desc.historical_info_spa: "Кастильська корона періодично проводила масштабні переписи (#italic averiguaciones#!) та перелічувала вогнища й матеріальні статки, щоб визначити розмір податків. Габсбурги поширили цей звичай на всі свої неозорі володіння."
  golden_century_events.45.desc.historical_info_adu: "Омеядською Кордовою врядували за допомогою складно влаштованого #italic дивана#! — спадщини урядового устрою Дамаска та Багдада. Його чиновники й податкові реєстри забезпечували країну такими прибутками, що заздрила вся християнська Європа."
  golden_century_events.45.a: "Проведімо перепис."
  golden_century_events.46.title: "Ярмарки переповнені"
  golden_century_events.46.desc.desc_spa: "Ярмарки цьогоріч розрослися до небачених досі розмірів. Купці сходяться з усіх королівств #TOOLTIP:CONTINENT,europe,X #L Європи#!#!, векселі переходять із рук у руки, та ще й на такі суми, за які колись можна було оплатити цілу війну, а в міняльних конторах країни від самого світанку до заходу сонця не вщухає дзвін монет.\n\nАле це не триватиме вічно. Доки генуезці та великі банкірські доми охоче дають нам позики, а срібло тече рікою, ми можемо пов’язати їхні гроші з нашою короною, спрямувати їхню торгівлю через наші міста й брати десятину з кожної укладеної угоди. Доля дарує нам чудову нагоду. Скористаймося ж нею сповна."
  golden_century_events.46.desc.desc_adu: "Ще ніколи ринки міста [ROOT.GetCapital.GetName] не бачили такого натовпу. Каравани з #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! та заморські кораблі нескінченним плином везуть шовк, папір, шкіру й полив’яні вироби, які наші власні майстри відправляють за кордон. Міняйли ледь устигають обслуговувати люд біля яток.\n\nТоргівля в західному морі завжди була джерелом сили Аль-Андалусу — у вдалі роки вона приносила більше багатств, аніж будь-яка данина, зібрана з подоланих ворогів. Якщо ми убезпечимо дороги, полегшимо шлях купцям і збережемо наші порти предметом заздрощів для всього узбережжя, цей розквіт торгівлі наповнюватиме нашу скарбницю ще довгі роки. Не можна марнувати таку нагоду."
  golden_century_events.46.desc.historical_info_spa: "Ярмарки в Медіна-дель-Кампо були фінансовим осередком Кастилії. Саме там більшість європейців розраховувалася векселями, а генуезькі й німецькі банки укладали угоди з короною."
  golden_century_events.46.desc.historical_info_adu: "Андалусія вела торгівлю на всіх теренах від Магрибу до Леванту. Кордова та Гранада постачали шовк, папір, шкіру й люстрові вироби. Ринки цих міст були одними з найжвавіших у всьому середньовічному Середземномор’ї."
  golden_century_events.46.a: "Нехай торгівля квітне."
  golden_century_events.47.title: "Нове «Мистецтво війни»"
  golden_century_events.47.desc.desc_spa: "Наші капітани навчають піхоту по-новому, шикуючи пікінерів і стрільців у каре, які не здригнуться ні перед кіннотою, ні перед зімкнутими лавами ворога. Старі вояки, які бачили чимало битв у #TOOLTIP:CONTINENT,europe,X #L Європі#!#!, клянуться, що ще ніколи їм не доводилося бачити настільки міцного строю.\n\nЯкщо дати нашим військам гроші й час, щоб відточити це мистецтво, вони можуть стати грізною силою на будь-якому полі бою, а назви наших полків вимовлятимуть зі страхом від #TOOLTIP:REGION,italy_region,X #L Італії#!#! до північних земель. Війни виграють ті, хто опановує нове воєнне мистецтво раніше, ніж супротивник навчиться йому протистояти. Потрібно виділити кошти на реформи."
  golden_century_events.47.desc.desc_adu: "Наші командири наполягають на тому, що [ROOT.GetCountry.GetGovernment.GetRuler.GetName] [Select_CString(ROOT.GetCountry.GetGovernment.GetRuler.IsFemale, 'повинна', 'повинен')] відродити давнє воїнське мистецтво: стрімку легку кінноту, яка виснажує ворога й обходить його з флангів. Крім того, нова порохова зброя стане їй чудовою підмогою. У порубіжних землях завжди важили стрімкість і зненацькість, і небагато хто володів цими чеснотами настільки вправно, як наші пращури.\n\nПоєднаймо цю прадавню хитрість із гарматами нової доби — і знамен наших військ жахатимуться і за морем, і серед пісків, як на християнському порубіжжі, так і на берегах #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#!. [ROOT.GetCountry.GetFlavorRank] не втримає своїх кордонів, якщо не опановуватиме нових способів ведення війни. Потрібно виділити кошти на реформи."
  golden_century_events.47.desc.historical_info_spa: "Іспанський полководець Гонсало де Кордова вперше застосував #italic терцію#! — особливий бойовий стрій із пікінерів та аркебузирів, який понад століття панував на полях європейських битв і перетворив Іспанію на провідну військову державу свого часу."
  golden_century_events.47.desc.historical_info_adu: "#italic Хінети#! високо цінувалися в андалуських і берберських війнах. Ці вершники були легко озброєні й моторні, а в бою використовували дротики та мечі. А гранадські Насріди були одними з перших на півострові, хто застосував порохові гармати проти своїх ворогів."
  golden_century_events.47.a: "Проведімо реформи коштом скарбниці."
  golden_century_events.48.title: "Оплот знань"
  golden_century_events.48.desc.desc_spa: "Навіть старожили вже не пам’ятають, коли востаннє університетські авдиторії [ROOT.GetCountry.Custom('rank_ua_GEN')|l] гули так гучно. Правники сперечаються, чи має правитель за законом право робити те, що він і так намірився вчинити, богослови розмірковують про права заморських народів, а половина #TOOLTIP:CONTINENT,europe,X #L європейських#!#! дворів пише нам, благаючи надіслати копію висновку.\n\nНехай ніхто не скаже, що ми пошкодували грошей для вчених. Ми заснуємо виплати для величних шкіл, а Саламанку піднесемо вище за всі інші — тоді праці з нашого краю цитуватимуть навіть там, куди ніколи не ступало наше військо. Страхом можна вселити покору будь-кому, але коли до тебе дослухаються з власної волі — ось справжня перемога. Потрібно заснувати стипендії для вчених."
  golden_century_events.48.desc.desc_adu: "Медресе нашої країни знову переповнені, а лікарі, астрономи й перекладачі взялися до праці з подвійною ретельністю, наче після надто тривалого перепочинку. Старі книги знову знімають із полиць, а суперечки, які вони розпалюють, сягають корінням у ще давніші часи.\n\nМи маємо підтримати ці прихистки знань і дозволити їм розквітнути. Нехай пам’ять про величну бібліотеку Кордови, яка колись змушувала всі двори Заходу соромитися власного невігластва, спонукає нас не лише вдаватися до спогадів. Розпорошені знання ще можна зібрати воєдино. Потрібно заснувати стипендії для вчених."
  golden_century_events.48.desc.historical_info_spa: "Заснований у 1218 році Саламанкський університет був одним із найдавніших і найуславленіших університетів Європи. У XVI столітті при ньому постала так звана «Саламанкська школа», біля витоків якої стояв домініканець Франсіско де Віторія. Її представники відродили схоластичну думку та обговорювали права народів Америки й правові межі ведення війни — питання, що заклали підвалини міжнародного права."
  golden_century_events.48.desc.historical_info_adu: "За переказами, Кордовська книгозбірня, зібрана за правління халіфа аль-Хакама II, налічувала сотні тисяч томів і вважалася найбільшим зібранням книг на Заході. Її перекладачі познайомили християнську Європу з #italic фалсафою#! (ісламською філософією) Ібн Рушда, якого латиняни знали під ім’ям Аверроес. Водночас у стінах гранадського #italic бімаристану#! (лікарні) викладали медицину — в добу, коли більша частина континенту все ще покладалася лише на молитви."
  golden_century_events.48.a: "Надати вченим кошти."
  golden_century_events.49.title: "Розрахунок за боргами"
  golden_century_events.49.desc.desc_spa: "Попри все те срібло, що надходить до нас із-за океану, ми однаково опинилися в боргах перед позикодавцями. Банкіри трясуть нашими борговими розписками, лихва зжирає доходи від срібного флоту ще до того, як він увійде до порту, а від нас вимагають виплат, які скарбниця просто не в змозі здійснити.\n\nГідного виходу більше немає — час ухвалити важке рішення. Ми можемо призупинити сплату боргів і порушити слово, дане домам, які забезпечують наші війни, або ще дужче обкласти податками країну, витискаючи з неї все до останньої монети."
  golden_century_events.49.desc.desc_adu: "[ROOT.GetCapital.GetName] більше не в змозі виконувати свої грошові зобов’язання. Нескінченні видатки на утримання рубежів, платня воякам #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! та данина, якої вимагають могутніші сусіди, виснажили наші запаси.\n\nЛихварі стають дедалі наполегливішими, хоча навіть вони не зрівняються з військовими скарбниками: військо, що лишилося без платні, швидко розійдеться або оберне зброю проти нас самих. Зволікати більше не можна. Ми мусимо знайти гроші, відмовитися від сплати боргів або втратити тих, хто береже безпеку наших кордонів."
  golden_century_events.49.desc.historical_info_spa: "Попри приплив срібла з Америки, іспанська корона неодноразово оголошувала про банкрутство, не маючи змоги обслуговувати свої величезні борги перед банківськими домами Фуггерів та Генуї. Так, зокрема, було в 1557, 1575 та 1596 роках."
  golden_century_events.49.desc.historical_info_adu: "Країни Аль-Андалусу та Магрибу постійно відчували брак коштів через видатки на прикордонні сутички, необхідність платити платню берберським найманцям і данину, якої вимагали могутніші сусіди, — такий тягар міг спустошити скарбницю швидше, ніж податки встигали її поповнити."
  golden_century_events.49.a: "Знецінити монету і спробувати подолати труднощі."
  golden_century_events.49.b: "Затягнути паски!"
  golden_century_events.50.title: "Чума в самому серці країни"
  golden_century_events.50.desc: "#TOOLTIP:DISEASE,bubonic_plague,X #L Бубонна чума#!#! проникла в саме серце [ROOT.GetCountry.Custom('rank_ua_GEN')|l]. Вона спустошує села й нишпорить міськими завулками, не жаліючи ані багатих, ані бідних. Цвинтарі за міськими мурами ледве встигають приймати все нові й нові вози з мерцями. Лікарі поки безсилі й не можуть спинити цю напасть.\n\nПроти ворога, якого не спинити ні облогою, ні угодою, короні лишається тільки зберігати самовладання і робити все необхідне: ховати мертвих, годувати та давати прихисток живим і підтримувати лад там, де паніка може забрати більше життів, ніж сама пошесть. Зараз ми можемо лише піклуватися про люд, терпіти та молитися, щоб це жахіття якомога швидше скінчилося."
  golden_century_events.50.desc.historical_info: "Після Чорної смерті XIV століття Піренейський півострів неодноразово переживав нові спалахи чуми, що спустошували міста й села, скорочували чисельність працездатного люду та підривали доходи скарбниці, від яких залежала кожна країна. Лише один кастильський чумний мор, що тривав з 1596 по 1602 рік, за деякими оцінками, забрав близько шестисот тисяч життів, що стало демографічним потрясінням, від якого Кастилія так і не змогла повністю оговтатися і яке історики зараховують до причин її затяжного занепаду."
  golden_century_events.50.a: "Годі кашляти одне на одного!"
  golden_century_events.51.title: "Заколот на порубіжжі"
  golden_century_events.51.desc: "Область [target_area.GetName] відкрито повстала, до того ж заколот розгорівся мало не під самими мурами нашої столиці. Місцеві жителі взялися до зброї, вигнали наших чиновників і заявили, що відтепер більше нам не підкоряються.\n\nМи не можемо лишити безкарним повстання, що спалахнуло біля самого серця нашої країни. Кожен край, який побачить таку непокору й вирішить, що за це нічого не буде, замислиться і про власну нагоду. Одна іскра заколоту здатна спопелити цілу країну. Ми мусимо придушити повстання, доки цей приклад не наслідували інші."
  golden_century_events.51.desc.historical_info: "Правителів Іберії завжди переслідував привид заколотів і повстань у власних землях. У 1031 році Кордовський халіфат розпався на безліч #italic тайф#!, на чолі яких постали дрібні еміри. Багато століть потому мориски — мусульмани, змушені колись прийняти католицтво, — підняли повстання проти кастильського панування і в період з 1568 по 1571 рік вели жорстоку війну в гірських землях Альпухарри. Крім того, #italic фуерос#! Арагону та Каталонії накладали жорсткі обмеження на владу корони. На цьому півострові доведена до крайнощів провінція завжди була готова підняти власне знамено."
  golden_century_events.51.a: "Ми не залишимо їхню непокору без відповіді."
  golden_century_events.52.title: "Голод і бунт"
  golden_century_events.52.desc: "Врожай загинув, і хліб став надто дорогим для простого люду. У містах [ROOT.GetCountry.Custom('rank_ua_GEN')|l] голодні юрби збираються біля комор і зчиняють бунти, а села пустіють: зневірені люди йдуть у пошуках кращої долі.\n\nУ голодні роки правителя судять значно суворіше, ніж у часи достатку. Голодному люду байдуже до срібла, добутого за морем, коли вдома немає й кусня хліба. Від порожнього шлунка до каменя, кинутого в нашого чиновника, шлях недовгий. Ми мусимо знайти хліб, наповнити ринки та зберегти лад на вулицях — інакше наш власний зголоднілий люд стане страшнішим за будь-яке вороже військо."
  golden_century_events.52.desc.historical_info: "Найбільші міста Піренейського півострова завжди були беззахисними перед браком харчів: один неврожай або порушення торгових шляхів могли за лічені місяці обернутися голодом і бунтом на міських вулицях. Голод і знелюднення сіл на початку XVII століття, що стали частиною занепаду Кастилії, гнали місцевих жителів із землі та перетворили бунти за хліб на звичне явище іспанського міського життя."
  golden_century_events.52.a: "Нас оточують голодні юрби."
  gc_decision.title: "Початок Золотої доби"
  gc_decision.desc: "[GetSituationByKey('battle_for_the_strait').GetName] завершилася, і саме наш стяг майорить над #TOOLTIP:LOCATION,strait_of_gibraltar,X #L Гібралтарською протокою#!#!. Вся південна частина #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! відтепер підкоряється нашій державі, і не лишилося суперників, здатних оскаржити цю владу.\n\nТа однієї пам’яті про перемогу буде замало — прийдешня доба має сповнитися нових звершень. У #TOOLTIP:CONTINENT,europe,X #L Європі#!#! тепер дослухаються до наших слів — навіть там, куди ще ніколи не ступали наші війська, а за океаном на нас чекають незвідані береги. Нехай ім’я #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! гримить упродовж усієї прийдешньої доби."
  gc_decision.desc.entry: "Той, хто утримує [ShowLocationName('strait_of_gibraltar')], тримає браму між Середземним морем та океаном, і тепер ця брама — наша. Мир на півдні звільняє нашу скарбницю та наш флот для більших прагнень — як у #TOOLTIP:CONTINENT,europe,X #L Європі#!#!, так і на далеких берегах. Війни виграють за один сезон, але золоту добу треба розбудовувати."
  gc_decision.a: "Багато мап доведеться переписати!"
  restore_cordoba.title: "Відбудова Кордови"
  restore_cordoba.desc: "Колись #TOOLTIP:LOCATION,cordoba,X #L Кордова#!#! була перлиною Заходу, але відтоді втратила колишню велич, якою сяяла за халіфів. Її книгозбірні та велика мечеть викликали заздрість у всього континенту. Потрібно використати багатства нашої країни та знову перетворити Кордову на найвеличніше місто #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!."
  restore_cordoba.a: "Відновити перлину Аль-Андалусу."
  enable_decision_to_restore_learning_center_in_cordoba_tt: "Доступне [Concept('decision', 'рішення')|el] #Y $restore_cordoba.title$#!"
  library_cordoba: "Кордовська книгозбірня"
  library_cordoba_desc: "У дні свого розквіту $library_cordoba$ берегла сотні тисяч томів — це була найбільша збірка книг на Заході, якій заздрили від #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! до земель #TOOLTIP:REGION,crescent_region,X #L Родючого півмісяця#!#!. Після відновлення вона знову приваблює вчених, перекладачів і переписувачів з усього світу, а #TOOLTIP:LOCATION,cordoba,X #L Кордова#!#! повернула собі статус осередку просвіти."
  library_cordoba_maintenance: "$library_cordoba$"
  gc_change_colonial_dominance: "[gc_colonial_dominance|e]: $VALUE|+$"
  neg_gc_change_colonial_dominance: "[gc_colonial_dominance|e]: $VALUE|+$"
  gc_change_european_dominance: "[gc_european_dominance|e]: $VALUE|+$"
  neg_gc_change_european_dominance: "[gc_european_dominance|e]: $VALUE|+$"
  golden_century_events.1.title: "Золота доба [ROOT.GetCountry.Custom('CL_GEN')]"
  golden_century_events.1.desc.desc_spa: "Тривала [GetSituationByKey('battle_for_the_strait').GetName|l] завершилася нашою перемогою, і тепер наша країна стала головною силою #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!. Давні суперники розбиті, південні рубежі нарешті в безпеці, і [target_ruler.GetName], покінчивши із цією священною війною, [Select_CString(target_ruler.IsFemale, 'готова', 'готов')] взятися за куди важчу справу — об’єднання розрізнених земель в єдину державу.\n\nПеред нами відкриваються одразу два шляхи. Один із них — [ShowContinentName('europe')], яка колись не зважала на нас, а тепер дослухається до кожного нашого слова. Другий — заморські землі та душі, які ще не пізнали світла #TOOLTIP:RELIGIONGROUP,christian,X #L християнської#!#! віри. Прийдешнє століття покаже, наскільки значною частиною цих двох світів ми зможемо заволодіти."
  golden_century_events.1.desc.desc_adu: "#TOOLTIP:LOCATION,strait_of_gibraltar,X #L Гібралтарська протока#!#! у наших руках, суперника відкинуто, і вперше за багато століть над #TOOLTIP:REGION,iberia_region,X #L Іберією#!#!, зібраною під одними знаменами, знову лунає заклик до молитви. Доба дрібних царств минула, а [target_ruler.GetName] знову [Select_CString(target_ruler.IsFemale, 'зібрала', 'зібрав')] воєдино те, що було втрачено після падіння #TOOLTIP:LOCATION,cordoba,X #L Кордови#!#!.\n\n#TOOLTIP:RELIGIONGROUP,christian,X #L Християнські#!#! королівства за гірським перевалом, які довго вважали нас згаслою і вже ні на що не здатною країною, тепер змушені зважати на наше повернення. Караванні шляхи та відкрите море на півдні обіцяють нам багатства, знання і владу, а ім’я нашої країни вперше за довгі роки знову набуло ваги в #TOOLTIP:CONTINENT,europe,X #L Європі#!#!. Нехай прийдешні роки покажуть, наскільки яскраво палатиме світоч #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!."
  golden_century_events.1.desc.historical_info_spa: "Золота доба Іспанії, або #italic Siglo de Oro#!, стала тривалим періодом імперської могутності та культурного розквіту, що настав після об’єднання Кастилії та Арагону за часів правління Ізабелли та Фердинанда в 1469 році. У 1492 році Католицькі королі відвоювали Гранаду, завершивши цим майже восьмивікову Реконкісту, і того ж року спорядили Колумба через Атлантику.\n\nСрібло обох Індій, перевага #italic терцій#! на полях битв Європи та надбання Габсбурзької спадщини перетворили Іспанію на першу по-справжньому світову імперію — державу, над якою, як казали, ніколи не заходило сонце. Це багатство забезпечило розквіт мистецтва й літератури — від Сервантеса та Лопе де Веги до Веласкеса й Ель Греко, — завдяки якому доба й отримала свою назву."
  golden_century_events.1.desc.historical_info_adu: "Аль-Андалус колись був осердям мусульманської цивілізації на всьому Піренейському півострові. Поставши після завоювання 711 року, він досяг вершини свого розквіту за Кордовського халіфату, проголошеного Абд ар-Рахманом III у 929 році. Певний час Кордова була найбільшим і найбільш освіченим містом Західної Європи, а її книгозбірні, мечеті та ринки не знали рівних на північ від Середземного моря.\n\nАндалуські вчені несли знання про алгебру, медицину, астрономію та філософію далеко за межі латинського світу, а праці античних мислителів зберігалися і передавалися наступним поколінням завдяки перекладам з арабської мови. Попри розпад халіфату на дрібні #italic тайфи#! у 1031 році та поступове зменшення мусульманських володінь під натиском християнських правителів, пам’ять про його освіченість і велич збереглася як свідчення одного з найвищих досягнень середньовічної цивілізації."
  golden_century_events.1.a: "Нас чекає доба процвітання та зміцнення країни."
  explain_golden_century_dominance_tt: "Збільшуйте [Concept('gc_european_dominance', 'панування в Європі')|e] та [Concept('gc_colonial_dominance', 'колоніях')|e] за допомогою завоювань, колонізації та державної політики. Кожен подоланий поріг приносить постійну нагороду, а що вищі обидва показники, то яскравішою стає наша золота доба"
  explain_golden_century_antagonists_tt: "У межах цієї [Concept('situation', 'ситуації')|e] виникає унікальне [Concept('international_organization', 'міжнародне об’єднання')|e] — [GetInternationalOrganizationType('grand_alliance').GetName]. Наші [Concept('rival_enemies', 'вороги')|e], [Concept('rivals', 'суперники')|e] та країни, які нас бояться, підтримують це об’єднання, а його [Concept('members', 'учасники')|e] стають дужчими, що вище наше панування. Якщо їм вдасться здолати нас у війні, вони зможуть послабити наш вплив, скориставшись особливим [Concept('casus_belli', 'приводом для війни')|e] та нав’язавши відповідні [Concept('peace_treaties', 'мирні угоди')|e]."
  explain_golden_century_flashpoints_tt: "Під час цієї [Concept('situation', 'ситуації')|e] у нас можуть відбутися [Concept('events', 'події')|e] [Concept('flashpoint', 'переломних митей')|e]"
  golden_century_events.2.title: "Панування в Європі"
  golden_century_events.2.desc.desc_spa: "Попри всі зусилля суперників і ворогів, ми досягли самісінької вершини нашої #TOOLTIP:SITUATION,golden_century,X #L золотої доби#!#! на #TOOLTIP:CONTINENT,europe,X #L європейському#!#! континенті. Жодна коаліція не здатна протистояти нам, жоден двір не наважується знехтувати нашими бажаннями, а [target_ruler.GetName] — нехай і не за титулом, але за правом — [Select_CString(target_ruler.IsFemale, 'визнана найвеличнішою правителькою', 'визнаний найвеличнішим правителем')] християнського світу.\n\n[ShowUnitDefinitionName('a_tercio')] панують на полях битв, імперські титули в межах нашої досяжности, а доля всієї Європи, від #TOOLTIP:REGION,italy_region,X #L Італії#!#! до Нідерландів, залежить від нашої волі. Нехай вороги плетуть змови — ця доба належить нам."
  golden_century_events.2.desc.desc_adu: "На піку нашої #TOOLTIP:SITUATION,golden_century,X #L золотої доби#!#! ми знову стали головною силою #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!. Силу, яку давно вважали згаслим пережитком минулої доби, більше ніхто не може зневажати. #TOOLTIP:RELIGIONGROUP,christian,X #L Християнські#!#! королівства за горами змушені або вести з нами перемовини, або мовчки відійти вбік.\n\nНаші флотилії панують у західних морях, наші залоги утримують кожен перевал, а ім’я «[target_ruler.GetName]» вимовляють із тим самим трепетом, який колись викликали халіфи #TOOLTIP:LOCATION,cordoba,X #L Кордови#!#!. Від Піренеїв до найдальших берегів #TOOLTIP:CONTINENT,europe,X #L Європи#!#! — ніхто не насмілиться підняти руку на послідовників нашої віри, не відповівши спершу перед нами. Велич #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! відновлено, і нікому з нині живих не судилося побачити, як вона згасне."
  golden_century_events.2.desc.historical_info_spa: "У середині XVI століття Габсбурзька Іспанія вважалася наймогутнішою державою Європи. За Карла V та його сина Філіппа II вона стала ще й найбагатшою країною світу, а її військо, #italic терції#!, чиї строї з пікінерів та стрільців понад століття панували на полях битв Європи, вважалося найгрізнішим у свій час.\n\nПеремога під Павією в 1525 році привела до полонення короля Франції, а в 1571 році при Лепанто флот під проводом іспанського адмірала поклав край османському пануванню в Середземному морі. З Мадрида іспанська корона вершила долі Італії, Нідерландів та Священної Римської імперії — такою була доба іспанської гегемонії, що згодом дістала назву #italic Pax Hispanica#!."
  golden_century_events.2.desc.historical_info_adu: "На піку своєї могутності за часів Кордовського халіфату Аль-Андалус вважався провідною державою західного Середземномор’я. Абд ар-Рахман III, який прийняв титул халіфа в 929 році, та його син аль-Хакам II правили країною, чиї війська, флот і багатства перевершували сили будь-якого християнського королівства Піренейського півострова.\n\nПісля смерті аль-Хакама II влада перейшла до його хаджиба і регента Абу Аміра Мухаммада ібн Абі Аміра аль-Маафірі, прозваного згодом аль-Мансуром — «Переможним». Під його проводом кордовські війська здійснювали спустошливі набіги, майже безкарно руйнуючи Північну Іберію та наводячи жах на її жителів. Він пограбував такі важливі міста, як Барселона, Леон і навіть Сантьяго-де-Компостела, що його військо захопило в 997 році. Золоті динари Кордови ходили всім Середземномор’ям, посли халіфа гостювали при дворах імператорів Візантії та Священної Римської імперії, і певний час жодна західна країна не могла змагатися з Аль-Андалусом ані багатством, ані впливом."
  golden_century_events.2.a: "Вічна Золота доба!"
  as_long_as_we_remain_at_100_european_dominance_universal_monarchy_modifier_tt: "Поки наше [Concept('gc_european_dominance', 'панування в Європі')|e] впродовж [Concept('situation', 'ситуації')|e] #TOOLTIP:SITUATION,golden_century,X #L золотої доби#!#! не опускається нижче за #Y 100#!, наша країна отримуватиме бонуси від модифікатора «[ShowModifier('universal_monarchy_modifier')]»"
  as_long_as_we_remain_at_100_european_dominance_renewed_faith_modifier_tt: "Поки наше [Concept('gc_european_dominance', 'панування в Європі')|e] впродовж [Concept('situation', 'ситуації')|e] #TOOLTIP:SITUATION,golden_century,X #L золотої доби#!#! не опускається нижче за #Y 100#!, наша країна отримуватиме бонуси від модифікатора «[ShowModifier('renewed_faith_modifier')]»"
  enables_partition_cb_tt: "Доступний [Concept('casus_belli', 'привід для війни')|e] «[ShowCasusBelliName('cb_partition')]» та [Concept('peace_treaty', 'мирна угода')|e] «[ShowPeaceTreatyTypeName('peace_partition')]»"
  unlock_saqaliba_advances_units_building_tt: "Доступний [Concept('advances', 'поступ')|e] «[ShowAdvanceName('saqaliba_barracks_advance')]» та три доби розвитку піхоти #italic ас-сакаліба аль-джудуд#! — нашого постійного корпусу воїнів-невільників, який ми можемо залучати, поки наше [Concept('gc_european_dominance', 'панування в Європі')|e] не опускається нижче за #Y 100#!"
  golden_century_events.3.title: "Зверхність у Європі"
  golden_century_events.3.desc.desc_spa: "Наші знамена увійшли до числа найвеличніших у #TOOLTIP:CONTINENT,europe,X #L Європі#!#!. Якщо раніше наші посли смиренно чекали на аудієнцію, то нині [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'сама', 'сам')] диктує умови, а двори #TOOLTIP:REGION,italy_region,X #L Італії#!#! та #TOOLTIP:INTERNATIONAL_ORGANIZATION_TYPE,hre,X #L Священної Римської імперії#!#! змушені зважати на нас у кожному своєму задумі.\n\nСправжнього панування над континентом ще треба досягти, втім тепер жоден із наших суперників не здатний заперечити, що на Заході постала нова велика держава. Слід скористатися цією перевагою, доки вона на нашому боці."
  golden_century_events.3.desc.desc_adu: "Бурхливий плин часу колись ледь не поглинув нас без сліду, але нині все змінилося. Сьогодні силу #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! визнають по всій #TOOLTIP:CONTINENT,europe,X #L Європі#!#! — від #TOOLTIP:LOCATION,strait_of_gibraltar,X #L Гібралтарської протоки#!#! до північних перевалів, а [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'домоглася', 'домігся')] того, щоб #TOOLTIP:RELIGIONGROUP,christian,X #L християнські#!#! князі зважували кожен свій крок, зважаючи на нашу могутність.\n\nНам іще належить дістатися вершини, але вже зараз послідовники нашої віри як ніколи гордо тримаються на Заході. Ми мусимо й далі прямувати вперед, адже доля прихильна до сміливих."
  golden_century_events.3.desc.historical_info_spa: "У першій чверті XVI століття Іспанія з дивовижною швидкістю перетворилася з нещодавно об’єднаного королівства на одну з провідних держав Європи. Воєнні кампанії Гонсало Фернандеса де Кордови, прозваного #italic «Великим Капітаном»#!, дозволили відвоювати Неаполь у Франції у 1503–1504 роках, а його дисципліноване піхотне військо вчинило переворот у військовій справі.\n\nДипломатія Фердинанда Арагонського та шлюб Католицьких королів пов’язали Іспанію шлюбними узами з половиною Європи. На час сходження на престол короля Карла V у 1516 році Іспанія вже заклала підвалини свого панування на континенті."
  golden_century_events.3.desc.historical_info_adu: "Після падіння Кордовського халіфату Аль-Андалус двічі уникнув завоювання християнськими королівствами, що тіснили мусульман, завдяки допомозі берберських держав із півдня. Так, Альморавіди розгромили війська Альфонсо VI у битві біля Саграхаса в 1086 році та на ціле покоління зупинили Реконкісту. У 1195 році Альмохади, які прийшли їм на зміну, завдали поразки кастильцям біля Аларкоса.\n\nЦі роди змогли об’єднати Аль-Андалус та зберегти його кордони, а такі міста, як Кордова і Севілья, знову розквітли як осередки освіченості й торгівлі, перш ніж наступ християн відновився."
  golden_century_events.3.a: "До величі й процвітання рукою сягнути."
  as_long_as_we_remain_at_75_european_dominance_expanded_cabinet_jurisdiction_modifier_tt: "Поки наше [Concept('gc_european_dominance', 'панування в Європі')|e] упродовж #TOOLTIP:SITUATION,golden_century,X #L золотої доби#!#! не опускається нижче за #Y 75#!, наша країна отримуватиме вигоди від модифікатора «[ShowModifier('expanded_cabinet_jurisdiction_modifier')]»"
  enables_enforce_conformity_action_tt: "Доступна [Concept('action', 'дія')|e] «[Concept('assimilation', 'асимілювати')|e] і [Concept('conversion', 'навернути')|e] населення обраної [Concept('area', 'області')|e] в #TOOLTIP:CONTINENT,europe,X #L Європі#!#»"
  as_long_as_we_remain_at_75_european_dominance_sword_of_the_west_modifier_tt: "Поки наше [Concept('gc_european_dominance', 'панування в Європі')|e] упродовж #TOOLTIP:SITUATION,golden_century,X #L золотої доби#!#! не опускається нижче за #Y 75#!, наша країна отримуватиме вигоди від модифікатора «[ShowModifier('sword_of_the_west_modifier')]»"
  enables_proclaim_fatwa_action_tt: "Доступна [Concept('action', 'дія')|e] «[ShowGenericActionName('adu_proclaim_a_fatwa')]», унаслідок якої [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] наділя[ROOT.GetCountry.Custom('clergy_yeyut')] обрану сторону нашої влади авторитетом віри"
  spa_enforce_conformity: "Привести до покори"
  spa_enforce_conformity_select_area: "Привести область до покори"
  spa_enforce_conformity_no_areas: "@trigger_no!У нас немає підхожих областей"
  adu_proclaim_a_fatwa: "Проголосити фетву"
  golden_century_events.4.title: "Єдина віра та культура"
  golden_century_events.4.desc: "Час нашим намісникам в області [target.GetName] перехопити ініціативу та видати указ про уніфікацію. Як запевняють наші радники, прагнення до однаковості життєво необхідне, якщо ми хочемо, щоб у наших землях панували одна віра й одна культура. Молитовні будинки іновірців буде зачинено, а їхні діти в наступні роки виховуватимуться за нашими звичаями.\n\nПопереду важка праця, і наслідки її відчуватимуться ще довго, але люд, об’єднаний спільною вірою та спільним укладом, значно легше тримати в шорах."
  golden_century_events.4.a: "Усе це на користь вірі."
  enforce_conformity_result_tt: "Кожна [Concept('location', 'місцевість')|e] у провінції [target.GetName] отримує модифікатор «[ShowModifier('agricultural_revolution')]» на #Y 10#! років"
  explain_enforce_conformity_tt: "Усі [Concept('locations', 'місцевості')|e] в обраній [Concept('area', 'області')|e] отримають [Concept('modifier', 'модифікатор')|e] «[ShowModifier('enforce_conformity_modifier')]» на #Y 10#! років"
  golden_century_events.5.title: "Проголошення фетви"
  golden_century_events.5.desc: "[target_ruler.GetName] скликає духовенство, і [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] готов[ROOT.GetCountry.Custom('clergy_yiaei')] наділити уряд авторитетом віри. Яке ж питання буде винесено на розгляд?\n\nХоч би яким був указ, віряни не смітимуть йому перечити: рішення, скріплене іменем віри, значно вагоміше за будь-який інший урядовий указ."
  golden_century_events.5.desc.historical_info: "#italic Фетва#! — це офіційний правовий висновок, винесений кваліфікованим ісламським правознавцем, #italic муфтієм#!, у відповідь на питання щодо релігійного права. На відміну від судового вироку, вона не мала обов’язкової сили, втім думка шанованого вченого мала велику моральну вагу, і правителі часто зверталися по фетву, щоб надати правочинності своїм діям. У XV столітті османські султани перетворили посаду #italic шейх-уль-іслама#!, головного правознавця імперії, на впливову та постійну установу, а такі книжники, як Молла Хюсрев та Молла Гюрані, схвалювали завоювання Мехмеда II з погляду ісламського права. На мусульманському Заході магрибський правознавець Ахмад аль-Ваншарісі виніс славнозвісну фетву про те, що мусульмани занепалого Аль-Андалусу зобов’язані покинути Піренейський півострів, а не жити під владою християн."
  golden_century_events.5.a: "Нехай вони освятять наше правління."
  golden_century_events.5.b: "Нехай вони благословлять наші справи з іншими країнами."
  golden_century_events.5.c: "Нехай вони проголосять боротьбу з невірними."
  golden_century_events.6.title: "Вплив у Європі"
  golden_century_events.6.desc.desc_spa: "Наша країна більше не животіє на задвірках #TOOLTIP:CONTINENT,europe,X #L Європи#!#! — ми увійшли до переліку держав, чиє слово здатне змінити долю всього материка. [target_ruler.GetName] веде наші війська до #TOOLTIP:REGION,italy_region,X #L Італії#!#! на рівних із найгордовитішими її домами, а наше ополчення за [Select_CString(target_ruler.IsFemale, 'неї', 'нього')] збирається швидше, ніж суперники встигають виставити власне.\n\nНам ще є куди зростати, але часи, коли сусіди могли не зважати на нас, минули. Нехай дізнаються, що воно таке — мати справу з нами."
  golden_century_events.6.desc.desc_adu: "Віряни сходяться під наші знамена з такою ревністю, якої не бачили вже багато поколінь. По всій #TOOLTIP:CONTINENT,europe,X #L Європі#!#! наше ім’я вимовляють з настороженою повагою, а правитель [target_ruler.GetName] скликає з усіх куточків країни сповнених віри вершників.\n\nДо вершини ще далеко, але #TOOLTIP:RELIGIONGROUP,christian,X #L християнські#!#! князі більше не вважають нас пережитком минулого, з яким можна не рахуватися. Священна боротьба знову набирає сили."
  golden_century_events.6.desc.historical_info_spa: "Довга війна за Гранаду, що завершилася у 1492 році, згуртувала Кастилію та Арагон у єдину військову державу. Католицькі королі створили постійне військо й утримуване короною ополчення при #italic Святій ермандаді#!, замінивши непевне феодальне ополчення загонами, які корона могла використати на власний розсуд у будь-яку мить.\n\nЦе загартоване військо, що лишилося без діла після падіння Гранади, незабаром вирушило на війну в Середземномор’ї. Менш ніж за десять років іспанська піхота увійшла в межі Італії, заклавши підвалини бойового строю, що впродовж цілого століття пануватиме на полях битв у всій Європі."
  golden_century_events.6.desc.historical_info_adu: "#italic Ґузати#! були добровольцями родом із Північної Африки, які переправлялися на Піренейський півострів заради ведення священної війни в християнському порубіжжі Аль-Андалусу. Ці загони воїнів віри під проводом #italic шейха аль-ґузат#! були однією з головних сил оборони династії Насрідів, які правили Гранадою. Вони приваблювали бійців з усього Магрибу, які прагнули здобути духовну нагороду в боротьбі за віру.\n\nПопри свій бунтівний норов і сваволю, ґузати втілювали ідеал #italic джихаду#! на іберійському порубіжжі, а султан, здатний згуртувати їх, отримував силу ревності у вірі, з якою не міг зрівнятися жоден найманець."
  golden_century_events.6.a: "Наше піднесення тільки починається."
  as_long_as_we_remain_at_50_european_dominance_european_aspirations_modifier_tt: "Поки наше [Concept('gc_european_dominance', 'панування в Європі')|e] протягом доби #TOOLTIP:SITUATION,golden_century,X #L золотого віку#!#! не опускається нижче #Y 50#!, наша країна отримуватиме вигоду від модифікатора «[ShowModifier('european_aspirations_modifier')]»"
  enables_emergency_conscription_tt: "Доступна ухвала [Concept('parliament', 'зборів')|e] #Y «Терміновий набір»#!, яка дозволяє значно примножити [Concept('manpower', 'запас новобранців')|e] під час війни"
  as_long_as_we_remain_at_50_european_dominance_holy_struggle_modifier_tt: "Поки наше [Concept('gc_european_dominance', 'панування в Європі')|e] протягом доби #TOOLTIP:SITUATION,golden_century,X #L золотого віку#!#! не опускається нижче #Y 50#!, наша країна отримуватиме вигоду від модифікатора «[ShowModifier('holy_struggle_modifier')]»"
  enables_muster_the_ghuzat_tt: "Доступне [Concept('action', 'доручення')|e] «[ShowGenericActionName('adu_muster_the_ghuzat')]», яке дає змогу поповнити наші війська добровольцями з-поміж вірян з усього #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманського#!#! світу"
  adu_muster_the_ghuzat: "Скликати ґузатів"
  adu_proclaim_a_fatwa_desc: "Закличемо наших улемів винести фетву та освятити одну зі сторін нашого правління: врядування, посольську чи військову справу."
  adu_muster_the_ghuzat_desc: "Скличте ґузатів — ревні добровольці прибудуть із сусідніх #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманських#!#! земель, щоби взятися за зброю на нашому боці."
  spa_enforce_conformity_desc: "Оберіть одну з наших областей у #TOOLTIP:CONTINENT,europe,X #L Європі#!#! та поширте серед її люду нашу віру й культуру: усі відповідні громади будуть навернені й асимільовані."
  golden_century_events.7.title: "Ґузати відгукуються на заклик"
  golden_century_events.7.desc: "Звістка про нашу священну боротьбу шириться землями вірян, і #italic ґузати#! відгукуються на поклик. [target_ruler.GetName] закликає ревних добровольців із сусідніх #TOOLTIP:RELIGIONGROUP,muslim,X #L мусульманських#!#! країв, і ті таємно переходять кордон, щоби стати під [Select_CString(target_ruler.IsFemale, 'її', 'його')] знамена. Наші лави поповнюють воїни, які не вимагають платні — вони б’ються заради раю.\n\nНехай невірні тремтять. Наше порубіжжя знову повниться славетними воїнами."
  golden_century_events.7.a: "Нехай через служіння нам вони знайдуть рай."
  missed_reward_ghuzat_mujahidin_tt: "Якби в нас діяла [Concept('bureaucracy', 'установа')|e] «[ShowBureaucracyTypeName('diwan_al_jund_bureaucracy')]», [target_ghazi_general.GetName] теж [Select_CString(target_ghazi_general.IsFemale, 'приєдналася', 'приєднався')] б до нас"
  plan_partition_campaign: "Скласти план поділу"
  plan_partition_campaign_desc: "Наші вороги занадто зміцніли, і це нам не до вподоби. Їхні спроби посилити власну владу неминуче призведуть до того, що вони об’єднаються проти нашого народу, поставивши під загрозу наш подальший розквіт. Ми не можемо залишити без відповіді такий відвертий показ сили!"
  selected_country_target_cb_tt: "Ми отримаємо [Concept('casus_belli', 'привід для війни')|e] «[ShowCasusBelliName('cb_partition')]» проти вказаної [Concept('country', 'країни')|e]. Цей [Concept('casus_belli', 'привід для війни')|e] відкриває доступ до [Concept('peace_treaty', 'мирного договору')|e] «[ShowPeaceTreatyTypeName('peace_partition')]»"
  plan_partition_campaign_select_rival_or_enemy: "Оберіть [Concept('rival', 'суперника')|e] чи [Concept('enemy', 'ворога')|e] для поділу"
  no_neighbor_enemies_rivals_available: "@trigger_no!У нас по сусідству немає [Concept('rival', 'суперників')|e] чи [Concept('enemy', 'ворогів')|e], яких можна було б розділити"
  invoke_ummayad_legacy: "Покликатися на спадщину Омеядів"
  invoke_ummayad_legacy_desc: "Спадщина Омеядів, які колись правили з #TOOLTIP:LOCATION,cordoba,X #L Кордови#!#!, по праву належить нам. Оберіть сусіда, який володіє землями їхнього колишнього халіфату, — і ми скористаємося прадавнім правом силою повернути ці володіння під нашу владу."
  selected_country_ummayad_cb_tt: "Ми отримаємо [Concept('casus_belli', 'привід для війни')|e] «[ShowCasusBelliName('cb_restore_ummayad_caliphate')]» проти зазначеної [Concept('country', 'країни')|e]"
  invoke_ummayad_legacy_select_country: "Вибір [Concept('country', 'країни')|e], що володіє землями Омеядів"
  invoke_ummayad_legacy_no_country_available: "@trigger_no!Жодна із сусідніх [Concept('country', 'країн')|e] не володіє землями Омеядського халіфату"
  spa_patronize_golden_century: "Плекати Золоту добу"
  spa_patronize_golden_century_desc: "Ми плекаємо мистецтва й не шкодуємо коштів на творення прекрасного, підтримуючи художників, поетів та архітекторів нашої доби. Ці вкладення сприяють розквіту культури наших народів і золотими літерами вписують наше ім’я в аннали історії."
  golden_century_events.8.title: "Покровителі Золотої доби"
  golden_century_events.8.desc: "Багатство нашої доби вабить на наші землі найкращих майстрів з усієї Європи. [target_location.GetName] нині — справжній осередок культури, куди стікаються живописці та скульптори, архітектори й поети — кожен сподівається, що саме йому правитель [target_ruler.GetName] виявить свою прихильність і що саме він прославиться в цю осяйну добу.\n\nВарто нам звелити — і майстерні наповняться митцями, готовими увічнити нашу велич на віки. Витвори мистецтва, якими ми опікуємося нині, переживуть і угоди, і війни. Коли від наших військ не залишиться й сліду, нащадки пам’ятатимуть нашу добу за її багатством і блиском."
  golden_century_events.8.a: "Нехай торжествує мистецтво!"
  target_character_serves_in_court_tt: "[target_character.GetName] стає нашим придворним майстром своєї справи"
  artist_appears_in_court_tt: "При нашому дворі з’являється майстерний [Concept('artist', 'митець')|e]"
  artist_expands_royal_quarters: "Розкішне нове крило палацу височіє над королівським осідком, а поголоска про його пишноту розносить нашу славу по дворах Європи"
  artist_drafts_traditional_art: "Наші майстри увічнюють мотиви й форми наших звичаїв, передаючи їх прийдешнім поколінням та збагачуючи культурну спадщину, яку ми залишимо по собі."
  artist_furthers_our_technological_understanding_tt: "[target_character.GetShortNameWithNoTooltip] перетворює опіку на відкриття, сприяючи просвіті [ROOT.GetCountry.Custom('rank_ua_GEN')|l]"
  golden_century_events.9.title: "Вигнання андалусців з області [target.GetNameWithNoTooltip]"
  golden_century_events.9.desc: "#TOOLTIP:CULTURE,andalusi,X #L Андалуський#!#! люд в області [target.GetName] завжди тримався осібно, зберігаючи чужі нам віру та культуру. Вони вже давно живуть серед нас, і ми навряд чи колись зможемо прихилити їх до наших звичаїв.\n\nНаш терпець урвався. Ми зберемо їх усіх, відвеземо до гаваней і посадимо на кораблі, що прямують до провінції [target_province_destination.GetName], де їх приймуть одновірці.\n\nЇхні домівки та ниви довго не порожнітимуть. Наші люди заселять землі, які колись обробляли їхні батьки, і те, що раніше належало їм, перейде до надійніших рук."
  golden_century_events.9.desc.historical_info: "У 1609–1614 роках король Іспанії Філіп III постановив вигнати морисків — нащадків іберійських мусульман, яких століттям раніше змусили прийняти християнство. Близько трьохсот тисяч людей, яких давно підозрювали в таємному відступництві та зносинах з османами й піратами з Варварійського берега, було вигнано зі своїх домівок.\n\nБільшість переселилася до Магрибу, проте багато хто вирушив ще далі на схід, до земель Османської імперії, й оселився в Анатолії, Леванті та на Балканах, де їх прийняв уряд султана. Їхній вихід позбавив схід Іспанії досвідчених землеробів та ремісників, і низка областей так і не змогла повністю відновитися."
  golden_century_events.9.a: "Їхній вихід — на краще."
  spa_edict_expulsion: "Видати указ про вигнання"
  spa_edict_expulsion_desc: "Оберіть одну з провінцій, які ми утримуємо, і відправте місцевий #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалуський#!#! люд у вигнання до заморських земель. Покинуті ними домівки зможуть зайняти наші поселенці."
  select_expulsion_no_province: "@trigger_no!У нас немає [Concept('province', 'провінцій')|e] зі значною часткою андалуського люду"
  select_province_removes_andalusi_tt: "В обраній [Concept('province', 'провінції')|e] розпочнеться примусова [Concept('migration', 'міграція')|e] #TOOLTIP:CULTURE,$andalusi_tt$,X #L андалуських#!#! [Concept('pops', 'громад')|e]"
  select_province_to_evict_pops_from: "Оберіть [Concept('province', 'провінцію')|e], звідки буде вигнано [Concept('pops', 'громади')|e]"
  spa_seize_colony: "Захопити колонію"
  spa_seize_colony_desc: "Багатства Нового Світу можна здобути не лише тяжкою працею. Ми оберемо непокірну колонію країни-суперниці, що розташована в межах нашої досяжности, і схилимо її відвернутися від далекої метрополії та перейти під владу нашої корони. Так ми водночас здобудемо багате володіння й накличемо на себе вічну ворожнечу її колишнього сюзерена."
  select_colonial_subject_to_seize: "Оберіть непокірну [Concept('colony', 'колонію')|e] для захоплення"
  no_available_colonial_subjects_to_seize: "@trigger_no!У суперників немає непокірних колоніальних [Concept('subject', 'васалів')|e] у межах нашої досяжности"
  selected_subject_receives_offer_to_defect_tt: "Обране #TOOLTIP:SUBJECT_TYPE,colonial_nation,X #L колоніальне намісництво#!#! отримає пропозицію стати нашим [Concept('subject', 'васалом')|e]. Якщо воно погодиться, це значно погіршить наші взаємини з його поточним [Concept('overlord', 'сюзереном')|e] та надасть йому [Concept('casus_belli', 'привід для війни')|e] за повернення"
  golden_century_events.10.title: "Пропозиція вірности"
  golden_century_events.10.desc: "Посланці з #ONCLICK:COUNTRY,[seizing_country.GetKey] #TOOLTIP:COUNTRY,[seizing_country.GetKey],X [seizing_country.Custom('CL_GEN')|L]#!#! потай прокралися до наших гаваней із таємною пропозицією, про яку не слід розголошувати на весь світ. Наші далекі пани [target_overlord.Custom('preposition_uv')] #ONCLICK:COUNTRY,[target_overlord.GetKey] #TOOLTIP:COUNTRY,[target_overlord.GetKey],X [target_overlord.Custom('CL_PREP')|L]#!#! облишили турбуватися про нас і більше не бажають чути наших кривд. [seizing_country.GetNameWithNoTooltip] же готов[seizing_country.Custom('end_fem')] прийняти нас як своїх і належно винагородити за вірність.\n\n[target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'повинна', 'повинен')] зробити нелегкий вибір. Погодитися — означає змінити одного сюзерена на іншого та накликати на себе гнів #ONCLICK:COUNTRY,[target_overlord.GetKey] #TOOLTIP:COUNTRY,[target_overlord.GetKey],X [target_overlord.Custom('CL_GEN')|L]#!#!; відмовитися — довести власну вірність і ще міцніше прив’язати себе до корони, якій ми й так служимо."
  golden_century_events.10.a: "Спробуймо щастя під опікою [seizing_country.Custom('CL_GEN')]."
  golden_century_events.10.a.alt: "Спробуймо щастя з ними."
  golden_century_events.10.b: "Нашу вірність не купити."
  adu_integrate_natives: "Приєднати колоніальне поселення"
  adu_integrate_natives_desc: "Замість винищувати тубільців, ми почнемо з ними перемовини, з їхньою допомогою дослідимо землі та включимо їх до складу наших заморських володінь."
  adu_integrate_natives_tt: "Ми створимо [Concept('colonial_charter', 'колоніальне поселення')|e] в обраній [Concept('province', 'провінції')|e] і заселимо її незайняті [Concept('locations', 'місцевості')|e], а потім вирішимо, як вчинити з тубільцями"
  golden_century_events.11.title: "[target.GetNameWithNoTooltip] і надалі"
  golden_century_events.11.desc: "Нам вдалося укласти мир із місцевими жителями провінції [target.GetName], і завдяки їхній допомозі ми не тільки позначили на мапі довколишні землі, а й заснували численні колонії в їхніх володіннях. Тепер наші радники сперечаються про те, що робити надалі.\n\nОдні пропонують заселяти нові колонії переселенцями з наших корінних земель. Інші вважають, що єдина цінність цих колоній — тубільці, яких треба закувати в кайдани та відправити працювати у наших володіннях. Проте деякі поміркованіші радники воліли б дати місцевим спокій і дозволити нашому новому поселенню рости своєю чередою."
  golden_century_events.11.a: "Оголосити нові хвилі переселення."
  golden_century_events.11.b: "Переселити їх назад на батьківщину як робітників."
  golden_century_events.11.c: "Не втручатися в розбудову провінції."
  all_those_slaves_go_back_home: "#TOOLTIP:POPTYPE,slaves,X #L Невільники#!#!, які з’являться внаслідок цієї [Concept('action', 'дії')|e], будуть розселені довкола нашої [Concept('capital', 'столиці')|e] у провінції [ROOT.GetCountry.GetCapital.GetProvince.GetName]"
  spa_demand_tribute_fleets: "Вимагати відрядження флотів із даниною"
  spa_demand_tribute_fleets_desc: "Оберемо одну з наших вірних заморських колоній і накажемо їй спорядити додому свої скарби. Завантажений сріблом і багатствами тутешніх рудників та нив, флот із даниною вирушить до наших гаваней і поповнить скарбницю після прибуття."
  select_colonial_subject: "Оберіть вірну [Concept('colony', 'колонію')|e]"
  no_loyal_colonial_subject: "@trigger_no!У нас немає вірних колоніальних [Concept('subject', 'васалів')|e]"
  spa_demand_tribute_fleets_tt: "Обране вірне #TOOLTIP:SUBJECT_TYPE,colonial_nation,X #L колоніальне намісництво#!#! отримає вимогу спорядити кораблі з даниною у вигляді [Concept('gold', 'грошей')|e], коштовних металів або [Concept('pops', 'людей')|e]"
  adu_build_qadi_office: "Побудувати палату каді"
  adu_build_qadi_office_desc: "Для підвладних нам країн буде великою честю прийняти у себе #TOOLTIP:BUILDING_TYPE,qadi_office,X #L палату каді#!#!. Її суддя чинитиме священний суд від нашого імені, розв’язуючи суперечки між підданими й ще дужче прив’язуючи їхнього правителя до нас."
  no_available_colonial_subject: "@trigger_no!У нас немає [Concept('subject', 'васала')|e], в столиці якого ще немає палати каді"
  adu_build_qadi_office_tt: "Ми збудуємо #TOOLTIP:BUILDING_TYPE,qadi_office,X #L палату каді#!#! у [Concept('capital', 'столиці')|e] обраного [Concept('subject', 'васала')|e], де суддя чинитиме священний суд і зміцнюватиме нашу владу над країною"
  if_we_had_qadi_al_jamaa_bureaucracy_tt: "Якби в нас діяла [Concept('bureaucracy', 'установа')|e] «[ShowBureaucracyTypeName('qadi_al_jamaa_bureaucracy')]», ми також отримали б [Concept('modifier', 'модифікатор')|e] «[ShowModifier('empowered_qadi_al_jamaa_modifier')]»"
  adu_dispatch_gold_caravan: "Відрядити караван із золотом"
  adu_dispatch_gold_caravan_desc: "Оберіть когось із наших людей і доручіть йому очолити караван, що вирушить на південь через Сахару. Навантажений #TOOLTIP:GOODS,salt,X #L сіллю#!#! та #TOOLTIP:GOODS,cloth,X #L тканинами#!#!, караван обміняє їх на #TOOLTIP:GOODS,goods_gold,X #L золото#!#! #TOOLTIP:REGION,sahel_region,X #L Сахелю#!#!, а потім доправить ці багатства додому, щоб збагатити наші ринки."
  adu_dispatch_gold_caravan_select_leader: "Обрати очільника каравану"
  adu_dispatch_gold_caravan_no_leader: "@trigger_no!У нас немає [Concept('character', 'персонажа')|e], який міг би очолити [Concept('expedition', 'виправу')|e]"
  adu_dispatch_gold_caravan_tt: "Обраний [Concept('character', 'персонаж')|e] очолить [Concept('expedition', 'виправу')|e] через Сахару на південь, щоб продати наш крам і привезти виторгуване #TOOLTIP:GOODS,goods_gold,X #L золото#!#! #TOOLTIP:REGION,sahel_region,X #L Сахелю#!#! на наші ринки."
  nick_the_golden: "Золота Гора"
  golden_century_events.12.title: "Данина [target_country.Custom('CL_GEN')]"
  golden_century_events.12.desc: "Наша вірна колонія [target_country.GetName] процвітає під нашим захистом, і тепер настав час отримати належну нам данину. Кораблі в її гаванях уже лаштуються до відплиття, і [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'повинна', 'повинен')] вирішити, що вони доправлять на батьківщину. Ми можемо вимагати регулярних грошових виплат, щоб наповнити скарбницю, або запросити срібло й золото з місцевих рудників, що збагатять наші ринки. Чи ж можна зажадати головного багатства колонії — людей, які вирушать через океан і збільшать людність наших провінцій."
  golden_century_events.12.a: "Вимагати щорічну данину золотом."
  golden_century_events.12.b: "Привласнити багатства їхніх срібних і золотих рудників."
  golden_century_events.12.c: "Переправимо їхніх людей для заселення наших земель."
  spa_issue_royal_decree: "Видання Cédula de Población («Указу про заселення»)"
  spa_issue_royal_decree_desc: "Оберіть область у наших заморських володіннях і відкрийте її гавані для колоністів. Згідно з королівським указом, родини з країн нашої віри перетнуть океан, щоб почати нове життя на наших землях, і на порожніх теренах закипить праця."
  select_colonial_area_to_direct_migrants: "Оберіть [Concept('area', 'область')|e], до якої вирушать наші поселенці"
  no_available_colonial_area: "@trigger_no!У нас немає підхожої [Concept('area', 'області')|e] для відправлення поселенців"
  spa_issue_royal_decree_tt: "Ми відкриємо обрану [Concept('area', 'область')|e] для переселення. У результаті її [Concept('locations', 'місцевості')|e] отримають тривалий модифікатор, завдяки якому туди охоче прибуватимуть поселенці з країн спільної з нами віри"
  golden_century_events.13.title: "[target_area.GetNameWithNoTooltip] вітає поселенців"
  golden_century_events.13.desc: "Зусилля з розбудови наших колоніальних володінь принесли свої плоди. Виданий нами указ про заохочення поселенців в області [target_area.GetName] знайшов відгук далеко за межами наших гаваней, приваблюючи родини навіть із такої далекої провінції, як [target_origin_province_1.GetName].\n\nВарто зазначити, що вони прибувають зовсім не з порожніми руками: хтось привозить із собою потрібні знаряддя з домашніх майстерень, хтось — свої знання та досвід ведення спільного господарства, але всі вони так чи інакше готові щиро працювати, щоб розпочати нове життя в нашому підданстві. Хоч би кого привела до нас жага змін, [target_ruler.GetName] забезпечить їх усім потрібним, бо саме від цих людей залежить майбутнє наших колоній."
  golden_century_events.13.a: "Ласкаво просимо!"
  migrants_bring_cultural_understanding_tt: "Поселенці різних культур надають нашим колоніальним місцевостям модифікатор «[ShowModifier('harmonious_understanding_modifier')]» на #Y 5#! років"
  migrants_bring_tool_expertise_tt: "Досвідчені поселенці-ремісники надають нашим колоніальним місцевостям модифікатор «[ShowModifier('new_tooling_techniques_modifier')]» на #Y 5#! років"
  shared_prosperity_event_13_tt: "Нові господарства надають нашим колоніальним місцевостям модифікатор «[ShowModifier('shared_prosperity_modifier')]» на #Y 5#! років"
  golden_century_events.13.desc.historical_info: "#italic Cédula de población#! (дослівно — «указ про заселення») являв собою королівську хартію, за допомогою якої іспанська корона прагнула заселити малолюдні землі своєї імперії. Колоністам, готовим перетнути океан, обіцяли земельні наділи, звільнення від податків і мит, а також статус вірних підданих — усе заради того, щоб далекі краї на мапі перетворилися на господарства, міста та порти, які б давали прибуток і могли постояти за себе.\n\nНайвідомішим став #italic Real Cédula de Población#!, дарований Карлом III у 1783 році острову Тринідад — теренам давніх, але марних зазіхань Іспанії, що раніше лишалися майже безлюдними. Він відчиняв двері для католицьких переселенців з-за кордону та наділяв їх землею пропорційно до розміру кожної родини й числа привезених ними невільників. Завдяки цьому майже порожня застава лише за одне покоління перетворилася на велелюдну колонію з плантаціями. Цей указ залишається найсміливішим проявом прагнення Бурбонів змусити забуті окраїни імперії нарешті давати дохід."
  golden_century_events.14.title: "У затінку [gc_hegemon.Custom('CL_GEN')]"
  golden_century_events.14.desc: "[GetSituationByKey('battle_for_the_strait').GetName] завершилася, і [gc_hegemon.GetName] вияви[gc_hegemon.Custom('end_vlaloly')]ся беззаперечним переможцем. Їхні війська загартовані в боях, скарбниця повна золота, а домагання великі як ніколи, бо тепер вони звертають погляд за межі своїх кордонів і відкрито претендують на світове панування. Ці задуми загрожують цілій низці країн, і ми серед них.\n\nУтім, поява нового гегемона навряд чи залишиться без відповіді. Стривожені правителі вже починають утворювати коаліцію, і що наполегливіше [gc_hegemon.GetNameWithNoTooltip] буд[SCOPE.sCountry('actor').Custom('end_eut')] розширювати свій вплив, то запекліший опір вони чинитимуть. Прийдешнє століття покаже, чи вдасться нам стримати настільки могутню країну, чи вона остаточно змінить рівновагу сил у світі."
  golden_century_events.14.a: "Ми не станемо протистояти їм наодинці."
  golden_century_events.15.title: "Піднесення [gc_hegemon.Custom('CL_GEN')]"
  golden_century_events.15.desc: "Нам стало відомо, що [GetSituationByKey('battle_for_the_strait').GetName|l] завершилася, і [gc_hegemon.GetName] здобу[gc_hegemon.Custom('end_vlaloly')] в ній рішучу перемогу, ставши однією з наймогутніших країн нашої доби. Оскільки нас пов’язують різноманітні присяги та зобов’язання, цей тріумф певною мірою і наша заслуга, а отже, ми також маємо нагоду піднестися на хвилі [gc_hegemon.GetAdjectiveWithNoTooltip|l]ої величі.\n\nОднак ми поділяємо не лише славу, а й пов’язані з нею небезпеки: в міру того, як новий гегемон посилює свій вплив, заздрісні країни об’єднують сили й намагаються чинити опір. Як союзник [gc_hegemon.Custom('CL_GEN')], ми також повинні бути готові відчути на собі гнів незгодних. Лише час покаже, чи піднесе нас цей зв’язок, чи стане нашою загибеллю."
  golden_century_events.15.a: "Ми пильно стежитимемо за їхнім піднесенням."
  golden_century_events.16.title: "Піднесення нової країни"
  golden_century_events.16.desc: "[GetSituationByKey('battle_for_the_strait').GetName] завершилася, і [gc_hegemon.GetName] здобу[gc_hegemon.Custom('end_vlaloly')] в ній рішучу перемогу. Вочевидь, вони не зупиняться на досягнутому й неодмінно спробують розширити свій вплив. І хоча наразі ми їм не вороги, варто зважати, що такі могутні країни неминуче підкоряють сусідів своїй волі.\n\nЯкщо ми хочемо уникнути такої долі, нам слід зробити вибір. Ми можемо приєднатися до коаліції, щоб дати відсіч гегемонові, або ж спробувати заслужити його прихильність. Хоч би яким було наше рішення, одне зрозуміло достеменно: прийдешнє століття залишить свій слід у нашій історії."
  golden_century_events.16.a: "Ми ретельно зважуватимемо наш курс."
  gc_grand_alliance_leader_tt: "Ми очолюємо [GetInternationalOrganizationType('grand_alliance').GetName|l] проти [gc_hegemon.Custom('CL_GEN')]. Що виразніше гегемон [Concept('gc_european_dominance', 'панує в Європі')|e] та в [Concept('gc_colonial_dominance', 'колоніях')|e], то більше бонусів [Concept('members', 'учасники')|e] отримують від [Concept('modifier', 'модифікаторів')|e] свого [Concept('international_organization', 'міжнародного об’єднання')|e]"
  gc_grand_alliance_member_tt: "Кожен, хто побоюється зростання впливу [gc_hegemon.Custom('CL_GEN')], може приєднатися до об’єднання [GetInternationalOrganizationType('grand_alliance').GetName|l] проти цієї країни. Що виразніше гегемон [Concept('gc_european_dominance', 'панує в Європі')|e] та в [Concept('gc_colonial_dominance', 'колоніях')|e], то більше бонусів [Concept('members', 'учасники')|e] отримують від [Concept('modifier', 'модифікаторів')|e] свого [Concept('international_organization', 'міжнародного об’єднання')|e]"
  gc_grand_alliance_prospect_tt: "Якщо [gc_hegemon.GetName] почн[gc_hegemon.Custom('end_eut')] загрожувати нашим інтересам, ми зможемо приєднатися до об’єднання [GetInternationalOrganizationType('grand_alliance').GetName|l] проти цієї країни. Що виразніше гегемон [Concept('gc_european_dominance', 'панує в Європі')|e] та в [Concept('gc_colonial_dominance', 'колоніях')|e], то більше бонусів [Concept('members', 'учасники')|e] отримують від [Concept('modifier', 'модифікаторів')|e] свого [Concept('international_organization', 'міжнародного об’єднання')|e]"
  gc_curb_dominance_peace_tt: "Здобувши перемогу над [gc_hegemon.Custom('CL_INST')], ми зможемо укласти [Concept('peace_treaty', 'мирний договір')|e], який послабить їхнє [Concept('gc_european_dominance', 'панування в Європі')|e] та в [Concept('gc_colonial_dominance', 'колоніях')|e] на #Y 25#!"
  gc_dominance_growth_observer_tt: "[gc_hegemon.GetName] стрімко посилю[gc_hegemon.Custom('end_yeyut')] своє [Concept('gc_european_dominance', 'панування в Європі')|e] та в [Concept('gc_colonial_dominance', 'колоніях')|e] завдяки завоюванням, освоєнню нових земель і вмілому врядуванню. З кожним здобутком ця країна лише зміцнює своє панування в цій добі"
  gc_flashpoints_observer_tt: "Під час цієї [Concept('situation', 'ситуації')|e] [gc_hegemon.Custom('preposition_uv')] [gc_hegemon.Custom('CL_PREP')] можуть статися [Concept('flashpoint', 'переломні моменти')|e]"
  gc_hegemon_backer_tt: "Ми тісно пов’язані з [gc_hegemon.Custom('CL_INST')], і тому користуємося плодами їхнього тріумфу. Однак проти цієї країни збирається [GetInternationalOrganizationType('grand_alliance').GetName|l], а отже, незабаром ми можемо бути втягнуті в їхню війну"
  io_opinion_grand_alliance: "Перебувають у Великому союзі"
  grand_alliance: "Великий союз"
  grand_alliance_desc: "Коаліція країн, яких об’єднує страх перед колосом, що набирає сили. Що більше в нього впливу в Європі та в Новому Світі, то дужче він утверджує своє панування в поточній добі і то міцнішим та рішучішим стає союз. Очільником союзу стає його найсильніший учасник, а приєднатися до нього може будь-яка країна, яка побоюється колоса й бажає дати йому відсіч."
  gc_legend_colossus: "Колос"
  gc_legend_colossus_desc: "Велика країна, чиє дедалі більше [Concept('gc_european_dominance', 'панування в Європі')|e] або [Concept('gc_colonial_dominance', 'панування в колоніях')|e] згуртувало $grand_alliance$ проти неї."
  gc_legend_grand_alliance: "Великий союз"
  gc_grand_alliance_european_scaling: "[Concept('gc_european_dominance', 'Панування')|e] нашого супротивника в Європі в ситуації «[GetSituationByKey('golden_century').GetName]»"
  gc_grand_alliance_colonial_scaling: "[Concept('gc_colonial_dominance', 'Панування')|e] нашого супротивника в колоніях в ситуації «[GetSituationByKey('golden_century').GetName]»"
  grand_alliance_hostility: "Веде війну, є ворогом або суперником колоса"
  grand_alliance_no_recent_leave_tt: "Ми не залишали цього [Concept('international_organization', 'міжнародного об’єднання')|e] протягом останніх #Y 5#! років"
  grand_alliance_leader_cannot_leave_tt: "Ми не є [Concept('international_organization_leader_short', 'лідером')|e] міжнародного об’єднання «[GetInternationalOrganizationType('grand_alliance').GetName]»"
  grand_alliance_reputable_leader: "Становище нашого лідера у протистоянні з колосом"
  ga_fear_of_dominance: "$ga_dominance_pressure$"
  ga_dominance_tipping_point: "[Concept('gc_colonial_dominance', 'Колоніальне панування')|e] або [Concept('gc_european_dominance', 'європейське панування')|e] перевищує #Y 50#!"
  ga_colossus_on_our_border: "Колос межує з нашими землями"
  ga_eu_25_bonus_tt: "Кожен [Concept('member', 'учасник')|e] великого союзу отримує #Y +10%#! до оборони та #Y +1#! до доброго імені"
  ga_eu_50_bonus_tt: "Кожен [Concept('member', 'учасник')|e] великого союзу втрачає #Y 0,05#! од. виснаження від війни та отримує #Y +0,1#! посла щомісяця"
  ga_eu_75_bonus_tt: "Кожен [Concept('member', 'учасник')|e] великого союзу отримує #Y +10%#! до дієвости воєнного рахунку та #Y +20%#! до чисельности залоги"
  ga_eu_100_bonus_tt: "Кожен [Concept('member', 'учасник')|e] великого союзу отримує #Y +10%#! до запасу новобранців та #Y +5%#! до дисципліни"
  ga_col_25_bonus_tt: "Кожен [Concept('member', 'учасник')|e] великого союзу отримує #Y +33%#! до розбудови шпигунської мережі та #Y +20%#! до швидкости спорудження кораблів"
  ga_col_50_bonus_tt: "Кожен [Concept('member', 'учасник')|e] великого союзу отримує #Y +50%#! до дієвости блокади та #Y +10%#! до міці легких кораблів"
  ga_col_75_bonus_tt: "Кожен [Concept('member', 'учасник')|e] великого союзу отримує #Y +10%#! до бойового духу флоту та #Y +10%#! до морехідної досяжности"
  ga_col_100_bonus_tt: "Кожен [Concept('member', 'учасник')|e] великого союзу отримує #Y +5%#! до завданих та #Y -5%#! до зазнаних морських ушкоджень"
  ga_declare_war_on_hegemon: "Заклик союзу до війни"
  ga_declare_war_on_hegemon_desc: "Колоса неможливо приборкати мирним шляхом, тому його треба силою змусити поступитися своїм величезним впливом. Як очільник великого союзу, ми можемо закликати всіх учасників до війни проти колоса, щоб раз і назавжди вирішити питання про його світове панування."
  ga_only_leader_may_declare_tt: "Лише та країна, яка [Concept('international_organization_leader_short', 'очолює')|e] [GetInternationalOrganizationType('grand_alliance').GetName|l], може закликати його до війни"
  ga_dominance_threshold_tt: "Панування колоса в [Concept('gc_european_dominance', 'Європі')|e] або в [Concept('gc_colonial_dominance', 'колоніях')|e] перевищує #Y 25#!"
  ga_dominance_bar_current_european_tt: "Поточне [Concept('gc_european_dominance', 'європейське панування')|e] колоса: #Y [FixedPointToInt(Country.GetVariable('gc_european_dominance'))]%#!"
  ga_dominance_bar_current_colonial_tt: "Поточне значення [Concept('gc_colonial_dominance', 'колоніального панування')|e] колоса: #Y [FixedPointToInt(Country.GetVariable('gc_colonial_dominance'))]%#!"
  ga_alliance_war_cooldown_tt: "За останні #Y 20#! років [GetInternationalOrganizationType('grand_alliance').GetName] не закликав до війни"
  ga_will_declare_war_on_target_tt: "[GetInternationalOrganizationType('grand_alliance').GetName] оголосить війну своєму супротивнику"
  ga_alliance_strength_advantage: "Співвідношення сил військ союзу та колоса"
  ga_alliance_economic_advantage: "Співвідношення багатства союзу та колоса"
  ga_dominance_pressure: "Рівень могутності колоса"
  diplomatic_status_grand_alliance_name: "Великий союз"
  diplomatic_status_grand_alliance_tooltip: "#T Великий союз#!\nЦя країна вступила до [GetInternationalOrganizationType('grand_alliance').GetName|l] проти таких [Concept('countries', 'країн')|e]"
  grand_alliance_list_who_tt: "$WHO$ та $LIST$ разом входять до об’єднання «[GetInternationalOrganizationType('grand_alliance').GetName]»"
  grand_alliance_leader: "$grand_alliance$ — лідер"
  grand_alliance_leader_desc: "Найсильніший учасник $grand_alliance$, якого щороку визначають наново. Провід може перейти до іншого учасника, якщо фортуна зміниться."
  spa_increase_capital_market_demands: "Збільшення попиту на столичному ринку"
  spa_increase_capital_market_demands_desc: "Завдяки накопиченим багатствам наша столиця стала предметом заздрощів для всього світу. Оберіть будь-який ходовий товар на її ринку й оголосіть його обов’язковим елементом придворного вжитку. Зростання попиту принесе величезний прибуток купцям, що доправляють цей товар до наших берегів."
  gc_increase_market_demand_select_good: "Оберіть улюблений товар"
  gc_increase_market_demand_no_good: "@trigger_no!На нашому [Concept('capital', 'столичному')|e] ринку немає підхожого товару"
  gc_increase_market_demand_tt: "Ми оберемо один із товарів на нашому [Concept('capital', 'столичному')|e] ринку й почнемо навмисно роздмухувати попит на нього, підвищуючи цим його вартість і приносячи значний прибуток кожному, хто доправляє його до нашої країни"
  golden_century_events.22.title: "Придворна мода"
  golden_century_events.22.desc: "Золота доба принесла із собою величезні багатства, а разом із ними зросли й забаганки столичної верхівки. Тепер знать, духовенство та заможні купці міста [ROOT.GetCapital.GetName] невтомно змагаються в розкошах, а їхні слуги нишпорять ринками в пошуках такого краму, як [target_good.GetName|l].\n\n[target_ruler.GetName] може підтримати цю моду й прищепити двору пристрасть до цього популярного краму, аби попит на нього в нашій столиці зріс до непристойно високого рівня. Тоді купці, які доправляють його до нашої країни, зможуть помітно розбагатіти, а завдяки митам і внутрішній торгівлі поповниться й наша скарбниця."
  golden_century_events.22.a: "Дозволимо двору диктувати моду."
  gc_increase_market_demand_result_tt: "Попит на товар «[target_good.GetName]» на ринку міста [ROOT.GetCapital.GetName] зросте на наступні #Y 10#! років, що підвищить його вартість і принесе значний прибуток кожному, хто його продає"
  adu_charter_saharan_trade_house: "Заснування торгового дому в Сахарі"
  adu_charter_saharan_trade_house_desc: "Золоті шляхи Сахари — підґрунтя нашого розквіту. Оберіть один із ринкових осередків королівства та заснуйте там великий Сахарський торговий дім. Нове підприємство згуртує під своїм проводом караванну торгівлю й забезпечить приплив багатств пустелі до нашої скарбниці."
  adu_charter_saharan_trade_house_select_market: "Оберіть ринковий осередок"
  adu_charter_saharan_trade_house_no_market: "@trigger_no!У нас немає підхожого [Concept('urban_location', 'міста')|e] для заснування Сахарського торгового дому"
  adu_charter_saharan_trade_house_tt: "Ми збудуємо в обраному [Concept('urban_location', 'місті')|e] [ShowBuildingTypeName('saharan_trade_house')], що є великим осередком караванної торгівлі"
  golden_century_events.23.title: "[ShowBuildingTypeNameWithNoTooltip('saharan_trade_house')]"
  golden_century_events.23.desc: "На перетині караванних шляхів можна нажити незліченні багатства, торгуючи #TOOLTIP:GOODS,salt,X #L сіллю#!#!, #TOOLTIP:GOODS,goods_gold,X $tt_op_L$золотом$tt_cl_2$ та #TOOLTIP:GOODS,cloth,X #L тканинами#!#!. Щоби взяти цю торгівлю під власний контроль, ми заснуємо у [target.Custom('LR_PREP')|l] [target.GetName] торговий дім, чиї просторі комори та рахункові палати спрямовуватимуть багатства пустельних караванів просто до #L [actor.GetAdjective|l]ої#! скарбниці.\n\nКупці з усього #TOOLTIP:REGION,sahel_region,X #L Сахелю#!#! та #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#! збиратимуться під його дахом, приносячи нам прибуток і наповнюючи наші ринки крамом з обох регіонів."
  golden_century_events.23.a: "Ми приймемо каравани."
  golden_century_events.17.title: "Ордени в [ShowSituationNameWithNoTooltip('golden_century')]"
  golden_century_events.17.desc: "Наша доба настала, і вона мало схожа на ту, для якої створювалися лицарські ордени.\n\nРобота віку вершиться у #TOOLTIP:AREA,flanders_area,X #L Фландрії#!#!, у #TOOLTIP:LOCATION,milano,X #L Мілані#!#! та за океаном: флоти, банки та #italic терції#!, оплачені сріблом. Ордени тримають замки, обернені до кордону, якого вже ніхто не пам’ятає, а їхні брати, усе ще найкраща важка кіннота [ShowReligionAdjective('catholic')|l]ого світу, марнують дні за збиранням ренти та суперечками про старшинство.\n\nВони — надбання, яким [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] переста[ROOT.GetCountry.Custom('crown_vlaloly')] користуватися."
  golden_century_events.17.a: "Дати їм справу під силу [ROOT.GetCountry.Custom('rank_ua_DAT')]."
  golden_century_events.17.b: "Відправити їх на почесний спочинок із платнею."
  golden_century_events.17.c: "Залишити їх при власній ренті."
  gc_orders_given_new_purpose_tt: "$bfts_orders_given_new_purpose_tt$"
  golden_century_events.18.title: "Бездільні списи"
  golden_century_events.18.desc: "Дві комтурії зчепилися через межу, млин і двохсотлітню образу, і справа зайшла далі, ніж будь-хто сподівався. З обох боків є вбиті, й обидва магістри написали нам першими, кожен певний своєї правоти.\n\nОсь чим займається лицарський орден, коли немає війни. Брати так само озброєні, так само не підсудні звичайним судам і так само не відповідають ні перед ким у [ROOT.GetCountry.Custom('rank_ua_PREP')|l], крім нас самих."
  golden_century_events.18.a: "Покарати обох, привселюдно."
  golden_century_events.18.b: "Нехай розбираються самі."
  golden_century_events.19.title: "Заморські ордени"
  golden_century_events.19.desc: "Від магістрів надійшло прохання, і досить зухвале. Вони бажають заснувати комтурії в Індіях, продовжити там ту саму працю, яку колись вели на мавританському порубіжжі, та втримувати нові рубежі так само, як утримували старі.\n\nЦе або порятунок установи, що вичерпала своє порубіжжя, або вивіз за море клопоту, якого ми не владнали вдома."
  golden_century_events.19.desc_expected: "Ми звеліли їм звернути погляд на океан, і вони звернули. Магістри сприйняли цю пораду з більшим завзяттям, ніж ми, мабуть, очікували.\n\nВони мають капеланів на флотах, братів у портах, а тепер ще й офіційне прохання про заснування комтурій в Індіях, укладене правниками, які явно працювали над ним не один день. Ордени віднайшли своє нове порубіжжя в ту саму мить, як ми на нього вказали."
  golden_century_events.19.a: "Дарувати їм право на Індії."
  golden_century_events.19.b: "Індіями володі[ROOT.GetCountry.Custom('crown_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')], а не [GetUniqueInternationalOrganization('catholic_church').GetNameWithNoTooltip]."
  golden_century_events.24.title: "Визнання в Європі"
  golden_century_events.24.desc.desc_spa: "Правителі по той бік Піренеїв довгий час вирішували долю #TOOLTIP:CONTINENT,europe,X $tt_op_L$Європи$tt_cl_2$, зовсім не зважаючи на країни на південь від хребта, проте часи змінюються. Там, де раніше наших послів змушували годинами чекати на прийом, тепер ґречно відчиняють перед ними двері та саджають у затишні крісла. Своїм вправним врядуванням [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'домоглася', 'домігся')] того, що нині про шлюби та посольські справи [ROOT.GetCountry.Custom('rank_ua_GEN')|l] знають у кожній поважній канцелярії.\n\nНас іще не бояться, але вже помічають і визнають, а це перший крок на шляху до величі. Нехай старі монархії втішаються останніми митями своєї величі, бо панувати їм лишилося зовсім недовго."
  golden_century_events.24.desc.desc_adu: "Колись #TOOLTIP:RELIGIONGROUP,christian,X #L християнські#!#! володарі самовпевнено скинули нас з рахунків, а тепер їхні посли оббивають пороги нашого двору, приносячи дари, осипаючи нас лестощами та уважно дослухаючись до того, що каже [target_ruler.GetName]. Країна, яку вони колись поховали, нині живе та процвітає.\n\nМи ще не досягли панування, але вже повернули собі місце за столом, на чолі якого колись сиділи. Правовірні знову прийшли до #TOOLTIP:CONTINENT,europe,X #L Європи#!#!, але цього разу ми маємо намір залишитися тут назавжди."
  golden_century_events.24.desc.historical_info_spa: "Унія Кастилії та Арагону заявила про себе в Європі не так дзвінком зброї, як низкою шлюбних союзів. Трохи більше ніж за десять років Фердинанд та Ізабелла посвоячилися з правлячими домами Португалії, габсбурзької Бургундії та тюдорівської Англії. Укладені в 1496 та 1497 роках подвійні шлюби вплели Іспанію в родову мережу половини континенту. Задовго до того, як європейці почали тремтіти перед уславленими іспанськими терціями (#italic tercios#!), канцелярії всіх країн уже звикли зважати на інтереси іспанської корони в будь-яких своїх розрахунках."
  golden_century_events.24.desc.historical_info_adu: "У IX столітті, за правління Абд ар-Рахмана II, Кордовський емірат увійшов до числа великих держав того часу. У 840 році візантійський імператор Феофіл спрямував туди посольство, прагнучи укласти союз проти Аббасидів, і кордовський двір відповів тим самим. Емірат почав обмінюватися посланцями й дарами з імперіями, які доти вважали Аль-Андалус лише далекою бунтівною провінцією."
  golden_century_events.24.a: "Ми прибули."
  as_long_as_we_remain_at_25_european_dominance_rising_iberian_power_modifier_tt: "Поки наше [Concept('gc_european_dominance', 'панування в Європі')|e] у ситуації «[GetSituationByKey('golden_century').GetName]» перебуває на рівні #Y 25#!, наша країна отримуватиме бонуси від модифікатора «[ShowModifier('rising_iberian_power_modifier')]»"
  as_long_as_we_remain_at_25_european_dominance_restoration_of_al_andalus_modifier_tt: "Поки наше [Concept('gc_european_dominance', 'панування в Європі')|e] у ситуації «[GetSituationByKey('golden_century').GetName]» перебуває на рівні #Y 25#!, наша країна отримуватиме бонуси від модифікатора «[ShowModifier('restoration_of_al_andalus_modifier')]»"
  enables_edict_of_expulsion_action_tt: "Відкриває [Concept('action', 'дію')|e] «[ShowGenericActionName('spa_edict_expulsion')]», яка дозволяє вигнати з країни вірян неприйнятної віри"
  enables_restore_caliphate_cb_taifa_tt: "Відкриває [Concept('casus_belli', 'привід для війни')|e] «[ShowCasusBelliName('cb_restore_ummayad_caliphate')]» та вид [Concept('subject', 'васала')|e] «Тайфа»"
  golden_century_events.25.title: "Присутність за краєм світу"
  golden_century_events.25.desc.desc_spa: "Перші кораблі нарешті повернулися додому, вщерть завантажені цукром, барвниками та різноманітним екзотичним крамом, що викликає чималу цікавість серед жителів міста [ROOT.GetCapital.GetName]. Кожен корабель біля причалу зустрічає дюжина купців, охочих якнайшвидше укласти вигідні торгові угоди. Своїми мудрими рішеннями [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'привернула', 'привернув')] до [ROOT.GetCountry.Custom('rank_ua_GEN')|l] величезні багатства з далеких земель, які наші піддані навряд чи зможуть відшукати на мапі.\n\nУтім, це лише дещиця порівняно з тим, що ми зможемо заробити в майбутньому. Купці, які тямлять у багатонадійних справах краще за будь-якого флотоводця, вже завбачливо беруться будувати нові комори."
  golden_century_events.25.desc.desc_adu: "Каравани повертаються на північ. Старі шляхи пустелями знову оживають, завдяки чому сіль вирушає на південь в обмін на #TOOLTIP:REGION,sahel_region,X #L сахельське#!#! золото, а ринки нашої країни ростуть і процвітають, приймаючи дедалі більше купців і караванників.\n\nКолись наші пращури також володіли цими багатствами, але змарнували їх. А от [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'налаштована', 'налаштований')] зберегти й примножити їх: тепер оази та шляхи пильно охороняються, а кожен вантаж золота, що його везуть пустелею, обов’язково проходить крізь наші ринки, наповнюючи нашу скарбницю."
  golden_century_events.25.desc.historical_info_spa: "Уже за десять років після висадки Колумба іспанська корона взяла мореплавство в океані під свій нагляд. Заснована в 1503 році в Севільї Каса-де-Контратасьйон (Casa de la Contratación) видавала дозвіл кожному кораблю, обліковувала всі вантажі та обкладала митом крам, що прибував із Нового Світу. У такий спосіб розрізнені виправи перетворилися на злагоджену державну справу ще до того, як самі колонії набули бодай якоїсь ваги."
  golden_century_events.25.desc.historical_info_adu: "Багатства Західного Судану йшли до Середземномор’я крізь такі пустельні ворота, як Сиджильмаса — саме там споряджали й обкладали митом каравани, які долали Сахару. Захопивши в середині XI століття Сиджильмасу та Аудаґост, Альморавіди підкорили собі обидва кінці західного золотого шляху, і золото Сахелю опинилося під владою одного дому."
  golden_century_events.25.a: "Багатства чекають за обрієм."
  as_long_as_we_remain_at_25_colonial_dominance_market_dominance_modifier_tt: "Поки наше [Concept('gc_colonial_dominance', 'панування в колоніях')|e] у ситуації «[GetSituationByKey('golden_century').GetName]» перебуває на рівні #Y 25#!, наша країна отримуватиме бонуси від модифікатора «[ShowModifier('market_dominance_modifier')]»"
  as_long_as_we_remain_at_25_colonial_dominance_wealth_sahel_modifier_tt: "Поки наше [Concept('gc_colonial_dominance', 'панування в колоніях')|e] у ситуації «[GetSituationByKey('golden_century').GetName]» перебуває на рівні #Y 25#!, наша країна отримуватиме бонуси від модифікатора «[ShowModifier('wealth_sahel_modifier')]»"
  enables_increase_capital_market_demands_action_tt: "Відкриває [Concept('action', 'дію')|e] «[ShowGenericActionName('spa_increase_capital_market_demands')]», яка дозволяє залучати обраний [Concept('goods', 'крам')|e] на наш столичний [Concept('market', 'ринок')|e]"
  enables_charter_saharan_trade_house_action_tt: "Відкриває [Concept('action', 'дію')|e] «[ShowGenericActionName('adu_charter_saharan_trade_house')]», яка дозволяє заснувати в одному з наших [Concept('urban_locations', 'міст')|e] Сахарський гостиний двір"
  golden_century_events.26.title: "Вплив за краєм світу"
  golden_century_events.26.desc.desc_spa: "Тим морським шляхом, яким колись ходили лише відчайдухи, нині також прямують і звичайні поселенці, що вирушають до далеких берегів разом із нашими вояками. Там вони облаштовують свої ниви, зводять церкви та ростять дітей, які, певно, зостануться у новій домівці й уже ніколи не побачать прекрасне місто [ROOT.GetCapital.GetName] на власні очі. [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'вдоволена', 'вдоволений')] своєю працею, адже тепер заморські володіння належать нам не лише на папері, а й насправді.\n\nБудь-хто може оскаржити наші кордони, коли вони є лише малюнками на мапі. Та якщо на цих землях живуть тисячі родин, ці кордони раптом набувають дійсної сили. Тому ми мусимо всіляко сприяти поселенцям, оскільки саме вони зміцнюють право на владу над нашими колоніальними володіннями."
  golden_century_events.26.desc.desc_adu: "Золотий шлях докорінно змінив наше суспільство: каравани вирушають і повертаються суворо за звичаєм і часом, а судді в містах-оазах негайно розв’язують будь-які суперечки між купцями, завдяки чому столичні митні палати можуть із певністю будувати плани, не переймаючись через збої та затримки.\n\nКоли багатство приходить одного разу — це талан. Якщо ж воно надходить щороку — це ознака вправного врядування. [target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'зробила', 'зробив')] неможливе, перетворивши пустелю на наше друге море, яким ходять лише наші кораблі."
  golden_century_events.26.desc.historical_info_spa: "Переселення іспанців до Нового Світу вимагало обов’язкового дозволу влади. Потоки колоністів ішли крізь Севілью; ті, хто бажав перетнути океан, одержували від корони земельні наділи та податкові пільги. За допомогою особливих указів, #italic cédulas de población#!, корона перетворила завоювання на планомірне заселення, і до середини XVI століття океан перетнули десятки тисяч кастильців."
  golden_century_events.26.desc.historical_info_adu: "Із золота Сахелю карбували монету на всьому мусульманському Заході. Динар Альморавідів із цукрового золота мав таку довіру, що християнські королівства Іберії почали відкрито наслідувати його. Їхній #italic мараведі#! дістав і ваговий зразок, і саму назву від #italic мурабітунів#!, які карбували першотвір."
  golden_century_events.26.a: "Примножимо наші багатства."
  as_long_as_we_remain_at_50_colonial_dominance_migratory_waves_modifier_tt: "Поки наше [Concept('gc_colonial_dominance', 'панування в колоніях')|e] у ситуації «[GetSituationByKey('golden_century').GetName]» тримається на рівні #Y 50#!, наша країна отримуватиме вигоду від модифікатора «[ShowModifier('migratory_waves_modifier')]»"
  as_long_as_we_remain_at_50_colonial_dominance_golden_road_modifier_tt: "Поки наше [Concept('gc_colonial_dominance', 'панування в колоніях')|e] у ситуації «[GetSituationByKey('golden_century').GetName]» тримається на рівні #Y 50#!, наша країна отримуватиме вигоду від модифікатора «[ShowModifier('golden_road_modifier')]»"
  enables_issue_royal_decree_action_tt: "Відкриває [Concept('action', 'дію')|e] «[ShowGenericActionName('spa_issue_royal_decree')]», яка дозволяє заселяти наші віддалені землі за допомогою королівського указу"
  enables_gold_caravan_expedition_action_tt: "Відкриває [Concept('action', 'дію')|e] «[ShowGenericActionName('adu_dispatch_gold_caravan')]», яка дозволяє вирядити караван на південь по #TOOLTIP:REGION,sahel_region,X #L сахельське#!#! золото"
  golden_century_events.27.title: "Панування за краєм світу"
  golden_century_events.27.desc.desc_spa: "Наші віддалені володіння нарешті заговорили нашою мовою. Тамтешні міста розбудовані за нашими зразками, двори тримаються наших законів, а порти за першим покликом навантажують кораблі крамом і даниною, які пливуть просто на батьківщину. Ті землі, що ще донедавна були геть дикими, тепер дедалі більше уподібнюються до #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!, і [target_ruler.GetName] цілком слушно вбачає у цьому власну заслугу.\n\nВелика відстань — давній ворог будь-якої імперії — більше не є для нас такою перепоною, як колись. Коли далекі краї починають сповідувати нашу віру, чинити суд за нашими законами та вносити свою частку до скарбниці, вони перестають бути чужиною й стають новою домівкою вдалині від дому."
  golden_century_events.27.desc.desc_adu: "Каравани несуть із собою віру, а за вірою йдуть і закони. У містах, про які наші пращури чули лише з переказів, молитви нині лунають нашою мовою, а судді засідають із нашого благословення. Разом із тим володарі далеких країв прибувають до нас у пошуках визнання, вкотре свідчачи, що нам пощастило вірою здобути те, чого ми віками не могли підкорити мечем.\n\n[target_ruler.GetName] [Select_CString(target_ruler.IsFemale, 'домоглася', 'домігся')] того, що #italic дават#! став одним із чільних засобів врядування нарівні з військом — утім, значно дешевшим, бо віряни ладні задарма боронити свої священні переконання."
  golden_century_events.27.desc.historical_info_spa: "До середини XVI століття Новий Світ перестав бути просто захопленими землями й перейшов під пряму владу корони. Віцекоролівства Нова Іспанія та Перу, засновані у 1535 та 1542 роках, дали Кастилії змогу створити за океаном суди, ради та єпископські кафедри, а навантажені сріблом торгові кораблі, що щороку прибували до Севільї, перетворили ці далекі краї на надійне джерело багатства для корони."
  golden_century_events.27.desc.historical_info_adu: "Іслам перетнув Сахару разом із купецькими розрахунковими книгами задовго до появи там перших загонів. Нова віра швидко вкоренилася в торгових містах уздовж караванних шляхів Сахелю. Місцеві володарі, як-от у країні Такрур, навернулися до неї ще в XI столітті. Слідом за новою вірою в Сахелі з’явилися мусульманські богослови та судді, що залучило ці багаті на золото краї до правового та культурного кола мусульманського Заходу."
  golden_century_events.27.a: "Підкорімо їх нашому законові та духові."
  as_long_as_we_remain_at_75_colonial_dominance_elevated_cultural_identity_modifier_tt: "Поки наше [Concept('gc_colonial_dominance', 'панування в колоніях')|e] у ситуації «[GetSituationByKey('golden_century').GetName]» тримається на рівні #Y 75#!, наша країна отримуватиме вигоду від модифікатора «[ShowModifier('elevated_cultural_identity_modifier')]»"
  as_long_as_we_remain_at_75_colonial_dominance_dawa_colonial_administration_modifier_tt: "Поки наше [Concept('gc_colonial_dominance', 'панування в колоніях')|e] у ситуації «[GetSituationByKey('golden_century').GetName]» тримається на рівні #Y 75#!, наша країна отримуватиме вигоду від модифікатора «[ShowModifier('dawa_colonial_administration_modifier')]»"
  enables_demand_tribute_fleets_action_tt: "Відкриває [Concept('action', 'дію')|e] «[ShowGenericActionName('spa_demand_tribute_fleets')]», яка дозволяє наказати нашим васалам спорядити до нас флоти з даниною"
  enables_build_qadi_office_action_tt: "Відкриває [Concept('action', 'дію')|e] «[ShowGenericActionName('adu_build_qadi_office')]», яка дозволяє призначити шаріатського суддю у столиці нашого [Concept('subject', 'васала')|e]"
  golden_century_events.28.title: "Зверхність за краєм світу"
  golden_century_events.28.desc.desc_spa: "Наш вплив охоплює весь білий світ. Далекі моря всіяні нашими торговими кораблями, чужоземні колонії існують лише з нашої ласки, а коли [target_ruler.GetName] бажає заволодіти якоюсь гаванню, протокою чи островом, [Select_CString(target_ruler.IsFemale, 'її', 'його')] суперникові зостається лиш назвати ціну, бо він просто не має змоги відмовити.\n\nКолись наші пращури вимолювали мапи у чужоземних мореплавців. Тепер же наші онуки вивчатимуть наші власні мапи й бачитимуть нашу спадщину всюди, куди б вони не прибули. Між цими двома поколіннями постали ми — ті самі невтомні люди, що уможливили це майбутнє."
  golden_century_events.28.desc.desc_adu: "Уся торгівля від далеких закутків пустелі до західного моря лежить у руках однієї країни. Жоден караван чи торговий корабель не вирушить у дорогу, доки ми не одержимо своєї частки, і всі наші заморські підданні, що раніше були нам чужими, тепер моляться, торгують і спілкуються за нашими звичаями й порядками.\n\nНавіть #TOOLTIP:RELIGIONGROUP,christian,X #L християнські#!#! королі правлять лише з нашої ласки й чудово це розуміють. [target_ruler.GetName] назавжди ввійде в історію, бо саме за [Select_CString(target_ruler.IsFemale, 'неї', 'нього')] далекі краї перестали бути для нас недосяжними й насправді стали частиною нашої могутньої країни."
  golden_century_events.28.desc.historical_info_spa: "У другій половині XVI століття Іспанська імперія здобула статус світової наддержави. Срібні рудники в Потосі, відкриті 1545 року, забезпечували коштовним металом монетні двори по всьому світу, а з 1565 року манільські галеони почали перевозити видобуте там срібло через Тихий океан для закупівлі азійського шовку. Багато хто казав, і не без підстав, що над володіннями іспанського короля ніколи не заходить сонце."
  golden_century_events.28.desc.historical_info_adu: "У добу свого розквіту імперія Альмохадів тримала під контролем обидва береги Західного Середземномор’я. Їхній флот не знав собі рівних. Не випадково 1189 року Саладін, прагнучи знайти союзників у боротьбі з хрестоносцями, звернувся по допомогу саме до альмохадського халіфа — він просив вислати кораблі мусульманського Заходу, щоби ті перетяли франкам шляхи постачання морем."
  golden_century_events.28.a: "Відтепер нам належить увесь світ."
  as_long_as_we_remain_at_100_colonial_dominance_global_colonial_dominance_modifier_tt: "Поки наше [Concept('gc_colonial_dominance', 'панування в колоніях')|e] у ситуації «[GetSituationByKey('golden_century').GetName]» перебуває на рівні #Y 100#!, наша країна отримуватиме вигоду від модифікатора «[ShowModifier('global_colonial_dominance_modifier')]»"
  as_long_as_we_remain_at_100_colonial_dominance_mastery_of_the_sudan_modifier_tt: "Поки ми утримуємо #Y 100#! [Concept('gc_colonial_dominance', 'панування в колоніях')|e] до кінця ситуації «[GetSituationByKey('golden_century').GetName]», ми користуватимемося перевагами від «[ShowModifier('mastery_of_the_sudan_modifier')]»"
  enables_seize_colony_action_tt: "Відкриває [Concept('action', 'дію')|e] «[ShowGenericActionName('spa_seize_colony')]», яка дозволяє заявити претензії на колонію іншої країни"
