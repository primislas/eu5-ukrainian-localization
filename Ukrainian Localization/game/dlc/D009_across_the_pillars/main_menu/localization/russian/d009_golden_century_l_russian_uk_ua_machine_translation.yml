  crown_of_al_andalus: "Корона Аль-Андалусу"
  crown_of_al_andalus_desc: "Одна корона, щоб правити всіма: тайфи #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!, що століттями лишалися розділеними після падіння #TOOLTIP:LOCATION,cordoba,X #L Кордови#!#!, знову об’єднані під владою одного престолу, і віднині як правовірні, так і зіммії визнають владу нашого дому."
  adu_restored_f: "Аль-Андалус"
  adu_restored_f_desc: "Битва за #TOOLTIP:LOCATION,strait_of_gibraltar,X #L Гібралтарську протоку#!#! завершилася перемогою, і тепер можна братися до відновлення Аль-Андалусу. #TOOLTIP:RELIGIONGROUP,muslim,X #L Іслам#!#! торжествує; щоби відродити колишній лад, знадобиться повернути під нашу владу лише кілька земель #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!."
  scales_with_our_european_dominance_tt: "Посилення завдяки [Concept('gc_european_dominance', 'європейському пануванню')|e] у [Concept('situation', 'ситуації')|e] «[GetSituationByKey('golden_century').GetName]»"
