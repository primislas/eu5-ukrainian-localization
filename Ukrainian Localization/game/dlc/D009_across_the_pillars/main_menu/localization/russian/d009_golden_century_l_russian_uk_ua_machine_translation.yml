  golden_century_colossus_endures: "Колос вистояв"
  golden_century_colossus_endures_desc: "Колос зберігає свою добу. Він отримує [ShowModifier('gc_european_triumph_modifier')] та [ShowModifier('gc_colonial_triumph_modifier')], кожен із яких змінюється залежно від того, як далеко насправді сягав його вплив. Там, де цей вплив не зустрів жодного опору, його вінчає титул [ShowModifier('hegemon_of_europe_modifier')] чи [ShowModifier('hegemon_of_new_world_modifier')]."
  golden_century_colossus_destroyed: "Падіння Колоса"
  golden_century_colossus_destroyed_desc: "Зі зникненням самого Колоса ані тріумф, ані кара нікому не передаються: доба просто втрачає силу, що її визначала."
  golden_century_colossus_diminished: "Колос применшений"
  golden_century_colossus_diminished_desc: "Колос виживає, але зазнає відчутного удару по своїй [Concept('stability', 'стабільності')|e] через те, що змалів до менших розмірів."
  golden_century_lost_quarter_starting_locations_tt: "Головна [Concept('country', 'країна')|e] цієї [Concept('situation', 'ситуації')|e] втратила чверть своїх початкових [Concept('locations', 'місцевостей')|e]"
