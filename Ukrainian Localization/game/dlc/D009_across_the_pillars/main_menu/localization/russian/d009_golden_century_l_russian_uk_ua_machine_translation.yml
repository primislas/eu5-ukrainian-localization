  gc_flashpoint_meter: "Поступ переломної миті"
  gc_flashpoint_meter_desc: "Золота доба не триватиме вічно: міцність нашої влади, наше становище за рубежем, борговий тягар, знецінення грошей — усе це сприяє зростанню напруги. Коли вона сягне краю, розпочнеться [Concept('flashpoint', 'переломна мить')|e]. Вона може або піднести нашу країну в зеніт, або вкинути її в хаос."
  GC_FLASHPOINT_METER_DISPLAY: "$VAL$"
  gc_flashpoint_meter_at_max_tt: "При значенні #Y 100#! у провідній [Concept('country', 'країні')|e] настає [Concept('flashpoint', 'переломна мить')|e] ситуації «[ShowSituationName('golden_century')]», після чого значення повертається до #Y 0#!"
