l_russian:
  agraw_federation_reform: "Федерація агравів"
  agraw_federation_reform_desc: "#italic Аграв#! — рада старійшин, що об’єднує кабільські села та клани, — править без опертя на столичну виконавчу владу. Ухвалені на ній рішення обов’язкові для всіх кланів, і жоден урядовець не здатен заперечити волю зібраних старійшин. Подібний союзний устрій робить нас майже невразливими для класичних способів завоювання: немає ані престолу, який можна захопити, ані палацу, який можна спопелити, ані спільного договору, розірвання якого позбавило б нас волі. Цей устрій єднає поселення в неподільне ціле, не нав’язуючи їм волі далекого султана. Ми миримося з довгим обговоренням справ заради справжнього самоврядування — адже в народу, який сам порядкує власною долею, немає причин повставати проти власної влади."
  alg_dey_regency_reform: "Алжирське регентство"
  alg_dey_regency_reform_desc: "В Алжирському регентстві склався самобутній спосіб правління: корпус яничарів обирає #italic дея#!, сухопутними силами командує ага, а старші офіцери утворюють #italic диван#!, що виконує водночас роль ради та зборів. Цей лад не має нічого спільного зі звичаєвим правлячим домом: #italic дей#! є підзвітним корпусу, що його обрав, і в разі втрати довіри #italic оджаку#! рідко лишається на посаді понад кілька місяців. І все ж цей устрій на диво стійкий. Він дає змогу виплекати дієву військово-піратську країну, чий вплив на морі та в торгівлі годі порівняти з її скромним людом. Ми затвердили цей лад як державний устрій регентства: непередбачуваність зміни влади у війську — мала ціна за самоврядне військо та наповнювану морем скарбницю."
  amenokal_paramountcy_reform: "Верховенство аменокаля"
  amenokal_paramountcy_reform_desc: "#italic Аменокаль#! — верховний вождь конфедерації туарегів — править без опертя на урядовців. Його влада тримається на особистому авторитеті, священному барабані як знаку гідности та відданості шляхетної верстви #italic імашаген#!, яка пильнує за здійсненням його волі серед розрізнених кланів. Цей лад винятковий: могутності вождя вистачає, щоб закликати до зброї вершників з усієї конфедерації, але водночас влада настільки розсереджена, що дає змогу тримати під наглядом безкраї пустельні землі без залог у кожному оазисі. Ми затвердили цей устрій як наш державний лад. Посольські справи та військо відтепер переходять під руку аменокаля, а внутрішній лад кожного клану визначається лише його власними звичаями."
  amir_al_muslimin: "Амір аль-муслімін"
  amir_al_muslimin_desc: "Титул #italic «амір аль-муслімін»#! — повелитель мусульман — належав султанам із дому Альморавідів, які перетнули Сахару, щоби врятувати Аль-Андалус від натиску християн, а також нашим пращурам Маринідам, які раз у раз долали протоку з тією самою метою. Ми вигнали з протоки флоти Кастилії та Арагону, тож також перейняли цю спадщину, ставши оборонцями розлогого рубежу на заході ісламського світу. Наш статус підкреслюється в хутбах, що лунають у мечетях від Феса до Гвадалквівіра. Цей титул прихиляє андалуські громади до нашого престолу, приваблює воїнів віри під наші знамена й розносить наше ім’я по всіх мусульманських дворах, які стежать за подіями на Іберійському півострові."
  anr_coprincipality_reform: "Співправління"
  anr_coprincipality_reform_desc: "На землях Андорри діє винятковий конституційний лад спільного суверенітету двох князів-співправителів — єпископа Урхельського та графа де Фуа, чиї багатовікові взаємні зазіхання дивним чином привели до стійкої рівноваги. Жоден із правителів не може діяти без згоди іншого, і цей взаємний нагляд уберіг Андорру від поглинання могутніми сусідами. Ми затвердили звичай співправління за конституційну основу нашої країни, свідомо обмеживши себе в одноосібних діях задля міжнародної безпеки."
  ara_diputacion_general_reform: "Генеральна депутація Арагону"
  ara_diputacion_general_reform_desc: "#italic Генеральна депутація Арагону#! спершу утворювалася як постійний комітет кортесів Арагону для нагляду за збором призначених для корони коштів, але з часом обернулася на постійну установу державної влади. Під проводом депутатів (#italic Diputados#!), яких обирають три стани, вона забезпечує скарбову звітність і боронить конституційні вольності (#italic fueros#!) від зазіхань монарха. Депутація засідає цілий рік; так збори, які колись скликалися лише за потреби, стали постійним осередком арагонського самоврядування."
  basque_juntas_generales_reform: "Генеральні хунти"
  basque_juntas_generales_reform_desc: "#italic Генеральні хунти#! — це давні представницькі збори в баскських провінціях, що відбуваються біля прадавнього дуба Герніки. Там обговорюють справи законодавства, оподаткування та захисту прав місцевого люду. До того ж у кожній провінції є власні #italic фуерос#! — звичаєві права, які сюзерени мусять шанувати й берегти, щоби заслужити визнання басків. Відтак хунти становлять собою самоврядні осередки, властиві виключно для #TOOLTIP:REGION,iberia_region,X $tt_op_L$Іберії$tt_cl_2$. Досі жодному монархові не вдалося скасувати ці збори без затятого опору з боку місцевих жителів."
  cas_santa_hermandad_reform: "Свята ермандада"
  cas_santa_hermandad_reform_desc: "#italic Свята ермандада#! — постійне ополчення правопорядку, покликане викорінити розбій та убезпечити дороги королівства. Ця впорядкована установа, заснована спільно Фернандо та Ізабеллою, прийшла на зміну розрізненим міським братствам і перебуває в безпосередньому підпорядкуванні корони. Вплив королівського правосуддя відтепер не обмежується містами: #italic ермандада#! взяла під захист сільські шляхи, зробивши мандрівки й торгівлю безпечними."
  cas_santa_hermandad_unlocks_hermandad_infantry_tt: "Дозволяє набирати [ShowUnitDefinitionName('a_hermandad_infantry')]"
  cas_santa_hermandad_unlocks_summon_santa_hermandad_tt: "Відкриває [ShowCabinetActionName('summon_santa_hermandad')] [Concept('cabinet_action', 'доручення')|e]"
  cat_corts_catalanes_reform: "Каталонські кортеси"
  cat_corts_catalanes_reform_desc: "#italic Каталонські кортеси#! — одні з найдавніших станово-представницьких зборів у Європі, що складаються з трьох палат: духовенства, знаті та королівських міст (#italic braç reial#!). Корона не має права впроваджувати надзвичайні податки без згоди всіх трьох палат, а монарх зобов’язаний задовольнити кривди зборів ще до виділення коштів. Такий устрій закріплює суспільний договір між правителем і підданими: суверенітет належить не лише королю, а всій країні як неподільному цілому."
  cat_generalitat_reform: "Generalitat de Catalunya («Женералітат Каталонії»)"
  cat_generalitat_reform_desc: "Женералітат Каталонії (#italic Generalitat de Catalunya#!) спершу поставав як постійний виконавчий орган каталонських кортесів для розподілу грошової допомоги та відання справами країни між засіданнями головних зборів. З часом він перетворився на чільний оплот конституційних вольностей Каталонії — постійно діючу раду обраних представників, які пильнують за неухильним виконанням зобов’язань, узятих короною. Безперервна робота Женералітату змінила каталонські звичаї зборів: зустрічі, які раніше скликалися від нагоди до нагоди, поступилися місцем розміреному й упорядкованому врядуванню."
  diwan_of_the_azzaba_reform: "Диван аль-Аззаба"
  diwan_of_the_azzaba_reform_desc: "#italic Диван аль-Аззаба#! — рада ібадитських богословів, які водночас служать правознавцями, суддями та намісниками, — є самобутнім устроєм правління в Мзабському п’ятиградді. Цей лад найближче підійшов до споконвічного ібадитського ідеалу громади, де влада належить не найсильнішим, а найосвіченішим. Віра тут невіддільна від врядування: радники #italic аззаба#! засідають просто в мечеті, розв’язують торгові суперечки на підставі тих самих догматів, що й богословські справи, а будь-яке рішення влади потребує їхнього неодмінного схвалення. Ми проголосили цей аскетичний лад засадою нашого правління: наша країна правитиметься не за законами мирських королівств, а як істинна громада вірян, відповідальних перед Богом та одне перед одним."
  glc_xunta_xeral_reform: "Генеральна хунта Королівства Галісія"
  glc_xunta_xeral_reform_desc: "#italic Генеральна хунта#! є представницькими зборами нашого королівства, де посланці семи провінцій Галісії обговорюють оподаткування, закони й захист своїх прав. Виконуючи роль постійного парламенту, генеральна хунта дає галісійській знаті, духовенству й містам змогу висловлювати короні свої міркування з різних питань та відстоювати власні звичаєві права й привілеї, притаманні лише цій частині #TOOLTIP:REGION,iberia_region,X $tt_op_L$Іберії$tt_cl_2$. Завдяки сумлінній праці #italic хунти#! в Галісії врядування налагоджене ліпше, ніж на більшості інших земель півострова."
  gra_hajib_reform: "Хаджиб ад-Даула"
  gra_hajib_reform_desc: "Посаду #italic хаджиба#!, що поєднує обов’язки камергера та головного радника, можна назвати стрижнем, на якому тримається все врядування нашим еміратом. Хаджиб відає справами правителя, контролює фінансову діяльність #italic дивана#! та виступає головним посередником між султаном і державною канцелярією. Офіційно закріпивши й розширивши повноваження цієї посади, ми передамо поточні справи врядування до рук одного здібного намісника. Це звільнить султана для вирішення воєнних та посольських питань і забезпечить злагоджену працю всієї країни."
  jamaa_parliament: "Джамаа"
  jamaa_parliament_desc: "Постійна дорадча установа нашого емірату, яка об’єднує під одним дахом #italic каді аль-джамаа#!, #italic візира#!, #italic шейха аль-гузат#! та вождів найбільших порубіжних родів. За такого устрою жодна з внутрішньополітичних сил не може нав’язати свою волю іншим."
  lon_cortes_de_leon_reform: "Леонські кортеси"
  lon_cortes_de_leon_reform_desc: "#italic Леонські кортеси#!, вперше скликані Альфонсо IX у 1188 році, вважаються однією з найстаріших станово-представницьких установ у європейській історії — вони майже на століття випередили появу англійського парламенту. Згуртувавши духовенство, знать і представників міст, вони закріпили найважливіший правовий принцип: перш ніж накладати нові повинності, монарх зобов’язаний заручитися згодою всіх станів. Ця багатовікова конституційна спадщина надає нашій владі правочинности, що ґрунтується не лише на праві завоювання, а й на офіційній згоді всієї країни."
  mll_universitat_de_mallorca_reform: "Університет Мальорки"
  mll_universitat_de_mallorca_reform_desc: "#italic Університет міста й королівства Мальорка#! — вища установа врядування нашої острівної країни, очолювана виборними присяжними (#italic юратами#!). До їхніх обов’язків входить нагляд за збиранням податків, проведення громадських робіт і захист інтересів купецтва та містян. Завдяки давнім звичаям міського самоврядування купецький стан став провідною силою у справах Мальорки. Тепер торгова політика та відання портами завжди відповідають потребам тих, чий дохід залежить від моря. Справне цивільне урядництво Університету слугує запорукою розквіту всього острова."
  mor_marinid_zenata_confederation_reform: "Конфедерація Маринідів-зената"
  mor_marinid_zenata_confederation_reform_desc: "#italic Бану Марін#! вийшли з #TOOLTIP:LOCATION,figuig,X #L Фігіга#!#! як кінні володарі #TOOLTIP:CULTURE,$zenati_tt$,X #L зената#!#! та відібрали [ShowLocationName('fez')] у знесиленого дому #TOOLTIP:DYNASTY,$almohad_dynasty_tt$,X #L Альмохадів#!#!, спираючись на племінну єдність і стяг [ShowReligiousSchoolName('maliki_school')] правовір’я. Наш дім [ShowDynastyName('marinid_dynasty')] як і раніше тримається на двох підвалинах: [ShowCultureNameWithNoTooltip('zenati')]і племена сідають на коней, коли їх закликає наш [GetCountry('MOR').GetGovernment.GetRulerTitle|l], #italic факіги#! благословляють [GetCountry('MOR').GetGovernment.GetRuler.GetHerHis] правління, а #italic джихад#! в аль-Андалусі відповідає перед кожною з них. [GetCountry('MOR').GetGovernment.GetRulerTitle|l] із роду [ShowDynastyNameWithNoTooltip('marinid_dynasty')] править лише тому, що [GetCountry('MOR').GetGovernment.GetRuler.GetHerHis] племена йдуть за ним, а [GetCountry('MOR').GetGovernment.GetRuler.GetHerHis] улеми визнають його право на владу, тож мусить знов і знов доводити і те, і інше мечем."
  mor_sharifian_sultanate_reform: "Шаріфський султанат"
  mor_sharifian_sultanate_reform_desc: "Шаріфські султани перетворили Марокко з конфедерації, залежної від племінного ополчення, на впорядковану монархію, чия влада однаково спирається як на священне походження правителів, так і на військову дисципліну. На державних землях розселені військово-служилі племена #italic джиш#!, на стрільбищах Феса навчаються гарматної справи андалуські стрільці, а розгалужений устрій #italic махзену#! відає збиранням податків і судовими приписами по всій країні з небаченою за Маринідів ретельністю. Цей устрій правління перетворює нашу #italic бараку#! — священну благодать нащадків Пророка — із простого домагання права на владу на повноцінний державний лад. Султанат стає водночас і правлячим домом, і установою, і вищим духовним судом."
  nav_cortes_navarra_reform: "Наваррські кортеси"
  nav_cortes_navarra_reform_desc: "Наваррські кортеси об’єднують три стани королівства — духовенство, знать і міста — в єдину установу, без згоди якої не можна вводити надзвичайні податки чи ухвалювати важливі закони. Будучи старшими за більшість іберійських парламентів, вони ревно оберігають споконвічні вольності королівства та обстоюють окреме законодавство, що вирізняє Наварру з-поміж її більших сусідів. Офіційно закріпивши статус цих зборів, ми визнаємо залежність влади корони від волі станів."
  por_estado_da_india_reform: "Ештаду да Індія"
  por_estado_da_india_reform_desc: "#italic Ештаду да Індія#! — особливе політичне утворення, створене #ONCLICK:COUNTRY,[GetCountry('POR').GetKey] #TOOLTIP:COUNTRY,[GetCountry('POR').GetKey],X [GetCountry('POR').Custom('CL_INST')|L]#!#! задля того, щоб полегшити врядування своїми віддаленими фейторіями, фортецями та колоніями в Азії. Перебуваючи у своєму осідку в Гоа, віцекороль Індії скеровує флоти й залоги, а також розпоряджається прибутками величезної морської імперії, що простяглася від Перської затоки до Південнокитайського моря. Зосереджуючи врядування цими землями в руках королівського намісника, #L [GetCountry('POR').GetNameWithNoTooltip|l]а#! корона може мати з них зиск та зміцнювати свій вплив набагато успішніше, ніж будь-яке приватне торгове товариство."
  ribat_state_tradition_reform: "Звичаї країни-рибату"
  ribat_state_tradition_reform_desc: "#italic Рибат#! — укріплена обитель, звідки рух Альморавідів розпочав своє завоювання Сахари й Магрибу, — становить собою не просто споруду, а цілий устрій врядування: військово-духовне братство, під проводом якого перебуває мережа фортець і мечетей, править довколишніми землями за допомогою побожних воїнів зі своїх залог, не витрачаючись на утримання цивільних чиновників. Ми перейняли цей уклад. У нашої країни немає єдиного головного палацу — влада розосереджена між кількома великими цитаделями. Наші урядовці — водночас і воїни, і богослови, а наше право на владу спирається не на родовитість, а на сувору дисципліну порубіжжя. Такий аскетичний лад врядування забезпечує нам добре захищені рубежі, духовенство, яке йде в бій, і воїнство, яке не забуває про молитву."
  tun_husaynid_beylik_reform: "Бейлик Хусейнідів"
  tun_husaynid_beylik_reform_desc: "Попри те що османський устрій врядування передбачав часту зміну підзвітних Порті намісників, хусейнідським #italic беям#! пощастило перетворити #italic бейлик#! Туніс на фактично спадкове володіння. Вони зуміли створити політичну вигадку: визнаючи себе васалами Османської імперії, заснували правлячий дім, який проіснував майже до наших днів. Хусейніди утворили дієву раду міністрів, зберегли культурну спадкоємність Іфрикії та змогли втримати рівновагу між дедалі більш формальною залежністю від Османської імперії та практичними вимогами європейської дипломатії набагато вправніше за багато подібних країн. Ми утвердили цей мішаний лад: відтепер нашою країною править дім, вона має сучасний урядовий устрій, а також достатній авторитет для ведення справ на правах визнаного суверена, зберігаючи водночас духовну опіку ісламського сюзерена."