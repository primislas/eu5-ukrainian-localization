l_russian:
  seven_cities_norumbega.1.title: "Річка, але не місто"
  seven_cities_norumbega.1.desc: "Три довгі місяці загін ішов річкою вгору від узбережжя Нової Англії, доки не вперся в нездоланну межу. Тут немає міста-фортеці. Якщо вірити вивідачам, на всій річці Пенобскот узагалі немає жодного міста. Береги густо поросли лісами, і єдиний слід цивілізації тут — села абенаків у заплавах біля закрутів річки. Місцеві охоче торгують із нами хутром, але через тлумача цікавляться, що саме ми сподівалися тут знайти. Літописцю нічого їм відповісти. [target_leader.GetName] пише донесення на батьківщину, сидячи в невеликому зрубному форті біля гирла річки, і чекає на початок відлиги, щоби вирушити назад."
  seven_cities_norumbega.1.a: "Згорнемо стяг. Ми повірили рибальським байкам."
  seven_cities_norumbega.1.historical_info: "Поселення Норумбега вперше з’явилося на європейських мапах у 30-х роках XVI століття. Картографи тієї доби поміщали його на узбережжі Атлантики, в околицях нинішнього штату Мен. Століття потому, коли європейці дісталися долини Пенобскота, легенда вже встигла помітно змінитися: Норумбегу почали уявляти як муроване місто-фортецю у верхів’ях річки. Імовірно, початок цим уявленням поклали перебільшені розповіді французької виправи, яка в 1525 році ненадовго встановила торгові зв’язки з абенаками в пониззі Пенобскота. Їхні довгі будинки, вкриті корою, мандрівники змальовували так, ніби перед ними справжнісіньке європейське місто з кам’яними мурами, — заможним жителям Сен-Мало було неважко уявити собі подібне поселення."
  seven_cities_norumbega.2.title: "Обжитий край"
  seven_cities_norumbega.2.desc: "Міф не підтвердився: перед нами не легендарне місто, але обжитий край. Від гирла Пенобскота до його порогів тягнуться численні села з будинками з кори, обгородженими садами, ритуальними курганами й добротними каное з бересту. [target_leader.GetName] зустрічається із сахемом абенаків із найбільшого села; нас прийняли з усією пошаною і заявили про готовність поступитися ділянкою на березі під французьку чи англійську факторію. Торгівля хутром тут справді вирує — на відміну від міста. Втім, і без нього ці землі достатньо цінні."
  seven_cities_norumbega.2.a: "Збудуємо факторію. Торгівля хутром — вагомий привід для цього."
  seven_cities_norumbega.2.historical_info: "Суспільний устрій абенаків у роки перших зустрічей із європейцями був простим: вони жили родинними громадами в селах, якими правили спадкові вожді — сагамори, вони ж сахеми. Залежно від пори року абенаки перебиралися з річкових долин, де вирощували різні культури, до узбережжя, де рибалили. Для європейських купців такий уклад виявився зручним: вони мали передбачуваних торгових партнерів і сталі поставки хутра й кукурудзи, а роздробленість абенацьких громад не дозволяла жодному правителю диктувати умови всій торгівлі. Місто-фортеця Норумбега виявилося вигадкою, проте торгівля хутром на Пенобскоті, яка й породила цю легенду, процвітала понад два століття."
  seven_cities_norumbega.3.title: "Місто-фортеця на річці"
  seven_cities_norumbega.3.desc: "Простори, що постали перед нами, цілковито відповідають зображеному на мапі. Річка тут глибока й чиста та сягає на сорок ліг углиб суходолу. На західному березі, де закінчується судноплавний шлях, загін натрапляє на місто, обнесене мурованими стінами. Мури зведені на європейський зразок, посеред міста розкинувся великий майдан, поруч стоїть простора кам’яниця під сланцевою стріхою, а неподалік — ринковий майдан. Населення тут мішане: більшість становлять абенаки, але тутешній вождь говорить украй видозміненою давньоскандинавською, заледве зрозумілою для єдиного знавця латини в нашому загоні. У кам’яному святилищі на головному майдані зберігається один-єдиний залізний меч — вочевидь скандинавської роботи. За словами вождя, його народ живе тут іще з часів прадіда його діда. [target_leader.GetName] строчить нотатки навіть швидше за літописця."
  seven_cities_norumbega.3.a: "Підпишемо угоду. Ми знайшли і країну, і золото."
  seven_cities_norumbega.3.historical_info: "У Європі століттями ширилися перекази про загублену скандинавську колонію, що нібито вціліла десь на просторах Північної Америки. Поодинокі археологічні знахідки — Ньюпортська вежа, Кенсінгтонський рунічний камінь, «пенні зі штату Мен», мапа Вінланду — на певний час додавали цій легенді дещицю вірогідности, проте всі вони незмінно виявлялися сумнівними або були визнані підробками. Справжні археологічні свідчення присутності скандинавів у Північній Америці нечисленні: це поселення Л’Анс-о-Медоуз на Ньюфаундленді та окремі знахідки, які можуть вказувати на те, що скандинави часом запливали далі на південь. Мурованого міста на Пенобскоті, заснованого нащадками скандинавських переселенців, ніколи не існувало."
  seven_cities_norumbega.10.title: "Піший мандрівник"
  seven_cities_norumbega.10.desc: "Він терпляче чекає на пристані, доки на борт вантажать останні діжки з водою: босий, засмаглий на сонці, одягнений у дрантя, якого не пошкодували моряки з трьох різних портів. [target_character.GetName] розповідає свою історію так, ніби робив це вже не раз. Кілька років тому його викинуло на далекий берег біля західного океану. Понад рік він ішов узбережжям, доки рибалки не підібрали його біля північного мису. Десь дорогою він побував у Норумбезі й тепер розповідає про кришталеві та срібні колони і про вельможних панів, яких носять у паланкінах, оздоблених перлами. Лоцмани просять його показати це місце на мапі, а він відповідає, що немає ще такої мапи, яка казала б правду."
  seven_cities_norumbega.10.a: "Візьмемо його на борт і попливемо туди, де він ходив."
  seven_cities_norumbega.10.b: "Запишемо його розповідь і залишимо на пристані."
  norumbega_walker_signs_aboard_tt: "[target_character.GetName] наймається до команди як провідник"
  seven_cities_norumbega.10.historical_info: "У 1568 році після битви біля Сан-Хуан-де-Улуа англійський моряк Джон Гокінс висадив на берег коло Тампіко сотню людей зі своєї команди, серед них і матроса Девіда Інгрема. До такого відчайдушного кроку його змусив брак харчів. Через одинадцять місяців французький корабель підібрав Інгрема біля берегів Нової Шотландії. Якщо вірити його оповіді, за цей час моряк подолав близько трьох тисяч кілометрів місцевими торговими шляхами. До 1582 року, коли Інгрема розпитували наближені сера Френсіса Волсінгема, його історія вже встигла обрости подробицями про Норумбегу: там буцімто стояли срібні й кришталеві колони, а правителів носили в кріслах, прикрашених рубінами. У 1589 році розповідь матроса опублікував автор Річард Гаклюйт; утім, уже в наступному виданні її довелося вилучити як надто неправдоподібну. Сама подорож цілком могла відбутися насправді, але Норумбега, схоже, з’явилася вже в переказах: вельможі ставили бідному морякові запитання й поволі схиляли його до відповідей, які самі бажали почути."
  seven_cities_norumbega.11.title: "Космографія штурмана"
  seven_cities_norumbega.11.desc: "Ось уже цілий місяць штурман після вечірньої вахти дедалі частіше засиджується в себе в каюті: він перечитує стару космографію, переписану стільки разів, що обриси берегів на мапах давно розпливлися; і все ж він твердо певен, що в книзі записана правда. Якщо вірити їй, за одним із мисів на узбережжі, куди ми тримаємо курс, тече величезна річка, а за річкою — обнесене мурами місто, де живуть учені люди й лунає мова, що так нагадує церковну #TOOLTIP:LANGUAGE,latin_language,X #L латину#!#!. Корабельний священник завів розповідь про загублену #TOOLTIP:RELIGIONGROUP,christian,X #L християнську#!#! країну, що лежить на захід звідси; натомість тлумач лише зауважує, що автор, певно, і сам не знає латини — він лише почув кілька перекручених слів від когось, хто й сам не розмовляє цією мовою. Так і з’явилася ця книга."
  seven_cities_norumbega.11.a: "Позначимо річку там, де вона протікає за твердженням автора."
  seven_cities_norumbega.11.b: "Сховаємо книгу якомога далі. Лаг і лот — наші провідники."
  seven_cities_norumbega.11.b.tt: "#italic Космографія вирушає назад до скрині. Корабель іде за розрахунками штурмана#!"
  seven_cities_norumbega.11.historical_info: "Жан Альфонс, штурман виправи Роберваля до Канади в 1542 році, писав у своїй #italic Cosmographie#!, що піднявся великою річкою аж до Норумбеги. Там, за його словами, височіло місто, де жили освічені люди, що розмовляли схожою на латину мовою. До його оповіді потрапила й назва, яку Верраццано дав цьому узбережжю в 1524 році, а далі до справи взялися картографи. На мапі Меркатора 1569 року Норумбега вже зображена як місто з вежами на березі широкої річки. Майже сто років картографи просто переносили її з однієї мапи на іншу. Проте насправді Норумбеги не існувало — вона завжди була винятково витвором уяви."
  seven_cities_norumbega.12.title: "Дим над річкою"
  seven_cities_norumbega.12.desc: "Стоянка залишилася позаду, і попереду розкинулася широка темна річка, затиснута між лісистими берегами. Ми ще не встигли згорнути вітрила, а назустріч уже вийшли каное: місцеві жителі прибули торгуватися. Тлумачеві наказують спитати, де лежить місто-фортеця. Місцеві показують угору річкою, на своє поселення, де біля рибної загати туляться вкриті корою оселі, а в холодне повітря повільно тягнеться пічний дим. Питання ставлять знову, цього разу додаючи до нього дарунки. Потім повторюють ще раз — і пропонують кращі дари. Відповідь не змінюється. [target_leader.GetName] наказує прибрати крам і довго мовчить."
  seven_cities_norumbega.12.desc_walker: "Піший мандрівник майже не відходить від облавка відтоді, як ми рушили річкою. Тепер команда стежить за ним пильніше, ніж за берегами. Зрештою його приводять до старшин. Він довго вдивляється в берег, а потім каже, що місто далі. Місто завжди виявляється далі — за цим поселенням, за цими краями, де ще не ступала нога людини… Мандрівникові вірять. Довіра нічого не коштує, а визнати, що міста немає, — означає визнати, що весь похід був марним."
  seven_cities_norumbega.12.a: "Ні, мапи не перевернуті. Вгору річкою!"
  seven_cities_norumbega.12.b: "Нанесемо річку на мапу так, як вона тече насправді."
  seven_cities_norumbega.12.c: "Ми переживали халепи й гірші за цю. Вперед."
  seven_cities_norumbega.12.historical_info: "Коли європейці всерйоз узялися до дослідження Пенобскота, легенда про Норумбегу розсипалася на порох. У 1604 році Самюель де Шамплен навмисно піднявся річкою, щоб перевірити правдивість міфу. Він побачив лише селища абенаків і не знайшов жодних слідів міста — ані обнесеного мурами, ані взагалі будь-якого. Шамплен сухо зауважив, що нічого з описаних йому див так і не виявив. Проте ще два покоління назва «Норумбега» залишалася на мапах. Розташування легендарного міста повсякчас змінювалося, поки врешті-решт воно не зникло з мап остаточно. Мало які легенди зникали так швидко після однієї-єдиної виправи."
  seven_cities_norumbega.13.title: "Острів Демонів"
  seven_cities_norumbega.13.desc: "Острів виринає з туману саме там, де на мапах стоїть пересторога. Вітер, що гуляє островом, здіймає такий звук, що моряки бояться бодай слово зронити. З носа лунає вигук — дозорець знову щось угледів. Підзорна труба мовчки переходить з рук у руки. Біля підніжжя скель на березі, там, куди не сягає вітер, горить багаття — хтось час від часу підкидає в нього винесену прибоєм деревину. Придивившись, ми помічаємо, що поруч стоїть людина в лахмітті (колись її одяг був цілком добротним) і щосили махає нам головнею, що палає. Боцман зауважує, що демонам дрова зазвичай ні до чого."
  seven_cities_norumbega.13.a: "Спустімо шлюпку. Цю людину треба врятувати."
  seven_cities_norumbega.13.b: "Не змінюймо курсу: це може бути піратська принада."
  seven_cities_norumbega.13.b.tt: "#italic Острів залишається за кормою. Багаття остаточно зникає в тумані#!"
  norumbega_survivor_joins_tt: "[target_character.GetName] залишає острів і приєднується до нашого двору"
  seven_cities_norumbega.13.historical_info: "У 1542 році шляхтич і колонізатор Роберваль очолив виправу до Канади; тоді його штурманом служив Жан Альфонс. Під час плавання з’ясувалося, що юна родичка Роберваля — Маргарита де Ла Рок завела роман з одним із чоловіків на кораблі. Для покари Роберваль висадив її на Острові Демонів біля берегів Ньюфаундленду разом із її коханим і служницею. Усі троє опинилися у скрутному становищі: коханець Маргарити, служниця і народжена на острові дитина невдовзі померли. Маргарита ж провела там на самоті понад два роки, полюючи на ведмедів із аркебуз, що в неї залишилися. Зрештою її врятували баскські рибалки. Повернувшись до Франції, Маргарита розповіла про пережите королеві Наварри. Та описала цю історію у своїй книзі, завдяки чому ми сьогодні знаємо про те, що сталося. Сам острів відтоді загубився, і сьогодні ніхто не знає напевне, який саме острів біля берегів Ньюфаундленду називали Островом Демонів."