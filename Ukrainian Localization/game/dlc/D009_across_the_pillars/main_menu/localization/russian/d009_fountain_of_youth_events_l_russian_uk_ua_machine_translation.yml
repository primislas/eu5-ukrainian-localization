l_russian:
  d009_fountain_of_youth_events.1.title: "Цілюще джерело"
  d009_fountain_of_youth_events.1.desc: "Провідники звертають нас зі стежки до джерела, чиї холодні прозорі струмені б’ють із-під землі в затінку пальм, і навідріз відмовляються йти далі, доки ми не вип’ємо цієї води. Стара, що супроводжує нас, жестами показує, як згорблена спина випростується, а сиве волосся знову темніє. Один із наших вояків — списник, який від самого прибуття на узбережжя страждав від пропасниці й ледве міг ходити, — опускається на коліна та п’є з джерела. Надвечір він клянеться, що біль у ногах минув. Хірург лише бурчить, що людина, яка відчайдушно прагне одужати, відчує полегшення на день чи два незалежно від того, що п’є. Проте вода тут і справді смачна, а сама легенда давніша за будь-кого з нас. Ми перетинали океани, повіривши куди менш переконливим обіцянкам."
  d009_fountain_of_youth_events.1.a: "Поповнимо запаси води й винагородимо провідників, які вказали на це місце."
  d009_fountain_of_youth_events.1.b: "Калюжа — вона і в Африці калюжа. Не будемо тут зупинятися."
  d009_fountain_of_youth_events.1.b.tt: "#italic Ми йдемо геть, не скуштувавши води з джерела, і продовжуємо шлях із порожніми бурдюками#!"
  the_spring_runs_potent: "#Y Вода в джерелі виявляється доброю, і ми вирішуємо поповнити наші запаси#!"
  the_spring_is_ordinary: "#Y Вода приємна на смак, але не більше того#!"
  the_waters_may_restore_vigor_tt: "Можливо, вода, яку ми принесемо додому, поверне нашим старим колишню силу"
  d009_fountain_of_youth_events.2.title: "Ціна знань"
  d009_fountain_of_youth_events.2.desc: "Із села приходить цілитель — старець, увішаний черепашками та кістками, якого місцеві жителі явно шанують і побоюються. Через перекладача ми дізнаємося, що йому добре відомі землі, які нас цікавлять: до яких джерел несуть недужих і які місця вважають священними. Проте такими знаннями з озброєними чужинцями зопалу не діляться. Вони мають ціну, але вимірюється вона не золотом. Нам належить виявити повагу — або переконливо це вдати, — належно піднести дари й бездоганно дотриматися прадавніх звичаїв. Наш капелан обурений цим язичницьким обрядом, а квартирмейстер вважає, що тямущий провідник важливіший за душевний спокій капелана."
  d009_fountain_of_youth_events.2.a: "Поставимося до їхніх звичаїв із повагою та заслужимо довіру цілителя."
  d009_fountain_of_youth_events.2.b: "Запропонуємо щедру винагороду за провідника."
  d009_fountain_of_youth_events.2.c: "Самі заберемо провідника без зайвих церемоній."
  the_healer_will_accompany_us_tt: "Цілитель супроводжуватиме нас під час [Concept('expedition', 'виправи')|e], а після повернення приєднається до нашого двору"
  coerced_guide_breeds_resentment_tt: "Наше [Concept('cultural_opinion', 'ставлення')|e] до #L [target_location.GetDominantCulture.GetName|l]ої#! культури погіршиться"
  d009_fountain_of_youth_events.3.title: "Поширення пропасниці"
  d009_fountain_of_youth_events.3.desc: "Спершу ми звертаємо увагу на двох чоловіків, які тремтять від остуди коло вогнища в полуденну спеку. На третій ранок недужих уже налічується дюжина: усі з пожовклими склерами та в маренні. Переходячи болота вбрід, ми, вочевидь, підхопили незнану, небезпечну для нас, європейців, пошесть. Хірург береться до чаш для кровопускання, ланцетів і дедалі менших запасів ліків; у тубільців свої засоби: гіркі відвари та припарки з листя, яких не визнав би жоден лікар у Севільї. Обидві сторони з недовірою ставляться до способів лікування одна одної, тимчасом як пропасниці, схоже, байдуже, чим саме з нею намагаються боротися."
  d009_fountain_of_youth_events.3.a: "Покличемо лікарів із корабля, навіть якщо це нам дорого обійдеться."
  d009_fountain_of_youth_events.3.b: "Довіримося місцевим цілителям та їхнім способам лікування."
  d009_fountain_of_youth_events.3.c: "Продовжимо шлях — рано чи пізно хвороба мине сама."
  the_fever_passes: "#Y Хвороба відступає, і люди повертаються до строю#!"
  the_fever_claims_our_progress: "#Y Пропасниця не вщухає, і ми втрачаємо здобуті важкою працею успіхи#!"
  the_remedies_take_hold: "#Y Гіркі відвари діють, і наші люди починають довіряти знахарям#!"
  the_remedies_fail: "#Y Лікування не допомагає, і зрештою пропасниця сама сходить нанівець#!"
  d009_fountain_of_youth_events.4.title: "Остання надія"
  d009_fountain_of_youth_events.4.desc: "[target_leader.GetName] уже не [Select_CString(target_leader.IsFemale, 'молода', 'молодий')], і з кожним роком це відчувається дедалі сильніше. [Select_CString(target_leader.IsFemale, 'Вона', 'Він')] із небаченим досі завзяттям вивчає мапи, засиджуючись над ними допізна, а коли загін сповільнює крок, у [Select_CString(target_leader.IsFemale, 'її', 'його')] погляді проступає нетерпіння. Подейкують, що очільник шукає ці води не так заради корони та вітчизни, як заради власного відображення у дзеркалі. Завойовник, який підкорив усе, крім самого часу, вирушає в болота по здобич, якої не здолає жоден меч, — ця історія стара як світ. Але хай що чекає наприкінці — слава чи передчасна смерть — ця спрага вже не дасть зупинитися."
  d009_fountain_of_youth_events.4.a: "Підкорімося цьому пориву."
  d009_fountain_of_youth_events.4.b: "Закличемо набратися терпіння: надмірна наполегливість може зломити людей."
  d009_fountain_of_youth_events.5.title: "Острови Біміні"
  d009_fountain_of_youth_events.5.desc: "Останнім часом серед моряків тільки й балачок, що про Біміні — острів неподалік, де нібито б’є джерело, здатне повернути старим відібрані морем роки. Про нього всі чули, але ніхто його не бачив. На мапі зображено розсип невисоких зелених островів за кілька днів ходу: джерело може виявитися на будь-якому з них — а може й не знайтися зовсім. Звернути зі шляху — означає заважити тижневим запасом харчів, повіривши в рибальську байку… Втім, якщо подумати, заради цього ми вже перетнули цілий океан."
  d009_fountain_of_youth_events.5.a: "Вирушимо на пошуки острова, про який усі говорять."
  d009_fountain_of_youth_events.5.b: "Продовжимо тримати курс на материк. Ці острови не варті того, щоб важити заради них життям."
  d009_fountain_of_youth_events.5.b.tt: "#italic Ми продовжуємо плисти до материка, не намагаючись розкрити таємницю островів Біміні#!"
  the_island_rewards_the_crossing: "#Y Острів винагороджує мандрівників, які дісталися його, прісною водою та точнішими орієнтирами#!"
  the_island_is_barren: "#Y Острів виявляється безплідною піщаною косою, через яку ми марнуємо дорогоцінний час#!"
  d009_fountain_of_youth_events.fountain_desc: "У 1513 році Хуан Понсе де Леон, конкістадор і перший намісник Пуерто-Рико, вирушив на північ. Землю, де було вирішено висадитися, він назвав Флоридою на честь Великодня, що святкувався в той самий час. Він наніс на мапу півострів і потужну течію Гольфстрим, вступав у сутички з племенем калуса та торгував із народом тимукуа, проте чудодійного джерела не знайшов і, судячи з його власних нотаток, навіть не шукав. Слава шукача води, що повертає молодість, закріпилася за ним уже після його смерті — зі слів хроністів Гонсало Фернандеса де Ов’єдо, Антоніо де Еррери-і-Тордесільяса, а також бранця Ернандо де Ескаланте Фонтанеди, який ущипливо зазначав, що пошуки заповітного джерела згубили багатьох. Чутки про цілюще джерело на острові Біміні справді ширилися серед моряків і місцевих жителів, однак жартівлива легенда про нього й одного намісника, що старіє, з’явилася значно пізніше. Понсе де Леон повернувся до Флориди в 1521 році, щоби заснувати колонію, отримав від тубільця з племені калуса стрілу в стегно й помер від поранення в Гавані, так і не здобувши ні молодости, ні спокою."