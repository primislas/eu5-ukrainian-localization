l_russian:
  d009_iberian_order_events.1.title: "Магістерство [target_order.GetNameWithNoTooltip]"
  d009_iberian_order_events.1.entry: "Магістерство Сантьяго"
  d009_iberian_order_events.1.desc: "Магістр [target_order.GetName] помер, і браття зібралися на капітулу, щоб назвати його наступника.\n\nЖоден інший орден [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! не є багатшим чи небезпечнішим. Його комтурства простягаються від Тахо до меж #TOOLTIP:AREA,andalusia_area,X #L Андалусії#!#!, його списи підкоряються лише магістрові, який не мусить коритися нікому, крім Папи, і той, кого обере капітула, триматиме у своїх руках більшу частку нашого південного порубіжжя, ніж в[ROOT.GetCountry.Custom('nobles_essyasesi')] наш[ROOT.GetCountry.Custom('nobles_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] разом взят[ROOT.GetCountry.Custom('nobles_yiaei')].\n\n[target_ruler.GetName] не [Select_CString(target_ruler.IsFemale, 'стала чекати на запрошення', 'став чекати на запрошення')]. [target_ruler.GetSheHe|U] вже [Select_CString(target_ruler.IsFemale, 'виїхала', 'виїхав')] до будинку капітули з охороною за спиною та своїм кандидатом на думці."
  d009_iberian_order_events.1.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] признач[ROOT.GetCountry.Custom('crown_ytat')] магістра."
  d009_iberian_order_events.1.a.entry: "$crown_estate$ призначить магістра."
  d009_iberian_order_events.1.b: "Нехай браття [target_order.GetNameWithNoTooltip] оберуть свого."
  d009_iberian_order_events.1.b.entry: "Нехай браття оберуть свого."
  d009_iberian_order_events.1.c: "Нехай справу вирішує Папа."
  d009_iberian_order_events.2.title: "Скарби Уклеса"
  d009_iberian_order_events.2.entry: "$d009_iberian_order_events.2.title$"
  d009_iberian_order_events.2.desc: "[ShowLocationName('ucles')] — це столиця та скарбниця [target_order.GetName]. Два століття данини з порубіжжя, заповітів лицарів перед смертю та прибутків зі ста комтурств зберігаються за його мурами у вигляді начиння, монет і релікваріїв.\n\nНаша власна скарбниця куди скромніша. Жоден закон не дозволяє нам відчинити ці двері, адже багатство ордену належить #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L Католицькій церкві#!#!, і браття голосно про це заявлять. Але між нашим указом і скарбницею теж немає жодного війська."
  d009_iberian_order_events.2.a: "Орден оплатить наші війни."
  d009_iberian_order_events.2.b: "Залишити все як є та підтримати обитель в Уклесі."
  d009_iberian_order_events.2.c: "Вирядити перевіряльників і забрати частку #TOOLTIP:ESTATE_TYPE,crown_estate,X #L корони#!#!."
  d009_iberian_order_events.2.c.entry: "Вирядити перевіряльників і забрати частку $crown_estate$."
  d009_iberian_order_events.3.title: "Шлях до Сантьяго-де-Компостели"
  d009_iberian_order_events.3.entry: "$d009_iberian_order_events.3.title$"
  d009_iberian_order_events.3.desc: "Рік у рік їх усе більше приходить із #TOOLTIP:AREA,flanders_area,X #L Фландрії#!#! та з-за самих Піренеїв; вони прямують на захід через [ROOT.GetCountry.Custom('rank_ua_ACC')] до святині апостола. Вони несуть із собою срібло на дорожні потреби, і за це срібло їх грабують.\n\n[target_order.GetName] було засновано саме для того, щоб охороняти цей шлях. Його браття утримують притулки для прочан і мости, а магістр нагадує нам, варто лише прислухатися, що охорона шляху коштує дорожче, ніж приносить сам шлях."
  d009_iberian_order_events.3.a: "Платити браттям за охорону шляху."
  d009_iberian_order_events.3.b: "Нехай краще беруть плату з прочан."
  d009_iberian_order_events.3.c: "Передати їм притулок для прочан у Леоні."
  d009_iberian_order_events.11.title: "Питання Сіто"
  d009_iberian_order_events.11.entry: "$d009_iberian_order_events.11.title$"
  d009_iberian_order_events.11.desc: "[target_order.GetName] — це цистерціанська обитель, яка носить списи. Її устав походить із Сіто в #TOOLTIP:AREA,burgundy_area,X #L Бургундії#!#!, її абати приїжджають із півдня з перевірками, а браття приймають дисципліну від ченців, які зроду не бачили мавра.\n\nНастав час нової візитації, і цього разу магістр запитав, чи повинен він її приймати. Чужоземні абати, які повчають людей, що боронять наш рубіж, — це або джерело славетної дисципліни ордену, або образа нашої #TOOLTIP:ESTATE_TYPE,crown_estate,X #L корони#!#!, дивлячись кого запитати."
  d009_iberian_order_events.11.a: "Нехай абати Сіто збережуть право візитації."
  d009_iberian_order_events.11.b: "Орден відповідає перед нами, а не перед Бургундією."
  d009_iberian_order_events.11.c: "Нехай правники сперечаються про це ще кілька років."
  d009_iberian_order_events.12.title: "Магістерство [target_order.GetNameWithNoTooltip]"
  d009_iberian_order_events.12.entry: "Магістерство Калатрави"
  d009_iberian_order_events.12.desc: "Посада магістра [target_order.GetName] спорожніла, і капітул уже розколовся. В однієї сторони є свій кандидат, в іншої — суперник, і обидві тримають озброєних слуг за день ходи від замка.\n\n[target_ruler.GetName] пам’ятає, у що обійшлися останні суперечливі вибори [ROOT.GetCountry.Custom('rank_ua_DAT')]. Магістр [target_order.GetNameWithNoTooltip] розпоряджається замками всієї центральної марки; магістр, нічим нам не зобов’язаний, використає їх проти нас так само легко, як і на нашу користь."
  d009_iberian_order_events.12.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] признач[ROOT.GetCountry.Custom('crown_eut')] магістра."
  d009_iberian_order_events.12.a.entry: "$crown_estate$ призначить магістра."
  d009_iberian_order_events.12.b: "Нехай браття [target_order.GetNameWithNoTooltip] оберуть свого."
  d009_iberian_order_events.12.b.entry: "Нехай браття оберуть свого."
  d009_iberian_order_events.12.c: "Нехай Сіто розсудить табори."
  d009_iberian_order_events.13.title: "Поле під Альмагро"
  d009_iberian_order_events.13.entry: "$d009_iberian_order_events.13.title$"
  d009_iberian_order_events.13.desc: "Альмагро — найбагатша комтурія [target_order.GetName], розташована на самісінькому роздоріжжі Ла-Манчі. Доки наша [ROOT.GetCountry.Custom('end_fem')] воює, той, хто тримає Альмагро, тримає хліб, запасних коней і переправу.\n\nТамтешній командор нікому не заявляв про свою відданість. Він чекає, доки його запитають, а питаємо його не ми одні."
  d009_iberian_order_events.13.a: "Альмагро виступить на боці #TOOLTIP:ESTATE_TYPE,crown_estate,X #L корони#!#!."
  d009_iberian_order_events.13.a.entry: "Альмагро виступить на боці $crown_estate$."
  d009_iberian_order_events.13.b: "Нехай комтурія чинить за власним сумлінням."
  d009_iberian_order_events.13.c: "Жодній зі сторін не дозволять скористатися Альмагро."
  d009_iberian_order_events.21.title: "Рубіж біля [ShowLocationNameWithNoTooltip('alcantara')]"
  d009_iberian_order_events.21.entry: "$d009_iberian_order_events.21.title$"
  d009_iberian_order_events.21.desc: "Міст біля #TOOLTIP:LOCATION,alcantara,X #L Алькантари#!#! — римський, і саме тому [target_order.GetName] стоїть там, де стоїть. Доки [GetCountry('POR').GetName] зі зброєю виступа[GetCountry('POR').Custom('end_yeyut')] проти нас, цей міст — найкоротший шлях до нашого [ROOT.GetCountry.Custom('rank_ua_GEN')] і найкоротша дорога до їхніх володінь.\n\nМагістр пише, що може втримати переправу, спалити далекий берег або укласти місцевий мир із [GetCountry('POR').GetAdjectiveWithNoTooltip]ми командорами, яких знає вже двадцять років. Він чекає вказівок, що саме обрати."
  d009_iberian_order_events.21.a: "Утримати міст, хоч би чого це коштувало."
  d009_iberian_order_events.21.b: "Нехай роблять набіги через Тахо й залишають собі здобич."
  d009_iberian_order_events.21.c: "Нехай він купить перемир’я на кордоні."
  d009_iberian_order_events.22.title: "Останній магістр [target_order.GetNameWithNoTooltip]"
  d009_iberian_order_events.22.entry: "Останній магістр Алькантари"
  d009_iberian_order_events.22.desc: "Магістр [target_order.GetName] — старий чоловік, радше вчений, ніж воїн, і останній у своєму роді, хто дістав сан через вільне обрання браттями.\n\n[target_ruler.GetName] не криється з тим, що станеться по його смерті. Питання лише в тому, чи [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] дочека[ROOT.GetCountry.Custom('crown_etsautsa')] цього, чи дідусеві варто запропонувати відійти вбік уже зараз, доки йому стане гідности зробити це зі шляхетністю."
  d009_iberian_order_events.22.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] признач[ROOT.GetCountry.Custom('crown_eut')] наступника вже зараз."
  d009_iberian_order_events.22.a.entry: "The $crown_estate$ will now name his successor."
  d009_iberian_order_events.22.b: "Нехай зберігає сан магістра до самої смерти."
  d009_iberian_order_events.22.c: "Нехай із пошаною піде на спочинок до своєї книгозбірні."
  d009_iberian_order_events.23.title: "Скарбниця в [ShowLocationNameWithNoTooltip('brozas')]"
  d009_iberian_order_events.23.entry: "$d009_iberian_order_events.23.title$"
  d009_iberian_order_events.23.desc: "Скарбницю в #TOOLTIP:LOCATION,brozas,X #L Бросасі#!#! відімкнено, і разом із нею зникла річна рента з половини володінь ордену [target_order.GetName]. Ані облоги, ані зламаних дверей — а це говорить братам про власний дім те, що їм найменше хотілося б знати.\n\nМагістр попросив нашої допомоги, і вже це саме по собі є визнанням: він не став би просити, якби міг знайти злодіїв сам."
  d009_iberian_order_events.23.a: "Послати людей корони на пошуки злодіїв."
  d009_iberian_order_events.23.a.entry: "Послати людей стану $crown_estate$ на пошуки злодіїв."
  d009_iberian_order_events.23.b: "Орден має сам відповідати за свої втрати."
  d009_iberian_order_events.31.title: "Каравели, які споряджає [order_administrator.GetNameWithNoTooltip]"
  d009_iberian_order_events.31.entry: "Каравели урядовця"
  d009_iberian_order_events.31.desc: "[order_administrator.GetName] завідує справами ордену [target_order.GetName], і [order_administrator.GetSheHe] [Select_CString(order_administrator.IsFemale, 'зрозуміла', 'зрозумів')], що це означає: ренти з усіх командорств [ROOT.GetCountry.Custom('rank_ua_GEN')] — і ні в кого немає права запитати в [Select_CString(order_administrator.IsFemale, 'неї', 'нього')], на що вони витрачаються.\n\n[order_administrator.GetSheHe|U] витрачає їх на кораблі. Рік у рік каравели вирушають на південь повз [ShowLocationName('cape_bojador')] і повертаються з піском, невільниками та оповідками, і рік у рік дохід ордену йде на спорудження нового корабля. Брати вже почали писати нам про це."
  d009_iberian_order_events.31.a: "Фінансувати плавання також зі скарбниці корони."
  d009_iberian_order_events.31.a.entry: "Фінансувати плавання також зі скарбниці стану $crown_estate$."
  d009_iberian_order_events.31.b: "Нехай [order_administrator.GetNameWithNoTooltip] отримає те, що орден може виділити."
  d009_iberian_order_events.31.b.entry: "Нехай урядовець отримає те, що орден може виділити."
  d009_iberian_order_events.31.c: "Доходи ордену призначені для порубіжжя, а не для океану."
  d009_iberian_order_events.32.title: "Тамплієрська спадщина"
  d009_iberian_order_events.32.entry: "$d009_iberian_order_events.32.title$"
  d009_iberian_order_events.32.desc: "[target_order.GetName] існує лише тому, що ми колись не дозволили землям Храму покинути #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_ACC')|L]#!#!, просто перейменувавши людей, які ними володіли. Це завжди було юридичною хитрістю, і [GetCountry('ARA').GetName] розшука[GetCountry('ARA').Custom('end_vlaloly')] законника, готового сказати про це вголос.\n\nЦі домагання стосуються старих тамплієрських командорств. Якщо їх задовольнити, орден позбудеться володінь, на яких його засновано; якщо ж заперечити, нам доведеться десятиліття сперечатися перед Курією."
  d009_iberian_order_events.32.a: "Відстоювати спадщину перед Курією."
  d009_iberian_order_events.32.b: "Викупити [GetCountry('ARA').GetAdjectiveWithNoTooltip]е домагання."
  d009_iberian_order_events.32.b.entry: "Викупити домагання $ARA_ADJ$."
  d009_iberian_order_events.33.title: "Хрест на вітрилах"
  d009_iberian_order_events.33.entry: "$d009_iberian_order_events.33.title$"
  d009_iberian_order_events.33.desc: "Кожна каравела, що вирушає на південь, несе на грот-вітрилі хрест ордену [target_order.GetName]. Орден сплатив за чималу їх частину і вже почав розпитувати, чим він володіє на іншому кінці шляху.\n\nКомандорство посеред океану — думка дивна. Колись такою ж дивною здавалася й думка про командорство на мавританському порубіжжі."
  d009_iberian_order_events.33.a: "Дарувати їм [ShowLocationNameWithNoTooltip('lagos')] і частку від плавань."
  d009_iberian_order_events.33.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] забира[ROOT.GetCountry.Custom('crown_yeyut')] свою частку від того, що вони фінансують."
  d009_iberian_order_events.33.b.entry: "$crown_estate$ забирає свою частку від того, що вони фінансують."
  d009_iberian_order_events.33.c: "Орден лишається осторонь морської справи."
  d009_iberian_order_events.41.title: "Магістр [target_order.Custom('CL_GEN')]"
  d009_iberian_order_events.41.entry: "Магістр Авіша"
  d009_iberian_order_events.41.desc: "Трон порожній, права #TOOLTIP:CULTURE,$castilian_tt$,X #L кастильців#!#! на нього міцні, а наш[ROOT.GetCountry.Custom('nobles_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] шука[ROOT.GetCountry.Custom('nobles_yeyut')] власного претендента, з яким можна було б змиритися.\n\nУсе частіше погляди звертаються до магістра [target_order.GetName]. У його жилах тече [ROOT.GetCountry.GetGovernment.GetAdjective|l]а кров, хоч і по інший бік простирадла, він склав обітницю безшлюбности, а під його проводом — єдиний [ROOT.GetCountry.Custom('preposition_uv')] [ROOT.GetCountry.Custom('rank_ua_PREP')|l] загін дисциплінованої кінноти, ще нікому не обіцяний. Браття ордену підуть за ним куди завгодно, хоч і на трон."
  d009_iberian_order_events.41.a: "Нехай [target_order.GetNameWithNoTooltip] виступить за свого магістра."
  d009_iberian_order_events.41.pretender_tt: "Магістр Авіша заявляє права на трон"
  d009_iberian_order_events.41.a.entry: "Посадити магістра ордену на трон."
  d009_iberian_order_events.41.b: "Права кастильців — законні."
  d009_iberian_order_events.41.c: "Ми не дозволимо ордену обирати наших правителів."
  d009_iberian_order_events.42.title: "Управитель для [target_order.Custom('CL_GEN')]"
  d009_iberian_order_events.42.entry: "Управитель для Авіша"
  d009_iberian_order_events.42.desc: "Посада магістра [target_order.GetName] знову звільнилася, і [ROOT.GetCountry.GetGovernment.GetCourtTitle] зауважив те, про що браття воліли б змовчати: закон не зобов’язує #TOOLTIP:ESTATE_TYPE,crown_estate,X #L корону#!#! чекати на їхні вибори.\n\n[Select_CString(target_ruler.IsFemale, 'Правителька', 'Правитель')] [target_ruler.GetName] має молодшого родича без спадку та без діла, а орден має вдосталь земель, щоб утримувати таку людину в належному достатку. Не вперше принц одягає рясу, яку зовсім не збирається носити з честю."
  d009_iberian_order_events.42.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] сам[ROOT.GetCountry.Custom('crown_aei')] признач[ROOT.GetCountry.Custom('crown_ytat')] управителя."
  d009_iberian_order_events.42.a.entry: "$crown_estate$ самостійно призначить управителя."
  d009_iberian_order_events.42.b: "Залишити браттям їхні вибори."
  d009_iberian_order_events.43.title: "Колегія в Еворі"
  d009_iberian_order_events.43.entry: "$d009_iberian_order_events.43.title$"
  d009_iberian_order_events.43.desc: "Нам запропоновано заснувати колегію в #TOOLTIP:LOCATION,evora,X #L Еворі#!#!, а кошти на її утримання має дати рента, якою володіє [target_order.GetName].\n\nОрден було засновано, щоб боронити кордон, якого більше не існує. Його командорства тепер — звичайні маєтки, а браття — землевласники. Колегія дала б ордену новий зміст існування — чи то щедра думка, чи то визнання того, що колишню мету вичерпано, сказати важко."
  d009_iberian_order_events.43.a: "Утримувати колегію спільно коштом корони та ордену."
  d009_iberian_order_events.43.a.entry: "Утримувати колегію спільно коштом $crown_estate$ та ордену."
  d009_iberian_order_events.43.b: "Нехай орден дасть те, що зможе виділити."
  d009_iberian_order_events.43.c: "[ShowLocationNameWithNoTooltip('evora')] зачекає."
  d009_iberian_order_events.51.title: "Землі тамплієрів"
  d009_iberian_order_events.51.entry: "$d009_iberian_order_events.51.title$"
  d009_iberian_order_events.51.desc: "Орден Храму скасовано, його браття розпорошені, а замки в Маестраті стоять пусткою — утримувати їх за законом тепер нікому. [target_order.GetName] був створений саме для того, щоб ці замки не вислизнули з [ROOT.GetCountry.Custom('rank_ua_GEN')].\n\n[GetCountry('KNI').GetName|U] написа[GetCountry('KNI').Custom('end_vlaloly')] нам, нагадуючи, що Собор передав маєтності тамплієрів їхньому ордену по всьому [ShowReligionAdjective('catholic')|l]ому світу. [GetCountry('KNI').GetNameWithNoTooltip|U] засіда[GetCountry('KNI').Custom('end_yeyut')] у столиці [GetCountry('KNI').GetCapital.GetNameWithNoTooltip]. А замки розташовані у #TOOLTIP:AREA,valencia_area,X #L Валенсії#!#!."
  d009_iberian_order_events.51.a: "[target_order.GetNameWithNoTooltip] забира[target_order.Custom('end_yeyut')] увесь спадок."
  d009_iberian_order_events.51.a.entry: "Монтеса забирає увесь спадок."
  d009_iberian_order_events.51.b: "Розділити його з [GetCountry('KNI').Custom('CL_INST')]."
  d009_iberian_order_events.51.b.entry: "Розділити його з $KNI$."
  d009_iberian_order_events.52.title: "Магістерство [target_order.Custom('CL_GEN')]"
  d009_iberian_order_events.52.entry: "Магістерство Монтеси"
  d009_iberian_order_events.52.desc: "[target_order.GetName] — останній військовий орден [ROOT.GetCountry.Custom('preposition_uv')] [ROOT.GetCountry.Custom('rank_ua_PREP')|l], який досі сам обирає собі магістра. Посада [ShowCultureName('castilian')|l]ого магістра перейшла під владу #TOOLTIP:ESTATE_TYPE,crown_estate,X #L корони#!#! ще кілька поколінь тому, а [target_order.GetNameWithNoTooltip] і далі живе так, ніби цього ніхто не помітив.\n\nАле правитель [target_ruler.GetName] це [Select_CString(target_ruler.IsFemale, 'помітила', 'помітив')]. Ми подали прохання про буллу, і вона буде надана; лишається лише питання — прийняти магістерський сан зараз чи дозволити братам провести ще одні вибори."
  d009_iberian_order_events.52.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] сам[ROOT.GetCountry.Custom('crown_aei')] признач[ROOT.GetCountry.Custom('crown_ytyat')] магістра."
  d009_iberian_order_events.52.a.entry: "$crown_estate$ особисто призначить магістра."
  d009_iberian_order_events.52.b: "Дозволити братам провести ще одні вибори."
  d009_iberian_order_events.53.title: "Берберійський берег"
  d009_iberian_order_events.53.entry: "$d009_iberian_order_events.53.title$"
  d009_iberian_order_events.53.desc: "Галери приходять улітку, забирають рибалок із пляжів між #TOOLTIP:LOCATION,peniscola,X #L Пенісколою#!#! та #TOOLTIP:LOCATION,valencia,X #L Валенсією#!#! і зникають раніше, ніж проти них устигнуть щось вислати. Це узбережжя тримає у своїх руках [target_order.GetName], і поселення вже почали надсилати прохання ордену, а не нам — що саме по собі є застереженням.\n\nМагістр хоче веж: цілу низку, із залогою на все літо, оплачену кимось іншим."
  d009_iberian_order_events.53.a: "Звести вежі та оплатити дозір."
  d009_iberian_order_events.53.b: "Нехай дають собі раду тим, що в них є."
  d009_iberian_order_events.53.c: "Узбережжя має саме про себе подбати."
  d009_iberian_order_events.61.title: "Ордени та [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]"
  d009_iberian_order_events.61.entry: "Ордени та $crown_estate$"
  d009_iberian_order_events.61.desc: "Військових орденів #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! ніхто й ніколи офіційно не питав про те, задля чого вони існують.\n\nВони володіють замками, збирають ренти, підпорядковуються магістрам, які підпорядковуються Папі, і ось уже двісті років ніхто не розбирався, у яких стосунках вони перебувають із #TOOLTIP:ESTATE_TYPE,crown_estate,X #L короною#!#!. [target_ruler.GetName] — правитель не того штибу, що [target_ruler.GetHerHis] попередники, і вже [Select_CString(target_ruler.IsFemale, 'звеліла', 'звелів')] викласти всі рахунки на стіл."
  d009_iberian_order_events.61.desc_council: "[ShowBureaucracyTypeName('spa_council_of_military_orders_bureaucracy')] засідає вже досить довго, і його писарі уклали те, чого не було за жодного попереднього правління: повний звіт про володіння орденів.\n\nЧитати його неприємно. Магістри — наші ставленики, а замками правлять від нашого імені, але ренти, як і раніше, йдуть туди, куди йшли завжди, і брати й далі вважають #TOOLTIP:ESTATE_TYPE,crown_estate,X #L корону#!#! радше покровителем, ніж володарем. Керування, як з’ясовується, ще не означає покори."
  d009_iberian_order_events.61.a: "Підтвердити за ними всі їхні володіння."
  d009_iberian_order_events.61.b: "Їхні ренти відтепер послужать насамперед [ROOT.GetCountry.Custom('rank_ua_DAT')|l]."
  d009_iberian_order_events.61.b.entry: "Їхні доходи насамперед послужать країні."
  d009_iberian_order_events.63.title: "Керування орденами"
  d009_iberian_order_events.63.entry: "$d009_iberian_order_events.63.title$"
  d009_iberian_order_events.63.desc: "Усе робилося поволі, по одному магістерству за раз, кожне зі своєю буллою та своїми причинами, і лише тепер канцелярія зіставила їх усі й побачила, що вийшло насправді.\n\nВеликі ордени [ROOT.GetCountry.Custom('rank_ua_GEN')|l] володіють фортецями порубіжжя, прибутками сотні командорств і найкращою важкою кіннотою в усьому [ShowReligionAdjective('catholic')|l]ому світі, та підпорядковуються людям, яких [Select_CString(target_ruler.IsFemale, 'призначила', 'призначив')] [target_ruler.GetName]. Ніколи раніше [ROOT.GetCountry.GetName] не трима[ROOT.GetCountry.Custom('end_vlaloly')] в одній руці стільки меча #TOOLTIP:INTERNATIONAL_ORGANIZATION,$catholic_church_tt$,X #L Католицької церкви#!#!.\n\nЛишається вирішити, чи це заведений лад, чи просто вкорінена звичка."
  d009_iberian_order_events.63.a: "Керувати ними через єдину раду."
  d009_iberian_order_events.63.b: "Залишити кожне магістерство в руках родини."
  d009_order_recent_service_tt: "Пам’ятає про це як про $zeal_recent_service$ упродовж 5 років, підвищуючи свою ціль щодо [Concept('zeal', 'ревности')|e]"
  d009_order_recent_pilgrimage_tt: "Пам’ятає про це як про $zeal_recent_pilgrimage$ упродовж 5 років, підвищуючи свою ціль щодо [Concept('zeal', 'ревности')|e]"
  d009_orders_recent_service_all_tt: "Кожен $iberian_military_order_type$ у нашій країні пам’ятає про це як про $zeal_recent_service$ упродовж 5 років, підвищуючи свою ціль щодо [Concept('zeal', 'ревности')|e]"