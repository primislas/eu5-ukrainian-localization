l_russian:
  gold_fleet_nueva_espana_events.1.title: "Курс на Нову Іспанію"
  gold_fleet_nueva_espana_events.1.desc_prefix: "Флот споряджено й готовий до відплиття. Початковою точкою стане [departure_port.GetName]. Кораблі забезпечені запасами води та харчів, а також металевими знаряддями й ртуттю, якими колонії не можуть забезпечити себе власноруч. [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|U] да[ROOT.GetCountry.Custom('crown_yeyut')] настанови. Стежити за виконанням наказів буде [target_leader.GetName].\n\nШлях попереду неблизький: ми пропливемо повз Канарські острови через Карибське море до берегів Нової Іспанії"
  gold_fleet_nueva_espana_events.1.desc_suffix: "вже чекають на завантаження в наші трюми. Якщо ми прагнемо безпечно доправити багатства додому, флот має вийти в море негайно."
  gold_fleet_nueva_espana_events.1.desc: "$gold_fleet_nueva_espana_events.1.desc_prefix$, де #TOOLTIP:GOODS,silver,X #L срібло#!#! та #TOOLTIP:GOODS,dyes,X #L барвники#!#! $gold_fleet_nueva_espana_events.1.desc_suffix$"
  gold_fleet_nueva_espana_events.1.desc.rich: "$gold_fleet_nueva_espana_events.1.desc_prefix$. #TOOLTIP:GOODS,silver,X #L Срібло#!#! з копалень у місцевості [silver_source.GetName] та #TOOLTIP:GOODS,dyes,X #L барвники#!#! з місцевості [dye_source.GetName] $gold_fleet_nueva_espana_events.1.desc_suffix$"
  gold_fleet_nueva_espana_events.1.a: "Відчалюємо. Флот має відплисти з ранковим відпливом."
  gold_fleet_nueva_espana_events.1.historical_info: "#italic Флот Нової Іспанії#! був одним із двох супроводів іспанського #italic Срібного флоту#!. Його кораблі забезпечували торгівлю з віцекоролівством Нова Іспанія, перевозячи срібло з рудників Сакатекаса, Гуанахуато та інших мексиканських родовищ, а також кошеніль із Оахаки, індиго, ваніль та какао. Завантаження відбувалося в порту Сан-Хуан-де-Улуа поблизу Веракруса. Зазвичай караван залишав Іспанію навесні й повертався восени, з’єднуючись у Гавані з галеонами Тьєрра-Фірме для спільного переходу через Атлантику. Його шлях пролягав через протоку Мона між Еспаньйолою та Пуерто-Рико — звичним шляхом до східної частини Карибського моря."
  gold_fleet_nueva_espana_events.2.title: "Багатство Нової Іспанії"
  gold_fleet_nueva_espana_events.2.desc_prefix: "Нас зустрічає [loot_port.GetName]. Працівники місцевих митних палат уже кілька тижнів працюють не покладаючи рук. Валка мулів везе #TOOLTIP:GOODS,silver,X #L срібло#!#! із"
  gold_fleet_nueva_espana_events.2.desc_middle: ", а також тюки з #TOOLTIP:GOODS,dyes,X #L барвниками#!#!"
  gold_fleet_nueva_espana_events.2.desc_suffix: ", за які [departure_port.GetName] платить як за срібло.\n\nОстанні частини коштовного металу все ще в дорозі. Ми можемо дочекатися всієї валки й заповнити кожен трюм ущент, або забрати вже наявне й відплисти, поки пора буревіїв не відрізала узбережжя від моря."
  gold_fleet_nueva_espana_events.2.desc: "$gold_fleet_nueva_espana_events.2.desc_prefix$ копалень, розташованих у глибині материка$gold_fleet_nueva_espana_events.2.desc_middle$ $gold_fleet_nueva_espana_events.2.desc_suffix$"
  gold_fleet_nueva_espana_events.2.desc.rich: "$gold_fleet_nueva_espana_events.2.desc_prefix$ місцевості під назвою [silver_source.GetName]$gold_fleet_nueva_espana_events.2.desc_middle$ з регіону [dye_source.GetName]$gold_fleet_nueva_espana_events.2.desc_suffix$"
  gold_fleet_nueva_espana_events.2.a: "Дочекаємося всієї валки й заповнимо трюми сріблом та барвниками."
  gold_fleet_nueva_espana_events.2.b: "Вдовольнимося тим, що встигли доправити."
  gold_fleet_nueva_espana_events.2.c: "Зволікання може дорого нам обійтися. Відпливаємо з тим, що вже отримали."
  gold_fleet_nueva_espana_events.2.historical_info: "Веракрус, чию гавань захищала острівна фортеця Сан-Хуан-де-Улуа, був єдиним законним портом прибуття та відправлення кораблів, що давали змогу Новій Іспанії брати участь в атлантичній торгівлі. Місто стояло на малярійній піщаній косі й було беззахисним перед #italic нортес#! — лютими північними штормами, через що час завантаження становив особливу небезпеку. Мексиканське срібло добувалося переважно у великих гірничих осередках Сакатекаса (де родовища відкрили в 1546 році) та Гуанахуато. Потім його доправляли до узбережжя валками мулів і вантажили на кораблі під озброєною охороною. Кошеніль — яскраво-червоний барвник, який добували з комах, вирощуваних на кактусах в Оахаці, — була одним із найкоштовніших товарів Нового Світу після срібла. Іспанія пильно берегла монополію на її виробництво, а сам барвник докорінно змінив суконні та ткацькі промисли Європи."
  gold_fleet_nueva_espana_events.3.title: "Зустріч у порту [rendezvous_port.GetNameWithNoTooltip]"
  gold_fleet_nueva_espana_events.3.desc.together: "Флот прибув у порт [rendezvous_port.GetName], де під захистом фортечних гармат стоять на якорі галеони Тьєрра-Фірме. Їхні трюми так само повні #TOOLTIP:GOODS,silver,X #L срібла#!#!, як і наші. Звідси обидва флоти рушать через Атлантику разом: спершу підуть на північ за Гольфстрімом, потім повернуть на схід повз береги Флориди.\n\nНам повідомили, що на шляху до Іспанії вже чигають ворожі кораблі. Втім, такий великий караван — непроста здобич навіть для найзухвалішого супротивника. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити, як об’єднаний флот відповідатиме на загрозу."
  gold_fleet_nueva_espana_events.3.desc.alone: "Флот прибув у порт [rendezvous_port.GetName] і став на якір під захистом фортечних гармат. Галеонів Тьєрра-Фірме, які могли б до нас приєднатися, тут немає, тож перетинати Атлантику доведеться наодинці: спочатку підемо на північ за Гольфстрімом, а далі на схід уздовж берегів Флориди.\n\nНам повідомили, що на шляху до Іспанії вже чигають ворожі кораблі, а самотній караван — ласа здобич. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити, як відповідати на загрозу."
  gold_fleet_nueva_espana_events.3.a: "Наймемо додаткові військові кораблі із залоги порту [rendezvous_port.GetNameWithNoTooltip]."
  gold_fleet_nueva_espana_events.3.b: "Покладемося не на гармати, а на швидкість. Відпливаємо на світанку."
  gold_fleet_nueva_espana_events.3.c: "Не ризикуймо. Перезимуємо тут, а в путь вирушимо наступного сезону."
  gold_fleet_nueva_espana_events.3.historical_info: "Після того як Філіп II у 1566 році узаконив систему караванів, Гавана стала обов'язковим місцем збору флотів, що поверталися зі скарбами. Глибока природна гавань і вигідне розташування біля Флоридської протоки зробили місто зручним місцем зустрічі для галеонів Тьєрра-Фірме та флоту Нової Іспанії. У 1589 році в Гавані розпочалося зведення фортеці Ель-Морро — бастіону для захисту від каперів. Попри це, у 1628 році нідерландському флотоводцю Піту Гейну вдалося захопити весь флот, що повертався, біля затоки Матансас — ця подія вважається найбільшим успіхом супротивників іспанської системи срібних флотів."
  gold_fleet_nueva_espana_events.8.title: "Очікування флоту Тьєрра-Фірме"
  gold_fleet_nueva_espana_events.8.desc: "Кораблі прибули до порту [rendezvous_port.GetName], однак галеони Тьєрра-Фірме ще не прийшли з півдня. [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|U] відда[ROOT.GetCountry.Custom('crown_vlaloly')] гранично чіткий наказ: флоти зі скарбами мають перетнути Атлантику єдиним строєм, аби бортовим залпом остудити запал будь-якого капера, що шукає легкої здобичі у Флоридській протоці.\n\nТому ми залишимося на якорі під захистом фортеці й чекатимемо товаришів, сподіваючись, що вони не забаряться."
  gold_fleet_nueva_espana_events.8.a: "Дочекаймося прибуття іншого флоту."
  gold_fleet_nueva_espana_events.8.historical_info: "Два конвої #italic Срібного флоту#! — #italic флот Нової Іспанії#! та #italic галеони Тьєрра-Фірме#! — мали об’єднуватися в Гавані й разом перетинати Атлантику, оскільки так вони могли захиститися від каперів і випадково зустрінутих ворожих флотилій. Насправді флоти нерідко затримувалися, тому конвой, що не дочекався свого супутника, поставав перед вибором: залишитися на зимівлю в Гавані або ризикнути й вирушити через Атлантику наодинці."
  gold_fleet_nueva_espana_events.9.title: "Затяжне очікування іншого флоту"
  gold_fleet_nueva_espana_events.9.desc: "Відколи ми стали на якір у порту [rendezvous_port.GetName], минуло кілька тижнів, а галеонів Тьєрра-Фірме все немає. Харчі добігають кінця, команди починають ремствувати, а кожен день, проведений на якорі, — це день, що наближає пору примхливої негоди.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити: чи продовжувати чекати на супутників, чи ризикнути й вийти в Атлантику без них."
  gold_fleet_nueva_espana_events.9.a: "Зачекаймо ще. Йти наодинці надто небезпечно."
  gold_fleet_nueva_espana_events.9.b: "Ми й так занадто довго чекали. Вирушаймо до Іспанії самі."
  gold_fleet_nueva_espana_events.9.historical_info: "Долю флотів зі скарбами багато в чому визначав час виходу в море. Конвой, що затримався в Гавані, ризикував зіткнутися з порою ураганів у Карибському краю або зимовими атлантичними штормами, тоді як флот, що вирушив завчасно, втрачав додатковий захист. Командирам доводилося зважувати загрози, і далеко не кожен флот дочікувався свого супутника."
  gold_fleet_nueva_espana_events.10.title: "Розділення флоту"
  gold_fleet_nueva_espana_events.10.desc: "[Select_CString(target_leader.IsFemale, 'Дізналася', 'Дізнався')], що нас може прийняти [secondary_port.GetName], чиї склади ломляться від #TOOLTIP:GOODS,goods_gold,X #L золота#!#! та шкур. Можна виділити ескадру, щоб забрати й ці багатства, хоча розділятися в цих водах ризиковано.\n\nМи можемо затриматися в порту [loot_port.GetNameWithNoTooltip], поки ескадра не повернеться, або ж продовжити шлях — тоді місцем нашої зустрічі стане [rendezvous_port.GetNameWithNoTooltip]."
  gold_fleet_nueva_espana_events.10.a: "Не розділяймо флот. Продовжмо шлях з наявним вантажем."
  gold_fleet_nueva_espana_events.10.b: "Відправмо ескадру до порту [secondary_port.GetNameWithNoTooltip] і дочекаймося її повернення."
  gold_fleet_nueva_espana_events.10.c: "Відправмо ескадру до порту [secondary_port.GetNameWithNoTooltip] і возз’єднаймося в порту [rendezvous_port.GetNameWithNoTooltip]."
  gold_fleet_nueva_espana_events.10.historical_info: "Флоти зі скарбами рідко забирали вантаж лише з одного порту. Від конвоїв регулярно відділялися ескадри, щоб забрати срібло, шкури та барвники з другорядних гаваней, після чого флот возз’єднувався перед переходом через Атлантику. Розділення флоту давало змогу збільшити обсяг здобичі, але наражало невеликі ескадри на небезпеку нападу каперів, які чигали на шляхах між островами."
  gold_fleet_nueva_espana_events.10.danger_tt: "Розділення флоту послаблює обидві ескадри, роблячи подорож ризикованішою (#G +1#! до рівня небезпеки)"
  gold_fleet_nueva_espana_events.10.a.tt: "Флот залишається цілим, проте від вантажу з порту [secondary_port.GetName] доводиться відмовитися."
  gold_fleet_nueva_espana_events.together_danger_suffix: "робить подорож менш ризикованою."
  gold_fleet_nueva_espana_events.havana_together_danger_tt: "Об’єднання з флотом Тьєрра-Фірме $gold_fleet_nueva_espana_events.together_danger_suffix$"
  gold_fleet_nueva_espana_events.awaiting_fleet_tt: "Флот залишатиметься на якорі до прибуття кораблів Тьєрра-Фірме, хоч скільки часу це забере"
  gold_fleet_nueva_espana_events.hold_longer_tt: "Конвой продовжує чекати на інший флот зі скарбами"
  gold_fleet_nueva_espana_events.11.title: "Повернення ескадри"
  gold_fleet_nueva_espana_events.11.desc: "[loot_port.GetName] зустрічає ескадру, відправлену до порту [secondary_port.GetName]. Трюми кораблів забиті скарбами: #TOOLTIP:GOODS,goods_gold,X #L золотом#!#! та шкурами. Розрізнені кораблі возз’єдналися, і тепер плавання буде менш небезпечним."
  gold_fleet_nueva_espana_events.11.a: "Забираємо вантаж і продовжуємо шлях у повному складі."
  gold_fleet_nueva_espana_events.11.historical_info: "Флоти зі скарбами рідко забирали вантаж лише з одного порту. Відокремлені ескадри вирушали по срібло, шкури та барвники до другорядних гаваней, після чого на них чекало возз’єднання з основною частиною конвою. Відновлення чисельності флоту підвищувало шанси на безпечний перехід через Атлантику."
  gold_fleet_nueva_espana_events.12.title: "Возз’єднання біля Куби"
  gold_fleet_nueva_espana_events.12.desc: "[rendezvous_port.GetNameWithNoTooltip] лаштується зустрічати об’єднаний флот: ескадра, яка вийшла з порту [secondary_port.GetName], наздогнала решту кораблів. У її трюмах — здобич цього сезону: #TOOLTIP:GOODS,goods_gold,X #L золото#!#! та шкури."
  gold_fleet_nueva_espana_events.12.a: "Забираємо вантаж і рушаємо далі в повному складі."
  gold_fleet_nueva_espana_events.12.historical_info: "Основній частині флоту не завжди доводилося чекати на повернення відокремленої ескадри. За сприятливої погоди та попутного вітру ескадра могла наздогнати конвой до його прибуття до Гавани."
  gold_fleet_nueva_espana_events.15.title: "Ель-норте"
  gold_fleet_nueva_espana_events.15.desc: "Небо на півночі стає олов’яно-сірим, а тиск у барометрі стрімко падає. На нас суне #italic норте#! — лютий північний шторм, який налітає майже без попередження і жене перед собою коротку, але вкрай небезпечну хвилю. Тут, на мілководді, неподалік від берега, він здатен згубити цілий флот.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'має', 'мусить')] вирішити, як флот зустрічатиме негоду."
  gold_fleet_nueva_espana_events.15.a: "Відійдемо від берегів і перечекаємо шторм на глибині у відкритому морі."
  gold_fleet_nueva_espana_events.15.b: "Сховаємося від шторму біля узбережжя."
  gold_fleet_nueva_espana_events.15.deep_safe_tt: "Флот не без зусиль, але все ж виходить у відкрите море й успішно перечікує там шторм"
  gold_fleet_nueva_espana_events.15.deep_loss_tt: "Дужий вітер розпорошує флот і кидає кілька кораблів на мілину, через що ми втрачаємо частину вантажу"
  gold_fleet_nueva_espana_events.15.historical_info: "#italic Норте#! — холодні північні шторми, які шаленіли Мексиканською затокою з осені до весни. Вони відрізнялися від літніх ураганів, проте наганяли не менше страху на моряків і купців Веракруса. Якірна стоянка в порту Сан-Хуан-де-Улуа не захищала від таких штормів, тому вітри могли притиснути флот до берега або викинути його на узбережжя затоки Кампече. Строки завантаження у Веракрусі залежали не лише від надходження срібла, а й від сезону норте, адже застигнутий сильним штормом поблизу підвітряного берега флот міг бути вмить знищений."
  gold_fleet_nueva_espana_events.16.title: "Затримка валки зі сріблом"
  gold_fleet_nueva_espana_events.16.desc: "До нас дійшли звістки, що одна з найбільших валок цього сезону покинула місцевість [silver_source.GetName], але до нас так і не прибула. Десь дорогою з глибини материка на неї напали: уздовж гірської стежки розкидані зливки #TOOLTIP:GOODS,silver,X #L срібла#!#!, погоничі мулів розбіглися, і багатства корони застрягли за сотню ліг від берега.\n\nНаші трюми заповнені лише наполовину, і [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'має', 'мусить')] вирішити, чи може флот дозволити собі вирушити по решту вантажу."
  gold_fleet_nueva_espana_events.16.a: "Вирядимо морську піхоту вглиб країни, щоб вона допомогла доправити срібло до берега."
  gold_fleet_nueva_espana_events.16.b: "У нас обмаль часу. Вирушимо в дорогу з тим, що є."
  gold_fleet_nueva_espana_events.16.historical_info: "Срібло з мексиканських рудників — Сакатекаса, Гуанахуато та менш значних родовищ на півночі — перевозили дорогою #italic Каміно-Реаль-де-Тьєрра-Адентро#!, яка протягом кількох сотень миль пролягала крізь посушливі, малозаселені землі до Мехіко, а звідти дорогоцінний метал везли на схід до Веракруса. Багато поколінь цей шлях залишався небезпечним через напади чичимеків з північного порубіжжя, а згодом — розбійників, тому срібло везли валками під охороною, строки прибуття яких безпосередньо визначали сезон завантаження на узбережжі. Якщо валка затримувалася чи потрапляла в засідку дорогою, флоту доводилося чекати на неї або вирушати у плавання з напівпорожніми трюмами."
  gold_fleet_nueva_espana_events.17.title: "Червці в корпусі"
  gold_fleet_nueva_espana_events.17.desc: "[target_leader.GetName] отримує від теслярів погані вісті: теплі води Індій поволі, але невблаганно роблять свою справу, і корабельні червці проточили обшивку нижче ватерлінії. Якщо нічого не вдіяти, корпуси почнуть трухлявіти, кораблі — втрачати хід, і флот, нездатний відірватися від супротивника, рано чи пізно стане його здобиччю.\n\nНеподалік є затишна бухта, де ми могли б провести кренування, тобто обчистити, випалити й засмолити днища, проте в такому разі кораблям доведеться кілька тижнів беззахисними пролежати на піску."
  gold_fleet_nueva_espana_events.17.a: "Зайдемо в бухту й витягнемо кораблі на берег."
  gold_fleet_nueva_espana_events.17.b: "У нас немає на це часу. Рушаймо далі з пошкодженими днищами, сподіваючись на попутний вітер."
  gold_fleet_nueva_espana_events.17.historical_info: "Корабельний точильник #italic Teredo navalis#!, який водиться в тропічних водах і насправді є молюском, а не червом, за лічені місяці точив незахищені корпуси кораблів. З цим лихом стикався майже кожен флот у Карибському морі. Боролися зі шкідниками за допомогою кренування: корабель саджали на мілину або підтягували до берега в затишній бухті, щоб оголити його корпус, після чого здирали нарости, обпалювали деревину та змащували її салом і смолою. Роботи тривали довго й залишали ескадри без захисту, тому очільники часто ризикували й відкладали обробку, через що кораблі ставали не повороткішими за баржі й протікали в усіх швах."
  gold_fleet_nueva_espana_events.18.title: "Перемитники на узбережжі"
  gold_fleet_nueva_espana_events.18.desc: "Вивідувачі доповідають, що [logwood_source.GetName] потерпає від навали чужоземних лісорубів: вони рубають дерева, готують колоди та вивозять наш ліс під невизнаним прапором. Вони розбили примітивні табори на березі й осміліли настільки, що збувають перемитний крам кораблям, які пропливають повз, отаборившись на землях, які [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] вважа[ROOT.GetCountry.Custom('crown_yeyut')] своїми.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'має', 'мусить')] вирішити, як вчинити з непроханими гостями, наприклад вирядити проти них загін."
  gold_fleet_nueva_espana_events.18.a: "Висадимося на берег, спалимо табори й заберемо деревину."
  gold_fleet_nueva_espana_events.18.b: "Дамо чужинцям спокій, але купуватимемо в них мапи та відомості про ворожі кораблі."
  gold_fleet_nueva_espana_events.18.historical_info: "Слабо захищені береги Мексиканської затоки та затоки Кампече вабили чужоземних перемитників протягом усієї колоніальної доби. Особливо багато тут було лісорубів — англійців, голландців та французів, — які заготовляли фарбувальне дерево, украй потрібне суконним мануфактурам Європи. Діючи далеко від іспанських залог, #italic лісоруби#! нерідко нехтували законами й промишляли перемитництвом та відкритим піратством, а спроби іспанців прогнати їх були нечастими й давали лише короткочасний перепочинок. Прохідний флот міг розігнати табір, проте щойно кораблі зникали за обрієм, як лісоруби поверталися знову."