l_russian:
  summon_volunteers_of_the_faith: "Призвати благочестивих добровольців"
  summon_volunteers_of_the_faith_desc: "#TOOLTIP:RELIGIONGROUP,muslim,X #L Ісламські#!#! племена дістають заклик відправити святих воїнів у [Concept('jihad', 'джихад')|e]. Одне з берберських племен виставить полк найманців, що діє за власним військовим звичаєм: це можуть бути швидкі вершники, піхотинці або ж зрівноважене військо. При цьому зросте ревність у вірі [Concept('jihad', 'джихаду')]. Країна, яка забезпечила собі постійний корпус святих воїнів або ж отримала воїнів-добровольців від своїх станів, виставить сильніше військо. За один раз кожне плем’я може відгукнутися лише один раз. Після розпуску полку заклик можна буде оголосити знову."
  summon_volunteers_of_the_faith_effect_tt: "Буде зібрано племінний полк найманців, що діє за власним військовим звичаєм. #Y Ревність у вірі#! [Concept('jihad', 'джихаду')|e] зросте на #G 5#!. Полк буде більшим і краще озброєним, якщо діє [Concept('bureaucracy', 'установа')|e] «[ShowBureaucracyTypeName('ghuzat_mujahidin_bureaucracy')]»."
  summon_volunteers_cavalry_tier2_tt: "Збирається 10 полків легкої кінноти, 4 полки легкої піхоти та 2 полки важкої кінноти"
  summon_volunteers_cavalry_tier1_tt: "Збирається 8 полків легкої кінноти та 4 полки легкої піхоти"
  summon_volunteers_cavalry_tier0_tt: "Збирається 6 полків легкої кінноти та 3 полки легкої піхоти"
  summon_volunteers_infantry_tier2_tt: "Збирається 8 полків важкої піхоти, 4 полки легкої піхоти та 1 полк важкої кінноти"
  summon_volunteers_infantry_tier1_tt: "Збирається 6 полків важкої піхоти та 4 полки легкої піхоти"
  summon_volunteers_infantry_tier0_tt: "Збирається 4 полки важкої піхоти та 4 полки легкої піхоти"
  summon_volunteers_mixed_tier2_tt: "Збирається 7 полків легкої кінноти, 5 полків легкої піхоти та 2 полки важкої піхоти"
  summon_volunteers_mixed_tier1_tt: "Збирається 6 полків легкої кінноти та 5 полків легкої піхоти"
  summon_volunteers_mixed_tier0_tt: "Збирається 4 полки легкої кінноти та 4 полки легкої піхоти"
  choose_tribe_for_volunteers: "Обрати плем’я"
  summon_volunteers_no_tribes: "@trigger_no! Жодне з племен не може відгукнутися на заклик."
  ghuzat_regiment_name: "Благочестиві добровольці"
  summon_volunteers_bureaucracy_bonus_tt: "Наші загони відважних і вправних воїнів, добровольців-газі, поповнюють війська."
  proclaim_the_ghazw: "Оголосити газават"
  proclaim_the_ghazw_desc: "Оголосити набіг через протоку на одну з порубіжних провінцій ворога-#TOOLTIP:RELIGIONGROUP,christian,X #L християнина#!#!. Кожна незахищена місцевість, де немає ані форту, ані війська, буде пограбована та втратить багатство. Її володар буде змушений зібрати проти нас військо."
  proclaim_the_ghazw_tt: "Ревність у вірі [Concept('jihad', 'джихаду')|e] зменшується на #R 10#!. Підготовка посувається назад на #R 10#!"
  proclaim_the_ghazw_loot_tt: "Кожна незахищена місцевість у провінції, де немає фортеці та війська, зазнає пограбування; здобич становитиме близько [actor.MakeScope.ScriptValue('ghazw_estimated_total')|0+=][gold_i]. Знижується рівень розвитку місцевостей"
  choose_province_for_ghazw: "Обрати провінцію для набігу"
  proclaim_the_ghazw_no_provinces: "@trigger_no! У ворога немає незахищених порубіжних провінцій, на які можна було б влаштувати набіг."
  cross_the_strait: "Підкорення морів"
  cross_the_strait_desc: "Найняти флот вантажних кораблів в одному з наших портів, щоб війська Магрибу змогли переправитися через #TOOLTIP:LOCATION,strait_of_gibraltar,X #L Гібралтарську протоку#!#! до Аль-Андалусу. Найняті кораблі зможуть перевезти близько чверті нашого війська. Переправу можна буде повторити в будь-яку мить, доки триває священна війна."
  cross_the_strait_effect_tt: "Будуть найняті вантажні кораблі, здатні за [Concept('gold', 'гроші')|e] перевезти близько чверті нашого війська (вартість зростає залежно від розміру флоту). Буде витрачено #R 10#! од. ревності у вірі [Concept('jihad', 'джихаду')|e]"
  cross_the_strait_fleet_name: "Флот протоки"
  cross_the_strait_hire_tt: "Наймає флот для переправлення нашого війська через протоку"
  choose_port_for_crossing: "Обрати порт"
  cross_the_strait_no_ports: "@trigger_no! У нас немає жодного порту, придатного для переправлення війська."
  raid_the_shores: "Набіг на узбережжя"
  raid_the_shores_desc: "Влаштувати набіг піратів на узбережжя будь-якої провінції нашого ворога-#TOOLTIP:RELIGIONGROUP,christian,X #L християнина#!#!, де вже діє капер. Кожна незахищена прибережна місцевість, де немає ані форту, ані війська, буде розграбована, а одного зі 100 селян-#TOOLTIP:RELIGION,$catholic_tt$,X #L католиків#!#! буде забрано в неволю до нашої столиці."
  raid_the_shores_tt: "Ревність [Concept('jihad', 'джихаду')|e] зменшується на #R 10#!. Підготовка зміщується назад на #R 10#!"
  raid_the_shores_loot_tt: "Кожна незахищена прибережна місцевість в обраній провінції зазнає розграбування. Одного зі 100 селян-#TOOLTIP:RELIGION,$catholic_tt$,X #L католиків#!#! буде забрано в неволю"
  choose_province_for_shore_raid: "Обрати узбережжя для набігу"
  raid_the_shores_no_provinces: "@trigger_no! У ворога немає узбережжя, що прилягає до морської зони, де діють наші [Concept('privateers', 'капери')|e]."