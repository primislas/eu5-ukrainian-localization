l_russian:
  hint_battle_for_the_strait: "Поради щодо ситуації «[GetSituationByKey('battle_for_the_strait').GetNameWithNoTooltip]»"
  hint_battle_for_the_strait_hint_text: "$hint_battle_for_the_strait_hint_text_1$\n\n$hint_battle_for_the_strait_hint_text_2$"
  hint_battle_for_the_strait_hint_text_1: "[GetSituationByKey('battle_for_the_strait').GetName] — це [Concept('situation_with_icon', 'ситуація')|e], у якій [GetCountry('CAS').GetName] та [GetCountry('MOR').GetName] змагаються за вузькі води між #TOOLTIP:REGION,iberia_region,X #L Іберією#!#! та #TOOLTIP:REGION,maghreb_region,X #L Магрибом#!#!, тоді як [GetCountry('GRA').GetName] боре[GetCountry('GRA').Custom('end_etsautsa')]ся за виживання між ними. Перебіг протистояння вимірюють два показники. Вплив на [GetCountry('GRA').Custom('CL_ACC')] коливається між двома великими країнами і поволі зміщується назад до середини, тоді як [Concept('granadan_sovereignty', 'гранадський суверенітет')|e] показує, наскільки вільно [GetCountry('GRA').GetNameWithNoTooltip] править собою. Якщо до початку доби #TOOLTIP:AGE,age_3_discovery,X #L Відкриттів#!#! ніхто не здобуде перемоги, боротьба завершиться внічию."
  hint_battle_for_the_strait_hint_text_2: "#T Як перемагає кожна зі сторін:#!\n@arrow_bonus_tier_2! [GetCountry('CAS').GetNameWithNoTooltip] ма[GetCountry('CAS').Custom('end_yeyut')] витіснити [GetCountry('MOR').Custom('CL_ACC')] з Іберії та утримувати область #TOOLTIP:AREA,granada_area,X #L Гранади#!#! безпосередньо чи через [Concept('subjects_with_icon', 'васалів')|e]. Потім вона ма[GetCountry('CAS').Custom('end_yeyut')] підпорядкувати [GetCountry('GRA').Custom('CL_ACC')] як [ShowSubjectTypeName('vassal')] із повним впливом на своєму боці або цілковито завоювати її. Утримувати її як [ShowSubjectTypeName('tributary')] недостатньо.\n@arrow_bonus_tier_2! [GetCountry('MOR').GetNameWithNoTooltip] ма[GetCountry('MOR').Custom('end_yeyut')] утримувати області #TOOLTIP:AREA,granada_area,X #L Гранади#!#!, #TOOLTIP:AREA,andalusia_area,X #L Андалусії#!#! та #TOOLTIP:AREA,murcia_area,X #L Мурсії#!#! безпосередньо чи через [Concept('subjects', 'васалів')|e]. Потім вона ма[GetCountry('MOR').Custom('end_yeyut')] підпорядкувати [GetCountry('GRA').Custom('CL_ACC')] як [ShowSubjectTypeName('vassal')] або [ShowSubjectTypeName('taifa')] з повним впливом на своєму боці чи цілковито завоювати її.\n@arrow_bonus_tier_2! [GetCountry('GRA').GetNameWithNoTooltip] ма[GetCountry('GRA').Custom('end_yeyut')] залишатися вільною від будь-якого сюзерена та утримувати ті самі три області. Вона також ма[GetCountry('GRA').Custom('end_yeyut')] зберігати вплив у межах #Y 50#! від середини, а свій [Concept('granadan_sovereignty', 'суверенітет')|e] — понад #Y 50#!.\n@arrow_bonus_tier_1! Якщо [GetCountry('CAS').GetNameWithNoTooltip] або [GetCountry('MOR').GetNameWithNoTooltip] впаде, боротьба негайно припиниться, і сторона, що утримує ці землі, здобуде перемогу."
  hint_battle_for_the_strait_hint_text_4: "#T Рекомендовані дії за [GetCountry('MOR').GetNameWithNoTooltip]:#!\n@arrow_bonus_tier_3! Накажіть нашій [Concept('cabinet', 'раді')|e] [ShowCabinetActionName('mor_cultivate_andalusi_influence')] і тримайте потужний [Concept('navy_with_icon', 'флот')|e] у протоці. Флоти в її водах схиляють вплив на користь свого володаря.\n@arrow_bonus_tier_2! [ShowGenericActionName('claim_andalusi_inheritance')] надає нам [Concept('casus_belli_with_icon', 'привід для війни')|e] проти країни в регіоні [ShowRegionNameWithNoTooltip('iberia_region')] — це наш шлях до трьох потрібних нам областей.\n@arrow_bonus_tier_1! Коли вплив зміститься на нашу користь більш ніж на #Y 25#!, [ShowGenericActionName('mor_force_tribute')] дозволить прив’язати ослаблу [GetCountry('GRA').GetNameWithNoTooltip] до нас, але для перемоги зараховується лише [ShowSubjectTypeName('vassal')] або [ShowSubjectTypeName('taifa')]."
  hint_battle_for_the_strait_hint_text_5: "#T Рекомендовані дії за [GetCountry('GRA').GetNameWithNoTooltip]:#!\n@arrow_bonus_tier_3! Використовуйте [ShowGenericActionName('gra_reduce_castilian_influence')] та [ShowGenericActionName('gra_reduce_moroccan_influence')], щоби тримати вплив ближче до середини, і накажіть нашій [Concept('cabinet', 'раді')|e] [ShowCabinetActionName('gra_promote_sovereignty')].\n@arrow_bonus_tier_2! Наш [Concept('granadan_sovereignty', 'гранадський суверенітет')|e] зростає, поки ми залишаємося незалежними та живемо в мирі, а наші [Concept('prestige_with_icon', 'слава')|e] та [Concept('crown_power_with_icon', 'влада корони')|e] підносять його ще вище. [ShowGenericActionName('gra_enforce_sovereignty')] і кожне розширення #TOOLTIP:BUILDING_TYPE,alhambra,X #L Альгамбри#!#! також збільшують його.\n@arrow_bonus_tier_1! Кожен рік у становищі [Concept('subject_with_icon', 'васала')|e] обходиться нам дорожче у [Concept('granadan_sovereignty', 'гранадському суверенітеті')|e], ніж попередній, а війна виснажує його ще дужче. Що вище він підіймається над #Y 50#!, то швидше потім падає назад, тож за ним варто пильнувати.\n@hint! [Concept('disaster_with_icon', 'Лихо')|e] у [GetCountry('CAS').Custom('CL_PREP')] або [GetCountry('MOR').Custom('CL_PREP')] збільшує наш [Concept('granadan_sovereignty', 'гранадський суверенітет')|e], поки триває."
  hint_battle_for_the_strait_diplomatic: "«[GetCountry('GRA').GetName] схиля[GetCountry('GRA').Custom('end_yeyu')]ться до своїх друзів. Той, хто запропонує їй союз чи гарантії, зближується з нею, а спільна віра зближує ще дужче.»"
  hint_battle_for_the_strait_administrative: "«Вплив на #ONCLICK:COUNTRY,[GetCountry('GRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GRA').GetKey],X [GetCountry('GRA').Custom('CL_ACC')|L]#!#! з кожним місяцем зміщується назад до середини. Будь-яку перевагу слід плекати, інакше вона згасне.»"
  hint_battle_for_the_strait_military: "«Хто володіє протокою, той володіє протистоянням. Флотили у її водах та залоги в її портах тиснуть на #ONCLICK:COUNTRY,[GetCountry('GRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GRA').GetKey],X [GetCountry('GRA').Custom('CL_ACC')|L]#!#! так само тяжко, як і будь-яке військо.»"
  hint_golden_century: "Поради щодо ситуації «[GetSituationByKey('golden_century').GetNameWithNoTooltip]»"
  hint_golden_century_hint_text: "$hint_golden_century_hint_text_1$\n\n$hint_golden_century_hint_text_2$"
  hint_golden_century_hint_text_1: "[GetSituationByKey('golden_century').GetName] — [Concept('situation_with_icon', 'ситуація')|e], якій передує [GetSituationByKey('battle_for_the_strait').GetName]. Переможець отримає століття панування над Європою та Новим Світом. Цей переможець стане колосом нової доби, за зростанням якого тривожно спостерігатимуть суперники та сусіди."
  hint_golden_century_hint_text_2: "#T Як підкорити добу:#!\n@arrow_bonus_tier_2! Два лічильники відстежують піднесення колоса. [Concept('gc_european_dominance', 'Європейське панування')|e] зростає завдяки перемогам у континентальних війнах, а також родовому й духовному верховенству у власних землях, тоді як [Concept('gc_colonial_dominance', 'колоніальне панування')|e] зростає завдяки колонізації, золотим флотам і наверненню заморських земель. Обидва збільшуються поступово, і кожне порогове значення від #Y 25#! до #Y 100#! дає колосу тривалу нагороду.\n@arrow_bonus_tier_1! Панування породжує небезпеку. Лічильник [Concept('flashpoint', 'переломної миті')|e] зростає в міру накопичення боргу та інфляції, підживлюваний надмірним самовладдям і заздрістю інших. Коли лічильник заповнюється, колос отримує переломну подію, і постає [GetInternationalOrganizationType('grand_alliance').GetName], щоб покласти йому край. Поразка в тій війні може зменшити один із лічильників на #Y 25#!, а якщо колос втратить чверть своїх початкових земель, золота доба завершиться достроково."
  hint_golden_century_diplomatic: "«Незалежно від того, є ми колосом чи тремтимо в його тіні, долю цієї доби визначають союзи. Панівна країна спирається на своїх друзів, щоби стримати коаліцію, а охочі поставити колоса на місце створюють [GetInternationalOrganizationType('grand_alliance').GetName], щоб разом звершити відплату»."
  hint_golden_century_administrative: "«Золота доба будується як усередині країни, так і за її межами. Стежте за [Concept('control_with_icon', 'контролем')|e] та вірністю [Concept('subjects_with_icon', 'васалів')|e] і не дозволяйте боргам та заворушенням тяжіти над вами, адже в них народжується нова [Concept('flashpoint', 'переломна мить')|e]»."
  hint_golden_century_military: "«Панування здобувається мечем, і від меча ж утрачається. Колос мусить боронити свою країну, щоби прожити до кінця золотої доби, тоді як вороги повинні відтяти від нього чверть країни, щоби достроково завершити золоту добу»."