l_russian:
  seven_cities_cibola.1.title: "Пуебло — це просто село"
  seven_cities_cibola.1.desc: "Після кількох місяців у поході загін дістався місця, яке ченці та провідники називають Сиболою. Тут, як і було описано, стоять сім поселень — стародавніх пуебло із саману та каменю, міцних і надійних, але заселених простими землеробами й ткачами. Стіни тут не облицьовані золотом, двері не оздоблені бірюзою, а в коморах лежать хіба що маїс і сушені боби. [target_leader.GetName], сховавшись за пологом капітанського намету, пише донесення на батьківщину. Усі, хто лишився зовні, мовчки сидять на своїй поклажі."
  seven_cities_cibola.1.a: "Зате яка захоплива вийшла подорож…"
  seven_cities_cibola.1.historical_info: "У липні 1540 року загін Коронадо дістався селища Гавіку, першого з пуебло Сиболи. Його зустріла громада землеробів-зуні, що засіла в укріпленому глинобитному поселенні. Бій був нетривалим: Коронадо поранили, пуебло здобули, золота не знайшли. Фрай Маркос де Ніза, який роком раніше повернувся до Мехіко з розповідями про побачене здалеку місто, чиї вулиці вимощені коштовним камінням, був із ганьбою відісланий додому. Іспанські виправи на південний захід не знайшли коштовних металів і не заснували колоній-енком’єнд. Постійна присутність європейців у цьому краю розпочалася лише через п’ятдесят років."
  seven_cities_cibola.2.title: "З бірюзи та глини"
  seven_cities_cibola.2.desc: "Пуебло, до якого ми дісталися, справді розташоване там, де й обіцяли ченці, — от тільки виглядає воно зовсім не так, як вони його описували. Стіни тут не золоті, а високі, вкриті білим тиньком; довкола входів до ків викладено мозаїки з бірюзи. У коморах зберігаються маїс, боби, сушений перець, тканини з бавовни, а також чималі запаси обробленої бірюзи й намиста з черепашок. Старійшини охоче йдуть на розмову: дехто з них справді бував у землях на північ звідси й може розповісти, що лежить уздовж верхньої течії річки. Легенди тут немає, але є щось вагоме. [target_leader.GetName] виходить на перемовини зі старійшинами."
  seven_cities_cibola.2.a: "Не добре, але й не зле."
  seven_cities_cibola.2.historical_info: "Народи пуебло, які мешкали на теренах сучасних штатів Нью-Мексико та Аризона, мали розлогу торгову сферу впливу. Бірюза з пагорбів Серрільйос вирушала на південь, до Мезоамерики, та на північ, до Великих Рівнин. Пір’я папуг ара надходило з лісів Юкатану, а обсидіаном обмінювалися торговці пуебло та племен із Рівнин. Гавіку, Акома, Ріо-Гранде та інші міста краю були за місцевими мірками квітучими. Але для іспанців, які бачили падіння Теночтітлана, вони здавалися глушиною. Зіткнення іспанських зазіхань із дійсністю пуебло стало провалом для перших і майже катастрофою для других. Утім, більшість причетних культур зуміли зберегтися."
  seven_cities_cibola.3.title: "Легенда про сім міст"
  seven_cities_cibola.3.desc: "Усе, про що розповідали ченці, виявилося правдою, — і навіть більше. Тут розташовані сім великих пуебло, і в кожного — своя говірка та свій вождь. За ними простягається ціла мережа торгових шляхів, що ведуть до затоки та великої річки на сході. Двері прикрашені бірюзою, вожді вдягнені в пернаті плащі і всюди ходять у супроводі почту, а в коморах зберігаються золоті вироби такої майстерної роботи, якої не бачили вже багато поколінь. Скріпити угоду вдалося до першого снігу. [target_leader.GetName] відправляє до узбережжя двох вершників зі зразками золота й бірюзи, а також із листом, у якому просить надіслати підкріплення."
  seven_cities_cibola.3.a: "Звідси ми правитимемо північчю. Засновано другий Мехіко."
  seven_cities_cibola.3.historical_info: "Іспанці плекали марну надію, що десь у пустелях на північ від Мексиканського нагір’я лежить друга Мезоамерика — край із безліччю міст, покладами легковидобувних коштовних металів та єдиною владою, яку можна було б підкорити так само, як це зробив з ацтеками Кортес. Насправді ж там було безліч поселень землеробів із багатою матеріальною культурою, але обмеженими запасами золота та без будь-якої вищої влади, з якою можна було б вести перемовини. Ця надія зберігалася довше, ніж слід було б, оскільки іспанський порядок заохочував звістки про золоті міста значно більше, ніж повідомлення про їх відсутність."
  seven_cities_cibola.10.title: "Розповідь ченця"
  seven_cities_cibola.10.desc: "На пристані стоїть чернець, що повернувся з далеких берегів. У руках у нього — донесення, засвідчене клятвою перед Богом і нотарем. «Він бачив місто, — промовляє [target_character.GetName]. — З пагорба, на заході сонця, з відстані — близької чи, далекої чи — цього він не знає й сам. Місто більше й прекрасніше за будь-яке з тих, що є в Індіях, із дверними отворами, прикрашеними бірюзою. Всередину він не заходив: за його словами, нерозважливо було б чинити так наодинці». Людей ця розповідь захоплює; офіцери ж між собою задаються іншим питанням: скільки правди в цих словах, якщо все свідчення тримається на одному пагорбі й одному заході сонця?"
  seven_cities_cibola.10.a: "Виділити місце ченцеві. Його місту знадобиться свідок."
  seven_cities_cibola.10.b: "Кількох вояків і провідників має вистачити."
  cibola_friar_sails_tt: "[target_character.GetName] відпливає в мандрівку"
  seven_cities_cibola.10.historical_info: "У 1539 році фрай Маркос де Ніза вирушив на північ із Кульякана на розвідку. Після повернення він присягався, що бачив здалеку місто під назвою Сибола, яке перевершувало за розмірами Мехіко-Теночтітлан. Фрай завбачливо не став наближатися до нього. Ця доповідь збурила Нову Іспанію. Її самої вистачило, щоби віцекороль зібрав найбільшу суходільну виправу, яку будь-коли бачили в Америці. За рік вояки Коронадо дісталися глинобитних стін Гавіку, і генерал написав, що чернець у жодному слові не сказав правди. Відтоді точаться суперечки про те, чи брехав Маркос свідомо, чи просто помилився, сприйнявши відблиски сонця на потинькованих глиняних стінах за блиск золота, чи просто повідомив те, чого від нього вимагала стривожена колонія."
  seven_cities_cibola.11.title: "Хрести на шляху"
  seven_cities_cibola.11.desc: "Наш передовий вивідач знову далеко відірвався від загону. Він уже перетинав колись ці землі — босий, дивом уцілілий після кораблетрощі. У селах його пам’ятають: він іде з двома провідниками та гарбузовим брязкальцем, і щоразу, коли дорога виявляється прохідною, він посилає назад дерев’яний хрест. Перший хрест був завбільшки з долоню. Сьогодні вранці до табору принесли хрест заввишки в людський зріст. Офіцери сперечаються, чи означають ці хрести прийдешній шлях, чи людину, яку відрядили в дорогу."
  seven_cities_cibola.11.a: "Нехай іде далі. Хрести промовляють самі за себе."
  seven_cities_cibola.11.b: "Відкликати вивідача. Загін іде разом або не йде взагалі."
  seven_cities_cibola.11.historical_info: "Марокканський невільник Естеваніко пережив катастрофу виправи Нарваеса й вісім років мандрував материком пішки разом із Кабесою де Вакою. У 1539 році він ішов попереду виправи фрая Маркоса як вивідач. Угода була такою: Естеваніко надсилає назад хрест як звіт. Маленький хрест означає, що місце добре, великий хрест — що місце багате. Хрести Естеваніко ставали дедалі більшими, і одного разу гінці ледве змогли їх донести. Тоді чернець поспішив услід за вивідачем, який випереджав його на багато днів ходи й насолоджувався кожним кроком. Про те, що насправді означав розмір хрестів, суперечки точаться й досі."
  seven_cities_cibola.12.title: "Дикі краї"
  seven_cities_cibola.12.desc: "Між останніми гостинними селами та містом із легенди лежить місцевість, яку провідники називають «деспобладо»: поросла колючими чагарями й помережана пересохлими річищами пустеля, де немає нічого, чим міг би прогодуватися загін. У найкращому разі ми пройдемо її за п’ятнадцять днів. Кожну частку кукурудзи доведеться нести на спині або везти на конях, а їх теж треба годувати. Інтендант тричі перелічив припаси й нічого не каже. Місто, як і голод, уже близько."
  seven_cities_cibola.12.desc_friar: "Увечері біля багаття чернець незмінно проповідує одне й те саме: місто лежить відразу за пустошею, він бачив його на власні очі, а якщо Бог дозволив людині побачити щось, то не для того, щоб та померла з голоду за два кроки від шуканого. Інтендант, який обрахував і перерахував необхідну для переходу через деспобладо кількість припасів, зауважує, що загін харчується не манною небесною, а лише тим, що несе з собою. [target_leader.GetName] тепер [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити, що важливіше: проповіді чи підрахунки."
  seven_cities_cibola.12.a: "Авангард іде попереду й без вантажу."
  seven_cities_cibola.12.b: "Увесь загін та його череди з припасами. Тихіше їдеш — далі будеш."
  seven_cities_cibola.12.historical_info: "Коронадо подолав деспобладо, безлюдну місцевість між долиною Сонори та поселеннями зуні, розділивши виправу на частини. Разом з авангардом вершників він вирушив уперед. Головні сили виправи йшли слідом за ними разом зі стадами. Авангард, який дістався Хавікуха в липні 1540 року, був настільки виснажений голодом, що, як визнав один літописець, пуебло взяли здебільшого через запаси кукурудзи. Деспобладо вплинуло на настрій виправи дужче, ніж будь-яка легенда. Люди, які врешті-решт побачили Сиболу, вже тиждень харчувалися кормом власних же коней, і це не могло не позначитися на їхніх подальших діях."
  seven_cities_cibola.13.title: "Хрест у людський зріст"
  seven_cities_cibola.13.desc: "Гонці вже не несуть хрести — вони тягнуть їх. Останній хрест, витесаний із зеленого дерева, заввишки з людину й дуже важкий. Провідники, які доправили його до табору, кажуть, що вивідач геть перестав передавати вісті в такий спосіб. Здається, що йому вже просто нічого додати до своїх послань. Він уже близько: йде на день попереду своєї варти, побрязкуючи гарбузовим брязкальцем. Жителі міст виходять на вулиці, щоб поглянути на нього. Разом із хрестом наш вивідач передав останнє прохання: дозволити йому увійти до міста та привітати його володарів до прибуття колони."
  seven_cities_cibola.13.a: "Дозволити йому привітати місто. Він заслужив побачити його першим."
  seven_cities_cibola.13.a.tt: "#italic Прохання вивідача задовольнили. Десь попереду він підходить до брами#!"
  seven_cities_cibola.13.b: "Відкликати вивідача назад з усіма нотатками."
  seven_cities_cibola.13.historical_info: "У північних долинах Естеваніко сприймали як щось середнє між вивідачем і святим. Він ішов попереду ченців у супроводі юрби шанувальників з оздобленим дзвониками та пір’ям обрядовим гарбузовим брязкальцем у руках. У кожному селі його осипали подарунками з бірюзи. Така слава склалася за багато років, проведених ним серед народів глибинних країв, і вона приносила плоди… до певного часу. За одним зі свідчень, гарбузове брязкальце, яке Естеваніко надіслав уперед, щоб сповістити про своє прибуття до Сиболи, у пуебло впізнали як річ ворожого народу. Естеваніко відмовили у вході до міста ще до того, як він побачив його мури."
  seven_cities_cibola.14.title: "Убивство біля брами"
  seven_cities_cibola.14.desc: "Упродовж тижня люди з його почту поверталися по двоє-троє, схудлі та мовчазні. Їхні розповіді різнилися в дрібницях, але сходилися в головному. Вивідач дістався міста. Кажуть, воно височіє над рівниною саме там, куди вказували хрести. Його володарі не впустили Естеваніко до міста, протримали його ніч біля брами й уранці вбили, коли той відмовився повертатися. Загін отримав своє підтвердження, і той, хто всю дорогу йшов попереду нас, побрязкуючи гарбузовим брязкальцем, заплатив за це високу ціну."
  seven_cities_cibola.14.a: "Він його знайшов. Пом’янімо ж і вирушаймо в дорогу."
  seven_cities_cibola.14.historical_info: "У травні 1539 року Естеваніко вбили в Хавікуху. Він став першою людиною зі Старого Світу, яка досягла «Семи міст», і першим, хто загинув заради них. Уцілілі з його почту втекли на південь і зустріли фрая Маркоса, який ішов стежкою. За власними словами, чернець просунувся вперед рівно настільки, щоб побачити місто здалеку, після чого вирушив назад до Мексики з цією звісткою. Убивство Естеваніко розцінили скоріше як доказ, аніж як попередження: місто, де вбивають послів, — це місто, де точно є щось, що варто охороняти. Військо, яке виступило наступної весни, стало в певному сенсі пам’ятником Естеваніко."