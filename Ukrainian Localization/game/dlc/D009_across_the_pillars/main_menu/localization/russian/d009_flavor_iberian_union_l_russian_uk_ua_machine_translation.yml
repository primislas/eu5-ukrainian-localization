l_russian:
  d009_flavor_iberian_union.1.title: "Проголошення іспанської монархії"
  d009_flavor_iberian_union.1.desc: "Корони нашої унії сплелися настільки тісно, що ми тепер єдина країна в усьому, крім назви. Наш уряд врядує на спільних землях, закони та монета діють від одного краю півострова до іншого, а колись малі королівства перетворилися на провінції великої держави.\n\nНастав час відкинути старі титули й перед лицем усього світу проголосити єдину суверенну монархію — Іспанію."
  d009_flavor_iberian_union.1.a: "Проголосити іспанську монархію!"