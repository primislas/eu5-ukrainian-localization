l_russian:
  game_concept_granadan_sovereignty: "Гранадський суверенітет"
  game_concept_granadan_sovereignty_desc: "Міра свободи самоврядування #ONCLICK:COUNTRY,[GetCountry('GRA').GetKey] #TOOLTIP:COUNTRY,[GetCountry('GRA').GetKey],X [GetCountry('GRA').Custom('CL_GEN')|L]#!#! у ситуації «[ShowSituationName('battle_for_the_strait')]» — протистоянні за участю #ONCLICK:COUNTRY,[GetCountry('CAS').GetKey] #TOOLTIP:COUNTRY,[GetCountry('CAS').GetKey],X [GetCountry('CAS').Custom('CL_GEN')|L]#!#! та #ONCLICK:COUNTRY,[GetCountry('MOR').GetKey] #TOOLTIP:COUNTRY,[GetCountry('MOR').GetKey],X [GetCountry('MOR').Custom('CL_GEN')|L]#!#!. Може набувати значень від #Y 0#! до #Y 100#!.\n\nЩо вищий суверенітет, то сильніша державна влада. Разом із суверенітетом міцнішають [Concept('stability', 'стабільність')|e], щомісячне [Concept('legitimacy', 'право на владу')|e] та [Concept('political_influence', 'політичний вплив')|e], а також [Concept('max_control', 'найвищий контроль')|e] над землями [GetCountry('GRA').Custom('CL_GEN')]. Показник гранадського суверенітету також впливає на вірність [Concept('estates', 'станів')|e] і васалів. Суверенітет зростає, доки зберігаються незалежність і мир, та спадає, якщо країну перетворюють на васала, втягують у війну або ж якщо престол зазнає впливу з боку [GetCountry('CAS').Custom('CL_GEN')] чи [GetCountry('MOR').Custom('CL_GEN')]. Що вищий суверенітет, то більша ймовірність, що [GetCountry('GRA').Custom('CL_DAT')] удасться пережити це протистояння, не втративши незалежности."
  game_concept_gc_colonial_dominance: "Колоніальне панування"
  game_concept_gc_colonial_dominance_desc: "Міра впливу, який має провідна [Concept('country', 'країна')|e] у ситуації «[ShowSituationName('golden_century')]» у Новому Світі. Поступово зростає завдяки колонізації, плаванню флотів зі скарбами та наверненню заморського люду до християнства. Доки триває ситуація, зі зростанням панування відкриватимуться унікальні події та бонуси до доброго імені."
  game_concept_gc_european_dominance: "Європейське панування"
  game_concept_gc_european_dominance_desc: "Міра впливу, який має провідна [Concept('country', 'країна')|e] у ситуації «[ShowSituationName('golden_century')]» у Європі. Поступово зростає завдяки перемогам у континентальних війнах, утриманню ключових володінь, а також родовій та віросповідній зверхності. Доки триває ситуація, зі зростанням панування відкриватимуться унікальні події та бонуси до доброго імені."
  game_concept_flashpoint: "Переломна мить"
  game_concept_flashpoint_desc: "Мить, яка настає, коли ситуація «[ShowSituationName('golden_century')]» досягає критичної стадії. Переломна мить спричиняє подію, здатну змінити всю країну, — на краще чи на гірше: надати потужний бонус, розв’язати міжусобну війну або викликати інші потрясіння, що змінять вигляд країни."