l_russian:
  anr_manual_digest_policy: "Звід законів Фітера"
  anr_manual_digest_policy_desc: "Кодекс Антоні Фітера-і-Росселя зводить до єдиної системи звичаєве право Андорри. Він слугує виразним дороговказом для судів співправління та зміцнює непорушний правовий уклад країни."
  anr_pareatges: "Акт-пареаж"
  anr_pareatges_desc: "Цей установчий договір закріплює подвійний сюзеренітет над Андоррою. Він визначає правові засади врядування в країні, а також обов’язки кожного сюзерена перед цією землею та її людом."
  anr_pareatges_honored_policy: "Дотримання договору"
  anr_pareatges_honored_policy_desc: "Умов акта-пареажа дотримуються в повному обсязі: владу та права обох сюзеренів визнають і шанують усі. Ця хитка рівновага дає змогу зберегти самоврядність Андорри та гарантує сталість її зовнішньополітичного становища."
  anr_pareatges_reinforced_policy: "Зміцнення співправління"
  anr_pareatges_reinforced_policy_desc: "Конституційні підвалини співправління отримали подальший розвиток: правові установи зміцніли, а місцеве самоврядування пустило глибоке коріння. Влада сюзеренів тепер обмежена, але внутрішній лад у країні став від цього лише міцнішим."
  bayaa_shura_council_policy: "Шура"
  bayaa_shura_council_policy_desc: "Складання присяги та клятви вірности #italic байа#! відбувається під наглядом шури — офіційної дорадчої ради з правознавців та знаті. Їхнє схвалення надає передачі влади законної сили в очах усієї мусульманської громади. Одностайне визнання шури міцно зв’язує владу правителя з духовними та шляхетними звичаями країни."
  bayaa_succession_law: "Присяга байа"
  bayaa_succession_law_desc: "#italic Байа#! — це присяга та клятва вірности, якою впливові люди країни (знать, вчені та племінні вожді, що складають раду #italic ахль аль-халль ва-ль-акд#!) підтверджують право нового правителя на владу. Цей закон визначає порядок складання клятви та встановлює, чия думка має вирішальне значення під час обрання наступника."
  bayaa_tribal_assembly_policy: "Племінні збори"
  bayaa_tribal_assembly_policy_desc: "Складання присяги #italic байа#! схвалюється на великих зборах племінних вождів, чия спільна клятва зобов’язує провідні клани коритися новому правителю та гарантує мир і спокій навіть на околицях країни. Визнання з боку вождів зміцнює повагу до правителя серед підданих, однак робить його залежним від волі племінного союзу."
  bled_makhzen_siba_law: "Біляд аль-махзен та біляд ас-сіба"
  bled_makhzen_siba_law_desc: "Марокканський султанат не править усіма своїми землями напряму. В країні вирізняються дві області: #italic біляд аль-махзен#! — землі під владою уряду, де султанські урядовці збирають податки та пильнують за порядком, і #italic біляд ас-сіба#! — бунтівні землі, люд яких визнає духовний авторитет правителя, але люто опирається його податковим зазіханням. Цей закон визначає рівновагу сил між ними."
  cas_alcabala_policy: "Алькабала"
  cas_alcabala_policy_desc: "Цей податок стягується з усіх торгових угод. Він приносить королівській скарбниці великий дохід, але викликає глибоке невдоволення серед купців, оскільки поширюється на всі види обміну та на будь-який проданий у порту крам."
  unlocks_cas_alcabala_tax: "Відкриває доступ до [Concept('government_reform', 'державної реформи')|e] «[ShowGovernmentReformName('cas_alcabala_tax')]»"
  cas_encabezamiento_policy: "Енкабесамієнто"
  cas_encabezamiento_policy_desc: "Замість повного збору #italic алькабали#! міста домовляються про щорічну сплату визначеної суми грошей. Це дає купцям певність у завтрашньому дні, а місцевим зборам дозволяє самостійно розподіляти податковий тягар у межах узгодженої межі."
  cas_fiscal_law: "Кастильський податковий устрій"
  cas_fiscal_law_desc: "Від податкової політики корони залежить рівновага між наповненням скарбниці та добробутом купців і землевласників."
  cat_constitucions_de_catalunya_policy: "Конституції Каталонії"
  cat_constitucions_de_catalunya_policy_desc: "Конституції Каталонії зобов’язують корону поважати закони та вольності підданих: жоден новий закон не можна ухвалити без згоди #italic кортесів#!, чиї рішення спираються на багатовікові правові звичаї."
  centralized_makhzen_policy: "Підпорядкований махзен"
  centralized_makhzen_policy_desc: "Султан розширює пряме врядування країною, відряджаючи каїдів та збирачів податків до віддалених племінних земель і підпорядковуючи місцеві звичаї своїй волі. Скарбниця наповнюється, проте племінні союзи ремствують через побори, вбачаючи в них порушення своїх споконвічних вольностей."
  dhimmi_persecution_policy: "Утиски зімміїв"
  dhimmi_persecution_policy_desc: "На іновірців чинять тиск, аби змусити їх змінити віру або піти у вигнання. Це дає змогу очистити країну від чужих складників і зміцнити становище панівної віри."
  dhimmi_regulations_law: "Статус зімміїв"
  dhimmi_regulations_law_desc: "Правове становище іновірців за ісламського правління визначає уклад співжиття громад і те, який внесок різні народи країни роблять у її розквіт."
  dhimmi_status_policy: "Захист громад зімміїв"
  dhimmi_status_policy_desc: "Іновірці отримують офіційну опіку за приписами шаріату та сплачують #italic джизью#! в обмін на свободу віросповідання. Їхня торгівля збагачує ринки країни, але водночас уповільнює ісламізацію населення."
  fuero_juzgo_policy: "Фуеро Хузго"
  fuero_juzgo_policy_desc: "Стародавній вестготський звід законів, що пережив віки Реконкісти, залишається непорушною основою нашого правосуддя. Він зобов’язує знать коритися закону та утверджує наше право на владу в очах церкви й народу."
  limpieza_de_sangre_law: "Чистота крові"
  limpieza_de_sangre_law_desc: "Статути про чистоту крові (#itaic limpieza de sangre#!) визначають, хто має право обіймати державні посади, вступати до духовних орденів або претендувати на шляхетський титул. Цей закон проводить чітку межу між «старими християнами» та нащадками юдеїв, маврів чи представників інших народів."
  limpieza_mainstream_enforcement_policy: "Поміркований контроль"
  limpieza_mainstream_enforcement_policy_desc: "За чистотою крові (#itaic limpieza#!) пильно стежать урядові установи, а будь-яке просування службою неможливе без ретельної перевірки родоводу. Такий підхід дає змогу дієво підтримувати сформований лад, не вдаючись до надміру жорстких тлумачень закону."
  limpieza_relaxed_enforcement_policy: "Послаблений контроль"
  limpieza_relaxed_enforcement_policy_desc: "Зростання невдоволення реформаторів і практичні потреби торгівлі змушують послабити контроль за чистотою крові. У питаннях просування службою хист і багатство важать тепер значно більше, ніж прискіплива перевірка родоводу."
  limpieza_strict_enforcement_policy: "Суворий контроль"
  limpieza_strict_enforcement_policy_desc: "Чистота крові перевіряється з граничною суворістю, що повністю закриває хрещеним юдеям та морискам доступ до державних посад, церковного служіння та вступу до лицарських орденів. Ці статути зобов’язують усі установи країни суворо стежити за дотриманням головної вимоги — християнського походження."
  mll_dret_civil_policy: "Цивільне право Мальорки"
  mll_dret_civil_policy_desc: "Цивільне право Мальорки спирається на спадщину римського права та каталонські хартії. Воно з граничною точністю регулює питання власності, угод і спадкування, що сприяє розквіту торгівлі та зберігає самобутність наших підданих."
  nav_fueros_policy: "Наваррські фуерос"
  nav_fueros_policy_desc: "Стародавні хартії Наварри захищають права та звичаї її жителів від зазіхань із боку корони. Кожен новий монарх зобов’язаний скласти присягу дотримуватися #italic фуерос#! — лише після цього його влада визнається на всіх теренах королівства."
  negotiated_authority_policy: "Договірна влада"
  negotiated_authority_policy_desc: "Султан править країною не через прямий примус, а на основі порозуміння та взаємного визнання. Він визнає вольності племінних союзів в обмін на формальну покору та військову підтримку. Надходження до скарбниці за такого ладу зменшуються, проте країна зберігає єдність без постійних усобиць через спроби нав’язати свою волю силою."
  gra_learning_haven: "Обитель знань для всіх"
  gra_learning_haven_desc: "Замість того щоб обмежувати освіту віросповіданням, культурними поглядами чи чимось подібним, ми плекатимемо справді освічену країну, яка сприятиме новим науковим відкриттям."
  ara_italian_dual_court: "Подвійний двір в Італії"
  ara_italian_dual_court_desc: "Заснувавши два двори в межах нашої країни, ми зможемо правити обома частинами, не покладаючись на місцеву знать."
  unlock_italian_court_tt: "Відкриває [ShowBuildingTypeName('italian_court_building')] [Concept('building', 'споруду')|e]"