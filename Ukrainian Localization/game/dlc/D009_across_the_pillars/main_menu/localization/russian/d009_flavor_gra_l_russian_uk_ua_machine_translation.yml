l_russian:
  flavor_gra.7.entry: "$flavor_gra.7.title$"
  flavor_gra.7.title: "Визволення міста [ShowLocationNameWithNoTooltip('cordoba')]"
  flavor_gra.7.desc: "[target_location.GetRank.GetName] [target_location.GetName] визволен[Select_CString(EqualTo_string('город', target_location.GetRank.GetName), 'ий', 'а')] в ім’я [ROOT.GetCountry.GetReligion.GetGodName]. Колись важливе місце для $ADU$, тепер це земля, [ROOT.GetCountry.GetReligion.GetAdjective|l]ий вплив якої [target_character.GetName] та [ROOT.GetCountry.GetGovernment.GetCourtTitle] прагнуть відновити."
  flavor_gra.7.a: "Нам слід плекати його [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip|l]е минуле."
  gra_convert_cordoba_to_root_religion: "Частина [Concept('pops', 'громад')|e] у [target_location.Custom('LR_PREP')] [target_location.GetName] навертається до віри [ROOT.GetCountry.GetReligion.GetName]"
  gra_cordoba_province_gains_core: "Кожна [Concept('location', 'місцевість')|e] у провінції [target_location.GetProvinceDefinition.GetName] ([Concept('province', 'провінція')|e]) стає [Concept('core', 'корінною')|e] для #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!"
  flavor_gra.7.b: "Замість того щоб силувати когось до іншої віри, ліпше прийняти їх і залучити до нашого суспільства."
  flavor_gra.8.entry: "$flavor_gra.8.title$"
  flavor_gra.8.title: "Перлина Іберії"
  flavor_gra.8.desc: "У середині краю #TOOLTIP:REGION,iberia_region,X #L Іберія#!#! розташован[Select_CString(EqualTo_string('город', target_location.GetRank.GetName), 'ий', 'а')] [target_location.GetRank.GetName], що здавна слугував осередком [ShowReligionGroupAdjective('christian')|l]ої, [ShowReligionGroupAdjective('muslim')|l]ої та [ShowReligionAdjective('judaism')|l]ої культур. Тепер це місце під нашою владою, і наш [ROOT.GetCountry.GetFlavorRank|l] зможе вирішити його долю.\n\nНаш [ROOT.GetCountry.GetGovernment.GetCourtTitle], як і [target_character.GetName], бажає, щоб цей [target_location.GetRank.GetNameWithNoTooltip] досяг ще більшого розквіту. Зусилля всіх станів було докладено до того, щоб перетворити [target_location.GetName] на перлину Іберії."
  flavor_gra.8.a: "Нехай [ShowLocationNameWithNoTooltip('toledo')] розквітає!"
  flavor_gra.17.entry: "$flavor_gra.17.title$"
  flavor_gra.17.title: "Столиця колишнього халіфату"
  flavor_gra.17.desc: "Престол #TOOLTIP:LOCATION,cordoba,X #L Кордови#!#! здавна мав вагоме значення для #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Колись це був квітучий [ShowLocationRankName('city')] і столиця краю #TOOLTIP:REGION,iberia_region,X #L Іберія#!#!; проте нині його вулиці повні розбою, жителі нарікають на занепад, який спіткав це місто, а численні стародавні пам’ятки так і лишилися в руїнах після наших сутичок із [ShowReligionGroupAdjective('christian')|l]ими володарями.\n\n[target_character.GetName] не з тих, хто дозволить цій пустці тривати. Колись це було славетне місце, де правили наймогутніші володарі континенту #TOOLTIP:CONTINENT,europe,X #L Європа#!#!, то чому б [target_character.GetHerHim] знову не перетворити його на найвеличнішу столицю, яку тільки бачив світ?"
  flavor_gra.17.a: "[ShowLocationNameWithNoTooltip('cordoba')] знову розквітне!"
  flavor_gra.17.b: "Наш [ROOT.GetCountry.GetGovernment.GetCourtTitle] має залишитися там, де він є."
  flavor_gra.21.entry: "$flavor_gra.21.title$"
  flavor_gra.21.title: "Палац-[ShowLocationRankNameWithNoTooltip('city')] міста [ShowLocationNameWithNoTooltip('cordoba')]"
  flavor_gra.21.desc: "Фітна XI століття вкинула [ShowReligionGroupAdjective('muslim')|l]у частину краю #TOOLTIP:REGION,iberia_region,X #L Іберія#!#! у вир безладу, а разом із нею занепали й численні значущі місця. Одним із них був [ShowBuildingTypeName('madinat_al_zahra')] — величний палац на західних околицях міста #TOOLTIP:LOCATION,cordoba,X #L Кордова#!#!. Наповнений пишними мечетями, розкішними садами та міцними казармами, він височів символом зверхності, яку плекав $rank_empire_muslim_ruler_male$ над рештою мусульманського світу.\n\n[target_character.GetName] прагне відновити цей [ShowLocationRankName('city')], піднісши себе над іншими володарями та претендентами, що насмілилися б кинути [target_character.GetHerHim] виклик."
  flavor_gra.21.a: "Вони побачать нашу велич!"
  flavor_gra.21.b: "Немає потреби відбудовувати старі руїни."
  flavor_gra.22.entry: "$flavor_gra.22.title$"
  flavor_gra.22.title: "[ShowBuildingTypeNameWithNoTooltip('library_cordoba')]"
  flavor_gra.22.desc: "Завдяки відновленню споруди [ShowBuildingTypeName('library_cordoba')] жителі міста #TOOLTIP:LOCATION,cordoba,X #L Кордова#!#! переживають нову добу розквіту писемності.\n\nЯк і за давніх часів, вчені з усього [ShowReligionGroupAdjective('muslim')|l]ого світу відвідують [ShowLocationNameWithNoTooltip('cordoba')] заради багатющого зібрання книг із краснописьменства, науки та богослов’я. Це, своєю чергою, принесло достаток містянам, які дізнаються про далекі краї та переймають чимало їхніх звичаїв у повсякденне життя."
  flavor_gra.22.a: "На жителів міста [ShowLocationNameWithNoTooltip('cordoba')] чекає справжній розквіт!"
  add_pop_satisfaction_based_on_literacy: "Кожна [Concept('pop', 'громада')|e] у [Concept('location', 'місцевості')|e] отримає [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] до [Concept('pop_satisfaction', 'задоволення')|e], що залежить від [Concept('literacy', 'письменности')|e] [Concept('pop', 'громади')|e]"
  flavor_gra.23.entry: "$flavor_gra.23.title$"
  flavor_gra.23.title: "Оселище знань для всіх"
  flavor_gra.23.desc: "Наша далекоглядна й новаторська політика дозволила #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_DAT')|L]#!#! стати осередком знань і мудрості. Високо оцінені чужоземними володарями, наші успіхи в науках нині очевидні: все більше гостей прагнуть навчатися в наших уславлених університетах.\n\nСам [ROOT.GetCountry.GetGovernment.GetCourtTitle] нині поповнюється все освіченішими людьми, які прагнуть примножувати вченість, усуваючи зайві перепони всередині самої освіти."
  flavor_gra.23.a: "Ось він, наш поступ!"
  flavor_gra.24.title: "Оплот ісламу"
  flavor_gra.24.desc: "Вістка про нашу звитягу в битві за #TOOLTIP:REGION,iberia_region,X #L Іберію#!#! рознеслася всім [ShowReligionGroupAdjective('muslim')|l]им світом — це вагоме досягнення задля нашого виживання перед лицем будь-якої бурі. Тепер [target_character.GetName] прославляється [ROOT.GetCountry.Custom('preposition_uv')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_PREP')|L]#!#! як герой, оборонець і щит проти ворогів, що прагнуть згасити наше полум’я."
  flavor_gra.24.a: "Зрадіймо ж."
  conquest_of_andalusi_integration_tt: "Захоплення [Concept('locations', 'місцевостей')|e] з [ShowCultureName('andalusi')]ими [Concept('pops', 'громадами')|e] прискорює [Concept('integration', 'інтеграцію')|e] залежно від частки цієї [Concept('culture', 'культури')|e]"