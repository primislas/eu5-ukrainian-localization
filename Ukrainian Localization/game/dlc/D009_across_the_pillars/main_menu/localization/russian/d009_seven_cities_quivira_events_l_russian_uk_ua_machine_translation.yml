l_russian:
  seven_cities_quivira.1.title: "Трави й саман"
  seven_cities_quivira.1.desc: "Після двох місяців мандрів рівнинами загін урешті дістався земель, про які розповідав Ель Турко. Тут справді є поселення — як на мірку цих безкраїх степів, досить велике. Але це не кам’яна столиця, а село з круглими хатинами під стріхами з трави. Вождь — високий чоловік, загорнутий у плащ зі шкури бізона. Його люди вирощують маїс та боби в річкових заплавах, а у відкритому степу полюють на бізонів. Жодного золота тут немає. Під тиском Ель Турко зізнається, що пуебло звеліли йому завести наш загін якнайдалі від своїх земель. [target_leader.GetName] наказує повісити його."
  seven_cities_quivira.1.a: "Відводимо загін. Тут тільки степ — і брехня."
  seven_cities_quivira.1.historical_info: "До літа 1541 року Коронадо дістався Ківіри (сьогодні це — терени штату Канзас). Тут він натрапив лише на поселення землеробів-вічита, що простяглися вздовж річки Арканзас. Жодного золота в Ківірі не було, а були тільки круглі хатини, вкриті травою. Провідник загону — павні на прізвисько Ель Турко — вів людей Коронадо на схід із теренів сучасного штату Нью-Мексико, обіцяючи незліченні багатства. Зрештою він зізнався, що пуебло послали його відвести загін якнайдалі від своїх земель, сподіваючись, що іспанці вже не повернуться. За наказом Коронадо вояки задушили його. Взимку загін рушив назад, і після повернення конкістадор доповів Мендосі, що в цих землях немає нічого настільки цінного, задля чого знадобилося б ціле військо."
  seven_cities_quivira.2.title: "Родюча земля, але ані крихти золота"
  seven_cities_quivira.2.desc: "Землі, що розкинулися перед нами, по-своєму багаті: родючі річкові долини рясно засіяні маїсом, на узліссях пасуться стада бізонів, а місцеві жителі налаштовані миролюбно й готові торгувати з нами. [target_leader.GetName] отримує в дарунок від вождя в’язку зелених річкових каменів, які літописець спершу сприймає за нефрит. Іспанський золотар одразу ж виправляє його: це не нефрит, а якийсь м’який зелений камінь, якого він досі не бачив. Гарний, але майже нічого не вартий у нас на батьківщині. Ні, ми шукали зовсім інші землі, але й тут є чим поживитися. Доведеться перемалювати мапи."
  seven_cities_quivira.2.a: "Візьмемо дивовижні камені додому. Нанесемо ці землі на мапи."
  seven_cities_quivira.2.historical_info: "Офіцери Коронадо писали, що Великі рівнини добре підходять для розведення худоби та вирощування збіжжя, але бідні на крам, заради якого тут варто було б засновувати колонію. Ця думка трималася понад два століття: Іспанія так і не взялася заселяти Великі рівнини, а французькі та британські виправи, які прийшли після неї, будували тут факторії, але аж ніяк не повноцінні поселення. Освоєння краю всерйоз почалося лише наприкінці XIX століття. Досі достеменно невідомо, які саме камені вічита подарували Коронадо. Найімовірніше, це був м’який серпентиніт, що надходив сюди з родовищ на південному заході."
  seven_cities_quivira.3.title: "Справдження легенди"
  seven_cities_quivira.3.desc: "Ель Турко казав правду. Усе тут саме так, як він описував: перед нами — багате царство з обнесеними кам’яними мурами містами, що розкинулися серед річок і безкраїх трав’янистих рівнин. На чолі його стоїть рада вождів, яка збирається у великому дерев’яному будинку, прикрашеному бірюзою. Тут видобувають золото — його крупинки приносять струмки, що стікають із західних гір. В оздобленні вождів є й срібло. Ми показуємо місцевим жителям крам і домагаємося того, щоб священнику дозволили безперешкодно пройти через село. Вони готові прийняти наше посольство. [target_leader.GetName] посилає по підкріплення ще до того, як запечатати перше донесення."
  seven_cities_quivira.3.a: "Підіймемо тут стяг. Ми знайшли те, що шукали."
  seven_cities_quivira.3.historical_info: "Ківіра так і залишилася нездійсненною мрією іспанських аделантадо, які діяли на північ від Нової Іспанії. Легенда оповідала, що це — багате царство, сховане десь у глибині суходолу, і якби воно справді існувало, іспанська корона отримала б вагому причину закріпитися на Великих рівнинах, а історія Північної Америки пішла б зовсім інакше. Міф виявився живучим: європейські картографи наносили Ківіру на мапи приблизно там, де її колись шукали, аж до XVIII століття. На той час французькі торгівці хутром, що осіли в басейні Міссісіпі, вже склали справжні мапи цієї місцевости."
  seven_cities_quivira.10.title: "Два провідники"
  seven_cities_quivira.10.desc: "Перед учасниками виправи стоять двоє жителів Великих рівнин. Їх привезли через океан ще під час одного з колишніх плавань і відтоді утримували коштом портового відомства. На запитання про Ківіру старший — його звуть [target_character.GetName] — відповідає розповіддю про царя, який спить під деревом, прикрашеним золотими дзвіночками, про каное з позолоченими носами та про срібний посуд на столах. Молодший, [second_guide.GetName], на те саме запитання відповідає зовсім інакше: за його словами, Ківіра — це край безкраїх трав’янистих просторів, відкритого неба та повноводних річок. Його народ живе в солом’яних хатинах і полює на горбатих звірів. Вони явно розповідають про різні місця. Взяти із собою ми можемо лише одного."
  seven_cities_quivira.10.a: "Візьмемо із собою старшого. Нам потрібно більше золота."
  seven_cities_quivira.10.b: "Візьмемо із собою молодшого. Він обіцяє мало, тож навряд чи бреше."
  quivira_gold_guide_tt: "[target_character.GetName] приєднується до нас як провідник"
  quivira_grass_guide_tt: "[second_guide.GetName] приєднується до нас як провідник"
  seven_cities_quivira.10.historical_info: "Провідниками для виправи Коронадо слугували двоє полонених індіанців — жителів Великих рівнин. Першого іспанці прозвали Ель Турко; він змальовував Ківіру як багате царство, де правитель спить під деревом, обвішаним золотими дзвіночками, та їсть зі срібного посуду. Іншим був вічита Ісопете, який твердив, що в Ківірі немає жодного золота і що Ель Турко бреше. Загін вирішив повірити Ель Турко — і цей вибір коштував значно дорожче. Як пізніше висловився один із ветеранів виправи, після тисячі ліг шляху особливо хочеться, щоб правдою виявилася найкрасивіша повість."
  seven_cities_quivira.11.title: "Тридцять списів"
  seven_cities_quivira.11.desc: "Попереду простягся цілий суходіл. Навряд чи весь загін зможе перетнути його — на просторах між табором і Ківірою просто не знайдеться стільки харчів. У ліпшому разі припасів вистачить на тридцятьох людей. [target_leader.GetName] розкладає на скрині список присутніх і поіменно вирішує, хто вирушить на північ, а хто залишиться стерегти кораблі та припаси. Кожен у таборі має власну думку щодо цього списку, але всі турботи так чи інакше зводяться до одного: у якій частині аркуша опиниться його власне ім’я."
  seven_cities_quivira.11.a: "Візьмемо тридцятьох вершників і компас. Решта залишиться на березі."
  seven_cities_quivira.11.b: "Рушимо всім загоном — з обозами та стадами. Треба обов’язково показати силу."
  quivira_train_left_behind_tt: "Наші провідники й носії залишаються разом з обозами"
  seven_cities_quivira.11.historical_info: "Діставшись Ріо-Гранде після важкої зими, затьмареної ворожнечею з пуебло, та нелегкої весни, що загрожувала загону голодною смертю, Коронадо відіслав більшість своїх людей назад. Сам же він вирушив до Ківіри лише з тридцятьма вершниками. Безжиттєвою рівниною вони пересувалися за допомогою компаса, щодня відлічуючи пройдену відстань. Звичні способи орієнтування були майже марними на рівнинах: загін, зникнувши з очей, міг безслідно загубитися на одноманітній місцевості, а стада бізонів за кілька годин затоптували будь-яку стежку. І все ж тридцять вершників дісталися Ківіри, здійснивши подвиг, що виявився б не під силу загону з трьохсот людей."
  seven_cities_quivira.12.title: "Море трав"
  seven_cities_quivira.12.desc: "Ця рівнина не має кінця-краю. Уже дванадцять днів загін іде травою, що сходиться за ним, немов вода. Череди горбатих биків, які обступили людей звідусіль, тягнуться до самого небокраю. На четвертий день дороги один з мисливських загонів зник з очей — і відтоді вже не повернувся. Дорогу доводиться позначати купами бізонячого посліду: тут немає ані каміння, ані дерев. Усе, що ми маємо для подорожі, — це компас та відмітки про пройдену відстань."
  seven_cities_quivira.12.desc_false_guide: "Що ширшою стає рівнина, то мовчазнішим робиться провідник. Він більше не рахує, скільки днів лишилося до кінця шляху, і намагається не дивитися у вічі тим, кого веде. Біля вогнищ його оповіді переказують геть з іншим настроєм — у голосах чутно прикрість, і [target_leader.GetName] без зайвих слів подвоює варту біля провідника. У цих краях йому нікуди втікати — і це, либонь, єдине, що ще заспокоює."
  seven_cities_quivira.12.desc_true_guide: "Провідник, який пообіцяв нам замість золота нескінченні трав’яні простори, виявився людиною слова — і навіть більше: він знає рівнину так, як досвідчений керманич знає море. Він пам’ятає, які річки звертають на північ, де йдуть череди і які зорі — дороговказні. Щовечора він малює на попелі для літописця пересування загону, і наступного дня ці позначки незмінно виявляються точними. Золота в його краї немає, запевняє він. Але це не біда — бувають речі й гірші за відсутність золота."
  seven_cities_quivira.12.a: "Підемо за ним."
  seven_cities_quivira.12.b: "Довіримося людині, яка ще жодного разу не збрехала."
  seven_cities_quivira.12.c: "Ідімо на північ, куди вказує стрілка. Рахуватимемо кожен крок."
  seven_cities_quivira.12.historical_info: "Шлях виправи Коронадо Великими рівнинами був, якщо вірити літописцям, схожий на породжене білою гарячкою жахіття: земля була настільки пласкою та одноманітною, що людина, яка від’їхала від загону на політ стріли, одразу губилася з очей. Трава швидко випростовувалася за копитами і не лишала сліду, а орієнтуватися доводилося лише за компасом і поодинокими купами кісток та гною; крім того, неодмінно доводилося рахувати кроки. Коли Коронадо дістався Ківіри, Ель Турко зізнався: пуебло наказали йому завести іспанців подалі, щоб вони заблукали та згинули. Цей задум їм майже вдався: ще трохи — і природа взяла б своє."
  seven_cities_quivira.13.title: "Горбаті звірі"
  seven_cities_quivira.13.desc: "Спочатку розвідники доповідають, що бачать на обрії буру хмару, згодом — що пагорб, який рухається. Опівдні все з’ясовується: перед загоном — незліченна череда кудлатих горбатих тварин, настільки велетенська, що її годі описати словами. Череда розступається перед людьми, немов річкові води об камінь, а потім знову сходиться і тягнеться аж до небокраю. Шафар веде свого коня навмисно повільно; він не рахує кроків, не каже й слова, а лише озирається з поглядом зголоднілої людини, яка зненацька опинилася в коморі розміром із цілу провінцію."
  seven_cities_quivira.13.a: "Зробимо зупинку і полюватимемо, поки не наповнимо в’юки м’ясом."
  seven_cities_quivira.13.b: "Пройдемо наскрізь. Ми полюємо на золото; тварини нас не цікавлять."
  seven_cities_quivira.13.b.tt: "#italic Колона йде вперед без зупинки. Загін змушений їсти солонину, хоча навколо повно дичини#!"
  quivira_hides_and_meat_tt: "#Y В’юки наповнені шкурами та в’яленим м’ясом. Носії понесуть їх назад#!"
  seven_cities_quivira.13.historical_info: "Літописцям виправи Коронадо було важко дібрати слів для опису бізонів. Цих тварин змальовували як горбатих корів із бородами, наче в кіз; череди їхні були настільки незліченними, що могли затримати виправу на кілька днів, а там, де проходили бізони, лишалася тільки витоптана земля. У дорозі загін Коронадо харчувався переважно саме бізонячим м’ясом — тварин, настільки дивовижних для іспанців, що, за спогадами ветеранів, вони викликали навіть більший подив, ніж Ківіра. Дехто навіть стверджував, що єдине багатство цих земель — саме бізони. Втім, Іспанії й так не бракувало власної худоби."