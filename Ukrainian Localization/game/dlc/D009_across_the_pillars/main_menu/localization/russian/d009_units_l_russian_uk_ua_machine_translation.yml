l_russian:
  a_ahl_tinmal_spearmen: "Тінмальські списники"
  a_ahl_tinmal_spearmen_desc: "Тінмальські списники походять з Атлаських гір, а саме з Тінмаля — гірського поселення, де колись стояв табір Мухаммада ібн Тумарта, а згодом і його гробниця, яку пізніше зруйнували Мариніди. Спочатку вони брали до своїх лав лише одноплемінців із власного племені харга, але згодом почали приймати й інших представників конфедерації масмуда. Їхній повстанський рух фактично воював з усією державою: до 1120-х років альморавідська влада видавала суперечливі накази, а в її військах Альморавідів і зовсім не лишилося. Ці списники заклали підвалини халіфату, про який нинішня країна масмуда з гордістю згадує як про імперію, що об’єднала західний ісламський світ."
  a_caballeria_de_cuantia: "Кастильська кіннота"
  a_caballeria_de_cuantia_desc: "Кастильська кіннота — це кінне ополчення з добре вишколених і заможних чоловіків нешляхетного походження, здатних власним коштом утримувати коня та спорядження. Ці легкі вершники, що застосовують у бою тактику #italic хінетів#!, є проміжною ланкою між знатними лицарями та пішими міськими ополченцями. Надавши цим воякам певні привілеї та податкові пільги, корона змогла зібрати багато досвідчених і порівняно дешевих вершників, які нині утворюють костяк кастильської кінноти."
  a_coronelias: "Коронелії"
  a_coronelias_desc: "Коронеліями називали піхотні з’єднання, які Гонсало Фернандес де Кордова створив у добу Італійських воєн. Кожна коронелія складалася з кількох загонів пікінерів, мечників та аркебузирів під командуванням одного полковника. Замість кидатися в бій усім гуртом, різні роди військ посідали своє визначене місце в строю. Славетні #italic терції#! тоді ще не з’явилися (це сталося пізніше в Генуї), проте їх створили саме на основі коронелій із вояків, які мали досвід таких боїв."
  a_granadan_crossbowmen: "Гранадські арбалетники"
  a_granadan_crossbowmen_desc: "Свою зброю гранадські арбалетники не успадкували від пращурів, а перейняли в сусідів: Ібн Худайль у листі Мухаммаду V назвав її #italic кадіб афранджі#! — тобто франкський лук. Колись ми захоплювали арбалети як здобич у порубіжних війнах, а тепер наші власні майстерні виготовляють їх у цілком достатній кількості. На відміну від лучника, який навчається все життя, арбалетника можна вишколити за один сезон, а пущений ним сталевий болт пробиває обладунки, здатні зупинити стрілу."
  a_granadan_jinetes: "Гранадські хінети"
  a_granadan_jinetes_2: "Сучасні гранадські хінети"
  a_granadan_jinetes_2_desc: "Військове мистецтво гранадських хінетів удосконалювалося впродовж багатьох поколінь, що врешті призвело до появи ще грізнішої кінноти. На додачу до дротиків сучасні хінети озброєні кольчугами та довгими списами, проте тактика швидких ударів та вдаваних відступів і далі лишається головною рисою гранадської легкої кінноти."
  a_granadan_jinetes_desc: "Народжені на полях андалуських порубіжних воєн хінети використовують у бою дротики, короткі мечі та круглі шкіряні щити, а їхні коні не мають обладунків. Хінети нав’язали Піренейському півострову свій поступ війни, запозичивши в берберів тактику швидких набігів, яку невдовзі перейняли й інші сусідні країни."
  a_guich_cavalry: "Гішська кіннота"
  a_guich_cavalry_desc: "Гішську кінноту набирають із берберських та арабських племен #italic гіш#!, які отримали від марокканського султана землі й натомість зобов’язалися виставляти йому вершників під час війни. Ця угода дозволила нам створити постійне кінне військо, що зберігає вірність особисто султанові, а за умов політичної роздроблености ця якість робить гішську кінноту ціннішою за будь-яке призовне чи наймане військо. Тепер ці добре навчені та споряджені вояки підтримують лад на межі між землями мазгабу та непокірними провінціями, а також очолюють походи проти бунтівних племінних союзів."
  a_hermandad_infantry: "Піхотинці ермандади"
  a_hermandad_infantry_desc: "За своєю суттю ці піхотинці є звичайними ополченцями з братства святої ермандади — військового союзу, створеного спеціально для підтримання порядку на просторих теренах Кастилії. Проте, на відміну від феодальних ополчень минулих століть, ці вояки підпорядковуються не місцевим сеньйорам, а міським радам і королівським магістратам. Завдяки цьому вони мають кращий вишкіл, дисципліну та спорядження, що робить їх значно надійнішим засобом у руках централізованої держави, ніж наспіх зібране феодальне військо."
  a_hilali_bedouin_cavalry: "Хілялійська кіннота бедуїнів"
  a_hilali_bedouin_cavalry_desc: "Хілялійська кіннота складається з легких вершників арабських племінних союзів Бану Хіляль та Бану Сулейм, які в XI столітті перекочували з Верхнього Єгипту до Магрибу. Унаслідок цього переселення берберська більшість у центральному та східному Магрибі поступилася арабській, а разом із тим змінився й уклад життя всього регіону. Нині ці вершники служать нам як допоміжне військо, самі призначають своїх ватажків і власним коштом утримують коней, отримуючи натомість частку військової здобичі. Завдяки швидкості, рухливості та великій чисельності ці бедуїнські підрозділи чудово доповнюють наше військо, а власні запаси дозволяють їм уникати суперництва за новобранців із племінними союзами берберів."
  a_infanteria_de_marina: "Морська піхота"
  a_infanteria_de_marina_desc: "Морська піхота приписана до військових кораблів кастильського флоту. Ці бійці беруть на абордаж ворожі кораблі, очолюють висадки та йдуть на приступ берегових укріплень. Постійні роти морської піхоти, зведені в #italic терції#!, здатні однаково дієво битися як на палубі галеона, так і на стінах прибережних фортець, що робить їх воістину незамінним знаряддям для зміцнення нашої могутності на морі та на чужоземних берегах."
  a_kabyle_skirmishers: "Кабільські застрільники"
  a_kabyle_skirmishers_desc: "Кабільські застрільники живуть серед гірських хребтів Джурджура та Бабор на схід від Алжира. Ці відважні берберські вояки впродовж двох тисяч років відбивали напади римлян, вандалів, арабів та іберійців на свої землі. Озброєні дротиками, вони влаштовують засідки на ворожі колони, а потім зникають у горах, де жодне велике військо не здатне їх переслідувати. Кабільська тактика гірської війни дає магрибським військам великий простір для маневру та флангових нападів у скелястій і лісистій місцевості, де постійна піхота майже безсила."
  a_masmuda_atlas_infantry: "Масмудські піхотинці Атласу"
  a_masmuda_atlas_infantry_desc: "Ці берберські піхотинці родом з Атлаських гір озброєні важкими списами та луками. Завдяки залізній дисципліні вони стали опорою альмохадського війська, яке в XII столітті успішно підкорило значну частину Магрибу та Іберійського півострова. Багато в чому саме завдяки службі в імперському війську Альмохадів вони навчені битися в щільному строю, пристосованому до гірських боїв і сутичок із важкою християнською кіннотою. Ця військова спадщина позначилася на військах магрибських країн, чиї важкі піхотинці тепер можуть дати відсіч будь-якій кінноті."
  a_mesnaderos: "Меснадерос"
  a_mesnaderos_desc: "Меснадерос — це важкоозброєні лицарі, які безпосередньо підпорядковуються монархам Наварри й Арагону. Як воїни #italic меснади#!, вони пов’язані прадавніми звичаями, що зобов’язують їх вірно служити своєму панові. Хоч зазвичай ці досвідчені лицарі належать до особистого почту монарха, вони цілком здатні битися там, де феодальному ополченню бракує швидкості та дисципліни."
  a_milicia_concejil: "Муніципальне ополчення"
  a_milicia_concejil_desc: "Ці дружини перебувають на службі у кастильських та леонських #italic консехос#! — муніципалітетів, які згідно з королівським указом зобов’язані готувати та споряджати бійців для оборони місцевих земель і порубіжжя. Набрані з міських купців і ремісників, ці ополчення є досить дешевим і доступним військом, яке попри всі свої вади чудово знає місцевість і готове до останнього боронити рідні краї."
  a_milicia_irmandinha: "Ірмандадське ополчення"
  a_milicia_irmandinha_desc: "Народне військо, зібране #italic ірмандадами#! — збройними братствами, які в середині XIV століття об’єднали безліч галісійських міст і підняли повстання проти знаті. Ці легкоозброєні, проте надзвичайно відважні бійці уособлюють солідарність містян і дрібних землевласників, які втомилися від свавілля можновладців і вирішили скинути із себе сеньйорське ярмо."
  a_miquelets: "Мікелети"
  a_miquelets_desc: "Мікелети — це нерегулярні загони піхоти, загартовані в суворих каталонських горах. Вони впродовж багатьох поколінь служили місцевим сеньйорам і кастильським монархам, боронячи гірські перевали Піренеїв та скелясті кручі східного узбережжя Каталонії. Значно перевершуючи постійні війська в рухливості, мікелети досягли неабиякої вправності в засідках і нападах. Вони вміло обертають місцевість на свою користь, завдаючи ворогам виснажливих ударів і миттєво зникаючи в горах, де почуваються якнайвільніше."
  a_mulaththamun_spearmen: "Списники-мулаттамуни"
  a_mulaththamun_spearmen_desc: "Списники-мулаттамуни із західносахарського племінного союзу санхаджа звуться так через #italic лісами#! — особливі головні пов’язки, з якими вони не розлучаються ніколи. Плем’я ламтуна особливо уславилося своїми воїнами, які б’ються в щільному строю й суворо дотримуються малікійського вчення Ібн Ясіна. Під знаменами Юсуфа ібн Ташфіна вони пройшли від сахарських ергів до долини Ебро. У першому ряду їхнього строю стоять воїни з довгими піками, а позаду — метальники дротиків; усі вони носять щити-#italic ламти#! зі шкури орикса, а також пов’язки, що приховують усе обличчя, крім очей. Їхній незламний бойовий дух тримається на ревності у вірі, з якою не зрівняється жоден мирський військовий звичай. Імперія, що породила їх, давно впала, але Магриб ніколи не забуде їхньої безстрашності, а санхаджа й досі навчає загони цих важких піхотинців."
  a_mutatawwia: "Мутатавві"
  a_mutatawwia_desc: "#italic Мутатавві#! — це добровольче святе воїнство на службі в Насрідів. Ці набожні люди беруть участь у щорічних набігах не заради грошей, а заради обіцяного раю та змоги брати участь у грабунках. Вони легко озброєні й прудкі, що дозволяє їм зі списом і мечем нападати на лави християн, а потім зникати в горах. Завдяки цьому вони вважаються найбільш непередбачуваними та лютими ополченцями Гранади."
  a_sanhaja_camel_cavalry: "Верблюжа кіннота санхаджа"
  a_sanhaja_camel_cavalry_desc: "$a_sanhaja_camel_cavalry$ — полки легкої верблюжої та кінної сторожі, що складаються з воїнів сахарських племен союзу санхаджа: ламтуна, ґудала та масуфа. Саме ці воїни, зодягнені в головні убори, що закривають обличчя, в XI столітті допомогли заснувати імперію Альморавідів, яка простяглася всім Західним Магрибом та Іберією. Їхні верблюди здатні долати пустелею величезні відстані, недосяжні для звичайної кінноти, а натиск із легкими списами напереваги не поступається смертоносністю нападам важкоозброєної кінноти Іберії та Центрального Сахелю. Завдяки кінноті санхаджа обозні та маневрові спроможності нашого війська на південному кордоні зростають у рази."
  a_sometent: "Сометент"
  a_sometent_desc: "$a_sometent$ — міське та сільське каталонське ополчення. Слово #italic «сометент»#! з каталонської мови можна перекласти як «дзвін» — саме так скликають усіх здатних тримати зброю, коли кордон під загрозою. Цей простий люд, озброєний списами та щитами, готовий віддати життя за своє вогнище й рідне село, а тому здолати його важко навіть досвідченим нападникам."
  a_alabarderos: "Алабардерос"
  a_alabarderos_desc: "$a_alabarderos$ — королівська гвардія Кастильської корони, озброєна алебардами. Ці воїни несуть насамперед церемоніальну службу: вони не лише охороняють вінценосних осіб, а й прикрашають королівський двір."
  a_guardias_de_ornato: "Церемоніальна гвардія"
  a_guardias_de_ornato_desc: "$a_guardias_de_ornato$ — парадні гвардійці Кастильської корони, озброєні алебардами. Ці пишно вбрані воїни — наступники алабардерос; їхнє завдання — супроводжувати вінценосних осіб, оберігаючи їх від ворогів за допомогою списів та алебард."
  a_thagri: "Сагрійці"
  a_thagri_2: "Пізні сагрійці"
  a_thagri_2_desc: "Багаторічна служба перетворила сагрійців із простих вояків на спадкових оборонців порубіжжя. Вміння марширувати вони ввібрали з молоком матері, знання доріг і перевалів перейняли від дідів, а стройовий вишкіл — від батьків. Живуть вони по-селянськи просто, на скромну платню, але при цьому здатні місяцями тримати гірські рубежі там, де лицарське військо не протримається й кількох тижнів."
  a_thagri_desc: "#italic Сагрійці#! — це піші списники, яких набирають із сіл у прикордонних провінціях, #italic суґурах#!. Вони знають кожен перевал і струмок на рубежах Аль-Андалусу. Завдяки селянському харчуванню їхній вишкіл обходиться дешево, вони здатні тижнями виживати на пайках, яких кастильським військам вистачило б на кілька днів, і готові виступати за першим же сигналом. Їхня зброя нехитра, а платня мізерна, проте жодне воїнство в Іберії не зрівняється з ними стійкістю на гірських рубежах."
  a_tornadizos: "Торнадісос"
  a_tornadizos_2: "Пізні торнадісос"
  a_tornadizos_2_desc: "Поселенці-торнадісос служать у важкій кінноті, що вишколом та озброєнням не поступається найкращим лицарським орденам Іберії. За минулі десятиліття їхні списи стали довшими, обладунки — міцнішими, а чисельність перестала залежати від обставин на порубіжжі. Андалуська важка кіннота нарешті набула сили й подоби справжнього війська та б’ється під нашими знаменами проти тих королівств, чий військовий уклад колись слугував їй взірцем для наслідування."
  a_tornadizos_desc: "Торнадісос — перебіжчики з християнських королівств, які воліють служити по інший бік кордону. У бою ці вершники, вдягнені в обладунки та озброєні списами, діють так само, як кастильські й арагонські #italic жандарми#!, — з тією лише різницею, що б’ються вони під зеленими знаменами нашого емірату, пліч-о-пліч із гранадськими хінетами. Набирати торнадісос нелегко: перебіжчиків мало, але кожен вояк, навчений християнської військової справи, лише допомагає зміцнювати бойову міць нашої кінноти, і здолати її спроможні геть небагато хто."
  a_tuareg_camelry: "Туарезька верблюжа кіннота"
  a_tuareg_camelry_desc: "$a_tuareg_camelry$ — вершники на стрімких #italic мехарі#! з глибин Сахари. Її основу складають юні воїни з кланів сахарських конфедерацій — Кель-Ахаггар, Кель-Аїр та Івеллеммеден. Вони пересуваються верхи на навмисне виведених для швидкого бігу дромадерах, здатних із дивовижною швидкістю перетинати піски й кам’янисті рівнини. У бою туареги атакують ворога довгими списами, а після удару беруться за мечі #italic такуба#!, щоби добити супротивника. Завдяки винятковій витривалості — верблюди можуть три дні обходитися без води, чого не скажеш про коней, — верблюжій кінноті немає рівних у питанні контролю над шляхами через Сахару. Рухливі загони туарегів — головна сила наших конфедерацій: вони можуть і вчинити набіг, і пройти дозором там, де зупиниться кіннота."
  a_zenata_cavalry: "Вершники зената"
  a_zenata_cavalry_desc: "$a_zenata_cavalry$ — легка кіннота берберської конфедерації зената: племен Бану Марін, Бану Абд аль-Вад та Маграва. Вони змалку звикли до кочового життя й чудово знають, як вести швидкий бій у пустелі та степу. Кожен вояк споряджає себе сам: у нього свій кінь, зброя й загін одноплемінців, тому для збору не потрібні ані королівські арсенали, ані роки вишколу. У розпорядженні магрибських султанів — швидкі та рухливі ударні загони, за якими не здатна встигнути ані християнська, ані східна мусульманська кіннота."
  n_carraca_portuguesa: "Португальська каракка"
  n_carraca_portuguesa_desc: "$n_carraca_portuguesa$ — запорука нашої сили та впливу на сході. Цей важкий, величезний багатопалубний корабель здатний витримати навіть найсуворішу бурю на шляху до Індії, обігнути мис Доброї Надії та повернутися назад із шовками та прянощами з країн Індійського океану. Наїжачені безліччю гармат каракки, що везуть сотні вояків, — справжні плавучі фортеці, завдяки яким Португалія зуміла прокласти нові торгові шляхи та поширити свій вплив далеко за межі країни."
  n_galeota_andalusi: "Андалуський галіот"
  n_galeota_andalusi_desc: "$n_galeota_andalusi$ — швидка веслова галера андалуських корсарів, створена не стільки для тривалих битв у лінійному строю, скільки для раптових нападів. На борту таких кораблів служать досвідчені моряки з портів Гранади та з південних берегів. Андалуські галіоти — гроза християнських рибальських сіл і торгових шляхів: вони завдають удару перш ніж ворог устигає підготувати оборону, і йдуть за вітром, поки не надійшла підмога."
  n_ghurab_maghribi: "Магрибський гураб"
  n_ghurab_maghribi_desc: "Назву #italic гураб#!, що означає «ворон», має довга веслова галера, яка замість важких гармат укомплектована великою абордажною командою. Такі галери споруджуються на корабельнях Сале, Бадіса й Хунайна, а моряками на них служать вихідці з прибережних племен Магрибу. Гурт гурабів здатен швидко наздогнати торговий корабель і взяти його на абордаж раніше, ніж його команда встигне стати до оборони. Завдяки звичаю веслових піратських кораблів у кожного магрибського султана був флот, спроможний боротися за протоки та прибережні морські шляхи без залучення коштовних гармат."
  n_nao_castellana: "Кастильське нао"
  n_nao_castellana_desc: "$n_nao_castellana$ — величезний торговий корабель Кастильської корони, здатний при цьому відповісти потужним гарматним вогнем. Завдяки широкому корпусу та високим надбудовам #italic нао#! можуть не лише перетнути світовий океан, а й дати відсіч будь-якому ворожому флоту — для цього на борту завжди є вдосталь гармат і вояків. Саме на таких кораблях здійснювалися великі географічні відкриття, і саме в їхніх трюмах багатства Нового Світу потрапляють до Кастилії."
  n_sale_rover: "Салейський піратський корабель"
  n_sale_rover_desc: "$n_sale_rover$ — легкий вітрильний корабель корсарів республіки Бу-Регрег, із малою осадкою та високою швидкістю. Такі кораблі споруджують на корабельнях Сале й Рабата біженці-орначеро та мориски — жителі вільного корсарського міста, що розкинулося в гирлі річки. Їхні капітани полюють в Атлантиці на кораблі, що плавають біля берегів Іберії, Канарських островів і Західного Середземномор’я, і здатні втекти від будь-якого багатогарматного галеона, що кинувся навздогін. Наша країна має цілий флот стрімких корсарських кораблів, яким немає рівних серед інших піратів."
