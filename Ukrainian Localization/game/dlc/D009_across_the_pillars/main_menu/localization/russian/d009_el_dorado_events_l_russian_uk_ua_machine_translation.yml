l_russian:
  d009_el_dorado_events.1.title: "Вельми сумнівна мапа"
  d009_el_dorado_events.1.desc: "До нашого багаття вийшли двоє чоловіків. Вони тримаються з невимушеністю та впевненістю бувалих пройдисвітів: можливо, це дезертири, ошуканці чи втеклі в’язні. Їхня розповідь щоразу трохи змінюється, та незмінною лишається мапа, яку вони принесли з собою. Цей засмальцьований клапоть шкіри рясніє золотими озерами, горами з чистого срібла та неймовірно величними містами. Вони життям клянуться, що мапа точна, та наш сержант зазначає, що саме тому не дав би за неї й шеляга. І все ж це єдина мапа, яку ми маємо. Хибний слід, яким сміливо ступають уперед, завів багато виправ далі, ніж праведний шлях, від якого зі страху відмовилися."
  d009_el_dorado_events.el_dorado_desc: "Легенда про Ельдорадо (ісп. el dorado — «позолочений») виникла на основі дійсного звичаю народу муїска, що мешкав на нагір’ї Колумбії. Під час цього священнодійства нового правителя вкривали золотим пилом і вивозили човном на озеро Ґуатавіта. Там правитель кидав у води озера дари богам — золото та смарагди. У переказах іспанських, а згодом і англійських відчайдухів образ «позолоченої людини» роздувся до розмірів золотого міста, схованого королівства і зрештою перетворився на цілу загублену імперію у найдикіших нетрях континенту — від Анд до Оріноко та лісів Гвіани. На пошуки Ельдорадо вирушило ціле покоління: Хіменес де Кесада, Белалькасар, Ґонсало Пісарро та Франсіско де Орельяна. У своїй фатальній виправі Пісарро та де Орельяна не знайшли золота, проте стали першими європейцями, які здійснили сплав Амазонкою. Пізніші виправи нерідко закінчувалися заколотами, найвідомішим із яких стало повстання Лопе де Аґірре. Інші ж непосильною працею осушували саме озеро Ґуатавіта, витягаючи ціною неймовірних зусиль самі дрібнички. Жодного королівства так і не знайшли, адже його ніколи не існувало. Легенда пережила всіх, хто загинув, женучись за нею."
  d009_el_dorado_events.1.a: "Це найкраща мапа з усіх, що ми маємо. Рушаймо за нею."
  d009_el_dorado_events.1.b: "Прогнати шельмів геть."
  d009_el_dorado_events.1.b.tt: "#italic Ми прогнали шельмів геть і продовжили шлях без їхньої засмальцьованої мапи#!"
  new_location_grants_clue_for_el_dorado: "#Y [target_new_waypoint.GetName] підказує, де шукати Ельдорадо#!"
  cartographer_cannot_read: "#Y [Concept('expedition', 'Виправа')|e] затримується через неписьменність картографа#!"
  gasp_its_a_trap: "#Y [Concept('expedition', 'Виправа')|e] зненацька обривається: нам влаштували засідку!#!"
  will_reduce_our_chances_to_uncovering_goal_tt: "Це зменшить імовірність знайти шукане"
  d009_el_dorado_events.2.title: "Орієнтири свідчать про інше"
  d009_el_dorado_events.2.desc: "Цього разу мапа та місцевість майже збігаються. Витесаний ідол височіє на хребті саме там, де й показує пергамент, — навіть кам’яна щелепа випирає так, як і має бути. Але велетенський водоспад, який мав би гуркотіти на схід від нього, натомість спадає на захід, а дві вершини за ним узагалі стоять у геть іншому порядку. Картограф або був недбалим, або змалював місце лише з чужих слів. Або ж самі ці краї нам описали з тим розрахунком, щоб ми назавжди в них заблукали. [target_leader.GetName] знову й зноround перевертає пергамент, ніби сподіваючись побачити на звороті відповіді на свої питання."
  d009_el_dorado_events.2.a: "Мапа достатньо точна. Рушаймо далі."
  d009_el_dorado_events.2.b: "Ми не підемо наосліп хибним слідом."
  d009_el_dorado_events.2.b.tt: "#italic Ми викинули підробку й довірилися власним очам#!"
  the_expedition_doublebacks: "#Y [Concept('expedition', 'Виправа')|e] повертається вже пройденим шляхом, гаючи дорогі дні#!"
  press_on_regardless: "#Y Ми продовжуємо шлях, довіряючи мапі більше, ніж власним очам#!"
  extort_locals: "#Y Ми силою забираємо в місцевих припаси та вибиваємо з них відомості#!"
  d009_el_dorado_events.3.title: "Саме те, що ми мріяли почути"
  d009_el_dorado_events.3.desc: "Бранець, що тремтить від страху, розповідає нам усе те, що й хоче почути [target_leader.GetName]: так, золотий володар існує; так, його двір розташований лише за кілька днів ходи вгору річкою; так, навіть дахи там укриті золотом, яке щовесни знімають і переплавляють. Дивовижна історія: цей чоловік, що дивиться на нас широко розплющеними очима, ніби справді розуміє, заради чого ми подолали цілий материк. Наш тлумач тихо застерігає: «[target_leader.GetName], він присягнеться в чому завгодно — навіть у тому, що небо зелене, аби лиш відвести озброєних чужинців від свого села». Проте кожне його слово — це саме те, що нам і жадалося почути."
  d009_el_dorado_events.3.a: "Змусити його розповісти більше."
  d009_el_dorado_events.3.b: "Винагородити за чесність, а не пусті слова."
  d009_el_dorado_events.3.c: "Витиснути з бранця всю правду."
  guide_told_us_what_we_wished: "#Y Провідник зізнався, що говорив лише те, що ми хотіли почути. Шлях завів нас у нікуди#!"
  fear_loosens_the_guides_tongue: "#Y Страх зробив провідника говіркішим, і його слова звучать правдиво#!"
  forced_confession_breeds_hatred_tt: "Наше [Concept('cultural_opinion', 'ставлення до культури')|e] місцевости [target_location.GetDominantCulture.GetName|l] погіршиться"
  d009_el_dorado_events.4.title: "Винагорода, варта затримки"
  d009_el_dorado_events.4.desc: "Вивідувачі повернулися, задихаючись від хвилювання. Лише за добу ходи вбік від нашого шляху, в долині, яку ми мали б оминути, лежить місто, багатше за все, що ми бачили від миті висадки на узбережжі. Терасовані ниви, вщерть забиті комори, золоті прикраси на шиях його жителів! Так, це не Ельдорадо, і відхилення від шляху заради цього міста коштуватиме нам цілих тижнів, яких зараз і так обмаль, але наш люд уже побачив цей блиск. Загін, який проходить повз зриме золото в пошуках золота, про яке лиш чув, — це загін, який починає ставити своєму ватажкові незручні запитання."
  d009_el_dorado_events.4.a: "Вирушити до багатого поселення"
  d009_el_dorado_events.4.b: "Узяти лише те, що нам запропонують добровільно"
  d009_el_dorado_events.4.c: "Не звертати зі шляху"
  d009_el_dorado_events.4.c.tt: "#italic Ми залишили зриме золото позаду. Ми віримо, що обіцяне золото чекає на нас попереду#!"
  a_modest_haul: "#Y Ми трохи поповнили свої скрині в цьому поселенні#!"
  a_peaceful_exchange: "Обмін пройшов мирно, і тепер ми повернемося додому з більшим здобутком"
  d009_el_dorado_events.5.title: "Добре пильнований скарб"
  d009_el_dorado_events.5.desc: "За лісами лежить місцевість, яку провідники обходять десятою дорогою: обнесене мурами святилище, чиї ворота окуті майстерно виробленим золотом, а на парапетах стоїть мовчазна варта. Що б не ховалося всередині, воно вочевидь настільки коштовне, що заради його захисту тут готові вбивати, а отже, як вважають наші офіцери, багатства святилища варті того, щоб їх захопити. Полководець [target_leader.GetName] окидає поглядом ряди своїх списників, порівнює їхні сили з міццю воріт і розуміє, що ваги схиляються геть не на нашу користь. Золото поруч — достатньо лише простягнути руку, але платити за нього доведеться зовсім не сріблом."
  d009_el_dorado_events.5.a: "Узяти скарб силою."
  d009_el_dorado_events.5.b: "Обережно попросити собі частку."
  d009_el_dorado_events.5.c: "Облишити цей задум — охорона надто дужа."
  d009_el_dorado_events.5.c.tt: "#italic Ми порівняли міць мурів із цінністю здобичі й вирішили залишити все як є#!"
  the_hoard_is_seized: "#Y Ми захопили скарб і повернемося додому далеко не з порожніми руками#!"
  a_wary_bargain: "Ми ґречно попросили, і з нами трохи поділилися"