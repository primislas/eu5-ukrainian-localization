l_russian:
  seven_cities_saguenay.1.title: "Доннакона розповідав небилиці"
  seven_cities_saguenay.1.desc: "Після трьох місяців підйому Сагенеєм загін нарешті дістався земель, про які Доннакона шістдесят років тому розповідав Картьє. Стадаконський вождь запевняв, що тут живуть світлошкірі люди в хутряному вбранні, гори повні золота, а в річках тече срібло. Насправді край виявився зовсім іншим: кам’янистим, лісистим і холодним. Жодних світлошкірих людей тут немає, як немає й золота в струмках. Мисливці-інну, яких зустрічає загін, охоче торгують хутром, але ніхто з них не чув про жодні багаті царства. [target_leader.GetName] доходить єдиного висновку: Доннакона розповів Картьє лише те, що той бажав почути, сподіваючись, що його візьмуть до Франції та дозволять повернутися додому живим."
  seven_cities_saguenay.1.a: "Загін рушить далі. Тут немає жодного царства — є тільки хутро."
  seven_cities_saguenay.1.historical_info: "Стадаконський вождь Доннакона, який жив у верхів’ях річки Святого Лаврентія, протягом зими 1535 — 1536 років розповідав Картьє про багате царство Сагеней, нібито розташоване десь у глибині Нової Франції. Навесні Картьє відвіз Доннакону до Франції, представивши його як гостя корони. Додому йому вже не судилося повернутися: у Франції вождь помер. Легенда про Сагеней ще довго спонукала французьку корону споряджати нові виправи вглиб материка аж до кінця XVII століття — на той час її поступово витіснили дійсні відомості про цей край: було добре досліджено та нанесено на мапу озера й річки, а торгівля хутром засвідчила, чим насправді багаті ці землі."
  seven_cities_saguenay.2.title: "Індіанська конфедерація та хутро"
  seven_cities_saguenay.2.desc: "Відкриті нам землі — зовсім не легендарний Сагеней, проте вони все ж заслуговують на увагу. Уздовж верхньої течії річки та на берегах далеких озер у розрізнених поселеннях живуть інну. Для мисливців тут справжнє роздолля: весь ліс — їхні угіддя. Інну торгують хутром, в’яленою рибою, берестяними каное й трохи — самородною міддю, яку видобувають на північ звідси. Вони готові прийняти французьке посольство. Ані золота, ані срібла, ані світлошкірого короля тут немає, зате є справжня й цілком здорова торгівля хутром. [target_leader.GetName] наказує побудувати біля злиття річок факторію."
  seven_cities_saguenay.2.a: "Побудуємо факторію. Торгівля хутром покриє всі витрати."
  seven_cities_saguenay.2.historical_info: "Басейни річок Святого Лаврентія та Сагенею стали брамою для французької торгівлі хутром. Протягом XVII — початку XVIII століть саме цими річками купці, місіонери та поселенці просувалися вглиб Північної Америки. Торгівля трималася насамперед на місцевих посередниках (передусім гуронах-віандотах та алгонкінах) і на мережі факторій, яка поступово розширювалася на захід у бік басейну Міссісіпі через Великі озера. У цьому сенсі легенда про Сагеней виявилася пророцтвом, що справдилося само собою: багатства, які шукали на материку, виявилися не золотом, а хутром, і зрештою саме торгівля ним принесла Франції справжній добробут."
  seven_cities_saguenay.3.title: "Знайдено північне царство"
  seven_cities_saguenay.3.desc: "Легендарні землі справді існують: сюди щойно ступив наш загін. За другим великим озером, у краї, який інну називають Холодною землею, стоїть поселення приблизно на три тисячі людей — світлошкірих, одягнених у довге хутряне вбрання. Вони розмовляють мовою, якої ніхто з нас досі не чув, але мовознавець, який знає латину, стверджує, що це — давньоскандинавська. З визначних споруд тут — дім ради з мідним дахом та невелике ритуальне святилище, де виставлено золоті вироби явно північноєвропейської роботи. Про нашу появу на узбережжі тут знають не перше десятиліття; весь цей час люди терпляче чекали, поки ми їх знайдемо. Літописець цілу ніч не випускає з рук пера. На світанку [target_leader.GetName] посилає по підкріплення."
  seven_cities_saguenay.3.a: "Підпишемо угоду. Ми знайшли загублену християнську країну."
  seven_cities_saguenay.3.historical_info: "Легенда про скандинавське поселення в глибині Канади не знайшла підтвердження, попри періодичні заяви про протилежне. Скандинави, що селилися в Гренландії, покинули острів у XV столітті, а археологічних свідчень їхнього постійного проживання в материковій частині Північної Америки, за винятком нетривалих зв’язків із місцевим населенням кількома століттями раніше, так і не було знайдено. Найімовірніше, легенда, що вабила французьких дослідників углиб краю, — не більше ніж переосмислення розповідей про Норумбегу та Вінланд, які, своєю чергою, сягають середньовічних ісландських саг. На той час, як міф дійшов до французького двору, описувана в сагах географія була вже забута."
  seven_cities_saguenay.10.title: "Цар за порогами"
  seven_cities_saguenay.10.desc: "Цей юнак живе при нашому дворі відтоді, як виправа, що повернулася з-за океану, привезла його із собою. За цей час він устиг досить добре вивчити нашу мову — мабуть, навіть занадто добре. На розпитування про те, що розташоване за великими порогами, [target_character.GetName] відповідає: там лежить царство Сагеней. Його гори повні золота та червоного каміння, а живуть там люди у вовняному вбранні; шкіра ж їхня світла, як у нас. Юнак із радістю додає нові подробиці, щоб потішити слухачів: у Сагенеї також нібито живуть одноногі й навіть люди, що вміють літати. Писарі зауважують: щойно хтось засумнівається в його розповідях, Сагеней ніби приростає черговою провінцією. Оповідач обережно додає: чудове царство лежить дуже далеко, йти до нього треба вгору річкою, і без нього туди не дістатися."
  seven_cities_saguenay.10.a: "Відвеземо його додому; хай дорогою заговорює зуби очільникові."
  seven_cities_saguenay.10.b: "Залишимо його при дворі — у нього вельми потішні розповіді."
  saguenay_chiefs_son_sails_tt: "[target_character.GetName] повертається додому як наш провідник і перекладач"
  seven_cities_saguenay.10.historical_info: "У 1534 році Жак Картьє вивіз до Франції синів стадаконського вождя Доннакони, але вже за рік повернув їх додому. У 1536 році він забрав із собою самого Доннакону. Решту років той провів при французькому дворі, тішачи слухачів розповідями про царство Сагеней — край, багатий на золото й заселений світлошкірими людьми в хутряному вбранні. Що знатнішими були слухачі, то дивовижнішими ставали подробиці: Доннакона починав розповідати про одноногих людей і людей, що вміють літати, немов кажани. Він був послідовним у своїх оповідях: царство дивувало саме тими дивами, про які хотіли чути присутні, і щоразу воно опинялося все далі — неодмінно за тією річкою, до якої ще не дісталися дослідники. Близько 1539 року Доннакона помер на чужині, так і не побачивши свій народ. Його розповіді, втім, пережили самого вождя ще на півтора століття."
  seven_cities_saguenay.11.title: "Біла недуга"
  seven_cities_saguenay.11.desc: "Хвороба — цирульник називає її береговою — починається з ясен. Від неї немає ліків. У людей чорніють і набрякають ноги, відкриваються старі рубці, зуби хитаються в яснах. Першими злягли найдужчі, і ніхто не може пояснити, чому так. Смерть забрала життя вже вісьмох, а ще чверть команди не має сил заступити на вахту. Холодна земля вже близько, десь із підвітряного боку. Вартові на шканцях дедалі частіше запитують себе: чи не виявиться те, що чекає на нас на березі, ще страшнішим за лихо, яке вже спіткало нас?"
  seven_cities_saguenay.11.a: "Пристанемо до берега й попросимо місцевих про допомогу."
  seven_cities_saguenay.11.b: "Пустимо кров хворим і продовжимо тримати попередній курс."
  saguenay_annedda_cure: "#Y Одноплемінники нашого провідника показують нам дерево; відвар із його кори та хвої за кілька днів ставить на ноги навіть тих, хто помирає#!"
  saguenay_strangers_mercy: "#Y Чужинці не одразу, проте все ж виявляють милосердя#!"
  seven_cities_saguenay.11.historical_info: "Узимку 1535 — 1536 років чверть учасників виправи Картьє загинула від цинги. Урятувати решту допоміг Домаґая, син місцевого вождя, який раніше бував у Франції: він показав французам, як приготувати відвар із кори та хвої дерева, яке ірокези називали аннеддою. Уже за тиждень хворі знову стали на ноги. Згодом Картьє писав, що всі лікарі Левена й Монпельє з усіма їхніми ліками не змогли б за вісім днів досягти того самого, чого досяг Домаґая. Пізніше і властивості, і навіть назву аннедди забули. У Європі на два століття втратили знання про цей чудодійний засіб. Цинга ж продовжувала лютувати і в наступні століття згубила більше моряків, ніж усі морські битви доби вітрильного флоту разом узяті."
  seven_cities_saguenay.12.title: "Діаманти біля мису"
  seven_cities_saguenay.12.desc: "За сірим мисом, де річка робить вигин, виблискує берег. Кручі тут укриті білими прожилками, що сяють, немов огранені камені. Між ними тягнуться смуги жовтого металу — його легко начистити, просто плюнувши на палець і потерши. До полудня половина вахти вже зійшла на берег із бочками. Перед рештою стоїть непросте завдання: скласти донесення додому, дохідливо описавши, що ж саме лежить у бочках. Старший гармаш, син гірника, довго крутить у руках один із жовтих самородків, а потім просить дозволу сказати всю правду, перш ніж донесення будуть готові."
  seven_cities_saguenay.12.a: "Заповнимо всі бочки вщерть і втремо носа всім сумнівцям."
  seven_cities_saguenay.12.b: "Не тішмося передчасно — нехай син гірника спершу перевірить породу."
  saguenay_barrels_ring_true: "#Y Нам несподівано посміхнулася вдача: тут є справжній коштовний метал#!"
  saguenay_glitter_and_air: "#Y Наші трюми повні кварцу та піриту — «золота дурнів». Вісті про це долетять додому швидше за наш корабель#!"
  seven_cities_saguenay.12.historical_info: "Під час останньої виправи Картьє у 1542 році біля мису Руж на кораблі завантажили одинадцять бочок золотоносної руди та велику кількість «діамантів». З цим вантажем Картьє з тріумфом поплив до Франції, покинувши Роберваля та поселення напризволяще. У Франції знахідки ретельно дослідили. Золото виявилося залізним колчеданом, а діаманти — звичайним кварцом. Розчарування було настільки гірким, що вислів #italic faux comme un diamant du Canada#! («фальшивий, як канадський діамант») уже через одне покоління міцно закріпився в мові. Мис, утім, зберіг свою назву — Діаман, тобто «Діамантовий». Сьогодні на цьому місці, яке так жорстоко поглумилося над учасниками виправи, стоїть місто Квебек."
  seven_cities_saguenay.13.title: "Ярмарок у Тадусаку"
  seven_cities_saguenay.13.desc: "Наступного ранку після того, як ми стали на якір, починають з’являтися каное — одні спускаються річкою, інші підпливають від далекого берега. Човни глибоко осіли під вагою паків зі шкурами. Тлумач пояснює: це такий собі ярмарок. Народи холодного краю щороку сходяться до гирла річки, поки та не скувалася кригою, щоб помінятися крамом. Наш вітрильник вони просто сприйняли за неймовірно велике каное. Писар бере до рук боброве хутро, потім інше, тоді відкладає перо і береться за обрахунки іншого штибу. Золоте царство, каже він, — це напевно звичайнісінькі вигадки. А от бобри — цілком справжні."
  seven_cities_saguenay.13.a: "Відчинимо трюми й поторгуємо з місцевими. Легенда легендою, а зиск зиском."
  seven_cities_saguenay.13.b: "Ми перепливли океан не для того, щоб полювати на бобрів. Рушаймо вгору річкою!"
  seven_cities_saguenay.13.historical_info: "Тадусак, розташований у гирлі Сагенею, слугував тубільним жителям осередком сезонної торгівлі задовго до появи європейців. Щороку інну та алгонкіни зустрічалися в гирлі річки, обмінюючи хутро на мідь. Французькі першопрохідці не стільки заснували тут торгівлю, скільки приєдналися до вже наявного ринку. У 1600 році П’єр де Шовен спорудив тут першу постійну французьку факторію — за кілька років до заснування Квебека. Царство Сагеней, яке за переказами лежало далі проти течії, так і не відшукали. Натомість хутро, сплавлюване річкою Сагеней, упродовж двох століть було однією з головних підвалин господарства Нової Франції. Навіть для більшості справжніх королівств це стало б чималим надбанням."