l_russian:
  flavor_tle.8.title: "[ShowDecisionNameWithNoTooltip('oran_fatwa_decision')]"
  flavor_tle.8.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#! нещодавно вида[ROOT.GetCountry.Custom('clergy_vlaloly')] нову фетву, яка дозволяє нашим одновірцям дотримуватися #italic такії #! перед лицем переслідувань. Названа на честь місця, де її було проголошено, [ShowDecisionName('oran_fatwa_decision')] досягла #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! та широко розходиться серед пригноблених [ShowReligionAdjective('sunni')|l]их побратимів.\n\nЦей дозвіл дотримуватися такії дає змогу таємно сповідувати #TOOLTIP:RELIGIONGROUP,muslim,X #L іслам#!#!, удаючи послідовника іншої віри. Зазвичай заборонена в #italic 'уммі #!, ця фетва допускає таке в Іберії."
  flavor_tle.8.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
  flavor_tle.8.a.entry: "$common_string_great$"
  oran_fatwa_decision.title: "[ShowLocationNameWithNoTooltip('oran')]ська фетва"
  oran_fatwa_decision.desc: "$flavor_tle.8.desc$"
  oran_fatwa_decision.desc.entry: "Наші [ShowReligionAdjective('sunni')|l]і одновірці в #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! страждають під гнітом. Ми не можемо дозволити їм залишатися в #italic такії#!, поки їхня віра слабне. Слід видати фетву, щоб допомогти їм у боротьбі."
  oran_fatwa_decision.a: "$flavor_tle.8.a$"
  has_most_prestige_out_of_all_maghrebi_sunni_countries: "Має більше [Concept('prestige', 'слави')|e], ніж усі [ShowReligionAdjective('sunni')|l]і країни зі [Concept('capital', 'столицею')|e] в #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#!"
  tle_enable_free_the_mudejar_cb_tt: "[ShowReligionAdjective('sunni')|l]і [Concept('countries', 'країни')|e] зі [Concept('capital', 'столицею')|e] в #TOOLTIP:REGION,maghreb_region,X #L Магрибі#!#! зможуть фабрикувати [Concept('casus_belli', 'привід для війни')|e] «[ShowCasusBelliName('cb_free_the_mudejar')]» проти [ShowReligionGroupAdjective('christian')|l]их цілей, що мають [Concept('provinces', 'провінції')|e] із [ShowReligionAdjective('sunni')|l]ими [Concept('pops', 'громадами')|e] в #TOOLTIP:REGION,iberia_region,X #L Іберії#!#!"
  tle_enable_events_for_liberating_mudejar_tt: "[ShowReligionAdjective('sunni')|l]і [Concept('countries', 'країни')|e], що [Concept('occupy', 'окупують')|e] [Concept('locations', 'місцевості')|e] із [ShowReligionAdjective('sunni')|l]ими [Concept('pops', 'громадами')|e] у [Concept('war', 'війні')|e] «[ShowCasusBelliName('cb_free_the_mudejar')]», отримуватимуть [Concept('events', 'події')|e] про звільнення місцевого люду"
  flavor_tle.9.title: "Звільнення: [target.GetNameWithNoTooltip]"
  flavor_tle.9.desc: "Часи утисків для наших [ROOT.GetCountry.GetReligion.GetAdjective|l]их братів у місцевості [target.GetName], схоже, нарешті добігли кінця. Довгі десятиліття ці нещасні потерпали від лихого поводження під тиранічною владою [target.GetOwner.Custom('longname_ua_GEN')]. Та тепер, коли наші війська визволили їх, вони нарешті зможуть сповідувати #TOOLTIP:RELIGIONGROUP,muslim,X #L іслам#!#! у мирі та спокої. Більше їм не доведеться крити свою віру."
  flavor_tle.9.a: "Радійте, брати!"
  tle_fires_for_all_locations: "Цей [Concept('effect', 'ефект')|e] діє для кожної звільненої [Concept('location', 'місцевості')|e], але це сповіщення про [Concept('event', 'подію')|e] стосується лише [Concept('province_capitals', 'столиць провінцій')|e]"
  flavor_tle.10.title: "Арабізація [ROOT.GetCountry.Custom('CL_GEN')]"
  flavor_tle.10.entry: "Арабізація $TLE$"
  flavor_tle.10.desc: "[ShowAreaName('algiers_area')] — лише одна з областей #TOOLTIP:REGION,maghreb_region,X #L Магрибу#!#!, що зазнають значної арабізації під впливом #TOOLTIP:CULTUREGROUP,arabic_group,X #L арабських#!#! #TOOLTIP:ESTATE_TYPE,tribes_estate,X #L племен#!#!. У міру того як шириться цей процес, [ShowLanguageName('tamazight_language')] виходить з ужитку, а міська знать дедалі охочіше переймає місцевий [ShowLanguageName('arabic_language')|l] діалект. До того ж зі зростанням числа переселенців з #TOOLTIP:REGION,iberia_region,X #L Іберії#!#! ми бачимо, як наш[ROOT.GetCountry.Custom('nobles_aei')] [ShowEstateTypeName('nobles_estate')] цілковито перейма[ROOT.GetCountry.Custom('nobles_yeyut')] ці звичаї. Цілком можливо, що невдовзі наша країна візьме собі [ShowCultureName('algerian')|l]у назву."
  flavor_tle.10.a: "Нам слід зміцнити наше коріння."
  flavor_tle.10.b: "У цьому наше майбутнє!"
  flavor_tle.12.title: "Зречення племінного коріння"
  flavor_tle.12.entry: "$flavor_tle.12.title$"
  flavor_tle.12.desc: "Підвалини [target_country.GetAdjective|l]ої держави тримаються на [target_government_reform.GetName] — найчисленнішому племені в околицях [target_location.Custom('LR_GEN')] [target_location.GetName]. Саме з цього племені вийшов рід [target_dynasty.GetName], який започаткував той [target_country.GetFlavorRank|l], яким ми є сьогодні. Проте останнім часом вплив стану [target_estate.GetName] поступово слабшає, що загрожує рівновазі сил при дворі. Якщо не вжити заходів для зміцнення $banu_al_wad$, їхні політичні привілеї підуть у небуття."
  flavor_tle.12.a: "Нам слід шукати [Concept('legitimacy', 'право на владу')|e] не лише в племен."
  flavor_tle.12.b: "Першість $banu_al_wad$ має бути збережена!"
  tle_empower_banu_al_wad_reform: "[ShowGovernmentReformName('tle_support_of_banu_al_wad')] також надасть немасштабований [ShowNamedValue('small_stability_investment')|+=] [Concept('modifier', 'модифікатор')|e] «[ShowModifierTypeName('stability_investment')]»"
  tle_empower_banu_al_wad_reform_unlock_tt: "Відкривається завдяки [Concept('event', 'події')|e] #Y«$flavor_tle.12.title$»#!"
  has_more_prestige_than_root_tt: "Має більше [Concept('prestige', 'слави')|e], ніж #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!"