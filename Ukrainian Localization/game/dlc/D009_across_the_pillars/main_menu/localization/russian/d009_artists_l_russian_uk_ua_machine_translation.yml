l_russian:
  muqni_at_al_sa_il: "«Мукніат ас-саїль ан аль-марад аль-хаїль»"
  muqni_at_al_sa_il_desc: "Коли чорна смерть спустошувала вулиці Гранади, візир і лікар Лісан аль-Дін ібн аль-Хатіб відкинув утішне твердження про те, що поширення чуми залежить лише від божественної волі. Він став свідком того, як хворі заражають здорових через одяг, повітря та перебування у спільних приміщеннях, а згодом записав побачене.\n\nЙого переконаність у тому, що недуга передається через дотик, налаштувала проти нього правознавців, для яких подібне твердження межувало з богохульством. Утім, ця думка збереглася й була розвинена іншими лікарями від Феса до Каїра через багато років, уже після того, як пошесть пішла на спад."