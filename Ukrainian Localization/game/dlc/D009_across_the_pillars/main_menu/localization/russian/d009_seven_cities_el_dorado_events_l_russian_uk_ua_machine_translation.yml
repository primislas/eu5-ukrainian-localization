l_russian:
  seven_cities_el_dorado.1.title: "Човен, озеро, порожнеча"
  seven_cities_el_dorado.1.desc: "Після пів року мандрів високогір’ям загін вийшов до озера, яке жерці муїсків називали священним. Обрядова стежка, що пролягла перед нами, веде до круглого кратера, сповненого темної води й оточеного терасами схилів. Жерців тут давно немає: ще за кілька десятиліть до нашого прибуття ці землі спустіли через віспу. Місцеві пірнальники згодилися в обмін на крам обстежити дно озера в трьох різних місцях. На поверхню вони підняли кілька золотих виробів, чимало різних горщиків та іншого начиння, а також риб’ячі та собачі кістки — тобто будь-що, крім царя. [target_leader.GetName] неохоче визнає, що обряд справді існував, проте царство, яке його проводило, зникло з лиця землі."
  seven_cities_el_dorado.1.a: "Згортаємо стяг. Тут більше немає з ким домовлятися."
  seven_cities_el_dorado.1.historical_info: "Гуатавіта — це священне озеро, розташоване в кратері згаслого вулкана у високогірних краях сучасної Колумбії. Воно було культовим осередком конфедерації муїска, що правила саваною Боготи до приходу іспанців у 30-х роках XVI століття. З ним пов’язаний справжній звичай, що ліг в основу легенди про Ельдорадо й існував аж до раннього колоніального часу: нового вождя вкривали золотим пилом і вивозили до озера. Там вождь стрибав у воду й плив назад, змиваючи в такий спосіб «золоту шкіру». Втім, королівство муїсків, виснажене віспою та політичною кризою, яку майже незмінно спричиняли спалахи європейських пошестей, на час прибуття першої європейської виправи вже перебувало в занепаді."
  seven_cities_el_dorado.2.title: "Золоті вироби та спогади"
  seven_cities_el_dorado.2.desc: "Краї, що розкинулися перед нами, вже геть не ті, якими вони поставали в легендах про Ель Дорадо. Гірські племена розпорошені й занепали, головного двору більше немає, а біля озера вже не справляють священних обрядів. Але в майстернях, як і колись, працюють ремісники: золотарі досі бережуть звичаї пращурів. Один із них в обмін на залізну сокиру віддає нам пектораль із кованого золота із зображенням людини на плоту, і літописець двічі замальовує її, намагаючись передати кожну дрібницю. Торгівлю майстерно обробленим золотом ще можна налагодити. А от легендарного двору вже не повернути."
  seven_cities_el_dorado.2.a: "Збудуємо тут факторію для торгівлі золотими виробами."
  seven_cities_el_dorado.2.historical_info: "Муїсків можна без перебільшення назвати одними з найвправніших металургів доколумбової Америки: вони працювали не лише із золотом, а й із тумбагою — стопом золота й міді, з якого за восковими моделями відливали складні вироби за відносно низької температури. Частина звичаїв муїсків збереглася й після приходу іспанців — у гірських майстернях аж до XVII століття продовжували виготовляти золоті вироби в старому, доколумбовому стилі. Одні призначалися для місцевих замовників, інші — вже для іспанського ринку. Славетна фігурка у вигляді плота, що зображує обряд Ель Дорадо, походить саме з цього часу. Сьогодні вона зберігається в Музеї золота в Боготі."
  seven_cities_el_dorado.3.title: "Позолочений цар"
  seven_cities_el_dorado.3.desc: "Легендарна країна насправді існує — і наш загін її знайшов. Тут є все, що ми сподівалися побачити: передусім — союз гірських племен із головним двором і священним озером, а також щорічний обряд, під час якого верховного вождя обсипають золотим піском. [target_leader.GetName] — бажаний гість при дворі: [Select_CString(target_leader.IsFemale, 'їй', 'йому')] влаштовують прийом з усіма належними почестями. Нам пропонують укласти торгову угоду: верховний вождь не бажає ставати нашим васалом, але готовий бути нашим партнером. Самі лише золоті вироби здатні покрити витрати на ентраду, але вигідна для обох сторін торгова угода дорожча за будь-яке золото."
  seven_cities_el_dorado.3.a: "Ми підпишемо угоду — не як завойовник, а як партнер."
  seven_cities_el_dorado.3.historical_info: "Міф про Ельдорадо, що складався роками, набув остаточної форми у вигляді оповіді про багате царство десь на теренах Південної Америки, де царя щороку обсипали золотим пилом. Ця легенда ще два з половиною століття спонукала європейців виряджати виправи дедалі далі вглиб материка — вже після того, як описане літописцями священне поселення біля озера Гуатавіта знелюдніло й поступово пішло в небуття. Міф продовжував жити, попри дедалі нові свідчення того, що царства більше не існує. Це класичний приклад «пастки незворотних витрат»: з покоління в покоління європейські країни продовжували споряджати виправи лише тому, що вже забагато вклали в пошуки."