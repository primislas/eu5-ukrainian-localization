l_russian:
  flavor_cas.142.title: "Чорна легенда"
  flavor_cas.142.entry: "$flavor_cas.142.title$"
  flavor_cas.142.desc: "До нас дійшли відомості, що наші колоніальні суперники не шкодують зусиль, аби знеславити добре ім’я #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Памфлети та байки змальовують наших конкістадорів кровожерливими тиранами, а наші колонії — землями, що тримаються лише на жорстокості. Оскільки ці звинувачення швидко ширяться #TOOLTIP:CONTINENT,europe,X #L Європою#!#!, нам слід дати відповідь на цей наклеп і заздрісні вигадки."
  flavor_cas.142.a: "Їхня заздрість — доказ нашої величі."
  flavor_cas.142.b: "Зібрати докази та оприлюднити їх."
  flavor_cas.142.b_tt: "Хоча нам, можливо, і вдасться захистити добре ім’я, багато хто може витлумачити нашу відповідь як визнання того, що нас зачепили їхня брехня та вигадки."
  flavor_cas.142.historical_info: "Починаючи з XVI століття іспанські колоніальні суперники — здебільшого протестанти — розгорнули наклепницьку кампанію, яку пізніше назвуть Чорною легендою. Хоча самі вони чинили подібне, проте прагнули очорнити Іспанію, наголошуючи на її жорстокості в Америці та перевидаючи іспанські твори, як-от праці Бартоломе де лас Касаса, з безліччю перебільшень і вирваних із контексту фактів, аби підірвати повагу до іспанської корони."
  flavor_cas.143.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]а дорога"
  flavor_cas.143.entry: "Іспанська дорога"
  flavor_cas.143.desc: "Оскільки наші володіння простягаються від #TOOLTIP:REGION,italy_region,X #L Італії#!#! до провінції [target_province2.GetName], перевезення краму та вояків з одного місця до іншого стає дедалі нагальнішою потребою, адже наші кораблі наражаються на велику небезпеку, особливо під час плавання довкола #TOOLTIP:REGION,great_britain_region,X #L Британії#!#!. Було запропоновано спрямувати кошти в мережу доріг, яка згодом сполучить суходолом усі наші володіння в #TOOLTIP:CONTINENT,europe,X #L Європі#!#!."
  flavor_cas.143.a: "Розпочнімо її спорудження."
  flavor_cas.143.a_tt: "[ShowRoadTypeName('paved_road')] буде споруджена в кожній [Concept('location', 'місцевості')|e] в межах [Concept('province', 'провінцій')|e] [target_province1.GetName] та [target_province2.GetName] за ціною в [Concept('gold', 'грошах')|e], що залежить від рельєфу та вже прокладених доріг"
  flavor_cas.143.b: "Ніщо не загрожує нашому флоту."
  flavor_cas.143.historical_info: "Іспанська дорога являла собою воєнний та обозний коридор, прокладений у середині XVI століття, що сполучав іспанські володіння в Італії з Іспанськими Нідерландами через союзні землі, здебільшого в межах Священної Римської імперії. Її проклали, щоб уникнути небезпечних вод Ла-Маншу, де ворожі флоти могли легко перехоплювати іспанські кораблі."
  flavor_cas.148.title: "Empresa de China"
  flavor_cas.148.entry: "$flavor_cas.148.title$"
  flavor_cas.148.desc: "Відтоді як ми прибули до #TOOLTIP:REGION,indonesia_region,X #L Індонезії#!#!, багато хто стверджує, що завоювання Китаю не лише можливе, а й визначене самою долею. Купці та посли повідомляють, що країни, загрузлі в хабарництві, не зможуть протистояти могутності #ONCLICK:COUNTRY,[ROOT.GetCountry.GetKey] #TOOLTIP:COUNTRY,[ROOT.GetCountry.GetKey],X [ROOT.GetCountry.Custom('CL_GEN')|L]#!#!. Наші шпигуни невпинно працюють, проникаючи до #ONCLICK:COUNTRY,[target_country.GetKey] #TOOLTIP:COUNTRY,[target_country.GetKey],X [target_country.Custom('CL_GEN')|L]#!#!, і вважають, що [target_location.GetName] стане ідеальним плацдармом для нашого майбутнього підкорення всього Китаю."
  flavor_cas.148.a: "Розпочати підготовку до вторгнення."
  flavor_cas.148.b: "Ми не можемо діяти, спираючись на ці чутки."
  flavor_cas.148.historical_info: "Після іспанського завоювання Філіппін чимало урядовців та місіонерів-єзуїтів запропонували амбітний задум під назвою #italic Empresa de China#! («Китайська справа»), згідно з яким Іспанія мала вдертися до імперії Мін та навернути її населення у християнство. Єзуїти, які діяли в Китаї, повідомляли, що імперія внутрішньо слабка і її можна легко підкорити. У 1588 році Філіпп II схвалив підготовку до вторгнення, проте його так і не розпочали, і воно залишилося одним із найамбітніших нездійснених завойовницьких планів Іспанської імперії."
  flavor_cas.152.title: "Єдиний податок для всієї країни"
  flavor_cas.152.entry: "$flavor_cas.152.title$"
  flavor_cas.152.desc: "Війна з маврами лягла на скарбницю важким тягарем, тому [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l] заходи[ROOT.GetCountry.Custom('crown_vlaloly')]ся шукати нові джерела доходу. Міста країни дозволили нам збирати податок із продажу на користь королівської скарбниці, втім чимало наших радників вважають, що цей захід не повинен залишатися тимчасовим, і пропонують перетворити його на постійне законне джерело доходу."
  flavor_cas.152.a: "Не можна покладатися лише на тимчасову поміч."
  flavor_cas.152.b: "Нам не слід зловживати їхньою щедрістю."
  flavor_cas.152.historical_info: "За часів правління Альфонсо XI Кастилія зазнала грошової скрути через війни з Гранадою. Для фінансування облоги та взяття Альхесіраса кастильські міста надали королю право стягувати #italic алькабалу#! — податок на торгові угоди. Хоча спершу цей збір замислювався як надзвичайний захід і був схвалений містами на кортесах, незабаром він став одним із найважливіших постійних джерел доходу для кастильської корони. Наступні монархи розширили застосування алькабали та закріпили її в державних порядках, перетворивши на постійний податок, який упродовж кількох століть становив значну частку надходжень до королівської скарбниці."