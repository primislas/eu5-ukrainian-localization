l_russian:
  taifa: "Тайфа"
  taifa_desc: "Після падіння Кордовського халіфату Аль-Андалус розпався на безліч невеликих еміратів — #italic тайф#!, кожен зі своїм двором та правителем. Тайфи славилися своєю вченістю та культурою, але водночас постійно ворогували між собою і тому не могли поодинці протистояти християнським країнам півночі. Сьогодні, опинившись під владою однієї з відроджених іберійських країн, тайфи зберігають самобутність, залишаючись при цьому підлеглими правителю."
  LEAD_taifa: "$LIST$ — [SUBJECT_TYPE.GetName|l]"
  AM_taifa: "[SUBJECT_TYPE.GetName] країни $LIST$."
  OFFER_taifa_TOOLTIP_HEADER: "Пропозиція #ONCLICK:COUNTRY,[TARGET_COUNTRY.GetKey] #TOOLTIP:COUNTRY,[TARGET_COUNTRY.GetKey],X [TARGET_COUNTRY.Custom('CL_DAT')|L]$tt_cl_2$ стати тайфою"
  OFFER_taifa_TOOLTIP_HEADER_NO_TARGET: "Пропозиція [Concept('country', 'країні')|e] стати тайфою"
  REQUEST_taifa_TOOLTIP_HEADER: "Пропозиція #ONCLICK:COUNTRY,[TARGET_COUNTRY.GetKey] #TOOLTIP:COUNTRY,[TARGET_COUNTRY.GetKey],X [TARGET_COUNTRY.Custom('CL_DAT')|L]$tt_cl_2$ зробити нас тайфою"
  REQUEST_taifa_TOOLTIP_HEADER_NO_TARGET: "Пропозиція [Concept('country', 'країні')|e] зробити нас тайфою"
  CANCEL_taifa_TOOLTIP_HEADER: "Скасування статусу тайфи #ONCLICK:COUNTRY,[TARGET_COUNTRY.GetKey] #TOOLTIP:COUNTRY,[TARGET_COUNTRY.GetKey],X [TARGET_COUNTRY.Custom('CL_GEN')|L]$tt_cl_2$"
  CANCEL_taifa_TOOLTIP_HEADER_NO_TARGET: "Скасування статусу тайфи [Concept('country', 'країни')|e]"
  BREAK_taifa_TOOLTIP_HEADER: "Відмова бути тайфою #ONCLICK:COUNTRY,[TARGET_COUNTRY.GetKey] #TOOLTIP:COUNTRY,[TARGET_COUNTRY.GetKey],X [TARGET_COUNTRY.Custom('CL_GEN')|L]#!#!"
  BREAK_taifa_TOOLTIP_HEADER_NO_TARGET: "Відмова бути тайфою [Concept('country', 'країни')|e]"
  OFFER_taifaTITLE: "Прохання до країни стати нашою тайфою"
  OFFER_taifa_FLAVOR: "Оберіть, якій [Concept('country', 'країні')|e] запропонувати статус #TOOLTIP:SUBJECT_TYPE,taifa,X #L тайфи#!#!"
  REQUEST_taifaTITLE: "Пропозиція стати тайфою країни"
  REQUEST_taifa_FLAVOR: "Оберіть, #TOOLTIP:SUBJECT_TYPE,taifa,X #L тайфою#!#! якої [Concept('country', 'країни')|e] хочете стати"
  CANCEL_taifaTITLE: "Скасування статусу тайфи"
  CANCEL_taifa_FLAVOR: "Оберіть, яку [Concept('country', 'країну')|e] позбавити статусу #TOOLTIP:SUBJECT_TYPE,taifa,X #L тайфи#!#!"
  BREAK_taifaTITLE: "Скасування статусу тайфи"
  OFFER_taifa_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
  REQUEST_taifa_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
  CANCEL_taifa_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
  BREAK_taifa_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
  OFFER_taifa_NEWDESC: "Попросити, щоб [COUNTRY.GetName] ста[COUNTRY.Custom('end_vlaloly')] нашою тайфою?"
  REQUEST_taifa_NEWDESC: "Запропонувати #ONCLICK:COUNTRY,[COUNTRY.GetKey] #TOOLTIP:COUNTRY,[COUNTRY.GetKey],X [COUNTRY.Custom('CL_DAT')|L]$tt_cl_2$ зробити нас своєю тайфою?"
  CANCEL_taifa_NEWDESC: "Скасувати статус тайфи #ONCLICK:COUNTRY,[COUNTRY.GetKey] #TOOLTIP:COUNTRY,[COUNTRY.GetKey],X [COUNTRY.Custom('CL_GEN')|L]#!#!?"
  BREAK_taifa_NEWDESC: "Перестати бути тайфою #ONCLICK:COUNTRY,[COUNTRY.GetKey] #TOOLTIP:COUNTRY,[COUNTRY.GetKey],X [COUNTRY.Custom('CL_GEN')|L]#!#!?\nТакий крок зіпсує відносини й надасть цій країні [Concept('casus_belli', 'привід для війни')|e] проти нас!"
  OFFER_taifa_DESC: "Ми попросимо країну стати нашою тайфою в обмін на захист."
  REQUEST_taifa_DESC: "Ми запропонуємо себе як тайфу в обмін на захист."
  CANCEL_taifa_DESC: "Ми скасуємо статус тайфи."
  BREAK_taifa_DESC: "Ми перестанемо бути тайфою."
  OFFER_taifa_REQTITLE: "Пропозиція зробити нас тайфою"
  REQUEST_taifa_REQTITLE: "Пропозиція стати нашою тайфою"
  OFFER_taifa_REQDESC: "[COUNTRY.GetName] прос[COUNTRY.Custom('end_ytyat')] нас стати $SUBJECT_TYPE_SINGLE_INST_lower$"
  REQUEST_taifa_REQDESC: "[COUNTRY.GetName] пропону[COUNTRY.Custom('end_yeyut')] стати $SUBJECT_TYPE_SINGLE_INST_lower$"
  CANCEL_taifa_REQDESC: "$MONARCHTITLE$"
  BREAK_taifa_REQDESC: "$MONARCHTITLE$"
  OFFER_taifa_TOO_LOW: "@trigger_no! Щоб надати [COUNTRY.Custom('longname_ua_DAT')] статус «$taifa$», думка цієї країни про нас має бути не нижчою за $NEED|Y$. Зараз: $VAL|Y0$."
  REQUEST_taifa_TOO_LOW: "@trigger_no! Щоб стати тайфою, наша думка про [COUNTRY.Custom('longname_ua_ACC')] має бути не нижчою за $NEED|Y$. Зараз: $VAL|Y0$."
  CANCEL_taifa_NOT_IN_TRUCE: "$not_possible_to_break_subject_in_truce$"
  BREAK_taifa_NOT_IN_TRUCE: "$not_possible_to_break_subject_in_truce$"
  OFFER_taifa_ALREADY_SUBJECT: "$country_already_a_subject$"
  REQUEST_taifa_ALREADY_SUBJECT: "$country_already_a_subject$"
  OFFER_taifa_AT_WAR: "$country_is_at_war$"
  REQUEST_taifa_AT_WAR: "$country_is_at_war$"
  OFFER_taifa_LOWER_IN_SUBJECT_CHAIN: "$country_lower_in_subject_chain$"
  REQUEST_taifa_LOWER_IN_SUBJECT_CHAIN: "$country_lower_in_subject_chain$"