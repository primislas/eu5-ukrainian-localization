l_russian:
  petition_for_the_bula_de_cruzada: "Прохання видати буллу про хрестовий похід"
  petition_for_the_bula_de_cruzada_desc: "Як світський провідник [Concept('crusade', 'хрестового походу')|e], попросити папу видати [Concept('crusade', 'хрестоносну')] буллу. Впродовж трьох років [Concept('catholic', 'католицька')|e] [Concept('tithe', 'десятина')|e], сплачувана нашими станами, надходитиме короні, а не папі чи до скарбниці [Concept('crusade', 'хрестового походу')]."
  petition_for_the_bula_de_cruzada_tt: "Впродовж #G 3#! років [Concept('catholic', 'католицька')|e] [Concept('tithe', 'десятина')|e], сплачувана нашими станами, надходитиме короні, а не папі чи [Concept('crusade', 'хрестоносцям')|e]"
  summon_iberian_military_orders_crusade: "Скликати іберійські лицарські ордени"
  summon_iberian_military_orders_crusade_desc: "Закликати лицарський орден до [Concept('crusade', 'хрестового походу')|e] та набрати велике військо (залежить від сили ордену). Витрачається менше вірности ордену й зростає завзяття у вірі [Concept('crusade', 'хрестового походу')]."
  summon_iberian_military_orders_effect_tt: "Набирається велике військо хрестоносців, чисельність якого залежить від сили ордену. #Y Завзяття у вірі#! [Concept('crusade', 'хрестового походу')|e] збільшується на #G 5#!"
  summon_iberian_military_orders_no_target_tt: "Набирається велике військо хрестоносців, що складатиметься з лицарів обраного ордену (залежить від його сили). Завзяття у вірі [Concept('crusade', 'хрестового походу')|e] збільшується"
  summon_iberian_military_orders_order_tt: "Обраний лицарський орден отримує #G 10#! [Concept('zeal', 'ревності')|e]"
  summon_iberian_military_orders_event_tt: "З нами відбувається [event|e] «$d009_holy_war.1.title$»"
  choose_military_order_to_summon: "Обрати лицарський орден"
  summon_iberian_military_orders_no_orders: "@trigger_no! Немає жодного достатньо впливового та вірного лицарського ордену, який можна було б закликати."
  launch_a_cabalgada: "Влаштувати кінний набіг"
  launch_a_cabalgada_desc: "Влаштуйте набіг на одну з порубіжних провінцій супротивника. Усі місцевості, не захищені фортецями та військами, будуть розграбовані та втратять поступ розвитку. Їхній володар зможе зібрати сили для відповіді."
  launch_a_cabalgada_tt: "Потрібен річний [Concept('manpower', 'запас новобранців')|e]. Завзяття у вірі [Concept('crusade', 'хрестового походу')|e] зменшується на #R 10#!. Підготовка сповільнюється на #R 10#!"
  launch_a_cabalgada_loot_tt: "Кожна незахищена місцевість у провінції, де немає фортеці та війська, зазнає пограбування; здобич становитиме приблизно [actor.MakeScope.ScriptValue('cabalgada_estimated_total')|0+=][gold_i]. Рівень розвитку місцевостей знижується"
  choose_province_for_cabalgada: "Обрати провінцію для набігу"
  launch_a_cabalgada_no_provinces: "@trigger_no! У ворога немає незахищених порубіжних провінцій, на які можна було б влаштувати набіг."
  demand_parias: "Вимога данини"
  demand_parias_desc: "Як світський провідник [Concept('crusade', 'хрестового походу')|e], вимагати данину з ворожої країни під час підготовки. Ворог може сплатити, тим самим відклавши збір [Concept('crusade', 'хрестового походу')], або відмовитися, тим самим збільшивши його завзяття у вірі."