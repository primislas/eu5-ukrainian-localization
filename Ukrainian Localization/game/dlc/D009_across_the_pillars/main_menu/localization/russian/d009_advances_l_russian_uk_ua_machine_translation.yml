  mor_central_makhzen: "Махзен"
  mor_central_makhzen_desc: "На зміну вольницям часів раннього султанату має прийти #italic махзен#! — повноцінний урядовий устрій зі збирачами податків, писарями та призначуваними намісниками. Він поширюватиме волю престолу з покірних внутрішніх областей на землі бунтівників. Завдяки цьому влада уряду перестане залежати від особи конкретного правителя й перетвориться на міцну державну установу."
