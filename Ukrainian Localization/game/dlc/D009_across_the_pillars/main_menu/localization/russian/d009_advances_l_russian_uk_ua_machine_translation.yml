l_russian:
  gra_frontier_warriors: "Воїни порубіжжя"
  gra_frontier_warriors_desc: "Порубіжні села вздовж #italic сугурів#! зобов’язані споряджати своїх синів за сигналом дозорного ланцюга сигнальних багать. Такі військовозобов’язані #italic сагрійці#! знають проходи, криниці та сезонні набіги християнських королів так само добре, як пастух знає свої рідні пагорби. Такі воїни озброюються дешевою зброєю, харчуються з запасів свого ж села та навчаються в умовах порубіжжя єдиної війни, яка має значення. Ця легка піхота обходиться нашій скарбниці за безцінь, проте гідно утримує гірські шляхи порівняно з куди дорожчими в утриманні військами, які не зрівнялися б із ними у знанні місцевости."
  gra_jamaa: "Джамаат"
  gra_jamaa_desc: "Джамаат (букв. «громада») — це постійна дорадча установа нашого емірату, що об’єднує верховного суддю #italic каді аль-джамаа#!, #italic візира#!, #italic хаджиба#! та #italic шейха газі#!, який командує маринідськими добровольцями-джихадистами, що прибули до нашого двору. Ця рада представляє волю громади правовірних, і завдяки їй рішення щодо війни та збирання данини стають не особистою справою еміра, а наслідком волевиявлення всього суспільства. Ця рада виключає саму можливість нав’язування нам односторонніх поступок у разі розколу в еміраті та гарантує, що жодна зовнішня сила — чи то християнський король, магрибський султан або порубіжний ватажок — не зможе домовитися з кимось одним із нас в обхід волі всього народу."
  gra_jinetes: "Хінети"
  gra_jinetes_desc: "Легка кіннота, звана #italic хінетами#!, дістала свою назву від берберів-зената, які в XIII столітті переправилися через протоку, щоб стати під андалуські знамена. Ці воїни йшли в атаку верхи на невеликих іберо-арабських конях і покладалися на тактику стрімкого набігу, засипання ворога дротиками та оманливого відступу. З часом зената стали постійною частиною нашого війська. Сьогодні гранадські хінети прикривають маневри наших загонів по всій країні, від #italic сугурів#! до прибережних рівнин. Утримання легкої кінноти обходиться нам значно дешевше за лицарів у кольчугах, а самі хінети вельми успішно забезпечують рухливе прикриття, яке християнські війська не здатні прорвати, не зламавши стрій."
  unlocked_jinetes_via_decision_tt: "У [Concept('decision', 'рішенні')|e] «$demand_conversion_of_granada$» під час [Concept('situation', 'ситуації')|e] «[ShowSituationName('battle_for_the_strait')]» ми зробили вибір #italic «$demand_conversion_of_granada.b$»#!"
  gra_mailed_jinetes: "Хінети в кольчугах"
  gra_mailed_jinetes_desc: "Два століття порубіжних воєн загартували наших #italic хінетів#! і перетворили їх на вправних та стійких вершників. Тепер вони виходять на бій у кольчугах, здатних витримати влучання з християнського арбалета, а їхні списи стали довшими й можуть пробити ворожу кольчугу. Тактика хінетів залишається незмінною: стрімкий удар, кидок дротиків та оманливий відступ, але тепер, якщо не вдалося розбити ворога першою ж атакою, вершники можуть вступити у ближній бій. Захищені обладунками хінети нині — небезпечніша сила, спроможна битися там, де раніше їй довелося б відступати."
  gra_renegade_warriors: "Воїни-ренегати"
  gra_renegade_warriors_desc: "На рубежах між Аль-Андалусом та християнськими королівствами з’явився особливий рід вояків — #italic ельче#!, які змінили одну віру на іншу і тепер служать під нашими знаменами з майстерністю, перейнятою у своїх колишніх володарів. Ми законом закріпимо набір цих ренегатів, перетворимо їх на стан постійних важких вершників, даруємо їм землі, придворні посади та право битися під нашими барвами. Такі латні вершники, навчені християнської тактики бою в обладунках, забезпечують нашому війську важку кінноту, якої наші власні звичаї ніколи не знали."
  gra_taifa_subjects: "$taifa$"
  gra_taifa_subjects_desc: "$taifa_desc$"
  gra_tali_a_coastal_watch: "Берегові вежі талаї"
  gra_tali_a_coastal_watch_desc: "Ми зводимо кам’яні сторожові вежі, #italic талаї#!, на кожному мисі та виступі нашого узбережжя. На кожній вежі вночі запалюють сигнальне багаття, а вдень вивішують стяг. Вежі розташовані в межах прямої видимості одна від одної; всередині чергує загін арбалетників і #italic факіх#!, який гучною молитвою сповіщає про небезпеку. Жодна галера не зможе обігнути мис непоміченою, а жителі кожної прибережної долини-#italic веги#! встигають зібрати ополчення за кілька годин до того, як ворожий кіль увіпнеться в прибережний пісок. Ця мережа дозорів позбавляє ворожі флотилії переваги несподіванки і боронить узбережжя без витрат на постійні прибережні залоги."
  gra_thughur: "Сугури"
  gra_thughur_desc: "#italic Сугури#! — це порубіжні провінції Аль-Андалуса, дикі терени між осілою християнською Іберією та нашим еміратом. Наша влада та військова присутність у цих землях забезпечуються роздаванням земель і привілеїв військовим родам. Ми зводимо біля кожного перевалу й броду фортеці-#italic сагри#! та утворюємо з них безперервний оборонний ланцюг, який стримує будь-яке просування християн і дає нашим вершникам місце для збору та поповнення запасів. Цей впорядкований устрій рубежів перетворює порубіжні клани з самоврядних ватаг нападників на захисників, кровно зацікавлених у виживанні емірату."
  gra_veteran_thagri: "Сагрійці-ветерани"
  gra_veteran_thagri_desc: "Чотири покоління порубіжної служби загартували #italic сагрійців#! і перетворили їх на окрему верству нашого суспільства. Їхні родини здавна живуть біля тих самих гірських перевалів, які колись утримували їхні прадіди, а високі звання тут переходять від батька до сина. Сагрійці одержують не більше за простих селян — і все одно стають під наші знамена, вдовольняючись мізерними пайками, від яких зневажливо відвернулися б будь-які християнські війська. Ці загартовані в боях воїни допомагають нам утримувати порубіжні землі, не звертаючись до послуг коштовних найманців."
  gra_veteran_tornadizos: "Торнадісос-ветерани"
  gra_veteran_tornadizos_desc: "Християнські #italic ельче#!, нашвидкуруч набрані близько століття тому, з часом перетворилися на осілу військову верству, яка вважає порубіжжя нашої країни своєю домівкою. Сім’ї перебіжчиків родичаються між собою, передають від батька до сина вміння володіти списом і битися в латах та самі споряджають себе гідним озброєнням, про яке нещодавно годі було й мріяти. Зі свого боку ми визнаємо нову верству нашого суспільства й даруємо цим людям земельні наділи та офіцерські посади. Немає жодного сумніву в тому, що колись християнська важка кіннота цілковито вірна нашій країні. Ветерани-торнадісос, які завжди посідають місце посередині строю, — найпотужніша ударна кіннота в нашому розпорядженні."
  saqaliba_barracks_advance: "Дар ас-сакаліба"
  saqaliba_barracks_advance_desc: "Колишні кордовські халіфи тримали варту з #italic сакаліба#! — воїнів-невільників, привчених коритися виключно правителю. Ми відроджуємо цей звичай, засновуючи #italic Дар ас-сакаліба#! («Дім невільників»), установу, яка викуповує, озброює та старанно навчає таких людей ратної справи. Її зброярні нічим не поступаються будь-якій іншій зброярні держави, але поповнюються із зовсім інших джерел, а з бійців, що виходять із її стін, формується постійний корпус придворної варти, вірний особисто нам, а не якомусь клану чи місту."
  a_saqaliba_mutaqaddimun_advance: "Ас-сакаліба аль-мутакаддімун"
  a_saqaliba_mutaqaddimun_advance_desc: "Ми набираємо перше покоління відродженого корпусу #italic мутакаддімун#!, гвардійців минулих часів. Ми нарікаємо їх #italic ас-сакаліба аль-джудуд#!, Новими сакаліба, щоб відрізнити їх від #italic аль-кудама#! — ветеранів минулої золотої доби Кордови. Намертво пов’язані зобов’язаннями перед #italic Дар ас-сакаліба#! та домом правителя, ці воїни нічим не завдячують ані порубіжним кланам, ані старій арабській знаті."
  a_saqaliba_mutaakhkhirun_advance: "Ас-сакаліба аль-мутааххірун"
  a_saqaliba_mutaakhkhirun_advance_desc: "Напередодні нової доби корпус зазнає перетворень: вишкіл зводять до єдиного порядку, на зміну старим рушницям приходять мушкети, а лави воїнів зростають настільки, що такого ще не знали ні #italic Дар ас-сакаліба#!, ні $a_saqaliba_mutaqaddimun$. Новий різновид сакаліба — #italic мутааххірун#! — тепер ще одна опора нашого війська, яка вже довела свою вірність."
  a_saqaliba_nizam_jadid_advance: "Ан-нізам аль-джедід"
  a_saqaliba_nizam_jadid_advance_desc: "Під час масштабної реорганізації наш корпус перетвориться на #italic нізам джедід#! — Новий порядок, влаштований за зразком сучасних, озброєних вогнепальною зброєю армій. Тепер ми матимемо сучасну піхоту з однотипними ротами, навчаннями та забезпеченням зі складів і офіцерами-невільниками, які піднялися з самого низу. Таке військо підпорядковується виключно престолу й нікому більше. Саме їхнє ім’я проголошує цілковитий розрив з усім, що було раніше."
