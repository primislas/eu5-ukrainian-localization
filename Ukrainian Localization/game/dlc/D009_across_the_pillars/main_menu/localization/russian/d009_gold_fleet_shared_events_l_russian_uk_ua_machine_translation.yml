l_russian:
  gold_fleet_shared_events.1.title: "Пірати на видноколі"
  gold_fleet_shared_events.1.desc: "З навітряного боку видно вітрила: до флоту наближаються кораблі без розпізнавальних знаків. Це невеликі швидкохідні кораблі острівних піратів, здатні йти проти вітру й ховатися на мілині, куди за ними не піде жоден галеон.\n\nНезнайомих кораблів три або чотири, і мить вони обрали вдало: після ночі зі слабким вітром наші кораблі розпорошилися, а останній корабель, навантажений скарбами, відстав від решти на пів ліги."
  gold_fleet_shared_events.1.a: "Оголосимо збір і відженемо їх."
  gold_fleet_shared_events.1.b: "Відкупимося від них, доки вони не підійшли впритул."
  gold_fleet_shared_events.1.c: "Прискоримося та спробуємо відірватися від них."
  gold_fleet_shared_events.1.d: "Подамо сигнал іншому флоту. Разом ми дамо їм раду!"
  gold_fleet_shared_events.1.historical_info: "Упродовж XVI та XVII століть іспанським флотам, що перевозили скарби, дошкуляли капери та пірати. Діючи з дозволу влади чи з власної волі, корсари навчилися користатися з географічних особливостей Карибського моря: невеликі кораблі з малою осадкою могли ходити протоками між островами й перехоплювати кораблі, що відстали від супроводу через шторм або зустрічний вітер. Вантажі срібла були настільки коштовною здобиччю, що навіть їхня частка могла окупити цілу грабіжницьку виправу."
  gold_fleet_shared_events.pirate_fight_fail_tt: "Розбійники прикро дивують нас чисельністю та швидкістю: ми втрачаємо половину вантажу перш ніж нам вдається їх відігнати"
  gold_fleet_shared_events.pirate_flee_fail_tt: "Флот не встигає втекти від погоні, і його наздоганяють розбійники: чверть вантажу втрачено"
  gold_fleet_shared_events.2.title: "Ворожа ескадра перехоплює флот"
  gold_fleet_shared_events.2.desc: "Попередження дозорця надходить запізно. З навітряного боку на всіх вітрилах до нас ідуть військові кораблі, осілі під вагою гармат і команд, несучи стяги країни, з якою ворогує [ROOT.GetCountry.GetName]. Це лінійні кораблі — вони достатньо швидкі, щоб до настання ночі наздогнати найповільніший корабель флоту.\n\nВітер не дозволяє втекти від погоні, а в трюмах лежить річний запас #TOOLTIP:GOODS,silver,X #L срібла#!#!, яким володі[ROOT.GetCountry.Custom('crown_yeyut')] [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')|l]. [target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити: дати бій, розпорошити флот чи змиритися з утратою всього вантажу."
  gold_fleet_shared_events.2.a: "Вишикуємося в стрій і прориватимемося з боєм."
  gold_fleet_shared_events.2.b: "Розпорошимо флот, щоб спробувати врятувати бодай частину кораблів."
  gold_fleet_shared_events.2.c: "Розвернемося й підемо за вітром: усе або нічого."
  gold_fleet_shared_events.2.historical_info: "Найбільшу загрозу для флотів, що перевозили скарби, становили не окремі капери, а морські виправи, споряджені ворожими країнами. У 1628 році нідерландський адмірал Піт Гайн захопив біля бухти Матансас на Кубі весь флот, що повертався до Іспанії — це був єдиний в історії випадок цілковитого захоплення іспанського флоту зі сріблом. Коли у води Карибського моря входили великі флоти, охоронювані супроводи, здатні протистояти невеликим ватагам піратів, могли виявитися безсилими проти злагоджених дій ворожого флоту."
  gold_fleet_shared_events.warship_fight_fail_tt: "Ворожа ескадра бере гору в бою, і ми втрачаємо три чверті вантажу"
  gold_fleet_shared_events.warship_flee_fail_tt: "Флот не встигає втекти від погоні, і його наздоганяє ворожа ескадра: половину вантажу втрачено"
  gold_fleet_shared_events.3.title: "Наш флот перехоплює супровід зі скарбами"
  gold_fleet_shared_events.3.desc: "Нам повідомили, що наша ескадра перестріла в Карибському морі ворожий флот, який перевозив скарби, і стала до бою. У цій битві одразу кілька наших капітанів показали себе якнайкраще. Невдовзі про це дізнається [ROOT.GetCapital.GetName], хоча лічильні палати супротивника напевно отримають цю звістку навіть раніше.\n\n#TOOLTIP:GOODS,silver,X #L Срібло#!#!, яке везуть цими водами, допомагає утримувати ворожі війська та союзи, тож кожен захоплений нами вантаж — це кошти, які супротивник не зможе використати проти нас."
  gold_fleet_shared_events.3.a: "Наші капітани гідно себе проявили. Нагородимо їх."
  gold_fleet_shared_events.3.historical_info: "Звістки про сутичку з флотом, що перевозив скарби, нерідко випереджали самі кораблі, які брали участь у бою, оскільки їх могли доправити швидкохідні посильні кораблі. Перехоплення такого флоту мало вагомі дипломатичні та фінансові наслідки: захоплення навіть частини срібла могло забезпечити ескадру коштами на довгі роки, тоді як утрата флоту підривала скарбницю та авторитет постраждалої країни, а також її здатність вести війни в Європі."
  gold_fleet_shared_events.4.title: "[ROOT.GetCountry.GetDiplomacy.GetOverlord.GetNameWithNoTooltip] доруча[ROOT.GetCountry.GetDiplomacy.GetOverlord.Custom('end_yeyut')] флоту забрати в нас вантаж"
  gold_fleet_shared_events.4.desc: "[ROOT.GetCountry.GetDiplomacy.GetOverlord.GetName] забезпечу[ROOT.GetCountry.GetDiplomacy.GetOverlord.Custom('end_yeyut')] прибуття свого флоту до нашої гавані. Їхні посланці вже господарять на наших складах, підраховуючи те, що їм належить. Зливки #TOOLTIP:GOODS,silver,X #L срібла#!#!, монети, шкури та колоніальні товари — усе це вивозять під охороною і вантажать на кораблі для відправлення до Іспанії.\n\nНаш[ROOT.GetCountry.Custom('burghers_aei')] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')|l] також уважно вед[ROOT.GetCountry.Custom('burghers_eut')] підрахунки й з точністю до унції зна[ROOT.GetCountry.Custom('burghers_yeyut')], скільки багатств сьогодні полишить гавань. На їх збирання пішли довгі місяці, і [ROOT.GetCountry.GetName] відчуватим[ROOT.GetCountry.Custom('end_eut')] цю втрату аж до врожаю наступного сезону."
  gold_fleet_shared_events.4.a: "[ROOT.GetCountry.GetDiplomacy.GetOverlord.GetNameWithNoTooltip] отрима[ROOT.GetCountry.GetDiplomacy.GetOverlord.Custom('end_yeyut')] те, що прос[ROOT.GetCountry.GetDiplomacy.GetOverlord.Custom('end_ytyat')], але не більше."
  gold_fleet_shared_events.4.historical_info: "Колоніальні порти перебували в умовах нав’язаної торгової залежности від метрополії. Уся торгівля колоній мала йти шляхами, схваленими короною, а купці та креольська знать, які видобували срібло, постачали шкури й виробляли барвники, отримували лише малу частку прибутку. Основна ж частина прибутків діставалася короні та торговим домам Севільї — і ця суперечність лише поглиблювалася в міру розвитку колоніального устрою."
  gold_fleet_shared_events.5.title: "Море проти нас"
  gold_fleet_shared_events.5.desc: "Небо на схід від нас наливається багряно-синьою пітьмою, а хвилі стають дедалі вищими. На флот насувається потужна буря, і тепер від неї вже не втекти. Вітер виє в оснащенні; [target_leader.GetName] готується віддати наказ, від якого залежить, скільки кораблів переживуть бурю.\n\nМи можемо зімкнути стрій і перечекати бурю всім флотом, покладаючись на вміння моряків і трохи — на удачу, або ж розосередити кораблі та скинути частину вантажу за борт, аби втриматися на плаву."
  gold_fleet_shared_events.5.a: "Зімкнемо стрій і разом вийдемо з бурі."
  gold_fleet_shared_events.5.b: "Розосередимо кораблі та полегшимо навантаження."
  gold_fleet_shared_events.5.c: "Спробуємо кинути якір у найближчому дружньому порту й полагодити кораблі."
  gold_fleet_shared_events.5.unscathed_tt: "Кораблі виходять із бурі без жодних ушкоджень"
  gold_fleet_shared_events.5.lose_fleet_tt: "Частина кораблів тоне; разом із ними гине половина вантажу"
  gold_fleet_shared_events.5.lose_all_tt: "Усі кораблі зі своїми командами гинуть; подорож добігає кінця"
  gold_fleet_shared_events.5.lose_cargo_tt: "Вантаж викинуто за борт, щоб полегшити кораблі; частина вмісту трюмів утрачена"
  gold_fleet_shared_events.5.historical_info: "Атлантичні урагани були для флоту скарбів найсмертоноснішим ворогом, деколи страшнішим за найвідчайдушнішого капера. 1622 року флот Тьєрра-Фірме втратив біля архіпелагу Флорида-Кіз вісім кораблів, зокрема #italic «Нуестра Сеньйора де Аточа»#!. Завантажений сріблом корабель затонув, і уламки пролежали під водою три з половиною століття, перш ніж їх пощастило підняти на поверхню. У 1715 році цілий флот, що повертався до Іспанії, був викинутий ураганом на узбережжя Флориди; загинуло близько тисячі людей. З часом капітани почали боятися пори ураганів чи не дужче, ніж піратів."
  gold_fleet_shared_events.6.title: "Гарячка на нижніх палубах"
  gold_fleet_shared_events.6.desc: "Спека під палубами стає майже нестерпною; разом із нею на флот приходить пошесть. Ще тиждень тому ці люди стійко стояли на вахті, а нині лежать без сил у темряві, обливаючись потом. Корабельний лікар майже безсилий: йому лишається тільки лічити недужих і сподіватися, що хвороба омине решту. Брудна вода, тіснота й задушливе тропічне повітря виявилися для команди гіршими за будь-якого капера.\n\n[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'повинна', 'повинен')] вирішити, як краще боротися з гарячкою, поки вона не згубила людей остаточно."
  gold_fleet_shared_events.6.a: "Ляжемо в дрейф і винесемо недужих на берег, щоб перечекати, доки хвороба мине."
  gold_fleet_shared_events.6.b: "Не можна втрачати сприятливу пору! Нехай команда працює далі."
  gold_fleet_shared_events.6.c: "Запасемося свіжою водою і поповнимо команду здоровими людьми на березі."
  gold_fleet_shared_events.6.historical_info: "На кораблях #italic Carrera de Indias#! (флотів Індій) хвороби забирали значно більше життів, ніж бурі чи напади морських розбійників. Довгі переходи, брак свіжої води, харчування засоленими припасами й тіснота в трюмах ставали причинами цинги, дизентерії та тифу, а тропічні порти Карибського моря були справжніми розсадниками малярії та інших смертельних гарячок, які за лічені тижні могли майже вщент згубити команду. Флот, що занадто забарився в Індіях, ризикував повернутися додому з такою нестачею людей, що не було кому вести кораблі, і капітанам доводилося обирати між імовірною загибеллю в морі та повільнішою, проте майже певною смертю від пошести."
  gold_fleet_shared_events.7.title: "Балачки в шинку"
  gold_fleet_shared_events.7.desc: "[target_leader.GetName] [Select_CString(target_leader.IsFemale, 'дізналася', 'дізнався')], що один з офіцерів флоту, який добряче хильнув у портовому шинку, розпатякав день відплиття та зворотний шлях, а заразом згадав, які скарби лежать у наших трюмах. Колоніальний порт — місце, де не сховатися від чужих вух: торгових представників, перемитників і просто охочих продати підслухані таємниці будь-якому каперу, в чиїй калитці дзвенить дзвінка монета.\n\nВилетілих слів уже не зловити, проте від того, як ми вчинимо зараз, залежить, чи покотяться чутки далі."
  gold_fleet_shared_events.7.a: "Показово покараємо його на палубі — [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')|l] нещадн[ROOT.GetCountry.Custom('crown_yiaei')|l] до балакунів."
  gold_fleet_shared_events.7.b: "Перенесемо день відплиття та змінимо курс."
  gold_fleet_shared_events.7.c: "Розпустимо суперечливі чутки, щоб збити інших з пантелику."
  gold_fleet_shared_events.7.rumours_worse_tt: "Хибні чутки лише розпалюють цікавість, і розмови про справжній шлях розносяться ще далі — небезпека плавання зростає (#G +1#! до рівня небезпеки)"
  gold_fleet_shared_events.7.rumours_better_tt: "Ворожі капітани натрапляють на хибний слід і ганяються за привидами — небезпека плавання зменшується (#R -1#! до рівня небезпеки)"
  gold_fleet_shared_events.7.historical_info: "В усій Атлантиці навряд чи можна було знайти цінніші відомості, ніж розклад рейсів Срібного флоту. Капери та адміралтейства суперницьких країн тримали мережі вивідачів у карибських портах і в Севільї, а витік дня відплиття чи ймовірного шляху міг майже гарантувати успішний напад. Іспанська корона ретельно приховувала відомості про #italic flota#!, але флот, що збирався в переповненому колоніальному порту, не міг повністю зберегти свої таємниці. Капітани добре знали, яку небезпеку становили необачні розмови на березі."
  gold_fleet_shared_events.cargo_loaded_tt: "Відбувається завантаження здобичі цієї пори в трюми"
  gold_fleet_shared_events.cargo_gain_tt: "Цінність вантажу, який перевозить флот, збільшується"
  gold_fleet_shared_events.cargo_loss_tt: "Частину вантажу, який перевозить флот, втрачено"
  gold_fleet_shared_events.danger_up_1_tt: "Небезпека плавання зростає (#G +1#! до рівня небезпеки)"
  gold_fleet_shared_events.danger_up_2_tt: "Небезпека плавання зростає (#G +2#! до рівня небезпеки)"
  gold_fleet_shared_events.danger_down_1_tt: "Небезпека плавання знижується (#R -1#! до рівня небезпеки)"
  gold_fleet_shared_events.cargo_damaged_on_return_tt: "Доставлений вантаж враховує втрати, яких флот зазнав раніше в дорозі"