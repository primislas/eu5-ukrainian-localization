l_russian:
  seven_cities_sierra.1.title: "Гора Білого царя"
  seven_cities_sierra.1.desc: "Після восьми місяців мандрів просторами Чако загін дістався передгір’їв, про які розповідали провідники-гуарані, — до землі Срібної гори. Цей край суворий та безплідний: довкола солончаки й пересохлі річища, а самі передгір’я — голі червоні скелі. Струмки, що стікають із них, не несуть ані крихти срібла. Під тиском провідники зізналися, що рада гуарані відрядила їх завести загін якнайдалі від своїх земель із надією, що іспанці вже не повернуться. [target_leader.GetName] наказує повісити двох, а решту — відпустити. Шлях назад доведеться долати на голодний шлунок."
  seven_cities_sierra.1.a: "Повертаємо назад. Срібна гора — це просто вигадки."
  seven_cities_sierra.1.historical_info: "Легенда про Сьєрра-де-ла-Плата — Срібну гору, буцімто приховану десь у глибині Південної Америки, — більшу частину XVI століття вважалася іспанською короною цілком правдоподібною. Саме в надії дістатися цих багатств заснували Асунсьйон: місто мало стати опорним пунктом для завоювання Срібної гори. Справжні срібні багатства Південних Анд виявилися набагато західніше, в Потосі, й шлях до них був зовсім іншим. А землі між Асунсьйоном та Андами — річки й трав’янисті рівнини — всупереч очікуванням першопрохідців виявилися неймовірно бідними."
  seven_cities_sierra.2.title: "Срібло в передгір’ях"
  seven_cities_sierra.2.desc: "Ці землі справді багаті на срібло, хоча багатство, звісно, виявилося перебільшеним. У двох обстежених нами долинах біля підніжжя гір діють срібні копальні. Їх розробляють місцеві громади, підвладні вождеві, який готовий прийняти іспанське посольство. За мірками Анд тутешній видобуток невеликий. Але срібло тут є, копальні існують, а торгівлю можна налагодити без цілковитого насильницького підкорення жителів. [target_leader.GetName] укладає з ними торгову угоду й установлює символічну данину."
  seven_cities_sierra.2.a: "Укладемо угоду. Скромні, але сталі потоки срібла вельми цінні для нас."
  seven_cities_sierra.2.historical_info: "На східних схилах Центральних Анд дійсно є придатні для видобутку родовища срібла, хоча до багатств хребта Потосі їм далеко. Наприкінці XVI століття іспанці облаштували невеликі копальні на теренах сучасної Північної Аргентини та півдня Болівії. Зазвичай це відбувалося в межах енком’єнди та за участі місцевих народів — діаґіта й чича. Проте легендарну Сьєрра-де-ла-Плату — срібну гору — так і не знайшли: її просто не існувало. Насправді срібло в Андах було розсіяне численними окремими родовищами. Лише Потосі виявилося настільки багатим, що з часом і саме стало легендою."
  seven_cities_sierra.3.title: "Срібна гора"
  seven_cities_sierra.3.desc: "Земля, описана в легендах, справді існує: загін знайшов її. Перед нами височіє гора, розсічена трьома копальнями. Срібна руда виходить майже до самої поверхні, жили сягають товщини в долоню, а оцінювач стверджує, що вміст срібла тут — найбільший в усіх Індіях. Вожді чича, яким належать тутешні передгір’я, готові прийняти посольство: вони зацікавлені в залізному знарядді й іспанських конях, а не у війні. Ми готові піти їм назустріч. Гора ніби сама відкрилася нам. [target_leader.GetName] відряджає до узбережжя трьох вершників зі зразками руди у свинцевих коробах. Корону навряд чи доведеться довго переконувати в їхній цінності."
  seven_cities_sierra.3.a: "Підпишемо угоду й збудуємо дорогу. Ми знайшли гору."
  seven_cities_sierra.3.historical_info: "Гора Потосі — те саме родовище, з яким пізніше почали пов’язувати легенду про Сьєрра-де-ла-Плата, — була відкрита зовсім не виправленою на її пошуки іспанською виправою. У 1545 році владі в Куско про неї повідомив місцевий рудокоп, чиє ім’я в різних джерелах передається по-різному. Майже два століття Потосі давала більше срібла, ніж будь-яке інше родовище у світі, й стала одним із головних джерел дорогоцінного металу для світового господарства раннього Нового часу. У певному сенсі легенда виявилася правдивою. Оповідачі помилялися лише в одному: в тому, де саме шукати цю гору."
  seven_cities_sierra.10.title: "Срібло з заходу"
  seven_cities_sierra.10.desc: "Багато років його вважали загиблим. Він зник разом із виправою, що розбилася об південні скелі, а нині вранці несподівано з’явився біля брами й зажадав, щоб його відвели до нашого очільника, назвавши того на ім’я. У руці в нього — зав’язана вузликом хустина. Всередині — срібна застібка та дві розплющені намистини майстерної роботи, також зі срібла. [target_character.GetName] стверджує, що все це потрапило до нього з далекої країни в глибині суходолу, де на горі срібла сидить Білий цар. Він не вміє навіть написати власного імені, але береги описує з неймовірною точністю. Оцінювач куштує намистини на зуб, важить їх і мовчки повертає власникові."
  seven_cities_sierra.10.a: "Рушимо за ним — нехай буде нашим провідником."
  seven_cities_sierra.10.b: "Купимо в нього всі його коштовності — разом із його мовчанням."
  plata_castaway_road_tt: "[target_character.GetName] приєднується до мандрівки й позначає на наших мапах подоланий ним шлях углиб суходолу"
  plata_silver_in_hand_tt: "Здобуті виправою коштовності поповнюються сріблом урятованого"
  seven_cities_sierra.10.historical_info: "У 1516 році португальський моряк Алейшу Гарсія, учасник виправи Соліса, зазнав кораблетрощі біля острова Санта-Катаріна. Його підібрали індіанці гуарані, які й розповіли Гарсії легенду про Білого царя, що править західними горами, неймовірно багатими на срібло. Близько 1524 року Гарсія, бажаючи перевірити достовірність цієї легенди, вирушив углиб суходолу. Він став першим європейцем, який дістався до багатств Анд, і повернувся з украденим в інків сріблом за кілька років до того, як Пісарро відвідав Перу. Дорогою назад Гарсія загинув, але частина його здобичі досягла узбережжя, де потрапила до рук команди Себастьяна Кабота. Ця знахідка переконала Кабота відмовитися від плавання до Молуккських островів і повернути вгору річкою, яку згодом назвуть Ріо-де-ла-Плата — «Срібна», хоча в самій річці ніколи не було срібла."
  seven_cities_sierra.11.title: "Воїнство без знамен"
  seven_cities_sierra.11.desc: "Рада біля багать затягується далеко за північ, а вранці через перекладачів нам передають пропозицію: річкові народи готові виступити разом із нами проти Білого царя. Не як провідники чи носії — ні, вони готові зібрати багатотисячне військо, і мають на це вагомі причини. Їхні діди чинили набіги на тутешні узгір’я ще до того, як сюди ступила наша нога, і тому вони чудово знають шляхи й переправи в цих безводних краях. Думки наших офіцерів розділилися: один стверджує, що такому великому війську в поході не загрожує голодна смерть. Другий відповідає, що таке велике військо не вестиме перемовин — воно йде вбивати."
  seven_cities_sierra.11.a: "Погодимося на пропозицію. Наш загін не піде сам-один."
  seven_cities_sierra.11.b: "Відмовимо, але пом’якшимо відмову дарунками. Там, де загрузне військо, пройде невеликий загін."
  seven_cities_sierra.11.historical_info: "Мандрівка Алейшу Гарсії на захід у 1524 році була кровопролитною: він ішов туди не як дослідник, а як учасник великого походу гуарані проти прикордонних володінь інків, у якому брали участь тисячі воїнів. Об’єднане військо перетнуло Чако — посушливий край, що згодом вселятиме в іспанців справжній жах, — і завдало ударів по окраїнних володіннях імперії інків. Гуарані просунулися достатньо далеко вглиб їхньої імперії, аби інки після цієї війни всерйоз перейнялися зміцненням оборони порубіжжя. В європейських хроніках цей похід описується як виправа, але самі гуарані вважали інакше: вони просто взяли з собою на війну бородатого чужоземного моряка."
  seven_cities_sierra.12.title: "Кордон Білого царя"
  seven_cities_sierra.12.desc: "Попереду нарешті постають передгір’я, сині й неозорі. У селах біля їхнього підніжжя — перші ознаки багатства цих країв: місцеві жителі носять на шиї та зап’ястках срібні прикраси настільки майстерної роботи, якої нам досі не доводилося тут бачити. Вище починаються перевали, що ведуть у ті краї, звідки й походить це срібло. Та щойно ми заводимо мову про них, як одразу западає мовчанка. Нарешті хтось насмілюється озватися: гірські владики, кажуть нам, пильно стежать за перевалами й рахують кожного, хто підіймається в гори. А тих, хто спускається назад, вони чомусь не лічать."
  seven_cities_sierra.12.desc_castaway: "Знаки, якими врятований позначав свій шлях, закінчилися. Він зізнається: далі цієї долини він ніколи не заходив, а зупинився там, де стежка повертає вгору, до гірських перевалів. Срібло, яке він приніс із собою, дісталося йому саме тут: його виміняли в людей, що спустилися з гір. Що лежить далі, напевно сказати неможливо, і лишається тільки покладатися на чужі перекази. Але загону чомусь простіше пробачити брехню, ніж щиросердне зізнання. Отже, шлях тільки один: угору."
  seven_cities_sierra.12.a: "Ходімо через перевали. Гора зовсім близько — до неї рукою сягнути."
  seven_cities_sierra.12.b: "Поторгуємо з місцевими біля підніжжя гори. Терпіння винагороджується сріблом."
  plata_silver_seized: "#Y Нападники на долину приносять здобич — срібні вироби#!"
  plata_host_shields_the_raid: "#Y Військо наших союзників прикриває напад і повертається зі здобиччю — срібними виробами#!"
  plata_frontier_rises: "#Y Перевали порожніють перед нами, а потім гори завдають удару у відповідь#!"
  seven_cities_sierra.12.historical_info: "На відміну від кордонів багатьох інших країн, кордон імперії інків становив ланцюжок укріплених залог, і кожен новий набіг зустрічав тут відсіч. У 1525 році військо Алейшу Гарсії було розгромлене на зворотному шляху; сам Гарсія й майже всі його соратники загинули. У 1537 році така сама доля спіткала Хуана де Айоласа: він перетнув Чако й дістався багатих на срібло земель, але вивезти здобич уже не встиг. На зворотному шляху його загін потрапив у засідку біля Канделарії та загинув у повному складі. Срібло було справжнім; існувала й срібна гора, але цілих тридцять років шлях до неї захищали укріплення господарів цих країв. Щоб у 1545 році оволодіти Потосі, іспанські війська були змушені зайти з іншого боку."
  seven_cities_sierra.13.title: "Солодке море"
  seven_cities_sierra.13.desc: "За день до висадки вода несподівано змінюється. Лотовий куштує її на смак, спльовує й куштує знову. Його приклад по черзі наслідують головний над запасами води, штурман і лоцмани. Не минає й години, як кораблем розноситься звістка: море стало прісним. Жодна з відомих нам річок не тече так далеко від берега. Лоцмани сперечаються, звідки бере початок така дивина. Моряки, що скупчилися біля борту, спочатку вдивляються вдалину, сподіваючись побачити там хоч щось, а потім починають черпати дивовижну морську воду пригорщами."
  seven_cities_sierra.13.desc_castaway: "Сьогодні вранці вода під кілем стала прісною. Суперечку лоцманів про те, що стало тому причиною, перервала поява на палубі вцілілого в кораблетрощі. Він зачерпнув воду долонею, спробував на смак і кивнув так, ніби скуштував доброго вина. «Це — вода з тієї самої річки, якою я колись віз срібло». Десь на заході оповита серпанком річка звужується. Там починається шлях, що веде до володінь Білого царя."
  seven_cities_sierra.13.a: "Назвемо її в донесенні Срібною річкою."
  seven_cities_sierra.13.b: "Проміряємо гирло й нанесемо його на мапу, а потім уже дамо річці назву."
  seven_cities_sierra.13.historical_info: "У 1516 році Хуан Діас де Соліс виявив величезне гирло, яке назвав Mar Dulce («Солодке море»), тобто прісне море: навіть далеко від берега вода ще не ставала солоною. За першої ж спроби висадитися на північному березі Соліс загинув від рук місцевих жителів. Уцілілі учасники виправи на зворотному шляху зазнали кораблетрощі біля Санта-Катарини. Серед викинутих на берег опинився Алейшу Гарсія; здобуте ним срібло згодом ще неодноразово спонукало європейські країни споряджати одну виправу за іншою. Наприкінці 20-х років XVI століття Себастьян Кабот, повіривши розповідям про існування на заході багатих на срібло країв, назвав цю водойму Ріо-де-ла-Плата («Срібна річка»). За життя Кабота вона так і не стала срібною, але назва збереглася й згодом перейшла на країну біля її гирла — Аргентину, Землю срібла."