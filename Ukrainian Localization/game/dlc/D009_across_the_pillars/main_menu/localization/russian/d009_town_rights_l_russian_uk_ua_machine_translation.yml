l_russian:
  andalusi_refugee_town_rights: "Хартія андалуських біженців"
  andalusi_refugee_town_rights_desc: "Цьому поселенню надано особливі хартії для залучення ремісників, учених і купців, яких витісняють з Аль-Андалусу зовнішні сили та хвилювання попередньої доби. Біженці збагачують наші міста своєю культурою та привозять крам, зміцнюючи тим самим місцеве виробництво. Ми щиро вітаємо їх і сподіваємося, що вони знайдуть прихисток на наших землях."
  andalusi_resettlement_town_rights: "Андалуське переселення"
  andalusi_resettlement_town_rights_desc: "Це поселення відкрите для ремісників і землеробів Аль-Андалусу, переселених сюди за грамотами, що гарантують непорушність їхніх домівок, майстерень і прав на воду для садів. Вони прибувають не як біженці, гнані військом, а як поселенці, запрошені лишитися, приносячи із собою шовкові верстати, зрошувальні канали та ринкові ремесла півдня. Чутки про такі умови швидко ширяться, і там, де перші родини досягли успіху, за ними йдуть інші."
  andalusi_resettlement_golden_age_town_rights: "Переселення золотої доби"
  andalusi_resettlement_golden_age_town_rights_desc: "Наше панування над протокою перетворило це поселення на омріяний прихисток для вигнаних майстрів Аль-Андалусу. Шовкоткачі й лікарі, математики та зодчі прибувають цілими кораблями, а грамоти, що ми їм даруємо, найщедріші на всьому півострові. Те, що починалося як тонкий струмок поселенців, обернулося настанням цілої доби, а тутешні майстерні працюють у такому темпі, якого годі шукати в будь-якій гавані суперників."
  iberian_aljama_charter: "Хартія альхами"
  iberian_aljama_charter_desc: "Хартія #italic альхами#! надає самоврядній мусульманській громаді в цій місцевості офіційний статус, визнаючи її право на самоврядування, вільне сповідування ісламу та збирання податків серед місцевого люду. Ухвалюючи цю хартію, ми дозволяємо громаді утримувати свої мечеті, ринки й суспільні заклади в обмін на плідну участь у нашому господарстві. Подібні суспільні угоди нерідко зустрічаються в містах Іберійського півострова, оскільки врядування землями, де пліч-о-пліч мешкають християни та мусульмани, потребує особливого підходу."
  mozarab_charter_town_rights: "Мосарабська грамота"
  mozarab_charter_town_rights_desc: "Ми підтвердили давній договір із #italic мустарибун#! цього поселення — арабізованими християнами, які берегли свою літургію та латинські книги впродовж багатьох поколінь нашого правління. Їхнє духовенство підпорядковується власному єпископу, а їхні суперечки розв’язують власні судді, натомість вони покірно сплачують #italic джизію#! і не підіймають на нас руки. Поселення від цього стало спокійнішим, а розмови про повалення нашої влади не знаходять відгуку на вулицях, де й так даровано той спокій, заради якого деінде повстають. Утім, громада, настільки впевнена у власних обрядах, навряд чи стане від них відмовлятися."
  medina_charter_town_rights: "Хартія Медини"
  medina_charter_town_rights_desc: "Звід законів #italic Медини#! тепер поширюється і на це поселення — міський квартал обноситься муром, управляється #italic каїдом#! та наглядається #italic мухтасибом#!, а влада тут відповідає за ринки, вулиці й суспільну мораль. Завдяки цим законам ми здобудемо більше користі зі щільної міської забудови. Прадавнє міське планування вулиць не дозволяє швидко зводити нові споруди, але натомість забезпечує порядок, завдяки чому це поселення стає наріжним каменем магрибського врядування."
  mzab_pentapolis_town_rights: "Мзабське п’ятиграддя"
  mzab_pentapolis_town_rights_desc: "Цьому поселенню надано хартії долини Мзаб, згідно з якими ібадитськими містами править аскетична рада #italic аззаба#! — суспільно-духовний осередок, що відповідає як за торгівлю, так і за дотримання законів. Закон дозволяє піднаглядну торгівлю, єднає жителів і перетворює поселення на стабільний та самостійний анклав. Містяни можуть вести тут спокійне та заможне життя."
  tribal_souk_town_rights: "Хартія племінного суку"
  tribal_souk_town_rights_desc: "Це поселення стало племінним містом для періодичної торгівлі — #italic суком#!. Тут племена можуть зійтися, щоб поторгуватися, владнати суперечки та поновити угоди одне з одним. Усе це вкрай вигідно для племен, тому вони майже самоврядно керують містом, а наш вплив там обмежений. Обсяги краму, що проходить крізь це поселення, приваблюють сюди каравани з довколишніх земель."
  taifa_al_rais_town_rights: "Тайфа реїсів"
  taifa_al_rais_town_rights_desc: "Цей порт належить #italic тайфі реїсів#! — постійному об’єднанню піратських капітанів, що ходять уздовж усього берберського узбережжя від Сале до Тріполі. Їхня рада править гаванню, приваблюючи до неї досвідчених моряків. Там, куди заходять кораблі реїсів, ніколи не бракує моряків."
  sale_arsenal_town_rights: "Арсенал Сале"
  sale_arsenal_town_rights_desc: "Королівський арсенал Сале, також знаний як #italic дар аль-сінаа#!, розташований у гирлі річки Бу-Реґреґ. Саме тут маринідські корабельники будують та оснащують кораблі, які несуть наш стяг в Атлантику. При арсеналі є постійний штат досвідчених майстрів і лоцманів, тож зібрати команду для спущеного на воду корабля не становить труднощів. Жодна інша гавань на цьому узбережжі не спроможна спорядити цілий флот із такою легкістю."
  guich_charter_town_rights: "Договір із гішами"
  guich_charter_town_rights_desc: "Ми оселили на цих землях одне з племен гішів, також знаних як #italic джайш#!, надавши йому ниви, пасовища та звільнення від податків в обмін на зобов’язання боронити престол. Їхні вершники готові з’явитися на війну за першим покликом, а жінки змалку готують синів до сідла, а не до плуга. Ці гіші не сплачують золота до скарбниці, зате постачають війську чудово вишколених вояків."