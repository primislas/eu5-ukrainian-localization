l_russian:
  gold_caravan_expedition: "Золотий караван"
  gold_caravan_expedition_desc: "Ви спорядите караван через Сахару на багаті ринки #italic Білад ас-Судана#!, щоб вимінювати сіль та тканини на багатства Сахелю. Дорога далека, пустеля сповнена небезпек, але в разі успішного повернення караван доставить велику партію золота на ринок вашої столиці."
  gold_caravan_expedition_haul_tt: "#GДо запасів нашого ринку в [ROOT.GetCountry.GetCapital.Custom('LR_PREP')] [ROOT.GetCountry.GetCapital.GetName] додано [ROOT.GetVariable('gold_caravan_last_haul').GetValue|V0]#! [ShowGoodsName('goods_gold')]"
  gold_caravan_outcome_windfall: "Купці стікаються до успішного каравану"
  gold_caravan_outcome_nickname: "Очільник каравану здобуває золоту славу"
  gold_caravan_outcome_midas: "Правителя торкнулося багатство каравану"
  gold_caravan_outcome_leader_skills: "Очільник каравану здобуває досвід, здобутий важкою працею"
  cibola_expedition: "Пошуки семи міст Сіболи"
  cibola_expedition_desc: "Ви спорядите караван, щоб вирядити його на північ від узбережжя Сонори — до краю, який ченці та невільники-втікачі називають землею семи золотих пуебло. Шлях туди непростий, а місцеві племена не люблять чужинців, утім ті самі ченці запевняють, що на цих землях на нас чекають небачені багатства."
  quivira_expedition: "Пошуки королівства Ківіра"
  quivira_expedition_desc: "Ви здійсните ривок крізь землі пуебло у велетенське море трави, що розкинулося на сході. Провідник-бранець запевняє, що за місяць подорожі цією безкрайньою рівниною лежить багате королівство. Трав’яне море пустельне, а його річки течуть поволі, але нагорода, якщо вона взагалі існує, дорівнюватиме підкоренню всього Перу."
  sierra_de_la_plata_expedition: "Пошуки Сьєрра-де-ла-Плати"
  sierra_de_la_plata_expedition_desc: "Ви вирушите на північний захід від Ла-Плати до передгір’їв Анд, щоб знайти срібну гору Сьєрра-де-ла-Плата, про яку розповідають провідники-гуарані та вцілілі учасники виправи Соліса. Ця гора — не просто ще одне родовище коштовного металу: вона здатна дати початок цілій галузі господарства."
  norumbega_expedition: "Пошуки Норумбеги"
  norumbega_expedition_desc: "Ви вирушите від узбережжя Нової Англії вгору Пенобскотом, щоб знайти оточене мурами місто Норумбега, про яке розповідають лоцмани Верраццано та бристольські рибалки. Шлях туди пролягає крізь безкраї ліси, де живуть негостинні тубільці, але якщо це місто справді існує, воно є другим поселенням європейського штибу в Новому Світі — і першим, зведеним не нами."
  saguenay_expedition: "Пошуки королівства Сагеней"
  saguenay_expedition_desc: "Ви вирушите вгору Сагенеєм від річки Святого Лаврентія, щоб пройти вглиб Нової Франції та відшукати королівство, про яке Доннакона розповідав Картьє в Стадаконі. За словами вождя, край, де живуть світлошкірі люди в хутряних плащах, здіймаються золоті гори та течуть срібні ріки, лежить на північ від великої канадської річки. Картьє так і не спромігся його відшукати. Ми зможемо."
  city_of_caesars_expedition: "Пошуки Міста Цезарів"
  city_of_caesars_expedition_desc: "Вирядіть суходільну виправу в серце Патагонії — на південь від #TOOLTIP:REGION,la_plata_region,X #L Ла-Плати#!#!. Моряки, які вижили після кораблетрощі, твердять, що бачили місто, зведене між двома горами. Його жителі розмовляють кастильським діалектом іспанської мови, якого не визнає жоден із нинішніх дворів. Патагонська зима сувора, а вцілілі моряки — непевні свідки, проте жодного розслідування щодо цього так і не провели."
  city_of_caesars_expedition_historical_info: "Аж до XVIII століття іспанські монархи вірили в існування Міста Цезарів — нібито схованого в глибині краю іспаномовного поселення, заснованого моряками, які вижили після кораблетрощі біля узбережжя Патагонії в XVI столітті. У період з 1530 по 1750 рік на його пошуки вирушило щонайменше сім виправ, але всі вони так нічого й не знайшли. В основі цієї легенди лежав збіг одразу кількох обставин. По-перше, Патагонію в той час було справді важко дослідити. По-друге, вцілілі після кораблетрощ часом переповідали безліч історій, які пояснювали тривалу відсутність цих моряків. По-третє, колоніальні чиновники не нехтували правдоподібними чутками, а завжди приймали їх на віру."
  city_of_caesars_expedition_outcome_overview: "$BULLET$Пошуки забезпечують постійний приплив [Concept('prestige', 'слави')|e].\n$BULLET$Результат залежить від кількости знайдених слідів:\n$BULLET_WITH_TAB$Нічого не знайдено: #R -5#! одиниць [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$Знайдено один слід чи більше: #G +10#! одиниць [Concept('prestige', 'слави')|e], [Concept('gold', 'гроші')|e] та постійний [Concept('location_modifier', 'модифікатор місцевості')|e] «[ShowModifier('city_of_caesars_discovered')]» на місці міста.\n$BULLET_WITH_TAB$Знайдено чотири сліди чи більше: #G +20#! одиниць [Concept('prestige', 'слави')|e] і ще більше [Concept('gold', 'грошей')|e].\n$BULLET$Усі зібрані під час пошуків багатства надходять на наш [Concept('market', 'ринок')|e], а найкращі артефакти стають [Concept('work_of_art', 'витворами')|e]."
  el_dorado_expedition: "Пошуки Ельдорадо"
  el_dorado_expedition_desc: "Вирушайте вглиб материка з дельти Оріноко на пошуки позолоченого короля, про якого повідають муїски — вождя, якого щороку помазують золотим пилом у самісінькому серці королівства, куди ще не ступала нога підданого іспанської корони. Джунглі тут густі, річки звивисті, а тубільці — обережні. Золото, якщо воно справді існує, сховане десь за ними."
  el_dorado_expedition_historical_info: "Гуатавіта — це священне озеро, розташоване в кратері згаслого вулкана у високогір’ї сучасної Колумбії. Воно було культовим осередком конфедерації муїска, що правила саваною Боготи до приходу іспанців у 30-х роках XVI століття. З ним пов’язаний справжній звичай, що ліг в основу легенди про Ельдорадо й побутував аж до раннього колоніального періоду: нового вождя обтирали золотим пилом і везли до озера. Там вождь стрибав у воду і плив назад, змиваючи тим самим «золоту шкіру». Однак королівство муїсків, виснажене віспою та політичною кризою, якою майже незмінно супроводжувалися спалахи європейських пошестей, на час прибуття першої європейської виправи вже занепадало."
  el_dorado_expedition_outcome_overview: "$BULLET$Пошуки Ельдорадо забезпечують постійний приплив [Concept('prestige', 'слави')|e].\n$BULLET$Результат залежить від кількости знайдених слідів:\n$BULLET_WITH_TAB$Нічого не знайдено: #R -10#! одиниць [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$Знайдено один слід чи більше: #G +10#! одиниць [Concept('prestige', 'слави')|e], [Concept('gold', 'гроші')|e] та постійний [Concept('location_modifier', 'модифікатор місцевості')|e] «[ShowModifier('el_dorado_discovered')]» на місці міста.\n$BULLET_WITH_TAB$Знайдено п’ять слідів чи більше: #G +20#! одиниць [Concept('prestige', 'слави')|e] і ще більше [Concept('gold', 'грошей')|e].\n$BULLET$Усі багатства, дивовижний крам та зібрані під час пошуків артефакти доставляються на наш [Concept('market', 'ринок')|e], а найкращі з них стають [Concept('work_of_art', 'витворами')|e]."
  fountain_of_youth_expedition: "Пошуки джерела вічної молодости"
  fountain_of_youth_expedition_desc: "Спорядіть невелику виправу на півострів Флорида в пошуках джерела, яке таїно називають «Фонтаном Біміні». За словами старійшин, вода з цього джерела повертає чоловікам силу, а жінкам — юність і красу. Іспанські вояки глузують із цієї вигадки. А старі з островів — ні."
  fountain_of_youth_expedition_historical_info: "Подорож Хуана Понсе де Леона до Флориди в 1513 році заведено пов’язувати з пошуками джерела вічної молодости. Але цей зв’язок виник в іспанських часописах лише після смерти конкістадора. Пізніші історики, яким захоплива оповідка видалася корисною, закріпили її. Насправді ж ця мандрівка була звичайною розвідувальною справою. Її спорядили за кошт приватного вкладника, який мав намір звести укріплення для торгівлі невільниками у Флориді, яку тоді вважали островом. Ім’я Понсе де Леона почали пов’язувати з джерелом молодости тому, що він помер молодим — на шостому десятку літ — від рани стрілою, яку дістав у Флориді. Іспанські літописці наступного покоління просто не змогли втриматися від іронії щодо такого збігу обставин."
  fountain_of_youth_expedition_outcome_overview: "$BULLET$Пошуки джерела забезпечують постійний приплив [Concept('prestige', 'слави')|e].\n$BULLET$Підсумок залежить від числа знайдених слідів:\n$BULLET_WITH_TAB$Нічого не знайдено: #R -5#! одиниць [Concept('prestige', 'слави')|e].\n$BULLET_WITH_TAB$Знайдено один слід або більше: #G +10#! одиниць [Concept('prestige', 'слави')|e] та постійний [Concept('location_modifier', 'модифікатор місцевости')|e] «[ShowModifier('fountain_of_youth_discovered')]».\n$BULLET_WITH_TAB$Знайдено п’ять слідів або більше: #G +20#! одиниць [Concept('prestige', 'слави')|e].\n$BULLET$Усі води, знайдені під час виправи, дають модифікатор «[ShowModifier('rejuvenating_waters_modifier')]» і подовжують життя наших [Concept('ruler', 'правителя')|e] та [Concept('heir', 'спадкоємця')|e]. Також до нашого двору як новий [Concept('character', 'персонаж')|e] може приєднатися тубілець-лікар."
  gold_fleet_tierra_firme_expedition: "Галеони Тьєрра-Фірме"
  gold_fleet_tierra_firme_expedition_desc: "Виправте супровід галеонів із головного порту метрополії, щоби забрати вантаж срібла, коштовного каміння та шкур із наших володінь у Новій Гранаді та на Панамському перешийку. Флот Тьєрра-Фірме — найважливіша артерія іспанської колоніальної імперії, що несе багатства Нового Світу на ринки Севільї."
  gold_fleet_tierra_firme_expedition_historical_info: "#italic Галеони Тьєрра-Фірме#! були одним із двох супроводів іспанського #italic Срібного флоту#!. На флот Тьєрра-Фірме покладали завдання забезпечувати торгівлю з віцекоролівствами Південної Америки. Його кораблі вивозили срібло, видобуте в копальнях Потосі у Верхньому Перу, а також інший колоніальний крам через порти Портобело та Картахени. Срібло доправляли через Панамський перешийок суходолом із тихоокеанського узбережжя й лише тоді вантажили на галеони. Філіп II закріпив порядок супроводів у 1566 році, наказавши перевозити всі вантажі у складі озброєних ескадр. Колоніальний крам завозили через Севілью, при цьому #italic Каса-де-Контратасьйон#! стягувала на користь держави #italic quinto real#! — п’яту частку всіх коштовних металів, видобутих у Новому Світі."
  gold_fleet_tierra_firme_expedition_outcome_overview: "Завантаживши в наших колоніях #TOOLTIP:GOODS,silver,X #L срібло#!#! та #TOOLTIP:GOODS,goods_gold,X #L золото#!#!, супровід доправляє їх на батьківщину у вигляді [Concept('gold', 'грошей')|e] і після прибуття дає #G +10#! до [Concept('prestige', 'слави')|e]. Якщо взяти на борт #TOOLTIP:GOODS,gems,X #L коштовне каміння#!#!, #TOOLTIP:GOODS,pearls,X #L перли#!#! або караван мулів, цінність вантажу зросте, проте супровід привертатиме більше уваги. Зустріч із флотом Нової Іспанії на острові [ShowScriptedGeographyName('island_of_cuba_geography')] додатково принесе #G +10#! до [Concept('prestige', 'слави')|e] і зробить безпечнішим перехід через Атлантику. Частина супроводу може бути втрачена через шторми й напади піратів, а в найгіршому разі загине весь супровід."
  gold_fleet_nueva_espana_expedition: "Флот Нової Іспанії"
  gold_fleet_nueva_espana_expedition_desc: "Виправте супровід Нової Іспанії з головного порту метрополії, щоби забрати вантаж срібла й цінних барвників із наших володінь у Мезоамериці. Флот проходить через протоку Мона до Карибського моря і збирається в Гавані перед переходом через Атлантику."
  gold_fleet_nueva_espana_expedition_historical_info: "#italic Флот Нової Іспанії#! був одним із двох супроводів іспанського #italic Срібного флоту#!. Його кораблі забезпечували торгівлю з віцекоролівством Нова Іспанія, перевозячи срібло з копалень Сакатекаса, Ґуанахуато та інших мексиканських родовищ, а також кошеніль з Оахаки, індиго, ваніль та какао. Завантаження відбувалося в порту Сан-Хуан-де-Улуа поблизу Веракруса. Зазвичай супровід вирушав з Іспанії навесні й повертався восени, з’єднуючись у Гавані з галеонами Тьєрра-Фірме для спільного переходу через Атлантику. Його шлях пролягав через протоку Мона між Еспаньйолою та Пуерто-Рико — звичним шляхом до східної частини Карибського моря."
  gold_fleet_nueva_espana_expedition_outcome_overview: "Завантаживши в наших колоніях #TOOLTIP:GOODS,silver,X #L срібло#!#! та #TOOLTIP:GOODS,goods_gold,X #L золото#!#!, супровід доправляє їх на батьківщину у вигляді [Concept('gold', 'грошей')|e] і після прибуття дає #G +10#! до [Concept('prestige', 'слави')|e]. Якщо супроводжувати караван зі сріблом або взяти на борт #TOOLTIP:GOODS,lumber,X #L деревину#!#!, цінність вантажу зросте, проте супровід привертатиме більше уваги. Зустріч із галеонами Тьєрра-Фірме на острові [ShowScriptedGeographyName('island_of_cuba_geography')] додатково принесе #G +10#! до [Concept('prestige', 'слави')|e] і зробить безпечнішим перехід через Атлантику. Частина супроводу може бути втрачена через шторми й напади піратів, а якщо не пощастить, загине весь супровід."
  gold_fleet_tierra_firme_expedition_expedition_special: "Вантаж грошей на борту: [EXPEDITION.GetVariable('gold_fleet_cargo')|0]"
  gold_fleet_nueva_espana_expedition_expedition_special: "Вантаж грошей на борту: [EXPEDITION.GetVariable('gold_fleet_cargo')|0]"
  gold_fleet_cargo: "Вантаж скарбів"
  gold_fleet_cargo_desc: "Срібло й золото, завантажене на кораблі під час мандрівки, у разі безпечного повернення флоту надійде до нашої скарбниці."
  gold_fleet_danger: "Рівень небезпеки"
  gold_fleet_danger_desc: "Загроза нападу піратів та інших негараздів під час мандрівки. Може змінюватися залежно від зробленого вибору."