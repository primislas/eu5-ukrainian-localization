l_russian:
  musicplayer_sol_byzantine_hymn_melodies: "Візантія — мелодії гімнів"
  musicplayer_sol_byzantine_hymn_melodies_flavour: "Цей гімн ґрунтується на мелодійній спадщині візантійського григоріанського хоралу, сформованій модальною системою з восьми ладів, яка впродовж століть визначала православну церковну музику."
  musicplayer_sol_byzantine_hymn_no_136: "Візантія — гімн 136"
  musicplayer_sol_byzantine_hymn_no_136_flavour: "Аранжування візантійського 136-го псалма, що починається з молитви «Отче наш» та приспіву «Екзомологісте то Кіріо, оті агатос» (Славте Господа, бо Він благий), у давньому стилі православного піснеспіву."
  musicplayer_sol_byzantine_o_virgin_pure: "Візантія — «Агні Парфене»"
  musicplayer_sol_byzantine_o_virgin_pure_flavour: "Грецький гімн до Богородиці «Агні Парфене» (Чиста Діво Владичице), складений святителем Нектарієм Егінським наприкінці XIX століття, вперше був опублікований у його «Теотокаріоні» 1905 року."
  musicplayer_sol_byzantine_overture_ii_odyssey: "Візантія — Увертюра II Одіссея"
  musicplayer_sol_byzantine_overture_ii_odyssey_flavour: "Увертюра до головної теми гри, переосмислена в музичних традиціях Східної Римської імперії. Це аранжування натхненне візантійським григоріанським хоралом, що колись лунав у церквах Константинополя."
