l_english:
 dlc_cosmetic_pack: "Cosmetic Pack"
 dlc_immersion_pack: "Immersion Pack"
 dlc_chronicle_pack: "Chronicle Pack"
 dlc_expansion_pack: "Expansion Pack"
 
 ancient_monuments_pack_key: "#italic Monumental Bonus#!"
 ancient_monuments_pack_desc: "The [GameDLC.GetName] [GameDLC.GetCategoryKey] adds new graphics to a set of eight buildings for #italic Europa Universalis V#!, allowing you to decorate your game with ancient historical landmarks."
 ancient_monuments_pack_activate_desc: "Subscribe to the Paradox newsletter with your Paradox account to activate it!"

 sacred_sites_pack_key: "#italic Sacred Sites#!"
 sacred_sites_pack_desc: "The [GameDLC.GetName] [GameDLC.GetCategoryKey] adds new graphics to a set of eight holy sites for #italic Europa Universalis V#!, allowing you to decorate your game with these relevant religious landmarks."
 sacred_sites_pack_activate_desc: "Acquire the Premium Edition to activate it!"
 
 fate_of_the_phoenix_key: "#italic Fate of the Phoenix#!"
 fate_of_the_phoenix_dlc_desc: "Relive or revive the fading glories of the Eastern Roman Empire in [GameDLC.GetName], an [GameDLC.GetCategoryKey] for #italic Europa Universalis V#!. Torn by civil strife as the [ShowSituationName('rise_of_the_ottomans')] begins and [GetCountry('SER').GetName] and [GetCountry('BUL').GetName] press on its borders, [GetCountry('BYZ').GetName] must restore the authority of the crown before it is too late.\n\nSurvive the [ShowDisasterName('fate_of_the_phoenix')], choose between $latinization_focus$ and $hellenization_focus$ as you turn to the Latin West or hold fast to the Roman inheritance, and rebuild the imperial administration with new Byzantine bureaucracies. Raise [ShowUnitDefinitionName('a_byzantine_cataphracts_2')] and [ShowUnitDefinitionName('a_legionaries_1')] once more, assert [ShowLocationName('constantinople')]'s place among the [pentarchy|e], revive the old gods of [ShowReligionName('hellenism_religion')], and restore [GetFormableCountry('ROM').GetName] itself."
 fate_of_the_phoenix_dlc_features: "#T New content for the Byzantine Empire:#!\n$BULLET$#L Fate of the Phoenix#!: a disaster in which Byzantium must end its civil strife and restore the authority of the crown\n$BULLET$#L Latinitas vs Rōmanismós#!: a societal value between the Latin West and the Roman inheritance, with its own events\n$BULLET$#L Byzantine Bureaucracy#!: 11 new bureaucracies of the imperial administration\n$BULLET$#L Pentarchy#!: new Orthodox actions, from mending the schism to restoring the primacy of Rome\n$BULLET$#L Hellenism#!: reestablish the old faith, with new religious aspects and omens for its gods\n$BULLET$#L Byzantine succession#!, the Prónoia subject type and the Restore the Roman Borders casus belli\n$BULLET$#L Legionaries#!, #L cataphracts#! and #L Greek-fire infantry#! and galleys\n$BULLET$#L New Byzantine art#!, a Hagia Sophia monument and Byzantine hymns"
 fate_of_the_phoenix_activate_desc: "Acquire the Premium Edition or buy it separately from the store to activate it!"

 across_the_pillars_key: "#italic Across the Pillars#!"
 across_the_pillars_dlc_desc: "Fight for the supremacy of [ShowRegionName('iberia_region')] in [GameDLC.GetName], a [GameDLC.GetCategoryKey] for #italic Europa Universalis V#!. Complete the #italic Reconquista#! as [GetCountry('CAS').GetName], cross the Strait as Marinid [GetCountry('MOR').GetName], or hold Nasrid [GetCountry('GRA').GetName] between them and restore the glory of $ADU_arabic$.\n\nThe [ShowSituationName('battle_for_the_strait')] pits the three against each other over the fate of [GetCountry('GRA').GetNameWithNoTooltip], and its winner opens the [ShowSituationName('golden_century')], an age of expansion across Europe and the New World. Bind the Iberian crowns through the [ShowHeirSelectionName('iberian_union_succession')], lead each $iberian_military_order_type$, from Santiago, Calatrava and Alcántara to Montesa, Avis and Christ, and send the Treasure Fleet home from the Indies and explorers after El Dorado, with new flavor for every realm from [GetCountry('POR').GetName] to the [ShowRegionName('maghreb_region')]."
 across_the_pillars_dlc_features: "#T New content for Iberian and Maghrebi countries:#!\n$BULLET$#L Battle for the Strait#!: Castile, Morocco and Granada contest the fate of Nasrid Granada\n$BULLET$#L Golden Century#!: a follow-up situation for the winner, with separate paths for Castile and for Granada or Morocco\n$BULLET$#L Iberian Union#!: a reworked Iberian Wedding with new laws and policies, leading to a centralized Spain or a federal Hispanic Monarchy\n$BULLET$#L Iberian Military Orders#!: Santiago, Calatrava, Alcántara, Avis, Montesa and the Order of Christ\n$BULLET$Iberian crusade and jihad actions\n$BULLET$#L Unique expeditions#!: the Spanish treasure fleets and the search for El Dorado and other legendary cities\n$BULLET$#L Sephardi#! and #L Mudéjar#! event chains\n$BULLET$#L New bureaucracies#!, government reforms, estate privileges, laws, units and levies for Iberia and the Maghreb\n$BULLET$New Castilian and Moroccan #L art#! and #L music#!"
 across_the_pillars_activate_desc: "Acquire the Premium Edition or buy it separately from the store to activate it!"