 fate_of_the_phoenix_key: "#italic Fate of the Phoenix#!"
 fate_of_the_phoenix_dlc_desc: "С вашей помощью Восточная Римская империя либо угаснет, либо возродится в дополнении [GameDLC.GetName] для #italic Europa Universalis V#!.\n\nЭто [GameDLC.GetCategoryKey|l] добавляет в игру уникальные механики и материалы, новые исторические события и альтернативные пути развития для Византийской империи."
