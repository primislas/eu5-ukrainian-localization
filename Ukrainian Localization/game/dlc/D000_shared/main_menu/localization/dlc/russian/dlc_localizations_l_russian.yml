 ancient_monuments_pack_key: "#italic Monumental Bonus#!"
 ancient_monuments_pack_desc: "[GameDLC.GetCategoryKey] [GameDLC.GetName] содержит новые графические модели для восьми сооружений в #italic Europa Universalis V#! и позволяет украсить игру древними историческими достопримечательностями."
