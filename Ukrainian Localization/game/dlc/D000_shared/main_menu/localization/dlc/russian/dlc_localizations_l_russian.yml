l_russian:
 dlc_cosmetic_pack: "Косметическое дополнение"
 dlc_immersion_pack: "Дополнение"
 dlc_chronicle_pack: "Дополнение-хроника"
 dlc_expansion_pack: "Расширение"
 ancient_monuments_pack_key: "Europa Universalis V — косметическое дополнение Monumental Bonus"
 ancient_monuments_pack_desc: "Косметическое дополнение Monumental Bonus содержит новые графические модели для восьми сооружений в #italic Europa Universalis V#!, позволяя украсить игру этими древними историческими достопримечательностями."
 ancient_monuments_pack_activate_desc: "Для активации подпишитесь на рассылку Paradox, используя свою учётную запись Paradox!"
 sacred_sites_pack_key: "Europa Universalis V Sacred Sites — Cosmetic Pack"
 sacred_sites_pack_desc: "Косметическое дополнение Sacred Sites содержит новые графические модели для восьми святынь в #italic Europa Universalis V#!, позволяя украсить игру этими религиозными достопримечательностями."
 sacred_sites_pack_activate_desc: "Приобретите Премиумное издание, чтобы его активировать!"
 fate_of_the_phoenix_key: "#italic Fate of the Phoenix#!"
 fate_of_the_phoenix_dlc_desc: "С вашей помощью Восточная Римская империя либо угаснет, либо возродится в дополнении [GameDLC.GetName] для #italic Europa Universalis V#!. В разгар гражданской смуты, когда начинается ситуация [ShowSituationName('rise_of_the_ottomans')], а [GetCountry('SER').GetName] и [GetCountry('BUL').GetName] давят на границы, [GetCountry('BYZ').GetName] — страна, которой нужно восстановить власть короны, пока не стало слишком поздно.\n\nПереживите бедствие «[ShowDisasterName('fate_of_the_phoenix')]», выберите: $latinization_focus$ или $hellenization_focus$ — обратиться к латинскому Западу или хранить верность римскому наследию, — и отстройте имперскую администрацию с помощью новых византийских бюрократических механизмов. Вновь соберите армии: [ShowUnitDefinitionName('a_byzantine_cataphracts_2')] и [ShowUnitDefinitionName('a_legionaries_1')], утвердите место города [ShowLocationName('constantinople')] среди пяти патриархатов ([pentarchy|e]), возродите древних богов (религия: [ShowReligionName('hellenism_religion')]) и восстановите саму империю: [GetFormableCountry('ROM').GetName]."
 fate_of_the_phoenix_dlc_features: "#T Новое содержание для Византийской империи:#!\n$BULLET$#L Судьба феникса#!: бедствие, в котором Византия должна покончить с гражданской смутой и восстановить власть короны\n$BULLET$#L Латинство — Ромейство#!: общественная ценность между латинским Западом и римским наследием, с собственными событиями\n$BULLET$#L Византийская бюрократия#!: 11 новых бюрократических механизмов имперской администрации\n$BULLET$#L Пентархия#!: новые православные действия — от преодоления раскола до восстановления первенства Рима\n$BULLET$#L Эллинизм#!: возродите древнюю веру, с новыми религиозными аспектами и предзнаменованиями для её богов\n$BULLET$#L Византийская система наследования#!, тип ленника «Пронии» и повод для войны «Восстановление римских границ»\n$BULLET$#L Легионеры#!, #L катафрактарии#! и #L пехота и галеры с греческим огнём#!\n$BULLET$#L Новое византийское искусство#!, памятник Собору Святой Софии и византийские гимны"
 fate_of_the_phoenix_activate_desc: "Чтобы активировать дополнение, приобретите премиум-издание или купите его в магазине отдельно!"
 across_the_pillars_key: "#italic Across the Pillars#!"
 across_the_pillars_dlc_desc: "Сразитесь за господство в регионе [ShowRegionName('iberia_region')] в дополнении [GameDLC.GetName] для #italic Europa Universalis V#!. Выберите свой путь: завершить #italic Реконкисту#! ([GetCountry('CAS').GetName]), пересечь пролив во главе маринидов ([GetCountry('MOR').GetName]) или удержать насридов ([GetCountry('GRA').GetName]) между ними — и возродить былую славу $ADU_arabic$.\n\nСитуация [ShowSituationName('battle_for_the_strait')] сталкивает троих между собой в борьбе за судьбу государства [GetCountry('GRA').GetNameWithNoTooltip], а победитель открывает ситуацию [ShowSituationName('golden_century')] — эпоху экспансии по всей Европе и Новому Свету. Свяжите иберийские короны с помощью механизма: [ShowHeirSelectionName('iberian_union_succession')], возглавьте каждый $iberian_military_order_type$ — от Сантьяго, Калатравы и Алькантары до Монтесы, Авис и Христа, — отправьте домой Золотой флот из Индий и снарядите исследователей на поиски Эльдорадо; для каждого государства, включая [GetCountry('POR').GetName] и регион [ShowRegionName('maghreb_region')], добавлены новые самобытные материалы."
 across_the_pillars_dlc_features: "#T Новое содержание для стран Иберии и Магриба:#!\n$BULLET$#L Битва за пролив#!: Кастилия, Марокко и Гранада спорят о судьбе насридской Гранады\n$BULLET$#L Золотой век#!: следующая ситуация для победителя, с отдельными путями для Кастилии и для Гранады или Марокко\n$BULLET$#L Иберийская уния#!: переработанная Пиренейская свадьба с новыми законами и политиками, ведущая к централизованной Испании или федеративной Испанской монархии\n$BULLET$#L Иберийские военные ордена#!: Сантьяго, Калатрава, Алькантара, Ависский орден, Монтеса и Орден Христа\n$BULLET$Иберийские действия крестового похода и джихада\n$BULLET$#L Уникальные экспедиции#!: испанские золотые флоты и поиски Эльдорадо и других легендарных городов\n$BULLET$Цепочки событий о #L сефардах#! и #L мудехарах#!\n$BULLET$#L Новые бюрократические механизмы#!, государственные принципы, сословные привилегии, законы, войска и ополчения для Иберии и Магриба\n$BULLET$Новое кастильское и марокканское #L искусство#! и #L музыка#!"
 across_the_pillars_activate_desc: "Чтобы активировать дополнение, приобретите премиум-издание или купите его в магазине отдельно!"