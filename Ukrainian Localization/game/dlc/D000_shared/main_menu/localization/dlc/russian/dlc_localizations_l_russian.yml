l_russian:
 dlc_cosmetic_pack: "Косметическое дополнение"
 dlc_immersion_pack: "Дополнение"
 dlc_chronicle_pack: "Дополнение-хроника"
 dlc_expansion_pack: "Расширение"
 ancient_monuments_pack_key: "Europa Universalis V — косметическое дополнение Monumental Bonus"
 ancient_monuments_pack_desc: "Косметическое дополнение Monumental Bonus содержит новые графические модели для восьми сооружений в #italic Europa Universalis V#!, позволяя украсить игру этими древними историческими достопримечательностями."
 ancient_monuments_pack_activate_desc: "Для активации подпишитесь на рассылку Paradox, используя свою учётную запись Paradox!"
 sacred_sites_pack_key: "Europa Universalis V Sacred Sites — Cosmetic Pack"
 sacred_sites_pack_desc: "Косметическое дополнение Sacred Sites содержит новые графические модели для восьми святынь в #italic Europa Universalis V#!, позволяя украсить игру этими религиозными достопримечательностями."
 sacred_sites_pack_activate_desc: "Приобретите Премиумное издание, чтобы его активировать!"
 fate_of_the_phoenix_key: "#italic Fate of the Phoenix#!"
 fate_of_the_phoenix_dlc_desc: "С вашей помощью Восточная Римская империя либо угаснет, либо возродится в дополнении [GameDLC.GetName] для #italic Europa Universalis V#!.\n\nЭто [GameDLC.GetCategoryKey|l] добавляет в игру уникальные механики и материалы, новые исторические события и альтернативные пути развития для Византийской империи."
 fate_of_the_phoenix_activate_desc: "Чтобы активировать дополнение, приобретите премиум-издание или купите его в магазине отдельно!"
 across_the_pillars_key: "#italic Across the Pillars#!"
 across_the_pillars_dlc_desc: "Сражайтесь за господство над Иберией в [GameDLC.GetName] — [GameDLC.GetCategoryKey] для #italic Europa Universalis V#!; завершите реконкисту или возродите славу Аль-Андалуса.\n\nЭто DLC добавляет новый исторический колорит и контент для Кастилии, Марокко и Гранады, включая уникальные механики, исторические варианты и альтернативные исторические пути развития."
 across_the_pillars_activate_desc: "Чтобы активировать дополнение, приобретите премиум-издание или купите его в магазине отдельно!"