l_russian:
  ancient_monuments_pack_key: "Europa Universalis V Monumental Bonus — Cosmetic Pack"
  ancient_monuments_pack_desc: "Косметичне доповнення Monumental Bonus додає нові графічні моделі для восьми споруд у #italic Europa Universalis V#!, дозволяючи вам прикрасити свою гру цими стародавніми історичними пам'ятками."
  ancient_monuments_pack_activate_desc: "Підпишіться на розсилку Paradox, використовуючи свій обліковий запис Paradox, щоб його активувати!"
  sacred_sites_pack_key: "Europa Universalis V Sacred Sites — Cosmetic Pack"
  sacred_sites_pack_desc: "Косметичне доповнення Sacred Sites додає нові графічні моделі для восьми святинь у #italic Europa Universalis V#!, дозволяючи вам прикрасити свою гру цими релігійними пам'ятками."
  sacred_sites_pack_activate_desc: "Придбайте Преміумне видання, щоб його активувати!"
  fate_of_the_phoenix_key: "#italic Доля Фенікса#!"
  fate_of_the_phoenix_dlc_desc: "Проживіть заново або відродіть згаслу славу Східної Римської імперії у [GameDLC.GetName], [GameDLC.GetCategoryKey] для #italic Europa Universalis V#!.\n\nЦе доповнення додає Візантійській імперії історичного колориту: на вас чекають самобутні механіки, події та розмаїті шляхи розвитку — як достеменні, так і засновані на припущеннях «а що, якби»."
  fate_of_the_phoenix_activate_desc: "Придбайте Преміальне видання або купіть додаток окремо у крамниці, щоб активувати його!"