l_russian:
  dlc_cosmetic_pack: "Косметичне доповнення"
  dlc_immersion_pack: "Доповнення"
  dlc_chronicle_pack: "Доповнення-хроніка"
  dlc_expansion_pack: "Розширення"
  ancient_monuments_pack_key: "#italic Monumental Bonus#!"
  ancient_monuments_pack_desc: "Косметичне доповнення Monumental Bonus (Монументи) містить нові графічні моделі для восьми споруд у #italic Europa Universalis V#!, що дає змогу прикрасити гру цими стародавніми історичними пам’ятками."
  ancient_monuments_pack_activate_desc: "Для активації підпишіться на розсилку Paradox, використовуючи свій обліковий запис Paradox!"
  sacred_sites_pack_key: "#italic Sacred Sites#!"
  sacred_sites_pack_desc: "Косметичне доповнення Sacred Sites (Святині) містить нові графічні моделі для восьми святинь у #italic Europa Universalis V#!, що дає змогу прикрасити гру цими священними пам’ятками."
  sacred_sites_pack_activate_desc: "Придбайте Преміумне видання, щоб його активувати!"
  fate_of_the_phoenix_key: "#italic Fate of the Phoenix#!"
  fate_of_the_phoenix_dlc_desc: "З вашою допомогою Східна Римська імперія або згасне, або відродиться в доповненні [GameDLC.GetName] для #italic Europa Universalis V#!.\n\nЦе [GameDLC.GetCategoryKey|l] додає в гру унікальні механіки та матеріали, нові історичні події та альтернативні шляхи розвитку для Візантійської імперії."
  fate_of_the_phoenix_activate_desc: "Щоб активувати доповнення, придбайте преміумвидання або купіть його в крамниці окремо!"
  across_the_pillars_key: "#italic Across the Pillars#!"
  across_the_pillars_dlc_desc: "Боріться за панування над Іберією в [GameDLC.GetName] — доповненні для #italic Europa Universalis V#!; завершіть реконкісту або відродіть славу Аль-Андалусу.\n\nЦей DLC додає новий історичний колорит і вміст для Кастилії, Марокко та Гранади, зокрема унікальні механіки, історичні вибори та альтернативні історичні шляхи розвитку."
  across_the_pillars_activate_desc: "Щоб активувати доповнення, придбайте преміумвидання або купіть його в крамниці окремо!"