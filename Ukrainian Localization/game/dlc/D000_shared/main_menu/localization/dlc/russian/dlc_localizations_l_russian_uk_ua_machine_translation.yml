l_russian:
 dlc_cosmetic_pack: "Косметичне доповнення"
 dlc_immersion_pack: "Доповнення"
 dlc_chronicle_pack: "Доповнення-хроніка"
 dlc_expansion_pack: "Розширення"
 ancient_monuments_pack_key: "#italic Монументи#!"
 ancient_monuments_pack_desc: "Косметичне доповнення Монументи (Monumental Bonus) містить нові графічні моделі для восьми споруд у #italic Europa Universalis V#!, що дає змогу прикрасити гру цими стародавніми історичними пам’ятками."
 ancient_monuments_pack_activate_desc: "Для активації підпишіться на розсилку Paradox, використовуючи свій обліковий запис Paradox!"
 sacred_sites_pack_key: "#italic Святині#!"
 sacred_sites_pack_desc: "Косметичне доповнення Святині (Sacred Sites) містить нові графічні моделі для восьми святинь у #italic Europa Universalis V#!, що дає змогу прикрасити гру цими священними пам’ятками."
 sacred_sites_pack_activate_desc: "Придбайте Преміумне видання, щоб його активувати!"
 fate_of_the_phoenix_key: "#italic Доля Фенікса#!"
 fate_of_the_phoenix_dlc_desc: "З вашою допомогою Східна Римська імперія або згасне, або відродиться в доповненні [GameDLC.GetName] для #italic Europa Universalis V#!.\n\nЦе [GameDLC.GetCategoryKey|l] додає в гру унікальні механіки та матеріали, нові історичні події та альтернативні шляхи розвитку для Візантійської імперії."
 fate_of_the_phoenix_dlc_features: "#T Новий вміст для Візантійської імперії:#!\n$BULLET$#L Доля Фенікса#!: лихо, в якому Візантія має покласти край міжусобицям і відновити владу корони\n$BULLET$#L Latinitas проти Rōmanismós#!: суспільна цінність між латинським Заходом і ромейською спадщиною з власними подіями\n$BULLET$#L Візантійська бюрократія#!: 11 нових установ імперського врядування\n$BULLET$#L Пентархія#!: нові православні дії — від подолання розколу до відновлення першости Рима\n$BULLET$#L Еллінізм#!: відродіть давню віру з новими уставами віри та знаменнями для її богів\n$BULLET$#L Візантійське престолонаслідування#!, вид васала «Пронія» та привід для війни «Відновлення римських кордонів»\n$BULLET$#L Легіонери#!, #L катафракти#!, #L піхота з грецьким вогнем#! та галеї\n$BULLET$#L Нове візантійське мистецтво#!, пам’ятка «Собор Святої Софії» та візантійські гімни"
 fate_of_the_phoenix_activate_desc: "Щоб активувати доповнення, придбайте преміумвидання або купіть його в крамниці окремо!"
 across_the_pillars_key: "#italic Крізь Геркулесові стовпи#!"
 across_the_pillars_dlc_desc: "Боріться за панування над Іберією в [GameDLC.GetName] — доповненні для #italic Europa Universalis V#!; завершіть реконкісту або відродіть славу Аль-Андалусу.\n\nЦей DLC додає новий історичний колорит і вміст для Кастилії, Марокко та Гранади, зокрема унікальні механіки, історичні вибори та альтернативні історичні шляхи розвитку."
 across_the_pillars_dlc_features: "#T Новий вміст для країн Іберії та Магрибу:#!\n$BULLET$#L Битва за протоку#!: Кастилія, Марокко та Гранада борються за долю Насрідської Гранади\n$BULLET$#L Золота доба#!: подальша криза для переможця з окремими шляхами для Кастилії та для Гранади чи Марокко\n$BULLET$#L Іберійська унія#!: перероблене Іберійське весілля з новими законами та політиками, що веде до зосередженої Іспанії чи федеративної Іспанської монархії\n$BULLET$#L Іберійські лицарські ордени#!: Сантьяго, Калатрава, Алькантара, Авіс, Монтеса та Орден Христа\n$BULLET$Іберійські дії хрестового походу та джихаду\n$BULLET$#L Унікальні виправи#!: іспанські Золоті флоти та пошуки Ельдорадо й інших легендарних міст\n$BULLET$Низки подій для #L сефардів#! та #L мудехарів#!\n$BULLET$#L Нові установи#!, державні реформи, станові привілеї, закони, підрозділи й ополчення для Іберії та Магрибу\n$BULLET$Нове кастильське та марокканське #L мистецтво#! й #L музика#!"
 across_the_pillars_activate_desc: "Щоб активувати доповнення, придбайте преміумвидання або купіть його в крамниці окремо!"