l_russian:
  JOMINI_NOTIFICATION_TIMESTAMP_NOW: "Щойно"
  JOMINI_NOTIFICATION_TIMESTAMP_MINUTES: "$MINUTES$ хв. тому"
  JOMINI_NOTIFICATION_TIMESTAMP: "$DATE$"
  JOMINI_DLC_MANAGER_DISABLED_MODS_CRASH_TITLE: "Модифікації вимкнено"
  JOMINI_DLC_MANAGER_DISABLED_MODS_CRASH_DESC: "Під час останнього запуску гри сталася проблема, ймовірно, через несумісні модифікації.\nДля забезпечення стабільності всі модифікації тимчасово вимкнено.\nЩоб повторно ввімкнути модифікації, відкрийте «$MESSAGE$», видаліть модифікації, що спричиняють проблеми, та підтвердьте зміни."
  JOMINI_DLC_MANAGER_OUTDATED_MODS_ALERT_TITLE: "Знайдено непідтримувані модифікації"
  JOMINI_DLC_MANAGER_OUTDATED_MODS_ALERT_DESC: "Деякі з ваших модифікацій призначені для іншої версії гри $GAME$. Ці модифікації можуть працювати некоректно та спричинити проблеми під час гри. Ми рекомендуємо вимкнути ці модифікації та не підключати їх, доки вони не будуть оновлені.\n\nНе підтримуються такі модифікації:\n$MODS_OUTDATED_LIST$"
  JOMINI_JOIN_SERVER_ALERT_TITLE: "It's not possible to connect to the server"
  JOMINI_JOIN_SERVER_ALERT_DESC: "Please go to main menu to join a game."
  JOMINI_FILE_TRANSFER_ERROR_TITLE: "The file transfer failed"
  JOMINI_FILE_TRANSFER_ERROR_DESC: "Please try again to connect to the server."
  JOMINI_DLC_MANAGER_CONFIRM_UGC_UPLOAD_TITLE: "Confirm UGC Upload"
  JOMINI_DLC_MANAGER_CONFIRM_UGC_UPLOAD_DESC: "Are you sure you want to upload this mod? This will create a new mod on the Steam Workshop.\n\nBy submitting this item, you agree to the workshop terms of service. If you have not agreed to the terms, a Steam overlay window will open that prompts you to read the terms, and your content will be hidden by Steam until you have accepted it."