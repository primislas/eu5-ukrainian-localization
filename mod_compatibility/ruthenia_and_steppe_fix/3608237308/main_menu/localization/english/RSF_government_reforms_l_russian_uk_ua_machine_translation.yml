l_english:

 # Hordes
 nomadic_societies_reform: "Кочові суспільства"
 nomadic_societies_reform_desc: "Унаслідок розпаду Монгольської імперії кочові держави дедалі більше зосереджуються на внутрішньому устрої, а не на зовнішніх зносинах, зміцнюючи владу всередині племінних та шляхетських ієрархій. Зсув підвищує мобілізаційну спроможність як племінних, так і аристократичних ополчень, відображаючи чіткіший розподіл обов'язків у степу."

 # Rus Appanages
 rus_appanage_reform: "Удільний устрій Руси"
 rus_appanage_reform_desc: "Землі Руси розділені між князями правлячого дому, кожен з яких править власним уділом, визнаючи старшинство великого князя. Пов'язані родинними зв'язками та звичаєм, князі Рюриковичі ділять спільну державу, проте ревно бережуть права та привілеї власних володінь."

 # Cossacks & Ukraine
 frontier_liberties_reform: "Порубіжні вольності"
 frontier_liberties_reform_desc: "Людям, які заселяють незахищене порубіжжя, надаються широкі свободи в обмін на захист рідних домівок. Звиклі до зброї та самоврядности, ці поселенці процвітають і здобувають незалежність, поступово надаючи вільним містам та порубіжним громадам вагоміший голос у справах держави."

 kurin_kish_reform: "Курінно-кошовий устрій"
 kurin_kish_reform_desc: "Козацьке Військо було організоване в курені — згуртовані військові спільноти, члени яких спільно відали харчами, житлом та військовими обов'язками. Кіш слугував табором і урядовим осередком Війська, де козаки збиралися для походів та обирали своїх отаманів згідно звичаю. Такий устрій забезпечував порубіжним громадам рівень військового самоврядування, що вирізнявся на тлі навколишнього феодального ладу."

 valok_reform_belarus: "Устава на волоки"
 valok_reform_belarus_desc: "Наші [ShowEstateTypeName('nobles_estate')] більш впорядковані у своїй поведінці щодо підданих. Це підтримує [ShowEstateTypeName('peasants_estate')] в нашій державі, водночас зміцнюючи їхній статус як незалежного стану."

 the_hetmanate_reform: "Гетьманщина"
 the_hetmanate_reform_desc: "Козацька Гетьманщина виникла під час повстання Хмельницького як козацька держава під проводом гетьмана, Генеральної військової ради та ієрархії полкової й сотницької старшини. Її політичний лад поєднував військовий устрій із звичаєвими вольностями козацького війська."

 regimental_administration_reform: "Полковий устрій"
 regimental_administration_reform_desc: "Гетьманщина поділяється на полкові округи, кожним з яких командує полковник, обраний козацькою старшиною. Полки слугують як військовими формуваннями, так і земельно-урядовими одиницями, а полковники здійснюють судочинство, оподаткування, місцеве врядування та скликання козацьких військ через підпорядковані сотні."

 starshyna_reform: "Рада старшини"
 starshyna_reform_desc: "Генеральна старшина формує вище коло козацьких урядовців, яким довірено управління Гетьманщиною та командування її арміями. З двору гетьмана вони керують найважливішими справами держави."

 orlyk_constitution_reform: "Козацька конституція"
 orlyk_constitution_reform_desc: "Написана після бурхливої боротьби за незалежність, Конституція Пилипа Орлика передбачає рівновагу між гетьманом, Козацьким Військом та ширшою політичною спільнотою. Визначаючи права, обов'язки та межі влади, вона зміцнює довіру між станами й сприяє більш стабільному порядку."
