l_english:
 RSF_flavor_glh.1000.title: "Війська Орди розпадаються"
 RSF_flavor_glh.1000.desc: "Кришталева корона, зламана присяга. Залізний зв'язок, що колись тримав орду, розпався — його знищила непевна рука володаря та гниль внутрішніх усобиць. Відданість згасла у байдужості; колись нищівний потік перетворився на мовчазний відступ, коли воїни зникають, мов дим, у пустельних вітрах, залишаючи по собі лише порожні намети та згаслу славу."
 RSF_flavor_glh.1000.entry: "Військо порублене наше, мій брате..."
 RSF_flavor_glh.1000.a: "Це кінець..."
 RSF_flavor_glh.1000.b: "Як виявилося, це були лише балачки."
 RSF_flavor_CRI.1.title: "Дім Ґерай приходить до влади"
 RSF_flavor_CRI.1.desc: "Зі згасанням Золотої Орди Хаджі I Ґерай заснував незалежне Кримське ханство, заклавши підвалини нового правлячого дому. Після тривалих років боротьби за владу він утвердив своє правління у Криму, прагнучи об'єднати татарські клани півострова під власною рукою."
 RSF_flavor_CRI.1.entry: "Новий дім приходить до влади."
 RSF_flavor_CRI.1.a: "Нехай живе хан!"
 RSF_flavor_KZN.1.title: "Тока-Темір приходить до влади"
 RSF_flavor_KZN.1.desc: "Коли Золоту Орду охопила династична міжусобиця, Мухаммед Тока-Темір заявив свої права на владу в регіоні Середнього Поволжя. Спираючись на спадщину Джучидів, він заснував нове ханство з осердям у Казані, заклавши основи татарської держави, що невдовзі взяла під контроль життєво важливі торгові шляхи Волги."
 RSF_flavor_KZN.1.entry: "Новий дім приходить до влади."
 RSF_flavor_KZN.1.a: "Нехай живе хан!"
 RSF_flavor_NOG.1.title: "Дім Мангитів приходить до влади"
 RSF_flavor_NOG.1.desc: "У часи розпаду Золотої Орди Муса з роду Мангитів здобув визнання серед ногайської знаті. Його зростаючий вплив допоміг закласти підвалини Ногайської Орди — конфедерації кочових народів, яка постала як самостійна сила в понтійських та каспійських степах."
 RSF_flavor_NOG.1.entry: "Новий дім приходить до влади."
 RSF_flavor_NOG.1.a: "Нехай живе хан!"
 RSF_flavor_UZB.1.title: "Дім Шибанідів приходить до влади"
 RSF_flavor_UZB.1.desc: "Під час роздроблення Золотої Орди хан Абу-ль-Хаїр піднісся серед узбецької знаті. Його потужний вплив допоміг закласти підвалини Сибірського ханства — конфедерації кочових народів, яка утвердилася як незалежна потуга в Сибіру та Дешт-і-Кипчаку."
 RSF_flavor_UZB.1.entry: "Новий дім приходить до влади."
 RSF_flavor_UZB.1.a: "Нехай живе хан!"