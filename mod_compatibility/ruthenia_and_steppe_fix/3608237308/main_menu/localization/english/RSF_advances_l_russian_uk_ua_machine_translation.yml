l_english:

 # Kyiv
 northern_jerusalem: "Північний Єрусалим"
 northern_jerusalem_desc: "Після Хрещення Руси Київ став одним із найважливіших осередків східного християнства. Його стародавні монастирі, шановані реліквії та духовне просвітництво принесли йому славу «Північного Єрусалима», приваблюючи паломників і духовенство з усього православного світу."

 from_the_ashes: "З попелу"
 from_the_ashes_desc: "Хоча орди Батия перетворили Київ на руїни, місто не загинуло. Його жителі повернулися, храми й майстерні було відбудовано, а торгівля знову вирує Дніпром. Київ повільно відроджується з попелу давньої руської столиці."

 rich_soil: "Родючі ґрунти"
 rich_soil_desc: "Родючі київські землі щедро винагороджують тих, хто готовий підкорити дику природу. У міру того як вирубуються ліси й розорюються нові поля, багаті врожаї дають змогу землеробству поширюватися все далі."


 # Halych + Volhynia
 high_castle: "Високий замок"
 high_castle_desc: "Могутні фортеці Галича та Львова, розташовані на панівних пагорбах, охороняють карпатські рубежі. Їхні стіни стоять непорушним щитом проти загарбників з усіх боків."

 between_four_fires: "Між чотирьох вогнів"
 between_four_fires_desc: "Опинившись між потужними сусідами, галицько-волинські володарі досконало опанували мистецтво рівноваги між чужими честолюбними зазіханнями за допомогою зносин, союзів і зважених угод."

 filvarok_system: "Фільваркова система" # Folwark custom loc
 falvarak_system: "Фальваркова система" # Folwark custom loc

 ruthenian_forests: "Руські ліси"
 ruthenian_forests_desc: "Там, де колись стояли села, ліси знову відвоювали землю. Через брак рук для їх розчищення ліси Русі розпросторилися й буйно розрослися, даючи стільки деревини, хутра, меду та дичини, скільки не бачили вже багато поколінь."


 # Chernihiv + Novhorod-Siverskyi
 olgovych_realm: "Володіння Ольговичів"
 olgovych_realm_desc: "Протягом багатьох поколінь князі Ольговичі залишалися одним з найстійкіших правлячих домів Руси, зберігаючи свою владу завдяки заплутаному порядку престолонаслідування, майстерним зносинам та непохитній стійкості."

 legacy_of_prince_igor: "Спадщина князя Ігоря"
 legacy_of_prince_igor_desc: "Невдалий похід князя Ігоря живе в переказах, надихаючи прийдешні покоління історіями про відвагу, самопожертву та незламний дух Сіверщини."
 
 
 # Hetmanate + Zaporizhian Sich
 ambush_tactics_advance: "Майстри засідок"
 ambush_tactics_advance_desc: "Козацькі воїни довели до досконалости мистецтво раптового удару та швидкого відступу до того, як ворог встигне оговтатися. Стрімкі маневри, ретельна розвідка та знання дикого степового порубіжжя дають їм змогу захоплювати ініціативу на полі бою."

 dnieper_secured_advance: "Безпечний Дніпро"
 dnieper_secured_advance_desc: "Завдяки убезпеченню дніпровських вод купці можуть вільно подорожувати однією з головних артерій українських земель. Збіжжя, сіль та інші товари прямують за течією до Чорного моря та далеких ринків."

 de_libertate_advance: "De Libertate"
 de_libertate_advance_desc: "У своєму славнозвісному вірші Григорій Сковорода ставить свободу вище за багатство та мирську владу. Його слова надали філософського звучання ідеалу, що здавна плекався на українських землях: справжня воля дорожча за всі багатства світу."

 zaporozhian_army_advance: "Військо Запорозьке"
 zaporozhian_army_advance_desc: "Воїни українського Степу викували самобутні військові звичаї на південному кордоні. Загартовані в безперервних боях, вони поєднують у собі рухливість, дисципліну та багатий досвід."


 # Lithuania
 tolerant_rule_advance: "Віротерпиме правління"
 tolerant_rule_advance_desc: "Наш народ співіснує з представниками багатьох інших культур. Цей розмаїтий суспільний устрій закарбований у наших законах і звичаях. Разом ми сильніші!"

 lith_wilderness: "Литовська глухомань"
 lith_wilderness_desc: "Густі ліси й непрохідні болота Литви здавна слугували їй надійним щитом. Ворожі армії ледве просуваються крізь незаймані хащі, тоді як місцеві воїни завдають ударів із добре знайомої їм місцевості."


 # Crimea
 syvash_salt: "Сиваська сіль"
 syvash_salt_desc: "Мілководні лагуни Сиваша ще з давніх-давен давали високоцінну сіль. Зібрана під південним сонцем і розвезена купцями по всьому Степу та Чорномор’ю, кримська сіль стала життєво важливим товаром, що збагачував ханство та забезпечував далекі краї."

 control_over_the_shore: "Панування над узбережжям"
 control_over_the_shore_desc: "Укріплення панування над чорноморським та азовським узбережжям і його портами посилює владу держави на півострові, утримуючи торговельні шляхи, поселення й місцеві громади під надійним наглядом."


 # Pontic region
 pontic_mosaic_advance: "Понтійська мозаїка"
 pontic_mosaic_advance_desc: "Уздовж обдуваних вітрами берегів Чорного моря греки, татари, русини, вірмени, алани та безліч інших народів здавна ділили між собою ринки, порти й Степ. Тут виживання полягало не в одноманітності, а в здатності співіснувати."

 pontic_trade_advance: "Понтійська торгівля"
 pontic_trade_advance_desc: "Влада над чорноморськими торговельними шляхами залучає купців з усіх куточків Причорномор’я до орбіти держави, розширюючи торговельні мережі й можливості для купецьких промислів."


 # East Slavic culture group
 steppe_outpost_advance: "Степова залога"
 steppe_outpost_advance_desc: "Степова залога слугує головною спорудою для збору того, що дає Великий Степ. Багато селян і козаків шукають ці будівлі у Дикому Полі у надії заробити на життя торгівлею."


 # Ruthene culture group
 varangians_greeks: "З варяг у греки"
 varangians_greeks_desc: "Давні торгові шляхи, що з'єднували Балтійське та Чорне моря, продовжують визначати торгівлю руських земель. Купці, річкові флотилії й укріплені поселення вздовж великих водних шляхів поєднують віддалені ринки, сприяючи торгівлі, процвітанню та культурному обміну по всій Східній Європі."

 chynsh_advance: "Чиншовий податок"
 chynsh_advance_desc: "Звичаєва земельна плата, яку сплачують селяни та міщани за право володіти й користуватися своїми ділянками. Зазвичай фіксований у грошах, чинш забезпечує земельному власнику передбачуваний дохід, даючи орендарям більшу свободу від прямих панщинних обов'язків."

 ruthenian_cochineal: "Руський червець"
 ruthenian_cochineal_desc: "Дрібні комахи червця, яких збирають із ґрунту руських земель, дають рідкісну багряну фарбу, вельми ціновану по всій Європі. Зібрана та оброблена вправними майстрами, ця цінна експортна сировина збагачує купців і зв'язує місцеве господарство з далекими ринками."

 cyrillic_printing: "Кириличне друкарство"
 cyrillic_printing_desc: "Натхненні першопрохідцями європейського друкарства, руські майстри засновують друкарні, що поширюють книги, духовні тексти та знання кирилицею. Від праць Франциска Скорини до друкарських здобутків Івана Федорова — ці друкарні зміцнюють грамотність, освіту й культурну самобутність на руських землях."

 ruthenian_awakening: "Руське відродження"
 ruthenian_awakening_desc: "У сімнадцятому столітті руські землі були охоплені непохитною рішучістю захистити свою віру, вольностi й давні права. Від великого козацького повстання Богдана Хмельницького до пізніших виступів — покоління українців і білорусів піднімалися зі зброєю проти іноземного панування та магнатського свавілля. Хоча вони часто зазнавали поразок, ці змагання загартували звичаї опору й виховали народ, звиклий боротися за свою свободу."


 # Ukrainian culture group
 steppe_frontier: "Степове порубіжжя"
 steppe_frontier_desc: "Уздовж обдуваного вітрами порубіжжя, де Степ межує з обжитими землями, виростають укріплені поселення та сторожові вежі. Громади гуртуються для оборони, утримуючи ополчення, сигнальні мережі й залоги для відбиття татарських набігів. Хоча життя на кордоні залишається суворим і сповненим небезпек, ці землі перетворюються на надійний щит, що боронить серцевину краю від загроз відкритого Степу."

 chumak_trading: "Чумацький промисел"
 chumak_trading_desc: "Безкраїми рівнинами валки чумаків перевозять сіль, рибу та інші товари між Чорним морем і внутрішніми ринками. Їхні збиті шляхи пов'язують віддалені краї, збагачуючи порубіжні громади та закладаючи звичаї торгівлі, витривалости та підприємливости."

 gunpowder_boom: "Пороховий бум"
 gunpowder_boom_desc: "Багаті поклади селітри, що видобуваються зі стародавніх валів і переробляються місцевими майстрами, живлять квітучі порохові промисли. Надійні запаси пороху забезпечують війська, фортеці та виготовлення вогнепальної зброї, зміцнюючи оборонну спроможність держави й перетворюючи порубіжжя на важливий осередок військового постачання."

 religious_brotherhoods: "Церковні братства"
 religious_brotherhoods_desc: "Мирянські братства, що засновувалися при храмах і монастирях, опікуються школами, лікарнями, друкарнями та доброчинністю. Зміцнюючи духовне життя та сприяючи просвіті, вони формують освічене й стійке суспільство, здатне зберігати свої звичаї в часи політичних і духовних потрясінь."

 fiery_army: "Огнисте військо"
 fiery_army_desc: "Загартовані роками степової війни, козацькі війська здобули славу завдяки сміливим приступам і запеклим облогам. Досконало володіючи облоговою справою, закладанням траншей і швидким пристосуванням до поля бою, вони перетворюють рішучість та винахідливість на могутню зброю проти найсильніших укріплень."

 orlyk_constitution_advance: "Конституція Пилипа Орлика"
 orlyk_constitution_advance_desc: "Написана після буремної боротьби за незалежність, Конституція Пилипа Орлика закладає баланс між гетьманом, козацькою старшиною та всією політичною громадою. Визначаючи права, обов'язки й межі влади, вона зміцнює довіру між станами та сприяє встановленню стабільного устрою."


 # Belarusian culture group
 ruthenian_law_tradition: "Традиція руського права"
 ruthenian_law_tradition_desc: "Століття правових звичаїв, княжих грамот і магдебурзьких привілеїв сформували тривалий руський правовий звичай, що зберігався за панування різних держав."

 hardened_cavalry: "Загартована кіннота"
 hardened_cavalry_desc: "Викувана в безперервних порубіжних війнах, руська кіннота здобула славу своєю дисципліною та звитягою, довівши свою вирішальну роль у таких битвах, як Грюнвальдська."

 polesian_lumber: "Поліський ліс"
 polesian_lumber_desc: "Безкраї ліси Полісся забезпечували край деревиною, смолою й поташем, підтримуючи місцеві промисли й задовольняючи зростаючі потреби далеких ринків."

 skaryna_printing: "Друкарство Скорини"
 skaryna_printing_desc: "Новаторська кирилична друкарня Франциска Скорини поширювала грамотність і знання, зробивши книги руською мовою доступними ширшому загалу."

 volok_reform: "Устава на волоки"
 volok_reform_desc: "Вимірювання та перерозподіл земель на впорядковані волоки поліпшили оподаткування, облаштування сільського господарства й справність фільваркових маєтків."

 religious_dualism: "Двоїстість віри"
 religious_dualism_desc: "Протягом століть православні та уніатські громади жили пліч-о-пліч, творячи суспільство, сформоване релігійним різноманіттям і компромісом."

 polesian_amber: "Поліський бурштин"
 polesian_amber_desc: "Бурштин, зібраний на річках і болотах Полісся, був коштовним торговим товаром, який цінувався як за красу, так і за майстерні вироби з ним."

 new_bread: "Новий хліб"
 new_bread_desc: "Широке впровадження картоплі докорінно змінило сільське життя, забезпечивши сталі врожаї, що підтримували зростання населення та зменшували загрозу голоду."

