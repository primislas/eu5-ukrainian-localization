 ruthenian_starostas: "Сільські старости"
 ruthenian_starostas_desc: "Старості довірялося управління повітом, підтримання порядку, збір повинностей та захист його жителів. У обмін на виконання цих обов'язків селянство отримувало захист місцевої влади, чий добробут безпосередньо залежав від обробітку та безпеки підпорядкованих їй земель."

 obrok_privilege: "Оброк"
 obrok_privilege_desc: "Замість виконання панщини селяни виконують свої зобов'язання шляхом постійних виплат, найчастіше зерном, худобою, медом та іншим крамом. Така домовленість дає їм більше свободи розпоряджатися власним часом і господарством, забезпечуючи пана надійним джерелом продовольства та доходу."

 chynsh_privilege: "Чинш"
 chynsh_privilege_desc: "Звичаєва земельна плата, яку сплачують селяни та міщани за право володіти й користуватися своїми ділянками. Зазвичай фіксований у грошах, чинш забезпечує земельному власнику передбачуваний дохід, даючи орендарям більшу свободу від прямих панщинних обов'язків."
