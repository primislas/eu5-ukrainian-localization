l_english:
  #
  ukrainian_group: "Українськ"
  ukrainian_group_desc: "Українські культури, що постали з спадщини Київської Руси, відображають цивілізацію, сформовану родючими землями, мінливими кордонами та різноманітними впливами. Цей народ розвинув міцні звичаї місцевого самоврядування, вольностей громад та особливого військового устрою — найвиразніше втілених козацькими військами-державами."
  belarusian_group: "Білоруськ"
  belarusian_group_desc: "Білоруські культури, що розвивалися у лісистому серці Східної Європи, сформувалися під впливом тривалих установ Великого князівства Литовського. Менш вразливі для степових буревіїв, вони розвивалися у межах права, шляхетських привілеїв та спадкоємности врядування. Їхні звичаї підкреслюють соціальну гармонію, правовий порядок та співіснування віросповідань і народів."
  ruthene_group: "Русинськ"
  ruthene_group_desc: "Русинська культурна група представляє східнослов'янські народи, об'єднані спадщиною середньовічної західної та південної Руси та сформовані століттями регіонального політичного, духовного та культурного розвитку. Зазнавши впливу таких держав, як Велике князівство Литовське, Королівство Польське та різноманітні руські князівства, ці культури мають спільні корені, але з часом розвинули власну самобутність."
  zalessian_group: "Заліськ"
  zalessian_group_desc: "Заліська культурна група представляє східнослов'янські народи північної та північно-східної Русі, сформовані століттями політичного, релігійного та культурного розвитку."