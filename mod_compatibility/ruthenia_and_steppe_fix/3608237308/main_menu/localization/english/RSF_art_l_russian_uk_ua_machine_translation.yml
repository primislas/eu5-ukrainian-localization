l_english:

 #Kyiv
 st_sophia_kyiv: "Софійський собор"
 st_sophia_kyiv_desc: "Зведений у XI столітті за правління великого князя Ярослава Мудрого, Софійський собор став духовним та політичним осердям Київської Руси. Його сяйливі мозаїки та фрески демонстрували велич візантійського мистецтва, підкреслюючи прагнення Києва до культурної першости у Східній Європі. Окрім духовної ролі, собор слугував місцем проведення княжих урочистостей, прийому послів і затвердження найважливіших угод."
 st_michael_kyiv: "Михайлівський Золотоверхий монастир"
 st_michael_kyiv_desc: "Заснований у середньовіччі Святополком II Изяславичем, монастирський комплекс включає соборний храм, трапезну церкву Святого Апостола і Євангеліста Івана Богослова, зведену в 1713 році, Економічну браму, споруджену в 1760 році, та дзвіницю, додану в 1710-х роках. Зовнішній вигляд споруди було перебудовано в стилі українського бароко у XVIII столітті, тоді як інтер'єр зберіг свою первісну візантійську архітектуру."
 primary_chronicle: "Повість временних літ"
 primary_chronicle_desc: "Укладена на початку XII століття й за звичаєм приписувана ченцю Києво-Печерського монастиря Нестору, «Повість времінних літ» є основоположним історичним літописом Київської Руси. Спираючись на усні перекази, ранні літописні зведення та церковні записи, вона подає впорядковану розповідь про походження Руси, правління її князів та хрещення держави. Вона залишається однією з найвпливовіших писемних пам'яток середньовічного східнослов'янського світу."
 dormition_icon_kyiv: "Ікона Успіння Богородиці"
 dormition_icon_kyiv_desc: "Ікона Успіння Богородиці Києво-Печерської лаври традиційно вважається дарунком XI століття від грецьких зодчих, які будували Успенський собор монастиря. Виконана відповідно до витонченого візантійського канону, ікона стала однією з найшанованіших святинь Лаври. З часом вона перетворилася на символ духовного авторитету Лаври та тривалих культурних зв'язків між Київською Руссю та візантійським світом."

 #Chernihiv
 transfiguration_chernihiv: "Спасо-Преображенський собор"
 transfiguration_chernihiv_desc: "Заснований у середині XI століття князем Мстиславом Чернігівським, Спасо-Преображенський собор є одним із найдавніших збережених кам'яних храмів Київської Руси. Зведений майстрами, вихованими у візантійських традиціях, його стримана мурована кладка, купольний силует і ранньохристиянський фресковий ансамбль відображають архітектурний перехід від імперських константинопольських зразків до самобутнього руського стилю. Як головний храм Чернігівського князівства, він слугував не лише осередком богослужіння, а й династичною усипальницею та місцем проведення важливих політичних урочистостей."

 #Volhynia
 dormition_volodymyr: "Успенський собор"
 dormition_volodymyr_desc: "У 1156 році правнук Володимира Мономаха, Мстислав II Ізяславич, який був удільним князем у Володимирі, а пізніше великим князем київським, звів новий храм на честь Успіння Пресвятої Богородиці. Освячення церкви відбулося після її розпису в 1160 році. Після освячення храм став собором, продовживши історію першої єпископської кафедри Волинської єпархії, заснованої на цих землях у 992 році. Собор був місцем поховання князів, бояр і єпископів. Під храмом розташовано 6 великокняжих, 2 єпископські та безліч усипальниць знатних осіб. Тут також похований князь Мстислав II, фундатор храму."
 halych_volhynian_chronicle: "Галицько-Волинський літопис"
 halych_volhynian_chronicle_desc: "Укладений у XIII столітті в інтелектуальному середовищі двору Романовичів, Галицько-Волинський літопис містить послідовний і структурований виклад політичних, військових та дипломатичних справ Галицько-Волинського князівства. Спираючись на урядові документи, усні свідчення та раніший літописний матеріал, він документує династичні змагання, зовнішні відносини та зусилля князівства щодо збереження свого суверенітету в умовах мінливих регіональних обставин. Відзначений високим літературним стилем та особливою увагою до питань державного управління, літопис є головною історіографічною пам'яткою західноруських земель і незамінним джерелом для вивчення їхнього інституційного та культурного розвитку."
 black_madonna: "Чорна Мадонна"
 black_madonna_desc: "Чорна Мадонна — шанована ікона, споконвіку пов'язана з галицько-волинськими князями. Вона посідала чільне місце в політичному та духовному житті краю. Вважається, що вона має візантійське походження й потрапила до князівства дипломатичними чи династичними шляхами, слугуючи палладіумом влаштування держави, до якого зверталися по захист землі та її володарів. До пізнього середньовіччя ікона стала тісно пов'язаною з містом Белз, де вона слугувала осердям місцевого шанування та символом династичного права на владу. Її подальше перенесення до Польщі піднесло її статус у ширшому духовному ландшафті Центрально-Східної Європи, відображаючи високий престиж, що приписувався її руському походженню."

 #Halych
 nicolas_lviv: "Церква Святого Миколая"
 nicolas_lviv_desc: "Зведена наприкінці XIII століття православною громадою Львова, церква Св. Миколая є однією з найдавніших збережених священних пам'яток міста. Споруджена в характерному руському стилі з пізнішими готичними та ренесансними перебудовами, вона слугувала головним осередком православного богослужіння для місцевого руського населення."

 #Polotsk
 st_sophia_polatsk: "Софійський собор"
 st_sophia_polatsk_desc: "Заснований у XI столітті за патронату полоцьких князів, Софійський собор був свідомо зведений на зразок київської Софії, утверджуючи тим самим церковний авторитет та політичну вагу князівства. Його архітектурний задум поєднує візантійські прототипи з регіональними будівельними звичаями, відображаючи як культурну приналежність, так і місцеве прилаштування. Собор слугував головним осередком літургійного життя, династичних урочистостей та церковного врядування, сприяючи зміцненню суверенітету й інституційної самобутности Полоцького князівства."

 #Pinsk
 kupiachitsy_cross_pinsk: "Куп'ятицький хрест"
 kupiachitsy_cross_pinsk_desc: "Куп'ятицький хрест, який вважається найдавнішою білоруською іконою, за церковним переказом був віднайдений 15 листопада 1182 року за чудесних обставин. Його шанували як чудотворний образ Матері Божої, багато оздоблений сріблом і збережений у спеціально збудованому храмі."