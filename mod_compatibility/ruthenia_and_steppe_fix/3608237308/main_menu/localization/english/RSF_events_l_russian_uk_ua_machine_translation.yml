l_english:
 collapsing_armies.1.title: "Війська Орди розпадаються"
 collapsing_armies.1.desc: "Кришталева корона, зламана присяга. Залізний зв'язок, що колись тримав орду, розпався — його знищила непевна рука володаря та гниль внутрішніх усобиць. Відданість згасла у байдужості; колись нищівний потік перетворився на мовчазний відступ, коли воїни зникають, мов дим, у пустельних вітрах, залишаючи по собі лише порожні намети та згаслу славу."
 collapsing_armies.1.entry: "Військо порублене наше, мій брате..."
 collapsing_armies.1.a: "Це кінець..."
 collapsing_armies.1.b: "Як виявилося, це були лише балачки."