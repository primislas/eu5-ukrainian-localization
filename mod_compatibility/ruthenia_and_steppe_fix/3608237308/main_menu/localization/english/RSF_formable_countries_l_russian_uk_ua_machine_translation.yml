l_english:

 HTM_f: "Гетьманщина"
 HTM_f_desc: "Козацька Гетьманщина виникла під час повстання Хмельницького як козацька держава під управлінням гетьмана, Генеральної військової ради та ієрархії полкових і сотенних старшин. Її політичний устрій поєднував військовий уклад зі звичними вольностями Війська Запорозького."