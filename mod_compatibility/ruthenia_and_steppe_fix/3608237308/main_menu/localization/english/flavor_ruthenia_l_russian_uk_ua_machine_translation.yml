l_english:
#Events
 flavor_legacy_of_rus.1.title: "Василь Костянтин Острозький"
 flavor_legacy_of_rus.1.desc: "Kнязь [target_character.GetName] (1526 aбо 1527—1608) — видaтний pуcький полiтичний i вiйcьковий дiяч, мeцeнaт оcвiти й культуpи. Cвiй pодовий мaєток [ShowLocationName('ostroh')] пepeтвоpив нa визнaчний нaуково-культуpний оcepeдок, зacнувaвши 1576 pоку Оcтpозьку aкaдeмiю — пepший вищий нaвчaльний зaклaд Укpaїни. Зaпpоcив до Оcтpогa вiдомого видaвця Iвaнa Фeдоpовичa, який нa кошти князя вiдкpив тaм дpукapню й видaв Оcтpозьку Бiблiю — видaтну пaм'ятку дpукapcького миcтeцтвa, що cтaлa пepшим повним видaнням Бiблiї цepковноcлов'янcькою мовою. Добa дiяльноcтi Bacиля Kоcтянтинa Оcтpозького виpiзнялacя знaчним пiднeceнням укpaїнcької культуpи тa ввaжaєтьcя пepшим нaцiонaльним вiдpоджeнням Pуci-Укpaїни."
 flavor_legacy_of_rus.1.a: "Його починання будуть корисними для майбутнього процвітання нашої країни"
 flavor_legacy_of_rus.2.title: "Чернігівські Афіни"
 flavor_legacy_of_rus.2.desc: "В останню третину XVII століття [ShowLocationName('chernihiv')] перетворився на один із провідних культурно-освітніх центрів України. 1679 року архієпископ [target_character1.GetName] переніс із Новгорода-Сіверського до Чернігова свою друкарню, й упродовж наступного століття Чернігів, поряд із Києвом та Львовом, належав до найбільших осередків друкарства в Україні. Після смерті Лазаря Барановича Його справу продовжив єпископ [target_character2.GetName], який за сприяння гетьмана Івана Мазепи відкрив у Чернігові [ShowBuildingTypeName('orthodox_colegium')] — перший вищий навчальний заклад на території Лівобережної України, що тримав від сучасників почесне найменування #italic «Чернігівські Афіни»#!. Бібліотека колегіуму була однією з найбільших в Україні та містила книги античних авторів і класиків європейської літератури різних часів.\n\Завдяки меценатській підтримці Івана Мазепи місто наповнили непересічні витвори мистецтва — величний Троїцький собор за проектом архітектора Йоганна-Баптиста Зауера, архітектурний стиль якого поєднав у собі риси українського та західноєвропейського бароко, вишукані срібні царські врата Борисоглібського собору, виготовлені в німецькому Аугсбурзі, та грандіозні срібні шати кіота Іллінської ікони Божої Матері."
 flavor_legacy_of_rus.2.a: "Це золота доба нашої культури"
 flavor_legacy_of_rus.3.title: "Мазепинське бароко в Києві"
 flavor_legacy_of_rus.3.desc: "У XVII—XVIII століттях завдяки активній меценатській діяльності козацької еліти в Україні тривав період культурного піднесення, відомий за назвою панівного мистецького стилю — Українське бароко, чи Козацьке бароко, або, за ім'ям найбільшого мецената — Мазепинське бароко. У ці часи в Україні велося масштабне монументальне будівництво, і за фінансової підтримки гетьмана Івана Мазепи розбудовувався [ShowLocationName('kyiv')] — відреставровані та набули сучасніших барокових форм стародавні [ShowWorkOfArtName('sophia_of_kyiv')] та [ShowBuildingTypeName('kyiv_pech_lavra')], зведені величні Микільський та Богоявленський собори."
 flavor_legacy_of_rus.3.a: "Це золота доба нашої культури"
 flavor_legacy_of_rus.4.title: "Пересопницьке Євангеліє"
 flavor_legacy_of_rus.4.desc: "Рукописне Євангеліє, створене в 1556–1561 роках у монастирі міста [ShowLocationName('peresopnytsya')] на Волині, яке стало першим повним перекладом Святого Письма на староукраїнську мову, наближену до розмовної мови XVI століття. Оздоблене вишуканими мініатюрами, Пересопницьке Євангеліє стало справжнім шедевром українського книжкового мистецтва."
 flavor_legacy_of_rus.4.a: "Вражаюча робота!"
 flavor_legacy_of_rus.5.title: "Друкарня Івана Федоровича"
 flavor_legacy_of_rus.5.desc: "[ivan_fedorov.GetName] — видатний слов'янський друкар. Розпочав свою діяльність у Московії, де став першодрукарем, проте через тиск з боку місцевого вищого духовенства був вимушений закрити свою друкарню та емігрувати до Речі Посполитої. Певний час працював у Заблудові на Підляшші, а 1572 року переїхав до Львова, де заснував друкарню та видав «Апостол» — першу відому книгу, яка безсумнівно була надрукована на території України. Його наступним виданням став «Буквар» — перша українська абетка."
 flavor_legacy_of_rus.5.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_legacy_of_rus.6.title: "«Енеїда»"
 flavor_legacy_of_rus.6.desc: "Публікація 1798 року перших трьох частин поеми Івана Котляревського «Енеїда» ознаменувала початок нового етапу історії української літератури. Це був перший значний український літературний твір, написаний не офіційною книжно-канцелярською староукраїнською мовою, переповненою церковно-слов'янізмами, а живою народною мовою, якою розмовляли жителі Полтавщини в Україні. Поема Котляревського стала травестійною переробкою класичної «Енеїди» Вергілія, де античні герої були зображені як запорозькі козаки. Автор достовірно зобразив добре відомі йому мову, побут, звичаї та традиції своїх співвітчизників. Успіх «Енеїди» призвів до остаточного виходу з ужитку старої книжної мови та формування нової української літературної мови, заснованої на народній."
 flavor_legacy_of_rus.6.a: "Еней був парубок моторний / I хлопець хоть куди козак"
 flavor_legacy_of_rus.7.title: "Вишгородська ікона Божої Матері"
 flavor_legacy_of_rus.7.desc: "[ShowWorkOfArtName('vyshhorod_mother_of_god')] — одна з найшанованіших наших святинь. У давнину великий князь Київський [GetCharacter('kie_mstislav_rurikovich').GetName] привіз цю ікону з Візантії на Русь, де вона стала справжньою окрасою церкви у Вишгороді. Однак наші вороги, скориставшись нашою тимчасовою слабкістю та відсутністю єдності, привласнили ікону собі. Але досить! Нехай московитські самозванці знають це — ніколи знову святиня нашого народу не потрапить до рук ворогів!"
 flavor_legacy_of_rus.7.a: "Повертаємо своє!"
 flavor_legacy_of_rus.8.title: "Друкарня Києво-Печерської лаври"
 flavor_legacy_of_rus.8.desc: "Провідний друкарський та інтелектуальний центр України, заснований 1615 року архімандритом Києво-Печерської лаври Єлисеєм Плетенецьким. Із самого початку її існування навколо друкарні сформувався гурток вчених і письменників, таких як Іван Борецький, [target_character2.GetName], Лаврентій Зизаній та Памво Беринда. Упродовж 300 років свого існування лаврська друкарня видала величезну кількість книг, як релігійного, так і світського характеру. Оформлення видань вирізнялося високою художньою майстерністю. Для забезпечення потреб друкарні у місті Радомисль діяла [ShowBuildingTypeName('paper_mill')]."
 flavor_legacy_of_rus.8.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_legacy_of_rus.9.title: "Григорій Сковорода"
 flavor_legacy_of_rus.9.desc: "[target_character.GetName] відомий як український філософ, який свідомо обрав мандрівний спосіб життя, відмовившись від власності, дому та сім’ї. Він цінував особисту свободу людини, її самопізнання та реалізацію даних Богом талантів. Завдяки способу життя, філософським творам та влучним афоризмам здобув значну популярність у тогочасному українському суспільстві. Водночас через свої вільні та досить сміливі погляди на християнську віру мав конфлікти з представниками офіційної церковної ієрархії. Зокрема, Сковорода був прихильником ідеї символічної природи Біблії, на відміну від поширеного тоді буквального її розуміння."
 flavor_legacy_of_rus.9.a: "Підтримаємо видання збірки його творів"
 flavor_legacy_of_rus.9.b: "Це занадто дорого"
 flavor_legacy_of_rus.10.title: "Максим Березовський"
 flavor_legacy_of_rus.10.desc: "Український композитор, диригент та оперний співак, уродженець міста Глухова на Сіверщині. Початкову освіту здобув у Глухівській школі співу й інструментальної музики. 1769 року переїхав до Італії та вступив до Болонської філармонічної академії, де в підсумку успішно склав іспит на звання академіка. Максим Березовський став автором перших українських опери («Демофонт») та симфонії, а також низки творів у жанрі духовної музики."
 flavor_legacy_of_rus.10.a: "Підтримаємо його талант"
 flavor_legacy_of_rus.11.title: "Собор Різдва Богородиці"
 flavor_legacy_of_rus.11.desc: "Величний собор у стилі українського бароко, побудований у Козельці на замовлення графині Наталії Розумовської за проєктом Андрія Квасова та Івана Григоровича-Барського, який є автором декору фасаду та інтер’єру. Одна з найпримітніших архітектурних споруд України XVIII століття. В інтер’єрі собору чільне місце займає великий чотириярусний іконостас у стилі рококо за проектом італійського архітектора Бартоломео Растреллі, автором ікон для якого став Григорій Стеценко, придворний художник гетьмана Кирила Розумовського."
 flavor_legacy_of_rus.11.a: "Вражаючий витвір мистецтва!"
 flavor_legacy_of_rus.12.title: "Катерининська церква в Чернігові"
 flavor_legacy_of_rus.12.desc: "Білокам’яна церква-монумент на честь військових звитяг українських козаків під час облоги Азова, збудована в Чернігові на кошти родини місцевих козацьких полковників Лизогубів. Одна з найяскравіших споруд у стилі українського бароко та справжня архітектурна перлина Чернігова, яка вражає своєю елегантною стрункістю та довершеністю форм."
 flavor_legacy_of_rus.12.a: "Слава нашим козакам!"
 flavor_legacy_of_rus.13.title: "Глухівська співоча школа"
 flavor_legacy_of_rus.13.desc: "Глухівська школа співу та інструментальної музики, заснована 1730 року, стала першим музичним навчальним закладом в Україні, який готував професійних співаків і музикантів для Придворної співацької капели. Випускниками школи стали відомі композитори Максим Березовський та Дмитро Бортнянський."
 flavor_legacy_of_rus.13.a: "Перспективний напрямок розвитку нашої культури"
 flavor_legacy_of_rus.14.title: "Дмитро Бортнянський"
 flavor_legacy_of_rus.14.desc: "Український композитор, класик європейської музики. Народився в місті Глухові, столиці Української гетьманської держави. Випускник Глухівської школи співу й інструментальної музики. 1769 року [target_character.GetName] разом зі своїм учителем Бальдассаре Ґалуппі переїхав до Італії, де впродовж десяти років навчався у Венеції, Болоньї, Римі та Неаполі. Автор 6 опер та низки видатних творів у жанрі церковної музики."
 flavor_legacy_of_rus.14.a: "Він прославить нашу культуру!"
 flavor_legacy_of_rus.15.title: "Йоган-Ґоттфрід Шедель"
 flavor_legacy_of_rus.15.desc: "[target_artist.GetName] — німецький архітектор, що працював у Києві в 1731—1752 роках. Автор однієї з найпримітніших архітектурних споруд Києва, Великої лаврської дзвіниці. Споруджена в стилі неокласицизму, велична 96-метрова дзвіниця стала органічним доповненням архітектурного ансамблю Києво-Печерської лаври.\n\nДо внеску митця також належать вишукана барокова Брама Заборовського, Кловський палац, перебудова корпусу Києво-Могилянської академії та відновлення частково зруйнованої дзвіниці Софійського собору, яка була оздоблена багатим ліпним декором."
 flavor_legacy_of_rus.15.a: "Вражаюче!"
 flavor_legacy_of_rus.16.title: "«Слово о полку Ігоревім»"
 flavor_legacy_of_rus.16.desc: "В одному з наших монастирів знайдено стародавній рукопис, який містить кілька середньовічних літературних творів. Найцікавішим серед них є «Слово о полку Ігоревім» — руський героїчний епос кінця XII століття, написаний невідомим автором про невдалий похід новгород-сіверського князя Ігоря Святославича на половців."
 flavor_legacy_of_rus.16.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_legacy_of_rus.17.title: "«Вечори на хуторі біля Диканьки»"
 flavor_legacy_of_rus.17.desc: "У 1831—1832 роках вийшли друком «Вечори на хуторі біля Диканьки» — збірка оповідань Миколи Гоголя. Використавши свої знання українських традицій, фольклору й історії, та поєднавши різні жанри, від веселої романтичної різдвяної історії до страхітливої готичної повісті, автор створив справжній шедевр, який відкрив Україну та її культуру для світової літератури."
 flavor_legacy_of_rus.17.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_legacy_of_rus.18.title: "Ренесансна архітектура Львова"
 flavor_legacy_of_rus.18.desc: "Ренесансний стиль архітектури визначав вигляд Львова у XVI—першій половині XVII століть. Упродовж багатьох десятиліть у місті працювали видатні архітектори італійського й німецького походження [target_artist1.GetName], Павло Римлянин та [target_artist2.GetName]. Серед найвизначніших архітектурних пам'яток того часу — ансамбль Успенської церкви з вежею Корнякта, монастир бернардинів та каплиця Боїмів."
 flavor_legacy_of_rus.18.a: "Вражаюче!"
 flavor_legacy_of_rus.19.title: "Вірменський собор Львова"
 flavor_legacy_of_rus.19.desc: "Храм Вірменської апостольської церкви, побудований у другій половині XIV століття архітектором Дорінгом, який за походженням вірогідно був італійцем із генуезьких колоній Криму. Виконував роль релігійного центру вірменської громади Львова та мав статус соборного храму єпархії вірмен Руси, Молдавії та Волощини."
 flavor_legacy_of_rus.19.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_legacy_of_rus.20.title: "Почаївська лавра"
 flavor_legacy_of_rus.20.desc: "Один із найшанованіший православних монастирів, який згідно з переданням заснований 1240 року ченцями Києво-Печерської лаври, що втекли від монголо-татарської навали. Розквіт Почаївського монастиря стався наприкінці XVI—першій половині XVII століть завдяки діяльності ігумена Йова Почаївського, пізніше канонізованого як святого, та багатим пожертвам власниці Почаєва, руської шляхтянки Ганни Гойської, яка подарувала монастиреві старовинну ікону Божої Матері візантійського або болгарського походження, що під назвою «Почаївська» стала однією з головних святинь Лаври."
 flavor_legacy_of_rus.20.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_legacy_of_rus.21.title: "Собор Святого Юра"
 flavor_legacy_of_rus.21.desc: "Початок монастиря Святого Юра у Львові сягає часів Руського королівства XIII століття. У пізніші часи монастир відігравав важливу роль для руської громади Львова як один із основних осередків православної та згодом греко-католицької віри в місті. У середині XVIII століття за ініціативою митрополита Атанасія Шептицького відбулося спорудження нового храму на честь Святого Юрія Змієборця. Собор побудований за проектом архітектора Бернарда Меретина та поєднав у собі стилі бароко й рококо. Скульптури, якими прикрасили фасад храму, виконав Йоган-Георг Пінзель. Собор Святого Юра отримав статус головного храму Галицької греко-католицької митрополії, ставши справжнім оплотом і символом руської громади Львова."
 flavor_legacy_of_rus.21.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_legacy_of_rus.22.title: "Успенський собор Почаївської лаври"
 flavor_legacy_of_rus.22.desc: "Головний храм Почаївської лаври, споруджений у другій половині XVIII століття архітекторами Готтфрідом Гоффманом і Петром Полейовським у стилі пізнього бароко на замовлення магната Миколи Василя Потоцького. Головні святині собору — слід стопи Божої Матері, яка згідно з переказом відвідала Почаївську гору під час монголо-татарської навали 1240 року, та одна з найшанованіших в Україні чудотворна [ShowWorkOfArtName('theotokos_of_pochayiv')]."
 flavor_legacy_of_rus.22.a: "[ROOT.GetCountry.Custom('common_string_positive')]"

#Buildings
 kyiv_mohyla_academy: "Києво-Могилянська академія"
 kyiv_mohyla_academy_desc: "Києво-Могилянська академія, заснована у XVII столітті київським митрополитом Петром Могилою, стала провідним інтелектуальним центром України та всієї Східної Європи. Щороку цей навчальний заклад випускав численних освічених інтелектуалів, які згодом обіймали високі посади в державній, церковній, науковій та культурній сферах в Україні та сусідніх країнах."
 ostroh_academy: "Острозька академія"
 ostroh_academy_desc: "Пepший вищий нaвчaльний зaклaд на території України, заснований князем Василем Костянтином Острозьким за фінансової підтримки його племінниці Єлизавети Острозької. В академії утворився гурток інтелектуалів, серед яких Лаврентій Зизаній, Герасим та Мелетій Смотрицькі, Дем'ян Наливайко та майбутній Патріарх Олександрійський і Константинпольський Кирило Лукаріс."
 orthodox_colegium: "Колегіум"
 orthodox_colegium_desc: "Колегіуми — вищі навчальні заклади, які набули поширення в Україні в XVII та XVIII століттях. Першим православним закладом, що надавав освіту на рівні католицьких єзуїтських колегіумів Речі Посполитої, був Києво-Могилянський колегіум (1632), який згодом отримав статус академії. Пізніше в Україні були засновані Чернігівський (1700), Харківський (1722) та Переяславський (1738) колегіуми."
 kyiv_pech_lavra: "Києво-Печерська лавра"
 kyiv_pech_lavra_desc: "Заснована 1051 року ченцями Антонієм і Феодосієм, Києво-Печерська Лавра є одним із найдавніших та найважливіших центрів православного християнства. Підземні печерні комплекси Лаври слугували як монастирськими помешканнями, так і місцями поховання. Згодом вона перетворилася на величезний релігійно-культурний комплекс, головний осередок духовності та освіти Київської Руси, де вивчали богослов'я та створювали рукописи."
 pochaiv_lavra: "Почаївська лавра"
 pochaiv_lavra_desc: "Один із найшанованіший православних монастрів, який згідно з переданням заснований 1240 року ченцями Києво-Печерської лаври, що втекли від монголо-татарської навали. Розквіт Почаєвського монастиря стався наприкінці XVI—першій половині XVII століть завдяки діяльності ігумена Йова Почаївського, пізніше канонізованого як святого, та багатим пожертвам власниці Почаєва, руської шляхтянки Ганни Гойської, яка подарувала монастиреві старовинну ікону Божої Матері візантійського або болгарського походження, яка під назвою «Почаївська» стала однією з головних святинь Лаври."
 kamianets_fortress: "Кам’янецька фортеця"
 kamianets_fortress_desc: "Міцна фортеця на Поділлі, заснована в XIV столітті. У наступні віки укріплення фортеці неодноразово посилювалися, завдяки чому вона здобула репутацію неприступної твердині."

#Works of Art (starting)
 sophia_of_kyiv: "Софія Київська"
 sophia_of_kyiv_desc: "Величний середньовічний собор, збудований у першій половині XI століття київським князем Ярославом Мудрим. Головний храм Київської митрополії та всієї Руси, прообразом якого став Софійський собор Царгорода. Збудований за традиціями візантійської архітектури, всередині собор оздоблений вишуканими мозаїками та фресками. Вірогідно мав утілювати ідею Києва як Другого Єрусалима, нового духовного центру християнського світу. Із самого початку Софійський собор став значним культурно-освітнім центром, при ньому діяли школа та бібліотека, велося літописання. Був резиденцією київських митрополитів і місцем поховання великих князів Київських."
 kyiv_dormition_cathedral: "Успенський собор Києво-Печерської лаври"
 kyiv_dormition_cathedral_desc: "Головний собор Києво-Печерської лаври, побудований у 1073–1077 візантійськими архітекторами коштом великого князя Святослава Ярославича, видатного мецената культури й засновника династії чернігівських князів."
 st_michael_golden-domed_cathedral: "Михайлівський Золотоверхий собор"
 st_michael_golden-domed_cathedral_desc: "Стародавній собор, збудований 1113 року Великим князем Київським Святополком Ізяславичем. Головний храм Михайлівського Золотоверхого монастиря. Славиться своїм золотим куполом та майстерно виконаними мозаїками."
 dormition_of_the_mother_of_god: "Ікона Успіння Пресвятої Богородиці"
 dormition_of_the_mother_of_god_desc: "Стародавня ікона, яку за переказом привезли до Києва в XI столітті візантійські архітектори Успенського собору Києво-Печерської лаври, де вона стала головною святинею монастиря."
 saint_nicholas_the_wet: "Ікона Миколи Мокрого"
 saint_nicholas_the_wet_desc: "Перша чудотворна ікона Руси та головна святиня Софійського собору в Києві. Створена в X столітті у Візантії. Назва походить від переказу про немовля, яке потонуло в річці, але згодом знайшлося живим і неушкодженим біля чудотворної ікони Святителя Миколая після молитв його батьків святому."
 chernihiv_transfiguration_cathedral: "Спасо-Преображенський собор"
 chernihiv_transfiguration_cathedral_desc: "Головний собор княжого Чернігова, один із найдавніших кам'яних храмів Руси. Будівництво собору було розпочате в 1030-х роках чернігівським князем Мстиславом Володимировичем Хоробрим і завершене під час правління засновника чернігівської князівської династії Святослава Ярославича."
 borys_and_hlib_cathedral: "Борисоглібський собор"
 borys_and_hlib_cathedral_desc: "Стародавній храм, споруджений 1223 року чернігівським князем Давидом Святославичем. Фасад собору прикрашений різьбленими білокам’яними капітелями в романському стилі, що зображають різноманітних міфологічних істот. Виконував функцію усипальниці чернігівських князів."
 piatnytska_church: "П’ятницька церква"
 piatnytska_church_desc: "Вежоподібна церква на честь святої Параскеви П’ятниці, покровительки торгівлі, збудована на межі XII—XIII століть на міському торгу середньовічного Чернігова. За різними припущеннями, могла бути побудована за підтримки чернігівського князя Ігоря Святославича, або ж за кошти місцевих купців. Відома як своєрідний архітектурний аналог шедеврального руського епосу «Слово о полку Ігоревім», П’ятницька церква втілює найвищі досягнення останнього, передмонгольського етапу розвитку архітектури середньовічної Руси."
 yeletskyi_monastery: "Єлецький монастир"
 yeletskyi_monastery_desc: "Єлецький монастир заснований 1060 року чернігівським князем Святославом Ярославичем на місці, де, за легендою, на ялинці дивовижним чином з’явилася ікона Божої Матері. У другій половині XII століття споруджено головний храм монастиря, Успенський собор."
 halych_dormition_cathedral: "Успенський собор Галича"
 halych_dormition_cathedral_desc: "Головний собор княжого Галича, побудований у XII столітті. Другий за розмірами собор Руси. Після утворення 1302 року Галицької митрополії Константинопольського Патріархату став резиденцією митрополитів."
 volodymyr_dormition_cathedral: "Успенський собор Володимира"
 volodymyr_dormition_cathedral_desc: "Головний собор Володимирської єпархії та Волинського князівства, побудований князем Мстиславом Ізяславичем 1160 року. Виконував функцію усипальниці для волинських князів і єпископів."
 black_madonna: "Чорна Мадонна"
 black_madonna_desc: "Стародавня та шанована візантійська ікона Божої Матері, привезена до Белзу королем Руси Левом Даниловичем. Свою назву отримала через темний відтінок обличчя на зображенні."
 kholm_mother_of_god: "Холмська ікона Божої Матері"
 kholm_mother_of_god_desc: "Стародавня візантійська ікона Божої Матері, привезена до Холму, столиці Руського королівства, королем Данилом Романовичем."
 crown_of_danylo_romanovych: "Корона короля Данила"
 crown_of_danylo_romanovych_desc: "Королівська корона, якою легат папи Інокентія IV 1253 року коронував Галицько-Волинського князя Данила Романовича як короля Руси."
 vyshhorod_mother_of_god: "Вишгородська ікона Божої Матері"
 vyshhorod_mother_of_god_desc: "Стародавня ікона Божої Матері візантійського походження, що належить до іконографічного типу Єлеуса. Одна з найшанованіших православних святинь. Створена, вірогідно, у першій третині XII століття в Константинополі. За правління київського князя Мстислава Великого перевезена до Руси, де зберігалася в церкві міста Вишгорода поблизу Києва. 1155 року ікону привласнив володимиро-суздальський князь Андрій Боголюбський, який спешу зберігав її у своїй резиденції в Боголюбові, а згодом — в Успенському соборі своєї столиці Володимира. Відтоді ікона стала відомою під назвою «Володимирська»."
 polatsk_saint_sophia_cathedral: "Софійський собор Полоцька"
 polatsk_saint_sophia_cathedral_desc: "Головний собор Полоцького князівства, збудований у середині XI століття за правління князя Всеслава Чародія. Будівництво храму мало підкреслити незалежний статус Полоцької держави та продовжувало тенденцію будівництва величних соборів за подобою Святої Софії в Константинополі, розпочату в Києві та Новгороді."
 cross_of_euphrosyne_of_polatsk: "Хрест Євфросинії Полоцької"
 cross_of_euphrosyne_of_polatsk_desc: "Витвір середньовічного руського мистецтва, багато оздоблений дорогоцінним камінням та емалевими мініатюрами хрест-ковчег, виготовлений 1161 року полоцьким ювеліром Лазарем Богшею на замовлення княжни Єфросинії Полоцької. Спершу зберігався в Спасо-Преображенській церкві Полоцька, однак на межі ХІІ—ХІІІ століть під час князівських міжусобиць був вивезений до Смоленська."

#Works of Art (events)
 armenian_cathedral_of_lviv: "Вірменський собор Львова"
 armenian_cathedral_of_lviv_desc: "Храм Вірменської апостольської церкви, побудований у другій половині XIV століття архітектором Дорінгом, який за походженням вірогідно був італійцем із генуезьких колоній Криму. Виконував роль релігійного центру вірменської громади Львова та мав статус соборного храму єпархії вірмен Руси, Молдавії та Волощини."
 tale_of_bygone_years: "«Повість временних літ»"
 tale_of_bygone_years_desc: "Середньовічний руський літопис, створений у Києві в XI — на початку XII століть. Серед вірогідних авторів літопису називають монаха Києво-Печерської лаври Нестора та ігумена Видубицького монастиря Сильвестра. Серед рукописів, до яких увійшов текст «Повісті временних літ», найціннішим є так званий Радзивіллівський літопис. Цей ілюмінований рукопис створений наприкінці XV століття, вірогідно на Волині, й містить понад 600 мініатюр, значна частина з яких скопійована з утраченого раннішого рукопису XIII століття. Як текст літопису, так і мініатюри до ньго мають високу художню цінність та велике значення для вивчення історії Руси."
 peresopnytsia_gospel: "Пересопницьке Євангеліє"
 peresopnytsia_gospel_desc: "Рукописне Євангеліє, створене в 1556–1561 роках у монастирі міста Пересопниця на Волині, яке стало першим повним перекладом Святого Письма на староукраїнську мову, наближену до розмовної мови XVI століття. Оздоблене вишуканими мініатюрами, Пересопницьке Євангеліє стало справжнім шедевром українського книжкового мистецтва."
 korniakt_tower: "Вежа Корнякта"
 korniakt_tower_desc: "Вежа-дзвіниця православної Успенської церкви у Львові, побудована у другій половині XVI століття в стилі Ренесансу італійськими архітекторами Петром Барбоном і Павлом Римлянином. Будівництво здійснювалося на кошти львівського купця грецького походження Костянтина Корнякта. Спочатку вежа складалася з трьох ярусів та мала найбільший на Галичині дзвін діаметром у 2 метри. Наприкінці XVII століття дзвіниця отримала четвертий ярус із верхівклю в стилі бароко."
 ostroh_bible: "Острозька Біблія"
 ostroh_bible_desc: "Перше повне видання Біблії церковнослов’янською мовою, надруковане Іваном Федоровичем в Острозі за сприяння князя Василя Костянтина Острозького. Видатний зразок українського друкарського мистецтва."
 theotokos_of_pochayiv: "Почаївська ікона Божої Матері"
 theotokos_of_pochayiv_desc: "Старовинна чудотворна ікона Божої Матері візантійського або болгарського походження, одна з головних святинь Почаївської лаври та одна з найшанованіших ікон України. 1559 року грецький митрополит Неофіт, що гостював на Волині, подарував ікону власниці Почаєва, руській шляхтянці Ганні Гойській, яка 1597 року передала її Почаївському монастирю."
 boim_chapel: "Каплиця Боїмів"
 boim_chapel_desc: "Видатна пам’ятка пізнього Ренесансу у Львові, створена на початку XVII століття за проектом архітектора Андреаса Бемера як родова усипальниця Боїмів, місцевої знатної сім’ї угорського походження. Архітектура каплиці вирізняється багатим і вишуканим скульптурним оздобленням фасаду та інтер’єру."
 chernihiv_holy_trinity_cathedral: "Троїцький собор Чернігова"
 chernihiv_holy_trinity_cathedral_desc: "Найбільший храм Чернігова та головний собор Троїцько-Іллінського монастиря. Побудований 1695 року за проектом польського архітектора німецького походження Йоганна-Баптиста Зауера коштом гетьмана Івана Мазепи. Архітектурний стиль собору поєднав у собі риси українського та західноєвропейського бароко."
 illinska_icon: "Іллінська ікона"
 illinska_icon_desc: "Ікона Божої Матері, створена 1658 року чернігівським ченцем-іконописцем Григорієм Дубенським. Стиль ікони поєднує візантійську традицію з елементами ренесансу. Спершу зберігалася в стародавній Іллінській церкві, згодом — у новозбудованому Троїцькому соборі. У другій половині XVII століття на замовлення гетьмана Івана Мазепи для Іллінської ікони були виготовлені грандіозні, висотою більше трьох метрів срібні шати кіота."
 silver_royal_doors: "Царські врата Борисоглібського собору"
 silver_royal_doors_desc: "Вишукані срібні Царські врата для іконостасу Борисоглібського собору в Чернігові, виготовлені в Аугсбурзі майстром Філіппом Якобом Дрентветтом на замовлення гетьмана Івана Мазепи. За легендою під час будівництва Чернігівського колегіуму знайшли срібного ідола, якого за наказом гетьмана переплавили для виготовлення Царських врат. Авторами дизайну, вірогідно, стали українські гравери Іван Щирський та Лаврентій Крщонович. Художнє оформлення складається з християнських сюжетів та постатей — Дерево Єссея, що символізує родовід Христа, сцена Благовіщення, зображення святих Бориса й Гліба та чотирьох євангелістів."
 mykilskyi_cathedral: "Микільський собор"
 mykilskyi_cathedral_desc: "Величний собор у стилі українського бароко, названий на честь Святого Миколая та побудований у Києві коштом гетьмана Івана Мазепи як промовистий символ престижу й культурних досягнень Української гетьманської держави."
 kyiv_epiphany_cathedral: "Богоявленський собор"
 kyiv_epiphany_cathedral_desc: "Головний собор Київського Братського монастиря, збудований у стилі українського бароко на кошти гетьмана Івана Мазепи."
 sophia_of_kyiv_bell_tower: "Дзвіниця Софійського собору"
 sophia_of_kyiv_bell_tower_desc: "3-ярусна дзвіниця стародавнього Софійського собору, побудована на початку XVIII століття в стилі українського бароко на замовлення гетьмана Івана Мазепи. Під час реконструкції в середині XVIII століття під керівництвом архітектора Йогана-Ґоттфріда Шеделя дзвіницю оздоблено багатим ліпним декором у виконанні братів Івана та Степана Стобенських із Жовкви. Дзвіниця мала вишукано декоровані дзвони, найбільший серед яких, дзвін «Мазепа», названий на честь мецената споруди та прикрашений його гербом."
 chernihiv_catherine_church: "Катерининська церква"
 chernihiv_catherine_church_desc: "Білокам’яна церква-монумент на честь військових звитяг українських козаків під час облоги Азова, збудована в Чернігові на кошти родини місцевих козацьких полковників Лизогубів. Одна з найяскравіших споруд у стилі українського бароко та справжня архітектурна перлина Чернігова, яка вражає своєю елегантною стрункістю та довершеністю форм."
 works_of_hryhoryi_skovoroda: "Збірка праць Григорія Сковороди"
 works_of_hryhoryi_skovoroda_desc: "Збірка різноманітних творів мандрівного філософа Григорія Сковороди, серед яких його вірші, філософські трактати, байки, притчі та афоризми."
 great_lavra_bell_tower: "Велика лаврська дзвіниця"
 great_lavra_bell_tower_desc: "Одна з найпримітніших архітектурних споруд Києва, Велика лаврська дзвіниця збудована в середині XVIII століття за проектом німецького архітектора Йогана-Ґоттфріда Шеделя. Споруджена в стилі неокласицизму, велична 96-метрова дзвіниця стала органічним доповненням архітектурного ансамблю Києво-Печерської лаври."
 lviv_st_george_cathedral: "Собор Святого Юра"
 lviv_st_george_cathedral_desc: "Собор на честь Святого Юрія Змієборця, побудований у середині XVIII століття за ініціативою митрополита Атанасія Шептицького за проектом архітектора Бернарда Меретина. Архітектура собору поєднала в собі стилі бароко та рококо. Скульптури, якими прикрасили фасад храму, виконав Йоган-Георг Пінзель. Собор Святого Юра отримав статус головного храму Галицької греко-католицької митрополії, ставши справжнім оплотом і символом руської громади Львова."
 kozelets_cathedral: "Собор Різдва Богородиці"
 kozelets_cathedral_desc: "Величний собор у стилі українського бароко, побудований у Козельці на замовлення графині Наталії Розумовської за проєктом Андрія Квасова та Івана Григоровича-Барського, який є автором декору фасаду та інтер’єру. Одна з найпримітніших архітектурних споруд України XVIII століття. В інтер’єрі собору чільне місце займає великий чотириярусний іконостас у стилі рококо за проектом італійського архітектора Бартоломео Растреллі, автором ікон для якого став Григорій Стеценко, придворний художник гетьмана Кирила Розумовського."
 berezovskyi_liturgy: "Літургія"
 berezovskyi_liturgy_desc: "Повна музика для православної Літургії, написана українським композитором Максимом Березовським. Видатний твір у жанрі церковної музики."
 demofonte: "«Демофонт»"
 demofonte_desc: "Перша українська опера, створена композитором Максимом Березовським на лібрето італійського поета П’єтро Метастазіо. Уперше поставлена в лютому 1773 року на зимовому карнавалі в італійському місті Ліворно."
 pochaiv_dormition_cathedral: "Успенський собор Почаївської лаври"
 pochaiv_dormition_cathedral_desc: "Головний храм Почаївської лаври, споруджений у другій половині XVIII століття архітекторами Готтфрідом Гоффманом і Петром Полейовським у стилі пізнього бароко на замовлення магната Миколи Василя Потоцького. Головні святині собору — слід стопи Божої Матері, яка згідно з переказом відвідала Почаївську гору під час монголо-татарської навали 1240 року, та одна з найшанованіших в Україні чудотворна Почаївська ікона Божої Матері."
 bortnyanskyi_creonte: "«Креонт»"
 bortnyanskyi_creonte_desc: "Перша з шести опер українського композитора Дмитра Бортнянського, прем’єра якої відбулася 1776 року в театрі «Сан Бенедетто» у Венеції. Написана на перероблене лібрето італійського поета Марко Кольтелліні за мотивами п’єси Софокла «Антігона»."
 bortnyanskyi_cherubic_hymn: "Херувимська пісня № 7"
 bortnyanskyi_cherubic_hymn_desc: "Найвідоміша з численних композицій Дмитра Бортнянського для православної Херувимської, яка має по-справжньому неземне, янгольське звучання."
 eneida: "«Енеїда»"
 eneida_desc: "Травестійна переробка класичної «Енеїди» Вергілія, де античні герої були зображені як запорозькі козаки. Перший значний український літературний твір, написаний не офіційною книжно-канцелярською староукраїнською мовою, переповненою церковно-слов'янізмами, а живою народною мовою, якою розмовляли жителі Полтавщини в Україні. Автор поеми Іван Котляревський достовірно зобразив добре відомі йому мову, побут, звичаї та традиції своїх співвітчизників."
 tale_of_ihor_campaign: "«Слово о полку Ігоревім»"
 tale_of_ihor_campaign_desc: "Руський героїчний епос кінця XII століття, написаний невідомим автором про невдалий похід новгород-сіверського князя Ігоря Святославича на половців. "
 evenings_on_a_khutir_near_dykanka: "Вечори на хуторі біля Диканьки"
 evenings_on_a_khutir_near_dykanka_desc: "Збірка оповідань Миколи Гоголя. Використавши свої знання українських традицій, фольклору та історії, та поєднавши різні жанри, від веселої романтичної різдвяної історії до страхітливої готичної повісті, автор створив справжній шедевр, який відкрив Україну та її культуру для світової літератури."

 #Advances
 ukr_patronage_of_the_ruthenian_elites: "Меценатство українських еліт"
 ukr_patronage_of_the_ruthenian_elites_desc: "Aктивнe cпpияння pозвитку культуpи й оcвiти, фiнaнcувaння будiвництвa xpaмiв i нaвчaльниx зaклaдiв — уcтaлeнa тpaдицiя князiвcької тa козaцької eлiти України."
 ukr_granary_of_europe: "Житниця Європи"
 ukr_granary_of_europe_desc: "Українські чорноземи — одні з найродючіших ґрунтів Європи. Якщо нам вдасться захистити наші врожаї від татарських набігів та інших ворогів, ми зможемо стати найбільшим експортером зерна в регіоні та, звісно, отримати величезні прибутки."
 ukr_collegium: "Колегіум"
 ukr_collegium_desc: "Колегіуми — вищі навчальні заклади, які набули поширення в Україні в XVII та XVIII століттях. Першим православним закладом, що надавав освіту на рівні католицьких єзуїтських колегіумів Речі Посполитої, був Києво-Могилянський колегіум (1632), який згодом отримав статус академії. Пізніше в Україні були засновані Чернігівський (1700), Харківський (1722) та Переяславський (1738) колегіуми."
 ukrainian_baroque: "Українське бароко"
 ukrainian_baroque_desc: "Поєднaння cтилicтики зaxiдноєвpопeйcького бapоко з мicцeвими тpaдицiями зa aктивної пiдтpимки зaможниx мeцeнaтiв cпpиятимe cтaновлeнню влacного нaцiонaльного cтилю apxiтeктуpи, лiтepaтуpи, живопиcу тa iншиx видiв миcтeцтвa, що ознaмeнує нову добу pозквiту нaшої дepжaви."

#Holy Sites
 kyiv_pechersk_lavra_holy_site: "Києво-Печерська лавра"
 pochaiv_lavra_holy_site: "Почаївська лавра"

#Modifiers
 STATIC_MODIFIER_NAME_ivan_fedorov_bookvar: "Буквар Івана Федоровича"
 STATIC_MODIFIER_DESC_ivan_fedorov_bookvar: "Найдавніший український буквар, надрукований Іваном Федоровичем у Львівській друкарні."

 gabriel_the_archangel: "Архангел Михаїл"
 st_andrew_church: "Андріївська церква"
 st_andrew_church_desc: "Церква, названа на честь святого Андрія, відомого як апостол Руси. Побудована в середині XVIII століття в стилі бароко видатним італійським архітектором Бартоломео Растреллі. Справжня архітектурна перлина Києва та всієї України."

 reuniting_rus_desc: "Ми — справжні спадкоємці Київської Руси, і ці землі мають знову об’єднатися під нашим стягом!"
 ruthenian_rural_buildings: "Українські села"
 ruthenian_rural_buildings_desc: "Україна — простора країна. Хоча наші великі міста, такі як Київ, виконують багато важливих функцій, ми не можемо нехтувати віддаленими районами чи невеликими селами, які забезпечують нас життєво необхідними продуктами харчування та сировиною."
