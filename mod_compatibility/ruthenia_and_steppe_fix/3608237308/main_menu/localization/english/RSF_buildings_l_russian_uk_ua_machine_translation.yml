l_english:
 kyiv_pech_lavra: "Києво-Печерська лавра"
 kyiv_pech_lavra_desc: "Заснована у 1051 році ченцями Антонієм і Феодосієм, Києво-Печерська лавра, або #italic Печерський монастир#!, є одним із найдавніших і найважливіших осередків східного православного християнства. Збудовані частково під землею, її печерна мережа слугувала як чернечими обителями, так і місцями поховань. З часом вона перетворилася на великий духовний та культурний комплекс із богословською освітою та переписуванням рукописів. До XIV століття Лавра стала осередком віри та просвітництва Київської Руси."

 steppe_outpost: "Степова залога"
 steppe_outpost_desc: "Степова залога слугує головною спорудою для збору того, що дає Великий Степ. Багато селян і козаків шукають ці будівлі у рівнинній дичині у надії заробити на життя торгівлею."

 # Cossacks Estate buildings
 cossacks_colony: "Козацька осада"
 cossacks_colony_desc: "Козацькі осади, засновані у Дикому Полі, слугують прихистком для вільних поселенців і базою для оборони, походів та освоєння навколишнього степу."

 cossacks_training_grounds: "Козацький вишкільний табір"
 cossacks_training_grounds_desc: "Оскільки порубіжні громади звикли до зброї, місцеві вишкільні табори дають змогу козакам вдосконалювати навички стрільби, верхової їзди та ближнього бою, підтримуючи готовність стати до зброї будь-якої миті."

 cossacks_hunting_grounds: "Козацькі мисливські угіддя"
 cossacks_hunting_grounds_desc: "Козаки швидко облаштовують окремі угіддя для полювання, щоб самовільно використовувати дичину будь-яких місцевих лісів."


