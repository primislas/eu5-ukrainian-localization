l_russian:
  uavoc_beeswax: "Бортні вироби"
  uavoc_beeswax_desc: "Бджоли допомагали людям з найдавніших часів, і бортна здобич вже давно стала невід’ємною складовою людського побуту. З воску виготовляли свічки та ливарні форми, його заливали в дощечки для письма, ним полірували меблі… всього й не перелічити. А мед став важливою складовою харчування, використовувався як підсолоджувач та консервант, переганявся у хмільні напої, цінувався у лікарській справі.\n\nРемесло з розведення бджіл називали бортництвом, яке пізніше в козацькі часи доповнить пасічництво. Бортництво занепаде з винаходом в 19ст. рамкового вулика."
  uavoc_blahochestia: "Благочестя"
  uavoc_blahochestia_desc: "Благочестя — істинне богошанування, побожне признання божественних істин та їх виконання на ділі. Іншими словами: це безумовне дотримання правил віри, вірність духовним зобов’язанням поєднана з доброю поведінкою. Благочестя є однією з чеснот, високошанованих в церкві, до якої прагне кожен християнин."
  uavoc_charcoal_maker: "Вуглярка"
  uavoc_charcoal_maker_desc: "Тліюче вугілля опалює наші будинки та підтримує жар у кузнях. Спалюючи деревину, якої у нас в надлишку, ми можемо виробляти вугілля, що виділяє більше тепла, ніж дрова.\n\nАж до самої промислової революції деревне вугілля видобували методом вуглярських куч (паління під відкритим небом) або ям (обмазаних глиною та накритих дерном чи землею). Промисел випалювання вугілля в лісах називався вуглярством, а майстри — вуглярами."
  uavoc_fondaco: "Фондако"
  uavoc_fondaco_desc: "Італійське слово «фондако» походить від арабського «фундук», який своєю чергою був запозичений з грецького «pandokeion» (власне, просто гостиниця з коморами — гостиний двір). До цієї ж категорії належать персидські караван-сараї (заїжджі двори для караванів)."
  uavoc_expedition: "Виправа"
  uavoc_expedition_desc: "У канцеляріях великих князів, королів та гетьманів слово «виправа» мало значення «офіційне відрядження», «дипломатична місія», «споряджений військовий, розвідувальний, дослідницький похід». У козацькому діловодстві, літописах та тогочасному побуті воно використовувалося дуже активно. Козаки «виправлялися» в походи проти Оманської імперії, Речі Посполитої чи Московії. У цей час слово остаточно закріплює за собою значення «споряджений та організований похід із конкретною метою»."
  uavoc_guild: "Цех"
  uavoc_guild_desc: "Ремісничі гільдії за суттю були спілками, товариствами, братствами (часто з духовним осердям — шануванням окремих святих, Богородиці, покровителя міста, божеств чи духів) утвореними для захисту власних прав та інтересів. В різних країнах вони мали різні назви. Компанії в Англії, метьє у Франції, ґреміо в Іспанії, арті в Італії, цунфти у Німеччині. Слов’яни ж називали ремісничі товариства цехами. Саме слово «гільдія» в ті часи позначало виключно німецькі купецькі спілки."
  uavoc_jewelry: "Узороччя"
  uavoc_jewelry_desc: "В княжу та козацьку доби дорогі, вишукані, статусні прикраси або предмети розкоші називали парасольковим словом «узороччя». Узороччя побутувало як в княжих літописах, так і в козацьких майнових реєстрах, міщанських заповітах. Слово почало виходити з вжитку лише в 18-19ст., витіснене фабричним виробництвом та терміном «ювелірні вироби»."
  uavoc_hosti: "Гості"
  uavoc_hosti_desc: "Гості — це найвища, найбагатша верства купецтва, яка займалася виключно великою міжнародною або міжкнязівською торгівлею. Це були середньовічні магнати та олігархи. Вони володіли величезними коморами, власними озброєними караванами, кораблями та давали великі грошові позики князям чи королям.\n\nСаме тому побутували наступні пов’язані слова та вирази. Гостьба — велика, переважно міжнародна, заморська чи виїзна торгівля. Гостиний двір — великий торговий двір із крамницями та коморами для великих купців. Гостинець — спочатку це була велика міжнародна торгова дорога (шлях), а вже потім — подарунок, який купець привозив із далеких країв."
  uavoc_legitimacy: "Право на владу"
  uavoc_legitimacy_desc: "В деяких європейських країнах це зветься «легітимністю» (англ. «legitimacy»). Слово походить з латини і через французьку мову потрапило да Англії. Первісно означало «законність», «законний» («правочинність», «правочинний»). В ранньомодерну добу закріпилося для позначення законних спадкоємців.\n\nВ сучасному значенні права на владу «легітимність» почали вживати під час Наполеонівських війн."
  uavoc_myto: "Мито"
  uavoc_myto_desc: "У врядуванні в українських краях слово «мито» мало значно ширше за сучасне значення: це була плата за користування інфраструктурою (копальні, річки, млини, міські терези тощо), за право проїзду або за право вести торгівлю в певній місцевості. Мита збиралися не лише на кордонах держав, а й на дорогах, мостах, річкових переправах, при в’їздах до міст, на ринках."
  uavoc_rudnia: "Рудня"
  uavoc_rudnia_desc: "В Україні від княжих часів і до XIX століття залізо виплавляли майже виключно з болотної (лугової) руди, оскільки іншої руди в цих краях просто не було. Рудні з’явилися на Поліссі у XIV ст., прийшовши на зміну колишнім невеличким майстерням з використанням ручних сиродутних горен. Особливістю рудні було водяне колесо, яке через міхи нагнітало повітря у залізоплавильну піч.\n\nРудні мали значне розповсюдження і пам’ять про них залишилася у назвах поселень, як-от Рудня, Руда, Рудники, Димарка, Гамарня. Загалом в українському Поліссі, де була зосереджена українська металургія, налічуються сотні поселень з такими назвами."
  uavoc_osada: "Осада"
  uavoc_osada_desc: "Слово «осада» (від осаджувати, заселяти землю) у XV–XVIII століттях офіційно означало нове, засноване з нуля колоніальне або прикордонне поселення, хутір чи заставу."
  uavoc_pavoloka: "Паволока"
  uavoc_pavoloka_desc: "В княжу добу найцінніші заморські тканини (шовкові, оксамитові, парчеві, які часто були гаптовані золотими чи срібними нитками) називали паволоками. До козацької доби це слово перемістилося до духовно-обрядової сфери і почало позначати церковні завіси та поховальні покривала на труни видатних полководців, гетьманів, вищого духовенства. Вишукане коштовне вбрання в ті часи називали шатами."
  uavoc_slaves: "Невільники"
  uavoc_slaves_desc: "Слова «неволя», «невільники» були головними правовими та побутовими поняттями у Великому Князівстві Литовському, Речі Посполитій та Гетьманщині. Вони зафіксовані в тисячах тогочасних документів, судових актів та козацьких дум. Слово ж «раби» у повсякденному побуті майже не використовувалося. Його вживання обмежувалося переважно церковним та богословським контекстом (наприклад, «раб Божий» у церковних службах), а поетично позначало знедолену людину, часто сироту.\n\nЦерковнослов’янське слово «раб» повністю витіснило народне та юридичне слово «невільник» відносно пізно — наприкінці XVIII та протягом XIX століття. Це не був природний розвиток живої української мови, а наслідок двох потужних чинників: бюрократичної уніфікації Російської імперії та впливу класичної літератури XIX століття.\n\nДля українських письменників доби «невільником» був бранець у турецькому полоні. А для опису знедоленого пригнобленого положення селян вони почали використовувати сильний емоційний і духовний маркер «раб». Тарас Шевченко став головним популяризатором цього слова в сучасному значенні. Поети наступних поколінь (Іван Франко, Леся Українка) підхоплять цей образ."
  uavoc_tannery_desc: "У чинбарні займаються вичинкою шкур та виробляють важливі товари: взуття, сідла, книжкові палітурки й не тільки. $leather$ тварин, оброблена особливим способом, гарно виглядає та довго служить.\n\nЧинбарі «чинили» (дубили у корі) важкі коров’ячі та волячі шкури. Кожум’яки — найдавніший (іще з княжих часів) тип чинбаря — виготовляли сиром’ятну шкіру (сирицю), а саме шкуру великих тварин не дубили у хімічних розчинах, а довго розминали (м’яли) вручну чи за допомогою ремісників-мнців, просочуючи жиром. Вичинкою шкір зі збереженням хутра займалися майстри-кушніри, овечими шкірами — кожухарі. Збрую, сідла, ремені та військове знаряддя виготовляли лимарі та шорники.\n\nНа Західній Україні чинбарні називали гарбарнями, а ремісників — гарбарями. Слово-запозичення з німецької, що прийшло через польську."
  uavoc_tartak: "Тартак"
  uavoc_tartak_desc: "Словом «тартак» (від пол. tartak < trzeć — «терти») або «трачка» (пол. tracz) в первісному значенні називалася спеціальна конструкція з деревини, козла, на яких проводили поздовжнє розпилювання стовбурів на дошки за допомогою довгих дворучних пилок (відома також як «трацький верстат»). У пізніших конструкціях тартак приводився в рух за допомогою водяного млина, через що слово «тартак» стало позначати лісопильний млин. В Україні перші тартаки — водяні млини з’явилися в XV столітті. Так у Нових Стрілиськах тартак був вже у 1429 році."
  uavoc_tatar_overlord: "Татарський цар"
  uavoc_tatar_overlord_desc: "Руські князі зазвичай звертались до великого хана як до «царя», бо в руських звичаях саме слово «цар» позначало вищу владу, над якою більше ніхто не стоїть. В руському уявленні про світ монголи та Орда замінили в цій ролі занепалу Візантію.\n\nСаме через те, що московські князі століттями перебували під золотоординським васалітетом і звикли називати свого господаря «царем», після розпаду Орди вони запозичили цей престижний титул собі. Коли Іван IV Грозний у 1547 році офіційно вінчався на престол як перший російський «цар», в очах сучасників та сусідів (зокрема Кримського ханату) це означало не просто статус монарха, а пряму претензію на спадщину та верховну владу колишніх ординських ханів."
  uavoc_trade_company_as: "В Англії, Нідерландах та Франції такі товариства називали компаніями. (Trading company, joint-stock company, (Dutch) East India Company)."
  uavoc_trade_office_as: "В Європі гостині двори часто називали варіаціями лат. «factorium» (місце угод, ділових людей). Це португальські «фейторії», іспанські, нідерландські та англійські «факторії». Або від лат. «computare» (рахувати) — французькі «комптуари» та німецькі «контори»."
  uavoc_zasoby: "Засоби"
  uavoc_zasoby_desc: "У 16–17 століттях слово «засоби» ще не мало абстрактного значення «інструмент для досягнення мети» чи «ліки». Натомість воно позначало конкретне матеріальне забезпечення, майно або запас, який людина чи держава «має за собою» (резерв). У реєстрах, актових книгах, універсалах гетьманів та актах судів Речі Посполитої і Гетьманщини «засоби» — це виключно гроші і люди, майнові чи матеріальні ресурси, необхідні для виконання певної державної чи військової справи."
  uavoc_znosyny: "Зносини"
  uavoc_znosyny_desc: "Слово «зносини» побутувало вже в староруській канцелярії ВКЛ, а справжній його розквіт як масштабного політичного терміна відбувся за часів Богдана Хмельницького та його наступників. У міжнародних договорах Гетьманщини цей та подібні вирази стали засадничим правовим маркером державного суверенітету. В реєстрах та пізніших списках договорів це формулювалося як «право на закордонні зносини» або «входити у зносини з іноземними володарями». Втратити право на зносини означало втратити суверенітет, незалежність."
