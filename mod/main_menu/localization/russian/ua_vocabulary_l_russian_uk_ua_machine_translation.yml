l_russian:
  uavoc_blahochestia: "Благочестя"
  uavoc_blahochestia_desc: "Благочестя — істинне богошанування, побожне признання божественних істин та їх виконання на ділі. Іншими словами: це безумовне дотримання правил віри, вірність духовним зобов'язанням поєднана з доброю поведінкою. Благочестя є однією з чеснот, високошанованих в церкві, до якої прагне кожен християнин."
  uavoc_hosti: "Гості"
  uavoc_hosti_desc: "Гості — це найвища, найбагатша верства купецтва, яка займалася виключно великою міжнародною або міжкнязівською торгівлею. Це були середньовічні магнати та олігархи. Вони володіли величезними коморами, власними озброєними караванами, кораблями та давали великі грошові позики князям чи королям.\n\nСаме тому побутували наступні пов'язані слова та вирази. Гостьба — велика, переважно міжнародна, заморська чи виїзна торгівля. Гостиний двір — великий торговий двір із крамницями та коморами для великих купців. Гостинець — спочатку це була велика міжнародна торгова дорога (шлях), а вже потім — подарунок, який купець привозив із далеких країв."
  uavoc_legitimacy: "Право на владу"
  uavoc_legitimacy_desc: "В деяких європейських країнах це зветься «легітимністю» (англ. «legitimacy»). Слово походить з латини і через французьку мову потрапило да Англії. Первісно означало «законність», «законний» («правочинність», «правочинний»). В ранньомодерну добу закріпилося для позначення законних спадкоємців.\n\nВ сучасному значенні права на владу «легітимність» почали вживати під час Наполеонівських війн."
  uavoc_myto: "Мито"
  uavoc_myto_desc: "У врядуванні в українських краях слово «мито» мало значно ширше за сучасне значення: це була плата за користування інфраструктурою (копальні, річки, млини, міські терези тощо), за право проїзду або за право вести торгівлю в певній місцевості. Мита збиралися не лише на кордонах держав, а й на дорогах, мостах, річкових переправах, при в'їздах до міст, на ринках."
  uavoc_osada: "Осада"
  uavoc_osada_desc: "Слово «осада» (від осаджувати, заселяти землю) у XV–XVIII століттях офіційно означало нове, засноване з нуля колоніальне або прикордонне поселення, хутір чи заставу."
  uavoc_slaves: "Невільники"
  uavoc_slaves_desc: "Слова «неволя», «невільники» були головними правовими та побутовими поняттями у Великому Князівстві Литовському, Речі Посполитій та Гетьманщині. Вони зафіксовані в тисячах тогочасних документів, судових актів та козацьких дум. Слово ж «раби» у повсякденному побуті майже не використовувалося. Його вживання обмежувалося переважно церковним та богословським контекстом (наприклад, «раб Божий» у церковних службах), а поетично позначало знедолену людину, часто сироту.\n\nЦерковнослов’янське слово «раб» повністю витіснило народне та юридичне слово «невільник» відносно пізно — наприкінці XVIII та протягом XIX століття. Це не був природний розвиток живої української мови, а наслідок двох потужних чинників: бюрократичної уніфікації Російської імперії та впливу класичної літератури XIX століття.\n\nДля українських письменників доби «невільником» був бранець у турецькому полоні. А для опису знедоленого пригнобленого положення селян вони почали використовувати сильний емоційний і духовний маркер «раб». Тарас Шевченко став головним популяризатором цього слова в сучасному значенні. Поети наступних поколінь (Іван Франко, Леся Українка) підхоплять цей образ."
  uavoc_trade_company_as: "В Англії, Нідерландах та Франції такі товариства називали компаніями. (Trading company, joint-stock company, (Dutch) East India Company)."
  uavoc_trade_office_as: "В Європі гостині двори часто називали варіаціями лат. «factorium» (місце угод, ділових людей). Це португальські «фейторії», іспанські, нідерландські та англійські «факторії». Або від лат. «computare» (рахувати) — французькі «комптуари» та німецькі «контори»\n\nІталійське ж «фондако» походить від арабського «фундук», який своєю чергою був запозичений з грецького «pandokeion» (власне, просто гостиниця з коморами — гостиний двір). До цієї ж категорії належать персидські караван-сараї (заїжджі двори для караванів)."
  uavoc_zasoby: "Засоби"
  uavoc_zasoby_desc: "У 16–17 століттях слово «засоби» ще не мало абстрактного значення «інструмент для досягнення мети» чи «ліки». Натомість воно позначало конкретне матеріальне забезпечення, майно або запас, який людина чи держава «має за собою» (резерв). У реєстрах, актових книгах, універсалах гетьманів та актах судів Речі Посполитої і Гетьманщини «засоби» — це виключно гроші і люди, майнові чи матеріальні ресурси, необхідні для виконання певної державної чи військової справи."
  uavoc_znosyny: "Зносини"
  uavoc_znosyny_desc: "Слово «зносини» побутувало вже в староруській канцелярії ВКЛ, а справжній його розквіт як масштабного політичного терміна відбувся за часів Богдана Хмельницького та його наступників. У міжнародних договорах Гетьманщини цей та подібні вирази стали фундаментальним юридичним маркером державного суверенітету. В реєстрах та пізніших списках договорів це формулювалося як «право на закордонні зносини» або «входити у зносини з іноземними володарями». Втратити право на зносини означало втратити суверенітет, незалежність."
